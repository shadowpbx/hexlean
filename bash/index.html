le for random access (`${arr[5]}`) rather than processed one at a time in sequence.\n\nWriting is redirection you already know: `>` to overwrite, `>>` to append (Chapter 5.2).\n\n### Examples\n\n**1. Writing a file.**\n```bash\necho \"hello file\" > myfile.txt\ncat myfile.txt\n```\nOutput:\n```\nhello file\n```\nNothing new here — this is exactly Chapter 5.2's `>` redirection, just framed as \"writing a file\" rather than \"redirecting output.\"\n\n**2. Reading a whole file into a variable.**\n```bash\ncontent=$(cat myfile.txt)\necho \"content: $content\"\n```\nOutput:\n```\ncontent: hello file\n```\nCommand substitution (Chapter 2.8) capturing `cat`'s output — genuinely the standard way to slurp an entire small-to-medium file's content into one variable.\n\n**3. Reading line by line — the standard, correct pattern.**\n```bash\nwhile IFS= read -r line; do\n  echo \"line: $line\"\ndone < lines.txt\n```\nOutput (for a 3-line file):\n```\nline: a\nline: b\nline: c\n```\nExactly Chapter 3.5's pattern, shown again here in its natural home. `IFS=` and `-r` matter for the same reasons covered there: preserving whitespace exactly and not mangling backslashes.\n\n**4. Loading every line into an array at once with `mapfile`.**\n```bash\nmapfile -t arr < lines.txt\necho \"${arr[@]}\"\necho \"count: ${#arr[@]}\"\n```\nOutput:\n```\na b c\ncount: 3\n```\n`mapfile` (also callable as `readarray` — both names refer to the exact same builtin) reads every line into an array in one step. `-t` strips the trailing newline from each line as it's stored (without it, every element would end with an actual newline character baked in, which is rarely what you want). Reach for this over the line-by-line loop when you need to look at lines out of order, count them, or pass the whole set to a function at once.\n\n**5. Checking a file exists before trying to read it.**\n```bash\nif [ -f lines.txt ]; then\n  echo \"file exists, safe to read\"\nfi\nif [ ! -f nope.txt ]; then\n  echo \"nope.txt does not exist\"\nfi\n```\nOutput:\n```\nfile exists, safe to read\nnope.txt does not exist\n```\nExactly Chapter 3.2's `-f` file test — worth using defensively before any read that would otherwise fail with a confusing error if the file simply isn't there.\n\n**6. The trailing-newline edge case — where the naive pattern silently loses data.**\n```bash\nprintf \"line1\\nno newline at end\" > nonewline.txt\nwhile IFS= read -r line; do\n  echo \"got: [$line]\"\ndone < nonewline.txt\n```\nOutput:\n```\ngot: [line1]\n```\nThe second line — `\"no newline at end\"` — never printed at all. Here's why: `read` returns failure (nonzero exit status) on the very last read if the file doesn't end with a newline, *even though it still filled `line` with that final line's content* — and the `while` loop's condition checks `read`'s exit status, so the loop body never runs for that already-populated final value. This is a genuinely common real-world situation (plenty of files, especially ones generated by other tools, don't end with a trailing newline), and it's an easy way to silently lose a file's last line.\n\n**7. The correct, complete idiom that handles this case properly.**\n```bash\nwhile IFS= read -r line || [ -n \"$line\" ]; do\n  echo \"got: [$line]\"\ndone < nonewline.txt\n```\nOutput:\n```\ngot: [no newline at end]\n```\nAdding `|| [ -n \"$line\" ]` to the loop condition says: \"keep going if `read` succeeded, **or** if it failed but still left something non-empty in `line`\" — exactly the situation from Example 6. This is the genuinely correct, complete version of the file-reading loop, and worth using as your real default from here on, rather than the simpler version shown back in Chapter 3.5 (which was deliberately kept simple there, before this edge case had context to explain it).\n\n### ⚠️ Common Mistakes\n\n- **Using the \"simple\" `while IFS= read -r line; do ... done < file` pattern on a file that might lack a trailing newline**, and silently losing the last line. As Example 6 shows, this doesn't error — it just quietly skips data, which is a genuinely dangerous kind of bug to have lurking in a script that processes files it doesn't fully control the origin of. Prefer Example 7's complete version as a default habit.\n- **Reading a huge file entirely into a variable or array** (Examples 2 and 4) when line-by-line processing (Example 3) would do — both approaches hold the entire file's content in memory at once, which is fine for typical config files and logs, but worth reconsidering for anything genuinely huge.\n- **Forgetting `-t` on `mapfile`.** Without it, every array element keeps its trailing newline character attached — comparisons and concatenation involving those elements then behave unexpectedly until you notice the stray newlines.\n- **Not checking a file exists before reading it**, letting a script fail with a generic, unhelpful error partway through rather than a clear, deliberate message up front. `[ -f file ]` (Chapter 3.2) as a guard costs one line and saves real debugging time later.\n\n### How this connects\n\nEverything in this chapter is a direct, practical application of tools already covered — redirection (5.2), `while`/`read` (3.5, 3.7), file tests (3.2), arrays (2.6) — aimed specifically at files. The trailing-newline idiom in Example 7 is exactly the kind of \"embarrassment insurance\" this book has aimed for throughout: a real, common gotcha, shown concretely, fixed correctly, once, so it never needs rediscovering the hard way.\n\n### Quick recap\n\n- Whole file into a variable: `content=$(cat file)`. Line by line: `while IFS= read -r line; do ... done < file`. All lines into an array: `mapfile -t arr < file`.\n- Writing: `>` overwrites, `>>` appends (Chapter 5.2) — no new syntax here.\n- Check `[ -f file ]` before reading, to fail clearly rather than confusingly if it's missing.\n- **The complete, correct line-reading loop:** `while IFS= read -r line || [ -n \"$line\" ]; do ... done < file` — the `|| [ -n \"$line\" ]` handles a file whose last line has no trailing newline, which the simpler version silently drops."}, {"id": "5.6", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "streams, redirection, error handling & I/O", "chapNum": 6, "slug": "error-handling", "fullTitle": "Error Handling: `set -e`, `trap`, and Exit Codes", "title": "Error Handling: `set -e`, `trap`, and Exit Codes", "md": "### Why this matters\n\nEvery script you've written so far has used Bash's default behavior: keep going after a command fails, unless you explicitly check for it. That default is genuinely dangerous for anything beyond a quick throwaway script — a failed `cd` followed by a `rm *` intended for a different folder is the textbook cautionary tale. This chapter covers the settings and tools that make a script fail loudly and safely instead of silently limping forward, plus `trap`, for guaranteeing cleanup happens no matter how a script ends.\n\n### The core idea\n\nThree `set` options, almost always used together, form what's commonly called **\"strict mode\"**:\n- **`set -e`** — exit immediately if any command fails (nonzero exit status), instead of continuing.\n- **`set -u`** — treat any reference to an unset variable as an error, instead of silently substituting an empty string (Chapter 1.3's default behavior).\n- **`set -o pipefail`** — already met in Chapter 5.3 — make a pipeline's exit status reflect *any* failing stage, not just the last one.\n\nCombined as `set -euo pipefail`, near the top of a script, right after the shebang — this is a genuinely common, recommended default for any script beyond the most trivial.\n\n`trap` is a separate, complementary tool: it runs a command (or function) automatically when a script exits, or receives a specific signal — the standard way to guarantee cleanup (removing a temp file, releasing a lock) happens even if the script fails or is interrupted partway through.\n\n### Examples\n\n**1. Without `set -e` — the default, \"keep going\" behavior.**\n```bash\n#!/usr/bin/env bash\nfalse\necho \"this still runs\"\n```\nOutput:\n```\nthis still runs\n```\n`false` failed, and nothing stopped — this is exactly the default behavior every earlier chapter has relied on, worth seeing named explicitly here.\n\n**2. With `set -e` — stop immediately on the first failure.**\n```bash\n#!/usr/bin/env bash\nset -e\nfalse\necho \"this should NOT run\"\n```\nOutput: nothing at all — the script exits the instant `false` fails, before ever reaching the `echo`, with exit status `1`.\n\n**3. `set -u` — catch a reference to an unset variable.**\n```bash\n#!/usr/bin/env bash\nset -u\necho \"$undefined_var\"\n```\nOutput:\n```\n./setu.sh: line 3: undefined_var: unbound variable\n```\nwith exit status `1`. Without `set -u`, this would silently print an empty line (Chapter 1.3's default) — with it, a typo'd variable name becomes a loud, immediate error instead of a quiet, hard-to-trace bug.\n\n**4. The full `set -euo pipefail` combo, together.**\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\necho \"start\"\nfalse | true\necho \"should not reach here due to pipefail+e\"\n```\nOutput:\n```\nstart\n```\nwith exit status `1`. Without `pipefail`, `false | true`'s overall status would be `0` (Chapter 5.3's default), and `set -e` alone wouldn't catch it — `pipefail` is what makes the hidden failure inside the pipeline visible to `-e` at all, which is exactly why the two are almost always used together.\n\n**5. `trap` on `EXIT` — guaranteed cleanup, no matter how the script ends.**\n```bash\n#!/usr/bin/env bash\ncleanup() {\n  echo \"cleaning up\"\n}\ntrap cleanup EXIT\necho \"doing work\"\nexit 3\n```\nOutput:\n```\ndoing work\ncleaning up\n```\nwith exit status `3` (the script's own `exit 3` — `trap`'s cleanup running doesn't change the exit status that was already set). `cleanup` runs automatically the moment the script ends, for **any** reason — a normal finish, an explicit `exit`, or (as the next example shows) an external signal. This is the standard idiom for \"always remove my temp file\" or \"always release my lock,\" regardless of how or where the script actually stops.\n\n**6. `trap` on a specific signal — reacting to an interruption.**\n```bash\n#!/usr/bin/env bash\ntrap 'echo \"caught SIGINT, cleaning up\"; exit 1' INT\necho \"working...\"\nsleep 5\necho \"should not reach here\"\n```\nRun this script and send it an interrupt signal (`Ctrl+C`, or `kill -INT` on its process ID from another terminal) while it's sleeping:\n```\nworking...\ncaught SIGINT, cleaning up\n```\nwith exit status `1`. `INT` is the signal Ctrl+C sends (Chapter 6.5 covers signals fully) — trapping it lets a script react deliberately (print a message, clean something up, then exit) instead of being killed abruptly mid-operation with no chance to finish anything gracefully.\n\n**7. `trap ... ERR` — a hook that fires whenever a command fails, following the exact same rules as `set -e`.**\n```bash\ntrap 'echo \"Error on line $LINENO\"' ERR\necho \"before\"\nfalse\necho \"after (still runs, since set -e is off)\"\n```\nOutput:\n```\nbefore\nError on line 4\nafter (still runs, since set -e is off)\n```\n`ERR` isn't a signal (Chapter 6.5) — it's a special pseudo-event Bash triggers on a failing command, independently of whether `set -e` is also active. Genuinely useful for centralized logging: report *every* failure as it happens, without necessarily stopping the script right there. `$LINENO` (a special variable holding the current line number, already met in Chapter 8.1) makes the message point at exactly where things went wrong.\n\nJust like `set -e`, an `ERR` trap does **not** fire for a command that's part of a condition:\n```bash\nif false; then :; fi\necho \"after if-condition false (no trap)\"\nfalse && echo \"unreachable\"\necho \"after && false (no trap)\"\n```\nOutput:\n```\nafter if-condition false (no trap)\nafter && false (no trap)\n```\nNeither `false` here triggered the trap — exactly the same exceptions Chapter 5.6 already covered for `set -e` itself.\n\n**8. A real stack trace on error — `set -E`, `FUNCNAME`, and `BASH_LINENO` working together.**\n```bash\nset -eE\ntrap 'stack_trace' ERR\n\nstack_trace() {\n  echo \"Stack trace (most recent call first):\"\n  local i\n  for ((i=0; i<${#FUNCNAME[@]}; i++)); do\n    echo \"  at ${FUNCNAME[$i]} (line ${BASH_LINENO[$i]})\"\n  done\n}\n\nlevel_two() { false; }\nlevel_one() { level_two; }\nlevel_one\necho \"this never runs\"\n```\nOutput:\n```\nStack trace (most recent call first):\n  at stack_trace (line 12)\n  at level_two (line 13)\n  at level_one (line 14)\n  at main (line 0)\n```\n`FUNCNAME` is a special array holding the current call stack (Chapter 2.6's array syntax, put to genuinely professional use) — `FUNCNAME[0]` is the currently-running function, `[1]` is whoever called it, and so on up to `main`. `BASH_LINENO` holds the matching line number for each of those calls. **This combination needs both flags to work correctly, and the reason is worth understanding precisely:** `set -E` (`errtrace`) is what makes the `ERR` trap propagate correctly into nested function calls in the first place — without it, the trap still fires, but `FUNCNAME`/`BASH_LINENO` inside the handler collapse to just `stack_trace` and `main`, losing every frame in between, which defeats the entire purpose of a stack trace. `set -e` alongside it is equally necessary here for a different reason: without it, the script keeps running after the trace prints, and — since each function's own exit status is now `1` (inherited from the failing `false` inside it) — the `ERR` trap fires *again* at every level as that failure propagates back up the call stack, producing two more redundant, increasingly incomplete traces. `set -eE` together give you exactly one, fully accurate trace, then a clean exit.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `set -e` catches everything.** It has real, well-known exceptions — a command's failure inside an `if`/`while` condition, inside `&&`/`||`, or as anything but the last command in a pipeline (without `pipefail`) does **not** trigger `-e`. This is precisely why `pipefail` is paired with it, and why checking `$?` explicitly still matters in places `-e`'s coverage doesn't reach.\n- **Turning on `set -euo pipefail` on an existing, untested script and expecting it to \"just work.\"** It very often surfaces real, previously-hidden bugs (an unset variable that was silently working as empty, a pipeline whose first stage quietly failed) — which is the whole point, but it means adopting strict mode on existing code deserves careful testing, not a blind flip of the switch right before deploying.\n- **Forgetting `trap ... EXIT` runs even on a normal, successful exit**, not just on errors — if cleanup logic should only run in the failure case specifically, check something inside the trap function (like a flag variable) rather than assuming the trap firing means something went wrong.\n- **Defining a `trap` too late in the script**, after the exact operation it was meant to guard against failing has already run. `trap` needs to be set up *before* the risky operation it's protecting, not after.\n- **Overwriting an earlier `trap` on the same signal without realizing it.** Like function redefinition (Chapter 4.1), a later `trap ... EXIT` completely replaces an earlier one on the same signal — there's no automatic stacking of multiple cleanup actions unless you deliberately write one trap function that calls all of them.\n- **Using `trap ... ERR` without `set -E` and expecting an accurate stack trace from inside a function.** As Example 8 demonstrates, the trap still fires, but `FUNCNAME`/`BASH_LINENO` silently lose every intermediate call frame without `errtrace` enabled — a stack trace that's technically produced but quietly wrong is arguably worse than no stack trace at all.\n- **Adding `trap ... ERR` with `set -E` but without `set -e`, on a script with nested function calls.** As Example 8's explanation covers, this produces the *same* trace repeated multiple times, once for each level the failure propagates through — genuinely confusing output. Pair `set -E` with `set -e` (or the combined `set -eE`) specifically when building an error-reporting trap like this.\n\n### How this connects\n\nThis chapter completes the \"make a script trustworthy\" toolkit that Chapter 1.5's `$?`, Chapter 3.1's `if`, and Chapter 5.3's `PIPESTATUS`/`pipefail` have been building toward — `set -euo pipefail` is the concrete, standard recommendation this whole thread has been leading to. `trap` becomes essential again in Chapter 6.4/6.5's fuller treatment of jobs and signals, and Chapter 8.5 (Writing Robust, Re-runnable Scripts) builds directly on both `set` options and `trap` as core building blocks.\n\n### Quick recap\n\n- `set -e` — exit immediately on any command failure (with real exceptions: conditions, `&&`/`||`, non-last pipeline stages without `pipefail`).\n- `set -u` — treat unset variable references as errors instead of silently substituting empty strings.\n- `set -o pipefail` — make a pipeline's exit status reflect any failing stage, not just the last.\n- `set -euo pipefail` near the top of a script (after the shebang) is a solid, commonly recommended default for anything beyond a trivial script.\n- `trap 'commands' EXIT` runs cleanup no matter how a script ends; `trap 'commands' SIGNAL` (e.g. `INT`) reacts to a specific signal — set traps up *before* the code they're meant to protect.\n- `trap 'commands' ERR` fires on any failing command, following `set -e`'s own exceptions (skips conditions, `&&`/`||`); combine with `set -eE` for a genuinely accurate, single-fire stack trace using `FUNCNAME`/`BASH_LINENO`."}, {"id": "5.7", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "streams, redirection, error handling & I/O", "chapNum": 7, "slug": "command-line-arguments-to-scripts", "fullTitle": "Command-Line Arguments to Scripts (`getopts`)", "title": "Command-Line Arguments to Scripts (`getopts`)", "md": "### Why this matters\n\nChapter 2.9 introduced `$1`, `$2`, `$#` for a script's raw arguments — fine for a couple of positional values, but real command-line tools take **flags** too (`-v` for verbose, `-n name` to name something), often in any order, sometimes combined. Manually parsing that with `if`/`case` on `$1` gets unwieldy fast. `getopts` is Bash's built-in tool for parsing exactly this style of argument, properly, and it's what every polished-feeling command-line script in this book (and in the real world) actually uses.\n\n### The core idea\n\n```bash\nwhile getopts \"vn:h\" opt; do\n  case \"$opt\" in\n    v) ... ;;\n    n) # $OPTARG holds the value after -n\n       ;;\n    h) ... ;;\n    \\?) # unrecognized option\n       ;;\n  esac\ndone\n```\nThe **option string** (`\"vn:h\"`) lists every flag `getopts` should recognize: a plain letter (`v`, `h`) means a flag with no value; a letter followed by a colon (`n:`) means that flag *requires* a value, automatically placed in `$OPTARG`. `getopts` is called repeatedly inside a `while` loop — each call processes the next option from the actual command line and sets `$opt` to what it found, until there are no more options left to process.\n\n### Examples\n\n**1. A refresher: plain positional arguments (Chapter 2.9), no flags at all.**\n```bash\necho \"arg1=$1 arg2=$2 count=$#\"\n```\nRunning `./basicargs.sh foo bar`:\n```\narg1=foo arg2=bar count=2\n```\nFine for a script that only ever needs a fixed, ordered set of values — `getopts` becomes worthwhile the moment you want named, optional, any-order flags instead.\n\n**2. A real `getopts` loop — flags with and without values.**\n```bash\nverbose=0\nname=\"\"\nwhile getopts \"vn:h\" opt; do\n  case \"$opt\" in\n    v) verbose=1 ;;\n    n) name=\"$OPTARG\" ;;\n    h) echo \"Usage: $0 [-v] [-n name]\"; exit 0 ;;\n    \\?) echo \"Invalid option: -$OPTARG\" >&2; exit 1 ;;\n  esac\ndone\necho \"verbose=$verbose name=$name\"\n```\nRunning `./getopts_test.sh -v -n Alex`:\n```\nverbose=1 name=Alex\n```\n`-v` set `opt` to `v` (no value needed); `-n Alex` set `opt` to `n` and put `Alex` into `$OPTARG`, which the `case` branch then saved into `name`.\n\n**3. `getopts` also understands combined short flags.**\n```bash\n./getopts_test.sh -vn Alex\n```\nOutput — identical:\n```\nverbose=1 name=Alex\n```\n`-vn Alex` is understood exactly like `-v -n Alex` — `getopts` recognizes the standard Unix convention of bundling single-letter flags together, with the last one in the bundle allowed to take the following argument as its value if it needs one.\n\n**4. A `-h` (help) flag, and exiting early.**\n```bash\n./getopts_test.sh -h\n```\nOutput:\n```\nUsage: ./getopts_test.sh [-v] [-n name]\n```\n`$0` (Chapter 2.9) naturally gives the script's own invoked name for the usage message — a genuinely standard, polished touch for any script meant to be used by someone other than its author.\n\n**5. An unrecognized flag — the default, \"loud\" behavior.**\n```bash\n./getopts_test.sh -z\n```\nOutput:\n```\n./getopts_test.sh: illegal option -- z\nInvalid option: -\n```\nwith exit status `1`. Two messages appear: `getopts` itself prints its own built-in error to stderr, *and* the script's own `\\?)` branch ran too. Notice `$OPTARG` came out empty in the `\\?)` branch here — that's expected in this (\"verbose\") error-reporting mode; the next example shows how to get the actual invalid character into `$OPTARG` instead.\n\n**6. A leading `:` in the option string switches to \"silent\" mode — better error messages, no double-reporting.**\n```bash\nwhile getopts \":vn:h\" opt; do\n  case \"$opt\" in\n    v) echo \"verbose\" ;;\n    n) echo \"name=$OPTARG\" ;;\n    h) echo \"help\" ;;\n    \\?) echo \"Invalid option: -$OPTARG\" >&2 ;;\n    :) echo \"Option -$OPTARG requires an argument\" >&2 ;;\n  esac\ndone\n```\nAn unrecognized flag now gives:\n```\nInvalid option: -z\n```\nand a flag that's missing its required value gives:\n```\nOption -n requires an argument\n```\nWith the leading `:`, `getopts` suppresses its own built-in error messages and instead sets `$opt` to `?` (unrecognized flag) or `:` (a value-requiring flag given with no value) — both with `$OPTARG` correctly holding the problem character — letting the script produce its own clean, consistent error messages instead of `getopts`'s more generic default ones. **This leading-colon form is the recommended default** for any script meant to feel polished.\n\n**7. `OPTIND` and getting to the *remaining* (non-flag) arguments afterward.**\n```bash\nwhile getopts \"v\" opt; do\n  case \"$opt\" in\n    v) echo \"verbose on\" ;;\n  esac\ndone\nshift $((OPTIND - 1))\necho \"remaining args: $@\"\n```\nRunning `./optind_test.sh -v file1.txt file2.txt`:\n```\nverbose on\nremaining args: file1.txt file2.txt\n```\n`OPTIND` is a variable `getopts` maintains automatically, tracking how many arguments it has consumed processing flags. `shift $((OPTIND - 1))` (using the arithmetic and `shift` from Chapters 2.4 and 4.2) discards exactly the flag arguments already handled, leaving `$@` holding only what's left — typically filenames or other non-flag values the script still needs to act on. This is the standard way to combine `getopts`-parsed flags with ordinary positional arguments in the same script.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the colon after an option letter that requires a value.** `\"vn:h\"` vs. `\"vnh\"` — without the colon, `getopts` treats `-n` as a plain flag with no value, and whatever follows it on the command line is left as a separate positional argument instead of landing in `$OPTARG`.\n- **Forgetting the leading `:` for clean custom error handling.** Without it (Example 5), `getopts` prints its own message *and* your `\\?)` branch still runs, often producing a redundant or oddly-worded combination. With it (Example 6), you get full, clean control over every error message.\n- **Forgetting `shift $((OPTIND - 1))`** when a script needs both flags and positional arguments — without it, `$1` after the `getopts` loop still refers to the very first original argument (likely a flag), not the first genuine positional value the script actually needs.\n- **Assuming `getopts` supports long options** (`--verbose`, `--name=Alex`) out of the box. It doesn't — `getopts` is specifically for short, single-letter Unix-style flags. Long-option support requires either a manual parsing loop or `getopt` (a separate, older, less portable external program, easily confused with `getopts` by name) — genuinely useful to know exists, but out of this book's scope.\n- **Calling `getopts` more than once in the same script without resetting `OPTIND`.** If a script genuinely needs to run `getopts` a second time on the same or different arguments, `OPTIND` needs to be manually reset to `1` first — otherwise the second run picks up wherever the first one left off, which is rarely the intent.\n\n### How this connects\n\n`getopts` builds directly on the positional-parameter foundation from Chapter 2.9 and the `shift`/`$#` mechanics from Chapter 4.2's function arguments, applied specifically to the \"parse command-line flags properly\" problem. This chapter closes out Part V — Paragraphs, which has been about combining sentences and grammar into coherent, complete units: streams, redirection, pipes, files, error handling, and now proper argument parsing. Part VI, next, zooms out further — structuring a script's relationship with its environment and other processes.\n\n### Quick recap\n\n- `getopts \"optstring\" opt` inside a `while` loop parses short-style flags one at a time; a colon after a letter in the option string means that flag requires a value, delivered via `$OPTARG`.\n- A **leading colon** in the option string (`\":vn:h\"`) switches to silent mode — your script gets full control over error messages via the `\\?` (unknown flag) and `:` (missing value) cases, instead of `getopts`'s built-in messages.\n- `getopts` understands bundled short flags (`-vn value`) automatically.\n- `OPTIND` tracks how many arguments `getopts` has consumed — `shift $((OPTIND - 1))` after the loop leaves `$@` holding only the remaining, non-flag arguments.\n- `getopts` handles short flags only — long options (`--verbose`) need a different approach entirely, out of this book's scope."}, {"id": "6.1", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "processes, jobs, subshells & environment", "chapNum": 1, "slug": "environment-variables-export", "fullTitle": "Environment Variables & `export`", "title": "Environment Variables & `export`", "md": "### Why this matters\n\nEvery variable you've created so far has been visible only within the script that created it — call another script from inside yours, and by default it sees none of your variables at all. `export` is how you deliberately share a variable with programs your script launches. This is also your first real look at how separate processes relate to each other — a subject Part VI is built around.\n\n### The core idea\n\nAn ordinary Bash variable lives only in the current shell. An **environment variable** is a variable marked for inheritance — when your script launches another program (a child process), that child gets its own copy of every environment variable your script had at that moment. `export varname` is how you promote an ordinary variable into an environment variable. Crucially: this inheritance flows **one way, downward, and only at the moment the child starts** — a child process changing an exported variable's value has zero effect on the parent that launched it, since the child got its own independent copy.\n\n### Examples\n\n**1. An ordinary variable is invisible to a child script, by default.**\n```bash\n# parent.sh\nMYVAR=\"hello\"\n./child.sh\n```\n```bash\n# child.sh\necho \"child sees MYVAR: [${MYVAR}]\"\n```\nRunning `parent.sh`:\n```\nchild sees MYVAR: []\n```\n`MYVAR` never crossed the boundary into `child.sh` at all — as far as `child.sh` is concerned, `MYVAR` was simply never set (Chapter 1.3's unset-variable behavior).\n\n**2. `export` at assignment time makes it visible.**\n```bash\nexport MYVAR=\"hello\"\n./child.sh\n```\nOutput:\n```\nchild sees MYVAR: [hello]\n```\nSame `child.sh`, unchanged — the only difference is `export` on the parent's assignment. `export` and assignment can happen together in one line, exactly like `declare` (Chapter 2.5).\n\n**3. `export` on an already-existing variable — the two-step form.**\n```bash\nMYVAR=\"world\"\nexport MYVAR\necho \"child sees:\"\n./child.sh\n```\nOutput:\n```\nchild sees MYVAR: [world]\n```\n`export MYVAR` (no `=value`) marks an already-assigned variable for export without changing its value — useful when a variable was set earlier and you decide afterward that child processes should see it too.\n\n**4. `env` — listing the current environment variables.**\n```bash\nexport TESTVAR123=\"check\"\nenv | grep TESTVAR123\n```\nOutput:\n```\nTESTVAR123=check\n```\n`env` (also usable as a standalone command to run something with a modified environment) prints every currently exported variable — genuinely useful for confirming what a script's children will actually inherit.\n\n**5. Common built-in environment variables you'll use constantly.**\n```bash\necho \"HOME=$HOME\"\necho \"PATH first 40 chars: ${PATH:0:40}\"\necho \"USER=$USER\"\n```\nOutput (values will differ by system):\n```\nHOME=/home/shad\nPATH first 40 chars: /home/shad/.grok/bin:/home/shad/.local/b\nUSER=shad\n```\n`HOME` (your home directory), `PATH` (the list of folders Bash searches for commands — this is precisely why `./script.sh` from Chapter 1.1 needed the explicit `./`, since the current folder normally isn't on `PATH`), and `USER` (your username) are all environment variables set up automatically by the system before your script ever runs — inherited from whatever launched your shell in the first place.\n\n**6. A child changing an exported variable never affects the parent.**\n```bash\nexport MYVAR=\"original\"\n./child_modify.sh   # sets MYVAR=\"changed by child\" internally\necho \"parent still sees: $MYVAR\"\n```\nOutput:\n```\nparent still sees: original\n```\nThis confirms the \"one-way, snapshot-at-launch\" model precisely: `child_modify.sh` received its own independent copy of `MYVAR`, changed *that* copy, and the parent's own `MYVAR` was never touched. There is no way for a child process to change a variable back in its parent — processes simply don't work that way.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a variable is automatically visible to a script you call from within another script.** As Example 1 shows, it isn't — `export` is required, and it's an easy thing to forget when splitting a growing script into multiple files (a preview of Chapter 6.7).\n- **Expecting a child process's changes to an exported variable to somehow \"come back\" to the parent.** As Example 6 demonstrates, this fundamentally cannot happen — each process's environment is its own independent copy from the moment it starts. If a child process needs to communicate a result back to its parent, that has to happen through some other explicit mechanism (its own exit status, its printed output captured with `$(...)`, or writing to a shared file) — not through a shared variable.\n- **Confusing \"exported\" with \"global.\"** Every exported variable is also an ordinary (global, in the Chapter 4.4 sense) variable within the current script — but not every global variable is exported. `export` is specifically about the *child-process* boundary; ordinary global-vs-local scoping (Chapter 4.4) is entirely about functions within the *same* running script.\n- **Modifying `PATH` carelessly.** `PATH` is itself just an exported environment variable — but overwriting it entirely (`PATH=\"/some/dir\"` instead of appending, e.g. `PATH=\"$PATH:/some/dir\"`) can suddenly make ordinary commands like `ls` or `cd`-adjacent tools \"disappear\" for the rest of the script, since Bash can no longer find them anywhere.\n- **Forgetting that a subshell (Chapter 6.3) — unlike a genuinely separate child *script* — already shares the parent's entire environment automatically**, exported or not, because it's a copy of the same shell, not a distinct program being launched fresh. `export` specifically matters for crossing into a **different program's** process, not for subshells within the same script.\n\n### How this connects\n\nThis chapter is your first real look at the process boundary that Part VI is centered on — everything from here through Chapter 6.7 deals with some aspect of how your script relates to other running processes: sourcing another script into the *same* process (6.2, no `export` needed at all, since there's no boundary crossed), subshells (6.3), background jobs (6.4), signals (6.5), and process management (6.6) all build on the parent/child model introduced here.\n\n### Quick recap\n\n- Ordinary variables are invisible to any program a script launches, by default.\n- `export varname` (or `export varname=value`) marks a variable for inheritance by child processes.\n- Environment inheritance flows one way, downward, as a snapshot taken when the child starts — a child's changes never propagate back to its parent.\n- `HOME`, `PATH`, `USER` are common environment variables set up automatically by the system.\n- `export` matters for launching a separate program; it's irrelevant for subshells, which already share everything."}, {"id": "6.2", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "processes, jobs, subshells & environment", "chapNum": 2, "slug": "sourcing-scripts", "fullTitle": "Sourcing Scripts", "title": "Sourcing Scripts", "md": "### Why this matters\n\nChapter 6.1 showed that running one script from another (`./child.sh`) creates a completely separate process — variables and functions don't cross that boundary without `export`, and even then, only variables, not functions. **Sourcing** is a genuinely different way to bring one script's content into another: instead of launching it as a separate process, Bash reads and runs it directly inside the *current* shell, as if you'd typed its contents yourself. This is how real scripts share reusable functions and configuration across multiple files.\n\n### The core idea\n\n```bash\nsource ./lib.sh\n```\nor, equivalently, using the older, more universally portable **dot operator**:\n```bash\n. ./lib.sh\n```\nBoth do exactly the same thing: read `lib.sh`'s content and execute it line by line, in the current shell — no new process, no export needed, everything defined in `lib.sh` (variables, functions) becomes immediately available, exactly as if it had been typed directly into the calling script.\n\n### Examples\n\n**1. Running a script normally — the Chapter 6.1 baseline, showing what *doesn't* cross over.**\n```bash\n# lib.sh\nLIBVAR=\"from lib\"\ngreet() { echo \"Hello from lib\"; }\n```\n```bash\n# run_normally.sh\n./lib.sh\necho \"LIBVAR after normal run: [${LIBVAR}]\"\ngreet\n```\nOutput:\n```\nLIBVAR after normal run: []\n./run_normally.sh: line 4: greet: command not found\n```\nRunning `lib.sh` as a separate script (`./lib.sh`) launched a new process that defined `LIBVAR` and `greet` — and then exited, taking both with it. Neither ever touched `run_normally.sh`'s own shell at all. (Note this is even more restrictive than Chapter 6.1's `export` example — functions can't be exported to a child process the way simple variables can, only ever shared by sourcing.)\n\n**2. The same `lib.sh`, sourced instead — everything becomes available.**\n```bash\nsource ./lib.sh\necho \"LIBVAR after sourcing: [${LIBVAR}]\"\ngreet\n```\nOutput:\n```\nLIBVAR after sourcing: [from lib]\nHello from lib\n```\nBoth the variable *and* the function are now available, directly, in the calling script — because `lib.sh`'s content ran inside the same shell, not a separate one.\n\n**3. The dot operator — identical behavior, more portable syntax.**\n```bash\n. ./lib.sh\necho \"LIBVAR via dot: [${LIBVAR}]\"\n```\nOutput:\n```\nLIBVAR via dot: [from lib]\n```\n`.` is the original, POSIX-standard form, available in every shell; `source` is a Bash-specific (and a few other shells') alias for the same thing, generally considered more readable. Both are completely equivalent — this book uses `source` for clarity, but you'll see `.` constantly in real-world and older scripts.\n\n**4. `return` inside a sourced script stops just the sourced file, not the calling script.**\n```bash\n# lib_with_return.sh\necho \"lib starting\"\nreturn 0\necho \"never reached in lib\"\n```\n```bash\n# run_return.sh\nsource ./lib_with_return.sh\necho \"back in main script\"\n```\nOutput:\n```\nlib starting\nback in main script\n```\nThis is precisely why Chapter 4.3 mentioned `return` works \"inside a function *or a sourced script*\" — a sourced file behaves, for this purpose, almost like an implicit function body: `return` cleanly stops processing *that file* and hands control back to whatever sourced it, without ending the whole shell. This is a genuinely useful way for a sourced configuration or library file to bail out early (say, if a precondition isn't met) without disrupting the script that sourced it.\n\n**5. Detecting whether a file is being sourced or run directly.**\n```bash\nif [[ \"${BASH_SOURCE[0]}\" == \"${0}\" ]]; then\n  echo \"run directly\"\nelse\n  echo \"sourced\"\nfi\n```\nRun directly (`./file.sh`):\n```\nrun directly\n```\nSourced (`source ./file.sh`):\n```\nsourced\n```\nAs Chapter 6.7 covers in full shortly, `${BASH_SOURCE[0]}` always reflects the *currently executing file's own* path, while `$0` reflects whatever was *originally invoked* — when a file is run directly, those two are the same thing; when it's sourced into another script, they differ. This comparison is a genuinely common, practical idiom for a file meant to work *both* ways — as a standalone script when run directly, and as a library of functions when sourced — letting it decide at the bottom whether to actually call its own `main` function or just make its functions available and stay quiet.\n\n### ⚠️ Common Mistakes\n\n- **Using `./file.sh` when `source ./file.sh` (or `. ./file.sh`) was actually needed.** This is far and away the most common mistake here — the two look superficially similar but behave completely differently (separate process vs. same shell), and the symptom of getting it wrong is exactly Example 1's confusing \"command not found\" or empty-variable result.\n- **Sourcing a file that itself calls `exit`.** Since a sourced file runs in the *current* shell, an `exit` inside it ends the **entire calling script** too, not just the sourced portion — very different from `return`'s more contained behavior in Example 4. A library file meant to be sourced should generally use `return` to signal \"I'm done\" or \"something's wrong here,\" reserving `exit` for genuine, deliberate termination of the whole program.\n- **Forgetting the path needs to actually resolve correctly relative to the calling script's current location.** `source lib.sh` (no `./` or full path) relies on `lib.sh` being found via `PATH` or the current working directory in a way that isn't always guaranteed — a more robust pattern (Chapter 6.7 covers this properly for larger, multi-file scripts) figures out the script's own directory explicitly and sources relative to that.\n- **Assuming sourcing is somehow slower or \"heavier\" than running a separate script.** It's actually the opposite — sourcing avoids the overhead of starting an entirely new process, which is one more reason (beyond variable/function sharing) it's the standard choice for splitting a large script into logical, reusable pieces.\n\n### How this connects\n\nSourcing is the direct answer to the limitation Chapter 6.1 established — it's how you actually share functions (which `export` can't do) and configuration between files in the same running script. This becomes essential the moment Chapter 6.7 covers organizing a larger project across multiple files, and it's the mechanism that makes a genuinely reusable \"library\" of Bash functions possible at all.\n\n### Quick recap\n\n- `source file.sh` (or `. file.sh`, identical, more portable) runs a file's content directly inside the *current* shell — no new process, full sharing of variables and functions.\n- Running a script normally (`./file.sh`) creates a separate process — nothing (not even functions, unlike simple exported variables) crosses back automatically.\n- `return` inside a sourced file stops just that file, handing control back; `exit` inside a sourced file ends the *entire* calling script.\n- Sourcing is the standard way to build a reusable library of functions shared across multiple scripts.\n- `[[ \"${BASH_SOURCE[0]}\" == \"${0}\" ]]` detects whether a file is being run directly or sourced — useful for a file meant to work as both a standalone script and a sourced library."}, {"id": "6.3", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "processes, jobs, subshells & environment", "chapNum": 3, "slug": "subshells-process-substitution", "fullTitle": "Subshells & Process Substitution", "title": "Subshells & Process Substitution", "md": "### Why this matters\n\nTwo tools that have been used, unnamed, several times already — the `(...)` in Chapter 5.3's pipeline explanation, and the `<(...)` that fixed Chapter 3.5's classic `while read` bug — get their proper, full explanation here. Understanding subshells precisely also finally closes the loop on exactly *why* piping into `while read` loses variables, a question this book has flagged twice now without fully resolving until this chapter.\n\n### The core idea\n\nA **subshell** is a separate copy of the current shell, created with `(...)` (parentheses) — it inherits everything from the parent shell (variables, functions, the current directory) at the moment it starts, but anything it changes stays local to that copy and disappears once it finishes. Pipelines (Chapter 5.3), command substitution (Chapter 2.8), and background jobs (Chapter 6.4, next) all implicitly use subshells too — `(...)` is just the explicit, deliberate way to create one yourself.\n\n**Process substitution** — `<(command)` and `>(command)` — is a related but different tool: it makes a command's *output* (or input) appear as if it were a regular file, which is enormously useful for commands that only know how to work with filenames, not pipes.\n\n### Examples\n\n**1. A subshell's changes don't escape it.**\n```bash\nx=10\n(x=20; echo \"inside subshell: $x\")\necho \"outside subshell: $x\"\n```\nOutput:\n```\ninside subshell: 20\noutside subshell: 10\n```\nInside the parentheses, `x` really was changed to `20` — but that change lived only in the subshell's own copy. The moment the subshell finished, that copy vanished, and the original shell's `x` was completely untouched.\n\n**2. A subshell inherits the parent's variables at the moment it starts.**\n```bash\ny=\"parent value\"\n(echo \"subshell sees: $y\")\n```\nOutput:\n```\nsubshell sees: parent value\n```\nInheritance flows into a subshell automatically — no `export` needed (unlike Chapter 6.1's genuinely separate child *processes*), because a subshell is a copy of the *same* shell, not a distinct program being launched fresh.\n\n**3. A classic practical use: `cd` inside a subshell, without affecting your actual location.**\n```bash\necho \"before: $(pwd)\"\n(cd /tmp && echo \"inside subshell: $(pwd)\")\necho \"after: $(pwd)\"\n```\nOutput:\n```\nbefore: /home/you/somewhere\ninside subshell: /tmp\nafter: /home/you/somewhere\n```\nThe `cd` only ever affected the subshell's own notion of \"current directory\" — once the subshell finished, the parent script's actual location was exactly where it started. This is a genuinely useful, common idiom: \"temporarily go somewhere else and do something, without permanently changing where I am.\"\n\n**4. This is exactly the mechanism behind Chapter 3.5's `while read` pipe bug — now fully explained.**\nChapter 5.3 mentioned pipelines run each stage in its own subshell; Chapter 3.5 showed a `total` variable set inside a `while read` loop vanishing when the loop was fed via a pipe. Now you know precisely why: the pipe put the entire `while` loop inside a subshell, exactly like Example 1's `(x=20; ...)` — any variable it touched was a private copy, discarded the instant the subshell (and the pipeline) finished.\n\n**5. Process substitution — `<(command)`, making a command's output look like a file.**\n```bash\ndiff <(echo \"a\") <(echo \"b\")\n```\nOutput:\n```\n1c1\n< a\n---\n> b\n```\n`diff` (a tool for comparing files) normally expects two *filenames* as arguments — it has no idea how to compare \"the output of two commands\" directly. `<(echo \"a\")` and `<(echo \"b\")` each produce something that *looks like a file path* to `diff`, backed by that command's actual output, letting you compare two commands' output without ever creating a real temporary file yourself.\n\n**6. Process substitution can feed multiple streams into one command at once.**\n```bash\npaste <(echo -e \"1\\n2\\n3\") <(echo -e \"a\\nb\\nc\")\n```\nOutput:\n```\n1\ta\n2\tb\n3\tc\n```\n`paste` combines corresponding lines from multiple sources side by side — here, both sources are process substitutions rather than real files, demonstrating the same trick as Example 5 in a genuinely different, practical context.\n\n**7. `>(command)` — the output direction, less common but real.**\n```bash\necho \"hello\" > >(cat)\n```\nOutput:\n```\nhello\n```\nThis redirects `echo`'s output *into* the process substitution rather than out of it — `cat` here just echoes it straight back, but in real use this pattern lets you pipe a command's output into something that expects a filename to *write to*, rather than read from.\n\n**8. What's actually happening under the hood: `<(...)` really is a file path.**\n```bash\necho <(echo test)\n```\nOutput:\n```\n/dev/fd/63\n```\nThis confirms exactly what's going on — `<(command)` genuinely does hand back a real filesystem path (on Linux, typically something under `/dev/fd/`), connected to that command's output behind the scenes. This is why it can be used absolutely anywhere a real filename is expected.\n\n### ⚠️ Common Mistakes\n\n- **Expecting variables set inside `(...)` to survive outside it.** This is the entire point of a subshell (Example 1), and forgetting it is exactly the mistake behind Chapter 3.5's pipe bug — any time you need a variable's change to persist, make sure the code setting it isn't accidentally running inside a subshell (a pipeline stage, a background job, or explicit parentheses).\n- **Reaching for a real temporary file when process substitution would do the same job more simply.** `diff <(cmd1) <(cmd2)` avoids the ceremony of creating, using, and cleaning up two temp files just to compare two commands' output — genuinely worth reaching for whenever a tool insists on filenames but your data is really just another command's output.\n- **Assuming `<()`/`>()` are portable to every shell.** They're a Bash extension (also present in a few other modern shells, like zsh) — a script starting with a strictly POSIX `#!/bin/sh` shebang cannot rely on them being available. Since this book's scripts always use `#!/usr/bin/env bash` (Chapter 1.1), this isn't a practical concern for anything written here.\n- **Forgetting a subshell has its own exit status, separately trackable.** `(commands); echo $?` checks the subshell's overall exit status (its last command's status, exactly like Chapter 1.5's rules) — genuinely useful for grouping several commands and checking their combined outcome as one unit.\n- **Confusing `(...)` (a subshell) with `{ ...; }` (a group of commands run in the *current* shell, no subshell at all).** They look superficially similar but behave very differently — `{ x=20; }` (note: requires spaces after `{` and a `;` or newline before `}`) *does* change the outer `x`, unlike `(x=20)`. Reach for `{ }` specifically when you want grouping without the subshell isolation.\n\n### How this connects\n\nThis chapter finally names and fully explains the mechanism behind two gotchas flagged earlier without full detail — Chapter 3.5's pipe-into-`while-read` bug and Chapter 5.3's pipeline-subshell note. Process substitution becomes a genuinely useful everyday tool once Part VII's toolbox chapters (especially `diff`-adjacent workflows and combining multiple command outputs) are in regular use. Chapter 6.4, next, covers background jobs — another context, alongside pipelines, where subshells appear implicitly.\n\n### Quick recap\n\n- `(...)` creates a subshell: a separate copy of the shell that inherits everything but can't change anything back in the parent — this is exactly why piping into `while read` loses variables.\n- `{ commands; }` groups commands *without* subshell isolation — changes inside do persist in the current shell, unlike `(...)`.\n- `<(command)` makes a command's output appear as a real file path — genuinely useful for tools (like `diff`, `paste`) that only accept filenames, not pipes.\n- `>(command)` does the same in the output direction — redirecting into a process substitution rather than reading from one.\n- Under the hood, process substitution really does create a real file-descriptor path (like `/dev/fd/63`) — this is why it can be used anywhere a filename is expected."}, {"id": "6.4", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "processes, jobs, subshells & environment", "chapNum": 4, "slug": "background-jobs-job-control", "fullTitle": "Background Jobs & Job Control", "title": "Background Jobs & Job Control", "md": "### Why this matters\n\nEvery command so far has run to completion before the next line executes — natural for most scripting, but sometimes genuinely limiting: what if a script needs to kick off several slow, independent tasks and let them run *simultaneously*, only waiting for all of them once they're all underway? `&` and its companion tools (`jobs`, `wait`) are Bash's answer, and they're also where `$!` (Chapter 2.9) finally gets its full, proper use.\n\n### The core idea\n\nAppending `&` to a command runs it **in the background** — Bash starts it, immediately moves on to the next line without waiting, and the backgrounded command keeps running concurrently. `jobs` lists what's currently running in the background; `wait` pauses the script until background jobs finish (either all of them, or one specific one by PID).\n\n### Examples\n\n**1. A basic background job.**\n```bash\nsleep 1 &\necho \"started bg job, PID: $!\"\njobs\nwait\necho \"job finished\"\n```\nOutput:\n```\nstarted bg job, PID: 104187\n[1]+  Running                 sleep 1 &\njob finished\n```\nThe `echo` ran *immediately*, without waiting for `sleep 1` to finish — `&` handed control straight back. `$!` (Chapter 2.9, finally shown in its natural context) captured the background job's PID right away. `jobs` shows it still running; `wait` (with no arguments) blocks until *every* background job has finished, and only then does `\"job finished\"` print.\n\n**2. Multiple background jobs running concurrently.**\n```bash\nsleep 0.3 &\nsleep 0.3 &\njobs\nwait\necho \"all done\"\n```\nOutput:\n```\n[1]-  Running                 sleep 0.3 &\n[2]+  Running                 sleep 0.3 &\nall done\n```\nBoth `sleep` commands started essentially at the same time, running in parallel rather than one after the other — the whole thing takes roughly 0.3 seconds total, not 0.6. This is the actual payoff of backgrounding: genuine concurrency for independent tasks.\n\n**3. Waiting for one specific background job by PID.**\n```bash\nsleep 0.2 &\nPID1=$!\nsleep 0.5 &\nPID2=$!\nwait $PID1\necho \"PID1 done, PID2 might still be running\"\nwait $PID2\necho \"both done\"\n```\nOutput:\n```\nPID1 done, PID2 might still be running\nboth done\n```\n`wait $PID1` returns as soon as *that specific* job finishes, without waiting for `PID2` — useful when a script needs to react to one particular background task's completion without holding up on everything else.\n\n**4. Capturing a background job's exit status via `wait`.**\n```bash\nfalse &\nPID=$!\nwait $PID\necho \"bg job exit status: $?\"\n```\nOutput:\n```\nbg job exit status: 1\n```\nThis is the correct, standard way to check whether a backgrounded command ultimately succeeded or failed — `wait $PID`'s own exit status becomes exactly the exit status of the job it waited for, capturable via `$?` immediately afterward exactly as always (Chapter 1.5).\n\n**5. `disown` — letting a background job survive independently of the script.**\n```bash\nsleep 0.1 &\ndisown\njobs\n```\nOutput (empty — nothing listed):\n```\n```\n`disown` removes a job from the shell's job table without stopping it — it keeps running, but the shell stops tracking it (and, notably, stops it from being killed automatically if the shell itself exits, in contexts where that would otherwise happen). Genuinely useful for a background task that should keep going even after the script that launched it finishes.\n\n**6. `wait -n` — waiting for whichever background job finishes *first*.** Requires Bash 4.3+ (check with `bash --version`, Chapter 0.2).\n```bash\nsleep 0.5 &\nsleep 0.1 &\nwait -n\necho \"wait -n returned after the FIRST job finished\"\njobs\n```\nOutput:\n```\nwait -n returned after the FIRST job finished\n[1]+  Running                 sleep 0.5 &\n```\nPlain `wait` (Example 1) blocks until *every* background job is done; `wait -n` returns as soon as *any one* of them finishes — here, the shorter `sleep 0.1` — while the other keeps running in the background, confirmed by `jobs` still showing it. This is genuinely useful for a script managing several parallel tasks that wants to react the moment the *first* one completes, rather than waiting for the slowest.\n\n`wait -n`'s own exit status reflects whichever job happened to finish first:\n```bash\nfalse &\nsleep 0.3 &\nwait -n\necho \"exit status of first-finished job: $?\"\n```\nOutput:\n```\nexit status of first-finished job: 1\n```\n`false` finishes essentially instantly, so it's the one `wait -n` reports on — exactly the same \"check what actually finished\" caution as Chapter 6.4's Example 4, just applied to \"the first of several,\" not \"one specific PID.\"\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to `wait` for background jobs before a script that depends on their results continues.** A script that backgrounds several tasks and immediately tries to use their output (a file they were writing, say) without `wait`ing first will very often run ahead of them and see incomplete or missing results — a classic race condition.\n- **Assuming background jobs share the *current* shell's later variable changes.** Like a subshell (Chapter 6.3, which a backgrounded command effectively is), a background job gets a snapshot of the environment at the moment it starts — changes the main script makes afterward don't retroactively appear inside an already-running background job.\n- **Losing track of a background job's PID.** `$!` only ever holds the *most recently* backgrounded job's PID — if you start several background jobs without capturing each one's `$!` into its own variable immediately (Example 3), you lose the ability to `wait` for, or otherwise manage, any of the earlier ones specifically.\n- **Backgrounding something that genuinely needs to finish before the script's next step, out of a misguided attempt to \"speed things up.\"** Backgrounding only helps for tasks that are genuinely independent of each other — forcing a dependent step into the background just introduces the race condition from the first bullet, without any real benefit.\n- **Not checking a backgrounded job's actual success/failure at all**, assuming that because it \"ran,\" it necessarily succeeded. Example 4's `wait $PID` pattern is the correct way to actually know — silently ignoring it means a script can proceed confidently past a background task that quietly failed.\n\n### How this connects\n\nBackground jobs are, under the hood, another context (alongside pipelines) where Bash creates a subshell-like separate process — everything Chapter 6.3 explained about isolation applies here too. `$!` (Chapter 2.9) finally gets its full, natural use in this chapter. Chapter 6.5, next, covers signals and `trap` in more depth, including how to send a signal to a background job you've kept track of by PID — directly building on the PID-tracking habit this chapter establishes.\n\n### Quick recap\n\n- `command &` runs a command in the background — the script continues immediately without waiting for it.\n- `jobs` lists currently running background jobs; `$!` captures the most recently backgrounded job's PID.\n- `wait` (no arguments) blocks until *all* background jobs finish; `wait $PID` waits for one specific job; `wait -n` (Bash 4.3+) waits for whichever job finishes *first*.\n- `wait $PID`'s own exit status becomes that job's exit status — the correct way to check whether a background task actually succeeded.\n- `disown` lets a background job keep running independently, no longer tracked by the current shell.\n- Capture each background job's PID into its own variable immediately if you'll need to track it specifically later."}, {"id": "6.5", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "processes, jobs, subshells & environment", "chapNum": 5, "slug": "signals-trap-revisited", "fullTitle": "Signals & `trap` Revisited", "title": "Signals & `trap` Revisited", "md": "### Why this matters\n\nChapter 5.6 introduced `trap` for guaranteed cleanup and briefly touched `INT` (Ctrl+C). This chapter goes further: what signals actually are, which ones can and can't be caught, and the numeric exit-status convention every killed process follows — knowledge that matters the moment a script manages background jobs (Chapter 6.4) or needs to behave well when interrupted or terminated by something else.\n\n### The core idea\n\nA **signal** is a notification sent to a running process, telling it something happened — the user pressed Ctrl+C, the system wants it to shut down, it tried to do something illegal. Each signal has both a name and a number (`kill -l` lists them all). The ones you'll actually use: **`INT`** (2, Ctrl+C — \"please stop\"), **`TERM`** (15, the default, polite \"please shut down\" signal `kill` sends), and **`KILL`** (9, \"stop immediately, no choice about it\"). `trap` (Chapter 5.6) lets a script react to most signals — but not all of them.\n\n### Examples\n\n**1. `kill -l` — listing signals by number and name.**\n```bash\nkill -l | head -3\n```\nOutput:\n```\n 1) SIGHUP\t 2) SIGINT\t 3) SIGQUIT\t 4) SIGILL\t 5) SIGTRAP\n 6) SIGABRT\t 7) SIGBUS\t 8) SIGFPE\t 9) SIGKILL\t10) SIGUSR1\n11) SIGSEGV\t12) SIGUSR2\t13) SIGPIPE\t14) SIGALRM\t15) SIGTERM\n```\nBoth the `SIG`-prefixed name and the number are valid ways to refer to a signal — `kill -TERM $PID` and `kill -15 $PID` do exactly the same thing.\n\n**2. `TERM` — the default, \"please shut down\" signal.**\n```bash\nsleep 5 &\nPID=$!\nkill -TERM $PID\nwait $PID\necho \"exit status: $?\"\n```\nOutput:\n```\nexit status: 143\n```\n`143` isn't arbitrary — it's `128 + 15`, where `15` is `TERM`'s signal number. **This `128 + N` convention is universal**: any process killed by a signal reports an exit status of `128` plus that signal's number, which is precisely how a script can tell \"this failed on its own\" (a small, ordinary exit code) apart from \"this was killed by a signal\" (a suspiciously large one, often above 128).\n\n**3. `KILL` cannot be trapped — by design.**\n```bash\n#!/usr/bin/env bash\ntrap 'echo \"trying to catch KILL\"; exit 0' KILL\nsleep 5\n```\nSending `kill -KILL` to this running script:\n```\nexit status: 137\n```\nNotice `\"trying to catch KILL\"` never printed at all — the trap never ran. `137` is `128 + 9` (`KILL`'s number), confirming the process was killed outright. **`SIGKILL` (and `SIGSTOP`) are deliberately untrappable, un-ignorable, by operating system design** — this exists specifically so there's always a way to force-stop a process no matter what it's doing, even one that's trying to trap every signal to avoid being stopped. `TERM`'s whole purpose, by contrast, is to give a process a *chance* to clean up before stopping — which is exactly why `kill`'s default signal is `TERM`, not `KILL`, and why reaching for `kill -9` immediately, rather than trying plain `kill` first, is generally poor practice.\n\n**4. Trapping multiple signals with one handler.**\n```bash\n#!/usr/bin/env bash\ntrap 'echo \"caught signal, cleaning up\"; exit 1' INT TERM\nsleep 5\n```\nSending either `INT` or `TERM` to this script produces:\n```\ncaught signal, cleaning up\n```\n`trap` accepts a space-separated list of signal names — one handler, reacting identically to any of several different signals, which is a common, tidy pattern when the cleanup logic doesn't need to differ by which signal actually arrived.\n\n**5. Name vs. number — interchangeable, but names are clearer.**\n```bash\nkill -l TERM\nkill -l INT\n```\nOutput:\n```\n15\n2\n```\n`kill -l SIGNAME` looks up that signal's number. Prefer names (`INT`, `TERM`) over bare numbers in scripts — `kill -TERM` reads far more clearly at a glance than `kill -15`, and numbers aren't even guaranteed identical across every operating system, while names are standardized.\n\n**6. Ignoring a signal entirely with an empty `trap`.**\n```bash\n#!/usr/bin/env bash\ntrap '' INT\necho \"started, ignoring INT\"\nsleep 1\necho \"finished despite INT\"\n```\nSending `INT` to this running script produces no visible effect at all — it runs to completion:\n```\nstarted, ignoring INT\nfinished despite INT\n```\n`trap '' SIGNAME` (an empty command string) tells Bash to simply ignore that signal — genuinely useful for a critical section that absolutely must not be interrupted partway through (writing a file that must not be left half-written, say).\n\n**7. `trap -p` — listing every trap currently set.**\n```bash\ntrap 'echo cleanup' EXIT\ntrap 'echo got INT' INT\ntrap -p\n```\nOutput:\n```\ntrap -- 'echo cleanup' EXIT\ntrap -- 'echo got INT' SIGINT\n```\nGenuinely useful for checking exactly what a script (or a library it sourced, Chapter 6.2) has already set up, before adding another trap of your own — remember Chapter 5.6's warning that a later `trap` on the same signal completely replaces an earlier one, so `trap -p` is the way to confirm what's currently active before risking that collision.\n\n### ⚠️ Common Mistakes\n\n- **Reaching for `kill -9` (`SIGKILL`) as a first resort.** As Example 3 shows, `KILL` gives a process zero chance to clean up — no trap runs, no temp files get removed, no locks get released. Always try plain `kill` (which sends `TERM`) first, and reserve `-9` for a process that's genuinely stuck and not responding to `TERM` at all.\n- **Assuming every signal can be trapped.** `KILL` and `STOP` specifically cannot be, by deliberate operating system design — no `trap` syntax will ever change this, and a script that assumes otherwise (say, trying to guarantee cleanup no matter what) needs to know this limit exists.\n- **Not recognizing the `128 + N` exit status pattern.** An exit status like `137` or `143` looks like an arbitrary large number until you know to check whether it's `128` plus a recognizable signal number — genuinely useful knowledge for debugging why something \"failed\" with a strange, large code.\n- **Using `trap '' SIGNAL` (ignore) when `trap 'cleanup command' SIGNAL` (react, then decide) was actually wanted.** An empty trap means the signal has zero effect at all — sometimes exactly right (a truly critical section), but easy to reach for when what's really wanted is \"notice this happened, clean up, *then* still exit.\"\n- **Forgetting a `trap` set inside a script doesn't automatically apply to background jobs it launches**, since each is its own separate process (Chapter 6.1's process boundary) — a trap has to be set up inside whatever process should actually react to the signal, not just anywhere in the launching script.\n\n### How this connects\n\nThis chapter completes what Chapter 5.6 started with `trap`, now grounded in a proper understanding of what signals actually are and why some behave differently than others. It closes the loop on Chapter 6.4's background jobs — a script tracking a job's PID can now meaningfully send it a specific signal and understand exactly what kind of exit status to expect back. Chapter 6.6, next, covers process management more broadly — `ps`, `kill`, and `wait` as a complete toolkit for observing and controlling running processes.\n\n### Quick recap\n\n- A signal is a notification sent to a process; each has a name and number (`kill -l` lists them) — `INT` (2), `TERM` (15, `kill`'s default), and `KILL` (9) are the ones you'll use most.\n- A process killed by a signal reports exit status `128 + signal number` — `143` for `TERM`, `137` for `KILL`, universally.\n- `SIGKILL` (and `SIGSTOP`) cannot be trapped or ignored, by deliberate OS design — always try `TERM` (plain `kill`) before reaching for `kill -9`.\n- `trap 'commands' SIG1 SIG2` reacts to multiple signals with one handler; `trap '' SIGNAL` ignores a signal entirely.\n- `trap -p` lists every trap currently set — check this before adding a new one, since a later `trap` on the same signal silently replaces an earlier one.\n- A trap only applies within the process it's set in — it doesn't automatically extend to that process's own background jobs."}, {"id": "6.6", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "processes, jobs, subshells & environment", "chapNum": 6, "slug": "process-management", "fullTitle": "Process Management: `ps`, `kill`, `wait`", "title": "Process Management: `ps`, `kill`, `wait`", "md": "### Why this matters\n\nChapter 6.4 introduced background jobs and `wait`; Chapter 6.5 covered signals. This chapter rounds out Part VI's process-focused material with the everyday tools for actually *observing* what's running on a system and controlling it beyond just your own script's immediate background jobs — genuinely useful both inside scripts and directly at the terminal.\n\n### The core idea\n\n- **`ps`** — lists running processes, a snapshot at the moment you run it.\n- **`pgrep`** — finds process IDs by matching against process names/command lines, without the manual parsing `ps | grep` would otherwise need.\n- **`kill`** — sends a signal to a process by PID (Chapter 6.5 covered the signals themselves in depth).\n- **`kill -0`** — a genuinely clever trick: check whether a process still exists, without actually sending it any real signal at all.\n\n### Examples\n\n**1. `ps` — a basic snapshot of running processes.**\n```bash\nps\n```\nOutput (varies constantly by system):\n```\n    PID TTY          TIME CMD\n   1843 ?        00:00:00 systemd\n   1891 ?        00:00:00 (sd-pam)\n```\nPlain `ps` typically shows just processes attached to your current terminal session. `ps aux` (a very common variant) shows *every* process on the system, from every user, with more detail (CPU/memory usage, start time) — genuinely useful for a broader system view, though usually more than a script needs.\n\n**2. Checking on a specific process by PID with `ps -p`.**\n```bash\nsleep 100 &\nPID=$!\nps -p \"$PID\" -o pid,cmd\n```\nOutput:\n```\n    PID CMD\n 104719 sleep 100\n```\n`-p \"$PID\"` narrows `ps` to just that one process; `-o pid,cmd` chooses exactly which columns to show — clean, script-friendly output rather than the full default column set.\n\n**3. `pgrep` — finding a process by name, cleanly.**\n```bash\nsleep 100 &\nPID=$!\npgrep -f \"sleep 100\" | grep -w \"$PID\"\n```\nOutput:\n```\n104666\n```\n`pgrep -f pattern` searches the full command line of every running process and prints matching PIDs — `-f` matters here since without it, `pgrep` only matches against the bare process name (`sleep`), not its full arguments (`sleep 100`). This confirms our specific `PID` is indeed among the processes matching that pattern.\n\n**4. `kill` — sending a signal (defaults to `TERM`, Chapter 6.5) by PID.**\n```bash\nkill \"$PID\"\nsleep 0.3\npgrep -f \"sleep 100\" | grep -w \"$PID\"\necho \"exit after kill: $?\"\n```\nOutput:\n```\nexit after kill: 1\n```\nAfter `kill`, the process is gone — `pgrep`/`grep` no longer finds it, so the pipeline's exit status is `1` (no match, Chapter 7.1 covers `grep`'s exit-status convention fully).\n\n**5. `kill -0` — checking existence without sending a real signal.**\n```bash\nsleep 100 &\nPID2=$!\nkill -0 \"$PID2\"\necho \"process exists: $?\"\nkill \"$PID2\"\nsleep 0.3\nkill -0 \"$PID2\" 2>/dev/null\necho \"process gone: $?\"\n```\nOutput:\n```\nprocess exists: 0\nprocess gone: 1\n```\nSignal `0` is special — it doesn't actually get delivered to the process at all; `kill` just checks whether it *could* deliver a signal (i.e., whether the process still exists and you have permission to signal it) and reports success or failure accordingly. This is the standard, safe way to ask \"is this PID still running?\" without disturbing it in any way — genuinely useful in a script that's tracking a background job (Chapter 6.4) and wants to check on it periodically without necessarily stopping it.\n\n### ⚠️ Common Mistakes\n\n- **Using a `pgrep`/`pkill` pattern broad enough to match unrelated processes**, including — genuinely dangerously — the very shell or script running the command itself, if its own command line happens to contain matching text. Always prefer tracking a specific PID (via `$!` from Chapter 6.4, or a PID file for a longer-running service) over a name-based pattern match whenever precision actually matters, and test any `pgrep`/`pkill` pattern with `pgrep` alone first (to see exactly what it would match) before ever pairing it with `pkill` or `kill`.\n- **Forgetting `kill`'s default signal is `TERM`, not an immediate hard stop.** As Chapter 6.5 covered, this is usually the *correct* default (giving the process a chance to clean up) — but it does mean a process that's ignoring `TERM` won't actually stop from a plain `kill` call; escalating to `kill -9` should be a deliberate, considered fallback, not the first attempt.\n- **Parsing `ps`'s default, human-oriented output with fragile text processing** (`ps aux | awk '{print $2}'`, hoping column positions never shift) when `-o` (Example 2) gives you exactly the columns you want, in a stable, script-friendly format, directly from `ps` itself.\n- **Assuming `kill -0`'s success means you have full control over the process**, rather than just confirming it exists and is signalable. A process can exist and respond to `kill -0` successfully while still, for instance, ignoring `TERM` — existence and \"will actually respond the way you want\" are two different questions.\n\n### How this connects\n\nThis chapter completes the process-oriented toolkit that Chapter 6.1 (environment/process boundary), 6.3 (subshells), 6.4 (background jobs), and 6.5 (signals) have been building — `ps`/`pgrep`/`kill -0` are exactly the observation tools that pair naturally with the PID-tracking habits those chapters established. Chapter 6.7, next and last in Part VI, shifts to a different but related concern: organizing a script that's grown large enough to need splitting across multiple files.\n\n### Quick recap\n\n- `ps` snapshots running processes; `ps aux` shows every process system-wide; `ps -p PID -o cols` gives clean, script-friendly output for one specific process.\n- `pgrep -f pattern` finds PIDs by matching against full command lines — always test a pattern's matches carefully before pairing it with `kill`/`pkill`.\n- `kill PID` sends `TERM` by default (Chapter 6.5); prefer tracking specific PIDs over broad name-based patterns whenever precision matters.\n- `kill -0 PID` checks whether a process still exists, without sending any real signal — the standard, safe way to check on a tracked background job."}, {"id": "6.7", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "processes, jobs, subshells & environment", "chapNum": 7, "slug": "organizing-multi-file-scripts", "fullTitle": "Organizing Multi-File Scripts", "title": "Organizing Multi-File Scripts", "md": "### Why this matters\n\nA script that's grown to hundreds of lines, with several distinct groups of related functions, becomes hard to navigate as one file — and Chapter 6.2 already gave you the tool (`source`) to split it apart. What's missing is a reliable way for a script to find *its own* files regardless of where it's run from, since Chapter 6.2's examples assumed the library file was conveniently right there in the current folder. This chapter closes that gap and rounds out Part VI.\n\n### The core idea\n\nThe reliable way for a script to locate other files relative to *itself* — not relative to wherever the user happened to be standing when they ran it — uses `${BASH_SOURCE[0]}`, a Bash-specific array holding the path of the currently executing script (or sourced file), combined with `dirname` (Chapter 7.7) to strip the filename and keep just the directory:\n```bash\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\n```\nThis one line — worth treating as a standard idiom to reach for, not something to re-derive each time — resolves to the script's own absolute directory, no matter where it was called from.\n\n### Examples\n\n**1. A small project with a `lib/` (shared code) and `bin/` (entry point) layout.**\n```\nmultitest/\n  lib/\n    helpers.sh\n  bin/\n    main.sh\n```\n```bash\n# lib/helpers.sh\ngreet() { echo \"Hello from helpers.sh\"; }\n```\n```bash\n# bin/main.sh\n#!/usr/bin/env bash\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nsource \"$SCRIPT_DIR/../lib/helpers.sh\"\ngreet\n```\nRunning `./bin/main.sh` (from inside `multitest/`):\n```\nHello from helpers.sh\n```\n\n**2. The same script, run from a completely different directory — it still works.**\n```bash\ncd /somewhere/else\n/path/to/multitest/bin/main.sh\n```\nOutput — identical:\n```\nHello from helpers.sh\n```\nThis is the entire point of the `SCRIPT_DIR` idiom: it resolves based on where `main.sh` itself *lives*, not where the user's terminal happens to currently be. Compare this to Chapter 6.2's earlier examples, which quietly assumed `lib.sh` was always right there in the current folder — a real limitation that only shows up once someone runs the script from somewhere else, which real users inevitably do.\n\n**3. `${BASH_SOURCE[0]}` vs. plain `$0` — genuinely different once sourcing is involved.**\n```bash\n# lib/checker.sh\necho \"BASH_SOURCE[0] in checker.sh: ${BASH_SOURCE[0]}\"\necho \"\\$0 in checker.sh: $0\"\n```\n```bash\n# bin/main2.sh\n#!/usr/bin/env bash\nsource \"$(dirname \"${BASH_SOURCE[0]}\")/../lib/checker.sh\"\n```\nRunning `./bin/main2.sh`:\n```\nBASH_SOURCE[0] in checker.sh: ./bin/../lib/checker.sh\n$0 in checker.sh: ./bin/main2.sh\n```\nThis is the crucial distinction: inside `checker.sh` (which was *sourced*, not run directly), `${BASH_SOURCE[0]}` correctly reports `checker.sh`'s own path — but `$0` still reports `main2.sh`'s path, because `$0` reflects the *originally invoked script*, unaffected by sourcing (exactly matching Chapter 6.2's point that sourcing runs in the same shell, so `$0` never changes). **This is exactly why the `SCRIPT_DIR` idiom uses `${BASH_SOURCE[0]}`, never `$0`** — using `$0` inside a sourced library file would incorrectly resolve to the *caller's* directory, not the library's own.\n\n### ⚠️ Common Mistakes\n\n- **Using `$0` instead of `${BASH_SOURCE[0]}` when a library file needs to find things relative to itself.** As Example 3 demonstrates concretely, this gives the *wrong* directory the moment the file is sourced from somewhere other than its own folder — a bug that can hide successfully for a long time if the library always happens to get sourced from a consistent location, then breaks confusingly the first time it doesn't.\n- **Assuming the current working directory (`pwd`) tells you anything reliable about where a script's own files are.** It only tells you where the *user* was standing when they ran the command — completely unrelated to where the script itself lives on disk, as Example 2 demonstrates.\n- **Hardcoding an absolute path to a library file.** `source \"/home/alice/myproject/lib/helpers.sh\"` works fine on Alice's machine and breaks immediately anywhere else — the whole point of the `SCRIPT_DIR` idiom is producing a path that's correct regardless of whose machine, or which directory, the project happens to be sitting in.\n- **Over-engineering the folder structure for a genuinely small script.** `lib/`/`bin/` (Example 1) is a reasonable convention once a project has grown to several files with a real shared library — a single 100-line script doesn't need this ceremony, and premature splitting adds complexity without real benefit. Reach for this structure when a project actually earns it, not by default.\n- **Forgetting to `chmod +x` the entry-point script after reorganizing into a multi-file layout** — moving or renaming files sometimes loses execute permissions depending on how the move happened (particularly through some archive/ZIP tools), an easy thing to overlook when a project's shape changes.\n\n### How this connects\n\nThis chapter closes out Part VI — Chapters, which has been about how a script relates to processes and its own environment: environment variables (6.1), sourcing (6.2), subshells (6.3), background jobs (6.4), signals (6.5), and process management (6.6) all feed into this final, practical concern of organizing real, growing projects across multiple files. Part VII, next, shifts focus entirely — from *structure* to the essential Unix toolbox (`grep`, `sed`, `awk`, and friends) that every serious Bash script eventually leans on.\n\n### Quick recap\n\n- `${BASH_SOURCE[0]}` holds the path of the currently executing (or sourced) file — unlike `$0`, it correctly reflects a sourced library's *own* path, not the originally invoked script's.\n- `SCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"` is the standard idiom for a script to reliably locate its own directory, regardless of where it's run from.\n- Never rely on the current working directory (`pwd`) or a hardcoded absolute path to find a project's own files.\n- A `lib/`/`bin/` (or similar) split is worth adopting once a project has genuinely grown into several files with shared logic — not before."}, {"id": "7.1", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 1, "slug": "grep-searching-text", "fullTitle": "`grep`: Searching Text", "title": "`grep`: Searching Text", "md": "### Why this matters\n\n`grep` is one of the most-used commands in all of Unix — searching text for a pattern is such a universal need that it's genuinely hard to write real scripts for long without reaching for it. Part VII is dedicated to `grep` and its siblings getting the same full-chapter treatment as any core language feature, because in practice, they *are* core to how real Bash scripting gets done.\n\n### The core idea\n\n```bash\ngrep \"pattern\" file\n```\nSearches `file` for lines matching `pattern`, printing each matching line. Without a filename, `grep` reads from stdin — making it a natural fit anywhere in a pipeline (Chapter 5.3). By default, `pattern` is a \"basic\" regular expression (mostly literal text, with a few special characters); Chapter 7.5 covers regex syntax properly. This chapter focuses on `grep`'s own flags and behavior — the tool itself, before the patterns it can search for get more sophisticated.\n\n### Examples\n\n*
