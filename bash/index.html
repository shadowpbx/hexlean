*1. A basic search.**\n```bash\ngrep \"apple\" fruits.txt\n```\nGiven a file containing `apple`, `banana`, `cherry`, `apple pie`, `BANANA split`:\n```\napple\napple pie\n```\nBoth lines containing `apple` printed, in full — `grep` prints the *whole matching line*, not just the matched portion.\n\n**2. Case-insensitive search with `-i`.**\n```bash\ngrep -i \"banana\" fruits.txt\n```\nOutput:\n```\nbanana\nBANANA split\n```\nWithout `-i`, `BANANA split` (uppercase) wouldn't have matched a lowercase `banana` pattern at all — `grep` is case-sensitive by default.\n\n**3. Inverting the match with `-v` — show lines that *don't* match.**\n```bash\ngrep -v \"apple\" fruits.txt\n```\nOutput:\n```\nbanana\ncherry\nBANANA split\n```\nEvery line except the ones containing `apple`.\n\n**4. Counting matches with `-c`, instead of printing them.**\n```bash\ngrep -c \"a\" fruits.txt\n```\nOutput:\n```\n3\n```\nCounts *matching lines*, not total occurrences of `a` — three of the five lines contain a lowercase `a` somewhere.\n\n**5. Showing line numbers with `-n`.**\n```bash\ngrep -n \"cherry\" fruits.txt\n```\nOutput:\n```\n3:cherry\n```\nGenuinely useful for tracking down exactly where in a larger file a match occurred.\n\n**6. Whole-word matching with `-w`.**\n```bash\ngrep -w \"cat\" words.txt\n```\nGiven a file containing `cat`, `concatenate`, `cats`:\n```\ncat\n```\nWithout `-w`, all three lines would match (`cat` appears as a substring in all of them) — `-w` requires the match to be a complete word, bounded by non-word characters (or the start/end of the line) on both sides.\n\n**7. Extended regex with `-E`.**\n```bash\ngrep -E \"^(apple|cherry)$\" fruits.txt\n```\nOutput:\n```\napple\ncherry\n```\n`-E` enables \"extended\" regular expression syntax — parentheses for grouping and `|` for alternation work directly, without needing backslash-escaping. Chapter 7.5 covers this distinction (basic vs. extended regex) properly.\n\n**8. `grep`'s exit status — success means \"found,\" failure means \"not found.\"**\n```bash\ngrep \"zzz\" fruits.txt\necho \"exit when not found: $?\"\n\ngrep \"apple\" fruits.txt >/dev/null\necho \"exit when found: $?\"\n```\nOutput:\n```\nexit when not found: 1\nexit when found: 0\n```\nThis is precisely the behavior Chapter 3.1 relied on when using `grep -q` directly inside an `if` — `grep`'s exit status (not its printed output) is what makes it a natural fit for conditions. `-q` (quiet) suppresses the printed matches entirely, useful specifically when only the exit status matters.\n\n**9. Recursive search across a whole directory with `-r`.**\n```bash\ngrep -r \"findme\" recdir/\n```\nOutput:\n```\nrecdir/sub/file.txt:findme\n```\n`-r` searches every file under the given directory, recursively — the output automatically includes each match's filename, since results can now come from many different files.\n\n**10. Filenames appear automatically once multiple files are searched.**\n```bash\ngrep \"apple\" fruits.txt words.txt\n```\nOutput:\n```\nfruits.txt:apple\nfruits.txt:apple pie\n```\nThe moment more than one file is given, `grep` prefixes every match with its source filename automatically — no flag needed for this behavior, it's the default the instant there's more than one file in play.\n\n**11. Context lines with `-A`, `-B`, and `-C` — showing what surrounds a match.**\n```bash\nprintf \"a\\nb\\nTARGET\\nc\\nd\\n\" | grep -A 1 -B 1 TARGET\n```\nOutput:\n```\nb\nTARGET\nc\n```\n`-A N` (after) shows `N` lines following each match, `-B N` (before) shows `N` lines preceding it, and `-C N` shows `N` lines on *both* sides in one flag. This is one of the most commonly reached-for `grep` features in real, everyday use — searching a log file for an error and wanting to see what happened immediately before and after it, without opening the whole file in an editor.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `grep`'s default case-sensitivity.** A search that \"should\" have matched but silently found nothing is very often a case mismatch — `-i` is the first thing to try when a match seems to be missing unexpectedly.\n- **Using `-c` and expecting a count of total *occurrences* rather than matching *lines*.** A line containing the pattern twice still counts as `1` toward `-c`'s total — for counting actual occurrences, `grep -o pattern file | wc -l` (using `-o`, which prints only the matched portion, one per line) is the correct combination.\n- **Forgetting `-w` when a substring match is too broad.** As Example 6 shows, plain `grep \"cat\"` matches `concatenate` and `cats` too — `-w` is the fix whenever \"this exact word, not a substring of a longer word\" is really what's needed.\n- **Not quoting the pattern**, especially one containing spaces or shell-special characters like `*` or `$`. `grep pattern with spaces file` (unquoted) gets parsed as multiple separate arguments, not one pattern — always quote: `grep \"pattern with spaces\" file`.\n- **Assuming basic regex (`grep`'s default) supports `|` and `(...)` the way extended regex does.** Without `-E`, those characters need backslash-escaping (`\\|`, `\\(...\\)`) to have their special meaning at all — Chapter 7.5 covers this distinction in full; for now, reach for `-E` whenever a pattern needs grouping or alternation.\n\n### How this connects\n\n`grep`'s exit-status behavior (Example 8) is exactly what powered the `if grep -q ...` pattern back in Chapter 3.1 — now you know precisely why that worked. `grep`'s pattern syntax is a preview of Chapter 7.5's full regex treatment, and `grep` pairs constantly with `sed` (next chapter) and `awk` in real pipelines — Chapter 7.8 shows several of these combinations working together on real problems.\n\n### Quick recap\n\n- `grep \"pattern\" file` prints lines matching `pattern`; without a file, it reads from stdin.\n- `-i` (case-insensitive), `-v` (invert match), `-c` (count matching lines), `-n` (show line numbers), `-w` (whole word only), `-r` (recursive across a directory), `-q` (quiet, exit status only), `-o` (print only the matched text).\n- `-E` enables extended regex (direct `|` and `(...)` support) — Chapter 7.5 covers regex syntax fully.\n- Exit status `0` means \"found at least one match,\" `1` means \"no match\" — this is what makes `grep` a natural fit directly inside `if` conditions.\n- Searching multiple files (or using `-r`) automatically prefixes each match with its source filename.\n- `-A N` / `-B N` / `-C N` show `N` lines of context after / before / both sides of each match — one of the most commonly used `grep` features in everyday log-searching."}, {"id": "7.2", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 2, "slug": "sed-stream-editing", "fullTitle": "`sed`: Stream Editing", "title": "`sed`: Stream Editing", "md": "### Why this matters\n\n`grep` finds lines; `sed` **transforms** them — substituting text, deleting lines, extracting specific ones — all without opening a file in an editor, and all scriptable, repeatable, and applicable to many files at once. \"Stream editor\" is exactly what the name means: it edits text flowing through it, line by line, which makes it a natural fit for both one-off command-line fixes and permanent parts of a script's pipeline.\n\n### The core idea\n\n`sed`'s single most-used form is substitution:\n```bash\nsed 's/pattern/replacement/flags'\n```\nRead it as: **s**ubstitute `pattern` with `replacement`, with optional `flags` controlling exactly how. Without a flag, `sed` replaces only the **first** match on each line; the `g` (global) flag replaces every match on every line instead. `sed` can also delete lines (`d`), print specific lines (`p`, usually combined with `-n`), and more — this chapter covers the small, practical core that covers the overwhelming majority of real `sed` use, deliberately stopping short of `sed`'s full scripting language (per the syllabus's declared scope).\n\n### Examples\n\n**1. Basic substitution — first match only, by default.**\n```bash\nsed 's/banana/BANANA/' fruits.txt\n```\nGiven a file with `apple`, `banana`, `cherry`:\n```\napple\nBANANA\ncherry\n```\n\n**2. Without `g`, only the first match *on each line* is replaced.**\n```bash\necho \"cat cat cat\" | sed 's/cat/dog/'\n```\nOutput:\n```\ndog cat cat\n```\nOnly the first `cat` became `dog` — the other two on the same line were untouched.\n\n**3. The `g` (global) flag — replace every match, not just the first.**\n```bash\necho \"cat cat cat\" | sed 's/cat/dog/g'\n```\nOutput:\n```\ndog dog dog\n```\nThis is one of the most common `sed` mistakes to forget — reaching for plain `s/x/y/` when `s/x/y/g` was actually needed.\n\n**4. Case-insensitive matching with the `I` flag.**\n```bash\necho \"Cat CAT cat\" | sed 's/cat/dog/gI'\n```\nOutput:\n```\ndog dog dog\n```\nCombining flags (`g` and `I` together) works exactly as you'd expect — every case variant of `cat`, everywhere on the line. **Portability note:** `I` is a GNU `sed` extension — it's not part of POSIX `sed` and isn't available in traditional BSD `sed` (including macOS's system `sed`, unless GNU `sed` has been installed separately, often as `gsed`). Everything on this system is assumed to be GNU `sed` (check with `sed --version`); if a script needs to run on macOS/BSD without that assumption, case-fold explicitly instead, e.g. `echo \"$x\" | tr '[:upper:]' '[:lower:]' | sed 's/cat/dog/g'`.\n\n**5. Deleting lines matching a pattern with `d`.**\n```bash\nsed '/banana/d' fruits.txt\n```\nOutput:\n```\napple\ncherry\n```\n`/pattern/d` deletes any line matching `pattern` entirely, rather than substituting text within it — a genuinely different `sed` command from `s///`, addressing whole lines instead of text within them.\n\n**6. Printing one specific line with `-n` and `p`.**\n```bash\nsed -n '2p' fruits.txt\n```\nOutput:\n```\nbanana\n```\n`-n` suppresses `sed`'s normal behavior of printing every line by default; `2p` then explicitly prints just line 2. Without `-n`, every line would print *plus* an extra copy of line 2 — `-n` and `p` are almost always used together for exactly this reason.\n\n**7. In-place editing with `-i` — modifying a file directly.**\n```bash\nsed -i 's/apple/APPLE/' file.txt\ncat file.txt\n```\nOutput:\n```\nAPPLE\nbanana\ncherry\n```\n`-i` writes the result directly back into the file, rather than just printing it — genuinely convenient, but also genuinely irreversible the moment it runs, exactly the caution Chapter 5.2 raised about `sort file > file`'s truncation trap (this is `sed`'s dedicated, *safe* solution to precisely that problem, done correctly rather than by risky redirection).\n\n**Portability note:** the bare `sed -i '...'` shown above is GNU `sed` syntax — GNU `sed` treats a missing backup extension as \"no backup.\" BSD/macOS `sed` requires the argument to be present either way, even to mean \"no backup\" (`sed -i '' 's/apple/APPLE/' file.txt`, with an explicit empty string) — the exact command above run unmodified on macOS's system `sed` either errors out or, worse, silently treats the next word as the extension, not the script. A script meant to run on both needs to detect which `sed` it has (or just require GNU `sed`, e.g. via `gsed` on macOS) rather than assuming this form works everywhere.\n\n**8. `-i` with a backup extension — the safer version of Example 7.**\n```bash\nsed -i.bak 's/cherry/CHERRY/' file.txt\ncat file.txt\ncat file.txt.bak\n```\nOutput:\n```\nAPPLE\nbanana\nCHERRY\nAPPLE\nbanana\ncherry\n```\n`-i.bak` saves the *original* content to `file.txt.bak` before making the change — a genuinely worthwhile habit for any in-place edit that isn't trivially reversible some other way (like being tracked in version control).\n\n**9. Using a different delimiter — essential once `/` appears in your own pattern.**\n```bash\necho \"/usr/local/bin\" | sed 's|/usr|/opt|'\n```\nOutput:\n```\n/opt/local/bin\n```\n`sed` doesn't require `/` as the separator in `s/pattern/replacement/` — any character works, as long as it's used consistently. Here, `|` avoids the awkwardness of escaping every literal `/` inside a path-matching pattern (which would otherwise need to be `s/\\/usr/\\/opt/`).\n\n**10. Multiple `sed` commands in one call with `-e`.**\n```bash\necho \"hello world\" | sed -e 's/hello/hi/' -e 's/world/earth/'\n```\nOutput:\n```\nhi earth\n```\nEach `-e` adds one more command to run in sequence — cleaner than chaining several separate `sed` invocations through a pipe.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the `g` flag** when every occurrence on a line should be replaced, not just the first — Example 2 shows exactly how this goes wrong, silently, with no error at all.\n- **Using `-i` without a backup on something that matters**, and finding out only after the fact that the substitution wasn't quite right. `-i.bak` (Example 8) costs one extra flag and buys a genuine safety net.\n- **Trying to use `/` inside a pattern without either escaping it or switching delimiters.** `sed 's//usr/opt/'` (matching a path with unescaped slashes) breaks in confusing ways — either escape every literal `/` or, far more readably, pick a different delimiter (Example 9).\n- **Assuming `sed`'s pattern syntax is identical to `grep -E`'s.** Plain `sed` (without a `-E`/`-r` flag, itself not covered in this book's deliberately limited scope) uses basic regex by default, same as plain `grep` — the same basic-vs-extended distinction from Chapter 7.1 applies here too.\n- **Reaching for `sed` to do complex, multi-step, stateful text processing.** `sed` genuinely excels at line-oriented substitution and deletion; once a task needs field-by-field logic, running totals, or real conditionals over the data, `awk` (next chapter) is very often the better-suited tool.\n\n### How this connects\n\n`sed`'s pattern syntax shares its basic-regex foundation with `grep` (Chapter 7.1) — Chapter 7.5 covers this shared regex vocabulary in full. `sed -i` is the correct, safe answer to the in-place file editing problem Chapter 5.2 flagged as broken with plain redirection. `sed` also pairs constantly with `grep` and `awk` in real pipelines, which Chapter 7.8 shows working together on genuine multi-stage problems.\n\n### Quick recap\n\n- `sed 's/pattern/replacement/'` substitutes the first match per line; add `g` to replace every match, `I` for case-insensitive matching (`I` is a GNU extension, not available in BSD/macOS `sed`).\n- `sed '/pattern/d'` deletes matching lines; `sed -n 'Np'` prints just line `N` (the `-n` suppresses sed's normal print-everything default).\n- `sed -i` edits a file in place — genuinely convenient, genuinely irreversible; `sed -i.bak` keeps a backup of the original first. This exact `-i` syntax is GNU-specific; BSD/macOS `sed` requires an explicit (possibly empty) backup-extension argument either way.\n- The `/` delimiter can be swapped for any other character (`sed 's|a|b|'`) — useful whenever the pattern itself naturally contains `/`.\n- `-e` chains multiple `sed` commands in one call."}, {"id": "7.3", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 3, "slug": "awk-text-processing-powerhouse", "fullTitle": "`awk`: Text Processing Powerhouse", "title": "`awk`: Text Processing Powerhouse", "md": "### Why this matters\n\n`grep` finds lines, `sed` transforms them — `awk` thinks in **columns**. The moment text is naturally structured into fields (a log line, a CSV-like row, `ps` output, the output of countless Unix commands), `awk` lets you reference \"the third field\" or \"sum up the second column\" directly, without manual splitting. It's genuinely its own small programming language, and this chapter covers the practical core that handles the vast majority of real-world one-liners, deliberately stopping short of `awk`'s full scripting capability (per the syllabus's declared scope).\n\n### The core idea\n\n```bash\nawk '{ action }' file\n```\nFor **every line** of `file`, `awk` runs `action`. Inside that action, `$1`, `$2`, `$3`... refer to the line's individual fields (split on whitespace by default — exactly like Bash's own default word splitting, Chapter 2.10), and `$0` refers to the *whole* line. Two special blocks run only once each, regardless of how many lines exist: `BEGIN { ... }` before any line is processed, and `END { ... }` after the last one — perfect for setup and final summaries.\n\n### Examples\n\n**1. Printing a specific field.**\n```bash\nawk '{print $1}' people.txt\n```\nGiven a file with rows like `Alice 30 Engineer`:\n```\nAlice\nBob\nCarol\n```\n`$1` is the first whitespace-separated field on each line.\n\n**2. Printing multiple fields.**\n```bash\nawk '{print $1, $3}' people.txt\n```\nOutput:\n```\nAlice Engineer\nBob Designer\nCarol Manager\n```\nThe comma inside `print` inserts a single space between the printed values.\n\n**3. `NR` (record number) and `NF` (number of fields) — built-in per-line counters.**\n```bash\nawk '{print NR, NF, $0}' people.txt\n```\nOutput:\n```\n1 3 Alice 30 Engineer\n2 3 Bob 25 Designer\n3 3 Carol 35 Manager\n```\n`NR` is the current line number (1-indexed); `NF` is how many fields that particular line split into — genuinely useful for validating that every line has the expected shape.\n\n**4. Filtering rows with a condition.**\n```bash\nawk '$2 > 28 {print $1}' people.txt\n```\nOutput:\n```\nAlice\nCarol\n```\nThe condition (`$2 > 28`) comes *before* the action — read it as \"for lines where field 2 is greater than 28, print field 1.\" `awk` automatically treats `$2` numerically here since it's being compared with `>` against a number, even though every field is technically just text.\n\n**5. A custom field separator with `-F`.**\n```bash\necho \"a,b,c\" | awk -F',' '{print $2}'\n```\nOutput:\n```\nb\n```\n`-F','` tells `awk` to split fields on commas instead of the default whitespace — genuinely useful for CSV-like data.\n\n**6. `BEGIN` and `END` blocks.**\n```bash\nawk 'BEGIN {print \"Name Age\"} {print $1, $2} END {print \"Done\"}' people.txt\n```\nOutput:\n```\nName Age\nAlice 30\nBob 25\nCarol 35\nDone\n```\n`BEGIN` printed a header before any line was processed; `END` printed a footer after the last one — the middle block ran once per line, exactly as in every earlier example.\n\n**7. Accumulating a value across lines — summing a column.**\n```bash\nawk '{sum += $2} END {print \"Total age:\", sum}' people.txt\n```\nOutput:\n```\nTotal age: 90\n```\n`sum` is a variable that simply persists across every line's execution of the main block (no `local`/`declare` ceremony needed — `awk` variables just exist the moment you use them) — the `END` block then reports the accumulated total once all lines have been processed.\n\n**8. Built-in string functions.**\n```bash\nawk '{print length($1), toupper($1)}' people.txt\n```\nOutput:\n```\n5 ALICE\n3 BOB\n5 CAROL\n```\n`length()` and `toupper()` are two of several built-in `awk` functions (others include `tolower()`, `substr()`, `split()`) — genuinely convenient for quick text transformations without needing a separate `tr` or Bash parameter-expansion step.\n\n**9. `printf` inside `awk` — formatted, aligned output.**\n```bash\nawk '{printf \"%-10s %d\\n\", $1, $2}' people.txt\n```\nOutput:\n```\nAlice      30\nBob        25\nCarol      35\n```\n`awk`'s `printf` uses exactly the same format-string conventions from Chapter 2.3 — no coincidence, since both trace back to the same C-language heritage.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `awk` splits on whitespace by default, not on whatever separator the data actually uses.** A CSV file processed without `-F','` will have `$1` be the *entire line* (since there's no whitespace to split on), not just the first comma-separated value — Example 5's `-F` flag is essential the moment the data isn't whitespace-delimited.\n- **Quoting the whole `awk` program incorrectly**, especially when it needs to reference a Bash shell variable. `awk '{print $var}'` does **not** substitute a Bash variable — inside single quotes, `$var` means nothing to `awk` at all (it's not valid `awk` field syntax, and Bash never gets a chance to expand it since single quotes suppress that, Chapter 1.4). To pass a Bash variable in, use `awk -v awkvar=\"$bashvar\" '{print awkvar}'` instead.\n- **Confusing `$0` (the awk field-reference syntax) with Bash's own `$0` (Chapter 2.9, the script's invocation name).** These are two completely unrelated things that happen to share the same syntax in two different languages — inside an `awk` program, `$0` always means \"the current whole line.\"\n- **Trying to do genuinely complex, multi-pass, or deeply conditional processing entirely in one dense `awk` one-liner.** `awk` can technically do almost anything given enough one-liner cleverness, but past a certain complexity, a proper Bash script (or a real programming language) reads far more maintainably — treat elaborate one-liners as a sign to reconsider the approach, not a badge of honor.\n- **Forgetting numeric comparisons on fields work correctly even though every field is fundamentally text**, exactly like Bash's own `-eq` vs. `=` distinction (Chapter 2.4/3.2) — `awk` is a bit more forgiving here (Example 4's `$2 > 28` \"just works\" because `awk` infers numeric context from the `>` and the field's apparent content), but it's worth knowing this inference exists rather than assuming it magically always does the right thing on messier data.\n\n### How this connects\n\n`awk`'s field-splitting builds on the same word-splitting concept from Chapter 2.10, and its `printf` reuses Chapter 2.3's format-string syntax directly. Alongside `grep` and `sed`, `awk` completes the core trio of text-processing tools this book treats as fully in scope — Chapter 7.8 shows all three working together in real pipelines, and Chapter 7.6's `cut`/`sort`/`uniq`/`tr` round out the toolbox with simpler, more specialized alternatives for when a full `awk` program would be overkill.\n\n### Quick recap\n\n- `awk '{action}' file` runs `action` for every line; `$1`, `$2`, ... reference fields (whitespace-split by default), `$0` is the whole line.\n- `NR` (line number) and `NF` (field count) are built-in per-line values.\n- `BEGIN {...}` runs once before any line; `END {...}` runs once after the last line — useful for setup and summaries.\n- `-F'sep'` sets a custom field separator, essential for non-whitespace-delimited data like CSV.\n- Variables (like an accumulator with `+=`) simply persist across lines with no special declaration needed.\n- To use a Bash variable inside an `awk` program, pass it explicitly with `-v name=\"$value\"` — `$var` inside single-quoted `awk` code means nothing to Bash."}, {"id": "7.4", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 4, "slug": "find-xargs", "fullTitle": "`find` & `xargs`: Locating and Acting on Files", "title": "`find` & `xargs`: Locating and Acting on Files", "md": "### Why this matters\n\n`grep` searches inside files' *content*; `find` searches for the files themselves, by name, type, location, or other properties. `xargs` is its natural partner: it takes a list of items (very often `find`'s output) and turns them into arguments for another command. Together they're the standard way to answer \"do this to every file matching that description\" — one of the single most common real-world scripting needs.\n\n### The core idea\n\n```bash\nfind path -condition\n```\nSearches recursively starting at `path`, printing every file/directory matching `-condition` (or every single one, with no condition given). `xargs` reads items from stdin and builds them into a command line to run:\n```bash\nsome_command | xargs another_command\n```\nturning each line of `some_command`'s output into an argument for `another_command`. **The two combine specifically because `find` produces exactly the kind of list `xargs` is built to consume** — though, as this chapter's examples show, there's a right and a genuinely wrong way to connect them.\n\n### Examples\n\n**1. Finding files by name.**\n```bash\nfind . -name \"*.txt\"\n```\nOutput (order may vary):\n```\n./b.txt\n./a.txt\n./sub1/c.txt\n./sub2/e.txt\n```\n`-name` matches against just the filename, using glob-style patterns (Chapter 2.11) — searches recursively from `.` by default.\n\n**2. Finding by type.**\n```bash\nfind . -type d\n```\nOutput:\n```\n.\n./sub1\n./sub2\n./sub2/empty_dir\n```\n`-type d` (directories) or `-type f` (regular files) restricts results to one kind of filesystem entry.\n\n**3. Running a command on each result directly with `-exec`.**\n```bash\nfind . -name \"*.txt\" -exec echo \"found: {}\" \\;\n```\nOutput:\n```\nfound: ./b.txt\nfound: ./a.txt\nfound: ./sub1/c.txt\nfound: ./sub2/e.txt\n```\n`{}` is replaced with each matching path in turn; the trailing `\\;` (escaped semicolon) marks the end of the `-exec` command. `-exec` runs the command **once per match** — fine for a handful of files, but genuinely slower for a large number, since a new process starts each time.\n\n**4. Piping into `xargs` — often faster, batches arguments together.**\n```bash\nfind . -name \"*.txt\" | xargs echo \"all txt files:\"\n```\nOutput:\n```\nall txt files: ./b.txt ./a.txt ./sub1/c.txt ./sub2/e.txt\n```\nUnlike `-exec` (one process per match), `xargs` by default bundles as many arguments as will comfortably fit onto **one** command invocation — genuinely faster for large result sets.\n\n**5. `xargs -n` — limiting how many arguments go to each invocation.**\n```bash\necho \"a b c d\" | xargs -n 2 echo\n```\nOutput:\n```\na b\nc d\n```\n`-n 2` forces `xargs` to run the command once per every 2 arguments, rather than bundling everything into one call — useful when a command genuinely can't accept an unlimited argument count at once.\n\n**6. The classic danger: filenames containing spaces breaking the naive pipe.**\n```bash\nfind . -name \"*.txt\" | xargs ls -la\n```\nWith a file literally named `file with spaces.txt` among the results:\n```\nls: cannot access './file': No such file or directory\nls: cannot access 'with': No such file or directory\nls: cannot access 'spaces.txt': No such file or directory\n```\nThis is precisely the word-splitting problem from Chapter 2.10, now hitting `xargs` specifically: by default, `xargs` splits its input on whitespace, so one filename containing spaces gets torn into three separate, individually meaningless arguments.\n\n**7. The fix: `-print0` and `-0` — null-byte-separated, immune to spaces entirely.**\n```bash\nfind . -name \"*.txt\" -print0 | xargs -0 -I{} echo \"safe: {}\"\n```\nOutput:\n```\nsafe: ./b.txt\nsafe: ./a.txt\nsafe: ./sub1/c.txt\nsafe: ./sub1/file with spaces.txt\nsafe: ./sub2/e.txt\n```\n`-print0` makes `find` separate results with a **null byte** (`\\0`) instead of a newline — a character that can never legally appear inside a filename, unlike a space or even a newline. `xargs -0` reads that same null-byte-delimited format on the other end. Together, this is the genuinely robust, correct way to pipe `find` into `xargs` — **this combination should be your default**, not an occasional afterthought reached for only after a filename-with-spaces bug already bit you.\n\n**8. `-maxdepth` — limiting how deep `find` recurses.**\n```bash\nfind . -maxdepth 1 -name \"*.txt\"\n```\nOutput:\n```\n./b.txt\n./a.txt\n```\n`-maxdepth 1` restricts the search to the starting directory itself, not its subdirectories — genuinely useful when a fully recursive search would be broader (and slower) than actually needed.\n\n**9. `find ... -delete` — a built-in, no-`xargs`-needed way to remove matches.**\n```bash\nfind . -maxdepth 1 -name \"*.tmp\" -delete\n```\nNo output on success — every matching file is simply gone. `-delete` is `find`'s own built-in deletion action, generally preferable to piping into `xargs rm` for the common \"find and delete\" case specifically, since it avoids the whole spaces-in-filenames concern entirely (no text ever needs to round-trip through a pipe at all).\n\n**10. Filtering by file attributes — age and size.**\n```bash\nfind . -maxdepth 1 -mtime -1 -type f\n```\nOutput (in a folder with one file modified today and one artificially aged 10 days):\n```\n./new.txt\n```\n`-mtime -1` matches files modified less than 1 day ago (`-mtime +7` would mean *more* than 7 days ago — the `+`/`-` prefix means \"more than\"/\"less than,\" genuinely easy to get backward on first use). This is exactly the kind of check a cleanup or backup-rotation script needs: \"find everything older than N days.\"\n```bash\nfind . -maxdepth 1 -size +0c -type f\n```\nOutput:\n```\n./new.txt\n```\n`-size +0c` matches files larger than 0 bytes (`c` for bytes; `k` and `M` work too, for kilobytes/megabytes) — useful for finding genuinely empty files versus ones with real content. A related, often-paired option not shown here, `-newer reference_file`, matches anything modified more recently than `reference_file` — handy for \"what's changed since the last time I ran this.\"\n\n### ⚠️ Common Mistakes\n\n- **Piping `find` into `xargs` without `-print0`/`-0`, on filenames that might contain spaces (or newlines).** As Example 6 shows in vivid, confusing detail, this genuinely breaks — and unlike many Bash gotchas, this one produces *wrong, silent-looking damage* (running `ls`, or worse, `rm`, against fragments of a filename) rather than an obvious crash. Default to `-print0`/`-0` for any `find | xargs` pipeline, always.\n- **Using `-exec` when a large number of matches makes `xargs`'s batching genuinely faster**, or vice versa — reaching for `xargs` when `-exec ... +` (a lesser-known `-exec` variant that also batches, avoiding `xargs` entirely) would keep everything in one tool. For most everyday scripting, either works fine; the batching-versus-per-match distinction mainly matters once result counts get large.\n- **Forgetting the trailing `\\;` after `-exec`'s command**, or forgetting to escape it — without it (or with it unescaped as a bare `;` that Bash swallows as its own command separator, Chapter 1.2), `find` doesn't know where the `-exec` command actually ends.\n- **Running a destructive `xargs` command (like `rm`) without testing the `find` pattern by itself first.** Always run the plain `find ... ` command alone and inspect its output before piping it into anything destructive — a slightly-off `-name` pattern discovered *after* an `xargs rm` has already run is a genuinely bad way to learn a lesson.\n- **Forgetting `find`'s default depth is unlimited**, recursing through every subdirectory unless `-maxdepth` restricts it — surprising, and potentially very slow, on a deep or large directory tree when only the top level was actually intended.\n\n### How this connects\n\n`find`'s glob-style `-name` patterns are exactly Chapter 2.11's globbing syntax, applied to a recursive search instead of the current directory alone. The spaces-in-filenames problem this chapter solves with `-print0`/`-0` is the same fundamental word-splitting issue from Chapter 2.10 and Chapter 1.4, now shown breaking a genuinely common real-world pipeline. `find`/`xargs` complete Part VII's core toolbox alongside `grep`, `sed`, and `awk` — Chapter 7.8 shows all of them combined in realistic, multi-stage pipelines.\n\n### Quick recap\n\n- `find path -name pattern` (glob-style, Chapter 2.11) searches recursively; `-type f`/`-type d` filters by kind; `-maxdepth N` limits recursion depth.\n- `-exec command {} \\;` runs a command once per match; piping into `xargs` instead batches arguments together, generally faster for many matches.\n- **`find ... -print0 | xargs -0 ...` is the safe, correct default** whenever filenames might contain spaces — plain `find | xargs` (no null-byte delimiting) breaks on them, silently and dangerously.\n- `find ... -delete` handles the common \"find and remove\" case directly, without needing `xargs` at all.\n- `-mtime +N` (more than N days old) / `-mtime -N` (less than N days old), `-size +N c/k/M`, and `-newer file` filter by file age and size — the `+`/`-` prefix meaning \"more than\"/\"less than\" is easy to get backward the first time.\n- Always test a `find` pattern's output alone before piping it into anything destructive."}, {"id": "7.5", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 5, "slug": "regular-expressions-in-bash", "fullTitle": "Regular Expressions in Bash", "title": "Regular Expressions in Bash", "md": "### Why this matters\n\n`grep`, `sed`, and `[[ =~ ]]` have all made brief use of \"patterns\" without a full explanation of the actual pattern language behind them: regular expressions (regex). This chapter is that explanation — the common vocabulary shared across nearly every text tool in this book, plus Bash's own built-in regex operator. Regex is a genuinely deep subject on its own; this chapter covers the practical core that handles the overwhelming majority of real matching needs.\n\n### The core idea\n\nA regular expression is a pattern language for describing *shapes* of text, not just literal strings. A handful of symbols carry special meaning:\n\n| Symbol | Meaning |\n|---|---|\n| `.` | any single character |\n| `^` | start of the line |\n| `$` | end of the line |\n| `*` | zero or more of the previous thing |\n| `+` | one or more of the previous thing (extended regex only) |\n| `?` | zero or one of the previous thing (extended regex only) |\n| `[...]` | any one character from this set |\n| `\\|` | alternation — \"this or that\" (extended regex only) |\n\nThe **basic vs. extended** distinction from Chapter 7.1/7.2 matters again here: basic regex (`grep`'s and `sed`'s default) needs `+`, `?`, `\\|`, and `(...)` backslash-escaped to get their special meaning; extended regex (`grep -E`, and Bash's own `[[ =~ ]]`) gives them their special meaning directly, no escaping needed.\n\n### Examples\n\n**1. `.` — any single character.**\n```bash\necho \"cat\" | grep -E \"c.t\"\necho \"cot\" | grep -E \"c.t\"\n```\nBoth match:\n```\ncat\ncot\n```\n`.` stands in for any one character — `c.t` matches `cat`, `cot`, `c!t`, anything with exactly one character between `c` and `t`.\n\n**2. `^` and `$` — anchoring to the start/end of a line.**\n```bash\nprintf \"apple\\npineapple\\napple pie\\n\" | grep -E \"^apple$\"\n```\nOutput:\n```\napple\n```\nWithout the anchors, `apple` alone would also match `pineapple` (contains `apple`) and `apple pie` (starts with `apple`) — `^apple$` requires the *entire line* to be exactly `apple`, nothing more, nothing less.\n\n**3. `?` — zero or one (extended regex).**\n```bash\necho \"color\" | grep -E \"colou?r\"\necho \"colour\" | grep -E \"colou?r\"\n```\nBoth match:\n```\ncolor\ncolour\n```\n`u?` means \"zero or one `u`\" — a classic way to match both American and British spellings with one pattern.\n\n**4. `+` — one or more (extended regex).**\n```bash\necho \"aaa\" | grep -E \"a+\"\n```\nOutput:\n```\naaa\n```\n`a+` matches one or more consecutive `a` characters — genuinely different from `*` (zero or more), which would also match an empty string of `a`s.\n\n**5. Character classes with `[...]`.**\n```bash\necho \"cat123\" | grep -E \"[0-9]+\"\necho \"Hello\" | grep -E \"[A-Z][a-z]+\"\n```\nBoth match:\n```\ncat123\nHello\n```\n`[0-9]+` matches one or more digits; `[A-Z][a-z]+` matches an uppercase letter followed by one or more lowercase letters — exactly the same bracket-range syntax from Chapter 2.11's globbing, reused here inside a genuinely more powerful pattern language.\n\n**6. The basic-regex escaping requirement, confirmed directly.**\n```bash\necho \"ab\" | grep \"a\\|b\"\necho \"ab\" | grep -E \"a|b\"\n```\nBoth match (in this case):\n```\nab\nab\n```\nWithout `-E`, `|` needs a backslash (`\\|`) to mean \"or\" — plain `|` in basic regex is just a literal pipe character. With `-E`, `|` works directly. Both happened to produce the same result here, but the *syntax* required genuinely differs — this is exactly the basic-vs-extended distinction flagged back in Chapters 7.1 and 7.2, now shown concretely.\n\n**7. Bash's own `[[ =~ ]]` — regex matching without any external tool.**\n```bash\nstr=\"user@example.com\"\nif [[ \"$str\" =~ ^[a-zA-Z0-9._]+@[a-zA-Z0-9.]+$ ]]; then\n  echo \"valid-looking email\"\nfi\n```\nOutput:\n```\nvalid-looking email\n```\nAlready previewed in Chapter 3.2 — `[[ =~ ]]` uses **extended** regex syntax directly (no `-E` needed, no escaping for `+`/`?`/`|`), and the pattern on the right side should generally be left unquoted for this to work as regex rather than a literal string comparison.\n\n**8. `BASH_REMATCH` — capturing matched groups from a `[[ =~ ]]` match.**\n```bash\nif [[ \"phone: 555-1234\" =~ ([0-9]{3})-([0-9]{4}) ]]; then\n  echo \"full match: ${BASH_REMATCH[0]}\"\n  echo \"group1: ${BASH_REMATCH[1]}\"\n  echo \"group2: ${BASH_REMATCH[2]}\"\nfi\n```\nOutput:\n```\nfull match: 555-1234\ngroup1: 555\ngroup2: 1234\n```\n`BASH_REMATCH` is a special array (Chapter 2.6) that Bash automatically fills in after a successful `[[ =~ ]]` match — index `0` holds the entire matched text, and `1`, `2`, etc. hold whatever each parenthesized group in the pattern captured. This is a genuinely powerful capability, letting a script extract structured pieces out of matched text without a separate `sed`/`awk` call.\n\n### ⚠️ Common Mistakes\n\n- **Quoting the pattern in `[[ =~ pattern ]]`.** A quoted pattern (`[[ \"$str\" =~ \"^[a-z]+$\" ]]`) is treated as a **literal string** to match against, not a regex — the special characters lose their meaning entirely. Leave the right-hand pattern unquoted for `[[ =~ ]]` to actually treat it as regex.\n- **Forgetting the basic-vs-extended distinction and being confused why `+`/`?`/`|` \"don't work\" in plain `grep` or `sed`.** As Example 6 shows, they need escaping in basic regex, or you need `-E` (`grep`) to get the direct behavior. This single distinction accounts for a large share of \"my regex isn't working\" confusion for people used to only ever seeing extended-style regex elsewhere.\n- **Using `.` when a literal period was actually meant.** `.` matches *any* character, including an actual period — matching a real dot specifically requires escaping it (`\\.`), a very common oversight when matching things like filenames or IP addresses.\n- **Being too greedy (or not greedy enough) with `*`/`+`.** Regex quantifiers match as much as they possibly can by default (\"greedy\") — a pattern like `<.*>` against `<a><b>` matches the *entire* `<a><b>` as one match, not just `<a>`, which surprises people expecting the shortest possible match.\n- **Reaching for regex when a simpler tool (a glob, Chapter 2.11, or plain string comparison, Chapter 2.1) would do the whole job more simply and readably.** Regex is powerful, but that power comes with real complexity cost — worth reserving for when the matching genuinely needs it.\n\n### How this connects\n\nThis chapter is the shared foundation underneath `grep` (7.1), `sed` (7.2), and Bash's own `[[ =~ ]]` (previewed in 3.2) — one pattern vocabulary, several different tools applying it. `BASH_REMATCH` extends the array knowledge from Chapter 2.6 into a genuinely powerful text-extraction tool. Chapter 7.8, next-but-one, shows regex-powered tools working together in complete, realistic pipelines.\n\n### Quick recap\n\n- Regex describes *shapes* of text: `.` (any character), `^`/`$` (line start/end), `*`/`+`/`?` (repetition), `[...]` (character sets), `|` (alternation).\n- **Basic regex** (`grep`/`sed` default) needs `+`, `?`, `|`, `(...)` backslash-escaped for their special meaning; **extended regex** (`grep -E`, `[[ =~ ]]`) gives them that meaning directly.\n- `[[ \"$str\" =~ pattern ]]` matches using extended regex — leave the pattern **unquoted** for this to work correctly.\n- `BASH_REMATCH` is automatically filled after a successful `[[ =~ ]]` match — index `0` is the full match, `1`, `2`, ... are captured groups from parentheses in the pattern."}, {"id": "7.6", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 6, "slug": "cut-sort-uniq-tr", "fullTitle": "`cut`, `sort`, `uniq`, `tr` & Other Text Tools", "title": "`cut`, `sort`, `uniq`, `tr` & Other Text Tools", "md": "### Why this matters\n\nNot every text-processing job needs `awk`'s full power or `sed`'s pattern substitution — a huge number of everyday tasks are simpler than that: pull out one column, put lines in order, remove duplicates, swap one character set for another. These four small, focused tools do exactly one job each, extremely well, and chaining a couple of them together (Chapter 7.8 shows this properly) often beats reaching for a heavier tool.\n\n### The core idea\n\n- **`cut`** — extract specific columns/fields or character ranges from each line.\n- **`sort`** — put lines into order (alphabetical by default, numeric or reverse with flags).\n- **`uniq`** — remove or count *adjacent* duplicate lines — meaning it almost always needs sorted input first to be useful.\n- **`tr`** — translate, delete, or squeeze individual characters (not whole words or patterns — that's `sed`'s job).\n\n### Examples\n\n**1. `cut` by delimiter and field.**\n```bash\ncut -d',' -f1 people.csv\ncut -d',' -f1,3 people.csv\n```\nGiven a CSV with rows like `Alice,30,Engineer`:\n```\nAlice\nBob\nCarol\n```\n```\nAlice,Engineer\nBob,Designer\nCarol,Manager\n```\n`-d','` sets the delimiter, `-f1` selects field 1, `-f1,3` selects fields 1 and 3 (comma-separated field list) — output keeps the original delimiter between selected fields.\n\n**2. `cut` by character position.**\n```bash\necho \"Hello World\" | cut -c1-5\n```\nOutput:\n```\nHello\n```\n`-c1-5` takes characters 1 through 5, regardless of any delimiter — useful for fixed-width text rather than delimited fields.\n\n**3. `sort` — alphabetical by default.**\n```bash\nprintf \"banana\\napple\\ncherry\\n\" | sort\n```\nOutput:\n```\napple\nbanana\ncherry\n```\n\n**4. `sort -n` — numeric order, genuinely different from alphabetical.**\n```bash\nprintf \"10\\n2\\n33\\n4\\n\" | sort\nprintf \"10\\n2\\n33\\n4\\n\" | sort -n\n```\nOutput:\n```\n10\n2\n33\n4\n```\n```\n2\n4\n10\n33\n```\nWithout `-n`, `sort` compares these as *text*, so `\"10\"` sorts before `\"2\"` (because the character `'1'` comes before `'2'`) — exactly the same string-vs-numeric distinction from Chapter 2.4/3.2, now showing up in a real tool. `-n` fixes this by comparing the actual numeric value instead.\n\n**5. `sort -r` — reverse order.**\n```bash\nprintf \"a\\nc\\nb\\n\" | sort -r\n```\nOutput:\n```\nc\nb\na\n```\n\n**6. `sort -k` — sort by a specific field, not the whole line.**\n```bash\nprintf \"Alice 30\\nBob 25\\nCarol 35\\n\" | sort -k2 -n\n```\nOutput:\n```\nBob 25\nAlice 30\nCarol 35\n```\n`-k2` sorts by the 2nd whitespace-separated field (age); combined with `-n` for genuinely numeric comparison, this correctly orders by age rather than by the whole line's text.\n\n**7. `uniq` — removing adjacent duplicate lines.**\n```bash\nprintf \"a\\na\\nb\\nb\\nb\\nc\\n\" | uniq\n```\nOutput:\n```\na\nb\nc\n```\n\n**8. `uniq -c` — counting occurrences.**\n```bash\nprintf \"a\\na\\nb\\nb\\nb\\nc\\n\" | uniq -c\n```\nOutput:\n```\n      2 a\n      3 b\n      1 c\n```\nPrefixes each line with how many consecutive times it appeared — this exact pairing (`sort | uniq -c`) is one of the single most common Unix idioms for \"count how many times each distinct value appears.\"\n\n**9. The critical gotcha: `uniq` only catches *adjacent* duplicates.**\n```bash\nprintf \"a\\nb\\na\\n\" | uniq\n```\nOutput — unchanged, all three lines still present:\n```\na\nb\na\n```\nThe two `a`s aren't adjacent (a `b` sits between them), so `uniq` doesn't consider them duplicates at all. This is exactly why `sort | uniq` is the standard combination — `sort` groups identical lines together first, *then* `uniq` can actually catch them all.\n\n**10. `tr` — translating one set of characters to another.**\n```bash\necho \"hello\" | tr 'a-z' 'A-Z'\n```\nOutput:\n```\nHELLO\n```\nThis is the exact tool Chapter 1.4 used in its very first quoting example, now properly explained: `tr` maps each character in the first set to the corresponding character in the second set, position by position.\n\n**11. `tr -d` — deleting characters.**\n```bash\necho \"h e l l o\" | tr -d ' '\n```\nOutput:\n```\nhello\n```\nEvery character in the given set is simply removed, wherever it appears.\n\n**12. `tr -s` — squeezing repeated consecutive characters into one.**\n```bash\necho \"aaa   bbb\" | tr -s ' '\n```\nOutput:\n```\naaa bbb\n```\nMultiple consecutive spaces collapse into a single one — useful for cleaning up inconsistently-spaced text before further processing (like feeding it into `cut` or `awk`, which typically assume single-space-separated fields).\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `sort -n` for numeric data.** As Example 4 shows starkly, plain `sort` on numbers produces a genuinely wrong-looking order — this trips up nearly everyone the first time they sort a list of numbers as plain text.\n- **Running `uniq` on unsorted data and expecting it to remove all duplicates.** As Example 9 demonstrates, `uniq` only ever looks at *adjacent* lines — always `sort` first unless the data is already known to be grouped.\n- **Confusing `tr`'s character-by-character translation with `sed`'s pattern-based substitution.** `tr 'ab' 'xy'` replaces every `a` with `x` and every `b` with `y`, independently, character by character — it cannot match multi-character patterns or whole words the way `sed`'s `s///` can. Reach for `sed` the moment the replacement needs to consider more than one character at a time.\n- **Using `cut -f` on data that isn't consistently delimited.** `cut` splits strictly on the exact delimiter given — inconsistent spacing (some fields separated by one space, others by several) breaks `cut -d' '` in ways `awk`'s more flexible default whitespace-splitting (Chapter 7.3) wouldn't. `tr -s ' '` (Example 12) is a common fix specifically for this before `cut`.\n- **Forgetting `sort -k` field numbers refer to whitespace-separated fields by default**, and that a different delimiter needs its own flag (`sort -t',' -k2` for comma-separated data) — assuming `-k2` \"just knows\" about a CSV's structure without being told is a common oversight.\n\n### How this connects\n\nThese four tools round out the practical text-processing toolbox alongside `grep`, `sed`, `awk`, and `find`/`xargs` — together, this is the core Unix toolkit this book has treated as fully in scope from the start. `sort | uniq -c` in particular is one of the idioms Chapter 7.8 leans on heavily when combining tools into complete, realistic pipelines. Chapter 7.7, next, tours several more small, genuinely useful utility commands that round things out further.\n\n### Quick recap\n\n- `cut -d'delim' -f1,3` extracts specific delimited fields; `cut -c1-5` extracts by character position.\n- `sort` orders lines alphabetically by default; `-n` for numeric order, `-r` for reverse, `-k N` to sort by a specific field.\n- `uniq` removes/counts (`-c`) **adjacent** duplicate lines only — always `sort` first for genuinely unsorted data.\n- `tr 'set1' 'set2'` translates characters one-to-one; `-d` deletes characters; `-s` squeezes repeated characters into one.\n- `sort | uniq -c` is the standard idiom for counting how many times each distinct value appears in a list."}, {"id": "7.7", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 7, "slug": "a-tour-of-useful-utility-commands", "fullTitle": "A Tour of Useful Utility Commands", "title": "A Tour of Useful Utility Commands", "md": "### Why this matters\n\nBeyond the major tools Part VII has covered so far, there's a set of smaller, single-purpose commands that show up constantly in real scripts — getting the current date, counting things, working with file paths, generating a range of numbers, creating a safe temporary file. None of these deserve a full chapter alone, but each is genuinely useful enough to know cold. This chapter is that practical tour.\n\n### The core idea\n\nSix small, focused tools: **`date`** (current date/time, formatted however you need), **`wc`** (count lines/words/characters), **`basename`/`dirname`** (split a file path into its filename and directory parts), **`tee`** (already met briefly in Chapter 5.3 — view and save output simultaneously), **`seq`** (generate a sequence of numbers), and **`mktemp`** (create a temporary file or directory safely).\n\n### Examples\n\n**1. `date` — current date and time, with custom formatting.**\n```bash\ndate\ndate +\"%Y-%m-%d\"\ndate +\"%H:%M:%S\"\n```\nOutput (will differ based on when/where run):\n```\nSun Sep  6 01:18:40 AM EDT 2026\n2026-09-06\n01:18:40\n```\nPlain `date` gives a full human-readable timestamp; `+\"format\"` lets you specify exactly which pieces you want — `%Y` (4-digit year), `%m` (month), `%d` (day), `%H`/`%M`/`%S` (hour/minute/second) are the ones you'll use most, genuinely useful for building log filenames or timestamps in output.\n\n**2. `wc` — counting lines, words, and characters.**\n```bash\nwc -l file.txt\nwc -w file.txt\nwc -c file.txt\n```\nGiven a 3-line file, each line one word:\n```\n3 file.txt\n3 file.txt\n18 file.txt\n```\n`-l` (lines), `-w` (words), `-c` (bytes/characters) — you've already used `wc -l` throughout this book (Chapter 5.5, for instance) without a full explanation; this is that explanation. Without any flag, plain `wc` prints all three counts at once.\n\n**3. `basename` and `dirname` — splitting a path into its parts.**\n```bash\nbasename /home/user/documents/report.txt\ndirname /home/user/documents/report.txt\n```\nOutput:\n```\nreport.txt\n/home/user/documents\n```\nThis is exactly the job Chapter 2.2's `${path##*/}` and Chapter 6.7's directory-finding idiom did manually with parameter expansion — `basename`/`dirname` do the same thing more readably, as dedicated commands.\n\n**4. `basename` can also strip a known suffix.**\n```bash\nbasename /home/user/documents/report.txt .txt\n```\nOutput:\n```\nreport\n```\nA second argument to `basename` is treated as a suffix to remove if present — genuinely handy for stripping a known file extension in one step.\n\n**5. `tee` — a proper explanation of the tool Chapter 5.3 briefly used.**\n```bash\necho \"logme\" | tee output.txt\ncat output.txt\n```\nOutput:\n```\nlogme\nlogme\n```\nAs Chapter 5.3 showed, `tee` writes its input both to the named file *and* back out to its own stdout — the first `logme` is `tee` passing the input through to the terminal, the second is `cat` reading it back from the file it saved.\n\n**6. `seq` — generating a sequence of numbers.**\n```bash\nseq 1 5\nseq 0 2 10\n```\nOutput:\n```\n1\n2\n3\n4\n5\n```\n```\n0\n2\n4\n6\n8\n10\n```\n`seq start end` counts by 1; `seq start step end` counts by a custom step. Genuinely useful piped into a `while read` loop, or substituted for a brace expansion (Chapter 2.11) when the range needs to come from a variable rather than being written out literally (brace expansion doesn't accept variables for its range, but `seq` happily does: `seq 1 \"$n\"`).\n\n**7. `mktemp` — creating a safe, uniquely-named temporary file or directory.**\n```bash\ntmpfile=$(mktemp)\necho \"created: $tmpfile\"\n```\nOutput (the exact name will differ every run):\n```\ncreated: /tmp/tmp.5BYpmInmTn\n```\n`mktemp` creates an empty file with a guaranteed-unique name in the system's temp directory and prints its path — critically, it actually **creates** the file (not just generates a name), which avoids a real security/reliability problem: if a script instead just guessed a name like `/tmp/myscript_temp`, another process (or another concurrent run of the same script) could create or tamper with a file at that exact guessed path first. `mktemp -d` does the same thing for a temporary *directory* instead.\n\n### ⚠️ Common Mistakes\n\n- **Constructing a \"temporary\" filename manually** (`tmpfile=\"/tmp/myscript_$$\"`, using the process ID from Chapter 2.9) instead of using `mktemp`. This is genuinely less safe — `mktemp` guarantees the name didn't already exist and creates it atomically, closing a real, if narrow, race-condition window that a manually constructed name leaves open.\n- **Forgetting to clean up a `mktemp`-created file or directory.** Since `mktemp` doesn't clean up after itself, pairing it with `trap ... EXIT` (Chapter 5.6) to guarantee removal — no matter how the script ends — is the standard, responsible pattern.\n- **Using `date` without a format string when a script needs a *specific*, parseable format** (for a filename, a log entry, a comparison). Plain `date`'s default human-readable format is inconsistent to parse back out — always use `date +\"...\"` with an explicit format when the output needs to be predictable or machine-readable.\n- **Forgetting `wc`'s default output includes the filename**, which can trip up a script that expects just the bare number — `wc -l < file.txt` (redirecting the file as *stdin*, rather than passing it as an argument) sidesteps this, since `wc` then has no filename to report and prints just the count.\n- **Assuming `basename`/`dirname` handle a path with a trailing slash the way you'd expect.** Edge cases like `dirname /home/user/` can be less intuitive than a clean path — worth a quick manual check on a genuinely unusual path if precision here really matters.\n\n### How this connects\n\nSeveral of these tools (`basename`/`dirname` especially) directly parallel parameter-expansion patterns from Chapter 2.2 and the `SCRIPT_DIR` idiom from Chapter 6.7 — same jobs, more readable dedicated commands. `mktemp` paired with `trap` (Chapter 5.6) becomes a core building block in Chapter 8.5's treatment of writing robust, re-runnable scripts. `tee`, already used once in Chapter 5.3, gets its full explanation here. Chapter 7.8, next, shows many of Part VII's tools — including several from this tour — combined into complete, realistic pipelines.\n\n### Quick recap\n\n- `date +\"%Y-%m-%d\"` — current date/time with a custom, predictable format; always specify a format for anything a script needs to parse back.\n- `wc -l`/`-w`/`-c` — count lines/words/bytes; `wc -l < file` (stdin, not an argument) avoids the filename appearing in the output.\n- `basename path [suffix]` and `dirname path` — split a path into filename and directory parts, optionally stripping a known suffix.\n- `tee file` — writes input both to a file and back to stdout, letting you view and save output simultaneously.\n- `seq start [step] end` — generates a number sequence; useful when a range needs to come from a variable, unlike brace expansion.\n- `mktemp` / `mktemp -d` — creates a genuinely safe, uniquely-named temp file/directory; pair with `trap ... EXIT` (Chapter 5.6) to guarantee cleanup."}, {"id": "7.8", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 8, "slug": "piping-it-all-together", "fullTitle": "Piping It All Together: Building Command Pipelines", "title": "Piping It All Together: Building Command Pipelines", "md": "### Why this matters\n\nEvery tool in Part VII so far has been shown mostly in isolation. Real Bash mastery shows up in *combining* them — a short chain of `grep | cut | sort | uniq -c` genuinely replaces what would otherwise be dozens of lines of manual parsing in almost any other language. This chapter is deliberately light on new syntax and heavy on demonstrating the actual skill: reading a real problem and recognizing which small tools, chained together, solve it.\n\n### The core idea\n\nThere's no new mechanism here — just the pipe (`|`, Chapter 5.3) connecting the tools Part VII has already covered. The real skill is decomposition: breaking \"I need to know the top 3 most frequent values in this data\" into a sequence of small, individually simple steps, each handled by the tool best suited to it. A genuinely common shape you'll recognize by the end of this chapter:\n```bash\nextract-the-relevant-part | sort | uniq -c | sort -rn\n```\n\"Get the values I care about, group identical ones together, count them, then show the most common first\" — this exact pattern (or a close variant of it) solves a surprising fraction of real-world text-analysis problems.\n\n### Examples\n\nWorking from a small sample web server log, with lines shaped like:\n```\n192.168.1.1 - GET /home 200\n192.168.1.2 - GET /about 404\n192.168.1.1 - POST /login 200\n192.168.1.3 - GET /home 200\n192.168.1.1 - GET /home 200\n```\n\n**1. Finding the most frequent requesting IP addresses.**\n```bash\nawk '{print $1}' access.log | sort | uniq -c | sort -rn\n```\nOutput:\n```\n      3 192.168.1.1\n      1 192.168.1.3\n      1 192.168.1.2\n```\nFour stages, each doing one simple job: `awk` extracts just the first field (the IP); `sort` groups identical IPs together (required before `uniq` can work, Chapter 7.6); `uniq -c` counts each group; the second `sort -rn` orders the results by count, highest first (`-r` reverse, `-n` numeric — both from Chapter 7.6).\n\n**2. Finding all failed requests (404s) and reporting just the IP and path.**\n```bash\ngrep \" 404\" access.log | awk '{print $1, $4}'\n```\nOutput:\n```\n192.168.1.2 /about\n```\n`grep` filters down to just the lines that matter; `awk` then extracts only the two fields worth reporting from those filtered lines. Notice the division of labor: `grep` for \"which lines,\" `awk` for \"which parts of those lines.\"\n\n**3. Listing every distinct page that was requested.**\n```bash\nawk '{print $4}' access.log | sort -u\n```\nOutput:\n```\n/about\n/home\n/login\n```\n`sort -u` is a genuinely handy shortcut: `sort` combined with `-u` (unique) does `sort | uniq` in a single command, when you don't need `uniq`'s counting behavior — just the deduplication.\n\n**4. A more complete report: which pages were requested via GET, and how often.**\n```bash\ngrep \"GET\" access.log | cut -d' ' -f4 | sort | uniq -c | sort -rn\n```\nOutput:\n```\n      3 /home\n      1 /about\n```\nFive stages: filter to `GET` requests only, extract field 4 (the path) with `cut` this time instead of `awk` (either would work here — `cut` is a perfectly reasonable, slightly lighter-weight choice when the extraction is this simple), then the same group/count/order pattern from Example 1.\n\n**5. Word frequency analysis on plain text — the exact same pattern, applied to something completely different.**\n```bash\necho \"the quick brown fox jumps over the lazy dog the fox runs\" | tr ' ' '\\n' | sort | uniq -c | sort -rn | head -3\n```\nOutput:\n```\n      3 the\n      2 fox\n      1 runs\n```\n`tr ' ' '\\n'` (Chapter 7.6) turns space-separated words into one-per-line, which is exactly the shape `sort | uniq -c` needs to work with — then `head -3` (which you'll recognize even without having seen it named yet — \"show just the first N lines,\" `tail` being its end-of-output counterpart) trims the result to just the top 3. This is genuinely the same core pattern as Example 1, applied to word frequency instead of IP frequency — recognizing that similarity is the actual skill this chapter is trying to build.\n\n### ⚠️ Common Mistakes\n\n- **Trying to solve everything in a single tool rather than composing several simple ones.** A single, dense `awk` script *can* replicate what `grep | cut | sort | uniq -c` does across four tools — but the four-stage pipeline is often easier to write correctly on the first try, and easier for someone else (or future you) to read and modify one stage at a time.\n- **Forgetting `sort` needs to come before `uniq`**, exactly as Chapter 7.6 warned — this is the single most common way a pipeline like this silently produces wrong counts.\n- **Building a long pipeline all at once without testing intermediate stages.** When a 5-stage pipeline doesn't produce the expected result, the practical debugging technique is to run it up through just the first stage, check that output looks right, then add the second stage, and so on — rather than staring at the whole chain trying to spot the problem by inspection.\n- **Reaching for `sort | uniq -c | sort -rn` when `sort -u` (Example 3) would do**, if counting was never actually needed — the shorter form is clearer when deduplication alone is the goal.\n- **Not considering whether a step is even necessary.** Every stage in a pipeline costs a small amount of overhead (a new process) — a pipeline that includes an unnecessary `cat` (Chapter 5.3's \"useless use of cat\" note) or a redundant filtering step is worth trimming once the logic is confirmed correct.\n\n### How this connects\n\nThis chapter is a deliberate synthesis point — every tool it combines (`grep`, `awk`, `cut`, `sort`, `uniq`, `tr`) was introduced individually earlier in Part VII, and the pipe mechanism itself is Chapter 5.3's. Chapter 7.9, next, turns to writing all of this — pipelines included — in a genuinely clean, well-styled way, and Chapter 7.10/7.11 add `curl` and `jq` to this same toolbox for working with live web APIs and JSON data.\n\n### Quick recap\n\n- Real Bash text-processing power comes from **composing** small, focused tools with pipes, not finding one tool that does everything.\n- `extract | sort | uniq -c | sort -rn` is a genuinely common, reusable pattern: get the relevant values, group identical ones, count them, show the most frequent first.\n- `sort -u` is a shortcut for `sort | uniq` when only deduplication (not counting) is needed.\n- Test a pipeline incrementally, one stage at a time, rather than writing the whole chain before running any of it.\n- Choosing between `awk`/`cut`/`grep` for a given stage is often a matter of which reads most simply for that specific job — all three frequently overlap in what they *can* do."}, {"id": "7.9", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 9, "slug": "bash-style-shellcheck-best-practices", "fullTitle": "Bash Style: ShellCheck, Quoting Discipline & Best Practices", "title": "Bash Style: ShellCheck, Quoting Discipline & Best Practices", "md": "### Why this matters\n\nThis book has flagged dozens of specific gotchas one at a time — unquoted variables, `IFS` surprises, the `2>&1` ordering trap, and more. **ShellCheck** is a real tool that catches an enormous share of these automatically, before a script ever runs, by statically analyzing the code and pointing out exactly what's wrong and why. This chapter introduces it properly, and consolidates the style habits this book has been building toward chapter by chapter into one clear checklist.\n\n### The core idea\n\nShellCheck is a free, widely-used static analysis tool for shell scripts — it reads a script without running it and flags likely bugs, each with a specific code (like `SC2086`) and a link to a detailed explanation. Running it on every script you write, as a habit, catches exactly the class of mistakes this book has spent dozens of \"Common Mistakes\" sections warning about — often before you'd ever notice them yourself.\n\nUnlike every tool used so far in this book, ShellCheck doesn't ship with Bash or a base coreutils install on any platform — it needs to be installed separately first (`apt install shellcheck`, `brew install shellcheck`, or a direct download, depending on the system). Check whether it's already present with `shellcheck --version` before assuming the `shellcheck` command below is just available.\n\n### Examples\n\n**1. A script with several real, common problems.**\n```bash\n#!/bin/bash\nname=$1\nif [ $name == \"\" ]; then\n  echo \"no name\"\nfi\nfor f in $(ls *.txt)\ndo\n  echo $f\ndone\n```\nRunning `shellcheck bad.sh`:\n```\nIn bad.sh line 3:\nif [ $name == \"\" ]; then\n     ^---^ SC2086 (info): Double quote to prevent globbing and word splitting.\n\nIn bad.sh line 6:\nfor f in $(ls *.txt)\n         ^---------^ SC2045 (error): Iterating over ls output is fragile. Use globs.\n              ^-- SC2035 (info): Use ./*glob* or -- *glob* so names with dashes won't become options.\n\nIn bad.sh line 8:\n  echo $f\n       ^-- SC2086 (info): Double quote to prevent globbing and word splitting.\n```\nThree genuinely real issues, all covered in earlier chapters: unquoted `$name` (Chapter 1.4/2.1), the classic `for f in $(ls ...)` anti-pattern instead of a plain glob (Chapter 3.4's warning, named precisely here), and an unquoted loop variable. ShellCheck found all three instantly, with exact line numbers and explanations.\n\n**2. The corrected version — clean.**\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\n\nname=\"$1\"\nif [ \"$name\" == \"\" ]; then\n  echo \"no name\"\nfi\nfor f in ./*.txt; do\n  echo \"$f\"\ndone\n```\nRunning `shellcheck good.sh` produces no output at all, and exits `0` — a clean report. Every fix here is something this book already taught: quoted variables (Chapters 1.4, 2.1), a plain glob instead of parsing `ls` output (Chapter 3.4), `#!/usr/bin/env bash` (Chapter 1.1), and `set -euo pipefail` (Chapter 5.6).\n\n### A consolidated style checklist\n\nThis book has taught each of these individually; here they are together, as the habits a well-written script should reflexively follow:\n\n- **Shebang:** `#!/usr/bin/env bash` (Chapter 1.1) — not a bare `#!/bin/bash`, for portability.\n- **Strict mode:** `set -euo pipefail` near the top (Chapter 5.6), for scripts beyond the most trivial.\n- **Quote your variables:** `\"$var\"`, always, by default (Chapters 1.4, 2.1) — the single highest-value habit in this entire list.\n- **Prefer `[[ ]]` over `[ ]`** for conditions in new scripts (Chapter 3.2) — safer quoting behavior, more capability.\n- **Use `local`** for every function-scoped variable (Chapter 4.4) — never let a function accidentally leak into global state.\n- **Never pipe into a `while read` (or any loop) that needs to modify a variable afterward** — redirect instead (Chapter 3.5, Chapter 6.3).\n- **Prefer a plain glob over parsing `ls` output** (Chapter 3.4) — `for f in *.txt`, not `for f in $(ls *.txt)`.\n- **Use `$(...)` over backticks** for command substitution (Chapter 2.8) — clearer, nests without escaping.\n- **Check `[ -f file ]`/`[ -d dir ]`** before acting on a path that might not exist (Chapter 3.2, 5.5).\n- **Use `mktemp`**, never a manually guessed temp filename (Chapter 7.7).\n- **Use meaningful, consistent naming**: `lowercase_with_underscores` for ordinary variables, `ALL_CAPS` reserved for environment/exported variables (Chapter 1.3), descriptive function names.\n- **Comment the *why*, not the *what*** (Chapter 1.2) — code already says what it does; a comment earns its place explaining a non-obvious reason.\n\n### ⚠️ Common Mistakes\n\n- **Not running ShellCheck at all, on the assumption that \"the script works\" is proof enough.** As Example 1 shows, a script can run without any visible error while still containing exactly the kind of latent bug (unquoted variables, fragile `ls` parsing) that only shows up later, on different input, on a different system, or with a filename containing a space.\n- **Dismissing ShellCheck's `info`-level suggestions as unimportant, only fixing `error`-level ones.** Several of the most consequential bugs this book has covered (SC2086's unquoted-variable warning, most notably) are flagged at `info` severity, not `error` — severity level here is about ShellCheck's confidence something is definitely wrong, not about how much damage the issue can actually cause.\n- **Applying a style rule mechanically without understanding why it exists.** Every item in the checklist above traces back to a specific, concrete failure mode covered earlier in this book — the value is in recognizing *when* a habit matters, not reciting the checklist by rote.\n- **Fighting ShellCheck's suggestion instead of understanding it.** Every warning links to a detailed wiki explanation (`https://www.shellcheck.net/wiki/SCxxxx`) — worth actually reading the first few times a given code appears, rather than blindly applying whatever fix silences it.\n- **Treating strict mode (`set -euo pipefail`) and ShellCheck as substitutes for testing.** Both catch real, common classes of bugs — neither catches a genuinely wrong algorithm or a misunderstood requirement. Chapter 8.2 covers testing Bash scripts properly.\n\n### How this connects\n\nThis chapter is a deliberate synthesis point for the entire book so far — every item in the style checklist traces directly back to a specific earlier chapter's lesson, and ShellCheck is the practical tool that turns \"remembering all these rules\" into \"letting a tool check for you.\" Chapter 8.1 (Debugging) and Chapter 8.3 (Common Pitfalls) build directly on this foundation, and Chapter 8.5 (Writing Robust, Re-runnable Scripts) treats this checklist as a baseline to build further on.\n\n### Quick recap\n\n- **ShellCheck** is a real, widely-used static analysis tool — run it on every script; it catches an enormous share of the specific mistakes this book has warned about, automatically, before the script even runs.\n- Each warning has a code (like `SC2086`) and a linked, detailed explanation — worth reading, not just silencing.\n- Don't dismiss `info`-level warnings as unimportant — severity reflects confidence, not potential impact.\n- The consolidated checklist above (shebang, strict mode, quoting, `[[ ]]`, `local`, avoiding `ls`-parsing, `mktemp`, meaningful naming, purposeful comments) is this book's complete, practical style baseline — every item traces back to a specific chapter's lesson."}, {"id": "7.10", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 10, "slug": "curl-apis-downloads", "fullTitle": "`curl` & Working with APIs/Downloads from Bash", "title": "`curl` & Working with APIs/Downloads from Bash", "md": "### Why this matters\n\nA huge amount of real-world scripting eventually needs to talk to the internet — checking whether a service is up, downloading a file, calling a web API. `curl` is the standard tool for exactly this, and it's genuinely everywhere: pre-installed on nearly every Linux and Mac system, and available on Windows too. This chapter covers the practical core that handles the overwhelming majority of real `curl` use in scripts.\n\n**A note before diving in:** unlike every other chapter in this book, the examples here depend on things outside the script itself — a live internet connection, and `httpbin.org` (a free, public, third-party service) actually being reachable. If a command below produces a connection error or times out instead of the shown output, that's very likely the network or that service, not a mistake in the command — the underlying `curl` flags and behavior are what matters and will work identically against any other real URL.\n\n### The core idea\n\n```bash\ncurl URL\n```\nFetches whatever's at `URL` and prints it to stdout — genuinely that simple as a starting point. From there, a small set of flags cover almost everything a script needs: `-s` (silent, suppress progress output — almost always wanted in a script), `-o file` (save to a file instead of printing), `-I` (headers only), `-X METHOD` (choose the HTTP method, like `POST`), `-d data` (send data with a request), `-H \"Header: value\"` (add a custom header), and `-w \"format\"` (print specific information about the request afterward, like its status code).\n\n### Examples\n\n**1. A basic request.**\n```bash\ncurl -s https://httpbin.org/get\n```\nOutput (a live JSON response — `httpbin.org` is a public service that echoes back exactly what it received, genuinely useful for learning and testing):\n```json\n{\n  \"args\": {},\n  \"headers\": {\n    \"Accept\": \"*/*\",\n    \"Host\": \"httpbin.org\",\n    \"User-Agent\": \"curl/8.5.0\"\n  },\n  \"origin\": \"98.3.8.110\",\n  \"url\": \"https://httpbin.org/get\"\n}\n```\n`-s` (silent) suppressed `curl`'s normal progress meter, which would otherwise clutter a script's output — a near-universal flag to include in scripted `curl` calls.\n\n**2. Saving output to a file with `-o`.**\n```bash\ncurl -s -o downloaded.json https://httpbin.org/get\nls -la downloaded.json\n```\nOutput:\n```\n-rw-rw-r-- 1 you you 251 Sep  6 01:21 downloaded.json\n```\nRather than printing the response, `-o file` writes it directly to disk — the standard way to download something with `curl`.\n\n**3. Headers only, with `-I`.**\n```bash\ncurl -sI https://httpbin.org/get\n```\nOutput:\n```\nHTTP/2 200\ndate: Sun, 06 Sep 2026 05:21:56 GMT\ncontent-type: application/json\ncontent-length: 251\nserver: gunicorn/19.9.0\n```\nUseful for quickly checking a URL's status or metadata without downloading its full content — `HTTP/2 200` confirms the request succeeded (`200`), and `content-type` tells you what kind of data would come back.\n\n**4. Checking just the HTTP status code — genuinely useful in scripts.**\n```bash\ncurl -s -o /dev/null -w \"%{http_code}\\n\" https://httpbin.org/status/404\ncurl -s -o /dev/null -w \"%{http_code}\\n\" https://httpbin.org/status/200\n```\nOutput:\n```\n404\n200\n```\nThis combination — discard the actual response body (`-o /dev/null`) but print a specific piece of information about the request (`-w \"%{http_code}\"`) — is the standard pattern for scripts that need to check \"did this succeed?\" without caring about the response content itself. `-w` accepts several other placeholders (total time taken, download size, and more) beyond `http_code`.\n\n**5. Sending a POST request with data.**\n```bash\ncurl -s -X POST -d \"name=Alex&age=30\" https://httpbin.org/post\n```\nOutput (relevant portion):\n```json\n{\n  \"form\": {\n    \"age\": \"30\",\n    \"name\": \"Alex\"\n  },\n  ...\n}\n```\n`-X POST` sets the HTTP method; `-d \"key=value&key2=value2\"` sends form-encoded data with the request — `httpbin.org` echoes back exactly what it received, confirming both fields arrived correctly.\n\n**6. Adding a custom header with `-H`.**\n```bash\ncurl -s -H \"X-Test-Header: hello\" https://httpbin.org/headers\n```\nOutput (relevant portion):\n```json\n\"X-Test-Header\": \"hello\"\n```\n`-H` is how you'd add an API key, an authentication token, or any other required header a real API expects — repeat `-H` for each additional header needed.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `-s` in a script**, letting `curl`'s progress meter clutter output or get captured accidentally by `$(...)` (Chapter 2.8) alongside the actual response.\n- **Checking only whether `curl` itself succeeded (`$?`), not the HTTP status code.** `curl`'s own exit status reflects whether it could make a connection and complete the request — it reports success (`0`) even for a `404` or `500` response, since as far as `curl` is concerned, it successfully received *an* answer. Use `-w \"%{http_code}\"` (Example 4) when the script actually needs to know whether the request was *accepted*, not just completed.\n- **Forgetting quotes around a URL containing special characters** (like `&` or `?` with query parameters) — an unquoted URL with an `&` in it gets torn apart by Bash's own background-job syntax (Chapter 6.4) before `curl` ever sees it. Always quote a URL, especially one built from a variable.\n- **Not capturing both the response body and the status code when a script genuinely needs both.** A common, correct pattern: save the response to a variable or file with one call, then check status separately with a `-w`-equipped call, or use `-w` alongside `-o file` in a single call to get both at once.\n- **Hardcoding sensitive values (API keys, tokens) directly into a script's `-H` header**, especially one that might be shared or committed to version control. Read secrets from an environment variable (Chapter 6.1) or a separate, appropriately-protected file instead.\n\n### How this connects\n\n`curl`'s output is just text like any other command's — everything from `grep`/`sed`/`awk` (7.1–7.3) to command substitution (2.8) works on it exactly the same way. The JSON responses in these examples are exactly what Chapter 7.11's `jq` is built to parse properly — reaching for `grep`/`sed`/`cut` on JSON (as this chapter's examples informally did, just eyeballing the relevant portion) works for quick checks, but genuinely falls apart on anything structurally complex, which is precisely the gap `jq` fills next.\n\n### Quick recap\n\n- `curl -s URL` fetches a URL's content, suppressing the progress meter — the standard script-friendly starting point.\n- `-o file` saves output to a file; `-I` fetches headers only; `-X METHOD` sets the HTTP method; `-d data` sends request data; `-H \"Header: value\"` adds a custom header.\n- `-o /dev/null -w \"%{http_code}\\n\"` is the standard pattern for checking just a request's HTTP status code.\n- `curl`'s own exit status reflects whether the request *completed*, not whether the server returned success — check the actual status code separately when that distinction matters.\n- Always quote a URL, especially one containing `&`, `?`, or built from a variable."}, {"id": "7.11", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the Unix toolbox & ShellCheck", "chapNum": 11, "slug": "jq-parsing-json", "fullTitle": "`jq`: Parsing JSON from the Command Line", "title": "`jq`: Parsing JSON from the Command Line", "md": "### Why this matters\n\nChapter 7.10 closed with a gap: `curl`'s JSON responses were parsed by eyeballing the output, which works for a quick look but falls apart the moment a script needs to reliably extract a specific value. JSON is the dominant format for web APIs, and `jq` is the standard tool for querying it from the command line — reach for it any time `curl`'s output (or any JSON data) needs real, structured extraction rather than fragile text-scraping with `grep`/`sed`.\n\n### The core idea\n\n```bash\njq 'filter' file.json\n```\n`jq` reads JSON and applies a **filter** — its own small, purpose-built query language — to extract or transform data. The simplest possible filter, `.`, just pretty-prints the whole JSON structure. `.fieldname` extracts one field; `.[]` iterates over an array; `|` chains filters together, exactly like a Bash pipeline (Chapter 5.3) but operating on JSON data instead of text lines.\n\n### Examples\n\n**1. Pretty-printing — `jq`'s simplest use.**\n```bash\njq '.' response.json\n```\nGiven a compact, single-line JSON response, output:\n```json\n{\n  \"args\": {},\n  \"headers\": {\n    \"Accept\": \"*/*\",\n    \"Host\": \"httpbin.org\",\n    \"User-Agent\": \"curl/8.5.0\"\n  }\n}\n```\nEven this trivial filter is genuinely useful — reformatting cramped, hard-to-read JSON into something a human can actually scan.\n\n**2. Extracting a single field.**\n```bash\njq '.url' response.json\n```\nOutput:\n```\n\"https://httpbin.org/get\"\n```\n`.url` walks straight to the top-level `url` field. Notice the value is printed *with* its quotes — `jq` output is itself valid JSON by default, and a JSON string includes its quotes.\n\n**3. Raw output without quotes — `-r`.**\n```bash\njq -r '.url' response.json\n```\nOutput:\n```\nhttps://httpbin.org/get\n```\n`-r` (raw output) strips the JSON quoting from string results — this is almost always what you want when the extracted value is headed into a Bash variable (`url=$(jq -r '.url' response.json)`) rather than being displayed as JSON.\n\n**4. Nested field access — just chain the dots.**\n```bash\njq '.headers.Host' response.json\n```\nOutput:\n```\n\"httpbin.org\"\n```\n`.headers.Host` walks into the `headers` object, then its `Host` field — reading a nested path is exactly this straightforward, dot after dot.\n\n**5. Working with an array — extracting the whole thing.**\n```bash\njq
