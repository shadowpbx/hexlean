like quoting variables — without it, a backslash typed as input gets interpreted as an escape sequence rather than a literal character, which is rarely what you want.\n\n**2. A prompt with `-p` — no separate `echo` needed.**\n```bash\nread -r -p \"Enter your name: \" name\n```\nThis shows `Enter your name: ` on the same line, then waits, then stores the response in `name` once Enter is pressed — cleaner than a separate `echo -n` followed by a plain `read`.\n\n**3. Reading multiple values from one line.**\n```bash\nread -r first last\n```\nTyping `John Smith` and pressing Enter:\n```\nfirst=John last=Smith\n```\n`read` splits the input line on `IFS` (Chapter 2.10's default: whitespace) and assigns one word to each variable named — if there are more words than variables, every leftover word gets appended to the *last* variable, whitespace and all, rather than being dropped.\n\n**4. Reading a whole line into an array with `-a`.**\n```bash\nread -ra words\n```\nTyping `one two three`:\n```\none two three\ncount: 3\n```\nSame `IFS`-based splitting as Example 3, but every word lands in an array instead of needing one variable name per word — useful when the number of words isn't known in advance.\n\n**5. A custom delimiter with `-d`.**\n```bash\nread -r -d ',' field\n```\nGiven input `value1,value2`, this reads up to (not including) the first comma:\n```\nfield: [value1]\n```\n`-d ','` tells `read` to treat a comma as the end-of-input marker instead of a newline — genuinely useful for parsing non-line-oriented delimited data one field at a time.\n\n**6. Silent input with `-s` — for passwords.**\n```bash\nread -rs -p \"Password: \" pw\necho \"\"\n```\nShows the `Password: ` prompt, but **doesn't echo the characters typed** to the screen as the user types them — exactly the behavior you want for a password, so it isn't visible over someone's shoulder or left sitting in the terminal's scrollback. The extra `echo \"\"` afterward is a small but important courtesy: since nothing was echoed, the terminal's cursor is still sitting right after the prompt, and printing an empty line moves it cleanly onto the next line before anything else prints.\n\n**7. A timeout with `-t`.**\n```bash\nread -r -t 1 slowvar\necho \"exit status: $?\"\n```\nIf nothing is typed within 1 second (here, tested by giving `read` no input at all — `/dev/null`, closed immediately), `read` gives up and reports failure:\n```\nexit status: 1\n```\n`-t` is genuinely useful in scripts that shouldn't hang forever waiting for input that may never come — combine it with checking `$?` to detect the timeout and handle it explicitly (an `if`, Chapter 3.1, checking `read`'s exit status is the natural way to do this).\n\n**8. Reading a fixed number of characters with `-n`.**\n```bash\nread -rn 3 threechars\n```\nGiven input `abcdef`:\n```\ngot: abc\n```\nReads exactly 3 characters and returns immediately — doesn't wait for a newline at all. Occasionally useful for single-keypress-style menus (\"press y or n\") without requiring Enter.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `-r` as a default habit.** Exactly like the file-reading loop in Chapter 3.5, skipping `-r` means a literal backslash in the input gets consumed as an escape character rather than kept as-is.\n- **Assuming `read` without a variable name stores nothing usable.** It actually stores the line in `$REPLY` — a real, usable variable, just an implicit one rather than a chosen name. `select` (Chapter 3.3) relies on exactly this default in a slightly different way (storing the chosen option's text in its own loop variable instead).\n- **Expecting extra words beyond the named variables to be silently dropped.** As Example 3 explains, they aren't dropped — they're appended, whitespace and all, onto the *last* named variable. `read -r first last <<< \"John Middle Smith\"` gives `last=\"Middle Smith\"`, not just `\"Smith\"`.\n- **Piping input into a `read` that's supposed to affect the current shell**, replicating exactly the Chapter 3.5 subshell trap — `something | read var` runs `read` in a subshell, and `var` vanishes the moment that subshell ends. The fixes are the same as Chapter 3.5's: redirect from a file or process substitution instead of piping into `read` directly.\n- **Forgetting `read -s`'s prompt leaves the cursor mid-line.** As shown in Example 6, always follow a silent, prompted `read` with an empty `echo` (or a newline some other way) so subsequent output doesn't run onto the same line as the prompt.\n\n### How this connects\n\n`read` closes out Part III — Sentences. It already quietly powered Chapter 3.5's file-reading loop and Chapter 3.3's `select` menu; this chapter made that mechanism fully explicit. From here, Part IV moves from \"sentences\" to \"grammar\" — functions, which let you package up sequences of commands (including ones using `read`) into something you can call by name, reused, with its own arguments, rather than writing the same logic out repeatedly.\n\n### Quick recap\n\n- `read -r variable` reads one line into `variable`; without a name, it lands in `$REPLY`.\n- `-p \"prompt\"` shows a prompt inline; `-a arr` splits into an array; `-s` hides typed input (passwords); `-t N` times out after N seconds; `-n N` reads exactly N characters; `-d 'char'` uses a custom end-of-input delimiter instead of newline.\n- Extra words beyond the named variables get appended onto the last one, not dropped.\n- Never pipe into a `read` whose result needs to survive — redirect from a file or process substitution instead, exactly like the `while read` trap from Chapter 3.5."}, {"id": "4.1", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 1, "slug": "defining-functions", "fullTitle": "Defining Functions", "title": "Defining Functions", "md": "### Why this matters\n\nEvery chapter so far has written commands out fresh each time they're needed. The moment a script needs the same handful of steps more than once — validating input, formatting a message, checking a condition — repeating that code becomes tedious and, worse, a maintenance risk (fix a bug in one copy, forget the other three). A function packages a sequence of commands under one name, callable as many times as needed. This is Part IV's whole subject: the grammar for building your own reusable pieces.\n\n### The core idea\n\nThere are two equivalent ways to define a function in Bash:\n```bash\nfunction name {\n  # commands\n}\n```\n```bash\nname() {\n  # commands\n}\n```\nBoth create a function called `name`; calling it later is just `name`, exactly like calling any built-in command — no special syntax needed at the call site. **The `name()` form (without the `function` keyword) is the more portable one** — it works in any POSIX-compliant shell, not just Bash — and it's the form this book uses from here on. **A function must be defined before it's called** — Bash reads a script top to bottom, and a call to a not-yet-defined function fails exactly like calling any other command that doesn't exist.\n\n### Examples\n\n**1. The `function` keyword style.**\n```bash\nfunction greet {\n  echo \"Hello!\"\n}\ngreet\n```\nOutput:\n```\nHello!\n```\n\n**2. The POSIX style — no `function` keyword, just `()`.**\n```bash\ngreet2() {\n  echo \"Hi there!\"\n}\ngreet2\n```\nOutput:\n```\nHi there!\n```\nFunctionally identical to Example 1 — this book uses this form going forward.\n\n**3. Definition order matters.**\n```bash\n#!/usr/bin/env bash\nsayhi() {\n  echo \"hi\"\n}\nsayhi\n```\nOutput:\n```\nhi\n```\nThis works because `sayhi` is fully defined *before* it's called on the last line. Reversing the order breaks it:\n```bash\n#!/usr/bin/env bash\nsayhi\nsayhi() {\n  echo \"hi\"\n}\n```\nOutput:\n```\n./badorder.sh: line 2: sayhi: command not found\n```\nBash hits the call to `sayhi` before ever reaching its definition — at that point in the script, as far as Bash knows, no such command or function exists yet. Note the script *keeps running* after this error (no `set -e`, Chapter 5.6) — the function gets defined on the next line regardless, just too late to help the call that already failed.\n\n**4. Redefining a function.**\n```bash\nf() { echo \"version1\"; }\nf\nf() { echo \"version2\"; }\nf\n```\nOutput:\n```\nversion1\nversion2\n```\nA later definition of the same name completely replaces the earlier one — there's no error or warning, and no way to \"call the old version\" afterward. This is occasionally genuinely useful (for instance, temporarily overriding a function for testing) but also a real source of confusion if a name gets accidentally reused for two different purposes in a larger script.\n\n### ⚠️ Common Mistakes\n\n- **Calling a function before it's defined**, exactly as shown in Example 3 — a very natural mistake while restructuring a script, since it's easy to move a call up without noticing the definition is still further down. Keep function definitions near the top of a script, before the \"main\" logic that calls them (Chapter 6.7 covers organizing this properly in larger scripts).\n- **Assuming a redefinition merges with, rather than replaces, the earlier one.** As Example 4 shows, the second definition wins completely — there's no way to call both, and no automatic warning that a name was reused.\n- **Putting a space between the function name and `()`** — `greet ()` (with a space) still works in Bash, but it's inconsistent with the tighter `greet()` convention most style guides (including Chapter 7.9's) recommend; pick one convention and use it consistently.\n- **Forgetting functions are just named blocks of commands, not something requiring special \"declaration\" ceremony elsewhere.** Unlike some languages, there's no separate function signature, no return-type declaration — just a name and a block of commands, which is genuinely all a Bash function is.\n\n### How this connects\n\nThis is the foundation Part IV builds on entirely — Chapter 4.2 covers passing arguments into a function (using the exact same `$1`, `$2`, `$#` system from Chapter 2.9, just scoped to the function instead of the whole script), and Chapter 4.3 covers getting values back out. Functions become essential the moment Chapter 6.7 discusses organizing a larger script into logical, reusable pieces.\n\n### Quick recap\n\n- Define with `name() { commands; }` (preferred, POSIX-portable) or `function name { commands; }` (Bash-specific, equivalent).\n- Call a function exactly like any other command — just its name, no special syntax.\n- A function must be **defined before** any call to it — Bash reads top to bottom.\n- Redefining a function completely replaces the earlier version, silently."}, {"id": "4.2", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 2, "slug": "function-arguments", "fullTitle": "Function Arguments", "title": "Function Arguments", "md": "### Why this matters\n\nA function that always does exactly the same thing, with no way to vary its behavior, is only marginally more useful than not having one at all. Real reuse comes from passing in different values each time — and Bash functions use precisely the same positional-parameter system (`$1`, `$2`, `$#`, `$@`) that Chapter 2.9 introduced for whole-script arguments. Nothing new to learn syntactically here — just a new, more common context to use it in.\n\n### The core idea\n\nCall a function with values after its name, exactly like calling any command with arguments:\n```bash\nmyfunc \"value1\" \"value2\"\n```\nInside `myfunc`, those values become `$1`, `$2`, and so on — `$#` gives the count, `$@`/`$*` give all of them, exactly as covered in Chapter 2.9. **Crucially, these are scoped to the function** — a function's `$1` is completely separate from the script's own `$1` (its first command-line argument), and calling the function doesn't disturb the script's positional parameters at all.\n\n### Examples\n\n**1. Basic arguments.**\n```bash\ngreet() {\n  echo \"Hello, $1!\"\n  echo \"Total args: $#\"\n}\ngreet \"Alex\" \"extra\"\n```\nOutput:\n```\nHello, Alex!\nTotal args: 2\n```\n`$1` is `\"Alex\"`, `$2` (unused here) is `\"extra\"`, and `$#` correctly reports `2`.\n\n**2. `$@` vs. `$*` inside a function — the same distinction from Chapter 2.9, confirmed here.**\n```bash\nshowargs() {\n  echo \"with \\$@:\"\n  for a in \"$@\"; do echo \"  [$a]\"; done\n  echo \"with \\$*:\"\n  for a in \"$*\"; do echo \"  [$a]\"; done\n}\nshowargs \"one two\" three\n```\nOutput:\n```\nwith $@:\n  [one two]\n  [three]\nwith $*:\n  [one two three]\n```\n`\"$@\"` correctly keeps `\"one two\"` as one argument (because it was passed quoted) and `three` as another — two loop iterations. `\"$*\"` joins everything into one single string — one loop iteration. Exactly like Chapter 2.9's script-level version, `\"$@\"` is almost always the one you want when iterating over a function's arguments one at a time.\n\n**3. `shift` — process arguments one at a time, working through a variable-length list.**\n```bash\nprocessall() {\n  while [ \"$#\" -gt 0 ]; do\n    echo \"processing: $1\"\n    shift\n  done\n}\nprocessall a b c\n```\nOutput:\n```\nprocessing: a\nprocessing: b\nprocessing: c\n```\n`shift` discards `$1` and renumbers everything else down by one — what was `$2` becomes the new `$1`, and so on — and also decrements `$#` accordingly. Looping `while [ \"$#\" -gt 0 ]` with a `shift` at the end of each pass is the standard pattern for \"process however many arguments were given, whatever that number turns out to be,\" without needing to know the count in advance.\n\n**3b. `${@:N}` — slicing the argument list without consuming it.**\n```bash\nf() {\n  echo \"${@:2}\"\n  echo \"${@:2:1}\"\n}\nf a b c d\n```\nOutput:\n```\nb c d\nb\n```\n`${@:2}` means \"every argument starting from position 2 onward\" — genuinely useful when the first argument is a subcommand or flag and the rest need to be handled as a group (exactly the shape Chapter 9.2's capstone used for `add \"$*\"`, built from `$@` after `shift`ing away the command name). `${@:2:1}` adds a length, taking just one argument starting at position 2 — this is the exact same `${var:start:length}` substring syntax from Chapter 2.2, applied to the whole argument list instead of a single string. Unlike `shift`, this doesn't modify `$@` at all — it's a read-only view, useful when the original arguments still need to be available afterward.\n\n**4. Function arguments don't leak into (or out of) the script's own arguments.**\n```bash\n#!/usr/bin/env bash\nmyfunc() {\n  echo \"inside func \\$1: $1\"\n}\nmyfunc \"func-arg\"\necho \"outside func \\$1: $1\"\n```\nRunning `./argleak.sh \"script-arg\"`:\n```\ninside func $1: func-arg\noutside func $1: script-arg\n```\nInside `myfunc`, `$1` is whatever was passed to *the function call* (`\"func-arg\"`). The moment the function returns, `$1` reverts to whatever the *script* was actually called with (`\"script-arg\"`) — the two are entirely independent, even though they share the same names.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `shift` inside a `while [ \"$#\" -gt 0 ]` loop.** Without it, `$#` and `$1` never change, and the loop runs forever, always processing the same first argument — a genuinely easy infinite loop to introduce, and one worth double-checking for every time you write this pattern.\n- **Assuming a function can see the script's `$1` directly without it being explicitly passed in.** It can't — as Example 4 shows, a function's positional parameters are its own, scoped entirely to how *it* was called, not inherited from the surrounding script. If a function needs a script-level value, that value has to be passed to it explicitly as an argument.\n- **Using `$*` instead of `\"$@\"` when a function needs to pass its own arguments along to another command unchanged.** `command \"$@\"` correctly preserves each original argument as a separate word (including ones with spaces); `command $*` or even `command \"$*\"` collapses everything into one merged string — usually not what \"pass all my arguments along\" actually means.\n- **Not validating `$#` before assuming a specific argument exists.** Referencing `$2` when the function was only called with one argument silently gives an empty string (Chapter 2.9's unset-variable behavior applies to unset positional parameters too), rather than an error — worth an explicit check when a function genuinely requires a certain number of arguments.\n\n### How this connects\n\nThis chapter is a direct, practical extension of Chapter 2.9's special variables, now applied inside functions rather than at the whole-script level — and it sets up Chapter 4.3, which covers the other half of a function's interface: getting a value (or at least a status) back *out*, once you're done processing what came in.\n\n### Quick recap\n\n- Function arguments use the same `$1`, `$2`, `$#`, `$@`/`$*` system as script arguments (Chapter 2.9) — but scoped entirely to that one function call.\n- `\"$@\"` (quoted) keeps each argument separate; `\"$*\"` joins them into one string — same distinction as at the script level.\n- `shift` drops `$1` and renumbers the rest down by one; pairing it with `while [ \"$#\" -gt 0 ]` is the standard way to process an unknown number of arguments.\n- `${@:N}` / `${@:N:len}` slices the argument list read-only, without consuming it — the same `${var:start:length}` syntax from Chapter 2.2, applied to `$@`.\n- A function's positional parameters are completely independent of the calling script's own `$1`, `$2`, etc."}, {"id": "4.3", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 3, "slug": "return-values-exit-codes-from-functions", "fullTitle": "Return Values & Exit Codes from Functions", "title": "Return Values & Exit Codes from Functions", "md": "### Why this matters\n\nA function that does something useful often needs to report back — did it succeed, and (sometimes) what did it compute? Bash's answer to this is genuinely different from most languages you may have used, and getting the distinction clear now avoids a lot of confusion later: a function has an **exit status** (a number reporting success/failure, exactly like any command), and separately, a function can produce **output** which can be captured as data. There is no single \"return this value\" mechanism that does both at once.\n\n### The core idea\n\n`return N` sets a function's exit status to `N` (0–255) and immediately stops the function — this is the direct function-level equivalent of the `exit N` you met for whole scripts back in Chapter 1.5. If a function ends without an explicit `return`, its exit status is simply whatever the **last command it ran** exited with.\n\n**Getting actual data back out is a completely different mechanism**, since `return`'s number is only ever a small status code, not a general-purpose value:\n- **`echo` the result, and capture it with command substitution** (`$(...)`, Chapter 2.8) at the call site — the standard, most common approach for a function that computes one value.\n- **Set a global variable** inside the function, and read it afterward — simpler for scripts that don't mind the coupling, and unavoidable when a function needs to report back more than one piece of data at once.\n\n### Examples\n\n**1. `return` for success/failure — used exactly like any command's exit status.**\n```bash\nis_even() {\n  if (( $1 % 2 == 0 )); then\n    return 0\n  else\n    return 1\n  fi\n}\nis_even 4 && echo \"4 is even\"\nis_even 5 || echo \"5 is not even\"\n```\nOutput:\n```\n4 is even\n5 is not even\n```\n`is_even` is used directly in `&&`/`||`, exactly the way `true`/`false`/any other command would be (Chapter 1.5) — because a function's exit status works identically to a command's.\n\n**2. No explicit `return` — the function's status is its last command's status.**\n```bash\nimplicit_return() {\n  [ \"$1\" = \"yes\" ]\n}\nimplicit_return \"yes\"\necho \"status: $?\"\nimplicit_return \"no\"\necho \"status: $?\"\n```\nOutput:\n```\nstatus: 0\nstatus: 1\n```\nNo `return` statement anywhere — `[ \"$1\" = \"yes\" ]` is the function's last (and only) command, so its exit status becomes the function's exit status automatically. This is a common, terse style for small predicate-style functions.\n\n**3. Getting a computed value out — `echo` and capture with `$(...)`.**\n```bash\ndouble() {\n  echo $(( $1 * 2 ))\n}\nresult=$(double 21)\necho \"doubled: $result\"\n```\nOutput:\n```\ndoubled: 42\n```\nThis is the standard pattern: the function *prints* its result rather than \"returning\" it in the `return` sense, and the caller captures that printed output exactly like capturing any command's output (Chapter 2.8). Note this means a function using this pattern can't *also* use `return` to report a meaningful non-zero/zero status without care — its printed output and its exit status are two genuinely separate channels, and this pattern leans entirely on the first one.\n\n**4. Getting a value out via a global variable.**\n```bash\ncompute() {\n  RESULT=$(( $1 + $1 ))\n}\ncompute 10\necho \"RESULT: $RESULT\"\n```\nOutput:\n```\nRESULT: 20\n```\nNo command substitution needed — the function just sets a variable the caller reads afterward. This avoids spawning a subshell (which `$(...)` technically does) and lets a function report multiple values at once by setting several variables, but it comes at the cost of an implicit contract between the function and its caller (\"this function will set `RESULT`\") that isn't visible just from how the function is called — worth a clear comment or a very deliberate naming convention when you use this style.\n\n**5. `return`'s value wraps around past 255 — same rule as script exit codes.**\n```bash\nweird() { return 300; }\nweird\necho \"return 300 became: $?\"\n```\nOutput:\n```\nreturn 300 became: 44\n```\nExit statuses are stored in a single byte, so any value is taken modulo 256 — `300 % 256 = 44`. This is the exact same rule from Chapter 1.5's `exit N`, now confirmed for `return` too. In practice this means: never rely on `return` for a number bigger than 255, and treat any nonzero result as \"failure,\" not as a meaningful specific number, unless you already know a given function deliberately encodes something in a small range.\n\n**6. `return` only works inside a function (or a sourced script) — using it elsewhere is an error.**\n```bash\nreturn 5\n```\nRun directly (not inside a function), this produces:\n```\nbash: line 1: return: can only `return' from a function or sourced script\n```\nThis is a reminder that `return` and `exit` are genuinely different tools serving different scopes — `exit` ends the whole script from anywhere; `return` only makes sense as \"I am inside a function (or a script being sourced, Chapter 6.2), and I'm done with just this.\"\n\n### ⚠️ Common Mistakes\n\n- **Trying to \"return a string\" with `return`.** `return` only ever sets a small numeric exit status (0–255) — it cannot carry text, a list, or any general value. Use the `echo`-and-capture pattern (Example 3) or a global variable (Example 4) for that.\n- **Forgetting the modulo-256 wraparound.** A function that tries to `return` a count or a computed number larger than 255, expecting the caller to read it back via `$?`, will get a wrong, wrapped value — as shown starkly in Example 5. If you need a genuinely numeric result, print it and capture it instead; reserve `return`/`$?` strictly for success/failure–style signaling.\n- **Mixing the \"echo the data\" pattern with extra diagnostic output inside the same function.** If a function is meant to be called as `result=$(myfunc)`, *anything* else it prints to standard output (a debug message, a progress note) gets captured into `result` too, polluting the value. Send diagnostic messages to standard error instead (`>&2`, covered fully in Chapter 5.1/5.2) if a function needs to both report a result and log something along the way.\n- **Relying on a global variable set inside a function without a very clear naming convention.** As Example 4's discussion notes, this creates an invisible contract between a function and its caller — a later reader has no way to know `compute` sets `RESULT` just by looking at the call site. Document it clearly, or prefer the `echo`/capture pattern when a script is meant to be read by someone other than its author.\n\n### How this connects\n\n`return`'s exit-status behavior is exactly Chapter 1.5's mechanism, scoped down to a function instead of a whole script — everything you already know about `$?`, `&&`, `||`, and `if` checking a command's status applies identically to a function's `return`. The next chapter, on local vs. global variables, directly addresses the tension Example 4 raised: a function reaching outside itself to set a variable is exactly the kind of scoping question Chapter 4.4 resolves properly.\n\n### Quick recap\n\n- `return N` sets a function's exit status (0–255, wraps around beyond that) and ends the function immediately — the function-level equivalent of `exit N`.\n- No `return` statement means the function's exit status is simply its last command's exit status.\n- `return` cannot carry data — only a small numeric status. To get an actual value out, `echo` it and capture with `$(...)`, or set a global variable.\n- `return` only works inside a function (or a sourced script) — it's an error anywhere else."}, {"id": "4.4", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 4, "slug": "local-vs-global-variables-in-functions", "fullTitle": "Local vs. Global Variables in Functions", "title": "Local vs. Global Variables in Functions", "md": "### Why this matters\n\nThis is one of the sharpest differences between Bash and most other languages, and it causes real bugs even in experienced people's scripts: **variables in Bash are global by default, even inside a function.** A function that just assigns to a variable — with no special keyword — is silently modifying the *same* variable the rest of the script sees, not a private copy of its own. Chapter 4.3 hinted at this tension; this chapter resolves it properly, with the tool (`local`) that lets a function have variables genuinely its own.\n\n### The core idea\n\n```bash\nmyfunc() {\n  x=10        # this is GLOBAL — modifies the script's own $x\n  local y=20  # this is LOCAL — exists only inside myfunc, gone once it returns\n}\n```\nWithout `local`, any variable a function assigns to is exactly the same variable visible everywhere else in the script — assigning inside a function is functionally no different from assigning at the top level. `local varname=value` creates a variable that exists **only for the duration of that function call**, shadowing any global variable of the same name for as long as the function is running, and disappearing completely the moment it returns.\n\n### Examples\n\n**1. The default: a plain assignment inside a function changes the global.**\n```bash\nx=10\nmodify() {\n  x=20\n}\nmodify\necho \"x after call: $x\"\n```\nOutput:\n```\nx after call: 20\n```\nNothing about being \"inside a function\" protected `x` — `modify` reached straight into the script's own variable and changed it, exactly as if the assignment had happened at the top level.\n\n**2. `local` scopes a variable to the function.**\n```bash\ny=10\nmodifylocal() {\n  local y=20\n  echo \"inside function, y=$y\"\n}\nmodifylocal\necho \"outside function, y=$y\"\n```\nOutput:\n```\ninside function, y=20\noutside function, y=10\n```\nInside the function, `local y=20` creates a completely separate `y` for the duration of the call — the outer `y=10` is untouched, confirmed by the second `echo` still showing `10`.\n\n**3. A `local` variable doesn't exist at all outside the function.**\n```bash\nshowvar() {\n  local z=5\n  echo \"z inside: $z\"\n}\nshowvar\necho \"z outside: [${z}]\"\n```\nOutput:\n```\nz inside: 5\nz outside: []\n```\n`z` isn't just \"reset\" once the function returns — it never existed outside the function in the first place. Referencing it afterward gives the familiar unset-variable empty string (Chapter 1.3), not an error.\n\n**4. `local` correctly shadows a global of the same name, without touching it.**\n```bash\ncount=100\nincrement() {\n  local count=0\n  ((count++))\n  echo \"local count: $count\"\n}\nincrement\necho \"global count still: $count\"\n```\nOutput:\n```\nlocal count: 1\nglobal count still: 100\n```\nInside `increment`, `count` refers to the fresh local copy; the increment only ever affects that copy. The global `count=100` is completely unaffected — exactly the isolation you'd want when a function needs a working variable with a name that happens to coincide with something used elsewhere.\n\n**5. What goes wrong without `local` — a genuinely broken recursive function.**\n```bash\nsum_to() {\n  local n=$1\n  total=0\n  if [ \"$n\" -le 0 ]; then\n    return\n  fi\n  total=$((total + n))\n  sum_to $((n - 1))\n  echo \"at n=$n, total=$total\"\n}\nsum_to 3\n```\nOutput:\n```\nat n=1, total=0\nat n=2, total=0\nat n=3, total=0\n```\nEvery single line reports `total=0` — clearly wrong for a function meant to accumulate a sum. Here's why: `total` was never made `local`, so every recursive call shares the exact same global `total`. Each call starts by resetting it (`total=0`) and adding its own `n` — but by the time an *outer* call gets around to printing `total`, the *innermost* calls have already reset and overwritten it multiple times on their way back out. The fix is simply adding `local` in front of `total=0` — then each recursive call gets its own independent copy, and the sum accumulates correctly instead of colliding across calls.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `local` inside any function, especially a recursive one.** As Example 5 shows in painful detail, this isn't a rare edge case — it's a real, common way to introduce a genuinely broken function, and the bug can be subtle in a longer script that doesn't recurse but still calls the same function multiple times in a row.\n- **Assuming a variable is \"safe\" inside a function just because it looks like a fresh local name.** Bash won't warn you — a plain `x=5` inside a function is global whether or not you meant it to be. The habit has to be deliberate: **default to `local` for any variable a function doesn't specifically need to expose**, and reserve un-`local`'d assignments for the cases (like Chapter 4.3's global-variable-as-return-value pattern) where reaching outside the function is genuinely the intent.\n- **Declaring `local` after already using the variable in the same function.** `local` needs to come *before* a variable's first use inside the function to actually create the scoped copy from the start — declaring it partway through, after an earlier unscoped assignment already touched the global, doesn't retroactively fix that earlier line.\n- **Forgetting `local x=$(command)` can hide a command's exit status.** `local x=$(false)` reports `$?` from the `local` statement itself (which almost always succeeds), not from the command substitution — if you need to check whether the command inside succeeded, capture it in two separate steps: assign first without `local` combined into the same line, then check `$?`, *then* mark it local if needed.\n\n### How this connects\n\nThis chapter directly resolves the \"global variable as an implicit contract\" concern Chapter 4.3 raised about capturing a function's result — you now have the vocabulary to say precisely when a function should deliberately reach outside itself (a genuine, intentional global) versus when it should protect its own working variables with `local`. This distinction becomes especially important the moment Chapter 4.5 introduces recursion properly, building directly on Example 5's lesson.\n\n### Quick recap\n\n- Variables in Bash functions are **global by default** — a plain assignment inside a function changes the same variable visible everywhere else.\n- `local varname=value` creates a variable scoped to just that function call — it shadows any global of the same name and disappears when the function returns.\n- Forgetting `local` in a recursive function is a classic, genuinely broken-behavior bug — every call sharing one global variable stomps on the others.\n- Default habit: use `local` for a function's own working variables; only skip it when deliberately setting something the caller is meant to read afterward."}, {"id": "4.5", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 5, "slug": "recursion-in-bash", "fullTitle": "Recursion in Bash", "title": "Recursion in Bash", "md": "### Why this matters\n\nA function that calls itself — recursion — is a natural fit for some problems (walking a nested folder structure, computing a factorial, anything genuinely defined in terms of a smaller version of itself). Bash supports it, but it comes with real, practical limits that don't exist in languages built with recursion more centrally in mind. This chapter shows recursion done correctly, and — just as importantly — exactly where it breaks, so a script doesn't fail in the most confusing possible way.\n\n### The core idea\n\nA recursive Bash function is just a function that calls itself, with:\n- A **base case** — a condition where the function stops calling itself and returns directly.\n- A **recursive case** — where it calls itself with a smaller/simpler version of the problem, and combines that result with its own work.\n\nEvery principle from Chapter 4.4 applies with extra force here: **every recursive function must use `local` for its working variables**, because without it, every level of recursion shares and stomps on the same global state — exactly the broken behavior Chapter 4.4's Example 5 demonstrated.\n\n### Examples\n\n**1. A classic recursive factorial.**\n```bash\nfactorial() {\n  local n=$1\n  if [ \"$n\" -le 1 ]; then\n    echo 1\n    return\n  fi\n  local prev=$(factorial $((n - 1)))\n  echo $((n * prev))\n}\nfactorial 5\n```\nOutput:\n```\n120\n```\nThe base case (`n <= 1`) returns `1` directly. The recursive case calls `factorial` on `n - 1`, captures its result with command substitution (Chapter 2.8 — this is the \"echo the result, capture it\" pattern from Chapter 4.3, used here specifically because it composes cleanly with recursion), and multiplies. `local n` and `local prev` keep every recursive call's variables genuinely separate from every other call's — this is non-negotiable for recursion to work correctly at all.\n\n**2. Recursive summation — the correct, `local`-protected version of Chapter 4.4's broken example.**\n```bash\nsum_to() {\n  local n=$1\n  if [ \"$n\" -le 0 ]; then\n    echo 0\n    return\n  fi\n  local rest=$(sum_to $((n - 1)))\n  local total=$((n + rest))\n  echo \"$total\"\n}\nsum_to 5\n```\nOutput:\n```\n15\n```\nCompare this directly to Chapter 4.4's broken version, which used a global `total` and produced `0` at every level due to the recursive calls overwriting each other's state. Here, every level's `total` is genuinely private (`local`), captured through the return value (`echo`/`$(...)`) rather than shared global state — and it produces the mathematically correct answer, `1+2+3+4+5 = 15`.\n\n**3. Recursion works fine at reasonable depths...**\n```bash\ncountdown() {\n  local n=$1\n  [ \"$n\" -le 0 ] && return\n  countdown $((n - 1))\n}\ncountdown 5000\necho \"finished, exit: $?\"\n```\nThis completes without issue.\n\n**4. ...but Bash recursion has a real, hard depth limit — and it fails badly.**\n```bash\ncountdown 100000\n```\nRun as a script, this produces:\n```\nSegmentation fault (core dumped)\n```\nwith exit status `139`. **This is not a graceful error — it's a crash.** Bash implements each function call using the underlying operating system's call stack, exactly like a compiled program would, and that stack has a fixed size (`ulimit -s` reports it in kilobytes — commonly `8192`, i.e. 8 MB, though this varies by system). Recurse deep enough, and Bash exhausts that stack and crashes outright, rather than raising a clean \"recursion too deep\" error the way many other languages do.\n\nThe exact depth where this tips over isn't a fixed number — it depends on the stack size (`ulimit -s`) and how much a single call frame costs, which varies by Bash version and platform. On one 8 MB-stack reference system, this exact `countdown` crashed somewhere around **5,300**, not 10,000 or 100,000 — so treat \"5,000\" and \"100,000\" above as \"comfortably fine\" and \"comfortably way past the limit,\" not as measured thresholds to rely on. If a script's correctness depends on knowing the real ceiling on its target machine, measure it there with a binary search over depths like this one, rather than trusting a number from a tutorial (including this one).\n\n**5. `FUNCNEST` — a safety net that turns the crash into a controlled error instead.**\n```bash\nFUNCNEST=200\nf() { f; }\nf\n```\nOutput:\n```\nf: maximum function nesting level exceeded (200)\n```\nSetting `FUNCNEST` to a reasonable number tells Bash to enforce that limit itself and fail cleanly once it's hit, rather than silently recursing until the operating system's stack itself gives out. This is a genuinely worthwhile safety measure for any script that recurses on data whose depth isn't fully controlled (like an unknown folder tree) — set `FUNCNEST` to something comfortably above what you expect to need, and get a readable error instead of a segfault if something goes wrong.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `local` on every variable inside a recursive function**, exactly as Chapter 4.4 demonstrated — this is the single most consequential mistake specific to Bash recursion, because the bug (wrong numeric results, not a crash) can look plausible enough to go unnoticed.\n- **Assuming Bash will report a clean error on excessive recursion depth, the way many languages do.** As Example 4 shows, the actual failure mode is an operating-system-level segmentation fault, with no chance for the script to catch it, clean up, or report anything useful — it simply stops, mid-execution, with exit status `139`.\n- **Reaching for deep recursion on genuinely large inputs at all.** Bash's practical recursion depth (thousands, not tens of thousands, and highly dependent on how much work each call does) is far shallower than what a typical compiled or higher-level scripting language can handle. For anything approaching that limit, prefer an explicit loop (`while`/`for`, Chapter 3.4–3.5) with your own manual stack (an array, Chapter 2.6, holding the items still to process) instead of true recursion.\n- **Missing a base case, or a base case that's never actually reachable for some input.** Exactly like any recursive function in any language, a missing or unreachable base case means unconditional recursion — which, in Bash specifically, means racing straight toward the segfault from Example 4, not just a slow infinite loop.\n- **Recursing through the \"echo and capture\" pattern (Example 1) for performance-sensitive code.** Every recursive call using `$(...)` spawns a subshell (Chapter 6.3) — genuinely fine for the moderate depths and simple problems this book covers, but worth knowing this adds real overhead per call, on top of Bash's already-modest recursion ceiling.\n\n### How this connects\n\nThis chapter closes out Part IV by combining everything it taught: functions (4.1), arguments (4.2), returning values (4.3), and — critically — `local` scoping (4.4), all working together, plus a firsthand look at where Bash's specific implementation genuinely runs out of road. Part V, next, shifts from \"how to structure logic\" to \"how to work with the outside world\" — streams, redirection, and files, starting from the ground up.\n\n### Quick recap\n\n- Recursion in Bash needs a base case and a recursive case, exactly like any language — but **every working variable must be `local`**, or recursive calls corrupt each other's state (Chapter 4.4).\n- Getting a value back out of each recursive level typically uses the `echo`/`$(...)` capture pattern from Chapter 4.3.\n- Bash recursion has a real, hard depth limit tied to the operating system's stack size — exceeding it causes a **segmentation fault**, not a clean error.\n- `FUNCNEST` can be set to enforce a controlled maximum nesting depth, turning a potential crash into a readable error instead.\n- For genuinely deep or large-scale problems, prefer an explicit loop with your own data structure over true recursion."}, {"id": "4.6", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 6, "slug": "namerefs-passing-data-by-reference", "fullTitle": "Passing Data by Reference: Namerefs (`declare -n`)", "title": "Passing Data by Reference: Namerefs (`declare -n`)", "md": "### Why this matters\n\nChapter 4.3 showed two ways to get a value out of a function: `echo` it and capture with `$(...)`, or set a global variable. Both work fine for a single scalar value — but neither one handles an **array** or **associative array** cleanly. Command substitution flattens everything through a subshell and string splitting (Chapter 2.10), which mangles an array's structure; relying on a fixed global variable name works, but only for one hardcoded name, not for \"whichever array the caller wants updated.\" **Namerefs** solve this properly: a way for a function to receive not a variable's *value*, but a genuine reference to the variable itself, so it can read or modify the caller's actual array, associative array, or scalar directly.\n\n### The core idea\n\n```bash\nmyfunc() {\n  local -n ref=$1\n  ref=new_value          # this changes the CALLER's variable, not a local copy\n}\n```\n`local -n ref=$1` (or `declare -n` outside a function) makes `ref` a **nameref** — instead of holding a value, it holds the *name* of another variable, and every read or write through `ref` transparently redirects to that variable. Since the caller passes the variable's *name* as a plain string argument (`myfunc x`, not `myfunc \"$x\"`), this is how Bash achieves genuine pass-by-reference — the one thing positional parameters (Chapter 4.2) alone can't do for a whole array or associative array at once.\n\n### Examples\n\n**1. A basic nameref — modifying the caller's scalar variable directly.**\n```bash\ndouble_it() {\n  local -n ref=$1\n  ref=$((ref * 2))\n}\nx=5\ndouble_it x\necho \"x is now: $x\"\n```\nOutput:\n```\nx is now: 10\n```\nNotice the call is `double_it x` — the bare variable name, not `$x`. Passing `$x` would hand the function the *value* `5`; passing `x` hands it the *name*, which is exactly what a nameref needs to attach itself to the right variable.\n\n**2. Passing an array by reference — appending to the caller's actual array.**\n```bash\nappend_item() {\n  local -n arr_ref=$1\n  arr_ref+=(\"$2\")\n}\nfruits=(apple banana)\nappend_item fruits cherry\necho \"${fruits[@]}\"\n```\nOutput:\n```\napple banana cherry\n```\nThis is genuinely something ordinary positional parameters cannot do — passing `\"${fruits[@]}\"` as arguments would flatten the array into separate words, with no way for the function to know they all belonged to one array named `fruits`, let alone append back onto it. The nameref sidesteps this completely: `arr_ref` *is* `fruits`, for every purpose, for the life of the function call.\n\n**3. Returning an array from a function — the real fix for Chapter 4.3's gap.**\n```bash\nmake_range() {\n  local -n out_ref=$1\n  local start=$2 end=$3\n  out_ref=()\n  for ((i=start; i<=end; i++)); do\n    out_ref+=(\"$i\")\n  done\n}\ndeclare -a myrange\nmake_range myrange 1 5\necho \"${myrange[@]}\"\n```\nOutput:\n```\n1 2 3 4 5\n```\nThe caller declares an empty array, passes its *name* to the function, and the function builds the result directly into it — genuinely the cleanest way to have a function \"return\" a whole array, since `echo`-and-capture would require serializing the array to text and parsing it back apart afterward.\n\n**4. The same technique works for associative arrays.**\n```bash\nset_config() {\n  local -n cfg_ref=$1\n  cfg_ref[$2]=$3\n}\ndeclare -A config\nset_config config timeout 30\necho \"${config[timeout]}\"\n```\nOutput:\n```\n30\n```\n`cfg_ref` is a reference to `config` itself — setting `cfg_ref[$2]` really sets `config`'s own key, exactly as if the function had written `config[timeout]=30` directly.\n\n**5. A real, verified footgun: the nameref's own local name colliding with the caller's variable name.**\n```bash\nmyfunc() {\n  local -n ref=$1\n  ref=42\n}\nref=5\nmyfunc ref\n```\nRunning this produces (the exact filename/line numbers will vary; the key part is the repeated warning):\n```\nscript.sh: line 3: local: warning: ref: circular name reference\nscript.sh: line 3: warning: ref: circular name reference\nscript.sh: line 4: warning: ref: circular name reference\nafter: 42\n```\nBash detects that the nameref variable (`ref`, local to the function) and the variable being referenced (also happened to be named `ref`, in the caller) are the exact same name, and warns about a **circular name reference** — since a nameref named `ref` pointing at a variable named `ref` is, structurally, pointing at itself. In this simple case the assignment still went through correctly (`$ref` ended up `42`), but three separate warnings fired along the way, and the situation is genuinely fragile, not something to rely on. The fix is simple and worth adopting as a default habit: **give the local nameref variable a distinctly different name** from anything a caller is likely to pass in — commonly prefixed with an underscore or two:\n```bash\nmyfunc2() {\n  local -n __ref=$1\n  __ref=42\n}\nval=5\nmyfunc2 val\necho \"after: $val\"\n```\nOutput (no warning at all):\n```\nafter: 42\n```\nConfirmed clean — `__ref` will never collide with an ordinary caller variable name like `val`, `count`, or `config`.\n\n### ⚠️ Common Mistakes\n\n- **Naming the local nameref variable something a caller might plausibly also use**, as Example 5 demonstrates concretely. Always give it a distinctive name (`__ref`, `_out`, `result_ref`) that's extremely unlikely to collide with whatever the caller happens to name their own variable.\n- **Passing the variable's value (`$x`) instead of its name (`x`).** `double_it \"$x\"` (with the `$`) hands the function the string `\"5\"`, not a reference to `x` at all — the nameref would then attach itself to a variable literally named `5`, which fails or does nothing useful. The whole mechanism depends on passing the bare name.\n- **Forgetting namerefs need Bash 4.3 or later.** Check with `bash --version` (Chapter 0.2) before relying on this technique in a script that might run on an older system.\n- **Overusing namerefs where a simple return value (Chapter 4.3's `echo`/capture) would be clearer.** Namerefs are the right tool specifically for arrays, associative arrays, or when a function genuinely needs to modify several of the caller's variables at once — for a single scalar result, `result=$(myfunc)` usually reads more plainly to someone unfamiliar with namerefs.\n- **Confusing a nameref with `declare -g` (Chapter 2.5).** `declare -g` forces a *specific, hardcoded* variable name to be global; a nameref is dynamic — it points at whatever name was passed in, decided by the caller at call time, not fixed in the function's own code.\n\n### How this connects\n\nThis chapter closes a genuine gap left open since Chapter 4.3 — arrays and associative arrays (2.6, 2.7) can now be passed into and out of functions properly, not just worked around. It builds directly on `local` (4.4) — a nameref is itself just a specially-flagged local variable — and complements `declare -g` (2.5) as a second, more flexible way for a function to reach outside its own scope, deliberately rather than by accident.\n\n### Quick recap\n\n- `local -n ref=$1` makes `ref` a **nameref**: reads and writes to `ref` transparently redirect to whatever variable name was passed in as `$1`.\n- Call with the bare variable name (`myfunc x`), never with `$x` — the function needs the *name*, not the value.\n- This is the correct way to pass an array or associative array into a function, or have a function build one and hand it back to the caller, without flattening it through text.\n- **Give the local nameref variable a distinctive name** (`__ref`, not `ref`) to avoid a \"circular name reference\" warning when a caller happens to pass in a variable with the same name.\n- Requires Bash 4.3+."}, {"id": "5.1", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "streams, redirection, error handling & I/O", "chapNum": 1, "slug": "standard-streams", "fullTitle": "Standard Streams: stdin, stdout, stderr", "title": "Standard Streams: stdin, stdout, stderr", "md": "### Why this matters\n\nEvery command you run is connected to three channels the moment it starts, whether it looks like it or not — one for reading input, two for writing output. Understanding these three streams properly is what makes redirection (next chapter) and pipes (the chapter after) make real sense, rather than feeling like arbitrary syntax to memorize. This is the foundational concept Part V — Paragraphs is built on.\n\n### The core idea\n\nEvery Bash command has access to three **standard streams**, each identified by a small number called a **file descriptor**:\n\n| Stream | File descriptor | Purpose |\n|---|---|---|\n| **stdin** (standard input) | `0` | Where a command reads input from, by default |\n| **stdout** (standard output) | `1` | Where a command's normal output goes, by default |\n| **stderr** (standard error) | `2` | Where a command's error/diagnostic messages go, by default |\n\nBy default, all three are connected to your terminal: stdin reads whatever you type, and both stdout and stderr print to your screen — which is exactly why, without knowing any of this, everything a command prints just seems to \"appear,\" and everything you type just seems to \"go somewhere.\" **The crucial insight: stdout and stderr are two genuinely separate streams, even though they both normally show up mixed together on your screen.** They can be redirected independently, which is the entire point of having two output streams instead of one.\n\n### Examples\n\n**1. Ordinary output goes to stdout; explicitly sending something to stderr uses `>&2`.**\n```bash\necho \"this goes to stdout\"\necho \"this goes to stderr\" >&2\n```\nOutput (both lines appear, since your terminal shows both streams):\n```\nthis goes to stdout\nthis goes to stderr\n```\nOn screen, these look identical — the difference only becomes visible once you start redirecting (Chapter 5.2), which is exactly what the next example does.\n\n**2. Separating the two streams — this makes the distinction concrete.**\n```bash\n{ echo \"stdout line\"; echo \"stderr line\" >&2; } 1>out.txt 2>err.txt\ncat out.txt\ncat err.txt\n```\nOutput:\n```\nstdout line\nstderr line\n```\n`1>out.txt` sends stdout into `out.txt`; `2>err.txt` sends stderr into `err.txt` — completely separately. Reading each file back confirms each stream's content landed in its own place, even though on a terminal they'd have appeared identically interleaved. (The full syntax for redirection is Chapter 5.2's subject — this example previews it just enough to make streams concrete.)\n\n**3. Why the stdout/stderr split exists: a real command's error message.**\n```bash\nls /nonexistent123\n```\nOutput:\n```\nls: cannot access '/nonexistent123': No such file or directory\n```\nThis message went to **stderr**, not stdout — even though it appeared right there on your screen alongside everything else. This distinction matters enormously in real scripts: it lets you capture a command's *actual data* (stdout) separately from its *diagnostic noise* (stderr), so an error message never accidentally gets treated as real data, and real output never accidentally gets buried among error text.\n\n**4. stdin — where a command reads input from.**\n```bash\necho \"piped input\" | cat\n```\nOutput:\n```\npiped input\n```\n`cat` with no filename argument reads from stdin — here, the pipe (Chapter 5.3) connects `echo`'s stdout directly to `cat`'s stdin, so `cat` echoes back whatever it received. This is the same mechanism `read` (Chapter 3.7) uses to receive whatever's typed at a terminal, or piped in, or redirected from a file.\n\n**5. File descriptors really are just numbers.**\n```bash\necho \"0=stdin 1=stdout 2=stderr - these are just numbers\"\n```\nThere's nothing magical about them — `1` and `2` are just the conventional, universally-agreed-upon numbers for stdout and stderr, exactly the way `>&2` in Example 1 explicitly referenced descriptor `2`. Chapter 5.2 shows how to redirect using these numbers directly, and even how to open additional file descriptors beyond these three for more advanced cases.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a command's error message went to stdout because it appeared right there on the terminal.** Both streams print to the same terminal by default, so there's no visual difference until you actually redirect one of them (Example 3) — a script that captures `command`'s output with `$(...)` (Chapter 2.8) does **not** capture its stderr messages, only stdout, which is a very common point of confusion the first time an error message \"disappears\" from a captured result.\n- **Writing diagnostic/log messages to stdout instead of stderr.** If a function or script is meant to be used with its output captured (Chapter 2.8, Chapter 4.3's `echo`-and-capture pattern), any progress or debug message printed to stdout pollutes that captured value. Send genuine diagnostics to stderr (`>&2`) specifically so they don't interfere with real captured output.\n- **Confusing \"printed to the screen\" with \"printed to stdout.\"** They're not the same thing — the screen is just where both streams happen to end up by default. Get in the habit of asking \"which stream is this actually going to\" rather than \"does it show up.\"\n- **Forgetting file descriptor numbers `0`, `1`, `2` are conventions, not something enforced by the operating system to only ever mean these three things** — a script *can* open and use additional descriptors (Chapter 6.3 touches on this), though the vast majority of everyday scripting only ever needs these three.\n\n### How this connects\n\nThis chapter is the conceptual foundation for the entire rest of Part V — Chapter 5.2 (Redirection) is the full syntax for sending any of these three streams somewhere other than the terminal, and Chapter 5.3 (Pipes) is specifically about connecting one command's stdout to another's stdin, exactly as previewed in Example 4. Nothing here is new machinery — it's the concept that makes everything from here through the rest of Part V click into place.\n\n### Quick recap\n\n- Every command has three standard streams: **stdin** (`0`, input), **stdout** (`1`, normal output), **stderr** (`2`, error/diagnostic output).\n- All three connect to the terminal by default, which is why stdout and stderr look identical until you redirect one of them.\n- `>&2` sends output to stderr explicitly; capturing a command's output with `$(...)` only captures stdout, never stderr.\n- Use stderr for diagnostics/errors, stdout for a command's genuine data output — this separation is the entire reason the split exists."}, {"id": "5.2", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "streams, redirection, error handling & I/O", "chapNum": 2, "slug": "redirection", "fullTitle": "Redirection", "title": "Redirection", "md": "### Why this matters\n\nChapter 5.1 established that every command has stdin/stdout/stderr, connected to the terminal by default. Redirection is how you change what each of those streams connects to instead — a file, another stream, or nowhere at all. This is one of the most practically useful things you'll do constantly: saving output, separating errors from real data, feeding a command input from a file. It's also home to one of Bash's most infamous \"gotcha\" orderings, covered fully here so it never catches you by surprise.\n\n### The core idea\n\n| Syntax | Meaning |\n|---|---|\n| `command > file` | stdout to `file`, **overwriting** it |\n| `command >> file` | stdout to `file`, **appending** to it |\n| `command < file` | stdin **from** `file` |\n| `command 2> file` | stderr to `file` |\n| `command &> file` | **both** stdout and stderr to `file` |\n| `command > file 2>&1` | stdout to `file`, **then** stderr redirected to wherever stdout currently points |\n\nThat last one is the one worth reading slowly, and the rest of this chapter treats it carefully: **redirections are set up left to right, in order**, and `2>&1` doesn't mean \"send stderr to the file\" — it means \"send stderr to wherever descriptor `1` (stdout) is *currently* pointing.\" Order changes the result completely.\n\n### Examples\n\n**1. `>` — overwrite.**\n```bash\necho \"first\" > redirtest.txt\ncat redirtest.txt\necho \"second\" > redirtest.txt\ncat redirtest.txt\n```\nOutput:\n```\nfirst\nsecond\n```\nThe second `>` completely replaced the file's contents — `\"first\"` is gone entirely, not appended to.\n\n**2. `>>` — append.**\n```bash\necho \"line1\" > append.txt\necho \"line2\" >> append.txt\ncat append.txt\n```\nOutput:\n```\nline1\nline2\n```\nThe first `>` created the file fresh; the second, using `>>`, added a line without disturbing what was already there.\n\n**3. `<` — redirect stdin from a file.**\n```bash\nwc -l < append.txt\n```\nOutput:\n```\n2\n```\n`wc -l` counts lines from whatever its stdin is connected to — here, the file directly, rather than needing the file's name as an argument or piping it in through `cat`.\n\n**4. `2>` — stderr only.**\n```bash\nls /nope1 /nope2 2> errors.txt\ncat errors.txt\n```\nOutput:\n```\nls: cannot access '/nope1': No such file or directory\nls: cannot access '/nope2': No such file or directory\n```\nBoth error messages landed in `errors.txt`, exactly like Chapter 5.1's introduction — nothing new here except naming the actual syntax.\n\n**5. `&>` — both streams into one file at once.**\n```bash\n{ echo \"out\"; echo \"err\" >&2; } &> both.txt\ncat both.txt\n```\nOutput:\n```\nout\nerr\n```\n`&>` is Bash's shorthand for \"redirect stdout and stderr both to this same destination\" — simpler than spelling out both separately when that's genuinely what you want.\n\n**6. `2>&1` in the *correct* order — merges stderr into wherever stdout is already going.**\n```bash\n{ echo \"out\"; echo \"err\" >&2; } > merged.txt 2>&1\ncat merged.txt\n```\nOutput:\n```\nout\nerr\n```\nRead left to right: first `> merged.txt` points stdout at the file, *then* `2>&1` points stderr at \"wherever stdout currently points\" — which, by that point, is also the file. Both streams end up merged in `merged.txt`.\n\n**7. `2>&1` in the *wrong* order — the classic gotcha.**\n```bash\n{ echo \"out\"; echo \"err\" >&2; } 2>&1 > wrongorder.txt\n```\n`wrongorder.txt` ends up containing only:\n```\nout\n```\nwhile `err` still prints to the terminal. Read it left to right again: `2>&1` runs *first*, at which point stdout is still pointing at the terminal — so stderr gets pointed at the terminal too (no change yet). *Then* `> wrongorder.txt` repoints stdout at the file — but stderr, already locked onto the terminal from the earlier step, stays there. The two redirections don't \"see\" each other's future state; each one only knows where things point *at the moment it runs*.\n\n**8. Discarding output entirely with `/dev/null`.**\n```bash\nls /nope3 2>/dev/null\necho \"exit: $?\"\n```\nOutput:\n```\nexit: 2\n```\nNo error message printed at all — `/dev/null` is a special file that silently discards anything written to it. Note the exit status (`2`, \"not found\") is completely unaffected — redirecting a stream changes where its *output* goes, never a command's actual success/failure result.\n\n**9. A quick preview: the here-string.**\n```bash\ncat <<< \"here string content\"\n```\nOutput:\n```\nhere string content\n```\n`<<<` feeds a single string directly to a command's stdin, without needing a file at all — genuinely useful, and one of a small family of related tools (here-documents, `<<`) that Chapter 5.4 covers in full.\n\n**10. `exec` — redirecting a whole script's output from that point forward, with no per-command repetition.**\n```bash\n#!/usr/bin/env bash\nexec > output.log\necho \"this goes to the file, not the terminal\"\necho \"so does this\"\n```\nRunning this script produces no visible terminal output at all — both `echo` lines land in `output.log` instead:\n```\nthis goes to the file, not the terminal\nso does this\n```\nEvery earlier example redirected *one command's* output. `exec > file` (with no command after `exec`) does something different: it changes **the shell's own** stdout, from that line onward, for the rest of the script — so every subsequent command's output goes to `file` without needing `> file` repeated on every single line. This is a genuinely common pattern at the top of a logging-heavy script: `exec > \"$logfile\" 2>&1` sends everything — every `echo`, every command's normal output and errors — into one log file for the script's entire remaining run.\n\n### ⚠️ Common Mistakes\n\n- **Getting `2>&1`'s order backwards.** As Example 7 shows in painful detail, `2>&1 > file` and `> file 2>&1` produce genuinely different results — the second is almost always what you actually want when the goal is \"put everything in one file.\" Read redirections left to right, and remember `2>&1` only captures wherever stdout is pointing *at that exact moment* in the line.\n- **Forgetting `>` overwrites without warning.** There's no confirmation prompt, no backup — `>` onto an existing file silently destroys its previous contents the instant the command runs. Double check `>` vs `>>` any time the target file might already hold something you care about.\n- **Trying to redirect a command's exit status.** As Example 8 shows, redirection only ever affects where a stream's *content* goes — a command's success/failure is a completely separate thing, checked via `$?` (Chapter 1.5), unaffected by any of this.\n- **Reading and writing the same file in one command**, e.g. `sort file.txt > file.txt`. This is a genuinely common trap: Bash sets up the `>` redirection (truncating `file.txt` to empty) *before* `sort` ever gets a chance to read it — so `sort` ends up reading an already-empty file, and the result is an empty file, not a sorted version of the original. Redirect to a different temporary file and then move it into place instead (or use a tool specifically designed for in-place editing, like `sed -i`, covered in Chapter 7.2).\n- **Confusing `&>` (both streams, Bash-specific shorthand) with `> file 2>&1` (equivalent, more portable, works in more shells).** Both accomplish the same thing; `&>` is quicker to type but Bash-specific — worth recognizing both forms.\n- **Using `exec > file` and assuming there's no way back to the terminal afterward.** There is: save the original stdout to a spare file descriptor first (`exec 3>&1`), then restore it later (`exec 1>&3`) — genuinely useful for a script that wants to log most of its output but still print a final summary directly to the terminal.\n\n### How this connects\n\nRedirection is the practical toolkit built directly on Chapter 5.1's stream concepts, and it becomes essential the instant Chapter 5.5 covers reading and writing files for real, and Chapter 5.6 covers error handling (where routing stderr correctly often matters for a script's own logging). Chapter 5.3, next, covers pipes — which are really just a special, more direct case of connecting one command's stdout straight to another command's stdin, without a file ever sitting in between.\n\n### Quick recap\n\n- `>` overwrites, `>>` appends — both redirect stdout to a file.\n- `<` redirects a command's stdin from a file.\n- `2>` redirects stderr specifically; `&>` redirects both stdout and stderr together.\n- `2>&1` means \"point this stream at wherever the other one currently points\" — **order matters**: `> file 2>&1` merges correctly, `2>&1 > file` does not.\n- `/dev/null` silently discards anything written to it.\n- Never redirect a file's own output back into itself in the same command (`sort f > f`) — it gets truncated before being read.\n- `exec > file` (no command after `exec`) redirects the *shell's own* stdout from that point forward — every later command's output goes to `file` without repeating the redirection each time; `exec > file 2>&1` does the same for both streams at once, the standard idiom for logging a whole script's run to one file."}, {"id": "5.3", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "streams, redirection, error handling & I/O", "chapNum": 3, "slug": "pipes-connecting-commands", "fullTitle": "Pipes: Connecting Commands", "title": "Pipes: Connecting Commands", "md": "### Why this matters\n\nThis is the idea at the heart of \"the Unix philosophy\" — small, focused programs, each good at one thing, chained together to do something bigger than any one of them does alone. A pipe is the connector: it takes one command's stdout and feeds it directly into the next command's stdin, with no file ever touching disk in between. Once this clicks, an enormous amount of real command-line work becomes a matter of finding the right two or three tools and pipe-connecting them.\n\n### The core idea\n\n```bash\ncommand1 | command2\n```\n`command1`'s stdout becomes `command2`'s stdin — directly, in memory, without an intermediate file. You can chain as many as you like:\n```bash\ncommand1 | command2 | command3\n```\neach stage's output feeding the next stage's input, left to right. This is exactly Chapter 5.1's stream concept, applied to connect two commands together instead of connecting one command to a file.\n\n### Examples\n\n**1. A basic pipe.**\n```bash\necho \"hello world\" | tr 'a-z' 'A-Z'\n```\nOutput:\n```\nHELLO WORLD\n```\n`echo`'s stdout (`hello world`) becomes `tr`'s stdin, and `tr` (Chapter 7.6) transforms it before printing its own output.\n\n**2. A multi-stage pipeline.**\n```bash\nprintf \"banana\\napple\\ncherry\\napple\\n\" | sort | uniq\n```\nOutput:\n```\napple\nbanana\ncherry\n```\nThree stages: `printf` produces the raw lines, `sort` (Chapter 7.6) orders them alphabetically, `uniq` (Chapter 7.6) removes adjacent duplicates — note the duplicate `apple`s are gone because `sort` placed them next to each other first, which is exactly why `sort | uniq` is such a common pairing.\n\n**3. A pipe only carries stdout, not stderr.**\n```bash\n{ echo \"out\"; echo \"err\" >&2; } | cat\n```\nOutput (order may vary slightly by system, since the two streams are genuinely independent):\n```\nerr\nout\n```\n`err` still shows up because it goes straight to the terminal (stderr wasn't part of the pipe at all) — only `out`, printed to stdout, actually traveled through the pipe into `cat`. This is a direct, practical consequence of Chapter 5.1's stream distinction: `|` connects stdout to stdin specifically, leaving stderr completely untouched by default.\n\n**4. A pipeline's exit status is, by default, just the *last* command's status.**\n```bash\nfalse | true\necho \"status: $?\"\n\ntrue | false\necho \"status: $?\"\n```\nOutput:\n```\nstatus: 0\nstatus: 1\n```\nEven though `false` clearly failed in the first pipeline, the overall reported status is `0` (from `true`, the last stage) — the earlier failure is invisible by default. This is a real, frequently surprising gotcha, and the next two examples show the fix.\n\n**5. `PIPESTATUS` — the exit status of *every* stage.**\n```bash\nfalse | true | false\necho \"${PIPESTATUS[@]}\"\n```\nOutput:\n```\n1 0 1\n```\n`PIPESTATUS` is a special array (Chapter 2.6) that Bash automatically fills in immediately after any pipeline, holding each stage's individual exit status in order. Check it right after the pipeline runs — like `$?`, it gets overwritten the moment another command runs.\n\n**6. `set -o pipefail` — make the pipeline's overall status reflect *any* stage failing.**\n```bash\nset -o pipefail\nfalse | true\necho \"status with pipefail: $?\"\n```\nOutput:\n```\nstatus with pipefail: 1\n```\nWith `pipefail` enabled, the pipeline's exit status becomes the *rightmost* nonzero status among all its stages (or `0` if every stage succeeded) — so the earlier `false` is no longer silently swallowed. Chapter 5.6 covers `pipefail` fully as part of writing scripts that fail loudly and correctly rather than silently continuing past a real problem.\n\n**7. `tee` — see output *and* save it, at the same time.**\n```bash\necho \"logged line\" | tee pipetest.txt\ncat pipetest.txt\n```\nOutput:\n```\nlogged line\nlogged line\n```\n`tee` (Chapter 7.7 covers it as part of a utility-command tour) writes its input both to the named file *and* back out to its own stdout — so it can sit in the middle of a pipeline, quietly saving a copy of the data flowing through, without interrupting the pipeline itself.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a pipeline \"succeeded\" just because it exited `0`, without checking `PIPESTATUS` or enabling `pipefail`.** As Example 4 shows starkly, an early stage can fail completely silently, with the overall pipeline still reporting success. This is one of the more dangerous default behaviors in Bash for scripts that need to be genuinely reliable — Chapter 5.6 covers turning `pipefail` on as a standard practice for exactly this reason.\n- **Expecting a pipe to carry stderr.** As Example 3 shows, it doesn't, by default — a command's error messages inside a pipeline still go straight to the terminal (or wherever stderr is already pointed), bypassing the pipe entirely. `2>&1 |` (redirecting stderr into stdout *before* the pipe) is the way to include stderr in what flows through a pipeline, when that's genuinely needed.\n- **Overusing pipes for something a single command's own options already do.** `cat file.txt | grep pattern` works, but `grep pattern file.txt` does the same thing without spawning an extra `cat` process — a very common, harmless-but-unnecessary habit worth unlearning (sometimes called \"useless use of cat\").\n- **Forgetting that each pipeline stage runs in its own subshell.** This is the exact mechanism behind Chapter 3.5's `while read` pipe trap — any variable set *inside* a pipeline stage doesn't survive once the pipeline finishes, because that stage was never running in your main shell to begin with.\n\n### How this connects\n\nPipes are the payoff of Chapter 5.1's stream concept — connecting one command's stdout directly to another's stdin is, quite literally, the whole idea. The `PIPESTATUS`/`pipefail` material here sets up Chapter 5.6's fuller treatment of writing scripts that fail loudly and correctly rather than silently continuing past a hidden problem, and the subshell note above is the direct explanation behind Chapter 3.5's `while read` gotcha, now named precisely.\n\n### Quick recap\n\n- `command1 | command2` connects `command1`'s stdout directly to `command2`'s stdin — chain as many stages as needed.\n- A pipe only carries stdout, never stderr, by default.\n- A pipeline's default exit status is just its *last* stage's status — earlier failures are silently hidden unless you check.\n- `PIPESTATUS` (an array) holds every stage's individual exit status; `set -o pipefail` changes the pipeline's overall status to reflect any failing stage.\n- `tee` lets you view and save a pipeline's data at the same time, without interrupting the flow.\n- Each pipeline stage runs in its own subshell — variables set inside one don't survive after the pipeline ends."}, {"id": "5.4", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "streams, redirection, error handling & I/O", "chapNum": 4, "slug": "here-documents-here-strings", "fullTitle": "Here-Documents & Here-Strings", "title": "Here-Documents & Here-Strings", "md": "### Why this matters\n\nChapter 2.1 showed a quoted string can span multiple lines, but that gets unwieldy fast for anything longer than a couple of lines — escaping quotes, tracking where the string ends. Here-documents solve this properly: a clean, readable way to embed a whole block of multi-line text directly in a script, commonly used for generating file content, writing usage/help messages, or feeding a fixed block of test input to a loop.\n\n### The core idea\n\n```bash\ncommand <<DELIMITER\nline 1\nline 2\nDELIMITER\n```\nEverything between the two occurrences of `DELIMITER` (a word you choose — `EOF` is the traditional convention, but any word works) becomes that command's stdin, exactly as if it had been typed there. A **here-string** (`<<<`) is the same idea for a single line, already previewed briefly in Chapter 5.2:\n```bash\ncommand <<< \"one line of input\"\n```\n\n### Examples\n\n**1. A basic here-document.**\n```bash\ncat <<EOF\nLine one\nLine two\nEOF\n```\nOutput:\n```\nLine one\nLine two\n```\n`cat` received both lines as its stdin, exactly as if they'd been typed interactively and then Ctrl+D pressed.\n\n**2. Variables and command substitution still expand inside a here-document, by default.**\n```bash\nname=\"Alex\"\ncat <<EOF\nHello, $name!\nToday: $(date +%A)\nEOF\n```\nOutput:\n```\nHello, Alex!\nToday: Sunday\n```\nThis is one of the most useful properties of a here-document: it behaves like a double-quoted string (Chapter 1.4) — variables and `$(...)` expand normally — which makes it excellent for generating dynamic file content, config files, or emails.\n\n**3. Quoting the delimiter suppresses all expansion.**\n```bash\ncat <<'EOF'\nNo expansion: $name and $(date)\nEOF\n```\nOutput:\n```\nNo expansion: $name and $(date)\n```\nPutting quotes around the delimiter (`<<'EOF'`, single or double quotes both work identically here) switches the here-document to behave like a single-quoted string instead — nothing expands, useful when you want to write out literal shell syntax (documentation, an example script, a template with its own `$variables` meant for someone/something else to fill in later).\n\n**4. `<<-` strips leading tabs, letting a here-document be indented to match your code.**\n```bash\ncat <<-EOF\n\tindented line\n\tEOF\n```\nOutput:\n```\nindented line\n```\nWithout the `-`, those leading tabs would be part of the actual content, printed along with everything else. With it, Bash strips leading **tab characters only** (not spaces) from each line before treating it as content — letting the here-document's closing delimiter, and its content, sit visually indented to match the surrounding code's indentation, rather than being forced back to the start of the line. This only recognizes actual tab characters, not spaces used for indentation — worth knowing since many editors substitute spaces for tabs automatically.\n\n**5. A here-string — the same idea for one line, no delimiter needed.**\n```bash\ncat <<< \"single line input\"\n```\nOutput:\n```\nsingle line input\n```\nGenuinely simpler than a full here-document when there's only one line of input to provide — you already used this pattern to feed test input into examples throughout Part III.\n\n**6. Feeding a `while read` loop with a fixed block of text.**\n```bash\nwhile IFS= read -r line; do\n  echo \"got: $line\"\ndone <<EOF\nfirst\nsecond\nEOF\n```\nOutput:\n```\ngot: first\ngot: second\n```\nThis is a genuinely common, practical pattern — a fixed, known block of text to process line by line, written directly in the script rather than needing an external file.\n\n### ⚠️ Common Mistakes\n\n- **The closing delimiter must be on its own line, with no leading whitespace** (unless you're specifically using `<<-` with tabs, per Example 4) **and no trailing characters after it.** A closing `EOF` with a trailing space, or accidentally indented with plain spaces instead of `<<-`'s recognized tabs, means Bash never sees it as the actual delimiter — it keeps reading the rest of the script as here-document content, usually producing a confusing cascade of errors far below the actual mistake.\n- **Forgetting that expansion happens by default**, and being surprised when a here-document meant to contain literal `$` signs or backticks (say, generating a script that itself uses variables) gets them expanded away instead. Quote the delimiter (Example 3) whenever the content should be taken completely literally.\n- **Using `<<-` and expecting it to strip leading spaces too.** It only strips tabs — a here-document indented with spaces (common if your editor auto-converts tabs to spaces) keeps those spaces as literal content, which can be a subtle, hard-to-spot bug in generated output.\n- **Choosing a delimiter word that might plausibly appear as actual content inside the block**, like `EOF` when the content is itself an example of a script that contains the literal text `EOF`. Bash has no way to tell the difference — it ends the here-document at the first line matching the delimiter exactly, regardless of context. Pick an unusual delimiter (`EOF_UNIQUE_MARKER`, or anything unlikely to appear naturally) when there's genuine risk of collision.\n\n### How this connects\n\nHere-documents build directly on the quoting principles from Chapter 1.4 (expansion vs. no expansion, controlled by quoting) and the stdin redirection concept from Chapter 5.2 — a here-document really is just a particularly convenient way to write `< file`'s content inline instead of in a separate file. You'll reach for this constantly once Part IX's capstone project needs to generate real file content, and it pairs naturally with the `while read` pattern from Chapter 3.5.\n\n### Quick recap\n\n- `command <<DELIMITER ... DELIMITER` feeds a multi-line block as that command's stdin; variables and `$(...)` expand by default, exactly like a double-quoted string.\n- Quoting the delimiter (`<<'EOF'`) suppresses all expansion — content is taken completely literally.\n- `<<-` strips leading **tab** characters (not spaces), letting the block visually match your code's indentation.\n- `<<<` is the single-line version — a here-string, no delimiter needed.\n- The closing delimiter must sit alone on its own line, with no extra characters — a stray space breaks it silently and confusingly."}, {"id": "5.5", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "streams, redirection, error handling & I/O", "chapNum": 5, "slug": "reading-writing-files", "fullTitle": "Reading & Writing Files", "title": "Reading & Writing Files", "md": "### Why this matters\n\nNearly every genuinely useful script eventually touches a real file — reading configuration, processing a log, generating a report. This chapter doesn't introduce much brand-new syntax; it's a focused, practical assembly of tools from earlier chapters (redirection, `read`, `while` loops) specifically aimed at files, plus the one correct idiom for handling a very common edge case that trips people up: a file whose last line has no trailing newline.\n\n### The core idea\n\nThree main ways to get a file's content into your script, matched to three different needs:\n- **Whole file into one variable** — `content=$(cat file.txt)` — when you need the entire content as one block of text.\n- **Line by line** — `while IFS= read -r line; do ... done < file.txt` — the Chapter 3.5 pattern, when you need to process each line individually.\n- **All lines into an array at once** — `mapfile -t arr < file.txt` — when you want every line availab
