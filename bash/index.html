'.users' users.json\n```\nGiven `{\"users\":[{\"name\":\"Alice\",\"age\":30},{\"name\":\"Bob\",\"age\":25}]}`:\n```json\n[\n  {\n    \"name\": \"Alice\",\n    \"age\": 30\n  },\n  {\n    \"name\": \"Bob\",\n    \"age\": 25\n  }\n]\n```\n\n**6. Iterating over an array with `.[]`, then extracting a field from each element.**\n```bash\njq '.users[].name' users.json\n```\nOutput:\n```\n\"Alice\"\n\"Bob\"\n```\n`.users[]` produces each element of the array *individually* (rather than as one array); `.name` on the end then extracts that field from each one in turn.\n\n**7. The same result, written with an explicit pipe — `jq`'s own `|`.**\n```bash\njq '.users[] | .name' users.json\n```\nOutput — identical:\n```\n\"Alice\"\n\"Bob\"\n```\n`jq`'s `|` chains filters together, exactly like Bash's own pipe operator conceptually (Chapter 5.3) — Example 6's `.users[].name` is really just shorthand for this same pipeline.\n\n**8. Filtering with `select()`.**\n```bash\njq '.users[] | select(.age > 26)' users.json\n```\nOutput:\n```json\n{\n  \"name\": \"Alice\",\n  \"age\": 30\n}\n```\n`select(condition)` keeps only the elements where `condition` is true — here, only Alice's record (age 30) passed the `age > 26` filter; Bob's (age 25) didn't.\n\n**9. Building a new, reshaped object.**\n```bash\njq '.users[] | {n: .name}' users.json\n```\nOutput:\n```json\n{\n  \"n\": \"Alice\"\n}\n{\n  \"n\": \"Bob\"\n}\n```\n`jq` can construct brand new JSON objects with `{key: .path}` syntax — genuinely useful for reshaping an API response into exactly the structure a script needs downstream.\n\n**10. `length` — counting elements.**\n```bash\njq '.users | length' users.json\n```\nOutput:\n```\n2\n```\n\n### ⚠️ Common Mistakes\n\n- **Trying to parse JSON with `grep`/`sed`/`cut` instead of `jq`.** JSON's structure (nested objects, arrays, values that can legitimately span formatting) doesn't reliably match line-oriented text tools — a `grep` pattern that happens to work on one API response can silently break the moment the same field appears formatted slightly differently. `jq` understands the actual structure, not just the text shape.\n- **Forgetting `-r` when a value is headed into a Bash variable.** Without it, `name=$(jq '.name' file.json)` gives `name` the literal value `\"Alice\"` — quotes included as part of the string — rather than just `Alice`, which then behaves unexpectedly wherever `$name` is used afterward.\n- **Confusing `.users` (the array itself) with `.users[]` (each element individually).** The first produces one JSON array as a single result; the second produces each element as its own separate result — genuinely different, and the source of confusing \"why did I get one result instead of several\" (or vice versa) moments.\n- **Writing an invalid `jq` filter and being confused by the error.** `jq`'s filter language has its own syntax, distinct from Bash's — a typo'd filter produces a `jq` parse error, not a Bash syntax error, worth recognizing as coming from a genuinely different small language embedded inside the command.\n- **Assuming `jq` is installed everywhere by default**, the way `grep`/`sed`/`awk` essentially always are. `jq` is common but not universal — worth an explicit availability check (`command -v jq`) in a script meant to run on systems you don't fully control.\n\n### How this connects\n\n`jq`'s `|` filter-chaining directly parallels the Bash pipeline concept from Chapter 5.3, applied to structured data instead of text lines — and it's the natural, correct complement to Chapter 7.10's `curl`, closing the loop this book opened when curl's JSON output had to be eyeballed rather than properly parsed. This closes out Part VII's toolbox entirely. Part VIII, next, turns to the craft of fixing and polishing scripts that already work: debugging, testing, common pitfalls, performance, and writing genuinely robust, re-runnable code.\n\n### Quick recap\n\n- `jq 'filter' file.json` (or piped from `curl`) queries JSON using `jq`'s own small filter language.\n- `.field`, `.nested.field` extract values by path; `.[]` iterates over an array's elements individually.\n- `-r` strips JSON's quoting from string output — use it whenever a result is headed into a Bash variable.\n- `|` chains filters (`.array[] | .field`); `select(condition)` filters elements; `{key: .path}` reshapes data into a new object; `length` counts elements.\n- `jq` is the correct tool for JSON specifically — `grep`/`sed`/`cut` are not reliable substitutes once real structure is involved."}, {"id": "8.1", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "debugging, testing & writing robust scripts", "chapNum": 1, "slug": "debugging-bash-scripts", "fullTitle": "Debugging Bash Scripts", "title": "Debugging Bash Scripts", "md": "### Why this matters\n\nEvery technique so far in this book has been about writing scripts correctly the first time — this chapter is about the reality that sometimes you don't, and need to find out *why*, efficiently. Bash has genuinely good built-in debugging tools, several of which you've already glimpsed (`set -u` from Chapter 5.6, `declare -p` from Chapter 2.5) — this chapter brings them together properly, plus the single most valuable one: `set -x`.\n\n### The core idea\n\n**`set -x`** turns on execution tracing — Bash prints every command it's about to run, with variables already expanded, prefixed with a `+`, right before running it. This turns a script's actual behavior visible line by line, which is often far faster than adding `echo` statements everywhere to guess at what's happening. **`bash -n`** checks a script's syntax without running any of it at all — genuinely useful for catching a typo before it has any chance to do anything.\n\n### Examples\n\n**1. `set -x` inside a script — tracing execution.**\n```bash\n#!/usr/bin/env bash\nset -x\nx=5\ny=$((x * 2))\necho \"result: $y\"\nset +x\n```\nOutput:\n```\n+ x=5\n+ y=10\n+ echo 'result: 10'\nresult: 10\n+ set +x\n```\nEvery traced line starts with `+`. Notice `y=10` — Bash shows the *already-computed* value, not the literal `$((x * 2))` expression, which is exactly what makes tracing so useful: you see the real values flowing through the script, not just its source code.\n\n**2. `bash -x` from outside — tracing without editing the script at all.**\n```bash\nbash -x plain.sh\n```\nOutput:\n```\n+ a=1\n+ b=2\n+ echo 3\n3\n```\nThis is often more convenient than adding `set -x` inside the script itself — no editing required, and no risk of forgetting to remove the tracing line afterward.\n\n**3. `PS4` — customizing the trace prefix for more useful output.**\n```bash\n#!/usr/bin/env bash\nPS4='+ Line ${LINENO}: '\nset -x\necho \"test\"\n```\nOutput:\n```\n+ Line 4: echo test\ntest\n```\n`PS4` (a special variable, defaulting to plain `+ `) controls exactly what prefixes each traced line — adding `${LINENO}` (a special variable holding the current line number) makes tracing output dramatically more useful on a longer script, where \"which line is this\" becomes a real question.\n\n**4. `set -u` (Chapter 5.6) as a debugging tool, not just a hardening measure.**\n```bash\n#!/usr/bin/env bash\nset -u\nmesage=\"hello\"\necho \"$message\"\n```\nOutput:\n```\n./typo.sh: line 4: message: unbound variable\n```\nThis is exactly Chapter 5.6's strict-mode option, shown here doing genuine debugging work — a typo'd variable name (`mesage` vs. `message`) that would otherwise silently print an empty string (Chapter 1.3's default) instead fails loudly, with the exact line number, immediately.\n\n**5. `bash -n` — checking syntax without running anything.**\n```bash\nbash -n syntaxerr.sh\n```\nGiven a script with a missing `then`:\n```\nsyntaxerr.sh: line 4: syntax error near unexpected token `fi'\n```\n`-n` parses the script and reports syntax errors, but never actually executes a single command — safe to run on a script you're not yet confident about, even one with potentially destructive commands in it, since nothing in it actually runs.\n\n**6. `trap ... DEBUG` — a hook that fires *before every single command*, showing what's about to run.**\n```bash\ntrap 'echo \"about to run: $BASH_COMMAND\"' DEBUG\nx=5\ny=$((x + 1))\n```\nOutput:\n```\nabout to run: x=5\nabout to run: y=$((x + 1))\n```\n`DEBUG` is a special pseudo-signal, similar in spirit to `ERR` (Chapter 5.6) but firing before *every* command, successful or not — `$BASH_COMMAND` holds the exact command about to execute. This is genuinely more granular than `set -x`: it lets you run custom logic (check a variable's value, log to a specific file, count how many commands have run) at every single step, not just print a trace line. It's a heavier tool than `set -x` for everyday use, but valuable for building a custom debugging or profiling harness around a script you don't want to modify command-by-command.\n\n### ⚠️ Common Mistakes\n\n- **Leaving `set -x` on for the entire remainder of a script when only one section needed tracing.** Bracket it precisely: `set -x` right before the suspicious section, `set +x` right after — otherwise the trace output for the rest of a longer script buries the part you actually needed to see.\n- **Trying to debug with only `echo` statements when `set -x` would show the same information faster and more completely.** Manually-placed `echo`s only show what you thought to check; `set -x` shows *everything*, including things you didn't think to ask about — genuinely useful for a bug whose actual cause turns out to be a surprise.\n- **Not knowing `bash -n` exists**, and instead running a script for real just to check whether it parses — risky if the script has any real side effects (deleting files, calling an API) that you'd rather not trigger while just checking for typos.\n- **Forgetting `declare -p` (Chapter 2.5)** as a quick way to inspect a variable's exact current value and type mid-debugging — genuinely useful alongside `set -x` for confirming a value (and its quoting/attributes) is exactly what you expect.\n- **Debugging by reading the script over and over rather than actually running it with tracing enabled.** Bash's actual runtime behavior (word splitting, glob expansion, quoting effects) is often easier to *observe* than to fully predict by reading — `set -x` exists precisely because tracing beats guessing.\n\n### How this connects\n\n`set -x` and `PS4` become genuinely essential the moment Chapter 8.3 covers common pitfalls in more depth — many of those gotchas are far easier to spot with tracing turned on than by reading code alone. `set -u`, already covered fully in Chapter 5.6, gets its natural second life here as a debugging tool, not just a hardening measure. Chapter 8.2, next, covers testing — the complementary practice of catching bugs *before* they need debugging in the first place.\n\n### Quick recap\n\n- `set -x` (inside a script) or `bash -x script.sh` (from outside) traces every command as it runs, with variables already expanded — the single most useful Bash debugging tool.\n- `PS4='+ Line ${LINENO}: '` customizes the trace prefix to include the line number, making tracing far more useful on longer scripts.\n- `set -u` (Chapter 5.6) doubles as a debugging tool — it turns a typo'd variable name into an immediate, loud, line-numbered error.\n- `bash -n script.sh` checks syntax without executing anything — safe to run even on a script with risky side effects.\n- Bracket `set -x`/`set +x` tightly around just the section you're investigating, rather than leaving it on for an entire script.\n- `trap '...' DEBUG` fires before every command, with `$BASH_COMMAND` holding what's about to run — more granular than `set -x`, useful for building custom debugging/profiling logic."}, {"id": "8.2", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "debugging, testing & writing robust scripts", "chapNum": 2, "slug": "testing-bash-scripts", "fullTitle": "Testing Bash Scripts", "title": "Testing Bash Scripts", "md": "### Why this matters\n\nChapter 8.1 covered finding bugs after the fact; this chapter covers catching them systematically, before they ship — a real practice even for something as \"small\" as a Bash script. This book's own production process has quietly demonstrated this discipline throughout: every example was actually run and verified before being written down. This chapter turns that same instinct into a repeatable habit you can apply to your own scripts, both informally and with a proper testing framework.\n\n### The core idea\n\nTesting a Bash script means running it (or, better, its individual functions) against known inputs and checking the actual output matches what's expected — exactly the \"run it and verify\" discipline this book has modeled throughout. Two levels, both genuinely useful: **manual assertion checks** (a small pattern you can write yourself, no extra tools) for quick, lightweight verification, and **Bats** (Bash Automated Testing System), a proper testing framework, for anything that's grown past \"quick.\"\n\n### Examples\n\n**1. A function worth testing.**\n```bash\n# add.sh\nadd() {\n  echo $(( $1 + $2 ))\n}\n```\n\n**2. A simple, hand-rolled testing pattern — no extra tools needed.**\n```bash\nsource ./add.sh\n\npass_count=0\nfail_count=0\n\nassert_eq() {\n  local expected=\"$1\" actual=\"$2\" desc=\"$3\"\n  if [ \"$expected\" = \"$actual\" ]; then\n    echo \"PASS: $desc\"\n    ((pass_count++))\n  else\n    echo \"FAIL: $desc (expected '$expected', got '$actual')\"\n    ((fail_count++))\n  fi\n}\n\nassert_eq \"5\" \"$(add 2 3)\" \"add 2 + 3\"\nassert_eq \"2\" \"$(add 5 -3)\" \"add 5 + -3\"\nassert_eq \"99\" \"$(add 2 2)\" \"intentionally wrong expectation\"\n\necho \"Results: $pass_count passed, $fail_count failed\"\n```\nOutput:\n```\nPASS: add 2 + 3\nPASS: add 5 + -3\nFAIL: intentionally wrong expectation (expected '99', got '4')\nResults: 2 passed, 1 failed\n```\nThis `assert_eq` function is a genuinely reusable pattern — sourcing the file under test (Chapter 6.2), calling its functions with known inputs, and comparing actual results against expected ones. Nothing here requires anything beyond what this book has already taught: `local` (4.4), command substitution (2.8), `if`/comparison (3.1/3.2).\n\n**3. A proper testing framework: Bats.**\n```bash\n#!/usr/bin/env bats\n\nsetup() {\n  source \"$(dirname \"$BATS_TEST_FILENAME\")/add.sh\"\n}\n\n@test \"adds two positive numbers\" {\n  result=$(add 2 3)\n  [ \"$result\" -eq 5 ]\n}\n\n@test \"adds a negative number\" {\n  result=$(add 5 -3)\n  [ \"$result\" -eq 2 ]\n}\n\n@test \"intentionally failing test\" {\n  result=$(add 2 2)\n  [ \"$result\" -eq 5 ]\n}\n```\nRunning `bats add.bats`:\n```\n1..3\nok 1 adds two positive numbers\nok 2 adds a negative number\nnot ok 3 intentionally failing test\n# (in test file add.bats, line 19)\n#   `[ \"$result\" -eq 5 ]' failed\n```\nBats gives you a proper `@test` block syntax, a pass/fail summary in a standard format (`TAP`, used by many testing tools across many languages), and — critically — it reports *exactly which line failed* and what condition didn't hold, without you having to write your own `assert_eq` helper. `setup()` runs automatically before each test, a convenient place to `source` the file under test once rather than repeating it in every test.\n\n### ⚠️ Common Mistakes\n\n- **Testing only the \"happy path\" — inputs that are expected to work — and never a deliberately wrong or edge-case input.** A test suite that only confirms `add 2 3` gives `5` doesn't tell you anything about what happens with no arguments, a non-numeric argument, or a very large number. Deliberately testing bad inputs (and confirming the *right* kind of failure happens) is just as valuable as testing good ones.\n- **Writing a script's logic directly at the top level, with no functions to test in isolation.** A script that's one long sequence of top-level commands is hard to test piece by piece — structuring logic into functions (Chapter 4.1) specifically enables the kind of targeted testing shown in Examples 2 and 3.\n- **Never actually running the tests, treating writing them as sufficient on its own.** A test that's never executed catches nothing — the whole value comes from actually running the suite, ideally every time the script changes.\n- **Assuming a Bash script is \"too small\" or \"too simple\" to be worth testing.** This book's own production process — verifying every single example by actually running it before writing it down — caught genuine mistakes throughout (a wrong claim about `.*` matching `.`/`..` in Chapter 2.11, a broken `if $some_flag` example in Chapter 3.1). If a book's own examples needed this discipline, a real script benefits from it at least as much.\n- **Not testing exit statuses, only printed output.** A function or script can print the right thing while still returning the wrong exit status (Chapter 4.3) — a thorough test checks both, especially for anything whose caller relies on `&&`/`||` or an `if` check.\n\n### How this connects\n\nThis chapter's testing habit is exactly what this book's own production has practiced throughout — every verified example is, in miniature, a manual test confirming a claim before it was written down. `local`, functions, and `$?`-checking (Chapters 4.1–4.4) are the direct prerequisites for writing testable code in the first place. Chapter 8.3, next, catalogs the specific pitfalls a good test suite tends to catch — reading it alongside a testing habit makes both more effective.\n\n### Quick recap\n\n- Testing means running code against known inputs and checking actual results match expectations — a hand-rolled `assert_eq`-style function (no extra tools) is a genuinely useful starting point.\n- **Bats** (Bash Automated Testing System) provides `@test` blocks, a `setup()` hook, and standard pass/fail reporting for anything beyond quick, informal checks.\n- Test edge cases and deliberately bad input, not just the expected \"happy path.\"\n- Structuring logic into functions (Chapter 4.1) is what makes targeted testing possible in the first place.\n- Check exit statuses as well as printed output — a function can get one right and the other wrong."}, {"id": "8.3", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "debugging, testing & writing robust scripts", "chapNum": 3, "slug": "common-pitfalls-gotchas", "fullTitle": "Common Pitfalls & Gotchas", "title": "Common Pitfalls & Gotchas", "md": "### Why this matters\n\nThis book has flagged dozens of specific gotchas as they came up, each in its natural chapter. This chapter does two things: pulls the most consequential ones together into one place worth returning to, and adds a handful of genuinely new ones that didn't have an obvious earlier home. Think of this as the chapter to reread before shipping something you actually care about.\n\n### The core idea\n\nNearly every Bash gotcha traces back to one of a small number of root causes: **quoting** (or the lack of it), **word splitting**, **subshells silently isolating changes**, and **numbers vs. text being less distinct than they look**. Recognizing which of these underlies a given surprise is often the fastest way to a fix, even for a gotcha you haven't seen before.\n\n### Examples — a curated \"greatest hits,\" with three genuinely new ones\n\n**1. Unquoted variables — the single most consequential habit in this entire book.** (Full treatment: Chapters 1.4, 2.1, 3.2.) `[ -z $var ]` can silently produce the *right answer for the wrong reason*, or an outright error, depending on `$var`'s content. Default to `\"$var\"`, always.\n\n**2. Piping into `while read` (or any loop) that needs to persist a variable.** (Full treatment: Chapters 3.5, 6.3.) The pipe puts the loop in a subshell; every change inside vanishes the instant it ends. Redirect (`< file` or `< <(command)`) instead.\n\n**3. `for f in $(ls ...)` instead of a plain glob.** (Full treatment: Chapters 3.4, 7.4, 7.9.) Fragile on filenames with spaces, and unnecessary — `for f in *.txt` does the same job more simply and more safely.\n\n**4. String vs. numeric comparison.** (Full treatment: Chapters 2.4, 3.2.) `[ \"5\" = \"05\" ]` is false; `[ 5 -eq 05 ]` is true — two genuinely different kinds of equality, easy to reach for the wrong one.\n\n**5. A glob or a variable reference matching nothing, silently.** (Full treatment: Chapters 1.3, 2.11, 3.4.) An unset variable expands to empty text without complaint; a non-matching glob stays literal without `nullglob`. Both fail quietly rather than loudly, by default.\n\n**6. Empty arrays and `set -u` — a real, version-dependent gotcha.**\n```bash\nset -u\narr=()\nfor x in \"${arr[@]}\"; do echo \"$x\"; done\necho \"no crash on bash $BASH_VERSION\"\n```\nOn this book's Bash version (5.2), this runs cleanly with no error. **On Bash versions older than 4.4, however, `\"${arr[@]}\"` on a genuinely empty array under `set -u` was treated as an unbound-variable error** — a well-known compatibility trap for anyone maintaining a script that needs to run on an older system (some older macOS installs, in particular, ship a very old Bash — recall Chapter 0.2's note about macOS's outdated pre-installed Bash 3.2). If a script needs to support genuinely old Bash versions, checking array length explicitly before iterating (`(( ${#arr[@]} > 0 ))`) sidesteps the issue entirely, portably.\n\n**7. Integer arithmetic silently overflows and wraps around.**\n```bash\necho $((9223372036854775807 + 1))\n```\nOutput:\n```\n-9223372036854775808\n```\nBash's arithmetic (Chapter 2.4) uses fixed-size 64-bit signed integers under the hood — exceeding the maximum value doesn't error, it silently wraps around to the *most negative* possible value, exactly like classic integer overflow in many compiled languages. Scripts doing arithmetic on genuinely huge numbers (unlikely in typical scripting, but real in some data-processing contexts) need to be aware this ceiling exists.\n\n**8. An unquoted variable on the right side of `[[ == ]]` is matched as a *glob pattern*, not compared literally — even if you didn't intend that.**\n```bash\npattern=\"a*c\"\nstr=\"abc\"\n[[ \"$str\" == $pattern ]] && echo \"MATCHED as glob (surprising if unintended)\"\n[[ \"$str\" == \"$pattern\" ]] && echo \"matched literal\" || echo \"no literal match\"\n```\nOutput:\n```\nMATCHED as glob (surprising if unintended)\nno literal match\n```\nThis is a sharper, more dangerous version of the general \"quote your variables\" rule (Chapter 3.2 introduced `[[ ]]`'s glob-matching as a *feature*; this is the same mechanism catching you off guard). If `$pattern` is meant to be compared as a literal string — say, it came from user input that might coincidentally contain a `*` or `?` — leaving it unquoted on the right side of `==` inside `[[ ]]` silently reinterprets it as a wildcard pattern instead of literal text. Quote it (`\"$pattern\"`) whenever a literal comparison is what's actually intended.\n\n**9. `local var=$(command)` masks the command's exit status; a plain `var=$(command)` does not.**\n```bash\nresult=$(false)\necho \"exit after plain assignment: $?\"\n```\nOutput:\n```\nexit after plain assignment: 1\n```\nCorrectly reflects `false`'s failure. But inside a function:\n```bash\nf() { local result=$(false); echo \"exit after local assignment: $?\"; }\nf\n```\nOutput:\n```\nexit after local assignment: 0\n```\nChapter 4.4 briefly flagged this; here's the precise mechanism, verified directly: `local` is itself a command, and when it's combined with an assignment in one line, **`local`'s own exit status (which is essentially always `0`) is what `$?` reports afterward — not the command substitution's.** A plain, non-`local` assignment doesn't have this problem, because there's no separate \"declaration command\" involved. The fix, when a captured command's exit status genuinely matters: separate the declaration from the assignment — `local result; result=$(false)` — so the assignment itself (not wrapped in `local`) is the last thing that ran before checking `$?`.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a \"surprising\" result must be a bug in Bash itself, rather than one of the handful of root causes above.** Nearly every gotcha in this chapter (and this book) traces back to quoting, word splitting, subshell isolation, or the numeric/text distinction — recognizing which one applies is usually the fastest route to understanding *why*, not just *that* something went wrong.\n- **Not knowing which Bash version a script will actually run on.** Example 6 is a direct illustration of why this matters — behavior that's perfectly safe on a modern Bash can fail on an older one, particularly relevant given macOS's outdated pre-installed version (Chapter 0.2).\n- **Treating `[[ ]]`'s glob-matching (Chapter 3.2) as always desirable**, without considering that an unquoted right-hand variable might contain glob characters unintentionally — Example 8 shows this cutting the wrong way when the comparison was actually meant to be literal.\n- **Assembling `local` and a command substitution on one line out of habit**, without considering whether the substitution's exit status will be needed afterward — Example 9 shows exactly when this combination silently discards information you might need.\n\n### How this connects\n\nThis chapter deliberately revisits material from nearly every earlier part of the book — proof that a handful of root mechanisms (quoting, subshells, splitting, numeric/text distinction) explain a very large share of Bash's real-world surprises. The three new gotchas here (version-dependent empty-array behavior, integer overflow, and the `local`-masks-exit-status mechanism) round out the picture with detail that didn't have a natural earlier home. Chapter 8.4, next, turns to performance — a different, complementary lens on writing genuinely good Bash.\n\n### Quick recap\n\n- The vast majority of Bash gotchas trace back to: unquoted variables, subshell isolation, silent word-splitting/glob-matching, or blurred numeric/text comparisons — recognize the category, find the fix faster.\n- Empty-array iteration under `set -u` is safe on modern Bash (4.4+) but was an unbound-variable error on older versions — check `(( ${#arr[@]} > 0 ))` explicitly for portability to older systems.\n- Bash integer arithmetic silently wraps around on overflow rather than erroring — a real ceiling to be aware of for large-number computation.\n- An unquoted variable on the right of `[[ == ]]` is matched as a glob pattern, not literal text — quote it when a literal comparison is actually intended.\n- `local var=$(cmd)` masks `cmd`'s exit status with `local`'s own (`0`); split the declaration and assignment onto separate lines when the inner command's status genuinely needs checking."}, {"id": "8.4", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "debugging, testing & writing robust scripts", "chapNum": 4, "slug": "performance-efficiency", "fullTitle": "Performance & Efficiency in Shell Scripts", "title": "Performance & Efficiency in Shell Scripts", "md": "### Why this matters\n\nBash scripts are rarely the place to obsess over performance the way you might in a compiled language — but one specific mistake shows up constantly and genuinely matters: launching an external program inside a loop that runs many times. Every external command costs real, measurable time to start, and a loop that does it hundreds or thousands of times adds up fast. This chapter shows the actual, measured difference, and the built-in alternatives that avoid it.\n\n### The core idea\n\nEvery time a script runs an external program (`tr`, `grep`, `sed`, `awk`, anything not built into Bash itself), the operating system has to create a whole new process for it — genuinely expensive compared to Bash's own built-in operations, which need no new process at all. This cost is invisible for a one-off command, but multiplies directly with how many times it happens inside a loop. **The single most valuable performance habit in Bash scripting: prefer a builtin over an external command inside a loop, whenever an equivalent builtin exists.**\n\n### Examples\n\n**1. `seq`/loop overhead itself is genuinely tiny.**\n```bash\ntime ( for i in $(seq 1 1000); do :; done )\n```\nOutput:\n```\nreal    0m0.002s\n```\nA loop with an empty body (`:`, the \"do nothing\" builtin) running 1000 times costs essentially nothing — the loop mechanism itself is not where performance problems come from.\n\n**2. An external command inside a loop — genuinely, measurably slow.**\n```bash\ntime ( for i in $(seq 1 500); do echo \"hello\" | tr 'a-z' 'A-Z' > /dev/null; done )\n```\nOutput:\n```\nreal    0m0.552s\n```\n500 iterations, each spawning **two** external processes (`echo` piped into `tr`) — over half a second for something that does almost no actual work, because nearly all of that time is process-creation overhead, not the actual character translation.\n\n**3. The same job, using a Bash builtin instead — dramatically faster.**\n```bash\ntime ( for i in $(seq 1 500); do x=\"hello\"; echo \"${x^^}\" > /dev/null; done )\n```\nOutput:\n```\nreal    0m0.006s\n```\n**Roughly 90 times faster** than Example 2, for the same 500 iterations — `${x^^}` (Chapter 2.2's case-conversion parameter expansion) does the same uppercase transformation as `tr`, entirely inside Bash itself, with zero new processes spawned.\n\n**4. Reading a file: line-by-line `while read` vs. `mapfile` for bulk loading.**\n```bash\ntime ( while IFS= read -r line; do :; done < bignum.txt )\ntime ( mapfile -t arr < bignum.txt )\n```\nFor a 5,000-line file:\n```\nreal    0m0.018s\n```\n```\nreal    0m0.001s\n```\n`mapfile` (Chapter 5.5) is meaningfully faster here because it reads the entire file in one operation, rather than looping with `read` once per line — worth reaching for specifically when a script needs all of a file's lines available at once anyway (not when genuine line-by-line processing, with per-line logic, is actually required).\n\n**5. `$(< file)` — reading a whole file without spawning `cat` at all.**\n```bash\ntime ( for i in $(seq 1 200); do content=$(cat bignum.txt); done )\ntime ( for i in $(seq 1 200); do content=$(< bignum.txt); done )\n```\nOutput:\n```\nreal    0m0.648s\n```\n```\nreal    0m0.027s\n```\n**Roughly 24 times faster**, for something that looks like a tiny syntax variation. `$(< file)` is a special case Bash recognizes: when a command substitution's *entire* content is just `< file`, Bash reads the file directly, as a builtin operation, without ever launching `cat` as a separate process — the same external-process-avoidance principle from Examples 2–3, applied to Chapter 2.8's command substitution and Chapter 5.5's \"whole file into a variable\" pattern. The result is identical either way:\n```bash\na=$(cat bignum.txt)\nb=$(< bignum.txt)\n[ \"$a\" = \"$b\" ] && echo \"identical content confirmed\"\n```\nOutput:\n```\nidentical content confirmed\n```\nso this is a genuinely free win — same result, dramatically less overhead, anywhere Chapter 5.5's `content=$(cat file)` pattern appears in a loop or a frequently-called function.\n\n**6. `printf '%(fmt)T'` — formatting a date without spawning `date`.**\n```bash\nprintf '%(%Y-%m-%d)T\\n' -1\ndate +\"%Y-%m-%d\"\n```\nOutput (both identical):\n```\n2026-09-06\n2026-09-06\n```\n`printf`'s `%(fmt)T` (Chapter 2.3) is a Bash-specific extension that formats a timestamp using the exact same format codes as the external `date` command (`%Y`, `%m`, `%d`, and so on) — `-1` means \"right now\" (a specific Unix timestamp number can be given instead, to format an arbitrary point in time). Since `printf` is a builtin, this avoids spawning `date` as a separate process entirely:\n```bash\ntime ( for i in $(seq 1 200); do printf -v ts '%(%Y-%m-%d)T' -1; done )\ntime ( for i in $(seq 1 200); do ts=$(date +\"%Y-%m-%d\"); done )\n```\nOutput:\n```\nreal    0m0.003s\n```\n```\nreal    0m0.525s\n```\n**Roughly 175 times faster** — an even starker version of Example 2's lesson, this time specifically for the extremely common \"get a timestamp\" operation, which shows up constantly in logging and file-naming code that often runs in a loop.\n\n### ⚠️ Common Mistakes\n\n- **Calling an external command inside a loop when a Bash builtin does the same job.** Example 2 vs. 3 shows the real, measured cost of this — nearly two orders of magnitude, for genuinely simple text like `\"hello\"`. String manipulation (Chapter 2.2), arithmetic (Chapter 2.4), and simple pattern matching (`[[ ]]`, Chapter 3.2) all have builtin equivalents worth reaching for first inside any loop that runs many times.\n- **Optimizing a script that runs once, briefly, and is never a bottleneck.** Performance tuning has a real cost in readability and complexity — reserve it for scripts that genuinely run often, on genuinely large input, or where a measured slowdown actually matters. A script run once a day processing a small file gains nothing from micro-optimization that a less-clever, more-readable version wouldn't already handle fine.\n- **Guessing at what's slow instead of measuring it.** `time` (shown throughout this chapter) costs nothing to add and tells you definitively where time is actually going — intuition about performance is frequently wrong, even for experienced people, and Bash's own particular costs (process spawning, specifically) aren't always obvious without measuring.\n- **Reading an entire huge file into memory (`mapfile`, or `$(cat file)`) when true line-by-line, low-memory processing was actually needed.** Example 4's `mapfile` speedup only make sense when holding the whole file in memory is fine — for a file too large to comfortably fit in memory, the slower `while read` loop is the *correct* choice despite being slower, not a mistake to fix.\n- **Assuming every external command in a loop is automatically a problem.** A loop that runs only a handful of times, or one where each iteration's actual work vastly outweighs the process-spawning overhead (a network request, a large file operation), gains little to nothing from converting external calls to builtins — the concern scales with iteration count and command frequency, not with the mere presence of an external command.\n- **Missing the `$(cat file)` → `$(< file)` swap and the `date` → `printf '%(fmt)T'` swap**, Examples 5 and 6's two specific, extremely common wins — both are drop-in replacements with zero behavior change, and both showed up as 24x and 175x speedups respectively in this chapter's own measurements. Worth knowing by heart, not just recognizing when pointed out.\n\n### How this connects\n\nThis chapter's core lesson connects directly to Chapter 2.2's string manipulation and Chapter 2.4's arithmetic — both exist, in real practical terms, as the fast, builtin alternative to spawning `tr`/`expr`/`bc` repeatedly. The `mapfile` vs. `while read` tradeoff builds on Chapter 5.5's file-reading material, now with a genuine performance dimension attached. Chapter 8.5, next and last in Part VIII, covers writing scripts that are robust and safely re-runnable — a different, complementary concern from raw speed.\n\n### Quick recap\n\n- Every external command spawns a whole new process — genuinely expensive compared to Bash's own builtins, and this cost multiplies directly with loop iteration count.\n- Prefer builtins (`${var^^}`, `(( ))`, `[[ ]]`, parameter expansion) over external commands (`tr`, `expr`, `grep`) inside loops that run many times — the measured difference can be nearly two orders of magnitude.\n- `mapfile` (bulk file loading) is faster than a `while read` loop when the whole file needs to be in memory anyway; `while read` remains correct when true line-by-line processing or memory constraints require it.\n- `$(< file)` reads a whole file without spawning `cat` (~24x faster in this chapter's measurement); `printf '%(fmt)T'` formats the current time without spawning `date` (~175x faster) — both are drop-in replacements.\n- **Measure with `time` before optimizing** — don't guess, and don't optimize a script that doesn't need it."}, {"id": "8.5", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "debugging, testing & writing robust scripts", "chapNum": 5, "slug": "writing-robust-re-runnable-scripts", "fullTitle": "Writing Robust, Re-runnable Scripts", "title": "Writing Robust, Re-runnable Scripts", "md": "### Why this matters\n\nA script run exactly once, in a controlled environment, by its own author, can get away with a lot. A real script — one that gets run repeatedly, by other people, sometimes after a previous run failed partway through — needs to survive being run twice in a row without breaking, and needs to clean up after itself no matter how it ends. This closing chapter of Part VIII pulls together tools from across the book (`mkdir -p`, `mktemp`, `trap`, `grep -q`) into the specific discipline of writing scripts that are genuinely safe to rerun.\n\n### The core idea\n\n**Idempotency** means running an operation multiple times produces the same result as running it once — no error, no duplicate effect, no accumulating damage. This matters enormously for real scripts: a deploy script that gets accidentally run twice shouldn't double-create something or crash; a setup script interrupted partway through should be safely rerunnable from the start. Alongside idempotency, **lockfiles** prevent two copies of the same script from running at once and interfering with each other, and **`trap`-based cleanup** (Chapter 5.6) guarantees temporary resources get removed no matter how the script ends.\n\n### Examples\n\n**1. `mkdir -p` — idempotent by design.**\n```bash\nmkdir -p somedir\nmkdir -p somedir\necho \"no error running mkdir -p twice: $?\"\n```\nOutput:\n```\nno error running mkdir -p twice: 0\n```\nPlain `mkdir somedir` fails the second time (the directory already exists) — `-p` makes it succeed either way, whether the directory already existed or not. This is the simplest possible example of idempotency: \"make sure this exists\" behaves identically whether it already did or not.\n\n**2. Idempotent file modification — check before appending, don't just append.**\n```bash\ngrep -qxF \"setting=value\" config.txt 2>/dev/null || echo \"setting=value\" >> config.txt\ngrep -qxF \"setting=value\" config.txt 2>/dev/null || echo \"setting=value\" >> config.txt\ncat config.txt\necho \"lines: $(wc -l < config.txt)\"\n```\nOutput:\n```\nsetting=value\nlines: 1\n```\nRun twice, but the line only appears once. `grep -qxF` (Chapter 7.1's `-q`, plus `-x` for \"match the whole line exactly,\" `-F` for \"treat the pattern as literal text, not regex\") checks whether the exact line is already present; the append only happens via `||` (Chapter 1.5) when it isn't. A naive script that just always ran `echo \"setting=value\" >> config.txt` would duplicate the line on every rerun — genuinely not idempotent, and a real, common source of corrupted config files from a script that's been run more than once.\n\n**3. A lockfile pattern — preventing two copies from running simultaneously.**\n```bash\nLOCKDIR=\"mylock.lock\"\nif mkdir \"$LOCKDIR\" 2>/dev/null; then\n  echo \"acquired lock\"\n  # ... do the actual work ...\n  rmdir \"$LOCKDIR\"\nelse\n  echo \"lock already held\"\nfi\n```\nFirst run:\n```\nacquired lock\n```\nA second run while the lock is still held:\n```\ncorrectly detected existing lock\n```\n**`mkdir` is used here specifically because creating a directory is atomic** — the operating system guarantees that if two processes race to `mkdir` the same path at nearly the same instant, exactly one succeeds and the other fails, with no possibility of both believing they got the lock. This is more reliable than checking `[ -e lockfile ]` and then creating it as two separate steps, which leaves a small window where two processes could both pass the check before either creates the lock.\n\n**4. `trap`-based cleanup combined with `mktemp` — guaranteed, no matter what.**\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\ntmpfile=$(mktemp)\ntrap 'rm -f \"$tmpfile\"' EXIT\necho \"working with $tmpfile\"\necho \"data\" > \"$tmpfile\"\ncat \"$tmpfile\"\n```\nOutput:\n```\nworking with /tmp/tmp.AZzE8zrKIp\ndata\n```\nAnd confirming the cleanup genuinely happened — checking for leftover temp files matching `mktemp`'s naming pattern afterward finds none. This combines three tools this book has already covered individually: `mktemp` (Chapter 7.7, for a genuinely safe temp file), `trap ... EXIT` (Chapter 5.6, guaranteeing the cleanup runs regardless of how the script ends — success, failure, or an interrupting signal), and `set -euo pipefail` (Chapter 5.6, so an unexpected failure stops the script rather than continuing in a broken state, while the trap still fires either way).\n\n**5. `flock` — a more robust, Linux-native alternative to the `mkdir` lockfile pattern.**\n```bash\n(\n  flock -n 200 && echo \"acquired lock\" || echo \"lock busy\"\n) 200>mylock.lock\n```\nOutput:\n```\nacquired lock\n```\n`flock` (available on Linux; not pre-installed on macOS) locks a file descriptor — here, `200` is just an arbitrary, unused file descriptor number, opened for writing against `mylock.lock` via `200>mylock.lock`, and `flock -n 200` tries to acquire an exclusive lock on it, `-n` meaning \"don't wait, fail immediately if it's already held.\" The genuine advantage over Example 3's `mkdir` pattern: **the lock releases automatically** the moment the process holding it ends, for any reason at all — confirmed directly by deliberately crashing a lock-holder with `kill -9` (the same untrappable signal from Chapter 6.5) mid-lock, and finding the lock immediately available again to the very next attempt, with no cleanup code of any kind having run. This is the operating system itself guaranteeing the release, not a `trap` your script had to remember to set up — genuinely more robust than `mkdir`'s pattern, which *does* need an explicit `trap`/`rmdir` to avoid leaving a stale lock behind after exactly this kind of crash.\n\n### ⚠️ Common Mistakes\n\n- **Writing a setup or config-modifying script that assumes it will only ever run once.** Real-world scripts get rerun — after an interruption, by mistake, as part of automation that doesn't track whether it already ran. Example 2's \"check, then act\" pattern (rather than \"always act\") is the general shape of the fix.\n- **Using `[ -e lockfile ] && exit` followed by a separate `touch lockfile`, instead of an atomic operation like `mkdir`.** This two-step check-then-create pattern has a real race condition — two processes can both pass the check before either creates the lock. `mkdir`'s atomicity (Example 3) closes this gap.\n- **Forgetting to remove a lockfile (or lock directory) on the failure path, not just the success path.** A lock left behind after a crash permanently blocks every future run until someone manually removes it — pairing lock acquisition with a `trap` (exactly like Example 4's temp-file cleanup) is the robust way to guarantee release happens regardless of how the script exits.\n- **Creating temporary files with a guessed, non-unique name** instead of `mktemp` — Chapter 7.7 already covered why this is a real reliability and security concern, and it directly undermines idempotency too (a leftover temp file from a failed previous run can silently interfere with a new one).\n- **Assuming `set -e` alone guarantees safety on rerun.** `set -e` (Chapter 5.6) stops a script on an unexpected failure, but it says nothing about whether the *partial* work already done before that failure leaves things in a state safe to rerun from. Idempotent design (Examples 1–2) is a separate, additional concern `set -e` doesn't solve by itself.\n\n### How this connects\n\nThis chapter is a deliberate synthesis, closing out Part VIII by combining `mkdir -p`, `grep -q` (7.1), `mktemp` (7.7), `trap`/`set -euo pipefail` (5.6), and the exit-status/`&&`/`||` mechanics (1.5) into the specific discipline of writing scripts safe to rerun. Part IX, next, is the capstone — designing and building a complete Bash script from scratch, where every one of these habits gets applied together for real.\n\n### Quick recap\n\n- **Idempotency**: running a script (or operation) multiple times should produce the same end result as running it once — `mkdir -p`, and \"check before appending\" (rather than always appending), are two concrete examples.\n- **Lockfiles** prevent concurrent runs from interfering with each other — use an atomic operation like `mkdir` for acquiring the lock, never a separate check-then-create.\n- Always release a lock (and clean up temp files) on **every** exit path, including failure — pair lock/temp-file creation with `trap ... EXIT` to guarantee this.\n- On Linux, `flock` (file-descriptor-based locking) releases automatically when the holding process ends for any reason — even `kill -9` — with no `trap` needed, a genuine robustness improvement over the `mkdir` pattern where that's practical.\n- `mktemp` + `trap 'rm -f \"$tmpfile\"' EXIT` + `set -euo pipefail` together form a genuinely robust, standard pattern for any script that needs temporary working files.\n- `set -e` alone does not guarantee a script is safe to rerun — idempotent design is a separate, necessary concern."}, {"id": "9.1", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "script design from scratch & capstone", "chapNum": 1, "slug": "designing-a-bash-script-from-scratch", "fullTitle": "Designing a Bash Script From Scratch", "title": "Designing a Bash Script From Scratch", "md": "### Why this matters\n\nEvery chapter so far has taught one tool at a time, with the problem already picked out for you. Real scripting starts before any code — with a vague goal and a blank file. This chapter is about that process: going from \"I want a script that does X\" to an actual working script, including the genuinely realistic experience of hitting a real bug along the way and diagnosing it properly.\n\n### The core idea\n\nBreak a vague goal into small, concrete steps *before* writing code: state the goal in one sentence, figure out what data needs to persist, list the actions in plain English, sketch rough pseudocode, then implement and test one small piece at a time. **One thing genuinely different about Bash scripts specifically, worth internalizing now: most Bash scripts aren't long-running programs with an internal loop — they're commands, invoked separately each time, that need to remember state *between* invocations.** A Python program tracking your water intake could just loop forever, asking \"log another?\" — a Bash script for the same job is more naturally something you run as `waterlog log` once per glass throughout the day, from separate terminal sessions, possibly hours apart. That means the data has to live in a **file**, not just a variable, from the very first design decision.\n\n### A worked example\n\nLet's design something small together: a command-line water intake tracker.\n\n**Step 1 — state the goal in one plain sentence.** \"Let me log a glass of water with one command, see my running total with another, and know when I've hit today's goal — remembered correctly even if I run the commands hours apart.\"\n\n**Step 2 — figure out what data needs to persist.** A running count for *today specifically* (it should reset each new day), and a goal number. Since this needs to survive between separate invocations, it lives in a file — genuinely the Bash-native answer to \"where does my data live,\" the way a class or dictionary might be Python's answer.\n\n**Step 3 — list the actions in plain English.**\n- `log`: figure out today's count so far (resetting to zero if the stored date isn't today), add one, save it back, report the new total, congratulate if the goal's reached.\n- `check`: report today's count without changing it.\n- Anything else: show a usage message.\n\n**Step 4 — sketch pseudocode.**\n```\nread stored date and count from file (or 0 if no file yet)\nif stored date is not today:\n    count = 0\nif command is \"log\":\n    count = count + 1\n    save today's date and count to file\n    print the new total\n    if count >= goal: print congratulations\nif command is \"check\":\n    print the current total\n```\n\n**Step 5 — implement it for real, one small piece at a time.**\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\n\nDATA_FILE=\"./waterlog.data\"\nDAILY_GOAL=8\n\nread_state() {\n  if [ -f \"$DATA_FILE\" ]; then\n    read -r stored_date stored_count < \"$DATA_FILE\"\n  else\n    stored_date=\"\"\n    stored_count=0\n  fi\n  local today\n  today=$(date +%Y-%m-%d)\n  if [ \"$stored_date\" != \"$today\" ]; then\n    stored_date=\"$today\"\n    stored_count=0\n  fi\n}\n\nsave_state() {\n  echo \"$stored_date $stored_count\" > \"$DATA_FILE\"\n}\n\nlog_glass() {\n  read_state\n  ((stored_count++))\n  save_state\n  echo \"Logged! Total today: $stored_count\"\n  if [ \"$stored_count\" -ge \"$DAILY_GOAL\" ]; then\n    echo \"You've hit your goal for today!\"\n  fi\n}\n\ncheck_progress() {\n  read_state\n  echo \"You've had $stored_count of $DAILY_GOAL glasses today.\"\n}\n\ncase \"${1:-}\" in\n  log) log_glass ;;\n  check) check_progress ;;\n  *) echo \"Usage: $0 {log|check}\"; exit 1 ;;\nesac\n```\n\nRunning `./waterlog.sh log` produced... nothing. No output, no error, `waterlog.data` never even got created. This is exactly the kind of real, confusing bug worth working through rather than skipping past.\n\n### A real bug, diagnosed properly\n\nFollowing Chapter 8.1's advice, `bash -x ./waterlog.sh log` was the first move — and the trace stopped dead, silently, right after tracing `((stored_count++))`. That's the clue: **`((stored_count++))` is a *post*-increment — it evaluates to `stored_count`'s value *before* incrementing.** The very first time `log` ever runs, `stored_count` is `0` — and `0` as an arithmetic result means the `(( ))` command itself reports exit status `1` (Chapter 2.4's \"`(( ))` as a condition\" section explained precisely this: nonzero result means success, zero means failure). With `set -e` active (Chapter 5.6), that one nonzero exit status silently killed the entire script, right there, before `save_state` or the `echo` ever ran.\n\nThe fix: use arithmetic *expansion* instead of the arithmetic *command* for this specific assignment, since `$((...))`'s result is a substituted value, not an exit status `set -e` can act on:\n```bash\nstored_count=$((stored_count + 1))\n```\nWith that one-line change, the script works correctly — confirmed by actually running it eight times in a row and watching the count climb correctly to 8, with the congratulations message firing exactly on the eighth call. **This is a genuinely real Bash gotcha, not a contrived teaching example** — `((var++))` combined with `set -e` breaking silently on the first call when `var` starts at `0` is a documented, common source of exactly this kind of confusing, silent failure, and it's precisely why Chapter 8.1's \"trace it, don't guess\" advice earns its place.\n\n### A quick decision guide for structuring your data\n\n- **A few named values, no persistence needed across runs?** Plain variables.\n- **An ordered list of similar items, known within one run?** An array (Chapter 2.6).\n- **Looking something up by name rather than position, within one run?** An associative array (Chapter 2.7).\n- **Does anything need to survive between separate invocations of the script** (exactly this chapter's water tracker)? **A file** — this is the Bash-native answer, parallel to how another language might reach for a database or serialized object.\n- **Structured data (nested, or shaped like JSON) coming from elsewhere?** `jq` (Chapter 7.11), rather than trying to hand-parse it.\n\n### Leveling up: functions and `getopts`\n\nThe water tracker above already used functions (`read_state`, `save_state`, `log_glass`, `check_progress`) — each one distinct, nameable, and reused (`read_state` is called from both `log_glass` and `check_progress`, exactly the kind of repetition Chapter 4.1 flags as worth extracting). A natural next step, if this script grew a `--goal N` option to customize the daily target instead of a hardcoded `DAILY_GOAL=8`, would be `getopts` (Chapter 5.7) — the case statement dispatching on `$1` here is fine for a single required subcommand, but genuine optional flags call for `getopts` specifically.\n\n### ⚠️ Common Mistakes\n\n- **Jumping straight to code before thinking through the steps** — as this chapter's own worked example shows, even a careful design can hit a real bug; skipping the design step entirely makes that bug far harder to isolate when it happens inside a tangle of unplanned logic.\n- **Forgetting that Bash scripts are usually invoked repeatedly, not run once with an internal loop** — designing persistent state (a file) in from the start, as Step 2 did here, avoids a painful retrofit later.\n- **Testing only the \"happy path\" during development** — this chapter's bug was caught specifically because the very first `log` call (with `stored_count` starting at `0`) was tested, not skipped in favor of testing with a pre-existing nonzero count.\n- **Not reaching for `bash -x` (Chapter 8.1) the moment a script fails silently.** A script that produces zero output and zero error message, exactly like this chapter's first attempt, is precisely the situation tracing is built for.\n\n### How this connects\n\nEvery tool used here — functions (Part IV), file reading/writing (5.5), `set -euo pipefail` (5.6), `case` (3.3), arithmetic (2.4), and the debugging discipline (8.1) that found the real bug — comes from earlier in this book. This chapter was about *process*, not new syntax: stating a goal, persisting state correctly for Bash's repeated-invocation model, and diagnosing a genuine failure methodically rather than guessing. Chapter 9.2, the capstone, applies this same process to something a bit larger, worked all the way through.\n\n### Quick recap\n\n- State the goal in one sentence; figure out what data needs to persist *between separate invocations* — this is the Bash-specific twist on the design process, since most Bash scripts aren't long-running loops.\n- Sketch pseudocode, then implement and test in small pieces, including the very first, \"empty state\" case.\n- `((var++))` combined with `set -e` silently kills a script the first time `var` is `0` — use `var=$((var + 1))` (arithmetic expansion, not the arithmetic command) for a counter increment that also needs to tolerate `set -e`.\n- When something fails silently, reach for `bash -x` (Chapter 8.1) immediately rather than guessing.\n- A file is the natural Bash answer to \"where does state live between runs\" — plain variables and arrays only last for one invocation."}, {"id": "9.2", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "script design from scratch & capstone", "chapNum": 2, "slug": "capstone-build-something-real", "fullTitle": "Capstone: Build Something Real", "title": "Capstone: Build Something Real", "md": "### Why this matters\n\nEvery earlier chapter has taught individual tools; Chapter 9.1 taught the design process. This chapter is where it all comes together in one real, working program — a command-line to-do list manager, `todo.sh`, that genuinely uses functions, arrays, `getopts`, file I/O, `grep`/`sed`/`awk`, error handling, and the debugging discipline this book has built throughout. Every line of it was actually run and verified while writing this chapter — including a real bug that came up during that process, fixed the same way any real bug gets fixed.\n\n### The goal, stated simply\n\nA command-line tool to add tasks, list them, mark them done, remove them, search them, and see a quick summary — with data persisted in a plain text file (Chapter 9.1's Bash-native answer to \"where does state live between invocations\"), and a clean `-f`/`-h` flag interface via `getopts` (Chapter 5.7).\n\n### The data format\n\nOne task per line, tab-separated: `status<TAB>text` — either `pending` or `done`, followed by the task's text. A task's \"number\" is simply its line number in the file — genuinely the simplest possible design that still supports every planned command.\n\n### The complete script\n\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\n\nTODO_FILE=\"${TODO_FILE:-$HOME/.todo.txt}\"\n\nusage() {\n  cat <<EOF\nUsage: $(basename \"$0\") [-f FILE] COMMAND [ARGS]\n\nCommands:\n  add TEXT       Add a new task\n  list           List all tasks with their numbers\n  done N         Mark task N as complete\n  rm N           Remove task N entirely\n  search TERM    Search tasks for TERM\n  summary        Show a count of pending vs done tasks\n\nOptions:\n  -f FILE        Use FILE instead of the default (${TODO_FILE})\n  -h             Show this help message\nEOF\n}\n\nensure_file() {\n  [ -f \"$TODO_FILE\" ] || : > \"$TODO_FILE\"\n}\n\nadd_task() {\n  local text=\"$1\"\n  ensure_file\n  printf 'pending\\t%s\\n' \"$text\" >> \"$TODO_FILE\"\n  echo \"Added: $text\"\n}\n\nlist_tasks() {\n  ensure_file\n  local i=0\n  local status text\n  while IFS=$'\\t' read -r status text || [ -n \"$status\" ]; do\n    i=$((i + 1))\n    if [ \"$status\" = \"done\" ]; then\n      printf '[x] %d) %s\\n' \"$i\" \"$text\"\n    else\n      printf '[ ] %d) %s\\n' \"$i\" \"$text\"\n    fi\n  done < \"$TODO_FILE\"\n}\n\ncomplete_task() {\n  local n=\"$1\"\n  ensure_file\n  local total\n  total=$(wc -l < \"$TODO_FILE\")\n  if ! [[ \"$n\" =~ ^[0-9]+$ ]] || [ \"$n\" -lt 1 ] || [ \"$n\" -gt \"$total\" ]; then\n    echo \"Error: task $n does not exist\" >&2\n    return 1\n  fi\n  sed -i \"${n}s/^pending/done/\" \"$TODO_FILE\"\n  echo \"Marked task $n as done\"\n}\n\nremove_task() {\n  local n=\"$1\"\n  ensure_file\n  local total\n  total=$(wc -l < \"$TODO_FILE\")\n  if ! [[ \"$n\" =~ ^[0-9]+$ ]] || [ \"$n\" -lt 1 ] || [ \"$n\" -gt \"$total\" ]; then\n    echo \"Error: task $n does not exist\" >&2\n    return 1\n  fi\n  sed -i \"${n}d\" \"$TODO_FILE\"\n  echo \"Removed task $n\"\n}\n\nsearch_tasks() {\n  local term=\"$1\"\n  ensure_file\n  if ! grep -n -i -- \"$term\" \"$TODO_FILE\" | awk -F'[:\\t]' '{print $1\")\", $3}'; then\n    echo \"No tasks matching '$term'\"\n  fi\n}\n\nshow_summary() {\n  ensure_file\n  awk -F'\\t' '\n    {total++}\n    $1 == \"done\" {done++}\n    END {\n      pending = total - done\n      printf \"Total: %d  Pending: %d  Done: %d\\n\", total+0, pending+0, done+0\n    }\n  ' \"$TODO_FILE\"\n}\n\nwhile getopts \":f:h\" opt; do\n  case \"$opt\" in\n    f) TODO_FILE=\"$OPTARG\" ;;\n    h) usage; exit 0 ;;\n    \\?) echo \"Invalid option: -$OPTARG\" >&2; usage; exit 1 ;;\n    :) echo \"Option -$OPTARG requires an argument\" >&2; exit 1 ;;\n  esac\ndone\nshift $((OPTIND - 1))\n\nif [ \"$#\" -lt 1 ]; then\n  usage\n  exit 1\nfi\n\ncommand=\"$1\"\nshift\n\ncase \"$command\" in\n  add)\n    [ \"$#\" -ge 1 ] || { echo \"Error: add requires text\" >&2; exit 1; }\n    add_task \"$*\"\n    ;;\n  list) list_tasks ;;\n  done)\n    [ \"$#\" -eq 1 ] || { echo \"Error: done requires a task number\" >&2; exit 1; }\n    complete_task \"$1\"\n    ;;\n  rm)\n    [ \"$#\" -eq 1 ] || { echo \"Error: rm requires a task number\" >&2; exit 1; }\n    remove_task \"$1\"\n    ;;\n  search)\n    [ \"$#\" -ge 1 ] || { echo \"Error: search requires a term\" >&2; exit 1; }\n    search_tasks \"$*\"\n    ;;\n  summary) show_summary ;;\n  *)\n    echo \"Unknown command: $command\" >&2\n    usage\n    exit 1\n    ;;\nesac\n```\n\n### Seeing it work\n\n```bash\nexport TODO_FILE=\"./mytasks.txt\"\n./todo.sh add \"Buy milk\"\n./todo.sh add \"Write Bash book chapter\"\n./todo.sh add \"Walk the dog\"\n./todo.sh list\n```\nOutput:\n```\nAdded: Buy milk\nAdded: Write Bash book chapter\nAdded: Walk the dog\n[ ] 1) Buy milk\n[ ] 2) Write Bash book chapter\n[ ] 3) Walk the dog\n```\n```bash\n./todo.sh done 2\n./todo.sh list\n./todo.sh summary\n```\nOutput:\n```\nMarked task 2 as done\n[ ] 1) Buy milk\n[x] 2) Write Bash book chapter\n[ ] 3) Walk the dog\nTotal: 3  Pending: 2  Done: 1\n```\n```bash\n./todo.sh search \"bash\"\n./todo.sh rm 1\n./todo.sh list\n```\nOutput:\n```\n2) Write Bash book chapter\nRemoved task 1\n[x] 1) Write Bash book chapter\n[ ] 2) Walk the dog\n```\nEvery command works exactly as designed, including the numbering correctly shifting after a removal.\n\n### A real bug, hit and fixed while building this\n\nThe first version of `search_tasks` was:\n```bash\ngrep -n -i -- \"$term\" \"$TODO_FILE\" | cut -d: -f1,3- | tr ':' ')'\n```\nThis assumed `grep -n`'s output had at least three colon-separated fields — but the actual output looks like `2:done<TAB>Write Bash book chapter`: only **one** colon (separating the line number from the rest), with a tab, not a colon, separating status from text inside the line. `cut -f1,3-` asked for a third field that never existed, and silently produced nothing useful. The fix — recognizing that `awk`, with a field separator matching *either* a colon or a tab, could correctly identify all three logical pieces at once:\n```bash\ngrep -n -i -- \"$term\" \"$TODO_FILE\" | awk -F'[:\\t]' '{print $1\")\", $3}'\n```\n`awk -F'[:\\t]'` (a character-class field separator, Chapter 7.3/7.5) splits on colon *or* tab — `$1` is the line number, `$3` is the task text (field `$2` being the `done`/`pending` status, deliberately skipped). This is a genuinely realistic bug: an assumption about a text format that turned out to be subtly wrong, caught the same way this book has advocated throughout — by actually running it and looking closely at what came back, not by assuming the first version was correct because it looked reasonable.\n\n### What this capstone actually exercises\n\n- **Functions** (Part IV) — each command is its own clearly-named function, exactly Chapter 9.1's \"pull out distinct, nameable actions\" guidance.\n- **`local`** (Chapter 4.4) — every function-scoped variable is local, avoiding the cross-call contamination Chapter 4.4 warned about.\n- **`getopts`** (Chapter 5.7) — `-f` (custom file) and `-h` (help), with the silent-error-mode (`\":f:h\"`) style Chapter 5.7 recommended.\n- **File reading and writing** (Chapter 5.5) — the `while IFS=$'\\t' read -r ... || [ -n \"$status\" ]` loop is exactly Chapter 5.5's trailing-newline-safe idiom, applied with a custom `IFS` (Chapter 2.10) to split on tabs instead of default whitespace.\n- **`sed -i`** (Chapter 7.2) — targeted, line-numbered in-place edits for `done`/`rm`, safer than reconstructing the whole file manually.\n- **`grep`/`awk`** (Chapters 7.1, 7.3) — `search` and `summary` are genuinely small text-processing pipelines, not hand-rolled parsing loops.\n- **Regex validation** (Chapter 7.5) — `[[ \"$n\" =~ ^[0-9]+$ ]]` confirms a task number is genuinely numeric before using it, rather than trusting user input blindly.\n- **Error handling** (Chapter 5.6) — `set -euo pipefail`, explicit argument-count checks with clear messages to stderr, and meaningful nonzero exit statuses on failure.\n- **Style discipline** (Chapter 7.9) — this script passes a real ShellCheck run cleanly, with zero warnings.\n\n### ⚠️ Common Mistakes (in building something like this yourself)\n\n- **Assuming a text format's exact shape without checking it directly**, exactly as this chapter's own bug demonstrated — a quick `cat -A file | head` (showing control characters explicitly) would have caught the tab-vs-colon mismatch before it ever became a bug.\n- **Skipping input validation on something as simple-looking as a task number.** Without the regex check in `complete_task`/`remove_task`, passing a non-numeric argument to `sed -i \"${n}d\"` would produce a confusing `sed` error instead of this script's clear, specific message.\n- **Not testing each command in isolation before assuming the whole tool works.** This capstone's real bug was in `search` specifically — `add`, `list`, `done`, and `rm` all worked correctly from the start, and testing each command separately (rather than only running a few and assuming the rest follow the same pattern) is exactly what surfaced the one that didn't.\n- **Skipping ShellCheck on something that \"obviously works.\"** A script can run correctly for every case you happened to test and still contain style issues ShellCheck would flag — running it as a final check costs seconds and catches an entirely different category of problem than manual testing does.\n\n### How this connects\n\nThis capstone is a genuine synthesis of nearly every part of this book — Parts I through VIII all show up somewhere in these roughly 100 lines. The bug-and-fix story mirrors Chapter 9.1's own experience deliberately: real scripts have real bugs, and the discipline this book has modeled throughout — run it, look closely at the actual output, fix what's actually wrong rather than what you assumed was wrong — is the skill that matters more than having memorized every syntax rule perfectly the first time.\n\n### Quick recap\n\n- A real script combines many small tools from across this entire book — functions, `local`, `getopts`, file I/O, `grep`/`sed`/`awk`, regex validation, and `set -euo pipefail` all appear together naturally in genuine, non-trivial code.\n- A tab-separated (or otherwise delimited) file is a perfectly reasonable, simple persistence format for a small command-line tool.\n- Real bugs happen even with careful design — this chapter's own `search` bug (a wrong assumption about delimiter positions) was caught and fixed the same way any real debugging works: run it, look at the actual output, fix the actual cause.\n- Test every command path individually, and finish with a ShellCheck pass — together, they catch two genuinely different categories of problem."}, {"id": "9.3", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "script design from scratch & capstone", "chapNum": 3, "slug": "afterword-where-to-go-next", "fullTitle": "Afterword: Where to Go Next", "title": "Afterword: Where to Go Next", "md": "You made it — alphabet to novel, cover to cover. That's genuinely worth pausing on: you now have a complete, no-holes map of core Bash and the essential toolbox it's inseparable from. Every gap this book set out to close — why quoting matters from line one, what `IFS` actually does, why piping into `while read` silently loses your variables, what `set -e` does and doesn't catch, the difference between `$*` and `$@` — is closed. You will not be the person caught out by a gap this book was responsible for filling.\n\nHere's the honest part, said plainly back at the start of this book and worth repeating now that you've finished: reading closes the *knowledge* gap. What's left is the *fluency* gap, and there's only one way to close that one — write real scripts, on real (even if small) problems, and let yourself hit real bugs. The capstone's own `search` function had a genuine bug in it, caught the same way any real bug gets caught: run it, look closely, fix what's actually wrong. Every experienced scripter's confidence came from exactly that repeated experience, not from finishing one more book. Keep going from the capstone with ideas of your own.\n\nIf you want somewhere concrete to point that practice, here are a handful of small projects, roughly in order of difficulty, that each genuinely exercise a different slice of this book:\n\n- **A backup script** that copies a folder into a timestamped archive — `tar`/`cp`, `date` for the timestamp, and the idempotency habits from Chapter 8.5.\n- **A batch file renamer** that fixes inconsistent filenames in a folder (spaces to underscores, lowercase, a common prefix) — globbing, `find`, parameter expansion, and getting comfortable with `--dry-run`-style safety flags via `getopts`.\n- **A log analyzer** that reports the top error messages, request counts, or timestamps from a real log file — exactly Chapter 7.8's pipeline-composition skill, applied to your own data.\n- **A system status report** that checks disk space, memory, and a few key processes, printing a clean summary — `ps`, `df`, `awk`, and `printf`-based formatted output.\n- **A project scaffolding tool** that creates a standard folder structure and starter files for a new project with one command — functions, `mkdir -p`, here-documents for generating file templates.\n- **A extended version of the capstone's `todo.sh`** — add due dates, priority levels, or a `--sort` flag using `sort -k`; genuinely useful daily, and a real test of extending code you didn't just write from scratch.\n\nNone of these need anything beyond what's in this book. Pick whichever sounds the least boring to you specifically — motivation matters more than perfectly matching your current skill level.\n\n### Teaching yourself, from here on\n\nYou won't always have a book to check — and that's fine, because your own system is genuinely good at teaching you about itself:\n\n- **`man command`** — the manual page for any command (`man grep`, `man sed`, `man find`) — the authoritative, complete reference for exactly what a tool can do, including flags this book never had room to cover.\n- **`command --help`** — a quicker, less exhaustive alternative most commands support, often enough for a fast reminder.\n- **`help builtin`** (note: no `man` page for Bash's own builtins, like `read` or `printf` as a builtin — use `help read`, `help printf`, etc., instead) — Bash's own built-in reference for its built-in commands specifically.\n- **`type command`** — tells you whether something is a builtin, a function, or an external program, and where it lives if external — genuinely useful for understanding exactly what you're calling.\n- **ShellCheck** (Chapter 7.9) — keep running it on everything; it never stops being useful, and it often surfaces things even the manual pages don't call out clearly.\n- **The Bash manual itself** (`man bash`, or the more browsable [GNU Bash Reference Manual](https://www.gnu.org/software/bash/manual/) online) — long, but genuinely the authoritative source once something in this book is second nature and you want the full, precise details.\n\n### Where this book deliberately stopped\n\nRemember: this book is pure core Bash plus its essential toolbox, on purpose — several genuinely real, useful subjects were explicitly out of scope (see `SYLLABUS.md`'s \"Deliberately excluded\" section), not because they're unimportant, but because each deserves its own complete, dedicated tutorial rather than a rushed chapter bolted onto this one:\n\n- **Task scheduling** (`cron`, `systemd` timers) — running a script automatically on a schedule, rather than by hand.\n- **Configuration management and infrastructure automation** (Ansible, Docker, CI/CD pipelines) — Bash-adjacent, but each its own substantial subject.\n- **Other shells** (zsh, fish) — genuinely different personalities, once Bash is second nature.\n- **Remote and networked tools** (`ssh`, `scp`, `rsync`) — connecting Bash's local file/process skills to other machines.\n- **Advanced `awk`/`sed`** — this book covered the practical everyday core; both have genuinely deep scripting capabilities beyond that.\n\nEvery one of those starts exactly where this book leaves off. You're genuinely ready for any of them now — none of those future resources will need to stop and re-explain what `$IFS` does, why `[[ ]]` is safer than `[ ]`, how a subshell isolates variables, or how to debug a script with `set -x`. You've already done that part, properly.\n\n### One tool outside Bash itself, worth picking up immediately: version control\n\nThis is technically outside Bash's own scope, so it was deliberately left out of the book itself — but it deserves a direct mention here, because it's genuinely the very next thing almost every working scripter reaches for: **Git**, a version control system that tracks every change to your scripts over time, lets you undo mistakes, and is how virtually all real-world shared code is collaborated on. It has nothing to do with Bash specifically — you'd use it the same way for any language — but there's no better time to start the habit than your very next script, however small. A short, dedicated Git tutorial (there are excellent free ones) pays for itself almost immediately.\n\nGo automate something. Then automate something else. That's really the whole rest of it.\n\n— *End of book.*"}, {"id": "10.1", "partNum": 10, "partTitle": "Appendix", "partMetaphor": "quick-reference cheat sheet & glossary", "chapNum": 1, "slug": "appendix-a-quick-reference-cheat-sheet", "fullTitle": "Appendix A: Quick-Reference Cheat Sheet", "title": "Quick-Reference Cheat Sheet", "md": "*Organized by Part, matching the book's structure. Built from every chapter's \"Quick recap\" section — use this to jog your memory, not to learn something for the first time.*\n\n### Part I — The Alphabet\n```bash\n#!/usr/bin/env bash                  # shebang, must be the literal first line\nchmod +x script.sh; ./script.sh      # make executable, then run\nbash script.sh                       # or run directly, no chmod needed\n# comment                            # to end of line; explain WHY not WHAT\ncmd1 ; cmd2                          # run unconditionally, in sequence\nname=\"Alex\"       echo \"$name\"       # assign (no spaces around =); read with $ or ${}\n\"$var\"                                # double quotes: expand vars, keep as one word\n'$var'                                 # single quotes: nothing expands, fully literal\n\"He said \\\"hi\\\"\"                       # escape inside double quotes\n'it'\\''s'                              # literal single quote inside single-quoted string\n$'Line1\\tTabbed'  IFS=$'\\t'            # ANSI-C quoting: real escape sequences (tab/newline), 4th quoting style\ncmd1 && cmd2                          # run cmd2 only if cmd1 succeeded (exit 0)\ncmd1 || cmd2                          # run cmd2 only if cmd1 failed (nonzero)\n$?                                     # exit status of the last command; 0 = success\nexit N                                 # end script now with status N (0-255, wraps)\n```\n\n### Part II — Words\n```bash\n${#s}                                  # string length\n${s%pattern} ${s%%pattern}             # strip shortest/longest matching SUFFIX\n${s#pattern} ${s##pattern}             # strip shortest/longest matching PREFIX\n${s:start:len}   ${s: -N}              # substring; space before -N matters!\n${s/find/repl}  ${s//find/repl}        # replace first / replace all\n${s:-default}   ${s:=default}          # use fallback / use fallback AND assign\n${s:+alt}       ${s:?msg}              # use alt ONLY if set / exit with msg if unset\n${s^^} ${s,,}                          # uppercase all / lowercase all\nprintf \"%s %d %.2f\\n\" \"x\" 5 3.14159    # formatted output; no auto newline\nprintf -v var \"%s\" \"value\"             # store formatted result in a variable\nprintf '%(%Y-%m-%d)T\\n' -1             # format current time WITHOUT spawning `date` (~175x faster)\n(( x = a + b ))    $(( a + b ))        # arithmetic command / arithmetic expansion\n(( i++ ))  (( i += 5 ))                # WARNING: ((i++)) on 0 returns exit 1 (set -e trap!)\n0x1F  010  2#101  16#FF                # hex / octal (watch zero-padded nums!) / arbitrary base literals\ndeclare -i n   declare -r X=1   readonly Y=2   unset var\ndeclare -p var                         # inspect a variable's value + attributes\ndeclare -g var                         # force global scope from inside a function\narr=(a b c)      ${arr[0]}   ${arr[@]}     ${#arr[@]}   ${!arr[@]}\narr+=(\"d\")       unset 'arr[1]'            # append; remove one index (leaves a gap)\n${arr[-1]}                             # last element (negative indices); out-of-range is an ERROR\n${arr[@]/find/repl}                    # Ch 2.2 parameter expansion applied across a WHOLE array at once\ndeclare -A map   map[key]=value   ${map[key]}   ${!map[@]}   ${map[@]}\n[[ -v map[key] ]]                      # check an associative-array key exists\nfor k in $(printf '%s\\n' \"${!map[@]}\" | sort); do ...; done   # deterministic key order (not guaranteed by default)\n$(command)                             # command substitution (preferred over `backticks`)\n$(< file)                              # read whole file WITHOUT spawning `cat` (~24x faster)\n$0 $1 $# $@ $$ $! $? $_ $-             # script name, args, count, all-args, PID, last-bg-PID, exit, last-arg, active set opts\n\"$@\"  vs  \"$*\"                         # each arg separate  vs  all args joined into one string\nIFS=',' read -ra arr <<< \"$csv\"        # split on a custom delimiter into an array\n*.txt   ?  [abc]  {1..5}  {a,b,c}      # glob (checks real files) vs brace (pure text, no filesystem check)\n{0..20..5}  {01..10}  {10..1}          # brace: step / zero-padded / reversed ranges\nshopt -s nullglob    shopt -s globstar # non-matching glob vanishes / ** recurses into subdirs\nshopt -s extglob; !(*.log) +([0-9]) @(a|b)  # extended glob: NOT-match, one-or-more, exactly-one-of\n```\n\n### Part III — Sentences\n```bash\nif cmd; then ... elif cmd2; then ... else ... fi     # branches on exit status, not a boolean\n[ \"$a\" -eq \"$b\" ]   -ne -gt -lt -ge -le               # numeric comparison (POSIX test)\n[ \"$a\" = \"$b\" ]  [ \"$a\" != \"$b\" ]                     # string comparison (POSIX test)\n[ -e f ] [ -f f ] [ -d f ] [ -r f ] [ -w f ] [ -s f ]  # file tests: exists/file/dir/readable/writable/nonempty\n[[ $s == *.txt ]]     [[ $s =~ ^[0-9]+$ ]]            # [[ ]] only: glob match, regex match\ncase \"$v\" in pat1) ... ;; pat2|pat3) ... ;; *) ... ;; esac\nselect opt in \"A\" \"B\"; do ... break; done             # numbered menu, pairs with case\nfor x in list; do ... done                            # over words/array/glob/brace/command-sub\nfor ((i=0; i<5; i++)); do ... done                    # C-style counting loop\nwhile cmd; do ... done      until cmd; do ... done    # loop while success / while failure\nwhile IFS= read -r line || [ -n \"$line\" ]; do ... done < file   # correct file-reading idiom\nbreak  break N     continue  continue N               # exit loop(s) / skip to next iteration\nread -r -p \"prompt: \" var                              # basic input with a prompt\nread -ra arr    read -rs var (silent)    read -t N var (timeout)   read -n N var (fixed chars)\n```\n\n### Part IV — Grammar\n```bash\nname() { commands; }                    # define a function (preferred over `function name {`)\nmyfunc \"$a\" \"$b\"                        # call; inside: $1 $2 $# $@ scoped to the function\nshift                                   # drop $1, renumber the rest down by one\n\"${@:2}\"   \"${@:2:1}\"                   # slice remaining args from position 2 / just position 2, read-only\nreturn N                                # set function's exit status (0-255); NOT a value channel\nresult=$(myfunc)                        # capture a function's printed \"return value\"\nlocal x=5                               # scope a variable to the function — DEFAULT to this\nlocal x=$(cmd)                          # WARNING: masks cmd's exit status with local's own (0)\n# recursion: every var must be `local`, or calls corrupt each other's state\n# deep recursion (~tens of thousands) can SEGFAULT — no clean error, real OS stack limit\nlocal -n ref=$1                         # NAMEREF: pass/return arrays & assoc arrays by reference\n                                         # give the local nameref a DISTINCT name (not \"ref\") or get\n                                         # a \"circular name reference\" warning if the caller's var matches\n```\n\n### Part V — Paragraphs\n```bash\n0=stdin  1=stdout  2=stderr             # standard file
