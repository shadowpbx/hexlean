descriptors\ncmd >&2                                 # send output to stderr explicitly\ncmd > file    cmd >> file    cmd < file # overwrite / append / read stdin from file\ncmd 2> file    cmd &> file              # stderr only / both streams to one file\ncmd > file 2>&1                         # CORRECT merge order (2>&1 AFTER the > file)\ncmd 2>&1 > file                         # WRONG order — stderr still goes to the terminal\ncmd 2>/dev/null                         # discard stderr silently\nexec > file       exec > file 2>&1      # redirect the WHOLE script's remaining output, no per-line repeat\nexec 3>&1  ...  exec 1>&3               # save original stdout to fd 3, restore it later\ncmd1 | cmd2 | cmd3                      # pipe: stdout -> stdin, chained; stderr NOT included\n$?                                      # after a pipe: only the LAST stage's status by default\n${PIPESTATUS[@]}    set -o pipefail     # every stage's status / make pipeline fail if any stage does\ncat <<EOF ... EOF                       # here-doc; vars/$() expand (like double quotes)\ncat <<'EOF' ... EOF                     # quoted delimiter: no expansion at all\ncat <<-EOF (with tabs) ... EOF          # strips leading TABS only, lets indentation match code\ncat <<< \"one line\"                      # here-string\nmapfile -t arr < file                   # load every line into an array at once\nset -e            # exit immediately on any command failure (real exceptions: conditions, &&/||, non-last pipe stage)\nset -u            # error on any unset variable reference, instead of silent empty string\nset -o pipefail   # pipeline status reflects ANY failing stage, not just the last\nset -euo pipefail # the standard combined \"strict mode\"\ntrap 'cleanup' EXIT          # runs no matter how the script ends\ntrap 'cleanup; exit 1' INT TERM   # react to Ctrl+C / kill, then exit\ntrap 'echo \"err on $LINENO\"' ERR   # fires on any failing command, same exceptions as set -e\ntrap -p                       # list every trap currently set (check before overwriting one!)\nset -eE; trap 'stack_trace' ERR   # set -E required for FUNCNAME/BASH_LINENO to show the FULL call stack\ngetopts \":vn:h\" opt; do case $opt in ... esac; done; shift $((OPTIND-1))  # parse -v -n VALUE -h flags\n```\n\n### Part VI — Chapters\n```bash\nexport VAR=value               # make a variable visible to CHILD PROCESSES (one-way, snapshot at launch)\nenv | grep VAR                 # list exported variables\nsource file.sh    . file.sh    # run a file in the CURRENT shell — shares vars AND functions\n./file.sh                      # run as a SEPARATE process — shares nothing back automatically\n[[ \"${BASH_SOURCE[0]}\" == \"$0\" ]]   # true if run directly, false if sourced — dual-mode script/library idiom\n(commands)                     # subshell: inherits everything, changes don't escape it\n{ commands; }                  # group: runs in the CURRENT shell, changes DO persist (contrast to (...))\n<(command)   >(command)        # process substitution: a command's I/O disguised as a real file path\ncmd &     $!                   # run in background; capture its PID\njobs      wait      wait $PID  # list background jobs; wait for all / one specific job\nwait -n                        # wait for whichever backgrounded job finishes FIRST; $? is that job's status\ndisown                         # detach a background job from the shell's job table\nkill -TERM $PID   kill -9 $PID # polite stop (default) / force stop (last resort, untrappable)\n128 + signal_number = exit status  # e.g. TERM(15)->143, KILL(9)->137, universal convention\nps aux    ps -p PID -o pid,cmd    pgrep -f \"pattern\"\nkill -0 $PID                   # check a process still exists, without signaling it for real\nSCRIPT_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"   # a script's own real directory, any invocation\n```\n\n### Part VII — Style & Voice (the toolbox)\n```bash\ngrep \"pat\" f      grep -i -v -c -n -w -r -q -o -E \"pat\" f    # search text; see ch. 7.1 for each flag\ngrep -A 2 -B 2 -C 2 \"pat\" f     # N lines of context after / before / both sides of each match\nsed 's/find/repl/'   sed 's/find/repl/g'   sed '/pat/d'   sed -n '2p'   sed -i / -i.bak\nawk '{print $1, $3}' f     NR NF     -F','     BEGIN{...} {...} END{...}     awk -v x=\"$var\" '{...}'\nfind . -name \"*.txt\" -type f -maxdepth N -exec cmd {} \\; -delete\nfind . -mtime +7    find . -mtime -1     find . -size +1M    find . -newer ref   # age (+older/-newer) and size\nfind . -print0 | xargs -0 cmd            # THE safe way to pipe find into xargs (handles spaces)\ncut -d',' -f1,3      cut -c1-5\nsort    sort -n    sort -r    sort -k2    sort -u\nuniq    uniq -c                          # only catches ADJACENT duplicates — sort first!\ntr 'a-z' 'A-Z'    tr -d ' '    tr -s ' '\ndate +\"%Y-%m-%d\"    wc -l/-w/-c    basename path [.suf]    dirname path    tee file    seq 1 5    mktemp / mktemp -d\nextract | sort | uniq -c | sort -rn      # the classic \"count and rank\" pipeline pattern\n. ^ $ * + ? [...] |    (basic regex needs \\+ \\? \\| \\(\\); extended -E / [[ =~ ]] don't)\n[[ $s =~ (pat1)(pat2) ]]   ${BASH_REMATCH[0]}  ${BASH_REMATCH[1]}   # full match, then captured groups\ncurl -s URL    curl -s -o file URL    curl -sI URL    curl -s -o /dev/null -w \"%{http_code}\\n\" URL\ncurl -X POST -d \"k=v\" URL    curl -H \"Header: value\" URL\njq '.'    jq '.field'    jq -r '.field'    jq '.arr[]'    jq '.arr[] | select(.x > 1)'    jq '.arr | length'\n```\n\n### Part VIII — Editing & Revision\n```bash\nset -x  ...  set +x            # trace every command as it runs, with variables expanded\nbash -x script.sh               # trace from outside, no editing needed\nPS4='+ Line ${LINENO}: '        # customize the trace prefix with the line number\nbash -n script.sh               # check syntax only, run nothing\ntrap 'echo \"run: $BASH_COMMAND\"' DEBUG   # fires before EVERY command — finer-grained than set -x\nshellcheck script.sh            # real static analysis — run this on everything\n# root causes behind most gotchas: unquoted vars, word splitting, subshell isolation, string-vs-number\nmkdir -p dir                    # idempotent: safe to run twice\ngrep -qxF \"line\" f || echo \"line\" >> f    # idempotent append: check before adding\nmkdir \"$LOCKDIR\" 2>/dev/null && ... || echo \"locked\"   # atomic lockfile pattern\n( flock -n 200 && ... ) 200>lock.file    # Linux: auto-releases on ANY exit incl. kill -9, no trap needed\nmktemp; trap 'rm -f \"$tmp\"' EXIT   # safe temp file, guaranteed cleanup\n```\n\n### Appendix (Front Matter, Setup)\n```bash\nbash --version                  # check what you have; 4.0+ covers this whole book\ntype command                    # builtin, function, or external — and where\nman command    command --help   help builtin_name    # documentation, in order of what applies\n```"}, {"id": "10.2", "partNum": 10, "partTitle": "Appendix", "partMetaphor": "quick-reference cheat sheet & glossary", "chapNum": 2, "slug": "appendix-b-glossary-of-terms", "fullTitle": "Appendix B: Glossary of Terms", "title": "Glossary of Terms", "md": "**ANSI-C quoting** — `$'...'`, a fourth quoting style (alongside unquoted, double, and single) that interprets backslash escape sequences like `\\t` and `\\n` into real characters — the syntax behind idioms like `IFS=$'\\t'`.\n\n**Arithmetic expansion** — `$(( expression ))`, substitutes the computed numeric result into a string; contrast with the arithmetic *command* `(( expression ))`, used for its exit status or as an assignment on its own line.\n\n**Array** — an ordered, numerically-indexed list of values, created with `arr=(a b c)`. See also *Associative array*.\n\n**Associative array** — a collection of key-value pairs indexed by arbitrary text keys rather than numbers, created with `declare -A`.\n\n**Background job** — a command run with a trailing `&`, started without the shell waiting for it to finish before continuing to the next line.\n\n**Base case** — the condition in a recursive function simple enough to return directly, without any further recursive call.\n\n**Basic regular expression (BRE)** — the default regex flavor used by plain `grep` and `sed`, requiring `+`, `?`, `|`, and `(...)` to be backslash-escaped for their special meaning. Contrast with *Extended regular expression*.\n\n**Bats** — Bash Automated Testing System, a framework providing `@test` blocks and structured pass/fail reporting for testing shell scripts.\n\n**Brace expansion** — `{a,b,c}` or `{1..5}`, generates a list of literal text strings unconditionally, with no check against the filesystem. Contrast with *Globbing*.\n\n**Builtin** — a command implemented directly inside the shell itself (like `cd`, `read`, `printf`, `local`) rather than as a separate external program; check with `type command`.\n\n**Case statement** — `case value in pattern) ... ;; esac`, branches based on matching a value against a series of glob-style patterns.\n\n**Command substitution** — `$(command)`, runs a command and substitutes whatever it printed to stdout in its place; the modern replacement for the older `` `backticks` `` syntax.\n\n**Environment variable** — a variable marked with `export`, inherited by any child process the current shell launches, as a one-way snapshot taken at the moment that child starts.\n\n**Exit status** — the number (0–255) every command reports when it finishes; `0` means success, any nonzero value means some kind of failure. Held in `$?` immediately after a command runs.\n\n**Extended glob (extglob)** — a Bash option (`shopt -s extglob`) unlocking more expressive glob patterns beyond plain `*`/`?`/`[...]`: `?(pat)`, `*(pat)`, `+(pat)`, `@(pat1|pat2)`, and `!(pat)` for \"everything that does not match.\"\n\n**Extended regular expression (ERE)** — the regex flavor enabled by `grep -E` and used natively by Bash's `[[ =~ ]]`, giving `+`, `?`, `|`, and `(...)` their special meaning directly, without escaping.\n\n**File descriptor** — a small number identifying an open input/output stream; `0` (stdin), `1` (stdout), and `2` (stderr) are the three every command starts with.\n\n**flock** — a Linux command that locks a file descriptor; unlike a `mkdir`-based lockfile, the lock releases automatically the moment the holding process ends for any reason, with no cleanup code required.\n\n**Function** — a named, reusable block of commands, defined with `name() { commands; }` and called just like any other command.\n\n**Glob / globbing** — pattern matching against real files on disk using `*`, `?`, and `[...]`; a pattern matching nothing is left literal by default unless `nullglob` is enabled. Contrast with *Brace expansion*.\n\n**Here-document** — `<<DELIMITER ... DELIMITER`, feeds a multi-line block of text as a command's stdin, with variable/command expansion active by default (suppressed by quoting the delimiter).\n\n**Here-string** — `<<< \"text\"`, feeds a single line of text as a command's stdin without needing a delimiter.\n\n**Idempotent** — describes an operation whose result is the same whether it's run once or run many times in a row — a core requirement for scripts that might be rerun, interrupted, or run more than once by accident.\n\n**IFS (Internal Field Separator)** — the variable controlling which characters unquoted expansion splits on; defaults to space, tab, and newline.\n\n**Job control** — the shell's mechanism for managing background and foreground processes, via `jobs`, `wait`, `fg`, `bg`, and `disown`.\n\n**jq** — a command-line tool for querying and transforming JSON, using its own small filter language (`.field`, `.[]`, `select()`, `|`).\n\n**local** — a keyword that scopes a variable to the function it's declared in, rather than the global default every plain Bash assignment otherwise uses.\n\n**Lockfile** — a file (or, more robustly, a directory created atomically with `mkdir`, or a file descriptor locked with `flock`) used to signal that a script is currently running, preventing two copies from executing at the same time.\n\n**Nameref** — a variable created with `declare -n` or `local -n` that holds a *reference* to another variable's name rather than a value; reads and writes through it transparently redirect to the referenced variable, enabling genuine pass-by-reference for arrays and associative arrays through functions.\n\n**Parameter expansion** — the `${variable}` family of syntax, including string manipulation like `${var#prefix}`, `${var%suffix}`, `${var/find/replace}`, and default-value forms like `${var:-default}`.\n\n**Pipe / pipeline** — `|`, connects one command's stdout directly to the next command's stdin; a chain of two or more commands connected this way is a pipeline. Each stage runs in its own subshell.\n\n**Positional parameter** — `$1`, `$2`, etc., the individual arguments passed to a script or function, along with `$#` (count) and `$@`/`$*` (all of them).\n\n**Process substitution** — `<(command)` or `>(command)`, makes a command's input/output appear as a real file path, letting tools that expect filenames work directly with another command's data.\n\n**Quoting** — wrapping text in double quotes (expansion active, word splitting suppressed) or single quotes (nothing expands at all); the single most consequential habit for avoiding word-splitting and globbing bugs.\n\n**Recursion** — a function calling itself, working toward a base case; in Bash, limited by the operating system's stack size, with excessive depth causing a segmentation fault rather than a clean error.\n\n**Redirection** — `>`, `>>`, `<`, `2>`, `&>`, changes which file (or stream) a command's input or output connects to, instead of the terminal.\n\n**Regular expression (regex)** — a pattern language for describing shapes of text, using symbols like `.`, `^`, `$`, `*`, `+`, `[...]`. See also *Basic regular expression* and *Extended regular expression*.\n\n**Shebang** — the `#!/usr/bin/env bash` (or `#!/bin/bash`) line that must be the literal first line of a script, telling the operating system which program should run it.\n\n**ShellCheck** — a static analysis tool that reads a shell script without running it and flags likely bugs, each with a specific reference code (like `SC2086`).\n\n**Signal** — a notification sent to a running process (like `INT` from Ctrl+C, or `TERM`/`KILL` from `kill`), which a script can react to with `trap` — except `KILL` and `STOP`, which can never be caught or ignored.\n\n**Sourcing** — running a script's content directly inside the current shell with `source file.sh` (or `. file.sh`), sharing all its variables and functions, as opposed to running it as a separate process.\n\n**Special variable** — a variable Bash maintains automatically, without explicit assignment: `$0`, `$1`+, `$#`, `$@`, `$$`, `$!`, `$?`, `$_`.\n\n**Standard streams** — the three channels (stdin, stdout, stderr) every command has access to by default, all connected to the terminal unless redirected.\n\n**Strict mode** — the common combination `set -euo pipefail`, making a script exit on any command failure, treat unset variables as errors, and make pipeline failures visible.\n\n**Subshell** — a separate copy of the current shell, created explicitly with `(...)` or implicitly by a pipeline or background job; inherits everything from its parent but can't change anything back in it.\n\n**Test construct** — `[ ]` (the `test` command), `[[ ]]` (Bash's more capable, safer-to-quote version), or `(( ))` (arithmetic) — the three ways to evaluate a condition for use in `if`, `while`, and similar.\n\n**trap** — a command that runs specified code automatically when a script exits, receives a given signal, or hits a pseudo-event like `ERR` (any failing command, following `set -e`'s own exceptions) or `DEBUG` (fires before every single command) — the standard mechanism for guaranteed cleanup and custom error/debugging hooks.\n\n**Variable** — a name bound to a value, created just by assigning to it (`name=value`, no spaces around `=`); global by default, everywhere including inside functions, unless declared `local`.\n\n**Word splitting** — the process by which an unquoted expansion is broken into separate words based on `$IFS`; the source of many Bash bugs when a value unexpectedly contains more than one \"word.\""}]

  <!-- Application Logic -->
  <script>
  (function(){
    var rawJson = document.getElementById('book-data').textContent;
    var chapters;
    try {
      chapters = JSON.parse(rawJson);
    } catch(err) {
      console.error('Failed to parse book data JSON:', err);
      document.getElementById('chapter-pane').innerHTML = '<div style="padding:2rem;color:red;"><h3>Error Loading Book Data</h3><p>' + err.message + '</p></div>';
      return;
    }

    var chapterMap = {};
    chapters.forEach(function(c, i){ c.index = i; chapterMap[c.id] = c; });

    var STORAGE_KEY_THEME = 'python_book_theme';
    var STORAGE_KEY_FONT = 'bash_book_fontsize';
    var STORAGE_KEY_LAST = 'bash_book_last_chapter';
    var STORAGE_KEY_CODE = 'bash_book_code_style';
    var STORAGE_KEY_CODE_CARD = 'bash_book_code_card';
    var STORAGE_KEY_COMPLETED = 'lba_completed_chapters';

    var currentChapterId = null;

    // Theme handling (Light / Dark)
    var currentTheme = 'light';
    try {
      var pTheme = new URLSearchParams(window.location.search).get('theme');
      currentTheme = (pTheme === 'dark' || pTheme === 'light') ? pTheme : (localStorage.getItem(STORAGE_KEY_THEME) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    }catch(e){}
    function applyTheme(theme){
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY_THEME, theme); }catch(e){}
      document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setTheme === theme);
      });
    }
    applyTheme(currentTheme);

    document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyTheme(btn.dataset.setTheme);
      });
    });

    // Code block card handling (GitHub Light [Default] / Obsidian)
    var currentCodeCard = 'light';
    try { currentCodeCard = localStorage.getItem(STORAGE_KEY_CODE_CARD) || 'light'; }catch(e){}
    function applyCodeCard(card){
      currentCodeCard = card;
      document.documentElement.setAttribute('data-code-card', card);
      try { localStorage.setItem(STORAGE_KEY_CODE_CARD, card); }catch(e){}
      document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCodeCard === card);
      });
    }
    applyCodeCard(currentCodeCard);

    document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeCard(btn.dataset.setCodeCard);
      });
    });

    // Code style handling (Indigo / Ruby / Sapphire / Minimal)
    var currentCodeStyle = 'indigo';
    try { currentCodeStyle = localStorage.getItem(STORAGE_KEY_CODE) || 'indigo'; }catch(e){}
    function applyCodeStyle(style){
      currentCodeStyle = style;
      document.documentElement.setAttribute('data-code-style', style);
      try { localStorage.setItem(STORAGE_KEY_CODE, style); }catch(e){}
      document.querySelectorAll('.code-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCode === style);
      });
    }
    applyCodeStyle(currentCodeStyle);

    document.querySelectorAll('.code-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeStyle(btn.dataset.setCode);
      });
    });

    // Font size scaling (Default: 20px)
    var DEFAULT_FONT_SIZE = 20;
    var currentFontSize = DEFAULT_FONT_SIZE;
    try {
      var savedFont = localStorage.getItem(STORAGE_KEY_FONT);
      if (savedFont) {
        currentFontSize = parseFloat(savedFont);
        if (currentFontSize === 16.5) currentFontSize = DEFAULT_FONT_SIZE;
      }
    } catch(e){}
    function applyFontSize(size){
      currentFontSize = Math.max(14, Math.min(28, Math.round(size * 10) / 10));
      document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
      try { localStorage.setItem(STORAGE_KEY_FONT, currentFontSize); }catch(e){}
      var fontResetBtn = document.getElementById('font-reset');
      if (fontResetBtn) fontResetBtn.textContent = Math.round(currentFontSize) + 'px';
    }
    applyFontSize(currentFontSize);
    document.getElementById('font-inc').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize + 1.5);
    });
    document.getElementById('font-dec').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize - 1.5);
    });
    document.getElementById('font-reset').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(DEFAULT_FONT_SIZE);
    });

    // Reset All to Defaults (Theme, Code card, Code style, Font size, and Reading progress)
    var resetAllBtn = document.getElementById('reset-all-btn');
    if (resetAllBtn) {
      resetAllBtn.addEventListener('click', function(e){
        e.stopPropagation();

        try {
          localStorage.removeItem(STORAGE_KEY_THEME);
          localStorage.removeItem(STORAGE_KEY_FONT);
          localStorage.removeItem(STORAGE_KEY_LAST);
          localStorage.removeItem(STORAGE_KEY_CODE);
          localStorage.removeItem(STORAGE_KEY_CODE_CARD);
          localStorage.removeItem(STORAGE_KEY_COMPLETED);
        } catch(err){}

        applyTheme('light');
        applyCodeCard('light');
        applyCodeStyle('indigo');
        applyFontSize(DEFAULT_FONT_SIZE);
        updateCompletionUI();

        if (location.hash !== '#0.1') {
          location.hash = '#0.1';
        } else {
          renderChapter('0.1');
        }

        var origHtml = resetAllBtn.innerHTML;
        resetAllBtn.classList.add('success');
        resetAllBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Reset to Defaults!</span>';

        setTimeout(function(){
          resetAllBtn.classList.remove('success');
          resetAllBtn.innerHTML = origHtml;
        }, 1800);
      });
    }

    // Settings popover
    var settingsBtn = document.getElementById('settings-btn');
    var settingsPopover = document.getElementById('settings-popover');

    function toggleSettings(open){
      var willOpen = (typeof open === 'boolean') ? open : !settingsPopover.classList.contains('open');
      settingsPopover.classList.toggle('open', willOpen);
      settingsBtn.classList.toggle('active', willOpen);
      settingsBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    }

    settingsBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleSettings();
    });

    settingsPopover.addEventListener('click', function(e){
      e.stopPropagation();
    });

    function handleOutsideSettingsClick(e){
      if(settingsPopover.classList.contains('open') && !settingsPopover.contains(e.target) && !settingsBtn.contains(e.target)){
        toggleSettings(false);
      }
    }
    document.addEventListener('click', handleOutsideSettingsClick);
    document.addEventListener('touchend', handleOutsideSettingsClick, { passive: true });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Reading Progress & Completion Memory
    function getCompletedChapters(){
      try {
        var raw = localStorage.getItem(STORAGE_KEY_COMPLETED);
        if(raw){
          var arr = JSON.parse(raw);
          if(Array.isArray(arr)) return arr;
        }
      }catch(e){}
      return [];
    }
    function isChapterCompleted(id){
      return getCompletedChapters().indexOf(id) !== -1;
    }
    function markChapterCompleted(id, completed){
      try {
        var list = getCompletedChapters();
        var idx = list.indexOf(id);
        if(completed && idx === -1){
          list.push(id);
        } else if(!completed && idx !== -1){
          list.splice(idx, 1);
        }
        localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(list));
        updateCompletionUI();
      }catch(e){}
    }
    function toggleChapterCompleted(id){
      markChapterCompleted(id, !isChapterCompleted(id));
    }
    function updateCompletionUI(){
      var completedList = getCompletedChapters();
      var completedSet = {};
      completedList.forEach(function(id){ completedSet[id] = true; });

      document.querySelectorAll('.chapter-item').forEach(function(item){
        var id = item.dataset.chapId;
        var isDone = !!completedSet[id];
        item.classList.toggle('completed', isDone);
        var check = item.querySelector('.chapter-check');
        if(check){
          check.setAttribute('title', isDone ? 'Completed (click to mark unread)' : 'Click to mark as completed');
          check.setAttribute('aria-label', (isDone ? 'Completed: ' : 'Uncompleted: ') + id);
        }
      });

      parts.forEach(function(p){
        var partBadge = document.querySelector('.part-count-badge[data-part-badge="' + p.partNum + '"]');
        if(partBadge){
          var doneCount = p.chapters.filter(function(c){ return !!completedSet[c.id]; }).length;
          var total = p.chapters.length;
          if(doneCount === total && total > 0){
            partBadge.textContent = '✓ ' + total;
            partBadge.classList.add('all-done');
            partBadge.title = 'All ' + total + ' chapters completed';
          } else if(doneCount > 0){
            partBadge.textContent = doneCount + '/' + total;
            partBadge.classList.remove('all-done');
            partBadge.title = doneCount + ' of ' + total + ' chapters completed';
          } else {
            partBadge.textContent = total;
            partBadge.classList.remove('all-done');
            partBadge.title = total + ' chapters';
          }
        }
      });

      var progressBadge = document.getElementById('toc-progress-badge');
      if(progressBadge){
        var totalDone = completedList.length;
        progressBadge.textContent = totalDone + ' / ' + chapters.length;
        if(totalDone === chapters.length && chapters.length > 0){
          progressBadge.textContent = chapters.length + ' / ' + chapters.length + ' ✓';
        }
      }

      var chapCompleteBtn = document.getElementById('chap-complete-btn');
      if(chapCompleteBtn && currentChapterId){
        var isDone = !!completedSet[currentChapterId];
        chapCompleteBtn.classList.toggle('completed', isDone);
        chapCompleteBtn.textContent = isDone ? '✓ Completed' : 'Mark as read';
        chapCompleteBtn.title = isDone ? 'Mark chapter as unread' : 'Mark chapter as completed';
      }
    }

    // Sidebar Header: Collapse / Expand All
    var tocToggleAllBtn = document.getElementById('toc-toggle-all-btn');
    function updateToggleAllBtnLabel(){
      if (!tocToggleAllBtn) return;
      var allGroups = document.querySelectorAll('.part-group');
      var openCount = 0;
      allGroups.forEach(function(g){ if(g.classList.contains('open')) openCount++; });
      tocToggleAllBtn.textContent = (openCount > 1) ? 'Collapse all' : 'Expand all';
    }

    if (tocToggleAllBtn) {
      tocToggleAllBtn.addEventListener('click', function(){
        var allGroups = Array.prototype.slice.call(document.querySelectorAll('.part-group'));
        var openCount = allGroups.filter(function(g){ return g.classList.contains('open'); }).length;
        var willExpand = openCount <= 1;

        allGroups.forEach(function(g){
          if (willExpand) {
            g.classList.add('open');
          } else {
            var isCurrent = currentChapterId && g.querySelector('a[href="#' + currentChapterId + '"]');
            if (isCurrent) {
              g.classList.add('open');
            } else {
              g.classList.remove('open');
            }
          }
        });
        updateToggleAllBtnLabel();
      });
    }

    // Build Table of Contents tree
    var tocTree = document.getElementById('toc-tree');
    var parts = [];
    var partsMap = {};
    chapters.forEach(function(c){
      if(!partsMap[c.partNum]){
        var pObj = { partNum: c.partNum, title: c.partTitle, metaphor: c.partMetaphor, chapters: [] };
        parts.push(pObj);
        partsMap[c.partNum] = pObj;
      }
      partsMap[c.partNum].chapters.push(c);
    });

    parts.forEach(function(p){
      var group = document.createElement('div');
      group.className = 'part-group';
      group.dataset.part = p.partNum;

      var header = document.createElement('button');
      header.className = 'part-header';
      header.type = 'button';
      if (p.metaphor) {
        header.title = p.title + ' — ' + p.metaphor;
      }
      header.innerHTML = 
        '<span class="part-title-text">' + escapeHtml(p.title) + '</span>' +
        '<span class="part-header-right">' +
          '<span class="part-count-badge" data-part-badge="' + p.partNum + '">' + p.chapters.length + '</span>' +
          '<span class="chevron" aria-hidden="true">▸</span>' +
        '</span>';

      header.addEventListener('click', function(){
        group.classList.toggle('open');
        updateToggleAllBtnLabel();
      });
      group.appendChild(header);

      var ul = document.createElement('ul');
      ul.className = 'chapter-list';
      p.chapters.forEach(function(c){
        var li = document.createElement('li');
        li.className = 'chapter-item';
        li.dataset.chapId = c.id;

        var a = document.createElement('a');
        a.href = '#' + c.id;
        a.innerHTML = 
          '<span class="chapter-badge">' + c.id + '</span>' +
          '<span class="chapter-title-text">' + escapeHtml(c.title) + '</span>' +
          '<button class="chapter-check" type="button" title="Toggle completed" aria-label="Mark ' + c.id + ' read or unread">✓</button>';

        var checkBtn = a.querySelector('.chapter-check');
        checkBtn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          toggleChapterCompleted(c.id);
        });

        a.addEventListener('click', function(e){
          closeDrawer();
        });
        li.appendChild(a);
        ul.appendChild(li);
      });
      group.appendChild(ul);
      tocTree.appendChild(group);
    });

    // Mobile drawer toggle
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('drawer-overlay');
    var hamburger = document.getElementById('hamburger-btn');

    function openDrawer(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
    function closeDrawer(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }

    if (hamburger) {
      hamburger.addEventListener('click', function(){ sidebar.classList.contains('open') ? closeDrawer() : openDrawer(); });
    }
    if (overlay) {
      overlay.addEventListener('click', closeDrawer);
    }

    // Render single chapter
    var chapterPane = document.getElementById('chapter-pane');
    var progressFill = document.getElementById('progress-fill');

    // =========================================================================
    // In-Browser WebAssembly Bash 5.2 Runtime Manager (100% Client-Side)
    // =========================================================================
    var BashEngine = {
      initPromise: null,
      statusCallback: null,
      isReady: false,
      executionQueue: Promise.resolve(),

      notify: function(pct, msg) {

      init: function(onProgress) {

          return Promise.resolve(true);
        }
        if (this.initPromise) {
          if (onProgress) this.statusCallback = onProgress;

        try { isCached = (localStorage.getItem('websh_wasm_cached') === 'true'); }catch(e){}

        this.initPromise = new Promise(async function(resolve, reject) {
          try {
            // Ensure hidden headless terminal container exists in DOM
            var termContainer = document.getElementById('terminal');
            if (!termContainer) {
              termContainer = document.createElement('div');
              termContainer.id = 'terminal';
              termContainer.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:600px;height:400px;opacity:0;pointer-events:none;z-index:-999;';
              termContainer.setAttribute('aria-hidden', 'true');
              document.body.appendChild(termContainer);
            }

            // Helper to load external scripts sequentially
            function loadScript(src) {
              return new Promise(function(res, rej) {
                var existing = document.querySelector('script[src="' + src + '"]');
                if (existing) {
                  if (existing.getAttribute('data-loaded') === 'true') return res();
                  existing.addEventListener('load', function(){ res(); });
                  existing.addEventListener('error', function(e){ rej(e); });
                  return;
                }
                var s = document.createElement('script');
                s.src = src;
                s.onload = function() { s.setAttribute('data-loaded', 'true'); res(); };
                s.onerror = function() { rej(new Error('Failed to load ' + src)); };
                document.head.appendChild(s);
              });
            }

            self.notify(28, "Loading runtime shims (jsfs, vnet, wasm_exec)...");

            var vendorBase = './vendor/websh/';
            await loadScript(vendorBase + 'jsfs.js');
            await loadScript(vendorBase + 'vnet.js');
            await loadScript(vendorBase + 'wasm_exec.js');

            self.notify(48, isCached ? "Reading WebAssembly core from cache..." : "Loading Bash 5.2 WebAssembly (~3.5 MB)...");

            var wasmPath = vendorBase + 'main.wasm';
            var res = await fetch(wasmPath);
            if (!res.ok) throw new Error('HTTP ' + res.status + ': Failed to fetch ' + wasmPath);

            self.notify(72, "Instantiating WebAssembly module...");

            var go = new Go();
            var wasmInstance;
            if (typeof WebAssembly.instantiateStreaming === 'function') {
              try {
                var streamRes = await WebAssembly.instantiateStreaming(res.clone(), go.importObject);
                wasmInstance = streamRes.instance;
              } catch (streamErr) {
                var buf = await res.arrayBuffer();
                var mod = await WebAssembly.instantiate(buf, go.importObject);
                wasmInstance = mod.instance;
              }
            } else {
              var buf = await res.arrayBuffer();
              var mod = await WebAssembly.instantiate(buf, go.importObject);
              wasmInstance = mod.instance;
            }

            self.notify(88, "Booting shell and mounting virtual filesystem...");

            // Run Go WebAssembly Runtime
            go.run(wasmInstance);
            try { localStorage.setItem('websh_wasm_cached', 'true'); }catch(e){}

            // Wait for terminal textarea to be created and mounted by xterm-go
            var checkCount = 0;
            var checkInterval = setInterval(function() {
              checkCount++;
              var ta = document.querySelector('#terminal textarea') || document.querySelector('.xterm-helper-textarea');
              if (ta || checkCount > 60) {
                clearInterval(checkInterval);
                if (!ta) {
                  reject(new Error("WebAssembly Bash terminal textarea timed out during boot"));
                  return;
                }
                self.isReady = true;
                self.notify(100, "Bash engine ready!");
                // Short settle delay for shell prompt
                setTimeout(function() { resolve(true); }, 350);
              }
            }, 100);

          } catch(err) {
            console.error("BashEngine boot error:", err);
            self.initPromise = null;
            reject(err);
          }
        });

        return this.initPromise;
      },

      run: function(code, onProgress) {
        var self = this;
        return (this.executionQueue = this.executionQueue.then(function() {
          return self._execute(code, onProgress);
        }));
      },

      _execute: async function(code, onProgress) {
        await this.init(onProgress);

        var ta = document.querySelector('#terminal textarea') || document.querySelector('.xterm-helper-textarea');
        if (!ta) {
          throw new Error("Bash execution terminal not available");
        }

        var startTime = performance.now();

        return new Promise(function(resolve) {
          var DONE_TOKEN = '___HEXLEAN_DONE_' + Date.now() + '_' + Math.floor(Math.random() * 1000000) + '___';
          var done = false;

          var timer = setTimeout(function() {
            if (!done) {
              done = true;
              var elapsed = Math.round(performance.now() - startTime);
              resolve({
                stdout: '',
                stderr: 'Execution timed out (exceeded 10 seconds limit)',
                executionTime: elapsed,
                exitCode: -1,
                error: true
              });
            }
          }, 10000);

          // Intercept clipboard writeText via pbcopy
          Object.defineProperty(navigator, 'clipboard', {
            value: {
              writeText: function(raw) {
                if (done) return Promise.resolve();
                if (raw && raw.indexOf(DONE_TOKEN) !== -1) {
                  done = true;
                  clearTimeout(timer);
                  var elapsed = Math.round(performance.now() - startTime);

                  var exitCode = 0;
                  var exitMatch = raw.match(/___HEXLEAN_EXIT_(-?\d+)___/);
                  if (exitMatch) {
                    exitCode = parseInt(exitMatch[1], 10);
                  }

                  var clean = raw.split('___HEXLEAN_EXIT_')[0].trimEnd();

                  resolve({
                    stdout: clean,
                    executionTime: elapsed,
                    exitCode: exitCode,
                    error: exitCode !== 0
                  });
                }
                return Promise.resolve();
              },
              readText: function() { return Promise.resolve(''); }
            },
            configurable: true,
            writable: true
          });

          ta.focus();

          // Encode script in base64 to ensure 100% preservation of all quotes, newlines, variables & syntax
          var cleanCode = code.trim();
          var utf8Bytes = encodeURIComponent(cleanCode).replace(/%([0-9A-F]{2})/g, function(match, p1) {
            return String.fromCharCode('0x' + p1);
          });
          var b64 = btoa(utf8Bytes);

          // Subshell execution capturing output and exit code
          var payload = 'echo "' + b64 + '" | base64 -d > /tmp/_run.sh && { ( . /tmp/_run.sh ); echo "___HEXLEAN_EXIT_$?___"; echo "' + DONE_TOKEN + '"; } 2>&1 | pbcopy; rm -f /tmp/_run.sh\n';

          var dt = new DataTransfer();
          dt.setData('text/plain', payload);
          var ev = new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true });
          ta.dispatchEvent(ev);
        });
      }
    };

    function renderChapter(id){
      var chap = chapterMap[id];
      if(!chap) chap = chapters[0];
      currentChapterId = chap.id;

      try { localStorage.setItem(STORAGE_KEY_LAST, chap.id); }catch(e){}

      var pct = ((chap.index + 1) / chapters.length) * 100;
      if (progressFill) progressFill.style.width = pct + '%';

      document.querySelectorAll('.chapter-item a').forEach(function(a){
        var isActive = a.getAttribute('href') === '#' + chap.id;
        a.classList.toggle('active', isActive);
      });

      var activeGroup = document.querySelector('.part-group[data-part="' + chap.partNum + '"]');
      if(activeGroup) {
        activeGroup.classList.add('open');
        var activeLink = activeGroup.querySelector('a[href="#' + chap.id + '"]');
        if(activeLink && activeLink.scrollIntoView) {
          activeLink.scrollIntoView({ block: 'nearest' });
        }
      }

      var htmlContent = '';
      if(window.marked && window.marked.parse){
        window.marked.setOptions({ gfm: true, breaks: false });
        htmlContent = window.marked.parse(chap.md);
      } else {
        htmlContent = '<pre>' + chap.md + '</pre>';
      }

      chapterPane.innerHTML = '';

      // Eyebrow
      var eyebrow = document.createElement('div');
      eyebrow.className = 'chap-eyebrow';
      var isDone = isChapterCompleted(chap.id);
      eyebrow.innerHTML = 
        '<div class="chap-eyebrow-left">' +
          '<span>' + escapeHtml(chap.partTitle) + '</span>' +
          (chap.partMetaphor ? '<span class="metaphor-note">— ' + escapeHtml(chap.partMetaphor) + '</span>' : '') +
        '</div>' +
        '<button class="chap-complete-btn' + (isDone ? ' completed' : '') + '" id="chap-complete-btn" type="button" title="' + (isDone ? 'Mark chapter as unread' : 'Mark chapter as completed') + '">' +
          (isDone ? '✓ Completed' : 'Mark as read') +
        '</button>';
      var completeBtn = eyebrow.querySelector('#chap-complete-btn');
      completeBtn.addEventListener('click', function(){
        toggleChapterCompleted(chap.id);
      });
      chapterPane.appendChild(eyebrow);

      // Title row
      var titleRow = document.createElement('div');
      titleRow.className = 'chap-title-row';

      // Enhanced Code Block Cards with Runner & Output Shelf

      var spinnerIconSvg = '<svg class="spinner-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"></circle></svg>';
      var resetIconSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>';
      var copyIconSvg = '<svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
      var checkIconSvg = '<svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

      bodyDiv.querySelectorAll('pre').forEach(function(pre){
        var codeEl = pre.querySelector('code');
        var origClass = (codeEl && codeEl.className) || '';
        var explicitMatch = origClass.match(/language-([a-zA-Z0-9_-]+)/);
        var explicitLang = explicitMatch ? explicitMatch[1].toLowerCase() : null;

        var initialCode = (codeEl || pre).textContent;
        var firstLine = initialCode.trim().split('\n')[0].trim();
        var isTerminalCmd = /^(\$ )/i.test(firstLine);

        var lang = 'BASH';
        var isRunnable = false;

        if (explicitLang === 'bash' || explicitLang === 'sh' || explicitLang === 'shell') {
          if (isTerminalCmd) {
            lang = 'TERMINAL';
            isRunnable = false;
          } else {
            lang = 'BASH';
            isRunnable = true;
          }
        } else if (explicitLang === 'json') {
          lang = 'JSON';
          isRunnable = false;
        } else if (explicitLang) {
          lang = explicitLang.toUpperCase();
          isRunnable = false;
        } else if (isTerminalCmd) {
          lang = 'TERMINAL';
          isRunnable = false;
        } else {
          lang = 'OUTPUT';
          isRunnable = false;
        }

        if(window.hljs && codeEl) {
          if (explicitLang) {

        var card = document.createElement('div');

        var right = document.createElement('div');
        right.className = 'code-header-right';

        var resetBtn = null;
        var runBtn = null;
        var shelf = null;

        if (isRunnable) {
          codeEl.setAttribute('contenteditable', 'true');
          codeEl.setAttribute('spellcheck', 'false');

          resetBtn = document.createElement('button');
          resetBtn.className = 'code-reset-btn';
          resetBtn.type = 'button';
          resetBtn.title = 'Reset code to original textbook example';
          resetBtn.innerHTML = resetIconSvg + '<span>Reset</span>';

          resetBtn.addEventListener('click', function(){
            codeEl.textContent = initialCode;
            if(window.hljs) hljs.highlightElement(codeEl);
            resetBtn.classList.remove('visible');
          });
          right.appendChild(resetBtn);

          codeEl.addEventListener('input', function(){
            if (codeEl.textContent !== initialCode) {
              resetBtn.classList.add('visible');
            } else {
              resetBtn.classList.remove('visible');
            }
          });

          runBtn = document.createElement('button');
          runBtn.className = 'code-run-btn';
          runBtn.type = 'button';

          right.appendChild(runBtn);

        var copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.type = 'button';
        copyBtn.title = 'Copy code to clipboard';
        copyBtn.innerHTML = copyIconSvg + '<span>Copy</span>';

        copyBtn.addEventListener('click', function(){
          var text = (codeEl || pre).textContent;
          var done = function(){
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = checkIconSvg + '<span>Copied!</span>';
            setTimeout(function(){
              copyBtn.classList.remove('copied');
              copyBtn.innerHTML = copyIconSvg + '<span>Copy</span>';
            }, 1800);
          };
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(done, function(){
              fallbackCopy(text, done);
            });
          } else {
            fallbackCopy(text, done);
          }
        });
        right.appendChild(copyBtn);
        cardHeader.appendChild(right);

        pre.parentNode.insertBefore(card, pre);
        card.appendChild(cardHeader);
        card.appendChild(pre);

        if (isRunnable) {
          shelf = document.createElement('div');
          shelf.className = 'code-output-shelf';

          var shelfHeader = document.createElement('div');
          shelfHeader.className = 'code-output-header';
          shelfHeader.innerHTML = 
            '<div class="code-output-header-left">' +
              '<span>❯ Terminal Output</span>' +
              '<span class="output-status-badge"></span>' +
            '</div>' +
            '<button class="code-output-clear" type="button">Clear</button>';
          shelf.appendChild(shelfHeader);

          var shelfBody = document.createElement('div');
          shelfBody.className = 'code-output-body';
          shelf.appendChild(shelfBody);

          var badge = shelfHeader.querySelector('.output-status-badge');
          var clearBtn = shelfHeader.querySelector('.code-output-clear');

          clearBtn.addEventListener('click', function(){
            shelf.classList.remove('open');
            shelfBody.innerHTML = '';
            badge.textContent = '';
            badge.className = 'output-status-badge';
          });

          runBtn.addEventListener('click', async function(){
            shelf.classList.add('open');
            runBtn.classList.add('running');
            runBtn.innerHTML = spinnerIconSvg + '<span>Running...</span>';

            var isInitial = !BashEngine.isReady;
            if (isInitial) {
              var cached = false;
              try { cached = (localStorage.getItem('websh_wasm_cached') === 'true'); }catch(e){}
              shelfBody.innerHTML = 
                '<div class="bash-progress-box">' +
                  '<div class="bash-progress-title">' +
                    spinnerIconSvg +
                    '<span>' + (cached ? 'Loading Bash engine from browser cache...' : 'First-time setup: Initializing local Bash engine (~3.5 MB)...') + '</span>' +
                  '</div>' +
                  '<div class="bash-progress-track"><div class="bash-progress-fill" style="width: 15%;"></div></div>' +
                  '<div class="bash-progress-meta">' +
                    '<span class="bash-status-msg">Starting WebAssembly runtime...</span>' +
                    '<span class="bash-status-pct">15%</span>' +
                  '</div>' +
                  '<div class="bash-progress-hint">' +
                    (cached ? 'Reading cached WebAssembly from disk...' : 'Zero backend servers • Runs 100% in your browser • Instant on subsequent runs.') +
                  '</div>' +
                '</div>';
            }

            var progressFill = shelfBody.querySelector('.bash-progress-fill');
            var statusMsg = shelfBody.querySelector('.bash-status-msg');
            var statusPct = shelfBody.querySelector('.bash-status-pct');

            var codeToRun = (codeEl || pre).innerText || (codeEl || pre).textContent;

            try {
              var r = await BashEngine.run(codeToRun, function(pct, msg){
                if (progressFill) progressFill.style.width = pct + '%';
                if (statusMsg) statusMsg.textContent = msg;
                if (statusPct) statusPct.textContent = pct + '%';
              });

              runBtn.classList.remove('running');
              runBtn.innerHTML = playIconSvg + '<span>Run</span>';

              if (r.error) {
                var errLabel = (r.exitCode && r.exitCode !== -1) ? ('❌ Exit ' + r.exitCode + ' (' + r.executionTime + 'ms)') : ('❌ Error (' + r.executionTime + 'ms)');
                badge.textContent = errLabel;
                badge.className = 'output-status-badge error';
                var errText = r.stdout || r.stderr || 'Command failed with non-zero exit code ' + r.exitCode;
                shelfBody.innerHTML = '<pre class="code-output-text error">' + escapeHtml(errText) + '</pre>';
              } else {
                badge.textContent = '✓ ' + r.executionTime + 'ms';
                badge.className = 'output-status-badge success';

                var outText = '';
                if (r.stdout && r.stdout.trim()) {
                  outText = r.stdout;
                  if (r.stderr && r.stderr.trim()) {
                    outText += '\n' + r.stderr;
                  }
                } else if (r.stderr && r.stderr.trim()) {
                  outText = r.stderr;
                } else {
                  outText = '(Program executed successfully with no printed output)';
                }

                shelfBody.innerHTML = '<pre class="code-output-text' + (outText.startsWith('(') ? ' empty' : '') + '">' + escapeHtml(outText) + '</pre>';

            } catch(e) {
              runBtn.classList.remove('running');
              runBtn.innerHTML = playIconSvg + '<span>Run</span>';
              badge.textContent = '❌ Failed';
              badge.className = 'output-status-badge error';
              shelfBody.innerHTML = '<pre class="code-output-text error">' + escapeHtml(e.message || String(e)) + '</pre>';

          card.appendChild(shelf);

      function fallbackCopy(text, cb){
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta);
        cb();

      // Next / Previous Navigation Cards

      navCards.innerHTML =

        (next ? '<a class="nav-card next" href="#' + next.id + '"><span class="nav-card-dir">Next Chapter ›</span><span class="nav-card-title">' + next.id + ' ' + next.title + '</span></a>' : '<div></div>');
      
      var nextCardLink = navCards.querySelector('.nav-card.next');

            '&copy; 2026 <strong>HexLean</strong> &bull; An open technical educational project curated by <a href="https://hexdef.com" target="_blank" rel="noopener">Tanvir Hussain</a>.' +
          '</div>' +

          '</div>' +
        '</div>';
      chapterPane.appendChild(readerFooter);

      // Auto-mark completed when reaching the bottom of chapter
      if (window.IntersectionObserver) {
        var bottomObserver = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if (entry.isIntersecting) {
              markChapterCompleted(chap.id, true);
              bottomObserver.disconnect();
            }
          });
        }, { threshold: 0.3 });
        bottomObserver.observe(navCards);
      }

      window.scrollTo({ top: 0, behavior: 'instant' });
      updateCompletionUI();
      updateToggleAllBtnLabel();

    function groupSubsections(container){
      var kids = Array.prototype.slice.call(container.children);
      var i = 0;
      while(i < kids.length){
        var el = kids[i];
        if(el.tagName === 'H3'){
          var wrapper = document.createElement('div');
          var text = el.textContent.toLowerCase();
          var cls = 'subsection';
          if(text.indexOf('mistake') !== -1) cls += ' subsection--mistakes';
          else if(text.indexOf('recap') !== -1) cls += ' subsection--recap';
          else if(text.indexOf('matters') !== -1) cls += ' subsection--matters';
          wrapper.className = cls;
          container.insertBefore(wrapper, el);
          wrapper.appendChild(el);
          var j = i + 1;
          while(j < kids.length && kids[j].tagName !== 'H3' && kids[j].tagName !== 'H2'){
            wrapper.appendChild(kids[j]);
            j++;
          }
          i = j;
        } else {
          i++;
        }
      }
    }

    // Router handling via Hash
    function handleHash(){
      var hash = location.hash.replace(/^#\/?/, '').trim();
      if(!hash){
        var last = null;
        try { last = localStorage.getItem(STORAGE_KEY_LAST); }catch(e){}
        if(last && chapterMap[last]){
          location.replace('#' + last);
          return;
        }
        hash = '0.1';
      }
      if(chapterMap[hash]){
        renderChapter(hash);
      } else {
        renderChapter('0.1');
      }
    }

    window.addEventListener('hashchange', handleHash);
    handleHash();

    // Touch Swipe Gestures
    var touchStartX = 0, touchStartY = 0;
    var contentPane = document.getElementById('main-viewport');
    if (contentPane) {
      contentPane.addEventListener('touchstart', function(e){
        if(e.touches.length === 1){
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      contentPane.addEventListener('touchend', function(e){
        if(e.changedTouches.length === 1){
          var diffX = e.changedTouches[0].clientX - touchStartX;
          var diffY = e.changedTouches[0].clientY - touchStartY;
          if(Math.abs(diffX) > 80 && Math.abs(diffY) < 50){
            var currentChap = chapterMap[currentChapterId];
            if(!currentChap) return;
            if(diffX < 0 && chapters[currentChap.index + 1]){
              markChapterCompleted(currentChap.id, true);
              location.hash = '#' + chapters[currentChap.index + 1].id;
            } else if(diffX > 0 && chapters[currentChap.index - 1]){
              location.hash = '#' + chapters[currentChap.index - 1].id;
            }
          }
        }
      }, { passive: true });
    }

    // Search Command Palette Modal Logic
    var searchModal = document.getElementById('search-modal');
    var searchBackdrop = document.getElementById('search-backdrop');
    var searchInput = document.getElementById('search-input');
    var searchClearBtn = document.getElementById('search-clear-btn');
    var searchCloseBtn = document.getElementById('search-close-btn');
    var searchResults = document.getElementById('search-results');
    var searchCount = document.getElementById('search-count');
    var searchBtn = document.getElementById('search-btn');

    var isMac = (typeof navigator !== 'undefined' && (navigator.platform || '').toUpperCase().indexOf('MAC') >= 0);
    var shortcutBadge = document.querySelector('.search-shortcut-badge');
    if (shortcutBadge) {
      shortcutBadge.textContent = isMac ? '⌘K' : 'Ctrl+K';
    }

    var searchCorpus = chapters.map(function(c){
      var cleanMd = (c.md || '')
        .replace(/^#+\s+/gm, '')
        .replace(/`{3}[a-zA-Z0-9_-]*\n([\s\S]*?)`{3}/g, ' $1 ')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1');

      return {
        id: c.id,
        index: c.index,
        partNum: c.partNum,
        partTitle: c.partTitle,
        partMetaphor: c.partMetaphor || '',
        title: c.title,
        fullTitle: c.fullTitle,
        cleanText: cleanMd
      };
    });

    var popularTopics = [
      "Parameter Expansion", "Arrays & Maps", "if / elif / else", "for & while Loops",
      "Functions & Namerefs", "Pipes & Redirection", "grep, sed & awk", "find & xargs",
      "Process Substitution", "Job Control & trap", "Debugging (set -euo pipefail)", "jq & JSON Parsing"
    ];

    var selectedSearchIndex = -1;
    var currentResultItems = [];

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderDefaultSuggestions() {
      searchCount.textContent = chapters.length + ' chapters indexed';
      searchClearBtn.classList.remove('visible');
      selectedSearchIndex = -1;
      currentResultItems = [];

      var html = '<div class="search-empty">' +
        '<div class="search-empty-icon">🔍</div>' +
        '<div class="search-empty-title">Search Learn Bash</div>' +
        '<div class="search-empty-desc">Search topics, shell scripts, commands, syntax, utilities, and chapter titles across all 66 chapters.</div>' +
        '<div class="search-suggestions-label">Popular Topics</div>' +
        '<div class="search-suggestions-pills">';

      popularTopics.forEach(function(topic){
        html += '<button type="button" class="search-pill" data-topic="' + escapeHtml(topic) + '">' + escapeHtml(topic) + '</button>';
      });

      html += '</div></div>';
      searchResults.innerHTML = html;

      searchResults.querySelectorAll('.search-pill').forEach(function(btn){
        btn.addEventListener('click', function(){
          var topic = btn.getAttribute('data-topic');
          searchInput.value = topic;
          performSearch(topic);
          searchInput.focus();
        });
      });
    }

    function highlightText(text, terms) {
      var escaped = escapeHtml(text);
      if (!terms || terms.length === 0) return escaped;

      var validTerms = [];
      terms.forEach(function(t){
        var clean = t.trim();
        if (clean.length > 0 && validTerms.indexOf(clean) === -1) {
          validTerms.push(clean);
        }
      });
      if (validTerms.length === 0) return escaped;

      validTerms.sort(function(a, b){ return b.length - a.length; });
      var pattern = validTerms.map(function(t){ return escapeRegex(escapeHtml(t)); }).join('|');
      var re = new RegExp('(' + pattern + ')', 'gi');
      return escaped.replace(re, '<mark class="search-highlight">$1</mark>');
    }

    function performSearch(query) {
      var q = (query || '').trim();
      if (!q) {
        renderDefaultSuggestions();
        return;
      }

      searchClearBtn.classList.add('visible');

      var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (terms.length === 0) {
        renderDefaultSuggestions();
        return;
      }

      var hits = [];
      for (var i = 0; i < searchCorpus.length; i++) {
        var doc = searchCorpus[i];
        var titleLower = (doc.title || '').toLowerCase();
        var fullTitleLower = (doc.fullTitle || '').toLowerCase();
        var partLower = ((doc.partTitle || '') + ' ' + (doc.partMetaphor || '')).toLowerCase();
        var textLower = (doc.cleanText || '').toLowerCase();

        var score = 0;
        var allMatched = true;

        for (var t = 0; t < terms.length; t++) {
          var term = terms[t];
          var inTitle = titleLower.indexOf(term) !== -1;
          var inFullTitle = fullTitleLower.indexOf(term) !== -1;
          var inPart = partLower.indexOf(term) !== -1;
          var inText = textLower.indexOf(term) !== -1;

          if (!inTitle && !inFullTitle && !inPart && !inText) {
            allMatched = false;
            break;
          }

          if (inTitle) score += 120;
          if (inFullTitle) score += 90;
          if (inPart) score += 40;
          if (inText) {
            var count = 0;
            var pos = 0;
            while ((pos = textLower.indexOf(term, pos)) !== -1 && count < 6) {
              score += 15;
              pos += term.length;
              count++;
            }
          }
        }

        if (!allMatched) continue;

        var snippet = '';
        var firstPos = -1;
        for (var k = 0; k < terms.length; k++) {
          var p = textLower.indexOf(terms[k]);
          if (p !== -1 && (firstPos === -1 || p < firstPos)) {
            firstPos = p;
          }
        }

        if (firstPos !== -1) {
          var start = Math.max(0, firstPos - 45);
          var end = Math.min(doc.cleanText.length, firstPos + 105);
          snippet = (start > 0 ? '… ' : '') + doc.cleanText.substring(start, end).trim() + (end < doc.cleanText.length ? ' …' : '');
        } else {
          snippet = doc.cleanText.substring(0, 110).trim() + '…';
        }

        hits.push({
          id: doc.id,
          title: doc.title,
          partNum: doc.partNum,
          partTitle: doc.partTitle,
          partMetaphor: doc.partMetaphor,
          snippet: snippet,
          score: score
        });
      }

      hits.sort(function(a, b){ return b.score - a.score; });
      renderSearchResults(hits, terms, q);
    }

    function renderSearchResults(hits, terms, query) {
      selectedSearchIndex = -1;
      currentResultItems = [];

      if (hits.length === 0) {
        searchCount.textContent = '0 results';
        searchResults.innerHTML = 
          '<div class="search-empty">' +
            '<div class="search-empty-icon">🧐</div>' +
            '<div class="search-empty-title">No matching chapters</div>' +
            '<div class="search-empty-desc">No chapters contained all terms for "' + escapeHtml(query) + '". Try simpler keywords like <code>variables</code>, <code>pipe</code>, or <code>xargs</code>.</div>' +
          '</div>';
        return;
      }

      searchCount.textContent = hits.length + ' result' + (hits.length === 1 ? '' : 's');

      var html = '';
      hits.forEach(function(item, idx){
        var highlightedTitle = highlightText(item.title, terms);
        var highlightedSnippet = highlightText(item.snippet, terms);

        html += 
          '<a class="search-result-item" data-chap-id="' + item.id + '" data-search-index="' + idx + '" href="#' + item.id + '">' +
            '<div class="search-result-top">' +
              '<span class="search-part-badge">Part ' + item.partNum + '</span>' +
              '<span class="search-item-id">' + item.id + '</span>' +
              '<span class="search-item-title">' + highlightedTitle + '</span>' +
            '</div>' +
            '<div class="search-snippet">' + highlightedSnippet + '</div>' +
          '</a>';
      });

      searchResults.innerHTML = html;
      currentResultItems = Array.prototype.slice.call(searchResults.querySelectorAll('.search-result-item'));

      currentResultItems.forEach(function(el, idx){
        el.addEventListener('click', function(e){
          e.preventDefault();
          var cid = el.getAttribute('data-chap-id');
          navigateToChapter(cid);
        });
        el.addEventListener('mouseenter', function(){
          setSelectedIndex(idx, false);
        });
      });

      if (currentResultItems.length > 0) {
        setSelectedIndex(0, false);
      }
    }

    function setSelectedIndex(idx, scrollIntoView) {
      if (currentResultItems.length === 0) return;
      if (idx < 0) idx = 0;
      if (idx >= currentResultItems.length) idx = currentResultItems.length - 1;

      currentResultItems.forEach(function(item, i){
        item.classList.toggle('selected', i === idx);
      });
      selectedSearchIndex = idx;

      if (scrollIntoView && currentResultItems[idx]) {
        currentResultItems[idx].scrollIntoView({ block: 'nearest' });
      }
    }

    function navigateToChapter(cid) {
      closeSearch();
      location.hash = '#' + cid;
    }

    function openSearch() {
      searchModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (!searchInput.value.trim()) {
        renderDefaultSuggestions();
      }
      setTimeout(function(){
        searchInput.focus();
        searchInput.select();
      }, 50);
    }

    function closeSearch() {
      searchModal.classList.remove('open');
      document.body.style.overflow = '';
    }

    if (searchBtn) searchBtn.addEventListener('click', openSearch);
    if (searchBackdrop) searchBackdrop.addEventListener('click', closeSearch);
    if (searchCloseBtn) searchCloseBtn.addEventListener('click', closeSearch);

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', function(){
        searchInput.value = '';
        searchInput.focus();
        renderDefaultSuggestions();
      });
    }

    if (searchInput) {
      searchInput.addEventListener('input', function(){
        performSearch(searchInput.value);
      });

      searchInput.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex + 1, true);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex - 1, true);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (selectedSearchIndex >= 0 && currentResultItems[selectedSearchIndex]) {
            var cid = currentResultItems[selectedSearchIndex].getAttribute('data-chap-id');
            navigateToChapter(cid);
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeSearch();
        }
      });
    }

    // Global keyboard navigation
    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === '/' && !searchModal.classList.contains('open')) {
        if (document.activeElement && (
          document.activeElement.tagName === 'INPUT' ||
          document.activeElement.tagName === 'TEXTAREA' ||
          document.activeElement.isContentEditable
        )) {
          return;
        }
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === 'Escape' && searchModal.classList.contains('open')) {
        e.preventDefault();
        closeSearch();
        return;
      }

      if (searchModal.classList.contains('open')) return;

      if(document.activeElement && (
        document.activeElement.tagName === 'INPUT' ||
        document.activeElement.tagName === 'TEXTAREA' ||
        document.activeElement.isContentEditable
      )) return;

      var currentChap = chapterMap[currentChapterId];
      if(!currentChap) return;

      if(e.key === 'ArrowRight' || (!e.ctrlKey && !e.metaKey && e.key === 'k')){
        if(chapters[currentChap.index + 1]) location.hash = '#' + chapters[currentChap.index + 1].id;
      } else if(e.key === 'ArrowLeft' || e.key === 'j'){
        if(chapters[currentChap.index - 1]) location.hash = '#' + chapters[currentChap.index - 1].id;
      } else if(e.key === 't'){
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else if(e.key === 'Escape'){
        closeDrawer();
        toggleSettings(false);
      }
    });

    // Background pre-warm for WebAssembly Bash Engine
    setTimeout(function() {
      if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(function() { BashEngine.init().catch(function(){}); });
      } else {
        setTimeout(function() { BashEngine.init().catch(function(){}); }, 2500);
      }
    }, 1200);

  })();
  </script>
</body>
</html>
