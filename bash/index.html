ssion flag.\n- **Forgetting the `./`.** Typing `hello.sh` instead of `./hello.sh` usually fails with `command not found`, even though the file is sitting right there — Bash only auto-searches your `PATH` folders for bare command names, and your current folder normally isn't on it.\n- **Editing shebang line endings on Windows.** If you write a script on Windows and it picks up Windows-style line endings (`\\r\\n`), the shebang line can end up as `#!/usr/bin/env bash\\r`, which Bash on Linux/Mac won't recognize, producing `bad interpreter` errors. Save shell scripts with plain Unix (`\\n`) line endings — most code editors have a setting for this.\n- **Assuming `#!/bin/bash` is universal.** It's the right choice on the vast majority of systems, but some minimal environments (like slimmed-down Docker images) don't have Bash at `/bin/bash` at all, or lack Bash entirely. `#!/usr/bin/env bash` is the more portable habit.\n\n### How this connects\n\nYou now have the complete, minimal skeleton every script in this book will build on: shebang, executable permission, run with `./`. The next chapter looks at comments and how to structure a script beyond a single line; the one after that introduces variables — the first real \"vocabulary\" this book teaches.\n\n### Quick recap\n\n- A script needs a **shebang** as its literal first line — `#!/usr/bin/env bash` is the portable, recommended form.\n- Make a script runnable with `chmod +x filename.sh`, then run it with `./filename.sh`.\n- `$?` holds the exit status of the last command — `0` means success.\n- A missing shebang sometimes \"works\" through a fallback you shouldn't rely on; always write one.\n- A wrong shebang path produces a `cannot execute: required file not found` error with exit status `127`."}, {"id": "1.2", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a script is made of", "chapNum": 2, "slug": "comments-script-structure", "fullTitle": "Comments & Script Structure", "title": "Comments & Script Structure", "md": "### Why this matters\n\nA script you write today and a script someone (possibly future-you) reads in six months are very different experiences unless you leave yourself notes. Comments are how you do that. And once scripts grow past a couple of lines, you need to know the handful of rules for how Bash decides where one command ends and the next begins — otherwise a perfectly reasonable-looking script does something baffling.\n\n### The core idea\n\nA **comment** is text Bash ignores completely — it's there purely for humans. Anything from a `#` to the end of that line is a comment, *unless* the `#` appears inside quotes, in which case it's just a literal character with no special meaning.\n\n**Command separation** in Bash comes down to a small set of rules:\n- A **newline** ends a command. The next line is a new command.\n- A **semicolon (`;`)** does the same thing on a single line — it lets you put multiple commands where you'd normally need multiple lines.\n- A **backslash (`\\`) at the absolute end of a line** tells Bash \"this command isn't finished — continue reading it on the next line.\" This is how you break one long command across several lines for readability.\n\n### Examples\n\n**1. A comment on its own line, and a trailing comment.**\n```bash\n#!/usr/bin/env bash\n# This script demonstrates basic structure.\necho \"Step 1\"  # this runs, then Bash ignores everything after the #\n```\nBoth comment styles are common; use whichever reads more clearly in context — a line explaining a whole block usually gets its own line above it, while a short clarifying note often fits neatly at the end of the line it's about.\n\n**2. Semicolons to put multiple commands on one line.**\n```bash\necho \"Step 2a\"; echo \"Step 2b\"\n```\nOutput:\n```\nStep 2a\nStep 2b\n```\nEach command still runs completely separately, in order — the semicolon is purely a visual join, not a connection between the commands (compare this to `&&` and `||` in Chapter 1.5, which *do* create a real relationship between commands).\n\n**3. Breaking a long line with a backslash.**\n```bash\necho \"This is a long line\" \\\n     \"that continues here.\"\n```\nOutput:\n```\nThis is a long line that continues here.\n```\nBash reads the backslash-then-newline as if it weren't there at all, stitching the two lines into one logical command. This is purely a readability tool for you — it doesn't change what the command does.\n\n**4. A `#` inside quotes is just a character, not a comment.**\n```bash\necho \"This # is not a comment because it's inside quotes\"\n```\nOutput:\n```\nThis # is not a comment because it's inside quotes\n```\nBash only treats `#` as \"start a comment\" when it appears somewhere a new word could begin (broadly: unquoted, and not stuck onto the end of another word). Inside a quoted string, it's inert.\n\n**5. An empty comment line — legal, sometimes used as a visual separator.**\n```bash\n#!/usr/bin/env bash\n#\necho \"after empty comment\"\n```\nA bare `#` with nothing after it is still a valid, complete comment. Some scripts use a lone `#` (or a row of `#` characters) as a visual divider between sections.\n\n### ⚠️ Common Mistakes\n\n- **Trailing whitespace after a line-continuation backslash.** `\\` must be the *very last character* on the line — no trailing space, no trailing tab. A backslash followed by a space, followed by a newline, does **not** continue the line; instead, the backslash just escapes that one space character (making it a literal space), and the newline ends the command normally, as if the backslash-space combination were never there. This produces confusing results that look almost, but not quite, right — for example, `echo \"a\" \\ ` (note the space after the backslash) followed by a newline runs as `echo \"a\" \" \"`, printing `a` with a stray extra space, and then whatever's on the next line runs as a completely separate command. Many editors are configured to strip trailing whitespace automatically specifically to avoid this trap — turning that setting on is a good habit.\n- **Assuming `#` always starts a comment.** It doesn't inside quotes, and it doesn't when directly attached to the end of a word with no preceding space, like `echo hello#world` (Bash treats `hello#world` as one word there, not a comment). When in doubt, put a space before a trailing `#` comment.\n- **Confusing `;` with `&&`.** `;` just moves to the next command regardless of what happened before it. If you actually want \"only run this next command if the previous one succeeded,\" you want `&&` instead — covered fully in Chapter 1.5. Using `;` where you meant `&&` is a common source of scripts that \"keep going\" after a step has clearly failed.\n- **Over-commenting the obvious.** A comment like `# print hello` above `echo \"hello\"` adds noise, not clarity. Save comments for *why* something is done a particular way, not a restatement of *what* the code already says plainly.\n\n### How this connects\n\nComments and command separation are the connective tissue you'll use in every single script from here forward — every example in this book uses both freely. Next up: variables, the first real building block for storing and reusing values.\n\n### Quick recap\n\n- `# ...` starts a comment that runs to the end of the line, unless the `#` is inside quotes or stuck onto another word.\n- `;` separates multiple commands on one line; each still runs independently, regardless of whether the previous one succeeded.\n- A `\\` at the *very end* of a line (no trailing whitespace after it) continues a command onto the next line — purely for readability.\n- A backslash followed by trailing whitespace before the newline does **not** continue the line — it's a classic, hard-to-spot bug."}, {"id": "1.3", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a script is made of", "chapNum": 3, "slug": "variables-naming-assigning-values", "fullTitle": "Variables: Naming and Assigning Values", "title": "Variables: Naming and Assigning Values", "md": "### Why this matters\n\nA script that can only ever do the exact same fixed thing isn't very useful. Variables are how a script remembers a value and reuses it — a filename, a count, a piece of text — instead of repeating it everywhere and having to change it in ten places later. This is the first real building block toward writing scripts that actually *do* something.\n\n### The core idea\n\nA variable in Bash is a name attached to a value. You create one just by assigning to it — there's no separate \"declare this variable\" step required (Chapter 2.5 covers an optional way to be more explicit about that). Two rules matter immediately, and both are strict, non-negotiable Bash syntax:\n\n- **No spaces around the `=` sign.** `name=\"Alex\"` works; `name = \"Alex\"` does not — Bash reads the latter as \"run a command called `name` with arguments `=` and `Alex`,\" which fails.\n- **To read a variable's value, prefix it with `$`.** `name` is the variable; `$name` is \"give me its value.\" Forgetting the `$` when reading, or accidentally including one when assigning, are both instant sources of confusion for beginners.\n\nVariable names can contain letters, digits, and underscores, and cannot start with a digit. By convention, this book (and most Bash code) uses `lowercase_with_underscores` for ordinary variables, reserving `ALL_CAPS` for environment variables and a handful of special built-in ones you'll meet later.\n\n### Examples\n\n**1. Assign and read a variable.**\n```bash\nname=\"Alex\"\necho \"Hello, $name!\"\n```\nOutput:\n```\nHello, Alex!\n```\n\n**2. The `${name}` form — same thing, with explicit braces.**\n```bash\necho \"Hello, ${name}!\"\n```\nOutput:\n```\nHello, Alex!\n```\nThe braces don't change the meaning here, but they matter the moment a variable name is immediately followed by more letters or digits that could otherwise get folded into the name by mistake — you'll see exactly that in the Common Mistakes section below, and use `${}` constantly once Chapter 2.2 introduces parameter expansion.\n\n**3. Reassigning, and building a new variable from an existing one.**\n```bash\nname=\"Jordan\"\necho \"Now: $name\"\n\ngreeting=\"Hi there, $name\"\necho \"$greeting\"\n```\nOutput:\n```\nNow: Jordan\nHi there, Jordan\n```\nA variable holds whatever it was most recently assigned — there's no special \"constant\" by default (Chapter 2.5's `readonly` covers making one genuinely unchangeable).\n\n**4. Reading a variable that was never set.**\n```bash\necho \"unset value: [$totally_undefined_var]\"\n```\nOutput:\n```\nunset value: []\n```\nAn unset variable simply expands to nothing — an empty string — not an error. This is convenient, but it's also a real source of bugs: a typo in a variable name doesn't fail loudly, it just silently produces an empty value. Chapter 5.6 introduces `set -u`, a setting that turns this into a loud error instead, which most real-world scripts turn on for exactly this reason.\n\n**5. Variable names are case-sensitive.**\n```bash\nname=\"Jordan\"\nName=\"Capitalized\"\necho \"name=$name Name=$Name\"\n```\nOutput:\n```\nname=Jordan Name=Capitalized\n```\n`name` and `Name` are two completely unrelated variables.\n\n### ⚠️ Common Mistakes\n\n- **Spaces around `=`.** `name = \"Alex\"` doesn't assign anything — Bash tries to *run a command* named `name`, fails with `command not found`, and your variable was never set. This is the single most common first-week Bash mistake for people coming from almost any other language, nearly all of which *require* spaces around `=`. Bash requires the opposite: none.\n- **A variable name starting with a digit.** `1name=\"oops\"` fails the same way, with `command not found` — Bash doesn't even try to interpret it as an assignment, because `1name` isn't a legal variable name.\n- **Forgetting the `$` when reading a value.** `echo name` prints the literal text `name`, not the variable's value — an easy slip when you're moving fast.\n- **Gluing text directly onto a variable name without braces.** Suppose you have `file=\"report\"` and want `\"${file}_final.txt\"`. Writing `\"$file_final.txt\"` instead doesn't do what it looks like — Bash reads `$file_final` as one variable name (which doesn't exist, so it expands to nothing), not \"the value of `$file`, followed by the text `_final`.\" The `${file}_final.txt` form is what you actually want, and it's why the brace form from Example 2 exists — reach for it any time a variable reference is directly followed by more letters, digits, or an underscore that should *not* be part of the name.\n- **Expecting a typo'd variable name to raise an error.** As shown in Example 4, it silently becomes an empty string instead. Keep this in mind while debugging a script that \"does nothing\" for a value you're sure you set — double-check the exact spelling.\n\n### How this connects\n\nVariables are the foundation for essentially everything from here forward — strings and numbers (Part II) are just values stored in variables, loops (Part III) commonly count using a variable, and functions (Part IV) are built entirely around passing values in and out. The very next chapter, on quoting, matters *because* of variables — how a variable's value gets treated once it's inside (or outside) quotes changes real behavior, and it's one of the most important things to get right early.\n\n### Quick recap\n\n- Assign with `name=value` — **no spaces** around the `=`.\n- Read a value with `$name` or `${name}` — the braces matter once more characters immediately follow the name.\n- Variable names: letters, digits, underscores; can't start with a digit; case-sensitive.\n- An unset (or misspelled) variable expands to an empty string, silently — no error by default.\n- No separate \"declare\" step is required to create a variable; assignment alone does it."}, {"id": "1.4", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a script is made of", "chapNum": 4, "slug": "quoting-single-double-none", "fullTitle": "Quoting: Single, Double, and None", "title": "Quoting: Single, Double, and None", "md": "### Why this matters\n\nIf there's one topic that separates \"someone who's copied a few Bash commands\" from \"someone who actually understands Bash,\" it's this one. Quoting isn't decoration — it's a real, functional decision that changes what your script does, and getting it wrong is the single most common source of Bash scripts that work fine in testing and then mysteriously break on a filename with a space in it. Get comfortable with this now, early, before habits form the wrong way.\n\n### The core idea\n\nBash has three ways to write a piece of text, and they behave differently the moment a variable or a space is involved:\n\n- **No quotes** — Bash expands variables *and* then splits the result into separate words on whitespace, and also expands certain special characters like `*`. This is almost never what you want for a variable holding text you care about, and it's the source of the most common quoting bug in this entire book.\n- **Double quotes (`\"...\"`)** — variables and command substitutions still expand normally, but the whole result is kept together as **one single word**, whitespace and all. This is the right default for the overwhelming majority of situations.\n- **Single quotes (`'...'`)** — everything inside is treated completely literally. No variable expansion, no command substitution, nothing. Use this specifically when you want Bash to leave the text exactly alone.\n\n**The practical rule this chapter wants you to walk away with: quote your variables with double quotes by default, essentially always, unless you have a specific reason not to.** `\"$name\"`, not `$name`. This one habit prevents an enormous number of real bugs.\n\n### Examples\n\n**1. Unquoted vs. double-quoted — the core difference.**\n```bash\nname=\"Alex Jordan\"\necho $name\necho \"$name\"\n```\nOutput:\n```\nAlex Jordan\nAlex Jordan\n```\nThese look identical here, which is exactly what makes the bug sneaky — the difference only shows up once the value is *used* somewhere that cares about word boundaries, like the next example.\n\n**2. Where unquoted actually breaks: word splitting.**\n```bash\nfiles=\"file one.txt\"\nfor f in $files; do echo \"word: [$f]\"; done\n```\nOutput:\n```\nword: [file]\nword: [one.txt]\n```\nBash split the unquoted variable on the space inside it, treating \"file one.txt\" as *two* separate words — almost certainly not what was intended if `files` was meant to be a single filename. Now with quotes:\n```bash\nfor f in \"$files\"; do echo \"word: [$f]\"; done\n```\nOutput:\n```\nword: [file one.txt]\n```\nOne word, exactly as stored. This is precisely the bug that breaks scripts the moment they encounter a filename with a space in it — everything appears to work throughout development (on filenames without spaces) and then fails on real-world input.\n\n**3. Single quotes suppress everything, including variables.**\n```bash\necho '$name'\n```\nOutput:\n```\n$name\n```\nCompare to `echo \"$name\"`, which prints the *value*. Single quotes are for when you genuinely want the literal characters — a regular expression pattern you're about to hand to `grep` (Chapter 7.1) is a very common real case.\n\n**4. Double quotes still expand variables and command substitution.**\n```bash\necho \"Today is $(date +%A) and home is $HOME\"\n```\nOutput:\n```\nToday is Sunday and home is /home/shad\n```\nCompare to the single-quoted version:\n```bash\necho 'Today is $(date +%A) and home is $HOME'\n```\nOutput:\n```\nToday is $(date +%A) and home is $HOME\n```\nNothing expands at all — you get back exactly the characters you typed. This is the clearest possible demonstration of what single quotes actually do.\n\n**5. Escaping characters inside double quotes.**\n```bash\necho \"She said \\\"hi\\\" and cost is \\$5\"\n```\nOutput:\n```\nShe said \"hi\" and cost is $5\n```\nA backslash before a character that would otherwise be special (here, `\"` and `$`) tells Bash \"treat this one character literally.\" This works inside double quotes; a backslash inside single quotes, by contrast, has no special meaning at all — it's just a literal backslash character.\n\n**6. Getting a literal single quote into a single-quoted string.**\nThis one trips everyone up at least once, because single quotes can't contain an escaped single quote the way double quotes can contain an escaped double quote — there's no backslash-escaping inside single quotes at all. The trick is to end the single-quoted string, insert an actual single quote (itself escaped or double-quoted), then resume:\n```bash\necho 'It'\\''s working'\n```\nOutput:\n```\nIt's working\n```\nReading it piece by piece: `'It'` (literal `It`) + `\\'` (an escaped literal single quote, outside any quoting) + `'s working'` (literal `s working`) — Bash glues adjacent quoted/unquoted pieces with no space between them into a single word. It looks strange the first time, but it's the standard idiom.\n\n**7. A fourth quoting style: ANSI-C quoting with `$'...'` — for real escape sequences like tabs and newlines.**\n```bash\necho $'Line1\\tTabbed'\n```\nOutput:\n```\nLine1\tTabbed\n```\nEverything so far has covered three ways to write text — unquoted, double-quoted, single-quoted — but none of them turn `\\t` into an actual tab character or `\\n` into an actual newline; inside ordinary double or single quotes, `\\t` is just the two characters `\\` and `t`. `$'...'` is a fourth form, specifically for this: Bash interprets backslash escape sequences (`\\t`, `\\n`, `\\\\`, and others) inside it and produces the real character, exactly like a string literal in most other programming languages.\n\nThis is precisely the syntax behind the `IFS=$'\\t'` you'll see used to split on a real tab character:\n```bash\nIFS=$'\\t' read -ra parts <<< $'x\\ty\\tz'\necho \"${parts[@]}\"\n```\nOutput:\n```\nx y z\n```\nWithout `$'...'`, there'd be no way to put an actual tab character into `IFS` or into test data typed directly in a script — you'd need to either paste a literal tab (fragile, invisible in the source) or reach for a separate command like `printf` just to produce one.\n\nIt also works for building a variable containing a real newline:\n```bash\nsep=$'\\n'\necho \"a${sep}b\"\n```\nOutput:\n```\na\nb\n```\nCompare directly to plain single quotes, which never interpret escapes at all:\n```bash\necho 'Line1\\tNotTabbed'\n```\nOutput:\n```\nLine1\\tNotTabbed\n```\nThe backslash-`t` stays as two literal characters — proof that `$'...'` and `'...'` are genuinely different quoting mechanisms, not just a stylistic variant of each other.\n\n### ⚠️ Common Mistakes\n\n- **Not quoting a variable that might contain spaces (or be empty).** This is, without close competition, the most common Bash mistake at every skill level, including experienced developers writing scripts under time pressure. `\"$var\"` should be closer to a reflex than a decision.\n- **Assuming single and double quotes are interchangeable style choices.** They're not — they have genuinely different behavior. Double quotes still let variables through; single quotes block everything.\n- **Trying to escape a single quote with a backslash *inside* a single-quoted string** (`'it\\'s'`) — this doesn't work the way it looks like it should; Bash still ends the string at that `'`, leaving a stray `s'` outside any quoting, which usually produces a confusing error or an unexpected result. Use the close-escape-reopen pattern from Example 6 instead.\n- **Quoting a variable that's *supposed* to expand into multiple words**, like a list of command-line flags built up in a variable. Occasionally leaving something unquoted is genuinely correct — but that should be a deliberate, understood choice, not the accidental default from forgetting the quotes.\n- **Forgetting that unquoted variables also trigger glob expansion**, not just word splitting — an unquoted `$var` containing something like `*.txt` as literal text can get expanded against actual filenames in the current folder, which is covered properly once Chapter 2.11 introduces globbing, but is worth knowing exists now.\n\n### How this connects\n\nEvery chapter from here forward assumes this habit is already in place — you'll see `\"$var\"` used by default throughout this entire book, and it won't be called out again every single time. This is also why quoting earned a spot this early in the Alphabet, ahead of even control flow: it's foundational to every other topic that touches variables, which is essentially all of them.\n\n### Quick recap\n\n- **Unquoted** `$var` → variable expands, then gets word-split and glob-expanded. Rarely what you want.\n- **Double-quoted** `\"$var\"` → variable expands, stays together as one word. The right default.\n- **Single-quoted** `'$var'` → nothing expands; completely literal.\n- Command substitution (`$(...)`) and variables both still work inside double quotes, but not inside single quotes.\n- A literal single quote inside a single-quoted string needs the close-escape-reopen trick: `'it'\\''s'`.\n- **ANSI-C quoting** `$'...'` is a fourth form that interprets backslash escapes (`\\t`, `\\n`, etc.) into real characters — the tool behind things like `IFS=$'\\t'`.\n- **Default habit: quote your variables.** `\"$name\"`, not `$name`."}, {"id": "1.5", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a script is made of", "chapNum": 5, "slug": "exit-status-command-chaining", "fullTitle": "Exit Status & Command Chaining", "title": "Exit Status & Command Chaining", "md": "### Why this matters\n\nEvery single command you run — not just scripts, *every* command — reports back whether it succeeded or failed. Almost nothing in Bash checks this for you automatically; it's on you to look at it, and a huge amount of real-world scripting is built entirely on chaining commands together based on whether the previous one worked. This chapter closes out Part I by giving you that tool.\n\n### The core idea\n\nWhen any command finishes, it sets an **exit status**: a number from 0 to 255, stored so Bash can check it. By universal convention:\n\n- **`0` means success.**\n- **Anything other than `0` means some kind of failure** — different nonzero numbers can mean different specific things depending on the command, but \"not zero\" is the only part you usually need to check.\n\nThe most recent exit status is always available in the special variable `$?`.\n\nBash gives you two operators that read this status to decide what to run next:\n\n- **`&&`** — \"run the next command **only if** the previous one succeeded (exit status 0).\"\n- **`||`** — \"run the next command **only if** the previous one failed (exit status nonzero).\"\n\nCompare this to the plain `;` from Chapter 1.2, which runs the next command *unconditionally*, regardless of what happened before it. `;`, `&&`, and `||` all separate commands — the difference is entirely about whether that separation carries a condition.\n\n### Examples\n\n**1. Checking `$?` directly.**\n```bash\ntrue\necho \"true: $?\"\n\nfalse\necho \"false: $?\"\n```\nOutput:\n```\ntrue: 0\nfalse: 1\n```\n`true` and `false` are real commands whose entire job is to do nothing except succeed or fail — genuinely useful for testing and, as you'll see in later chapters, for placeholder logic while a script is still being built.\n\n**2. A real command's exit status.**\n```bash\nls /nonexistent-xyz 2>/dev/null\necho \"ls missing: $?\"\n```\nOutput:\n```\nls missing: 2\n```\n`ls` reports `2` specifically for \"the thing I was asked to list doesn't exist\" — proof that nonzero codes can carry more specific meaning than just \"something went wrong,\" even though \"nonzero = failure\" is the only part you need to remember by default.\n\n**3. `&&` — run only on success.**\n```bash\ntrue && echo \"ran because true succeeded\"\nfalse && echo \"should NOT print\"\n```\nOutput:\n```\nran because true succeeded\n```\nNotice the second line printed nothing — `false` failed, so the `&&` blocked the `echo` from ever running.\n\n**4. `||` — run only on failure.**\n```bash\nfalse || echo \"ran because false failed\"\ntrue || echo \"should NOT print\"\n```\nOutput:\n```\nran because false failed\n```\nThe mirror image: `||`'s right side only runs when the left side failed.\n\n**5. A realistic chain: make a folder, then move into it, or bail.**\n```bash\nmkdir mydir && cd mydir && echo \"made and entered\"\n```\nOutput:\n```\nmade and entered\n```\nEach step only proceeds if the one before it succeeded — if `mkdir` failed (say, the folder already existed and permissions were wrong), the `cd` and the final `echo` would never run at all. This \"do A, and only if that worked do B, and only if that worked do C\" pattern is extremely common in real scripts.\n\n**6. `exit` inside a script sets *the whole script's* exit status.**\n```bash\n#!/usr/bin/env bash\necho \"before\"\nexit 3\necho \"after (never runs)\"\n```\nRunning it:\n```\nbefore\n```\nand then checking `$?` from the outside:\n```\nscript exit: 3\n```\n`exit` immediately stops the script and sets its exit status to whatever number you give it — the line after `exit 3` never runs at all. A script with no explicit `exit` reports the exit status of whatever its last command happened to be.\n\n**7. `;` doesn't care what happened before it.**\n```bash\nfalse && echo \"a\" ; echo \"b runs regardless\"\n```\nOutput:\n```\nb runs regardless\n```\nThe `&&` blocked `\"a\"` from printing, exactly like Example 3 — but the `;` after it doesn't check anything, so `\"b runs regardless\"` runs no matter what happened on the left side of the `;`.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a script \"worked\" just because it produced output, without checking `$?`.** A command can print something *and* still fail — `grep` famously exits nonzero when it simply finds no matches, which is often not an \"error\" at all, just a fact worth checking deliberately (Chapter 7.1 covers this specifically).\n- **Checking `$?` too late.** `$?` always reflects the *most recently run* command — if you run even one more command (including, sneakily, `echo` itself) before checking it, you've lost the value you wanted. Check it immediately.\n- **Chaining a long `&&` sequence and losing track of which step failed.** `step1 && step2 && step3 && step4` tells you *that* something failed if the whole line doesn't complete, but not *which* step, unless each step also prints something on its way. For anything beyond two or three steps, an `if` statement (Chapter 3.1) or explicit error handling (Chapter 5.6) reads far more clearly.\n- **Confusing exit status with a function's or command's *printed output*.** They're two completely separate things — `$?` is a number about success/failure, never the text a command produced. Capturing actual output is a different tool (command substitution, Chapter 2.8).\n- **Forgetting that `0` is success, which is the opposite of how \"truthy\" numbers work in many other languages.** In Python or JavaScript, `0` is often treated as false-ish; in Bash exit statuses, `0` specifically means \"yes, it worked.\" This flips people's intuition constantly when they're new to Bash.\n\n### How this connects\n\nExit statuses are the backbone of `if` statements and test constructs in Part III — an `if` in Bash is, under the hood, just checking a command's exit status, which is exactly the mechanism you just learned here. `&&` and `||` themselves will keep showing up throughout the book as a lightweight alternative to a full `if` block when the logic is simple enough to fit on one line.\n\n### Quick recap\n\n- Every command reports an **exit status**: `0` = success, nonzero = some kind of failure.\n- `$?` holds the most recently run command's exit status — check it immediately, before running anything else.\n- `&&` runs the next command only if the previous one **succeeded**.\n- `||` runs the next command only if the previous one **failed**.\n- `;` runs the next command **unconditionally**, regardless of what happened before it.\n- `exit N` inside a script stops it immediately and sets its overall exit status to `N`."}, {"id": "2.1", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Bash's data", "chapNum": 1, "slug": "strings-working-with-text", "fullTitle": "Strings: Working with Text", "title": "Strings: Working with Text", "md": "### Why this matters\n\nBash, at its heart, is a text-processing language — nearly everything it touches (filenames, command output, configuration, user input) arrives as text. Unlike many languages, Bash doesn't really have a separate \"string type\" the way Python or JavaScript does — every variable is fundamentally text unless you explicitly ask Bash to treat it as a number (Chapter 2.4). Getting comfortable with strings here means you're getting comfortable with how Bash thinks, period.\n\n### The core idea\n\nA string in Bash is just a sequence of characters stored in a variable — you already met the basics in Chapter 1.3. This chapter builds on that: measuring a string's length, joining strings together, comparing them, and checking whether one is empty. All of these lean directly on the quoting habits from Chapter 1.4 — get in the habit of quoting strings now, and everything here behaves predictably.\n\n### Examples\n\n**1. String length: `${#variable}`.**\n```bash\ns=\"Hello, Bash!\"\necho \"${#s}\"\n```\nOutput:\n```\n12\n```\nThe `#` inside the braces means \"length of,\" not the comment marker from Chapter 1.2 — context (being right after a variable name inside `${}`) tells Bash which meaning applies.\n\n**2. Concatenation — just put values next to each other.**\n```bash\na=\"Hello\"\nb=\"World\"\nc=\"$a, $b!\"\necho \"$c\"\n```\nOutput:\n```\nHello, World!\n```\nThere's no special concatenation operator in Bash — placing two expansions (or literal text) next to each other with nothing in between joins them. This also works without wrapping the whole thing in one pair of quotes, as long as each individual piece is properly quoted or otherwise safe:\n```bash\nc2=$a\", \"$b\"!\"\necho \"$c2\"\n```\nOutput:\n```\nHello, World!\n```\nBoth produce identical results; the first form (one clean double-quoted string) is generally easier to read and is what this book will use going forward.\n\n**3. Multi-line strings.**\n```bash\nmulti=\"Line one\nLine two\"\necho \"$multi\"\n```\nOutput:\n```\nLine one\nLine two\n```\nA literal newline typed inside a quoted string is stored as part of the value, exactly like any other character. Chapter 5.4 introduces here-documents, a cleaner tool for writing longer multi-line text.\n\n**4. Comparing strings.**\n```bash\nx=\"apple\"\ny=\"banana\"\n[ \"$x\" = \"$y\" ] && echo \"equal\" || echo \"not equal\"\n[ \"$x\" != \"$y\" ] && echo \"different\" || echo \"same\"\n```\nOutput:\n```\nnot equal\ndifferent\n```\n`[ ... ]` is Bash's classic test command — `=` checks string equality, `!=` checks inequality. This chapter only needs you to recognize this pattern; Chapter 3.2 covers `[ ]`, its cousin `[[ ]]`, and every comparison operator in full.\n\n**5. Checking whether a string is empty.**\n```bash\nempty=\"\"\n[ -z \"$empty\" ] && echo \"is empty\"\n[ -n \"$x\" ] && echo \"x is not empty\"\n```\nOutput:\n```\nis empty\nx is not empty\n```\n`-z` means \"zero length\" (empty); `-n` means \"non-zero length\" (not empty). These two show up constantly for validating that a variable actually has something useful in it before proceeding — a very common real pattern, for instance, at the top of a script that expects an argument.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to quote a variable inside `[ ]`.** `[ -z $empty ]` looks reasonable but breaks the moment `$empty` genuinely expands to nothing — Bash then sees `[ -z ]`, missing an argument, which can error out or silently misbehave depending on context. `[ -z \"$empty\" ]`, quoted, always works correctly because the quotes guarantee something (even an empty string) is there to compare. This is the quoting habit from Chapter 1.4 showing up concretely for the first time.\n- **Trying to use `+` to concatenate strings**, the way you might in Python or JavaScript (`c = a + b`). Bash has no such operator for strings — `a + b` inside Bash means something else entirely (arithmetic, covered in Chapter 2.4) or simply doesn't do what you expect. Just place the values next to each other instead.\n- **Confusing `=` (string equality, inside `[ ]`) with `-eq` (numeric equality).** `[ \"5\" = \"05\" ]` is false — as strings, `\"5\"` and `\"05\"` are different sequences of characters. `[ 5 -eq 05 ]`, using the numeric comparison operator, is true. Chapter 2.4 and Chapter 3.2 cover this distinction properly; for now, just know that string comparison and numeric comparison are genuinely different tools in Bash, unlike languages where `==` handles both.\n- **Assuming a string with only digits in it is automatically treated as a number.** Bash stores `n=\"5\"` exactly as text; it only gets treated as a number inside a specifically numeric context, like `(( ))` or `-eq`. Outside of one of those contexts, it's just three-and-a-bit ordinary characters like any other string.\n\n### How this connects\n\nThe `${#var}` length syntax and the string-comparison tests here are your first taste of a much bigger family — Chapter 2.2 (String Manipulation & Parameter Expansion) builds directly on this same `${...}` syntax to do far more powerful things: extracting substrings, stripping prefixes and suffixes, and search-and-replace, all without leaving Bash.\n\n### Quick recap\n\n- `${#var}` gives you a string's length.\n- Concatenation is just placing values next to each other — no `+` operator.\n- A literal newline typed inside a quoted string becomes part of its value.\n- `[ \"$a\" = \"$b\" ]` compares strings for equality; `[ \"$a\" != \"$b\" ]` for inequality — always quote the variables.\n- `[ -z \"$var\" ]` tests for empty; `[ -n \"$var\" ]` tests for non-empty.\n- String equality (`=`) and numeric equality (`-eq`) are different tools — don't mix them up."}, {"id": "2.2", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Bash's data", "chapNum": 2, "slug": "string-manipulation-parameter-expansion", "fullTitle": "String Manipulation & Parameter Expansion", "title": "String Manipulation & Parameter Expansion", "md": "### Why this matters\n\nThis is one of Bash's real superpowers, and also one of its least discoverable — the syntax looks cryptic the first time you see it, but it lets you strip file extensions, pull out substrings, and do search-and-replace **without launching a single external program** like `sed` or `awk`. That matters for speed (no extra process starting up) and for scripts that need to work even on a bare-bones system. Learn these patterns once and you'll reach for them constantly.\n\n### The core idea\n\nAll of this lives inside the `${...}` braces you first saw in Chapter 1.3, using extra symbols after the variable name to describe an operation instead of just \"give me the value.\" The two operation families this chapter focuses on:\n\n- **Trimming from the front or back** — `#`/`##` remove a matching prefix, `%`/`%%` remove a matching suffix. A useful memory trick: `#` is to the *left* on your keyboard-adjacent shift-row placement relative to `%`... more reliably, just remember \"**#** for prefix (front), **%** for suffix (end)\" and that doubling the symbol makes it *greedy* (matches as much as possible) instead of matching as little as possible.\n- **Substrings and replacement** — `${var:start:length}` extracts a piece by position; `${var/find/replace}` and `${var//find/replace}` do search-and-replace (the doubled slash replaces *every* match, not just the first).\n\nA related, extremely common pattern also lives in this same `${...}` family: providing a **default value** when a variable is unset.\n\n### Examples\n\n**1. Removing a suffix: `%` (shortest match) and `%%` (longest match).**\n```bash\npath=\"/home/user/documents/report.final.txt\"\necho \"${path%.txt}\"\necho \"${path%%.*}\"\n```\nOutput:\n```\n/home/user/documents/report.final\n/home/user/documents/report\n```\n`%.txt` removes just the literal `.txt` from the end. `%%.*` uses a glob-style pattern (`*` = \"anything\") and matches as much as possible from the end — since there are two dots in `report.final.txt`, the greedy `%%` strips everything from the *first* `.` onward, leaving just `report`.\n\n**2. Removing a prefix: `#` (shortest match) and `##` (longest match).**\n```bash\necho \"${path#*/}\"\necho \"${path##*/}\"\n```\nOutput:\n```\nhome/user/documents/report.final.txt\nreport.final.txt\n```\n`#*/` strips the shortest possible match of \"anything followed by a slash\" from the front — just the first `/`. `##*/` greedily strips *up to and including the last* `/`, leaving only the filename. This `##*/` pattern — \"give me just the filename from a full path\" — is extremely common in real scripts (though Chapter 7.7's `basename` command does the same job more readably).\n\n**3. Extracting a substring by position: `${var:start}` and `${var:start:length}`.**\n```bash\ns=\"Hello, World!\"\necho \"${s:7}\"\necho \"${s:7:5}\"\necho \"${s: -6}\"\n```\nOutput:\n```\nWorld!\nWorld\nWorld!\n```\nPositions are zero-indexed, so `:7` starts at the 8th character. `:7:5` takes 5 characters starting there. `: -6` (note the required space before the `-`, without which Bash would misparse it as a different expansion entirely) counts from the end — the last 6 characters.\n\n**4. Search and replace: `${var/find/replace}` (first match) and `${var//find/replace}` (all matches).**\n```bash\nsentence=\"the cat sat on the mat\"\necho \"${sentence/cat/dog}\"\necho \"${sentence//the/a}\"\n```\nOutput:\n```\nthe dog sat on the mat\na cat sat on a mat\n```\nSingle slash replaces only the first match; double slash replaces every match in the string.\n\n**5. Providing a default value for an unset (or empty) variable: `${var:-default}`.**\n```bash\nunset myvar\necho \"${myvar:-default}\"\necho \"myvar after: [${myvar}]\"\n```\nOutput:\n```\ndefault\nmyvar after: []\n```\n`${myvar:-default}` doesn't change `myvar` at all — it just *substitutes* `default` in this one expansion, for display or use elsewhere, while leaving the variable itself untouched. There's a related form that *does* assign it:\n```bash\necho \"${myvar:=assigned}\"\necho \"myvar after assign: [${myvar}]\"\n```\nOutput:\n```\nassigned\nmyvar after assign: [assigned]\n```\n`:=` both substitutes the default **and** stores it back into the variable — useful for \"set this up once with a sensible fallback if nobody configured it.\"\n\nThere are two more members of this same family, completing the set:\n\n**5b. `${var:+alt}` — the mirror image of `:-`: substitute a value only if the variable *is* set.**\n```bash\nset1=\"hello\"\necho \"${set1:+is set}\"\nunset1=\"\"\necho \"[${unset1:+is set}]\"\n```\nOutput:\n```\nis set\n[]\n```\nWhere `:-` says \"use this fallback if the variable is empty/unset,\" `:+` says \"use this *replacement* only if the variable already has something in it, otherwise produce nothing.\" Genuinely handy for conditionally including a flag or a piece of text — e.g. `\"${verbose:+--verbose}\"` expands to `--verbose` if `verbose` is set to anything at all, or to nothing if it isn't.\n\n**5c. `${var:?message}` — require a variable to be set, or exit with an error.**\n```bash\necho \"${set1:?should not error}\"\n```\nOutput:\n```\nhello\n```\nNothing unusual here, since `set1` is set — `:?` just passes its value through. But on an unset variable:\n```bash\nunset u2\necho \"${u2:?custom error message}\"\n```\nOutput:\n```\nbash: u2: custom error message\n```\nand the script **exits immediately** with a nonzero status — `:?` is a compact, one-line way to say \"this variable is required; if it's missing, stop right here with a clear message,\" instead of a separate `if [ -z \"$var\" ]; then echo \"...\"; exit 1; fi` block. Genuinely useful at the top of a script for validating that an expected environment variable or argument was actually provided.\n\n**6. Case conversion.**\n```bash\nname=\"Alex\"\necho \"${name^^}\"\necho \"${name,,}\"\n```\nOutput:\n```\nALEX\nalex\n```\n`^^` uppercases the whole string; `,,` lowercases it. (Single `^` or `,` converts only the first character — handy for capitalizing a word.)\n\n### ⚠️ Common Mistakes\n\n- **Mixing up `#`/`##` with `%`/`%%`.** They trim from opposite ends — `#` family from the front, `%` family from the back. If a \"strip the extension\" or \"strip the path\" expansion produces the wrong half of the string, this is the first thing to double check.\n- **Forgetting that doubling the symbol changes greediness, not direction.** `%.*` and `%%.*` both strip from the end; they differ only in *how much* gets stripped when there's more than one possible match, as shown vividly in Example 1.\n- **Writing `${var: -6}` without the space** as `${var:-6}` — these mean completely different things. `${var: -6}` (with the space) extracts the last 6 characters; `${var:-6}` (no space) is the \"default value\" syntax from Example 5, providing the literal string `6` if `var` is unset. This is a genuinely easy typo to make and a genuinely confusing bug to track down, because both are valid syntax that just do different things.\n- **Confusing `${var:-default}` (substitute only) with `${var:=default}` (substitute *and assign*).** Reach for `:-` when you just want a fallback value for one use; reach for `:=` when you want the variable itself to end up holding that fallback from now on.\n- **Treating these as regular expressions.** The patterns used in `#`, `##`, `%`, `%%`, and the find part of `/`/`//` are **glob-style patterns** (`*`, `?`, `[...]` — covered fully in Chapter 2.11), not full regular expressions. If you need real regex power, that's `grep -E`, `sed`, or Bash's own `[[ =~ ]]` operator (Chapter 7.5).\n- **Confusing `:-` (default value) with `:+` (only-if-set replacement).** They're near-opposites — `:-` fills in a value when the variable is *missing*; `:+` fills in a value only when the variable *isn't* missing. Reaching for the wrong one silently produces the opposite condition from what was intended.\n\n### How this connects\n\nThis chapter is a direct extension of the `${var}` syntax from Chapter 1.3 and the `${#var}` length syntax from Chapter 2.1 — same braces, more symbols, more power. You'll use `##*/` and `%.*`-style patterns constantly once real scripts start working with file paths (Part V), and the `${var:-default}` pattern becomes especially important once Chapter 5.7 covers reading command-line arguments, where \"use this default if nothing was provided\" is an everyday need.\n\n### Quick recap\n\n- `${var#pattern}` / `${var##pattern}` — remove matching prefix (shortest / greediest).\n- `${var%pattern}` / `${var%%pattern}` — remove matching suffix (shortest / greediest).\n- `${var:start:length}` — substring by position (zero-indexed); `${var: -N}` (note the space) for \"last N characters.\"\n- `${var/find/replace}` — replace first match; `${var//find/replace}` — replace all matches.\n- `${var:-default}` — use a fallback value without changing `var`; `${var:=default}` — use it **and** store it.\n- `${var:+alt}` — use `alt` only if `var` *is* set (the mirror image of `:-`); `${var:?message}` — exit immediately with `message` if `var` is unset, a compact required-variable check.\n- `${var^^}` / `${var,,}` — uppercase / lowercase the whole string.\n- These patterns are glob-style, not full regular expressions."}, {"id": "2.3", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Bash's data", "chapNum": 3, "slug": "printf-formatted-output", "fullTitle": "`printf`: Formatted Output", "title": "`printf`: Formatted Output", "md": "### Why this matters\n\n`echo` is fine for a quick message, but the moment you need output lined up in neat columns, numbers padded with zeros, or decimals rounded to a specific precision, `echo` runs out of road fast. `printf` is the tool for exactly that — precise, predictable, formatted output — and it behaves consistently across systems in a way `echo` sometimes doesn't (different shells' `echo` handle things like backslash escapes slightly differently; `printf`'s behavior is far more standardized).\n\n### The core idea\n\n`printf` takes a **format string** — plain text with placeholders in it — followed by the values to plug into those placeholders, in order:\n```bash\nprintf \"format string with %s placeholders\\n\" value1 value2\n```\nUnlike `echo`, `printf` **never adds a trailing newline automatically** — if you want one, you write `\\n` yourself. This trips people up on their very first try, and it's worth internalizing right now rather than being surprised by it later.\n\nThe placeholders you'll use constantly:\n- `%s` — a string\n- `%d` — an integer\n- `%f` — a floating-point number (you can control decimal places, e.g. `%.2f`)\n- `%x` / `%o` — hexadecimal / octal\n- `%%` — a literal percent sign (since a bare `%` starts a placeholder)\n\n### Examples\n\n**1. The basics — `%s` and `%d`.**\n```bash\nprintf \"Hello, %s!\\n\" \"World\"\nprintf \"%s is %d years old\\n\" \"Alex\" 30\n```\nOutput:\n```\nHello, World!\nAlex is 30 years old\n```\n\n**2. Column alignment with width.**\n```bash\nprintf \"%-10s|%10s|\\n\" \"left\" \"right\"\n```\nOutput:\n```\nleft      |     right|\n```\nA number before the `s` sets a minimum field width; a `-` before it left-aligns (padding on the right) instead of the default right-align (padding on the left). This is exactly how you'd build a lined-up table of output in a report-generating script.\n\n**3. Zero-padding and decimal precision.**\n```bash\nprintf \"%05d\\n\" 42\nprintf \"%.2f\\n\" 3.14159\n```\nOutput:\n```\n00042\n3.14\n```\n`%05d` means \"integer, minimum width 5, pad with leading zeros.\" `%.2f` rounds to exactly 2 decimal places.\n\n**4. Hex and octal.**\n```bash\nprintf \"%x %o\\n\" 255 8\n```\nOutput:\n```\nff 10\n```\n255 in hexadecimal is `ff`; 8 in octal is `10`. You'll see this occasionally when working with file permissions or low-level values.\n\n**5. Extra arguments make the format string repeat.**\n```bash\nprintf \"%s-%s\\n\" a b c d\n```\nOutput:\n```\na-b\nc-d\n```\nIf you give `printf` more values than the format string has placeholders for, it doesn't error — it just reuses the format string again for the leftover values, as many times as needed. This is genuinely useful for printing a list of items two (or three, or however many) at a time.\n\n**6. No automatic newline — a real difference from `echo`.**\n```bash\nprintf \"no newline here\"\necho \"<- see, no newline\"\n```\nOutput:\n```\nno newline here<- see, no newline\n```\nBoth lines' output ran together, because `printf` didn't add one and neither command was told to.\n\n**7. A literal `%` needs `%%`.**\n```bash\nprintf \"100%%\\n\"\n```\nOutput:\n```\n100%\n```\nA single `%` in the format string always starts a placeholder — to print an actual percent sign, escape it as `%%`.\n\n**8. Storing formatted output in a variable with `-v`.**\n```bash\nprintf -v result \"%s=%d\" \"count\" 5\necho \"$result\"\n```\nOutput:\n```\ncount=5\n```\n`printf -v varname` sends the formatted result straight into a variable instead of printing it — no need for command substitution (`$(...)`, Chapter 2.8) just to capture formatted text.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the `\\n`.** Unlike `echo`, which adds a newline by default, `printf` output runs straight into whatever comes next unless you explicitly write `\\n` at the end of your format string.\n- **Using a bare `%` where you meant a literal percent sign.** `printf \"Complete: 50%\\n\"` breaks (or behaves unexpectedly) because `%\\` isn't a placeholder `printf` recognizes — you need `50%%`.\n- **Passing a value with a `%` inside it as the format string itself**, e.g. `printf \"$user_input\"` where `user_input` might contain a stray `%`. If `user_input` isn't meant to be a format string, always write `printf \"%s\\n\" \"$user_input\"` instead — putting the variable as an *argument* rather than the format string itself avoids it being misinterpreted.\n- **Expecting `%d` to accept a non-integer.** `printf \"%d\\n\" \"3.5\"` or `printf \"%d\\n\" \"abc\"` produces an error (`invalid number`) — `%d` genuinely wants a whole number; use `%s` for arbitrary text or `%f` for decimals.\n- **Mismatched argument count assumed to be an error.** As shown in Example 5, extra arguments cause the format string to *repeat*, which is intentional — not a bug, but easy to be surprised by the first time you see it happen unintentionally.\n\n### How this connects\n\n`printf` will show up constantly from here on, anywhere output needs to look clean rather than just functional — building readable tables, reports, and log lines. Its `%s`/`%d` placeholder mindset also foreshadows the pattern-based thinking you'll use with `grep`, `sed`, and `awk` in Part VII, all of which share this same idea of \"template plus values.\"\n\n### Quick recap\n\n- `printf \"format\\n\" values...` — placeholders in the format string are filled from the arguments, in order.\n- `%s` (string), `%d` (integer), `%f` (float, use `%.Nf` for N decimal places), `%x`/`%o` (hex/octal).\n- Width and alignment: a number sets minimum width, a leading `-` left-aligns, a leading `0` zero-pads.\n- `printf` never adds a trailing newline automatically — write `\\n` yourself.\n- Extra arguments make the format string repeat rather than erroring.\n- `%%` prints a literal percent sign.\n- `printf -v varname \"...\"` stores the formatted result in a variable instead of printing it."}, {"id": "2.4", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Bash's data", "chapNum": 4, "slug": "arithmetic-doing-math-in-bash", "fullTitle": "Arithmetic: Doing Math in Bash", "title": "Arithmetic: Doing Math in Bash", "md": "### Why this matters\n\nSooner or later a script needs to count something, check a threshold, or compute an offset — and Bash's approach to math has its own dedicated syntax, separate from ordinary string handling. Miss this distinction and you'll write `x = 1 + 1` expecting `2` and get a confusing error instead, because outside the right context, `+` is just a character to Bash, not an operator.\n\n### The core idea\n\nBash variables are text by default (Chapter 2.1) — arithmetic only happens inside a specific **arithmetic context**, and there are two main ways to open one:\n\n- **`(( ... ))`** — an arithmetic *command*. Used on its own line to perform a calculation (often an assignment) or as a true/false condition.\n- **`$(( ... ))`** — an arithmetic *expansion*. Used inside a string or `echo` to substitute the computed *result*, the same way `$var` substitutes a variable's value.\n\nInside either form, you don't need `$` in front of variable names — `((sum = a + b))` works directly, without `$a` or `$b`, because everything inside `(( ))` is already understood as arithmetic. The familiar operators all work as expected: `+ - * / %` (`%` is remainder, not string-related here), and `**` for exponentiation.\n\n**Important limitation to know from the start: `(( ))` and `$(( ))` only handle integers.** Bash has no native support for decimals in arithmetic — `7 / 2` gives `3`, not `3.5`, and trying to use an actual decimal number causes a syntax error. For real decimal math, you reach for an external tool like `bc` (shown below) or, in a language better suited to it, Python.\n\n### Examples\n\n**1. `(( ))` as a command — assignment.**\n```bash\na=5\nb=3\n((sum = a + b))\necho \"$sum\"\n```\nOutput:\n```\n8\n```\nNote `sum` is used with `$` when *reading* it afterward with `echo` (ordinary variable expansion) but not inside the `(( ))` itself.\n\n**2. `$(( ))` as an expansion — for direct use in output.**\n```bash\necho \"$((a + b))\"\necho \"$((a * b))\"\necho \"$((a - b))\"\necho \"$((a / b))\"\necho \"$((a % b))\"\necho \"$((a ** b))\"\n```\nOutput:\n```\n8\n15\n2\n1\n2\n125\n```\n`5 % 3` is `2` (the remainder after dividing 5 by 3); `5 ** 3` is `5` cubed, `125`.\n\n**3. Integer division truncates, it doesn't round.**\n```bash\necho \"$((7 / 2))\"\n```\nOutput:\n```\n3\n```\nNot `3.5`, and not rounded to `4` — the fractional part is simply discarded.\n\n**4. `let` — an older, less common alternative to `(( ))`.**\n```bash\nlet \"c = a + b\"\necho \"$c\"\n```\nOutput:\n```\n8\n```\n`let` does the same job as `(( ))` for assignments. You'll encounter it in older scripts; `(( ))` is the more modern, more readable choice for new code, and this book uses `(( ))`/`$(( ))` throughout.\n\n**5. `expr` — an even older external command, mentioned so you recognize it.**\n```bash\nexpr $a + $b\n```\nOutput:\n```\n8\n```\n`expr` is a genuinely separate program (not a Bash builtin), predates `(( ))`, and is fussier — it requires spaces around every operator and around the whole expression, and multiplying with `*` needs escaping (`\\*`) because Bash would otherwise treat it as a glob. You'll still see it in legacy scripts; there's no reason to reach for it in new code when `(( ))` exists.\n\n**6. Increment/decrement and compound assignment.**\n```bash\ni=0\n((i++))\necho \"$i\"\n((i += 5))\necho \"$i\"\n```\nOutput:\n```\n1\n6\n```\n`i++` and `i--` work exactly like in C-family languages; `+=`, `-=`, `*=`, `/=` all work too.\n\n**7. `(( ))` as a condition — its exit status reflects true/false.**\n```bash\n((5 > 3)) && echo \"5 > 3 is true\"\n((5 < 3)) && echo \"should not print\" || echo \"5 < 3 is false\"\n```\nOutput:\n```\n5 > 3 is true\n5 < 3 is false\n```\nThis connects directly to Chapter 1.5: a true arithmetic comparison inside `(( ))` produces exit status `0` (success), and a false one produces exit status `1` (failure) — exactly the mechanism `&&`/`||` and `if` (Chapter 3.1) key off of.\n\n**8. Decimals don't work in `(( ))` — and what to use instead.**\n```bash\necho \"$((3.5 + 1))\"\n```\nOutput:\n```\nbash: 3.5 + 1: syntax error: invalid arithmetic operator (error token is \".5 + 1\")\n```\nFor real decimal arithmetic, pipe an expression into `bc`, a separate calculator program most Linux/Mac systems have available:\n```bash\necho \"3.5 + 1.2\" | bc\n```\nOutput:\n```\n4.7\n```\n\n**9. Number bases other than decimal — hex, octal, and arbitrary bases.**\n```bash\necho $((0x1F))\necho $((010))\necho $((2#101))\necho $((16#FF))\n```\nOutput:\n```\n31\n8\n5\n255\n```\nInside an arithmetic context, Bash recognizes several ways to write an integer literal: `0x` (or `0X`) prefixes hexadecimal (`0x1F` is 31 in decimal), a **leading `0`** prefixes octal (`010` is 8, not ten!), and `base#number` gives an arbitrary base from 2 to 64 (`2#101` is binary 101, which is 5; `16#FF` is hex again, spelled differently). You won't need this often, but it shows up when working with file permission modes, bit flags, or data that's naturally expressed in another base.\n\n### ⚠️ Common Mistakes\n\n- **Trying ordinary variable syntax for math**, like `sum=$a+$b`. This doesn't compute anything — it just assigns the literal text `5+3` (or whatever the values happen to be) to `sum`, because outside an arithmetic context, `+` is just a character. Use `(( ))` or `$(( ))`.\n- **Expecting `/` to give a fractional result.** `$((7/2))` is `3`, always, because both operands are integers — a very common surprise for anyone used to a language where division automatically produces a decimal.\n- **Using decimals inside `(( ))` or `$(( ))`** — produces a syntax error, as shown in Example 8. Reach for `bc`, `awk`, or an external tool the moment fractional math is genuinely needed.\n- **Forgetting quotes matter differently here.** `$((a + b))` works fine whether or not it's inside double quotes — arithmetic expansion doesn't get affected by word splitting the way plain variable expansion does, since it always produces a single number. This is one of the few places in Bash where quoting a numeric expansion is optional rather than a best practice, though quoting it anyway does no harm and keeps the habit consistent.\n- **Mixing up `-eq`/`-lt`/`-gt` (used inside `[ ]`, Chapter 3.2) with `>`/`<` (used inside `(( ))`).** `[ 5 > 3 ]` actually works, but not the way you'd expect — inside plain `[ ]`, `>` and `<` are *string* comparison operators (and additionally need escaping or redirection quirks to avoid being misread as shell redirection), not numeric ones. Inside `(( ))`, `>` and `<` are genuinely numeric. Keep the two contexts straight.\n- **Zero-padding a number and accidentally turning it into invalid octal.** A day-of-month or hour value stored as `\"08\"` or `\"09\"` looks harmless, but a **leading zero** inside `(( ))`/`$(( ))` means \"treat this as octal\" — and octal has no digits `8` or `9`. `echo $((08))` fails outright: `value too great for base`. This is a genuinely real bug in date-handling scripts; strip a leading zero (`${var#0}`, Chapter 2.2) or force base 10 explicitly (`10#$var`) before doing arithmetic on a zero-padded number.\n\n### How this connects\n\nThe exit-status behavior of `(( ))` shown in Example 7 is the same mechanism from Chapter 1.5, applied to numbers — and it's exactly what powers numeric conditions in `if` statements (Chapter 3.1) and the C-style `for` loop (Chapter 3.4). Arrays (Chapter 2.6) frequently use `((i++))`-style counters to walk through their elements, so this syntax will feel completely natural by the time you get there.\n\n### Quick recap\n\n- `(( ... ))` — an arithmetic command (assignment, or a true/false condition via its exit status).\n- `$(( ... ))` — an arithmetic expansion, substituting the computed result into a string.\n- No `$` needed on variable names *inside* either form.\n- Operators: `+ - * / % **`, plus `++`/`--` and `+=`/`-=`/`*=`/`/=`.\n- **Integer-only** — division truncates, and decimals cause a syntax error. Use `bc` for real decimal math.\n- `let` and `expr` are older alternatives you'll recognize in legacy scripts; prefer `(( ))`/`$(( ))` in new code.\n- Number bases: `0x1F` (hex), a **leading `0`** (octal — watch out for zero-padded numbers like `\"08\"`), `base#number` (arbitrary base) — force base 10 explicitly with `10#$var` when a value might be zero-padded."}, {"id": "2.5", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Bash's data", "chapNum": 5, "slug": "declare-readonly-unset", "fullTitle": "`declare`, `readonly` & `unset`: Variable Attributes and Scope Tools", "title": "`declare`, `readonly` & `unset`: Variable Attributes and Scope Tools", "md": "### Why this matters\n\nEvery variable you've made so far has been created just by assigning to it, with no fuss — and that's still how you'll create most of your variables. But sometimes you want more control: a variable that's guaranteed to always be a number, a value that can never accidentally change once set, or a way to clean up a variable you no longer need. This chapter covers the three tools for that, and — just as importantly — sets up vocabulary (`declare -a`, `declare -A`) the very next two chapters depend on.\n\n### The core idea\n\n- **`declare`** — explicitly creates a variable, optionally with an **attribute** that changes how it behaves. The two attributes you'll use constantly going forward: `-i` (treat this variable as an integer) and, starting in the next two chapters, `-a` (array) and `-A` (associative array).\n- **`readonly`** — marks a variable so it can never be reassigned or removed again for the rest of the script. (`declare -r` does exactly the same thing — `readonly` is just a more readable dedicated command for this one specific job.)\n- **`unset`** — removes a variable entirely, as if it had never been assigned. Different from setting a variable to an empty string (`var=\"\"`), which leaves it *set*, just empty — `unset var` removes it completely.\n\n### Examples\n\n**1. `declare` for a plain variable — works exactly like ordinary assignment.**\n```bash\ndeclare name=\"Alex\"\necho \"$name\"\n```\nOutput:\n```\nAlex\n```\nFor an ordinary variable, `declare name=\"Alex\"` and plain `name=\"Alex\"` are equivalent — `declare` only becomes meaningful once you add an attribute, which is what the rest of this chapter is about.\n\n**2. `declare -i` — force integer behavior.**\n```bash\ndeclare -i num\nnum=\"5 + 3\"\necho \"$num\"\n```\nOutput:\n```\n8\n```\nThis is a genuinely interesting effect: once a variable has the `-i` attribute, assigning to it is *automatically evaluated as arithmetic* — no `(( ))` needed. Assign something that isn't a valid number, though, and it quietly becomes `0` rather than raising an error:\n```bash\nnum=\"abc\"\necho \"num after abc: [$num]\"\n```\nOutput:\n```\nnum after abc: [0]\n```\nWorth knowing this silent-zero behavior exists, so an unexpected `0` doesn't leave you confused later.\n\n**3. `declare -r` (or `readonly`) — make a variable unchangeable.**\n```bash\ndeclare -r PI=3.14\necho \"$PI\"\nPI=4\n```\nOutput:\n```\n3.14\nbash: PI: readonly variable\n```\nwith a nonzero exit status. Once a variable is readonly, **there is no way to make it writable again** for the rest of that script's execution — it's a one-way door. The dedicated `readonly` command does the same thing and reads slightly more clearly when that's the *only* thing you're doing:\n```bash\nreadonly MAX=100\nMAX=200\n```\nOutput:\n```\nbash: MAX: readonly variable\n```\n\n**4. `unset` — remove a variable entirely.**\n```bash\ntemp=\"value\"\necho \"before unset: $temp\"\nunset temp\necho \"after unset: [${temp}]\"\n```\nOutput:\n```\nbefore unset: value\nafter unset: []\n```\nThe end result *looks* the same as an empty string, but it isn't — a script can distinguish \"this variable was never set\" from \"this variable was deliberately set to empty\" using tests you'll meet in Chapter 3.2 (`-z` alone can't tell them apart, but `[[ -v temp ]]` can).\n\n**5. You cannot `unset` a readonly variable.**\n```bash\nunset MAX\n```\nOutput:\n```\nbash: unset: MAX: cannot unset: readonly variable\n```\nThis follows directly from Example 3 — readonly really does mean \"no further changes of any kind,\" including removal, for the rest of the script.\n\n**6. `declare -p` — inspect what a variable actually is.**\n```bash\nfoo=\"bar\"\ndeclare -p foo\n```\nOutput:\n```\ndeclare -- foo=\"bar\"\n```\n`declare -p name` prints the variable's current value *and* its attributes (the `--` here means \"no special attributes\"). This is a genuinely handy debugging tool — Chapter 8.1 revisits it.\n\n**7. A preview of `declare -a`, which the next chapter covers properly.**\n```bash\ndeclare -a myarr\nmyarr=(1 2 3)\necho \"${myarr[@]}\"\n```\nOutput:\n```\n1 2 3\n```\n`declare -a` explicitly marks a variable as an array — Chapter 2.6 picks up exactly here.\n\n**8. `declare -g` — forcing a variable to be global from inside a function.** Requires Bash 4.2+ (check with `bash --version`, Chapter 0.2) — on an older Bash, drop the `-g` and rely on plain assignment's global-by-default behavior instead.\n```bash\nset_global() {\n  declare -g result=\"set from inside a function\"\n}\nset_global\necho \"outside: $result\"\n```\nOutput:\n```\noutside: set from inside a function\n```\nCompare this to plain `declare` (no `-g`) used inside a function, which — as flagged in Common Mistakes above and confirmed here directly — creates a local variable instead, gone the moment the function returns:\n```bash\nset_local() {\n  declare local_only=\"only visible in here\"\n  echo \"inside: $local_only\"\n}\nset_local\necho \"outside: [${local_only}]\"\n```\nOutput:\n```\ninside: only visible in here\noutside: []\n```\n`declare -g` is the explicit escape hatch when a function genuinely needs to set a variable in the *caller's* scope rather than its own — precisely the global-variable-as-return-value technique from Chapter 4.3, now spelled out with an explicit, self-documenting flag instead of relying on the \"plain assignment happens to be global by default\" behavior.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `readonly` is reversible.** It isn't, ever, within that script run — plan readonly declarations for values that are genuinely fixed for the whole script (a configuration constant, a version number), not something you might need to adjust conditionally later.\n- **Confusing `unset var` with `var=\"\"`.** Both leave `$var` printing as empty, but only `unset` actually removes the variable — this distinction matters once Chapter 3.2's `-v` test and Chapter 5.6's `set -u` come into play, both of which care whether a variable technically exists.\n- **Expecting `declare -i` to raise an error on bad input.** As shown in Example 2, an invalid value silently becomes `0` rather than failing loudly — don't rely on `declare -i` alone to validate user input; combine it with an explicit check.\n- **Using `declare` inside a function without realizing it changes scope.** Inside a function, plain `declare` (without `-g`) actually creates a *local* variable, not a global one — this is a preview of Chapter 4.4's local-vs-global distinction, worth knowing exists now so `declare` used later inside a function doesn't behave unexpectedly.\n- **Forgetting `-r`/`readonly` applies immediately, even mid-script.** If a script conditionally builds up a value across several lines and then marks it readonly too early, every later attempt to refine it will fail — mark something readonly only once it's genuinely in its final form.\n\n### How this connects\n\nThis chapter is deliberately placed right before arrays: `declare -a` and `declare -A` (Chapters 2.6 and 2.7) are the same `declare` command you just learned, with a different attribute. `readonly` will reappear anywhere a script wants to guarantee a configuration value can't drift mid-run, and `unset` becomes especially relevant once Chapter 6.1 covers environment variables, where removing one cleanly (rather than leaving it empty) sometimes genuinely matters.\n\n### Quick recap\n\n- `declare varname=value` — explicit variable creation; equivalent to plain assignment unless you add an attribute.\n- `declare -i` — treat the variable as an integer; assignments are evaluated as arithmetic, invalid input silently becomes `0`.\n- `declare -r` (or the standalone `readonly` command) — makes a variable permanently unchangeable and un-unsettable for the rest of the script.\n- `unset varname` — removes a variable entirely, distinct from setting it to an empty string.\n- `declare -p varname` — inspect a variable's current value and attributes; a handy debugging tool.\n- `declare -a` / `declare -A` — arrays and associative arrays, covered next.\n- `declare -g` (Bash 4.2+) — explicitly forces a variable to be global even when set from inside a function, an intentional alternative to relying on plain assignment's global-by-default behavior."}, {"id": "2.6", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Bash's data", "chapNum": 6, "slug": "arrays-ordered-lists-of-values", "fullTitle": "Arrays: Ordered Lists of Values", "title": "Arrays: Ordered Lists of Values", "md": "### Why this matters\n\nPlenty of real-world scripting problems are naturally \"a list of things\" — files to process, servers to check, arguments to pass along. A plain variable can only hold one value at a time; an array holds many, in order, and lets you loop over them, count them, and pick out individual pieces. This is the vocabulary upgrade that makes a huge range of scripts possible.\n\n### The core idea\n\nA Bash array is an ordered list of values, indexed starting at `0`, created with parentheses:\n```bash\nfruits=(\"apple\" \"banana\" \"cherry\")\n```\nAccess a single element with `${fruits[0]}` (note the braces are required — `$fruits[0]` without them doesn't do what it looks like). Access the **whole array** with `${fruits[@]}`. Bash arrays can also be **sparse** — you can assign directly to index `5` without indices `0`–`4` ever existing — which is unusual compared to arrays in most other languages, and worth knowing about even if you rarely rely on it deliberately.\n\n### Examples\n\n**1. Creating an array and reading individual elements.**\n```bash\nfruits=(\"apple\" \"banana\" \"cherry\")\necho \"${fruits[0]}\"\necho \"${fruits[1]}\"\n```\nOutput:\n```\napple\nbanana\n```\n\n**2. All elements, and the length.**\n```bash\necho \"${fruits[@]}\"\necho \"${#fruits[@]}\"\n```\nOutput:\n```\napple banana cherry\n3\n```\n`${#fruits[@]}` — the same `#`-for-length syntax from Chapter 2.1, applied to `[@]` instead of a plain variable — gives you the element *count*, not the length of any individual string.\n\n**3. Listing the indices themselves with `!`.**\n```bash\necho \"${!fruits[@]}\"\n```\nOutput:\n```\n0 1 2\n```\nNot something you'll need constantly, but genuinely useful once arrays become sparse (see Example 7).\n\n**4. Appending an element with `+=`.**\n```bash\nfruits+=(\"date\")\necho \"${fruits[@]}\"\n```\nOutput:\n```\napple banana cherry date\n```\nNote the parentheses even for a single new element — `fruits+=\"date\"` (no parentheses) would instead append the text `date` onto the *first* element as a string, which is almost never what you want.\n\n**5. Looping over an array — always with `\"${array[@]}\"`, quoted.**\n```bash\nfor f in \"${fruits[@]}\"; do echo \"fruit: $f\"; done\n```\nOutput:\n```\nfruit: apple\nfruit: banana\nfruit: cherry\nfruit: date\n```\nThis is the standard, safe way to loop over an array — quoting `\"${fruits[@]}\"` keeps each element intact as one word each, even if an element itself contains spaces (exactly the same principle from Chapter 1.4).\n\n**6. Slicing — a range of elements.**\n```bash\necho \"${fruits[@]:1:2}\"\n```\nOutput:\n```\nbanana cherry\n```\nSame `:start:length` syntax you learned for strings in Chapter 2.2, applied to array elements instead of characters.\n\n**7. Removing an element — and the sparse-array consequence.**\n```bash\nunset 'fruits[1]'\necho \"${fruits[@]}\"\necho \"${!fruits[@]}\"\n```\nOutput:\n```\napple cherry date\n0 2 3\n```\nRemoving index `1` (`banana`) doesn't shift everything down to close the gap — index `1` simply no longer exists, and the array is now sparse (indices `0`, `2`, `3`). `${fruits[@]}` still lists all the *remaining* values in order, which is usually all you need — but if your code relies on exact index numbers afterward, this gap is worth remembering. (The quotes around `'fruits[1]'` matter here — without them, an unquoted `[1]` risks being touched by glob expansion, Chapter 2.11.)\n\n**8. `@` vs. `*` — nearly identical, until they're quoted.**\n```bash\narr=(\"a b\" \"c d\")\nIFS=,\necho \"${arr[*]}\"\necho \"${arr[@]}\"\nunset IFS\n```\nOutput:\n```\na b,c d\na b c d\n```\n`\"${arr[*]}\"` joins every element into **one single string**, separated by the first character of `$IFS` (here set to a comma for demonstration — Chapter 2.10 covers `IFS` properly). `\"${arr[@]}\"` keeps every element as its **own separate word**, ignoring `IFS` entirely — which is exactly why Example 5's loop uses `[@]`, not `[*]`. As a default habit: use `[@]`, quoted, unless you specifically want everything joined into one string.\n\n**9. Sparse arrays from direct index assignment.**\n```bash\nsparse[5]=\"five\"\nsparse[10]=\"ten\"\necho \"${!sparse[@]}\"\necho \"${sparse[@]}\"\n```\nOutput:\n```\n5 10\nfive ten\n```\nNo `sparse=(...)` declaration was ever needed — assigning to any index creates the array automatically, and the indices between `0` and `5`, or `5` and `10`, simply don't exist. `${!sparse[@]}` (indices) and `${sparse[@]}` (values) both correctly report only the indices that actually hold something.\n\n**10. Negative indices — counting from the end.** Reading a negative index (`${arr[-1]}`) requires Bash 4.2+; *assigning* to one (`arr[-1]=x`) requires Bash 4.3+. Check with `bash --version` (Chapter 0.2) before relying on this in a script that might run on an older Bash.\n```bash\narr=(a b c d e)\necho \"${arr[-1]}\"\necho \"${arr[-2]}\"\n```\nOutput:\n```\ne\nd\n```\n`-1` is the last element, `-2` the second-to-last, and so on — genuinely convenient for \"give me the last item\" without needing to compute `${#arr[@]} - 1` yourself. This combines cleanly with the slicing syntax from Example 6:\n```bash\necho \"${arr[@]: -2}\"\n```\nOutput:\n```\nd e\n```\nthe last two elements. (Note the required space before `-2` here — exactly the same `${var: -N}` spacing rule from Chapter 2.2's string substrings, needed to avoid Bash misreading it as the \"use this default\" syntax instead.) Reaching too far past the start with a negative index prints a warning to stderr — but it's *not* a fatal error: the expansion itself is just empty, and the script keeps going with exit status `0`:\n```bash\necho \"${arr[-10]}\"\necho \"exit: $?\"\n```\n```\nbash: arr: bad array subscript\nexit: 0\n```\nEasy to misread that stderr line as a hard failure — it isn't. A script that doesn't check for this can silently treat \"index too far out of range\" the same as \"empty string,\" which is rarely what's actually wanted.\n\n**11. Applying parameter expansion across every element at once.**\n```bash\nfiles=(\"file1.txt\" \"file2.txt\" \"file3.log\")\necho \"${files[@]/.txt/.bak}\"\n```\nOutput:\n```\nfile1.bak file2.bak file3.log\n```\nChapter 2.2's `${var/find/replace}` string substitution works on **whole arrays** too, not just single strings — `${files[@]/.txt/.bak}` applies the same find-and-replace to *every element*, leaving `file3.log` untouched since it never matched `.txt` in the first place. This same trick works with `${arr[@]#pattern}`, `${arr[@]%pattern}`, and the rest of Chapter 2.2's family — genuinely useful for batch-transforming a whole list of filenames or values in one expression, without an explicit loop.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the braces**: `$fruits[0]` (no `{}`) does **not** access element 0 — it expands `$fruits` (which, unbraced, means just element `0` anyway) and then appends the literal text `[0]` after it. Always use `${fruits[0]}`.\n- **Using `[*]` in a loop instead of `[@]`.** `for f in \"${fruits[*]}\"` treats the entire array as **one single word** (joined by `$IFS`), so the loop body runs exactly once, not once per element — a subtle bug that's easy to introduce by muscle memory from Example 8's `[*]`.\n- **Appending with `+=\"text\"` instead of `+=(\"text\")`.** Missing the parentheses appends the text onto the *existing first element* as a string rather than adding a new array element — a genuinely easy typo with a confusing result.\n- **Assuming array indices stay contiguous after `unset`.** As shown in Example 7, removing an element leaves a gap rather than shifting later elements down — code that assumes `${fruits[1]}` always means \"the second item currently in the array\" can break silently after a removal.\n- **Forgetting to quote `\"${array[@]}\"`.** Unquoted `${array[@]}` re-triggers word splitting on every element, exactly like an unquoted plain variable (Chapter 1.4) — an element containing a space becomes two separate words in a loop.\n\n### How this connects\n\nEverything here builds directly on quoting (Chapter 1.4) and `${}`-based expansion (Chapters 2.1–2.2) — arrays are really just that same machinery applied to a list instead of a single value. `for f in \"${array[@]}\"` (Example 5) is the standard pattern you'll use the moment Chapter 3.4 introduces `for` loops properly. Associative arrays, next up, are the same core idea with text keys instead of numeric indices.\n\n### Quick recap\n\n- Create with `arr=(a b c)`; access one element with `${arr[0]}`; all elements with `${arr[@]}`.\n- `${#arr[@]}` — element count. `${!arr[@]}` — the indices themselves.\n- `arr+=(\"new\")` appends (note the parentheses); `unset 'arr[i]'` removes one index, leaving a gap.\n- `\"${arr[@]}\"` (quoted) is the standard, safe way to loop over an array — each element stays one word.\n- `\"${arr[*]}\"` joins everything into one string separated by `$IFS`'s first character — rarely what a loop wants.\n- Arrays can be sparse — indices don't need to be contiguous, and assigning to a new index alone creates the array.\n- `${arr[-1]}` accesses the last element (`-2` the second-to-last, etc.; Bash 4.2+ to read, 4.3+ to assign) — an out-of-range negative index prints a stderr warning but is *not* a fatal error: the result is just empty, with exit status `0`.\n- Chapter 2.2's parameter expansion (`${var/find/repl}`, `${var#pattern}`, `${var%pattern}`) works across a **whole array** at once with `${arr[@]/find/repl}` — applied to every element in one expression, no loop needed."}, {"id": "2.7", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Bash's data", "chapNum": 7, "slug": "associative-arrays", "fullTitle": "Associative Arrays", "title": "Associative Arrays", "md": "### Why this matters\n\nThe arrays from the last chapter are ordered lists, indexed by position — great when \"the third item\" is meaningful. Plenty of real data isn't naturally ordered by position at all, though — it's naturally described by *name*: a person's age, a color's hex code, a config setting's value. Associative arrays store data by a meaningful text **key** instead of a numeric position, which is exactly what that kind of data actually wants.\n\n### The core idea\n\nAn associative array is a set of key-value pairs, where both the key and the value are text. Unlike ordinary arrays, **it must be explicitly declared** with `declare -A` before use — there's no shorthand like plain `arr=(...)` that creates one automatically, because Bash needs to b
