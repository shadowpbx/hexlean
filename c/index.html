ata, the tools in Chapter 8.5) manage rather than eliminate.\n\n### How this connects\n\nYou've now seen the full, named catalog of C's classic memory bugs, each one demonstrated concretely rather than just described. The next two chapters look at tools for preventing them: `const`-correctness with pointers (limiting what a function is even allowed to do with data you hand it), and function pointers, before Part V closes.\n\n### Quick recap\n\n- **Dangling pointer** (points at something no longer valid), **use-after-free**, **double free**, **memory leak** (Chapter 5.7), and **buffer overflow** — five named categories worth recognizing on sight.\n- Returning a pointer to a local variable is always a dangling pointer the instant the function returns — GCC's `-Wreturn-local-addr` catches many cases, but the fix is simply never doing it; use the heap for data that must outlive its function.\n- A buffer overflow corrupts whatever memory happens to sit adjacent to the overrun buffer — silently, with no crash or warning at runtime, unless a mitigation like stack protection happens to catch it.\n- Modern compilers add real runtime defenses (stack protection) by default — a genuine mitigation, not a substitute for bounds-checked code in the first place.\n- A memory leak is directly observable in a process's real, OS-reported memory usage — not an abstract concern, and not self-healing; a long-running program that leaks steadily will eventually exhaust available memory."}, {"id": "5.9", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers & memory — the heart of C", "chapNum": 9, "slug": "const-correctness-with-pointers", "fullTitle": "`const`-Correctness with Pointers", "title": "`const`-Correctness with Pointers", "md": "### Why this matters\n\n`const` (Chapter 2.10) was straightforward for an ordinary variable — it's simply not reassignable. A pointer introduces a genuine ambiguity `const` alone doesn't resolve: is it the *pointer* that can't change, or the *thing it points to*, or both? C's answer is precise, and it's read from the declaration itself, not guessed at — worth being exact about, since this is also exactly how a function promises \"I won't modify your data\" in a way the compiler actually enforces.\n\n### The core idea\n\nWhere `const` sits, relative to the `*`, changes what it protects:\n\n- **`const int *p`** — a pointer to a `const int`: **cannot** modify `*p`, **can** freely reassign `p` to point elsewhere.\n- **`int * const p`** — a `const` pointer to an `int`: **can** freely modify `*p`, **cannot** reassign `p` itself.\n- **`const int * const p`** — both: neither operation is allowed.\n\nA reliable trick for reading these: work right to left from the variable name. `const int *p` reads \"`p` is a pointer to an `int` that is `const`\" — the `const` binds to the `int`, not to `p`. `int * const p` reads \"`p` is a `const` pointer to an `int`\" — the `const` binds to `p` itself.\n\n### Examples\n\n**1. `const int *p` — the pointer is free to move, what it points at is not:**\n```c\nint x = 10, y = 20;\nconst int *p = &x;\np = &y;        // fine — reassigning the pointer itself\n*p = 99;       // NOT fine\n```\n```\nerror: assignment of read-only location '*p'\n```\nReassigning `p` to point at `y` compiles without complaint; only the attempt to write through it fails.\n\n**2. `int * const p` — exactly the opposite restriction:**\n```c\nint x = 10, y = 20;\nint * const p = &x;\n*p = 99;       // fine — x becomes 99\np = &y;        // NOT fine\n```\n```\nerror: assignment of read-only variable 'p'\n```\nHere, `*p = 99;` succeeds (confirmed: `x` genuinely becomes `99`), but trying to make `p` point somewhere else fails — `p` itself is the one thing marked `const`.\n\n**3. `const int * const p` — both restrictions apply together, each with its own distinct error:**\n```c\nconst int * const p = &x;\n*p = 99;\np = &y;\n```\n```\nerror: assignment of read-only location '*(const int *)p'\nerror: assignment of read-only variable 'p'\n```\nBoth operations fail, each flagged with the specific wording matching which rule it broke — worth noticing the messages differ (`read-only location` for the pointee, `read-only variable` for the pointer itself), since that wording is your fastest clue to which kind of `const` you're up against when debugging someone else's error.\n\n**4. `const` on a function parameter is the standard, compiler-enforced way to promise \"this function will not modify your data\":**\n```c\n#include <stdio.h>\nvoid print_array(const int arr[], int n) {\n    for (int i = 0; i < n; i++) {\n        printf(\"%d \", arr[i]);\n    }\n    printf(\"\\n\");\n    arr[0] = 999;   // breaks the promise\n}\n```\n```\nerror: assignment of read-only location '*arr'\n```\nThis is exactly why so many standard library functions that only read data — `strlen(const char *s)`, `printf`'s own format string — declare their pointer parameters `const`: it's a guarantee to every caller, checked by the compiler, not just a comment that could go stale.\n\n### ⚠️ Common Mistakes\n\n- **Misreading which part of the declaration `const` protects.** `const int *p` and `int * const p` look almost identical but mean opposite things — always read right-to-left from the variable name (Example section above) rather than guessing from the general shape.\n- **Discarding `const` by assigning a `const`-qualified pointer into a plain, non-`const` one:**\n  ```c\n  const int *cp = &x;\n  int *p = cp;\n  ```\n  ```\n  warning: initialization discards 'const' qualifier from pointer target type [-Wdiscarded-qualifiers]\n  ```\n  This compiles (with a warning, not an error) but quietly throws away the protection — `p` can now modify `x` even though `cp`, the thing it was assigned from, promised it wouldn't. Never silence this specific warning without a genuinely good reason; it's flagging a real loophole.\n- **Assuming a `const T *` parameter means the *caller's* data can never change through any means.** It only restricts what *that specific pointer* is allowed to do — if some other, non-`const` pointer or the original variable itself is still directly accessible elsewhere, `const` on one parameter doesn't lock the data down globally.\n- **Over-`const`-ing simple local variables out of habit, while under-using it on pointer parameters, where it matters far more.** `const` on a function parameter is genuinely useful documentation, compiler-checked; on an ordinary local variable that's obviously never reassigned anyway, it's a much smaller win.\n\n### How this connects\n\nYou now have precise control over what a pointer is allowed to do — both to what it points at and to itself. The last chapter of Part V looks at function pointers: pointers that point not at data, but at code itself.\n\n### Quick recap\n\n- `const int *p` — pointer to `const` data: reassignable, but can't modify what it points to.\n- `int * const p` — `const` pointer: can modify what it points to, but can't be reassigned.\n- `const int * const p` — neither is allowed; read right-to-left from the variable name to tell these apart reliably.\n- `const` on a function's pointer parameter is a real, compiler-enforced promise not to modify the caller's data through that pointer — the same mechanism behind `strlen`'s and many standard library functions' signatures.\n- Assigning a `const`-qualified pointer into a non-`const` one discards the protection, with only a warning (`-Wdiscarded-qualifiers`), not an error — worth never ignoring."}, {"id": "5.10", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers & memory — the heart of C", "chapNum": 10, "slug": "function-pointers", "fullTitle": "Function Pointers", "title": "Function Pointers", "md": "### Why this matters\n\nA compiled function's instructions live in memory too (Chapter 5.1's text segment) — which means a function has an address, exactly like a variable does. A function pointer stores that address, letting you pass a function around, store it in an array, or decide *which* function to call while the program is running, rather than hard-coding the choice in the source.\n\n### The core idea\n\n```c\nreturn_type (*pointer_name)(param_types);\n```\nThe parentheses around `*pointer_name` are not optional — they're what makes this \"a pointer to a function\" rather than something else entirely (see Common Mistakes). A plain function name, used without calling it, decays into its address — assigning `operation = add;` (no `&`, no parentheses) is exactly analogous to how an array name decays into a pointer to its first element (Chapter 5.3).\n\n### Examples\n\n**1. Declaring, assigning, and calling through a function pointer:**\n```c\n#include <stdio.h>\nint add(int a, int b) { return a + b; }\nint subtract(int a, int b) { return a - b; }\nint main(void) {\n    int (*operation)(int, int);\n    operation = add;\n    printf(\"add: %d\\n\", operation(3, 4));\n    operation = subtract;\n    printf(\"subtract: %d\\n\", operation(3, 4));\n    return 0;\n}\n```\nOutput:\n```\nadd: 7\nsubtract: -1\n```\nSame variable, `operation`, called the same way both times (`operation(3, 4)`) — which actual function runs is decided by whatever was last assigned to it.\n\n**2. An array of function pointers as a dispatch table — picking a function by index, computed at runtime:**\n```c\n#include <stdio.h>\nint add(int a, int b) { return a + b; }\nint subtract(int a, int b) { return a - b; }\nint multiply(int a, int b) { return a * b; }\nint main(void) {\n    int (*ops[3])(int, int) = {add, subtract, multiply};\n    const char *names[3] = {\"add\", \"subtract\", \"multiply\"};\n    for (int i = 0; i < 3; i++) {\n        printf(\"%s(6, 2) = %d\\n\", names[i], ops[i](6, 2));\n    }\n    return 0;\n}\n```\nOutput:\n```\nadd(6, 2) = 8\nsubtract(6, 2) = 4\nmultiply(6, 2) = 12\n```\n`ops[i](6, 2)` looks up the right function for each index and calls it directly — no `if`/`switch` chain deciding which function to call is needed at all; the array itself *is* the dispatch logic.\n\n**3. The callback pattern — passing a function pointer as a parameter, letting the caller decide part of what a function does:**\n```c\n#include <stdio.h>\nint square(int x) { return x * x; }\nint negate(int x) { return -x; }\nvoid apply_to_all(int arr[], int n, int (*func)(int)) {\n    for (int i = 0; i < n; i++) {\n        printf(\"%d \", func(arr[i]));\n    }\n    printf(\"\\n\");\n}\nint main(void) {\n    int nums[4] = {1, 2, 3, 4};\n    apply_to_all(nums, 4, square);\n    apply_to_all(nums, 4, negate);\n    return 0;\n}\n```\nOutput:\n```\n1 4 9 16 \n-1 -2 -3 -4 \n```\n`apply_to_all` doesn't know or care whether it's squaring or negating — it just calls whatever `func` it was handed, on every element. This exact pattern is how the standard library's `qsort` (Chapter 7.2) lets you sort anything: you supply the comparison logic as a function pointer, and `qsort` supplies the sorting algorithm.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the parentheses around `*name`.** `int *bad(int, int) = add;` doesn't declare a function pointer at all — it's parsed as a *function* named `bad` (returning `int *`), which cannot be \"initialized like a variable\":\n  ```\n  error: function 'bad' is initialized like a variable\n  ```\n  The parentheses in `int (*bad)(int, int)` are what group `*bad` together as \"a pointer,\" rather than letting `*` bind to the return type instead.\n- **Mismatching the function pointer's declared signature and the actual function's signature.** The parameter types and return type must match exactly what's assigned — a mismatch is a real compile-time type error, the same kind of protection Chapter 4.2's declaration/definition check gave you for ordinary functions.\n- **Calling a function pointer without checking whether it's `NULL` first**, particularly one that came from somewhere outside your direct control (a caller-supplied callback, an uninitialized dispatch-table entry). A function pointer is still just a pointer — Chapter 5.2's `NULL`-check discipline applies here exactly as it does to any other pointer.\n- **Reaching for a function pointer dispatch table where a plain `switch` (Chapter 3.2) would be just as clear.** Dispatch tables earn their keep when the set of functions is large, or genuinely decided at runtime (plugins, configurable behavior) — for a small, fixed, compile-time-known set of cases, a `switch` is often more readable.\n\n### How this connects\n\nPart V is complete — pointers, arrays' real relationship to them, arithmetic, dynamic memory, the named catalog of what goes wrong, `const`-correctness, and now pointers to functions themselves. Part VI moves to structuring larger programs: `struct`, grouping related data together, and eventually splitting a program across multiple files.\n\n### Quick recap\n\n- `return_type (*name)(param_types);` declares a function pointer — the parentheses around `*name` are required, not stylistic.\n- A plain function name decays to its address, exactly like an array name decays to a pointer to its first element.\n- An array of function pointers makes a clean runtime dispatch table; passing a function pointer as a parameter is the callback pattern, the same mechanism `qsort` uses for custom comparisons.\n- A function pointer is still a pointer — check for `NULL` before calling one you didn't just assign yourself, and match its signature exactly to whatever function it's assigned."}, {"id": "6.1", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 1, "slug": "struct-grouping-related-data", "fullTitle": "`struct`: Grouping Related Data", "title": "`struct`: Grouping Related Data", "md": "### Why this matters\n\nPlenty of real data doesn't fit neatly into a single value or a single-typed array — a point needs an `x` *and* a `y`; a person needs a name *and* an age. Without a way to bundle related fields together, you're stuck managing several parallel, separately-declared variables (or parallel arrays) that only make sense in relation to each other, with nothing enforcing that relationship. `struct` is C's answer: one new type, built from several fields of possibly different types, all moving and living together.\n\n### The core idea\n\n```c\nstruct StructName {\n    type field1;\n    type field2;\n};\n```\nA variable of this type is declared `struct StructName variable_name;`, and its fields are accessed with `.` (dot notation): `variable_name.field1`. Struct assignment (`p2 = p1;`) copies every field at once — Chapter 4.3 already showed this in action, passing a whole struct by value into a function.\n\n### Examples\n\n**1. Declaring, initializing, and accessing a struct's fields:**\n```c\n#include <stdio.h>\nstruct Point {\n    int x;\n    int y;\n};\nint main(void) {\n    struct Point p1 = {3, 4};\n    printf(\"p1 = (%d, %d)\\n\", p1.x, p1.y);\n    p1.x = 10;\n    printf(\"after p1.x=10: (%d, %d)\\n\", p1.x, p1.y);\n    printf(\"sizeof(struct Point) = %zu\\n\", sizeof(struct Point));\n    return 0;\n}\n```\nOutput:\n```\np1 = (3, 4)\nafter p1.x=10: (10, 4)\nsizeof(struct Point) = 8\n```\n`{3, 4}` initializes fields in declaration order (`x` first, then `y`); `.x` reads and writes a single field independently of the rest. `sizeof(struct Point)` here is exactly the sum of its two `int` fields — Chapter 6.2 looks at when that stops being true.\n\n**2. Designated initializers — naming which field gets which value, in any order:**\n```c\n#include <stdio.h>\nstruct Point { int x; int y; };\nint main(void) {\n    struct Point p = {.y = 5, .x = 10};\n    printf(\"p = (%d, %d)\\n\", p.x, p.y);\n    return 0;\n}\n```\nOutput: `p = (10, 5)` — correct despite `y` being written first in the initializer, because `.field = value` names its target explicitly rather than relying on position. This is especially valuable for a struct with many fields, where positional initialization (Example 1's style) becomes error-prone and hard to read.\n\n**3. An array of structs — a very common, natural combination:**\n```c\n#include <stdio.h>\nstruct Point { int x; int y; };\nint main(void) {\n    struct Point points[3] = {{1,1}, {2,4}, {3,9}};\n    for (int i = 0; i < 3; i++) {\n        printf(\"(%d, %d)\\n\", points[i].x, points[i].y);\n    }\n    return 0;\n}\n```\nOutput: `(1, 1)`, `(2, 4)`, `(3, 9)` — everything from Chapter 2.6's array chapter applies directly; the elements simply happen to be structs instead of plain numbers.\n\n### ⚠️ Common Mistakes\n\n- **Dropping the `struct` keyword when declaring a variable.** Unlike some languages, plain C requires it every time, unless the type has been given a shorter alias with `typedef` (Chapter 6.4):\n  ```c\n  struct Point { int x; int y; };\n  Point p = {1, 2};   // missing 'struct'\n  ```\n  ```\n  error: unknown type name 'Point'; use 'struct' keyword to refer to the type\n  ```\n  GCC's own suggestion here is exactly the fix: `struct Point p = {1, 2};`.\n- **Comparing two structs with `==`.** Unlike a plain number, there's no built-in, field-by-field equality check for structs in C:\n  ```\n  error: invalid operands to binary == (have 'struct Point' and 'struct Point')\n  ```\n  Comparing structs for equality means comparing each field individually yourself (or writing a small helper function that does), never a direct `==`.\n- **Assuming struct assignment always makes a fully independent, \"deep\" copy.** It copies every field's *value* — for a struct containing a pointer field, that copies the pointer itself, not whatever it points to. Both the original and the copy end up pointing at the exact same data. Chapter 6.5 revisits this precisely once structs containing pointers are in view.\n- **Forgetting field access uses `.` for a plain struct variable, not `->`.** `->` (Chapter 6.5) is for accessing a field *through a pointer* to a struct — using the wrong one where the other is expected is a compile error, easy to fix once you know which situation you're in.\n\n### How this connects\n\nYou now have a real way to group related data as one unit. The next chapter looks at something every struct has been quietly doing already — padding and alignment — and exactly why `sizeof(struct)` isn't always simply the sum of its fields' sizes.\n\n### Quick recap\n\n- `struct Name { type field; ... };` defines a new type; `.` accesses a field on a plain struct variable.\n- Struct assignment copies every field at once — but only the *values* stored in each field; a pointer field copies the pointer, not what it points to.\n- Designated initializers (`{.field = value, ...}`) name their target explicitly, safer than positional order once a struct has more than a couple of fields.\n- The `struct` keyword is required on every declaration unless a `typedef` alias exists; structs cannot be compared with `==` — only field by field, by hand."}, {"id": "6.2", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 2, "slug": "struct-padding-alignment-sizeof", "fullTitle": "Struct Padding, Alignment & `sizeof`", "title": "Struct Padding, Alignment & `sizeof`", "md": "### Why this matters\n\nChapter 6.1 left a quiet promise unfulfilled: `sizeof(struct Point)` happened to equal the sum of its fields, but that's not a general rule — it was a coincidence of that specific struct's fields. Real structs routinely have a `sizeof` *larger* than their fields add up to, for a real, mechanical reason: **padding**, inserted by the compiler to keep every field properly aligned in memory. Understanding this precisely matters the moment you care about a struct's exact size — reading a binary file format, talking to hardware, or simply trying not to waste memory across a huge array of them.\n\n### The core idea\n\nMost types have an **alignment requirement**: the address they're stored at must be a multiple of some number, usually matching their own size (a 4-byte `int` typically needs a 4-byte-aligned address; an 8-byte `double`, an 8-byte-aligned one). To satisfy this for *every* field in a struct, the compiler is free to insert invisible **padding** bytes between fields — or after the last one — wherever needed to keep the next field's address properly aligned. `sizeof(struct)` includes all of that padding; it is not, and was never guaranteed to be, simply the sum of the fields' individual sizes.\n\n### Examples\n\n**1. A `char` followed by an `int` — padding appears exactly where alignment demands it:**\n```c\n#include <stdio.h>\n#include <stddef.h>\nstruct Bad {\n    char c;\n    int i;\n};\nint main(void) {\n    printf(\"sizeof(char) + sizeof(int) = %zu\\n\", sizeof(char) + sizeof(int));\n    printf(\"sizeof(struct Bad) = %zu\\n\", sizeof(struct Bad));\n    printf(\"offsetof(c) = %zu\\n\", offsetof(struct Bad, c));\n    printf(\"offsetof(i) = %zu\\n\", offsetof(struct Bad, i));\n    return 0;\n}\n```\nOutput:\n```\nsizeof(char) + sizeof(int) = 5\nsizeof(struct Bad) = 8\noffsetof(c) = 0\noffsetof(i) = 4\n```\nThe fields alone add up to 5 bytes; the struct itself is 8. `offsetof` (from `<stddef.h>`) shows exactly why: `i` starts at byte 4, not byte 1 — the compiler inserted 3 invisible padding bytes right after `c`, purely so `i` lands on a 4-byte-aligned address, satisfying `int`'s alignment requirement.\n\n**2. Field order genuinely changes the total size — the same fields, reordered, need less padding:**\n```c\n#include <stdio.h>\nstruct Unordered {\n    char c1;\n    int i;\n    char c2;\n};\nstruct Ordered {\n    int i;\n    char c1;\n    char c2;\n};\nint main(void) {\n    printf(\"sizeof(struct Unordered) = %zu\\n\", sizeof(struct Unordered));\n    printf(\"sizeof(struct Ordered) = %zu\\n\", sizeof(struct Ordered));\n    return 0;\n}\n```\nOutput:\n```\nsizeof(struct Unordered) = 12\nsizeof(struct Ordered) = 8\n```\nIdentical fields, identical data — `Unordered` needs padding both before `i` (to align it) and after `c2` (to round the whole struct up); `Ordered` places both `char`s together, right after `i`, needing only trailing padding. Same information, 4 fewer bytes, purely from field order. This is a real, well-known technique for shrinking a struct: group same-sized (and especially same-alignment) fields together, generally largest to smallest.\n\n**3. A struct's total size is always rounded up to a multiple of its own strictest alignment requirement — visible directly in how an array of them is laid out:**\n```c\n#include <stdio.h>\nstruct Trail {\n    int i;\n    char c;\n};\nint main(void) {\n    struct Trail arr[2];\n    printf(\"sizeof(struct Trail) = %zu\\n\", sizeof(struct Trail));\n    printf(\"address of arr[0] and arr[1] differ by %ld\\n\", (long)((char*)&arr[1] - (char*)&arr[0]));\n    return 0;\n}\n```\nOutput:\n```\nsizeof(struct Trail) = 8\naddress of arr[0] and arr[1] differ by 8\n```\n`int` (4 bytes) plus `char` (1 byte) is 5 bytes of real data, but the struct is 8 — 3 bytes of **trailing** padding, added so that every element of an array of `struct Trail` keeps its own `int` field correctly aligned, not just the first one. Without this rule, `arr[1].i` would land on a misaligned address the moment the struct's raw field size wasn't already a multiple of 4.\n\n**4. Querying a type's actual alignment requirement directly, rather than inferring it from padding gaps:**\n```c\n#include <stdio.h>\n#include <stdalign.h>\nint main(void) {\n    printf(\"_Alignof(char) = %zu\\n\", _Alignof(char));\n    printf(\"_Alignof(int) = %zu\\n\", _Alignof(int));\n    printf(\"_Alignof(double) = %zu\\n\", _Alignof(double));\n    return 0;\n}\n```\nOutput:\n```\n_Alignof(char) = 1\n_Alignof(int) = 4\n_Alignof(double) = 8\n```\n`_Alignof` (C11; `<stdalign.h>` also provides the friendlier lowercase `alignof`, mirroring `<stdbool.h>`'s `bool`/`_Bool` relationship) confirms directly what Examples 1–3 only showed indirectly: each type's real alignment requirement, in bytes — exactly the numbers the compiler was satisfying every time it inserted padding above.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `sizeof(struct)` equals the sum of its fields' sizes.** As shown throughout, it very often doesn't — always measure with `sizeof` directly rather than adding field sizes by hand, especially before writing a struct's raw bytes to a file or network socket.\n- **Writing a struct's raw memory directly to a file or over a network, expecting it to read back identically on a different compiler, platform, or architecture.** Padding amounts (and even a type's basic size) can differ across platforms — a struct dumped raw from one system is not guaranteed to be interpreted identically elsewhere. Real cross-platform binary formats explicitly define their own byte layout and read/write fields individually, rather than relying on a `struct`'s in-memory shape.\n- **Not considering field order when many struct instances exist** — an array of a million structs, each wasting 4 padding bytes from poor ordering, is 4 megabytes of pure padding. Grouping same-size fields together (Example 2) is a real, easy win when memory footprint matters.\n- **Reaching for compiler-specific packing attributes (`#pragma pack`, `__attribute__((packed))`) to eliminate padding, without understanding the cost.** Removing padding can produce genuinely misaligned field access, which is slower on some platforms and an outright crash on others (some architectures cannot perform an unaligned access at all) — a niche, situational tool, not a default habit.\n\n### How this connects\n\nYou now understand precisely what `sizeof` on a struct is really measuring. The next chapter looks at two more ways to shape data — `union`s, which let several fields share the same memory, and `enum`s, named integer constants — both cousins of the `struct` you've just learned.\n\n### Quick recap\n\n- `sizeof(struct)` includes compiler-inserted **padding**, added between or after fields to satisfy each field's alignment requirement — it is not generally the sum of the fields' individual sizes.\n- `offsetof` (from `<stddef.h>`) reveals exactly where each field actually starts, padding included.\n- Reordering fields (generally largest-to-smallest, or grouping same-size fields) can reduce a struct's total size, sometimes significantly, with zero change to what data it holds.\n- A struct's size is always rounded up to a multiple of its own strictest field alignment — this is exactly what keeps every element of an array of structs properly aligned, not just the first.\n- Never assume a struct's raw in-memory layout is portable across compilers or platforms — real binary formats define their own explicit byte layout instead.\n- `_Alignof(type)` (or `alignof`, from `<stdalign.h>`) reports a type's real alignment requirement directly, rather than having to infer it from where padding shows up."}, {"id": "6.3", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 3, "slug": "unions-enums", "fullTitle": "Unions & Enums", "title": "Unions & Enums", "md": "### Why this matters\n\nTwo more data-shaping tools, both cousins of `struct` but solving different problems: a `union` lets several differently-typed fields share the *same* memory, one at a time — useful when a value is genuinely \"one of several possible types.\" An `enum` gives readable names to a set of related integer constants, replacing magic numbers like `1` for \"Monday\" with an actual word.\n\n### The core idea\n\n```c\nunion UnionName {\n    type1 field1;\n    type2 field2;\n};\n```\nUnlike a `struct`, where every field gets its own separate space, a `union`'s fields all **overlap the same memory** — writing to one field and then reading a *different* field reinterprets those same bytes as the new field's type. `sizeof(union)` is exactly the size of its single largest member, not the sum of all of them.\n\n```c\nenum EnumName { CONST1, CONST2, CONST3 };\n```\nEach name gets a consecutive `int` value, starting at `0` by default (`CONST1` is `0`, `CONST2` is `1`, and so on) — or an explicit starting value (and gaps) can be assigned directly.\n\n### Examples\n\n**1. `sizeof` a union is the size of its largest member, not the sum of all of them:**\n```c\n#include <stdio.h>\nunion Value {\n    int i;\n    double d;\n    char c;\n};\nint main(void) {\n    printf(\"sizeof(union Value) = %zu\\n\", sizeof(union Value));\n    printf(\"sizeof(int)=%zu sizeof(double)=%zu sizeof(char)=%zu\\n\", sizeof(int), sizeof(double), sizeof(char));\n    return 0;\n}\n```\nOutput:\n```\nsizeof(union Value) = 8\nsizeof(int)=4 sizeof(double)=8 sizeof(char)=1\n```\n`8` — exactly `double`'s size, the largest of the three — because all three fields live in the very same 8 bytes, just interpreted differently depending on which one you access.\n\n**2. A real, common use of that overlap: inspecting a `float`'s raw underlying bits:**\n```c\n#include <stdio.h>\nunion FloatBits {\n    float f;\n    unsigned int bits;\n};\nint main(void) {\n    union FloatBits fb;\n    fb.f = 1.5f;\n    printf(\"f = %f, as raw bits (hex) = 0x%x\\n\", fb.f, fb.bits);\n    return 0;\n}\n```\nOutput: `f = 1.500000, as raw bits (hex) = 0x3fc00000` — writing to `.f` and reading back through `.bits` gets you the exact IEEE 754 bit pattern (Chapter 2.3) underlying `1.5f`, with no conversion at all — just the same bytes, viewed as a different type. This technique, called **type punning**, is a genuinely common, practical use of unions in real C code.\n\n**3. `enum` constants, default and custom, used naturally in a `switch`:**\n```c\n#include <stdio.h>\nenum Color { RED, GREEN, BLUE };\nenum Status { OK = 200, NOT_FOUND = 404, SERVER_ERROR = 500 };\nint main(void) {\n    printf(\"RED=%d GREEN=%d BLUE=%d\\n\", RED, GREEN, BLUE);\n    printf(\"OK=%d NOT_FOUND=%d SERVER_ERROR=%d\\n\", OK, NOT_FOUND, SERVER_ERROR);\n    enum Color c = GREEN;\n    switch (c) {\n        case RED: printf(\"red\\n\"); break;\n        case GREEN: printf(\"green\\n\"); break;\n        case BLUE: printf(\"blue\\n\"); break;\n    }\n    return 0;\n}\n```\nOutput:\n```\nRED=0 GREEN=1 BLUE=2\nOK=200 NOT_FOUND=404 SERVER_ERROR=500\ngreen\n```\n`Color`'s constants default to `0`, `1`, `2`; `Status`'s are given explicit values instead — both are perfectly ordinary `int`s once compiled, which is exactly why `switch` (Chapter 3.2) accepts them without any special handling.\n\n### ⚠️ Common Mistakes\n\n- **Reading a union field that isn't the one most recently written, expecting it to hold unrelated, meaningful data.** By definition, every field shares the same bytes — reading `.i` right after writing `.d` doesn't give you some independent stored integer, it reinterprets `.d`'s actual bytes as an `int`, which is rarely what you want unless (as in Example 2) that reinterpretation is the entire point.\n- **Losing track of which field is \"currently valid.\"** A union has no memory of which field was last written — that's entirely on you to track, often by pairing the union with a separate `enum` field in a wrapping `struct` recording \"which one is active right now\" (a common, genuinely useful pattern called a *tagged union*).\n- **Assuming `enum` gives real type safety.** It doesn't — an `enum` variable is just an `int` underneath, and C does not stop you from assigning a value with no matching named constant at all:\n  ```c\n  enum Color c = 99;   // no error, no warning, at any warning level\n  ```\n  This compiles and runs cleanly, printing `c = 99` — a value with no corresponding name in `Color` whatsoever. Treat `enum` as documentation and readability, not as a compiler-enforced guarantee the way a real \"sum type\" would be in some other languages.\n- **Assuming enum constants across two different `enum` types can't collide or be mixed up accidentally.** They're both just plain `int`s at heart — passing a `Status` value where a `Color` was expected still compiles (`enum` provides no hard type barrier), though it's not silent: GCC's `-Wextra` catches it directly with `implicit conversion from 'enum Status' to 'enum Color' [-Wenum-conversion]`. Worth heeding that warning rather than suppressing it — the compiler is telling you two conceptually unrelated sets of constants just got mixed.\n\n### How this connects\n\nYou now have three ways to shape data — `struct` (separate fields), `union` (overlapping fields), and `enum` (named constants) — the building blocks for the more complex, self-referential structures the next few chapters build toward. The next chapter gives all of these shorter, cleaner names with `typedef`.\n\n### Quick recap\n\n- `union` fields all share the same memory — `sizeof(union)` is its largest member's size, and writing one field then reading another reinterprets the same bytes as a different type (type punning).\n- A union has no built-in memory of which field is currently meaningful — track that yourself, often with a paired `enum` tag.\n- `enum` constants default to `0, 1, 2, ...` in declaration order, or take explicit values you assign directly.\n- `enum` provides zero real type safety in C — it's just a named `int` underneath; an out-of-range or cross-`enum` value is accepted silently, at every warning level."}, {"id": "6.4", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 4, "slug": "typedef-naming-your-own-types", "fullTitle": "`typedef`: Naming Your Own Types", "title": "`typedef`: Naming Your Own Types", "md": "### Why this matters\n\n`struct Point`, repeated in every single declaration, gets tiresome fast — and a function pointer's declaration syntax (Chapter 5.10) is genuinely hard to read once it appears more than once. `typedef` solves both: it gives an existing type a new, shorter, more meaningful name, used everywhere after.\n\n### The core idea\n\n```c\ntypedef existing_type NewName;\n```\n`NewName` becomes a full alias for `existing_type` — usable anywhere a type is expected, exactly as if you'd written the original type out in full. It's overwhelmingly common paired with `struct`/`union` (dropping the repeated keyword) and with function pointer types (collapsing Chapter 5.10's awkward syntax into one plain-looking name).\n\n### Examples\n\n**1. `typedef` paired with an anonymous struct — the standard idiom for a struct you'll reference constantly:**\n```c\n#include <stdio.h>\ntypedef struct {\n    int x;\n    int y;\n} Point;\nint main(void) {\n    Point p = {3, 4};\n    printf(\"(%d, %d)\\n\", p.x, p.y);\n    return 0;\n}\n```\nOutput: `(3, 4)`. The struct has no name of its own (it's anonymous) — `Point` *is* its name from here on, and every later declaration reads `Point p;`, never `struct Point p;`.\n\n**2. A function pointer type, named once, used plainly everywhere after:**\n```c\n#include <stdio.h>\ntypedef int (*Operation)(int, int);\nint add(int a, int b) { return a + b; }\nint main(void) {\n    Operation op = add;\n    printf(\"%d\\n\", op(3, 4));\n    return 0;\n}\n```\nOutput: `7`. `Operation op;` reads far more clearly than repeating `int (*op)(int, int);` at every declaration site — especially once a function takes several such parameters, or a struct field is itself a function pointer.\n\n**3. `typedef` and `#define` can look interchangeable for a simple case — and genuinely aren't, the moment more than one variable is declared on the same line:**\n```c\n#define PTR_DEFINE int*\ntypedef int* PTR_TYPEDEF;\n\nPTR_DEFINE a, b;      // expands to: int* a, b;\nPTR_TYPEDEF c, d;     // both c and d are genuinely int*\n```\n```\nwarning: assignment to 'int' from 'int *' makes integer from pointer without a cast [-Wint-conversion]\nerror: invalid type argument of unary '*' (have 'int')\n```\n`#define` is pure text substitution (Chapter 2.8) — `PTR_DEFINE a, b;` becomes `int* a, b;`, and in ordinary C declaration syntax, `*` binds only to the *first* name: `a` is `int *`, but `b` is a plain `int`, silently. `typedef`, by contrast, genuinely creates a new type name the compiler understands — `PTR_TYPEDEF c, d;` correctly makes both `c` and `d` real `int *`s, with no such trap.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `typedef` and `#define` behave identically for a type alias.** As shown in Example 3, they diverge exactly at multi-variable declarations — `typedef` is genuinely type-aware; `#define` is blind text substitution that happens to look right in the simplest cases and silently misbehaves in slightly less simple ones.\n- **Over-`typedef`-ing simple types out of habit** (`typedef int MyInt;` for no real reason) — this adds a layer of naming with no genuine clarity benefit, and can make it *harder* for a reader to immediately see what's actually being stored. Reserve `typedef` for cases with a real payoff: structs used constantly, or a type genuinely hard to read in its raw form (function pointers).\n- **Forgetting a `typedef`'d name is still just an alias, not a distinct type for overload-style purposes.** `typedef int Meters; typedef int Seconds;` — both are still plain `int` as far as the compiler's type-checking is concerned; nothing stops you from adding a `Meters` to a `Seconds` by mistake. `typedef` improves readability, not type safety.\n- **Redefining the same `typedef` name to mean something different later in the same file.** Depending on the exact redefinition, this is either a hard error or, in some older-style code, silently accepted in ways that surprise later readers — keep one `typedef` name meaning exactly one thing throughout a program.\n\n### How this connects\n\nYou now have three ways to shape data (`struct`, `union`, `enum`) and a clean way to name any of them. The next chapter builds directly on this: structs that contain a pointer to their own type — the foundation of linked lists and every tree-shaped data structure that follows.\n\n### Quick recap\n\n- `typedef existing_type NewName;` creates a genuine alias — usable anywhere the original type could be, and understood by the compiler as a real type, not text substitution.\n- The standard idiom for a frequently-used struct: `typedef struct { ... } Name;`, dropping the repeated `struct` keyword everywhere after.\n- `typedef` is genuinely type-aware; `#define` is blind text substitution — they diverge visibly the moment more than one variable is declared on the same line with a pointer type.\n- `typedef` improves readability, not type safety — two differently-named aliases for the same underlying type are still completely interchangeable to the compiler."}, {"id": "6.5", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 5, "slug": "nested-self-referential-structs", "fullTitle": "Nested & Self-Referential Structs", "title": "Nested & Self-Referential Structs", "md": "### Why this matters\n\nStructs can contain other structs, which is often exactly what a real design needs — a rectangle made of two points, an address made of a street and a city. More interestingly, a struct can even contain a pointer to *its own type*, which sounds paradoxical until you see why it has to be a pointer specifically — and that one trick is the entire foundation of linked lists, trees, and every other data structure that links pieces of itself together, the subject of Chapter 9.2.\n\n### The core idea\n\nA **nested struct** is simply a struct field whose type is another struct, by value:\n```c\nstruct Rectangle {\n    struct Point topleft;\n    struct Point bottomright;\n};\n```\nA **self-referential struct** contains a pointer to its own type:\n```c\nstruct Node {\n    int data;\n    struct Node *next;\n};\n```\nIt must be a *pointer*, never the struct type itself by value — `struct Node next;` (no `*`) would require `struct Node` to contain a complete `struct Node` inside itself, which requires knowing `struct Node`'s size before it's even finished being defined: an impossible, infinitely-recursive size. A pointer sidesteps this entirely, since every pointer is a fixed, known size (Chapter 5.2) regardless of what it points to.\n\n### Examples\n\n**1. A nested struct — a `Rectangle` built from two `Point`s, by value:**\n```c\n#include <stdio.h>\nstruct Point { int x; int y; };\nstruct Rectangle {\n    struct Point topleft;\n    struct Point bottomright;\n};\nint main(void) {\n    struct Rectangle r = {{0, 10}, {10, 0}};\n    printf(\"topleft=(%d,%d) bottomright=(%d,%d)\\n\",\n           r.topleft.x, r.topleft.y, r.bottomright.x, r.bottomright.y);\n    return 0;\n}\n```\nOutput: `topleft=(0,10) bottomright=(10,0)`. `r.topleft.x` chains two `.` accesses — `r`'s `topleft` field, then that `Point`'s own `x` field — exactly following the nested structure.\n\n**2. Self-reference by value is a genuine compile error, not just bad style:**\n```c\nstruct Node {\n    int data;\n    struct Node next;   // no pointer\n};\n```\n```\nerror: field 'next' has incomplete type\n```\nThe compiler catches this immediately — `struct Node` cannot contain a complete `struct Node`, since it isn't finished being defined yet at the point that field appears.\n\n**3. The correct version — self-reference via pointer — and a minimal, manually-built linked list:**\n```c\n#include <stdio.h>\nstruct Node {\n    int data;\n    struct Node *next;\n};\nint main(void) {\n    struct Node c = {3, NULL};\n    struct Node b = {2, &c};\n    struct Node a = {1, &b};\n    struct Node *head = &a;\n    while (head != NULL) {\n        printf(\"%d -> \", head->data);\n        head = head->next;\n    }\n    printf(\"NULL\\n\");\n    return 0;\n}\n```\nOutput: `1 -> 2 -> 3 -> NULL`. Three ordinary local structs, each holding the address of the next one — `head->data` and `head->next` use `->` (arrow notation) specifically because `head` is a *pointer* to a struct, not the struct itself (`.` is for a struct value directly, as in Example 1; `->` dereferences a struct pointer and accesses a field in one step). This is genuinely the same idea behind every linked list you'll ever build — Chapter 9.2 does this properly, with nodes allocated on the heap (Chapter 5.7) instead of these three fixed local variables.\n\n**4. A subtle trap when combining this with `typedef`: the alias name isn't usable inside its own definition, only the `struct` tag is:**\n```c\ntypedef struct {\n    int data;\n    Node *next;   // 'Node' doesn't exist yet at this point\n} Node;\n```\n```\nerror: unknown type name 'Node'\n```\nThe `typedef`'d name `Node` only becomes valid *after* the whole declaration finishes — it doesn't exist yet on the line trying to use it. The fix is to give the struct its own explicit tag name and reference *that* inside:\n```c\ntypedef struct Node {\n    int data;\n    struct Node *next;   // the tag, not the typedef alias\n} Node;\n```\nThis compiles cleanly, and `Node n = {5, NULL};` works exactly as expected afterward — `struct Node` (the tag) is available immediately, even while the surrounding `typedef` is still being defined; `Node` (the alias) only becomes usable once it's complete.\n\n### ⚠️ Common Mistakes\n\n- **Trying to embed a struct within itself by value.** Always a compile error (`incomplete type`) — self-reference requires a pointer, with no exception.\n- **Confusing `.` and `->`.** `.` accesses a field on a struct *value*; `->` accesses a field through a struct *pointer* — using the wrong one is a compile error, but a quick one to fix once you notice which kind of variable you're actually working with.\n- **Trying to use a `typedef`'d alias name inside its own definition**, as shown in Example 4. The struct's own tag name (`struct Node`) is what's needed there — the alias only exists starting just after the closing `} Name;`.\n- **Forgetting to terminate a manually-built chain with `NULL`.** Without an explicit `NULL` at the end (Example 3's `c.next`), a traversal loop like `while (head != NULL)` has no way to know where the structure actually ends, and walks straight off into whatever memory happens to follow.\n\n### How this connects\n\nYou now have the exact mechanism real linked data structures are built from. The next chapter moves from a single file to organizing declarations across several — header files and the compilation model, which becomes essential the moment a program (or a struct definition like `Node`) needs to be shared across more than one `.c` file.\n\n### Quick recap\n\n- A nested struct is a field whose type is another struct, by value — chain `.` to reach fields inside fields.\n- A self-referential struct must use a *pointer* to its own type (`struct Node *next;`), never the struct by value — the latter is an immediate compile error (incomplete type, an impossible infinite size).\n- `->` accesses a field through a struct pointer in one step; `.` accesses a field on a struct value directly.\n- Inside a `typedef struct { ... } Name;`, only the struct's own tag (if it has one) is usable for self-reference — the `typedef`'d alias name isn't valid until the whole declaration is finished."}, {"id": "6.6", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 6, "slug": "header-files-compilation-model", "fullTitle": "Header Files & the Compilation Model", "title": "Header Files & the Compilation Model", "md": "### Why this matters\n\nEvery program in this book so far has lived in one `.c` file. Real programs rarely do — they're split across many, each focused on one part of the problem, sharing struct definitions and function declarations between them without duplicating any of it. Header files are how that sharing happens, and understanding the actual stages a C program passes through on its way to becoming an executable is what makes headers — and the errors around them — make sense.\n\n### The core idea\n\nA C program becomes a running executable in three stages worth knowing by name (strictly, GCC splits \"compilation\" into two separate internal programs — `cc1` translating C to assembly, then `as` assembling that into machine code — but from the command line, and for everything this chapter cares about, \"compilation\" is the useful unit to reason about):\n\n1. **Preprocessing** (Chapter 2.8) — `#include`, `#define`, and conditional compilation are resolved, producing pure C source with no directives left.\n2. **Compilation** — each `.c` file (now expanded) is compiled *independently* into an **object file** (`.o`) — machine code, but not yet a runnable program; it may reference functions/variables it doesn't itself define.\n3. **Linking** — all the object files are combined into one final executable, with every cross-file reference resolved to the right address. This is exactly the stage Chapter 4.5's `extern`/`static` distinction and Chapter 4.2's declaration/definition split were building toward.\n\nA **header file** (`.h`) holds **declarations** meant to be shared: function prototypes, `struct`/`typedef`/`enum` definitions, `extern` variable declarations, macros — everything a `.c` file needs to *know about* something defined elsewhere, without needing the actual implementation. `#include \"header.h\"` for your own headers, `#include <header.h>` for system/library ones (a convention, not a hard rule, but worth following).\n\n### Examples\n\n**1. A real two-file program: a header declaring, one file implementing, another file using — compiled and linked as genuinely separate stages:**\n```c\n/* mathutil.h */\n#ifndef MATHUTIL_H\n#define MATHUTIL_H\nint square(int x);\n#endif\n```\n```c\n/* mathutil.c */\n#include \"mathutil.h\"\nint square(int x) {\n    return x * x;\n}\n```\n```c\n/* main.c */\n#include <stdio.h>\n#include \"mathutil.h\"\nint main(void) {\n    printf(\"square(6) = %d\\n\", square(6));\n    return 0;\n}\n```\nCompiling and linking as real, separate steps:\n```bash\ngcc -c mathutil.c -o mathutil.o    # compilation only, no link yet\ngcc -c main.c -o main.o\ngcc mathutil.o main.o -o combined  # linking, combining both .o files\n```\nOutput: `square(6) = 36`. `main.c` never sees `square`'s actual body — only its declaration, from the header — and the linker is what finally connects `main.o`'s *call* to `square` with `mathutil.o`'s *definition* of it.\n\n**2. Including the same header twice, without protection, causes a real \"redefinition\" error** — easy to trigger accidentally once headers start including other headers:\n```c\n#include \"shape.h\"\n#include \"shape.h\"\n```\n```\nerror: redefinition of 'struct Shape'\nnote: originally defined here\n```\nThe preprocessor genuinely pastes the header's text in twice — the second copy of `struct Shape { ... };` is a real, second definition, and the compiler correctly refuses to accept it.\n\n**3. Include guards fix this by making a header self-aware of whether it's already been included:**\n```c\n#ifndef SHAPE_H\n#define SHAPE_H\nstruct Shape {\n    int sides;\n};\n#endif\n```\nThe first time this header is included, `SHAPE_H` isn't yet defined, so its contents are processed *and* `SHAPE_H` gets defined. Any subsequent inclusion (in the same compilation) sees `SHAPE_H` already defined, and `#ifndef` skips the entire body — the struct is only ever truly defined once, however many times the header is `#include`d. Compiling with this guard in place produces no error at all.\n\n**4. `#pragma once`, a simpler, near-universally-supported alternative to the guard pattern above:**\n```c\n#pragma once\nstruct Shape {\n    int sides;\n};\n```\nCompiles identically cleanly, with far less boilerplate — a single line instead of three, and no chance of accidentally reusing the same guard name in two different headers (a real, if minor, risk with the `#ifndef` style). It isn't part of the official C standard, but it's supported by every compiler worth using today, GCC and Clang included, which is why plenty of real modern codebases prefer it.\n\n**5. A full function *definition* placed directly in a header, included by two different `.c` files, fails at the linking stage specifically — even though each file compiles fine on its own:**\n```c\n/* bad.h */\n#ifndef BAD_H\n#define BAD_H\nint triple(int x) {\n    return x * 3;\n}\n#endif\n```\n```c\n/* a.c */\n#include \"bad.h\"\nint main(void) { return triple(2); }\n```\n```c\n/* b.c */\n#include \"bad.h\"\nint helper(void) { return triple(5); }\n```\nBoth `gcc -c a.c` and `gcc -c b.c` succeed individually — the include guard correctly prevents *each file's own* double-inclusion problem. But linking them together:\n```\n/usr/bin/ld: b.o: in function `triple':\nb.c:(.text+0x0): multiple definition of `triple'; a.o:a.c:(.text+0x0): first defined here\ncollect2: error: ld returned 1 exit status\n```\nThe include guard only protects against the *same file* including `bad.h` twice — it does nothing to stop two *different* `.c` files from each getting their own complete copy of `triple`'s definition, and the linker correctly refuses to merge two full, conflicting definitions of the same function into one program. This is precisely why headers should hold declarations (a prototype, `int triple(int x);`), and exactly one `.c` file should hold the actual definition.\n\n### ⚠️ Common Mistakes\n\n- **Defining a `struct`, function, or variable directly in a header, without any guard against multiple inclusion.** The moment two different `.c` files (or one file including it both directly and indirectly through another header) both pull in the same unprotected header, you get Example 2's exact error. Every header you write should have either `#ifndef`/`#define`/`#endif` guards or `#pragma once` — no exceptions, as a matter of habit.\n- **Putting a full function *definition* (not just its declaration) in a header included by more than one `.c` file.** As Example 5 shows directly, include guards don't help here at all — they only prevent one *file's own* double-inclusion, not two separate files each getting their own copy. Headers should declare; a single `.c` file should define.\n- **Choosing an include-guard macro name that collides with another header's guard**, especially in a large project with many similarly-named files. `#pragma once` sidesteps this specific risk entirely, which is part of its appeal.\n- **Forgetting that `.o` files aren't runnable on their own.** `gcc -c file.c` alone produces only an intermediate object file — a real, necessary step, but one more stage (linking) is still needed before anything can actually run.\n\n### How this connects\n\nYou now understand headers, guards, and the real stages a program passes through on its way to an executable. The next chapter goes deeper into linking specifically — what happens when symbols conflict, go missing, or need `extern`/`static` (Chapter 4.5) to be resolved correctly across several files.\n\n### Quick recap\n\n- A C program passes through three stages: **preprocessing** (directives resolved), **compilation** (each `.c` file becomes its own `.o` object file, independently), and **linking** (object files combined, cross-file references resolved).\n- A header file (`.h`) holds declarations meant to be shared — prototypes, type definitions, `extern` declarations — never full function definitions meant to be included by more than one `.c` file.\n- Including the same unguarded header twice causes a real \"redefinition\" error — every header needs `#ifndef`/`#define`/`#endif` guards, or the simpler, widely-supported `#pragma once`.\n- `.o` files are real compiled output, but not yet runnable — linking is still required to produce a final executable."}, {"id": "6.7", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 7, "slug": "linking-multi-file-programs", "fullTitle": "Linking & Multi-File Programs", "title": "Linking & Multi-File Programs", "md": "### Why this matters\n\nChapter 6.6 introduced the three-stage build and headers as the way declarations get shared. This chapter looks specifically at what the **linker** actually resolves — sharing not just functions but genuine global *state* across files, and the two failure modes that show up only at the linking stage, never earlier, which is exactly why they can be confusing the first time you meet them.\n\n### The core idea\n\nA global variable, like a function, has exactly one true **definition** (where its storage actually lives) and can have any number of **declarations** (promises that it exists, findable elsewhere). `extern` (Chapter 4.5) is how a variable's declaration is shared through a header without duplicating its storage in every file that includes it — the header declares it `extern`, and exactly one `.c` file provides the real definition.\n\nTwo specifically link-stage errors are worth recognizing on sight: **undefined reference** (something was declared and used, but never defined *anywhere* the linker can find) and **multiple definition** (Chapter 6.6's Example 5 — the same thing defined more than once across files). Both are the linker's job to catch, specifically because only the linker sees *all* the object files at once — the compiler, working on one file at a time, can't know what the others contain.\n\n### Examples\n\n**1. Sharing one real global variable across files — declared in a header, defined in exactly one `.c` file:**\n```c\n/* shared.h */\n#ifndef SHARED_H\n#define SHARED_H\nextern int total_count;\nvoid increment_count(void);\n#endif\n```\n```c\n/* counter.c */\n#include \"shared.h\"\nint total_count = 0;         /* the one real definition */\nvoid increment_count(void) {\n    total_count++;\n}\n```\n```c\n/* usemain.c */\n#include <stdio.h>\n#include \"shared.h\"\nint main(void) {\n    increment_count();\n    increment_count();\n    increment_count();\n    printf(\"total_count = %d\\n\", total_count);\n    return 0;\n}\n```\nCompiled and linked together (`gcc counter.c usemain.c -o externtest`), output: `total_count = 3`. `usemain.c` never defines `total_count` itself — the header's `extern int total_count;` is just a promise, and the linker connects `usemain.c`'s uses of it directly to `counter.c`'s one real, storage-holding definition.\n\n**2. A genuine \"undefined reference\" — declared and called, but its definition simply doesn't exist anywhere:**\n```c\n/* undecl.h */\nint missing_function(void);\n```\n```c\n/* undeclmain.c */\n#include \"undecl.h\"\nint main(void) {\n    return missing_function();\n}\n```\nCompiling alone succeeds — the header's declaration is enough to satisfy the compiler that the call is *syntactically* valid. Linking fails:\n```\n/usr/bin/ld: /tmp/cc.../undeclmain.o: in function `main':\nundeclmain.c:(.text+0x9): undefined reference to `missing_function'\ncollect2: error: ld returned 1 exit status\n```\nThe compiler trusted the promise; the linker went looking for the actual body and found nothing, in any of the object files it was given. This is the single most common reason a brand-new multi-file project fails to build: a function declared (often by an editor's autocomplete, or a stale header) that was never actually implemented, or whose implementation file simply wasn't included in the final link command.\n\n**3. `static` (Chapter 4.5) prevents exactly this kind of accidental cross-file collision — two files can each have their own, genuinely different `helper` without conflict:**\n```c\n/* filea.c */\nint helper(void) { return 1; }\n```\n```c\n/* fileb.c */\nint helper(void) { return 2; }\nint main(void) { return helper(); }\n```\nLinking these together fails immediately:\n```\n/usr/bin/ld: fileb.o: in function `helper':\nfileb.c:(.text+0x0): multiple definition of `helper'; filea.o:filea.c:(.text+0x0): first defined here\ncollect2: error: ld returned 1 exit status\n```\nBoth are plain, non-`static` functions — externally visible by default — so the linker sees two genuine definitions of the same name and correctly refuses to pick one. Marking each `static` fixes it completely:\n```c\n/* filea2.c */\nstatic int helper(void) { return 1; }\nint call_a(void) { return helper(); }\n```\n```c\n/* fileb2.c */\nstatic int helper(void) { return 2; }\nextern int call_a(void);\nint main(void) {\n    printf(\"call_a() = %d, local helper() = %d\\n\", call_a(), helper());\n    return 0;\n}\n```\nOutput: `call_a() = 1, local helper() = 2` — each file's `helper` stays entirely private to that file, exactly as Chapter 4.5 described, and the two never collide at link time despite sharing a name. This is a genuinely common, practical reason to mark any function `static` by default in a larger project: it's not meant to be called from another file, so it shouldn't be visible to one, and it can never accidentally clash with another file's identically-named helper.\n\n### ⚠️ Common Mistakes\n\n- **Defining the same global variable (not `extern`-declaring it) in more than one file, or in a header without `extern`.** Each file gets its own real storage, and linking then fails with the variable-level equivalent of Chapter 6.6's multiple-definition function error. The rule is the same for both: exactly one real definition, anywhere; everywhere else, a declaration only.\n- **Forgetting to actually compile and link a `.c` file that defines something another file needs.** `gcc main.c -o program` alone, when `main.c` calls a function defined in `helper.c`, produces exactly Example 2's undefined-reference error — not because the code is wrong, but because the build command simply never told the compiler `helper.c` exists. Every `.c` file with something needed elsewhere must be part of the same compile-and-link command (or pre-compiled into a `.o` and linked in, as Chapter 6.6 showed).\n- **Assuming a compile-only success (`gcc -c file.c`) means the whole program is correct.** It only proves *that one file* is internally consistent — undefined references and multiple-definition conflicts are invisible until every object file involved is linked together at once.\n- **Reaching for a global variable shared across many files as a default way to pass data around**, rather than function parameters and return values. It works, mechanically, exactly as shown — but a program with many files all reading and writing the same global state becomes hard to reason about, for the same reason Chapter 4.5's global-variable discussion already flagged: any function, anywhere, might be the one that changed it.\n\n### How this connects\n\nYou now understand exactly what the linker is resolving, and the two specific errors that only show up at that final stage. The next chapter automates the whole build — compiling several files, linking them, and rebuilding only what's actually changed — with `make`.\n\n### Quick recap\n\n- A global variable needs exactly one real **definition** (in one `.c` file); every other file that needs it gets an `extern` **declaration**, typically through a shared header.\n- **Undefined reference** — something declared and used, but never defined anywhere in the files actually being linked. Usually means a missing `.c` file in the build command, or a function that was declared but never actually implemented.\n- **Multiple definition** — the same thing defined more than once across files (Chapter 6.6). Both errors are link-stage-only; the compiler, working one file at a time, cannot see them coming.\n- Every `.c` file containing something needed elsewhere must be part of the same build — compiling one file successfully proves nothing about the whole program until everything is linked together.\n- Marking a helper function `static` by default (unless it genuinely needs to be called from another file) prevents accidental name collisions across a larger project's files entirely — two files can each safely have their own, unrelated `static` function sharing a name."}, {"id": "6.8", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 8, "slug": "building-with-make", "fullTitle": "Building with `make`", "title": "Building with `make`", "md": "### Why this matters\n\nChapter 6.6's build already needed three separate `gcc` commands for a two-file program — real projects have dozens of files, and typing every compile-and-link command by hand, correctly, every single time something changes, doesn't scale. `make` automates exactly this: it knows which files depend on which, and rebuilds only what's actually gone stale, based on file modification times.\n\n### The core idea\n\nA `Makefile` is a set of **rules**, each shaped:\n```makefile\ntarget: dependencies\n\tcommand\n```\n`target` is what gets built; `dependencies` are the files it needs; `command` is how to build it from them — and critically, **the command line must start with a literal tab character**, not spaces. `make` checks each dependency's modification time against the target's — if any dependency is newer, the command runs; if the target is already newer than everything it depends on, `make` skips it entirely, printing \"up to date\" instead of rebuilding.\n\n### Examples\n\n**1. A real `Makefile` for Chapter 6.6's two-file project:**\n```makefile\nCC = gcc\nCFLAGS = -Wall\n\ncombined: mathutil.o main.o\n\t$(CC) mathutil.o main.o -o combined\n\nmathutil.o: mathutil.c mathutil.h\n\t$(CC) $(CFLAGS) -c mathutil.c -o mathutil.o\n\nmain.o: main.c mathutil.h\n\t$(CC) $(CFLAGS) -c main.c -o main.o\n\nclean:\n\trm -f *.o combined\n```\nRunning `make` for the first time:\n```\ngcc -Wall -c mathutil.c -o mathutil.o\ngcc -Wall -c main.c -o main.o\ngcc mathutil.o main.o -o combined\n```\nAll three steps run, in dependency order — `combined` needs both `.o` files, which need their `.c`/`.h` sources.\n\n**2. Running `make` again, with nothing changed, does genuinely nothing:**\n```\nmake: 'combined' is up to date.\n```\nEvery target is already newer than its dependencies — `make` correctly determines there's no real work to do.\n\n**3. Touching just one source file rebuilds only what actually depends on it:**\n```bash\ntouch mathutil.c\nmake\n```\n```\ngcc -Wall -c mathutil.c -o mathutil.o\ngcc mathutil.o main.o -o combined\n```\n`main.c` never changed, so `main.o` is *not* recompiled — only `mathutil.o` (whose source just got a newer timestamp) rebuilds, and then the final link step reruns since `mathutil.o` is now newer than `combined`. This selective rebuilding, done correctly, is `make`'s entire reason to exist — on a project with dozens of files, this is the difference between a two-second rebuild and a two-minute one.\n\n**4. `make clean`, a target with no real file behind it — just a name for \"run this command\":**\n```\nrm -f *.o combined\n```\n`clean` isn't a file `make` is trying to build; it's what's called a **phony target** — a label for a command you want to run on demand, regardless of any file's timestamp.\n\n### ⚠️ Common Mistakes\n\n- **Using spaces instead of a tab before a command.** This is the single most common `Makefile` mistake, and `make`'s own error message is notoriously unhelpful about pointing at the real cause:\n  ```\n  Makefile:2: *** missing separator.  Stop.\n  ```\n  \"Missing separator\" means exactly one thing in practice: a command line that should start with a tab starts with spaces instead. Nearly every text editor can be configured to insert a real tab for `Makefile`s specifically — worth checking once, since this exact error is otherwise guaranteed to resurface.\n- **Forgetting a header file as a dependency.** In Example 1, both `.o` rules list `mathutil.h` as a dependency — without it, editing the header (changing a struct or function signature) wouldn't trigger a rebuild of files that `#include` it, and you'd silently compile against stale declarations.\n- **Not treating `make`'s staleness check as content-aware.** It only ever compares *modification times* — `touch`ing a file with no actual content change still counts as \"newer,\" and triggers a rebuild exactly as if real content had changed. This is usually harmless (a wasted recompile) but worth knowing precisely, rather than assuming `make` somehow diffs file contents.\n- **Naming a real target something that could collide with an actual file in the directory**, like `clean`, without declaring it phony. If a file literally named `clean` ever exists in the same folder, `make` may think the \"clean\" target is already up to date and skip running it — declaring `.PHONY: clean` at the top of the `Makefile` (a detail this book won't dwell on further) avoids that specific confusion.\n\n### How this connects\n\nYou can now organize, build, and efficiently rebuild a real multi-file C project. The next chapter shifts from structuring code across files to shaping data at the bit level — bit manipulation and bit fields, useful the moment memory footprint or hardware-level detail matters.\n\n### Quick recap\n\n- A `Makefile` rule: `target: dependencies`, then a **tab**-indented command — `make` rebuilds a target only when a dependency is newer than it already is.\n- `make` alone builds the first target in the file; running it again with nothing changed does nothing (`up to date`).\n- Touching one source file rebuilds only the targets that actually depend on it, not the whole project — this selective rebuilding is the entire point of using `make` over manual commands.\n- \"Missing separator\" almost always means spaces were used instead of a tab before a command line.\n- A **phony target** (like `clean`) is a named command, not a real file to check timestamps against."}, {"id": "6.9", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs & the build model", "chapNum": 9, "slug": "bit-manipulation-bit-fields", "fullTitle": "Bit Manipulation & Bit Fields", "title": "Bit Manipulation & Bit Fields", "md": "### Why this matters\n\nSometimes the natural unit of data isn't a whole `int` or `char` — it's a single bit, or a small handful of them: a permission flag, a hardware register, a compact set of on/off options. C gives you direct, bit-level control through a small set of operators, plus a struct feature — bit fields — for packing several small values into far less memory than separate fields would need.\n\n### The core idea\n\nFive bitwise operators, all working on the actual binary representation of their operands:\n\n- **`&`** (AND) — a result bit is `1` only where both operands have a `1`.\n- **`|`** (OR) — a result bit is `1` where either operand has a `1`.\n- **`^`** (XOR) — a result bit is `1` where the operands *differ*.\n- **`~`** (NOT) — flips every bit.\n- **`<<` / `>>`** (shift left/right) — moves every bit N positions, filling the vacated side with zeros (for `<<`, and for `>>` on an unsigned value).\n\nThese are completely different from `&&`/`||` (Chapter 1.4) — bitwise operators work bit-by-bit across a whole number; logical operators only ever care about \"zero or nonzero,\" as a single true/false answer.\n\nA **bit field**, inside a struct, requests a specific number of bits for a field rather than a whole type: `unsigned int flag : 1;` requests just one bit.\n\n### Examples\n\n**1. The five operators, on two concrete numbers:**\n```c\n#include <stdio.h>\nint main(void) {\n    unsigned int a = 12;  // 1100\n    unsigned int b = 10;  // 1010\n    printf(\"a & b = %u\\n\", a & b);\n    printf(\"a | b = %u\\n\", a | b);\n    printf(\"a ^ b = %u\\n\", a ^ b);\n    printf(\"~a (as unsigned) = %u\\n\", ~a);\n    printf(\"a << 2 = %u\\n\", a << 2);\n    printf(\"a >> 2 = %u\\n\", a >> 2);\n    return 0;\n}\n```\nOutput:\n```\na & b = 8\na | b = 14\na ^ b = 6\n~a (as unsigned) = 4294967283\na << 2 = 48\na >> 2 = 3\n```\n`12` is `1100` in binary, `10` is `1010`: `&` keeps only the shared `1`s (`1000` = `8`), `|` keeps every `1` from either (`1110` = `14`), `^` keeps only the bits that differ (`0110` = `6`). `~a` flips all 32 bits of `a`, which — printed as `unsigned` — becomes a very large number, exactly `UINT_MAX - 12` (Chapter 2.2's wraparound arithmetic, from the other direction).\n\n**2. Setting, clearing, toggling, and checking one specific bit — the standard flag-manipulation idiom:**\n```c\n#include <stdio.h>\nint main(void) {\n    unsigned int flags = 0;\n    flags |= (1 << 2);\n    printf(\"after set bit 2: %u\\n\", flags);\n    printf(\"is bit 2 set? %d\\n\", (flags & (1 << 2)) != 0);\n    flags &= ~(1 << 2);\n    printf(\"after clear bit 2: %u\\n\", flags);\n    flags ^= (1 << 3);\n    printf(\"after toggle bit 3: %u\\n\", flags);\n    flags ^= (1 << 3);\n    printf(\"after toggle bit 3 again: %u\\n\", flags);\n    return 0;\n}\n```\nOutput:\n```\nafter set bit 2: 4\nis bit 2 set? 1\nafter clear bit 2: 0\nafter toggle bit 3: 8\nafter toggle bit 3 again: 0\n```\n`1 << 2` builds a **mask** with only bit 2 set; `|=` turns that bit on without disturbing any other bit; `&= ~mask` turns it off, again without touching anything else; `^=` toggles it, whichever state it was in. This exact four-operation pattern — set, clear, toggle, check — covers the overwhelming majority of real-world bit manipulation.\n\n**3. Bit fields pack several small values into far less space than separate fields would need:**\n```c\n#include <stdio.h>\nstruct FlagsPlain {\n    unsigned int a;\n    unsigned int b;\n    unsigned int c;\n};\nstruct FlagsPacked {\n    unsigned int a : 1;\n    unsigned int b : 1;\n    unsigned int c : 1;\n};\nint main(void) {\n    printf(\"sizeof(struct FlagsPlain) = %zu\\n\", sizeof(struct FlagsPlain));\n    printf(\"sizeof(struct FlagsPacked) = %zu\\n\", sizeof(struct FlagsPacked));\n    struct FlagsPacked f = {1, 0, 1};\n    printf(\"a=%u b=%u c=%u\\n\", f.a, f.b, f.c);\n    return 0;\n}\n```\nOutput:\n```\nsizeof(struct FlagsPlain) = 12\nsizeof(struct FlagsPacked) = 4\na=1 b=0 c=1\n```\nThree whole `unsigned int`s cost 12 bytes; three single-bit fields cost 4 — all three genuinely fit inside one `int`'s worth of storage, and each field is still accessed exactly like an ordinary struct field (`f.a`), with the bit-packing entirely invisible at the point of use.\n\n### ⚠️ Common Mistakes\n\n- **`&`/`|` binding looser than `==`, silently breaking a comparison inside a bitwise expression:**\n  ```c\n  if (flags & MASK == 4) { ... }\n  ```\n  ```\n  warning: suggest parentheses around comparison in operand of '&'\n  ```\n  This is parsed as `flags & (MASK == 4)`, not `(flags & MASK) == 4` — almost never what's intended. GCC's own warning names the fix directly: add the parentheses yourself, always, whenever `&`/`|` and a comparison appear in the same expression.\n- **Typing `&`/`|` when `&&`/`||` was meant, or vice versa.** They can produce wildly different results, not just a subtly different one:\n  ```c\n  int a = 2, b = 4;\n  printf(\"%d\\n\", a && b);  // 1 — both nonzero, true\n  printf(\"%d\\n\", a & b);   // 0 — 010 AND 100 shares no bits\n  ```\n  A single missing (or extra) `&`/`|` character compiles cleanly either way, silently computing something entirely different — there's no syntax error to catch this for you.\n- **Assuming bit field memory layout (which bits come first, how fields pack across byte boundaries) is portable across compilers.** It's implementation-defined, exactly like Chapter 6.2's struct padding — bit fields are excellent for compact in-memory storage within one program, but not a safe way to define a portable binary format shared across different compilers or platforms.\n- **Right-shifting a negative signed number and assuming it always fills with zeros.** Unlike an unsigned right shift, a signed one is implementation-defined — it may fill with the sign bit (arithmetic shift) or with zeros (logical shift) depending on the platform. Stick to unsigned types when the exact shift behavior matters.\n\n### How this connects\n\nPart VI is complete — structs, unions, enums, `typedef`, self-reference, multi-file organization, and now bit-level control. Part VII turns to the standard library C ships with: `<string.h>`, `<stdlib.h>`, file I/O, and the rest of the toolbox every real C program draws on.\n\n### Quick recap\n\n- `&`, `|`, `^`, `~`, `<<`, `>>` operate bit-by-bit on a number's actual binary representation — completely different from `&&`/`||`'s single true/false answer.\n- The standard flag idiom: `flags |= mask` (set), `flags &= ~mask` (clear), `flags ^= mask` (toggle), `flags & mask` (check) — build `mask` with `1 << n` for a specific bit position.\n- `&`/`|` bind more loosely than `==` — always parenthesize a comparison combined with a bitwise operator; GCC's own warning flags this specific trap.\n- Bit fields (`unsigned int name : bits;`) pack several small values into far less memory than separate fields — but their exact layout is implementation-defined, not a safe portable binary format."}, {"id": "7.1", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the C standard library", "chapNum": 1, "slug": "string-h-string-manipulation-functions", "fullTitle": "`<string.h>`: String Manipulation Functions", "title": "`<string.h>`: String Manipulation Functions", "md": "### Why this matters\n\nChapter 2.5 established that a C string is just a `char` array ending in `\\0`, with nothing built into the language itself for copying, comparing, or searching one. `<string.h>` is that missing toolbox — a real, standard set of functions every C program relies on, each one ultimately just walking bytes until it finds `\\0`, exactly as Chapter 2.5's manual example did by hand.\n\n### The core idea\n\nThe essentials: **`strlen`** (length, already used since Chapter 2.5), **`strcpy`**/**`strncpy`** (copy), **`strcat`**/**`strncat`** (concatenate, appending onto the end of an existing string), **`strcmp`**/**`strncmp`** (compare — returning negative/zero/positive, not just true/false), **`strchr`**/**`strstr`** (search for a character or substring), and the lower-level **`memcpy`**/**`memmove`**/**`memset`** (raw byte operations, not string-aware — they don't stop at `\\0`, they copy exactly the byte count given).\n\n### Examples\n\n**1. `strncpy`'s own, separate gotcha — it's meant to be `strcpy`'s \"safer\" cousin, but it has a sharp edge of its own:**\n```c\n#include <stdio.h>\n#include <string.h>\nint main(void) {\n    char dest[5];\n    strncpy(dest, \"HelloWorld\", 5);\n    printf(\"dest as string: %.10s (may not be terminated!)\\n\", dest);\n    printf(\"dest[4] = %d (last byte, no room for null terminator)\\n\", dest[4]);\n\n    char dest2[10];\n    strncpy(dest2, \"Hi\", sizeof(dest2));\n    printf(\"dest2 = '%s' (this one IS properly terminated, source was shorter)\\n\", dest2);\n    return 0;\n}\n```\nGCC itself flags the first call directly:\n```\nwarning: 'strncpy' output truncated copying 5 bytes from a string of length 10 [-Wstringop-truncation]\n```\nOutput:\n```\ndest as string: Hello (may not be terminated!)\ndest[4] = 111 (last byte, no room for null terminator)\ndest2 = 'Hi' (this one IS properly terminated, source was shorter)\n```\n`strncpy` genuinely stops `strcpy`'s classic overflow (Chapter 5.8) — it will never write past `n` bytes — but it does **not** guarantee a null terminator if the source is `n` bytes or longer: `dest` ends up holding exactly `\"Hello\"`'s 5 characters, with no room left for `\\0` at all (`dest[4]` is `'o'`, value `111`, not `0`). `dest2`, given a source shorter than its limit, *does* get a proper terminator, because `strncpy` pads the rest with `\\0`. The safety `strncpy` offers is real, but it's \"won't overflow,\" not \"will always give you a valid string\" — that second guarantee needs an explicit manual check or an extra byte reserved for `'\\0'` yourself.\n\n**2. `strcmp` returns negative, zero, or positive — not simply true or false:**\n```c\n#include <stdio.h>\n#include <string.h>\nint main(void) {\n    printf(\"strcmp(\\\"apple\\\", \\\"apple\\\") = %d\\n\", strcmp(\"apple\", \"apple\"));\n    printf(\"strcmp(\\\"apple\\\", \\\"banana\\\") = %d\\n\", strcmp(\"apple\", \"banana\"));\n    printf(\"strcmp(\\\"banana\\\", \\\"apple\\\") = %d\\n\", strcmp(\"banana\", \"apple\"));\n    return 0;\n}\n```\nOutput:\n```\nstrcmp(\"apple\", \"apple\") = 0\nstrcmp(\"apple\", \"banana\") = -1\nstrcmp(\"banana\", \"apple\") = 1\n```\n`0` means equal (this is exactly what Chapter 2.5's `== `-vs-`strcmp` comparison relied on); a negative result means the first string sorts *before* the second; positive means *after* — the exact magnitude isn't meaningful, only its sign, which is why `strcmp(...) == 0` is the correct equality check, not `strcmp(...) == 1` or any other specific number.\n\n**3. Searching for a character or a substring:**\n```c\n#include <stdio.h>\n#include <string.h>\nint main(void) {\n    const char *s = \"hello world\";\n    char *p1 = strchr(s, 'w');\n    printf(\"strchr found: %s\\n\", p1);\n    char *p2 = strstr(s, \"world\");\n    printf(\"strstr found: %s\\n\", p2);\n    char *p3 = strstr(s, \"xyz\");\n    printf(\"strstr not found: %s\\n\", p3 == NULL ? \"(NULL)\" : p3);\n    return 0;\n}\n```\nOutput:\n```\nstrchr found: world\nstrstr found: world\nstrstr not found: (NULL)\n```\nBoth return a pointer *into* the original string, at the point the match starts — printing it with `%s` naturally shows \"the rest of the string from there on,\" since `%s` prints until the next `\\0`, which is still the original string's own terminator. Not found means `NULL`, always worth checking before using the result (Chapter 5.2).\n\n**4. `memcpy` assumes non-overlapping memory; `memmove` handles overlap correctly — a real, visible difference, not a theoretical one:**\n```c\n#include <stdio.h>\n#include <string.h>\nint main(void) {\n    char buf1[20] = \"ABCDEFGHIJKLMNOPQRS\";\n    memcpy(buf1 + 5, buf1, 10);\n    printf(\"memcpy result:   %s\\n\", buf1);\n\n    char buf2[20] = \"ABCDEFGHIJKLMNOPQRS\";\n    memmove(buf2 + 5, buf2, 10);\n    printf(\"memmove res
