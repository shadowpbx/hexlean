latform. Always include the header the function you're using actually belongs to.\n- **Writing `void main()` instead of `int main(void)`.** It compiles on some setups (a few compilers tolerate it), but it isn't standard C, and it throws away the exit-status mechanism entirely. Always use `int main(void)` or `int main(int argc, char *argv[])`.\n- **Mismatched curly braces** — a `{` with no matching `}` (or vice versa) anywhere in the file produces a compiler error, often reported far below the actual missing brace, sometimes at the very end of the file. If an error mentions the last line of your file and nothing there looks wrong, count your braces.\n\n### How this connects\n\nEvery chapter from here treats this skeleton — `#include`, `int main(void) { ... return 0; }` — as known. The next chapter looks at comments: how to leave notes in your code that the compiler ignores entirely, and the conventions around structuring a file as it grows past a handful of lines.\n\n### Quick recap\n\n- Every C program needs exactly one `main` function — the entry point the operating system calls.\n- `#include` is a *preprocessor* directive (no semicolon), pulling in declarations like `printf`'s from a header file.\n- Statements end in semicolons; a missing one produces a compiler error, often reported one line later than the actual mistake.\n- `return N;` inside `main` becomes the program's exit status — `0` conventionally means success, checkable with `$?` just like any other program.\n- `main` alone is exempt from needing an explicit `return` (C99+, falls off the end as `return 0;`) — every other function is not; write it explicitly anyway.\n- Forgetting a needed `#include` often only warns, not errors — and a program that \"happens to work\" without one is relying on undefined behavior, not a guarantee."}, {"id": "1.2", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 2, "slug": "comments-program-structure", "fullTitle": "Comments & Program Structure", "title": "Comments & Program Structure", "md": "### Why this matters\n\nCode gets read far more often than it gets written — by other people, and by you in six months, having forgotten exactly why you did something. Comments are how you leave notes for that future reader. And as a `.c` file grows past a handful of lines, having a consistent, predictable shape to it (what goes first, what goes last) makes every file you open afterward easier to navigate, including ones other people wrote.\n\n### The core idea\n\nC has two comment styles:\n\n- **Line comments** — `//` and everything after it on that line is ignored.\n- **Block comments** — `/* ... */`, ignored no matter how many lines it spans.\n\nBoth are stripped out before your code is ever really compiled — the compiler itself never sees them at all, so they cost nothing at runtime and can say absolutely anything.\n\nA typical `.c` file, top to bottom, follows a loose but common order: `#include` directives first, then any `#define` constants, then the file's functions — often with `main` either first (with helper functions declared above it, or *forward-declared*, a topic Chapter 4.2 covers properly) or last (with everything it calls already defined above it). This book will mostly put `main` last for exactly that reason: nothing in it needs a forward declaration to compile.\n\n### Examples\n\n**1. Line comments:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    // Print a friendly greeting.\n    printf(\"Hello!\\n\"); // this part of the line is also ignored\n    return 0;\n}\n```\n\n**2. Block comments**, useful for multi-line explanations or temporarily disabling a chunk of code:\n```c\n#include <stdio.h>\n\n/*\n * This program demonstrates block comments.\n * They can span as many lines as you like.\n */\nint main(void) {\n    printf(\"Real output.\\n\");\n    /*\n    printf(\"This line never runs — commented out.\\n\");\n    */\n    return 0;\n}\n```\n\n**3. A small file with `main` last**, calling a helper defined above it:\n```c\n#include <stdio.h>\n\n// Returns the larger of two integers.\nint max_of(int a, int b) {\n    return (a > b) ? a : b;\n}\n\nint main(void) {\n    printf(\"Bigger: %d\\n\", max_of(3, 7));\n    return 0;\n}\n```\nCompiling and running this prints `Bigger: 7` — confirmed by actually running it. Chapter 4.2 explains what happens if you want to call `max_of` from *above* its definition instead.\n\n### ⚠️ Common Mistakes\n\n- **Nesting `/* */` block comments** — C block comments don't nest. The *first* `*/` ends the comment, no matter how many `/*` came before it, so `/* outer /* inner */ still code here */` leaves `still code here */` as real, uncommented code — which then fails to compile:\n  ```\n  error: unknown type name 'still'\n  error: expected '=', ',', ';', 'asm' or '__attribute__' before 'here'\n  ```\n  This is a classic real-world bug: commenting out a block of code to disable it temporarily, not noticing that block already contains its own `/* */` comment inside it, and accidentally un-commenting the tail end. When in doubt, disable a block with `#if 0 ... #endif` instead (covered in Chapter 2.8) or use `//` on every line.\n- **Forgetting to close a block comment** swallows everything after it — including, potentially, the rest of the file — until either a stray `*/` is found or the file simply ends:\n  ```\n  error: unterminated comment\n  error: expected declaration or statement at end of input\n  ```\n  If a file suddenly has a wall of confusing errors near its very end, check for an unclosed `/*` further up.\n- **Commenting instead of naming things well.** A comment that just restates what the next line obviously does (`// increment i` above `i++;`) adds noise, not clarity. The best comments explain *why*, not *what* — save them for the parts of your code where the reasoning genuinely isn't obvious from reading it.\n\n### How this connects\n\nYou now know how to annotate code and roughly how a file is laid out. The next chapter puts real content inside that structure: declaring variables and giving them values, C's actual basic types.\n\n### Quick recap\n\n- `//` comments out the rest of the line; `/* ... */` comments out everything between, across as many lines as needed.\n- Comments are removed before compilation — the compiler never sees them, and they never affect what the program does.\n- A typical file: `#include`s, then `#define`s, then functions — `main` can come first (with forward declarations above it) or last (with everything it calls already defined).\n- Block comments don't nest — the first `*/` ends the comment, which is a classic way to accidentally un-comment code you meant to disable.\n- Comment the *why*, not the *what* — a comment that just repeats the code next to it isn't earning its keep."}, {"id": "1.3", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 3, "slug": "variables-basic-types", "fullTitle": "Variables & Basic Types", "title": "Variables & Basic Types", "md": "### Why this matters\n\nIn Bash or Python, a variable just holds whatever you put in it, and the language figures out the rest. C asks more of you up front: every variable has a fixed **type**, declared the moment you create it, and that type decides how much memory it takes and what kind of value it can hold. This isn't bureaucracy for its own sake — it's what lets C know exactly how many bytes to set aside and exactly how to interpret them, which is the foundation everything else in this book builds on.\n\n### The core idea\n\nDeclaring a variable in C looks like:\n```c\ntype name = value;\n```\nThe four basic types you'll use constantly:\n\n- **`int`** — a whole number (`42`, `-7`, `0`).\n- **`float`** — a single-precision decimal number (`3.14f` — note the trailing `f`).\n- **`double`** — a double-precision decimal number, C's default for decimals (`3.14159`), roughly twice `float`'s precision.\n- **`char`** — a single character, written in single quotes (`'A'`), really stored as a small integer under the hood (Chapter 2.4 explains exactly how).\n\nC99 added a real boolean type, `_Bool`, but almost nobody writes `_Bool` directly — instead you `#include <stdbool.h>` and get the friendlier names `bool`, `true`, and `false`. Without that include, `bool` isn't a recognized word in C at all — it's not a built-in keyword the way it is in Python.\n\nThe `sizeof` operator tells you exactly how many bytes a type (or variable) occupies on your specific system — it can genuinely vary between machines, which is exactly why you ask rather than assume.\n\n**Naming a variable** follows rules that are strict but easy to remember: letters, digits, and underscores only, it can't start with a digit, it's case-sensitive (`score` and `Score` are two different variables), and it can't be one of C's reserved keywords (`int`, `return`, `for`, and so on — words the language itself needs).\n\n### Examples\n\n**1. Declaring, initializing, and printing each basic type:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    int age = 30;\n    float price = 19.99f;\n    double pi = 3.14159265358979;\n    char grade = 'A';\n\n    printf(\"age = %d, size = %zu bytes\\n\", age, sizeof(age));\n    printf(\"price = %f, size = %zu bytes\\n\", price, sizeof(price));\n    printf(\"pi = %f, size = %zu bytes\\n\", pi, sizeof(pi));\n    printf(\"grade = %c, size = %zu bytes\\n\", grade, sizeof(grade));\n    return 0;\n}\n```\nOutput, confirmed by actually running it:\n```\nage = 30, size = 4 bytes\nprice = 19.990000, size = 4 bytes\npi = 3.141593, size = 8 bytes\ngrade = A, size = 1 bytes\n```\nTwo things worth noticing already: `%f` always prints six decimal places by default, regardless of how many you typed — that's a `printf` formatting default, not a sign your value lost precision (Chapter 2.9 covers controlling this). And `sizeof` returns a special unsigned type, printed with `%zu`, not `%d` — using the wrong specifier here is exactly the kind of small mismatch Chapter 2.9 will teach you to avoid.\n\n**2. `bool`, once you include `<stdbool.h>`:**\n```c\n#include <stdio.h>\n#include <stdbool.h>\n\nint main(void) {\n    bool is_ready = true;\n    bool has_error = false;\n    printf(\"is_ready = %d, size = %zu bytes\\n\", is_ready, sizeof(is_ready));\n    printf(\"has_error = %d\\n\", has_error);\n    return 0;\n}\n```\nOutput:\n```\nis_ready = 1, size = 1 bytes\nhas_error = 0\n```\n`true` and `false` are really just `1` and `0` — `%d` prints them as plain integers because that's genuinely what they are underneath the friendlier names.\n\n**3. Case sensitivity, and declaring more than one variable at once:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    int score = 10, Score = 20;\n    printf(\"score=%d Score=%d\\n\", score, Score);\n    return 0;\n}\n```\nOutput: `score=10 Score=20` — two entirely distinct variables, differing only in capitalization. Legal, but a genuinely bad idea in real code for the obvious readability reason; the example exists to make the rule concrete, not to recommend the style.\n\n### ⚠️ Common Mistakes\n\n- **Using a variable before giving it a value.** Unlike Python, C does *not* stop you from declaring a variable and reading it before it's ever assigned — you just get whatever bytes happened to already be sitting in that memory, which is unpredictable and can even change between runs:\n  ```c\n  int mystery;\n  printf(\"mystery = %d\\n\", mystery);\n  ```\n  Two actual runs of this exact program printed `32764` and then `32766` — different both times, and different again on a different machine. The compiler does warn about this (`'mystery' is used uninitialized`) — never ignore that specific warning. Always initialize a variable at the point you declare it, or immediately after, before reading it.\n- **Declaring the same variable twice in the same scope** is a compiler error, not a silent overwrite:\n  ```\n  error: redefinition of ‘count’\n  note: previous definition of ‘count’ with type ‘int’\n  ```\n  If you need to change a variable's value later, just assign to it (`count = 10;`), without repeating `int`.\n- **Using `bool`, `true`, or `false` without `#include <stdbool.h>`** — C has no built-in notion of these names without it:\n  ```\n  error: unknown type name ‘bool’\n  note: ‘bool’ is defined in header ‘<stdbool.h>’; did you forget to ‘#include <stdbool.h>’?\n  ```\n  The error message is unusually helpful here and tells you exactly what to add.\n- **Starting a name with a digit** (`int 2fast = 5;`) doesn't even produce a sensible error — the compiler tries to parse `2` as a number and `fast` as a stray suffix on it, producing a confusing `invalid suffix \"fast\" on integer constant` rather than anything mentioning variable names directly. If a numeric-literal error mentions a word that looks like it should've been a variable name, check for a leading digit.\n- **Using a reserved keyword as a variable name** (`int int = 5;`) fails for the same underlying reason: the compiler reads `int` as the start of *another* type declaration, not a name, producing a cascade of confusing errors (`two or more data types in declaration specifiers`) that don't obviously point at \"you used a reserved word.\"\n- **Forgetting the `f` suffix on a `float` literal.** `float price = 19.99;` still compiles — the literal `19.99` is actually a `double` by default, silently narrowed down to fit in `price`'s `float` — but it's a habit worth having correctly from the start; Chapter 2.3 explains exactly why the suffix matters more than it looks like it should.\n\n### How this connects\n\nYou now have real values with real types sitting in memory. The next chapter is what you actually *do* with them: C's arithmetic, comparison, and logical operators.\n\n### Quick recap\n\n- Every C variable has a fixed type, declared with `type name = value;`; the type determines its size and what it can hold.\n- Names: letters/digits/underscores only, no leading digit, case-sensitive, and never a reserved keyword — violations often produce confusing errors that don't obviously point at the real problem.\n- Core basic types: `int`, `float`, `double`, `char` — plus `bool`/`true`/`false` from `<stdbool.h>` (really `_Bool` underneath, always `1` or `0`).\n- `sizeof(x)` reports the real size in bytes on your system, printed with `%zu`, not `%d`.\n- An uninitialized variable holds unpredictable leftover bytes, not a safe default like `0` — always initialize before reading.\n- Redeclaring the same name in the same scope is a compiler error; forgetting `#include <stdbool.h>` before using `bool` is too."}, {"id": "1.4", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 4, "slug": "operators-arithmetic-relational-logical-assignment", "fullTitle": "Operators: Arithmetic, Relational, Logical & Assignment", "title": "Operators: Arithmetic, Relational, Logical & Assignment", "md": "### Why this matters\n\nVariables that just sit there aren't very useful — operators are how you actually compute something with them: add two numbers, compare two values, decide whether several conditions are all true at once. C's operators mostly look like what you'd expect from school math, but a few of them behave in ways that surprise people coming from other languages, and those specific surprises are worth catching now rather than as a bug three chapters from now.\n\n### The core idea\n\nFour families of operators cover almost everything you'll write:\n\n- **Arithmetic**: `+` `-` `*` `/` `%` (modulo — remainder after division, integers only).\n- **Relational**: `==` `!=` `<` `>` `<=` `>=` — each produces `1` (true) or `0` (false).\n- **Logical**: `&&` (and), `||` (or), `!` (not) — combine or invert conditions, also producing `1`/`0`.\n- **Assignment**: `=`, plus the compound forms `+=` `-=` `*=` `/=` `%=` that combine an operation with assignment (`x += 5;` means `x = x + 5;`), and `++`/`--` to increment or decrement by exactly one.\n\nThe single most important thing to internalize early: `/` between two `int`s **truncates**, it doesn't round — `7 / 2` is `3`, not `3.5`. To get a real decimal result, at least one side needs to actually be a floating-point value.\n\n### Examples\n\n**1. Integer division truncates; modulo's sign follows the dividend:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    printf(\"7 / 2 = %d\\n\", 7 / 2);\n    printf(\"7.0 / 2 = %f\\n\", 7.0 / 2);\n    printf(\"7 %% 2 = %d\\n\", 7 % 2);\n    printf(\"-7 %% 2 = %d\\n\", -7 % 2);\n    printf(\"7 %% -2 = %d\\n\", 7 % -2);\n    return 0;\n}\n```\nOutput:\n```\n7 / 2 = 3\n7.0 / 2 = 3.500000\n7 % 2 = 1\n-7 % 2 = -1\n7 % -2 = 1\n```\nNotice `%%` in the format string — since `%` normally introduces a format specifier for `printf` itself, a literal `%` in the output needs to be written twice. Also notice: the sign of the result follows the *dividend* (the left-hand side), not the divisor — `-7 % 2` is `-1`, and `7 % -2` is `1`.\n\n**2. Short-circuit evaluation.** `&&` and `||` stop evaluating as soon as the overall result is already known — the right-hand side is never even called if it can't change the answer:\n```c\n#include <stdio.h>\n\nint noisy_true(void) {\n    printf(\"noisy_true called\\n\");\n    return 1;\n}\n\nint main(void) {\n    if (1 || noisy_true()) {\n        printf(\"condition true\\n\");\n    }\n    if (0 && noisy_true()) {\n        printf(\"condition true\\n\");\n    } else {\n        printf(\"condition false\\n\");\n    }\n    return 0;\n}\n```\nOutput:\n```\ncondition true\ncondition false\n```\n`noisy_true` is never called, either time — confirmed by its own `printf` never appearing. This matters beyond curiosity: it's exactly what makes a pattern like `if (ptr != NULL && ptr->value > 0)` safe. If `ptr` is `NULL`, the left side is false, `&&` short-circuits, and the right side (which would crash on a `NULL` pointer) never runs. You'll meet this pattern for real once pointers are introduced in Part V.\n\n**3. Prefix vs. postfix increment genuinely differ.** `x++` returns `x`'s *old* value, then increments it; `++x` increments first, then returns the *new* value:\n```c\n#include <stdio.h>\n\nint main(void) {\n    int a = 5;\n    int b = a++;\n    int c = 5;\n    int d = ++c;\n    printf(\"a=%d b=%d\\n\", a, b);\n    printf(\"c=%d d=%d\\n\", c, d);\n    return 0;\n}\n```\nOutput:\n```\na=6 b=5\nc=6 d=6\n```\nBoth `a` and `c` end up at `6` either way — the difference only shows up in what gets handed to `b` and `d` at the moment of assignment.\n\n### ⚠️ Common Mistakes\n\n- **Writing `=` when you meant `==`.** `if (x = 0)` doesn't compare `x` to `0` — it *assigns* `0` to `x`, and then tests the assignment's own result (`0`, which is false):\n  ```\n  warning: suggest parentheses around assignment used as truth value\n  ```\n  followed by `x` genuinely being overwritten. Always double-check a lone `=` inside a condition — GCC's warning here is worth never silencing.\n- **Expecting `/` to give a decimal result between two integers.** `7 / 2` is `3`, full stop — the fractional part isn't rounded, it's discarded entirely. If you need `3.5`, at least one operand must be a `float`/`double` (or explicitly cast — Chapter 2.1 covers casting properly), e.g. `7.0 / 2`.\n- **Using `%` on floating-point numbers.** `%` is defined for integers only; the compiler will reject `3.5 % 2` outright, pointing you toward `fmod()` from `<math.h>` instead (Chapter 7.3).\n- **Modifying the same variable twice in one unsequenced expression**, like `i = i++ + ++i;`. Unlike the two separate, sequenced statements in Example 3, cramming multiple increments of the *same* variable into one expression without a defined order between them is undefined behavior in C — the compiler is allowed to produce any result at all, and different compilers genuinely disagree. Keep each variable's modifications in their own statement.\n\n### How this connects\n\nYou can now compute and compare values. The next chapter looks at literals and constants — values that never change — and the distinction between a `#define`d constant and one declared `const`.\n\n### Quick recap\n\n- Arithmetic: `+ - * / %`; relational: `== != < > <= >=`; logical: `&& || !`; assignment: `=` and its compound forms `+= -= *= /= %=`, plus `++`/`--`.\n- Integer `/` truncates toward zero (`7 / 2` is `3`); make at least one operand floating-point for a real decimal result.\n- `%`'s result sign follows the *dividend*, not the divisor, and it only works on integers.\n- `&&`/`||` short-circuit — the right-hand side isn't evaluated once the overall result is already known, which is what makes patterns like `ptr != NULL && ptr->value` safe.\n- `x++` yields the old value then increments; `++x` increments then yields the new value — both leave `x` the same afterward, they only differ in what's handed back at that moment.\n- `if (x = 0)` is a real, easy-to-make bug — the compiler's parentheses warning is trying to save you from it, always investigate rather than ignore."}, {"id": "1.5", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 5, "slug": "constants-literals", "fullTitle": "Constants & Literals", "title": "Constants & Literals", "md": "### Why this matters\n\nSome values in a program should never change once set — the size of a fixed-length buffer, a mathematical constant, a maximum retry count. Writing the same bare number (a \"magic number\") in five different places invites exactly one of them to get updated later while the other four are forgotten. C gives you two different ways to name a value instead, and they behave differently enough that picking the right one matters.\n\n### The core idea\n\n**`#define NAME value`** — a preprocessor directive (Chapter 2.8 covers the preprocessor properly). Before your code is even compiled, every occurrence of `NAME` in the rest of the file is replaced with `value`, as pure text. It has no type, and the compiler proper never even sees the name `NAME` — only whatever it was replaced with.\n\n**`const type name = value;`** — a real, typed variable that the compiler enforces can't be reassigned after it's initialized. It respects scope like any other variable, and produces a normal compiler error if you try to change it.\n\nA **literal** is a value written directly into your code — `42`, `3.14f`, `'A'`, `0x1A`. Integer literals can be written in more than one base: plain digits are decimal, a leading `0x` (or `0X`) means hexadecimal, and a leading `0` alone means octal. Suffixes control exactly what type a numeric literal is: `L`/`UL`/`LL`/`ULL` for `long`/`unsigned long`/`long long`/`unsigned long long` integers, and `f` for `float` (a plain decimal literal like `3.14` is a `double` by default, as you saw in Chapter 1.3).\n\n### Examples\n\n**1. Integer literal bases and type suffixes:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    int hex = 0x1A;\n    int oct = 012;\n    long big = 100000L;\n    unsigned long ubig = 100000UL;\n    long long huge = 10000000000LL;\n    float f = 3.14f;\n    printf(\"hex=%d oct=%d big=%ld ubig=%lu huge=%lld f=%f\\n\",\n           hex, oct, big, ubig, huge, f);\n    return 0;\n}\n```\nOutput:\n```\nhex=26 oct=10 big=100000 ubig=100000 huge=10000000000 f=3.140000\n```\n`0x1A` is `26` in decimal; `012` (leading zero, no `x`) is octal — `10` in decimal, *not* twelve. That leading-zero-means-octal rule catches people constantly, and it's worth remembering on sight.\n\n**2. `#define` vs. `const`, and only one of them actually stops you:**\n```c\n#include <stdio.h>\n#define PI_DEFINE 3.14159\n\nint main(void) {\n    const double pi_const = 3.14159;\n    printf(\"define: %f, const: %f\\n\", PI_DEFINE, pi_const);\n    pi_const = 3.0;\n    return 0;\n}\n```\nCompiling this produces a real error, and it's on the line that tries to reassign:\n```\nerror: assignment of read-only variable ‘pi_const’\n```\n`#define`d names carry no such protection at all — since `PI_DEFINE` is gone (replaced by `3.14159`) before the compiler proper even runs, there's nothing left called `PI_DEFINE` for it to protect.\n\n### ⚠️ Common Mistakes\n\n- **Naming a variable the same as an existing `#define`d macro.** Because `#define` is pure text substitution, this doesn't produce a sensible \"name already used\" error — it produces something much stranger:\n  ```c\n  #define MAX 100\n\n  int main(void) {\n      int MAX = 5;   // the preprocessor already turned this into \"int 100 = 5;\"\n      ...\n  ```\n  ```\n  error: expected identifier or ‘(’ before numeric constant\n  note: in expansion of macro ‘MAX’\n  ```\n  The error points at the `#define` line itself, not the line that actually caused the problem — because by the time the compiler runs, your `int MAX = 5;` has already silently become `int 100 = 5;`. This is exactly why all-caps names are a near-universal convention for `#define`d constants: seeing `MAX` in all caps is a visual signal \"this isn't a real variable, don't reuse this name.\"\n- **Forgetting a leading `0` means octal.** `int oct = 012;` is `10`, not twelve — a genuinely common source of off-by-value bugs when someone zero-pads a number for alignment in their source code without realizing it changes the value.\n- **Assuming a bare decimal literal matches the type you're assigning it to.** `float price = 19.99;` compiles, but `19.99` on its own is a `double`; only the `f` suffix (`19.99f`) makes it a `float` literal directly, as Chapter 1.3 mentioned.\n- **Reaching for `#define` out of habit for something that's really just a typed constant.** `const` gives you type checking, scoping, and a debugger that can actually show you the name and its value; `#define` gives you neither. Prefer `const` for values with a real, singular type; `#define` still earns its keep for things that aren't naturally typed values at all — conditional-compilation flags, for instance, which Chapter 2.8 covers.\n\n### How this connects\n\nYou now know how to name a value that shouldn't change, and how numbers can be written in different bases. Part I is complete — you can write, compile, comment, declare, compute with, and now name constants in a real C program. Part II starts putting real *data* in your hands: deeper type conversion, strings, and arrays.\n\n### Quick recap\n\n- `#define NAME value` — untyped, scope-blind text substitution before compilation; `const type name = value;` — a real, typed variable the compiler stops you from reassigning.\n- Integer literals: plain digits are decimal, `0x`/`0X` is hexadecimal, a lone leading `0` is octal (a common trap for zero-padded numbers).\n- Suffixes fix a literal's exact type: `L`/`UL`/`LL`/`ULL` for integers, `f` for `float` — an unsuffixed decimal literal is always `double`.\n- Reusing a `#define`d name as a variable name produces confusing errors pointing at the `#define` line, not your variable — the all-caps convention for macro constants exists specifically to prevent this collision.\n- Prefer `const` for real typed values; keep `#define` for things that genuinely aren't values with a single type, like conditional-compilation flags."}, {"id": "2.1", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 1, "slug": "type-conversion-casting", "fullTitle": "Type Conversion & Casting", "title": "Type Conversion & Casting", "md": "### Why this matters\n\nReal code constantly mixes types in one expression — an `int` divided by a `float`, a `double` assigned into an `int` variable, a `char` used in arithmetic. C never refuses to compile this; instead it silently converts one or both values according to a fixed set of rules. Knowing those rules is the difference between \"the compiler did exactly what I expected\" and a bug that only shows up with specific input values, months later.\n\n### The core idea\n\n**Implicit conversion** happens automatically, with no code from you, whenever an expression mixes types — C promotes the \"smaller\" or \"less precise\" type up to match the other, then computes. Assigning across types works the same way in reverse: assigning a `double` into an `int` variable converts it to fit, whether or not that loses information.\n\n**Explicit conversion (casting)** is you telling the compiler exactly what conversion you want, with `(type)expression`, rather than leaving it to the implicit rules. Casting doesn't make a conversion any less lossy — it just makes it visible and deliberate in the source, which is exactly why experienced C programmers reach for it: not to enable something implicit conversion couldn't already do, but to tell the next reader \"yes, this narrowing is intentional.\"\n\nThe single rule worth memorizing: converting a floating-point value to an integer type **truncates toward zero** — it discards the fractional part entirely, it does not round, and it rounds *up* for negative numbers in the sense of moving toward zero (`-3.99` becomes `-3`, not `-4`).\n\n### Examples\n\n**1. Implicit promotion in mixed arithmetic, and truncation on assignment:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    int a = 5;\n    float b = 2.0f;\n    printf(\"a / b = %f\\n\", a / b);   // int promoted to float first\n    printf(\"a / 2 = %d\\n\", a / 2);   // both int: truncating division\n\n    double d = 3.99;\n    int truncated = d;\n    printf(\"truncated = %d\\n\", truncated);\n\n    double neg = -3.99;\n    int negtrunc = neg;\n    printf(\"negtrunc = %d\\n\", negtrunc);\n\n    char c = 'A';\n    int x = c + 1;\n    printf(\"c + 1 = %d\\n\", x);\n    return 0;\n}\n```\nOutput:\n```\na / b = 2.500000\na / 2 = 2\ntruncated = 3\nnegtrunc = -3\nc + 1 = 66\n```\n`a / b` promotes `a` to `float` before dividing, giving a real `2.5`; `a / 2` stays pure integer division, giving `2` — same variable, different result, purely because of what it's paired with. `3.99` truncates to `3`, and `-3.99` truncates to `-3` (toward zero, not \"down\"). And `c + 1` shows something important for later: `char` gets promoted to `int` the moment it's used in arithmetic — `'A'` is really the integer `65` underneath (Chapter 2.4 explains exactly why), so `c + 1` is `66`.\n\n**2. Explicit casting, and what happens when a value doesn't fit the target type:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    double pi = 3.14159;\n    int i = (int)pi;\n    printf(\"(int)pi = %d\\n\", i);\n\n    int big = 300;\n    unsigned char narrow = (unsigned char)big;\n    printf(\"narrow = %d\\n\", narrow);\n    return 0;\n}\n```\nOutput:\n```\n(int)pi = 3\nnarrow = 44\n```\n`(int)pi` is the same truncation-toward-zero rule, just written explicitly. `narrow` is more interesting: `unsigned char` can only hold `0`–`255`, and `300` doesn't fit — the real result, `44`, is `300` wrapped around modulo `256` (`300 - 256 = 44`). This wraparound behavior for unsigned types is well-defined by the C standard, not a bug — Chapter 2.2 explains exactly why unsigned overflow behaves this way while *signed* overflow does not.\n\n### ⚠️ Common Mistakes\n\n- **Assigning a `double` to an `int` and being surprised it silently just... works**, with no error and no obvious warning by default:\n  ```c\n  double d = 3.99;\n  int x = d;   // compiles cleanly with plain -Wall\n  ```\n  Add `-Wconversion` (beyond the `-Wall` you'll adopt properly in Chapter 8.1) and the compiler does flag it:\n  ```\n  warning: conversion from ‘double’ to ‘int’ may change value [-Wfloat-conversion]\n  ```\n  Plain `-Wall` alone doesn't catch every lossy implicit conversion — worth knowing before you assume a clean `-Wall` build means no silent narrowing happened anywhere.\n- **Forgetting that division truncation depends on both operands, not just one.** `int a = 5; a / 2` truncates even if the result is later stored in a `double` — the truncation happens *during* the integer division, before the assignment ever sees a fractional value to keep. Cast (or make one literal a float) *before* the division, not after: `(float)a / 2`, not `(float)(a / 2)`.\n- **Expecting truncation to mean \"round toward the nearest whole number.\"** It doesn't — `3.99` becoming `3` is often what people expect, but `-3.99` becoming `-3` (not `-4`) surprises people who assume \"truncate\" means \"round down.\" It means \"discard the fractional part,\" which moves negative numbers *up*, toward zero.\n- **Casting away a compiler warning instead of fixing the underlying issue.** A cast silences the specific warning about that conversion, but the data loss it's warning about still happens — `(int)some_double` still truncates. A cast should mean \"I've thought about this and it's fine,\" not \"make the yellow text go away.\"\n\n### How this connects\n\nYou now know how values move between types, both automatically and on purpose. The next two chapters go deep on the two families this chapter only sketched: integer types (Chapter 2.2) and floating-point types (Chapter 2.3) — including exactly why unsigned wraparound is safe and signed overflow is not.\n\n### Quick recap\n\n- Mixing types in one expression triggers automatic **implicit conversion**; explicit **casting** (`(type)expr`) does the same conversion, just written deliberately.\n- Converting float → int **truncates toward zero** — discards the fraction, doesn't round; `-3.99` becomes `-3`, not `-4`.\n- `char` gets promoted to `int` the moment it's used in arithmetic — it really is a small integer underneath.\n- Assigning a value too large for its target integer type **wraps around** for unsigned types (well-defined, `300` into `unsigned char` gives `44`) — signed overflow is a different, much more dangerous story, covered next chapter.\n- Plain `-Wall` doesn't catch every lossy implicit conversion; `-Wconversion` catches more, at the cost of noisier output on some codebases."}, {"id": "2.2", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 2, "slug": "integer-types-in-depth", "fullTitle": "Integer Types in Depth", "title": "Integer Types in Depth", "md": "### Why this matters\n\nChapter 1.3 introduced `int` and moved on. Real programs need more precision than that: sometimes a value genuinely can't be negative (a count, a size), sometimes it needs to be bigger than a plain `int` can hold, and sometimes — reading a file format, talking to hardware, matching another system's exact layout — it needs to be an *exact*, guaranteed size, not \"whatever `int` happens to be on this machine.\" All three needs are real, and C has a real answer for each.\n\n### The core idea\n\nBeyond plain `int`, C gives you size variants — `short`, `long`, `long long` — and a signedness choice for every one of them, `signed` (the default) or `unsigned`. The C standard guarantees only *minimum* sizes and relative ordering (`short` ≤ `int` ≤ `long` ≤ `long long`), not exact byte counts — on one real, common platform (64-bit Linux, tested for this book), `int` is 4 bytes while `long` and `long long` are both 8; other platforms (notably 64-bit Windows) make `long` only 4 bytes. This is exactly why you check rather than assume.\n\nTwo headers exist precisely to make this checkable and controllable:\n\n- **`<limits.h>`** — the exact bounds of each built-in integer type on *this* platform: `INT_MIN`/`INT_MAX`, `UINT_MAX`, `LONG_MIN`/`LONG_MAX`, and so on, plus `CHAR_BIT` (bits per byte — practically always `8`, but not a language guarantee).\n- **`<stdint.h>`** — fixed-width types that are the *same size on every platform*, guaranteed: `int8_t`/`uint8_t`, `int16_t`/`uint16_t`, `int32_t`/`uint32_t`, `int64_t`/`uint64_t`. Reach for these specifically when the exact size matters more than matching your platform's natural `int` — reading a binary file format or network data, or packing a struct that must be exactly N bytes.\n\nThe other core distinction, and the more dangerous one: **unsigned overflow is well-defined** (it wraps around, predictably, by design) — **signed overflow is undefined behavior** (anything is allowed to happen, including results that look inconsistent from one build to the next).\n\n### Examples\n\n**1. Real sizes and bounds on this machine, via `<limits.h>`:**\n```c\n#include <stdio.h>\n#include <limits.h>\n\nint main(void) {\n    printf(\"short: %zu bytes, range %d to %d\\n\", sizeof(short), SHRT_MIN, SHRT_MAX);\n    printf(\"int: %zu bytes, range %d to %d\\n\", sizeof(int), INT_MIN, INT_MAX);\n    printf(\"long: %zu bytes, range %ld to %ld\\n\", sizeof(long), LONG_MIN, LONG_MAX);\n    printf(\"unsigned int max: %u\\n\", UINT_MAX);\n    printf(\"CHAR_BIT: %d\\n\", CHAR_BIT);\n    return 0;\n}\n```\nOutput (on this book's Linux test machine):\n```\nshort: 2 bytes, range -32768 to 32767\nint: 4 bytes, range -2147483648 to 2147483647\nlong: 8 bytes, range -9223372036854775808 to 9223372036854775807\nunsigned int max: 4294967295\nCHAR_BIT: 8\n```\nAn `unsigned int` has the same number of bits as a plain `int`, but no sign bit set aside — so its positive range roughly doubles (`4294967295` instead of maxing out around 2.1 billion).\n\n**2. Unsigned overflow wraps — well-defined, predictable, by design:**\n```c\n#include <stdio.h>\n#include <limits.h>\nint main(void) {\n    unsigned int u = UINT_MAX;\n    printf(\"UINT_MAX = %u\\n\", u);\n    u = u + 1;\n    printf(\"UINT_MAX + 1 = %u\\n\", u);\n    return 0;\n}\n```\nOutput:\n```\nUINT_MAX = 4294967295\nUINT_MAX + 1 = 0\n```\nWraps cleanly back to `0`, exactly as the standard promises. This is genuinely useful — some algorithms rely on it — but it's also exactly why subtracting two unsigned values needs care (see Common Mistakes).\n\n**3. Signed overflow is undefined behavior — and a real sanitizer proves it, even when the plain output looks harmless:**\n```c\n#include <stdio.h>\n#include <limits.h>\nint main(void) {\n    int i = INT_MAX;\n    printf(\"INT_MAX = %d\\n\", i);\n    i = i + 1;\n    printf(\"INT_MAX + 1 = %d\\n\", i);\n    return 0;\n}\n```\nCompiled normally, this printed `-2147483648` — it looks like it \"just wrapped,\" the same as the unsigned case. But compile the exact same file with `-fsanitize=undefined` (Chapter 8.5 covers sanitizers properly) and the truth comes out:\n```\nruntime error: signed integer overflow: 2147483647 + 1 cannot be represented in type 'int'\n```\nThe program still printed the same wrapped-looking number afterward — but the standard makes zero promise that it will, on every compiler, every optimization level, every time. Treat signed overflow as a real bug to eliminate, never as \"wrapping behavior\" to depend on.\n\n**4. `<stdint.h>` for a size that's guaranteed, not just typical:**\n```c\n#include <stdio.h>\n#include <stdint.h>\n\nint main(void) {\n    int8_t a = 100;\n    uint8_t b = 200;\n    int32_t c = 1000000;\n    uint64_t d = 18000000000000000000ULL;\n    printf(\"int8_t size=%zu val=%d\\n\", sizeof(a), a);\n    printf(\"uint8_t size=%zu val=%u\\n\", sizeof(b), b);\n    printf(\"int32_t size=%zu val=%d\\n\", sizeof(c), c);\n    printf(\"uint64_t size=%zu val=%llu\\n\", sizeof(d), (unsigned long long)d);\n    return 0;\n}\n```\nOutput:\n```\nint8_t size=1 val=100\nuint8_t size=1 val=200\nint32_t size=4 val=1000000\nuint64_t size=8 val=18000000000000000000\n```\nThese sizes hold on *any* conforming platform — the entire reason to reach for `int32_t` over plain `int` is that guarantee.\n\n**5. `size_t` — the unsigned type `sizeof` itself returns**, guaranteed large enough to represent the size of any object your platform can create:\n```c\n#include <stdio.h>\nint main(void) {\n    size_t s = sizeof(int);\n    printf(\"size_t size=%zu, sizeof(int)=%zu\\n\", sizeof(s), s);\n    return 0;\n}\n```\nOutput: `size_t size=8, sizeof(int)=4` (on this platform — `size_t` is 8 bytes here, matching a 64-bit address space). You'll see `size_t` constantly once arrays enter the picture (Chapter 2.6) — array indices and loop bounds are idiomatically written using it. That idiom hides a real trap, covered next.\n\n### ⚠️ Common Mistakes\n\n- **Comparing a signed and an unsigned value directly.** C implicitly converts the signed value to unsigned before comparing, with surprising results:\n  ```c\n  int a = -1;\n  unsigned int b = 1;\n  if (a < b) { ... } else { printf(\"a is NOT less than b?!\\n\"); }\n  ```\n  prints `a is NOT less than b?!` — because `-1` gets reinterpreted as a huge unsigned number before the comparison ever happens, and that huge number is *not* less than `1`. Worth knowing: plain `-Wall` does **not** catch this by default; `-Wextra` does, with `warning: comparison of integer expressions of different signedness`. This is one concrete reason Chapter 8.1 recommends `-Wall -Wextra` together, not `-Wall` alone.\n- **Subtracting unsigned values and expecting a negative result.**\n  ```c\n  unsigned int a = 3, b = 5;\n  unsigned int result = a - b;   // 3u - 5u = 4294967294, not -2\n  ```\n  There's no such thing as a negative `unsigned int` — the mathematically-negative result wraps around to a huge positive number instead, silently. If a quantity can ever be smaller than what you're subtracting from it, either check first or use a signed type.\n- **Assuming `long` is always 8 bytes.** It is on 64-bit Linux and Mac — but it's only 4 bytes on 64-bit Windows. Code that assumes otherwise isn't portable; reach for `int64_t` (from `<stdint.h>`) instead, whenever the exact width actually matters to your logic.\n- **Counting downward to zero with a `size_t` loop variable** — a genuinely classic real-world bug:\n  ```c\n  size_t n = 5;\n  for (size_t i = n - 1; i >= 0; i--) {   // looks completely reasonable\n      ...\n  }\n  ```\n  Since `size_t` is unsigned, `i >= 0` is **always true** — the instant `i` reaches `0` and decrements once more, it wraps around to a huge positive number instead of becoming `-1`, and the loop never ends the way you expect. `-Wextra` catches exactly this: `comparison of unsigned expression in '>= 0' is always true`. The fix is to restructure the loop so it never compares an unsigned value against `0` with `>=` — for instance, loop `i` from `0` up to `n`, and use `n - 1 - i` for the \"backward\" index inside the loop body.\n- **Treating \"it happened to still work\" as proof signed overflow is safe.** As shown above, the same overflowing program can print a plausible-looking wrapped value *and* be flagged by a sanitizer as undefined behavior at the same time. Passing a manual test is not the same as being correct.\n\n### How this connects\n\nIntegers are now precisely understood, sizes, signs, and all. The next chapter does the same for `float` and `double` — where the surprises are about precision, not overflow.\n\n### Quick recap\n\n- Beyond `int`: `short`/`long`/`long long`, each `signed` (default) or `unsigned` — the standard guarantees only minimum sizes and ordering, not exact byte counts across platforms.\n- `<limits.h>` gives this platform's exact bounds (`INT_MAX`, `UINT_MAX`, `CHAR_BIT`, ...); `<stdint.h>` gives types with a size guaranteed identical on every platform (`int32_t`, `uint64_t`, ...).\n- Unsigned overflow **wraps, well-defined, by design** — signed overflow is **undefined behavior**, even when it happens to print a plausible-looking wrapped number.\n- Comparing signed and unsigned values implicitly converts the signed one to unsigned first — `-1 < 1u` is false. `-Wextra` catches this; plain `-Wall` does not.\n- Subtracting a larger unsigned value from a smaller one wraps to a huge positive number, not a negative one — there's no such thing as a negative `unsigned`.\n- `size_t` (what `sizeof` returns) is unsigned — a `size_t` loop variable counting down and compared with `>= 0` never stops, since that comparison is always true. `-Wextra` flags it."}, {"id": "2.3", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 3, "slug": "floating-point-types-in-depth", "fullTitle": "Floating-Point Types in Depth", "title": "Floating-Point Types in Depth", "md": "### Why this matters\n\n`float` and `double` look like ordinary decimal numbers, but they aren't stored the way you'd naturally assume — and that gap between \"what the number looks like\" and \"what's actually stored\" is the single most common source of confusing floating-point bugs, in any language, not just C. Understanding *why* it happens turns a confusing surprise into a completely predictable, manageable fact of life.\n\n### The core idea\n\n`float` and `double` both store numbers in the IEEE 754 binary floating-point format — a fixed number of bits split between the number's significant digits and its exponent. `double` gets twice the bits `float` does, so it holds roughly twice the precision. Neither one can represent every decimal fraction exactly, for the same reason `1/3` can't be written exactly in decimal — some fractions that are simple in base 10 (like `0.1`) are *not* simple in base 2, the base floating-point actually uses internally, and get stored as the nearest representable value instead, not the exact one.\n\n**`<float.h>`** exposes exactly how much precision you're working with: `FLT_EPSILON`/`DBL_EPSILON` (the smallest meaningful difference between two nearby values of that type), and `FLT_MAX`/`DBL_MAX` (the largest representable value).\n\n### Examples\n\n**1. The classic case, made concrete:** `0.1 + 0.2` does not equal `0.3` — not approximately wrong, but bit-for-bit different, and `==` sees the difference:\n```c\n#include <stdio.h>\nint main(void) {\n    double a = 0.1 + 0.2;\n    double b = 0.3;\n    printf(\"a = %.17f\\n\", a);\n    printf(\"b = %.17f\\n\", b);\n    if (a == b) {\n        printf(\"equal\\n\");\n    } else {\n        printf(\"NOT equal\\n\");\n    }\n    return 0;\n}\n```\nOutput:\n```\na = 0.30000000000000004\nb = 0.29999999999999999\nNOT equal\n```\nNeither `0.1`, `0.2`, nor `0.3` is stored exactly — each is rounded to the nearest value a `double` can actually represent, and those rounding errors don't cancel out perfectly when added. `%.17f` was used deliberately here to force enough decimal places to reveal it; the default six decimals (Chapter 1.3) would have hidden this completely and shown `0.300000` for both.\n\n**2. `float` really does lose precision `double` keeps**, on the exact same mathematical value:\n```c\n#include <stdio.h>\nint main(void) {\n    float f = 1.0f / 3.0f;\n    double d = 1.0 / 3.0;\n    printf(\"float:  %.10f\\n\", f);\n    printf(\"double: %.10f\\n\", d);\n    return 0;\n}\n```\nOutput:\n```\nfloat:  0.3333333433\ndouble: 0.3333333333\n```\n`double` stays accurate to all ten printed decimal places; `float` visibly drifts starting at the seventh. This is exactly why `double` is C's default choice for floating-point work unless you have a specific, deliberate reason (usually memory, at large scale) to use `float` instead.\n\n**3. Comparing \"close enough\" instead of exactly equal, using `<float.h>`'s epsilon:**\n```c\n#include <stdio.h>\n#include <float.h>\n#include <math.h>\nint main(void) {\n    printf(\"FLT_EPSILON = %e\\n\", FLT_EPSILON);\n    printf(\"DBL_EPSILON = %e\\n\", DBL_EPSILON);\n\n    double a = 0.1 + 0.2;\n    double b = 0.3;\n    if (fabs(a - b) < DBL_EPSILON) {\n        printf(\"close enough to equal\\n\");\n    }\n    return 0;\n}\n```\nOutput:\n```\nFLT_EPSILON = 1.192093e-07\nDBL_EPSILON = 2.220446e-16\nclose enough to equal\n```\n(Compiled with `-lm` to link the math library for `fabs` — Chapter 7.3 covers `<math.h>` properly.) This is the standard fix for the `==` problem: never compare floating-point values for exact equality; compare whether their difference is smaller than some acceptably tiny threshold instead. In practice, a threshold tuned to your actual problem is often more appropriate than the raw epsilon constant — `DBL_EPSILON` is the *smallest* difference that can exist between two doubles near `1.0`, not necessarily the right tolerance for your specific calculation, especially once the numbers involved get large.\n\n**4. Special values: infinity and NaN.** Unlike integer division by zero (which crashes the program — Chapter 8.3 covers this), floating-point division by zero produces a real, definite result:\n```c\n#include <stdio.h>\n#include <math.h>\nint main(void) {\n    double inf = 1.0 / 0.0;\n    double ninf = -1.0 / 0.0;\n    double nan_val = 0.0 / 0.0;\n    printf(\"1.0/0.0 = %f\\n\", inf);\n    printf(\"-1.0/0.0 = %f\\n\", ninf);\n    printf(\"0.0/0.0 = %f\\n\", nan_val);\n    printf(\"isnan(nan_val) = %d\\n\", isnan(nan_val));\n    printf(\"nan_val == nan_val: %d\\n\", nan_val == nan_val);\n    return 0;\n}\n```\nOutput:\n```\n1.0/0.0 = inf\n-1.0/0.0 = -inf\n0.0/0.0 = -nan\nisnan(nan_val) = 1\nnan_val == nan_val: 0\n```\n`1.0/0.0` gives `inf` (infinity), a real, well-defined IEEE 754 value, not a crash. `0.0/0.0` is undefined mathematically, so it produces `NaN` (\"Not a Number\") — printed here as `-nan`; the exact sign shown for NaN is implementation-defined, so don't read meaning into it. The genuinely important fact: **NaN is not equal to itself.** `nan_val == nan_val` is `0` (false) — the one built-in exception to \"a value equals itself\" in all of C. `isnan()` from `<math.h>` is the correct, only reliable way to check for it.\n\n### ⚠️ Common Mistakes\n\n- **Checking for NaN with `x == NAN` or `x != x`'s opposite intuition.** `NaN == NaN` is false, by definition — so `x == NAN` never works as a check, and code needs `isnan(x)` instead. (The one place `x != x` is actually a legitimate, if obscure, NaN test — since it's the one value in C where that's ever true.)\n- **Using `==` to compare two floating-point values.** As shown above, two values that are mathematically equal can differ in their last few stored bits, purely from rounding during earlier arithmetic. Compare with a tolerance (Example 3) instead, essentially always.\n- **Assuming `printf`'s default six decimal places is the true precision.** It's a display default, not a reflection of what's actually stored — force more digits with `%.10f` (or more) whenever you need to see whether two values are *really* identical.\n- **Reaching for `float` by default out of habit.** Unless you have a specific reason — usually storing a very large array of them, where the memory savings genuinely matters — `double` is the safer default in modern C, and it's what a bare decimal literal (`3.14`, no `f` suffix) already gives you.\n- **Worrying there's a missing `printf` specifier for `float` specifically.** There isn't one, and you don't need one: C automatically promotes a `float` argument to `double` when it's passed through a variadic function like `printf` (a rule called *default argument promotion*), so `%f` is correct for both `float` and `double` arguments alike.\n\n### How this connects\n\nYou now understand exactly why `0.1 + 0.2 != 0.3` and what to do about it — a fact every language built on IEEE 754 shares, not a C-specific quirk. The next chapter looks at `char` and the ASCII model underneath C's smallest integer type.\n\n### Quick recap\n\n- `float`/`double` store numbers in IEEE 754 binary floating-point — most decimal fractions (`0.1` included) aren't exactly representable and get rounded to the nearest storable value.\n- `double` has roughly twice `float`'s precision and is the safer default; a bare decimal literal is `double` unless suffixed with `f`.\n- Never compare floats with `==`; compare `fabs(a - b) < tolerance` instead, choosing a tolerance appropriate to your actual calculation.\n- `<float.h>` exposes `FLT_EPSILON`/`DBL_EPSILON` (smallest meaningful difference) and `FLT_MAX`/`DBL_MAX` (largest representable value) for each type.\n- `printf`'s default of six decimal places can hide real precision differences — use `%.Nf` with more digits to actually see what's stored.\n- `float` arguments auto-promote to `double` when passed to a variadic function like `printf` — `%f` alone correctly handles both.\n- Floating-point division by zero doesn't crash — `1.0/0.0` gives `inf`, `0.0/0.0` gives `NaN`. NaN is never equal to itself; check with `isnan()`, never `== NAN`."}, {"id": "2.4", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 4, "slug": "characters-ascii-model", "fullTitle": "Characters & the ASCII Model", "title": "Characters & the ASCII Model", "md": "### Why this matters\n\nChapter 2.1 already let slip that `char` is really just a small integer underneath. This chapter makes that fact fully explicit and useful — once you know exactly which integer each character maps to, a surprising amount of text processing becomes plain arithmetic, and a few real gotchas (why `char` sometimes goes negative, why single and double quotes are not interchangeable) stop being mysterious.\n\n### The core idea\n\nEvery `char` in C is stored as a small integer, interpreted using the **ASCII** table by convention: `'A'` through `'Z'` are the integers 65–90, `'a'` through `'z'` are 97–122, and `'0'` through `'9'` are 48–57. Because a `char` genuinely *is* an integer, you can do arithmetic directly on characters — and real C code does this constantly.\n\n**Escape sequences** are how you write characters that can't be typed directly into source code: `\\n` (newline), `\\t` (tab), `\\\\` (a literal backslash), `\\\"` (a literal double quote inside a string), and `\\0` (the null character, value `0` — you'll meet this constantly starting next chapter, as the character that marks where a C string ends).\n\nOne genuinely platform-dependent detail: whether a plain `char` (no `signed`/`unsigned` written) behaves as signed or unsigned is left up to the compiler by the C standard. On this book's test platform, plain `char` is signed, ranging −128 to 127 (`<limits.h>`'s `CHAR_MIN`/`CHAR_MAX` tell you which, on any given system).\n\n### Examples\n\n**1. Characters really are integers — in both directions:**\n```c\n#include <stdio.h>\nint main(void) {\n    char letter = 'A';\n    printf(\"'A' as int: %d\\n\", letter);\n    int code = 97;\n    printf(\"97 as char: %c\\n\", code);\n    return 0;\n}\n```\nOutput:\n```\n'A' as int: 65\n97 as char: a\n```\n\n**2. Real arithmetic on characters — converting a digit character to its numeric value, and shifting case:**\n```c\n#include <stdio.h>\nint main(void) {\n    char digit = '5';\n    int value = digit - '0';\n    printf(\"'5' - '0' = %d\\n\", value);\n\n    char upper = 'a' - 32;\n    printf(\"'a' - 32 = %c\\n\", upper);\n    printf(\"'a' - 'A' = %d\\n\", 'a' - 'A');\n    return 0;\n}\n```\nOutput:\n```\n'5' - '0' = 5\n'a' - 32 = A\n'a' - 'A' = 32\n```\n`'5' - '0'` works because the digit characters `'0'`–`'9'` are consecutive integers (48–57) — subtracting `'0'`'s value from any digit character gives you that digit's actual numeric value. Same idea for case: uppercase and lowercase letters are a fixed 32 apart in ASCII, in both directions.\n\n**3. Plain `char`'s signedness is platform-dependent, and it genuinely changes behavior:**\n```c\n#include <stdio.h>\n#include <limits.h>\nint main(void) {\n    printf(\"CHAR_MIN=%d CHAR_MAX=%d\\n\", CHAR_MIN, CHAR_MAX);\n    char c = 200;\n    printf(\"char c = 200 -> %d\\n\", c);\n    return 0;\n}\n```\nCompiling this actually produces a warning worth noticing, right on the `char c = 200;` line: `warning: overflow in conversion from 'int' to 'char' changes value from '200' to '-56' [-Woverflow]` — GCC catching, at compile time, that a literal constant clearly doesn't fit the target type. Output (on this book's platform):\n```\nCHAR_MIN=-128 CHAR_MAX=127\nchar c = 200 -> -56\n```\n`200` doesn't fit in a signed 8-bit range (`-128` to `127`), so it wraps to `-56` — this specific conversion (an out-of-range value into a signed type) is *implementation-defined*, not undefined behavior: the standard requires the compiler to document and consistently apply some defined rule, just not the same rule on every platform. `-Woverflow` can only catch this because `200` is a literal, visible directly in the source — the identical wraparound happening to a value computed at runtime (read from a file, say) would compile in total silence. If you ever need a `char`-sized value guaranteed to behave one particular way, say so explicitly with `signed char` or `unsigned char` rather than plain `char`.\n\n### ⚠️ Common Mistakes\n\n- **Confusing single quotes and double quotes.** `'a'` is a single `char` — one small integer. `\"a\"` is a *string literal* — an array of two `char`s (`'a'` and the hidden `'\\0'` terminator you just met above). They are not interchangeable, and using one where the other's expected produces a compiler warning or outright wrong behavior. The next chapter is entirely about what that second form really is.\n- **Assuming plain `char` is always signed (or always unsigned).** It's implementation-defined, and code that silently depends on one behavior or the other isn't portable. Use `signed char` or `unsigned char` explicitly whenever the exact range genuinely matters to your logic — plain `char` is fine for ordinary text, where you're not relying on its numeric range at all.\n- **Forgetting `\\0` is a real character, with value `0`, not \"an empty character.\"** It prints as nothing visible (a null byte), but it occupies real space and has a real, checkable value — this is the entire mechanism strings are built on, covered next.\n- **Writing `'AB'` (multiple characters in single quotes)** — this compiles in C, but not the way people expect. It's a *multi-character constant*, an implementation-defined integer combining both characters' values, essentially never what you actually wanted. If you meant a two-character sequence, you meant a string: `\"AB\"`.\n\n### How this connects\n\nYou now know exactly what a `char` is and how ASCII arithmetic works. The next chapter builds directly on the `\\0` you just met: C strings, and the significant way they differ from strings in every higher-level language you may already know.\n\n### Quick recap\n\n- Every `char` is a small integer under the hood; ASCII maps `'A'`–`'Z'` to 65–90, `'a'`–`'z'` to 97–122, `'0'`–`'9'` to 48–57.\n- Real arithmetic works directly on characters: `digit - '0'` gets a digit's numeric value; letters shift case by a fixed difference of 32.\n- Escape sequences write otherwise-untypeable characters: `\\n`, `\\t`, `\\\\`, `\\\"`, and `\\0` (the null character, value `0`).\n- Plain `char`'s signedness is implementation-defined — use `signed char`/`unsigned char` explicitly when the exact range matters.\n- `'a'` (single quotes) is one `char`; `\"a\"` (double quotes) is a string — a small array ending in `\\0` — and the two are never interchangeable."}, {"id": "2.5", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 5, "slug": "strings-in-c", "fullTitle": "Strings in C", "title": "Strings in C", "md": "### Why this matters\n\nHere's the biggest paradigm shift in this entire book, if you've come from Python, Bash, or almost any other language: **C has no built-in string type.** A \"string\" is just a convention — an array of `char`, ending with the null character `\\0` you met last chapter, marking where the text stops. Nothing enforces that convention for you. Understanding this precisely, from the very first string you write, is what prevents an enormous category of C's most notorious bugs later.\n\n### The core idea\n\nA string literal like `\"Hello\"` is really an array of *six* characters: `'H'`, `'e'`, `'l'`, `'l'`, `'o'`, and a hidden trailing `'\\0'` — the null terminator. Every function that works with strings (you'll meet the real toolbox in Chapter 7.1) works by scanning forward from the start until it hits that `\\0`; there's no separate \"length\" stored anywhere alongside the characters. This has an immediate, concrete consequence: a buffer meant to hold a 5-character word needs **6** bytes, not 5 — one extra, always, for the terminator.\n\nThere are two distinct ways to end up with a string, and they behave very differently:\n\n- **`char greeting[] = \"Hello\";`** — an actual array, sized to fit, sitting in writable memory. You can modify its contents.\n- **`char *p = \"Hello\";`** — a pointer to a string *literal*, which typically lives in read-only memory. Modifying it is undefined behavior, and in practice, a crash.\n\n### Examples\n\n**1. `sizeof` vs. `strlen` — two genuinely different numbers, and why:**\n```c\n#include <stdio.h>\n#include <string.h>\nint main(void) {\n    char greeting[] = \"Hello\";\n    printf(\"sizeof = %zu\\n\", sizeof(greeting));\n    printf(\"strlen = %zu\\n\", strlen(greeting));\n    greeting[0] = 'J';\n    printf(\"modified: %s\\n\", greeting);\n    return 0;\n}\n```\n(`strlen`, from `<string.h>`, counts characters up to but not including `\\0` — Chapter 7.1 covers this header properly; consider it a preview here.) Output:\n```\nsizeof = 6\nstrlen = 5\nmodified: Jello\n```\n`sizeof` reports the array's real, total size — 5 letters plus the terminator, `6`. `strlen` reports the *text* length — `5` — by walking the array looking for `\\0`, and stopping the instant it finds it. Since `greeting` is a real, writable array, changing `greeting[0]` works exactly like changing any other array element.\n\n**2. Proving the mental model by walking to `\\0` yourself**, no library function involved:\n```c\n#include <stdio.h>\nint main(void) {\n    char word[] = \"banana\";\n    int count = 0;\n    while (word[count] != '\\0') {\n        count++;\n    }\n    printf(\"manual length = %d\\n\", count);\n    return 0;\n}\n```\nOutput: `manual length = 6` — exactly what `strlen` would report, because this loop *is* what `strlen` does internally: walk forward one `char` at a time, stop the instant you see `\\0`. Every string function you'll ever use is some variation on this same walk.\n\n**3. A buffer bigger than its initializer zero-fills the rest** — not garbage, a real, guaranteed `0` in every remaining byte:\n```c\nchar buf[10] = \"hi\";\n```\nPrinting all ten bytes of `buf` shows `104, 105` (`'h'`, `'i'`), then eight more `0`s — the standard guarantees this specific case (a string literal initializer shorter than its array) zero-fills the remainder, unlike the uninitialized-variable case from Chapter 1.3.\n\n**4. Modifying a string literal through a `char *` is undefined behavior — and it's not theoretical:**\n```c\n#include <stdio.h>\nint main(void) {\n    char *p = \"Hello\";\n    printf(\"before: %s\\n\", p);\n    fflush(stdout);\n    p[0] = 'J';\n    printf(\"after: %s\\n\", p);\n    return 0;\n}\n```\nOutput:\n```\nbefore: Hello\n```\nfollowed immediately by a real crash:\n```\nSegmentation fault (core dumped)\n```\n(exit status 139). `\"Hello\"` here is a string *literal*, stored by the compiler in memory the operating system marks read-only; `p` merely points at it. Attempting to write through that pointer faults immediately on this platform — but the standard doesn't promise a clean crash everywhere; it promises nothing at all, which is the real danger of undefined behavior in general (Chapter 8.3 covers this properly). If you need a string you intend to modify, always declare it as an array (`char greeting[] = \"Hello\";`, Example 1), never a `char *` pointing at a literal.\n\n**5. A buffer sized too small for its initializer — caught at compile time, when you're lucky enough for it to be this obvious:**\n```c\nchar buf[3] = \"Hello\";\n```\n```\nwarning: initializer-string for array of ‘char’ is too long\n```\nGCC catches *this specific* case because the mismatch is visible right there in the source. It cannot catch the same mistake made far more indirectly — copying a runtime-computed string into a fixed buffer that turns out to be too small — which is exactly why buffer-overflow bugs remain one of C's most persistent real-world hazards. Chapter 5.8 and Chapter 7.1 both return to this from different angles: pointers' role in it, and the specific string functions that help avoid it.\n\n### ⚠️ Common Mistakes\n\n- **Comparing two strings with `==`.** A string variable is really just a pointer to (or array of) characters — `==` compares *addresses*, not text content:\n  ```c\n  char a[] = \"hello\";\n  char b[] = \"hello\";\n  printf(\"a == b: %d\\n\", a == b);              // 0 — different arrays, different addresses\n  printf(\"strcmp(a, b) == 0: %d\\n\", strcmp(a, b) == 0);  // 1 — same actual text\n  ```\n  `a == b` is `0` (false) even though the text is identical, because `a` and `b` are two separate arrays living at two separate addresses. GCC's own `-Warray-compare` catches this exact pattern with a direct hint: `use '&a[0] == &b[0]' to compare the addresses` — a reminder that `==` on arrays was never comparing their contents in the first place. Comparing string *content* always means `strcmp` (equal when it returns `0` — Chapter 7.1 covers it properly), never `==`.\n- **Sizing a buffer to exactly fit the visible text, forgetting the terminator.** A 5-letter word needs a 6-`char` buffer, minimum, always — one more than `strlen` would report for it.\n- **Declaring `char *p = \"some literal\";` and later trying to modify `p`'s contents.** As shown above, this is undefined behavior, commonly a crash. If you need to modify it, you needed an array from the start.\n- **Confusing a `char` and a one-character string.** `'A'` is a single integer value; `\"A\"` is a two-element array (`'A'` and `'\\0'`). `%c` expects the former, `%s` expects the latter — mixing them up produces either a compiler warning or genuinely wrong output.\n- **Assuming a string \"just knows\" its own length the way it would in Python.** It doesn't — every length-dependent operation in C re-scans for `\\0` from the start, every single time, which is also why an accidentally-missing `\\0` (say, from a buffer that was never actually terminated) causes string functions to keep reading straight past the end of the buffer into whatever memory happens to follow.\n\n### How this connects\n\nStrings turned out to be a specific case of a more general idea: a block of same-typed values sitting one after another in memory. The next chapter makes that general idea explicit — arrays — of which the `char greeting[]` you just used is one specific example.\n\n### Quick recap\n\n- C has no built-in string type — a string is a `char` array ending in the null terminator `\\0`, purely by convention, enforced by nothing.\n- A buffer holding *N* characters of real text needs *N + 1* bytes, minimum, for the terminator.\n- `char arr[] = \"text\";` is a real, writable array; `char *p = \"text\";` points at a read-only literal — modifying through the second one is undefined behavior, commonly a crash.\n- `sizeof` reports an array's total allocated size; `strlen` reports the text length up to (not including) `\\0`, found by scanning — the two numbers usually differ by exactly one.\n- A too-long initializer for a fixed-size array is sometimes caught at compile time; the same mistake made at runtime, via a function copying data in, is not — this is the root of C's classic buffer-overflow bugs.\n- A string literal initializer shorter than its array zero-fills the rest of the array, guaranteed — a real `0`, not garbage.\n- Strings compare by address with `==` (almost always wrong for text), and by content with `strcmp` (right one) — GCC's `-Warray-compare` flags the former directly."}, {"id": "2.6", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 6, "slug": "arrays-fixed-size-collections", "fullTitle": "Arrays: Fixed-Size Collections", "title": "Arrays: Fixed-Size Collections", "md": "### Why this matters\n\nYou've already used an array without necessarily noticing — a C string (Chapter 2.5) *is* an array, specifically one of `char`. This chapter generalizes that to arrays of any type: a fixed number of same-typed values, laid out one after another in memory, accessed by position. Arrays are also where C's most defining trait — no safety net, ever, unless you build one yourself — becomes impossible to ignore.\n\n### The core idea\n\nDeclare a fixed-size array with `type name[count];`, and initialize it with a brace-enclosed list:\n```c\nint scores[5] = {90, 85, 77, 92, 88};\n```\nLike every other index you've seen (`char` arrays included), indexing starts at `0` — `scores[0]` is the first element, `scores[4]` is the last of these five. The array's size is fixed at the point it's declared and cannot grow or shrink afterward (Chapter 5.7 covers dynamically-sized memory, once pointers are in hand).\n\n`sizeof` on an array gives its *total* size in bytes, not its element count — dividing `sizeof(array)` by `sizeof(array[0])` (the size of one element) is the standard idiom for getting the count back, and it's used constantly in real C code.\n\nThe size in `[count]` can also be left out entirely when you provide a full initializer list — `int primes[] = {2, 3, 5, 7, 11};` is exactly 5 elements, the compiler counts them for you. Give an explicit size *larger* than the initializer list instead (`int arr[10] = {1, 2, 3};`), and you get the partial-initialization zero-fill behavior from Example 2 below.\n\n### Examples\n\n**1. Declare, initialize, loop, and recover the element count:**\n```c\n#include <stdio.h>\nint main(void) {\n    int scores[5] = {90, 85, 77, 92, 88};\n    for (int i = 0; i < 5; i++) {\n        printf(\"scores[%d] = %d\\n\", i, scores[i]);\n    }\n    printf(\"element count = %zu\\n\", sizeof(scores) / sizeof(scores[0]));\n    return 0;\n}\n```\nOutput:\n```\nscores[0] = 90\nscores[1] = 85\nscores[2] = 77\nscores[3] = 92\nscores[4] = 88\nelement count = 5\n```\n\n**2. Partial initialization zero-fills the rest** — the exact same guarantee you saw for strings in the last chapter, and it applies to any array type:\n```c\nint vals[5] = {1, 2};\n```\nPrinting all five elements shows `1, 2, 0, 0, 0` — real, guaranteed zeros, confirmed by actually running it, not leftover garbage.\n\n**3. Out-of-bounds access compiles, runs, and simply lies to you.** C performs no automatic bounds checking whatsoever, at runtime:\n```c\n#include <stdio.h>\nint main(void) {\n    int arr[3] = {1, 2, 3};\n    printf(\"arr[3] (out of bounds) = %d\\n\", arr[3]);\n    printf(\"arr[10] (way out of bounds) = %d\\n\", arr[10]);\n    return 0;\n}\n```\nCompiled with plain `gcc -Wall`, this produced no warning at all and ran to completion (exit status `0`), printing:\n```\narr[3] (out of bounds) = 49620480\narr[10] (way out of bounds) = 32764\n```\nTwo whatever-happened-to-be-there numbers, not an error — this is undefined behavior, and \"quietly returns nonsense instead of telling you anything is wrong\" is one of its most common, most dangerous real shapes. Add `-O2` (an optimization level, Chapter 8.6 covers these) to the same compile, and GCC's `-Warray-bounds` *does* catch this particular case at compile time — but only because the index (`3`, `10`) is a fixed constant, visible directly in the source. The moment that index comes from a variable computed at runtime, no compiler warning can catch it in advance; only a tool like Valgrind (Chapter 8.5) or careful bounds-checking in your own code can.\n\n### ⚠️ Common Mistakes\n\n- **Off-by-one: looping with `<=` instead of `<`.** For a 5-element array, valid indices are `0` through `4` — `for (int i = 0; i <= 5; i++)` runs one iteration too many, silently reading (or writing) one element past the end.\n- **Assuming `sizeof(array)` gives the element count.** It gives the size in *bytes* — always divide by `sizeof(array[0])` to recover the count. This idiom breaks the moment the array decays to a plain pointer (passing it into a function, Chapter 5.3 explains exactly why) — inside a function, `sizeof` on a parameter that \"looks like\" an array actually reports a pointer's size, not the array's.\n- **Trusting that an out-of-bounds access will crash so you'll notice.** As shown above, it very often does not — it can silently read garbage, silently corrupt an unrelated variable sitting nearby in memory, or crash unpredictably far away from the actual mistake, all without any compiler warning if the index isn't a literal constant.\n- **Forgetting arrays can't be resized.** `int arr[5];` is exactly 5 elements, permanently, for its entire lifetime — needing a different number requires either declaring a new array of the right size or reaching for dynamic memory (`malloc`, Chapter 5.7), not \"growing\" the existing one in place.\n\n### How this connects\n\nYou now have fixed-size collections of any type, not just `char`. The next chapter extends this to more than one dimension — arrays of arrays — before Part II wraps up with the preprocessor and a deeper look at `printf`/`scanf`.\n\n### Quick recap\n\n- `type name[count];` declares a fixed-size array; `{...}` initializes it; indexing starts at `0`.\n- `sizeof(array) / sizeof(array[0])` recovers the element count — `sizeof` alone gives total bytes, not count.\n- A short initializer list zero-fills the remaining elements, guaranteed — not garbage.\n- **C performs no runtime bounds checking, ever.** An out-of-bounds access compiles and often runs without any visible error, silently reading or corrupting whatever memory happens to be there.\n- `-Warray-bounds` (with optimization enabled) can catch *constant*-index out-of-bounds mistakes at compile time; a runtime-computed index bypasses this entirely.\n- Arrays have a fixed size for their entire lifetime — there is no \"resize,\" only \"declare a new one\" or \"use dynamic memory.\""}, {"id": "2.7", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 7, "slug": "multi-dimensional-arrays", "fullTitle": "Multi-Dimensional Arrays", "title": "Multi-Dimensional Arrays", "md": "### Why this matters\n\nPlenty of real data is naturally grid-shaped — a game board, a small image, a table of numbers. C extends the array idea you just learned to more than one dimension, and it does so in a specific, predictable way in memory that's worth understanding precisely, not just using by pattern-matching.\n\n### The core idea\n\nA 2D array is declared `type name[rows][cols];`, and initialized with nested brace lists, one inner list per row:\n```c\nint grid[2][3] = {\n    {1, 2, 3},\n    {4, 5, 6}\n};\n```\nAccessing an element needs both indices: `grid[row][col]`. Crucially, this is not an array of pointers to separately-allocated rows — it's one single, contiguous block of memory, exactly `rows * cols` elements long, laid out **row-major**: the entire first row, immediately followed by the entire second row, and so on. `grid[0][2]` and `grid[1][0]` are genuinely *adjacent* in memory, even though they look far apart by their indices.\n\n### Examples\n\n**1. Declare, initialize, and loop over both dimensions:**\n```c\n#include <stdio.h>\nint main(void) {\n    int grid[2][3] = {\n        {1, 2, 3},\n        {4, 5, 6}\n    };\n    for (int row = 0; row < 2; row++) {\n        for (int col = 0; col < 3; col++) {\n            printf(\"%d \", grid[row][col]);\n        }\n        printf(\"\\n\");\n    }\n    printf(\"total size = %zu bytes, row size = %zu bytes\\n\", sizeof(grid), sizeof(grid[0]));\n    return 0;\n}\n```\nOutput:\n```\n1 2 3 \n4 5 6 \ntotal size = 24 bytes, row size = 12 bytes\n```\n6 `int`s total (2 rows × 3 columns), 4 bytes each, giving 24 bytes overall — and `sizeof(grid[0])` (one row, treated as its own 3-element array) confirms 12 bytes, exactly a third of the total.\n\n**2. Proving row-major layout with real addresses:**\n```c\n#include <stdio.h>\nint main(void) {\n    int grid[2][3] = {{1,2,3},{4,5,6}};\n    printf(\"&grid[0][0] = %p\\n\", (void*)&grid[0][0]);\n    printf(\"&grid[0][2] = %p\\n\", (void*)&grid[0][2]);\n    printf(\"&grid[1][0] = %p\\n\", (void*)&grid[1][0]);\n    return 0;\n}\n```\nOutput (actual addresses will differ every run, but the *spacing* between them will not):\n```\n&grid[0][0] = 0x7fffef405e70\n&grid[0][2] = 0x7fffef405e78\n&grid[1][0] = 0x7fffef405e7c\n```\n`&grid[0][2]` is 8 bytes after `&grid[0][0]` — two `int`s later, exactly as expected. `&grid[1][0]` is only 4 bytes after *that* — one more `int`, immediately following the last element of row 0. There's no gap between rows at all; `grid[1][0]` really is the very next `int` after `grid[0][2]`, in physical memory. This is exactly why row-major order matters once you get to pointer arithmetic on multi-dimensional arrays (Chapter 5.3 touches on this).\n\n**3. A genuinely common real use: a fixed list of strings, as a 2D `char` array.** Each row is itself a C string (Chapter 2.5) — a fixed-width \"column\" of characters:\n```c\n#include <stdio.h>\nint main(void) {\n    char names[3][10] = {\"Alice\", \"Bob\", \"Charlie\"};\n    for (int i = 0; i < 3; i++) {\n        printf(\"names[%d] = %s (row size = %zu)\\n\", i, names[i], sizeof(names[i]));\n    }\n    return 0;\n}\n```\nOutput:\n```\nnames[0] = Alice (row size = 10)\nnames[1] = Bob (row size = 10)\nnames[2] = Charlie (row size = 10)\n```\nEvery row is exactly 10 bytes, regardless of the actual name's length — `\"Bob\"` still gets a full 10-byte row, with the unused bytes zero-filled, exactly like the partial-initializer guarantee from the previous chapter. This is the fixed-size-grid version of a list of strings; Chapter 7.5 introduces the more flexible version your `main` function itself receives, `argv`.\n\n### ⚠️ Common Mistakes\n\n- **Mixing up row and column order**, especially in non-square grids. `grid[row][col]` for a `[2][3]` array means \"2 rows of 3 columns each\" — writing the loops or the initializer in the opposite order either produces a compiler error (wrong number of elements) or, worse, silently compiles with a transposed, wrong result.\n- **Forgetting that a partial initializer zero-fills, in multiple dimensions at once.** `int grid[2][3] = {{1, 2}};` is entirely valid — the missing third element of row 0 and the entire second row all become `0`, the same guarantee from the previous two chapters, just applied per-dimension.\n- **Declaring a large multi-dimensional array as a local variable.** A local array lives on the **stack** (Chapter 5.1 explains exactly what that means), which is much smaller than the heap — something like `int huge[10000][10000];` (400 megabytes) as a local variable will very likely crash before it even prints anything. Large data belongs in dynamically-allocated memory (Chapter 5.7) or declared outside any function, not as a big local array.\n- **Assuming `grid[0]` alone means \"the first element.\"** For a 2D array, `grid[0]` refers to the entire first *row* — a further step needed before you get an actual `int`. This connects directly to how arrays and pointers relate, covered properly once Part V begins.\n\n### How this connects\n\nYou now have both flat and grid-shaped fixed-size data. The rest of Part II moves away from data itself and into two remaining pieces of vocabulary: the preprocessor, which runs before your code even compiles, and a deeper look at `printf`/`scanf`'s format specifiers.\n\n### Quick recap\n\n- `type name[rows][cols];` declares a 2D array; nested `{...}` initializes it, one inner list per row.\n- It's one single contiguous block of memory, not separately-allocated rows — laid out **row-major**: all of row 0, then all of row 1, and so on, with no gaps between rows.\n- A partial initializer zero-fills whatever's missing, across both dimensions at once.\n- A large multi-dimensional array declared as a local variable can overflow the stack — large data belongs in dynamic memory or outside any function.\n- `grid[0]` alone names the first *row*, not a single element — reaching an actual value always needs bo
