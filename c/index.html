 always at least 1, `argv[0]` is the program's own name (not the first real argument), and `argv[argc]` is guaranteed `NULL`.\n\n**ASLR (Address Space Layout Randomization)** — the operating system randomizing the base address of a program's memory regions on every run, for security; the relative order of regions stays the same, only the absolute addresses move.\n\n**`assert`** — a macro (`<assert.h>`) that aborts immediately with a precise file/line/expression message if its argument is false; entirely removed from the compiled program (side effects included) when `NDEBUG` is defined.\n\n**Base case** — the condition in a recursive function simple enough to answer directly, without any further recursive call; a base case that's never actually reached exhausts the stack and crashes.\n\n**Bit field** — a struct member declared with a specific number of bits (`unsigned int flag : 1;`), packing several small values into far less memory than separate fields would need; its exact memory layout is implementation-defined.\n\n**BSS segment** — the region of a program's memory holding uninitialized global/`static` variables, guaranteed zero-filled automatically by the operating system.\n\n**Buffer overflow** — writing past the end of an array or allocated block, silently corrupting whatever memory happens to sit adjacent to it; one of C's most persistent, most dangerous real-world bug categories.\n\n**Cache locality** — accessing memory in the order it's actually laid out, which the CPU can fetch far more efficiently than jumping around; can produce an order-of-magnitude speed difference with no change to what's computed.\n\n**Callback** — a function passed to another function (via a function pointer) to be called back at the right moment, letting the caller supply part of the behavior — the mechanism behind `qsort`'s comparator argument.\n\n**`calloc`** — allocates memory like `malloc`, but guarantees it's zero-filled; `malloc` makes no such guarantee.\n\n**Compilation stages** — preprocessing (directives resolved) → compilation (each `.c` file becomes its own object file, independently) → linking (object files combined, cross-file references resolved into one executable).\n\n**`const`** — a qualifier making a variable (or, on a pointer, what it points to, or the pointer itself, depending on position) compiler-enforced read-only.\n\n**Dangling pointer** — a pointer whose target no longer legitimately exists (a returned local variable, freed heap memory); the pointer's value is unchanged, but what it pointed at is gone.\n\n**Declaration** — a promise to the compiler that something (a function, a variable) exists with a given type/signature, with no body or storage of its own; contrast with **definition**.\n\n**Default argument promotion** — the rule that a `float` passed through a variadic function's `...` is promoted to `double`, and any integer type smaller than `int` (`char`, `short`) is promoted to `int` — separate from ordinary **integer promotion**, and the reason `va_arg` must always request the *promoted* type, never the type as originally written at the call site.\n\n**Definition** — the actual body of a function, or the real storage-allocating form of a variable; every entity needs exactly one definition, but can have many declarations.\n\n**Dereference** — using `*` on a pointer to access (read or write) the value at the address it holds.\n\n**Designated initializer** — `{.field = value, ...}` syntax naming exactly which struct field or array index an initializer value belongs to, independent of position.\n\n**Dispatch table** — an array of function pointers, indexed to select which function to call at runtime instead of writing an `if`/`switch` chain to decide.\n\n**Double free** — calling `free` twice on the same pointer; often caught and aborted by modern glibc at runtime, but not something to rely on.\n\n**Enum (`enum`)** — a set of named integer constants, defaulting to `0, 1, 2, ...` in declaration order; carries zero real type safety in C — it's a plain `int` underneath.\n\n**`errno`** — a global variable many library functions set on failure; never cleared on success, so it's only meaningful to check immediately after a call whose own return value already signaled failure.\n\n**`extern`** — declares that a variable or function is defined elsewhere (typically another file), allocating no storage of its own.\n\n**`fanalyzer`** — GCC's built-in static analyzer (`-fanalyzer`), which traces possible execution paths through code to find real bugs (like a use-after-free) without ever running the program.\n\n**Format specifier** — the `%`-prefixed piece of a `printf`/`scanf` format string (`%d`, `%.2f`, `%zu`) telling it exactly how to interpret or produce one argument; must match the argument's real (and, for a variadic function, promoted) type.\n\n**Function pointer** — a variable storing the address of a function, callable through it; the basis of dispatch tables and the callback pattern (as used by `qsort`).\n\n**`gdb`** — the GNU Debugger, for stepping through a running program's actual execution: breakpoints, printing variables, and a full call-stack backtrace at the exact moment of a crash.\n\n**Header file (`.h`)** — a file holding declarations meant to be shared across multiple `.c` files — prototypes, type definitions, `extern` declarations — never full function definitions meant to be included by more than one file.\n\n**Heap** — the region of memory used for dynamic allocation (`malloc`/`free`); unlike the stack, nothing frees it automatically — that's the programmer's responsibility.\n\n**Include guard** — `#ifndef NAME` / `#define NAME` / `#endif` wrapped around a header's contents, preventing a \"redefinition\" error if the header is included more than once in the same file; `#pragma once` is a simpler, near-universally-supported alternative.\n\n**Integer promotion** — the automatic widening of a smaller integer type (`char`, `short`, or a bit-field) to `int` when used in an expression — distinct from **default argument promotion**, the separate rule governing what type actually arrives at a variadic function through `...`.\n\n**Linker / linking** — the final build stage, combining separately-compiled object files into one executable and resolving every cross-file reference; the stage where \"undefined reference\" and \"multiple definition\" errors surface, since only the linker sees every object file at once.\n\n**Lvalue** — an expression referring to a real, addressable storage location (something that can legally appear on the left of `=`); a ternary expression's overall result is not one, which is why `cond ? a : b = 5` fails to compile as written.\n\n**`malloc`** — requests a block of raw, uninitialized memory from the heap, returning `NULL` on failure; must always be paired with exactly one later `free`.\n\n**Memory layout (of a program)** — the division of a running program's address space into distinct regions: text (read-only code), data (initialized globals/statics), BSS, heap, and stack — each with a different purpose and lifetime.\n\n**Memory leak** — allocated memory that's never freed; unreachable and unusable for the rest of the program's life, directly observable in a process's real, OS-reported memory usage.\n\n**Memory-mapped/virtual address** — every address a program sees is virtual, privately mapped by the operating system to real physical memory; the same-looking address in two different processes refers to entirely unrelated memory.\n\n**Multiple definition** — a link-stage error from the same function or global variable being fully defined (not just declared) in more than one place across the files being linked together; fixed by keeping exactly one real definition and declaring it (`extern`, or via a header prototype) everywhere else.\n\n**`NDEBUG`** — a preprocessor macro that, when defined, removes every `assert` in a program entirely, including any side effects inside it — never build a test suite with it defined.\n\n**`NULL`** — a pointer value guaranteed to never be a valid address for real data, used as a safe, checkable \"points at nothing\"; dereferencing it is an immediate, predictable crash.\n\n**Null terminator** — the `\\0` character marking where a C string's real content ends; every string-handling function relies on finding it, and a missing one causes them to keep reading straight past a buffer's actual end.\n\n**Object file (`.o`)** — the compiled-but-not-yet-linked output of one `.c` file; real machine code, but not yet a runnable executable.\n\n**One-past-the-end pointer** — a pointer computed as exactly one element past an array's last real element (`arr + n`); legal to compute and compare, never legal to dereference.\n\n**Output parameter** — a pointer parameter a function writes a result *through*, used to hand back more than one value from a single call, since `return` alone only ever gives one.\n\n**Padding** — invisible bytes inserted by the compiler between or after struct fields, to satisfy each field's alignment requirement; the reason `sizeof(struct)` often exceeds the sum of its fields.\n\n**Pass by value** — C's only argument-passing mechanism: a function always receives a copy of whatever was passed, never the original — including for a whole struct. Modifying a caller's actual data requires passing a pointer explicitly.\n\n**Phony target** — a `Makefile` target (like `clean`) that names a command to run, not a real file to check timestamps against.\n\n**Pointer** — a variable storing a memory address, typed to tell the compiler how to interpret the bytes stored there; every pointer on a given platform is the same fixed size, regardless of what type it points to.\n\n**Pointer arithmetic** — arithmetic on a pointer, automatically scaled by the size of its pointed-to type (`p + 1` moves one whole element forward, not one raw byte).\n\n**Pointer decay** — an array's name automatically becoming a pointer to its first element in almost every context it's used, except as `sizeof`'s direct argument or when address-of'd as a whole.\n\n**Prototype** — a function declaration (signature only, no body), letting the compiler check calls to a function before — or without ever seeing — its full definition.\n\n**`qsort`** — the standard library's generic sort, working on any array of any type through a caller-supplied comparator function returning negative/zero/positive.\n\n**`realloc`** — resizes a previously-allocated block, possibly moving it to a new address; its return value must always be captured and used — the original pointer is not guaranteed to remain valid.\n\n**Recursion** — a function calling itself, working toward a base case; each call gets its own independent stack frame, and an unreachable base case exhausts the (finite) stack, crashing rather than hanging.\n\n**Row-major order** — the memory layout of a multi-dimensional array: the entire first row, immediately followed by the entire second row, and so on, with no gaps.\n\n**Sanitizer** — a compiler-instrumented runtime check (AddressSanitizer, UndefinedBehaviorSanitizer) built directly into a compiled program, reporting violations the instant they occur when the program is simply run.\n\n**Segmentation fault (SIGSEGV)** — the signal a process receives when it accesses memory it has no right to (a `NULL` pointer, memory past the end of the address space the OS granted it); usually crashes the program immediately.\n\n**Sentinel value** — a specific, agreed-upon value marking the end of a sequence (a `-1` ending a list of arguments, `argv[argc]`'s guaranteed `NULL`), letting code stop without needing a separately-tracked count.\n\n**Sequence point** — a point in a program's execution where all prior side effects are guaranteed complete; modifying the same variable more than once between sequence points (`i = i++ + ++i;`) is undefined behavior with no defined order.\n\n**`sig_atomic_t`** — the integer type the standard specifically guarantees is safe to read and write from inside a signal handler, always paired with `volatile`.\n\n**`signal`** — registers a handler function to run when a given signal (like `SIGINT`, Ctrl+C) arrives, instead of the operating system's default action.\n\n**Signedness** — whether an integer type can represent negative values (`signed`, the default) or only non-negative ones (`unsigned`); comparing or subtracting across the two implicitly converts the signed value, a classic source of surprising results.\n\n**`size_t`** — the unsigned integer type `sizeof` returns; looping a `size_t` down to (and past) zero with `>= 0` is always true and never stops — a classic real bug.\n\n**Stack** — the region of memory holding each function call's local variables and parameters, managed automatically as functions are called and return; comparatively small, which is why unbounded recursion crashes rather than merely slowing down.\n\n**Stack frame** — the block of memory (local variables, parameters) belonging to one specific function call; every call gets its own, genuinely independent one.\n\n**Stack protector** — a compiler-inserted guard value near stack buffers, checked when a function returns, that deliberately crashes the program (\"stack smashing detected\") if it's found corrupted — a real, but not universal, defense against buffer overflows.\n\n**`static`** — on a local variable, makes it persist its value between calls (initialized only once); at file scope, restricts a function or variable's visibility to that one file, enforced by the linker.\n\n**Static analysis** — finding bugs by examining source code without running it (compiler warnings, `-fanalyzer`); complementary to dynamic tools (sanitizers, `valgrind`) that only see what a specific run actually exercised.\n\n**Storage class** — a keyword (`auto`, `static`, `extern`, `register`) controlling a variable's scope and lifetime, beyond its basic type.\n\n**Strict aliasing** — the rule that two differently-typed pointers are assumed never to refer to the same memory; violating it (via a raw pointer cast rather than a `union`) can cause a compiler to skip a real, necessary re-read of memory.\n\n**String** — in C, not a built-in type at all: a `char` array ending in a null terminator (`\\0`), by convention only, enforced by nothing.\n\n**`struct`** — a type grouping several, possibly differently-typed, fields together as one unit; assignment copies every field's value, including pointer fields (copying the pointer, not what it points to).\n\n**Tagged union** — a `union` paired with a separate field (often an `enum`) recording which member is currently valid — the union itself has no memory of this on its own.\n\n**Ternary operator (`?:`)** — `condition ? value_if_true : value_if_false`, an expression (not a statement) producing one of two values.\n\n**Two's complement** — the binary representation used for signed integers on virtually every real platform, where negative numbers are the bitwise complement plus one; the reason unsigned overflow wraps predictably while signed overflow is undefined behavior rather than a guaranteed wraparound.\n\n**Type punning** — deliberately reinterpreting the same bytes as a different type; legitimate via a `union`, but a real optimization hazard when done by casting one pointer type to another (see **strict aliasing**).\n\n**Type qualifier** — a keyword (`const`, `volatile`) modifying how a variable may be used without changing its underlying type.\n\n**`typedef`** — creates a genuine alias for an existing type, understood by the compiler (unlike `#define`, which is blind text substitution and diverges from `typedef` the moment more than one variable is declared on a line).\n\n**Undefined behavior (UB)** — behavior the C standard makes zero promises about; critically, the compiler is entitled to *assume* it never happens in a correct program, and may optimize based on that assumption — including deleting a check that could only ever matter after UB already occurred.\n\n**Union (`union`)** — a type whose members all share the same memory; `sizeof` is the size of the largest member, and writing one member then reading another reinterprets the same bytes (type punning).\n\n**Use-after-free** — dereferencing a pointer to memory that's already been `free`d; often produces no crash at all, just silently wrong data, which is exactly what makes it dangerous.\n\n**`valgrind`** — a tool that runs an already-compiled program under heavy instrumentation to catch memory errors, needing no recompilation but running considerably slower than a sanitizer-instrumented build.\n\n**Variadic function** — a function accepting a variable number of arguments (`...`), accessed via `va_list`/`va_start`/`va_arg`/`va_end` from `<stdarg.h>`; the function has no built-in way to know the count or types unless told explicitly (a count, a format string, or a sentinel value).\n\n**`void *`** — a pointer to an unspecified type; can point at anything, but must be cast to a concrete pointer type before being dereferenced.\n\n**`volatile`** — a qualifier telling the compiler a value can change for reasons outside its visibility (a signal handler, hardware), forcing a genuine re-read from memory on every access rather than trusting a cached copy.\n\n**Watchpoint** — a `gdb` breakpoint that pauses execution the instant a specific variable's value changes, rather than at a fixed line — useful when you know what's misbehaving but not where."}]

  <!-- Application Logic -->
  <script>
  (function(){
    var rawJson = document.getElementById('book-data').textContent;
    var chapters;
    try {
      chapters = JSON.parse(rawJson);
    } catch(err) {
      console.error('Failed to parse book data JSON:', err);
      document.getElementById('chapter-pane').innerHTML = '<div style="padding:2rem;color:red;"><h3>Error Loading Book Data</h3><p>' + err.message + '</p></div>';
      return;
    }

    var chapterMap = {};
    chapters.forEach(function(c, i){ c.index = i; chapterMap[c.id] = c; });

    var STORAGE_KEY_THEME = 'python_book_theme';
    var STORAGE_KEY_FONT = 'c_book_fontsize';
    var STORAGE_KEY_LAST = 'c_book_last_chapter';
    var STORAGE_KEY_CODE = 'c_book_code_style';
    var STORAGE_KEY_CODE_CARD = 'c_book_code_card';
    var STORAGE_KEY_COMPLETED = 'lba_completed_chapters';

    var currentChapterId = null;

    // Theme handling (Light / Dark)
    var currentTheme = 'light';
    try {
      var pTheme = new URLSearchParams(window.location.search).get('theme');
      currentTheme = (pTheme === 'dark' || pTheme === 'light') ? pTheme : (localStorage.getItem(STORAGE_KEY_THEME) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    }catch(e){}
    function applyTheme(theme){
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY_THEME, theme); }catch(e){}
      document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setTheme === theme);
      });
    }
    applyTheme(currentTheme);

        if(completed && idx === -1){
          list.push(id);
        } else if(!completed && idx !== -1){
          list.splice(idx, 1);
        }
        localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(list));
        updateCompletionUI();

        // =========================================================================
    // In-Browser WebAssembly C Runtime Manager (100% Client-Side)
    // =========================================================================
    var CEngine = {
      initPromise: null,
      statusCallback: null,
      isReady: false,
      executionQueue: Promise.resolve(),

      notify: function(pct, msg) {
        if (this.statusCallback) {
          this.statusCallback(pct, msg);
        }
      },

      init: function(onProgress) {
        if (this.isReady && window.picocjs && typeof window.picocjs.runC === 'function') {
          return Promise.resolve(true);
        }
        if (this.initPromise) {
          if (onProgress) this.statusCallback = onProgress;
          return this.initPromise;
        }

        var self = this;
        this.statusCallback = onProgress;

        var isCached = false;
        try { isCached = (localStorage.getItem('picoc_wasm_cached') === 'true'); }catch(e){}

        this.notify(20, isCached ? "Loading C WebAssembly engine from browser cache..." : "Initializing WebAssembly C runtime...");

        this.initPromise = new Promise(function(resolve, reject) {
          if (window.picocjs && typeof window.picocjs.runC === 'function') {
            self.isReady = true;
            try { localStorage.setItem('picoc_wasm_cached', 'true'); }catch(e){}
            self.notify(100, "C runtime ready!");
            return resolve(true);
          }

          var script = document.createElement('script');
          script.src = './vendor/picoc/picoc.umd.js';
          self.notify(50, isCached ? "Reading WebAssembly C core from cache..." : "Loading C WebAssembly engine (~800 KB)...");
          script.onload = function() {
            self.notify(85, "Mounting C standard library shims...");
            setTimeout(function() {
              self.isReady = true;
              try { localStorage.setItem('picoc_wasm_cached', 'true'); }catch(e){}
              self.notify(100, "C runtime ready!");
              resolve(true);
            }, 80);
          };
          script.onerror = function(err) {
            console.error("CEngine load error:", err);
            self.initPromise = null;
            reject(new Error("Failed to load WebAssembly C runtime from ./vendor/picoc/picoc.umd.js"));
          };
          document.head.appendChild(script);
        });

        return this.initPromise;
      },

      run: function(code, onProgress) {
        var self = this;
        return (this.executionQueue = this.executionQueue.then(function() {
          return self._execute(code, onProgress);
        }));
      },

      _execute: async function(code, onProgress) {
        await this.init(onProgress);

        if (!window.picocjs || typeof window.picocjs.runC !== 'function') {
          throw new Error("C runtime engine not ready");
        }

        var startTime = performance.now();
        var rawOutputs = [];
        var hasError = false;

        return new Promise(function(resolve) {
          var timer = setTimeout(function() {
            var elapsed = Math.round(performance.now() - startTime);
            resolve({
              stdout: rawOutputs.join('\n'),
              stderr: 'Execution timed out (exceeded 5 seconds limit)',
              executionTime: elapsed,
              exitCode: -1,
              error: true
            });
          }, 5000);

          try {
            window.picocjs.runC(code, function(line) {
              if (line && (line.includes('error:') || line.includes('warning:') || line.includes('fatal error:') || line.includes("can't assign"))) {
                hasError = true;
              }
              rawOutputs.push(line);
            });

            setTimeout(function() {
              clearTimeout(timer);
              var elapsed = Math.round(performance.now() - startTime);
              var out = rawOutputs.join('\n').trim();
              resolve({
                stdout: out,
                executionTime: elapsed,
                exitCode: hasError ? 1 : 0,
                error: hasError
              });
            }, 60);
          } catch(err) {
            clearTimeout(timer);
            var elapsed = Math.round(performance.now() - startTime);
            resolve({
              stdout: rawOutputs.join('\n'),
              stderr: err.message || String(err),
              executionTime: elapsed,
              exitCode: 1,
              error: true
            });
          }
        });
      }
    };

      // Enhanced Code Block Cards with Runner & Output Shelf
      var playIconSvg = '<svg class="run-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
      var spinnerIconSvg = '<svg class="spinner-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"></circle></svg>';
      var resetIconSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>';
      var copyIconSvg = '<svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
      var checkIconSvg = '<svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

      bodyDiv.querySelectorAll('pre').forEach(function(pre){

        var explicitLang = explicitMatch ? explicitMatch[1].toLowerCase() : null;

        var initialCode = (codeEl || pre).textContent;
        var firstLine = initialCode.trim().split('\n')[0].trim();
        var isTerminalCmd = /^(\$ )/i.test(firstLine);

        var lang = 'C11';

        if (explicitLang === 'c' || explicitLang === 'c11' || explicitLang === 'c99' || !explicitLang) {
          if (isTerminalCmd) {

            lang = 'C11';

            isRunnable = (initialCode.indexOf('main(') !== -1 || initialCode.indexOf('printf(') !== -1);

        } else if (explicitLang === 'json') {
          lang = 'JSON';
          isRunnable = false;

          isRunnable = false;

          isRunnable = false;

            });
          } else {
            fallbackCopy(text, done);
          }
        });
        right.appendChild(copyBtn);
        cardHeader.appendChild(right);

        pre.parentNode.insertBefore(card, pre);
        card.appendChild(cardHeader);
        card.appendChild(pre);

        if (isRunnable) {
          shelf = document.createElement('div');
          shelf.className = 'code-output-shelf';

          var shelfHeader = document.createElement('div');
          shelfHeader.className = 'code-output-header';
          shelfHeader.innerHTML = 
            '<div class="code-output-header-left">' +
              '<span>❯ Terminal Output</span>' +
              '<span class="output-status-badge"></span>' +
            '</div>' +
            '<button class="code-output-clear" type="button">Clear</button>';
          shelf.appendChild(shelfHeader);

          var shelfBody = document.createElement('div');
          shelfBody.className = 'code-output-body';
          shelf.appendChild(shelfBody);

          var badge = shelfHeader.querySelector('.output-status-badge');
          var clearBtn = shelfHeader.querySelector('.code-output-clear');

          clearBtn.addEventListener('click', function(){
            shelf.classList.remove('open');
            shelfBody.innerHTML = '';
            badge.textContent = '';
            badge.className = 'output-status-badge';
          });

          runBtn.addEventListener('click', async function(){
            shelf.classList.add('open');
            runBtn.classList.add('running');
            runBtn.innerHTML = spinnerIconSvg + '<span>Running...</span>';

            var isInitial = !CEngine.isReady;
            if (isInitial) {
              var cached = false;
              try { cached = (localStorage.getItem('websh_wasm_cached') === 'true'); }catch(e){}
              shelfBody.innerHTML = 
                '<div class="bash-progress-box">' +
                  '<div class="bash-progress-title">' +
                    spinnerIconSvg +
                    '<span>' + (cached ? 'Loading C engine from browser cache...' : 'First-time setup: Initializing local C WebAssembly engine (~800 KB)...') + '</span>' +
                  '</div>' +
                  '<div class="bash-progress-track"><div class="bash-progress-fill" style="width: 15%;"></div></div>' +
                  '<div class="bash-progress-meta">' +
                    '<span class="bash-status-msg">Starting WebAssembly runtime...</span>' +
                    '<span class="bash-status-pct">15%</span>' +
                  '</div>' +
                  '<div class="bash-progress-hint">' +
                    (cached ? 'Reading cached WebAssembly from disk...' : 'Zero backend servers • Runs 100% in your browser • Instant on subsequent runs.') +
                  '</div>' +
                '</div>';
            }

            var progressFill = shelfBody.querySelector('.c-progress-fill');
            var statusMsg = shelfBody.querySelector('.bash-status-msg');
            var statusPct = shelfBody.querySelector('.bash-status-pct');

            var codeToRun = (codeEl || pre).innerText || (codeEl || pre).textContent;

            try {
              var r = await CEngine.run(codeToRun, function(pct, msg){
                if (progressFill) progressFill.style.width = pct + '%';
                if (statusMsg) statusMsg.textContent = msg;
                if (statusPct) statusPct.textContent = pct + '%';
              });

              runBtn.classList.remove('running');
              runBtn.innerHTML = playIconSvg + '<span>Run</span>';

              if (r.error) {
                var errLabel = (r.exitCode && r.exitCode !== -1) ? ('❌ Exit ' + r.exitCode + ' (' + r.executionTime + 'ms)') : ('❌ Error (' + r.executionTime + 'ms)');
                badge.textContent = errLabel;
                badge.className = 'output-status-badge error';
                var errText = r.stdout || r.stderr || 'Command failed with non-zero exit code ' + r.exitCode;
                shelfBody.innerHTML = '<pre class="code-output-text error">' + escapeHtml(errText) + '</pre>';
              } else {
                badge.textContent = '✓ ' + r.executionTime + 'ms';
                badge.className = 'output-status-badge success';

                var outText = '';
                if (r.stdout && r.stdout.trim()) {
                  outText = r.stdout;
                  if (r.stderr && r.stderr.trim()) {
                    outText += '\n' + r.stderr;
                  }
                } else if (r.stderr && r.stderr.trim()) {
                  outText = r.stderr;
                } else {
                  outText = '(Program executed successfully with no printed output)';
                }

                shelfBody.innerHTML = '<pre class="code-output-text' + (outText.startsWith('(') ? ' empty' : '') + '">' + escapeHtml(outText) + '</pre>';
              }
            } catch(e) {
              runBtn.classList.remove('running');
              runBtn.innerHTML = playIconSvg + '<span>Run</span>';
              badge.textContent = '❌ Failed';
              badge.className = 'output-status-badge error';
              shelfBody.innerHTML = '<pre class="code-output-text error">' + escapeHtml(e.message || String(e)) + '</pre>';
            }
          });

          card.appendChild(shelf);
        }
      });

      function fallbackCopy(text, cb){
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta);
        cb();
      }

      // Next / Previous Navigation Cards
      var prev = chapters[chap.index - 1];
      var next = chapters[chap.index + 1];

      var navCards = document.createElement('div');
      navCards.className = 'chapter-nav-cards';
      navCards.innerHTML = 
        (prev ? '<a class="nav-card prev" href="#' + prev.id + '"><span class="nav-card-dir">‹ Previous Chapter</span><span class="nav-card-title">' + prev.id + ' ' + prev.title + '</span></a>' : '<div></div>') +
        (next ? '<a class="nav-card next" href="#' + next.id + '"><span class="nav-card-dir">Next Chapter ›</span><span class="nav-card-title">' + next.id + ' ' + next.title + '</span></a>' : '<div></div>');
      
      var nextCardLink = navCards.querySelector('.nav-card.next');
      if (nextCardLink) {
        nextCardLink.addEventListener('click', function(){
          markChapterCompleted(chap.id, true);
        });
      }
      chapterPane.appendChild(navCards);

      // Reader Chapter Footer
      var readerFooter = document.createElement('footer');
      readerFooter.className = 'reader-footer';
      readerFooter.innerHTML = 
        '<div class="reader-footer-wrap">' +
          '<div class="reader-footer-copy">' +
            '&copy; 2026 <strong>HexLean</strong> &bull; An open technical educational project curated by <a href="https://hexdef.com" target="_blank" rel="noopener">Tanvir Hussain</a>.' +
          '</div>' +
          '<div class="reader-footer-links">' +
            '<a href="/">Platform Home</a>' +
            '<a href="https://hexdef.com" target="_blank" rel="noopener">hexdef.com</a>' +
            '<a href="https://github.com/shadowpbx/hexlean" target="_blank" rel="noopener">GitHub</a>' +
          '</div>' +
        '</div>';
      chapterPane.appendChild(readerFooter);

      // Auto-mark completed when reaching the bottom of chapter
      if (window.IntersectionObserver) {
        var bottomObserver = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if (entry.isIntersecting) {
              markChapterCompleted(chap.id, true);
              bottomObserver.disconnect();
            }
          });
        }, { threshold: 0.3 });
        bottomObserver.observe(navCards);
      }

      window.scrollTo({ top: 0, behavior: 'instant' });
      updateCompletionUI();
      updateToggleAllBtnLabel();
    }

    function groupSubsections(container){
      var kids = Array.prototype.slice.call(container.children);
      var i = 0;
      while(i < kids.length){
        var el = kids[i];
        if(el.tagName === 'H3'){
          var wrapper = document.createElement('div');
          var text = el.textContent.toLowerCase();
          var cls = 'subsection';
          if(text.indexOf('mistake') !== -1) cls += ' subsection--mistakes';
          else if(text.indexOf('recap') !== -1) cls += ' subsection--recap';
          else if(text.indexOf('matters') !== -1) cls += ' subsection--matters';
          wrapper.className = cls;
          container.insertBefore(wrapper, el);
          wrapper.appendChild(el);
          var j = i + 1;
          while(j < kids.length && kids[j].tagName !== 'H3' && kids[j].tagName !== 'H2'){
            wrapper.appendChild(kids[j]);
            j++;
          }
          i = j;
        } else {
          i++;
        }
      }
    }

    // Router handling via Hash
    function handleHash(){
      var hash = location.hash.replace(/^#\/?/, '').trim();
      if(!hash){
        var last = null;
        try { last = localStorage.getItem(STORAGE_KEY_LAST); }catch(e){}
        if(last && chapterMap[last]){
          location.replace('#' + last);
          return;
        }
        hash = '0.1';
      }
      if(chapterMap[hash]){
        renderChapter(hash);
      } else {
        renderChapter('0.1');
      }
    }

    window.addEventListener('hashchange', handleHash);
    handleHash();

    // Touch Swipe Gestures
    var touchStartX = 0, touchStartY = 0;
    var contentPane = document.getElementById('main-viewport');
    if (contentPane) {
      contentPane.addEventListener('touchstart', function(e){
        if(e.touches.length === 1){
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      contentPane.addEventListener('touchend', function(e){
        if(e.changedTouches.length === 1){
          var diffX = e.changedTouches[0].clientX - touchStartX;
          var diffY = e.changedTouches[0].clientY - touchStartY;
          if(Math.abs(diffX) > 80 && Math.abs(diffY) < 50){
            var currentChap = chapterMap[currentChapterId];
            if(!currentChap) return;
            if(diffX < 0 && chapters[currentChap.index + 1]){
              markChapterCompleted(currentChap.id, true);
              location.hash = '#' + chapters[currentChap.index + 1].id;
            } else if(diffX > 0 && chapters[currentChap.index - 1]){
              location.hash = '#' + chapters[currentChap.index - 1].id;
            }
          }
        }
      }, { passive: true });
    }

    // Search Command Palette Modal Logic
    var searchModal = document.getElementById('search-modal');
    var searchBackdrop = document.getElementById('search-backdrop');
    var searchInput = document.getElementById('search-input');
    var searchClearBtn = document.getElementById('search-clear-btn');
    var searchCloseBtn = document.getElementById('search-close-btn');
    var searchResults = document.getElementById('search-results');
    var searchCount = document.getElementById('search-count');
    var searchBtn = document.getElementById('search-btn');

    var isMac = (typeof navigator !== 'undefined' && (navigator.platform || '').toUpperCase().indexOf('MAC') >= 0);
    var shortcutBadge = document.querySelector('.search-shortcut-badge');
    if (shortcutBadge) {
      shortcutBadge.textContent = isMac ? '⌘K' : 'Ctrl+K';
    }

    var searchCorpus = chapters.map(function(c){
      var cleanMd = (c.md || '')
        .replace(/^#+\s+/gm, '')
        .replace(/`{3}[a-zA-Z0-9_-]*\n([\s\S]*?)`{3}/g, ' $1 ')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1');

      return {
        id: c.id,
        index: c.index,
        partNum: c.partNum,
        partTitle: c.partTitle,
        partMetaphor: c.partMetaphor || '',
        title: c.title,
        fullTitle: c.fullTitle,
        cleanText: cleanMd
      };
    });

    var popularTopics = [
      "Parameter Expansion", "Arrays & Maps", "if / elif / else", "for & while Loops",
      "Functions & Namerefs", "Pipes & Redirection", "grep, sed & awk", "find & xargs",
      "Process Substitution", "Job Control & trap", "Debugging (set -euo pipefail)", "jq & JSON Parsing"
    ];

    var selectedSearchIndex = -1;
    var currentResultItems = [];

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderDefaultSuggestions() {
      searchCount.textContent = chapters.length + ' chapters indexed';
      searchClearBtn.classList.remove('visible');
      selectedSearchIndex = -1;
      currentResultItems = [];

      var html = '<div class="search-empty">' +
        '<div class="search-empty-icon">🔍</div>' +
        '<div class="search-empty-title">Search Learn C</div>' +
        '<div class="search-empty-desc">Search topics, shell scripts, commands, syntax, utilities, and chapter titles across all 66 chapters.</div>' +
        '<div class="search-suggestions-label">Popular Topics</div>' +
        '<div class="search-suggestions-pills">';

      popularTopics.forEach(function(topic){
        html += '<button type="button" class="search-pill" data-topic="' + escapeHtml(topic) + '">' + escapeHtml(topic) + '</button>';
      });

      html += '</div></div>';
      searchResults.innerHTML = html;

      searchResults.querySelectorAll('.search-pill').forEach(function(btn){
        btn.addEventListener('click', function(){
          var topic = btn.getAttribute('data-topic');
          searchInput.value = topic;
          performSearch(topic);
          searchInput.focus();
        });
      });
    }

    function highlightText(text, terms) {
      var escaped = escapeHtml(text);
      if (!terms || terms.length === 0) return escaped;

      var validTerms = [];
      terms.forEach(function(t){
        var clean = t.trim();
        if (clean.length > 0 && validTerms.indexOf(clean) === -1) {
          validTerms.push(clean);
        }
      });
      if (validTerms.length === 0) return escaped;

      validTerms.sort(function(a, b){ return b.length - a.length; });
      var pattern = validTerms.map(function(t){ return escapeRegex(escapeHtml(t)); }).join('|');
      var re = new RegExp('(' + pattern + ')', 'gi');
      return escaped.replace(re, '<mark class="search-highlight">$1</mark>');
    }

    function performSearch(query) {
      var q = (query || '').trim();
      if (!q) {
        renderDefaultSuggestions();
        return;
      }

      searchClearBtn.classList.add('visible');

      var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (terms.length === 0) {
        renderDefaultSuggestions();
        return;
      }

      var hits = [];
      for (var i = 0; i < searchCorpus.length; i++) {
        var doc = searchCorpus[i];
        var titleLower = (doc.title || '').toLowerCase();
        var fullTitleLower = (doc.fullTitle || '').toLowerCase();
        var partLower = ((doc.partTitle || '') + ' ' + (doc.partMetaphor || '')).toLowerCase();
        var textLower = (doc.cleanText || '').toLowerCase();

        var score = 0;
        var allMatched = true;

        for (var t = 0; t < terms.length; t++) {
          var term = terms[t];
          var inTitle = titleLower.indexOf(term) !== -1;
          var inFullTitle = fullTitleLower.indexOf(term) !== -1;
          var inPart = partLower.indexOf(term) !== -1;
          var inText = textLower.indexOf(term) !== -1;

          if (!inTitle && !inFullTitle && !inPart && !inText) {
            allMatched = false;
            break;
          }

          if (inTitle) score += 120;
          if (inFullTitle) score += 90;
          if (inPart) score += 40;
          if (inText) {
            var count = 0;
            var pos = 0;
            while ((pos = textLower.indexOf(term, pos)) !== -1 && count < 6) {
              score += 15;
              pos += term.length;
              count++;
            }
          }
        }

        if (!allMatched) continue;

        var snippet = '';
        var firstPos = -1;
        for (var k = 0; k < terms.length; k++) {
          var p = textLower.indexOf(terms[k]);
          if (p !== -1 && (firstPos === -1 || p < firstPos)) {
            firstPos = p;
          }
        }

        if (firstPos !== -1) {
          var start = Math.max(0, firstPos - 45);
          var end = Math.min(doc.cleanText.length, firstPos + 105);
          snippet = (start > 0 ? '… ' : '') + doc.cleanText.substring(start, end).trim() + (end < doc.cleanText.length ? ' …' : '');
        } else {
          snippet = doc.cleanText.substring(0, 110).trim() + '…';
        }

        hits.push({
          id: doc.id,
          title: doc.title,
          partNum: doc.partNum,
          partTitle: doc.partTitle,
          partMetaphor: doc.partMetaphor,
          snippet: snippet,
          score: score
        });
      }

      hits.sort(function(a, b){ return b.score - a.score; });
      renderSearchResults(hits, terms, q);
    }

    function renderSearchResults(hits, terms, query) {
      selectedSearchIndex = -1;
      currentResultItems = [];

      if (hits.length === 0) {
        searchCount.textContent = '0 results';
        searchResults.innerHTML = 
          '<div class="search-empty">' +
            '<div class="search-empty-icon">🧐</div>' +
            '<div class="search-empty-title">No matching chapters</div>' +
            '<div class="search-empty-desc">No chapters contained all terms for "' + escapeHtml(query) + '". Try simpler keywords like <code>variables</code>, <code>pipe</code>, or <code>xargs</code>.</div>' +
          '</div>';
        return;
      }

      searchCount.textContent = hits.length + ' result' + (hits.length === 1 ? '' : 's');

      var html = '';
      hits.forEach(function(item, idx){
        var highlightedTitle = highlightText(item.title, terms);
        var highlightedSnippet = highlightText(item.snippet, terms);

        html += 
          '<a class="search-result-item" data-chap-id="' + item.id + '" data-search-index="' + idx + '" href="#' + item.id + '">' +
            '<div class="search-result-top">' +
              '<span class="search-part-badge">Part ' + item.partNum + '</span>' +
              '<span class="search-item-id">' + item.id + '</span>' +
              '<span class="search-item-title">' + highlightedTitle + '</span>' +
            '</div>' +
            '<div class="search-snippet">' + highlightedSnippet + '</div>' +
          '</a>';
      });

      searchResults.innerHTML = html;
      currentResultItems = Array.prototype.slice.call(searchResults.querySelectorAll('.search-result-item'));

      currentResultItems.forEach(function(el, idx){
        el.addEventListener('click', function(e){
          e.preventDefault();
          var cid = el.getAttribute('data-chap-id');
          navigateToChapter(cid);
        });
        el.addEventListener('mouseenter', function(){
          setSelectedIndex(idx, false);
        });
      });

      if (currentResultItems.length > 0) {
        setSelectedIndex(0, false);
      }
    }

    function setSelectedIndex(idx, scrollIntoView) {
      if (currentResultItems.length === 0) return;
      if (idx < 0) idx = 0;
      if (idx >= currentResultItems.length) idx = currentResultItems.length - 1;

      currentResultItems.forEach(function(item, i){
        item.classList.toggle('selected', i === idx);
      });
      selectedSearchIndex = idx;

      if (scrollIntoView && currentResultItems[idx]) {
        currentResultItems[idx].scrollIntoView({ block: 'nearest' });
      }
    }

    function navigateToChapter(cid) {
      closeSearch();
      location.hash = '#' + cid;
    }

    function openSearch() {
      searchModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (!searchInput.value.trim()) {
        renderDefaultSuggestions();
      }
      setTimeout(function(){
        searchInput.focus();
        searchInput.select();
      }, 50);
    }

    function closeSearch() {
      searchModal.classList.remove('open');
      document.body.style.overflow = '';
    }

    if (searchBtn) searchBtn.addEventListener('click', openSearch);
    if (searchBackdrop) searchBackdrop.addEventListener('click', closeSearch);
    if (searchCloseBtn) searchCloseBtn.addEventListener('click', closeSearch);

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', function(){
        searchInput.value = '';
        searchInput.focus();
        renderDefaultSuggestions();
      });
    }

    if (searchInput) {
      searchInput.addEventListener('input', function(){
        performSearch(searchInput.value);
      });

      searchInput.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex + 1, true);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex - 1, true);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (selectedSearchIndex >= 0 && currentResultItems[selectedSearchIndex]) {
            var cid = currentResultItems[selectedSearchIndex].getAttribute('data-chap-id');
            navigateToChapter(cid);
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeSearch();
        }
      });
    }

    // Global keyboard navigation
    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === '/' && !searchModal.classList.contains('open')) {
        if (document.activeElement && (
          document.activeElement.tagName === 'INPUT' ||
          document.activeElement.tagName === 'TEXTAREA' ||
          document.activeElement.isContentEditable
        )) {
          return;
        }
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === 'Escape' && searchModal.classList.contains('open')) {
        e.preventDefault();
        closeSearch();
        return;
      }

      if (searchModal.classList.contains('open')) return;

      if(document.activeElement && (
        document.activeElement.tagName === 'INPUT' ||
        document.activeElement.tagName === 'TEXTAREA' ||
        document.activeElement.isContentEditable
      )) return;

      var currentChap = chapterMap[currentChapterId];
      if(!currentChap) return;

      if(e.key === 'ArrowRight' || (!e.ctrlKey && !e.metaKey && e.key === 'k')){
        if(chapters[currentChap.index + 1]) location.hash = '#' + chapters[currentChap.index + 1].id;
      } else if(e.key === 'ArrowLeft' || e.key === 'j'){
        if(chapters[currentChap.index - 1]) location.hash = '#' + chapters[currentChap.index - 1].id;
      } else if(e.key === 't'){
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else if(e.key === 'Escape'){
        closeDrawer();
        toggleSettings(false);
      }
    });

    // Background pre-warm for WebAssembly Bash Engine
    setTimeout(function() {
      if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(function() { CEngine.init().catch(function(){}); });
      } else {
        setTimeout(function() { CEngine.init().catch(function(){}); }, 2500);
      }
    }, 1200);

  })();
  </script>
