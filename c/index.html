th indices."}, {"id": "2.8", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 8, "slug": "the-preprocessor-define-macros-conditional-compilation", "fullTitle": "The Preprocessor: `#define`, Macros & Conditional Compilation", "title": "The Preprocessor: `#define`, Macros & Conditional Compilation", "md": "### Why this matters\n\nYou've already used the preprocessor constantly — every `#include` and every `#define` constant (Chapter 1.5) runs through it. This chapter makes it fully explicit: the preprocessor is a separate, earlier pass over your source file, working by pure text substitution, before the compiler proper ever sees a single token of real C. Understanding exactly where that boundary sits explains both what macros can do that functions can't, and why they carry sharp edges functions don't have.\n\n### The core idea\n\nBeyond a simple constant (`#define MAX_USERS 100`), `#define` can take parameters, creating a **function-like macro**:\n```c\n#define SQUARE(x) ((x) * (x))\n```\nThis looks like a function call at the point you use it (`SQUARE(5)`), but it isn't one — the preprocessor literally pastes your argument's text in place of `x`, wherever `x` appears, *before* the compiler ever parses the result as C. No types are checked, and — critically — the argument's text can end up duplicated, or combined with surrounding code in ways you didn't intend, if you're not careful with parentheses.\n\n**Conditional compilation** lets entire blocks of code be included or excluded before compilation, based on whether a name is `#define`d: `#ifdef NAME` / `#ifndef NAME` / `#if expression` / `#else` / `#endif`. This is how a single source file supports a debug build and a release build, or platform-specific code paths, without runtime cost — the excluded branch isn't just skipped, it's never compiled at all.\n\nA handful of macros are predefined by the compiler itself, most usefully `__FILE__`, `__LINE__`, and `__func__` — the current file name, line number, and enclosing function name, expanded automatically wherever they appear, which makes them the backbone of most hand-rolled logging and assertion tools.\n\n### Examples\n\n**1. A macro without full parentheses breaks the moment it's used with a non-trivial argument:**\n```c\n#include <stdio.h>\n#define SQUARE(x) x*x\nint main(void) {\n    printf(\"SQUARE(2+3) = %d\\n\", SQUARE(2+3));\n    return 0;\n}\n```\nOutput: `SQUARE(2+3) = 11` — not `25`. The macro expands, purely as text, to `2+3*2+3`, and ordinary operator precedence (`*` before `+`) takes over from there: `2 + 6 + 3 = 11`. Wrapping both the parameter *and* the whole expression in parentheses fixes it:\n```c\n#define SQUARE(x) ((x) * (x))\n```\n```\nSQUARE(2+3) = 25\n```\nNow the expansion is `((2+3) * (2+3))`, which evaluates the way the name promised. This is why nearly every real-world function-like macro is wrapped in parentheses this heavily — it looks like overkill until you remember it's blind text substitution, not a function call.\n\n**2. Even fully parenthesized, a macro can silently evaluate its argument more than once:**\n```c\n#include <stdio.h>\n#define MAX(a, b) ((a) > (b) ? (a) : (b))\nint main(void) {\n    int x = 5;\n    int y = 3;\n    int result = MAX(x++, y);\n    printf(\"result = %d, x = %d\\n\", result, x);\n    return 0;\n}\n```\nOutput: `result = 6, x = 7` — `x` got incremented *twice*, not once, even though `x++` appears only once at the call site. The expansion is `((x++) > (y) ? (x++) : (y))` — `x++` appears twice in the *expanded* code, once in the condition and once in the branch actually taken, and each occurrence runs independently. A real function, by contrast, evaluates each argument exactly once, no matter how many times its parameter name appears inside the function body. This specific danger — a macro silently duplicating any argument that has a side effect — is one of the strongest real arguments for preferring an `inline` function (Chapter 4.2) over a macro wherever both could do the job.\n\n**3. Conditional compilation, switched on from the compile command itself:**\n```c\n#include <stdio.h>\nint main(void) {\n#ifdef DEBUG\n    printf(\"Debug mode is ON\\n\");\n#endif\n    printf(\"Program running normally.\\n\");\n    return 0;\n}\n```\nCompiled plainly (`gcc file.c`), it prints only `Program running normally.`. Compiled with `gcc -DDEBUG file.c` — defining `DEBUG` right from the command line, no source change needed — it prints both lines, `Debug mode is ON` appearing first. The `#ifdef` block genuinely isn't part of the compiled program at all in the first case; it's not \"false,\" it's *absent*.\n\n**4. `__FILE__`, `__LINE__`, and `__func__` for free, automatic context in logging:**\n```c\n#include <stdio.h>\nvoid log_here(void) {\n    printf(\"File: %s, Line: %d, Function: %s\\n\", __FILE__, __LINE__, __func__);\n}\nint main(void) {\n    log_here();\n    return 0;\n}\n```\nOutput: `File: predefined.c, Line: 3, Function: log_here` — each of these three expands automatically, per call site, with zero effort from you. Chapter 7.6 builds on exactly this for real error-reporting.\n\n**5. `#if 0` as a clean, reliable way to disable a block of code** — delivering on the promise made back in Chapter 1.2, where nested `/* */` comments were shown to fail exactly this job:\n```c\nprintf(\"before\\n\");\n#if 0\n    printf(\"this is disabled, no matter how many /* */ it contains\\n\");\n#endif\nprintf(\"after\\n\");\n```\nOutput: `before` then `after` — the middle line, and anything inside it (including its own comments, or even other `#if 0` blocks), is cleanly skipped, with none of nested-comment's fragility.\n\n**6. A multi-statement macro needs the `do { ... } while (0)` wrapper, or it breaks inside an `if`/`else`:**\n```c\n#include <stdio.h>\n#define SWAP(a, b) int tmp = a; a = b; b = tmp;\n\nint main(void) {\n    int x = 1, y = 2;\n    if (x != y)\n        SWAP(x, y);\n    else\n        printf(\"equal\\n\");\n    ...\n```\nThis fails to compile at all:\n```\nerror: expected expression before 'int'\nwarning: macro expands to multiple statements [-Wmultistatement-macros]\nnote: some parts of macro expansion are not guarded by this 'if' clause\nerror: 'else' without a previous 'if'\n```\nThe `if` without braces only \"owns\" the first statement of the macro's expansion (`int tmp = a;`) — the rest spills out as separate statements, and the compiler no longer sees a single `if`/`else` pair at all. The standard fix wraps the whole body in a loop that runs exactly once:\n```c\n#define SWAP(a, b) do { int tmp = a; a = b; b = tmp; } while (0)\n```\nNow `SWAP(x, y);` expands to one single statement as far as `if`/`else` is concerned, and it works exactly as intended: `x=2 y=1`. This specific idiom — `do { ... } while (0)`, seemingly pointless on its own — exists almost entirely to make multi-statement macros behave like a single statement everywhere a single statement is expected.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting parentheses around a macro's parameter, or around the whole expansion.** As shown above, this is not a style nitpick — it silently changes what the macro computes, depending entirely on what expression happens to get passed in.\n- **Passing an expression with a side effect (`x++`, a function call with effects) into a macro that uses its parameter more than once.** The parameter's text — and therefore its side effect — repeats exactly as many times as the parameter name appears in the macro body. This class of bug doesn't exist with a real function call.\n- **Forgetting `#ifdef` excludes code entirely, rather than making it conditionally `false`.** A variable or function declared only inside an `#ifdef DEBUG` block genuinely does not exist in a build compiled without `-DDEBUG` — code outside that block that references it will fail to compile, not silently skip.\n- **Reaching for a macro where a `const` (Chapter 1.5) or an `inline` function (Chapter 4.2) would be safer.** Macros remain genuinely useful for conditional compilation and for things that aren't really typed values at all — but for a plain constant or a small computation, the typed, side-effect-safe alternative is usually the better choice today.\n\n### How this connects\n\nYou now understand the pass that runs before your code is even real C — `#include`, `#define`, and conditional compilation are all the same mechanism. Part II's last chapter looks at `printf` and `scanf`'s format specifiers in full depth, closing out everything you need to move confidently between data and text.\n\n### Quick recap\n\n- The preprocessor runs *before* compilation, working by pure text substitution — `#define NAME(params) body` creates a function-like macro that looks like a call but isn't one.\n- Always parenthesize both a macro's parameters and its entire expansion — unparenthesized, operator precedence from the *call site* can silently change what it computes.\n- A macro parameter's text is substituted everywhere it appears in the body — an argument with a side effect (like `x++`) can run more than once, unlike a real function's arguments, which always evaluate exactly once.\n- `#ifdef`/`#ifndef`/`#if`/`#else`/`#endif` conditionally compile entire blocks — excluded code isn't \"false,\" it's not compiled into the program at all. `-DNAME` on the compile command defines a name without touching the source.\n- `__FILE__`, `__LINE__`, and `__func__` expand automatically to the current file, line, and function — the foundation of most hand-rolled logging.\n- `#if 0 ... #endif` reliably disables a block of code, including any comments or nested blocks inside it — succeeding exactly where nested `/* */` comments (Chapter 1.2) fail.\n- A macro expanding to more than one statement needs the `do { ... } while (0)` wrapper to behave as a single statement inside an unbraced `if`/`else` — without it, the compiler doesn't see the `if`/`else` pair you wrote at all."}, {"id": "2.9", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 9, "slug": "printf-scanf-format-specifiers-in-depth", "fullTitle": "`printf`/`scanf` Format Specifiers In Depth", "title": "`printf`/`scanf` Format Specifiers In Depth", "md": "### Why this matters\n\nYou've been using `printf` since Chapter 1.1, but only its basics — `%d`, `%f`, `%s`, `%c`. Both `printf` and `scanf` support a lot more control than that: exact column widths, decimal precision, padding, and alignment, all through the format string alone. Getting the specifier genuinely right also matters more than it looks like it should — a mismatched one isn't just cosmetic, it's undefined behavior, silently reading the wrong number of bytes off the argument list.\n\n### The core idea\n\nA `printf` format specifier's full shape is `%[flags][width][.precision]specifier`:\n\n- **width** — minimum field width, padded with spaces by default (`%5d`).\n- **`-` flag** — left-align within that width, instead of the default right-align (`%-5d`).\n- **`0` flag** — pad with `0` instead of spaces (`%05d`).\n- **`.precision`** — for `%f`, how many digits after the decimal point (`%.2f`); for `%s`, the maximum characters printed.\n- **`#` flag** — adds a type prefix for `%x`/`%o` (`0x` / `0`).\n\n**Length modifiers** tell `printf`/`scanf` the argument's real size: `l` for `long` (`%ld`), `ll` for `long long` (`%lld`), `z` for `size_t` (`%zu`, already used since Chapter 1.3). Getting one of these wrong is exactly the mismatch mentioned above.\n\n`scanf` mirrors `printf`'s specifiers, but reads *into* variables rather than printing them — which means it needs the variable's *address* (`&age`, not `age`), and it returns the number of items it successfully matched, which real code should always check rather than assume.\n\n### Examples\n\n**1. Width, alignment, padding, and precision, side by side:**\n```c\n#include <stdio.h>\nint main(void) {\n    printf(\"[%5d]\\n\", 42);\n    printf(\"[%-5d]\\n\", 42);\n    printf(\"[%05d]\\n\", 42);\n    printf(\"[%.2f]\\n\", 3.14159);\n    printf(\"[%8.2f]\\n\", 3.14159);\n    printf(\"[%x] [%#x] [%o]\\n\", 255, 255, 8);\n    return 0;\n}\n```\nOutput:\n```\n[   42]\n[42   ]\n[00042]\n[3.14]\n[    3.14]\n[ff] [0xff] [10]\n```\nWidth and precision can combine (`%8.2f`: at least 8 characters wide, exactly 2 decimal places). `%x` gives lowercase hex with no prefix; `%#x` adds the `0x` for you.\n\n**2. Checking `scanf`'s return value, instead of trusting it blindly:**\n```c\n#include <stdio.h>\nint main(void) {\n    int age;\n    printf(\"Enter age: \");\n    int result = scanf(\"%d\", &age);\n    if (result == 1) {\n        printf(\"Got age: %d\\n\", age);\n    } else {\n        printf(\"Invalid input, scanf returned %d\\n\", result);\n    }\n    return 0;\n}\n```\nFed `25`, it prints `Got age: 25`. Fed `abc` instead, `scanf` matches nothing at all — `age` is left completely untouched — and returns `0`, printing `Invalid input, scanf returned 0`. `scanf`'s return value is exactly how many `%`-specifiers it successfully filled; `1` here means success, anything less means at least one conversion failed, and any variables past the failure point are left with whatever they held before the call — never assume `scanf` worked without checking.\n\n**3. A mismatched specifier is a real, silent bug, not a style issue** — and GCC's `-Wformat` (bundled into `-Wall`) catches many of them directly:\n```c\nlong big = 123456789012345L;\nprintf(\"wrong: %d\\n\", big);\nprintf(\"right: %ld\\n\", big);\n```\n```\nwarning: format '%d' expects argument of type 'int', but argument 2 has type 'long int' [-Wformat=]\n```\nand the actual output:\n```\nwrong: -2045911175\nright: 123456789012345\n```\n`%d` tells `printf` to read exactly 4 bytes off the argument; `big` is really 8. The wrong specifier doesn't \"round\" or \"truncate\" the value sensibly — it reads the wrong number of bytes entirely, producing a number with no meaningful relationship to the real one. This is exactly the kind of undefined behavior Chapter 8.3 covers more generally — and exactly why `-Wall`'s format-checking warning should never be ignored.\n\n**4. `%e` and `%g` — when `%f` quietly loses a value entirely:**\n```c\n#include <stdio.h>\nint main(void) {\n    double tiny = 0.0000001234;\n    printf(\"%%f: %f\\n\", tiny);\n    printf(\"%%e: %e\\n\", tiny);\n    printf(\"%%g: %g\\n\", tiny);\n    return 0;\n}\n```\nOutput:\n```\n%f: 0.000000\n%e: 1.234000e-07\n%g: 1.234e-07\n```\n`%f`'s default six decimal places doesn't just round `tiny` — it obliterates it entirely, printing `0.000000` for a value that's very much not zero. `%e` forces scientific notation, always. `%g` is the pragmatic middle ground: it picks whichever of `%f`-style or `%e`-style is more compact for the actual value, which is why it's often the better default for a number whose magnitude you can't predict in advance.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `&` before a `scanf` destination.** `scanf(\"%d\", age)` (no `&`) compiles (often with a warning) but passes `age`'s *value* where `scanf` expects its *address* — it ends up trying to write through whatever garbage integer `age` happened to already hold, interpreted as a memory address. Almost always a crash, and exactly the kind of bug Chapter 5.2 explains the mechanism behind in full.\n- **Ignoring `scanf`'s return value.** As shown in Example 2, a failed conversion leaves the target variable completely unchanged — code that reads it anyway is reading uninitialized (or stale) data without knowing it failed at all.\n- **Using the wrong length modifier for the argument's real type** — `%d` for a `long`, `%f` for something that isn't actually a `double` after promotion, `%s` for something that isn't a valid `char*`. `-Wall`'s `-Wformat` catches a large fraction of these at compile time; never silence or ignore that specific warning category.\n- **Confusing `%s` precision with `%f` precision.** For `%f`, `.2` means \"2 digits after the decimal point.\" For `%s`, `.10` means \"print at most 10 characters\" — a different meaning for the same syntax, worth double-checking whichever one you're using.\n\n### How this connects\n\nYou now have full control over how values print and how input gets parsed — precisely, not just by pattern-matching examples. One piece of Part II remains: `const` and `volatile`, two qualifiers that describe *how* a variable can be used, closing out everything C's basic types have to offer before Part III moves into control flow.\n\n### Quick recap\n\n- Full specifier shape: `%[flags][width][.precision]specifier` — `-` left-aligns, `0` zero-pads, `.N` controls decimal places (`%f`) or max characters (`%s`).\n- Length modifiers (`l`, `ll`, `z`) must match the argument's real type — `%ld` for `long`, `%zu` for `size_t` — a mismatch is undefined behavior, not a cosmetic issue.\n- `scanf` needs the variable's *address* (`&var`) and returns how many specifiers it successfully matched — always check that return value before trusting the result.\n- `-Wall`'s `-Wformat` checking catches many specifier/argument mismatches at compile time — never ignore that warning category.\n- `%f`'s fixed six-decimal default can silently print `0.000000` for a genuinely tiny nonzero value; `%e` (always scientific) or `%g` (whichever is more compact) avoid losing it."}, {"id": "2.10", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: C's data & types", "chapNum": 10, "slug": "const-and-volatile-qualifiers", "fullTitle": "`const` and `volatile` Qualifiers", "title": "`const` and `volatile` Qualifiers", "md": "### Why this matters\n\n`const` has been quietly used since Chapter 1.5 — this chapter makes it fully explicit as one half of a pair of **type qualifiers**, words that don't change what a variable's type fundamentally *is*, only how the compiler is allowed to treat it. `volatile`, the other half, solves a problem `const` can't even see: what happens when a value can change for reasons entirely outside the compiler's view, like a hardware signal arriving mid-program. Skipping `volatile` doesn't produce a compiler error — it produces a program that can hang or misbehave in a way that's genuinely hard to diagnose, precisely because the compiler was confident it was making a safe optimization.\n\n### The core idea\n\n**`const`** tells the compiler \"this value doesn't change after initialization,\" and the compiler enforces it — any attempt to assign to a `const` variable, or through a `const` function parameter, is a compile error, not a runtime surprise. On a function parameter specifically, `const` is also documentation with teeth: it tells every caller, guaranteed by the compiler, \"this function will not modify what you passed in.\"\n\n**`volatile`** tells the compiler the *opposite* kind of thing: \"this value can change at any time, for reasons you (the compiler) cannot see — never assume a previously-read value is still valid, and never optimize away a re-read of it.\" Without `volatile`, an aggressive optimizer is fully entitled to notice \"this loop never modifies this variable through any code I can see\" and rewrite `while (!flag) { }` into an unconditional infinite loop — because as far as the compiler can prove, nothing in the visible program ever changes `flag`. The classic legitimate use is a variable modified inside a signal handler (Chapter 7.9) or by hardware — something genuinely outside the compiler's visibility.\n\n### Examples\n\n**1. `const` on a function parameter is a compiler-enforced promise:**\n```c\n#include <stdio.h>\nvoid show(const int x) {\n    printf(\"x = %d\\n\", x);\n    x = 99;\n}\nint main(void) {\n    show(5);\n    return 0;\n}\n```\n```\nerror: assignment of read-only parameter ‘x’\n```\nThe function simply cannot compile if it tries to modify `x` — the promise \"this function won't change what you gave it\" is checked, not just documented in a comment that could quietly go stale.\n\n**2. Skipping `volatile` on a signal-modified flag causes a real, reproducible infinite loop, at a real optimization level:**\n```c\n#include <stdio.h>\n#include <signal.h>\n#include <unistd.h>\n\nint flag_plain = 0;\n\nvoid handler(int sig) {\n    (void)sig;\n    flag_plain = 1;\n}\n\nint main(void) {\n    signal(SIGALRM, handler);\n    alarm(1);\n    printf(\"waiting (plain int)...\\n\");\n    while (!flag_plain) {\n        /* busy wait */\n    }\n    printf(\"done waiting, flag_plain = %d\\n\", flag_plain);\n    return 0;\n}\n```\nCompiled with optimization on (`gcc -O2`) and run with a safety timeout:\n```\nwaiting (plain int)...\n(killed after 3 seconds — never printed \"done waiting\")\n```\nThe alarm genuinely fires, and the handler genuinely sets `flag_plain = 1` — but the compiler, seeing no code in `main` itself that could ever change `flag_plain`, optimized the loop's condition check down to reading it exactly once and looping forever on that cached answer. Marking it `volatile` (and, properly, `sig_atomic_t` — the type the standard specifically guarantees is safe to modify inside a signal handler) fixes it completely:\n```c\nvolatile sig_atomic_t flag = 0;\n```\nSame compiler, same `-O2`, same logic — this version reliably finishes within about a second:\n```\nwaiting (volatile)...\ndone waiting, flag = 1\n```\n`volatile` forces the compiler to genuinely re-read `flag` from memory on every single loop iteration, exactly as the logic actually requires.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `const` makes a value safe from all modification, including through a separate non-`const` pointer to the same memory.** `const` restricts what you can do *through that specific variable or parameter* — it doesn't make the underlying memory itself immutable if something else has ordinary, non-`const` access to it. Chapter 5.9 covers the sharper edges of `const` combined with pointers specifically.\n- **Reaching for `volatile` to make code \"thread-safe.\"** It doesn't — `volatile` only stops the *compiler* from caching a value in a register across accesses; it does nothing about the CPU or operating system reordering memory operations between actual threads. Real multi-threaded safety needs different, heavier tools entirely (outside this book's scope, per the syllabus).\n- **Forgetting `volatile` on anything genuinely modified by a signal handler.** As shown above, the bug this causes is a real, silent hang at higher optimization levels — code that works perfectly at `-O0` and then mysteriously freezes once optimizations are turned on for a release build. This is exactly the kind of bug that \"it worked on my machine\" doesn't catch, because a debug build often isn't optimized enough to trigger it.\n- **Using plain `int` for a signal-handler flag instead of `volatile sig_atomic_t`.** `sig_atomic_t` (from `<signal.h>`) is the type the C standard specifically guarantees can be read and written atomically even if a signal arrives mid-operation — a plain `int`, even marked `volatile`, doesn't carry that specific guarantee on every platform.\n\n### How this connects\n\nPart II is now genuinely complete: you can name, hold, convert, format, and now qualify every kind of basic value C offers. Part III moves from data itself into real control flow — starting with the most fundamental decision a program makes, `if`.\n\n### Quick recap\n\n- `const` is a compiler-enforced promise that a value won't be reassigned through that variable or parameter — checked at compile time, not just documented.\n- `volatile` tells the compiler a value can change for reasons outside its view, forcing a genuine re-read from memory every time, instead of trusting a cached copy.\n- Skipping `volatile` on a value modified by a signal handler can produce a real, reproducible infinite loop or hang — specifically at higher optimization levels, which is exactly what makes it a nasty, easy-to-miss bug in practice.\n- `volatile sig_atomic_t` (not plain `volatile int`) is the standard's actual guarantee for a variable safely shared with a signal handler.\n- `volatile` is not a thread-safety tool — it solves a compiler-optimization problem, not a hardware-reordering one."}, {"id": "3.1", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 1, "slug": "making-decisions-if-else-if-else", "fullTitle": "Making Decisions: `if` / `else if` / `else`", "title": "Making Decisions: `if` / `else if` / `else`", "md": "### Why this matters\n\nEvery program that does more than one fixed thing needs to branch based on a condition. C's `if` is the foundation all of that branching is built on — familiar-looking if you've programmed before, but with a couple of specific habits worth building correctly from the very first one you write, since the alternative habits fail silently rather than loudly.\n\n### The core idea\n\n```c\nif (condition) {\n    // runs if condition is nonzero\n} else if (another_condition) {\n    // runs if the first was 0 and this one is nonzero\n} else {\n    // runs if none of the above were\n}\n```\n`else if` is genuinely two words — C has no separate `elif` keyword; it's just an `else` whose body happens to be another `if`. A `condition` can be *any* expression that produces a number: C has no requirement that it be a \"real\" boolean. `0` means false; **anything else — any nonzero number at all — means true.** `bool`/`true`/`false` from `<stdbool.h>` (Chapter 1.3) are really just `int`s underneath, `0` and `1`, following the exact same rule.\n\n### Examples\n\n**1. A straightforward `if`/`else if`/`else` chain:**\n```c\n#include <stdio.h>\nint main(void) {\n    int score = 82;\n    if (score >= 90) {\n        printf(\"A\\n\");\n    } else if (score >= 80) {\n        printf(\"B\\n\");\n    } else if (score >= 70) {\n        printf(\"C\\n\");\n    } else {\n        printf(\"F\\n\");\n    }\n    return 0;\n}\n```\nOutput: `B`. Each condition is checked in order, top to bottom, and the *first* one that's true wins — the `score >= 70` branch is never even reached once `score >= 80` already matched.\n\n**2. Any nonzero value is true — not just `1`, and not just a comparison's result:**\n```c\n#include <stdio.h>\nint main(void) {\n    int count = 5;\n    if (count) {\n        printf(\"count is truthy\\n\");\n    }\n    int zero = 0;\n    if (!zero) {\n        printf(\"zero is falsy, !zero is truthy\\n\");\n    }\n    return 0;\n}\n```\nOutput:\n```\ncount is truthy\nzero is falsy, !zero is truthy\n```\n`if (count)` needs no `!= 0` written explicitly — `count` itself, being `5`, is already a valid (truthy) condition on its own. This is idiomatic C, not a shortcut to be suspicious of, though it's worth being intentional about it — `if (count)` reads as \"if count is nonzero,\" and that should genuinely be what you mean.\n\n### ⚠️ Common Mistakes\n\n- **Omitting braces and assuming indentation controls what's \"inside\" the `if.`** It doesn't — C ignores whitespace entirely. Without `{ }`, only the *single next statement* belongs to the `if`:\n  ```c\n  if (x > 10)\n      printf(\"big\\n\");\n      printf(\"this always runs regardless of the if!\\n\");\n  ```\n  The second `printf` runs every time, `x > 10` or not, no matter how it's indented — GCC's own warning names the danger precisely: `this 'if' clause does not guard... but the latter is misleadingly indented as if it were guarded by the 'if'`. Always use `{ }`, even for a single statement — it costs nothing and eliminates this entire class of bug.\n- **The dangling-`else` ambiguity**, when an `else` could plausibly belong to either of two nested, brace-less `if`s:\n  ```c\n  if (a)\n      if (b)\n          printf(\"inner true\\n\");\n      else\n          printf(\"...\\n\");\n  ```\n  C's rule is fixed: an `else` always binds to the *nearest* unmatched `if` — here, the inner one, regardless of indentation suggesting otherwise. GCC flags this directly: `suggest explicit braces to avoid ambiguous 'else'`. Braces resolve it unambiguously, for the reader and the compiler alike.\n- **Writing `if (x = 5)` instead of `if (x == 5)`.** Covered in full back in Chapter 1.4 — worth the reminder here, since it's an `if` condition specifically where this mistake actually bites.\n- **Comparing a `float`/`double` with `==` inside a condition.** Also covered already (Chapter 2.3) — an `if` is exactly where that mistake turns into a branch silently going the wrong way.\n\n### How this connects\n\n`if` is the simplest branch; the next chapter covers `switch`, a different, often clearer way to branch on one value against several specific possibilities.\n\n### Quick recap\n\n- `if (condition) { } else if (condition) { } else { }` — `else if` is two separate keywords, evaluated top to bottom, first true branch wins.\n- Any nonzero value is a true condition — not just `1`, and not just the result of a comparison; `if (count)` is idiomatic for \"if count is nonzero.\"\n- Omitting `{ }` means only the single next statement is actually inside the `if` — indentation is not enforced by the compiler and can mislead a reader badly. Always use braces.\n- An `else` with no braces always binds to the nearest unmatched `if`, which may not be the one indentation suggests — GCC's `-Wdangling-else` flags this directly."}, {"id": "3.2", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 2, "slug": "the-switch-statement", "fullTitle": "The `switch` Statement", "title": "The `switch` Statement", "md": "### Why this matters\n\nA long chain of `else if`s, all comparing the *same* variable against different fixed values, is exactly the pattern `switch` exists to express more directly. It's not more powerful than `if`/`else if` — anything `switch` does, a chain of `if`s can also do — but for this one specific, common shape, it reads cleaner and it's worth knowing precisely, including the one behavior that trips up nearly everyone at least once.\n\n### The core idea\n\n```c\nswitch (expression) {\n    case value1:\n        // runs if expression == value1\n        break;\n    case value2:\n        // runs if expression == value2\n        break;\n    default:\n        // runs if nothing else matched\n}\n```\n`expression` must evaluate to an integer type (`int`, `char`, an enum — not a `float`/`double`, and not a string). Each `case` label must be a **constant expression**, known at compile time — a literal, or something built purely from literals, never a variable. `default` is optional, but strongly recommended — it catches anything not explicitly listed.\n\nThe single most important behavior to internalize: **execution \"falls through\" from one case into the next unless a `break` stops it.** `switch` doesn't automatically exit after running a matching case's code — it just jumps *in* at the matching label and then keeps executing everything below it, across `case` boundaries, until it hits a `break` or the closing `}`.\n\n### Examples\n\n**1. A straightforward `switch`, each case ending in `break`:**\n```c\n#include <stdio.h>\nint main(void) {\n    int day = 3;\n    switch (day) {\n        case 1:\n            printf(\"Monday\\n\");\n            break;\n        case 2:\n            printf(\"Tuesday\\n\");\n            break;\n        case 3:\n            printf(\"Wednesday\\n\");\n            break;\n        default:\n            printf(\"Some other day\\n\");\n    }\n    return 0;\n}\n```\nOutput: `Wednesday`. `day` is compared against each `case` in turn until one matches; `break` then exits the whole `switch` immediately.\n\n**2. Fall-through, used on purpose — and the exact same mechanism, used by accident:**\n```c\nswitch (day) {\n    case 6:\n    case 7:\n        printf(\"Weekend\\n\");\n        break;\n    case 1:\n        printf(\"Monday\\n\");\n        // oops, forgot break\n    case 2:\n        printf(\"Tuesday (fell through!)\\n\");\n        break;\n    default:\n        printf(\"Other\\n\");\n}\n```\nWith `day = 6`: `case 6:` has no code of its own, so it falls straight into `case 7:`'s body — this is the standard, intentional idiom for \"these two values do the same thing,\" and it prints just `Weekend`. But with `day = 1`: the missing `break` after `printf(\"Monday\\n\");` means execution keeps going right into `case 2:`'s body too, printing both:\n```\nMonday\nTuesday (fell through!)\n```\nIdentical mechanism, opposite intent — one is a deliberate idiom, the other is a bug, and nothing about the syntax itself distinguishes them. GCC's `-Wextra` (not plain `-Wall` alone) flags exactly this: `this statement may fall through`, right on the line missing its `break`.\n\n**3. A `case` value must be a genuine compile-time constant:**\n```c\nint val = 3;\nswitch (x) {\n    case val:   // val is a variable, not a constant\n        ...\n}\n```\n```\nerror: case label does not reduce to an integer constant\n```\nThis is a real, common trip-up for anyone expecting `switch` to work like a general comparison — it can only match against values the compiler can resolve *before* the program ever runs, which rules out variables entirely (a `#define`d or `const` constant, or a plain literal, works fine).\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `break` and not meaning to.** As shown above, this is silent — no warning at all from plain `-Wall`; only `-Wextra` catches it (with `-Wimplicit-fallthrough`). Compile with `-Wextra` (Chapter 8.1 makes the case for this pairing generally) specifically so this class of bug gets caught before it ships.\n- **Trying to `switch` on a `float`, `double`, or a string.** `switch` only works on integer types — comparing text needs `strcmp` inside an `if`/`else if` chain instead (Chapter 7.1).\n- **Using a variable, or any non-constant expression, as a `case` label.** As shown above, this is a compile error, not a runtime surprise — but it does mean `switch` can't replace every `if`/`else if` chain, specifically any that compares against a value only known while the program is running.\n- **Two `case` labels with the same value.** Also a compile error (`duplicate case value`) — impossible to reach one of them, so the compiler refuses outright rather than silently picking one.\n\n### How this connects\n\n`switch` and `if` cover branching on a condition; `select` menus and interactive choice — a different problem, reading a user's raw choice — aren't in this book's scope the way they were in the companion Bash book, since C's standard input handling (`scanf`, already covered in Chapter 2.9) takes a more manual shape. The next chapter moves to repetition: `for` loops.\n\n### Quick recap\n\n- `switch (expr) { case val: ...; break; ... default: ... }` — `expr` must be an integer type; each `case` label must be a compile-time constant, never a variable.\n- Execution falls through from one matching case into the next unless a `break` stops it — the same mechanism is both the standard way to group cases together *and* the most common `switch`-related bug.\n- Plain `-Wall` does not catch a missing `break`; `-Wextra`'s `-Wimplicit-fallthrough` does.\n- `switch` cannot compare `float`/`double` values or strings — only integer types.\n- `default` is optional but a good habit — it's your catch-all for anything not explicitly listed."}, {"id": "3.3", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 3, "slug": "for-loops", "fullTitle": "`for` Loops", "title": "`for` Loops", "md": "### Why this matters\n\nAlmost everything a program does repeatedly — processing every element of an array, counting, building up a result step by step — needs a loop. `for` is C's workhorse for the specific, extremely common case of \"repeat a known number of times, tracking a counter,\" and its three-part header is worth understanding as three genuinely separate, independently optional pieces, not one indivisible block of syntax.\n\n### The core idea\n\n```c\nfor (initialization; condition; update) {\n    // runs while condition is true\n}\n```\nAll three clauses run in a fixed order: **initialization** once, before anything else; then **condition** is checked — if true, the body runs, then **update** runs, then condition is checked again; this repeats until condition is false. A variable declared *inside* the initialization clause (`for (int i = 0; ...)`) is scoped to the loop alone — it does not exist before or after it.\n\n### Examples\n\n**1. The classic counting loop:**\n```c\n#include <stdio.h>\nint main(void) {\n    for (int i = 0; i < 5; i++) {\n        printf(\"i = %d\\n\", i);\n    }\n    return 0;\n}\n```\nOutput: `i = 0` through `i = 4` — five lines, exactly matching `i < 5`.\n\n**2. More than one variable, using the comma operator to update both:**\n```c\n#include <stdio.h>\nint main(void) {\n    for (int i = 0, j = 10; i < j; i++, j--) {\n        printf(\"i=%d j=%d\\n\", i, j);\n    }\n    return 0;\n}\n```\nOutput:\n```\ni=0 j=10\ni=1 j=9\ni=2 j=8\ni=3 j=7\ni=4 j=6\n```\nBoth `i` and `j` are declared together in the initialization clause, and both get updated together via the comma-separated `i++, j--`. The loop stops the moment `i < j` becomes false.\n\n**3. The loop variable genuinely doesn't exist outside the loop:**\n```c\nfor (int i = 0; i < 3; i++) {\n}\nprintf(\"%d\\n\", i);\n```\n```\nerror: 'i' undeclared (first use in this function)\n```\nIf you need the final value of a loop counter after the loop ends, declare it *before* the loop instead (`int i; for (i = 0; ...)`), so it stays in scope past the closing `}`.\n\n### ⚠️ Common Mistakes\n\n- **A stray semicolon right after the `for(...)` header**, turning the loop body into an empty statement:\n  ```c\n  for (int i = 0; i < 5; i++);\n  {\n      count++;\n      printf(\"count = %d\\n\", count);\n  }\n  ```\n  This compiles, and GCC's `-Wmisleading-indentation` flags exactly the danger: the loop runs five times doing *nothing at all* (the `;` is its entire body), and the `{ }` block below — which looks like it's the loop's body — is actually a separate, ordinary block that runs exactly **once**, after the loop has already finished. Output: `count = 1`, not `count = 5`. This is the `for`-loop version of the missing-braces mistake from Chapter 3.1, and the fix is the same instinct: watch for a stray `;` immediately after a header that's supposed to control a block.\n- **Off-by-one errors from `<=` vs `<`.** `for (int i = 0; i <= 5; i++)` runs *six* times (`0` through `5` inclusive), not five — worth double-checking against exactly how many iterations you actually want, especially against an array's size (Chapter 2.6), where a valid index only ever goes up to `size - 1`.\n- **Modifying the loop variable inside the body**, on top of what the `update` clause already does. It's legal, but it changes the iteration count in a way that's easy to lose track of — if you need to skip ahead or repeat, `continue`/`break` (Chapter 3.5) usually express the intent more clearly than hand-adjusting the counter.\n- **Leaving a clause empty without meaning to create an infinite loop.** `for (;;)` (all three clauses empty) is valid, idiomatic C for \"loop forever, exit via `break` inside\" — but an accidentally-empty *condition* clause specifically (`for (int i = 0; ; i++)`) does exactly the same thing, silently, if you meant to write a real condition there and simply forgot it.\n\n### How this connects\n\n`for` is the right tool when you know roughly how many times you're repeating, or you're counting through something. The next chapter covers `while` and `do-while` — better suited to \"repeat until some condition changes,\" where a fixed count isn't known in advance.\n\n### Quick recap\n\n- `for (init; condition; update) { }` — all three clauses are independently optional; a variable declared in `init` is scoped to the loop alone.\n- The comma operator lets you initialize and update more than one variable in a single `for` header.\n- A stray `;` right after the `for(...)` header silently turns the loop's body into a no-op — GCC's `-Wmisleading-indentation` catches this, the same way it catches the analogous `if` mistake.\n- `<=` instead of `<` is the classic off-by-one, especially against an array's valid index range.\n- `for (;;)` is idiomatic for \"loop forever, `break` inside\" — the same shape by accident (an empty condition you meant to fill in) is a real bug, not a style choice."}, {"id": "3.4", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 4, "slug": "while-and-do-while-loops", "fullTitle": "`while` and `do-while` Loops", "title": "`while` and `do-while` Loops", "md": "### Why this matters\n\n`for` (last chapter) is at its best when you roughly know how many times you're repeating. Plenty of real repetition doesn't work that way — \"keep trying until it succeeds,\" \"keep reading until there's nothing left\" — where the number of iterations depends entirely on what happens *during* the loop. `while` and `do-while` are built for exactly that shape, and they differ from each other in one specific, important way.\n\n### The core idea\n\n```c\nwhile (condition) {\n    // runs repeatedly, checked BEFORE each iteration\n}\n```\n```c\ndo {\n    // runs repeatedly, checked AFTER each iteration\n} while (condition);\n```\nThe difference is precisely when the condition gets checked. `while` checks *before* running the body even once — if the condition is false from the very start, the body never runs at all. `do-while` checks *after* — the body always runs **at least once**, no matter what the condition turns out to be. Note the semicolon after `do-while`'s closing `while (condition);` — easy to forget, since ordinary `while` and `for` loops don't end in one.\n\n### Examples\n\n**1. A basic countdown with `while`:**\n```c\n#include <stdio.h>\nint main(void) {\n    int n = 5;\n    while (n > 0) {\n        printf(\"n = %d\\n\", n);\n        n--;\n    }\n    return 0;\n}\n```\nOutput: `n = 5` down to `n = 1`. The condition is re-checked before every single iteration, including the very first.\n\n**2. The exact difference, made concrete — a condition that's already false before the loop starts:**\n```c\n#include <stdio.h>\nint main(void) {\n    int x = 10;\n    printf(\"-- while --\\n\");\n    while (x < 5) {\n        printf(\"while body ran, x=%d\\n\", x);\n    }\n    printf(\"-- do-while --\\n\");\n    do {\n        printf(\"do-while body ran, x=%d\\n\", x);\n    } while (x < 5);\n    return 0;\n}\n```\nOutput:\n```\n-- while --\n-- do-while --\ndo-while body ran, x=10\n```\n`x < 5` is false from the start in both cases — the `while` loop's body never runs, not even once, while the `do-while`'s body runs exactly once regardless, purely because it checks *after*.\n\n**3. A retry-style pattern, the kind of shape `do-while` fits naturally:**\n```c\n#include <stdio.h>\nint main(void) {\n    int attempts = 0;\n    int success = 0;\n    do {\n        attempts++;\n        printf(\"attempt %d\\n\", attempts);\n        if (attempts == 3) success = 1;\n    } while (!success && attempts < 5);\n    printf(\"finished after %d attempts\\n\", attempts);\n    return 0;\n}\n```\nOutput:\n```\nattempt 1\nattempt 2\nattempt 3\nfinished after 3 attempts\n```\n\"Try at least once, then keep trying until either it succeeds or you've hit a cap\" is exactly the shape a `do-while` expresses more naturally than a `while` would — a `while` version needs the first attempt duplicated before the loop, or an awkward always-true flag to fake the \"run once first\" behavior.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the semicolon after `do { ... } while (condition)`.** Unlike `while` and `for`, `do-while` genuinely ends in a semicolon — it's easy to drop out of habit, and doing so is a compile error.\n- **Reaching for `do-while` when you actually need `while`'s \"maybe zero times\" behavior.** If there's any chance the condition is already false before the loop should run at all — processing a list that might be empty, for instance — `do-while`'s guaranteed-at-least-once execution is the wrong tool, not just a stylistic mismatch.\n- **Writing a condition that never becomes false, unintentionally.** Both loops repeat forever if nothing inside the body ever changes the condition's outcome — always double-check that something inside the loop genuinely moves the condition toward becoming false eventually. (An intentional `while (1) { ... break; ... }` is a legitimate, common idiom — the danger is the *unintentional* version.)\n- **Confusing which loop is \"checked first.\"** A quick way to keep it straight: the keyword that comes *first* in the loop is where the condition physically sits — `while (condition) { }` checks up front; `do { } while (condition);` checks at the very end, after `do`'s body has already run once.\n\n### How this connects\n\nYou now have all three of C's loop constructs — `for`, `while`, `do-while` — each suited to a slightly different shape of repetition. The next chapter covers `break` and `continue`, the tools for changing a loop's flow from *inside* its body, applicable to all three.\n\n### Quick recap\n\n- `while (condition) { }` checks *before* each iteration — the body may run zero times.\n- `do { } while (condition);` checks *after* each iteration — the body always runs at least once. Don't forget the trailing semicolon.\n- Choose based on whether \"might need to run zero times\" is actually possible for your specific loop — that's the entire decision.\n- Both loops repeat forever unless something inside the body eventually makes the condition false — an intentional infinite loop (`while (1)`) relies on an internal `break` instead."}, {"id": "3.5", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 5, "slug": "break-continue-goto", "fullTitle": "`break`, `continue` & `goto`", "title": "`break`, `continue` & `goto`", "md": "### Why this matters\n\nA loop's own condition controls when it stops naturally, but real logic often needs to react *inside* the loop body — stop early the instant something's found, skip just this one iteration without stopping entirely. `break` and `continue` are exactly that fine-grained control, and `goto` — usually avoided, but not always — covers the one specific gap the other two can't reach.\n\n### The core idea\n\n- **`break`** immediately exits the loop (or `switch`) it's directly inside — no more iterations, execution jumps straight past the closing `}`.\n- **`continue`** skips the *rest of the current iteration* only — it jumps straight to the loop's next check, not out of the loop entirely.\n- **`goto label;`** jumps directly to a `label:` elsewhere in the same function, unconditionally. Real code should reach for it rarely — nearly everything it can do, structured loops and `break`/`continue` do more clearly — but it has one genuinely accepted use: escaping multiple nested loops at once, something `break` alone cannot do.\n\n### Examples\n\n**1. `break` only exits the loop it's *directly* inside — not every loop it happens to be nested within:**\n```c\n#include <stdio.h>\nint main(void) {\n    for (int i = 0; i < 3; i++) {\n        for (int j = 0; j < 3; j++) {\n            if (j == 1) break;\n            printf(\"i=%d j=%d\\n\", i, j);\n        }\n    }\n    return 0;\n}\n```\nOutput:\n```\ni=0 j=0\ni=1 j=0\ni=2 j=0\n```\nThe `break` fires every time `j` reaches `1`, but only ever stops the *inner* loop — the outer loop keeps running all three of its own iterations, restarting the inner loop fresh each time.\n\n**2. `continue` behaves differently depending on which loop it's in — the same word does not mean the same thing everywhere.** In a `for` loop, `continue` still runs the **update** clause before re-checking the condition:\n```c\nfor (int i = 0; i < 5; i++) {\n    if (i % 2 == 0) continue;\n    printf(\"odd: %d\\n\", i);\n}\n```\nOutput: `odd: 1` then `odd: 3` — `i++` still happens on every iteration, even the skipped ones, because `continue` in a `for` loop jumps to the update clause, not past it.\n\nIn a `while` loop, there is no separate update clause — `continue` jumps straight to the condition check, skipping *everything* below it in the body, including any increment you wrote there yourself:\n```c\nint i = 0;\nwhile (i < 5) {\n    if (i == 2) { continue; }\n    printf(\"i=%d\\n\", i);\n    i++;\n}\n```\nThe instant `i` reaches `2`, `continue` skips straight past `i++` and back to `while (i < 5)` — but `i` is still `2`, so the condition is true again, `continue` fires again, forever. This specific pattern is a classic, genuinely common way to accidentally write an infinite loop.\n\n**3. `goto`, for the one job it's still widely accepted for: escaping nested loops in one step:**\n```c\n#include <stdio.h>\nint main(void) {\n    for (int i = 0; i < 3; i++) {\n        for (int j = 0; j < 3; j++) {\n            if (i == 1 && j == 1) goto done;\n            printf(\"i=%d j=%d\\n\", i, j);\n        }\n    }\ndone:\n    printf(\"escaped both loops\\n\");\n    return 0;\n}\n```\nOutput:\n```\ni=0 j=0\ni=0 j=1\ni=0 j=2\ni=1 j=0\nescaped both loops\n```\nThe moment `i == 1 && j == 1`, execution jumps straight to `done:`, skipping the rest of *both* loops entirely — something a plain `break` genuinely cannot do on its own, since it only ever escapes the loop it's directly inside.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `break` exits every loop it's nested inside.** As shown above, it only ever exits the *one* loop directly containing it. A boolean \"should I stop\" flag checked in each loop's own condition, or `goto`, are the two real ways to escape more than one level at once.\n- **Writing `continue` in a `while` loop with the increment placed *after* it in the body.** As shown above, this is a genuine, common source of infinite loops — the increment silently never runs once `continue` starts firing. Placing the increment *before* the `continue` check (or restructuring as a `for` loop, where the update clause is protected from this) avoids it entirely.\n- **Reaching for `goto` as a general substitute for structured control flow.** Its one broadly-accepted modern use is nested-loop escape (Example 3) and, in some C codebases, centralizing cleanup code at the end of a function (a pattern Chapter 5.7 revisits once pointers and manual memory are in play). Using it to replace ordinary loops or conditionals makes code substantially harder to follow, and is rightly discouraged.\n- **Jumping into the middle of a block with a variable declaration via `goto`.** Jumping past a variable's initialization and then trying to use it is a real bug source specific to `goto`'s freedom — structured loops never allow this by construction, which is itself a reason to prefer them.\n\n### How this connects\n\nYou now have full control over a loop's flow from the inside. The next chapter looks at the ternary operator — a compact, expression-level alternative to a simple `if`/`else`, closing out Part III's coverage of control flow.\n\n### Quick recap\n\n- `break` exits the loop (or `switch`) it's directly inside — never more than one level, even when nested.\n- `continue` skips to the next iteration — in a `for` loop, the update clause still runs first; in a `while`/`do-while`, it jumps straight to the condition, skipping anything below it, including an increment placed there.\n- `continue` in a `while` loop with the increment written after it is a classic, real way to accidentally write an infinite loop.\n- `goto label;` jumps unconditionally to a label in the same function — genuinely useful for escaping nested loops in one step, otherwise best avoided in favor of structured control flow."}, {"id": "3.6", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 6, "slug": "the-ternary-operator", "fullTitle": "The Ternary Operator", "title": "The Ternary Operator", "md": "### Why this matters\n\n`if`/`else` is a *statement* — it controls which code runs, but it doesn't itself produce a value. Often what you actually want is smaller: pick *one of two values* based on a condition, right in the middle of an expression. C's ternary operator does exactly that, compactly, and it's worth knowing precisely rather than avoiding just because the syntax looks unfamiliar at first.\n\n### The core idea\n\n```c\ncondition ? value_if_true : value_if_false\n```\nThis is an **expression**, not a statement — it evaluates to one of the two values, and can be used anywhere a value is expected: assigned to a variable, passed directly as a function argument, embedded inside a larger expression. It's the only operator in C that takes three operands, which is why it's sometimes called \"the conditional operator\" or simply \"the ternary.\"\n\n### Examples\n\n**1. The most common use — a compact stand-in for a simple `if`/`else` that only picks a value:**\n```c\n#include <stdio.h>\nint main(void) {\n    int a = 7, b = 3;\n    int max = (a > b) ? a : b;\n    printf(\"max = %d\\n\", max);\n    printf(\"directly in printf: %d\\n\", (a > b) ? a : b);\n    return 0;\n}\n```\nOutput:\n```\nmax = 7\ndirectly in printf: 7\n```\nSince it's an expression, it can be used directly inside a function call's argument list, exactly as shown in the second line — no temporary variable needed.\n\n**2. When the two branches have different types, the result's type follows the same conversion rules as any other mixed expression** (Chapter 2.1) — regardless of which branch is actually taken:\n```c\n#include <stdio.h>\nint main(void) {\n    int flag = 1;\n    double result = flag ? 5 : 2.5;\n    printf(\"result = %f\\n\", result);\n    return 0;\n}\n```\nOutput: `result = 5.000000`. The `int` branch (`5`) is the one actually chosen, but the ternary's overall type is determined by *both* branches together (`int` and `double` combine to `double`, the same promotion rule from Chapter 2.1) — so the chosen `5` is itself converted to a `double` before the assignment, not left as a plain `int`.\n\n### ⚠️ Common Mistakes\n\n- **Trying to use an assignment as one of the ternary's branches, without parentheses.** The ternary operator binds *tighter* than assignment does, so an unparenthesized assignment in the false branch doesn't do what it looks like it does:\n  ```c\n  a > 3 ? x = 10 : x = 20;\n  ```\n  ```\n  error: lvalue required as left operand of assignment\n  ```\n  This is actually parsed as `(a > 3 ? x = 10 : x) = 20;` — the whole ternary expression on the left, being assigned `20` — and a ternary's result isn't a valid assignment target. Parenthesizing the branch that needs it fixes this cleanly: `a > 3 ? x = 10 : (x = 20);`\n- **Nesting ternaries several levels deep to replace a whole `if`/`else if`/`else` chain.** It's legal, but readability drops fast past one level of nesting — a real `if`/`else if` chain (Chapter 3.1) is almost always clearer once there are more than two outcomes to choose between.\n- **Using a ternary purely for its side effects**, like `condition ? do_a() : do_b();` as a whole statement, discarding the value it produces entirely. This works, but it throws away the one thing that makes a ternary worth using over a plain `if`/`else` — its *value*. If nothing uses the result, a plain `if`/`else` says the same thing more clearly.\n- **Forgetting the ternary is right-associative when chaining more than one**, which can produce a different grouping than a first read suggests. When in doubt, add explicit parentheses around each nested ternary rather than relying on the default grouping.\n\n### How this connects\n\nPart III is complete: `if`, `switch`, `for`, `while`/`do-while`, `break`/`continue`/`goto`, and now the ternary operator cover every way C expresses a decision or a repetition. Part IV moves to functions — the grammar for building your own reusable sentences out of everything learned so far.\n\n### Quick recap\n\n- `condition ? value_if_true : value_if_false` is an **expression** that produces a value — usable anywhere a value is expected, unlike `if`/`else`.\n- When the two branches have different types, the result's type follows the usual conversion rules, applied to both branches together — not just whichever one is actually chosen.\n- An unparenthesized assignment as a branch doesn't do what it looks like — the ternary binds tighter than `=`, so parenthesize the branch explicitly when it needs to be an assignment.\n- Keep nesting shallow — past one level, a real `if`/`else if` chain almost always reads more clearly."}, {"id": "4.1", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 1, "slug": "defining-functions", "fullTitle": "Defining Functions", "title": "Defining Functions", "md": "### Why this matters\n\nEvery program so far in this book has lived entirely inside `main`. That works for small examples, but real programs need to break logic into named, reusable, independently-understandable pieces — exactly what a function is for. You've already used one (`main` itself, and a couple of small helpers along the way) — this chapter makes defining your own fully explicit.\n\n### The core idea\n\n```c\nreturn_type function_name(parameter_type param_name, ...) {\n    // body\n    return value;   // required unless return_type is void\n}\n```\nA function that returns nothing meaningful uses `void` as its return type, and simply omits the `return value;` (or uses a bare `return;` to exit early). Parameters work exactly like local variable declarations — each one needs both a type and a name, and inside the function body, they behave like ordinary local variables initialized to whatever was passed in.\n\nOne rule that matters more in C than in many other languages: a function generally needs to be **declared before it's used** — the compiler reads top to bottom, and by the time it reaches a call, it needs to already know the function's return type and parameter types to check the call is correct. Chapter 4.2 covers this properly, including the standard fix (declaring a function's signature separately from its body); this chapter's examples simply define each function before `main` uses it, sidestepping the issue for now.\n\n### Examples\n\n**1. A function that computes and returns a value, and one that returns nothing:**\n```c\n#include <stdio.h>\n\nint add(int a, int b) {\n    return a + b;\n}\n\nvoid greet(const char *name) {\n    printf(\"Hello, %s!\\n\", name);\n}\n\nint main(void) {\n    int sum = add(3, 4);\n    printf(\"sum = %d\\n\", sum);\n    greet(\"Alice\");\n    return 0;\n}\n```\nOutput:\n```\nsum = 7\nHello, Alice!\n```\n`add` computes a value and hands it back via `return`; `greet` is declared `void` — it does something (prints) but produces no value for the caller to use.\n\n**2. Calling a function before the compiler has seen its definition:**\n```c\n#include <stdio.h>\n\nint main(void) {\n    int result = square(5);\n    printf(\"result = %d\\n\", result);\n    return 0;\n}\n\nint square(int x) {\n    return x * x;\n}\n```\n```\nwarning: implicit declaration of function 'square' [-Wimplicit-function-declaration]\n```\nThis actually still links and runs correctly here, purely because `square` happens to be defined later in the very same file with a signature matching what the compiler had to guess — but it's relying on luck, not a guarantee, and on some setups (or with a genuinely mismatched guess) this becomes a hard error or a real bug instead. Never rely on this; either define the function earlier in the file, or forward-declare it (Chapter 4.2).\n\n**3. A missing `return` in a function that isn't `void` compiles, with a warning — and then genuinely returns garbage:**\n```c\nint compute(int x) {\n    if (x > 0) {\n        return x * 2;\n    }\n    // no return if x <= 0\n}\n```\n```\nwarning: control reaches end of non-void function [-Wreturn-type]\n```\nCalling `compute(-5)` printed `-1320554141` — some unrelated leftover value, not `0` and not any sensible default. Unlike `main` (Chapter 1.1), no other function gets a free pass on a missing `return` — every non-`void` function must genuinely return a value on every possible path through it.\n\n### ⚠️ Common Mistakes\n\n- **Relying on a function working when called before it's been declared.** As shown above, this is undefined behavior if the compiler's guessed signature doesn't match reality, and merely a fragile accident even when it happens to work. Chapter 4.2 gives the real fix.\n- **Leaving a code path in a non-`void` function without a `return`.** The compiler's `-Wreturn-type` warning is one of the most important ones in this entire book to never ignore — the \"successful\" compile hides a function that can return genuinely meaningless data.\n- **Forgetting `void` for a function that returns nothing.** Omitting the return type entirely isn't valid in modern C the way it may be in some older code you encounter — always write `void` explicitly when there's truly nothing to return.\n- **Confusing a parameter's name with the argument's name at the call site.** `add(3, 4)`'s `3` becomes `a` and `4` becomes `b` purely by *position*, not by any name matching — C has no keyword-argument mechanism the way some other languages do.\n\n### How this connects\n\nYou can now define and call functions with real parameters and return values. The next chapter looks precisely at the declaration-versus-definition split this chapter deliberately sidestepped, and exactly how to call a function before its full definition appears.\n\n### Quick recap\n\n- `return_type name(params) { ... return value; }` — `void` for a function with nothing to return; every other return type needs a real `return` on every possible path.\n- Parameters behave like local variables, initialized from whatever the caller passed, matched purely by position — not by name.\n- A function generally must be declared before it's called; calling one the compiler hasn't seen yet produces `implicit declaration of function`, a warning worth treating as a real bug, not a formality.\n- A missing `return` in a non-`void` function compiles (with `-Wreturn-type`) and returns genuinely meaningless data if that path is ever taken — never ignore that specific warning."}, {"id": "4.2", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 2, "slug": "function-declarations-vs-definitions", "fullTitle": "Function Declarations vs. Definitions", "title": "Function Declarations vs. Definitions", "md": "### Why this matters\n\nChapter 4.1 sidestepped a real limitation: every function had to be fully written out *before* anything that called it. Real programs need `main` to read cleanly at the top of a file while calling functions defined further down (or in an entirely different file), and they need two functions to be able to call *each other* — impossible if \"defined above its first use\" were a hard rule with no escape hatch. The declaration/definition split is exactly that escape hatch.\n\n### The core idea\n\nA **declaration** (often called a **prototype**) states a function's name, return type, and parameter types — a promise to the compiler, with no body:\n```c\nint square(int x);\n```\nA **definition** is the declaration plus the actual body:\n```c\nint square(int x) {\n    return x * x;\n}\n```\nOnce the compiler has seen a declaration, it has everything it needs to check calls against — the *definition* can come later in the same file, or even in a separate file entirely (Chapter 6.6 covers that properly). Parameter *names* in a bare declaration are optional and purely documentation — `int square(int);` is just as valid as `int square(int x);` — only the types are actually checked.\n\n### Examples\n\n**1. A forward declaration, letting `main` call a function defined below it:**\n```c\n#include <stdio.h>\n\nint square(int x);   // declaration\n\nint main(void) {\n    printf(\"square(6) = %d\\n\", square(6));\n    return 0;\n}\n\nint square(int x) {  // definition\n    return x * x;\n}\n```\nOutput: `square(6) = 36`, with no warning at all this time — unlike Chapter 4.1's Example 2, the compiler now has a real, explicit declaration to check `main`'s call against, before it ever needs the full definition.\n\n**2. A declaration and its definition must agree exactly — the compiler enforces this as a real error, not a warning:**\n```c\nint add(int a, int b);   // declared to return int\n...\ndouble add(int a, int b) {   // defined to return double\n    return a + b;\n}\n```\n```\nerror: conflicting types for 'add'; have 'double(int, int)'\nnote: previous declaration of 'add' with type 'int(int, int)'\n```\nThe mismatch is caught immediately, with both locations named — this is exactly the safety net that calling an undeclared function (Chapter 4.1) doesn't have.\n\n**3. Parameter names are optional in a bare declaration:**\n```c\nint multiply(int, int);   // types only, no names — perfectly valid\n...\nint multiply(int a, int b) {\n    return a * b;\n}\n```\nCompiles and runs identically (`20` for `multiply(4, 5)`) — the declaration only needs to commit to the types, since that's all the compiler checks calls against; names in a declaration exist purely to help a human reader guess what each parameter means.\n\n**4. `inline` suggests to the compiler that a small function's body be pasted directly at each call site**, avoiding the overhead of a real function call, without changing what the code actually computes:\n```c\nstatic inline int cube(int x) {\n    return x * x * x;\n}\n```\n`cube(3)` still simply returns `27` — `inline` is purely a performance hint (the compiler is free to ignore it, and modern compilers often decide better than a human guess would anyway), never a change in behavior. It's most useful for small, frequently-called functions in a header shared across multiple files — a topic Chapter 6.6 picks back up once multi-file programs are in view; `static` alongside it here avoids a linkage subtlety that chapter also covers.\n\n### ⚠️ Common Mistakes\n\n- **Letting a declaration and its definition drift apart**, especially across a header file and its corresponding `.c` file, where they're physically far apart and easy to edit only one of. As shown above, the compiler does catch a genuine mismatch — but only once both are compiled together; it's still worth double-checking by hand after changing a function's signature.\n- **Forgetting the semicolon after a bare declaration.** `int square(int x)` with no `;` and no `{ }` following is a syntax error, not a declaration — the compiler needs one or the other unambiguously.\n- **Assuming `inline` guarantees inlining, or guarantees a speed improvement.** It's a hint the compiler is fully entitled to ignore — for a genuinely hot, tiny function, modern compilers frequently inline it automatically even without being asked, and for a large or rarely-called one, requesting `inline` explicitly often does nothing at all.\n- **Writing two different declarations for the same function with subtly different types** (an `int` in one, a `long` in another, say) across different places that both get compiled together. This produces the same `conflicting types` error as Example 2 — the fix is always to have exactly one, consistent declaration, ideally in one shared header file once your programs grow that large (Chapter 6.6).\n\n### How this connects\n\nYou can now separate a function's promise from its implementation — the foundation multi-file programs are built on. The next chapter looks precisely at what happens to the *values* passed into a function: pass-by-value, and exactly what that does and doesn't let a function do to its caller's data.\n\n### Quick recap\n\n- A **declaration** (`int square(int x);`) is a promise — return type and parameter types, no body. A **definition** is the declaration plus the real body.\n- Once declared, a function can be called before its full definition appears — anywhere later in the file, or in another file entirely.\n- A declaration and its definition must agree exactly on return type and parameter types — a genuine mismatch is a compile error, not a warning.\n- Parameter names in a bare declaration are optional and purely documentation; only the types are checked.\n- `inline` is a compiler hint for pasting a small function's body at each call site — never a guarantee, and never a change in what the function computes."}, {"id": "4.3", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 3, "slug": "passing-arguments-pass-by-value", "fullTitle": "Passing Arguments: Pass by Value", "title": "Passing Arguments: Pass by Value", "md": "### Why this matters\n\nWhat actually happens when you hand a variable to a function? In C, the answer is simple and absolute, and getting it firmly right now prevents real confusion once pointers arrive in Part V and seem, at first glance, to break this exact rule.\n\n### The core idea\n\n**C passes every argument by value: the function receives a copy.** Whatever the parameter does inside the function — reassign it, modify it, anything at all — happens to that local copy alone. The caller's original variable is completely untouched, no matter what. This is true even for a `struct` (Chapter 6.1) — passing one by value copies the *entire* structure, every field, into the function's own local copy.\n\n### Examples\n\n**1. A function cannot change the caller's variable through an ordinary parameter:**\n```c\n#include <stdio.h>\nvoid try_to_double(int n) {\n    n = n * 2;\n    printf(\"inside function: n = %d\\n\", n);\n}\nint main(void) {\n    int x = 5;\n    try_to_double(x);\n    printf(\"in main: x = %d\\n\", x);\n    return 0;\n}\n```\nOutput:\n```\ninside function: n = 10\nin main: x = 5\n```\n`n` really did become `10` — inside the function. `x` in `main` never moved, because `n` was always its own separate copy, from the moment the function was called.\n\n**2. The same is true for a whole `struct`, copied field by field:**\n```c\n#include <stdio.h>\nstruct Point { int x; int y; };\nvoid move_point(struct Point p) {\n    p.x += 100;\n    p.y += 100;\n    printf(\"inside function: (%d, %d)\\n\", p.x, p.y);\n}\nint main(void) {\n    struct Point pt = {1, 2};\n    move_point(pt);\n    printf(\"in main: (%d, %d)\\n\", pt.x, pt.y);\n    return 0;\n}\n```\nOutput:\n```\ninside function: (101, 102)\nin main: (1, 2)\n```\nBoth fields changed inside `move_point`, and both are completely unaffected back in `main` — the entire struct, not just each field individually, was copied on the way in.\n\n**3. An array parameter looks like an exception to everything just shown — it isn't, but the reason needs Part V to explain properly:**\n```c\n#include <stdio.h>\nvoid zero_first(int arr[]) {\n    arr[0] = 0;\n}\nint main(void) {\n    int nums[3] = {1, 2, 3};\n    zero_first(nums);\n    printf(\"nums[0] = %d\\n\", nums[0]);\n    return 0;\n}\n```\nOutput: `nums[0] = 0` — the *original* array, back in `main`, genuinely changed. This is not a violation of pass-by-value: what actually gets copied here is not the array's contents, but a *pointer* to the array's first element — the pointer itself is copied by value (consistent with everything above), but it still points at the very same memory the original array lives in. Chapter 5.3 explains exactly why arrays behave this way, in full; for now, just know that arrays are the one type where \"passing it to a function\" and \"letting that function see your original data\" are the same thing, unlike every other type in this chapter.\n\n### ⚠️ Common Mistakes\n\n- **Expecting a function to modify the caller's variable through an ordinary (non-array, non-pointer) parameter.** As shown in Examples 1 and 2, this simply cannot happen — the function is always working on its own private copy. If a function genuinely needs to modify the caller's variable, it needs a *pointer* to that variable instead (Chapter 5.5) — passing the value alone is never enough.\n- **Assuming struct pass-by-value is \"free.\"** For a small struct like `Point`, copying is trivial — but for a struct with many fields, or large arrays inside it, passing it by value copies all of that, every single call. Once structs grow large, passing a pointer to one instead (Chapter 5.5) avoids the repeated copying.\n- **Being surprised an array parameter behaves differently and assuming something is broken.** As shown in Example 3, this is consistent, well-defined C behavior, not an exception to memorize as a special case — it's a direct consequence of what an array parameter actually is underneath, which Chapter 5.3 makes fully precise.\n\n### How this connects\n\nYou now know exactly what \"the function got a copy\" really means, for both simple values and structs — and you've seen the one case (arrays) that looks different, with the real reason still ahead. The next chapter looks at the other side of this: what a function's `return` value can and can't do, and the `void` case in full.\n\n### Quick recap\n\n- Every function argument in C is passed **by value** — the function receives a copy, and nothing it does to that copy reaches back to the caller's original variable.\n- This applies to whole `struct`s too — the entire structure is copied, field by field, not shared.\n- Arrays *appear* to break this rule (Example 3) — they don't; what's actually copied is a pointer to the array's data, not the data itself. Chapter 5.3 explains why in full.\n- To let a function genuinely modify a caller's variable, that variable's *pointer* must be passed explicitly (Chapter 5.5) — plain pass-by-value never allows it on its own."}, {"id": "4.4", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 4, "slug": "return-values-void", "fullTitle": "Return Values & `void`", "title": "Return Values & `void`", "md": "### Why this matters\n\n`return` is how a function hands a result back — but it does more than that: it also ends the function immediately, wherever it appears, even in the middle of a loop or a deeply nested conditional. Understanding both halves of what `return` does — \"stop right here\" and \"send this value back\" — avoids a surprising number of subtle bugs later.\n\n### The core idea\n\n`return value;` does two things at once: it immediately ends the current function call (no matter how deeply nested inside loops or conditionals it is), and it hands `value` back to whoever called the function, as the result of that call expression. A `void` function either falls off the end naturally, or exits early with a bare `return;` — same immediate-exit behavior, just nothing handed back.\n\nA function can only return **one** value directly. If a caller genuinely needs more than one piece of information back, the real options are a `struct` bundling several values into one (Chapter 6.1), or passing in a pointer the function writes additional results *through* (Chapter 5.5) — plain `return` alone only ever gives you one value.\n\n### Examples\n\n**1. `return` exits immediately, even from inside a loop:**\n```c\n#include <stdio.h>\nint find_first_negative(int arr[], int size) {\n    for (int i = 0; i < size; i++) {\n        if (arr[i] < 0) {\n            return i;\n        }\n    }\n    return -1;\n}\nint main(void) {\n    int nums[5] = {3, 7, -2, 9, -5};\n    printf(\"first negative at index %d\\n\", find_first_negative(nums, 5));\n    return 0;\n}\n```\nOutput: `first negative at index 2`. The `return i;` inside the loop stops everything the instant a match is found — the loop never even reaches `-5` at index `4`, and the fallback `return -1;` after the loop never runs at all in this case.\n\n**2. A `void` function exiting early with a bare `return;`:**\n```c\n#include <stdio.h>\nvoid print_if_positive(int x) {\n    if (x <= 0) {\n        printf(\"skipped (not positive)\\n\");\n        return;\n    }\n    printf(\"value: %d\\n\", x);\n}\nint main(void) {\n    print_if_positive(5);\n    print_if_positive(-3);\n    return 0;\n}\n```\nOutput:\n```\nvalue: 5\nskipped (not positive)\n```\nThe bare `return;` in the `-3` case exits the function right there — nothing after it in the function body would run if there were more code following.\n\n**3. A returned value can simply be ignored — it compiles without complaint:**\n```c\n#include <stdio.h>\nint compute(void) {\n    return 42;\n}\nint main(void) {\n    compute();\n    printf(\"done\\n\");\n    return 0;\n}\n```\nOutput: just `done` — `compute()`'s `42` was computed and then discarded, with no warning at all from plain `-Wall`. This is sometimes intentional (a function that does something useful *and* happens to return a status you don't care about this time), but it's worth being a conscious choice, not an oversight — especially for a function whose entire purpose is the value it returns.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `return` immediately ends the function, mid-loop or mid-condition included.** Code written *after* a `return` inside the same block never runs for that path — this is occasionally a genuine bug source when a `return` is added during editing without noticing there was more logic meant to run afterward.\n- **Trying to return more than one value directly.** `return a, b;` doesn't do what it looks like — it's the comma operator (Chapter 3.3), and the function only actually returns `b`. Bundle multiple values into a `struct` (Chapter 6.1) or use output parameters (Chapter 5.5) instead.\n- **Ignoring a return value that actually matters** — most dangerously, a function reporting success or failure (`scanf`'s return in Chapter 2.9 is exactly this pattern). Nothing forces you to check it; skipping the check just means you find out about the failure later, indirectly, from whatever broke as a result.\n- **Assuming a `void` function can't exit early.** It absolutely can, with a bare `return;` — `void` only means \"nothing is handed back,\" not \"runs unconditionally to the end.\"\n\n### How this connects\n\nYou now understand exactly what leaves a function and how. The next chapter looks at the other side of a function's data — not what goes in or comes out, but where a variable *lives* while a function is running: local versus global scope.\n\n### Quick recap\n\n- `return value;` ends the function immediately (from anywhere, including inside loops) and hands `value` back to the caller; a bare `return;` does the same for a `void` function.\n- A function can only return one value directly — multiple results need a `struct` or output parameters (pointers), covered later.\n- A caller can freely ignore a return value with no compiler complaint by default — worth being deliberate about, especially for a function whose result reports success or failure.\n- `void` doesn't mean \"always runs to the end\" — it just means nothing is handed back; early exits via bare `return;` are completely normal."}, {"id": "4.5", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 5, "slug": "scope-storage-classes", "fullTitle": "Scope & Storage Classes", "title": "Scope & Storage Classes", "md": "### Why this matters\n\nEvery variable has both a **scope** (where its name is visible) and a **storage duration** (how long it actually exists in memory) — and C lets you control both explicitly with a small set of keywords, called storage classes. `static` in particular does two genuinely different things depending on where it's used, and confusing the two is a common source of real misunderstanding.\n\n### The core idea\n\n- **`
