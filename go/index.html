 field instead, whenever the shape is actually known.\n- **Forgetting `Unmarshal`/`Decode` need a pointer.** Passing a plain (non-pointer) value compiles fine but fails at runtime with a real, explicit error (`json: Unmarshal(non-pointer main.Person)`) — verified directly, it doesn't silently do nothing; `Unmarshal` has no way to write decoded data back into a value it doesn't have the address of, and says so plainly rather than failing quietly.\n- **Ignoring `Unmarshal`'s returned error**, assuming external JSON always matches the expected shape. Example 4 showed exactly how specific and useful that error is — worth checking, especially for data from outside the program's own control (an API response, a config file someone hand-edited).\n- **Using `Marshal`/`Unmarshal` (whole `[]byte` in memory) when streaming with `NewEncoder`/`NewDecoder` would avoid buffering a potentially large payload entirely** — genuinely relevant the moment JSON data is naturally arriving or leaving as a stream (an HTTP body, Chapter 7.14) rather than something already fully in memory.\n\n### How this connects\n\nChapter 7.14's HTTP handling uses `json.NewDecoder`/`NewEncoder` directly on request and response bodies — exactly the streaming pattern from Example 6, now applied to real network I/O instead of an in-memory buffer.\n\n### Quick recap\n\n- `json.Marshal`/`MarshalIndent` convert a Go value to JSON text; `json.Unmarshal` converts JSON text into a Go value, which **must** be passed by pointer.\n- Struct tags (Chapter 2.9) control field names and behavior like `omitempty`; nested structs and slices marshal/unmarshal naturally.\n- Decoding into `map[string]interface{}` (or `any`) handles unknown shapes, but every JSON number becomes `float64` — never `int` — a genuinely common gotcha.\n- `json.NewEncoder`/`json.NewDecoder` work directly against any `io.Writer`/`io.Reader`, avoiding an intermediate `[]byte` for streamed data.\n- `Unmarshal` returns a specific, descriptive error on any type mismatch — always worth checking on data from outside the program's control."}, {"id": "7.6", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 6, "slug": "sort-custom-sorting", "fullTitle": "`sort` & Custom Sorting", "title": "`sort` & Custom Sorting", "md": "### Why this matters\n\nSorting is one of those things every real program eventually needs, on data that's rarely as simple as a slice of plain numbers. Go's `sort` package covers the built-in-type basics directly, and gives you two genuinely different ways to sort by custom, arbitrary logic.\n\n### The core idea\n\n`sort.Ints`/`Strings`/`Float64s` sort built-in types directly. For custom logic, `sort.Slice` takes an inline \"less\" comparison function — the modern, common approach — while the older `sort.Sort` requires a type implementing `sort.Interface` (`Len`/`Less`/`Swap`), still useful when a sort order is reused as a named type.\n\n### Examples\n\n**1. The built-in-type basics — sorting in place.**\n```go\nnums := []int{5, 2, 8, 1, 9}\nsort.Ints(nums)\nfmt.Println(nums)\n\nwords := []string{\"banana\", \"apple\", \"cherry\"}\nsort.Strings(words)\nfmt.Println(words)\n```\nOutput:\n```\n[1 2 5 8 9]\n[apple banana cherry]\n```\n`sort.Ints`/`sort.Strings` (and `sort.Float64s`) sort a slice in place — exactly like Chapter 5.11's `slices.Sort`, which is actually the more modern, generic equivalent of these same functions.\n\n**2. `sort.Slice` — a custom comparison function, no interface required.**\n```go\ntype Person struct {\n\tName string\n\tAge  int\n}\n\npeople := []Person{\n\t{\"Alice\", 30},\n\t{\"Bob\", 25},\n\t{\"Charlie\", 35},\n}\nsort.Slice(people, func(i, j int) bool {\n\treturn people[i].Age < people[j].Age\n})\nfmt.Println(people)\n```\nOutput:\n```\n[{Bob 25} {Alice 30} {Charlie 35}]\n```\n`sort.Slice`'s second argument is a \"less\" function — given two indices, return whether the element at `i` should sort before the element at `j`. This is by far the most common way to sort custom data in modern Go: no separate type needed, just a slice and an inline comparison function.\n\n**3. Sorting the same data differently, just by changing the comparison function.**\n```go\nsort.Slice(people, func(i, j int) bool {\n\treturn people[i].Name < people[j].Name\n})\nfmt.Println(people)\n```\nOutput:\n```\n[{Alice 30} {Bob 25} {Charlie 35}]\n```\nSame slice, same `sort.Slice`, a completely different ordering — the comparison function is the entire \"policy,\" and `sort.Slice` handles the actual sorting mechanics identically either way.\n\n**4. `sort.Sort` with `sort.Interface` — the older, more ceremonial way, still worth recognizing.**\n```go\ntype ByAge []Person\n\nfunc (a ByAge) Len() int           { return len(a) }\nfunc (a ByAge) Less(i, j int) bool { return a[i].Age < a[j].Age }\nfunc (a ByAge) Swap(i, j int)      { a[i], a[j] = a[j], a[i] }\n\npeople2 := []Person{\n\t{\"Alice\", 30},\n\t{\"Bob\", 25},\n\t{\"Charlie\", 35},\n}\nsort.Sort(ByAge(people2))\nfmt.Println(people2)\n```\nOutput:\n```\n[{Bob 25} {Alice 30} {Charlie 35}]\n```\n`sort.Interface` requires exactly three methods (`Len`, `Less`, `Swap`) — `ByAge` is just `[]Person` with those three methods attached (Chapter 5.3), satisfying `sort.Interface` implicitly (Chapter 5.5), exactly like any other interface. This predates `sort.Slice` (which arrived later, in Go 1.8) and is genuinely more verbose for a one-off sort — but you'll still see it in real code, especially when the same sort order is reused in multiple places, since `ByAge` itself becomes a reusable, named type rather than an inline function repeated everywhere.\n\n**5. Checking sortedness, and binary search on an already-sorted slice.**\n```go\nfmt.Println(sort.IntsAreSorted(nums))\n\nidx := sort.SearchInts(nums, 8)\nfmt.Println(idx)\n```\nOutput:\n```\ntrue\n3\n```\n`sort.IntsAreSorted` checks without modifying anything; `sort.SearchInts` performs an efficient binary search on an *already-sorted* slice, returning the index where the target value is (or where it would need to be inserted to keep the slice sorted, if it isn't present at all) — genuinely useful the moment repeated lookups on sorted data matter more than a simple linear scan.\n\n### ⚠️ Common Mistakes\n\n- **Reaching for the older `sort.Interface`/`sort.Sort` pattern for a one-off sort**, when `sort.Slice`'s inline comparison function does the identical job with far less ceremony. Save the named-type approach for a sort order that's genuinely reused across multiple call sites.\n- **Calling `sort.SearchInts` (or any binary search) on a slice that isn't actually sorted.** Binary search's whole efficiency depends on sortedness — on unsorted data, it produces a meaningless, unreliable result with no warning.\n- **Forgetting `sort.Slice`'s comparison function must be a strict \"less than,\" never \"less than or equal.\"** Getting this backward (or using `<=`) produces subtly wrong, sometimes unstable ordering.\n- **Needing a *stable* sort (preserving the original relative order of equal elements) and reaching for plain `sort.Slice`.** `sort.SliceStable` exists for exactly that guarantee — `sort.Slice` itself makes no such promise.\n\n### How this connects\n\nChapter 5.11's `slices.Sort`/`slices.SortFunc` are the modern, generic evolution of exactly what this chapter covers — recognizing both styles means comfortably reading Go code written at any point across the language's history.\n\n### Quick recap\n\n- `sort.Ints`/`sort.Strings`/`sort.Float64s` sort a slice of a built-in type in place.\n- `sort.Slice(slice, lessFunc)` is the standard modern way to sort by custom logic — an inline \"less\" function, no extra type needed.\n- `sort.Sort` with a type implementing `sort.Interface` (`Len`/`Less`/`Swap`) is the older, more ceremonial approach — still useful when a sort order is reused as a named type.\n- `sort.SliceStable` preserves equal elements' original relative order; plain `sort.Slice` doesn't guarantee this.\n- `sort.SearchInts` (and friends) perform binary search — valid only on data that's already sorted."}, {"id": "7.7", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 7, "slug": "time-working-with-dates-durations", "fullTitle": "`time`: Working with Dates & Durations", "title": "`time`: Working with Dates & Durations", "md": "### Why this matters\n\nTimestamps, deadlines, \"how long did this take\" — dates and durations show up constantly in real programs. Go's `time` package handles all of it with two real types (`time.Time` and `time.Duration`), and one genuinely distinctive, slightly odd formatting convention worth understanding precisely, since guessing at it goes wrong immediately.\n\n### The core idea\n\n`time.Time` represents a specific point in time; `time.Duration` represents an elapsed length of time. Both are immutable — every method (`.Add`, `.Sub`) returns a new value rather than modifying in place — and formatting/parsing uses a literal reference date as the layout, not symbolic codes like `YYYY-MM-DD`.\n\n### Examples\n\n**1. `time.Now()` and formatting — Go's reference-time convention.**\n```go\nnow := time.Now()\nfmt.Println(now.Format(\"2006-01-02 15:04:05\"))\nfmt.Println(now.Format(\"Jan 2, 2006\"))\n```\nOutput:\n```\n2026-09-07 13:21:16\nSep 7, 2026\n```\nUnlike most languages' `YYYY-MM-DD`-style format codes, Go's `Format` takes a **literal example** of how the reference date `Mon Jan 2 15:04:05 2006` should look, and reuses that exact shape for the real value — `\"2006-01-02\"` means \"year-month-day,\" specifically because `2006` is the reference year, `01` the reference month, `02` the reference day, in that layout. This is genuinely unusual compared to other languages' format codes, but consistent and precise once memorized — the numbers `1, 2, 3, 4, 5, 6, 2006` themselves are the mnemonic (month, day, hour, minute, second, timezone offset, year, in that reference order).\n\n**2. `time.Date` — constructing a specific point in time explicitly.**\n```go\nd := time.Date(2026, time.September, 7, 10, 30, 0, 0, time.UTC)\nfmt.Println(d.Format(\"2006-01-02\"))\n```\nOutput:\n```\n2026-09-07\n```\n`time.Date` takes year, month (as a named constant, `time.September`, not a bare number — clearer and less error-prone than remembering month numbering), day, hour, minute, second, nanosecond, and a location (`time.UTC` here — Go calls a timezone a \"location,\" and requires one explicitly, never implicitly assumed).\n\n**3. `time.Duration` — a real, typed representation of an elapsed length of time.**\n```go\ndur := 2*time.Hour + 30*time.Minute\nfmt.Println(dur)\n```\nOutput:\n```\n2h30m0s\n```\n`time.Hour`/`time.Minute` (and `Second`, `Millisecond`, and more) are typed constants — ordinary arithmetic on them (`2*time.Hour + 30*time.Minute`) produces a genuine `time.Duration`, which prints in a clean, human-readable form automatically.\n\n**4. Adding a duration to a time, and comparing two times.**\n```go\nfuture := now.Add(dur)\nfmt.Println(future.After(now))\n```\nOutput:\n```\ntrue\n```\n`.Add(duration)` returns a new `time.Time` (times are immutable — Chapter 2.4's value-type philosophy, applied here) offset by that duration; `.Before`/`.After`/`.Equal` compare two `time.Time` values directly and correctly, rather than needing manual arithmetic.\n\n**5. `time.Since` — measuring real elapsed time, paired with `time.Sleep`.**\n```go\nstart := time.Now()\ntime.Sleep(10 * time.Millisecond)\nelapsed := time.Since(start)\nfmt.Println(elapsed > 0)\nfmt.Println(elapsed.Milliseconds() >= 10)\n```\nOutput:\n```\ntrue\ntrue\n```\n`time.Since(start)` is shorthand for `time.Now().Sub(start)` — the genuinely idiomatic way to measure how long something actually took. `time.Sleep` pauses the current goroutine (Chapter 7.8 covers goroutines properly) for at least the given duration.\n\n**6. `time.Parse` — the reverse of `Format`, using the same reference-time layout.**\n```go\nparsed, err := time.Parse(\"2006-01-02\", \"2026-09-07\")\nfmt.Println(parsed, err)\n```\nOutput:\n```\n2026-09-07 00:00:00 +0000 UTC <nil>\n```\nSame layout string convention as `Format` (Example 1) — whatever shape you'd use to format a date this way is exactly the shape you use to parse text written that way back into a real `time.Time`.\n\n**7. Extracting individual components, and subtracting two times to get a `Duration`.**\n```go\nfmt.Println(d.Year(), d.Month(), d.Day(), d.Weekday())\n\nd2 := time.Date(2026, time.September, 8, 0, 0, 0, 0, time.UTC)\nfmt.Println(d2.Sub(d))\n```\nOutput:\n```\n2026 September 7 Monday\n13h30m0s\n```\n`.Year()`/`.Month()`/`.Day()`/`.Weekday()` are real methods, not string parsing (Chapter 5.3's method pattern, applied to a `time.Time` receiver). `.Sub(other)` computes the `Duration` between two times directly.\n\n### ⚠️ Common Mistakes\n\n- **Guessing at a format layout using `YYYY-MM-DD`-style codes from another language.** Go's layout is a literal example of the reference date/time (`2006-01-02 15:04:05`), not a symbolic code — using anything else produces either a compile-time-invisible but silently wrong format, or a parse error.\n- **Constructing a `time.Time` without an explicit location**, then being surprised by timezone-related bugs later. `time.Date`'s last argument is never optional or defaulted — always be deliberate about `time.UTC` versus `time.Local` versus a specific named zone.\n- **Manually subtracting Unix timestamps or formatted strings to compute a duration**, instead of using `.Sub()` or `time.Since()`, which handle every edge case (leap seconds, daylight saving transitions, differing locations) correctly.\n- **Forgetting `time.Time` values are immutable.** `.Add()` (and every other time-manipulating method) returns a *new* `time.Time` — it never modifies the original in place, exactly like Chapter 2.4's value-type philosophy elsewhere in Go.\n\n### How this connects\n\n`time.Duration` reappears directly in Chapter 7.12's `context` package (deadlines and timeouts) and Chapter 8.3's benchmarking — measuring and reasoning about elapsed time is a recurring, genuinely practical need across the rest of this book.\n\n### Quick recap\n\n- `Format`/`Parse` use a **literal reference date** (`Mon Jan 2 15:04:05 MST 2006`) as the layout, not symbolic format codes — memorize the reference numbers 1–6 plus 2006, in that order.\n- `time.Date(year, month, day, hour, min, sec, nsec, location)` constructs a specific point in time; a location is always required explicitly.\n- `time.Duration` (built from typed constants like `time.Hour`) represents an elapsed length of time, printing in a clean, readable form automatically.\n- `.Add(duration)` returns a new, offset `time.Time`; `.Sub(other)`/`time.Since(start)` compute a `Duration` between two times — both are the correct, edge-case-safe tools, never manual arithmetic.\n- `time.Time` values are immutable — every method returns a new value rather than modifying in place."}, {"id": "7.8", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 8, "slug": "goroutines-concurrency-basics", "fullTitle": "Goroutines: Concurrency Basics", "title": "Goroutines: Concurrency Basics", "md": "### Why this matters\n\nThis is Go's signature feature — concurrency built directly into the language, not bolted on as a library. A goroutine is a genuinely lightweight, independently-running function call, and the `go` keyword is all it takes to launch one. The real challenge isn't starting one — it's the fact that your program keeps running immediately after, with no guarantee the goroutine has done anything yet at all.\n\n### The core idea\n\n`go functionCall()` starts `functionCall` running concurrently, and immediately continues to the next line — it does **not** wait for the goroutine to finish, or even to start. Goroutines are far cheaper than OS threads (a Go program can comfortably run hundreds of thousands of them), but that cheapness doesn't remove the real coordination problem: something needs to actually wait for a goroutine to finish before relying on its result.\n\n### Examples\n\n**1. A goroutine that might never even get a chance to run — verified directly.**\n```go\ngo fmt.Println(\"might never print - main can exit first\")\n```\nOutput (run repeatedly):\n```\n\n```\nNothing printed, every single time. `main` reaches the end of the program and exits before the goroutine is even scheduled to run at all — Go doesn't wait for outstanding goroutines when `main` returns; it simply exits, ending the whole program regardless of anything still in flight.\n\n**2. `sync.WaitGroup` — the standard, correct way to actually wait for goroutines to finish.**\n```go\nfunc sayHello(id int, wg *sync.WaitGroup) {\n\tdefer wg.Done()\n\tfmt.Printf(\"goroutine %d: hello\\n\", id)\n}\n\nvar wg sync.WaitGroup\nfor i := 0; i < 3; i++ {\n\twg.Add(1)\n\tgo sayHello(i, &wg)\n}\nwg.Wait()\nfmt.Println(\"all goroutines done\")\n```\nOutput (one real run):\n```\ngoroutine 0: hello\ngoroutine 1: hello\ngoroutine 2: hello\nall goroutines done\n```\n`wg.Add(1)` before launching each goroutine registers one more thing to wait for; `defer wg.Done()` inside the goroutine (Chapter 3.7's cleanup pattern, applied to concurrency) marks it complete when the function returns; `wg.Wait()` blocks until every registered goroutine has called `Done()`. This is the fundamental, correct pattern for \"launch several things concurrently, then wait for all of them.\"\n\n**3. Goroutine execution order is genuinely non-deterministic — verified across repeated runs.**\n\nRunning the exact same program from Example 2 three separate times:\n```\ngoroutine 0: hello\ngoroutine 1: hello\ngoroutine 2: hello\n```\n```\ngoroutine 0: hello\ngoroutine 2: hello\ngoroutine 1: hello\n```\n```\ngoroutine 2: hello\ngoroutine 1: hello\ngoroutine 0: hello\n```\nThe order genuinely differs, exactly like Chapter 2.7's map iteration order — the Go runtime schedules goroutines onto available threads however it sees fit, with no guaranteed ordering between separately-launched ones. `wg.Wait()` guarantees *all of them finish* before continuing; it says nothing about the *order* they finish in.\n\n### ⚠️ Common Mistakes\n\n- **Launching a goroutine and expecting it to have run by the very next line**, with no synchronization at all. As Example 1 showed, there's no such guarantee — the program can (and did, repeatedly) finish before the goroutine ever executes.\n- **Forgetting `wg.Add(1)` must happen *before* `go func...`, not inside the goroutine itself.** If `Add` runs inside the goroutine, `Wait()` in `main` might already have returned (seeing a still-zero counter) before the goroutine even gets a chance to register itself — a real, subtle race.\n- **Assuming goroutines launched in a loop will finish in the order they were started.** As Example 3 proved directly, they won't necessarily — never rely on goroutine completion order without explicit synchronization enforcing it.\n- **Treating a goroutine like a lightweight thread you must carefully ration.** Goroutines are genuinely cheap (starting thousands is completely normal) — the real cost worth being deliberate about is *coordination* (shared data, synchronization), not the goroutines themselves.\n\n### How this connects\n\nGoroutines are the foundation everything in the rest of Part VII builds on — channels (Chapter 7.9) are how goroutines actually communicate results back, rather than just running fire-and-forget with a `WaitGroup` and shared mutable state (which Chapter 7.11's `sync.Mutex` covers safely doing when genuinely needed).\n\n### Quick recap\n\n- `go functionCall()` launches a goroutine and returns immediately — no waiting, no guarantee it's even started yet.\n- `sync.WaitGroup` (`Add` before launching, `Done` via `defer` inside, `Wait` to block until all are done) is the standard way to actually wait for a batch of goroutines to finish.\n- Goroutine execution order is genuinely non-deterministic — verified directly across repeated runs — `WaitGroup` guarantees completion, never a specific order.\n- Goroutines are far cheaper than OS threads — launching many is normal; the real complexity is coordinating shared data between them."}, {"id": "7.9", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 9, "slug": "channels-unbuffered-buffered", "fullTitle": "Channels: Unbuffered & Buffered", "title": "Channels: Unbuffered & Buffered", "md": "### Why this matters\n\nChapter 7.8's `WaitGroup` waits for goroutines to *finish*, but says nothing about getting actual data back from them. Channels are Go's real answer: a typed pipe goroutines send values into and receive values from — genuinely safe to use from multiple goroutines at once, with no manual locking required for the channel operations themselves.\n\n### The core idea\n\n`make(chan T)` creates an **unbuffered** channel — a send blocks until another goroutine is ready to receive, and vice versa, meaning the two sides genuinely synchronize at that moment. `make(chan T, n)` creates a **buffered** channel with room for `n` values — a send only blocks once the buffer is full. `close(ch)` signals \"no more values are coming\"; receiving from a closed channel never blocks.\n\n### Examples\n\n**1. An unbuffered channel — the send and receive genuinely rendezvous.**\n```go\nfunc worker(ch chan string) {\n\tch <- \"work done\"\n}\n\nch := make(chan string)\ngo worker(ch)\nmsg := <-ch\nfmt.Println(msg)\n```\nOutput:\n```\nwork done\n```\n`worker`'s `ch <- \"work done\"` blocks until `main`'s `<-ch` is ready to receive it — this blocking is exactly what makes an unbuffered channel a genuine synchronization point, not just a data pipe.\n\n**2. A buffered channel — sends succeed immediately, up to its capacity.**\n```go\nbuffered := make(chan int, 3)\nbuffered <- 1\nbuffered <- 2\nbuffered <- 3\nfmt.Println(len(buffered), cap(buffered))\nfmt.Println(<-buffered, <-buffered, <-buffered)\n```\nOutput:\n```\n3 3\n1 2 3\n```\nAll three sends succeeded without any receiver waiting, since the buffer (capacity 3) had room for all of them. `len`/`cap` on a channel report exactly what you'd expect — how many values are currently buffered, and the buffer's total capacity.\n\n**3. `close` and `range` — a genuinely idiomatic producer/consumer pattern.**\n```go\nresults := make(chan int)\ngo func() {\n\tfor i := 0; i < 3; i++ {\n\t\tresults <- i * i\n\t}\n\tclose(results)\n}()\nfor v := range results {\n\tfmt.Println(\"received:\", v)\n}\n```\nOutput:\n```\nreceived: 0\nreceived: 1\nreceived: 4\n```\n`range` over a channel receives values one at a time until the channel is closed, then stops automatically — no separate \"am I done yet\" check needed. This is the standard shape for a goroutine that produces a stream of results for another part of the program to consume.\n\n**4. The comma-ok form — detecting a closed channel explicitly.**\n```go\nv, ok := <-results\nfmt.Println(v, ok)\n```\nOutput:\n```\n0 false\n```\nAfter the channel is closed and fully drained (Example 3 already consumed everything), receiving from it again returns the channel's element type's zero value and `false` — never blocking, never panicking. This is exactly Chapter 2.7's map comma-ok idiom, now applied to channels.\n\n**5. A closed, still-buffered channel still yields its remaining values first.**\n```go\nch2 := make(chan int, 1)\nch2 <- 42\nclose(ch2)\nv2, ok2 := <-ch2\nfmt.Println(v2, ok2)\nv3, ok3 := <-ch2\nfmt.Println(v3, ok3)\n```\nOutput:\n```\n42 true\n0 false\n```\nClosing a channel doesn't discard values already sitting in its buffer — `42` is still received correctly (`ok2` is `true`), and only the *next* receive, once the buffer is genuinely empty, reports `false`.\n\n**6. Sending on a closed channel is a real, immediate panic.**\n```go\nch := make(chan int)\nclose(ch)\nch <- 1\n```\nOutput:\n```\npanic: send on closed channel\n```\nThis is a hard rule: `close` is a one-way door for senders — only ever call `close` from the sending side, and never send on a channel after it's been closed.\n\n**7. Sending with no possible receiver ever is a genuine, detected deadlock — not a silent hang.**\n```go\nch := make(chan int)\nch <- 1\n```\nOutput:\n```\nfatal error: all goroutines are asleep - deadlock!\n```\nAn unbuffered send with nothing to ever receive it blocks forever — and the Go runtime actually detects this specific situation (every goroutine blocked, nothing left that could ever unblock any of them) and crashes with a clear, descriptive `fatal error` rather than hanging silently forever.\n\n### ⚠️ Common Mistakes\n\n- **Sending on a channel after closing it.** As Example 6 showed, this is an immediate, unrecoverable panic — only the sending side should ever close a channel, and only once all sends are genuinely finished.\n- **Closing a channel more than once**, or closing one from the receiving side \"just to be safe.\" Both are real mistakes — closing is exclusively the sender's responsibility, done exactly once.\n- **Forgetting an unbuffered send with no reader (or a buffered channel that's permanently full) blocks forever**, and either relying on the runtime's deadlock detector to catch a genuinely unrecoverable case (Example 7), or — more usefully — designing the concurrency so this situation simply can't arise.\n- **Using a channel purely to protect shared mutable data**, when a simple `sync.Mutex` (Chapter 7.11) would be more direct. Channels shine for actually *passing values between* goroutines; a mutex shines for guarding a single piece of shared state multiple goroutines all touch directly.\n\n### How this connects\n\nChapter 7.10's `select` builds directly on channels, for waiting on *multiple* channels at once; Chapter 7.13 covers the real, common concurrency patterns (worker pools, fan-out/fan-in) built from exactly the primitives this chapter introduced.\n\n### Quick recap\n\n- `make(chan T)` (unbuffered) synchronizes sender and receiver directly; `make(chan T, n)` (buffered) lets up to `n` sends succeed without a waiting receiver.\n- `close(ch)` signals no more values are coming — only the sender should ever call it, and never send afterward (a real panic).\n- `range` over a channel receives until it's closed, then stops automatically; the comma-ok form (`v, ok := <-ch`) detects a closed, drained channel explicitly.\n- A closed channel still yields any values already buffered before reporting `ok == false`.\n- A send with no possible receiver blocks forever — the Go runtime detects a total deadlock and crashes with a clear error rather than hanging silently."}, {"id": "7.10", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 10, "slug": "select-multiplexing-channels", "fullTitle": "`select` & Multiplexing Channels", "title": "`select` & Multiplexing Channels", "md": "### Why this matters\n\nA single `<-ch` blocks until that one specific channel has something. `select` is how you wait on *several* channels at once, reacting to whichever one is actually ready first — and it's also how you build a non-blocking channel check, or a timeout, both genuinely common real needs.\n\n### The core idea\n\n`select { case <-ch1: ...; case <-ch2: ... }` blocks until at least one of its cases can proceed, then runs that one case's body — if more than one is ready simultaneously, Go picks one at random. A `default` case makes the whole `select` non-blocking: it runs immediately if no other case is ready yet.\n\n### Examples\n\n**1. Waiting on whichever of two channels is ready first.**\n```go\nch1 := make(chan string)\nch2 := make(chan string)\n\ngo func() {\n\ttime.Sleep(20 * time.Millisecond)\n\tch1 <- \"from ch1\"\n}()\ngo func() {\n\ttime.Sleep(10 * time.Millisecond)\n\tch2 <- \"from ch2\"\n}()\n\nfor i := 0; i < 2; i++ {\n\tselect {\n\tcase msg1 := <-ch1:\n\t\tfmt.Println(msg1)\n\tcase msg2 := <-ch2:\n\t\tfmt.Println(msg2)\n\t}\n}\n```\nOutput:\n```\nfrom ch2\nfrom ch1\n```\n`ch2`'s goroutine sleeps for less time, so it sends first — `select`'s first iteration correctly picks it up. The second iteration then waits again and correctly receives `ch1`'s message once it arrives. `select` genuinely reacts to whichever channel has something *right now*, not a fixed priority order.\n\n**2. `default` — a non-blocking check.**\n```go\nch3 := make(chan int)\nselect {\ncase v := <-ch3:\n\tfmt.Println(v)\ndefault:\n\tfmt.Println(\"no value ready, moving on\")\n}\n```\nOutput:\n```\nno value ready, moving on\n```\nWith no sender anywhere for `ch3`, a plain `<-ch3` would block forever — `select` with a `default` case instead checks instantly and, finding nothing ready, runs `default` immediately rather than waiting at all.\n\n**3. A timeout, using `time.After` — a genuinely idiomatic Go pattern.**\n```go\nch4 := make(chan int)\nselect {\ncase v := <-ch4:\n\tfmt.Println(v)\ncase <-time.After(20 * time.Millisecond):\n\tfmt.Println(\"timed out waiting for ch4\")\n}\n```\nOutput:\n```\ntimed out waiting for ch4\n```\n`time.After(duration)` returns a channel that receives exactly one value after the given duration passes — racing it against `ch4` inside `select` means \"wait for `ch4`, but give up after 20ms if nothing arrives.\" This is the standard, idiomatic way to add a timeout to any channel wait in Go, with no separate timer-management code required.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `select` picks randomly among multiple simultaneously-ready cases**, and assuming case order in the source code implies any priority. It doesn't — if two cases are both ready at the same instant, which one runs is genuinely unspecified.\n- **Leaving out `default` when a non-blocking check is actually the goal.** Without it, `select` blocks exactly like a plain channel receive — `default`'s presence is what makes the difference.\n- **Reaching for a manual timer/goroutine-cancellation dance to implement a timeout**, instead of `select` with `time.After`. The pattern in Example 3 is genuinely the idiomatic, minimal way to do this in Go.\n- **Using `time.After` inside a loop that runs many times**, without realizing each call creates a new timer that isn't cleaned up until it fires — for a tight, high-frequency loop, this can accumulate real overhead; `context.WithTimeout` (Chapter 7.12) is the better tool for that specific situation.\n\n### How this connects\n\n`select` with `time.After` reappears constantly in Chapter 7.12's `context`-based cancellation and Chapter 7.13's real concurrency patterns (worker pools that need to shut down cleanly, pipelines that need to detect a stalled stage).\n\n### Quick recap\n\n- `select { case <-ch1: ...; case <-ch2: ... }` waits on multiple channels at once, running whichever case becomes ready first — randomly, if more than one is ready simultaneously.\n- A `default` case makes the whole `select` non-blocking — it runs immediately if nothing else is ready yet.\n- `select` combined with `time.After(duration)` is the standard, idiomatic way to add a timeout to any channel operation.\n- Case order in the source has no bearing on priority when multiple cases are ready at once."}, {"id": "7.11", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 11, "slug": "sync-mutex-waitgroup-once", "fullTitle": "`sync`: `Mutex`, `WaitGroup` & `Once`", "title": "`sync`: `Mutex`, `WaitGroup` & `Once`", "md": "### Why this matters\n\nChapter 7.8 already covered `sync.WaitGroup` for waiting on goroutines to finish. This chapter covers the other two workhorses of the `sync` package: `Mutex`, for safely sharing mutable data between goroutines, and `Once`, for running something exactly one time no matter how many goroutines try. The `Mutex` half of this chapter starts by showing you a real, reproducible bug — deliberately — before fixing it.\n\n### The core idea\n\nA **data race** happens when multiple goroutines read and write the same variable concurrently with no coordination — the result is genuinely undefined, not just \"probably fine.\" `sync.Mutex` (`Lock`/`Unlock`) protects a piece of shared data by ensuring only one goroutine can hold the lock at a time. `sync.Once` guarantees a given function runs exactly once, even when many goroutines call `Do` on it simultaneously.\n\n### Examples\n\n**1. A genuine, reproducible race condition — verified directly, no mutex.**\n```go\ncounter := 0\nvar wg sync.WaitGroup\nfor i := 0; i < 1000; i++ {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\tcounter++\n\t}()\n}\nwg.Wait()\nfmt.Println(counter)\n```\nOutput (three separate runs):\n```\n951\n965\n956\n```\nEvery run should logically print `1000` — a thousand goroutines, each incrementing once. Instead, every run gives a *different*, *smaller* number. `counter++` isn't atomic — it's really \"read `counter`, add one, write it back,\" and when two goroutines interleave those three steps, one increment can get silently lost. This is a real data race, not a rare edge case: it happened on every single run.\n\n**2. Go's race detector confirms it precisely.**\n```\ngo run -race racy.go\n```\nOutput (truncated):\n```\nWARNING: DATA RACE\nRead at 0x00c0000181b8 by goroutine 10:\n  main.main.func1()\n      racy.go:15 +0x7b\n\nPrevious write at 0x00c0000181b8 by goroutine 9:\n  main.main.func1()\n      racy.go:15 +0x8d\n```\n`-race` instruments the program to detect exactly this pattern — an unsynchronized read and write (or two unsynchronized writes) to the same memory from different goroutines — and reports it explicitly, with the exact line and both goroutines involved. Running tests and development builds with `-race` regularly is genuinely one of the highest-value habits in Go concurrent programming.\n\n**3. `sync.Mutex` — the fix, verified directly.**\n```go\ncounter := 0\nvar mu sync.Mutex\nvar wg sync.WaitGroup\nfor i := 0; i < 1000; i++ {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\tmu.Lock()\n\t\tcounter++\n\t\tmu.Unlock()\n\t}()\n}\nwg.Wait()\nfmt.Println(counter)\n```\nOutput (three separate runs, plus a `-race` run):\n```\n1000\n1000\n1000\n```\nEvery run now correctly prints `1000`, and `go run -race` on this version reports nothing at all. `mu.Lock()` ensures only one goroutine at a time can be between `Lock()` and `Unlock()` — every other goroutine trying to `Lock()` simply waits its turn, eliminating the interleaving that caused Example 1's lost increments.\n\n**4. `sync.Once` — running initialization exactly once, no matter how many goroutines try.**\n```go\nvar once sync.Once\nvar wg sync.WaitGroup\ninit := func() {\n\tfmt.Println(\"initializing (should print exactly once)\")\n}\nfor i := 0; i < 5; i++ {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\tonce.Do(init)\n\t}()\n}\nwg.Wait()\n```\nOutput:\n```\ninitializing (should print exactly once)\n```\nFive goroutines all called `once.Do(init)`, and `init` genuinely ran exactly one time — `sync.Once` guarantees this regardless of how many goroutines race to call `Do` simultaneously, making it the standard, idiomatic tool for \"set this up once, lazily, safely, from however many goroutines might ask for it.\"\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to `Unlock()` after `Lock()`** — usually fixed by immediately writing `defer mu.Unlock()` right after a successful lock, exactly like Chapter 3.7's cleanup pattern, so it's guaranteed to run even if the protected code panics or returns early.\n- **Locking a mutex, then having a code path that returns without unlocking it.** Every other goroutine trying to `Lock()` afterward blocks forever — `defer` immediately after `Lock()` is the reliable fix, not remembering to place `Unlock()` at every possible exit point manually.\n- **Assuming a \"usually correct\" result means there's no race.** As Example 1 showed, an unsynchronized race can produce numbers *close to* the correct answer, which is arguably more dangerous than an obviously wrong result — always run `-race` rather than trusting that output \"looks about right.\"\n- **Creating a new `sync.Once` for every call instead of sharing one across all the goroutines that need the \"only once\" guarantee.** `Once`'s guarantee only holds across calls to the *same* `Once` value — a fresh one per goroutine defeats the entire point.\n\n### How this connects\n\nChapter 7.13 covers real concurrency patterns (worker pools, pipelines) that combine `WaitGroup`, `Mutex`, and channels together — and `-race` is worth running against every example in that chapter, exactly as this chapter modeled, rather than trusting concurrent code \"looks correct\" from reading it alone.\n\n### Quick recap\n\n- A **data race** (unsynchronized concurrent read/write of shared data) produces genuinely undefined, inconsistent results — verified directly with a counter that should always reach 1000 but never did.\n- `go run -race` (or `go test -race`) detects data races precisely, naming the exact conflicting goroutines and lines — a habit worth using regularly, not just when something looks wrong.\n- `sync.Mutex`'s `Lock()`/`Unlock()` (paired with `defer` immediately after locking) is the standard fix — verified to produce the correct result on every run, with `-race` confirming it's genuinely clean.\n- `sync.Once.Do(f)` guarantees `f` runs exactly once, safely, regardless of how many goroutines call it concurrently — the standard tool for safe, lazy, one-time initialization."}, {"id": "7.12", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 12, "slug": "the-context-package", "fullTitle": "The `context` Package", "title": "The `context` Package", "md": "### Why this matters\n\nA goroutine started to serve one request, or do one piece of work, often needs a way to be told \"stop, we don't need this anymore\" — a client disconnected, a timeout expired, the whole operation was cancelled. `context.Context` is Go's standard, ubiquitous answer, and it's genuinely everywhere in real Go code that does networking, database access, or any goroutine that could outlive its usefulness.\n\n### The core idea\n\nA `context.Context` carries a cancellation signal (a `Done()` channel that closes when the context is cancelled or its deadline passes), the reason (`Err()`), and optionally request-scoped values. Contexts form a tree: `context.WithCancel`/`WithTimeout`/`WithDeadline` each derive a new, child context from a parent, and cancelling a parent cancels every context derived from it.\n\n### Examples\n\n**1. `context.WithCancel` — manual cancellation, checked via `Done()` in a `select`.**\n```go\nfunc worker(ctx context.Context, id int) {\n\tfor {\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\tfmt.Printf(\"worker %d: stopping, reason: %v\\n\", id, ctx.Err())\n\t\t\treturn\n\t\tcase <-time.After(5 * time.Millisecond):\n\t\t\t// simulate work\n\t\t}\n\t}\n}\n\nctx, cancel := context.WithCancel(context.Background())\ngo worker(ctx, 1)\ntime.Sleep(20 * time.Millisecond)\ncancel()\ntime.Sleep(10 * time.Millisecond)\n```\nOutput:\n```\nworker 1: stopping, reason: context canceled\n```\n`context.Background()` is the standard root context — never itself cancellable, the starting point for any context tree. `WithCancel` derives a child plus a `cancel` function; calling `cancel()` closes `ctx.Done()`'s channel, which `worker`'s `select` (Chapter 7.10) picks up immediately, and `ctx.Err()` reports exactly why: `\"context canceled\"`.\n\n**2. `context.WithTimeout` — cancellation that happens automatically.**\n```go\nctx2, cancel2 := context.WithTimeout(context.Background(), 15*time.Millisecond)\ndefer cancel2()\ngo worker(ctx2, 2)\ntime.Sleep(30 * time.Millisecond)\n```\nOutput:\n```\nworker 2: stopping, reason: context deadline exceeded\n```\nSame `worker` function, no code changes needed — `WithTimeout` cancels the context automatically once the duration elapses, and `ctx.Err()` correctly reports the different reason: `\"context deadline exceeded\"`. `defer cancel2()` is still worth including even for a timeout-based context — it releases the context's internal resources immediately if the work finishes early, rather than waiting for the timeout to elapse regardless.\n\n**3. `context.WithValue` — carrying request-scoped data, the *right* way.**\n\nThe official documentation is explicit and worth quoting directly (`go doc context.WithValue`): *\"The provided key must be comparable and should not be of type string or any other built-in type to avoid collisions between packages using context. Users of WithValue should define their own types for keys.\"* Following that guidance:\n```go\ntype contextKey string\n\nconst requestIDKey contextKey = \"requestID\"\n\nctx := context.WithValue(context.Background(), requestIDKey, \"abc-123\")\nfmt.Println(\"request ID:\", ctx.Value(requestIDKey))\n```\nOutput:\n```\nrequest ID: abc-123\n```\n`contextKey` is a distinct, unexported type (Chapter 6.6) — even though it's just a `string` underneath, no other package's plain `string` key could ever accidentally collide with `requestIDKey`, since Go's type system treats `contextKey(\"requestID\")` and a bare `\"requestID\"` string as genuinely different values for map-like lookup purposes. This is a real, officially-documented guideline, not a stylistic suggestion.\n\n### ⚠️ Common Mistakes\n\n- **Using a plain `string` (or other built-in type) directly as a context key**, exactly what the official documentation specifically warns against — a completely unrelated package using the same string value as its own context key would silently collide. Always define a small, unexported key type instead.\n- **Using `context.WithValue` to pass ordinary function parameters** rather than genuinely request-scoped metadata (a request ID, a trace ID, an authenticated user). The documentation is explicit about this too — `context` values are for data that transits process/API boundaries, not a substitute for normal function arguments.\n- **Forgetting to call the `cancel` function `WithCancel`/`WithTimeout`/`WithDeadline` return**, even when the context's deadline will eventually pass on its own. `defer cancel()` immediately after creating the context releases its internal resources as soon as the work is actually done, rather than leaking until the deadline arrives regardless.\n- **Writing a long-running goroutine with no `select` on `ctx.Done()` at all.** Without checking it somewhere reachable, a goroutine has no way to ever notice it should stop — `context` only works if the code actually watches for cancellation.\n\n### How this connects\n\n`context.Context` is the standard first parameter (by strong convention, always named `ctx` and always first) for nearly every function in Go that does networking or might run for a while — Chapter 7.14's HTTP handling and Chapter 7.13's concurrency patterns both use exactly the cancellation pattern this chapter introduced.\n\n### Quick recap\n\n- `context.Context` carries a cancellation signal (`Done()`, a channel that closes on cancellation), the reason (`Err()`), and optional request-scoped values.\n- `context.WithCancel` gives manual cancellation via a returned function; `WithTimeout`/`WithDeadline` cancel automatically once time elapses — both derive from a parent, usually `context.Background()`.\n- A goroutine watches for cancellation with `select { case <-ctx.Done(): ... }`, exactly like Chapter 7.10's channel multiplexing.\n- `context.WithValue` needs a dedicated, unexported key type — never a plain `string` or other built-in type — per the official documentation's own explicit guidance, to prevent cross-package key collisions.\n- Always `defer cancel()` immediately after creating a cancellable/timeout context, even when its deadline would eventually pass on its own."}, {"id": "7.13", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 13, "slug": "common-concurrency-patterns-pitfalls", "fullTitle": "Common Concurrency Patterns & Pitfalls", "title": "Common Concurrency Patterns & Pitfalls", "md": "### Why this matters\n\nGoroutines, channels, `select`, and `sync` are the primitives — this chapter is where they combine into the patterns real Go programs actually use, plus the genuine, measurable ways concurrent code goes wrong when those primitives are used carelessly.\n\n### The core idea\n\nA worker pool combines a fixed number of goroutines with a shared jobs channel to process work concurrently without launching one goroutine per item; directional channel types, `nil` channels, and goroutine leaks are the real, concrete pitfalls that show up once code actually looks like this.\n\n### Examples\n\n**1. A worker pool — a fixed number of goroutines processing a stream of jobs.**\n```go\nfunc worker(id int, jobs <-chan int, results chan<- int, wg *sync.WaitGroup) {\n\tdefer wg.Done()\n\tfor j := range jobs {\n\t\tresults <- j * j\n\t}\n}\n\njobs := make(chan int, 10)\nresults := make(chan int, 10)\nvar wg sync.WaitGroup\n\nfor w := 1; w <= 3; w++ {\n\twg.Add(1)\n\tgo worker(w, jobs, results, &wg)\n}\n\nfor i := 1; i <= 5; i++ {\n\tjobs <- i\n}\nclose(jobs)\n\nwg.Wait()\nclose(results)\n\nsum := 0\nfor r := range results {\n\tsum += r\n}\nfmt.Println(sum)\n```\nOutput:\n```\n55\n```\nThree workers share one `jobs` channel — each pulls the next available job via `range`, so work is distributed automatically without any explicit assignment logic. `close(jobs)` after all jobs are sent lets each worker's `range jobs` loop end naturally once the channel is drained; `wg.Wait()` then confirms every worker has genuinely finished before `close(results)` and the final summation. `1² + 2² + 3² + 4² + 5² = 55`, correctly.\n\n**2. Directional channel types — `chan<-` (send-only) and `<-chan` (receive-only), enforced by the compiler.**\n```go\nfunc onlySend(ch chan<- int) {\n\tv := <-ch\n\t_ = v\n}\n```\nOutput:\n```\n# command-line-arguments\n./directional.go:3:9: invalid operation: cannot receive from send-only channel chan<- int ch (variable of type chan<- int)\n```\n`worker`'s signature in Example 1 (`jobs <-chan int, results chan<- int`) already used this: a plain `chan int` can be passed where either direction is expected, but once a parameter is declared `chan<-` or `<-chan`, the compiler enforces that restriction — genuinely useful self-documentation, making a function's intent (this only sends, this only receives) part of its actual type signature, checked at compile time.\n\n**3. A `nil` channel is never ready — genuinely, permanently, not a special error case.**\n```go\nvar ch chan int\nselect {\ncase <-ch:\n\tfmt.Println(\"never\")\ndefault:\n\tfmt.Println(\"nil channel is never ready, default runs\")\n}\n```\nOutput:\n```\nnil channel is never ready, default runs\n```\nA `nil` channel (never `make`'d) blocks forever on both send and receive — inside a `select`, that means its case simply never becomes ready, which is occasionally used deliberately (to conditionally \"disable\" one `select` case) but is far more often an accidental bug from forgetting to initialize a channel.\n\n**4. A real, measurable goroutine leak.**\n```go\nfunc leaky() <-chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tresult := 42\n\t\tch <- result // blocks forever if nobody ever receives\n\t}()\n\treturn ch\n}\n\nbefore := runtime.NumGoroutine()\nfor i := 0; i < 5; i++ {\n\tleaky() // we never read from the returned channel!\n}\ntime.Sleep(50 * time.Millisecond)\nafter := runtime.NumGoroutine()\nfmt.Println(\"goroutines before:\", before, \"after launching 5 leaky ones:\", after)\n```\nOutput:\n```\ngoroutines before: 1 after launching 5 leaky ones: 6\n```\nEach call to `leaky()` starts a goroutine that blocks forever on `ch <- result`, since the returned channel is unbuffered and this program never reads from it. `runtime.NumGoroutine()` confirms it directly: exactly 5 extra goroutines, permanently stuck, never cleaned up — a genuine memory/resource leak that accumulates for as long as the program keeps running, with nothing in the program's own output ever hinting that anything is wrong.\n\n### ⚠️ Common Mistakes\n\n- **Starting a goroutine that sends on an unbuffered channel with no guarantee anyone will ever receive.** As Example 4 proved with a real, measured count, this leaks the goroutine permanently — either guarantee a receiver exists, use a buffered channel sized for the case no one reads promptly, or give the goroutine a `context` (Chapter 7.12) to watch for \"give up, nobody wants this anymore.\"\n- **Forgetting to `close` the `jobs` channel in a worker-pool pattern.** Without it, every worker's `range jobs` loop blocks forever waiting for more jobs that will never come, even after all real work is done — Example 1's `close(jobs)` immediately after the last send is essential, not optional.\n- **Treating a `nil` channel bug as a mysterious hang.** A channel variable that was declared but never `make`'d silently blocks forever on any use — worth checking for specifically when a goroutine seems stuck for no apparent reason.\n- **Reaching for raw goroutines and channels when a simpler tool (a plain function call, or `sync.WaitGroup` alone without channels) would do.** Concurrency adds genuine complexity — worth reaching for deliberately, when a program's shape actually calls for it, not by default.\n\n### How this connects\n\nEvery primitive this chapter combines — goroutines (7.8), channels (7.9), `select` (7.10), `sync` (7.11), and `context` (7.12) — comes together here into the patterns you'll actually reach for in real programs, including this book's own capstone (Chapter 9.2).\n\n### Quick recap\n\n- A worker pool distributes jobs across a fixed number of goroutines sharing one channel — `close` the jobs channel once all work is sent, and `WaitGroup` to know when every worker has genuinely finished.\n- Directional channel types (`chan<-`, `<-chan`) let a function's signature document and enforce, at compile time, whether it only sends or only receives.\n- A `nil` channel blocks forever on any operation — genuinely useful occasionally (disabling a `select` case), but far more often an accidental bug.\n- A goroutine that sends on a channel nobody will ever receive from leaks permanently — verified directly by counting goroutines before and after with `runtime.NumGoroutine()`."}, {"id": "7.14", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 14, "slug": "http-clients-servers-net-http", "fullTitle": "HTTP Clients & Servers: `net/http`", "title": "HTTP Clients & Servers: `net/http`", "md": "### Why this matters\n\n`net/http` is one of Go's most-loved standard-library packages — a genuinely production-capable HTTP server and client, no external framework required. This chapter builds both a small server and the clients that talk to it, using nothing beyond what ships with Go itself.\n\n### The core idea\n\nA server handler is any `func(http.ResponseWriter, *http.Request)`, routed by path with `http.NewServeMux`; a client request goes out via `http.Get`/`http.Post` for the common case, or `http.NewRequest` plus `client.Do` for full control. Both sides work directly with `io.Reader`/`io.Writer` (Chapter 7.2) and `encoding/json` (Chapter 7.5) underneath.\n\n### Examples\n\n**1. A basic HTTP server — routing, query parameters, and plain text responses.**\n```go\nfunc helloHandler(w http.ResponseWriter, r *http.Request) {\n\tname := r.URL.Query().Get(\"name\")\n\tif name == \"\" {\n\t\tname = \"World\"\n\t}\n\tfmt.Fprintf(w, \"Hello, %s!\", name)\n}\n\nmux := http.NewServeMux()\nmux.HandleFunc(\"/hello\", helloHandler)\n```\nA **handler** is any function matching `func(http.ResponseWriter, *http.Request)` — `r.URL.Query().Get(\"name\")` reads a query-string parameter, and `fmt.Fprintf(w, ...)` writes directly to the response (`w` satisfies `io.Writer`, Chapter 7.2, exactly like everything else that's ever accepted an `io.Writer` in this book). `http.NewServeMux` is a request router — mapping URL paths to the handlers that should serve them.\n\n**2. Making a real request against that server, and reading the response.**\n```go\nresp, err := http.Get(server.URL + \"/hello?name=Gopher\")\nif err != nil {\n\tfmt.Println(err)\n\treturn\n}\ndefer resp.Body.Close()\nbody, _ := io.ReadAll(resp.Body)\nfmt.Println(resp.StatusCode, string(body))\n```\nOutput:\n```\n200 Hello, Gopher!\n```\n`http.Get` is the simplest client call — `resp.Body` is an `io.Reader` (Chapter 7.2 again), read here with `io.ReadAll`. `defer resp.Body.Close()` immediately after checking the error is exactly Chapter 3.7's cleanup pattern, non-negotiable for every HTTP response body — skipping it leaks the underlying connection.\n\n**3. A JSON API endpoint, and decoding its response directly from the body stream.**\n```go\nfunc jsonHandler(w http.ResponseWriter, r *http.Request) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tjson.NewEncoder(w).Encode(Greeting{Message: \"Hello, JSON!\"})\n}\n```\nOn the client side:\n```go\nresp2, _ := http.Get(server.URL + \"/json\")\ndefer resp2.Body.Close()\nvar g Greeting\njson.NewDecoder(resp2.Body).Decode(&g)\nfmt.Println(g.Message)\n```\nOutput:\n```\nHello, JSON!\n```\n`json.NewEncoder(w).Encode(...)` and `json.NewDecoder(resp.Body).Decode(&g)` are exactly Chapter 7.5's streaming JSON pattern, now applied to a real HTTP body instead of a `bytes.Buffer` — no intermediate `[]byte` needed on either side.\n\n**4. A custom request with headers, using `http.Client`/`http.NewRequest` for more control than `http.Get` allows.**\n```go\nclient := &http.Client{}\nreq, _ := http.NewRequest(\"GET\", server.URL+\"/hello\", nil)\nreq.Header.Set(\"X-Custom-Header\", \"test\")\nresp3, _ := client.Do(req)\ndefer resp3.Body.Close()\n```\n`http.Get` is a shortcut for the common case; `http.NewRequest` plus `client.Do(req)` is the full form, needed the moment custom headers, a request body, or a non-`GET` method are involved.\n\n**5. `http.Client`'s `Timeout` — a real, measurable deadline on the whole request.**\n```go\nclient := &http.Client{Timeout: 20 * time.Millisecond}\n_, err := client.Get(server.URL)\nfmt.Println(err)\n```\nAgainst a handler that deliberately takes 100ms to respond:\n```\nGet \"http://127.0.0.1:40819\": context deadline exceeded (Client.Timeout exceeded while awaiting headers)\n```\n`http.Client{Timeout: ...}` is the simplest way to guarantee a request never hangs indefinitely — notice the error message itself: `net/http` implements this timeout using exactly Chapter 7.12's `context` deadline machinery underneath, not a separate, unrelated mechanism. The default `http.Client{}` (Example 2–4) has **no** timeout at all — genuinely worth setting explicitly for any request to a server you don't fully control.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `defer resp.Body.Close()` after every successful HTTP request.** This leaks the underlying network connection — a real, accumulating resource problem in any program making more than a handful of requests over its lifetime.\n- **Using the zero-value `http.Client{}` (or the package-level `http.Get`, which uses one internally) without a timeout**, against any server outside your own control. A slow or unresponsive server can hang the calling code indefinitely — Example 5's explicit `Timeout` is genuinely worth setting as a habit, not just for demonstrably slow servers.\n- **Reaching for `http.NewRequest` when `http.Get`/`http.Post` already covers the need.** The full form is necessary for custom headers, non-`GET` methods, or a request body — using it by default for a plain, header-less `GET` is unnecessary ceremony.\n- **Forgetting a handler function's `http.ResponseWriter` is itself an `io.Writer`**, and reaching for manual byte-slice construction instead of `fmt.Fprintf`/`json.NewEncoder` writing directly to it.\n\n### How this connects\n\nThis chapter is Part VII's capstone in miniature — `io.Reader`/`io.Writer` (7.2), JSON (7.5), and `context`-based timeouts (7.12) all converge here into one of the most common real things a Go program actually does: talk to, or serve, HTTP.\n\n### Quick recap\n\n- `http.HandleFunc`/`http.NewServeMux` route incoming requests to handler functions of the shape `func(http.ResponseWriter, *http.Request)`.\n- `http.Get`/`http.Post` are shortcuts for the common case; `http.NewRequest` + `client.Do(req)` is the full form, needed for custom headers or non-`GET` methods.\n- A response's `Body` is an `io.Reader` — always paired with `defer resp.Body.Close()` immediately after checking the request's error.\n- `json.NewEncoder`/`NewDecoder` work directly against a handler's `ResponseWriter` or a response's `Body`, avoiding an intermediate `[]byte`.\n- `http.Client{Timeout: duration}` is genuinely worth setting explicitly — the zero-value client has no timeout at all, and `net/http` implements the one you set using the same `context`-deadline machinery from Chapter 7.12."}, {"id": "8.1", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 1, "slug": "writing-tests-the-testing-package", "fullTitle": "Writing Tests: the `testing` Package", "title": "Writing Tests: the `testing` Package", "md": "### Why this matters\n\nGo's testing support is built directly into the standard toolchain — no separate framework required to get started, no configuration beyond following one simple naming convention. This chapter covers exactly that convention, and the handful of `*testing.T` methods that cover the vast majority of everyday test-writing needs.\n\n### The core idea\n\nA test lives in a file named `*_test.go`, as a function named `TestXxx(t *testing.T)` (capital first letter after `Test`, taking exactly one `*testing.T` parameter). `go test` finds and runs every such function automatically. `t.Errorf` records a failure but lets the test function keep running; `t.Fatal`/`t.Fatalf` records a failure and stops that test function immediately; `t.Skip` marks a test as deliberately not run.\n\n### Examples\n\n**1. A passing test, and a failing one — both in the same file.**\n```go\nfunc Add(a, b int) int {\n\treturn a + b\n}\n\nfunc TestAdd(t *testing.T) {\n\tresult := Add(2, 3)\n\tif result != 5 {\n\t\tt.Errorf(\"Add(2, 3) = %d; want 5\", result)\n\t}\n}\n\nfunc TestAddWrong(t *testing.T) {\n\tresult := Add(2, 2)\n\tif result != 5 {\n\t\tt.Errorf(\"Add(2, 2) = %d; want 5\", result)\n\t}\n}\n```\nRunning `go test -v .`:\n```\n=== RUN   TestAdd\n--- PASS: TestAdd (0.00s)\n=== RUN   TestAddWrong\n    mathutil_test.go:15: Add(2, 2) = 4; want 5\n--- FAIL: TestAddWrong (0.00s)\n```\nThere's no assertion library required — a test is just ordinary Go code that calls `t.Errorf` (with a `Printf`-style format string, Chapter 7.1) when something isn't as expected. `TestAdd` passes silently; `TestAddWrong` fails, prints exactly what went wrong and where, and `go test` reports the overall result clearly.\n\n**2. `t.Fatal` — stopping a test immediately, rather than continuing after a failure that makes the rest meaningless.**\n```go\nfunc Divide(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, fmt.Errorf(\"division by zero\")\n\t}\n\treturn a / b, nil\n}\n\nfunc TestDivide(t *testing.T) {\n\t_, err := Divide(10, 0)\n\tif err == nil {\n\t\tt.Fatal(\"expected an error, got nil\")\n\t}\n}\n```\nOutput:\n```\n--- PASS: TestDivide (0.00s)\n```\nThis test passes (dividing by zero genuinely does return an error). Had it failed, `t.Fatal` would have stopped `TestDivide` right there — genuinely important the moment continuing past a failed precondition would just produce confusing, secondary failures (like dereferencing a value that should have existed but doesn't) rather than useful information.\n\n**3. `t.Skip` — deliberately not running a test, with a stated reason.**\n```go\nfunc TestDivideSkip(t *testing.T) {\n\tt.Skip(\"skipping this test for demonstration\")\n}\n```\nOutput:\n```\n    mathutil_test.go:27: skipping this test for demonstration\n--- SKIP: TestDivideSkip (0.00s)\n```\nA skipped test is reported distinctly from both a pass and a failure — genuinely useful for a test that's temporarily broken, environment-dependent (needs a real database connection, say), or intentionally not-yet-implemented, without either deleting it or letting it fail the whole suite.\n\n**4. The overall result — one real failure genuinely fails the whole `go test` run.**\n```\nFAIL\nFAIL\texample.com/ch81\t0.002s\nFAIL\n```\nEven though `TestAdd`, `TestDivide` passed and `TestDivideSkip` was deliberately skipped, `TestAddWrong`'s single real failure makes the entire `go test` invocation report `FAIL` and exit with a non-zero status — exactly the signal a CI pipeline (or a pre-commit habit) needs to catch a genuine regression.\n\n### ⚠️ Common Mistakes\n\n- **Using `t.Fatal` when `t.Errorf` would be more useful.** `Fatal` stops the *entire* test function immediately — fine when continuing genuinely makes no sense, but overkill for something like \"this one value out of several was wrong,\" where `Errorf` lets the rest of the checks in the same test still run and report.\n- **Forgetting the exact naming convention** (`TestXxx`, capital `T` right after `Test`, exactly one `*testing.T` parameter). `go test` silently won't run a function that doesn't match — no error, it just isn't discovered as a test at all.\n- **Writing assertions with plain `if` and `panic`** instead of `t.Errorf`/`t.Fatal`. A `panic` inside a test crashes the whole test binary rather than being reported as a clean, individual test failure — always use the `*testing.T` methods for reporting failures.\n- **Not running tests regularly during development**, treating them as something added only at the end. Chapter 6.8 already noted `go test` runs `go vet` automatically — a fast, cheap habit that catches real issues early.\n\n### How this connects\n\nChapter 8.2 covers table-driven tests — the idiomatic way to test the same function against many inputs without repeating `TestXxx` boilerplate for each one — and Chapter 8.3 covers benchmarks, using the same `testing` package with one different function signature.\n\n### Quick recap\n\n- A test file ends in `_test.go`; a test function is named `TestXxx(t *testing.T)` — `go test` discovers and runs every one automatically.\n- `t.Errorf` records a failure and continues the test; `t.Fatal`/`t.Fatalf` records a failure and stops that test function immediately.\n- `t.Skip` marks a test as deliberately not run, with a stated reason, reported distinctly from both pass and fail.\n- A single real test failure makes the whole `go test` run report `FAIL` and exit non-zero — the signal that matters for CI and pre-commit checks."}, {"id": "8.2", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 2, "slug": "table-driven-tests-subtests", "fullTitle": "Table-Driven Tests & Subtests", "title": "Table-Driven Tests & Subtests", "md": "### Why this matters\n\nTesting one function against many different inputs by writing a separate `TestXxx` for each one gets repetitive fast, and repetitive test code is exactly where copy-paste mistakes hide. **Table-driven tests** are the idiomatic Go answer: one test function, a slice of input/expected-output cases, and a loop — genuinely the most common shape of real Go tests you'll ever encounter.\n\n### The core idea\n\nDefine a slice of struct literals, each describing one test case (typically a name, some inputs, and an expected result), then loop over it, calling `t.Run(name, func(t *testing.T) { ... })` for each one. `t.Run` creates a genuine **subtest** — reported individually, runnable individually, and one subtest's failure doesn't stop the others from running.\n\n### Examples\n\n**1. The complete pattern.**\n```go\nfunc Add(a, b int) int {\n\treturn a + b\n}\n\nfunc TestAddTableDriven(t *testing.T) {\n\ttests := []struct {\n\t\tname string\n\t\ta, b int\n\t\twant int\n\t}{\n\t\t{\"positive numbers\", 2, 3, 5},\n\t\t{\"negative numbers\", -2, -3, -5},\n\t\t{\"zero\", 0, 0, 0},\n\t\t{\"mixed - intentionally wrong\", 5, 5, 11},\n\t}\n\n\tfor _, tt := range tests {\n\t\tt.Run(tt.name, func(t *testing.T) {\n\t\t\tgot := Add(tt.a, tt.b)\n\t\t\tif got != tt.want {\n\t\t\t\tt.Errorf(\"Add(%d, %d) = %d; want %d\", tt.a, tt.b, got, tt.want)\n\t\t\t}\n\t\t})\n\t}\n}\n```\nRunning `go test -v .`:\n```\n=== RUN   TestAddTableDriven\n=== RUN   TestAddTableDriven/positive_numbers\n=== RUN   TestAddTableDriven/negative_numbers\n=== RUN   TestAddTableDriven/zero\n=== RUN   TestAddTableDriven/mixed_-_intentionally_wrong\n    main_test.go:21: Add(5, 5) = 10; want 11\n--- FAIL: TestAddTableDriven (0.00s)\n    --- PASS: TestAddTableDriven/positive_numbers (0.00s)\n    --- PASS: TestAddTableDriven/negative_numbers (0.00s)\n    --- PASS: TestAddTableDriven/zero (0.00s)\n    --- FAIL: TestAddTableDriven/mixed_-_intentionally_wrong (0.00s)\n```\nThe anonymous struct (Chapter 2.8) holding `name`, `a`, `b`, `want` is the \"table\" — each row is one complete test case. Three cases pass; the deliberately-wrong fourth case fails, and critically, the *other three ran anyway* — a single bad case doesn't prevent the rest from reporting their own results. Notice the subtest names: spaces became underscores (`positive_numbers`), Go's own convention for making subtest names safe to reference on the command line.\n\n**2. Running one specific subtest by name, using `-run` with a slash-separated pattern.**\n```\ngo test -v -run \"TestAddTableDriven/zero\" .\n```\nOutput:\n```\n=== RUN   TestAddTableDriven\n=== RUN   TestAddTableDriven/zero\n--- PASS: TestAddTableDriven (0.00s)\n    --- PASS: TestAddTableDriven/zero (0.00s)\nPASS\nok  \texample.com/ch82\t0.002s\n```\n`-run` matches against the parent test name, a `/`, and the subtest name — genuinely useful while actively debugging one specific failing case, without re-running the entire (possibly slow) suite every time.\n\n### ⚠️ Common Mistakes\n\n- **Writing a separate `TestXxx` function for every input variation** instead of one table-driven test. This is more typing, more chances for copy-paste drift between near-identical test functions, and loses the ability to run all variations together with clean, individual reporting.\n- **Forgetting the loop variable capture subtlety inside `t.Run`'s closure — though this is worth naming precisely, since it's exactly Chapter 4.5's Go 1.22 fix in action.** On modern Go (this book's toolchain), `tt` inside `t.Run(tt.name, func(t *testing.T) { ... })` correctly refers to *that* iteration's own `tt`, exactly as shown — this was a genuine, common bug on pre-1.22 Go (every subtest closure sharing one `tt` variable), now simply not a concern.\n- **Giving test cases unhelpful or non-unique names.** A subtest name is what shows up in `-v` output and `-run` patterns — `\"case 1\"`, `\"case 2\"` tell you nothing when scanning a failure list; a name describing *what's actually being tested* (as in Example 1) pays for itself immediately.\n- **Not using subtests at all, even when testing multiple cases in one `TestXxx`.** Without `t.Run`, one case's `t.Fatal` can stop the *entire* function's remaining cases from ever running — subtests (each with their own `*testing.T`) isolate that entirely.\n\n### How this connects\n\nThis exact table-driven shape reappears in Chapter 8.3's benchmarks (`b.Run` for named sub-benchmarks) and is genuinely the default way you'll write the overwhelming majority of tests for the rest of your Go career — internalizing it here pays off constantly.\n\n### Quick recap\n\n- A table-driven test defines a slice of test-case structs, then loops over it calling `t.Run(name, func(t *testing.T) {...})` for each one.\n- `t.Run` creates a genuine subtest — reported and runnable individually; one subtest's failure doesn't stop the others.\n- `go test -run \"TestName/subtestName\"` runs one specific subtest by name — useful while debugging a single failing case.\n- Spaces in a subtest's name become underscores automatically, for safe command-line referencing."}, {"id": "8.3", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 3, "slug": "benchmarks-test-coverage", "fullTitle": "Benchmarks & Test Coverage", "title": "Benchmarks & Test Coverage", "md": "### Why this matters\n\nChapter 4.6 mentioned Fibonacci's naive recursive form was a lot of calls — now you can actually measure exactly how many, and exactly how much it costs, using the same `testing` package that already handles ordinary tests. Coverage answers a different, equally practical question: how much of the actual code do the tests even exercise?\n\n### The core idea\n\nA benchmark function is named `BenchmarkXxx(b *testing.B)`, and its body runs `for i := 0; i < b.N; i++ { ... }` — the testing framework automatically figures out how many times (`b.N`) to run the loop to get a stable, meaningful timing measurement, increasing it until the result settles. `go test -bench=<pattern>` runs benchmarks; `go test -cover` reports what percentage of statements the tests actually executed.\n\n### Examples\n\n**1. Benchmarking two implementations of the same function.**\n```go\nfunc fibonacci(n int) int {\n\tif n <= 1 {\n\t\treturn n\n\t}\n\treturn fibonacci(n-1) + fibonacci(n-2)\n}\n\nfunc fibonacciFast(n int) int {\n\ta, b := 0, 1\n\tfor i := 0; i < n; i++ {\n\t\ta, b = b, a+b\n\t}\n\treturn a\n}\n\nfunc BenchmarkFibonacci(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tfibonacci(20)\n\t}\n}\n\nfunc BenchmarkFibonacciFast(b *testing.B) {\n\tfor i := 0; i < b.N; i++ {\n\t\tfibonacciFast(20)\n\t}\n}\n```\nRunning `go test -bench=.`:\n```\nBenchmarkFibonacci-24        \t  100000\t     21578 ns/op\nBenchmarkFibonacciFast-24    \t  100000\t         6.360 ns/op\n```\n`-24` is the `GOMAXPROCS` value the benchmark ran under; `100000` is how many iterations actually ran; `ns/op` is nanoseconds per single call. The naive recursive `fibonacci` takes roughly **3,400 times longer** per call than the iterative `fibonacciFast` — a real, precisely measured difference, not a guess, and exactly the kind of number that makes \"should I bother optimizing this\" a data-driven question instead of a hunch.\n\n**2. `go test -cover` — a quick coverage percentage.**\n```\ngo test -cover .\n```\nOutput:\n```\nok  \texample.com/ch83\t0.007s\tcoverage: 100.0% of statements\n```\nThis single number is a fast sanity check — genuinely useful, but \"100% coverage\" only means every statement *ran* at least once during the tests, not that every possible input or edge case was actually checked. High coverage is a floor worth having, not a ceiling to stop at.\n\n**3. A detailed, per-function coverage report.**\n```\ngo test -coverprofile=coverage.out .\ngo tool cover -func=coverage.out\n```\nOutput:\n```\nexample.com/ch83/main.go:3:\tfibonacci\t100.0%\nexample.com/ch83/main.go:10:\tfibonacciFast\t100.0%\nexample.com/ch83/main.go:18:\tmain\t\t0.0%\ntotal:\t\t\t\t(statements)\t100.0%\n```\n`-coverprofile` writes detailed, per-line coverage data to a file; `go tool cover -func` summarizes it by function. `main` shows `0.0%` here — genuinely accurate, since this particular `main` is empty and no test ever calls it directly — while the overall `total` still reads `100.0%`, since an empty function body has zero actual statements to measure coverage against in the first place. `go tool cover -html=coverage.out` (not shown here) opens an actual visual, line-by-line, color-coded view in a browser — genuinely the most useful way to spot exactly which lines tests never touch.\n\n### ⚠️ Common Mistakes\n\n- **Writing a benchmark that does its expensive setup *inside* the `b.N` loop**, inflating the measured time with work that should only happen once. Setup that doesn't need to repeat belongs before the loop starts (and `b.ResetTimer()`, not covered in depth here, exists for exactly this situation when setup can't be moved outside entirely).\n- **Chasing 100% coverage as the actual goal**, rather than a useful signal. As Example 2 noted, full statement coverage doesn't mean every edge case or input combination was genuinely tested — it only means every *line* ran at least once.\n- **Comparing benchmark numbers across different machines, or without enough iterations to stabilize.** Absolute `ns/op` numbers are only meaningful compared against *other benchmarks run on the same machine, same load conditions* — exactly like this chapter's own within-run comparison of two implementations, not as a portable, universal number.\n- **Never actually running benchmarks that already exist in a codebase.** Unlike `go test` (which runs automatically as part of most CI setups), `-bench` must be explicitly requested — a benchmark that's never run provides zero value sitting unused in the source.\n\n### How this connects\n\nThe naive-vs-iterative Fibonacci comparison here directly validates Chapter 4.6's own claim about naive recursion's real call-count cost — Chapter 8.4's style guidance and Chapter 8.5's common pitfalls both lean on exactly this kind of \"measure, don't guess\" discipline for anything performance-related.\n\n### Quick recap\n\n- `BenchmarkXxx(b *testing.B)` with a `for i := 0; i < b.N; i++` loop measures real, stable per-operation timing — `go test -bench=<pattern>` runs it.\n- `go test -cover` reports the percentage of statements executed by the tests — a useful floor, not a guarantee every case is actually checked.\n- `go test -coverprofile=file` plus `go tool cover -func`/`-html` gives a detailed, per-function or visual, line-by-line coverage breakdown.\n- Benchmark numbers are only meaningful compared against each other on the same machine — never as an absolute, portable measurement."}, {"id": "8.4", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 4, "slug": "go-style-naming-formatting-effective-go-idioms", "fullTitle": "Go Style: Naming, Formatting & Effective Go Idioms", "title": "Go Style: Naming, Formatting & Effective Go Idioms", "md": "### Why this matters\n\nGo's community has an unusually strong, well-documented consensus on how idiomatic code should look — partly because `gofmt` (Chapter 0.2/6.8) already settled whitespace and brace placement permanently, leaving naming and structure as the remaining, genuinely meaningful style decisions. These conventions aren't enforced by the compiler, but following them is what makes Go code instantly recognizable and comfortable to any other Go programmer.\n\n### The core idea\n\nGo favors short, precise names scoped to how long they're visible (a loop index can be `i`; a package-level exported function needs a fuller name). Interfaces with one method are named after that method plus `-er` (`Reader`, `Writer`, `Stringer` — all real ones you've already met). A package's name should never be repeated inside its own exported identifiers. None of this is compiler-checked — it's convention, documented in Go's own \"Effective Go\" guide and the community's \"Go Code Review Comments,\" and followed with unusual consistency across the ecosystem.\n\n### Examples\n\n**1. Short names for short-lived, small-scope variables.**\n```go\nfor i := 0; i < len(items); i++ {\n\t// i is fine here — its entire life is a few lines\n}\n\nfor _, item := range items {\n\t// item, not it or theItem — clear without being verbose\n}\n```\nIdiomatic Go leans toward brevity that stays clear from context — `i`, `j`, `k` for loop indices, `err` for errors (always, without exception — Chapter 6.1's `if err != nil` pattern relies on this being instantly recognizable), `ctx` for a `context.Context` (Chapter 7.12 already used this consistently). A name's length should roughly track how far away its declaration is from its uses — a package-level exported name, visible from anywhere, earns a fuller, more descriptive name than a variable living for three lines inside a small loop.\n\n**2. No \"Get\" prefix on simple accessor methods — a real, well-known Go convention, not compiler-enforced.**\n```go\ntype Config struct {\n\tname string\n}\n\nfunc (c *Config) GetName() string {\n\treturn c.name\n}\n\nfunc (c *Config) Name() string {\n\treturn c.name\n}\n```\nBoth compile identically — `go vet` has no opinion on this at all (verified directly: `go vet` exits clean on both). But idiomatic Go strongly prefers the second form: a simple getter is just named after the thing it returns (`Name()`, not `GetName()`) — the `Get` prefix, completely normal in Java or C#, reads as a tell that code wasn't written with Go conventions in mind. (A setter, when one is genuinely needed, keeps a verb: `SetName(name string)`.)\n\n**3. `-er` naming for single-method interfaces — exactly the pattern behind every interface you've already met.**\n```go\ntype Reader interface {\n\tRead(p []byte) (n int, err error)\n}\ntype Stringer interface {\n\tString() string\n}\n```\nChapters 5.5, 5.8, and 7.2 already used exactly this convention without naming it explicitly: a single-method interface named after that method, with `-er` appended. This isn't a hard rule for every interface (a genuinely multi-purpose interface can have a more descriptive name), but it's the strong default for the extremely common \"one capability, one method\" case.\n\n**4. Avoiding package-name stutter in exported identifiers.**\n```go\npackage stutter\n\ntype StutterConfig struct {\n\tName string\n}\n\ntype Config struct {\n\tName string\n}\n```\nBoth compile and both work identically — from outside the package, they're called `stutter.StutterConfig` and `stutter.Config`. The second reads noticeably better: the package name already provides context the moment you write `stutter.`, so repeating \"Stutter\" inside the type name itself is pure redundancy. This exact principle is why the standard library has `http.Server` (not `http.HTTPServer`) and `json.Decoder` (not `json.JSONDecoder`).\n\n**5. \"Accept interfaces, return concrete types\" — a genuinely load-bearing idiom, not just a naming rule.**\n```go\nfunc WriteReport(w io.Writer, data []byte) error {\n\t_, err := w.Write(data)\n\treturn err\n}\n\nfunc NewConfig(name string) *Config {\n\treturn &Config{name: name}\n}\n```\n`WriteReport` accepts the narrowest interface that does the job (`io.Writer`, Chapter 7.2) — this maximizes what can be passed in (a file, a network connection, an in-memory buffer, anything satisfying that one method). `NewConfig` returns a concrete `*Config`, not some interface — the caller gets the real, full type, with every one of its actual methods and fields directly available, rather than being artificially restricted to whatever a returned interface happened to expose.\n\n### ⚠️ Common Mistakes\n\n- **Adding a `Get` prefix to simple accessor methods**, or `Set` where a more descriptive verb would communicate more. Neither is a compile error or even a `go vet` warning — it's purely a convention, but a genuinely strongly-held one across the Go ecosystem.\n- **Naming a package's own exported types with the package name repeated inside them.** `stutter.StutterConfig` compiles fine but reads worse than `stutter.Config` the moment it's actually used from outside the package, exactly
