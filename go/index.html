emoves an entry, silently doing nothing if it wasn't present; `len(m)` counts entries.\n- Iteration order is deliberately randomized, verified across repeated runs — sort keys explicitly whenever a predictable order matters."}, {"id": "2.8", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Go's data", "chapNum": 8, "slug": "structs-grouping-related-data", "fullTitle": "Structs: Grouping Related Data", "title": "Structs: Grouping Related Data", "md": "### Why this matters\n\nReal data is rarely just one value — a person has a name *and* an age, a point has an x *and* a y. A `struct` is Go's way of bundling related fields together into one named type, and it's the foundation nearly everything else in the rest of this book builds on: methods (Chapter 5.3), interfaces (Chapter 5.5), and JSON (Chapter 7.5) are all, in the end, about structs.\n\n### The core idea\n\nA `struct` is a named collection of fields, each with its own name and type. Unlike a map, a struct's fields are fixed at compile time — you can't add a field that wasn't declared, but you get real, compile-time-checked access to each one (`p.Name`, not `p[\"Name\"]`), and mixing field types (a `string` next to an `int`) is completely normal.\n\n### Examples\n\n**1. Declaring a struct type, and creating one with named fields.**\n```go\ntype Person struct {\n\tName string\n\tAge  int\n}\n\np1 := Person{Name: \"Alice\", Age: 30}\nfmt.Println(p1)\nfmt.Println(p1.Name, p1.Age)\n```\nOutput:\n```\n{Alice 30}\nAlice 30\n```\n`type Person struct {...}` declares the shape; `Person{Name: \"Alice\", Age: 30}` is a struct literal using named fields — the safest, clearest form, since field order doesn't matter and adding a new field later can't silently break existing code.\n\n**2. A positional struct literal — works, but genuinely more fragile.**\n```go\np2 := Person{\"Bob\", 25}\nfmt.Println(p2)\n```\nOutput:\n```\n{Bob 25}\n```\nThis skips the field names entirely, relying purely on declaration order (`Name` first, then `Age`). It's shorter, but if `Person`'s field order (or field count) ever changes, every positional literal like this one silently breaks or, worse, silently assigns values to the wrong fields — named literals (Example 1) are the safer default for anything beyond a very small, stable struct.\n\n**3. The zero value — every field gets its own type's zero value.**\n```go\nvar p3 Person\nfmt.Println(p3)\n\np4 := Person{Name: \"Charlie\"}\nfmt.Println(p4)\n```\nOutput:\n```\n{ 0}\n{Charlie 0}\n```\n`p3`'s `Name` is `\"\"` (printing as blank) and `Age` is `0` — exactly Chapter 1.3's zero-value rule, applied per field. `p4` shows a named literal doesn't need every field — any field left out simply gets its zero value, which is often exactly what you want.\n\n**4. Fields are mutable through dot notation, exactly as you'd expect.**\n```go\np1.Age = 31\nfmt.Println(p1)\n```\nOutput:\n```\n{Alice 31}\n```\n\n**5. Structs are comparable with `==`, provided every field is itself comparable.**\n```go\np5 := Person{Name: \"Alice\", Age: 31}\nfmt.Println(p1 == p5)\n```\nOutput:\n```\ntrue\n```\n`==` compares every field — this works here because both `string` and `int` are comparable, exactly the same rule that determines whether a type can be a map key (Chapter 2.7). A struct with a slice field, though, would *not* be comparable with `==` — the same restriction propagates from the field's own type.\n\n**6. Nesting structs — a field whose type is itself a struct.**\n```go\ntype Address struct {\n\tCity string\n\tZip  string\n}\ntype Employee struct {\n\tPerson\n\tCompany string\n\tAddr    Address\n}\ne := Employee{\n\tPerson:  Person{Name: \"Dana\", Age: 40},\n\tCompany: \"Acme\",\n\tAddr:    Address{City: \"Metropolis\", Zip: \"12345\"},\n}\nfmt.Println(e)\nfmt.Println(e.Addr.City)\n```\nOutput:\n```\n{{Dana 40} Acme {Metropolis 12345}}\nMetropolis\n```\n`Addr Address` is an ordinary named field whose type happens to be another struct — access it by chaining dots, `e.Addr.City`. `Employee` also includes `Person` with no field name of its own — this is **struct embedding**, which does something more interesting than an ordinary field (Chapter 5.7 covers it properly; for now, just notice it's allowed, and that `e`'s printed form nests `Person`'s own fields inside).\n\n**7. An anonymous struct — a one-off shape with no named type at all.**\n```go\nanon := struct {\n\tX, Y int\n}{X: 1, Y: 2}\nfmt.Println(anon)\n```\nOutput:\n```\n{1 2}\n```\nGenuinely useful for a quick, throwaway grouping of values that doesn't deserve its own named type declared elsewhere — most common in test code and small, local helper data.\n\n**8. A pointer to a struct lets you modify the original through it — a preview of Chapter 5.2.**\n```go\npp := &p1\npp.Age = 99\nfmt.Println(p1)\n```\nOutput:\n```\n{Alice 99}\n```\n`&p1` takes a pointer to `p1`; modifying through `pp` changed the real `p1`. Chapter 5.1/5.2 cover pointers properly — this is just a first glimpse of why they matter for structs specifically.\n\n### ⚠️ Common Mistakes\n\n- **Relying on positional struct literals for anything beyond a small, stable struct.** As Example 2 noted, they silently break (or silently misassign) the moment field order or count changes — named literals are the safer default.\n- **Assuming every struct is comparable with `==`.** It only works when every field's own type is comparable — a struct containing a slice or a map field is not usable with `==` at all (a compile error, not a runtime surprise).\n- **Forgetting a struct literal can omit fields entirely**, leaving them at their zero value — genuinely useful, not an error, exactly as Example 3 showed.\n- **Confusing an embedded field (`Person` with no field name) with an ordinary named field (`Addr Address`).** Both are legal and shown here, but only the embedded form gets the special field-promotion behavior Chapter 5.7 covers — an ordinary named field always needs its full path (`e.Addr.City`).\n\n### How this connects\n\nStructs are the foundation for methods (Chapter 5.3 — a function attached to a struct type), embedding (Chapter 5.7), and JSON encoding/decoding (Chapter 7.5, where struct field names map directly onto JSON keys). Nearly everything from here on that models \"a real thing with several properties\" is a struct.\n\n### Quick recap\n\n- `type Name struct { Field1 Type1; Field2 Type2 }` declares a struct; `Name{Field1: v1, Field2: v2}` (named) or `Name{v1, v2}` (positional, more fragile) creates one.\n- Every field gets its type's zero value if omitted from a literal — never garbage.\n- Structs are comparable with `==` only when every field's type is itself comparable.\n- A struct field can itself be another struct (nesting) or be embedded with no field name (a preview of Chapter 5.7's field promotion).\n- An anonymous struct (`struct { ... }{ ... }`) is useful for a one-off shape that doesn't need its own named type."}, {"id": "2.9", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Go's data", "chapNum": 9, "slug": "struct-tags-field-metadata", "fullTitle": "Struct Tags & Field Metadata", "title": "Struct Tags & Field Metadata", "md": "### Why this matters\n\nYou'll see a small backtick-quoted string sitting after nearly every field of every struct meant to be converted to or from JSON, and it looks like nothing you've met yet in this book. This short chapter demystifies exactly what it is, before Chapter 7.5 puts it to full use.\n\n### The core idea\n\nA **struct tag** is a plain string literal attached to a field, written in backticks right after its type. Go itself does nothing with a tag automatically — it's just metadata, stored alongside the field's type information and readable via reflection (Chapter 9.3 touches reflection briefly; you don't need to understand it to use tags). What actually *acts* on a tag is whatever library reads it — most commonly `encoding/json` (Chapter 7.5), which looks for a `json:\"...\"` tag to decide exactly how a field should be named and behave when converted to or from JSON.\n\n### Examples\n\n**1. The syntax — a backtick-quoted string after the field's type.**\n```go\ntype Person struct {\n\tName string `json:\"name\"`\n\tAge  int    `json:\"age,omitempty\"`\n}\n```\nNothing runs yet just from declaring this — the tag is inert until something reads it.\n\n**2. A tag is just a string — provable directly with reflection.**\n```go\nt := reflect.TypeOf(Person{})\nfield, _ := t.FieldByName(\"Name\")\nfmt.Println(field.Tag)\nfmt.Println(field.Tag.Get(\"json\"))\n```\nOutput:\n```\njson:\"name\"\nname\n```\n`field.Tag` is the whole raw tag string; `.Get(\"json\")` parses out just the value associated with the `json` key specifically. A tag can hold several space-separated key:\"value\" pairs at once (`` `json:\"name\" xml:\"Name\"` ``, say) — different libraries each look for their own key and ignore the rest.\n\n**3. What `encoding/json` actually does with the tag.**\n```go\np := Person{Name: \"Alice\", Age: 30}\nb, _ := json.Marshal(p)\nfmt.Println(string(b))\n```\nOutput:\n```\n{\"name\":\"Alice\",\"age\":30}\n```\nNotice the JSON keys are lowercase (`name`, `age`) — exactly what the tags specified — not `Name`/`Age`, which is what Go's field names actually are. Without a tag, `encoding/json` falls back to using the field name verbatim:\n```go\ntype NoTags struct {\n\tName string\n\tAge  int\n}\nn := NoTags{Name: \"Carl\", Age: 20}\nb3, _ := json.Marshal(n)\nfmt.Println(string(b3))\n```\n```\n{\"Name\":\"Carl\",\"Age\":20}\n```\n\n**4. `omitempty` — a real, useful tag option, verified directly.**\n```go\np2 := Person{Name: \"Bob\"}\nb2, _ := json.Marshal(p2)\nfmt.Println(string(b2))\n```\nOutput:\n```\n{\"name\":\"Bob\"}\n```\n`Age` was left at its zero value (`0`) and, because of `,omitempty` in its tag, was dropped from the output entirely rather than appearing as `\"age\":0`. Chapter 7.5 covers `encoding/json`'s tag vocabulary (`omitempty`, `-` to skip a field entirely, and more) in full.\n\n### ⚠️ Common Mistakes\n\n- **Expecting a struct tag to do something on its own.** It's inert metadata — nothing happens unless some code (like `encoding/json`) explicitly reads it via reflection.\n- **Getting the tag syntax slightly wrong** — a missing colon, mismatched quotes, a space where a colon belongs. A malformed tag doesn't cause a compile error (tags are just string literals as far as the compiler's concerned), but the library reading it will typically just silently fail to find the key it's looking for, which can be a genuinely confusing bug to track down.\n- **Forgetting field names must be exported (capitalized, Chapter 6.6) for `encoding/json` — or anything else outside the package — to see them at all**, tag or no tag. An unexported field is invisible to `json.Marshal` no matter what its tag says.\n\n### How this connects\n\nThis is entirely a preview — Chapter 7.5 (`encoding/json`) is where struct tags actually earn their keep, covering the full range of options (`omitempty`, renaming, skipping fields, embedding) with real, verified examples.\n\n### Quick recap\n\n- A struct tag is a backtick-quoted string after a field's type, holding metadata some external library reads via reflection — Go itself does nothing with it automatically.\n- `field.Tag.Get(\"key\")` retrieves one specific key's value from a tag that may hold several.\n- `encoding/json` reads `json:\"...\"` tags to control the JSON key name (and behavior like `omitempty`); without a tag, it falls back to the Go field name verbatim.\n- Only exported (capitalized) fields are visible to `encoding/json` or reflection at all, regardless of tags."}, {"id": "3.1", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 1, "slug": "making-decisions-if-elseif-else", "fullTitle": "Making Decisions: `if` / `else if` / `else`", "title": "Making Decisions: `if` / `else if` / `else`", "md": "### Why this matters\n\nEvery non-trivial program needs to do different things depending on the data it's working with. Go's `if` is close to what you'd expect from any C-family language, with two real, deliberate differences worth knowing from the very first example: no parentheses required around the condition, and braces that are never optional.\n\n### The core idea\n\n`if condition { ... }` runs its block when `condition` (a real `bool` — never an integer or a pointer standing in for one, unlike C) is `true`. `else if` and `else` chain additional checks and a fallback, exactly as you'd expect. Go also allows a short statement before the condition, scoped to the `if`/`else if`/`else` chain and nowhere else — genuinely useful for a value that's only needed for this one decision.\n\n### Examples\n\n**1. The basic chain.**\n```go\nage := 20\nif age >= 18 {\n\tfmt.Println(\"adult\")\n} else if age >= 13 {\n\tfmt.Println(\"teen\")\n} else {\n\tfmt.Println(\"child\")\n}\n```\nOutput:\n```\nadult\n```\nNo parentheses around `age >= 18` — Go doesn't require them (and `gofmt` won't add them). Braces, on the other hand, are never optional, even for a single-statement body — the next example shows exactly what happens without them.\n\n**2. Braces are mandatory — a genuine, immediate syntax error without them.**\n```go\nif true\n\tprintln(\"hi\")\n```\nOutput:\n```\n# command-line-arguments\n./nobrace.go:4:16: syntax error: unexpected newline, expected { after if clause\n```\nUnlike C or JavaScript, where a brace-less single-statement `if` is legal (if sometimes discouraged), Go's grammar simply doesn't allow it — every `if` body must be wrapped in `{ }`, no exceptions. This removes an entire, well-known class of bugs in other languages (accidentally believing a second statement is part of the `if` because of indentation alone, when only the first line actually was).\n\n**3. Parentheses around the condition are legal, just never idiomatic.**\n```go\nx := 5\nif (x > 3) {\n\tfmt.Println(\"yes\")\n}\n```\nOutput:\n```\nyes\n```\nThis compiles and runs fine — Go doesn't forbid parentheses, it just doesn't require them, and `gofmt` doesn't strip them either if you write them. Idiomatic Go simply never uses them; every example in this book (and in the standard library) leaves them off.\n\n**4. A short statement before the condition, scoped to the whole `if`/`else` chain.**\n```go\nif x := age * 2; x > 30 {\n\tfmt.Println(\"big:\", x)\n} else {\n\tfmt.Println(\"small:\", x)\n}\n```\nOutput:\n```\nbig: 40\n```\n`x := age * 2` runs once, before the condition is even checked, and `x` remains visible through every branch of this specific `if`/`else if`/`else` chain — including the `else` block, as shown here. Once the chain ends, `x` is gone; trying to use it afterward is a compile error (`undefined: x`), exactly like any other variable that's gone out of scope. This pattern is extremely common in real Go code, especially paired with a function that returns a value and an error together (Chapter 6.1 covers exactly this pairing) — `if err := doSomething(); err != nil { ... }` is one of the single most common lines you'll see in any real Go codebase.\n\n### ⚠️ Common Mistakes\n\n- **Expecting a brace-less single-statement `if` to work**, out of habit from another language. Go requires braces unconditionally — Example 2 shows the exact syntax error this produces.\n- **Wrapping the condition in parentheses out of habit.** It's legal but never idiomatic — `gofmt` won't fix it for you, and it reads as a tell that the code wasn't written with Go's conventions in mind.\n- **Trying to use a variable declared in an `if`'s short statement outside that chain.** It's scoped strictly to the `if`/`else if`/`else` chain it was declared in — declare it before the `if` (with `var` or a separate `:=`) if it needs to survive past the chain.\n- **Testing an integer or pointer directly as if it were a boolean** (`if count { ... }`), out of habit from a language where zero/`null` is treated as falsy. Go has no such implicit conversion — this is a real compile error (`non-boolean condition in if statement`) — a condition must be a genuine `bool` expression (`count != 0`, `p != nil`) instead.\n\n### How this connects\n\nThe `if err := ...; err != nil` pattern from Example 4 reappears constantly starting with Chapter 6.1's error handling — internalizing the scoped-short-statement form here makes that idiom feel natural rather than like new syntax to learn later.\n\n### Quick recap\n\n- `if condition { }` needs no parentheses around the condition, but braces are always mandatory — even for a single statement.\n- `else if` and `else` chain additional checks and a fallback.\n- An optional short statement (`if x := f(); condition { }`) runs once before the check, with its variable scoped to the entire `if`/`else if`/`else` chain and nowhere beyond it.\n- A condition must be a genuine `bool` — Go never treats a number or pointer as implicitly truthy/falsy."}, {"id": "3.2", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 2, "slug": "for-gos-only-loop", "fullTitle": "`for`: Go's Only Loop", "title": "`for`: Go's Only Loop", "md": "### Why this matters\n\nMost languages give you `for`, `while`, and sometimes `do-while` as separate keywords. Go deliberately has exactly one loop keyword — `for` — that covers every one of those shapes through what's actually left out of the syntax, not what's added to it. Fewer keywords, same expressive power.\n\n### The core idea\n\n`for` has four forms in Go: the full C-style `for init; condition; post { }`, a condition-only form that acts exactly like `while` in other languages, a bare `for { }` with no condition at all (an intentional infinite loop, exited with `break`), and `for ... range ...` (Chapter 3.3 covers this properly). There's no separate `while` or `do-while` keyword — the condition-only form *is* Go's `while`.\n\n### Examples\n\n**1. The full, C-style form.**\n```go\nfor i := 0; i < 3; i++ {\n\tfmt.Println(\"c-style:\", i)\n}\n```\nOutput:\n```\nc-style: 0\nc-style: 1\nc-style: 2\n```\nInit, condition, post — semicolon-separated, exactly like C, Java, or JavaScript's `for`.\n\n**2. Condition-only — this *is* Go's `while`.**\n```go\ni := 0\nfor i < 3 {\n\tfmt.Println(\"while-style:\", i)\n\ti++\n}\n```\nOutput:\n```\nwhile-style: 0\nwhile-style: 1\nwhile-style: 2\n```\nDrop the init and post clauses (and their semicolons), and `for` becomes exactly what `while` is in other languages — a loop that runs as long as its condition holds. This is genuinely idiomatic Go, not a workaround; if you ever reach for \"I need a `while` loop\" in Go, this is it.\n\n**3. Bare `for` — an intentional infinite loop, controlled with `break`.**\n```go\ncount := 0\nfor {\n\tif count >= 3 {\n\t\tbreak\n\t}\n\tfmt.Println(\"infinite+break:\", count)\n\tcount++\n}\n```\nOutput:\n```\ninfinite+break: 0\ninfinite+break: 1\ninfinite+break: 2\n```\n`for` with nothing at all after it loops forever until something inside explicitly `break`s out — the idiomatic shape for \"loop until some condition met partway through the body,\" rather than checkable purely at the top.\n\n**4. `continue` — skip to the next iteration early.**\n```go\nfor j := 0; j < 5; j++ {\n\tif j%2 == 0 {\n\t\tcontinue\n\t}\n\tfmt.Println(\"odd:\", j)\n}\n```\nOutput:\n```\nodd: 1\nodd: 3\n```\n`continue` jumps straight to the next iteration's post statement (`j++` here) and condition check, skipping the rest of the current iteration's body. Chapter 3.6 covers `continue`, `break`, and labeled versions of both for nested loops properly.\n\n### ⚠️ Common Mistakes\n\n- **Looking for a `while` or `do-while` keyword.** Neither exists in Go — the condition-only `for` (Example 2) is the complete, idiomatic replacement for `while`; there's no direct built-in equivalent for `do-while` (a loop guaranteed to run its body at least once) — the usual pattern is a bare `for` with the condition check and a `break` placed at the end of the body instead of the top.\n- **Writing `for (i := 0; i < 3; i++)` with parentheses around the clauses**, out of C/Java/JavaScript habit. Go's `for` never uses parentheses, exactly like `if` (Chapter 3.1) — this is a syntax error, not just a style issue.\n- **Forgetting a bare `for {}` needs an explicit `break` (or `return`) somewhere inside it.** Without one, it genuinely loops forever — a real, easy mistake when the exit condition lives inside a nested `if` that doesn't actually cover every case.\n\n### How this connects\n\nChapter 3.3 covers `range` — the fourth `for` form, and the one you'll use constantly for iterating over slices, maps, and strings. Chapter 3.6 covers `break`/`continue` with labels, for reaching outward through nested loops.\n\n### Quick recap\n\n- Go has exactly one loop keyword, `for`, with four forms: full C-style (`init; cond; post`), condition-only (Go's `while`), bare infinite (`for {}`, exited with `break`), and `range` (next chapter).\n- No parentheses around any of `for`'s clauses — exactly like `if`.\n- There's no `while` or `do-while` keyword — the condition-only `for` replaces `while` directly; `do-while` has no dedicated form, only the bare-infinite-loop-with-a-break-at-the-end pattern.\n- `continue` skips directly to the next iteration; `break` exits the loop entirely."}, {"id": "3.3", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 3, "slug": "range-in-depth", "fullTitle": "`range` In Depth", "title": "`range` In Depth", "md": "### Why this matters\n\n`range` is the fourth `for` form, and by far the one you'll type most often — it's how Go iterates over a slice, a map, a string, and (in recent versions) even a plain integer or a custom iterator function. It also hides one genuinely easy-to-miss gotcha worth meeting deliberately, before it costs you a confusing bug.\n\n### The core idea\n\n`for i, v := range collection { }` gives you both an index (or key) and a value on each iteration. Either can be dropped: `for i := range collection` gives just the index; `for _, v := range collection` (using the blank identifier from Chapter 1.4) gives just the value. What `range` actually produces depends on what you're ranging over — a slice gives index+element, a map gives key+value, a string gives byte-index+rune (Chapter 2.2 already covered this specific case).\n\n### Examples\n\n**1. The full form, over a slice.**\n```go\nnums := []int{10, 20, 30}\nfor i, v := range nums {\n\tfmt.Println(i, v)\n}\n```\nOutput:\n```\n0 10\n1 20\n2 30\n```\n\n**2. Index only, or value only.**\n```go\nfor i := range nums {\n\tfmt.Println(\"index only:\", i)\n}\n\nfor _, v := range nums {\n\tfmt.Println(\"value only:\", v)\n}\n```\nOutput:\n```\nindex only: 0\nindex only: 1\nindex only: 2\nvalue only: 10\nvalue only: 20\nvalue only: 30\n```\n`for i := range nums` (with nothing after `i`) gives only the index — genuinely useful when you need position but not the element itself. `for _, v := range nums` discards the index explicitly with `_`, needed because Go requires every declared variable to be used (Chapter 1.1) — without the `_`, an unused index would be a compile error.\n\n**3. Ranging over a map — key and value, in the randomized order Chapter 2.7 already covered.**\n```go\nm := map[string]int{\"a\": 1, \"b\": 2}\nfor k, v := range m {\n\tfmt.Println(k, v)\n}\n```\nEach iteration gives a key and its value — but remember, the order is genuinely randomized run to run, exactly as Chapter 2.7 demonstrated directly.\n\n**4. The real gotcha: `range`'s value is a *copy*, not a reference to the original element.**\n```go\ntype Point struct{ X int }\npoints := []Point{{1}, {2}, {3}}\nfor _, p := range points {\n\tp.X = 100 // modifies the COPY, not the original\n}\nfmt.Println(points)\n```\nOutput:\n```\n[{1} {2} {3}]\n```\nNothing changed. `p` on each iteration is a genuine copy of that element — modifying `p` modifies only that temporary copy, which is discarded the moment the loop moves to the next iteration. This is exactly the same value-semantics rule structs already follow (Chapter 2.8) — `range` doesn't hand you a reference into the slice, it hands you a copy of each value. The fix, when the original genuinely needs modifying, is to index back into the slice using the index `range` also provides:\n```go\nfor i := range points {\n\tpoints[i].X = 100 // modifies the real element\n}\nfmt.Println(points)\n```\n```\n[{100} {100} {100}]\n```\n`points[i]` refers to the real element in the underlying slice — assigning through it genuinely changes the original data.\n\n**5. Ranging directly over an integer — a relatively recent, genuinely convenient addition (Go 1.22+).**\n```go\nfor i := range 3 {\n\tfmt.Println(\"range-over-int:\", i)\n}\n```\nOutput:\n```\n0\n1\n2\n```\n`range 3` produces `0, 1, 2` — exactly equivalent to `for i := 0; i < 3; i++`, just shorter for the extremely common case of \"do something N times\" where the actual index matters (or doesn't, with `for range 3 { }` alone).\n\n**6. Ranging over a function — Go's iterator pattern (Go 1.23+), a brief preview.**\n```go\nfunc Count(n int) func(func(int) bool) {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; i < n; i++ {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfor v := range Count(3) {\n\tfmt.Println(\"rangefunc:\", v)\n}\n```\nOutput:\n```\nrangefunc: 0\nrangefunc: 1\nrangefunc: 2\n```\nA function with this specific shape — taking a `yield` callback and calling it once per item, stopping early if `yield` returns `false` — can itself be the target of `range`. This is genuinely advanced territory (you're very unlikely to *write* one of these before you're comfortable with the rest of this book), but recognizing the pattern is worth having now: Go's standard library increasingly exposes iterators this way (several `slices`/`maps` package functions, Chapter 5.11, return exactly this shape).\n\n### ⚠️ Common Mistakes\n\n- **Modifying `range`'s value variable and expecting the original collection to change.** As Example 4 proved directly, it's a copy — index back into the original (`slice[i]`) to actually modify an element in place.\n- **Forgetting the blank identifier (`_`) when only one of index/value is needed.** `for i, v := range s` with `v` never used is a compile error (Chapter 1.1's unused-variable rule) — `for i := range s` or `for _, v := range s` avoids it entirely by never declaring the unused one.\n- **Assuming map range order is anything but random.** Chapter 2.7 already covered this — worth the reminder here since `range` is exactly where it comes up in practice.\n- **Not recognizing `range` over a plain integer or a function as valid Go**, and assuming a typo or version mismatch when encountering it in someone else's code — both are real, intentional, relatively recent (1.22/1.23+) language features.\n\n### How this connects\n\n`range` is how you'll interact with slices, maps, and (starting in Part VII) channels throughout the rest of this book — the copy-vs-reference distinction from Example 4 specifically reappears the moment you're modifying elements inside a loop, a genuinely common real-world need.\n\n### Quick recap\n\n- `for i, v := range collection` gives index/key and value; either can be dropped (`_` for the unwanted one).\n- What `range` produces depends on the type: slice → index+element, map → key+value (random order), string → byte-index+rune, integer (1.22+) → `0` through `n-1`.\n- `range`'s value is always a **copy** of the actual element — modify the original via its index (`slice[i] = ...`), not through the loop variable directly.\n- `range` over a function (1.23+) is Go's iterator pattern — advanced, but worth recognizing when you see it."}, {"id": "3.4", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 4, "slug": "switch-statements", "fullTitle": "`switch` Statements", "title": "`switch` Statements", "md": "### Why this matters\n\nA long `if`/`else if`/`else` chain testing the same value repeatedly gets unwieldy fast. Go's `switch` is the cleaner tool for that — and unlike C, Java, or JavaScript's `switch`, it does the sensible thing by default: each case stops on its own, with no accidental fall-through into the next one.\n\n### The core idea\n\n`switch value { case a: ...; case b: ... }` compares `value` against each case in order and runs the first match — and then **stops**, automatically, without needing an explicit `break`. A case can list multiple values separated by commas; a `switch` with no value at all (a \"tagless switch\") tests each case as its own boolean condition, functioning as a cleaner alternative to a long `if`/`else if` chain.\n\n### Examples\n\n**1. Basic `switch`, with multiple values per case.**\n```go\nday := \"Tue\"\nswitch day {\ncase \"Sat\", \"Sun\":\n\tfmt.Println(\"weekend\")\ncase \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\":\n\tfmt.Println(\"weekday\")\ndefault:\n\tfmt.Println(\"unknown\")\n}\n```\nOutput:\n```\nweekday\n```\n`case \"Mon\", \"Tue\", ...` matches if `day` equals *any* of the listed values — no separate `case` line (and no `break`) needed for each one individually, unlike C's switch.\n\n**2. A tagless `switch` — genuinely just a tidier `if`/`else if` chain.**\n```go\nscore := 75\nswitch {\ncase score >= 90:\n\tfmt.Println(\"A\")\ncase score >= 80:\n\tfmt.Println(\"B\")\ncase score >= 70:\n\tfmt.Println(\"C\")\ndefault:\n\tfmt.Println(\"F\")\n}\n```\nOutput:\n```\nC\n```\nWith no value after `switch`, each `case` is its own full boolean expression, evaluated top to bottom — functionally identical to an `if`/`else if` chain, but often read as cleaner once there are more than two or three branches.\n\n**3. No fall-through by default — genuinely different from C, and worth confirming directly.**\n\nEach matched case stops automatically the moment its own block finishes — there's no way to accidentally \"fall into\" the next case the way an unbroken C `switch` does. Getting the opposite behavior on purpose requires the explicit `fallthrough` keyword:\n```go\nswitch x := 1; x {\ncase 1:\n\tfmt.Println(\"one\")\n\tfallthrough\ncase 2:\n\tfmt.Println(\"two (via fallthrough)\")\ncase 3:\n\tfmt.Println(\"three\")\n}\n```\nOutput:\n```\none\ntwo (via fallthrough)\n```\n`x` matched case `1`, printed `\"one\"`, and then `fallthrough` explicitly forced execution into case `2`'s body too — printing `\"two (via fallthrough)\"` — before stopping (case `3` never ran, since `fallthrough` only forces the *next* case, not every subsequent one). Without that explicit `fallthrough` line, matching case `1` would print only `\"one\"` and stop there, which is exactly the safer default C-family switches don't have.\n\n**4. A `switch` can also take a short init statement, exactly like `if` (Chapter 3.1).**\n\nThe example above already used this: `switch x := 1; x { ... }` declares `x` right in the switch statement, scoped to the whole switch block — the same short-statement pattern `if` uses.\n\n**5. Multiple values in one case, on a numeric switch.**\n```go\nswitch 5 {\ncase 1, 2, 3:\n\tfmt.Println(\"small\")\ncase 4, 5, 6:\n\tfmt.Println(\"medium\")\n}\n```\nOutput:\n```\nmedium\n```\n\n### ⚠️ Common Mistakes\n\n- **Adding an explicit `break` at the end of every case**, out of habit from C or Java. It's unnecessary in Go — each case already stops on its own — and while it's not an error to include one, it's dead, non-idiomatic code that signals unfamiliarity with Go's default.\n- **Expecting fall-through to happen automatically**, and being surprised when a case that \"should\" flow into the next one doesn't. Go's default is the opposite of C's — add `fallthrough` explicitly the rare times it's genuinely needed.\n- **Forgetting `fallthrough` only forces exactly the next case**, not every remaining one. As Example 3 showed, case `3` never ran even though case `1` fell through — chaining multiple fall-throughs requires a `fallthrough` at the end of each case in the chain.\n- **Writing a tagless `switch` where a value-based one would be clearer.** If every case is comparing the exact same variable to a specific value (Example 1's shape), prefer `switch value { case a: }` over `switch { case value == a: }` — it's shorter and more directly expresses the intent.\n\n### How this connects\n\nChapter 3.5 covers **type switches** — a `switch` variant that tests a value's *type* rather than its value, essential the moment interfaces (Chapter 5.5) enter the picture.\n\n### Quick recap\n\n- `switch value { case a, b: ...; default: ... }` matches the first case whose value(s) equal `value`, then stops automatically — no `break` needed, unlike C.\n- A tagless `switch { case cond1: ...; case cond2: ... }` (no value after `switch`) is a cleaner alternative to a long `if`/`else if` chain.\n- `fallthrough` explicitly forces execution into the *next* case's body — the only way to get C-style fall-through behavior, and it applies to exactly one case, not a chain, unless repeated.\n- `switch` supports the same short init-statement form as `if` (`switch x := f(); x { }`)."}, {"id": "3.5", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 5, "slug": "type-switches", "fullTitle": "Type Switches", "title": "Type Switches", "md": "### Why this matters\n\nSometimes a value's actual, concrete type isn't known until runtime — most commonly when it arrives as `any` (Go's name for \"could genuinely be anything,\" covered properly in Chapter 5.6). A type switch is how you ask \"okay, but what *is* this, really?\" and branch accordingly, in a form that reads exactly like the ordinary `switch` from the last chapter.\n\n### The core idea\n\n`switch v := x.(type) { case int: ...; case string: ... }` checks `x`'s actual concrete type against each case, and — genuinely useful — `v` inside each branch is automatically treated as that specific type, not as `any` anymore. This is Go's syntax specifically for \"branch based on type\" rather than \"branch based on value,\" and the `.(type)` syntax only appears in exactly this construct.\n\n### Examples\n\n**1. A function accepting anything, branching on what it actually received.**\n```go\nfunc describe(x any) {\n\tswitch v := x.(type) {\n\tcase int:\n\t\tfmt.Printf(\"int: %d (doubled: %d)\\n\", v, v*2)\n\tcase string:\n\t\tfmt.Printf(\"string: %q (length: %d)\\n\", v, len(v))\n\tcase bool:\n\t\tfmt.Printf(\"bool: %v\\n\", v)\n\tcase nil:\n\t\tfmt.Println(\"nil value\")\n\tdefault:\n\t\tfmt.Printf(\"unknown type: %T\\n\", v)\n\t}\n}\n\ndescribe(42)\ndescribe(\"hello\")\ndescribe(true)\ndescribe(nil)\ndescribe(3.14)\n```\nOutput:\n```\nint: 42 (doubled: 84)\nstring: \"hello\" (length: 5)\nbool: true\nnil value\nunknown type: float64\n```\nInside `case int:`, `v` genuinely behaves as an `int` — `v * 2` works directly, with no manual conversion needed. The same goes for every other case: `v` is automatically the specific type that case names. `case nil:` catches an `any` holding no value at all. `default` catches everything not explicitly listed — here, `float64`, which is exactly why `%T` (Chapter 1.3) is useful inside `default` to see what actually showed up.\n\n**2. Multiple types in one case — `v` stays `any` in that specific branch.**\n```go\nswitch x.(type) {\ncase int, int64:\n\tfmt.Println(\"some kind of integer\")\ndefault:\n\tfmt.Println(\"something else\")\n}\n```\nOutput:\n```\nsome kind of integer\nsomething else\n```\nWhen a case lists more than one type, Go can't know which specific one actually matched inside that branch, so a captured variable there (if you'd written `v := x.(type)`) would stay `any` rather than narrowing to a specific type — which is exactly why this example skips capturing a variable at all, using `switch x.(type)` alone, since nothing inside either branch needs `x`'s value, only which category it falls into.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `.(type)` only works inside a type-switch statement itself.** Writing `x.(type)` anywhere else (an ordinary assignment, a function argument) is a compile error — Chapter 5.6 covers the related but different single-type assertion syntax (`x.(int)`) for checking one specific type outside a switch.\n- **Expecting the captured variable to have a specific type in a multi-type case.** As Example 2 showed, `v` stays `any` whenever a case lists more than one type, since which one actually matched isn't determined within that shared branch.\n- **Omitting a `default` case and assuming every possible type is already covered.** `any` can hold literally anything — a `default` case (even just to log or handle the unexpected) is usually worth including for genuinely open-ended input.\n- **Confusing a type switch with an ordinary `switch` on a type's name as a string.** They look similar in shape, but a type switch's cases are real type names (`int`, `string`, a struct type), checked against the value's actual concrete type — not string comparison.\n\n### How this connects\n\nType switches become essential the moment you're working with `any` (Chapter 5.6) or a narrower interface with multiple possible concrete implementations (Chapter 5.5) — this is the standard, idiomatic way to recover a specific type's behavior from a more general one.\n\n### Quick recap\n\n- `switch v := x.(type) { case T1: ...; case T2: ... }` branches on `x`'s actual concrete type; `v` is automatically treated as that specific type inside each single-type case.\n- A case listing multiple types leaves the captured variable as `any` within that branch, since no single type is determined.\n- `case nil:` catches an interface value holding nothing at all.\n- `.(type)` is valid only inside a type-switch statement — a different, single-type assertion syntax (`x.(int)`) exists for checking one type outside a switch (Chapter 5.6)."}, {"id": "3.6", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 6, "slug": "break-continue-labels", "fullTitle": "`break`, `continue` & Labels", "title": "`break`, `continue` & Labels", "md": "### Why this matters\n\n`break` and `continue` are simple enough on their own — Chapter 3.2 already used both. The genuinely important nuance is what happens once loops nest, or a `switch` sits inside a loop: by default, both keywords act on only the *innermost* enclosing construct, which isn't always what you actually want. Labels are Go's precise tool for reaching further out, deliberately.\n\n### The core idea\n\nPlain `break` exits the innermost `for`, `switch`, or `select` (Chapter 7.10) it's inside; plain `continue` skips to the next iteration of the innermost `for`. A **label** — a name followed by a colon, placed directly before a `for` statement — lets `break label` or `continue label` target that specific outer loop instead of just the nearest one.\n\n### Examples\n\n**1. Labeled `continue` and `break`, reaching through a nested loop.**\n```go\nouter:\n\tfor i := 0; i < 3; i++ {\n\t\tfor j := 0; j < 3; j++ {\n\t\t\tif j == 1 {\n\t\t\t\tcontinue outer\n\t\t\t}\n\t\t\tif i == 2 {\n\t\t\t\tbreak outer\n\t\t\t}\n\t\t\tfmt.Println(i, j)\n\t\t}\n\t}\n```\nOutput:\n```\n0 0\n1 0\n```\n`continue outer` skips straight to the next iteration of the *outer* loop (incrementing `i`), not just the inner one — which is why you never see `j` reach `2` for any `i`. `break outer` (triggered once `i` reaches `2`) exits the outer loop entirely, ending everything. Without the label, a plain `continue`/`break` here would only affect the inner `j` loop, producing a completely different (and, for many real nested-loop needs, wrong) result.\n\n**2. `break` inside a `switch` that's inside a loop — a genuine, easy-to-miss trap.**\n```go\nfor i := 0; i < 3; i++ {\n\tswitch i {\n\tcase 1:\n\t\tbreak // only breaks the switch\n\t}\n\tfmt.Println(\"after switch:\", i)\n}\n```\nOutput:\n```\nafter switch: 0\nafter switch: 1\nafter switch: 2\n```\nThe bare `break` inside `case 1:` only exits the `switch` — the `for` loop keeps running all three iterations regardless, and `\"after switch: 1\"` still prints right after it. This surprises people expecting `break` to reach the loop, since in some other languages a `switch` inside a loop behaves differently. In Go, `break`'s default target is always the *nearest* enclosing `for`, `switch`, or `select` — here, that's the `switch`, not the `for`.\n\n**3. The fix: a label targets the loop specifically, even through the switch.**\n```go\nloop:\n\tfor i := 0; i < 3; i++ {\n\t\tswitch i {\n\t\tcase 1:\n\t\t\tbreak loop // breaks the labeled outer loop\n\t\t}\n\t\tfmt.Println(\"labeled after switch:\", i)\n\t}\n```\nOutput:\n```\nlabeled after switch: 0\n```\n`break loop` explicitly names the `for` loop labeled `loop:`, reaching straight past the `switch` and exiting the loop entirely the moment `i` hits `1` — exactly the behavior Example 2's bare `break` couldn't provide.\n\n**4. A brief, honest mention: `goto` exists too.**\n```go\ni := 0\nloop:\nif i < 3 {\n\tfmt.Println(i)\n\ti++\n\tgoto loop\n}\n```\nOutput:\n```\n0\n1\n2\n```\nGo does have a real `goto` keyword, jumping directly to a labeled statement (note: this is the *same* label syntax used above, but `goto` targets any labeled statement, not specifically a loop). In practice, idiomatic Go code almost never uses it — every one of the structured alternatives this book covers (labeled `break`/`continue`, functions with early `return`, Chapter 6.3's `panic`/`recover`) handles the situations `goto` would otherwise be reached for, more clearly. It's mentioned here mainly so encountering it in someone else's code doesn't look like a mistake.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `break` inside a `switch` reaches an enclosing loop.** As Example 2 proved directly, it doesn't — it exits only the switch. Use a label (Example 3) whenever the loop itself genuinely needs to stop from inside a nested switch.\n- **Forgetting a label applies to the statement immediately following it**, and must be a `for` loop for `break`/`continue` to target it meaningfully (labeling anything else works for `goto`, but not for labeled `break`/`continue`).\n- **Reaching for `goto` out of habit from another language.** It exists in Go but is genuinely rare in idiomatic code — a labeled `break`/`continue`, or restructuring into a separate function with an early `return`, almost always reads more clearly.\n- **Over-nesting loops instead of extracting inner logic into its own function.** Deep nesting requiring several labels is often a sign the inner loop's body would read more clearly (and be independently testable, Chapter 8.1) as its own named function with a plain `return` instead.\n\n### How this connects\n\nThis chapter completes Go's control-flow toolkit for loops and switches — from here, Part IV moves on to functions, where a plain `return` (rather than a label) becomes the usual way to exit early from more complex logic.\n\n### Quick recap\n\n- Plain `break`/`continue` act on the *innermost* enclosing `for`/`switch`/`select` only — a `switch` inside a loop absorbs a bare `break` before it ever reaches the loop.\n- A label (`name:` directly before a `for`) lets `break label`/`continue label` target that specific outer loop, reaching past any nested switch or inner loop in between.\n- `goto` exists in Go but is genuinely rare in idiomatic code — labeled `break`/`continue` or an early `return` almost always reads more clearly."}, {"id": "3.7", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 7, "slug": "defer", "fullTitle": "`defer`", "title": "`defer`", "md": "### Why this matters\n\nCleanup code — closing a file, unlocking a mutex, logging that a function finished — is easy to forget, and easy to accidentally skip on an early `return` or a `panic` (Chapter 6.3). `defer` is Go's answer: schedule something to run when the surrounding function actually finishes, written right next to the code that made cleanup necessary in the first place, guaranteed to run no matter how the function exits.\n\n### The core idea\n\n`defer statement` schedules `statement` to run right before the enclosing function returns — not immediately, and not in the order you might expect if there's more than one. Multiple deferred calls run in **LIFO** order (last deferred, first executed), and a deferred call's *arguments* are evaluated immediately, at the moment `defer` runs — only the actual call is postponed.\n\n### Examples\n\n**1. `defer` runs after everything else in the function, at the very end.**\n```go\nfmt.Println(\"start\")\ndefer fmt.Println(\"deferred 1\")\ndefer fmt.Println(\"deferred 2\")\ndefer fmt.Println(\"deferred 3\")\nfmt.Println(\"end\")\n```\nOutput:\n```\nstart\nend\ndeferred 3\ndeferred 2\ndeferred 1\n```\n`\"end\"` printed before any deferred call ran — every `defer` waits until the function is about to return. And notice the order: `3, 2, 1`, not `1, 2, 3` — deferred calls stack up and unwind in reverse, exactly like a stack.\n\n**2. A deferred call's arguments are evaluated *immediately*, not when it finally runs.**\n```go\nx := 1\ndefer fmt.Println(\"deferred x was:\", x)\nx = 2\nfmt.Println(\"x is now:\", x)\n```\nOutput:\n```\nx is now: 2\ndeferred x was: 1\n```\nEven though `x` becomes `2` before the function ends, the deferred `Println` still prints `1` — because `x`'s value was captured as an argument the moment `defer` ran, not when the call actually executes later.\n\n**3. A deferred closure, on the other hand, sees the variable's *final* value — because it captures the variable itself, not a snapshot of it.**\n```go\ny := 1\ndefer func() {\n\tfmt.Println(\"closure sees final y:\", y)\n}()\ny = 2\nfmt.Println(\"y is now:\", y)\n```\nOutput:\n```\ny is now: 2\nclosure sees final y: 2\n```\nThis is a real, meaningful contrast with Example 2: wrapping the deferred code in an anonymous function (`func() { ... }()`) makes it a closure over `y`, not a call with `y` passed as an already-evaluated argument — so it sees whatever `y` is by the time the closure actually runs, which is `2`. Whether you want \"the value at defer time\" or \"the value at return time\" determines which of these two shapes to reach for.\n\n**4. A deferred closure can even modify a *named* return value — a genuinely powerful, if subtle, capability.**\n```go\nfunc increment() (result int) {\n\tdefer func() {\n\t\tresult++\n\t}()\n\treturn 5\n}\nfmt.Println(increment())\n```\nOutput:\n```\n6\n```\n`result` is a named return value (Chapter 4.3 covers these properly). `return 5` sets `result` to `5` — but the deferred closure then runs *after* that assignment and *before* the function actually hands control back to its caller, incrementing `result` to `6`. This is exactly the mechanism behind a common, genuinely idiomatic pattern: a deferred function that inspects and potentially modifies an error before the function truly returns (Chapter 6.3 revisits this directly for wrapping errors from a `panic`/`recover`).\n\n**5. The real, everyday use: guaranteed cleanup, regardless of how the function exits.**\n```go\nfunc process(fail bool) {\n\tfmt.Println(\"opening resource\")\n\tdefer fmt.Println(\"closing resource\")\n\tif fail {\n\t\tfmt.Println(\"early return due to failure\")\n\t\treturn\n\t}\n\tfmt.Println(\"processing normally\")\n}\nprocess(true)\nprocess(false)\n```\nOutput:\n```\nopening resource\nearly return due to failure\nclosing resource\n---\nopening resource\nprocessing normally\nclosing resource\n```\n`\"closing resource\"` prints every single time, regardless of which path the function took to get there — the early-return branch and the normal-completion branch both trigger it identically. This is precisely why `defer` sits directly next to the code that acquires a resource (opening a file, locking a mutex) in idiomatic Go: `f, err := os.Open(...)` immediately followed by `defer f.Close()` is one of the single most common two-line patterns you'll see in real Go code (Chapter 7.4 puts this to real use).\n\n### ⚠️ Common Mistakes\n\n- **Assuming deferred calls run in the order they were written.** They run in reverse (LIFO) order — the *last* `defer` statement executed runs *first*.\n- **Expecting a deferred function call's arguments to reflect the variable's value at the time the call finally runs.** They're evaluated immediately, at `defer` time (Example 2) — wrap the deferred code in a closure (Example 3) if you specifically need the value as of when the function actually returns.\n- **Deferring inside a loop that runs many times**, expecting each deferred call to run promptly. Every deferred call in a function waits until *that function* returns — deferring inside a loop that iterates thousands of times accumulates thousands of pending calls, all firing only once the whole function finally ends, which can be a real resource-exhaustion problem (e.g., deferring a file close inside a loop that opens many files). Extracting the loop body into its own small function, so each iteration's `defer` actually resolves promptly, is the usual fix.\n- **Not realizing a deferred closure can read and modify a named return value.** This is genuinely useful (Example 4, and Chapter 6.3's error-wrapping pattern) but easy to be surprised by the first time you see it in someone else's code.\n\n### How this connects\n\n`defer` paired with a named return value (Example 4) is exactly the mechanism Chapter 6.3 uses to let `recover()` cleanly convert a `panic` into a returned `error` — and the acquire-then-immediately-defer-cleanup pattern from Example 5 reappears constantly starting with Chapter 7.4's file I/O.\n\n### Quick recap\n\n- `defer statement` schedules `statement` to run right before the enclosing function returns.\n- Multiple deferred calls run in **LIFO** order — last deferred, first executed.\n- A deferred call's arguments are evaluated immediately, at `defer` time; wrap in a closure (`defer func() { ... }()`) to instead see a variable's value as of when the function actually returns.\n- A deferred closure can read and modify a named return value, after `return` has already set it but before the function truly hands control back — the basis of Chapter 6.3's `recover`-based error-wrapping pattern.\n- The idiomatic use is guaranteed cleanup: `defer` runs regardless of which path (early return, normal completion, or a `panic`) the function took to get there."}, {"id": "4.1", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 1, "slug": "defining-functions", "fullTitle": "Defining Functions", "title": "Defining Functions", "md": "### Why this matters\n\nYou've already written and called several functions in earlier chapters without a formal introduction — `main` itself is one. This chapter makes the syntax explicit, including one genuinely convenient Go-specific shorthand for parameters that share a type.\n\n### The core idea\n\n`func name(params) returnType { body }` declares a function. Parameters are listed as `name type` pairs; when consecutive parameters share the same type, Go lets you skip repeating the type name until the last one in that group. A function declaring a return type **must** return a value of that type on every possible path through it — the compiler checks this, not just at the type level but at the control-flow level too.\n\n### Examples\n\n**1. The full form, and Go's shared-type shorthand.**\n```go\nfunc add(a int, b int) int {\n\treturn a + b\n}\n\nfunc addShort(a, b int) int {\n\treturn a + b\n}\n\nfmt.Println(add(2, 3))\nfmt.Println(addShort(4, 5))\n```\nOutput:\n```\n5\n9\n```\n`add` and `addShort` are functionally identical — `a, b int` is shorthand for `a int, b int`, valid whenever consecutive parameters share a type. This shorthand is genuinely idiomatic and used constantly in real Go code.\n\n**2. No return value at all — a function that just does something.**\n```go\nfunc greet(name string) {\n\tfmt.Println(\"Hello,\", name)\n}\ngreet(\"Gopher\")\n```\nOutput:\n```\nHello, Gopher\n```\nOmitting a return type entirely is completely normal for a function whose entire job is a side effect (printing, writing to a file, mutating something) rather than producing a value.\n\n**3. Mixed parameter types — the shorthand only applies to *consecutive* same-typed parameters.**\n```go\nfunc mixedTypes(a int, b string, c bool) {\n\tfmt.Println(a, b, c)\n}\nmixedTypes(1, \"two\", true)\n```\nOutput:\n```\n1 two true\n```\nEvery parameter here has a different type from its neighbor, so each needs its own type written out in full — the shorthand from Example 1 only collapses a *run* of parameters sharing the same type.\n\n**4. Every code path must return a value, when a return type is declared — checked by the compiler, not just at runtime.**\n```go\nfunc f() int {\n\tx := 5\n\t_ = x\n}\n```\nOutput:\n```\n# command-line-arguments\n./noret.go:5:1: missing return\n```\n`f` declares `int` as its return type but has no `return` statement reachable at all — the compiler catches this before the program ever runs, exactly like the type-mismatch and unused-variable checks from earlier chapters. This check is genuinely about *every reachable path*: an `if`/`else` where only one branch returns, with no fallback afterward, produces the same error.\n\n**5. Calling a function with the wrong number of arguments is a compile error, not a runtime surprise.**\n```go\nfunc add(a, b int) int { return a + b }\nadd(1, 2, 3)\n```\nOutput:\n```\n# command-line-arguments\n./wrongargs.go:4:12: too many arguments in call to add\n\thave (number, number, number)\n\twant (int, int)\n```\nGo has no notion of optional parameters or default argument values (a real, deliberate absence — Chapter 4.4's variadic parameters, and functional-options constructors built on Chapter 4.5's closures, are the idiomatic ways real Go code handles \"sometimes I don't need all these values\"). Every call must supply exactly the declared parameters, checked at compile time.\n\n### ⚠️ Common Mistakes\n\n- **Repeating a shared type unnecessarily** (`func f(a int, b int) int` instead of `func f(a, b int) int`) when the shorthand applies. Not wrong, just non-idiomatic — real Go code uses the shorthand whenever it fits.\n- **Leaving a code path without a `return` in a function that declares a return type.** As Example 4 showed, this is a compile-time check across every possible path, not just a suggestion — an `if`/`else if` with no final `else`, when a value must always come back, is a common way to trigger it.\n- **Looking for optional parameters or default argument values.** Go has neither — every call must supply every declared parameter exactly. Chapter 4.4's variadic functions, and functional-options constructors built on Chapter 4.5's closures, are the real idiomatic answers to \"sometimes I want fewer arguments.\"\n- **Assuming a function without a return type can still be used as a value in an expression.** It can be called (Example 2), but calling it isn't itself an expression producing anything usable — attempting `x := greet(\"Gopher\")` when `greet` returns nothing is a compile error.\n\n### How this connects\n\nChapter 4.2 covers what happens when a function needs to hand back more than one value — a genuinely distinctive Go feature you'll use constantly starting with the very next chapter's error-handling patterns.\n\n### Quick recap\n\n- `func name(params) returnType { }` — parameters sharing a type can skip repeating it until the last one in that run (`a, b int`).\n- A function with no return type is fine for pure side effects; one that declares a return type must return on every reachable code path, checked at compile time.\n- Every call must supply exactly the declared number and types of arguments — no optional parameters or default values exist in Go."}, {"id": "4.2", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 2, "slug": "multiple-return-values", "fullTitle": "Multiple Return Values", "title": "Multiple Return Values", "md": "### Why this matters\n\nA huge number of operations naturally produce two things at once: a result and whether it actually succeeded. Rather than bolting this on with exceptions (which Go deliberately doesn't have — Chapter 6.1 explains why) or an awkward wrapper type, Go lets a function return multiple values directly, as a first-class part of the language. This is the single most distinctive shape of idiomatic Go code, and you'll see it in nearly every function signature from here on.\n\n### The core idea\n\nA function declares multiple return types in parentheses — `func f() (int, error)` — and returns them together with one `return` statement, comma-separated. The caller receives them the same way: `a, b := f()`. Every returned value must be handled somehow (assigned to a real variable, or explicitly discarded with `_`) — Go won't let you silently drop one.\n\n### Examples\n\n**1. The idiomatic shape: a result, and an `error` alongside it.**\n```go\nfunc divide(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"division by zero\")\n\t}\n\treturn a / b, nil\n}\n\nresult, err := divide(10, 2)\nfmt.Println(result, err)\n\nresult2, err2 := divide(10, 0)\nfmt.Println(result2, err2)\n```\nOutput:\n```\n5 <nil>\n0 division by zero\n```\nWhen there's no error, `err` is `nil` (prints as `<nil>`) and `result` holds the real answer. When something goes wrong, `divide` returns a zero-value placeholder (`0`) alongside a real, descriptive error — the caller is expected to check `err` before trusting `result` at all:\n```go\nif err2 != nil {\n\tfmt.Println(\"error occurred:\", err2)\n}\n```\n```\nerror occurred: division by zero\n```\nChapter 6.1 covers `error` and this exact pattern properly — this chapter is purely about the mechanics of returning (and receiving) more than one value.\n\n**2. Multiple return values with no error involved at all.**\n```go\nfunc minMax(nums []int) (int, int) {\n\tmin, max := nums[0], nums[0]\n\tfor _, n := range nums {\n\t\tif n < min {\n\t\t\tmin = n\n\t\t}\n\t\tif n > max {\n\t\t\tmax = n\n\t\t}\n\t}\n\treturn min, max\n}\n\nmin, max := minMax([]int{5, 2, 8, 1, 9})\nfmt.Println(min, max)\n```\nOutput:\n```\n1 9\n```\nMultiple return values aren't specifically about errors — any function that naturally produces more than one related piece of information can return them together this way, rather than bundling them into a throwaway struct just to return one value.\n\n**3. Discarding a value you don't need, with `_`.**\n```go\n_, err3 := divide(20, 5)\nfmt.Println(err3)\n\nquotient, _ := divide(20, 4)\nfmt.Println(quotient)\n```\nOutput:\n```\n<nil>\n5\n```\n`_` (the blank identifier, Chapter 1.4) explicitly discards whichever return value isn't needed — genuinely common when only the error matters (the first line) or only the result matters and the error's already been checked or is known impossible (the second line, though discarding an error without checking it is usually worth a second thought, covered in Chapter 6.1's common mistakes).\n\n**4. A multi-value function call can be passed directly as another call's entire argument list.**\n```go\nfmt.Println(divide(10, 2))\n```\nOutput:\n```\n5 <nil>\n```\nThis works specifically because `divide(10, 2)`'s two return values line up exactly with what `fmt.Println` accepts (variadic `any` arguments, Chapter 4.4) — a genuinely convenient shorthand, but it only applies when a multi-value call is the *sole, complete* argument list of the outer call; it can't be mixed with other arguments alongside it.\n\n**5. You must handle every return value — Go won't let you quietly drop one.**\n```go\nresult := divide(10, 2)\n```\nOutput:\n```\n# command-line-arguments\n./partial.go:12:12: assignment mismatch: 1 variable but divide returns 2 values\n```\nTrying to capture only one of two return values (without explicitly discarding the other with `_`) is a compile error, not a silent truncation — Go forces you to be deliberate about every value a function hands back.\n\n### ⚠️ Common Mistakes\n\n- **Assigning a multi-value call's result to fewer variables than it returns**, forgetting the blank identifier is required for anything genuinely unwanted. As Example 5 showed, this doesn't quietly drop the extra value — it's a compile error.\n- **Discarding an error with `_` out of impatience**, rather than actually checking it. This compiles fine but throws away exactly the information a caller needs to know something went wrong — Chapter 6.1 covers why this is one of the most common real Go anti-patterns.\n- **Trying to mix a multi-value call with other arguments in the same call** (e.g., `fmt.Println(\"result:\", divide(10, 2))`). Example 4's \"spread\" behavior only works when the multi-value call is the *entire* argument list on its own.\n- **Bundling unrelated values into multiple return values just because two things happen to be computed together.** If the values are genuinely a cohesive unit that will be passed around together elsewhere too, a struct (Chapter 2.8) is usually the better fit than multiple return values, which shine specifically for \"a result plus its own status\" or truly independent pieces of information.\n\n### How this connects\n\nThis is the mechanical foundation for the `(value, error)` pattern that defines Chapter 6.1's entire approach to error handling, and for the comma-ok idiom you've already seen with maps (Chapter 2.7) and type assertions (Chapter 5.6) — all three are, underneath, just ordinary multi-value returns.\n\n### Quick recap\n\n- A function can return multiple values: `func f() (T1, T2) { return v1, v2 }`, received as `a, b := f()`.\n- Every returned value must be captured or explicitly discarded with `_` — no silent dropping.\n- A multi-value call can be passed as another call's entire, sole argument list, but never mixed with other arguments alongside it.\n- The `(result, error)` shape (next fully covered in Chapter 6.1) is Go's idiomatic replacement for exceptions — a function that can fail says so directly in its return type."}, {"id": "4.3", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 3, "slug": "named-return-values-naked-returns", "fullTitle": "Named Return Values & Naked Returns", "title": "Named Return Values & Naked Returns", "md": "### Why this matters\n\nChapter 4.2 returned values by naming them explicitly in the `return` statement itself. Go offers a second style: naming the return values right in the function signature, which pre-declares them as real variables and unlocks a shorthand `return` with nothing after it — a \"naked return.\" Genuinely useful in the right place, genuinely easy to overuse into unreadable code in the wrong one.\n\n### The core idea\n\n`func f() (result int, err error)` names its return values in the signature itself — `result` and `err` become real local variables, automatically initialized to their types' zero values, usable and assignable anywhere in the function body. A bare `return` (no values listed) then returns whatever those named variables currently hold.\n\n### Examples\n\n**1. Named returns with a naked `return`.**\n```go\nfunc divide(a, b int) (result int, err error) {\n\tif b == 0 {\n\t\terr = fmt.Errorf(\"division by zero\")\n\t\treturn\n\t}\n\tresult = a / b\n\treturn\n}\n\nr, err := divide(10, 2)\nfmt.Println(r, err)\n\nr2, err2 := divide(10, 0)\nfmt.Println(r2, err2)\n```\nOutput:\n```\n5 <nil>\n0 division by zero\n```\n`result` and `err` start at their zero values (`0` and `nil`) the moment the function begins, exactly like any other variable declaration. Each branch assigns whichever ones it needs, and a bare `return` sends back whatever they currently hold — `result` stayed `0` in the error branch, since it was never assigned.\n\n**2. Named returns document intent directly in the signature — genuinely useful for readability.**\n```go\nfunc split(sum int) (x, y int) {\n\tx = sum * 4 / 9\n\ty = sum - x\n\treturn\n}\n\nx, y := split(17)\nfmt.Println(x, y)\n```\nOutput:\n```\n7 10\n```\nEven without reading the function body, `func split(sum int) (x, y int)` tells you exactly what the two returned numbers *mean* — genuinely more informative than `func split(sum int) (int, int)`, which tells you their types but nothing about what each one represents.\n\n**3. A named return doesn't force a naked `return` — you can still return explicit values, which override whatever the named variable currently holds.**\n```go\nfunc explicitOverridesNamed(a int) (result int) {\n\tresult = 100\n\treturn a * 2\n}\nfmt.Println(explicitOverridesNamed(5))\n```\nOutput:\n```\n10\n```\n`result` was set to `100`, but `return a * 2` explicitly returns `10` instead — an explicit `return value` always wins over whatever the named variable held, exactly like an ordinary, unnamed return would.\n\n### ⚠️ Common Mistakes\n\n- **Using naked returns in a long function.** The moment a function is more than a handful of lines, a naked `return` forces the reader to scroll back up to the signature to remember what's actually being returned — genuinely worse for readability than an explicit `return result, err`, which is self-contained. Idiomatic Go tends to reserve naked returns for short functions (Example 1's `divide` is close to the reasonable limit) and use named returns mainly for their *documentation* value (Example 2) even when the actual `return` statements stay explicit.\n- **Forgetting named return variables start at their zero value**, and assuming a function that returns early without explicitly setting one is a bug rather than the exact zero-value behavior every other variable in Go already has.\n- **Relying on named returns purely to avoid declaring a local variable**, without the added clarity actually paying for itself. If the names don't meaningfully document what's being returned, plain unnamed return types are often the more honest, direct choice.\n- **Forgetting a deferred closure can read and modify a named return value** (Chapter 3.7's Example 4 already demonstrated this directly) — this interaction is exactly why named returns matter for Chapter 6.3's `recover`-based error handling, even in functions that otherwise wouldn't bother naming their returns.\n\n### How this connects\n\nThe defer-modifies-named-return interaction from Chapter 3.7 is the main place named returns become genuinely load-bearing rather than a style choice — Chapter 6.3 puts this to real use, converting a recovered `panic` into a properly returned `error`.\n\n### Quick recap\n\n- `func f() (name type, ...)` pre-declares return values as real, zero-value-initialized local variables, usable anywhere in the function body.\n- A naked `return` (no values listed) returns whatever those named variables currently hold.\n- An explicit `return value` still works with named returns and overrides whatever the named variable held.\n- Best used for short functions, or specifically for the signature's own documentation value — long functions are usually clearer with explicit `return`s even when the values happen to be named."}, {"id": "4.4", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 4, "slug": "variadic-functions", "fullTitle": "Variadic Functions", "title": "Variadic Functions", "md": "### Why this matters\n\nChapter 4.1 established that Go has no optional parameters or default values. Variadic parameters are Go's real answer to \"a function that accepts any number of arguments\" — you've already used one constantly without necessarily noticing: `fmt.Println(a, b, c)` accepts as many arguments as you hand it because `Println` itself is variadic.\n\n### The core idea\n\nA parameter written `name ...T` accepts zero or more arguments of type `T`, collected inside the function as an ordinary `[]T` slice. A variadic parameter must be the **last** one in a function's parameter list — there can be at most one, and nothing can follow it.\n\n### Examples\n\n**1. A variadic function, called with different numbers of arguments.**\n```go\nfunc sum(nums ...int) int {\n\ttotal := 0\n\tfor _, n := range nums {\n\t\ttotal += n\n\t}\n\treturn total\n}\n\nfmt.Println(sum(1, 2, 3))\nfmt.Println(sum(1, 2, 3, 4, 5))\nfmt.Println(sum())\n```\nOutput:\n```\n6\n15\n0\n```\nInside `sum`, `nums` is just an ordinary `[]int` — `range` over it exactly like any other slice. Calling with zero arguments works fine too, giving an empty (but non-nil — Chapter 2.6's distinction) slice.\n\n**2. Spreading an existing slice into a variadic call with `...`.**\n```go\nnums := []int{10, 20, 30}\nfmt.Println(sum(nums...))\n```\nOutput:\n```\n60\n```\n`nums...` unpacks an existing slice directly into the variadic parameter, rather than requiring each element to be listed individually. This is the same `...` syntax used to *declare* a variadic parameter, now used at the *call site* to mean \"spread this slice's elements as the individual arguments.\"\n\n**3. Fixed parameters and one trailing variadic parameter, together.**\n```go\nfunc joinWithPrefix(prefix string, items ...string) string {\n\tresult := prefix\n\tfor _, i := range items {\n\t\tresult += \" \" + i\n\t}\n\treturn result\n}\nfmt.Println(joinWithPrefix(\"Items:\", \"apple\", \"banana\"))\n```\nOutput:\n```\nItems: apple banana\n```\nOrdinary parameters come first, exactly as usual; the variadic parameter — always last — soaks up everything beyond them.\n\n**4. A variadic parameter must genuinely be the last one — a real compile error otherwise.**\n```go\nfunc f(nums ...int, s string) {}\n```\nOutput:\n```\n# command-line-arguments\n./notlast.go:2:13: can only use ... with final parameter\n```\nGo allows exactly one variadic parameter per function, and it must be the final one in the list — there's no ambiguity about where the variadic arguments end and a following fixed parameter begins, because the language simply doesn't allow that shape at all.\n\n**5. Passing a slice without `...` is a type error, not automatic spreading.**\n```go\nnums := []int{1, 2, 3}\nsum(nums)\n```\nOutput:\n```\n# command-line-arguments\n./forgetspread.go:11:6: cannot use nums (variable of type []int) as int value in argument to sum\n```\n`sum` expects individual `int` arguments (which it then collects into `[]int` internally); handing it a `[]int` directly, without the spreading `...`, is a straightforward type mismatch — `[]int` isn't an `int`. The `...` at the call site (Example 2) is what actually triggers the spread; without it, Go makes no attempt to guess your intent.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `...` when passing an existing slice to a variadic parameter.** As Example 5 showed, this is a plain type mismatch, not automatic unpacking — `sum(nums...)`, not `sum(nums)`.\n- **Trying to place a variadic parameter anywhere but last**, or trying to declare more than one. Neither is allowed — a compile error catches both immediately.\n- **Assuming a variadic parameter is somehow different from a slice inside the function body.** It's an ordinary `[]T` the moment you're inside the function — every slice operation from Chapters 2.5–2.6 (indexing, further slicing, even `append`ing to it) applies normally.\n- **Reaching for a variadic parameter when a single, explicit `[]T` parameter would actually be clearer.** Variadic parameters shine for \"a natural, often-small, comma-separated list of things\" (like `fmt.Println`'s arguments) — a function that's always going to receive an existing slice from elsewhere in the program often reads more honestly with a plain `nums []int` parameter instead.\n\n### How this connects\n\n`fmt.Println`, `fmt.Printf`, and nearly every formatting function in Chapter 7.1 rely on exactly this mechanism (`...any`, Chapter 5.6) to accept an arbitrary number of values to print — recognizing that pattern here means Chapter 7.1's signatures won't look mysterious.\n\n### Quick recap\n\n- `func f(name ...T)` accepts zero or more `T` arguments, collected as an ordinary `[]T` inside the function.\n- A variadic parameter must be the last one, and a function can have at most one.\n- `slice...` at a call site spreads an existing slice's elements into a variadic parameter — required explicitly; a bare slice passed without it is a type mismatch, not automatic unpacking.\n- Fixed parameters can precede a trailing variadic one in the same function."}, {"id": "4.5", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 5, "slug": "functions-as-values-closures", "fullTitle": "Functions as Values & Closures", "title": "Functions as Values & Closures", "md": "### Why this matters\n\nIn Go, a function is a genuine first-class value: it can be stored in a variable, passed as an argument, returned from another function, and it has its own real type. Closures — functions that capture variables from the scope they were created in — are what make this genuinely powerful rather than just a syntax curiosity, and they're the direct foundation for one of Go's most famous historical bugs, fixed for good reason worth understanding.\n\n### The core idea\n\nA function's type is described by its parameters and return values — `func(int, int) int` is the type of any function taking two `int`s and returning one. A function literal (`func(a, b int) int { return a + b }`) can be assigned to a variable of that type, passed anywhere a value is expected, or returned from another function. When a function literal references a variable from its enclosing scope, it becomes a **closure** — and it captures that variable itself, not a frozen snapshot of its value at the moment the closure was created.\n\n### Examples\n\n**1. A function value, assigned to a variable and called.**\n```go\nvar op func(int, int) int\nop = func(a, b int) int { return a + b }\nfmt.Println(op(3, 4))\n```\nOutput:\n```\n7\n```\n`op`'s type, `func(int, int) int`, is exactly as real a type as `int` or `string` — it can be declared with `var`, assigned, and called through the variable, exactly as shown.\n\n**2. A closure that captures and maintains its own private state.**\n```go\nfunc makeCounter() func() int {\n\tcount := 0\n\treturn func() int {\n\t\tcount++\n\t\treturn count\n\t}\n}\n\ncounter := makeCounter()\nfmt.Println(counter())\nfmt.Println(counter())\nfmt.Println(counter())\n```\nOutput:\n```\n1\n2\n3\n```\n`count` lives inside `makeCounter`'s scope, but the returned closure keeps a genuine, persistent reference to it — each call to `counter()` sees and modifies the *same* `count`, even though `makeCounter` itself already returned. This is a real, live variable being shared, not a copy re-initialized each call.\n\n**3. Each call to `makeCounter` creates a genuinely independent closure, with its own separate `count`.**\n```go\ncounter2 := makeCounter()\nfmt.Println(counter2())\n```\nOutput:\n```\n1\n```\n`counter2` starts back at `1`, completely unaffected by `counter`'s state from Example 2 — every call to `makeCounter` allocates a brand-new `count` variable, captured by a brand-new closure.\n\n**4. Passing a named function as a value — the classic callback shape.**\n```go\nfunc apply(nums []int, f func(int) int) []int {\n\tresult := make([]int, len(nums))\n\tfor i, n := range nums {\n\t\tresult[i] = f(n)\n\t}\n\treturn result\n}\n\nfunc double(n int) int {\n\treturn n * 2\n}\n\nfmt.Println(apply([]int{1, 2, 3}, double))\n```\nOutput:\n```\n[2 4 6]\n```\n`double` is passed by name, with no parentheses (calling it there, `double()`, would pass its *result* instead of the function itself) — `apply` receives it as a genuine `func(int) int` value and calls it once per element.\n\n**5. Passing an anonymous function literal directly, with no separate named declaration needed.**\n```go\nfmt.Println(apply([]int{1, 2, 3}, func(n int) int {\n\treturn n * n\n}))\n```\nOutput:\n```\n[1 4 9]\n```\nGenuinely common for a one-off transformation that doesn't deserve its own named function elsewhere — this exact shape (an inline function literal as an argument) reappears constantly with `sort.Slice` (Chapter 7.6) and `Where`/`Map`-style helpers you'll write throughout Part VII.\n\n**6. Loop-variable capture in a closure, on this book's toolchain (Go 1.26.5) — verified directly.**\n```go\nvar funcs []func() int\nfor i := 0; i < 3; i++ {\n\tfuncs = append(funcs, func() int {\n\t\treturn i\n\t})\n}\nfor _, f := range funcs {\n\tfmt.Println(f())\n}\n```\nOutput:\n```\n0\n1\n2\n```\nEach closure correctly captured its *own* `i` — `0`, `1`, and `2` respectively, exactly matching intuition. This is the behavior every Go version starting with **1.22** guarantees: each iteration of a `for` loop gets its own, fresh copy of the loop variable, rather than every iteration sharing one variable that keeps changing underneath any closure that captured it.\n\n### A real, honest piece of history worth knowing\n\nBefore Go 1.22, the exact code in Example 6 was a famous, genuinely common bug: every closure shared the *same* `i` variable (one variable, reused and mutated across all three loop iterations), so by the time the closures actually ran, `i` had already finished the loop — every one of them would print `3`, not `0`, `1`, and `2`. This was Go's single most infamous gotcha, tripped over constantly with goroutines specifically (a closure launched with `go func() { ... }()` inside a loop, reading the loop variable, almost never runs before the next iteration has already changed it). Go 1.22 fixed this by giving each loop iteration its own variable, which is exactly the behavior Example 6 demonstrated. **This book cannot demonstrate the old, buggy behavior live** — this toolchain (1.26.5) has fully removed the compatibility switches (`GODEBUG=loopvar` and pinning an older Go version in `go.mod`) that used to let you opt back into it during the multi-year transition window; both were tested directly while writing this chapter and neither reverts the behavior anymore. If you ever read older Go code, a pre-2024 blog post, or a Stack Overflow answer warning about \"the loop variable closure bug,\" this is exactly what it's describing — a real, historical fact, just no longer something you can trigger on a modern toolchain.\n\n### ⚠️ Common Mistakes\n\n- **Calling a function when you meant to pass it as a value** (`apply(nums, double())` instead of `apply(nums, double)`). The parentheses matter — with them, you're passing whatever `double()` returns (and this specific example wouldn't even compile, since `double` needs an argument); without them, you're passing the function itself.\n- **Assuming a closure captures a snapshot of a variable's value.** As Example 2 showed, it captures the variable itself — genuinely useful for shared, evolving state, but worth being deliberate about, since it also means a closure can be affected by changes made from completely outside it.\n- **Worrying about the pre-1.22 loop-variable bug in modern code.** If your `go.mod` targets Go 1.22 or later (this book's entire toolchain does), Example 6's behavior is simply guaranteed — this is one gotcha you genuinely don't need to defensively code around anymore, unlike much older Go advice still circulating online.\n\n### How this connects\n\nClosures are the mechanism behind `defer`'s variable-capture behavior (Chapter 3.7), and become essential the moment goroutines enter the picture (Chapter 7.8) — a goroutine launched inside a loop is exactly the situation the pre-1.22 bug made famous, and exactly where Examp
