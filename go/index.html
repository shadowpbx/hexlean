le 6's guarantee now makes that pattern safe by default.\n\n### Quick recap\n\n- A function is a genuine first-class value in Go: assignable, passable as an argument, returnable from another function, with its own real type (`func(paramTypes) returnType`).\n- A closure captures the actual variables from its enclosing scope, not a snapshot — shared, mutable state across every call to that specific closure.\n- Each call to a function that returns a closure creates a brand-new, independent set of captured variables.\n- Since Go 1.22, each `for` loop iteration gets its own copy of the loop variable — the once-famous \"closures in a loop all see the same final value\" bug is fixed, unconditionally, on any toolchain targeting 1.22+."}, {"id": "4.6", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 6, "slug": "recursion-in-go", "fullTitle": "Recursion in Go", "title": "Recursion in Go", "md": "### Why this matters\n\nA function calling itself is a genuinely natural fit for problems defined in terms of smaller versions of themselves — walking a tree, computing a factorial, parsing nested structures. Go supports recursion with no special syntax at all; the interesting part is understanding exactly how deep you can actually go, and why that's different from a lot of other languages.\n\n### The core idea\n\nA recursive function calls itself, with each call working on a smaller piece of the problem, until it reaches a **base case** simple enough to answer directly without recursing further. Every recursive function needs a base case reachable from every possible input, or it recurses forever (or, in practice, until it runs out of stack space).\n\n### Examples\n\n**1. The classic example: factorial.**\n```go\nfunc factorial(n int) int {\n\tif n <= 1 {\n\t\treturn 1\n\t}\n\treturn n * factorial(n-1)\n}\nfmt.Println(factorial(5))\n```\nOutput:\n```\n120\n```\n`n <= 1` is the base case — answered directly, no further recursion. Everything else recurses on a strictly smaller `n`, guaranteeing the base case is eventually reached.\n\n**2. Fibonacci — a second, equally common shape.**\n```go\nfunc fibonacci(n int) int {\n\tif n <= 1 {\n\t\treturn n\n\t}\n\treturn fibonacci(n-1) + fibonacci(n-2)\n}\nfmt.Println(fibonacci(10))\n```\nOutput:\n```\n55\n```\nTwo recursive calls per invocation instead of one — genuinely illustrative of how quickly a naive recursive solution's total call count can grow (Chapter 8.4 revisits this specific function as a concrete example of measuring and improving real performance).\n\n**3. Mutual recursion — two functions calling each other.**\n```go\nfunc isEven(n int) bool {\n\tif n == 0 {\n\t\treturn true\n\t}\n\treturn isOdd(n - 1)\n}\n\nfunc isOdd(n int) bool {\n\tif n == 0 {\n\t\treturn false\n\t}\n\treturn isEven(n - 1)\n}\nfmt.Println(isEven(10), isOdd(10))\n```\nOutput:\n```\ntrue false\n```\nNothing special is required for two functions to call each other recursively — Go doesn't require forward-declaring `isOdd` before `isEven` uses it (Chapter 1.2 already established Go allows use-before-declaration within a package), so this reads naturally top to bottom.\n\n**4. Go's goroutine stacks grow dynamically — genuinely deep recursion that would crash many other languages works fine.**\n```go\nfunc countDown(n int) int {\n\tif n == 0 {\n\t\treturn 0\n\t}\n\treturn 1 + countDown(n-1)\n}\nfmt.Println(countDown(100000))\n```\nOutput:\n```\n100000\n```\n100,000 levels of recursion completed with no problem at all. Unlike languages with a small, fixed stack size, a goroutine's stack in Go starts small and grows automatically as needed — this is a genuine, practical advantage for recursive code that goes deeper than you might expect a \"normal\" call stack to tolerate.\n\n**5. That growth isn't unlimited — a real stack overflow, verified directly at an extreme depth.**\n```go\nfmt.Println(countDown(100000000))\n```\nOutput (truncated):\n```\nruntime: goroutine stack exceeds 1000000000-byte limit\nruntime: sp=0x164f949e0390 stack=[0x164f949e0000, 0x164fb49e0000]\nfatal error: stack overflow\n```\nAt 100 million levels deep, the stack genuinely exceeds its maximum allowed size (a real, configurable limit, roughly a gigabyte by default) and the program crashes with `fatal error: stack overflow` — a `fatal error`, notably, not a `panic`, which means it's **not** recoverable with `recover()` (Chapter 6.3) the way an ordinary panic is. The practical lesson: Go's dynamically-growing stack buys real headroom over a fixed-size stack, but it doesn't make infinite or pathologically deep recursion safe — a base case that's actually reachable, for every input, is still non-negotiable.\n\n### ⚠️ Common Mistakes\n\n- **Writing a recursive function with no base case, or one that's unreachable for some inputs.** This either loops until the stack overflows (Example 5) or, worse, never resolves for specific inputs that quietly skip the base case (e.g., recursing on `n-2` when `n` starts odd and the base case only checks `n == 0`).\n- **Assuming Go has tail-call optimization.** It doesn't — a recursive call, even in tail position (the very last thing a function does), still consumes real stack space per call, exactly like every other call. Deep tail-recursive algorithms translated from a language that does optimize this need genuine care in Go, or rewriting as an explicit loop.\n- **Treating \"Go's stack grows dynamically\" as \"recursion depth is unlimited.\"** As Example 5 proved directly, it isn't — there's a real, hard ceiling, and hitting it is a `fatal error`, not a catchable `panic`.\n- **Reaching for recursion when a straightforward loop would be clearer and avoid the per-call overhead entirely.** Recursion genuinely shines for naturally tree-shaped or self-similar problems; a simple linear scan is usually both clearer and faster as an ordinary `for` loop.\n\n### How this connects\n\nChapter 8.4 (Performance & Efficiency) comes back to Example 2's Fibonacci directly, using it as the concrete example for measuring how much a naive recursive approach can be improved — and Chapter 6.3's `panic`/`recover` explains exactly why Example 5's stack overflow can't be caught the way an ordinary error can.\n\n### Quick recap\n\n- A recursive function needs a base case reachable from every input, or it never terminates (in practice, until the stack overflows).\n- Go allows mutual recursion between functions with no special declaration order required.\n- Goroutine stacks grow dynamically — recursion far deeper than a fixed-size-stack language could handle works fine, verified directly at 100,000 levels.\n- That growth has a real, hard limit — verified directly at an extreme depth, producing an unrecoverable `fatal error: stack overflow`, not a catchable `panic`.\n- Go has no tail-call optimization — every recursive call, tail position or not, uses real stack space."}, {"id": "5.1", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 1, "slug": "pointers-what-they-really-are", "fullTitle": "Pointers: What They Really Are", "title": "Pointers: What They Really Are", "md": "### Why this matters\n\nIf you've worked through this series' own C book, pointers won't be a new *concept* — but Go's version is deliberately, genuinely safer, and this chapter is where that difference becomes concrete. If pointers are new to you entirely, this is the single idea the rest of Part V (methods, interfaces, everything that makes Go feel like Go) is built on top of.\n\n### The core idea\n\nA pointer holds the memory address of a value, rather than the value itself. `&x` gets a pointer to `x`; `*p` (with `p` a pointer) gets the value `p` points to — this is called **dereferencing**. Go's pointers are deliberately restricted compared to C's: no pointer arithmetic exists at all, and a `nil` pointer is safely checkable, even though dereferencing one is still a genuine runtime error.\n\n### Examples\n\n**1. `&` and `*` — taking an address, and reading through it.**\n```go\nx := 42\np := &x\nfmt.Println(x, p, *p)\n```\nOutput:\n```\n42 0x1ffbac900158 42\n```\n`p` holds `x`'s address (printed as a hex value — the exact address varies every run, and is never something to rely on directly). `*p` dereferences `p`, giving back `42` — the actual value stored at that address, which is `x`'s value.\n\n**2. Modifying through a pointer changes the original.**\n```go\n*p = 100\nfmt.Println(x)\n```\nOutput:\n```\n100\n```\n`*p = 100` writes through the pointer, directly into `x`'s own memory — `x` itself is now `100`, not just some copy. This is the entire reason pointers matter: they're how one piece of code can let another piece of code genuinely modify a value, rather than working on an independent copy (Chapter 2.4 already showed arrays copy completely without one; Chapter 5.2 shows exactly this for structs).\n\n**3. The zero value of a pointer is `nil` — safely comparable, but not safely dereferenceable.**\n```go\nvar q *int\nfmt.Println(q, q == nil)\n```\nOutput:\n```\n<nil> true\n```\nAn uninitialized pointer is `nil`, exactly like Chapter 2.5's `nil` slice or Chapter 2.7's `nil` map — and checking `q == nil` is always safe. Assigning it a real address afterward works normally:\n```go\ny := 10\nq = &y\n*q = 20\nfmt.Println(y)\n```\n```\n20\n```\n\n**4. `%T` confirms the real type distinction between a pointer and the value it points to.**\n```go\nfmt.Printf(\"%T %T\\n\", p, x)\n```\nOutput:\n```\n*int int\n```\n`*int` (pronounced \"pointer to int\") is a genuinely distinct type from `int` — you can't use one where the other is expected without explicitly dereferencing or taking an address, exactly like any other type mismatch in Go.\n\n**5. Dereferencing a `nil` pointer is a real, immediate panic.**\n```go\nvar p *int\n_ = *p\n```\nOutput:\n```\npanic: runtime error: invalid memory address or nil pointer dereference\n[signal SIGSEGV: segmentation violation code=0x1 addr=0x0 pc=0x47a782]\n```\nChecking `p == nil` before dereferencing (Example 3) is what actually prevents this — Go doesn't silently protect you from it the way, say, a language with `Optional` types might force you to.\n\n**6. Genuinely no pointer arithmetic — a real, deliberate safety difference from C.**\n```go\nx := 5\np := &x\np = p + 1\n```\nOutput:\n```\n# command-line-arguments\n./ptrarith.go:5:6: invalid operation: p + 1 (mismatched types *int and untyped int)\n```\nIn C, `p + 1` would move the pointer forward by one element's worth of memory — a foundational (and famously dangerous) C idiom. Go simply doesn't allow arithmetic on pointers at all; this single restriction eliminates an entire, huge category of C's most notorious bugs (buffer overruns from pointer math gone wrong) by construction, not by convention.\n\n### ⚠️ Common Mistakes\n\n- **Dereferencing a pointer without checking it isn't `nil` first**, when there's any real chance it could be. As Example 5 showed, this is an immediate panic, not a silent no-op.\n- **Trying to do pointer arithmetic out of C habit.** It doesn't exist in Go — a compile error catches any attempt, exactly as Example 6 showed. Slices (Chapters 2.5–2.6) are Go's real tool for \"a movable view into a sequence,\" precisely because pointer arithmetic isn't available to build that ad hoc.\n- **Printing a pointer's address and treating it as meaningful, stable information.** It's real, but arbitrary and can differ every run (and even move during a single run, since Go's garbage collector can relocate values) — never build logic around a specific printed address.\n- **Confusing `&x` (address-of) with `*p` (dereference).** They're opposite operations using similar-looking symbols — `&` takes you from a value to its address; `*` takes you from an address back to its value.\n\n### How this connects\n\nChapter 5.2 applies exactly this to structs specifically — pointers to structs are how methods with pointer receivers (Chapter 5.3–5.4) actually modify the original data, and it's the single most common practical use of pointers in real Go code.\n\n### Quick recap\n\n- `&x` takes the address of `x`; `*p` dereferences a pointer, reading (or writing, via `*p = value`) the value it points to.\n- A pointer's zero value is `nil` — always safe to compare, never safe to dereference without checking first.\n- `*T` is a genuinely distinct type from `T` — `%T` confirms this directly.\n- Go has **no pointer arithmetic at all** — a deliberate safety restriction eliminating an entire category of C's classic bugs."}, {"id": "5.2", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 2, "slug": "pointers-and-structs", "fullTitle": "Pointers and Structs", "title": "Pointers and Structs", "md": "### Why this matters\n\nChapter 2.4 showed arrays copy completely on assignment or function call — and structs (Chapter 2.8) behave exactly the same way, as genuine value types. A pointer to a struct is how real Go code lets a function actually modify the caller's data, rather than a disconnected copy — and Go gives you a real, deliberate convenience for working with one that removes a whole layer of manual dereferencing syntax.\n\n### The core idea\n\nA pointer to a struct (`*Point`) works exactly like any other pointer (Chapter 5.1) — `&Point{...}` takes its address, `*p` dereferences it — but Go adds one genuine convenience specifically for structs: `p.Field` automatically dereferences `p` for you, with no need to write out `(*p).Field` by hand. Passing a `*Point` (rather than a plain `Point`) into a function is exactly how that function can genuinely modify the caller's original struct.\n\n### Examples\n\n**1. Automatic dereferencing — `p.X` works directly, no `(*p).X` required.**\n```go\ntype Point struct {\n\tX, Y int\n}\n\np := Point{X: 1, Y: 2}\npp := &p\nfmt.Println((*pp).X, pp.X)\n```\nOutput:\n```\n1 1\n```\nBoth forms give the identical result — `(*pp).X` is the fully explicit \"dereference, then access the field\" version; `pp.X` is Go's automatic shorthand for exactly the same thing. In practice, every real Go codebase uses `pp.X` — the explicit parenthesized form exists mainly to show what's happening underneath, and this book won't use it again after this example.\n\n**2. A function taking a struct by value genuinely can't modify the caller's original — exactly Chapter 2.4's array behavior, applied to structs.**\n```go\nfunc movePointCopy(p Point) {\n\tp.X += 10\n}\nmovePointCopy(p)\nfmt.Println(p)\n```\nOutput:\n```\n{1 2}\n```\n`p` inside `movePointCopy` is a complete, independent copy — modifying it has zero effect on the caller's original `p`.\n\n**3. A function taking a pointer to a struct can genuinely modify the original.**\n```go\nfunc movePointPtr(p *Point) {\n\tp.X += 10\n}\nmovePointPtr(&p)\nfmt.Println(p)\n```\nOutput:\n```\n{11 2}\n```\n`&p` passes a pointer to the *real* `p`; `p.X += 10` inside the function (using the automatic-dereference shorthand from Example 1) modifies the actual original struct. This is the standard, idiomatic way to write a function meant to update a struct's fields — Chapter 5.4 covers exactly this trade-off for methods specifically, where it matters even more.\n\n**4. `&StructType{...}` — taking a pointer directly to a freshly-created struct literal.**\n```go\npp2 := &Point{X: 5, Y: 6}\nfmt.Println(pp2, *pp2)\n```\nOutput:\n```\n&{5 6} {5 6}\n```\n`&Point{...}` creates the struct and immediately takes its address in one expression — genuinely common, since a huge amount of real Go code works with `*Point` (a pointer to a struct) rather than a bare `Point` value, especially once methods (Chapter 5.3) enter the picture. Notice how `fmt.Println` prints a pointer to a struct with a leading `&` — a nice, readable convention `fmt` provides automatically.\n\n**5. `new(T)` — an alternative way to get a pointer to a zero-valued struct.**\n```go\npp3 := new(Point)\nfmt.Println(pp3, *pp3)\npp3.X = 99\nfmt.Println(*pp3)\n```\nOutput:\n```\n&{0 0} {0 0}\n{99 0}\n```\n`new(Point)` allocates a zero-valued `Point` and returns a pointer to it — functionally equivalent to `&Point{}`, just a slightly different spelling. Both are genuinely common in real Go code; `&Point{Field: value}` is generally preferred the moment you have actual initial values to set, since `new(T)` only ever gives you zero values.\n\n### ⚠️ Common Mistakes\n\n- **Writing `(*p).Field` out of habit or excessive explicitness.** `p.Field` already works identically, and is what every idiomatic Go codebase actually writes — Go performs the dereference automatically for field access and method calls alike.\n- **Passing a struct by value to a function meant to modify it**, then being confused why the caller's copy is untouched. Exactly Example 2's shape — pass a pointer (`*Point`) instead when mutation is the actual goal.\n- **Forgetting `fmt.Println` marks a struct pointer with a leading `&` in its output**, and misreading `&{5 6}` as some kind of error or unusual value rather than simply \"a pointer to a struct with these fields.\"\n- **Reaching for `new(T)` when a struct literal with initial values would be clearer.** `new(Point)` is fine when zero values are genuinely what's wanted, but `&Point{X: 5, Y: 6}` is more common and more direct the moment real initial values exist.\n\n### How this connects\n\nThis chapter is the direct foundation for Chapter 5.4's value-vs-pointer-receiver decision for methods — understanding that a pointer lets a function modify the original, while a value never can, is exactly the reasoning that decision comes down to.\n\n### Quick recap\n\n- `p.Field` works whether `p` is a struct or a pointer to one — Go dereferences automatically; the fully explicit `(*p).Field` is rarely written in practice.\n- A function receiving a struct by value can never modify the caller's original; one receiving a pointer (`*StructType`) genuinely can.\n- `&StructType{...}` creates a struct and takes its address in one expression — the common way to get a pointer to a struct with real initial values.\n- `new(T)` allocates a zero-valued `T` and returns a pointer to it — equivalent to `&T{}`, useful mainly when no initial values are needed yet."}, {"id": "5.3", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 3, "slug": "methods-receivers", "fullTitle": "Methods & Receivers", "title": "Methods & Receivers", "md": "### Why this matters\n\nGo has no classes — but it has methods, and understanding exactly how they're attached to a type (rather than defined inside one) is the key that unlocks the rest of Part V. A method is genuinely just a function with one extra, special parameter.\n\n### The core idea\n\n`func (r ReceiverType) MethodName(params) returnType { }` declares a method — the part in parentheses before the method name is the **receiver**, naming the type the method belongs to and giving that value a local name (`r` here) to use inside the method body. Calling it looks like `value.MethodName(args)`, but underneath, it's really no different from an ordinary function that happens to take `value` as its first parameter.\n\n### Examples\n\n**1. A method on a struct type.**\n```go\ntype Rectangle struct {\n\tWidth, Height float64\n}\n\nfunc (r Rectangle) Area() float64 {\n\treturn r.Width * r.Height\n}\n\nfunc (r Rectangle) Perimeter() float64 {\n\treturn 2 * (r.Width + r.Height)\n}\n\nrect := Rectangle{Width: 3, Height: 4}\nfmt.Println(rect.Area())\nfmt.Println(rect.Perimeter())\n```\nOutput:\n```\n12\n14\n```\n`r` inside each method is the receiver — the specific `Rectangle` the method was called on, accessed exactly like an ordinary parameter. `rect.Area()` reads naturally as \"get `rect`'s area,\" even though underneath it's mechanically similar to calling `Area(rect)`.\n\n**2. A method isn't limited to struct types — any named type defined in your own package can have one.**\n```go\ntype Counter int\n\nfunc (c Counter) Double() Counter {\n\treturn c * 2\n}\n\nc := Counter(5)\nfmt.Println(c.Double())\n```\nOutput:\n```\n10\n```\n`Counter` is just a named `int` underneath (Chapter 2.3's conversion syntax, `Counter(5)`, converts a plain `int` literal into one) — but because it's a distinct, named type, it can carry its own methods, something a bare `int` never could.\n\n**3. A method expression — a genuine, if rarely needed, glimpse at what's really happening underneath.**\n```go\narea := Rectangle.Area\nfmt.Println(area(rect))\n```\nOutput:\n```\n12\n```\n`Rectangle.Area` (the type name, dot, method name — no receiver value at all) produces an ordinary function value taking a `Rectangle` as its explicit first argument — proving directly that `rect.Area()` and `area(rect)` really are the same underlying operation, just different syntax for calling it. You'll rarely write this form yourself, but it's worth seeing once to demystify what `value.Method()` actually compiles down to.\n\n**4. A method can only be defined on a type declared in the *same package* — a real, enforced restriction.**\n```go\npackage main\nimport \"time\"\nfunc (d time.Duration) Foo() {}\n```\nOutput:\n```\n# command-line-arguments\n./foreign.go:3:9: cannot define new methods on non-local type time.Duration\n```\nYou cannot add a method directly to a type from another package, even a standard-library one — `time.Duration` belongs to the `time` package, and only code inside `time` itself can attach methods to it. The workaround, when you genuinely need method-like behavior on a foreign type, is to define your own named type based on it (`type MyDuration time.Duration`) — since that new type *is* declared in your own package, it can carry its own methods freely, even though it's built directly on someone else's type.\n\n### ⚠️ Common Mistakes\n\n- **Naming the receiver `self` or `this`, out of habit from another language.** Idiomatic Go uses a short abbreviation of the type itself (`r` for `Rectangle`, `c` for `Counter`) — consistently, across every method on that type, per Go's own style conventions (Chapter 8.4 covers this properly).\n- **Trying to attach a method directly to a type from another package.** As Example 4 showed, this is a real compile error — define your own named type based on the foreign one instead.\n- **Confusing a method with a function that merely takes the same type as a parameter.** `func Area(r Rectangle) float64` and `func (r Rectangle) Area() float64` can do identical work, but only the second is callable as `rect.Area()` and only the second can participate in Go's interface satisfaction (Chapter 5.5) — the receiver syntax specifically is what makes something a genuine method.\n- **Forgetting the receiver's type must be defined in the current package**, and that this applies to a plain type name too (`func (i int) Foo()` is exactly as illegal as the `time.Duration` example, for the same reason: `int` is a built-in type, not local to your package).\n\n### How this connects\n\nMethods are the foundation for interfaces (Chapter 5.5) — a type \"satisfies\" an interface purely by having the right methods, with no explicit declaration of intent required. Chapter 5.4, immediately next, covers the one genuinely important decision every method declaration involves: whether the receiver should be a value or a pointer.\n\n### Quick recap\n\n- `func (r T) Method(params) returnType { }` declares a method on type `T`; `value.Method(args)` calls it, with `value` becoming `r` inside the method body.\n- A method can be defined on any named type declared in your own package — not just structs, and never on a type from another package (including built-ins) directly.\n- `T.Method` (no receiver value) is a method expression — an ordinary function taking `T` as its explicit first parameter, proving methods and functions are close cousins underneath.\n- Idiomatic Go names the receiver a short abbreviation of the type, consistently — never `self` or `this`."}, {"id": "5.4", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 4, "slug": "value-vs-pointer-receivers", "fullTitle": "Value vs. Pointer Receivers", "title": "Value vs. Pointer Receivers", "md": "### Why this matters\n\nEvery method you write forces a real decision: should the receiver be a value (`func (c Counter) M()`) or a pointer (`func (c *Counter) M()`)? Get it wrong and a method that looks like it should modify something silently doesn't — exactly the array/struct-copying behavior from Chapters 2.4 and 5.2, now showing up in method form.\n\n### The core idea\n\nA **value receiver** gets a complete copy of whatever it was called on — exactly like an ordinary function parameter (Chapter 5.2's Example 2). A **pointer receiver** gets a pointer to the original, and can genuinely modify it. The rule of thumb: use a pointer receiver the moment a method needs to modify its receiver, or when the type is large enough that copying it on every call would be wasteful; use a value receiver for small, simple types where a method just reads data and copying is cheap and harmless.\n\n### Examples\n\n**1. A value receiver — modifications are lost the instant the method returns.**\n```go\ntype Counter struct {\n\tcount int\n}\n\nfunc (c Counter) IncrementValue() {\n\tc.count++\n}\n\nc := Counter{}\nc.IncrementValue()\nfmt.Println(c.count)\n```\nOutput:\n```\n0\n```\n`c` inside `IncrementValue` is a full copy — incrementing it does nothing to the real `Counter` back in `main`. This is exactly Chapter 5.2's Example 2 lesson, now specifically in method form.\n\n**2. A pointer receiver — the exact same operation, genuinely working this time.**\n```go\nfunc (c *Counter) IncrementPointer() {\n\tc.count++\n}\n\nc.IncrementPointer()\nfmt.Println(c.count)\n```\nOutput:\n```\n1\n```\nSame syntax at the call site (`c.IncrementPointer()`, not `(&c).IncrementPointer()`) — Go automatically takes `c`'s address for you when calling a pointer-receiver method on an addressable value. The method itself receives a genuine pointer to the real `c`, and the increment sticks.\n\n**3. Calling either kind of method works identically whether you're holding a value or already have a pointer.**\n```go\np := &Counter{}\np.IncrementPointer()\nfmt.Println(p.count)\np.IncrementValue()\nfmt.Println(p.count)\n```\nOutput:\n```\n1\n1\n```\n`p` is already a `*Counter` — `p.IncrementPointer()` works directly, no extra `&` needed. `p.IncrementValue()` also compiles fine (Go automatically dereferences `p` to get the value-receiver method its copy), but as expected, it doesn't change anything — `count` stays `1`, exactly matching Example 1's behavior, since a value receiver copies regardless of whether you called it through a pointer or a plain value.\n\n**4. Addressability matters: a pointer-receiver method can't be called on something that has no real address.**\n```go\ntype Counter struct{ count int }\nfunc (c *Counter) Inc() { c.count++ }\n\nm := map[string]Counter{\"a\": {}}\nm[\"a\"].Inc()\n```\nOutput:\n```\n# command-line-arguments\n./mapval.go:6:9: cannot call pointer method Inc on Counter\n```\nA value stored inside a map isn't individually addressable in Go (there's no stable memory location to point *at* — the map could rehash and move it at any time), so Go can't automatically take its address the way Example 2 did for an ordinary variable. The same restriction applies to a bare struct literal:\n```go\nCounter{}.Inc()\n```\n```\n# command-line-arguments\n./litval.go:5:12: cannot call pointer method Inc on Counter\n```\nA freshly-created literal with no name isn't addressable either — there's nothing to take `&` of. Both cases need a genuine, named, addressable variable first (`c := Counter{}; c.Inc()`) before a pointer-receiver method can be called on them directly.\n\n### ⚠️ Common Mistakes\n\n- **Using a value receiver for a method that's supposed to modify its receiver**, then being confused why nothing changed — exactly Example 1. If a method's whole purpose is mutation, it needs a pointer receiver.\n- **Mixing value and pointer receivers inconsistently across a single type's methods.** It's technically legal, but idiomatic Go convention is to pick one receiver style for a given type and use it for *every* method on that type, since mixing invites exactly the mistake above. If any method genuinely needs a pointer receiver, using pointer receivers for all of that type's methods is the standard, safer default.\n- **Trying to call a pointer-receiver method on a map value or an unaddressable literal.** As Example 4 showed, this is a real compile error — assign to a named variable first, or (for a map specifically) store `*Counter` values in the map instead of `Counter` values, if in-place mutation through the map is genuinely needed.\n- **Copying a large struct on every call by defaulting to a value receiver out of habit**, when the type is big enough that the copy itself has a real, measurable cost. Chapter 8.3's benchmarking tools (`go test -bench`) are exactly how to measure whether this actually matters for a given type, rather than guessing.\n\n### How this connects\n\nThis exact receiver choice determines whether a type satisfies an interface through its value form, its pointer form, or both — Chapter 5.5 covers interface satisfaction directly, and this receiver decision is precisely what that chapter's method-set rules are built on.\n\n### Quick recap\n\n- A value receiver operates on a copy — never modifies the original, exactly like an ordinary value parameter.\n- A pointer receiver operates on the real original through its address — the only way a method can genuinely mutate its receiver.\n- Go automatically takes the address for you when calling a pointer-receiver method on an addressable value (a named variable) — but not on a map value or a bare literal, neither of which has a stable address to take.\n- Idiomatic Go picks one receiver style per type and uses it consistently across every method on that type."}, {"id": "5.5", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 5, "slug": "interfaces-implicit-satisfaction", "fullTitle": "Interfaces: Implicit Satisfaction", "title": "Interfaces: Implicit Satisfaction", "md": "### Why this matters\n\nThis is the idea that gives Go's whole design its distinctive shape. Interfaces let you write code that works with \"anything that can do X,\" without that \"anything\" ever declaring, anywhere, that it intends to do X. No `implements` keyword, no inheritance hierarchy to opt into — a type satisfies an interface purely by having the right methods, automatically, the moment it does.\n\n### The core idea\n\nAn **interface** type lists a set of method signatures. Any type that has methods matching every one of those signatures automatically satisfies that interface — implicitly, with zero declaration linking the two. This is a genuinely different model from languages where a class must explicitly say `implements InterfaceName`; in Go, the connection is discovered structurally, by the compiler, based purely on what methods actually exist.\n\n### Examples\n\n**1. Declaring an interface, and two unrelated types that both satisfy it.**\n```go\ntype Shape interface {\n\tArea() float64\n}\n\ntype Rectangle struct {\n\tWidth, Height float64\n}\nfunc (r Rectangle) Area() float64 {\n\treturn r.Width * r.Height\n}\n\ntype Circle struct {\n\tRadius float64\n}\nfunc (c Circle) Area() float64 {\n\treturn 3.14159 * c.Radius * c.Radius\n}\n\nfunc printArea(s Shape) {\n\tfmt.Println(s.Area())\n}\n\nr := Rectangle{Width: 3, Height: 4}\nc := Circle{Radius: 2}\nprintArea(r)\nprintArea(c)\n```\nOutput:\n```\n12\n12.56636\n```\n`Rectangle` and `Circle` never mention `Shape` anywhere in their own declarations — nothing says \"I am a Shape.\" They simply each have an `Area() float64` method, which is the *entire* requirement `Shape` specifies, and that alone is enough for `printArea` (which only knows about `Shape`, not either concrete type) to accept both.\n\n**2. A variable can hold a concrete type through its interface type directly.**\n```go\nvar s Shape = r\nfmt.Println(s.Area())\n```\nOutput:\n```\n12\n```\n`s` is declared as `Shape`, but holds an actual `Rectangle` underneath — calling `s.Area()` dispatches to `Rectangle`'s own `Area` method. This is genuinely how Go achieves polymorphism: one variable, one interface type, many possible concrete types underneath, each bringing its own behavior for the same method name.\n\n**3. `fmt.Stringer` — a real, standard-library interface you've been satisfying without knowing it.**\n```go\ntype Point struct {\n\tX, Y int\n}\nfunc (p Point) String() string {\n\treturn fmt.Sprintf(\"(%d, %d)\", p.X, p.Y)\n}\n\np := Point{X: 1, Y: 2}\nfmt.Println(p)\nfmt.Printf(\"%v\\n\", p)\nfmt.Printf(\"%s\\n\", p)\n```\nOutput:\n```\n(1, 2)\n(1, 2)\n(1, 2)\n```\n`fmt.Stringer` is a real interface defined in the standard library, requiring exactly one method: `String() string`. The moment `Point` has that method, `fmt.Println`/`Printf`'s `%v`/`%s` verbs automatically call it instead of falling back to the default `{1 2}`-style struct printing you've seen in every earlier chapter — again, with zero explicit declaration that `Point` \"implements\" `Stringer`. This is precisely why so many of your own types are worth giving a `String()` method: any code using `fmt` (which is essentially all of it) picks it up automatically.\n\n**4. Interface satisfaction respects the value-vs-pointer-receiver distinction from Chapter 5.4 — a genuinely important, real consequence.**\n```go\ntype Square struct{ Side float64 }\nfunc (s *Square) Area() float64 { return s.Side * s.Side }\n\nsq := Square{Side: 5}\nprintArea(sq)\n```\nOutput:\n```\n# command-line-arguments\n./ptronly.go:10:12: cannot use sq (variable of struct type Square) as Shape value in argument to printArea: Square does not implement Shape (method Area has pointer receiver)\n```\n`Square`'s `Area` method has a *pointer* receiver — which means only `*Square` satisfies `Shape`, not a bare `Square` value. The error message says so directly. Passing a pointer instead works exactly as expected:\n```go\nprintArea(&sq)\n```\n```\n25\n```\nThis is exactly Chapter 5.4's method-set rule, now showing up in interface form: a pointer-receiver method only exists on the pointer type's method set, so only the pointer type satisfies an interface requiring it. A value-receiver method, by contrast, exists on *both* the value's and the pointer's method set — which is why Example 1's `Rectangle` (value receiver) satisfied `Shape` as a plain value with no pointer needed at all.\n\n### ⚠️ Common Mistakes\n\n- **Looking for an `implements` keyword or declaration.** There isn't one — satisfaction is entirely structural and implicit, determined purely by whether the right methods exist.\n- **Defining a method with a pointer receiver and then trying to pass a plain value where an interface is expected.** As Example 4 showed, this is a real, clearly-worded compile error — pass a pointer, or reconsider whether that particular method genuinely needs a pointer receiver (Chapter 5.4's guidance).\n- **Assuming two types satisfying the same interface are otherwise related.** `Rectangle` and `Circle` share nothing but an `Area()` method — no common base type, no shared fields, nothing beyond the interface's own minimal requirement. This is exactly the point: interfaces describe behavior, not identity or ancestry.\n- **Designing a large interface with many methods when a smaller one would do.** Idiomatic Go favors small, narrowly-scoped interfaces (often just one or two methods, like `Stringer`'s single `String()`) — the smaller an interface, the more types can naturally satisfy it without contorting their design to fit.\n\n### How this connects\n\n`io.Reader`/`io.Writer` (Chapter 7.2) are the standard library's most famous example of this exact small-interface philosophy — and Chapter 5.6 covers `any` (the empty interface, satisfied by literally everything) and type assertions, for the moment you need to recover a specific concrete type from behind an interface.\n\n### Quick recap\n\n- An interface lists method signatures; any type with matching methods satisfies it automatically — no explicit declaration linking the two.\n- A variable of an interface type can hold any concrete type that satisfies it, dispatching each method call to that concrete type's own implementation.\n- `fmt.Stringer` (`String() string`) is a real standard-library interface — giving a type this one method changes how `fmt`'s printing verbs display it, automatically.\n- Interface satisfaction respects receiver choice: a pointer-receiver method exists only on the pointer's method set, so only the pointer type (not the plain value) satisfies an interface requiring it.\n- Idiomatic Go favors small interfaces — often just one method — since smaller interfaces are naturally satisfied by more types."}, {"id": "5.6", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 6, "slug": "the-empty-interface-any-type-assertions", "fullTitle": "The Empty Interface (`any`) & Type Assertions", "title": "The Empty Interface (`any`) & Type Assertions", "md": "### Why this matters\n\nSometimes a function genuinely needs to accept a value of *any* type at all — `fmt.Println`'s arguments being the most obvious example you've used since Chapter 1.1. `any` is Go's way of expressing \"this could be anything,\" and type assertions are the deliberate, explicit tool for recovering something more specific from it afterward.\n\n### The core idea\n\n**`any`** is an interface with *zero* required methods — since every type has at least zero methods, literally every value in Go satisfies `any`. It's genuinely just an alias for `interface{}` (the empty interface literal, which you'll still see in older code). A **type assertion**, `x.(T)`, checks whether `x` actually holds a `T` underneath and, if so, gives you back a real `T` you can use directly — in two forms: a \"comma-ok\" form that reports success safely, and a bare form that panics on a mismatch.\n\n### Examples\n\n**1. `any` can hold literally anything.**\n```go\nvar x any\nx = 42\nfmt.Println(x)\nx = \"hello\"\nfmt.Println(x)\nx = true\nfmt.Println(x)\n```\nOutput:\n```\n42\nhello\ntrue\n```\nSame variable, three completely different underlying types, no complaint from the compiler at any point — this is exactly what \"the empty interface has zero requirements\" buys you.\n\n**2. A slice of `any` — mixed types, together in one collection.**\n```go\nthings := []any{1, \"two\", 3.0, true, []int{1, 2}}\nfmt.Println(things)\n```\nOutput:\n```\n[1 two 3 true [1 2]]\n```\nOrdinarily, a slice's elements must all share one type (Chapter 2.5) — `[]any` sidesteps that entirely, since `any` itself is the one shared type, and it happens to accept everything.\n\n**3. Comma-ok type assertion — the safe way to check what's actually inside.**\n```go\nvar y any = 42\nn, ok := y.(int)\nfmt.Println(n, ok)\n\ns, ok2 := y.(string)\nfmt.Println(s, ok2)\n```\nOutput:\n```\n42 true\n false\n```\n`y.(int)` succeeds (`y` really does hold an `int`), giving back the real `42` and `true`. `y.(string)` fails — `y` isn't a `string` — and returns the zero value for `string` (`\"\"`, printing as blank) alongside `false`, exactly the same comma-ok shape Chapter 2.7's map lookups and Chapter 4.2's multi-value returns already established. No panic, no crash — just an honest, checkable answer.\n\n**4. `any` and `interface{}` are genuinely the same type — verified directly.**\n```go\nfmt.Printf(\"%T\\n\", any(42))\nfmt.Printf(\"%T\\n\", interface{}(42))\n```\nOutput:\n```\nint\nint\n```\n`any` was introduced as a friendlier alias for `interface{}` (Go 1.18, alongside generics) — they're completely interchangeable; modern Go code uses `any`, but you'll still see `interface{}` constantly in code and documentation written before the alias existed.\n\n**5. The bare (non-comma-ok) assertion form — a genuine, immediate panic on a mismatch.**\n```go\nvar x any = \"hello\"\nn := x.(int)\nfmt.Println(n)\n```\nOutput:\n```\npanic: interface conversion: interface {} is string, not int\n```\nWithout the comma-ok form, a failed assertion doesn't return a false-y zero value quietly — it panics immediately (Chapter 6.3 covers panics properly). Use this bare form only when you're genuinely certain of the underlying type (often right after a check that already established it some other way) — the comma-ok form is the safer default whenever there's real uncertainty.\n\n### ⚠️ Common Mistakes\n\n- **Using the bare assertion form on a value whose type isn't actually guaranteed.** As Example 5 showed, a mismatch panics the whole program (unless caught with `recover`, Chapter 6.3) — reach for the comma-ok form (Example 3) the moment there's any real doubt.\n- **Reaching for `any` as a default parameter type \"just in case,\" instead of a specific type or a small, purpose-built interface.** `any` throws away all compile-time type checking for that value — genuinely necessary sometimes (a generic container, a JSON-decoding target before its shape is known), but a real cost every other time, trading safety for flexibility you might not need.\n- **Forgetting a type assertion checks the *exact* concrete type, not \"anything compatible.\"** `y.(int)` fails if `y` actually holds an `int32` or `int64` — even though they're all \"integer-like,\" Go's type assertions are exact, not fuzzy.\n- **Confusing a type assertion (`x.(T)`, checking one specific type) with a type switch (`switch v := x.(type)`, Chapter 3.5, checking many possible types at once).** They share the `.( )` syntax family but solve different shapes of the same underlying problem — one type to check versus several.\n\n### How this connects\n\n`any` and type assertions are the mechanical foundation Chapter 3.5's type switches are built on — and generics (Chapter 5.10) exist specifically to solve many of the same \"work with more than one type\" problems `any` handles, but with real compile-time type safety restored, rather than deferred to a runtime check.\n\n### Quick recap\n\n- `any` (an alias for `interface{}`) has zero method requirements — every value in Go satisfies it.\n- `value, ok := x.(T)` safely checks and extracts a specific concrete type, returning `T`'s zero value and `false` on a mismatch — no panic.\n- `value := x.(T)` (no comma-ok) panics immediately if `x` doesn't actually hold a `T` — use only with real confidence in the underlying type.\n- A type assertion checks the exact concrete type, never a \"compatible enough\" fuzzy match."}, {"id": "5.7", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 7, "slug": "struct-embedding", "fullTitle": "Struct Embedding", "title": "Struct Embedding", "md": "### Why this matters\n\nGo has no inheritance — no `class Dog extends Animal`. Struct embedding is Go's real, deliberately different tool for code reuse between types: including one struct inside another with no field name gives you its fields and methods *for free*, directly on the outer type, without ever pretending `Dog` genuinely *is an* `Animal` the way inheritance would.\n\n### The core idea\n\nEmbedding a type in a struct — writing the type name with no field name of its own (`Animal`, not `A Animal`) — **promotes** that type's fields and methods to the outer struct, accessible directly (`d.Name`, not `d.Animal.Name`). This is a real, but purely mechanical, shortcut for field/method access — it is genuinely *not* inheritance, and the difference matters the moment method overriding and dispatch come up.\n\n### Examples\n\n**1. Embedding, and the fields/methods it promotes.**\n```go\ntype Animal struct {\n\tName string\n}\nfunc (a Animal) Describe() string {\n\treturn \"I am \" + a.Name\n}\nfunc (a Animal) Speak() string {\n\treturn a.Name + \" makes a sound\"\n}\n\ntype Dog struct {\n\tAnimal\n\tBreed string\n}\n\nd := Dog{Animal: Animal{Name: \"Rex\"}, Breed: \"Labrador\"}\nfmt.Println(d.Name)\nfmt.Println(d.Describe())\n```\nOutput:\n```\nRex\nI am Rex\n```\n`d.Name` works directly, even though `Name` is actually a field of the embedded `Animal`, not `Dog` itself — this is **field promotion**. `d.Describe()` works the same way for the promoted method.\n\n**2. Overriding a promoted method — `Dog` defines its own `Speak`.**\n```go\nfunc (d Dog) Speak() string {\n\treturn d.Name + \" barks\"\n}\n\nfmt.Println(d.Speak())\nfmt.Println(d.Animal.Speak())\n```\nOutput:\n```\nRex barks\nRex makes a sound\n```\n`d.Speak()` calls `Dog`'s own method — it \"shadows\" the promoted one from `Animal`. The original is still there, reachable explicitly through the full path `d.Animal.Speak()`, which calls `Animal`'s version directly, unaffected by `Dog`'s override.\n\n**3. A genuinely important, easy-to-miss consequence: no dynamic dispatch, unlike real inheritance.**\n```go\nfunc (a Animal) Announce() string {\n\treturn \"Announcement: \" + a.Speak()\n}\n\nd := Dog{Animal: Animal{Name: \"Rex\"}}\nfmt.Println(d.Speak())\nfmt.Println(d.Announce())\n```\nOutput:\n```\nRex barks\nAnnouncement: Rex makes a sound\n```\n`d.Announce()` is a *promoted* method — it's really `Animal.Announce`, running with `a` bound to the embedded `Animal`, not `Dog`. When it calls `a.Speak()` internally, it calls **`Animal`'s own `Speak`**, not `Dog`'s override — even though you called `Announce` *through* `d`. This is the single biggest, most important difference from real inheritance: in a language with genuine virtual dispatch, `Announce` calling `Speak` on `self` would resolve to whichever override the *actual* object type provides, at runtime. Go's embedding does no such thing — `Animal`'s methods only ever know about `Animal`, never about whatever might be embedding it. Struct embedding is composition with a field-access shortcut, not inheritance with polymorphism.\n\n**4. Embedding a pointer works too, with the same field/method promotion.**\n```go\ntype PtrDog struct {\n\t*Animal\n\tBreed string\n}\npd := PtrDog{Animal: &Animal{Name: \"Fido\"}, Breed: \"Poodle\"}\nfmt.Println(pd.Name, pd.Describe())\n```\nOutput:\n```\nFido I am Fido\n```\nEmbedding `*Animal` (a pointer) instead of `Animal` (a value) still promotes fields and methods identically — genuinely useful when the embedded value should be shared (multiple structs embedding the same underlying `*Animal`) rather than copied.\n\n### ⚠️ Common Mistakes\n\n- **Treating embedding as inheritance and expecting polymorphic/virtual dispatch.** As Example 3 proved directly, a promoted method never calls back into the outer type's overrides — it only ever sees the embedded type's own methods. If genuine polymorphism is what's actually needed, an interface (Chapter 5.5) — not embedding — is the right tool.\n- **Confusing an embedded field (no name of its own) with an ordinary named field of a struct type** (`Addr Address`, from Chapter 2.8). Only the unnamed, embedded form gets field/method promotion — a normally-named field always needs its full path (`d.Addr.City`), never the shortcut.\n- **Forgetting the embedded field still has a real name for explicit access** — it's the type's own name (`d.Animal`, from `type Dog struct { Animal; ... }`), useful whenever the promoted shortcut is shadowed by an override, exactly as Example 2 showed.\n- **Embedding a large struct by value when a pointer would avoid unnecessary copying**, or embedding a pointer when independent, non-shared copies were actually intended. Chapter 5.4's value-vs-pointer reasoning applies here too.\n\n### How this connects\n\nChapter 5.8 covers embedding an *interface* inside another interface — the same promotion idea, one level more abstract, and a genuinely common way real Go interfaces (like `io.ReadWriter`, built from `io.Reader` and `io.Writer`) are composed from smaller pieces.\n\n### Quick recap\n\n- Embedding a type (no field name) in a struct **promotes** its fields and methods, accessible directly on the outer struct.\n- An outer type can define a method with the same name to shadow (override) a promoted one — the original remains reachable via the embedded field's own name (`outer.Embedded.Method()`).\n- Embedding is **not** inheritance: a promoted method never sees the outer type's overrides when calling other methods on itself — no virtual dispatch, ever.\n- A pointer type can be embedded too, promoting fields/methods identically while sharing (rather than copying) the underlying value."}, {"id": "5.8", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 8, "slug": "interface-embedding", "fullTitle": "Interface Embedding", "title": "Interface Embedding", "md": "### Why this matters\n\nChapter 5.5's guidance was to favor small, single-purpose interfaces. Interface embedding is how Go composes those small pieces back into a larger interface when something genuinely needs more than one capability at once — and it's exactly how the standard library's own most famous interfaces are actually built.\n\n### The core idea\n\nAn interface can embed another interface — listing its name with no method signature of its own — which means \"require everything that interface requires, plus whatever else is listed here.\" A type must satisfy *every* embedded interface's methods (in addition to any directly listed) to satisfy the combined interface as a whole.\n\n### Examples\n\n**1. Composing two small interfaces into one.**\n```go\ntype Reader interface {\n\tRead() string\n}\ntype Writer interface {\n\tWrite(s string)\n}\ntype ReadWriter interface {\n\tReader\n\tWriter\n}\n```\n`ReadWriter` requires exactly `Read() string` and `Write(s string)` — the union of both embedded interfaces' methods, nothing more.\n\n**2. A type satisfying both, usable through any of the three interface types.**\n```go\ntype File struct {\n\tcontents string\n}\nfunc (f *File) Read() string {\n\treturn f.contents\n}\nfunc (f *File) Write(s string) {\n\tf.contents += s\n}\n\nfunc useReadWriter(rw ReadWriter) {\n\trw.Write(\"hello\")\n\tfmt.Println(rw.Read())\n}\n\nf := &File{}\nuseReadWriter(f)\n\nvar r Reader = f\nfmt.Println(r.Read())\n```\nOutput:\n```\nhello\nhello\n```\n`*File` has both methods `ReadWriter` requires, so it satisfies `ReadWriter` directly — with, once again, zero explicit declaration linking `File` to any of these three interfaces. It also, separately, satisfies the narrower `Reader` on its own, since having *more* methods than an interface requires is never a problem.\n\n**3. Missing even one required method — from either embedded interface — fails satisfaction of the whole.**\n```go\ntype ReadOnly struct{}\nfunc (r ReadOnly) Read() string { return \"\" }\n\nfunc useRW(rw ReadWriter) {}\nuseRW(ReadOnly{})\n```\nOutput:\n```\n# command-line-arguments\n./incomplete.go:9:8: cannot use ReadOnly{} (value of struct type ReadOnly) as ReadWriter value in argument to useRW: ReadOnly does not implement ReadWriter (missing method Write)\n```\n`ReadOnly` has `Read` but not `Write` — it satisfies the standalone `Reader` interface just fine, but not the composed `ReadWriter`, which needs both. The error message names the specific missing method directly, exactly like Chapter 5.5's pointer-receiver mismatch error did.\n\n**4. This exact pattern is real — the standard library's `io.ReadWriter` is built precisely this way.**\n```\npackage io // import \"io\"\n\ntype ReadWriter interface {\n\tReader\n\tWriter\n}\n    ReadWriter is the interface that groups the basic Read and Write methods.\n```\n`io.ReadWriter` (Chapter 7.2 covers `io.Reader`/`io.Writer` properly) is composed from `io.Reader` and `io.Writer` in exactly the shape this chapter just built from scratch — this isn't a simplified teaching example, it's genuinely how Go's own standard library assembles larger capabilities from small, focused pieces.\n\n### ⚠️ Common Mistakes\n\n- **Assuming embedding one interface in another somehow merges or overrides methods**, the way struct embedding can shadow a method (Chapter 5.7). Interface embedding purely *adds* method requirements together — there's no equivalent of \"overriding\" a required method signature.\n- **Designing one large interface upfront instead of composing several small ones.** As `io.ReadWriter` demonstrates, the idiomatic Go approach is small, focused interfaces (`Reader`, `Writer`) combined only where a specific need genuinely requires both — a function that only reads should still take a bare `Reader`, not the combined `ReadWriter`, even if the concrete value passed to it happens to support both.\n- **Forgetting a type must satisfy *every* embedded interface's methods, not just some of them.** Example 3 showed the compiler names the specific missing method, which is worth reading carefully rather than assuming \"close enough\" satisfies a composed interface.\n\n### How this connects\n\nThis exact pattern is the reasoning behind nearly every multi-method standard-library interface you'll meet from Chapter 7.2 onward (`io.ReadWriter`, `io.ReadCloser`, and more) — recognizing \"this is just embedded smaller interfaces\" makes their names and shapes self-explanatory rather than something to memorize individually.\n\n### Quick recap\n\n- An interface can embed another interface (name only, no signature) — requiring the union of all embedded interfaces' methods, plus any listed directly.\n- A type must satisfy every embedded interface's methods to satisfy the combined interface — missing even one fails the whole, with the compiler naming the specific missing method.\n- This is exactly how real standard-library interfaces like `io.ReadWriter` are built — small, focused interfaces composed together only where a genuine need for both exists."}, {"id": "5.9", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 9, "slug": "the-nil-interface-gotcha", "fullTitle": "The `nil`-Interface Gotcha", "title": "The `nil`-Interface Gotcha", "md": "### Why this matters\n\nThis is Go's other famous trap (alongside the pre-1.22 loop-variable bug from Chapter 4.5) — and unlike that one, this one is still very much alive on every Go version, including this book's. It has genuinely caused real, hard-to-find production bugs, usually in exactly the shape this chapter demonstrates: an `error` that should be `nil` but somehow isn't.\n\n### The core idea\n\nAn interface value is really two things bundled together underneath: a concrete **type**, and a **value**. An interface is only truly `nil` when *both* are nil/absent. A variable holding a `nil` pointer of some specific concrete type (`var p *MyError`, still `nil`) is **not** the same as a `nil` interface once that pointer gets assigned into an interface variable — the interface now has a real, non-nil type (`*MyError`) attached, even though the value it holds is `nil`.\n\n### Examples\n\n**1. A plain `nil` pointer compares equal to `nil`, exactly as expected.**\n```go\ntype MyError struct {\n\tmsg string\n}\nfunc (e *MyError) Error() string {\n\tif e == nil {\n\t\treturn \"<nil MyError>\"\n\t}\n\treturn e.msg\n}\n\nvar p *MyError\nfmt.Println(p == nil)\n```\nOutput:\n```\ntrue\n```\nNothing surprising yet — `p` is a `nil` `*MyError`, and comparing it directly to `nil` works exactly as you'd hope.\n\n**2. Assign that same `nil` pointer into an interface variable, and the comparison flips.**\n```go\nvar e error = p\nfmt.Println(e == nil)\nfmt.Printf(\"%T %v\\n\", e, e)\n```\nOutput:\n```\nfalse\n*main.MyError <nil MyError>\n```\n`e == nil` is now `false`, even though the underlying pointer is still genuinely `nil`. `%T` reveals why: `e`'s concrete type is `*main.MyError` — a real, non-nil type — even though its value is `nil`. An interface is `nil` only when *both* its type and value are absent; here, the type is very much present.\n\n**3. The real, common way this bites: a function that \"returns `nil` on success\" silently doesn't.**\n```go\nfunc doSomethingWrapped(fail bool) error {\n\tvar err *MyError\n\tif fail {\n\t\terr = &MyError{msg: \"it broke\"}\n\t}\n\treturn err // ALWAYS returns a non-nil error interface, even when err is nil!\n}\n\nerr := doSomethingWrapped(false)\nfmt.Println(err == nil)\nif err != nil {\n\tfmt.Println(\"this incorrectly runs even though nothing failed!\")\n}\n```\nOutput:\n```\nfalse\nthis incorrectly runs even though nothing failed!\n```\n`doSomethingWrapped(false)` never actually failed — `err` stayed a `nil` `*MyError` the whole time. But the function's return type is `error` (an interface), and `return err` converts that `nil` `*MyError` into an interface value carrying a real, non-nil type — exactly Example 2's trap, now inside a function boundary where it's much easier to miss. The caller's `if err != nil` check, which should be completely reliable (Chapter 6.1 relies on exactly this check everywhere), now lies.\n\n**4. The fix: return the `nil` literal directly, never a `nil`-valued concrete-typed variable, through an interface-returning function.**\n```go\nfunc doSomethingFixed(fail bool) error {\n\tif fail {\n\t\treturn &MyError{msg: \"it broke\"}\n\t}\n\treturn nil // return the nil literal directly, not a nil *MyError variable\n}\n\nerr := doSomethingFixed(false)\nfmt.Println(err == nil)\n```\nOutput:\n```\ntrue\n```\nReturning the bare `nil` literal (not a variable that merely happens to hold `nil`) produces a genuinely `nil` interface — no concrete type gets attached at all, since there was never a typed variable in between.\n\n### ⚠️ Common Mistakes\n\n- **Declaring a typed pointer variable, conditionally leaving it `nil`, and returning it through an interface-typed return value.** This is exactly Example 3's trap — the fix (Example 4) is to return the `nil` literal directly on the \"nothing went wrong\" path, never a variable of a concrete type that merely happens to be `nil`.\n- **Trusting `err != nil` blindly on a value that passed through any interface conversion**, without knowing whether the underlying concrete type could itself be `nil`. This is specifically an `error`/interface problem — an ordinary `*T` compared to `nil` directly (Example 1) is completely reliable; it's only once that pointer crosses into an interface variable that the trap appears.\n- **Assuming this is a rare, exotic edge case.** It's genuinely common in real code — any function returning a custom error type through the standard `error` interface, where the concrete error variable is declared before being conditionally assigned, is exactly this shape.\n- **\"Fixing\" it by comparing `err.(*MyError) == nil` at the call site**, which technically works but pushes the caller to know and check for a specific concrete type — the real fix belongs in the function that returns the interface (Example 4), not in every caller.\n\n### How this connects\n\nThis exact gotcha is why Chapter 6.1's error-handling guidance is so insistent about never wrapping a concrete error type in a variable that might stay `nil` — get the pattern right here, and Chapter 6.1's `if err != nil` checks stay completely trustworthy everywhere else in this book.\n\n### Quick recap\n\n- An interface value is `nil` only when **both** its concrete type and its value are absent — a `nil` pointer of a specific type, once inside an interface variable, is **not** a `nil` interface.\n- `%T` on a suspicious interface value reveals whether a concrete (even if `nil`-valued) type is actually attached.\n- The fix: return the bare `nil` literal directly from a function whose return type is an interface — never a variable of a concrete type that merely happens to currently be `nil`.\n- This is a real, live, still-current Go trap (unlike Chapter 4.5's loop-variable bug) — one of the most cited \"gotchas\" in the language for exactly this reason."}, {"id": "5.10", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 10, "slug": "generics-type-parameters-constraints", "fullTitle": "Generics: Type Parameters & Constraints", "title": "Generics: Type Parameters & Constraints", "md": "### Why this matters\n\nBefore generics (added in Go 1.18), writing one function that worked correctly across multiple types meant either duplicating it per type, or falling back to `any` and losing real compile-time type safety (Chapter 5.6). Generics let you write a function or type once, parameterized over \"some type meeting these requirements,\" with the compiler still checking everything at compile time — no runtime type assertions needed.\n\n### The core idea\n\nA **type parameter**, written in square brackets (`func Max[T int | float64](a, b T) T`), lets a function (or type) operate on a family of types rather than one fixed type. A **constraint** — the part after the type parameter's name — restricts which types are actually allowed, from a simple built-in like `any` or `comparable`, to a custom interface listing exactly which types qualify.\n\n### Examples\n\n**1. A generic function, constrained to two specific types.**\n```go\nfunc Max[T int | float64](a, b T) T {\n\tif a > b {\n\t\treturn a\n\t}\n\treturn b\n}\n\nfmt.Println(Max(3, 5))\nfmt.Println(Max(3.5, 2.1))\n```\nOutput:\n```\n5\n3.5\n```\n`[T int | float64]` declares `T` as a type parameter, constrained to be *either* `int` or `float64` — nothing else is allowed. Go infers `T` automatically from the arguments: `int` in the first call, `float64` in the second, with no explicit annotation needed.\n\n**2. Explicit type instantiation — spelling out `T` yourself, when needed.**\n```go\nfmt.Println(Max[int](3, 5))\n```\nOutput:\n```\n5\n```\n`Max[int](3, 5)` explicitly names `T` as `int`. This is rarely required (inference handles the common case, as Example 1 showed) but occasionally necessary when there's no argument for the compiler to infer from.\n\n**3. A named constraint — a real interface, listing the allowed types.**\n```go\ntype Number interface {\n\tint | int64 | float64\n}\n\nfunc Sum[T Number](nums []T) T {\n\tvar total T\n\tfor _, n := range nums {\n\t\ttotal += n\n\t}\n\treturn total\n}\n\nfmt.Println(Sum([]int{1, 2, 3}))\nfmt.Println(Sum([]float64{1.5, 2.5}))\n```\nOutput:\n```\n6\n4\n```\n`Number` is an ordinary interface (Chapter 5.5), but instead of listing methods, it lists a union of concrete types — this is specifically a **constraint interface**, only usable as a type parameter's constraint, never as an ordinary variable's type. Naming it `Number` makes `Sum[T Number]` self-documenting, and reusable across multiple generic functions that all need \"some kind of number.\"\n\n**4. `any` as a constraint — genuinely any type at all, generics' equivalent of Chapter 5.6's empty interface.**\n```go\nfunc PrintAll[T any](items []T) {\n\tfor _, item := range items {\n\t\tfmt.Println(item)\n\t}\n}\nPrintAll([]string{\"a\", \"b\"})\n```\nOutput:\n```\na\nb\n```\n`[T any]` places no restriction on `T` whatsoever — but unlike a plain `any`-typed parameter (Chapter 5.6), the actual concrete type is still tracked throughout: `PrintAll([]string{...})` genuinely operates on a `[]string`, with all of `string`'s specific behavior intact, not boxed into a lossy `any`.\n\n**5. `comparable` — a built-in constraint requiring `==`/`!=` to work.**\n```go\nfunc Contains[T comparable](items []T, target T) bool {\n\tfor _, item := range items {\n\t\tif item == target {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}\n\nfmt.Println(Contains([]int{1, 2, 3}, 2))\nfmt.Println(Contains([]string{\"x\", \"y\"}, \"z\"))\n```\nOutput:\n```\ntrue\nfalse\n```\n`comparable` is a genuinely special, built-in constraint — it's exactly the same rule Chapter 2.7 established for valid map keys, now usable as a generic constraint. `==` inside `Contains` is only legal because `comparable` guarantees it'll work for whatever `T` actually ends up being.\n\n**6. Passing a non-comparable type against `comparable` is a real compile error — verified directly.**\n```go\nContains([][]int{{1}, {2}}, []int{1})\n```\nOutput:\n```\n# command-line-arguments\n./noncomp.go:9:10: []int does not satisfy comparable\n```\n`[]int` (a slice) isn't comparable (Chapter 2.6 already established `==` doesn't work on slices at all) — the compiler catches this at the *call site*, before the generic function ever runs, exactly the safety guarantee generics are meant to preserve over a plain `any` version that would only fail at runtime.\n\n**7. A real type-mismatch, and a genuine nuance about untyped constants.**\n```go\nvar x int = 3\nvar y float64 = 5.5\nfmt.Println(Max(x, y))\n```\nOutput:\n```\n# command-line-arguments\n./errors2.go:10:21: in call to Max, type float64 of y does not match inferred type int for T\n```\nTwo *typed* variables of different concrete types can't both satisfy the same inferred `T` — Go picks one type from the first argument and holds the rest to it. Curiously, though, calling `Max(3, 5.5)` directly with untyped numeric *constants* (rather than typed variables) compiles fine, inferring `T` as `float64` for both — Go's constant-inference rules (Chapter 1.4) let two untyped constants unify to whichever type can represent both, *before* generic type inference even runs. This is a real, worth-knowing subtlety: the exact same-looking call can succeed or fail to compile depending on whether the arguments are typed variables or bare constant literals.\n\n### ⚠️ Common Mistakes\n\n- **Confusing an ordinary interface (for values, Chapter 5.5) with a constraint interface (for type parameters only).** A constraint interface listing a union of types (`int | float64`) can never be used as a normal variable's type — it exists purely to restrict a type parameter.\n- **Reaching for `any` as a constraint when a narrower one (like `comparable` or a custom `Number`) would let the compiler actually catch real mistakes**, such as calling `+` on a type that doesn't support it.\n- **Forgetting `comparable` doesn't mean \"has an ordering\" (like `<`/`>`)** — it only guarantees `==`/`!=`. A constraint needing `<`/`>` as well (like `Max`'s `int | float64`) needs its own explicit type union or the standard library's `cmp.Ordered` (Chapter 5.11).\n- **Assuming type inference always works without any explicit annotation.** Example 2 showed explicit instantiation exists for exactly the cases inference can't resolve on its own — worth reaching for the moment a genuinely confusing inference error appears.\n\n### How this connects\n\nChapter 5.11 puts generics to real, practical use — a genuine type-safe generic data structure, and the standard library's own `slices`, `maps`, and `cmp` packages, which are themselves built entirely on exactly what this chapter just covered.\n\n### Quick recap\n\n- `func Name[T Constraint](params) returnType` declares a type parameter `T`, restricted by `Constraint`; `T` can usually be inferred from the arguments, or supplied explicitly (`Name[int](...)`).\n- A constraint can be `any` (no restriction), `comparable` (built-in, guarantees `==`/`!=`), or a custom interface listing a union of allowed concrete types.\n- A constraint interface is a distinct concept from an ordinary interface — usable only to restrict a type parameter, never as a normal variable's type.\n- Generics preserve full compile-time type checking — an invalid type argument (like a non-comparable type against `comparable`) is caught at the call site, before the function ever runs."}, {"id": "5.11", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "pointers, methods & interfaces — the heart of Go", "chapNum": 11, "slug": "generics-in-practice", "fullTitle": "Generics In Practice", "title": "Generics In Practice", "md": "### Why this matters\n\nChapter 5.10 covered generics' mechanics. This chapter puts them to real, practical use: a genuinely useful generic data structure, and the standard library's own `slices`/`maps`/`cmp` packages — which exist specifically so you rarely need to write the basic generic algorithms (searching, sorting, min/max) yourself at all.\n\n### The core idea\n\nTwo genuinely common uses cover most of what generics are actually reached for in real code: a data structure (like a stack or a queue) that needs to hold *some* type without knowing which one ahead of time, and the standard library's own generic helper packages (`slices`, `maps`, `cmp`), which apply Chapter 5.10's mechanics to the everyday operations — searching, sorting, comparing — that used to need a separate, hand-written version per type.\n\n### Examples\n\n**1. A type-safe generic stack — a genuinely useful data structure impossible to write this cleanly before generics.**\n```go\ntype Stack[T any] struct {\n\titems []T\n}\n\nfunc (s *Stack[T]) Push(item T) {\n\ts.items = append(s.items, item)\n}\n\nfunc (s *Stack[T]) Pop() (T, bool) {\n\tvar zero T\n\tif len(s.items) == 0 {\n\t\treturn zero, false\n\t}\n\tlast := s.items[len(s.items)-1]\n\ts.items = s.items[:len(s.items)-1]\n\treturn last, true\n}\n\nfunc (s *Stack[T]) Len() int {\n\treturn len(s.items)\n}\n\ns := &Stack[string]{}\ns.Push(\"a\")\ns.Push(\"b\")\ns.Push(\"c\")\nfmt.Println(s.Len())\nv, _ := s.Pop()\nfmt.Println(v, s.Len())\n```\nOutput:\n```\n3\nc 2\n```\n`Stack[T]` is a genuine struct type parameterized over `T` — `Stack[string]{}` instantiates it for `string` specifically. Before generics, this kind of container either needed a separate `IntStack`/`StringStack` per type, or fell back to `any` and lost type safety entirely (pushing a `string` into an `any`-based stack meant for numbers would compile fine and fail only at runtime). `Pop`'s `var zero T` (Chapter 1.3's zero-value rule, now genuinely generic) is exactly how an empty-stack case returns a sensible placeholder regardless of what `T` actually is.\n\n**2. The `slices` package — common operations you'd otherwise write by hand, for any comparable/ordered element type.**\n```go\nnums := []int{5, 2, 8, 1, 9}\nfmt.Println(slices.Contains(nums, 8))\nfmt.Println(slices.Index(nums, 8))\nfmt.Println(slices.Max(nums))\nfmt.Println(slices.Min(nums))\n```\nOutput:\n```\ntrue\n2\n9\n1\n```\n`slices.Contains`, `Index`, `Max`, and `Min` all work on any slice of a suitable type — `Contains`/`Index` need `comparable`; `Max`/`Min` need `cmp.Ordered` (Chapter 5.10's forward reference, a standard-library constraint covering every type supporting `<`/`>`). These are exactly the kind of small, tedious-to-hand-roll functions generics were introduced to finally let the standard library provide once, generically, instead of everyone reimplementing per type.\n\n**3. `slices.Sort` and `slices.Clone` — in-place sorting, and making an independent copy first when the original shouldn't change.**\n```go\nsorted := slices.Clone(nums)\nslices.Sort(sorted)\nfmt.Println(sorted, nums)\n```\nOutput:\n```\n[1 2 5 8 9] [5 2 8 1 9]\n```\n`slices.Sort` sorts in place (Chapter 2.6's aliasing rules apply directly — it mutates the actual underlying array) — `slices.Clone` first makes a genuinely independent copy, so sorting it leaves the original `nums` untouched. Chapter 7.6 covers sorting with custom comparison logic (`slices.SortFunc`) for types `cmp.Ordered` doesn't cover.\n\n**4. `maps.Keys`/`maps.Values` combined with `slices` — a real, modern iterator-based pattern.**\n```go\nm := map[string]int{\"a\": 1, \"b\": 2, \"c\": 3}\nkeys := slices.Sorted(maps.Keys(m))\nfmt.Println(keys)\n\nvalues := slices.Collect(maps.Values(m))\nslices.Sort(values)\nfmt.Println(values)\n```\nOutput:\n```\n[a b c]\n[1 2 3]\n```\n`maps.Keys(m)` doesn't return a plain `[]string` — it returns an `iter.Seq[string]`, Chapter 3.3's range-over-func iterator pattern. `slices.Sorted` consumes that iterator directly and returns a sorted slice in one step; `slices.Collect` consumes an iterator into a plain (unsorted) slice, which `slices.Sort` then sorts separately. This combination is exactly how modern Go (1.23+) idiomatically turns \"the deliberately randomized map key order from Chapter 2.7\" into a genuinely predictable, sorted sequence.\n\n### ⚠️ Common Mistakes\n\n- **Writing your own generic `Max`/`Contains`/`Sort` from scratch**, unaware the standard `slices`/`maps`/`cmp` packages (all genuinely part of the standard library, no separate install needed) already provide the common ones, well-tested and idiomatic.\n- **Calling `slices.Sort` on a slice you needed to keep in its original order**, forgetting it sorts in place. `slices.Clone` first (Example 3) whenever the original order still matters afterward.\n- **Expecting `maps.Keys`/`maps.Values` to return a plain slice directly.** As Example 4 showed, they return an iterator — `slices.Collect` or `slices.Sorted` is the bridge back to an ordinary `[]T` when a real slice (rather than something only usable with `range`) is actually needed.\n- **Reaching for `any` in a new data structure instead of a type parameter**, losing compile-time type safety for no real benefit — Example 1's `Stack[T]` is the direct, safer alternative for exactly this situation.\n\n### How this connects\n\nThis closes out Part V — pointers, methods, interfaces, and now generics are, together, the complete toolkit real Go programs are actually built from. Part VI moves on to error handling and how programs of real size get organized into packages and modules.\n\n### Quick recap\n\n- A generic struct type (`type Stack[T any] struct { ... }`) with methods on `*Stack[T]` is a genuine, type-safe container — instantiated per element type (`Stack[string]{}`), with no runtime type assertions needed.\n- The standard `slices` package provides common operations (`Contains`, `Index`, `Max`, `Min`, `Sort`, `Clone`, and more) generically, for any suitable element type — usually the right first choice over hand-rolling the same logic.\n- `slices.Sort` mutates in place; `slices.Clone` first when the original order needs to survive.\n- `maps.Keys`/`maps.Values` return iterators (Chapter 3.3), not plain slices — `slices.Collect`/`slices.Sorted` bridge back to an ordinary `[]T`, the idiomatic way to get a predictable, sorted view of a map's otherwise randomly-ordered contents."}, {"id": "6.1", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 1, "slug": "error-handling-the-error-interface", "fullTitle": "Error Handling: The `error` Interface", "title": "Error Handling: The `error` Interface", "md": "### Why this matters\n\nGo deliberately has no exceptions — no `try`/`catch`, no `throw`. Every function that can fail says so directly in its return type, and the caller is expected to check for it, explicitly, every single time. This is arguably the single most distinctive, most-debated design choice in the language, and this chapter is where you meet the interface the whole system is built on.\n\n### The core idea\n\n`error` is a built-in interface, requiring exactly one method:\n```go\ntype error interface {\n\tError() string\n}\n```\nAny type with an `Error() string` method satisfies `error` — implicitly, exactly like every interface in Chapter 5.5. A function that might fail returns `(result, error)` (Chapter 4.2's multi-return pattern); a `nil` error means success, and checking `if err != nil` is the idiomatic, expected way to react to failure.\n\n### Examples\n\n**1. The idiomatic shape, using the standard library's simplest error constructor.**\n```go\nfunc divide(a, b float64) (float64, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"cannot divide by zero\")\n\t}\n\treturn a / b, nil\n}\n\nresult, err := divide(10, 2)\nif err != nil {\n\tfmt.Println(\"error:\", err)\n\treturn\n}\nfmt.Println(\"result:\", result)\n\nresult2, err2 := divide(10, 0)\nif err2 != nil {\n\tfmt.Println(\"error:\", err2)\n\treturn\n}\nfmt.Println(\"result:\", result2)\n```\nOutput:\n```\nresult: 5\nerror: cannot divide by zero\n```\n`errors.New(\"...\")` (from the standard `errors` package) creates a simple error whose `Error()` method returns exactly the string given. `if err != nil` immediately after the call is the idiomatic pattern you'll see after nearly every function call that returns an error — checked immediately, not deferred or batched.\n\n**2. The zero value of `error` is `nil` — genuinely meaning \"no error occurred.\"**\n```go\nvar e error\nfmt.Println(e, e == nil)\n```\nOutput:\n```\n<nil> true\n```\nExactly like every other interface's zero value (Chapter 5.9's whole chapter was about exactly how easy it is to accidentally *not* end up with a truly `nil` error) — a freshly declared `error` variable, never assigned anything, is genuinely `nil`.\n\n**3. A custom error type — any type with an `Error() string` method works, not just what `errors.New` produces.**\n```go\ntype MyErr struct{}\nfunc (e *MyErr) Error() string { return \"custom\" }\n\nvar e2 error = &MyErr{}\nfmt.Printf(\"%T\\n\", e2)\nfmt.Println(e2.Error())\nfmt.Println(e2)\n```\nOutput:\n```\n*main.MyErr\ncustom\ncustom\n```\n`&MyErr{}` satisfies `error` purely because it has the one required method — no different from how any other interface satisfaction works. Notice `fmt.Println(e2)` printed `\"custom\"` directly, without explicitly calling `.Error()` — exactly like Chapter 5.5's `Stringer`, `fmt`'s printing functions automatically call `Error()` on anything satisfying the `error` interface.\n\n### ⚠️ Common Mistakes\n\n- **Ignoring a returned error entirely** (discarding it with `_`, or simply not checking `err != nil` before using the result). Chapter 4.2 already flagged this — it's worth repeating here as the single most common real Go anti-pattern, since a function that returned an error was telling you specifically that its result might not be trustworthy.\n- **Checking an error, but not returning or otherwise handling it — just logging and continuing as if nothing happened.** An error usually means the following code's assumptions no longer hold; continuing past it silently (rather than returning, retrying deliberately, or providing a genuine fallback) tends to just relocate the failure somewhere more confusing.\n- **Reaching for panics (Chapter 6.3) as Go's version of exceptions.** They exist, but idiomatic Go reserves them for genuinely unrecoverable situations — ordinary, expected failure conditions (a missing file, invalid input, a network timeout) are handled with returned errors, checked explicitly, every time.\n- **Forgetting a custom error type needs a pointer receiver almost always** (as `*MyErr` here) — this connects directly to Chapter 5.9's `nil`-interface gotcha, since a value-receiver error type sidesteps that specific trap differently than a pointer-receiver one does; Chapter 6.2 covers the practical guidance.\n\n### How this connects\n\nChapter 6.2 covers creating richer errors (`fmt.Errorf`, wrapping one error inside another) and inspecting them (`errors.Is`/`errors.As`) — everything genuinely useful beyond the bare `errors.New` this chapter introduced. Chapter 6.3 covers `panic`/`recover`, Go's separate, deliberately narrower mechanism for truly exceptional situations.\n\n### Quick recap\n\n- `error` is a built-in interface requiring one method: `Error() string`. Any type with that method satisfies it.\n- A function that can fail returns `(result, error)`; `nil` means success. `if err != nil` immediately after the call is the idiomatic, expected check.\n- `errors.New(\"message\")` creates a simple error from a string;
