 as Example 4 demonstrated.\n- **Using long, descriptive names for genuinely small-scope, short-lived variables**, or short cryptic names for widely-visible exported ones. Idiomatic Go inverts what feels natural coming from some other languages: brevity scales with how local and short-lived a name is.\n- **Returning an interface from a constructor function \"for flexibility,\" when a concrete type would do.** This throws away real information the caller might need (extra methods, direct field access) for a flexibility that's usually never actually exercised — return concrete types, accept interfaces, is the standard-library's own consistent pattern.\n\n### How this connects\n\nChapter 8.5 covers common pitfalls that often trace directly back to *not* following one of these conventions — a `Get`-prefixed getter isn't a bug, but the habits in this chapter are exactly what make Go code predictable enough that genuine bugs stand out more easily against a consistent backdrop.\n\n### Quick recap\n\n- Name length should roughly track scope: short names (`i`, `err`, `ctx`) for small, local, short-lived things; fuller names for widely-visible exported ones.\n- No `Get` prefix on simple accessor methods (`Name()`, not `GetName()`) — a strong, if compiler-unenforced, Go convention.\n- Single-method interfaces are named after that method plus `-er` (`Reader`, `Writer`, `Stringer`) — the pattern behind every interface met so far in this book.\n- Never repeat a package's own name inside its exported identifiers (`stutter.Config`, not `stutter.StutterConfig`) — the package name already provides that context at the call site.\n- Accept the narrowest interface that does the job; return concrete types — maximizes flexibility for callers on both ends."}, {"id": "8.5", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 5, "slug": "common-pitfalls-gotchas", "fullTitle": "Common Pitfalls & Gotchas", "title": "Common Pitfalls & Gotchas", "md": "### Why this matters\n\nThis chapter is a deliberate collection point — some genuinely new gotchas, plus pointers back to the ones already covered in depth earlier, gathered here as the \"if something feels subtly wrong, check this list first\" reference.\n\n### The core idea\n\nMost of Go's real gotchas share a common shape: something that looks like it should obviously do X, compiles without complaint, and quietly does something adjacent to X instead — a shadowed variable that looks reassigned, a slice mutation that looks shared. None of what follows is a language defect; each is a direct, logical consequence of a rule covered earlier in this book, just showing up in a spot easy to not expect it.\n\n### Examples\n\n**1. Variable shadowing with `:=` — a real, easy-to-introduce bug, verified directly.**\n```go\nfunc mayFail(fail bool) (int, error) {\n\tif fail {\n\t\treturn 0, errors.New(\"it failed\")\n\t}\n\treturn 42, nil\n}\n\nfunc doWork(fail bool) (int, error) {\n\tresult, err := 0, error(nil)\n\tif true {\n\t\tresult, err := mayFail(fail) // shadows outer result, err!\n\t\tfmt.Println(\"inner:\", result, err)\n\t}\n\treturn result, err // outer result/err never actually set!\n}\n\nr, err := doWork(true)\nfmt.Println(\"outer:\", r, err)\n```\nOutput:\n```\ninner: 0 it failed\nouter: 0 <nil>\n```\nInside the `if` block, `result, err := mayFail(fail)` declares **brand-new** `result`/`err` variables scoped only to that block — because at least one name on the left of `:=` is new in that inner scope, Go creates fresh variables rather than reusing the outer ones (Chapter 1.3's `:=` rule, applied in a genuinely dangerous spot). The outer `result`/`err` — the ones actually returned — never get the real error at all. `go vet` doesn't catch this by default, but a dedicated analyzer does:\n```\ngo run golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@latest .\n```\n```\n.../shadow.go:18:3: declaration of \"result\" shadows declaration at line 16\n.../shadow.go:18:11: declaration of \"err\" shadows declaration at line 16\n```\n(This tool, unlike `go build`/`go vet`, always prints the file's full absolute path rather than a relative `./shadow.go` — trimmed to `.../shadow.go` above; the exact path on your own machine will differ.) This tool isn't part of `go vet`'s default set (it's opt-in, and genuinely noisy on some codebases) but is worth running deliberately on code with this exact shape — nested nested blocks reusing `err`/`result`-style names.\n\n**2. Appending to a slice inside a function doesn't always reach the caller — verified in both possible cases.**\n```go\nfunc addItem(items []int, item int) {\n\titems = append(items, item)\n}\n\nitems := make([]int, 0, 5)\naddItem(items, 1)\nfmt.Println(items, len(items))\n```\nOutput:\n```\n[] 0\n```\nEven with spare capacity (5, unused), the caller's `items` is completely unaffected — `append` inside `addItem` reassigned the *local* `items` variable to a new slice header; the caller's own variable was never touched, since slices are passed by value (Chapter 2.5) — only the underlying array can be shared, never the length/capacity/pointer triple itself.\n```go\nitems2 := []int{1, 2, 3}\naddItem(items2, 4)\nfmt.Println(items2)\n```\nOutput:\n```\n[1 2 3]\n```\nSame result even when capacity is exhausted and `append` is forced to allocate a new array — either way, the caller's slice header is simply never updated, because `addItem` never returned anything for the caller to reassign. The fix, whenever a function needs to genuinely grow a caller's slice, is to **return** the new slice and have the caller reassign: `items = addItem(items, 1)`.\n\n### A reference to gotchas already covered in depth\n\nSeveral of this book's most important traps got their own full chapters earlier, precisely because they deserved more than a passing mention:\n\n- **The `nil`-interface gotcha** (Chapter 5.9) — a `nil` pointer of a concrete type, once assigned into an interface variable, is no longer `== nil`.\n- **Slice aliasing and the silent-overwrite trap** (Chapter 2.6) — appending to a sub-slice within its inherited capacity can corrupt another slice sharing the same underlying array.\n- **The pre-1.22 loop-variable-capture bug** (Chapter 4.5) — fixed unconditionally on this book's toolchain, but worth recognizing in older code/blog posts.\n- **Goroutine leaks and `nil` channels** (Chapter 7.13) — a goroutine blocked forever on a channel nobody reads leaks permanently and silently.\n- **`string(intValue)` converting a code point, not digits** (Chapter 2.3) — caught directly by `go vet`.\n- **JSON numbers decoding to `float64`, never `int`, inside `interface{}`** (Chapter 7.5).\n\n### ⚠️ Common Mistakes\n\n- **Reusing `err`/`result`-style names inside a nested block with `:=`**, silently shadowing the outer variable rather than reassigning it. Prefer plain `=` (with the outer variable already declared) when the intent is genuinely to reassign, reserving `:=` for genuinely new variables.\n- **Expecting a function that `append`s to a received slice parameter to have that change visible to the caller.** As Example 2 proved in both the spare-capacity and exhausted-capacity cases, it never is — the function must return the new slice, and the caller must reassign it.\n- **Treating this chapter as the complete list of Go gotchas.** It's a deliberate cross-reference point, not exhaustive — the deepest, most important ones earned their own full chapters earlier in this book precisely because a single paragraph wouldn't have done them justice.\n- **Assuming `go vet`'s default checks catch every subtle correctness issue.** As Example 1 showed, some genuinely valuable checks (like shadow detection) are separate, opt-in tools specifically because they're prone to false positives on otherwise-fine code — worth knowing they exist, without assuming `go vet` alone is a complete safety net.\n\n### How this connects\n\nThis chapter deliberately sits right before Chapter 8.6's debugging chapter — many of the bugs collected here are exactly the kind that a debugger (rather than a `Printf`) is the fastest way to actually catch in real, larger code.\n\n### Quick recap\n\n- `:=` inside a nested block creates new, shadowed variables the moment any name on its left is new to that block — a genuine, easy-to-introduce bug when reassignment was actually intended. `golang.org/x/tools`'s `shadow` analyzer (opt-in, not part of default `go vet`) catches this specifically.\n- Appending to a slice parameter inside a function never updates the caller's own slice variable, regardless of spare capacity — the function must return the new slice for the caller to reassign.\n- This book's other major gotchas (the `nil`-interface trap, slice aliasing, pre-1.22 loop variables, goroutine leaks, `string(int)`, JSON's `float64`-only numbers) each got a full chapter of their own — this chapter is the reference point back to all of them."}, {"id": "8.6", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 6, "slug": "debugging-go-programs", "fullTitle": "Debugging Go Programs", "title": "Debugging Go Programs", "md": "### Why this matters\n\nReading code and guessing what's wrong only goes so far. Real debugging means pausing execution, inspecting variables at that exact moment, and stepping through line by line — Go has a genuine, full-featured debugger for exactly this, plus simpler print-based tools for when a full debugging session is more than the situation needs.\n\n### The core idea\n\n**Delve** (`dlv`) is Go's standard debugger — set breakpoints, inspect variables, step through execution line by line, in a real interactive session. For lighter needs, the **`log`** package extends `fmt`-style printing with automatic timestamps (and optionally file/line info) — genuinely more useful than bare `fmt.Println` the moment debug output needs to show *when* something happened, not just what.\n\n### Examples\n\n**1. A real Delve session — breakpoint, inspect, step, continue.**\n```go\nfunc add(a, b int) int {\n\tsum := a + b\n\treturn sum\n}\n\nfunc main() {\n\tx := 5\n\ty := 10\n\tresult := add(x, y)\n\tfmt.Println(\"result:\", result)\n}\n```\nRunning `dlv debug main.go` and interacting with it:\n```\n(dlv) break main.add\nBreakpoint 1 set at 0x4bcb64 for main.add() ./main.go:5\n(dlv) continue\n> [Breakpoint 1] main.add() ./main.go:5 (hits goroutine(1):1 total:1)\n=>   5:\tfunc add(a, b int) int {\n     6:\t\tsum := a + b\n     7:\t\treturn sum\n(dlv) print a\n5\n(dlv) print b\n10\n(dlv) next\n> main.add() ./main.go:6\n(dlv) next\n> main.add() ./main.go:7\n=>   7:\t\treturn sum\n(dlv) print sum\n15\n(dlv) continue\nresult: 15\nProcess ... has exited with status 0\n```\n`break main.add` sets a breakpoint at the start of `add`; `continue` runs until it's hit; `print a`/`print b` inspect the actual argument values at that exact paused moment; `next` steps one line at a time (notice `sum` isn't available to `print` until *after* the line that assigns it has actually executed); a final `continue` lets the program run to completion. This is genuinely the same experience VS Code's Go extension (Chapter 0.2) gives you visually — clicking to set breakpoints and hovering to inspect variables is this exact same Delve session, with a UI on top.\n\n**2. `log` — `fmt`-style printing with automatic timestamps.**\n```go\nlog.Println(\"starting up\")\nlog.Printf(\"value: %d\", 42)\nlog.SetFlags(log.Ldate | log.Ltime | log.Lshortfile)\nlog.Println(\"with file info now\")\n```\nOutput:\n```\n2026/09/07 17:36:49 starting up\n2026/09/07 17:36:49 value: 42\n2026/09/07 17:36:49 logdemo.go:9: with file info now\n```\n`log.Println`/`log.Printf` work exactly like their `fmt` counterparts, but automatically prefix a timestamp — genuinely useful the moment debug output needs to show *when* something happened relative to something else, not just its value. `log.SetFlags` controls exactly what gets prefixed; adding `log.Lshortfile` includes the calling file and line number automatically, without you writing it by hand.\n\n**3. `go build -race` / `go run -race` — the race detector, Chapter 7.11's own debugging tool for concurrency specifically.**\n\nChapter 7.11 already demonstrated this directly: `-race` instruments a program to detect genuine data races (unsynchronized concurrent access to the same memory) and reports the exact conflicting goroutines and lines. It's worth repeating here as a debugging tool in its own right — reaching for `-race` the moment a bug's symptoms look inconsistent or timing-dependent (different results on different runs) is often far faster than trying to reason through a suspected race by hand.\n\n### ⚠️ Common Mistakes\n\n- **Reaching only for `fmt.Println` debug statements, sprinkled through the code and removed afterward**, for a bug that would be far faster to diagnose with a real breakpoint and variable inspection. Delve (or an editor's integrated debugger built on it) genuinely saves time the moment a bug needs \"what's the actual state right here\" rather than \"does execution even reach this line.\"\n- **Forgetting `print`ing a variable in Delve before it's actually been assigned** produces an error, not a stale/default value — Example 1 showed exactly this (`sum` unavailable at line 6, available at line 7) — this is informative, not a tool malfunction, telling you precisely when a variable comes into existence.\n- **Using bare `fmt.Println` for debug output meant to be compared across time** (how long between two events, in what order things happened across goroutines) instead of `log`, losing the automatic timestamp that would have made that comparison trivial.\n- **Not reaching for `-race` the moment a bug's symptoms are inconsistent between runs.** Timing-dependent, \"sometimes wrong\" behavior is close to the textbook signature of a data race — Chapter 7.11's own examples showed exactly this pattern.\n\n### How this connects\n\nChapter 8.5's shadowing and slice-parameter gotchas, and Chapter 7.11's data races, are exactly the kinds of bugs where the tools in this chapter — breakpoints for state inspection, `-race` for concurrency specifically — earn their keep over guessing from a read-through alone.\n\n### Quick recap\n\n- Delve (`dlv debug`) is Go's real, interactive debugger — `break`, `continue`, `next`, and `print` cover the core workflow of pausing execution and inspecting real values at that moment.\n- VS Code's integrated Go debugger (Chapter 0.2) is this same Delve session, with a visual UI (click to set breakpoints, hover to inspect) on top.\n- `log.Println`/`Printf` extend `fmt`'s printing with automatic timestamps (and optionally file/line info via `SetFlags`) — better than bare `fmt` for debug output where timing or origin matters.\n- `-race` (Chapter 7.11) is itself a genuine debugging tool — reach for it specifically when a bug's symptoms vary inconsistently between runs."}, {"id": "8.7", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 7, "slug": "cross-compilation-build-tags", "fullTitle": "Cross-Compilation & Build Tags", "title": "Cross-Compilation & Build Tags", "md": "### Why this matters\n\nThis is one of Go's genuine, practical superpowers: producing a real binary for a completely different operating system and CPU architecture than the one you're sitting at, with zero extra tooling — just two environment variables. Build tags are the companion tool, letting different files provide platform-specific implementations that the compiler picks automatically.\n\n### The core idea\n\n`GOOS` and `GOARCH` (both readable via `go env`) control what platform `go build` targets — set them differently, and the exact same source code produces a binary for a different OS/CPU combination entirely. A file named with a `_GOOS.go` or `_GOARCH.go` suffix (like `_linux.go` or `_windows.go`) is automatically included only when building for that platform; a `//go:build` comment at the top of a file achieves the identical effect explicitly, for conditions the filename convention can't express.\n\n### Examples\n\n**1. Cross-compiling for three completely different platforms, from one Linux machine.**\n```\nGOOS=windows GOARCH=amd64 go build -o hello_windows.exe .\n```\n```\nhello_windows.exe: PE32+ executable (console) x86-64, for MS Windows, 16 sections\n```\n```\nGOOS=darwin GOARCH=arm64 go build -o hello_mac_arm64 .\n```\n```\nhello_mac_arm64: Mach-O 64-bit arm64 executable, flags:<|DYLDLINK|PIE>\n```\n```\nGOOS=linux GOARCH=arm GOARM=7 go build -o hello_linux_arm .\n```\n```\nhello_linux_arm: ELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), statically linked, ...\n```\nThree genuinely different, real executable formats — a Windows PE binary, a macOS Mach-O binary, and a 32-bit ARM Linux ELF binary — all produced on the same ordinary Linux machine, with the identical source code, just by setting two environment variables before `go build`. `go tool dist list` shows every supported `GOOS`/`GOARCH` combination directly from the toolchain itself.\n\n**2. Filename-suffix build tags — the automatic, no-comment-needed convention.**\n```go\n// platform_linux.go\nfunc platformName() string {\n\treturn \"Linux-specific code\"\n}\n\n// platform_windows.go\nfunc platformName() string {\n\treturn \"Windows-specific code\"\n}\n\n// main.go\nfunc main() {\n\tfmt.Println(platformName())\n}\n```\nBuilding normally (on Linux):\n```\nLinux-specific code\n```\nCross-compiling for Windows:\n```\nWindows-specific code\n```\nBoth files declare the exact same function name (`platformName`) and would normally conflict — but the `_linux.go`/`_windows.go` filename suffixes tell the compiler to include exactly one of them depending on the target `GOOS`, so there's never actually a conflict at all. This is the standard, idiomatic way to provide a platform-specific implementation behind one common function signature.\n\n**3. `//go:build` — the explicit form, for anything the filename convention can't express.**\n```go\n//go:build linux\n\npackage main\n\nfunc platformName() string {\n\treturn \"explicit build-tag linux code\"\n}\n```\n```go\n//go:build windows\n\npackage main\n\nfunc platformName() string {\n\treturn \"explicit build-tag windows code\"\n}\n```\nBuilding normally:\n```\nexplicit build-tag linux code\n```\nThe `//go:build` comment (which must appear before the `package` clause, with only blank lines and other comments allowed above it) does exactly what the filename suffix did in Example 2, but supports genuinely richer conditions — `//go:build linux && amd64`, `//go:build !windows`, or checking a custom build tag passed via `go build -tags mytag` — anything the filename convention alone can't express. Per `go help buildconstraint`, the constraint *should* be followed by a blank line before `package` — this is a real, official recommendation, but purely to keep `gofmt`/`go doc` from mistaking it for the package's own doc comment; verified directly, the toolchain enforces the constraint itself correctly either way, blank line or not.\n\n### ⚠️ Common Mistakes\n\n- **Assuming cross-compilation requires a separate toolchain, emulator, or virtual machine per target platform.** It doesn't — Go's compiler and standard library are written to make this trivial; two environment variables and an ordinary `go build` are genuinely all that's needed for the vast majority of programs.\n- **Assuming a `//go:build` comment needs a blank line before `package` to actually function.** It doesn't — verified directly, the constraint is enforced correctly either way. The blank line is a real, officially-recommended convention (per `go help buildconstraint`), but purely so tooling doesn't mistake the constraint for the package's own doc comment, not a functional requirement.\n- **Defining the same function/type in two files without either a filename suffix or a `//go:build` tag distinguishing them.** This is a genuine \"redeclared\" compile error — the mechanisms in this chapter are exactly what let two files coexist with identical declarations, by ensuring only one is ever actually compiled for a given target.\n- **Forgetting that code using platform-specific packages** (like something only available on Windows) **still needs a build-tagged file to avoid breaking compilation for every other platform**, even if you personally only ever build for one OS.\n\n### How this connects\n\nThis is the last chapter before Part IX's capstone — cross-compilation in particular is exactly the kind of practical capability that makes distributing a finished Go tool (Chapter 9.2's capstone, or any real command-line program) genuinely simple: one small program, built once per target platform, each a single self-contained binary needing nothing else installed.\n\n### Quick recap\n\n- `GOOS`/`GOARCH` environment variables control cross-compilation target — `go build` alone, with no other tooling, produces a real binary for a different OS/CPU combination.\n- `go tool dist list` shows every platform combination the toolchain supports.\n- A `_GOOS.go`/`_GOARCH.go` filename suffix automatically restricts a file to builds targeting that platform — the standard way to provide platform-specific implementations behind one shared function signature.\n- `//go:build condition` (appearing before `package`, conventionally followed by a blank line so tooling doesn't mistake it for a doc comment — though the constraint itself works either way) is the explicit, more expressive form, needed for conditions the filename convention can't capture."}, {"id": "9.1", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis: architecture, capstone & afterword", "chapNum": 1, "slug": "designing-a-go-program-from-scratch", "fullTitle": "Designing a Go Program From Scratch", "title": "Designing a Go Program From Scratch", "md": "### Why this matters\n\nEvery chapter so far taught one piece at a time. Before the capstone puts them all together, it's worth walking through *how* a real Go program actually gets designed — not code first, but the sequence of decisions that determines what the code should even look like.\n\n### The core idea\n\nDesigning a Go program well means answering a small, consistent set of questions before writing a line: what does it actually need to do, what shape should the data take, where do errors need to be caught and reported, and — genuinely specific to Go — does this problem actually benefit from concurrency, or would that just be complexity for its own sake. Chapter 9.2's capstone is a concurrent URL health checker: given a list of URLs, check each one, report whether it responded and how fast. This chapter walks through *why* it ended up shaped the way it did.\n\n### Step 1: What does it actually need to do?\n\nStated plainly, before any code: given a list of URLs (from a file or the command line), check each one over HTTP, and report its status code and response time — or a clear error if it didn't respond at all, within some limit. Writing this sentence *before* touching a keyboard is worth doing deliberately — it's what everything else gets checked against later.\n\n### Step 2: What's the data?\n\nOne clear answer falls out immediately: a **`Result`** — one URL, its outcome. Exactly the shape a `struct` (Chapter 2.8) exists for:\n```go\ntype Result struct {\n\tURL        string\n\tStatusCode int\n\tDuration   time.Duration\n\tErr        error\n}\n```\nNotice `Err` sits *inside* the result rather than being returned separately — this is deliberate. Chapter 6.1's `(value, error)` pattern is right for a single operation that either fully succeeds or fully fails; here, checking *one* URL failing shouldn't stop the *whole batch* from reporting on every other URL. A per-item `Err` field, checked individually when printing each result, is the better fit for \"many independent things, each of which can independently fail.\"\n\n### Step 3: Where does concurrency actually help — and where would it just be complexity?\n\nChecking one URL means waiting on a network round-trip — time the program spends doing nothing but waiting. Checking ten URLs one at a time means paying that wait ten times in a row, sequentially, for no real reason: nothing about checking URL #2 depends on URL #1 finishing first. This is exactly the shape Chapter 7.13's worker pool pattern was built for — genuinely independent units of work, each I/O-bound, where doing them concurrently produces a real, measurable speedup rather than added risk for no benefit. A CPU-bound, sequential-by-nature task (say, computing a running total) would *not* have earned concurrency just because Go makes it available — the decision has to follow from the actual shape of the problem, not from \"Go has goroutines, so use them.\"\n\n### Step 4: What does the concurrent shape actually need?\n\nOnce \"worker pool\" is the answer, several more decisions follow directly from Part VII's own content:\n\n- **A bounded number of workers** (Chapter 7.8/7.13), not one goroutine per URL — genuinely important the moment \"a list of URLs\" might mean thousands, where launching that many concurrent HTTP requests at once would be its own problem.\n- **A per-request timeout** (Chapter 7.12's `context.WithTimeout`) — one slow or hanging server shouldn't be allowed to block that worker (and, transitively, the whole batch) forever.\n- **Preserving input order in the output**, even though goroutines finish in an unpredictable order (Chapter 7.8's non-determinism, verified directly there) — solved by tagging each job with its original index and writing results back into a pre-sized slice at that exact index, not just appending as they arrive.\n- **`sync.WaitGroup`** (Chapter 7.8/7.11) to know when every worker has genuinely finished, so the results channel can be closed and the final output produced.\n\n### Step 5: What's the actual command-line shape?\n\nChapter 6.9's `flag` package answers this directly: a `-file` flag for a file of URLs, `-workers` and `-timeout` to control the concurrency shape from Step 4, and `-output` to choose between human-readable text and machine-readable JSON (Chapter 7.5) — genuinely useful the moment this tool's output needs to feed into something else, rather than just being read by a person.\n\n### Step 6: Where do the real edge cases live?\n\nBefore writing the happy path, it's worth listing what can actually go wrong: no URLs given at all, a `-file` that doesn't exist, a URL that's malformed, a request that times out, a request that fails outright (DNS failure, connection refused), a server that responds with a real but non-2xx status code (which isn't a *failure* to check — the check succeeded; the site just returned 404). Each of these maps to a specific, deliberate decision in Chapter 9.2's actual code — worth having the list *before* writing it, so nothing gets discovered as an afterthought.\n\n### ⚠️ Common Mistakes\n\n- **Writing the code before writing the one-sentence description of what it does.** Step 1's plain-language sentence is what every later decision gets checked against — skipping it tends to produce a program that grows features nobody asked for and misses ones that were actually needed.\n- **Reaching for goroutines because the language makes them easy, not because the problem's shape genuinely calls for them.** Step 3's distinction (independent, I/O-bound units of work) is the actual test — not \"would concurrency be interesting to add.\"\n- **Designing the data shape (`Result`) as an afterthought, once the logic is half-written.** Getting the struct right first — deciding where an error genuinely belongs, whether it's per-item or per-batch — shapes everything that follows far more than deciding it late and retrofitting.\n- **Skipping the edge-case list until testing reveals them one at a time.** Chapter 8.2's table-driven tests are exactly the tool for verifying every case on Step 6's list systematically, but the list itself is worth having before any code, not discovered reactively.\n\n### How this connects\n\nChapter 9.2 is this exact design, built and verified — every decision walked through here (the `Result` struct, the worker pool, the timeout, the flag-based CLI) shows up there as real, running code.\n\n### Quick recap\n\n- Start with one plain-language sentence describing what the program actually does — check every later decision against it.\n- Let the data's natural shape (a struct, here) come before the logic; decide deliberately where an error genuinely belongs (per-operation vs. per-item in a batch).\n- Reach for concurrency specifically when work is independent and I/O-bound — not merely because Go makes it available.\n- List the real edge cases before writing the happy path — a per-request timeout, ordering guarantees despite non-deterministic completion, and genuinely distinct failure modes (a check that errors vs. a check that succeeds with a non-2xx status) all belong on that list from the start."}, {"id": "9.2", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis: architecture, capstone & afterword", "chapNum": 2, "slug": "capstone-build-something-real", "fullTitle": "Capstone: Build Something Real", "title": "Capstone: Build Something Real", "md": "### Why this matters\n\nThis is where every piece from this book stops being a separate example and becomes one real, working program: `linkcheck`, a concurrent URL health checker. Every line below was actually written, built, run, and tested — including against real local test servers exercising success, timeout, 404, and connection-refused cases.\n\n### The program\n\n`checker.go` — the data shape and the concurrency:\n```go\npackage main\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"net/http\"\n\t\"sync\"\n\t\"time\"\n)\n\n// Result holds the outcome of checking a single URL.\ntype Result struct {\n\tURL        string\n\tStatusCode int\n\tDuration   time.Duration\n\tErr        error\n}\n\n// String makes Result satisfy fmt.Stringer, controlling how it prints.\nfunc (r Result) String() string {\n\tif r.Err != nil {\n\t\treturn fmt.Sprintf(\"%-40s ERROR: %v\", r.URL, r.Err)\n\t}\n\treturn fmt.Sprintf(\"%-40s %d (%v)\", r.URL, r.StatusCode, r.Duration.Round(time.Millisecond))\n}\n\n// resultJSON is a separate shape for JSON output, since error doesn't\n// marshal usefully on its own.\ntype resultJSON struct {\n\tURL        string `json:\"url\"`\n\tStatusCode int    `json:\"status_code,omitempty\"`\n\tDurationMS int64  `json:\"duration_ms\"`\n\tError      string `json:\"error,omitempty\"`\n}\n\nfunc (r Result) MarshalJSON() ([]byte, error) {\n\trj := resultJSON{\n\t\tURL:        r.URL,\n\t\tStatusCode: r.StatusCode,\n\t\tDurationMS: r.Duration.Milliseconds(),\n\t}\n\tif r.Err != nil {\n\t\trj.Error = r.Err.Error()\n\t}\n\treturn json.Marshal(rj)\n}\n\n// checkOne performs a single HTTP GET against url, respecting ctx's deadline.\nfunc checkOne(ctx context.Context, client *http.Client, url string) Result {\n\tstart := time.Now()\n\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)\n\tif err != nil {\n\t\treturn Result{URL: url, Err: fmt.Errorf(\"building request: %w\", err)}\n\t}\n\tresp, err := client.Do(req)\n\tif err != nil {\n\t\treturn Result{URL: url, Duration: time.Since(start), Err: fmt.Errorf(\"request failed: %w\", err)}\n\t}\n\tdefer resp.Body.Close()\n\treturn Result{URL: url, StatusCode: resp.StatusCode, Duration: time.Since(start)}\n}\n\n// checkAll runs a worker pool of size `workers` over urls, each request\n// bounded by perRequestTimeout, and returns results in the same order the\n// URLs were given (not necessarily the order they finished).\nfunc checkAll(urls []string, workers int, perRequestTimeout time.Duration) []Result {\n\ttype indexedResult struct {\n\t\ti int\n\t\tr Result\n\t}\n\n\tjobs := make(chan int)\n\tresults := make(chan indexedResult)\n\tvar wg sync.WaitGroup\n\n\tclient := &http.Client{}\n\n\tfor w := 0; w < workers; w++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tfor i := range jobs {\n\t\t\t\tctx, cancel := context.WithTimeout(context.Background(), perRequestTimeout)\n\t\t\t\tr := checkOne(ctx, client, urls[i])\n\t\t\t\tcancel()\n\t\t\t\tresults <- indexedResult{i: i, r: r}\n\t\t\t}\n\t\t}()\n\t}\n\n\tgo func() {\n\t\tfor i := range urls {\n\t\t\tjobs <- i\n\t\t}\n\t\tclose(jobs)\n\t}()\n\n\tgo func() {\n\t\twg.Wait()\n\t\tclose(results)\n\t}()\n\n\tout := make([]Result, len(urls))\n\tfor ir := range results {\n\t\tout[ir.i] = ir.r\n\t}\n\treturn out\n}\n```\n\n`main.go` — reading input and driving the whole thing:\n```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"encoding/json\"\n\t\"flag\"\n\t\"fmt\"\n\t\"os\"\n\t\"time\"\n)\n\nfunc readURLsFromFile(path string) ([]string, error) {\n\tf, err := os.Open(path)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"opening %s: %w\", path, err)\n\t}\n\tdefer f.Close()\n\n\tvar urls []string\n\tscanner := bufio.NewScanner(f)\n\tfor scanner.Scan() {\n\t\tline := scanner.Text()\n\t\tif line == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\turls = append(urls, line)\n\t}\n\treturn urls, scanner.Err()\n}\n\nfunc main() {\n\tfile := flag.String(\"file\", \"\", \"path to a file of URLs, one per line\")\n\tworkers := flag.Int(\"workers\", 5, \"number of concurrent workers\")\n\ttimeout := flag.Duration(\"timeout\", 5*time.Second, \"per-request timeout\")\n\toutput := flag.String(\"output\", \"text\", \"output format: text or json\")\n\tflag.Parse()\n\n\turls := flag.Args()\n\tif *file != \"\" {\n\t\tfromFile, err := readURLsFromFile(*file)\n\t\tif err != nil {\n\t\t\tfmt.Fprintln(os.Stderr, \"error:\", err)\n\t\t\tos.Exit(1)\n\t\t}\n\t\turls = append(urls, fromFile...)\n\t}\n\n\tif len(urls) == 0 {\n\t\tfmt.Fprintln(os.Stderr, \"no URLs given (use -file or list them as arguments)\")\n\t\tos.Exit(1)\n\t}\n\n\tresults := checkAll(urls, *workers, *timeout)\n\n\tswitch *output {\n\tcase \"json\":\n\t\tenc := json.NewEncoder(os.Stdout)\n\t\tenc.SetIndent(\"\", \"  \")\n\t\tif err := enc.Encode(results); err != nil {\n\t\t\tfmt.Fprintln(os.Stderr, \"error encoding results:\", err)\n\t\t\tos.Exit(1)\n\t\t}\n\tdefault:\n\t\tfor _, r := range results {\n\t\t\tfmt.Println(r)\n\t\t}\n\t}\n}\n```\n\n### Running it, against a real local server exercising every case\n\nA local test server was set up with four endpoints: `/fast` (responds immediately), `/slow` (sleeps 3 seconds), `/notfound` (returns 404), plus one address nothing is listening on at all.\n```\n./linkcheck -workers 3 -timeout 1s http://localhost:8099/fast http://localhost:8099/slow http://localhost:8099/notfound http://localhost:9999/unreachable\n```\nOutput:\n```\nhttp://localhost:8099/fast               200 (1ms)\nhttp://localhost:8099/slow               ERROR: request failed: Get \"http://localhost:8099/slow\": context deadline exceeded\nhttp://localhost:8099/notfound           404 (1ms)\nhttp://localhost:9999/unreachable        ERROR: request failed: Get \"http://localhost:9999/unreachable\": dial tcp 127.0.0.1:9999: connect: connection refused\n```\nEvery one of Chapter 9.1's Step 6 edge cases shows up correctly: a real success (`/fast`), a genuine timeout (`/slow`, correctly cut off by the 1-second `-timeout` rather than waiting the full 3 seconds), a real non-2xx status treated as a successful *check* (`/notfound`'s `404` — the site responded, it just doesn't have that page), and a connection failure (nothing listening on `:9999`). Results print in the exact order the URLs were given, despite the underlying goroutines completing in whatever order the network actually responded.\n\n### JSON output, for feeding into something else\n\n```\n./linkcheck -workers 3 -timeout 1s -output json http://localhost:8099/fast http://localhost:8099/notfound http://localhost:9999/unreachable\n```\n```json\n[\n  {\n    \"url\": \"http://localhost:8099/fast\",\n    \"status_code\": 200,\n    \"duration_ms\": 2\n  },\n  {\n    \"url\": \"http://localhost:8099/notfound\",\n    \"status_code\": 404,\n    \"duration_ms\": 2\n  },\n  {\n    \"url\": \"http://localhost:9999/unreachable\",\n    \"duration_ms\": 1,\n    \"error\": \"request failed: Get \\\"http://localhost:9999/unreachable\\\": dial tcp 127.0.0.1:9999: connect: connection refused\"\n  }\n]\n```\nNotice `status_code` and `error` both use `omitempty` (Chapter 2.9/7.5) — a successful check's JSON has no meaningless `\"error\": \"\"` field, and a failed check's JSON has no meaningless `\"status_code\": 0` implying \"responded with status zero.\"\n\n### Reading URLs from a file, and the real error-handling paths\n\n```\n./linkcheck -file urls.txt -timeout 1s\n```\n`urls.txt` had a blank line in it (correctly skipped, Chapter 7.4's `bufio.Scanner` pattern) and produced identical results to typing the URLs directly. The two genuine failure paths also behave exactly as designed:\n```\n./linkcheck\n```\n```\nno URLs given (use -file or list them as arguments)\n```\n```\n./linkcheck -file doesnotexist.txt\n```\n```\nerror: opening doesnotexist.txt: open doesnotexist.txt: no such file or directory\n```\nBoth exit with status `1` (`os.Exit(1)`) — genuinely important for a command-line tool, since a non-zero exit status is exactly what lets a shell script or CI pipeline calling `linkcheck` detect that something went wrong.\n\n### Verified clean under the race detector, and covered by real tests\n\n```\ngo build -race -o linkcheck_race .\n./linkcheck_race -workers 5 -timeout 1s -file urls.txt\n```\nNo warnings at all — the worker pool's channel-based coordination (Chapter 7.9/7.13) needs no explicit mutex anywhere, and `-race` confirms it's genuinely safe, not just apparently working.\n\n`checker_test.go` tests the two riskiest parts directly — a single check against a real `httptest` server (Chapter 7.14) succeeding and one against an address nothing listens on failing, plus a dedicated test confirming result ordering survives the genuinely non-deterministic completion order of concurrent workers (Chapter 9.1's Step 4 design decision, now verified rather than just assumed):\n```go\nfunc TestCheckAllPreservesOrder(t *testing.T) {\n\tserver := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tw.WriteHeader(http.StatusOK)\n\t}))\n\tdefer server.Close()\n\n\turls := []string{server.URL + \"/1\", server.URL + \"/2\", server.URL + \"/3\"}\n\tresults := checkAll(urls, 3, time.Second)\n\n\tfor i, r := range results {\n\t\tif r.URL != urls[i] {\n\t\t\tt.Errorf(\"results[%d].URL = %q, want %q (order not preserved)\", i, r.URL, urls[i])\n\t\t}\n\t}\n}\n```\nRunning `go test -v -race ./...` passed every test cleanly, with the race detector confirming the whole suite clean too.\n\n### How this connects\n\n`linkcheck` genuinely exercises the majority of this book: structs and methods (2.8, 5.3), interfaces satisfied implicitly (`Stringer`, `error`, `json.Marshaler`, all from 5.5/5.6/6.1/7.5), error wrapping (6.2), the `flag` package (6.9), file I/O (7.4), JSON (7.5), a real worker pool with channels, `sync.WaitGroup`, and `context` timeouts (7.8–7.13), real HTTP client usage (7.14), and a table-driven-adjacent test suite verified clean under the race detector (8.1–8.2, 7.11). This is genuinely what a small, real Go tool looks like — not a toy example, but something you could actually keep using.\n\n### Quick recap\n\n- A per-item `Err` field on `Result`, rather than a single batch-level error, correctly models \"many independent operations, each of which can fail on its own.\"\n- A bounded worker pool with per-request `context` timeouts, index-tagged jobs preserving output order, and `sync.WaitGroup`-driven shutdown is the concrete shape Chapter 7.13's pattern takes in a real program.\n- `fmt.Stringer` and a custom `MarshalJSON` give the same `Result` type two genuinely different, purpose-built presentations — one for a human reading a terminal, one for a machine reading JSON.\n- Real edge cases (no input, a missing file, a timeout, a connection failure, a non-2xx response) were each deliberately designed for in Chapter 9.1, then verified for real here — including a race-detector-clean run and a genuine ordering test, not just a hopeful read-through."}, {"id": "9.3", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis: architecture, capstone & afterword", "chapNum": 3, "slug": "afterword-where-to-go-next", "fullTitle": "Afterword: Where to Go Next", "title": "Afterword: Where to Go Next", "md": "You've done it — every real corner of the Go language, from `package main` all the way through goroutines, generics, and a genuinely working concurrent program. Take a moment with that; it's a real, complete foundation, not a partial one.\n\n### What you're actually ready for now\n\nThe honest promise from Chapter 0.1 was fluency in the language, not instant speed writing it under pressure — that second part comes from writing real code and hitting real bugs, starting now. A few concrete, genuinely good next steps:\n\n- **Read real Go source.** The standard library itself (`net/http`, `encoding/json`, the `sort`/`slices` packages you've already used) is exceptionally well-written and entirely readable — you now have every tool needed to actually follow it, not just skim it. This is exactly the payoff this book's earliest chapters promised: reading tools like `nuclei`, `ffuf`, or `gobuster` (or any other real Go codebase) is now \"just more Go,\" not a wall of unfamiliar syntax.\n- **Build something you'll actually use.** A small CLI tool for a task you do repeatedly, genuinely following Chapter 9.1's design process, is worth more practice than a dozen disconnected exercises.\n- **Get comfortable with `go.dev`'s own documentation** — `pkg.go.dev` for any package's real, generated docs (exactly the doc-comment convention from Chapter 1.2), and the official [Effective Go](https://go.dev/doc/effective_go) and [Go Code Review Comments](https://go.dev/wiki/CodeReviewComments) pages, which formalize much of Chapter 8.4's style guidance in more depth.\n\n### Three real, powerful tools this book deliberately left for later\n\nPer `SYLLABUS.md`'s own scoping, three genuinely useful but firmly advanced tools got no full chapter — not because they're unimportant, but because they're each a rabbit hole better explored once the fundamentals (everything before this page) are already solid.\n\n**`reflect`** — inspecting a value's type and structure at runtime, the mechanism `encoding/json` itself is built on. A brief, real taste:\n```go\ntype Point struct {\n\tX, Y int\n}\np := Point{X: 3, Y: 4}\nt := reflect.TypeOf(p)\nv := reflect.ValueOf(p)\nfmt.Println(t.Name(), t.Kind())\nfor i := 0; i < t.NumField(); i++ {\n\tfield := t.Field(i)\n\tfmt.Println(field.Name, v.Field(i))\n}\n```\nOutput:\n```\nPoint struct\nX 3\nY 4\n```\n`reflect.TypeOf`/`ValueOf` let code examine a value's fields, types, and tags (Chapter 2.9's struct tags, read this exact way by `encoding/json` internally) without knowing its concrete type ahead of time. Genuinely powerful, genuinely slower than direct code, and genuinely easy to write something unmaintainable with if reached for by default rather than when truly needed.\n\n**`unsafe`** — deliberately bypassing Go's type safety, for the rare cases that genuinely require it.\n```go\nfmt.Println(unsafe.Sizeof(p))\n```\nOutput:\n```\n16\n```\nYou've actually already used `unsafe.Sizeof` in this book (Chapter 2.1), harmlessly — real `unsafe` usage goes much further (raw pointer arithmetic, reinterpreting memory as a different type) and is exactly what its name says: a real, sharp tool for interfacing with C, implementing extremely low-level data structures, or squeezing out performance the type system otherwise prevents, at the cost of every safety guarantee this book has relied on throughout.\n\n**`cgo`** — calling C code directly from Go.\n```\ngo env CGO_ENABLED\n```\nOn this machine, building normally: `1`. Cross-compiling for a different platform (Chapter 8.7): `0` by default — cgo requires an actual C compiler for the *target* platform, which usually isn't available when cross-compiling, and this is exactly why Go binaries are so trivially portable by default: pure Go code, with cgo disabled, needs nothing but the Go toolchain itself. `cgo` exists for the real, occasional need to use an existing C library from Go — genuinely useful, genuinely something that trades away the effortless cross-compilation Chapter 8.7 demonstrated.\n\n### One honest last thing\n\nThis series treated Go's payoff as specifically practical: an enormous amount of real security and infrastructure tooling — reconnaissance tools, scanners, entire command-and-control frameworks, huge parts of the cloud-native world — is written in exactly the language you've just finished learning. That's not a promise this book can redeem for you; it's simply now true that nothing standing between you and reading (and eventually contributing to, or building your own version of) tools like that is the language itself anymore. That part's done. What you build with it next is genuinely up to you.\n\nGood luck — and go build something real."}, {"id": "10.1", "partNum": 10, "partTitle": "Back Matter", "partMetaphor": "quick-reference cheat sheet & glossary", "chapNum": 1, "slug": "appendix-a-quick-reference-cheat-sheet", "fullTitle": "Appendix A: Quick Reference Cheat Sheet", "title": "Quick Reference Cheat Sheet", "md": "A scannable reference for syntax you half-remember. Every snippet here was verified by actually running it — see the relevant chapter for full explanation and context.\n\n## Basics (Chapters 0–1)\n\n```\ngo run file.go              # compile and run\ngo build -o name file.go    # produce a binary\ngofmt -w file.go            # reformat in place\n```\n```go\nvar x int = 5        // explicit\nx := 5                // inferred, function-scope only\nvar y int             // zero value: 0\nconst Pi = 3.14159\n```\n\n## Types & Data (Chapters 2)\n\n```go\nvar i8 int8; var u64 uint64; var f64 float64  // sized numeric types\nr := 'A'                    // rune (int32), value 65\ns := string(rune(65))       // \"A\" — NOT digits! use strconv.Itoa for that\narr := [3]int{1, 2, 3}      // fixed-size array, value type\ns := []int{1, 2, 3}         // slice: len(s), cap(s)\ns = append(s, 4)            // always reassign the result\nsub := s[1:3]               // shares underlying array\ncp := make([]int, len(s)); copy(cp, s)  // genuine independent copy\nm := map[string]int{\"a\": 1}\nv, ok := m[\"a\"]              // comma-ok: does the key exist?\ndelete(m, \"a\")\ntype Point struct{ X, Y int }\np := Point{X: 1, Y: 2}\n```\n\n## Control Flow (Chapter 3)\n\n```go\nif x > 3 { } else if x > 1 { } else { }\nif v := f(); v > 0 { }        // scoped to the if/else chain\n\nfor i := 0; i < 3; i++ { }    // C-style\nfor i < 3 { }                  // while-equivalent\nfor { break }                  // infinite, exit with break\nfor i := range 3 { }           // 0, 1, 2 (Go 1.22+)\nfor i, v := range slice { }\nfor k, v := range m { }        // order is randomized\n\nswitch x {\ncase 1, 2: \ncase 3:\ndefault:\n}\nswitch { case x > 3: }         // tagless — like if/else if\n\nswitch v := x.(type) {\ncase int:\ncase string:\ndefault:\n}\n\nouter:\nfor i := 0; i < 3; i++ {\n\tfor j := 0; j < 3; j++ {\n\t\tif j == 1 { continue outer }\n\t\tif i == 2 { break outer }\n\t}\n}\n\ndefer f()                       // runs at function return, LIFO order\n```\n\n## Functions (Chapter 4)\n\n```go\nfunc add(a, b int) int { return a + b }\nfunc swap(a, b int) (int, int) { return b, a }\nfunc divide(a, b int) (result int, err error) { return }  // named returns\nfunc sum(nums ...int) int { }         // variadic\nsum(nums...)                           // spread a slice into it\n\nadder := func(a, b int) int { return a + b }   // function value\ncounter := func() func() int {                  // closure\n\tc := 0\n\treturn func() int { c++; return c }\n}()\n```\n\n## Pointers, Methods, Interfaces, Generics (Chapter 5)\n\n```go\np := &x            // address-of\nv := *p             // dereference\npp := p.Field       // automatic deref for field access\n\nfunc (r Rectangle) Area() float64 { }     // value receiver — can't mutate\nfunc (r *Rectangle) Scale(f float64) { }  // pointer receiver — can mutate\n\ntype Shape interface { Area() float64 }   // implicit satisfaction, no \"implements\"\nvar s Shape = Rectangle{}                  // works because it has the method\n\ntype Animal struct{ Name string }\ntype Dog struct{ Animal; Breed string }    // embedding promotes fields/methods\n\nvar x any = 42\nn, ok := x.(int)          // safe type assertion\nswitch x.(type) { case int: }\n\nfunc Max[T int | float64](a, b T) T { }\ntype Stack[T any] struct{ items []T }\n```\n\n## Errors & Packages (Chapter 6)\n\n```go\nif err != nil { return err }\nerr := errors.New(\"message\")\nerr = fmt.Errorf(\"context: %w\", originalErr)   // %w preserves the chain\nerrors.Is(err, ErrSentinel)\nerrors.As(err, &myErrType)\n\ndefer func() {\n\tif r := recover(); r != nil { /* handle */ }\n}()\npanic(\"something unrecoverable\")\n\n// go.mod:  module example.com/name\n//          go 1.26\n// exported: Capitalized. unexported: lowercase.\nflag.String(\"name\", \"default\", \"usage\")\nflag.Parse()\nflag.Args()\n```\n\n## Standard Library (Chapter 7)\n\n```go\nfmt.Printf(\"%v %+v %#v %T\\n\", x, x, x, x)\nfmt.Sprintf(\"...\")\n\nvar buf bytes.Buffer\nio.Copy(&dst, src)\n\nstrings.TrimSpace(s); strings.Split(s, \",\"); strings.Join(parts, \"-\")\nstrconv.Itoa(42); strconv.Atoi(\"42\")\n\nos.ReadFile(\"f\"); os.WriteFile(\"f\", data, 0644)\nbufio.NewScanner(f)   // line by line\n\njson.Marshal(v); json.Unmarshal(data, &v)\njson.NewEncoder(w).Encode(v)\n\nsort.Slice(s, func(i, j int) bool { return s[i] < s[j] })\n\nt := time.Now()\nt.Format(\"2006-01-02 15:04:05\")   // reference-time layout, not YYYY-MM-DD\nd := 2*time.Hour + 30*time.Minute\n\ngo f()                             // launch a goroutine\nvar wg sync.WaitGroup\nwg.Add(1); go func() { defer wg.Done() }(); wg.Wait()\n\nch := make(chan int)        // unbuffered\nch := make(chan int, 5)     // buffered\nch <- v; v := <-ch; close(ch)\nv, ok := <-ch                // ok is false once closed & drained\n\nselect {\ncase v := <-ch1:\ncase ch2 <- x:\ndefault:\n}\n\nvar mu sync.Mutex\nmu.Lock(); defer mu.Unlock()\n\nctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)\ndefer cancel()\nselect { case <-ctx.Done(): }\n\nhttp.HandleFunc(\"/path\", handlerFunc)\nresp, err := http.Get(url)\ndefer resp.Body.Close()\n```\n\n## Testing & Tooling (Chapter 8)\n\n```go\nfunc TestXxx(t *testing.T) {\n\tif got != want { t.Errorf(\"got %v, want %v\", got, want) }\n}\nt.Run(\"case name\", func(t *testing.T) { })\nfunc BenchmarkXxx(b *testing.B) {\n\tfor i := 0; i < b.N; i++ { }\n}\n```\n```\ngo test -v ./...\ngo test -run \"TestName/subtest\"\ngo test -cover\ngo test -bench=.\ngo test -race\ngo vet ./...\nGOOS=windows GOARCH=amd64 go build -o app.exe .   # cross-compile\n```\n\n## Common Gotchas Worth Remembering\n\n- `string(65)` → `\"A\"`, not `\"65\"` — use `strconv.Itoa`.\n- A `nil` pointer of a concrete type, once in an interface variable, is **not** `== nil`.\n- `range`'s value is a copy — mutate via `slice[i]`, not the loop variable.\n- Appending to a slice inside a function never updates the caller's own slice variable — return the new slice.\n- Map iteration order is randomized, every run.\n- `Read`/JSON numbers into `interface{}` become `float64`, never `int`.\n- Since Go 1.22, each `for` loop iteration gets its own loop variable — the old closure-capture bug is fixed."}, {"id": "10.2", "partNum": 10, "partTitle": "Back Matter", "partMetaphor": "quick-reference cheat sheet & glossary", "chapNum": 2, "slug": "appendix-b-glossary-of-terms", "fullTitle": "Appendix B: Glossary of Terms", "title": "Glossary of Terms", "md": "**`any`** — an alias for the empty interface `interface{}`; since every type has at least zero methods, every value satisfies `any`.\n\n**Array** — a fixed-size sequence where the length is part of the type itself (`[3]int` and `[4]int` are different types); a genuine value type, copied completely on assignment or function call.\n\n**Benchmark** — a function named `BenchmarkXxx(b *testing.B)`, its body looping `for i := 0; i < b.N; i++`, run with `go test -bench=<pattern>` for stable, real timing measurements.\n\n**Blank identifier (`_`)** — discards a value that must be present syntactically but isn't needed, avoiding Go's unused-variable rule; also used to import a package purely for its side effects (`_ \"path\"`).\n\n**Buffered channel** — `make(chan T, n)`, allowing up to `n` sends to succeed without a waiting receiver; a send blocks only once the buffer is full.\n\n**Build tag** — a `//go:build condition` comment (or a `_GOOS.go`/`_GOARCH.go` filename suffix) restricting a file to being compiled only under matching conditions.\n\n**Byte** — `uint8`; the unit a Go `string` is actually made of underneath, conventionally UTF-8-encoded text.\n\n**Channel** — a typed conduit for sending and receiving values between goroutines, created with `make(chan T)`; see also *Buffered channel*, *Unbuffered channel*.\n\n**Closure** — a function literal that captures variables from its enclosing scope by reference, not by value — modifying a captured variable inside the closure is visible outside it, and vice versa.\n\n**Comparable** — a built-in generic constraint guaranteeing a type supports `==`/`!=`; the same rule that determines valid map key types.\n\n**Constant (`const`)** — a value that can never be reassigned, whose value must be knowable at compile time; an untyped numeric constant adapts to whatever numeric type its context needs.\n\n**Context (`context.Context`)** — carries a cancellation signal (`Done()`), the reason (`Err()`), and optional request-scoped values through a call chain; `WithCancel`/`WithTimeout`/`WithDeadline` derive a cancellable child from a parent.\n\n**Coverage** — the percentage of statements a test suite actually executes, reported by `go test -cover`; a useful floor, not a guarantee every input or edge case is genuinely checked.\n\n**Data race** — unsynchronized concurrent read/write of the same memory by multiple goroutines, producing genuinely undefined, inconsistent results; detected precisely by `go run -race`/`go test -race`.\n\n**Defer** — `defer statement`, scheduling `statement` to run right before the enclosing function returns; multiple deferred calls run in LIFO order, and a deferred call's arguments are evaluated immediately, not when it finally executes.\n\n**Delve (`dlv`)** — Go's standard interactive debugger; `break`/`continue`/`next`/`print` cover the core workflow of pausing execution and inspecting real values at that moment.\n\n**Directional channel type** — `chan<-` (send-only) or `<-chan` (receive-only), restricting what a function parameter can do with a channel, enforced by the compiler.\n\n**Doc comment** — a `//` comment placed directly above a declaration with no blank line between them; read automatically by `go doc` and pkg.go.dev, conventionally starting with the exact name being documented.\n\n**Embedding** — including a type in a struct (or an interface in another interface) with no field name of its own, promoting its fields/methods to the outer type; genuinely not inheritance — a promoted method never sees the outer type's own overrides.\n\n**`error`** — a built-in interface requiring one method, `Error() string`; a function that can fail returns `(result, error)`, with `nil` meaning success.\n\n**Exported identifier** — a name starting with an uppercase letter, visible from any package that imports the one declaring it; a lowercase first letter makes a name unexported, visible only within its own package.\n\n**Generics** — type parameters (`func F[T Constraint](...)`), letting a function or type operate on a family of types while the compiler still checks everything at compile time; added in Go 1.18.\n\n**`go.mod`** — the file declaring a module's own identity (its import-path prefix), its target Go version, and its dependencies, each pinned to an exact version.\n\n**`go.sum`** — records cryptographic checksums for every dependency, direct and indirect, letting a build verify it's fetching the exact same code originally used.\n\n**GOPATH** — the pre-2019, pre-module mechanism requiring Go projects to live inside one specific directory tree; superseded entirely by modules, though the name persists as an environment variable pointing to where dependencies and installed binaries live.\n\n**Goroutine** — a lightweight, independently-running function call, started with `go functionCall()`; the runtime schedules many goroutines cheaply, but starting one never waits for it to actually begin or finish.\n\n**Interface** — a set of method signatures; any type with matching methods satisfies it automatically, with no explicit declaration linking the two.\n\n**`iota`** — a special identifier valid only inside a `const (...)` block, starting at `0` and incrementing by one per line — Go's real substitute for a dedicated `enum` keyword.\n\n**Method** — a function with a receiver (`func (r T) Name(...)`), callable as `value.Name(...)`; see also *Receiver*.\n\n**Module** — a directory (and everything under it) described by a `go.mod` file — the unit `go mod tidy`, dependency versioning, and import-path resolution all operate on.\n\n**Mutex (`sync.Mutex`)** — a lock (`Lock()`/`Unlock()`) ensuring only one goroutine at a time can access the data it protects, the standard fix for a data race on shared mutable state.\n\n**`nil`** — the zero value for pointers, slices, maps, channels, functions, and interfaces; safe to compare, but dereferencing a `nil` pointer, or writing to a `nil` map, panics.\n\n**Package** — a folder of `.go` files sharing one `package name` declaration; the unit of code organization other code imports by path.\n\n**Panic** — `panic(value)`, immediately stopping normal execution, running deferred calls while unwinding the stack, and crashing the program unless something calls `recover()`.\n\n**Pointer** — a value holding another value's memory address (`&x`); `*p` dereferences it. Go has no pointer arithmetic at all, unlike C.\n\n**Range** — the `for ... range` loop form, iterating over a slice (index+element), map (key+value, randomized order), string (byte-index+rune), integer (`0` to `n-1`, Go 1.22+), or a function (an iterator, Go 1.23+); its value is always a copy of the actual element.\n\n**Reader (`io.Reader`)** — a one-method interface (`Read(p []byte) (n int, err error)`) satisfied by files, network connections, in-memory buffers, and more; returns `io.EOF` to signal no more data. See also *Writer*.\n\n**Receiver** — the special parameter before a method's name (`func (r T) Name()`), determining whether the method operates on a copy (value receiver) or the genuine original (pointer receiver).\n\n**Recover** — `recover()`, called directly inside a deferred function, stops a panic's unwinding and returns the value passed to `panic`; called anywhere else, it does nothing and returns `nil`.\n\n**Rune** — an alias for `int32`, representing a single Unicode code point; a character literal like `'A'` is really its integer code point.\n\n**Select** — `select { case <-ch1: ...; case <-ch2: ... }`, waiting on multiple channel operations at once, running whichever becomes ready first (randomly, if several are ready simultaneously); a `default` case makes it non-blocking.\n\n**Shadowing** — a `:=` inside a nested block creating a brand-new variable with the same name as one in an outer scope, rather than reassigning it, when at least one name on the left is new to that inner block — a genuine, easy-to-introduce bug, distinct from the opt-in `shadow` analyzer that detects it.\n\n**Slice** — a length/capacity/pointer triple giving a flexible, growable view onto an underlying array; `append` may reuse the existing array (if capacity allows) or allocate a new one.\n\n**Stringer (`fmt.Stringer`)** — a one-method interface (`String() string`); a type with this method is displayed via that method automatically by `fmt`'s printing verbs (`%v`, `%s`, `Println`), instead of the default representation.\n\n**Struct** — a named collection of typed fields (`type Name struct { Field Type }`); comparable with `==` only when every field's own type is comparable.\n\n**Struct tag** — a backtick-quoted string after a struct field's type, inert metadata read via reflection by libraries like `encoding/json` to control field naming and behavior.\n\n**Subtest** — a named, individually-reported and individually-runnable test case created with `t.Run(name, func(t *testing.T) {...})` inside a table-driven test; one subtest's failure doesn't stop the others from running.\n\n**Table-driven test** — the idiomatic Go pattern of defining a slice of test-case structs and looping over it, calling `t.Run` for each — avoiding a separate `TestXxx` function per input variation.\n\n**Type assertion** — `x.(T)`, checking (and, in its safe comma-ok form, `v, ok := x.(T)`) whether an interface value `x` holds a specific concrete type `T`.\n\n**Type switch** — `switch v := x.(type) { case T1: ...; case T2: ... }`, branching on a value's actual concrete type rather than its value.\n\n**Unbuffered channel** — `make(chan T)`; a send blocks until another goroutine is ready to receive, making it a genuine synchronization point between two goroutines.\n\n**Unexported identifier** — see *Exported identifier*.\n\n**Variadic function** — `func f(nums ...int)`, accepting zero or more arguments of one type, collected as an ordinary slice inside the function; must be the function's last parameter.\n\n**WaitGroup (`sync.WaitGroup`)** — `Add`/`Done`/`Wait`, the standard way to block until a batch of goroutines has genuinely finished.\n\n**Writer (`io.Writer`)** — a one-method interface (`Write(p []byte) (n int, err error)`) satisfied by files, network connections, in-memory buffers, and more. See also *Reader*.\n\n**Zero value** — the well-defined default a variable holds when declared with no explicit initial value (`0` for numbers, `\"\"` for strings, `false` for bools, `nil` for pointers/slices/maps/channels/functions/interfaces) — never uninitialized garbage."}]

  <!-- Application Logic -->
  <script>
  (function(){
    var rawJson = document.getElementById('book-data').textContent;
    var chapters;
    try {
      chapters = JSON.parse(rawJson);
    } catch(err) {
      console.error('Failed to parse book data JSON:', err);
      document.getElementById('chapter-pane').innerHTML = '<div style="padding:2rem;color:red;"><h3>Error Loading Book Data</h3><p>' + err.message + '</p></div>';
      return;
    }

    var chapterMap = {};
    chapters.forEach(function(c, i){ c.index = i; chapterMap[c.id] = c; });

    var STORAGE_KEY_THEME = 'python_book_theme';
    var STORAGE_KEY_FONT = 'go_book_fontsize';
    var STORAGE_KEY_LAST = 'go_book_last_chapter';
    var STORAGE_KEY_CODE = 'go_book_code_style';
    var STORAGE_KEY_CODE_CARD = 'go_book_code_card';
    var STORAGE_KEY_COMPLETED = 'lga_completed_chapters';

    var currentChapterId = null;

    // Theme handling (Light / Dark)
    var currentTheme = 'light';
    try {
      var pTheme = new URLSearchParams(window.location.search).get('theme');
      currentTheme = (pTheme === 'dark' || pTheme === 'light') ? pTheme : (localStorage.getItem(STORAGE_KEY_THEME) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    }catch(e){}
    function applyTheme(theme){
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY_THEME, theme); }catch(e){}
      document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setTheme === theme);
      });
    }
    applyTheme(currentTheme);

    document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyTheme(btn.dataset.setTheme);
      });
    });

    // Code block card handling (GitHub Light [Default] / Obsidian)
    var currentCodeCard = 'light';
    try { currentCodeCard = localStorage.getItem(STORAGE_KEY_CODE_CARD) || 'light'; }catch(e){}
    function applyCodeCard(card){
      currentCodeCard = card;
      document.documentElement.setAttribute('data-code-card', card);
      try { localStorage.setItem(STORAGE_KEY_CODE_CARD, card); }catch(e){}
      document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCodeCard === card);
      });
    }
    applyCodeCard(currentCodeCard);

    document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeCard(btn.dataset.setCodeCard);
      });
    });

    // Code style handling (Indigo / Ruby / Sapphire / Minimal)
    var currentCodeStyle = 'indigo';
    try { currentCodeStyle = localStorage.getItem(STORAGE_KEY_CODE) || 'indigo'; }catch(e){}
    function applyCodeStyle(style){
      currentCodeStyle = style;
      document.documentElement.setAttribute('data-code-style', style);
      try { localStorage.setItem(STORAGE_KEY_CODE, style); }catch(e){}
      document.querySelectorAll('.code-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCode === style);
      });
    }
    applyCodeStyle(currentCodeStyle);

    document.querySelectorAll('.code-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeStyle(btn.dataset.setCode);
      });
    });

    // Font size scaling (Default: 20px)
    var DEFAULT_FONT_SIZE = 20;
    var currentFontSize = DEFAULT_FONT_SIZE;
    try {
      var savedFont = localStorage.getItem(STORAGE_KEY_FONT);
      if (savedFont) {
        currentFontSize = parseFloat(savedFont);
        if (currentFontSize === 16.5) currentFontSize = DEFAULT_FONT_SIZE;
      }
    } catch(e){}
    function applyFontSize(size){
      currentFontSize = Math.max(14, Math.min(28, Math.round(size * 10) / 10));
      document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
      try { localStorage.setItem(STORAGE_KEY_FONT, currentFontSize); }catch(e){}
      var fontResetBtn = document.getElementById('font-reset');
      if (fontResetBtn) fontResetBtn.textContent = Math.round(currentFontSize) + 'px';
    }
    applyFontSize(currentFontSize);
    document.getElementById('font-inc').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize + 1.5);
    });
    document.getElementById('font-dec').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize - 1.5);
    });
    document.getElementById('font-reset').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(DEFAULT_FONT_SIZE);
    });

    // Reset All to Defaults (Theme, Code card, Code style, Font size, and Reading progress)
    var resetAllBtn = document.getElementById('reset-all-btn');
    if (resetAllBtn) {
      resetAllBtn.addEventListener('click', function(e){
        e.stopPropagation();

        try {
          localStorage.removeItem(STORAGE_KEY_THEME);
          localStorage.removeItem(STORAGE_KEY_FONT);
          localStorage.removeItem(STORAGE_KEY_LAST);
          localStorage.removeItem(STORAGE_KEY_CODE);
          localStorage.removeItem(STORAGE_KEY_CODE_CARD);
          localStorage.removeItem(STORAGE_KEY_COMPLETED);
        } catch(err){}

        applyTheme('light');
        applyCodeCard('light');
        applyCodeStyle('indigo');
        applyFontSize(DEFAULT_FONT_SIZE);
        updateCompletionUI();

        if (location.hash !== '#0.1') {
          location.hash = '#0.1';
        } else {
          renderChapter('0.1');
        }

        var origHtml = resetAllBtn.innerHTML;
        resetAllBtn.classList.add('success');
        resetAllBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Reset to Defaults!</span>';

        setTimeout(function(){
          resetAllBtn.classList.remove('success');
          resetAllBtn.innerHTML = origHtml;
        }, 1800);
      });
    }

    // Settings popover
    var settingsBtn = document.getElementById('settings-btn');
    var settingsPopover = document.getElementById('settings-popover');

    function toggleSettings(open){
      var willOpen = (typeof open === 'boolean') ? open : !settingsPopover.classList.contains('open');
      settingsPopover.classList.toggle('open', willOpen);
      settingsBtn.classList.toggle('active', willOpen);
      settingsBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    }

    settingsBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleSettings();
    });

    settingsPopover.addEventListener('click', function(e){
      e.stopPropagation();
    });

    function handleOutsideSettingsClick(e){
      if(settingsPopover.classList.contains('open') && !settingsPopover.contains(e.target) && !settingsBtn.contains(e.target)){
        toggleSettings(false);
      }
    }
    document.addEventListener('click', handleOutsideSettingsClick);
    document.addEventListener('touchend', handleOutsideSettingsClick, { passive: true });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Reading Progress & Completion Memory
    function getCompletedChapters(){
      try {
        var raw = localStorage.getItem(STORAGE_KEY_COMPLETED);
        if(raw){
          var arr = JSON.parse(raw);
          if(Array.isArray(arr)) return arr;
        }
      }catch(e){}
      return [];
    }
    function isChapterCompleted(id){
      return getCompletedChapters().indexOf(id) !== -1;
    }
    function markChapterCompleted(id, completed){
      try {
        var list = getCompletedChapters();
        var idx = list.indexOf(id);
        if(completed && idx === -1){
          list.push(id);
        } else if(!completed && idx !== -1){
          list.splice(idx, 1);
        }
        localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(list));
        updateCompletionUI();
      }catch(e){}

    function toggleChapterCompleted(id){
      markChapterCompleted(id, !isChapterCompleted(id));

    function updateCompletionUI(){
      var completedList = getCompletedChapters();
      var completedSet = {};
      completedList.forEach(function(id){ completedSet[id] = true; });

      document.querySelectorAll('.chapter-item').forEach(function(item){
        var id = item.dataset.chapId;
        var isDone = !!completedSet[id];
        item.classList.toggle('completed', isDone);
        var check = item.querySelector('.chapter-check');
        if(check){
          check.setAttribute('title', isDone ? 'Completed (click to mark unread)' : 'Click to mark as completed');
          check.setAttribute('aria-label', (isDone ? 'Completed: ' : 'Uncompleted: ') + id);
        }
      });

      parts.forEach(function(p){
        var partBadge = document.querySelector('.part-count-badge[data-part-badge="' + p.partNum + '"]');
        if(partBadge){
          var doneCount = p.chapters.filter(function(c){ return !!completedSet[c.id]; }).length;
          var total = p.chapters.length;
          if(doneCount === total && total > 0){
            partBadge.textContent = '✓ ' + total;
            partBadge.classList.add('all-done');
            partBadge.title = 'All ' + total + ' chapters completed';
          } else if(doneCount > 0){
            partBadge.textContent = doneCount + '/' + total;
            partBadge.classList.remove('all-done');
            partBadge.title = doneCount + ' of ' + total + ' chapters completed';
          } else {
            partBadge.textContent = total;
            partBadge.classList.remove('all-done');
            partBadge.title = total + ' chapters';
          }
        }
      });

      var progressBadge = document.getElementById('toc-progress-badge');
      if(progressBadge){
        var totalDone = completedList.length;
        progressBadge.textContent = totalDone + ' / ' + chapters.length;
        if(totalDone === chapters.length && chapters.length > 0){
          progressBadge.textContent = chapters.length + ' / ' + chapters.length + ' ✓';

      var chapCompleteBtn = document.getElementById('chap-complete-btn');
      if(chapCompleteBtn && currentChapterId){
        var isDone = !!completedSet[currentChapterId];
        chapCompleteBtn.classList.toggle('completed', isDone);
        chapCompleteBtn.textContent = isDone ? '✓ Completed' : 'Mark as read';

    function groupSubsections(container){
      var kids = Array.prototype.slice.call(container.children);
      var i = 0;
      while(i < kids.length){
        var el = kids[i];
        if(el.tagName === 'H3'){
          var wrapper = document.createElement('div');
          var text = el.textContent.toLowerCase();
          var cls = 'subsection';
          if(text.indexOf('mistake') !== -1) cls += ' subsection--mistakes';
          else if(text.indexOf('recap') !== -1) cls += ' subsection--recap';
          else if(text.indexOf('matters') !== -1) cls += ' subsection--matters';
          wrapper.className = cls;
          container.insertBefore(wrapper, el);
          wrapper.appendChild(el);
          var j = i + 1;
          while(j < kids.length && kids[j].tagName !== 'H3' && kids[j].tagName !== 'H2'){
            wrapper.appendChild(kids[j]);
            j++;
          }
          i = j;
        } else {
          i++;
        }
      }
    }

    function escapeRegex(str) {
