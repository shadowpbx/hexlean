 a custom type with its own `Error()` method works identically for anything more structured.\n- `fmt`'s printing functions automatically call `Error()` on anything satisfying `error`, exactly like `Stringer`'s `String()`.\n- Go has no exceptions — errors are ordinary return values, checked explicitly every time, not an automatic, separate control-flow path."}, {"id": "6.2", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 2, "slug": "creating-wrapping-errors", "fullTitle": "Creating & Wrapping Errors", "title": "Creating & Wrapping Errors", "md": "### Why this matters\n\n`errors.New` (Chapter 6.1) is fine for a simple, one-off error, but real programs need more: adding context as an error travels up through several function calls, while still letting code further up the chain check \"was this *specifically* a not-found error?\" without string-matching the message. `fmt.Errorf` with `%w`, plus `errors.Is`/`errors.As`, are exactly that machinery.\n\n### The core idea\n\n`fmt.Errorf(\"context: %w\", originalErr)` creates a new error that wraps `originalErr` — the new error has its own message, but remembers the original underneath. `errors.Is(err, target)` checks whether `err`, or anything it wraps (however many layers deep), matches `target`. `errors.As(err, &variable)` does the same, but for recovering a specific *type* rather than checking against one specific error value.\n\n### Examples\n\n**1. A sentinel error — a shared, comparable value other code can check against.**\n```go\nvar ErrNotFound = errors.New(\"not found\")\n\nfunc findUser(id int) error {\n\tif id > 100 {\n\t\treturn fmt.Errorf(\"looking up user %d: %w\", id, ErrNotFound)\n\t}\n\treturn nil\n}\n\nerr := findUser(200)\nfmt.Println(err)\nfmt.Println(errors.Is(err, ErrNotFound))\n```\nOutput:\n```\nlooking up user 200: not found\ntrue\n```\n`err`'s actual message is `\"looking up user 200: not found\"` — genuinely useful context about *what* failed — but `errors.Is(err, ErrNotFound)` still correctly reports `true`, because `%w` (not `%v`) preserved the connection to `ErrNotFound` underneath. This is the whole point: rich, specific context for a human reading logs, *and* a reliable way for code to check \"was this that particular kind of failure?\"\n\n**2. `%v` instead of `%w` breaks that connection — verified directly.**\n```go\nerr := fmt.Errorf(\"looking up user: %v\", ErrNotFound)\nfmt.Println(errors.Is(err, ErrNotFound))\n```\nOutput:\n```\nfalse\n```\n`%v` just formats `ErrNotFound`'s message into the new string — the two errors are now completely unrelated as far as `errors.Is` is concerned, even though the printed text might look identical to the `%w` version. `%w` specifically is what establishes the wrapping relationship; nothing else does.\n\n**3. `errors.As` — recovering a specific custom error *type*, not matching a specific value.**\n```go\ntype ValidationError struct {\n\tField string\n}\nfunc (e *ValidationError) Error() string {\n\treturn fmt.Sprintf(\"validation failed on field %q\", e.Field)\n}\n\nfunc findUser(id int) error {\n\tif id < 0 {\n\t\treturn &ValidationError{Field: \"id\"}\n\t}\n\t// ...\n}\n\nerr2 := findUser(-1)\nfmt.Println(err2)\nvar ve *ValidationError\nif errors.As(err2, &ve) {\n\tfmt.Println(\"field was:\", ve.Field)\n}\n```\nOutput:\n```\nvalidation failed on field \"id\"\nfield was: id\n```\n`errors.Is` checks against one specific error *value* (like the shared `ErrNotFound`); `errors.As` instead asks \"does this error chain contain something of type `*ValidationError`?\" and, if so, assigns it into `ve` — giving you back the real, typed value (with its own `Field`, here) rather than just a yes/no answer.\n\n**4. `errors.Unwrap` — the lower-level operation `Is`/`As` are built on.**\n```go\nunwrapped := errors.Unwrap(err)\nfmt.Println(unwrapped)\nfmt.Println(unwrapped == ErrNotFound)\n```\nOutput:\n```\nnot found\ntrue\n```\n`errors.Unwrap` peels back exactly one layer of wrapping, returning the error `%w` embedded. `errors.Is`/`errors.As` do this automatically, repeatedly, through as many layers as exist — you'll rarely call `Unwrap` directly in real code, but it's worth seeing once to understand what the higher-level functions are actually doing underneath.\n\n**5. Both functions correctly report a mismatch, too — not just a match.**\n```go\nfmt.Println(errors.Is(ErrNotFound, ErrNotFound))\nfmt.Println(errors.As(err, &ve))\n```\nOutput:\n```\ntrue\nfalse\n```\nThe first checks `ErrNotFound` against itself directly (no wrapping involved at all) — trivially `true`. The second tries to find a `*ValidationError` inside `err` — but `err` is Example 1's wrapped `ErrNotFound`, which never contained a `*ValidationError` at all, so `errors.As` correctly reports `false` rather than falsely matching. Both functions are reliable in both directions: a genuine match reports `true` (Examples 1 and 3), and a genuine non-match reports `false` here — never a guess either way.\n\n### ⚠️ Common Mistakes\n\n- **Using `%v` when `%w` was actually needed** to preserve `errors.Is`/`errors.As` compatibility further up the call chain. As Example 2 showed, this is easy to get wrong silently — the program still compiles and the error message still looks fine, but a caller's `errors.Is` check quietly stops working.\n- **String-matching an error's message** (`strings.Contains(err.Error(), \"not found\")`) instead of using `errors.Is` with a proper sentinel error. Message text is for humans and can change; `errors.Is`/`errors.As` are the reliable, message-independent way to check what actually went wrong.\n- **Confusing `errors.Is` (matching a specific error *value*) with `errors.As` (matching a specific error *type*).** Use `Is` for a shared sentinel like `ErrNotFound`; use `As` when you need the actual typed error back (to read its fields, like `ValidationError.Field`) rather than just a yes/no answer.\n- **Wrapping an error with `%w` more than once in the same `Errorf` call.** Only one `%w` is meaningful per call — Go 1.20+ actually allows multiple `%w` verbs to build a multi-error chain, but that's a genuinely advanced case; a single `%w` per wrap, called repeatedly as the error travels up the stack, is the ordinary pattern.\n\n### How this connects\n\nThis chapter's `error`-wrapping pattern is what makes Chapter 8.1's debugging and Chapter 7.14's HTTP error handling genuinely traceable — a well-wrapped error tells you not just *that* something failed, but the whole chain of context leading to it.\n\n### Quick recap\n\n- `fmt.Errorf(\"context: %w\", err)` wraps `err`, adding context while preserving the connection — `%v` in the same spot does not preserve it.\n- `errors.Is(err, target)` checks whether `err` or anything it wraps matches a specific error value (a sentinel, like `ErrNotFound`).\n- `errors.As(err, &variable)` checks whether `err` or anything it wraps matches a specific error *type*, and if so, assigns the actual typed value into `variable`.\n- `errors.Unwrap` peels back exactly one layer — the lower-level operation `Is`/`As` use internally, rarely called directly.\n- Use `errors.Is`/`errors.As` instead of matching an error's message text — messages are for humans, these functions are for code."}, {"id": "6.3", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 3, "slug": "panic-recover-when-not-to-use-them", "fullTitle": "`panic`, `recover` & When (Not) to Use Them", "title": "`panic`, `recover` & When (Not) to Use Them", "md": "### Why this matters\n\nGo's `error`-based handling (Chapters 6.1–6.2) covers ordinary, expected failures. `panic` is different: it's for situations a program genuinely shouldn't try to continue past — and `recover` is the narrow, deliberate escape hatch for the rare cases where stopping the *whole* program is still too drastic. Knowing exactly when each tool belongs is as important as knowing their syntax.\n\n### The core idea\n\n`panic(value)` immediately stops normal execution of the current function, runs any deferred calls along the way (Chapter 3.7), and keeps unwinding up the call stack until either the program crashes (printing a stack trace) or something calls `recover()` inside a deferred function to stop the unwinding. `recover()` only has any effect when called **directly** inside a deferred function — calling it anywhere else, including a function that deferred function itself calls, does nothing.\n\n### Examples\n\n**1. An uncaught panic crashes the whole program, with a real stack trace.**\n```go\nfmt.Println(\"before\")\npanic(\"boom\")\n```\nOutput:\n```\nbefore\npanic: boom\n\ngoroutine 1 [running]:\nmain.main()\n\t/path/to/uncaught.go:5 +0x59\nexit status 2\n```\n`\"before\"` printed, then the panic stopped everything — nothing after `panic(\"boom\")` ever runs, and the program exits with a non-zero status.\n\n**2. `recover()` inside a deferred function stops the panic — the program continues normally afterward.**\n```go\nfunc mayPanic(x int) {\n\tif x < 0 {\n\t\tpanic(\"negative value not allowed\")\n\t}\n\tfmt.Println(\"processing:\", x)\n}\n\nfunc safeCall(x int) {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\tfmt.Println(\"recovered from:\", r)\n\t\t}\n\t}()\n\tmayPanic(x)\n\tfmt.Println(\"this line never runs if panic happened above\")\n}\n\nsafeCall(5)\nsafeCall(-1)\nfmt.Println(\"program continues after recovery\")\n```\nOutput:\n```\nprocessing: 5\nthis line never runs if panic happened above\nrecovered from: negative value not allowed\nprogram continues after recovery\n```\n`safeCall(5)` runs normally, no panic. `safeCall(-1)` panics inside `mayPanic`, skips the rest of `safeCall`'s body, but the deferred closure's `recover()` catches it — `r` holds the value passed to `panic` (`\"negative value not allowed\"`), and execution resumes normally right after `safeCall(-1)` returns, in `main`.\n\n**3. `recover()` outside a panic — genuinely safe, returns `nil`.**\n```go\nr := recover()\nfmt.Println(\"recover outside a panic:\", r)\n```\nOutput:\n```\nrecover outside a panic: <nil>\n```\nCalling `recover()` when nothing is actually panicking is harmless — it simply returns `nil`, which is exactly why Example 2's `if r := recover(); r != nil` pattern is the standard, safe way to write this: check `r`, don't assume a panic necessarily happened just because `recover` was called.\n\n**4. Converting a recovered panic into a properly returned `error`, using a named return (Chapter 4.3's exact mechanism).**\n```go\nfunc divide(a, b int) (result int, err error) {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\terr = fmt.Errorf(\"recovered: %v\", r)\n\t\t}\n\t}()\n\tresult = a / b\n\treturn\n}\n\nres, err := divide(10, 2)\nfmt.Println(res, err)\n\nres2, err2 := divide(10, 0)\nfmt.Println(res2, err2)\n```\nOutput:\n```\n5 <nil>\n0 recovered: runtime error: integer divide by zero\n```\nThis is the pattern Chapter 3.7 first previewed: a genuine runtime panic (dividing by zero — not something `divide` explicitly called `panic` for; Go's runtime does that automatically) gets caught by the deferred closure, which sets the named `err` return value before the function actually hands control back. The caller sees an ordinary `(result, error)` pair, exactly like any other Go function — the panic never escapes past `divide` at all.\n\n**5. `recover()` must be called *directly* inside the deferred function — not through another function call it makes.**\n```go\nfunc actuallyRecover() {\n\tr := recover()\n\tfmt.Println(\"nested call, recovered:\", r)\n}\n\nfunc doWork() {\n\tdefer func() {\n\t\tactuallyRecover() // recover() called two levels deep from defer - does NOT stop the panic\n\t}()\n\tpanic(\"boom\")\n}\n\ndoWork()\nfmt.Println(\"never reached\")\n```\nOutput:\n```\nnested call, recovered: <nil>\npanic: boom\n\ngoroutine 1 [running]:\nmain.doWork()\n\t...\n```\n`recover()` here is called inside `actuallyRecover`, which is itself called *by* the deferred closure — one level too deep. `recover()` returns `nil` (as if there were no panic at all, from its point of view), the panic is never actually stopped, and the program crashes exactly as if no `recover` existed anywhere. This is a genuine, easy-to-miss restriction: `recover` only works called directly inside the function that was itself deferred — a directly-deferred named function's own body (Example 2's closure form, or an equivalent `defer someFunc()` calling `recover()` in `someFunc`'s own top level) is fine; anything calling `recover` on that function's behalf is not.\n\n### ⚠️ Common Mistakes\n\n- **Calling `recover()` from a helper function invoked by the deferred function**, rather than directly in the deferred function's own body. As Example 5 showed, this silently fails to catch anything — `recover()` just returns `nil`, and the panic proceeds to crash the program regardless.\n- **Reaching for `panic`/`recover` as Go's version of `try`/`catch` for ordinary error handling.** Idiomatic Go reserves `panic` for genuinely unrecoverable programmer errors (an invariant that should be impossible was violated, a required initialization step was skipped) — routine, expected failure conditions belong in the `error`-returning pattern from Chapters 6.1–6.2.\n- **Panicking inside a library function meant to be used by other code**, without a very good reason. A panic that escapes a library into a caller's program forces *that* caller to add `recover` machinery just to use your code safely — returning an `error` instead keeps the decision of \"how serious is this, really\" with the caller, where it usually belongs.\n- **Forgetting a `fatal error` (like Chapter 4.6's stack overflow) is fundamentally different from a `panic` and is never recoverable**, no matter where `recover()` is called from.\n\n### How this connects\n\nThis is the last piece of Go's error-handling story — ordinary failures (Chapters 6.1–6.2) versus genuinely exceptional ones (this chapter) — and the `defer` + named-return + `recover` pattern here is exactly `defer`'s most powerful real use, first previewed all the way back in Chapter 3.7.\n\n### Quick recap\n\n- `panic(value)` stops normal execution, runs deferred calls while unwinding, and crashes the program with a stack trace unless something recovers it.\n- `recover()`, called directly inside a deferred function, stops the unwinding and returns the value passed to `panic` — called anywhere else (including a function the deferred function itself calls), it just returns `nil` and does nothing.\n- A deferred closure that calls `recover()` and sets a named return value is the idiomatic way to convert a panic (including a real runtime panic, like divide-by-zero) into an ordinary returned `error`.\n- Idiomatic Go reserves `panic` for genuinely unrecoverable situations — ordinary, expected failures use the `error`-returning pattern instead."}, {"id": "6.4", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 4, "slug": "packages-imports", "fullTitle": "Packages & Imports", "title": "Packages & Imports", "md": "### Why this matters\n\nEvery Go file you've written so far declared `package main` and lived in one folder. Real programs split code across multiple packages — Go's actual unit of code organization and reuse — and this chapter covers exactly how one package uses another.\n\n### The core idea\n\nA **package** is a folder of `.go` files that all declare the same `package name` at the top. Any other code imports it by its **import path** (typically the module path plus the folder's location within it, from Chapter 6.5's `go.mod`), and refers to its exported names (Chapter 6.6 covers exactly what \"exported\" means) with a `packagename.Name` prefix.\n\n### Examples\n\n**1. A real package, in its own folder, imported from `main`.**\n\n`mathutil/mathutil.go`:\n```go\npackage mathutil\n\nfunc Add(a, b int) int {\n\treturn a + b\n}\n\nfunc Square(n int) int {\n\treturn n * n\n}\n```\n`main.go`:\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\n\t\"example.com/ch64/mathutil\"\n)\n\nfunc main() {\n\tfmt.Println(mathutil.Add(2, 3))\n\tfmt.Println(mathutil.Square(4))\n}\n```\nOutput:\n```\n5\n16\n```\n`example.com/ch64/mathutil` is the import path — the module's own path (from `go.mod`, Chapter 6.5) plus `/mathutil`, matching the folder's location. `mathutil.Add(...)` prefixes every call with the package name declared inside that folder's files.\n\n**2. Import aliasing — a local name for an imported package.**\n```go\nimport (\n\t\"fmt\"\n\n\tmu \"example.com/ch64/mathutil\"\n)\n\nfunc main() {\n\tfmt.Println(mu.Add(1, 1))\n}\n```\nOutput:\n```\n2\n```\n`mu \"path\"` imports the package under the local name `mu` instead of its own declared name — genuinely useful when two imported packages would otherwise share the same name, or when a package's real name is long and a shorter local alias reads more clearly.\n\n**3. A blank import — for side effects only, no name used at all.**\n```go\nimport (\n\t\"fmt\"\n\t_ \"net/http/pprof\"\n)\n\nfunc main() {\n\tfmt.Println(\"blank import compiled fine, pprof handlers registered as a side effect\")\n}\n```\nOutput:\n```\nblank import compiled fine, pprof handlers registered as a side effect\n```\n`_ \"path\"` imports a package purely for the side effects its `init()` function produces (here, `net/http/pprof` registers some diagnostic HTTP handlers just by being imported) — without this, importing a package you never actually reference by name would be a compile error (Chapter 1.1's unused-import rule). `_` explicitly says \"I know I'm not using this directly, and that's intentional.\"\n\n**4. A genuinely surprising fact: a package's declared name doesn't have to match its folder name.**\n\n`oddname/file.go`:\n```go\npackage differentname\n\nfunc Hello() string {\n\treturn \"hi from a package whose name != folder name\"\n}\n```\nImporting it and using it with no alias at all:\n```go\nimport (\n\t\"fmt\"\n\n\t\"example.com/ch64/oddname\"\n)\n\nfunc main() {\n\tfmt.Println(differentname.Hello())\n}\n```\nOutput:\n```\nhi from a package whose name != folder name\n```\nThe import path uses the folder name (`oddname`), but the identifier you actually use in code is the package's *declared* name (`differentname`, from its own `package differentname` line) — Go resolves this automatically, with no alias required. This is legal but genuinely confusing in practice, which is exactly why real-world convention (and this book, from here on) keeps a package's declared name identical to its folder name — always.\n\n### ⚠️ Common Mistakes\n\n- **Naming a package's folder and its `package` declaration differently, without a strong reason.** As Example 4 showed, it's legal, but forces anyone reading an import list to go check the actual source to know what identifier they'll be using — real Go style strongly prefers matching them.\n- **Forgetting a blank import's entire purpose is side effects.** If a package is blank-imported but its `init()` doesn't actually do anything useful on its own, the import is probably a mistake, not a deliberate `_` pattern.\n- **Over-aliasing imports without a real naming conflict or clarity need.** `mu` for `mathutil` (Example 2) is fine when genuinely useful, but idiomatic Go leaves most imports unaliased — reach for an alias only when two imports would otherwise collide, or an unaliased name would be genuinely misleading.\n- **Assuming an import path always exactly matches the package's declared name.** As Example 4 demonstrated, they can differ — the import path locates the *folder*; the package's own declaration determines what you actually type at the call site.\n\n### How this connects\n\nChapter 6.5 covers exactly where an import path like `example.com/ch64/mathutil` actually comes from (`go.mod`'s module declaration); Chapter 6.6 covers what makes a name inside a package (`Add`, `Square`) usable from outside it at all.\n\n### Quick recap\n\n- A package is a folder of `.go` files sharing one `package name` declaration; other code imports it by its import path and calls its exported names as `packagename.Name`.\n- `alias \"path\"` imports under a local name; `_ \"path\"` imports purely for side effects, with no usable name at all.\n- A package's declared name and its folder name can differ (Go resolves the actual identifier from the package declaration, not the folder), but idiomatic Go always keeps them matching."}, {"id": "6.5", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 5, "slug": "modules-go-mod-go-sum", "fullTitle": "Modules: `go.mod` & `go.sum`", "title": "Modules: `go.mod` & `go.sum`", "md": "### Why this matters\n\nChapter 0.2 first created a `go.mod` file, and Chapter 6.4's import paths leaned on it without fully explaining where they come from. This chapter covers what these two files actually contain, and how a real, external dependency gets added to a project.\n\n### The core idea\n\n`go.mod` declares a module's identity (its own import-path prefix) and lists every dependency it directly needs, each pinned to an exact version. `go.sum` records cryptographic checksums for every dependency (direct and indirect), so a future `go build` can verify it's downloading the exact same code, byte for byte, that was originally used — a real, meaningful security property, not just bookkeeping.\n\n### Examples\n\n**1. A fresh `go.mod` — just a module path and a Go version.**\n```\ngo mod init example.com/ch65b\n```\n```\nmodule example.com/ch65b\n\ngo 1.26.5\n```\n`module example.com/ch65b` is this project's own identity — it's the prefix every one of its own packages' import paths will start with (exactly like Chapter 6.4's `example.com/ch64/mathutil`). `go 1.26.5` records the minimum Go version this module expects.\n\n**2. Adding a real, external dependency, and letting `go mod tidy` sort out the details.**\n```go\nimport (\n\t\"fmt\"\n\n\t\"rsc.io/quote\"\n)\n\nfunc main() {\n\tfmt.Println(quote.Hello())\n}\n```\nRunning `go mod tidy` in this state:\n```\ngo: finding module for package rsc.io/quote\ngo: found rsc.io/quote in rsc.io/quote v1.5.2\n```\nAnd `go.mod` afterward:\n```\nmodule example.com/ch65b\n\ngo 1.26.5\n\nrequire rsc.io/quote v1.5.2\n\nrequire (\n\tgolang.org/x/text v0.0.0-20170915032832-14c0d48ead0c // indirect\n\trsc.io/sampler v1.3.0 // indirect\n)\n```\n`go mod tidy` noticed the code imports `rsc.io/quote` but nothing in `go.mod` accounted for it — it found the package, downloaded its latest compatible version, and added a `require` line. Notice the second `require` block: `rsc.io/quote` itself depends on `rsc.io/sampler` and `golang.org/x/text`, marked `// indirect` because *your* code never imports them directly — `go.mod` still tracks them, since they genuinely need to be downloaded too, just clearly labeled as \"needed because something you use needs them,\" not your own direct choice.\n\n**3. Running the program — the dependency just works, once declared.**\n```\ngo run main.go\n```\nOutput:\n```\nHello, world.\n```\n\n**4. `go.sum` — real, verifiable checksums, one pair per dependency.**\n```\ngolang.org/x/text v0.0.0-20170915032832-14c0d48ead0c h1:qgOY6WgZOaTkIIMiVjBQcw93ERBE4m30iBm00nkL0i8=\ngolang.org/x/text v0.0.0-20170915032832-14c0d48ead0c/go.mod h1:NqM8EUOU14njkJ3fqMW+pc6Ldnwhi/IjpwHt7yyuwOQ=\nrsc.io/quote v1.5.2 h1:w5fcysjrx7yqtD/aO+QwRjYZOKnaM9Uh2b40tElTs3Y=\nrsc.io/quote v1.5.2/go.mod h1:LzX7hefJvL54yjefDEDHNONDjII0t9xZLPXsUe+TKr0=\nrsc.io/sampler v1.3.0 h1:7uVkIFmeBqHfdjD+gZwtXXI+RODJ2Wc4O7MPEh/QiW4=\nrsc.io/sampler v1.3.0/go.mod h1:T1hPZKmBbMNahiBKFy5HrXp6adAjACjK9JXDnKaTXpA=\n```\nEach of the **three** dependencies (`rsc.io/quote` plus its own two, `golang.org/x/text` and `rsc.io/sampler`) gets two lines — a hash of the module's actual code, and a separate hash of just its own `go.mod` file. This is what lets `go build`/`go run` detect (and refuse to proceed past) a dependency that's been tampered with or corrupted since it was first downloaded — a genuine supply-chain safeguard, not just version bookkeeping. `go.sum` is meant to be committed to version control alongside `go.mod`, and essentially never hand-edited.\n\n**5. `go mod tidy` also *removes* dependencies no code actually uses anymore.**\n\nRemoving the import and the call to `quote.Hello()` from `main.go`, then running `go mod tidy` again, cleans `go.mod` back down to just:\n```\nmodule example.com/ch65b\n\ngo 1.26.5\n```\nEvery `require` line — direct and indirect — disappeared, since nothing in the code needs them anymore. `go mod tidy` is genuinely safe (and worth running regularly) for exactly this reason: it keeps `go.mod`/`go.sum` in sync with what the code actually, currently imports, neither more nor less.\n\n### ⚠️ Common Mistakes\n\n- **Hand-editing `go.sum`.** It's generated and verified automatically — manual edits are essentially never correct and defeat the whole point of the checksums being trustworthy.\n- **Forgetting to run `go mod tidy` after adding or removing an import**, leaving `go.mod` out of sync with what the code actually uses (missing a `require` for something new, or keeping a stale one for something no longer imported).\n- **Committing code without committing `go.sum` alongside `go.mod`.** Without it, someone else building the project has no way to verify they're getting the exact same dependency code — always commit both together.\n- **Confusing a direct dependency (imported by your own code) with an indirect one (needed only because a direct dependency needs it).** `go mod tidy` sorts this out automatically and marks indirect ones explicitly — you rarely need to think about this distinction yourself, but the `// indirect` comment is worth recognizing when reading someone else's `go.mod`.\n\n### How this connects\n\nThe module path declared here (`example.com/ch65b`) is exactly what every one of a project's own internal packages' import paths (Chapter 6.4, Chapter 6.7) is built from — understanding `go.mod` is the missing piece that makes those import paths make sense as more than arbitrary strings.\n\n### Quick recap\n\n- `go.mod` declares a module's own identity (its import-path prefix) and lists its dependencies, each pinned to an exact version.\n- `go mod tidy` adds missing `require` entries for newly-imported packages, removes unused ones, and keeps everything in sync with what the code actually imports.\n- `go.sum` records cryptographic checksums for every dependency, direct and indirect — a real security property verifying dependency code hasn't changed since it was first fetched.\n- Both files are meant to be committed to version control together; `go.sum` specifically should never be hand-edited."}, {"id": "6.6", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 6, "slug": "exported-vs-unexported-identifiers", "fullTitle": "Exported vs. Unexported Identifiers", "title": "Exported vs. Unexported Identifiers", "md": "### Why this matters\n\nGo has no `public`/`private` keywords — visibility is decided entirely by a name's first letter. This is a genuinely elegant, if initially surprising, design: one glance at any identifier tells you immediately whether other packages can see it, with nothing else to check.\n\n### The core idea\n\nA name starting with an **uppercase** letter is **exported** — visible and usable from any package that imports the one declaring it. A name starting with a **lowercase** letter is **unexported** — visible only within the package that declares it, completely invisible (a real compile error to even reference) from anywhere else. This applies uniformly to functions, variables, constants, types, and struct fields.\n\n### Examples\n\n**1. Exported and unexported names, side by side in the same package.**\n```go\npackage lib\n\nvar Exported = \"visible everywhere\"\nvar unexported = \"visible only inside package lib\"\n\nfunc PublicFunc() string {\n\treturn unexported\n}\n\nfunc privateFunc() string {\n\treturn \"private\"\n}\n```\nFrom another package:\n```go\nimport \"example.com/ch66/lib\"\n\nfmt.Println(lib.Exported)\nfmt.Println(lib.PublicFunc())\n```\nOutput:\n```\nvisible everywhere\nvisible only inside package lib\n```\n`lib.Exported` and `lib.PublicFunc()` both work fine from outside `lib` — capital first letter, fully accessible. `PublicFunc` itself freely uses `unexported` internally, since that access happens *inside* `lib`'s own package, where lowercase names are perfectly normal and visible.\n\n**2. Trying to reach an unexported name from outside its package — a real, immediate compile error.**\n```go\nimport \"example.com/ch66/lib\"\n\nfmt.Println(lib.unexported)\n```\nOutput:\n```\n# example.com/ch66\n./main.go:7:18: name unexported not exported by package lib\n```\nThere's no way around this from outside the package — `unexported` genuinely doesn't exist as far as any other package is concerned, enforced by the compiler, not just a naming convention people are expected to respect.\n\n**3. The exact same rule applies to struct fields, individually.**\n```go\ntype Account struct {\n\tUsername string\n\tpassword string\n}\n```\n```go\na := lib.Account{Username: \"bob\", password: \"hunter2\"}\n```\nOutput:\n```\n# example.com/ch66\n./main.go:7:36: cannot refer to unexported field password in struct literal of type lib.Account\n```\n`Username` (capitalized) is settable and readable from outside `lib`; `password` (lowercase) is not — genuinely useful for a struct that needs some fields publicly accessible and others kept as internal implementation detail, all controlled purely by field-name capitalization, no separate access-modifier syntax needed. This is exactly what Chapter 2.9 already flagged for `encoding/json`: an unexported field is invisible to `json.Marshal` too, for the identical underlying reason.\n\n### ⚠️ Common Mistakes\n\n- **Expecting a `public`/`private` keyword to exist.** Go has neither — capitalization *is* the entire visibility mechanism, for every kind of identifier uniformly.\n- **Exporting more than actually needs to be public**, just because it's easy to capitalize a name. A package's exported names are its real, committed public API — anything genuinely internal (helper functions, implementation-detail fields) should stay lowercase, keeping the package free to change that internal detail later without breaking anyone depending on it.\n- **Forgetting this rule applies per-identifier, not per-file or per-type.** A struct can freely mix exported and unexported fields (Example 3); a package can freely mix exported and unexported functions — there's no requirement that an entire file or type be uniformly one or the other.\n- **Assuming an unexported name is merely hidden from documentation, but still technically reachable with effort.** It isn't reachable at all from outside the package — not through reflection misuse, not through any workaround short of `unsafe` (deliberately out of this book's scope) — the compiler simply refuses to compile any reference to it.\n\n### How this connects\n\nThis exact rule is what made Chapter 2.9's \"unexported fields are invisible to `encoding/json`\" claim true, and it's the foundation Chapter 6.7's package-organization guidance is built on: deciding what a package exports *is* deciding its public API.\n\n### Quick recap\n\n- A name starting with an uppercase letter is exported (visible from any importing package); lowercase is unexported (visible only within the declaring package).\n- This applies uniformly to functions, variables, constants, types, and individual struct fields.\n- Accessing an unexported name from outside its package is a real compile error — not just a convention, and not bypassable from outside the package.\n- Idiomatic Go keeps a package's exported surface deliberately minimal — export only what genuinely needs to be part of the public API."}, {"id": "6.7", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 7, "slug": "organizing-a-multi-package-project", "fullTitle": "Organizing a Multi-Package Project", "title": "Organizing a Multi-Package Project", "md": "### Why this matters\n\nA single `main.go` works fine for the examples in this book, but a real project quickly needs more structure: multiple packages, a clear boundary between \"code this project owns privately\" and \"code meant to be reused elsewhere,\" and a predictable place for the actual runnable entry point. Go has a genuinely common, widely-recognized layout for exactly this — and one special folder name the compiler itself treats differently.\n\n### The core idea\n\nA common, idiomatic Go project layout puts the runnable entry point(s) under `cmd/<program-name>/main.go`, and supporting packages elsewhere in the module. A folder literally named **`internal`** gets special, compiler-enforced treatment: any package inside it can only be imported by code within the same module tree rooted at `internal`'s own parent directory — genuinely unreachable from outside, not just discouraged by convention.\n\n### Examples\n\n**1. A realistic layout, with a `cmd/` entry point and an `internal/` supporting package.**\n```\nexample.com/ch67/\n  go.mod\n  cmd/\n    server/\n      main.go\n  internal/\n    db/\n      db.go\n```\n`internal/db/db.go`:\n```go\npackage db\n\nfunc Connect() string {\n\treturn \"connected\"\n}\n```\n`cmd/server/main.go`:\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\n\t\"example.com/ch67/internal/db\"\n)\n\nfunc main() {\n\tfmt.Println(db.Connect())\n}\n```\nRunning it:\n```\ngo run ./cmd/server\n```\nOutput:\n```\nconnected\n```\n`cmd/server` is where the actual runnable program lives — genuinely useful the moment a project has (or might eventually have) more than one entry point (a server, a CLI tool, a migration script), each getting its own `cmd/<name>/main.go`. `internal/db` supplies functionality used by that entry point (and any other code within the same module), without being part of anything meant for outside consumption.\n\n**2. The real, compiler-enforced restriction: `internal` genuinely cannot be imported from outside its module tree.**\n\nFrom a completely separate module (`example.com/outsider`), trying to import `example.com/ch67/internal/db` directly:\n```go\nimport (\n\t\"fmt\"\n\t\"example.com/ch67/internal/db\"\n)\n```\nOutput:\n```\npackage example.com/outsider\n\tmain.go:4:2: use of internal package example.com/ch67/internal/db not allowed\n```\nThis isn't a style guideline or a documentation note — the Go compiler itself refuses to build any code outside `ch67`'s own tree that imports anything under `ch67/internal/`. Anything genuinely meant to be usable by other, separate modules needs to live *outside* an `internal` folder — this is exactly how you draw a hard, enforced line between \"our own implementation details\" and \"our real, public API.\"\n\n### ⚠️ Common Mistakes\n\n- **Putting genuinely reusable, intended-for-external-use code inside `internal/`.** Doing so makes it permanently unreachable from any other module — `internal` is specifically for code that should *never* be imported from outside the current module tree, not a general \"keep this tidy\" folder.\n- **Assuming `internal`'s restriction only applies to genuinely separate modules.** It's actually somewhat broader and more useful than that: any package can only import an `internal` folder if it shares that `internal` folder's *parent* directory somewhere in its own import path — meaning a large single module can use `internal` to wall off one sub-area's implementation details from another sub-area of the *same* module, not just from outside modules entirely.\n- **Skipping `cmd/` for a project that only has one entry point today**, then having to restructure later once a second one (a CLI companion tool, a background worker) is needed. Starting with `cmd/<name>/main.go` from the beginning costs nothing and avoids that later reshuffle.\n- **Over-engineering folder structure for a genuinely small project.** A single `main.go` at the module root, with no `cmd/`/`internal/` split at all, is completely fine and idiomatic for a small enough program — this layout is worth reaching for once a project's real size actually justifies it, not by default for every project regardless of scale.\n\n### How this connects\n\nThe package-boundary discipline from this chapter is exactly what Chapter 6.4's import paths and Chapter 6.6's exported-identifier rules are meant to be used *with*, once a project grows past a single file — `internal` is the one place Go backs that discipline with a real, compiler-enforced wall rather than convention alone.\n\n### Quick recap\n\n- A common Go layout: `cmd/<name>/main.go` for each runnable entry point, supporting packages organized elsewhere in the module.\n- A folder named `internal` gets real, compiler-enforced privacy: only code sharing `internal`'s parent directory in its own import path can import anything inside it — a hard boundary, not a convention.\n- `internal` works within a single large module too, not just between separate modules — useful for walling off one area's implementation details from another area of the same codebase.\n- This structure is worth adopting once a project's real size and shape justify it — a single `main.go` is still completely fine for something genuinely small."}, {"id": "6.8", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 8, "slug": "go-tooling-build-run-vet-fmt-goimports", "fullTitle": "Go Tooling: `build`, `run`, `vet`, `fmt`/`goimports`", "title": "Go Tooling: `build`, `run`, `vet`, `fmt`/`goimports`", "md": "### Why this matters\n\nChapter 0.2 introduced `go run`, `go build`, and `gofmt` just enough to get started. This chapter goes deeper on the everyday tools — especially `go vet`, which catches real, genuine bugs `go build` alone never would, and `goimports`, `gofmt`'s more capable sibling.\n\n### The core idea\n\n`go build` compiles a real, distributable binary; `go run` compiles and immediately executes, for quick iteration. `go vet` performs deeper static analysis than plain compilation — checking things that are syntactically valid Go but almost certainly a real mistake. `gofmt` reformats a file's *style*; `goimports` does everything `gofmt` does, plus automatically adding missing imports and removing unused ones.\n\n### Examples\n\n**1. `go vet` catches a real, genuine bug plain compilation misses entirely.**\n```go\nname := \"Gopher\"\nfmt.Printf(\"Hello, %d\\n\", name)\n```\nThis compiles completely fine — `Printf`'s format string isn't checked by the compiler itself. But:\n```\ngo vet .\n```\n```\nmain.go:7:21: fmt.Printf format %d has arg name of wrong type string\n```\n`%d` expects an integer; `name` is a `string`. `go vet` understands `Printf`'s format-verb conventions specifically and catches this mismatch — a genuinely common real mistake (a wrong format verb, a wrong argument count) that would otherwise only surface as garbled output at runtime, if it's noticed at all. Running `go vet` regularly (and `go test`, Chapter 8.1, runs it automatically) is genuinely worth the habit.\n\n**2. `go build -o name` — producing a binary with a specific name.**\n```\ngo build -o myapp .\n./myapp\n```\nOutput:\n```\nbuilt\n```\n`-o myapp` names the resulting binary explicitly (`.` builds the package in the current directory) — without it, `go build` names the binary after the module, which isn't always what you want.\n\n**3. `go install` — building *and* placing the binary somewhere on your `PATH`.**\n```\ngo install .\n```\nThis compiles the program and places the resulting binary in `$(go env GOPATH)/bin` (named after the module, here `ch68`) — genuinely useful for a command-line tool you want to just type the name of from anywhere, once that `bin` folder is itself on your shell's `PATH`.\n\n**4. `gofmt` alone can't fix a file with genuinely missing imports.**\n```go\npackage main\n\nfunc showTime() {\n\tfmt.Println(time.Now())\n}\n```\nRunning `gofmt` on this changes nothing — `fmt` and `time` are used but never imported, and `gofmt`'s job is purely reformatting *existing*, syntactically-complete code; it has no opinion about missing imports at all.\n\n**5. `goimports` does what `gofmt` does, plus fixing exactly that.**\n```\ngoimports missing_import.go\n```\nOutput:\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc showTime() {\n\tfmt.Println(time.Now())\n}\n```\n`goimports` figured out `fmt.Println` and `time.Now` need `\"fmt\"` and `\"time\"` imported, added both automatically (alphabetized, grouped, exactly matching `gofmt`'s own formatting conventions), and left everything else identical to what `gofmt` alone would have produced. This is exactly why most real Go development setups (including VS Code's Go extension, Chapter 0.2) run `goimports` on save rather than plain `gofmt` — it does strictly more, with zero downside for code that already has correct imports.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a program that compiles cleanly is free of `go vet`-catchable mistakes.** As Example 1 showed, a format-string type mismatch compiles fine and only misbehaves at runtime — `go vet` catches an entire category of bugs the compiler's type checker simply doesn't look for.\n- **Using plain `gofmt` when `goimports` would do strictly more with no downside.** `goimports` is a superset of `gofmt`'s behavior — there's essentially no reason to prefer bare `gofmt` in an editor setup once `goimports` is available.\n- **Forgetting `go install`'s output location needs to actually be on your shell's `PATH`** for the installed command to be runnable by name alone — `$(go env GOPATH)/bin` is the default, but it's not automatically added to `PATH` just by installing Go.\n- **Ignoring `go vet`'s warnings as noise.** It's specifically designed to have a low false-positive rate — unlike a general-purpose linter that might flag purely stylistic concerns, `go vet`'s checks are almost always pointing at something genuinely worth fixing.\n\n### How this connects\n\n`go vet` runs automatically as part of `go test` (Chapter 8.1), and `go build`'s cross-compilation abilities get their own full chapter later (Chapter 8.7) — this chapter's everyday tools are the foundation both build on.\n\n### Quick recap\n\n- `go build` compiles a real binary (`-o name` to control its filename); `go run` compiles and immediately executes, for quick iteration.\n- `go vet` catches real bugs plain compilation misses — most famously, `Printf`-family format-string/argument mismatches.\n- `go install` builds and places the binary in `$(go env GOPATH)/bin`, for a command usable by name once that folder is on `PATH`.\n- `goimports` is a strict superset of `gofmt` — same formatting, plus automatically adding missing imports and removing unused ones."}, {"id": "6.9", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs: packages, modules & tooling", "chapNum": 9, "slug": "command-line-arguments-flag-package", "fullTitle": "Command-Line Arguments & the `flag` Package", "title": "Command-Line Arguments & the `flag` Package", "md": "### Why this matters\n\nA real command-line program almost always needs input from however it was invoked — a filename, a mode switch, a count. Go gives you two levels of this: `os.Args` for the raw, unprocessed argument list, and the `flag` package for genuinely usable, self-documenting named options.\n\n### The core idea\n\n`os.Args` is a `[]string` holding every argument the program was actually invoked with, `os.Args[0]` always being the program's own path. The `flag` package builds proper named options (`-name value`) on top of that: declare each flag's name, type, default, and description up front, call `flag.Parse()` once, then read the values.\n\n### Examples\n\n**1. `os.Args` — the raw, unprocessed argument list.**\n```go\nfmt.Println(os.Args)\nfmt.Println(len(os.Args))\n```\nRun as `./app hello world`:\n```\n[./app hello world]\n3\n```\n`os.Args[0]` is the program's own invocation path; every argument after it is exactly what was typed, as plain strings, with zero parsing or interpretation applied — genuinely useful for the simplest cases, but you'd have to hand-write all the parsing logic yourself for anything beyond \"just grab everything after the program name.\"\n\n**2. `flag` — named, typed, self-documenting options.**\n```go\nname := flag.String(\"name\", \"World\", \"the name to greet\")\ncount := flag.Int(\"count\", 1, \"number of times to greet\")\nverbose := flag.Bool(\"verbose\", false, \"enable verbose output\")\nflag.Parse()\n\nfor i := 0; i < *count; i++ {\n\tfmt.Printf(\"Hello, %s!\\n\", *name)\n}\nif *verbose {\n\tfmt.Println(\"verbose mode on\")\n}\n```\nRun as `./greet -name=Gopher -count=2`:\n```\nHello, Gopher!\nHello, Gopher!\n```\n`flag.String`/`flag.Int`/`flag.Bool` each take a flag name, a default value, and a description, and return a **pointer** (Chapter 5.1) to where the parsed value will actually live — which is exactly why `*name`/`*count`/`*verbose` need dereferencing to read. `flag.Parse()` must be called once, after every flag is declared and before any of their values are read, to actually process `os.Args` against the declared flags.\n\n**3. Both `-flag=value` and `-flag value` syntax work, and unrecognized arguments become \"positional\" arguments.**\n\nRun as `./greet -name Gopher -count 2 -verbose extra positional args`:\n```\nHello, Gopher!\nHello, Gopher!\nverbose mode on\npositional args: [extra positional args]\n```\n`flag` accepts either `-name=value` (Example 2) or `-name value` (space-separated) — both are equally valid. Anything left over after all recognized flags are consumed — here, `extra`, `positional`, `args` — is available afterward through `flag.Args()`, exactly like `os.Args` but with the flags themselves already stripped out.\n\n**4. `-h`/`-help` — genuinely useful, automatically-generated usage text, for free.**\n\nRun as `./greet -h`:\n```\nUsage of ./greet:\n  -count int\n    \tnumber of times to greet (default 1)\n  -name string\n    \tthe name to greet (default \"World\")\n  -verbose\n    \tenable verbose output\n```\nEvery flag's name, type, description, and default value shown here comes directly from the exact arguments passed to `flag.String`/`flag.Int`/`flag.Bool` in Example 2 — this help text requires zero extra code to produce.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `flag.Parse()` entirely.** Without it, every flag variable simply holds its declared default, regardless of what was actually typed on the command line — the values are declared, but never actually populated from `os.Args`, until `Parse()` runs.\n- **Reading a flag's pointer value before calling `flag.Parse()`.** The pointer itself exists immediately from `flag.String`/etc., but what it points *to* isn't the real parsed value until parsing actually happens — reading too early silently gets the default, not a compile error.\n- **Assuming `flag` enforces a flag as \"required.\"** It doesn't — every flag declared with `flag.String`/`Int`/`Bool` has a default and is always optional as far as `flag` itself is concerned; checking that a genuinely required flag was actually provided (e.g., comparing it against its default, or a sentinel) is code you have to write yourself.\n- **Confusing `os.Args` (raw, unparsed, includes the program name at index 0) with `flag.Args()` (only the leftover, non-flag arguments, with the program name and every recognized flag already removed).**\n\n### How this connects\n\nChapter 7.4's file-handling examples and Chapter 9.2's capstone both use exactly this pattern — `flag` for named options, `flag.Args()` for whatever positional input (like a filename) remains — as the standard, idiomatic shape of a real Go command-line tool.\n\n### Quick recap\n\n- `os.Args` is the raw `[]string` of everything the program was invoked with, `os.Args[0]` being the program's own path.\n- `flag.String`/`flag.Int`/`flag.Bool` declare named options with a default and description, returning a pointer to the eventual parsed value.\n- `flag.Parse()` must run once, after declaring every flag and before reading any of their values.\n- `flag.Args()` returns whatever's left over after recognized flags are consumed; `-h`/`-help` produces usage text automatically, with zero extra code.\n- `flag` never enforces a flag as required — every flag is optional with a default; requiredness is application logic you write yourself."}, {"id": "7.1", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 1, "slug": "fmt-in-depth", "fullTitle": "`fmt` In Depth", "title": "`fmt` In Depth", "md": "### Why this matters\n\nYou've used `fmt.Println` and `fmt.Printf` since Chapter 1.1, but only a handful of format verbs so far. This chapter covers the rest of `fmt`'s real, everyday vocabulary — the difference between `%v` and `%+v` specifically trips up almost everyone the first time they need it.\n\n### The core idea\n\n`fmt.Printf`'s format string uses `%` followed by a **verb** letter to control how each argument prints — `%d` for a decimal integer, `%s` for a string, `%v` for \"whatever's the sensible default for this value's type,\" and more. Width, padding, and precision can be added as numbers between `%` and the verb. `Println`/`Printf` have `Sprintln`/`Sprintf` siblings that return a string instead of printing, and `Fprintln`/`Fprintf` siblings that write to any `io.Writer` (Chapter 7.2) instead of the screen.\n\n### Examples\n\n**1. `%v`, `%+v`, and `%#v` — three levels of detail for a struct, and Stringer's interaction with them.**\n```go\ntype Point struct {\n\tX, Y int\n}\nfunc (p Point) String() string {\n\treturn fmt.Sprintf(\"Point(%d, %d)\", p.X, p.Y)\n}\n\np := Point{X: 3, Y: 4}\nfmt.Printf(\"%v\\n\", p)\nfmt.Printf(\"%+v\\n\", p)\nfmt.Printf(\"%#v\\n\", p)\nfmt.Printf(\"%T\\n\", p)\n```\nOutput:\n```\nPoint(3, 4)\nPoint(3, 4)\nmain.Point{X:3, Y:4}\nmain.Point\n```\n`%v` and `%+v` both called `Point`'s `String()` method (Chapter 5.5) — a type satisfying `Stringer` overrides both. Only `%#v` (Go-syntax representation, showing the literal that would recreate the value) bypasses `Stringer` entirely, which is exactly what makes it genuinely useful for debugging: it shows the real, raw field values regardless of any custom `String()` method. For a type *without* a `Stringer` method, `%v` and `%+v` actually differ:\n```go\ntype Plain struct {\n\tX, Y int\n}\np := Plain{X: 3, Y: 4}\nfmt.Printf(\"%v\\n\", p)\nfmt.Printf(\"%+v\\n\", p)\n```\n```\n{3 4}\n{X:3 Y:4}\n```\n`%+v` adds field names — genuinely useful the moment a struct has more than a couple of fields and `{3 4}` alone wouldn't be self-explanatory.\n\n**2. Numeric formatting — base, width, and padding.**\n```go\nfmt.Printf(\"%d\\n\", 42)\nfmt.Printf(\"%5d\\n\", 42)\nfmt.Printf(\"%-5d|\\n\", 42)\nfmt.Printf(\"%05d\\n\", 42)\nfmt.Printf(\"%x\\n\", 255)\nfmt.Printf(\"%b\\n\", 5)\n```\nOutput:\n```\n42\n   42\n42   |\n00042\nff\n101\n```\n`%5d` right-pads to a minimum width of 5 characters (with spaces); `%-5d` left-aligns instead (padding on the right, visible against the trailing `|`); `%05d` pads with zeros instead of spaces. `%x` (hexadecimal) and `%b` (binary) reformat the same integer in a different base entirely.\n\n**3. Floating-point precision.**\n```go\nfmt.Printf(\"%f\\n\", 3.14159)\nfmt.Printf(\"%.2f\\n\", 3.14159)\n```\nOutput:\n```\n3.141590\n3.14\n```\n`%f` alone defaults to 6 decimal places; `%.2f` explicitly controls precision — genuinely essential the moment a float shouldn't be printed with more decimal digits than actually matter (Chapter 2.1's float-precision chapter is exactly why this control exists).\n\n**4. Strings and booleans.**\n```go\nfmt.Printf(\"%s\\n\", \"hello\")\nfmt.Printf(\"%q\\n\", \"hello\")\nfmt.Printf(\"%t\\n\", true)\n```\nOutput:\n```\nhello\n\"hello\"\ntrue\n```\n`%q` wraps a string in quotes (and escapes any special characters inside it) — genuinely useful in log output or error messages, where knowing exactly where a string's content starts and ends (especially if it might contain leading/trailing spaces) matters.\n\n**5. `Sprintf` — build a string instead of printing it directly.**\n```go\ns := fmt.Sprintf(\"formatted: %d\", 42)\nfmt.Println(s)\n```\nOutput:\n```\nformatted: 42\n```\nEvery `Print`-family function (`Println`, `Printf`, `Print`) has an `S`-prefixed sibling (`Sprintln`, `Sprintf`, `Sprint`) that returns the formatted result as a `string` instead of writing it anywhere — genuinely common the moment formatted text needs to be stored, returned, or passed along rather than immediately displayed. Chapter 6.1's `Error()` methods and Chapter 5.5's `String()` methods both typically use `Sprintf` internally for exactly this reason.\n\n### ⚠️ Common Mistakes\n\n- **Using `%v` when `%+v` would actually be more useful**, and getting an unlabeled `{3 4}` that's genuinely hard to interpret for a struct with several fields of the same type.\n- **Forgetting `%#v` bypasses a `Stringer` method**, and being confused why it shows raw field values when `%v`/`%+v` show something else entirely — this is deliberate, specifically for debugging when you need the real underlying data regardless of custom formatting.\n- **Using the wrong verb for a value's type** — this is exactly what `go vet` (Chapter 6.8) specifically checks for and catches, so a mismatch rarely survives past the first `go vet`/`go test` run, but it's worth understanding *why* the check exists: a mismatched verb doesn't error at runtime, it just silently prints something wrong or unhelpful.\n- **Reaching for string concatenation (`+`) to build a complex formatted message** instead of `Sprintf`, producing code that's both harder to read and easier to get subtly wrong (missing a space, wrong argument order) than one clear format string with its arguments listed afterward.\n\n### How this connects\n\n`Sprintf` is exactly what Chapter 6.1's `Error()` methods and Chapter 5.5's `String()` methods use internally to build their returned text — and `Fprintf`/`Fprintln` (writing to any `io.Writer`) become directly useful the moment Chapter 7.2 introduces what an `io.Writer` actually is.\n\n### Quick recap\n\n- `%v` uses a type's `Stringer` method if it has one, otherwise a sensible default; `%+v` adds field names for a plain struct (still deferring to `Stringer` if present); `%#v` always shows the raw Go-syntax representation, bypassing `Stringer` entirely.\n- Width/padding (`%5d`, `%-5d`, `%05d`) and float precision (`%.2f`) are controlled with numbers between `%` and the verb.\n- `%q` quotes and escapes a string; `%x`/`%b` reformat an integer in hex/binary.\n- `Sprintf`/`Sprintln`/`Sprint` return a formatted string instead of printing it; `Fprintf`/`Fprintln` write to any `io.Writer` instead of the screen."}, {"id": "7.2", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 2, "slug": "io-reader-io-writer-gos-universal-interfaces", "fullTitle": "`io.Reader` & `io.Writer`: Go's Universal Interfaces", "title": "`io.Reader` & `io.Writer`: Go's Universal Interfaces", "md": "### Why this matters\n\nThis is the single best real-world example of Chapter 5.5's \"favor small interfaces\" philosophy in the entire standard library. `io.Reader` and `io.Writer` each require exactly one method, and between them, they let Go treat a file, a network connection, an in-memory buffer, standard input, and a string all as \"something you can read from\" or \"something you can write to\" — completely interchangeably.\n\n### The core idea\n\n```go\ntype Reader interface {\n\tRead(p []byte) (n int, err error)\n}\ntype Writer interface {\n\tWrite(p []byte) (n int, err error)\n}\n```\n`Read` fills the given `[]byte` with up to that many bytes, returning how many it actually read and an error — importantly, **`io.EOF`** (a specific, sentinel `error` value, checkable with `errors.Is` or a direct `==` comparison) when there's genuinely nothing left to read, not an unusual failure. `Write` sends the given `[]byte` somewhere, returning how many bytes it actually wrote.\n\n### Examples\n\n**1. Reading from a `strings.Reader` in a loop, handling `io.EOF` correctly.**\n```go\nr := strings.NewReader(\"Hello, Reader!\")\nbuf := make([]byte, 5)\nfor {\n\tn, err := r.Read(buf)\n\tfmt.Printf(\"n=%d err=%v data=%q\\n\", n, err, buf[:n])\n\tif err == io.EOF {\n\t\tbreak\n\t}\n}\n```\nOutput:\n```\nn=5 err=<nil> data=\"Hello\"\nn=5 err=<nil> data=\", Rea\"\nn=4 err=<nil> data=\"der!\"\nn=0 err=EOF data=\"\"\n```\n`strings.NewReader` wraps a plain `string` in something satisfying `io.Reader`. Each call fills `buf` with up to 5 bytes; the final call returns `0` bytes and `io.EOF`, the standard, universal signal \"there's nothing left\" — not a crash, not a special case to fear, just the expected way any `Reader` announces it's done.\n\n**2. `bytes.Buffer` — a genuinely universal in-memory `io.Writer` (and `io.Reader`, though this example only writes to it).**\n```go\nvar w bytes.Buffer\nw.Write([]byte(\"Hello, \"))\nw.WriteString(\"Writer!\")\nfmt.Println(w.String())\n```\nOutput:\n```\nHello, Writer!\n```\n`bytes.Buffer` satisfies `io.Writer` (its `Write` method matches exactly), plus offers convenience methods like `WriteString` and `String()` on top. Chapter 7.14's HTTP handling and Chapter 8.1's testing both lean on `bytes.Buffer` constantly — it's the standard \"capture output somewhere in-memory, to inspect later\" tool.\n\n**3. `io.Copy` — the real payoff of these interfaces being this small and universal.**\n```go\nsrc := strings.NewReader(\"copy this data\")\nvar dst bytes.Buffer\nn, err := io.Copy(&dst, src)\nfmt.Println(n, err, dst.String())\n```\nOutput:\n```\n14 <nil> copy this data\n```\n`io.Copy(dst, src)` reads everything from *any* `io.Reader` and writes it to *any* `io.Writer`, handling the read/write/`EOF` loop from Example 1 internally, once, for every possible combination of reader and writer that will ever exist — a file to a network connection, a string to a buffer, standard input to a file, all the exact same one-line call. This is precisely the payoff of `Reader`/`Writer` being minimal, implicit interfaces (Chapter 5.5): nobody had to coordinate in advance for `strings.Reader` and `bytes.Buffer` to work together seamlessly through `io.Copy` — they simply both happen to have the one required method each.\n\n**4. Confirming the concrete types underneath, and that they're genuinely different implementations sharing the same interfaces.**\n```go\nfmt.Printf(\"%T\\n\", strings.NewReader(\"\"))\nfmt.Printf(\"%T\\n\", &bytes.Buffer{})\n```\nOutput:\n```\n*strings.Reader\n*bytes.Buffer\n```\nTwo completely unrelated concrete types, from two different packages, neither aware the other exists — both usable anywhere an `io.Reader`/`io.Writer` is expected, purely because each happens to have the right method.\n\n### ⚠️ Common Mistakes\n\n- **Treating a non-zero-but-partial `Read` result, or an `err == io.EOF` alongside real data, as an error condition to abort on immediately.** Per `io.Reader`'s own documented contract (verified directly via `go doc io.Reader`), a `Read` call can legitimately return fewer bytes than requested, and the final chunk of real data can arrive in the *same* call that also reports `io.EOF` — always process whatever `n` bytes came back before checking `err`, exactly as Example 1's loop does.\n- **Reimplementing a read-until-empty loop by hand** instead of reaching for `io.Copy` (or `io.ReadAll`, for \"just give me everything as one `[]byte`\") when one of those already does exactly what's needed.\n- **Forgetting `bytes.Buffer` needs to be passed as `&dst` (a pointer) to functions expecting `io.Writer`**, since `Write`'s receiver is a pointer receiver (Chapter 5.4) — a bare, non-pointer `bytes.Buffer` value doesn't itself satisfy `io.Writer`.\n- **Assuming `io.EOF` means something went wrong.** It's the normal, expected way a `Reader` signals \"no more data\" — checking for it and stopping cleanly (Example 1) is the correct, idiomatic response, not something to log as an error.\n\n### How this connects\n\nChapter 7.4's file I/O, Chapter 7.14's HTTP request/response bodies, and Chapter 7.9's channel-based concurrency patterns all lean on exactly this pair of interfaces — once you recognize `io.Reader`/`io.Writer`, an enormous amount of the standard library's API surface stops looking like separate things to memorize and starts looking like the same two interfaces, over and over, in different clothes.\n\n### Quick recap\n\n- `io.Reader` (`Read(p []byte) (n int, err error)`) and `io.Writer` (`Write(p []byte) (n int, err error)`) are each one-method interfaces, satisfied implicitly by files, network connections, in-memory buffers, and more.\n- `io.EOF` is the standard sentinel error signaling \"no more data\" — a normal, expected outcome, not a failure.\n- `io.Copy(dst, src)` reads everything from any `Reader` and writes it to any `Writer` in one call — the direct payoff of these interfaces being small and implicit.\n- `bytes.Buffer` is the standard in-memory type satisfying both interfaces at once, genuinely everywhere in real Go code for capturing or building up data."}, {"id": "7.3", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 3, "slug": "strings-strconv", "fullTitle": "`strings` & `strconv`", "title": "`strings` & `strconv`", "md": "### Why this matters\n\nChapter 2.3 introduced `strconv.Itoa`/`Atoi` for the single number-to-text conversion the very next chapter needed. This chapter covers the rest of both packages' everyday, constantly-used vocabulary — the functions you'll reach for in nearly every program that touches text at all.\n\n### The core idea\n\n`strings` covers everyday text inspection and transformation — trimming, casing, searching, splitting, joining, and efficient construction via `strings.Builder`. `strconv` covers converting between text and every other basic type, always following the same `(value, error)` shape Chapter 2.3 already established for `Atoi`.\n\n### Examples\n\n**1. Trimming, casing, and searching.**\n```go\ns := \"  Hello, Gopher World!  \"\nfmt.Println(strings.TrimSpace(s))\nfmt.Println(strings.ToUpper(s))\nfmt.Println(strings.ToLower(s))\nfmt.Println(strings.Contains(s, \"Gopher\"))\n```\nOutput:\n```\nHello, Gopher World!\n  HELLO, GOPHER WORLD!  \n  hello, gopher world!  \ntrue\n```\n`TrimSpace` removes leading/trailing whitespace only (the middle is untouched); `ToUpper`/`ToLower` reformat case entirely; `Contains` checks for a substring, case-sensitively.\n\n**2. Prefix/suffix checks — genuinely common for filenames, URLs, and command parsing.**\n```go\nfmt.Println(strings.HasPrefix(\"filename.txt\", \"file\"))\nfmt.Println(strings.HasSuffix(\"filename.txt\", \".txt\"))\n```\nOutput:\n```\ntrue\ntrue\n```\n\n**3. Replacing — one occurrence, or all of them.**\n```go\nfmt.Println(strings.Replace(s, \"o\", \"0\", 1))\nfmt.Println(strings.ReplaceAll(s, \"o\", \"0\"))\n```\nOutput:\n```\n  Hell0, Gopher World!  \n  Hell0, G0pher W0rld!  \n```\n`Replace`'s last argument caps how many replacements happen (`1` here, replacing only the first `o`); `ReplaceAll` is shorthand for passing `-1` (unlimited).\n\n**4. Splitting, joining, and field-based whitespace splitting.**\n```go\nfmt.Println(strings.Split(\"a,b,c\", \",\"))\nfmt.Println(strings.Fields(\"  a   b  c \"))\nfmt.Println(strings.Join([]string{\"a\", \"b\", \"c\"}, \"-\"))\n```\nOutput:\n```\n[a b c]\n[a b c]\na-b-c\n```\n`Split` divides on an exact separator; `Fields` specifically splits on runs of whitespace (any amount, including none between words at the edges) — genuinely more useful than `Split(s, \" \")` for real-world text that might have inconsistent spacing. `Join` is the reverse of `Split`, gluing a slice back into one string with a separator between each element.\n\n**5. Counting, repeating, and finding a position.**\n```go\nfmt.Println(strings.Count(\"cheese\", \"e\"))\nfmt.Println(strings.Repeat(\"ab\", 3))\nfmt.Println(strings.Index(\"chicken\", \"ken\"))\n```\nOutput:\n```\n3\nababab\n4\n```\n`Count` counts non-overlapping occurrences; `Repeat` builds a string by repeating another one; `Index` returns the byte position (Chapter 2.2's byte-vs-rune distinction applies here too) of the first match, or `-1` if not found.\n\n**6. `strings.Builder` — efficient string construction, avoiding repeated allocation.**\n```go\nvar b strings.Builder\nfor i := 0; i < 3; i++ {\n\tb.WriteString(\"go\")\n}\nfmt.Println(b.String())\n```\nOutput:\n```\ngogogo\n```\nRepeatedly using `+=` to build up a string in a loop reallocates a brand-new string on every single iteration (strings are immutable, Chapter 2.2) — genuinely wasteful for anything beyond a handful of iterations. `strings.Builder` accumulates internally far more efficiently, only producing the final string once, when `.String()` is actually called.\n\n**7. `strconv` beyond `Itoa`/`Atoi` — parsing and formatting other types.**\n```go\nf, err := strconv.ParseFloat(\"3.14\", 64)\nfmt.Println(f, err)\nbo, err2 := strconv.ParseBool(\"true\")\nfmt.Println(bo, err2)\nfs := strconv.FormatFloat(3.14159, 'f', 2, 64)\nfmt.Println(fs)\n```\nOutput:\n```\n3.14 <nil>\ntrue <nil>\n3.14\n```\n`ParseFloat`/`ParseBool` follow the exact same `(value, error)` shape as `Atoi` (Chapter 2.3) — always check the error, never assume input text is valid. `FormatFloat`'s arguments (format character, precision, bit size) mirror `Printf`'s `%f`/`%.2f` verbs (Chapter 7.1) but as an explicit function call, useful when you need the formatted string itself rather than printing it directly.\n\n### ⚠️ Common Mistakes\n\n- **Using `strings.Split(s, \" \")` on real-world text with inconsistent spacing**, getting empty strings in the result for any run of multiple spaces. `strings.Fields` is almost always the better choice for splitting on \"whitespace, generally.\"\n- **Building a string with `+=` in a loop that runs more than a handful of times.** `strings.Builder` (Example 6) avoids the repeated reallocation this causes — genuinely worth the switch once a loop's iteration count is unpredictable or potentially large.\n- **Forgetting `strconv`'s parsing functions can fail on real input** and skipping the error check, exactly the same risk Chapter 2.3 already flagged for `Atoi`.\n- **Confusing `strings.Index` (a substring's position) with `strings.Contains` (just a yes/no)** — reach for `Contains` when only the yes/no answer matters; `Index` when the actual position is needed for something further (like slicing around it).\n\n### How this connects\n\n`strings.Builder` reappears constantly in Chapter 7.5's JSON handling and anywhere Chapter 8.3's benchmarking tools reveal repeated string concatenation as a real bottleneck; the `(value, error)` parsing pattern from `strconv` is the same shape you'll see in nearly every standard-library function that can fail on bad input, all the way through Part VII.\n\n### Quick recap\n\n- `strings.TrimSpace`/`ToUpper`/`ToLower`/`Contains`/`HasPrefix`/`HasSuffix` cover the everyday text-inspection basics.\n- `Replace`(with a count)/`ReplaceAll`, `Split`/`Join`, and `Fields` (whitespace-aware splitting) cover the everyday text-transformation basics.\n- `strings.Builder` avoids the real inefficiency of repeated `+=` string concatenation in a loop.\n- `strconv.ParseFloat`/`ParseBool`/`FormatFloat` (and more) extend Chapter 2.3's `Atoi`/`Itoa` pattern to every other basic type, always following the same `(value, error)` shape."}, {"id": "7.4", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 4, "slug": "file-io-os-bufio", "fullTitle": "File I/O: `os` & `bufio`", "title": "File I/O: `os` & `bufio`", "md": "### Why this matters\n\nReading and writing files is one of the most common things a real program does, and Go gives you two levels of it: `os` for the simple, whole-file case, and `bufio` for efficient, line-by-line or buffered access when a file is too large (or too naturally line-oriented) to read all at once.\n\n### The core idea\n\n`os.ReadFile`/`os.WriteFile` handle an entire file at once — the simplest option, fine for anything small. `os.Open`/`os.Create` return an `*os.File` (a real `io.Reader`/`io.Writer`, Chapter 7.2) for more control, typically wrapped in a `bufio.Scanner` or `bufio.Writer` the moment a file is too large or naturally line-oriented to handle all at once.\n\n### Examples\n\n**1. `os.WriteFile`/`os.ReadFile` — the simplest possible whole-file operations.**\n```go\nerr := os.WriteFile(\"test.txt\", []byte(\"line1\\nline2\\nline3\\n\"), 0644)\nfmt.Println(err)\n\ndata, err := os.ReadFile(\"test.txt\")\nfmt.Println(string(data), err)\n```\nOutput:\n```\n<nil>\nline1\nline2\nline3\n <nil>\n```\n`os.WriteFile` takes a filename, the raw bytes to write, and a permission mode (`0644` — a Unix-style permission, readable/writable by the owner, readable by everyone else); `os.ReadFile` reads an entire file into memory as `[]byte` in one call. Both are perfect for small files where \"just get the whole thing\" is genuinely the simplest approach.\n\n**2. `os.Open` + `bufio.Scanner` — reading a file line by line, without loading it all at once.**\n```go\nf, err := os.Open(\"test.txt\")\nif err != nil {\n\tfmt.Println(\"open error:\", err)\n\treturn\n}\ndefer f.Close()\n\nscanner := bufio.NewScanner(f)\nfor scanner.Scan() {\n\tfmt.Println(\"line:\", scanner.Text())\n}\n```\nOutput:\n```\nline: line1\nline: line2\nline: line3\n```\n`os.Open` returns an `*os.File` (which satisfies `io.Reader`, Chapter 7.2) and an error — checked immediately, with `defer f.Close()` right after (Chapter 3.7's cleanup pattern, applied to exactly the situation it's meant for). `bufio.Scanner` wraps that `io.Reader`, and `Scan()`/`Text()` together give you one line at a time — genuinely important for a file too large to comfortably hold entirely in memory, which `os.ReadFile` would otherwise require.\n\n**3. `os.Stat` — file metadata, without reading its contents.**\n```go\ninfo, err := os.Stat(\"test.txt\")\nfmt.Println(info.Name(), info.Size(), err)\n```\nOutput:\n```\ntest.txt 18 <nil>\n```\n`os.Stat` returns an `os.FileInfo` with the file's name, size (in bytes), permissions, and modification time — useful whenever a program needs to know *about* a file without opening and reading it.\n\n**4. A real, checkable \"file doesn't exist\" error.**\n```go\n_, err2 := os.ReadFile(\"nonexistent.txt\")\nfmt.Println(err2)\n\n_, err3 := os.ReadFile(\"truly-does-not-exist.txt\")\nfmt.Println(os.IsNotExist(err3))\n```\nOutput:\n```\nopen nonexistent.txt: no such file or directory\ntrue\n```\nThe error message is genuinely descriptive on its own, but `os.IsNotExist(err)` is the reliable, idiomatic way to check *specifically* \"did this fail because the file doesn't exist,\" as opposed to a permissions problem or some other I/O failure — exactly the kind of specific check Chapter 6.2's `errors.Is` covers more generally, applied here to file operations specifically.\n\n**5. `os.Create` + `bufio.Writer` — buffered writing, flushed explicitly.**\n```go\nout, err := os.Create(\"output.txt\")\nif err != nil {\n\tfmt.Println(err)\n\treturn\n}\ndefer out.Close()\nw := bufio.NewWriter(out)\nw.WriteString(\"buffered write\\n\")\nw.Flush()\n```\n`os.Create` makes a new file (overwriting one that already exists) and returns an `*os.File`, which satisfies `io.Writer` directly. `bufio.NewWriter` wraps it to batch up small writes internally rather than hitting the actual filesystem on every single call — genuinely faster for a program doing many small writes in sequence. **`w.Flush()` is not optional**: without it, buffered data that hasn't yet reached its internal buffer's capacity may never actually reach the file at all.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `bufio.Writer.Flush()`.** Buffered writes sit in memory until the buffer fills up or `Flush()` is called explicitly — a program that writes a small amount of data and exits without flushing can lose it entirely, with no error to indicate anything went wrong.\n- **Using `os.ReadFile` on a file that might be very large.** It loads the entire file into memory at once — `bufio.Scanner` (or `bufio.Reader` for non-line-oriented data) processes a file incrementally instead, with much lower memory use.\n- **Checking a file-not-found error by comparing its message text**, instead of `os.IsNotExist(err)` (or `errors.Is(err, os.ErrNotExist)`, the more general modern form). Message text is for humans; the dedicated check is reliable regardless of the exact wording.\n- **Forgetting `defer f.Close()` right after a successful `os.Open`/`os.Create`.** Exactly Chapter 3.7's cleanup pattern — skipping it leaves file handles open longer than necessary, a real resource leak in a long-running program that opens many files over its lifetime.\n\n### How this connects\n\n`bufio.Scanner`'s line-by-line pattern reappears constantly for reading configuration files, logs, and CSV-like data; Chapter 7.5's JSON handling builds directly on the same `io.Reader`/`io.Writer` foundation (via `json.NewDecoder`/`json.NewEncoder`) rather than always requiring a full in-memory byte slice.\n\n### Quick recap\n\n- `os.WriteFile`/`os.ReadFile` handle a whole file at once — simplest option, fine for small files.\n- `os.Open`/`os.Create` return an `*os.File` (an `io.Reader`/`io.Writer`) for more control — always paired with `defer f.Close()` immediately after a successful open.\n- `bufio.Scanner` reads line by line without loading an entire file into memory; `bufio.Writer` batches small writes for efficiency, but **must** be `Flush()`ed to guarantee data actually reaches the file.\n- `os.Stat` gets file metadata without reading its contents; `os.IsNotExist(err)` is the reliable way to check specifically for a missing-file error."}, {"id": "7.5", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, concurrency, and writing it well", "chapNum": 5, "slug": "working-with-json-encoding-json", "fullTitle": "Working with JSON: `encoding/json`", "title": "Working with JSON: `encoding/json`", "md": "### Why this matters\n\nJSON is the de facto data format for APIs, config files, and countless other real-world exchanges. Chapter 2.9 previewed struct tags specifically for this; this chapter is where `encoding/json` gets its full, real treatment — encoding, decoding, nested data, and the genuine gotchas that come with converting between Go's static types and JSON's looser ones.\n\n### The core idea\n\n`json.Marshal`/`Unmarshal` convert between a Go value and a `[]byte` of JSON text in one call; `json.NewEncoder`/`NewDecoder` do the same directly against any `io.Writer`/`io.Reader` (Chapter 7.2), avoiding an intermediate byte slice. Struct tags (Chapter 2.9) control field naming and behavior either way.\n\n### Examples\n\n**1. Marshaling a struct — nested types and tags, all working together.**\n```go\ntype Address struct {\n\tCity string `json:\"city\"`\n\tZip  string `json:\"zip\"`\n}\ntype Person struct {\n\tName    string   `json:\"name\"`\n\tAge     int      `json:\"age\"`\n\tAddress Address  `json:\"address\"`\n\tTags    []string `json:\"tags,omitempty\"`\n}\n\np := Person{Name: \"Alice\", Age: 30, Address: Address{City: \"Metropolis\", Zip: \"12345\"}}\nb, err := json.Marshal(p)\nfmt.Println(string(b), err)\n```\nOutput:\n```\n{\"name\":\"Alice\",\"age\":30,\"address\":{\"city\":\"Metropolis\",\"zip\":\"12345\"}} <nil>\n```\nNested structs marshal naturally into nested JSON objects. `Tags` (a `nil` slice, since it was never set) doesn't appear at all — exactly Chapter 2.9's `omitempty` in action.\n\n**2. `MarshalIndent` — human-readable, pretty-printed JSON.**\n```go\npretty, _ := json.MarshalIndent(p, \"\", \"  \")\nfmt.Println(string(pretty))\n```\nOutput:\n```json\n{\n  \"name\": \"Alice\",\n  \"age\": 30,\n  \"address\": {\n    \"city\": \"Metropolis\",\n    \"zip\": \"12345\"\n  }\n}\n```\nThe second and third arguments are a line prefix (usually empty) and the per-level indent string — genuinely useful for config files or debug output meant for a human to actually read, at the cost of extra bytes `Marshal` alone wouldn't produce.\n\n**3. Unmarshaling — JSON text into a real, typed Go struct.**\n```go\njsonStr := `{\"name\":\"Bob\",\"age\":25,\"address\":{\"city\":\"Gotham\",\"zip\":\"54321\"}}`\nvar p2 Person\nerr := json.Unmarshal([]byte(jsonStr), &p2)\nfmt.Println(p2, err)\n```\nOutput:\n```\n{Bob 25 {Gotham 54321} []} <nil>\n```\n`Unmarshal` needs a pointer (`&p2`) — it writes the decoded data directly into the struct you already have, exactly like Chapter 5.2's mutation-through-a-pointer pattern.\n\n**4. A real, descriptive error on a type mismatch.**\n```go\nbadJSON := `{\"name\": \"Bad\", \"age\": \"not a number\"}`\nvar p3 Person\nerr := json.Unmarshal([]byte(badJSON), &p3)\nfmt.Println(err)\n```\nOutput:\n```\njson: cannot unmarshal string into Go struct field Person.age of type int\n```\n`Unmarshal` returns a genuine, specific error the moment JSON data doesn't match the target struct's types — never silently truncating or guessing.\n\n**5. Decoding into `map[string]interface{}` — when the exact shape isn't known ahead of time.**\n```go\nvar generic map[string]interface{}\njson.Unmarshal([]byte(jsonStr), &generic)\nfmt.Println(generic)\nfmt.Printf(\"%T\\n\", generic[\"age\"])\n```\nOutput:\n```\nmap[address:map[city:Gotham zip:54321] age:25 name:Bob]\nfloat64\n```\nWithout a target struct, `encoding/json` decodes into whatever generic Go types can represent arbitrary JSON: objects become `map[string]interface{}`, and — this is the genuinely important, easy-to-miss part — **every JSON number becomes a `float64`**, never an `int`, regardless of whether it looked like a whole number in the source text. Reading `generic[\"age\"]` expecting an `int` and getting a `float64` instead is one of the most common real `encoding/json` surprises.\n\n**6. `json.NewEncoder`/`json.NewDecoder` — streaming to and from any `io.Writer`/`io.Reader` (Chapter 7.2), not just a `[]byte` in memory.**\n```go\nvar buf bytes.Buffer\nenc := json.NewEncoder(&buf)\nenc.Encode(p)\nfmt.Print(buf.String())\n\ndec := json.NewDecoder(bytes.NewReader([]byte(jsonStr)))\nvar p4 Person\ndec.Decode(&p4)\nfmt.Println(p4)\n```\nOutput:\n```\n{\"name\":\"Alice\",\"age\":30,\"address\":{\"city\":\"Metropolis\",\"zip\":\"12345\"}}\n{Bob 25 {Gotham 54321} []}\n```\n`json.NewEncoder(w).Encode(v)` and `json.NewDecoder(r).Decode(&v)` do the same job as `Marshal`/`Unmarshal`, but work directly against any `io.Writer`/`io.Reader` — genuinely preferable for Chapter 7.14's HTTP request/response bodies, where the data is naturally a stream rather than something you'd want to buffer entirely into a `[]byte` first.\n\n### ⚠️ Common Mistakes\n\n- **Expecting a decoded generic number to be an `int`.** As Example 5 showed, `encoding/json` always uses `float64` for numbers decoded into `interface{}` — a type assertion expecting `int` (Chapter 5.6) will fail; either assert `float64` and convert, or decode into a concrete struct with a real `int`
