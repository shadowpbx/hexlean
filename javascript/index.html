first invocation, without needing a manual `removeEventListener` call at all.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting events bubble by default**, causing an unrelated ancestor's listener to fire unexpectedly for a click that happened on a descendant. As Example 1 showed, this is genuinely the default behavior, not a bug — `stopPropagation()` (Example 2) is the fix when it's truly unwanted.\n- **Passing a new, inline arrow function to both `addEventListener` and a later `removeEventListener` call, expecting it to match.** As Example 5 showed, removal requires the *exact same function reference* — an inline arrow function created fresh each time can never be removed this way.\n- **Forgetting `preventDefault()` when building custom form validation or a custom link-click behavior.** Without it, as Example 3 implied, the browser's own default action (navigation, form submission) still happens alongside your own handler's logic.\n- **Manually calling `removeEventListener` for a listener that only ever needs to run once**, when `{ once: true }` (Example 7) already does exactly that automatically.\n\n### How this connects\n\nThis closes out Part Seven's browser-specific preview, alongside Chapter 7.9. Chapter 7.11 (Building a Simple HTTP Server with Node) returns to Node-based, server-side code — the canonical environment for the remainder of this book.\n\n### Quick recap\n\n- Events bubble upward through every ancestor element by default; `e.stopPropagation()` stops that bubbling explicitly.\n- `e.preventDefault()` cancels an event's built-in default action (navigation, form submission) without stopping the listener's own code from running.\n- Multiple `addEventListener` calls on the same element and event all run, in registration order — unlike the older single-listener `onclick`-style assignment.\n- `removeEventListener` requires the exact same function reference originally passed to `addEventListener` — an inline function can never be removed this way.\n- `{ once: true }` automatically removes a listener after its first invocation, with no manual cleanup needed."}, {"id": "7.11", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 11, "slug": "building-a-simple-http-server-with-node", "fullTitle": "Building a Simple HTTP Server with Node", "title": "Building a Simple HTTP Server with Node", "md": "### Why this matters\n\nChapter 7.8 covered `fetch` — making requests as a *client*. This chapter covers the other side: Node's built-in `http` module, which is what actually receives and responds to those requests. Understanding this directly demystifies what a web framework like Express is actually built on top of.\n\n### The core idea\n\n`http.createServer(callback)` creates a server whose `callback` runs once for every incoming request, receiving a `request` object (the incoming data — URL, method, headers, body) and a `response` object (used to send data back). Calling `.listen(port)` starts the server actually accepting connections on that port.\n\n### Examples\n\n**1. A basic server — routing by URL, responding with plain text.**\n```js\nconst http = require(\"http\");\n\nconst server = http.createServer((req, res) => {\n  console.log(req.method, req.url);\n  if (req.url === \"/\") {\n    res.writeHead(200, { \"Content-Type\": \"text/plain\" });\n    res.end(\"Hello from Node!\");\n  } else {\n    res.writeHead(404, { \"Content-Type\": \"text/plain\" });\n    res.end(\"Not Found\");\n  }\n});\n\nserver.listen(3939, () => console.log(\"server listening\"));\n```\nMaking a real request against it (verified using `fetch`, Chapter 7.8):\n```js\nconst res = await fetch(\"http://localhost:3939/\");\nconsole.log(res.status, await res.text());\n```\nOutput:\n```\nserver listening\nGET /\n200 Hello from Node!\n```\n`req.method` and `req.url` describe the incoming request. `res.writeHead(status, headers)` sets the response's status code and headers; `res.end(body)` sends the response body and closes it — nothing is actually sent to the client until `.end()` is called.\n\n**2. Serving JSON — combining this chapter with Chapter 7.4's `JSON.stringify`.**\n```js\n} else if (req.url === \"/json\") {\n  res.writeHead(200, { \"Content-Type\": \"application/json\" });\n  res.end(JSON.stringify({ message: \"hi\" }));\n}\n```\n```js\nconst res = await fetch(\"http://localhost:3939/json\");\nconsole.log(res.status, await res.json());\n```\nOutput:\n```\n200 { message: 'hi' }\n```\nSetting `\"Content-Type\": \"application/json\"` explicitly tells the client how to interpret the body — exactly the header `fetch` (Chapter 7.8) itself sends on the request side for a JSON `POST` body.\n\n**3. A route that doesn't match anything — a real, ordinary 404.**\n```js\nconst res = await fetch(\"http://localhost:3939/nope\");\nconsole.log(res.status, await res.text());\n```\nOutput:\n```\n404 Not Found\n```\nThere's nothing magic about a 404 — it's simply whatever status code and body the server's own code chooses to send back when no route matches, exactly like the `else` branch in Example 1.\n\n**4. Reading a request body — genuinely arrives as a stream, not all at once.**\n```js\n} else if (req.url === \"/echo\" && req.method === \"POST\") {\n  let body = \"\";\n  req.on(\"data\", (chunk) => { body += chunk; });\n  req.on(\"end\", () => {\n    res.writeHead(200, { \"Content-Type\": \"text/plain\" });\n    res.end(\"You sent: \" + body);\n  });\n}\n```\n```js\nconst res = await fetch(\"http://localhost:3939/echo\", {\n  method: \"POST\",\n  body: \"test data\",\n});\nconsole.log(res.status, await res.text());\n```\nOutput:\n```\n200 You sent: test data\n```\nUnlike `fetch`'s `Response` (Chapter 7.8), which offers a convenient `.json()`/`.text()` directly, Node's raw `req` object is a genuine, low-level stream — its body arrives in one or more `\"data\"` events (each a `Buffer` chunk, Chapter 7.5), and `\"end\"` fires once the entire body has arrived. This chunk-by-chunk accumulation pattern (`body += chunk`) is the standard, manual way to collect a request body with the raw `http` module — genuinely more tedious than modern framework helpers, but exactly what those helpers are doing underneath.\n\n**5. Stopping a server cleanly.**\n```js\nserver.close(() => {\n  console.log(\"server closed\");\n});\n```\nOutput:\n```\nserver closed\n```\n`.close()` stops the server from accepting *new* connections, and its callback runs once everything has genuinely finished shutting down — the standard way to end a server process cleanly, rather than simply letting the process exit while requests might still be in flight.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to call `res.end()`.** Without it, a response is never actually sent — the client's request simply hangs, waiting indefinitely.\n- **Treating `req` as though it already has the full body available synchronously.** As Example 4 showed, the body arrives as a genuine stream over time — code must wait for the `\"end\"` event before the full body is actually available.\n- **Forgetting to set `Content-Type` appropriately for the actual body being sent.** A client (or `fetch`'s `.json()`) relies on this header to know how to interpret the response correctly.\n- **Comparing `req.url` naively for a route with query parameters** (`/search?q=test`) — `req.url` includes the full path and query string together; real routing typically needs the `URL` class (or a framework) to parse them apart properly, something this deliberately simple example doesn't need to handle.\n\n### How this connects\n\nThis is the practical, hands-on counterpart to Chapter 7.8's client-side `fetch` — the two chapters together cover a complete request/response cycle end to end. Chapter 7.12 (Environment Variables & `process`) covers `process`, genuinely relevant to any real server needing configuration (like which port to listen on) from outside the code itself.\n\n### Quick recap\n\n- `http.createServer(callback)` runs `callback` once per incoming request, with `req` (incoming data) and `res` (used to respond) as arguments.\n- `res.writeHead(status, headers)` sets the response's status and headers; `res.end(body)` sends the body and actually completes the response — nothing is sent until `.end()` is called.\n- A request body arrives as a genuine stream, over `\"data\"` and `\"end\"` events — not immediately available as a single value.\n- `.listen(port)` starts accepting connections; `.close()` stops accepting new ones and shuts down cleanly once existing requests finish."}, {"id": "7.12", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 12, "slug": "environment-variables-process", "fullTitle": "Environment Variables & `process`", "title": "Environment Variables & `process`", "md": "### Why this matters\n\nChapter 7.11's server hard-coded its port number directly in the code — real applications need configuration (a port, a database URL, an API key) that varies between environments (local development, testing, production) without changing the code itself. Node's global `process` object, and environment variables specifically, are the standard way to do this.\n\n### The core idea\n\n`process` is a global object (no `require` needed) giving access to the currently running Node process itself — command-line arguments (`process.argv`), environment variables (`process.env`), the current working directory (`process.cwd()`), and control over the process's own lifecycle (`process.exit()`).\n\n### Examples\n\n**1. Basic process information — version, platform, and command-line arguments.**\n```js\nconsole.log(process.version);\nconsole.log(process.platform);\nconsole.log(process.argv.slice(2));\n```\nRun as `node main.js arg1 arg2`, output:\n```\nv24.18.0\nlinux\n[ 'arg1', 'arg2' ]\n```\n`process.argv` is a real array — its first two elements are always the path to the Node executable and the path to the script being run (confirmed in Example 2), so `.slice(2)` (Chapter 2.6) is the standard way to get just the actual arguments a user passed.\n\n**2. Confirming exactly what `process.argv[0]` and `[1]` contain.**\n```js\nconsole.log(process.argv[0]);\nconsole.log(process.argv[1]);\n```\nOutput:\n```\n/home/.../bin/node\n/path/to/argv.js\n```\nThis is precisely why real code always slices from index `2` onward — the first two entries are genuinely about the process itself, not user-supplied arguments.\n\n**3. `process.env` — reading environment variables, always as strings.**\n```js\nconsole.log(typeof process.env);\nconsole.log(process.env.MY_CUSTOM_VAR);\n```\nRun as `MY_CUSTOM_VAR=hello node main.js`, output:\n```\nobject\nhello\n```\n`process.env` is a plain object where every value is genuinely a string — even if an environment variable looks numeric or boolean, it must be explicitly converted (`Number(process.env.PORT)`, for instance) before being used as anything other than text. An environment variable that was never set at all reads back as `undefined`, exactly like accessing any other missing object property (Chapter 2.7).\n\n**4. `process.cwd()` — the current working directory the process was started from.**\n```js\nconsole.log(typeof process.cwd());\n```\nOutput:\n```\nstring\n```\nThis is genuinely the directory the `node` command was *run from*, not necessarily the directory containing the script file itself — a real, easy-to-confuse distinction from `__dirname` (Chapter 6.4), which always points at the script's own location regardless of where it was invoked from.\n\n**5. `process.exit(code)` — ending the process immediately, with a specific exit code.**\n```js\nconsole.log(\"before exit\");\nprocess.exit(1);\nconsole.log(\"this never runs\");\n```\nOutput:\n```\nbefore exit\n```\nThe process's own shell exit code is confirmed to be `1` afterward. `process.exit()` genuinely terminates immediately — code after it, like the final `console.log` here, never runs at all. By convention, `0` means success and any nonzero value means some kind of failure — real scripts (and CI systems checking a command's success) rely on this exact convention.\n\n**6. `process.on(\"exit\", ...)` — a real, guaranteed-to-run hook just before the process actually ends.**\n```js\nprocess.on(\"exit\", (code) => {\n  console.log(\"about to exit with code:\", code);\n});\n```\nOutput (when the process ends normally, with code `0`):\n```\nabout to exit with code: 0\n```\nThis runs synchronously, right at the very end of the process's life — genuinely useful for final cleanup logging, though only synchronous code is safe to run here; anything asynchronous scheduled inside this handler will never actually get a chance to execute.\n\n**7. `process.stdout`/`.stderr` are real, standard `Writable` streams — `console.log` is built directly on top of them.**\n```js\nconsole.log(typeof process.stdout.write);\nprocess.stdout.write(\"written directly, no newline\");\nprocess.stdout.write(\"\\n\");\n```\nOutput:\n```\nfunction\nwritten directly, no newline\n```\n`.write()` sends raw text with no automatic newline appended, unlike `console.log` (Chapter 7.6), which adds one automatically — confirming directly that `console.log` is, underneath, essentially calling `process.stdout.write(text + \"\\n\")`.\n\n**8. `--env-file` — Node's own, built-in way to load environment variables from a file (no extra package needed).**\n```\n$ cat .env.test\nFROM_FILE=loaded_value\n```\n```\n$ node --env-file=.env.test envfile.js\n```\n```js\nconsole.log(process.env.FROM_FILE);\n```\nOutput:\n```\nloaded_value\n```\nThis is a genuinely recent, built-in Node feature (no longer requiring a separate `dotenv` package, which was the standard solution for years before this existed) — a real, standard way to keep configuration (and secrets, kept out of version control) in a file rather than the shell environment directly.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `process.env` values are always strings.** As Example 3 showed, a variable meant to represent a number or boolean must be explicitly converted — comparing `process.env.DEBUG === true` will always be `false`, since the left side is genuinely the string `\"true\"`, not the boolean.\n- **Confusing `process.cwd()` with a script's own directory.** As Example 4 noted, `process.cwd()` depends on where the command was *run from*; `__dirname`/`import.meta.url` (Chapter 6.4) always point at the script file's own location regardless.\n- **Assuming code after `process.exit()` will still run.** As Example 5 showed, it genuinely never does — treat `process.exit()` as an immediate, unconditional stop.\n- **Relying on asynchronous code inside a `process.on(\"exit\", ...)` handler.** As Example 6 noted, only synchronous work is guaranteed to complete there — the process is already in its final teardown by that point.\n\n### How this connects\n\nThis closes out Part Seven's coverage of JavaScript's real-world, practical tools — `Math`, `Date`, regular expressions, JSON, file I/O, the console, timers, `fetch`, the DOM, and now `process`. Part Eight turns to testing, debugging, style, and performance — the practices that keep real code built with these tools maintainable.\n\n### Quick recap\n\n- `process` is a global object exposing the running Node process itself — no `require` needed.\n- `process.argv` is a real array of command-line arguments, with the actual user-supplied ones starting at index `2`.\n- `process.env` holds environment variables, always as strings — explicit conversion is needed for numbers or booleans.\n- `process.exit(code)` ends the process immediately, by convention using `0` for success and nonzero for failure; code after it never runs.\n- `process.stdout`/`.stderr` are real streams that `console.log`/`.error` are built on top of; `--env-file` is Node's own built-in way to load environment variables from a file."}, {"id": "8.1", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 1, "slug": "writing-tests-an-introduction", "fullTitle": "Writing Tests: an Introduction", "title": "Writing Tests: an Introduction", "md": "### Why this matters\n\nEvery chapter in this book has verified its own claims by actually running code — exactly the same instinct behind automated testing: don't assume code works, check it, and keep the check around so it runs again automatically the next time something changes. Node has a genuinely capable test runner built directly into it, with no extra package needed to get started.\n\n### The core idea\n\nNode's built-in `node:test` module provides `test()` (or `it()`) to define individual test cases, and `node:assert` provides functions like `.strictEqual()` and `.throws()` to check that actual results match expected ones. Running `node --test` discovers and runs test files automatically, reporting exactly which passed and which failed.\n\n### Examples\n\n**1. A basic test file — testing a small module's real behavior.**\n```js\n// math.js\nfunction add(a, b) {\n  return a + b;\n}\nfunction divide(a, b) {\n  if (b === 0) throw new Error(\"division by zero\");\n  return a / b;\n}\nmodule.exports = { add, divide };\n```\n```js\n// math.test.js\nconst test = require(\"node:test\");\nconst assert = require(\"node:assert\");\nconst { add, divide } = require(\"./math.js\");\n\ntest(\"add adds two numbers\", () => {\n  assert.strictEqual(add(2, 3), 5);\n});\n\ntest(\"divide throws on division by zero\", () => {\n  assert.throws(() => divide(1, 0), /division by zero/);\n});\n```\nRunning `node --test math.test.js`:\n```\n✔ add adds two numbers (0.353097ms)\n✔ divide throws on division by zero (0.206301ms)\nℹ tests 2\nℹ suites 0\nℹ pass 2\nℹ fail 0\n... (a few more ℹ summary lines — cancelled/skipped/todo counts and total duration — trimmed here for brevity)\n```\n`assert.strictEqual(actual, expected)` checks `===` equality (Chapter 2.1) between the two, throwing a real `AssertionError` if they differ — which the test runner catches and reports as a failure. `assert.throws(fn, matcher)` confirms `fn` genuinely throws, and that the thrown error's message matches the given regular expression (Chapter 7.3).\n\n**2. A genuine failing test — the exact, real output it produces.**\n```js\ntest(\"a deliberately failing test\", () => {\n  assert.strictEqual(add(2, 2), 5);\n});\n```\nOutput:\n```\n✖ a deliberately failing test (0.424337ms)\n...\n  AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:\n  \n  4 !== 5\n  \n  ...\n  {\n    generatedMessage: true,\n    code: 'ERR_ASSERTION',\n    actual: 4,\n    expected: 5,\n    operator: 'strictEqual',\n    diff: 'simple'\n  }\n```\nThe failure report shows exactly what was expected versus what actually happened (`4 !== 5`) — genuinely useful, specific feedback rather than a generic \"test failed\" message, making it immediately clear what needs fixing.\n\n**3. Grouping related tests with `describe`/`it`, and shared setup with `beforeEach`.**\n```js\nconst { describe, it, beforeEach } = require(\"node:test\");\nconst assert = require(\"node:assert\");\nconst { add } = require(\"./math.js\");\n\ndescribe(\"Math operations\", () => {\n  let callCount = 0;\n  beforeEach(() => {\n    callCount++;\n  });\n\n  it(\"adds correctly\", () => {\n    assert.strictEqual(add(1, 2), 3);\n  });\n\n  it(\"tracks setup calls\", () => {\n    assert.ok(callCount > 0);\n  });\n});\n```\nOutput:\n```\n▶ Math operations\n  ✔ adds correctly (0.375483ms)\n  ✔ tracks setup calls (0.132254ms)\n✔ Math operations (0.995155ms)\nℹ tests 2\nℹ suites 1\n```\n`describe` groups related tests under one readable label (shown indented in the output); `it` is simply an alias for `test`, more idiomatically read inside a `describe` block (\"it adds correctly\"). `beforeEach` runs before *every* test inside its `describe` block — genuinely useful for repeated setup, confirmed here by `callCount` having actually incremented by the time the second test checks it.\n\n**4. `assert.ok` — the simplest, most general assertion.**\n\n`assert.ok(value)` (used in Example 3) simply checks that `value` is truthy (Chapter 1.4) — genuinely the most general-purpose assertion available, useful whenever a more specific one (`.strictEqual`, `.throws`, `.deepStrictEqual` for comparing objects/arrays by content rather than reference) doesn't fit the check naturally.\n\n### ⚠️ Common Mistakes\n\n- **Using `assert.equal` (loose) instead of `assert.strictEqual`** without a specific reason to want type coercion (Chapter 2.1) in a test comparison — `strictEqual` is almost always the right default, matching `===` rather than `==`.\n- **Writing a test that doesn't actually assert anything**, silently \"passing\" regardless of what the code under test does. A test with no `assert` call at all provides no real confidence — every test should make at least one genuine check.\n- **Forgetting `assert.throws` needs a function, not the result of calling one.** `assert.throws(divide(1, 0))` would call `divide` immediately (outside the assertion's control) and let any thrown error crash the test file directly, rather than being caught and checked — the function itself, `() => divide(1, 0)`, must be passed instead.\n- **Relying only on tests that check the \"happy path\"**, never verifying error conditions or edge cases. Example 1's `divide` test specifically checks the division-by-zero failure case — genuinely as important to test as the success case.\n\n### How this connects\n\nChapter 8.2 (Testing Patterns: Mocking & Assertions) goes deeper into more advanced testing techniques — mocking dependencies, testing asynchronous code — building directly on the `node:test`/`node:assert` foundation introduced here.\n\n### Quick recap\n\n- `node:test` (via `test()`/`it()`) and `node:assert` are built directly into Node — no extra package needed to start writing tests.\n- `assert.strictEqual` checks `===` equality; `assert.throws` confirms a function throws, optionally matching the error's message; `assert.ok` checks general truthiness.\n- `describe` groups related tests under a readable label; `beforeEach` runs shared setup before every test in its group.\n- `node --test` discovers and runs test files, reporting a clear pass/fail summary with specific, actionable failure details."}, {"id": "8.2", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 2, "slug": "testing-patterns-mocking-assertions", "fullTitle": "Testing Patterns: Mocking & Assertions", "title": "Testing Patterns: Mocking & Assertions", "md": "### Why this matters\n\nChapter 8.1 covered basic assertions on simple, self-contained functions. Real code has dependencies — a database, a network call, another module — and testing it in isolation requires **mocking**: replacing a real dependency with a fake, trackable one. Node's built-in `node:test` provides this too, with no extra library needed.\n\n### The core idea\n\n`assert.deepStrictEqual` compares objects and arrays by their actual content, not by reference (Chapter 2.7) — essential for testing anything beyond simple primitives. `mock.fn()` and `mock.method()` (from `node:test`) create fake functions that record how they were called, letting tests verify not just a final result, but *how* a dependency was actually used.\n\n### Examples\n\n**1. `assert.deepStrictEqual` — content comparison, contrasted directly against `strictEqual`'s reference comparison.**\n```js\ntest(\"deepStrictEqual compares content, not reference\", () => {\n  assert.deepStrictEqual({ a: 1, b: [1, 2] }, { a: 1, b: [1, 2] });\n});\n\ntest(\"strictEqual would fail on the same objects\", () => {\n  const x = { a: 1 };\n  const y = { a: 1 };\n  assert.throws(() => assert.strictEqual(x, y));\n});\n```\nOutput:\n```\n✔ deepStrictEqual compares content, not reference (0.627097ms)\n✔ strictEqual would fail on the same objects (0.553894ms)\n```\nTwo separately-constructed objects with identical content are `===`-unequal (Chapter 2.7) — `assert.strictEqual` would genuinely fail comparing them, confirmed here by wrapping it in `assert.throws`. `assert.deepStrictEqual` walks into the object's actual structure and compares every value recursively — the right choice whenever a test's expected result is an object or array rather than a simple primitive.\n\n**2. `mock.fn()` — a fake function that tracks every call made to it.**\n```js\nfunction fetchUserAndGreet(fetchFn, id) {\n  const user = fetchFn(id);\n  return `Hello, ${user.name}`;\n}\n\ntest(\"mock.fn() creates a trackable fake function\", () => {\n  const fakeFetch = mock.fn((id) => ({ id, name: \"Ada\" }));\n  const result = fetchUserAndGreet(fakeFetch, 1);\n  assert.strictEqual(result, \"Hello, Ada\");\n  assert.strictEqual(fakeFetch.mock.callCount(), 1);\n  assert.deepStrictEqual(fakeFetch.mock.calls[0].arguments, [1]);\n});\n```\nOutput:\n```\n✔ mock.fn() creates a trackable fake function (4.218161ms)\n```\n`mock.fn(implementation)` wraps a real implementation (here, a fake stand-in for a real data-fetching function) while recording every call — `.mock.callCount()` confirms it was called exactly once, and `.mock.calls[0].arguments` confirms exactly what it was called *with*. This lets a test verify `fetchUserAndGreet` genuinely passed `1` through to its dependency, not just that the final greeting happened to come out right.\n\n**3. `mock.method()` — temporarily replacing a real object's method, then restoring it.**\n```js\nconst obj = {\n  getValue() { return \"real value\"; }\n};\nconst mockedMethod = mock.method(obj, \"getValue\", () => \"mocked value\");\nconsole.log(obj.getValue());\nmockedMethod.mock.restore();\nconsole.log(obj.getValue());\n```\nOutput:\n```\nmocked value\nreal value\n```\n`mock.method(object, methodName, fakeImplementation)` genuinely replaces `obj.getValue` in place — `obj.getValue()` calls the fake version while the mock is active. `.mock.restore()` puts the *original* method back exactly as it was, confirmed here by the second call returning `\"real value\"` again — essential for not letting one test's mocking leak into and affect a later, unrelated test.\n\n**4. Testing asynchronous code — `await` inside a test, and `assert.rejects` for expected rejections.**\n```js\nfunction delayedValue(value, ms) {\n  return new Promise((resolve) => setTimeout(() => resolve(value), ms));\n}\n\ntest(\"async test using await\", async () => {\n  const result = await delayedValue(42, 10);\n  assert.strictEqual(result, 42);\n});\n\ntest(\"rejects.throws for async errors\", async () => {\n  async function fails() {\n    throw new Error(\"async failure\");\n  }\n  await assert.rejects(fails(), /async failure/);\n});\n```\nOutput:\n```\n✔ async test using await (9.802174ms)\n✔ rejects.throws for async errors (0.31234ms)\n```\nA test function can simply be `async` (Chapter 5.9) — the test runner automatically waits for its returned Promise to settle before deciding pass or fail. `assert.rejects(promise, matcher)` is the asynchronous counterpart to `assert.throws` (Chapter 8.1) — it awaits the given Promise and confirms it genuinely rejects, checking the rejection's message against the given pattern.\n\n### ⚠️ Common Mistakes\n\n- **Using `assert.strictEqual` to compare two objects or arrays for content equality.** As Example 1 showed directly, this fails even when the content is identical — `assert.deepStrictEqual` is the correct choice for anything beyond simple primitives.\n- **Forgetting to restore a mocked method after a test**, letting it silently affect later, unrelated tests. As Example 3 showed, `.mock.restore()` is essential cleanup — many test setups call this automatically in an `afterEach` hook to guarantee it always happens.\n- **Forgetting to `await` an async test's assertions**, letting the test function return before the assertion actually runs — a failing assertion inside a forgotten `await` can silently never be checked at all, making a genuinely broken test falsely report as passing.\n- **Mocking so much of a system that a test no longer verifies anything real** — a test that mocks away the exact behavior it's supposed to be checking provides false confidence; mock dependencies, not the thing actually under test.\n\n### How this connects\n\nThis closes out the testing coverage this book provides — enough to write real, meaningful tests for the kind of code covered throughout. Chapter 8.3 (Debugging JavaScript) covers the complementary skill: figuring out what's actually happening when a test (or anything else) fails unexpectedly.\n\n### Quick recap\n\n- `assert.deepStrictEqual` compares objects and arrays by content; `assert.strictEqual` compares by reference (`===`) and fails even on identical-looking separate objects.\n- `mock.fn()` creates a trackable fake function, recording call count and arguments — letting a test verify *how* a dependency was used, not just a final result.\n- `mock.method()` temporarily replaces a real object's method; `.mock.restore()` must be called afterward to avoid affecting later tests.\n- An `async` test function is automatically awaited by the test runner; `assert.rejects` is the async counterpart to `assert.throws`, for testing expected Promise rejections."}, {"id": "8.3", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 3, "slug": "debugging-javascript", "fullTitle": "Debugging JavaScript", "title": "Debugging JavaScript", "md": "### Why this matters\n\n`console.log` has been this book's own debugging tool throughout — genuinely effective, but not the only one. Node has a real, built-in debugger, and a few other tools worth knowing directly for tracking down exactly what's happening when code doesn't behave as expected.\n\n### The core idea\n\nNode includes a real debugger (built on the same protocol Chrome DevTools uses), activated with the `--inspect` flag, plus a `debugger` statement that pauses execution *only* when a debugger is actually attached. Beyond breakpoint-based debugging, `console.trace()` and `util.inspect()` solve two specific, common debugging needs directly.\n\n### Examples\n\n**1. The `debugger` statement — a genuine no-op unless a debugger is attached.**\n```js\nconsole.log(calculateTotal(cart));\ndebugger;\nconsole.log(\"after debugger statement\");\n```\nRun normally, without `--inspect`:\n```\n35\nafter debugger statement\n```\nThe `debugger` statement was completely ignored — it only actually pauses execution when a real debugger (via `--inspect`, or an IDE's built-in debugger) is attached and listening. This makes it genuinely safe to leave in code temporarily while debugging, without breaking a normal run.\n\n**2. `node --inspect` — starting Node with a real debugger attached.**\n```\n$ node --inspect script.js\n```\nOutput:\n```\nDebugger listening on ws://127.0.0.1:33147/abdebe53-d50a-41f2-bf40-f2c1f3e51612\nFor help, see: https://nodejs.org/learn/getting-started/debugging\n```\nThis starts Node listening for a debugger connection over a real WebSocket URL — opening `chrome://inspect` in Chrome (or connecting via VS Code's built-in debugger) lets you set real breakpoints, step through code line by line, and inspect variables at each pause — genuinely the same interface used for debugging a web page, applied to Node code instead.\n\n**3. `console.trace()` — printing a full call stack from wherever it's placed, without throwing anything.**\n```js\nfunction a() { b(); }\nfunction b() { c(); }\nfunction c() { console.trace(\"trace point\"); }\na();\n```\nOutput:\n```\nTrace: trace point\n    at c (trace.js:3:24)\n    at b (trace.js:2:16)\n    at a (trace.js:1:16)\n    at Object.<anonymous> (trace.js:4:1)\n    ...\n```\nThis is genuinely useful for answering \"how did execution get here?\" for a deeply-nested call chain, without needing to actually throw and catch an error just to inspect its `.stack` (Chapter 6.1).\n\n**4. `console.log`'s default depth limit — and `util.inspect` for seeing everything.**\n```js\nconst deep = { a: { b: { c: { d: 1 } } } };\nconsole.log(deep);\nconsole.log(require(\"util\").inspect(deep, { depth: null }));\n```\nOutput:\n```\n{ a: { b: { c: [Object] } } }\n{\n  a: { b: { c: { d: 1 } } }\n}\n```\n`console.log` genuinely truncates deeply nested objects past a default depth, replacing anything further with `[Object]` — a real, easy-to-miss behavior that can hide exactly the value you're trying to debug. `util.inspect(value, { depth: null })` removes that limit entirely, showing the full structure regardless of how deeply nested it is.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a `debugger` statement does something in a normal, non-debugged run.** As Example 1 showed, it's a genuine no-op without an attached debugger — safe to leave temporarily, but easy to forget is doing nothing at all when just running the script normally.\n- **Not realizing `console.log` truncates deeply nested objects**, and concluding a deeper property \"doesn't exist\" or \"is `[Object]`\" when it's genuinely just not being shown at the default depth. `util.inspect` with `{ depth: null }` (Example 4) reveals the full structure.\n- **Reaching immediately for `console.log` sprinkled everywhere**, rather than a real breakpoint-based debugger session, for a genuinely complex bug spanning many function calls — `--inspect` (Example 2) lets you inspect the *entire* program state at a single paused moment, rather than only whatever was explicitly logged.\n- **Throwing and catching an error purely to inspect a call stack**, when `console.trace()` (Example 3) does the identical job without needing to construct or handle an actual error at all.\n\n### How this connects\n\nChapter 6.1's `.stack` property and this chapter's `console.trace()` solve the same underlying need — seeing a call chain — in two different, complementary ways. Chapter 8.5 (Common Pitfalls & Gotchas) collects many of the exact kinds of bugs a debugger session, applied well, would help track down quickly.\n\n### Quick recap\n\n- The `debugger` statement only pauses execution when a real debugger is actually attached — otherwise it's a complete no-op.\n- `node --inspect` starts a real, Chrome-DevTools-compatible debugger session, supporting breakpoints and full state inspection.\n- `console.trace()` prints a full call stack from wherever it's placed, without needing to throw or catch anything.\n- `console.log` truncates deeply nested objects by default; `util.inspect(value, { depth: null })` shows the complete structure instead."}, {"id": "8.4", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 4, "slug": "javascript-style-naming-formatting-idioms", "fullTitle": "JavaScript Style: Naming, Formatting & Idioms", "title": "JavaScript Style: Naming, Formatting & Idioms", "md": "### Why this matters\n\nChapter 6.8's linter and formatter catch mechanical style problems automatically — but plenty of real code quality comes down to judgment a tool can't enforce: choosing a clear name, reaching for the right idiom, structuring a function so it reads naturally. This chapter collects the conventions genuinely common across real, professional JavaScript code.\n\n### The core idea\n\nJavaScript's dominant naming convention is **camelCase** for variables and functions (`userAccount`, `calculateTotal`), **PascalCase** for classes (`UserAccount`), and **UPPER_SNAKE_CASE** for true constants that never change. Beyond naming, several genuinely idiomatic patterns — destructuring, guard clauses, array methods over manual loops — tend to produce more readable code than their more verbose alternatives, without changing behavior at all.\n\n### Examples\n\n**1. Naming conventions, confirmed working exactly as expected.**\n```js\nclass UserAccount {}\nconst userAccount = new UserAccount();\nconsole.log(userAccount.constructor.name);\n```\nOutput:\n```\nUserAccount\n```\n`UserAccount` (PascalCase, Chapter 5.3) for the class, `userAccount` (camelCase) for the variable holding an instance of it — this pairing is genuinely the dominant convention across real JavaScript code, letting a reader immediately distinguish \"this names a type\" from \"this names a value\" purely from capitalization.\n\n**2. Destructuring with defaults for a clean, self-documenting function signature.**\n```js\nfunction makePoint({ x = 0, y = 0 } = {}) {\n  return { x, y };\n}\nconsole.log(makePoint({ x: 5 }));\nconsole.log(makePoint());\n```\nOutput:\n```\n{ x: 5, y: 0 }\n{ x: 0, y: 0 }\n```\nDestructuring the parameter directly (Chapter 2.8), with defaults for each field and for the whole object, produces a signature that documents its own expected shape and defaults — genuinely clearer than a function taking a bare `options` object and manually checking each property inside the body.\n\n**3. Array destructuring for functions that logically return more than one value.**\n```js\nfunction minMax(arr) {\n  return [Math.min(...arr), Math.max(...arr)];\n}\nconst [lo, hi] = minMax([3, 1, 4, 1, 5]);\nconsole.log(lo, hi);\n```\nOutput:\n```\n1 5\n```\nReturning a small array and immediately destructuring it at the call site (Chapter 2.8) is the standard, idiomatic JavaScript way to return multiple values — genuinely more common than defining a dedicated object shape just for a function's return value, for small, positional cases like this.\n\n**4. Guard clauses instead of nested `if`/`else` — flatter, more readable control flow.**\n```js\nfunction processIdiomatic(value) {\n  if (value == null) return \"no value\";\n  if (typeof value !== \"number\") return \"not a number\";\n  return `value: ${value}`;\n}\nconsole.log(processIdiomatic(null), processIdiomatic(\"x\"), processIdiomatic(5));\n```\nOutput:\n```\nno value not a number value: 5\n```\nEach `if` handles one specific case and returns immediately — genuinely easier to follow than the equivalent written as nested `if`/`else if`/`else` blocks, especially as the number of cases grows. `value == null` (Chapter 2.1's loose equality, used deliberately here) is itself a real, common idiom specifically for checking both `null` and `undefined` at once.\n\n**5. Template literals over string concatenation.**\n```js\nconst name = \"Ada\";\nconsole.log(`Hello, ${name}!`);\n```\nOutput:\n```\nHello, Ada!\n```\n`` `Hello, ${name}!` `` (Chapter 2.3) is essentially always preferred over `\"Hello, \" + name + \"!\"` in modern code — genuinely more readable once more than one or two values are involved, and it's the dominant idiom in real, current JavaScript.\n\n**6. Array methods over manual loops for straightforward transformations.**\n```js\nconst doubled = [1, 2, 3].map(n => n * 2);\nconsole.log(doubled);\n```\nOutput:\n```\n[ 2, 4, 6 ]\n```\n`.map()` (Chapter 2.6) directly expresses \"transform every element\" — genuinely clearer than a manual `for` loop pushing into a new array, since the *intent* is visible immediately from the method name itself, not something you have to trace through loop bookkeeping to infer.\n\n**7. `const` by default, `let` only when reassignment is genuinely needed — and confirming this doesn't limit mutation.**\n```js\nconst config = { debug: false };\nconfig.debug = true;\nconsole.log(config.debug);\n```\nOutput:\n```\ntrue\n```\n`const` (Chapter 1.3) only prevents *reassigning* the variable itself — mutating an object's properties, as shown here, is completely unaffected. The idiomatic default is `const` everywhere, switching to `let` only for a variable that's genuinely reassigned later — this makes a codebase's actual reassignment points stand out clearly, rather than every variable looking equally mutable.\n\n### ⚠️ Common Mistakes\n\n- **Naming a class in camelCase, or a variable in PascalCase.** This works — JavaScript doesn't enforce either — but genuinely confuses readers relying on the convention to tell types and values apart at a glance.\n- **Writing deeply nested `if`/`else` chains when a sequence of guard clauses (Example 4) would flatten the logic considerably.** Nesting depth is a real, measurable readability cost as a function grows.\n- **Defaulting to `let` for every variable \"just in case.\"** As Example 7 showed, `const` still permits object/array mutation — reserving `let` for genuine reassignment keeps a codebase's real mutable points visible.\n- **Writing a manual loop for a straightforward map/filter/reduce operation** (Chapter 2.6) that already expresses the same intent more directly and readably.\n\n### How this connects\n\nChapter 6.8's linting and formatting tools enforce many mechanical rules automatically; this chapter covers the judgment calls those tools deliberately leave to a human. Chapter 9.1 (Designing a JavaScript Program From Scratch) puts every idiom from this chapter to use together in one realistic, complete program.\n\n### Quick recap\n\n- camelCase for variables/functions, PascalCase for classes, UPPER_SNAKE_CASE for true constants — the dominant convention across real JavaScript.\n- Destructuring (with defaults) makes function signatures self-documenting; returning a small array and destructuring it is the idiomatic way to return multiple values.\n- Guard clauses flatten control flow compared to nested `if`/`else`; template literals are preferred over string concatenation.\n- Array methods (`.map`, `.filter`, `.reduce`) directly express transformation intent, generally preferred over equivalent manual loops.\n- Default to `const`; reserve `let` for variables genuinely reassigned later — `const` still permits mutating an object's own properties."}, {"id": "8.5", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 5, "slug": "common-pitfalls-gotchas", "fullTitle": "Common Pitfalls & Gotchas", "title": "Common Pitfalls & Gotchas", "md": "### Why this matters\n\nThis book has flagged real, exact gotchas throughout — zero-indexed months, `this` losing its binding, `NaN` never equaling itself. This chapter collects a further set of genuinely common, real JavaScript surprises not yet covered directly, verified exactly like everything else in this book — a practical reference for exactly the kind of bug that's easy to introduce and confusing to track down without knowing the underlying cause.\n\n### The core idea\n\nMost of JavaScript's real \"gotchas\" trace back to a small number of root causes: sparse arrays behaving unlike dense ones, floating-point/identity edge cases around `NaN` and `-0`, mutating a collection while iterating it, and sloppy mode's silent-failure defaults (Chapter 6.7). Recognizing the pattern behind a surprise is more valuable than memorizing any single instance of it.\n\n### Examples\n\n**1. `new Array(n)` creates sparse holes — and `.map()` genuinely skips them entirely.**\n```js\nconst arr = new Array(3);\nconsole.log(arr);\nconsole.log(arr.map(x => 1));\nconsole.log(Array(3).fill(0).map(x => 1));\n```\nOutput:\n```\n[ <3 empty items> ]\n[ <3 empty items> ]\n[ 1, 1, 1 ]\n```\n`new Array(3)` creates an array with `length: 3` but genuinely no actual elements at all — real \"holes,\" not `undefined` values (confirmed precisely in Example 7). `.map()` skips holes entirely, leaving them as holes in its result too — a real, common source of confusion for anyone expecting `.map()` to run on every index up to `.length`. `.fill(0)` first replaces every hole with a real value, after which `.map()` behaves as expected.\n\n**2. `NaN`'s comparison behavior is genuinely inconsistent across different methods — worth knowing precisely.**\n```js\nconsole.log(NaN === NaN);\nconsole.log(Object.is(NaN, NaN));\nconsole.log([NaN].includes(NaN));\nconsole.log([NaN].indexOf(NaN));\n```\nOutput:\n```\nfalse\ntrue\ntrue\n-1\n```\n`NaN === NaN` is `false` (Chapter 2.4) — genuinely the one value in JavaScript that isn't equal to itself under `===`. `Object.is()` is a real, separate equality check that treats `NaN` as equal to itself, unlike `===`. `.includes()` uses `Object.is`-like logic internally and correctly finds `NaN`; `.indexOf()` uses `===` internally and genuinely cannot find it, returning `-1` even though the value is right there. This exact inconsistency between `.includes()` and `.indexOf()` on `NaN` specifically is a real, documented, easy-to-miss detail.\n\n**3. `-0` and `0` — equal under `===`, but genuinely distinguishable.**\n```js\nconsole.log(-0 === 0);\nconsole.log(Object.is(-0, 0));\nconsole.log(1 / -0);\nconsole.log(1 / 0);\n```\nOutput:\n```\ntrue\nfalse\n-Infinity\nInfinity\n```\n`-0 === 0` is `true` — they compare equal under every ordinary comparison. `Object.is(-0, 0)` is `false`, confirming they're genuinely distinct values underneath. Dividing by each produces different infinities, a real, concrete way the distinction actually surfaces in practice, however rarely it matters for typical code.\n\n**4. Mutating an array while iterating it with `.forEach()` — a real, genuine bug, not a hypothetical one.**\n```js\nconst nums = [1, 2, 3, 4, 5];\nconst seen = [];\nnums.forEach((n, i) => {\n  seen.push(n);\n  if (n === 2) nums.splice(i, 1);\n});\nconsole.log(seen);\nconsole.log(nums);\n```\nOutput:\n```\n[ 1, 2, 4, 5 ]\n[ 1, 3, 4, 5 ]\n```\n`3` is genuinely never visited by `.forEach()` at all. Removing `2` at index `1` shifts every later element one position earlier — `3` moves into index `1`, but `.forEach()` has already moved on to checking index `2`, which is now `4`. `.forEach()` (like a plain `for` loop over a mutating array) does not account for a collection changing size mid-iteration — the standard, safe fix is iterating over a copy (`[...nums].forEach(...)`) or building a new array with `.filter()` (Chapter 2.6) instead of mutating in place.\n\n**5. A chained assignment can silently create an accidental global — in sloppy mode.**\n```js\nfunction chainAssignTest() {\n  let a = b = 5;\n}\nchainAssignTest();\nconsole.log(typeof b, b);\n```\nOutput:\n```\nnumber 5\n```\n`let a = b = 5` declares `a` properly, but `b = 5` is a *separate* assignment expression, evaluated first and assigned to a bare, undeclared `b` — in sloppy mode (Chapter 6.7), this silently creates a real global variable, genuinely accessible outside the function it was \"declared\" inside. Strict mode (Chapter 6.7) turns this into an immediate `ReferenceError` instead — one more concrete reason to always enable it.\n\n**6. String comparison is lexicographic (character-by-character), never numeric — even for digit-only strings.**\n```js\nconsole.log(\"10\" < \"9\");\nconsole.log(10 < 9);\n```\nOutput:\n```\ntrue\nfalse\n```\n`\"10\" < \"9\"` is `true` because string comparison compares character by character — `\"1\"` sorts before `\"9\"` regardless of what follows, exactly the same root cause behind Chapter 2.6's default `.sort()` gotcha (sorting numbers as strings without an explicit comparator).\n\n**7. A genuine array hole is different from a stored `undefined` — the `in` operator tells them apart.**\n```js\nconst sparse = [1, , 3];\nconsole.log(sparse.length);\nconsole.log(1 in sparse);\nconsole.log(sparse[1]);\n```\nOutput:\n```\n3\nfalse\nundefined\n```\n`sparse[1]` reads back as `undefined` either way — but `1 in sparse` (Chapter 5.1's `in`) is `false`, confirming index `1` is a genuine hole, never actually assigned any value at all, rather than a real element explicitly holding `undefined`. This distinction rarely matters for typical code, but explains exactly why Example 1's `.map()` treats holes specially instead of running its callback on every numeric index.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `.map()`/`.forEach()`/`.filter()` all treat every index up to `.length` identically.** As Example 1 showed, genuine holes are skipped entirely — always `.fill()` a sparse array first if dense iteration is needed.\n- **Using `.indexOf()` to search for `NaN` in an array.** As Example 2 showed, it never finds it — `.includes()` is the correct choice specifically because `NaN` might be present.\n- **Mutating an array in place while iterating it with `.forEach()` or a plain `for` loop.** As Example 4 showed, this genuinely skips elements — iterate over a copy, or build a new array instead, whenever removal during iteration is needed.\n- **Forgetting strict mode's protection against the accidental-global pattern in Example 5** — yet another real, concrete reason (alongside Chapter 6.7's own examples) to enable it in every new project.\n\n### How this connects\n\nEvery gotcha in this chapter connects back to a chapter already covered — `.map()`/`.filter()` (2.6), `NaN`/`Object.is` (2.4), `.forEach()` (2.6), strict mode (6.7), string comparison (2.6's sort gotcha). Chapter 9.1 (Designing a JavaScript Program From Scratch) is where avoiding this entire category of bug, by construction, becomes a genuine design consideration rather than an afterthought.\n\n### Quick recap\n\n- Sparse array holes (from `new Array(n)` or an omitted element) are genuinely different from stored `undefined` values, and are skipped by `.map()`/`.forEach()` — `.fill()` first if dense iteration is needed.\n- `NaN` fails `===` against itself but passes `Object.is()`; `.includes()` finds `NaN` in an array, `.indexOf()` never does.\n- `-0` and `0` compare equal under `===` but are genuinely distinct under `Object.is()` and in division results.\n- Mutating an array's length while iterating it with `.forEach()` or a plain loop skips elements — iterate over a copy instead.\n- A chained assignment (`let a = b = 5`) can silently create an accidental global in sloppy mode — strict mode (Chapter 6.7) catches it immediately instead."}, {"id": "8.6", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 6, "slug": "performance-measuring-common-optimizations", "fullTitle": "Performance: Measuring & Common Optimizations", "title": "Performance: Measuring & Common Optimizations", "md": "### Why this matters\n\nChapter 4.7's naive recursive Fibonacci was flagged as a genuinely illustrative example for measuring real performance — this chapter follows through on that, with actual, measured numbers. The core lesson matters beyond this one example: measure before optimizing, and understand *why* one approach is faster, rather than guessing.\n\n### The core idea\n\n`performance.now()` (from Node's built-in `perf_hooks` module) gives a high-precision timestamp, better suited to measuring short operations than `Date.now()`'s millisecond granularity (Chapter 7.2). The single biggest, most common real optimization in everyday code is **avoiding genuinely unnecessary repeated work** — exactly what memoization (caching a function's previous results) fixes for recursive algorithms like naive Fibonacci.\n\n### Examples\n\n**1. `performance.now()` — higher precision than `Date.now()`.**\n```js\nconst { performance } = require(\"perf_hooks\");\nconsole.log(typeof performance.now());\nconsole.log(Number.isInteger(performance.now()));\n```\nOutput:\n```\nnumber\nfalse\n```\n`performance.now()` returns a real number with sub-millisecond precision (confirmed here — it's genuinely not always a whole number), unlike `Date.now()`'s integer millisecond count (Chapter 7.2) — the right tool specifically for measuring how long a short operation actually takes.\n\n**2. Naive recursive Fibonacci versus a memoized version — a real, measured difference.**\n```js\nfunction fibNaive(n) {\n  if (n <= 1) return n;\n  return fibNaive(n - 1) + fibNaive(n - 2);\n}\n\nfunction fibMemo(n, cache = new Map()) {\n  if (n <= 1) return n;\n  if (cache.has(n)) return cache.get(n);\n  const result = fibMemo(n - 1, cache) + fibMemo(n - 2, cache);\n  cache.set(n, result);\n  return result;\n}\n\nconst start1 = performance.now();\nconst naiveResult = fibNaive(30);\nconst naiveTime = performance.now() - start1;\n\nconst start2 = performance.now();\nconst memoResult = fibMemo(30);\nconst memoTime = performance.now() - start2;\n\nconsole.log(naiveResult === memoResult);\n```\nOutput (one real, measured run — exact numbers vary by machine and run, but the *scale* of the difference is genuinely consistent):\n```\ntrue\nnaive: 5.09 ms\nmemo: 0.03 ms\n```\nBoth compute the identical, correct result (confirmed by `naiveResult === memoResult`), but `fibMemo` is measured here running over 100 times faster. `fibNaive(30)` from Chapter 4.7 recomputes the same smaller Fibonacci values an enormous number of times — `fibNaive(28)` alone is computed twice, `fibNaive(27)` three times, and so on, genuinely exponentially. `fibMemo` uses a `Map` (Chapter 2.10) to cache each result the *first* time it's computed, so every repeated call becomes a simple, instant lookup instead of real, repeated recursive work.\n\n**3. String building — repeated concatenation versus array-then-join.**\n```js\nfunction concatLoop(n) {\n  let s = \"\";\n  for (let i = 0; i < n; i++) s += \"x\";\n  return s;\n}\nfunction arrayJoin(n) {\n  const arr = [];\n  for (let i = 0; i < n; i++) arr.push(\"x\");\n  return arr.join(\"\");\n}\nconsole.log(concatLoop(1000) === arrayJoin(1000));\n```\nOutput:\n```\ntrue\n```\nBoth produce the identical result. Modern JavaScript engines (including V8, this book's own reference engine) have genuinely optimized simple string concatenation in a loop well enough that it's no longer the significant problem it once was in older engines — this is precisely the kind of \"known optimization\" worth verifying still actually matters before applying it, rather than assuming an old rule of thumb still holds on a current engine. For genuinely large-scale string building, `.join()` remains a reasonable, clear choice, but reaching for it purely for \"performance\" on a small loop like this is no longer the meaningful win it once was.\n\n**4. The real lesson: measure first, and understand *why*, rather than guessing or over-optimizing.**\n\nObject property access (Chapter 2.7) is genuinely, heavily optimized internally by modern engines (V8 included) — not via a simple hash-table lookup, but through more specialized machinery (tracking an object's shape and caching where a property lives, so repeated access to the same kind of object becomes nearly as cheap as a fixed offset) — the exact mechanism is real engine-internals territory beyond this book's scope, but the practical takeaway holds regardless: it is not something ordinary code needs to \"optimize around.\" A loop condition like `i < arr.length` (Chapter 3.3) re-reading `.length` on every iteration is a trivially cheap operation for a real array, not a meaningful cost worth manually caching into a variable first, despite this being a genuinely common piece of outdated advice. The actual, meaningful optimization in Example 2 came from eliminating real, exponential *repeated computation* — not from micro-adjusting individually cheap operations.\n\n### ⚠️ Common Mistakes\n\n- **Optimizing based on guesswork rather than actual measurement.** As Example 2 showed, `performance.now()` gives real, concrete numbers — optimize based on genuine evidence of where time is actually being spent, not assumption.\n- **Applying an old performance \"rule of thumb\" without verifying it still holds on the current engine.** As Example 3 showed, string concatenation-in-a-loop is no longer the significant problem it once was in older JavaScript engines — exactly the kind of claim this book's own verification discipline exists to catch before stating it as universally true.\n- **Micro-optimizing individually cheap operations** (a loop condition, a single property access) while missing a genuinely exponential, repeated-computation problem like Example 2's naive recursion — the actual, meaningful win is almost always in the algorithm's shape, not small operation-level tweaks.\n- **Adding memoization or other complexity to code that's never actually been measured as slow.** Optimization has a real readability cost — apply it where measurement shows it's genuinely needed, not preemptively everywhere.\n\n### How this connects\n\nChapter 4.7's naive Fibonacci example is directly revisited and completed here, exactly as that chapter promised. This chapter closes out Part Eight's coverage of testing, debugging, style, and performance — the practices that keep real code, built from everything in this book, genuinely maintainable.\n\n### Quick recap\n\n- `performance.now()` gives high-precision timing, better suited than `Date.now()` for measuring short operations.\n- Memoization (caching a function's previous results, typically in a `Map`) can turn an exponential naive recursive algorithm into a dramatically faster one — verified here as a real, measured, over-100x difference for Fibonacci.\n- Not every \"known\" performance rule of thumb still holds on a current engine — verify before applying, rather than assuming.\n- The most meaningful optimizations come from eliminating genuinely repeated or exponential work, not from micro-adjusting individually cheap operations."}, {"id": "8.7", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 7, "slug": "typescript-a-brief-honest-look", "fullTitle": "TypeScript: A Brief, Honest Look", "title": "TypeScript: A Brief, Honest Look", "md": "### Why this matters\n\nTypeScript is genuinely everywhere in professional JavaScript work — a superset of the language adding static types, checked before code ever runs. This book, as its `SYLLABUS.md` states upfront, deliberately doesn't teach TypeScript in depth — but a brief, honest, verified look at what it actually is (and isn't) is worth having before moving on.\n\n### The core idea\n\nTypeScript adds type annotations and compile-time checking on top of ordinary JavaScript — but genuinely, completely **erases** all of that at compile time, producing plain JavaScript with zero runtime type checking left in it at all. TypeScript catches real mistakes *before* code runs; it changes nothing about *how* the code actually behaves once it does.\n\n### Examples\n\n**1. TypeScript catches a real type mismatch at compile time — verified directly.**\n```ts\nfunction add(a: number, b: number): number {\n  return a + b;\n}\nconsole.log(add(2, 3));\nconsole.log(add(\"2\", \"3\"));\n```\nCompiling with `tsc`:\n```\nexample.ts(5,17): error TS2345: Argument of type 'string' is not assignable to parameter of type 'number'.\n```\n`: number` after each parameter is a **type annotation** — `tsc` (the TypeScript compiler) checks every call against these annotations *before* generating any JavaScript, catching this genuine mistake (passing strings where numbers were declared) immediately, with a specific, exact error naming the problem.\n\n**2. A genuinely important, honest fact: types are completely erased — the compiled JavaScript has *no* runtime check at all.**\n\nThe exact same file above, despite the type error, still compiles to real, runnable JavaScript:\n```js\n\"use strict\";\nfunction add(a, b) {\n    return a + b;\n}\nconsole.log(add(2, 3));\nconsole.log(add(\"2\", \"3\"));\n```\nRunning it:\n```\n5\n23\n```\nThe type annotations are entirely gone from the output — `add(\"2\", \"3\")` runs exactly as ordinary JavaScript would (Chapter 2.1's string concatenation rules apply, producing `\"23\"`), with genuinely no trace of TypeScript's own checking left at runtime. This is the single most important, honest thing to understand about TypeScript: **it's a compile-time tool only** — it catches mistakes before code runs, but adds no protection at all to the code that actually executes. A value arriving from outside the type system entirely (parsed JSON, `fetch` data, user input) can still violate a type's promise at runtime with no error at all.\n\n**3. `interface` — describing an object's shape — also compiles away completely.**\n```ts\ninterface User {\n  name: string;\n  age: number;\n}\nfunction greet(user: User): string {\n  return `Hello, ${user.name}`;\n}\nconst u: User = { name: \"Ada\", age: 36 };\nconsole.log(greet(u));\n```\nCompiled output:\n```js\n\"use strict\";\nfunction greet(user) {\n    return `Hello, ${user.name}`;\n}\nconst u = { name: \"Ada\", age: 36 };\nconsole.log(greet(u));\n```\n`interface User { ... }` is used entirely by the compiler, at compile time, to check that `u` and any argument passed to `greet` genuinely has the right shape — confirmed here as completely absent from the compiled JavaScript, which is otherwise identical to what you'd write by hand without TypeScript at all.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a TypeScript type annotation provides any actual runtime protection.** As Example 2 showed directly, it does not — data arriving from outside the type system (an API response, `JSON.parse`, user input) can still violate a declared type with no runtime error at all; runtime validation (a library, or manual checks) is a genuinely separate, additional concern.\n- **Believing TypeScript is a different language from JavaScript.** It's a superset — every valid JavaScript file (mostly) is already valid TypeScript, and every TypeScript file compiles down to the ordinary JavaScript this entire book has covered.\n- **Expecting compiled output to still contain type information for debugging.** As Examples 2 and 3 showed, it's genuinely, completely erased — a source map (generated separately by `tsc`) is what actually lets a debugger show you the original `.ts` source instead.\n\n### How this connects\n\nEverything TypeScript compiles *to* is exactly the JavaScript this entire book has taught — every language feature, gotcha, and idiom covered here applies identically to the code TypeScript ultimately produces. This book deliberately stops here, at a brief, honest orientation — a dedicated TypeScript resource is the right next step for learning its type system properly.\n\n### Quick recap\n\n- TypeScript adds compile-time type checking on top of ordinary JavaScript, catching real mistakes before code runs.\n- Type annotations and `interface` declarations are completely erased at compile time — the resulting JavaScript has zero runtime type checking left in it.\n- Data arriving from outside the type system (API responses, `JSON.parse`, user input) can still violate a declared type at runtime with no error — TypeScript is a compile-time tool only.\n- Every TypeScript file compiles down to the exact same JavaScript this book has covered throughout — nothing about the language's actual runtime behavior changes."}, {"id": "9.1", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis: architecture, capstone & afterword", "chapNum": 1, "slug": "designing-a-javascript-program-from-scratch", "fullTitle": "Designing a JavaScript Program From Scratch", "title": "Designing a JavaScript Program From Scratch", "md": "### Why this matters\n\nEvery chapter so far has covered one feature or tool in isolation. Real programs combine many of them — modules, classes, custom errors, private state — into a coherent whole. This chapter walks through designing a small, genuinely real program from scratch, applying deliberate choices from across this entire book, before Chapter 9.2's larger capstone.\n\n### The core idea\n\nDesigning a real program means making deliberate structural choices *before* writing much code: what belongs in its own module, what state should be genuinely private, what can fail and how failures should be represented, and how the pieces communicate. This chapter builds a small task tracker, verified running exactly as designed, to make each of those choices concrete.\n\n### Examples\n\n**1. Designing the error hierarchy first — deciding what can go wrong, before writing the logic that might fail.**\n```js\n// src/errors.js\nexport class TaskError extends Error {\n  constructor(message) {\n    super(message);\n    this.name = this.constructor.name;\n  }\n}\nexport class TaskNotFoundError extends TaskError {\n  constructor(id) {\n    super(`Task ${id} not found`);\n    this.id = id;\n  }\n}\n```\nThis applies Chapter 6.2 directly: a shared `TaskError` base class, with `this.constructor.name` correctly reporting each specific subclass, and a real hierarchy that calling code can catch broadly (`instanceof TaskError`) or specifically (`instanceof TaskNotFoundError`). Designing this *first* — before the store that actually throws it — makes the failure modes an explicit, deliberate part of the design, not an afterthought bolted on later.\n\n**2. Encapsulating state behind a class, with genuinely private fields — deciding what's nobody else's business.**\n```js\n// src/taskStore.js\nimport { TaskNotFoundError } from \"./errors.js\";\n\nexport class TaskStore {\n  #tasks = new Map();\n  #nextId = 1;\n\n  add(title) {\n    const id = this.#nextId++;\n    const task = { id, title, done: false };\n    this.#tasks.set(id, task);\n    return task;\n  }\n\n  complete(id) {\n    const task = this.#tasks.get(id);\n    if (!task) throw new TaskNotFoundError(id);\n    task.done = true;\n    return task;\n  }\n\n  list() {\n    return [...this.#tasks.values()];\n  }\n}\n```\n`#tasks` and `#nextId` are private fields (Chapter 5.5) — genuinely inaccessible from outside `TaskStore`, meaning the *only* way to add, complete, or view tasks is through the class's own deliberate public methods. `Map` (Chapter 2.10) was chosen over a plain array specifically because lookups by `id` (in `complete`) are a genuinely common operation, and a `Map`'s lookup is more direct than searching an array each time. `list()` spreads the `Map`'s values into a real array (Chapter 5.10's iteration protocol) — callers get a plain, familiar array back, with no exposure to the internal `Map` structure at all.\n\n**3. Wiring the pieces together — the entry point, using both modules.**\n```js\n// src/index.js\nimport { TaskStore } from \"./taskStore.js\";\nimport { TaskNotFoundError } from \"./errors.js\";\n\nconst store = new TaskStore();\nstore.add(\"Write chapter 9.1\");\nstore.add(\"Verify examples\");\n\nconst task1 = store.list()[0];\nstore.complete(task1.id);\n\nconsole.log(store.list());\n\ntry {\n  store.complete(999);\n} catch (e) {\n  if (e instanceof TaskNotFoundError) {\n    console.log(`Handled: ${e.message}`);\n  } else {\n    throw e;\n  }\n}\n```\nOutput:\n```\n[\n  { id: 1, title: 'Write chapter 9.1', done: true },\n  { id: 2, title: 'Verify examples', done: false }\n]\nHandled: Task 999 not found\n```\nThis is Chapter 6.6's multi-file organization in practice — `errors.js` and `taskStore.js` each have one clear responsibility, imported explicitly by whatever needs them. The `try`/`catch` with `instanceof` (Chapters 6.1 and 6.2) handles the *specific*, anticipated failure (a missing task) while re-throwing anything genuinely unexpected — exactly the deliberate error-handling discipline those chapters established, now applied in a real, complete program rather than an isolated example.\n\n### ⚠️ Common Mistakes\n\n- **Writing all the logic in one file before thinking about module boundaries.** Designing `errors.js` and `taskStore.js` as separate, focused modules *before* writing `index.js` made each one's responsibility genuinely clear — retrofitting boundaries onto a single large file afterward is real, avoidable extra work.\n- **Exposing internal state directly** (making `#tasks` a plain public property, for instance) instead of deliberate methods. This would let external code bypass `TaskStore`'s own invariants entirely — inserting a malformed task, for instance, with no validation at all.\n- **Catching every error the same way**, rather than distinguishing an anticipated failure (a missing task) from a genuinely unexpected one. As Example 3 showed, `instanceof` plus a deliberate re-throw keeps this distinction real rather than silently swallowing bugs.\n- **Deferring error design until something actually breaks**, rather than designing the failure modes deliberately alongside the success path from the start, as Example 1 did first.\n\n### How this connects\n\nChapter 9.2 (Capstone: Build Something Real) applies this exact same design discipline to a considerably larger, more complete program, pulling together nearly every tool covered across this entire book. Every technique used here traces back to a specific earlier chapter — Chapter 6.2's error hierarchies, Chapter 5.5's private fields, Chapter 6.6's module organization, and Chapter 6.1's deliberate error handling.\n\n### Quick recap\n\n- Design a program's error hierarchy deliberately, alongside its success-path logic, rather than as an afterthought.\n- Private fields (`#field`) encapsulate a class's internal state, forcing all interaction through its deliberate public methods.\n- Split a program into focused modules by responsibility *before* writing much code, rather than retrofitting boundaries onto one large file later.\n- Distinguish anticipated failures (caught and handled specifically, via `instanceof`) from genuinely unexpected ones (re-thrown, never silently swallowed)."}, {"id": "9.2", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis: architecture, capstone & afterword", "chapNum": 2, "slug": "capstone-build-something-real", "fullTitle": "Capstone: Build Something Real", "title": "Capstone: Build Something Real", "md": "### Why this matters\n\nThis chapter builds a genuinely complete, small program — a task-tracking REST API with real file persistence — pulling together modules, classes, private fields, custom errors, `async`/`await`, `fs/promises`, and Node's `http` module into one working whole. Every piece has already been covered individually; this is where they combine, verified running end to end.\n\n### The core idea\n\nA real program is built in deliberate layers: a data layer (`TaskStore`) that owns state and knows nothing about HTTP, an errors layer that both the data and web layers share, and a thin HTTP layer that translates requests into calls on the data layer and results back into responses. This separation — each piece doing one job, communicating through clear interfaces — is what Chapter 9.1 introduced at a smaller scale; this chapter builds it out fully.\n\n### Building it, layer by layer\n\n**1. Errors — shared vocabulary between every other layer, each carrying its own HTTP status code.**\n```js\n// src/errors.js\nexport class TaskError extends Error {\n  constructor(message) {\n    super(message);\n    this.name = this.constructor.name;\n  }\n}\nexport class TaskNotFoundError extends TaskError {\n  constructor(id) {\n    super(`Task ${id} not found`);\n    this.id = id;\n    this.statusCode = 404;\n  }\n}\nexport class ValidationError extends TaskError {\n  constructor(message) {\n    super(message);\n    this.statusCode = 400;\n  }\n}\n```\nEach error (Chapter 6.2) carries a `statusCode` directly — a deliberate design choice letting the HTTP layer (below) translate any `TaskError` into the correct response without needing a separate lookup table mapping error types to status codes.\n\n**2. The data layer — `TaskStore`, with genuine file persistence via `fs/promises`.**\n```js\n// src/taskStore.js\nimport { readFile, writeFile } from \"fs/promises\";\nimport { TaskNotFoundError, ValidationError } from \"./errors.js\";\n\nexport class TaskStore {\n  #tasks = new Map();\n  #nextId = 1;\n  #filePath;\n\n  constructor(filePath) {\n    this.#filePath = filePath;\n  }\n\n  async load() {\n    try {\n      const data = await readFile(this.#filePath, \"utf8\");\n      const parsed = JSON.parse(data);\n      this.#tasks = new Map(parsed.tasks.map((t) => [t.id, t]));\n      this.#nextId = parsed.nextId;\n    } catch (e) {\n      if (e.code === \"ENOENT\") return;\n      throw e;\n    }\n  }\n\n  async #save() {\n    const payload = { tasks: [...this.#tasks.values()], nextId: this.#nextId };\n    await writeFile(this.#filePath, JSON.stringify(payload, null, 2));\n  }\n\n  async add(title) {\n    if (typeof title !== \"string\" || title.trim() === \"\") {\n      throw new ValidationError(\"title must be a non-empty string\");\n    }\n    const id = this.#nextId++;\n    const task = { id, title, done: false };\n    this.#tasks.set(id, task);\n    await this.#save();\n    return task;\n  }\n\n  async complete(id) {\n    const task = this.#tasks.get(id);\n    if (!task) throw new TaskNotFoundError(id);\n    task.done = true;\n    await this.#save();\n    return task;\n  }\n\n  list() {\n    return [...this.#tasks.values()];\n  }\n}\n```\nThis applies a genuinely large fraction of the whole book at once: private fields (Chapter 5.5) for `#tasks`, `#nextId`, and `#filePath`; a *private method*, `#save()`, since saving is purely an internal implementation detail no external caller should invoke directly; `fs/promises` (Chapter 7.5) for genuine, real disk I/O; `load()`'s `catch` distinguishing a missing file (`ENOENT`, genuinely fine on first run) from any other, unexpected error (re-thrown); and `add()` validating its input, throwing a specific `ValidationError` (Chapter 6.2) rather than allowing malformed data in at all.\n\n**3. The HTTP layer — routing requests to the data layer, translating results and errors into responses.**\n```js\n// src/server.js\nimport http from \"http\";\nimport { TaskError } from \"./errors.js\";\n\nexport function createServer(store) {\n  return http.createServer(async (req, res) => {\n    try {\n      if (req.method === \"GET\" && req.url === \"/tasks\") {\n        res.writeHead(200, { \"Content-Type\": \"application/json\" });\n        res.end(JSON.stringify(store.list()));\n        return;\n      }\n      if (req.method === \"POST\" && req.url === \"/tasks\") {\n        let body = \"\";\n        for await (const chunk of req) body += chunk;\n        const { title } = JSON.parse(body);\n        const task = await store.add(title);\n        res.writeHead(201, { \"Content-Type\": \"application/json\" });\n        res.end(JSON.stringify(task));\n        return;\n      }\n      const completeMatch = req.url.match(/^\\/tasks\\/(\\d+)\\/complete$/);\n      if (req.method === \"POST\" && completeMatch) {\n        const id = Number(completeMatch[1]);\n        const task = await store.complete(id);\n        res.writeHead(200, { \"Content-Type\": \"application/json\" });\n        res.end(JSON.stringify(task));\n        return;\n      }\n      res.writeHead(404, { \"Content-Type\": \"application/json\" });\n      res.end(JSON.stringify({ error: \"Not Found\" }));\n    } catch (e) {\n      if (e instanceof TaskError) {\n        res.writeHead(e.statusCode, { \"Content-Type\": \"application/json\" });\n        res.end(JSON.stringify({ error: e.message }));\n      } else {\n        res.writeHead(500, { \"Content-Type\": \"application/json\" });\n        res.end(JSON.stringify({ error: \"Internal Server Error\" }));\n        console.error(e);\n      }\n    }\n  });\n}\n```\nThis layer knows nothing about how tasks are stored — it only calls `store.add()`/`store.complete()`/`store.list()` and translates the outcome. `for await (const chunk of req)` (an async-iterable form of Chapter 7.11's `\"data\"`/`\"end\"` stream pattern) collects the request body. The single `catch` at the bottom (Chapter 6.1) handles *any* `TaskError` thrown from deeper in the call chain uniformly — using its own `statusCode` (Example 1's deliberate design) — while a genuinely unexpected error falls through to a generic `500`, logged for investigation rather than ever exposing internal details to the client.\n\n**4. Wiring it together and exercising it — a real client hitting a real, running server.**\n```js\n// src/index.js\nimport { TaskStore } from \"./taskStore.js\";\nimport { createServer } from \"./server.js\";\n\nconst store = new TaskStore(new URL(\"./tasks.json\", import.meta.url));\nawait store.load();\n\nconst server = createServer(store);\nserver.listen(4747, () => console.log(\"Task API listening on port 4747\"));\n```\nRunning a real client against it (Chapter 7.8's `fetch`):\n```js\nconst r1 = await fetch(\"http://localhost:4747/tasks\", {\n  method: \"POST\",\n  body: JSON.stringify({ title: \"Write capstone chapter\" }),\n});\nconsole.log(r1.status, await r1.json());\n```\nOutput, across a full sequence of requests:\n```\nTask API listening on port 4747\n201 { id: 1, title: 'Write capstone chapter', done: false }\n400 { error: 'title must be a non-empty string' }\n200 { id: 1, title: 'Write capstone chapter', done: true }\n404 { error: 'Task 999 not found' }\n200 [ { id: 1, title: 'Write capstone chapter', done: true } ]\nserver closed\n```\nEvery layer worked together exactly as designed: a valid task creation (`201`), a rejected empty title (`400`, from `ValidationError`), a successful completion (`200`), a genuinely missing task (`404`, from `TaskNotFoundError`), and the final list reflecting every real change. `new URL(\"./tasks.json\", import.meta.url)` (Chapter 6.4) resolves the file path relative to `index.js`'s own location, regardless of the directory the process was started from (Chapter 7.12's `process.cwd()` distinction) — confirmed directly by restarting a fresh process afterward and finding the completed task still there, genuinely persisted to disk.\n\n### ⚠️ Common Mistakes\n\n- **Letting the HTTP layer know about storage details** (reading `#tasks` directly, say) instead of going through `TaskStore`'s own public methods — this would defeat the entire point of the layered design, exactly as Chapter 9.1 warned against.\n- **Forgetting to distinguish `ENOENT` from other file errors when loading persisted state.** A missing file on first run is expected and fine; any other error (permissions, corrupted JSON) genuinely should not be silently ignored the same way.\n- **Exposing an unexpected error's raw message to an API client.** As the `server.js` `catch` block showed, a genuinely unanticipated error becomes a generic `\"Internal Server Error\"` response, with the real detail only logged server-side — never leaked to whoever made the request.\n- **Skipping input validation at the boundary** (`add()`'s empty-title check) and letting malformed data quietly enter the system, only to cause confusing failures somewhere else, later, far from the actual mistake's source.\n\n### How this connects\n\nThis capstone is the concrete, complete synthesis of nearly every chapter in this book — modules and organization (Part Six), objects and classes (Part Five), error handling (6.1, 6.2), file I/O (7.5), and a real HTTP server (7.11), all working together. Chapter 9.3 (Afterword) closes out the book properly; the back-matter appendices (10.1, 10.2) remain as ongoing references afterward.\n\n### Quick recap\n\n- A well-designed program separates concerns into layers — data, errors, and transport (HTTP) — each with a clear, narrow responsibility, communicating through deliberate interfaces.\n- Custom errors carrying their own metadata (like an HTTP status code) let a shared error-handling layer translate failures generically, without a separate lookup table.\n- Genuine persistence (`fs/promises`) combined with `import.meta.url`-relative paths keeps a program's data correctly located regardless of where it's actually run from.\n- Verifying a complete program means running it for real — a real server, a real client, real requests — exactly as done throughout this entire book."}, {"id": "9.3", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis: architecture, capstone & afterword", "chapNum": 3, "slug": "afterword-where-to-go-next", "fullTitle": "Afterword: Where to Go Next", "title": "Afterword:
