Where to Go Next", "md": "You started this book with `console.log(\"Hello, World!\")`. You just finished it with a real, multi-layered HTTP API — a data layer with genuinely private state, a shared error hierarchy each layer understood, and file persistence that survived a real process restart, all verified running end to end against real, live requests. Everything between those two points was built the same way: one claim at a time, checked by actually running it, never assumed correct from memory.\n\nLook back at the shape this book followed. The Alphabet gave you the raw syntax. Words gave you the vocabulary — strings, numbers, arrays, objects. Sentences gave you control flow. Grammar gave you functions, closures, and the single most-asked-about topic in the whole language: what `this` actually refers to, and why. Paragraphs took you underneath `class` syntax to the real prototype chain it's built on, and underneath every `async` function to the event loop actually running it. Chapters gave you real multi-file organization. Style & Voice gave you the everyday toolbox — `Math`, `Date`, regex, JSON, files, `fetch`, a real (if bounded) look at the browser's DOM. Editing & Revision gave you testing, debugging, and the judgment calls a linter can't make for you. And The Novel put all of it together into something real. Nine parts, each one genuinely depending on the last — exactly as promised back in Chapter 0.1.\n\nA few genuinely large things were left out on purpose, not by oversight. TypeScript's actual type system — Chapter 8.7 showed you honestly that it's erased at compile time, but a real type system deserves its own dedicated resource, not a chapter tacked onto a language book. Front-end frameworks — React, Vue, Svelte, and the rest — are all built *on top of* the JavaScript you now know, but each has enough of its own convention and tooling to fill a book of its own. The full DOM and Web Platform API surface — Chapters 7.9 and 7.10 gave you a real, working preview, deliberately bounded rather than exhaustive. Build tooling, and the deeper metaprogramming corners of the language (`Proxy`, `Reflect`) — genuinely useful in specific situations, genuinely rare in the code most people write day to day. None of it was skipped because it doesn't matter. It was left out so that everything actually included could get the same depth and the same verification this entire book insisted on throughout.\n\nSo where do you go from here? Honestly, wherever the work in front of you actually points. If you're joining a codebase that uses TypeScript seriously, that's your next stop, and you'll read its type annotations fluently — they're just JavaScript with extra syntax on top, and you already know the JavaScript. If you're building for the browser, a framework's own official documentation will make far more sense now than it would have before this book, because you'll recognize the plain JavaScript underneath every one of its abstractions. If you want to go deeper into Node itself, its own official API documentation covers everything this book's Part Seven only introduced — `fs`, `http`, `process`, and considerably more.\n\nBut the single most valuable thing this book tried to hand you isn't a fact about JavaScript at all — it's a habit. Check the claim. Run the code. Don't trust what you (or anyone else, including this book, on a different engine or a different version) confidently remember about how something behaves — actually look. A good fraction of this language's real, famous gotchas exist purely because people stopped checking and started assuming. You now know exactly what `[] == false` does, and precisely why. Keep asking that same kind of question, about everything, for the rest of your career. It's the one habit that outlasts any single language.\n\nTwo things are waiting for you in the Appendix whenever you need them: a Quick-Reference Cheat Sheet for when you half-remember a piece of syntax, and a Glossary for when a term shows up and the exact definition has slipped your mind. You don't need either right now. Just know they're there.\n\nGood luck. Go build something."}, {"id": "10.1", "partNum": 10, "partTitle": "Back Matter", "partMetaphor": "quick-reference cheat sheet & glossary", "chapNum": 1, "slug": "appendix-a-quick-reference-cheat-sheet", "fullTitle": "Appendix A: Quick Reference Cheat Sheet", "title": "Quick Reference Cheat Sheet", "md": "A fast, scannable reference to everything this book covered — organized by Part, matching the order you learned it in. Every item here was verified somewhere in the book proper; this appendix exists for when you half-remember the syntax and don't want to reread a whole chapter. A few items not individually shown earlier (the array-swap idiom, `Array.of`, chained ternaries) were spot-checked directly for this appendix.\n\n## Part One — The Alphabet\n\n```js\nlet x = 1;        // reassignable, block-scoped\nconst y = 2;       // not reassignable (but objects/arrays it holds ARE mutable), block-scoped\nvar z = 3;         // legacy — function-scoped, hoisted as undefined, avoid in new code\n\ntypeof 42;          // \"number\"\ntypeof \"hi\";         // \"string\"\ntypeof true;          // \"boolean\"\ntypeof undefined;      // \"undefined\"\ntypeof null;            // \"object\"  (a famous, permanent language bug — Ch 1.4)\ntypeof [];                // \"object\"\ntypeof {};                  // \"object\"\ntypeof function(){};         // \"function\"\n\n// Arithmetic: + - * / % **\n// Comparison: < > <= >= == === != !==   (always prefer === / !==)\n// Logical: && || !   (short-circuiting)\n// Assignment: = += -= *= /= %= **= &&= ||= ??=\n```\n\n## Part Two — Words\n\n```js\n// Type coercion & equality (Ch 2.1)\n\"5\" == 5;      // true  (coerces)\n\"5\" === 5;     // false (no coercion — prefer this)\nnull == undefined;   // true\nNaN === NaN;          // false — use Number.isNaN(x) or Object.is(x, NaN)\n\n// Strings (Ch 2.2–2.3)\n`Hello, ${name}!`;              // template literal\n\"abc\".slice(-1);                // \"c\"\n\"abc\".includes(\"b\");            // true\n\"5\".padStart(3, \"0\");           // \"005\"\n[...\"🎉\"].length;                 // 1 (correct — .length alone gives 2, surrogate pairs)\n\n// Numbers (Ch 2.4)\n0.1 + 0.2;                       // 0.30000000000000004 — never compare floats with ===\nNumber.isInteger(5);             // true\nparseInt(\"42px\");                // 42\n123n;                            // BigInt literal\n\n// Arrays (Ch 2.5–2.6)\nnew Array(3);      // [ <3 empty items> ] — sparse holes, length 3, no real elements\nArray.of(3);       // [ 3 ] — a real one-element array holding the value 3\narr.push(x); arr.pop(); arr.shift(); arr.unshift(x);\narr.map(fn); arr.filter(fn); arr.reduce(fn, initial);\narr.find(fn); arr.findIndex(fn); arr.some(fn); arr.every(fn); arr.includes(x);\narr.flat(depth); arr.flatMap(fn);\narr.sort((a, b) => a - b);       // always pass a comparator for numbers\n[1, [2, 3], [4, [5]]].flat(2);   // [1, 2, 3, 4, 5]\n\n// Objects (Ch 2.7)\nObject.keys(obj); Object.values(obj); Object.entries(obj);\nObject.fromEntries([[\"a\", 1]]);  // { a: 1 }\n\"key\" in obj;                     // checks whole prototype chain\nobj.hasOwnProperty(\"key\");        // checks own properties only\n\n// Destructuring & spread (Ch 2.8–2.9)\nconst { a, b = 1, ...rest } = obj;\nconst [x, , z] = arr;                // skip with a blank slot\n[a, b] = [b, a];                     // swap idiom\nconst merged = { ...obj1, ...obj2 }; // later keys win\nconst copy = [...arr];               // shallow copy only — structuredClone() for deep\n\n// Map & Set (Ch 2.10)\nconst m = new Map([[\"k\", \"v\"]]); m.get(\"k\"); m.has(\"k\"); m.size;\nconst s = new Set([1, 2, 2]); [...s];  // [1, 2] — dedup idiom\n```\n\n## Part Three — Sentences\n\n```js\nif (cond) {} else if (cond2) {} else {}\nconst label = cond ? \"yes\" : \"no\";\nconst grade = n >= 90 ? \"A\" : n >= 80 ? \"B\" : \"F\";   // chained ternary\n\nswitch (val) {\n  case 1: break;\n  default: break;         // falls through by default — needs explicit break to NOT fall through into the next case\n}\n\nfor (let i = 0; i < arr.length; i++) {}\nfor (const x of arr) {}      // values (arrays, strings, Maps, Sets — anything iterable)\nfor (const k in obj) {}      // keys (plain objects — avoid on arrays)\nwhile (cond) {}\ndo {} while (cond);          // body always runs at least once\n\nbreak; continue;\nouter: for (...) { for (...) { continue outer; } }   // labeled loops\n\na ?? b;         // nullish coalescing — only null/undefined trigger the fallback\na?.b?.c;        // optional chaining — short-circuits to undefined on any missing link\na?.();          // optional call\nval ??= \"default\";  // assign only if val is null/undefined\n```\n\n## Part Four — Grammar\n\n```js\nfunction name(a, b = 1, ...rest) { return a; }   // declaration — hoisted with full body\nconst fn = function() {};                        // expression — not hoisted\nconst arrow = (a, b) => a + b;                    // no own this/arguments/super, can't be a constructor\n\nfunction outer() {\n  let count = 0;\n  return () => ++count;    // closure — remembers `count` across calls\n}\n\n// `this` (Ch 4.6) — determined by CALL SITE, not definition site\nobj.method();               // this === obj\nfn.call(thisArg, ...args);  // invoke now with explicit this\nfn.apply(thisArg, argsArr);\nconst bound = fn.bind(thisArg);  // returns new fn, this locked permanently\n\nfunction factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }\n// no tail-call optimization in V8 — deep recursion still overflows even if tail-recursive\n```\n\n## Part Five — Paragraphs\n\n```js\n// Prototypes (Ch 5.1–5.2)\nObject.getPrototypeOf(obj);\nobj instanceof Ctor;\nfunction Animal(name) { this.name = name; }\nAnimal.prototype.speak = function() {};\n\n// Classes (Ch 5.3–5.5) — syntax sugar over the above\nclass Animal {\n  #private = 0;                  // truly private — not even in Object.keys\n  static count = 0;              // class-level, not per-instance\n  constructor(name) { this.name = name; }\n  speak() { return `${this.name} makes a sound`; }\n  get loud() { return this.name.toUpperCase(); }\n  set loud(v) { this.name = v.toLowerCase(); }\n}\nclass Dog extends Animal {\n  speak() { return `${super.speak()}, specifically a bark`; }\n}\n\n// Event loop (Ch 5.6): sync code → ALL microtasks (Promises) → ONE macrotask (setTimeout) → repeat\nPromise.resolve().then(fn);      // microtask\nsetTimeout(fn, 0);                // macrotask — always runs after every microtask, never \"immediately\"\n\n// Promises (Ch 5.8)\nnew Promise((resolve, reject) => { ... });\np.then(onFulfilled).catch(onRejected).finally(onAlways);\nPromise.all([p1, p2]);            // rejects fast on first failure\nPromise.allSettled([p1, p2]);     // always waits for all, reports each outcome\nPromise.race([p1, p2]);           // settles on whichever finishes first\n\n// async/await (Ch 5.9)\nasync function f() { const x = await somePromise; return x; }  // always returns a Promise\ntry { await mightReject(); } catch (e) { /* handles rejection like a normal error */ }\n\n// Iterators & generators (Ch 5.10–5.11)\nobj[Symbol.iterator] = function() { return { next() { return { value, done }; } }; };\nfunction* gen() { yield 1; yield 2; }\n[...gen()];                        // [1, 2]\nfunction* outer() { yield* inner(); }  // delegates to another iterable\n```\n\n## Part Six — Chapters\n\n```js\n// ES Modules (type: \"module\" in package.json, or .mjs)\nexport function f() {}\nexport default class {}\nexport const x = 1;\nimport def, { f, x as renamed } from \"./mod.js\";\nimport * as ns from \"./mod.js\";\n\n// CommonJS (default without \"type\": \"module\")\nmodule.exports = { f };\nconst { f } = require(\"./mod.js\");   // cached after first load\n\n\"use strict\";   // always-on automatically in ES Modules and class bodies\n\n// npm\n// npm init -y | npm install <pkg> | npm install -D <pkg> | npm run <script>\n```\n\n## Part Seven — Style & Voice\n\n```js\nMath.max(...arr); Math.min(...arr); Math.random();  // [0, 1)\nMath.round(-4.5);   // -4 — .5 rounds toward +Infinity, not away from zero\n\nnew Date(2024, 0, 15);      // month is 0-indexed! January = 0\ndate.getTime(); Date.now(); // millisecond timestamps, for arithmetic\nisNaN(date.getTime());      // real way to check for an Invalid Date\n\n/pattern/flags.test(str);\nstr.match(/.../g); str.replace(/.../, \"$<name>\"); str.matchAll(/.../g);\n\nJSON.stringify(value, replacer, indent);\nJSON.parse(text, reviver);\n// undefined: dropped as object prop, becomes null in an array; NaN/Infinity also become null\n\nconst fs = require(\"fs/promises\");\nawait fs.readFile(path, \"utf8\"); await fs.writeFile(path, data);\n\nconst res = await fetch(url, { method, headers, body });\nres.ok; res.status;    // fetch does NOT reject on 4xx/5xx — check res.ok explicitly!\nawait res.json();\n\nprocess.argv.slice(2); process.env.VAR; process.exit(code);\n```\n\n## Part Eight — Editing & Revision\n\n```js\n// node:test / node:assert (built in, no package needed)\nconst test = require(\"node:test\");\nconst assert = require(\"node:assert\");\ntest(\"name\", () => { assert.strictEqual(actual, expected); });\nassert.deepStrictEqual(objA, objB);   // content, not reference\nmock.fn(); mock.method(obj, \"name\", fake);\n\nconsole.error(); console.warn();  // → stderr    console.log(); console.info(); // → stdout\nconsole.table(arr); console.group(); console.time(\"label\"); console.timeEnd(\"label\");\ndebugger;               // pauses only if a real debugger (--inspect) is attached\n```\n\n### How to use this appendix\n\nThis is a lookup tool, not a teaching tool — every line here has a real chapter behind it where the *why* was actually explained and verified. When something here doesn't immediately make sense, that's the signal to go back to the chapter it came from, not to memorize the line in isolation."}, {"id": "10.2", "partNum": 10, "partTitle": "Back Matter", "partMetaphor": "quick-reference cheat sheet & glossary", "chapNum": 2, "slug": "appendix-b-glossary-of-terms", "fullTitle": "Appendix B: Glossary of Terms", "title": "Glossary of Terms", "md": "Alphabetical definitions for every significant term used across this book. Each entry names the chapter where the term was actually introduced and verified — use this appendix to jog your memory on a definition, and the chapter reference to go back for the full explanation and working examples.\n\n**`arguments` object** — An array-like (not a real array) object available inside a regular `function`, holding every argument it was called with, regardless of its declared parameters. Arrow functions have no `arguments` of their own. (Ch 4.3)\n\n**arrow function** — A concise function syntax (`(a, b) => a + b`) with no own `this`, `arguments`, or `super`, and unusable as a constructor. Inherits `this` from its enclosing scope. (Ch 4.2)\n\n**ASI (Automatic Semicolon Insertion)** — JavaScript's rule for inferring missing semicolons, which can silently insert one after a `return` on its own line, turning `return { ... }` on the next line into `return undefined`. (Ch 1.2)\n\n**async function** — A function declared with `async`, always returning a Promise automatically, and able to use `await` inside it. (Ch 5.9)\n\n**`await`** — Pauses an `async` function until a Promise settles, giving back its value or throwing its rejection as an ordinary error. (Ch 5.9)\n\n**barrel file** — A module (conventionally `index.js`) that re-exports a folder's contents, letting other code import the whole folder as one unit. (Ch 6.6)\n\n**BigInt** — A numeric type for integers beyond `Number.MAX_SAFE_INTEGER`, written with an `n` suffix (`123n`); cannot be mixed with regular numbers without explicit conversion. (Ch 2.4)\n\n**callback** — A function passed as an argument, to be called later — typically once an asynchronous operation completes. (Ch 5.7)\n\n**callback hell** — The deeply-nested, \"pyramid of doom\" shape produced by chaining several callback-based asynchronous steps. (Ch 5.7)\n\n**class** — Syntax sugar over a constructor function and its prototype, defining a constructor and shared methods together in one block. (Ch 5.3)\n\n**class field** — A property declared and initialized directly in a class body (`count = 0`), without needing to write it inside `constructor`. (Ch 5.3)\n\n**closure** — A function that \"remembers\" variables from the scope it was defined in, even after that outer scope has finished executing. (Ch 4.5)\n\n**CommonJS** — Node's original module system, using `require()`/`module.exports`, loading synchronously, and cached after a module's first load. (Ch 6.4)\n\n**coercion** — JavaScript's automatic conversion of a value from one type to another, especially during `==` comparisons and arithmetic/string operators. (Ch 2.1)\n\n**console.trace()** — Prints the current call stack from wherever it's placed, without throwing or catching anything. (Ch 8.3)\n\n**constructor function** — An ordinary function, called with `new`, that builds and returns a new object linked to its `.prototype`. The pre-`class` way to create objects sharing methods. (Ch 5.1)\n\n**deep clone** — A copy of an object/array where every nested object is also independently copied, not shared by reference. `structuredClone()` performs one; spread and `Object.assign` do not. (Ch 2.9)\n\n**destructuring** — Syntax for unpacking values from an array or object directly into individual variables (`const { a, b } = obj`). (Ch 2.8)\n\n**DOM (Document Object Model)** — A browser's representation of a web page as a tree of objects JavaScript can read and modify. Exists only in a browser, never in Node. (Ch 7.9)\n\n**ENOENT** — The `.code` value on a real Node file-system error meaning \"no such file or directory.\" (Ch 7.5)\n\n**equality, loose (`==`)** — Compares two values after coercing them to a common type first. Almost always avoid in favor of `===`. (Ch 2.1)\n\n**equality, strict (`===`)** — Compares two values with no coercion; different types are always unequal. The default choice. (Ch 2.1)\n\n**ESLint** — The standard JavaScript linter, analyzing code for real problems (unused variables, undeclared globals, risky patterns) without changing its formatting. (Ch 6.8)\n\n**ES Module (ESM)** — The modern, standard module system using `import`/`export`, requiring a `.mjs` extension or `\"type\": \"module\"` in `package.json`. Always strict mode; supports top-level `await`. (Ch 6.3)\n\n**`Error.cause`** — A second, optional constructor argument (`new Error(msg, { cause })`) chaining a lower-level error into a higher-level one. (Ch 6.2)\n\n**event bubbling** — A DOM event's default behavior of traveling upward through every ancestor element after firing on its original target. (Ch 7.10)\n\n**event loop** — The mechanism that runs queued callbacks only once currently-running synchronous code has fully finished — draining the entire microtask queue before running even one macrotask. (Ch 5.6)\n\n**`fetch`** — The standard function for making HTTP requests, built into both browsers and Node. Resolves on any HTTP response (including errors); rejects only on genuine network failure. (Ch 7.8)\n\n**generator function** (`function*`) — A function that returns a generator object instead of running immediately, pausing at each `yield` and resuming on the next `.next()` call. (Ch 5.11)\n\n**getter / setter** — Class or object members (`get name()`/`set name(v)`) that let plain property syntax (`obj.name`) run real code underneath. (Ch 5.5)\n\n**global object** — The object representing the global scope — `globalThis` in any environment, `window` specifically in a browser. (Ch 4.6, 7.9)\n\n**hoisting** — JavaScript's behavior of processing variable and function declarations before running code top to bottom. `var` hoists as `undefined`; `let`/`const` hoist into a temporal dead zone; `function` declarations hoist with their full body. (Ch 1.3, 4.1)\n\n**iterable** — An object with a `Symbol.iterator` method, making it usable with `for...of`, spread, `Array.from`, and destructuring. (Ch 5.10)\n\n**iterator** — An object with a `.next()` method returning `{ value, done }`, produced by an iterable's `Symbol.iterator` method. (Ch 5.10)\n\n**JSON (JavaScript Object Notation)** — A text-based data format with a smaller data model than JavaScript itself (no functions, `undefined`, or `Symbol`), converted to/from JavaScript values with `JSON.stringify`/`JSON.parse`. (Ch 7.4)\n\n**linter** — A tool (ESLint being the standard one) that analyzes code for real, specific problems without changing how it looks. (Ch 6.8)\n\n**macrotask** — A category of queued callback (`setTimeout`, `setInterval`, I/O) run one at a time by the event loop, only after the entire microtask queue is empty. (Ch 5.6)\n\n**memoization** — Caching a function's previous results (often in a `Map`) so repeated calls with the same input become instant lookups instead of recomputation — the fix for naive recursive algorithms' exponential repeated work. (Ch 8.6)\n\n**method** — A function stored as an object or class property, callable as `obj.method()`. (Ch 2.7)\n\n**microtask** — A category of queued callback (Promise `.then()`, `queueMicrotask`) fully drained by the event loop before any macrotask runs, even ones added while other microtasks are running. (Ch 5.6)\n\n**mock** — A fake, trackable stand-in for a real dependency, used in tests to verify how a function was called without depending on the real thing. (Ch 8.2)\n\n**module** — A single file's self-contained unit of code, exposing specific values via `export` (ES Modules) or `module.exports` (CommonJS). (Ch 6.3, 6.4)\n\n**`NaN`** — \"Not a Number,\" the result of an invalid numeric operation. Never equal to anything, including itself, under `===`. (Ch 2.4)\n\n**`node:test`** — Node's built-in test runner module, providing `test()`/`describe()`/`it()` with no external package needed. (Ch 8.1)\n\n**nullish coalescing (`??`)** — Returns its right-hand value only if the left-hand value is `null` or `undefined` — unlike `||`, doesn't trigger on other falsy values like `0` or `\"\"`. (Ch 3.6)\n\n**optional chaining (`?.`)** — Short-circuits an entire property-access or method-call chain to `undefined` the moment any link is `null`/`undefined`, instead of throwing. (Ch 3.6)\n\n**`package.json`** — A Node project's manifest file: name, version, dependencies, and `scripts`. (Ch 6.5)\n\n**`package-lock.json`** — Records the exact dependency versions actually installed, for reproducible installs across machines. (Ch 6.5)\n\n**Promise** — An object representing an asynchronous operation's eventual result, with exactly three states: pending, fulfilled, or rejected, settling permanently once it leaves pending. (Ch 5.8)\n\n**prototype** — An object's internal link to another object, automatically consulted for a property lookup that fails on the object itself. The real mechanism behind inherited methods and `instanceof`. (Ch 5.1)\n\n**prototype chain** — The full sequence of prototypes an object delegates lookups through, ending at `Object.prototype` (or `null`). (Ch 5.1, 5.2)\n\n**Prettier** — The standard JavaScript formatter, rewriting code's whitespace, quotes, and line breaks into one consistent style without touching its logic. (Ch 6.8)\n\n**private field** (`#field`) — A genuinely inaccessible-from-outside class member (ES2022), invisible to `Object.keys`, `JSON.stringify`, and `hasOwnProperty`. (Ch 5.5)\n\n**`process`** — Node's global object exposing the running process itself: `argv`, `env`, `exit()`, `cwd()`, and more. (Ch 7.12)\n\n**recursion** — A function calling itself, working on a smaller piece of a problem each time until reaching a base case. Limited by the call stack's finite size. (Ch 4.7)\n\n**reference equality** — Two object/array values are `===`-equal only if they're the literal same object in memory, never based on matching content. (Ch 2.7)\n\n**rest parameters** (`...args`) — Collects any remaining arguments into a real array, always the last parameter in a function's signature. (Ch 4.3)\n\n**semver (semantic versioning)** — The `major.minor.patch` version scheme npm packages use; `^4.5.0` in `package.json` means \"any compatible `4.x` release.\" (Ch 6.5)\n\n**spread operator** (`...`) — Expands an iterable into individual elements (in an array literal or function call) or an object's own properties into a new object. (Ch 2.9)\n\n**stack overflow** — `RangeError: Maximum call stack size exceeded`, thrown when recursion exceeds the call stack's finite depth. A real, catchable error in JavaScript, not an unrecoverable crash. (Ch 4.7)\n\n**strict mode** (`\"use strict\"`) — A stricter rule set converting several historically-silent JavaScript behaviors into real, immediate errors. Automatic in ES Modules and class bodies. (Ch 6.7)\n\n**`Symbol.iterator`** — The special method key an object needs to be considered iterable. (Ch 5.10)\n\n**tail call** — A recursive call that is the very last thing a function does, with nothing left to compute after it returns. JavaScript engines (V8 included) do not optimize these despite the ES2015 spec allowing it. (Ch 4.7)\n\n**temporal dead zone (TDZ)** — The period between a `let`/`const`/`class` binding's hoisting and its actual declaration line, during which referencing it throws a `ReferenceError`. (Ch 1.3, 5.3)\n\n**`this`** — A keyword whose value is determined by how a function is *called*, not where it's defined — except in arrow functions, which have no `this` of their own. (Ch 4.6)\n\n**truthy / falsy** — JavaScript's rule for treating any value as boolean-like in a condition. The complete falsy list: `false`, `0`, `-0`, `\"\"`, `null`, `undefined`, `NaN`. Everything else, including `[]` and `{}`, is truthy. (Ch 2.1)\n\n**TypeScript** — A superset of JavaScript adding compile-time type checking, completely erased from the compiled output — providing no runtime protection at all. (Ch 8.7)\n\n**`util.inspect`** — A Node function for inspecting a value in full detail, including past `console.log`'s default depth-truncation limit. (Ch 8.3)\n\n**`this`-binding, explicit** — Setting `this` directly via `.call()`, `.apply()` (both invoke immediately), or `.bind()` (returns a new function with `this` permanently locked). (Ch 4.6)\n\n**Web APIs / browser APIs** — Functionality (the DOM, events, `fetch` originally) provided by a browser environment rather than the JavaScript language itself, though some (like `fetch`) are now also built into Node. (Ch 7.8, 7.9)\n\n**`yield`** — Pauses a generator function, producing a value and (via `.next(value)`) able to receive one back in return. (Ch 5.11)"}]

  </script>

  <!-- Application Logic -->
  <script>
  (function(){
    var rawJson = document.getElementById('book-data').textContent;
    var chapters;
    try {
      chapters = JSON.parse(rawJson);
    } catch(err) {
      console.error('Failed to parse book data JSON:', err);
      document.getElementById('chapter-pane').innerHTML = '<div style="padding:2rem;color:red;"><h3>Error Loading Book Data</h3><p>' + err.message + '</p></div>';
      return;
    }

    var chapterMap = {};
    chapters.forEach(function(c, i){ c.index = i; chapterMap[c.id] = c; });

    var STORAGE_KEY_THEME = 'python_book_theme';
    var STORAGE_KEY_FONT = 'js_book_fontsize';
    var STORAGE_KEY_LAST = 'js_book_last_chapter';
    var STORAGE_KEY_CODE = 'js_book_code_style';
    var STORAGE_KEY_CODE_CARD = 'js_book_code_card';
    var STORAGE_KEY_COMPLETED = 'lga_completed_chapters';

    var currentChapterId = null;

    // Theme handling (Light / Dark)
    var currentTheme = 'light';
    try {
      var pTheme = new URLSearchParams(window.location.search).get('theme');
      currentTheme = (pTheme === 'dark' || pTheme === 'light') ? pTheme : (localStorage.getItem(STORAGE_KEY_THEME) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    }catch(e){}
    function applyTheme(theme){
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY_THEME, theme); }catch(e){}
      document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setTheme === theme);
      });
    }
    applyTheme(currentTheme);

    document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyTheme(btn.dataset.setTheme);
      });
    });

    // Code block card handling (GitHub Light [Default] / Obsidian)
    var currentCodeCard = 'light';
    try { currentCodeCard = localStorage.getItem(STORAGE_KEY_CODE_CARD) || 'light'; }catch(e){}
    function applyCodeCard(card){
      currentCodeCard = card;
      document.documentElement.setAttribute('data-code-card', card);
      try { localStorage.setItem(STORAGE_KEY_CODE_CARD, card); }catch(e){}
      document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCodeCard === card);
      });
    }
    applyCodeCard(currentCodeCard);

    document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeCard(btn.dataset.setCodeCard);
      });
    });

    // Code style handling (Indigo / Ruby / Sapphire / Minimal)
    var currentCodeStyle = 'indigo';
    try { currentCodeStyle = localStorage.getItem(STORAGE_KEY_CODE) || 'indigo'; }catch(e){}
    function applyCodeStyle(style){
      currentCodeStyle = style;
      document.documentElement.setAttribute('data-code-style', style);
      try { localStorage.setItem(STORAGE_KEY_CODE, style); }catch(e){}
      document.querySelectorAll('.code-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCode === style);
      });
    }
    applyCodeStyle(currentCodeStyle);

    document.querySelectorAll('.code-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeStyle(btn.dataset.setCode);
      });
    });

    // Font size scaling (Default: 20px)
    var DEFAULT_FONT_SIZE = 20;
    var currentFontSize = DEFAULT_FONT_SIZE;
    try {
      var savedFont = localStorage.getItem(STORAGE_KEY_FONT);
      if (savedFont) {
        currentFontSize = parseFloat(savedFont);
        if (currentFontSize === 16.5) currentFontSize = DEFAULT_FONT_SIZE;
      }
    } catch(e){}
    function applyFontSize(size){
      currentFontSize = Math.max(14, Math.min(28, Math.round(size * 10) / 10));
      document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
      try { localStorage.setItem(STORAGE_KEY_FONT, currentFontSize); }catch(e){}
      var fontResetBtn = document.getElementById('font-reset');
      if (fontResetBtn) fontResetBtn.textContent = Math.round(currentFontSize) + 'px';
    }
    applyFontSize(currentFontSize);
    document.getElementById('font-inc').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize + 1.5);
    });
    document.getElementById('font-dec').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize - 1.5);
    });
    document.getElementById('font-reset').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(DEFAULT_FONT_SIZE);
    });

    // Reset All to Defaults (Theme, Code card, Code style, Font size, and Reading progress)
    var resetAllBtn = document.getElementById('reset-all-btn');
    if (resetAllBtn) {
      resetAllBtn.addEventListener('click', function(e){
        e.stopPropagation();

        try {
          localStorage.removeItem(STORAGE_KEY_THEME);
          localStorage.removeItem(STORAGE_KEY_FONT);
          localStorage.removeItem(STORAGE_KEY_LAST);
          localStorage.removeItem(STORAGE_KEY_CODE);
          localStorage.removeItem(STORAGE_KEY_CODE_CARD);
          localStorage.removeItem(STORAGE_KEY_COMPLETED);
        } catch(err){}

        applyTheme('light');
        applyCodeCard('light');
        applyCodeStyle('indigo');
        applyFontSize(DEFAULT_FONT_SIZE);
        updateCompletionUI();

        if (location.hash !== '#0.1') {
          location.hash = '#0.1';
        } else {
          renderChapter('0.1');
        }

        var origHtml = resetAllBtn.innerHTML;
        resetAllBtn.classList.add('success');
        resetAllBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Reset to Defaults!</span>';

        setTimeout(function(){
          resetAllBtn.classList.remove('success');
          resetAllBtn.innerHTML = origHtml;
        }, 1800);
      });
    }

    // Settings popover
    var settingsBtn = document.getElementById('settings-btn');
    var settingsPopover = document.getElementById('settings-popover');

    function toggleSettings(open){
      var willOpen = (typeof open === 'boolean') ? open : !settingsPopover.classList.contains('open');
      settingsPopover.classList.toggle('open', willOpen);
      settingsBtn.classList.toggle('active', willOpen);
      settingsBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    }

    settingsBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleSettings();
    });

    settingsPopover.addEventListener('click', function(e){
      e.stopPropagation();
    });

    function handleOutsideSettingsClick(e){
      if(settingsPopover.classList.contains('open') && !settingsPopover.contains(e.target) && !settingsBtn.contains(e.target)){
        toggleSettings(false);
      }
    }
    document.addEventListener('click', handleOutsideSettingsClick);
    document.addEventListener('touchend', handleOutsideSettingsClick, { passive: true });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Reading Progress & Completion Memory
    function getCompletedChapters(){
      try {
        var raw = localStorage.getItem(STORAGE_KEY_COMPLETED);
        if(raw){
          var arr = JSON.parse(raw);
          if(Array.isArray(arr)) return arr;
        }
      }catch(e){}
      return [];
    }
    function isChapterCompleted(id){
      return getCompletedChapters().indexOf(id) !== -1;
    }
    function markChapterCompleted(id, completed){
      try {
        var list = getCompletedChapters();
        var idx = list.indexOf(id);
        if(completed && idx === -1){
          list.push(id);
        } else if(!completed && idx !== -1){
          list.splice(idx, 1);
        }
        localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(list));
        updateCompletionUI();
      }catch(e){}
    }
    function toggleChapterCompleted(id){
      markChapterCompleted(id, !isChapterCompleted(id));
    }
    function updateCompletionUI(){
      var completedList = getCompletedChapters();
      var completedSet = {};
      completedList.forEach(function(id){ completedSet[id] = true; });

      document.querySelectorAll('.chapter-item').forEach(function(item){
        var id = item.dataset.chapId;
        var isDone = !!completedSet[id];
        item.classList.toggle('completed', isDone);
        var check = item.querySelector('.chapter-check');
        if(check){
          check.setAttribute('title', isDone ? 'Completed (click to mark unread)' : 'Click to mark as completed');
          check.setAttribute('aria-label', (isDone ? 'Completed: ' : 'Uncompleted: ') + id);
        }
      });

      parts.forEach(function(p){
        var partBadge = document.querySelector('.part-count-badge[data-part-badge="' + p.partNum + '"]');
        if(partBadge){
          var doneCount = p.chapters.filter(function(c){ return !!completedSet[c.id]; }).length;
          var total = p.chapters.length;
          if(doneCount === total && total > 0){
            partBadge.textContent = '✓ ' + total;
            partBadge.classList.add('all-done');
            partBadge.title = 'All ' + total + ' chapters completed';
          } else if(doneCount > 0){
            partBadge.textContent = doneCount + '/' + total;
            partBadge.classList.remove('all-done');
            partBadge.title = doneCount + ' of ' + total + ' chapters completed';
          } else {
            partBadge.textContent = total;
            partBadge.classList.remove('all-done');
            partBadge.title = total + ' chapters';
          }
        }
      });

      var progressBadge = document.getElementById('toc-progress-badge');
      if(progressBadge){
        var totalDone = completedList.length;
        progressBadge.textContent = totalDone + ' / ' + chapters.length;
        if(totalDone === chapters.length && chapters.length > 0){
          progressBadge.textContent = chapters.length + ' / ' + chapters.length + ' ✓';
        }
      }

      var chapCompleteBtn = document.getElementById('chap-complete-btn');
      if(chapCompleteBtn && currentChapterId){
        var isDone = !!completedSet[currentChapterId];
        chapCompleteBtn.classList.toggle('completed', isDone);
        chapCompleteBtn.textContent = isDone ? '✓ Completed' : 'Mark as read';
        chapCompleteBtn.title = isDone ? 'Mark chapter as unread' : 'Mark chapter as completed';
      }
    }

    // Sidebar Header: Collapse / Expand All
    var tocToggleAllBtn = document.getElementById('toc-toggle-all-btn');
    function updateToggleAllBtnLabel(){
      if (!tocToggleAllBtn) return;
      var allGroups = document.querySelectorAll('.part-group');
      var openCount = 0;
      allGroups.forEach(function(g){ if(g.classList.contains('open')) openCount++; });
      tocToggleAllBtn.textContent = (openCount > 1) ? 'Collapse all' : 'Expand all';
    }

    if (tocToggleAllBtn) {
      tocToggleAllBtn.addEventListener('click', function(){
        var allGroups = Array.prototype.slice.call(document.querySelectorAll('.part-group'));
        var openCount = allGroups.filter(function(g){ return g.classList.contains('open'); }).length;
        var willExpand = openCount <= 1;

        allGroups.forEach(function(g){
          if (willExpand) {
            g.classList.add('open');
          } else {
            var isCurrent = currentChapterId && g.querySelector('a[href="#' + currentChapterId + '"]');
            if (isCurrent) {
              g.classList.add('open');
            } else {
              g.classList.remove('open');
            }
          }
        });
        updateToggleAllBtnLabel();
      });
    }

    // Build Table of Contents tree
    var tocTree = document.getElementById('toc-tree');
    var parts = [];
    var partsMap = {};
    chapters.forEach(function(c){
      if(!partsMap[c.partNum]){
        var pObj = { partNum: c.partNum, title: c.partTitle, metaphor: c.partMetaphor, chapters: [] };
        parts.push(pObj);
        partsMap[c.partNum] = pObj;
      }
      partsMap[c.partNum].chapters.push(c);
    });

    parts.forEach(function(p){
      var group = document.createElement('div');
      group.className = 'part-group';
      group.dataset.part = p.partNum;

      var header = document.createElement('button');
      header.className = 'part-header';
      header.type = 'button';
      if (p.metaphor) {
        header.title = p.title + ' — ' + p.metaphor;
      }
      header.innerHTML = 
        '<span class="part-title-text">' + escapeHtml(p.title) + '</span>' +
        '<span class="part-header-right">' +
          '<span class="part-count-badge" data-part-badge="' + p.partNum + '">' + p.chapters.length + '</span>' +
          '<span class="chevron" aria-hidden="true">▸</span>' +
        '</span>';

      header.addEventListener('click', function(){
        group.classList.toggle('open');
        updateToggleAllBtnLabel();
      });
      group.appendChild(header);

      var ul = document.createElement('ul');
      ul.className = 'chapter-list';
      p.chapters.forEach(function(c){
        var li = document.createElement('li');
        li.className = 'chapter-item';
        li.dataset.chapId = c.id;

        var a = document.createElement('a');
        a.href = '#' + c.id;
        a.innerHTML = 
          '<span class="chapter-badge">' + c.id + '</span>' +
          '<span class="chapter-title-text">' + escapeHtml(c.title) + '</span>' +
          '<button class="chapter-check" type="button" title="Toggle completed" aria-label="Mark ' + c.id + ' read or unread">✓</button>';

        var checkBtn = a.querySelector('.chapter-check');
        checkBtn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          toggleChapterCompleted(c.id);
        });

        a.addEventListener('click', function(e){
          closeDrawer();
        });
        li.appendChild(a);
        ul.appendChild(li);
      });
      group.appendChild(ul);
      tocTree.appendChild(group);
    });

    // Mobile drawer toggle
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('drawer-overlay');
    var hamburger = document.getElementById('hamburger-btn');

    function openDrawer(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
    function closeDrawer(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }

    if (hamburger) {
      hamburger.addEventListener('click', function(){ sidebar.classList.contains('open') ? closeDrawer() : openDrawer(); });
    }
    if (overlay) {
      overlay.addEventListener('click', closeDrawer);
    }

    // Render single chapter
    var chapterPane = document.getElementById('chapter-pane');
    var progressFill = document.getElementById('progress-fill');

    function renderChapter(id){
      var chap = chapterMap[id];
      if(!chap) chap = chapters[0];
      currentChapterId = chap.id;

      try { localStorage.setItem(STORAGE_KEY_LAST, chap.id); }catch(e){}

      var pct = ((chap.index + 1) / chapters.length) * 100;
      if (progressFill) progressFill.style.width = pct + '%';

      document.querySelectorAll('.chapter-item a').forEach(function(a){
        var isActive = a.getAttribute('href') === '#' + chap.id;
        a.classList.toggle('active', isActive);
      });

      var activeGroup = document.querySelector('.part-group[data-part="' + chap.partNum + '"]');
      if(activeGroup) {
        activeGroup.classList.add('open');
        var activeLink = activeGroup.querySelector('a[href="#' + chap.id + '"]');
        if(activeLink && activeLink.scrollIntoView) {
          activeLink.scrollIntoView({ block: 'nearest' });
        }
      }

      var htmlContent = '';
      if(window.marked && window.marked.parse){
        window.marked.setOptions({ gfm: true, breaks: false });
        htmlContent = window.marked.parse(chap.md);
      } else {
        htmlContent = '<pre>' + chap.md + '</pre>';
      }

      chapterPane.innerHTML = '';

      // Eyebrow
      var eyebrow = document.createElement('div');
      eyebrow.className = 'chap-eyebrow';
      var isDone = isChapterCompleted(chap.id);
      eyebrow.innerHTML = 
        '<div class="chap-eyebrow-left">' +
          '<span>' + escapeHtml(chap.partTitle) + '</span>' +
          (chap.partMetaphor ? '<span class="metaphor-note">— ' + escapeHtml(chap.partMetaphor) + '</span>' : '') +
        '</div>' +
        '<button class="chap-complete-btn' + (isDone ? ' completed' : '') + '" id="chap-complete-btn" type="button" title="' + (isDone ? 'Mark chapter as unread' : 'Mark chapter as completed') + '">' +
          (isDone ? '✓ Completed' : 'Mark as read') +
        '</button>';
      var completeBtn = eyebrow.querySelector('#chap-complete-btn');
      completeBtn.addEventListener('click', function(){
        toggleChapterCompleted(chap.id);
      });
      chapterPane.appendChild(eyebrow);

      // Title row
      var titleRow = document.createElement('div');
      titleRow.className = 'chap-title-row';

      var h1 = document.createElement('h1');
      h1.className = 'chap-title';
      h1.textContent = chap.fullTitle;
      titleRow.appendChild(h1);

      chapterPane.appendChild(titleRow);

      // Chapter Body
      var bodyDiv = document.createElement('div');
      bodyDiv.className = 'chapter-body';
      bodyDiv.innerHTML = htmlContent;

      groupSubsections(bodyDiv);
      chapterPane.appendChild(bodyDiv);

      // Enhanced Code Block Cards with Playground & Copy Buttons
      var copyIconSvg = '<svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
      var checkIconSvg = '<svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      var playIconSvg = '<svg class="run-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';

      bodyDiv.querySelectorAll('pre').forEach(function(pre){
        var codeEl = pre.querySelector('code');
        var origClass = (codeEl && codeEl.className) || '';
        var explicitMatch = origClass.match(/language-([a-zA-Z0-9_-]+)/);
        var explicitLang = explicitMatch ? explicitMatch[1].toLowerCase() : null;

        var initialCode = (codeEl || pre).textContent;
        var firstLine = initialCode.trim().split('\n')[0].trim();
        var isTerminalCmd = /^(\$ |❯ |PS> |PS )/i.test(firstLine);

        var lang = 'Go';
        if (explicitLang === 'go' || explicitLang === 'golang' || (!explicitLang && !isTerminalCmd)) {
          lang = 'Go';
          if(window.hljs && codeEl) {
            codeEl.className = 'language-go';
            hljs.highlightElement(codeEl);
          }
        } else if (explicitLang === 'json') {
          lang = 'JSON';
          if(window.hljs && codeEl) {
            codeEl.className = 'language-json';
            hljs.highlightElement(codeEl);
          }
        } else if (isTerminalCmd || explicitLang === 'bash' || explicitLang === 'sh' || explicitLang === 'terminal') {
          lang = 'TERMINAL';
        } else if (explicitLang) {
          lang = explicitLang.toUpperCase();
        } else {
          lang = 'OUTPUT';
        }

        var card = document.createElement('div');
        card.className = 'code-card';

        var cardHeader = document.createElement('div');
        cardHeader.className = 'code-header';

        var left = document.createElement('div');
        left.className = 'code-header-left';
        left.innerHTML = 
          '<div class="code-dots"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></div>' +
          '<span class="code-lang">' + lang + '</span>';
        cardHeader.appendChild(left);

        var right = document.createElement('div');
        right.className = 'code-header-right';

        if (lang === 'Go') {
          var playBtn = document.createElement('button');
          playBtn.className = 'code-run-btn';
          playBtn.type = 'button';
          playBtn.title = 'Open snippet in interactive Go Playground';
          playBtn.innerHTML = playIconSvg + '<span>Playground</span>';
          playBtn.addEventListener('click', function(){
            var snippet = (codeEl || pre).textContent;
            try {
              localStorage.setItem('hexlean_go_code', snippet);
            } catch(e){}
            window.open('playground.html', '_blank');
          });
          right.appendChild(playBtn);
        }

        var copyBtn = document.createElement('button');
        copyBtn.className = 'code-copy-btn';
        copyBtn.type = 'button';
        copyBtn.title = 'Copy code to clipboard';
        copyBtn.innerHTML = copyIconSvg + '<span>Copy</span>';

        copyBtn.addEventListener('click', function(){
          var text = (codeEl || pre).textContent;
          var done = function(){
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = checkIconSvg + '<span>Copied!</span>';
            setTimeout(function(){
              copyBtn.classList.remove('copied');
              copyBtn.innerHTML = copyIconSvg + '<span>Copy</span>';
            }, 1800);
          };
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(done, function(){
              fallbackCopy(text, done);
            });
          } else {
            fallbackCopy(text, done);
          }
        });
        right.appendChild(copyBtn);
        cardHeader.appendChild(right);

        pre.parentNode.insertBefore(card, pre);
        card.appendChild(cardHeader);
        card.appendChild(pre);
      });

      function fallbackCopy(text, cb){
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta);
        cb();
      }

      // Next / Previous Navigation Cards
      var prev = chapters[chap.index - 1];
      var next = chapters[chap.index + 1];

      var navCards = document.createElement('div');
      navCards.className = 'chapter-nav-cards';
      navCards.innerHTML = 
        (prev ? '<a class="nav-card prev" href="#' + prev.id + '"><span class="nav-card-dir">‹ Previous Chapter</span><span class="nav-card-title">' + prev.id + ' ' + prev.title + '</span></a>' : '<div></div>') +
        (next ? '<a class="nav-card next" href="#' + next.id + '"><span class="nav-card-dir">Next Chapter ›</span><span class="nav-card-title">' + next.id + ' ' + next.title + '</span></a>' : '<div></div>');
      
      var nextCardLink = navCards.querySelector('.nav-card.next');
      if (nextCardLink) {
        nextCardLink.addEventListener('click', function(){
          markChapterCompleted(chap.id, true);
        });
      }
      chapterPane.appendChild(navCards);

      // Reader Chapter Footer
      var readerFooter = document.createElement('footer');
      readerFooter.className = 'reader-footer';
      readerFooter.innerHTML = 
        '<div class="reader-footer-wrap">' +
          '<div class="reader-footer-copy">' +
            '&copy; 2026 <strong>HexLean</strong> &bull; An open technical educational project created by <a href="https://hexdef.com/resume/" target="_blank" rel="noopener">Tanvir Hussain</a>.' +
          '</div>' +
          '<div class="reader-footer-links">' +
            '<a href="/">Platform Home</a>' +
            '<a href="https://hexdef.com" target="_blank" rel="noopener">hexdef.com</a>' +
            '<a href="https://github.com/shadowpbx/hexlean" target="_blank" rel="noopener">GitHub</a>' +
          '</div>' +
        '</div>';
      chapterPane.appendChild(readerFooter);

      // Auto-mark completed when reaching the bottom of chapter
      if (window.IntersectionObserver) {
        var bottomObserver = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if (entry.isIntersecting) {
              markChapterCompleted(chap.id, true);
              bottomObserver.disconnect();
            }
          });
        }, { threshold: 0.3 });
        bottomObserver.observe(navCards);
      }

      window.scrollTo({ top: 0, behavior: 'instant' });
      updateCompletionUI();
      updateToggleAllBtnLabel();
    }

    function groupSubsections(container){
      var kids = Array.prototype.slice.call(container.children);
      var i = 0;
      while(i < kids.length){
        var el = kids[i];
        if(el.tagName === 'H3'){
          var wrapper = document.createElement('div');
          var text = el.textContent.toLowerCase();
          var cls = 'subsection';
          if(text.indexOf('mistake') !== -1) cls += ' subsection--mistakes';
          else if(text.indexOf('recap') !== -1) cls += ' subsection--recap';
          else if(text.indexOf('matters') !== -1) cls += ' subsection--matters';
          wrapper.className = cls;
          container.insertBefore(wrapper, el);
          wrapper.appendChild(el);
          var j = i + 1;
          while(j < kids.length && kids[j].tagName !== 'H3' && kids[j].tagName !== 'H2'){
            wrapper.appendChild(kids[j]);
            j++;
          }
          i = j;
        } else {
          i++;
        }
      }
    }

    // Router handling via Hash
    function handleHash(){
      var hash = location.hash.replace(/^#\/?/, '').trim();
      if(!hash){
        var last = null;
        try { last = localStorage.getItem(STORAGE_KEY_LAST); }catch(e){}
        if(last && chapterMap[last]){
          location.replace('#' + last);
          return;
        }
        hash = '0.1';
      }
      if(chapterMap[hash]){
        renderChapter(hash);
      } else {
        renderChapter('0.1');
      }
    }

    window.addEventListener('hashchange', handleHash);
    handleHash();

    // Touch Swipe Gestures
    var touchStartX = 0, touchStartY = 0;
    var contentPane = document.getElementById('main-viewport');
    if (contentPane) {
      contentPane.addEventListener('touchstart', function(e){
        if(e.touches.length === 1){
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      contentPane.addEventListener('touchend', function(e){
        if(e.changedTouches.length === 1){
          var diffX = e.changedTouches[0].clientX - touchStartX;
          var diffY = e.changedTouches[0].clientY - touchStartY;
          if(Math.abs(diffX) > 80 && Math.abs(diffY) < 50){
            var currentChap = chapterMap[currentChapterId];
            if(!currentChap) return;
            if(diffX < 0 && chapters[currentChap.index + 1]){
              markChapterCompleted(currentChap.id, true);
              location.hash = '#' + chapters[currentChap.index + 1].id;
            } else if(diffX > 0 && chapters[currentChap.index - 1]){
              location.hash = '#' + chapters[currentChap.index - 1].id;
            }
          }
        }
      }, { passive: true });
    }

    // Search Command Palette Modal Logic
    var searchModal = document.getElementById('search-modal');
    var searchBackdrop = document.getElementById('search-backdrop');
    var searchInput = document.getElementById('search-input');
    var searchClearBtn = document.getElementById('search-clear-btn');
    var searchCloseBtn = document.getElementById('search-close-btn');
    var searchResults = document.getElementById('search-results');
    var searchCount = document.getElementById('search-count');
    var searchBtn = document.getElementById('search-btn');

    var isMac = (typeof navigator !== 'undefined' && (navigator.platform || '').toUpperCase().indexOf('MAC') >= 0);
    var shortcutBadge = document.querySelector('.search-shortcut-badge');
    if (shortcutBadge) {
      shortcutBadge.textContent = isMac ? '⌘K' : 'Ctrl+K';
    }

    var searchCorpus = chapters.map(function(c){
      var cleanMd = (c.md || '')
        .replace(/^#+\s+/gm, '')
        .replace(/`{3}[a-zA-Z0-9_-]*\n([\s\S]*?)`{3}/g, ' $1 ')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1');

      return {
        id: c.id,
        index: c.index,
        partNum: c.partNum,
        partTitle: c.partTitle,
        partMetaphor: c.partMetaphor || '',
        title: c.title,
        fullTitle: c.fullTitle,
        cleanText: cleanMd
      };
    });

    var popularTopics = [
      "Parameter Expansion", "Arrays & Maps", "if / elif / else", "for & while Loops",
      "Functions & Namerefs", "Pipes & Redirection", "grep, sed & awk", "find & xargs",
      "Process Substitution", "Job Control & trap", "Debugging (set -euo pipefail)", "jq & JSON Parsing"
    ];

    var selectedSearchIndex = -1;
    var currentResultItems = [];

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderDefaultSuggestions() {
      searchCount.textContent = chapters.length + ' chapters indexed';
      searchClearBtn.classList.remove('visible');
      selectedSearchIndex = -1;
      currentResultItems = [];

      var html = '<div class="search-empty">' +
        '<div class="search-empty-icon">🔍</div>' +
        '<div class="search-empty-title">Search Learn C</div>' +
        '<div class="search-empty-desc">Search topics, shell scripts, commands, syntax, utilities, and chapter titles across all 66 chapters.</div>' +
        '<div class="search-suggestions-label">Popular Topics</div>' +
        '<div class="search-suggestions-pills">';

      popularTopics.forEach(function(topic){
        html += '<button type="button" class="search-pill" data-topic="' + escapeHtml(topic) + '">' + escapeHtml(topic) + '</button>';
      });

      html += '</div></div>';
      searchResults.innerHTML = html;

      searchResults.querySelectorAll('.search-pill').forEach(function(btn){
        btn.addEventListener('click', function(){
          var topic = btn.getAttribute('data-topic');
          searchInput.value = topic;
          performSearch(topic);
          searchInput.focus();
        });
      });
    }

    function highlightText(text, terms) {
      var escaped = escapeHtml(text);
      if (!terms || terms.length === 0) return escaped;

      var validTerms = [];
      terms.forEach(function(t){
        var clean = t.trim();
        if (clean.length > 0 && validTerms.indexOf(clean) === -1) {
          validTerms.push(clean);
        }
      });
      if (validTerms.length === 0) return escaped;

      validTerms.sort(function(a, b){ return b.length - a.length; });
      var pattern = validTerms.map(function(t){ return escapeRegex(escapeHtml(t)); }).join('|');
      var re = new RegExp('(' + pattern + ')', 'gi');
      return escaped.replace(re, '<mark class="search-highlight">$1</mark>');
    }

    function performSearch(query) {
      var q = (query || '').trim();
      if (!q) {
        renderDefaultSuggestions();
        return;
      }

      searchClearBtn.classList.add('visible');

      var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (terms.length === 0) {
        renderDefaultSuggestions();
        return;
      }

      var hits = [];
      for (var i = 0; i < searchCorpus.length; i++) {
        var doc = searchCorpus[i];
        var titleLower = (doc.title || '').toLowerCase();
        var fullTitleLower = (doc.fullTitle || '').toLowerCase();
        var partLower = ((doc.partTitle || '') + ' ' + (doc.partMetaphor || '')).toLowerCase();
        var textLower = (doc.cleanText || '').toLowerCase();

        var score = 0;
        var allMatched = true;

        for (var t = 0; t < terms.length; t++) {
          var term = terms[t];
          var inTitle = titleLower.indexOf(term) !== -1;
          var inFullTitle = fullTitleLower.indexOf(term) !== -1;
          var inPart = partLower.indexOf(term) !== -1;
          var inText = textLower.indexOf(term) !== -1;

          if (!inTitle && !inFullTitle && !inPart && !inText) {
            allMatched = false;
            break;
          }

          if (inTitle) score += 120;
          if (inFullTitle) score += 90;
          if (inPart) score += 40;
          if (inText) {
            var count = 0;
            var pos = 0;
            while ((pos = textLower.indexOf(term, pos)) !== -1 && count < 6) {
              score += 15;
              pos += term.length;
              count++;
            }
          }
        }

        if (!allMatched) continue;

        var snippet = '';
        var firstPos = -1;
        for (var k = 0; k < terms.length; k++) {
          var p = textLower.indexOf(terms[k]);
          if (p !== -1 && (firstPos === -1 || p < firstPos)) {
            firstPos = p;
          }
        }

        if (firstPos !== -1) {
          var start = Math.max(0, firstPos - 45);
          var end = Math.min(doc.cleanText.length, firstPos + 105);
          snippet = (start > 0 ? '… ' : '') + doc.cleanText.substring(start, end).trim() + (end < doc.cleanText.length ? ' …' : '');
        } else {
          snippet = doc.cleanText.substring(0, 110).trim() + '…';
        }

        hits.push({
          id: doc.id,
          title: doc.title,
          partNum: doc.partNum,
          partTitle: doc.partTitle,
          partMetaphor: doc.partMetaphor,
          snippet: snippet,
          score: score
        });
      }

      hits.sort(function(a, b){ return b.score - a.score; });
      renderSearchResults(hits, terms, q);
    }

    function renderSearchResults(hits, terms, query) {
      selectedSearchIndex = -1;
      currentResultItems = [];

      if (hits.length === 0) {
        searchCount.textContent = '0 results';
        searchResults.innerHTML = 
          '<div class="search-empty">' +
            '<div class="search-empty-icon">🧐</div>' +
            '<div class="search-empty-title">No matching chapters</div>' +
            '<div class="search-empty-desc">No chapters contained all terms for "' + escapeHtml(query) + '". Try simpler keywords like <code>variables</code>, <code>pipe</code>, or <code>xargs</code>.</div>' +
          '</div>';
        return;
      }

      searchCount.textContent = hits.length + ' result' + (hits.length === 1 ? '' : 's');

      var html = '';
      hits.forEach(function(item, idx){
        var highlightedTitle = highlightText(item.title, terms);
        var highlightedSnippet = highlightText(item.snippet, terms);

        html += 
          '<a class="search-result-item" data-chap-id="' + item.id + '" data-search-index="' + idx + '" href="#' + item.id + '">' +
            '<div class="search-result-top">' +
              '<span class="search-part-badge">Part ' + item.partNum + '</span>' +
              '<span class="search-item-id">' + item.id + '</span>' +
              '<span class="search-item-title">' + highlightedTitle + '</span>' +
            '</div>' +
            '<div class="search-snippet">' + highlightedSnippet + '</div>' +
          '</a>';
      });

      searchResults.innerHTML = html;
      currentResultItems = Array.prototype.slice.call(searchResults.querySelectorAll('.search-result-item'));

      currentResultItems.forEach(function(el, idx){
        el.addEventListener('click', function(e){
          e.preventDefault();
          var cid = el.getAttribute('data-chap-id');
          navigateToChapter(cid);
        });
        el.addEventListener('mouseenter', function(){
          setSelectedIndex(idx, false);
        });
      });

      if (currentResultItems.length > 0) {
        setSelectedIndex(0, false);
      }
    }

    function setSelectedIndex(idx, scrollIntoView) {
      if (currentResultItems.length === 0) return;
      if (idx < 0) idx = 0;
      if (idx >= currentResultItems.length) idx = currentResultItems.length - 1;

      currentResultItems.forEach(function(item, i){
        item.classList.toggle('selected', i === idx);
      });
      selectedSearchIndex = idx;

      if (scrollIntoView && currentResultItems[idx]) {
        currentResultItems[idx].scrollIntoView({ block: 'nearest' });
      }
    }

    function navigateToChapter(cid) {
      closeSearch();
      location.hash = '#' + cid;
    }

    function openSearch() {
      searchModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (!searchInput.value.trim()) {
        renderDefaultSuggestions();
      }
      setTimeout(function(){
        searchInput.focus();
        searchInput.select();
      }, 50);
    }

    function closeSearch() {
      searchModal.classList.remove('open');
      document.body.style.overflow = '';
    }

    if (searchBtn) searchBtn.addEventListener('click', openSearch);
    if (searchBackdrop) searchBackdrop.addEventListener('click', closeSearch);
    if (searchCloseBtn) searchCloseBtn.addEventListener('click', closeSearch);

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', function(){
        searchInput.value = '';
        searchInput.focus();
        renderDefaultSuggestions();
      });
    }

    if (searchInput) {
      searchInput.addEventListener('input', function(){
        performSearch(searchInput.value);
      });

      searchInput.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex + 1, true);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex - 1, true);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (selectedSearchIndex >= 0 && currentResultItems[selectedSearchIndex]) {
            var cid = currentResultItems[selectedSearchIndex].getAttribute('data-chap-id');
            navigateToChapter(cid);
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeSearch();
        }
      });
    }

    // Global keyboard navigation
    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === '/' && !searchModal.classList.contains('open')) {
        if (document.activeElement && (
          document.activeElement.tagName === 'INPUT' ||
          document.activeElement.tagName === 'TEXTAREA' ||
          document.activeElement.isContentEditable
        )) {
          return;
        }
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === 'Escape' && searchModal.classList.contains('open')) {
        e.preventDefault();
        closeSearch();
        return;
      }

      if (searchModal.classList.contains('open')) return;

      if(document.activeElement && (
        document.activeElement.tagName === 'INPUT' ||
        document.activeElement.tagName === 'TEXTAREA' ||
        document.activeElement.isContentEditable
      )) return;

      var currentChap = chapterMap[currentChapterId];
      if(!currentChap) return;

      if(e.key === 'ArrowRight' || (!e.ctrlKey && !e.metaKey && e.key === 'k')){
        if(chapters[currentChap.index + 1]) location.hash = '#' + chapters[currentChap.index + 1].id;
      } else if(e.key === 'ArrowLeft' || e.key === 'j'){
        if(chapters[currentChap.index - 1]) location.hash = '#' + chapters[currentChap.index - 1].id;
      } else if(e.key === 't'){
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else if(e.key === 'Escape'){
        closeDrawer();
        toggleSettings(false);
      }
    });

  })();
  </script>
</body>
