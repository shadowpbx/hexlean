process`, `window`, depending on the environment) in a linter's configuration, causing real, valid code to be incorrectly flagged as using an undeclared variable — exactly why `globals` appeared in Example 2's config.\n- **Running `--fix` and assuming every reported problem was resolved.** As Example 3 showed, only unambiguous, mechanical fixes are applied automatically — many real issues genuinely require a human decision.\n- **Manually re-formatting code by hand in a project that already has Prettier configured**, fighting against what the next `--write` run will simply undo — let the formatter own formatting entirely, and spend review time on substance instead.\n\n### How this connects\n\nThis closes out Part Six's coverage of JavaScript's real-world tooling — modules, npm, strict mode, and now linting/formatting. Chapter 8.4 (JavaScript Style: Naming, Formatting & Idioms) revisits style from a broader, human-judgment angle that these automated tools deliberately don't try to enforce.\n\n### Quick recap\n\n- A linter (ESLint) analyzes code for real problems — unused variables, undeclared names, risky patterns — without changing how it looks.\n- A formatter (Prettier) rewrites code's style consistently — spacing, quotes, line breaks — without touching its logic at all.\n- Lint rules are typically configured as `\"error\"`, `\"warn\"`, or `\"off\"`, and a linter needs to be told about a runtime's built-in globals to avoid false positives.\n- `--fix` (ESLint) and `--write` (Prettier) apply automatic corrections — only for the subset of problems that have an unambiguous, mechanical fix."}, {"id": "7.1", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 1, "slug": "the-math-object", "fullTitle": "The `Math` Object", "title": "The `Math` Object", "md": "### Why this matters\n\nPart Seven turns to JavaScript's practical, built-in tools for real-world tasks — starting with `Math`, used constantly for anything numeric: rounding, random values, geometry, clamping ranges. It's a genuinely simple object, but has a few real, exact behaviors worth confirming directly rather than assuming.\n\n### The core idea\n\n`Math` is a built-in object (never constructed with `new`) holding numeric constants (`Math.PI`) and pure functions (`Math.max`, `Math.round`, `Math.random`) as static-style properties and methods — conceptually similar to Chapter 5.3's `static` class members, though `Math` itself predates `class` entirely.\n\n### Examples\n\n**1. `Math.max`/`Math.min` — variadic, and genuinely surprising with zero arguments.**\n```js\nconsole.log(Math.max(1, 5, 3));\nconsole.log(Math.min(1, 5, 3));\nconsole.log(Math.max());\nconsole.log(Math.min());\n```\nOutput:\n```\n5\n1\n-Infinity\nInfinity\n```\nWith no arguments at all, `Math.max()` returns `-Infinity` and `Math.min()` returns `Infinity` — this is genuinely correct, not an error: any real number is greater than `-Infinity` and less than `Infinity` (Chapter 2.4), so these are the true, mathematically-consistent identity values for \"the maximum/minimum of nothing.\"\n\n**2. Rounding functions — `round`, `floor`, `ceil`, and `trunc`, each behaving differently.**\n```js\nconsole.log(Math.round(4.5), Math.round(4.4), Math.round(-4.5));\nconsole.log(Math.floor(4.9), Math.ceil(4.1));\nconsole.log(Math.trunc(4.9), Math.trunc(-4.9));\n```\nOutput:\n```\n5 4 -4\n4 5\n4 -4\n```\n`Math.round(4.5)` rounds up to `5` as expected, but `Math.round(-4.5)` rounds to `-4`, not `-5` — `.5` always rounds toward positive infinity, a real, specific rule worth knowing rather than assuming \"rounds away from zero.\" `Math.floor` always rounds down (toward negative infinity); `Math.ceil` always rounds up. `Math.trunc` simply removes the decimal part entirely, with no rounding logic at all — `Math.trunc(-4.9)` is `-4`, confirming it moves *toward* zero, not down.\n\n**3. `Math.pow` and the `**` operator — genuinely equivalent.**\n```js\nconsole.log(Math.pow(2, 10));\nconsole.log(2 ** 10);\n```\nOutput:\n```\n1024\n1024\n```\n`**` (Chapter 1.5 briefly mentioned it) is the more modern, more concise way to write exponentiation — `Math.pow(base, exponent)` still works identically and remains common in older code.\n\n**4. `Math.sqrt` — and what happens with a negative input.**\n```js\nconsole.log(Math.sqrt(16));\nconsole.log(Math.sqrt(-1));\n```\nOutput:\n```\n4\nNaN\n```\nThe square root of a negative number isn't a real number at all — JavaScript has no built-in complex number type, so `Math.sqrt(-1)` genuinely returns `NaN` (Chapter 2.4) rather than throwing an error.\n\n**5. `Math.random()` — always in the range `[0, 1)`, confirmed directly.**\n```js\nconsole.log(Math.random() >= 0 && Math.random() < 1);\n```\nOutput:\n```\ntrue\n```\n`Math.random()` always returns a value greater than or equal to `0`, and strictly less than `1` — it can genuinely return `0` (though vanishingly rarely in practice) but can never return exactly `1`.\n\n**6. A real, common recipe: a random integer within an inclusive range.**\n```js\nfunction randomInt(min, max) {\n  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\nconst samples = new Set();\nfor (let i = 0; i < 1000; i++) {\n  samples.add(randomInt(1, 5));\n}\nconsole.log([...samples].sort());\n```\nOutput:\n```\n[ 1, 2, 3, 4, 5 ]\n```\n`Math.random() * (max - min + 1)` scales the `[0, 1)` range up to `[0, max - min + 1)`; `Math.floor` then truncates it to a whole number in `[0, max - min]`; adding `min` shifts it into the final `[min, max]` range. Running this 1000 times and collecting the distinct results into a `Set` (Chapter 2.10) confirms all five integers 1 through 5 genuinely appear — a real, standard way to verify a random-range function's boundaries are correct.\n\n**7. `Math.max`/`Math.min` on an array requires spreading it — and coerce string arguments to numbers.**\n```js\nconst arr = [3, 1, 4, 1, 5, 9];\nconsole.log(Math.max(...arr));\nconsole.log(Math.max(arr));\nconsole.log(Math.max(1, \"2\", 3));\nconsole.log(Math.max(1, \"abc\", 3));\n```\nOutput:\n```\n9\nNaN\n3\nNaN\n```\n`Math.max(arr)` (without spreading) passes the *whole array* as one argument — `Math.max` doesn't know what to do with a single array argument and returns `NaN`; spreading it (Chapter 2.9) into individual arguments, as `Math.max(...arr)`, is required. `Math.max(1, \"2\", 3)` genuinely returns `3` — `\"2\"` is coerced to the number `2` first (Chapter 2.1's numeric coercion rules apply here too) — but `\"abc\"` can't be coerced to any number at all, so the whole call returns `NaN`, exactly as `Number(\"abc\")` would on its own.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `Math.round(-4.5)` rounds to `-5`.** As Example 2 showed, `.5` always rounds toward positive infinity, giving `-4` — a real, specific rule that surprises many people expecting \"round half away from zero.\"\n- **Passing an array directly to `Math.max`/`Math.min` without spreading it.** As Example 7 showed, this returns `NaN` silently rather than throwing — always spread an array of numbers into these functions.\n- **Assuming `Math.random()` can return exactly `1`.** It's always strictly less than `1` — code that needs an inclusive upper bound (like Example 6) has to account for this in its own scaling math.\n- **Forgetting one non-numeric-coercible value anywhere in a `Math.max`/`Math.min` call poisons the entire result to `NaN`** — as Example 7's final line showed, even when every other argument is perfectly valid.\n\n### How this connects\n\nChapter 2.4's number coercion rules apply directly to `Math.max`/`Math.min`'s string-argument behavior (Example 7). Chapter 7.2 (The `Date` Object) is the next built-in object this book covers in similar depth, with its own set of real, easy-to-miss behaviors.\n\n### Quick recap\n\n- `Math` is a built-in object of numeric constants and functions, never constructed with `new`.\n- `Math.max()`/`Math.min()` with no arguments return `-Infinity`/`Infinity` respectively — the mathematically correct identity values.\n- `Math.round` rounds `.5` toward positive infinity (so `-4.5` rounds to `-4`, not `-5`); `Math.floor`/`Math.ceil` round toward negative/positive infinity; `Math.trunc` simply drops the decimal part, moving toward zero.\n- `Math.random()` returns a value in `[0, 1)` — inclusive of `0`, exclusive of `1`.\n- `Math.max`/`Math.min` need an array spread into individual arguments — passed directly, an array produces `NaN`."}, {"id": "7.2", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 2, "slug": "the-date-object", "fullTitle": "The `Date` Object", "title": "The `Date` Object", "md": "### Why this matters\n\nDates and times show up constantly in real programs — timestamps, scheduling, formatting for display — and JavaScript's `Date` object has a genuinely notorious reputation for surprising behavior. This chapter covers it carefully, verifying its real, exact behaviors rather than assuming anything about it.\n\n### The core idea\n\n`new Date()` creates an object representing a single moment in time, stored internally as a timestamp (milliseconds since January 1, 1970 UTC — the \"Unix epoch\"). `Date` provides both local-time methods (`getFullYear`, `getMonth`, `getDate`, matching whatever timezone the code is running in) and UTC-equivalent methods (`getUTCFullYear`, etc.) for when timezone-independence actually matters.\n\n### Examples\n\n**1. Creating a specific date — and the real, infamous zero-indexed month.**\n```js\nconst d1 = new Date(2024, 0, 15);\nconsole.log(d1.getFullYear(), d1.getMonth(), d1.getDate());\nconsole.log(d1.toISOString().slice(0, 10));\n```\nOutput:\n```\n2024 0 15\n2024-01-15\n```\n`new Date(year, month, day)` uses a **zero-indexed month** — `0` means January, `11` means December. `d1.getMonth()` correctly returns `0` for a date constructed as January, which is genuinely one of the most common `Date`-related bugs: forgetting this and off-by-one-ing every month calculation.\n\n**2. Confirming the zero-indexing at both ends of the year.**\n```js\nconst jan = new Date(2024, 0, 1);\nconst dec = new Date(2024, 11, 1);\nconsole.log(jan.getMonth(), dec.getMonth());\n```\nOutput:\n```\n0 11\n```\nJanuary is `0`, December is `11` — genuinely 0 through 11, never 1 through 12, for both construction and `getMonth()`.\n\n**3. Parsing an ISO date string — and its UTC-based interpretation.**\n```js\nconst d2 = new Date(\"2024-06-15\");\nconsole.log(d2.getUTCFullYear(), d2.getUTCMonth(), d2.getUTCDate());\n```\nOutput:\n```\n2024 5 15\n```\nA bare `\"YYYY-MM-DD\"` string is parsed as **midnight UTC** on that date — genuinely different from the two-argument `new Date(year, month, day)` constructor (Example 1), which uses the *local* timezone instead. Mixing these two construction styles carelessly is a real, common source of off-by-one-day bugs, particularly for anyone west of UTC, where local midnight and UTC midnight fall on different calendar days.\n\n**4. An invalid date — a real, specific `NaN`-based value, not an exception.**\n```js\nconst bad = new Date(\"not a real date\");\nconsole.log(bad.getTime());\nconsole.log(isNaN(bad.getTime()));\nconsole.log(bad.toString());\n```\nOutput:\n```\nNaN\ntrue\nInvalid Date\n```\n`new Date()` never throws for an unparseable string — it silently produces a `Date` object whose internal timestamp is `NaN`. `isNaN(date.getTime())` is the real, standard way to check whether a `Date` is actually valid; `.toString()` on an invalid date literally returns the string `\"Invalid Date\"`.\n\n**5. Timestamps — `Date.now()` and `.getTime()`, both plain numbers, enabling real date arithmetic.**\n```js\nconst oneDayMs = 24 * 60 * 60 * 1000;\nconst tomorrow = new Date(d1.getTime() + oneDayMs);\nconsole.log(tomorrow.getDate());\n```\nOutput:\n```\n16\n```\n`.getTime()` returns the date's underlying millisecond timestamp as a plain number — ordinary arithmetic (adding milliseconds for a day) then works correctly, and `new Date(timestamp)` converts back into a `Date` object. `Date.now()` returns the *current* timestamp directly, without needing to construct a `Date` object first.\n\n**6. Date arithmetic that overflows a field auto-normalizes into the next one.**\n```js\nconst overflowDate = new Date(2024, 0, 32);\nconsole.log(overflowDate.getMonth(), overflowDate.getDate());\n```\nOutput:\n```\n1 1\n```\nJanuary only has 31 days, so `new Date(2024, 0, 32)` doesn't throw or clamp — it rolls over into `getMonth() === 1` (February) and `getDate() === 1`, exactly as if you'd counted 32 days forward from January 1st. This auto-normalizing behavior is genuinely useful for date arithmetic (adding days without worrying about month boundaries), but surprising if encountered by accident from a typo.\n\n**7. `getDay()` — the day of the week, also zero-indexed, starting from Sunday.**\n```js\nconsole.log(new Date(2024, 0, 15).getDay());\n```\nOutput:\n```\n1\n```\n`getDay()` returns `0` for Sunday through `6` for Saturday — January 15, 2024 was a Monday, confirmed here as `1`. This is a genuinely separate zero-indexed scale from `getMonth()`'s — worth not confusing the two.\n\n**8. Comparing dates — `<`/`>` work directly, but `===` never does, exactly like objects generally.**\n```js\nconst dA = new Date(2024, 0, 1);\nconst dB = new Date(2024, 0, 2);\nconsole.log(dA < dB);\nconst dA2 = new Date(2024, 0, 1);\nconsole.log(dA === dA2);\nconsole.log(dA.getTime() === dA2.getTime());\n```\nOutput:\n```\ntrue\nfalse\ntrue\n```\n`<` and `>` work correctly on `Date` objects directly, because comparison operators (unlike `===`) coerce both sides to their underlying numeric timestamp. `===` compares object identity (Chapter 2.7), not the moment in time each represents — two separately-constructed `Date`s representing the exact same instant are still `===`-unequal, exactly like two separately-constructed objects with identical content. Comparing `.getTime()` values directly is the real, correct way to check whether two dates represent the same moment.\n\n**9. Locale-aware formatting with `toLocaleDateString`.**\n```js\nconsole.log(d1.toLocaleDateString(\"en-US\"));\n```\nOutput:\n```\n1/15/2024\n```\n`toLocaleDateString` (and its relatives, `toLocaleTimeString`/`toLocaleString`) format a date according to a given locale's conventions — genuinely useful for displaying dates to users without hand-building the format string yourself.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `getMonth()`/the month constructor argument are zero-indexed.** As Examples 1 and 2 showed, this is genuinely one of the most common `Date`-related bugs — always double-check whether a month value needs a `+1` or `-1` adjustment at the boundary between `Date` and human-readable output.\n- **Mixing local-time construction (`new Date(year, month, day)`) with UTC-based ISO string parsing (`new Date(\"YYYY-MM-DD\")`) and expecting consistent results.** As Example 3 showed, these interpret the same calendar date differently depending on the local timezone — a real, common source of off-by-one-day bugs.\n- **Using `===` to check whether two `Date`s represent the same moment.** As Example 8 showed, this compares object identity, not time — compare `.getTime()` values instead.\n- **Assuming `new Date(\"invalid string\")` throws an error.** As Example 4 showed, it silently produces an `Invalid Date` object instead — always validate with `isNaN(date.getTime())` rather than wrapping construction in `try`/`catch`.\n\n### How this connects\n\nChapter 7.3 (Regular Expressions) is the next major built-in tool this book covers — useful, among other things, for validating date-like strings before ever handing them to `new Date()`. Chapter 7.4 (Working with JSON) is where `Date` objects run into a real, specific serialization quirk worth knowing about directly.\n\n### Quick recap\n\n- `new Date(year, month, day)` uses local time and a **zero-indexed month** (`0` = January); a bare ISO date string is parsed as UTC midnight instead — mixing the two causes real off-by-one-day bugs.\n- An invalid date is a real object with `NaN` as its timestamp, not a thrown error — check validity with `isNaN(date.getTime())`.\n- `.getTime()`/`Date.now()` give a plain-number timestamp, enabling ordinary arithmetic; date fields overflow and auto-normalize (day 32 becomes the next month's day 1) rather than erroring.\n- `<`/`>` compare `Date`s correctly via their timestamp; `===` compares object identity, never the represented moment — use `.getTime()` for genuine equality checks."}, {"id": "7.3", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 3, "slug": "regular-expressions", "fullTitle": "Regular Expressions", "title": "Regular Expressions", "md": "### Why this matters\n\nString methods like `.includes()` and `.replace()` (Chapter 2.2) handle exact, literal text — but real validation and text-processing tasks (an email format, extracting all numbers from a string, splitting on flexible whitespace) need to describe *patterns*, not exact text. Regular expressions are that pattern language, built directly into JavaScript.\n\n### The core idea\n\nA regular expression (`/pattern/flags`) describes a pattern to search for within a string. `.test()` checks whether a pattern matches at all (returning `true`/`false`); `.match()`, `.matchAll()`, `.replace()`, `.replaceAll()`, and `.split()` (all String methods) accept a regular expression to search, extract, or transform text using that pattern instead of an exact substring.\n\n### Examples\n\n**1. Basic matching — `.test()` and `.match()`.**\n```js\nconst re = /\\d+/;\nconsole.log(re.test(\"abc123\"));\nconsole.log(re.test(\"abcdef\"));\nconsole.log(\"abc123def456\".match(re));\n```\nOutput:\n```\ntrue\nfalse\n[ '123', index: 3, input: 'abc123def456', groups: undefined ]\n```\n`\\d+` matches one or more digits. `.test()` returns a plain boolean; `.match()` (without the global flag) returns a real, detailed result object — the matched text (`'123'`), where it was found (`index: 3`), the full original string, and any named groups (`undefined` here, since none were used).\n\n**2. The global flag (`g`) — completely changes `.match()`'s return shape.**\n```js\nconst reGlobal = /\\d+/g;\nconsole.log(\"abc123def456\".match(reGlobal));\n```\nOutput:\n```\n[ '123', '456' ]\n```\nWith `g`, `.match()` returns a plain array of *every* match's text, with none of Example 1's extra detail (position, groups) — a genuinely different, simpler shape depending on whether `g` is present, worth knowing precisely rather than assuming consistency.\n\n**3. Named capture groups — extracting specific pieces with real names, not just positions.**\n```js\nconst dateRe = /(?<year>\\d{4})-(?<month>\\d{2})-(?<day>\\d{2})/;\nconst m = \"2024-06-15\".match(dateRe);\nconsole.log(m.groups.year, m.groups.month, m.groups.day);\n```\nOutput:\n```\n2024 06 15\n```\n`(?<name>...)` (ES2018) captures a piece of the match under a real, readable name, accessible as `m.groups.name` — genuinely clearer than numbered groups (`m[1]`, `m[2]`) once a pattern has more than one or two captures.\n\n**4. Using named groups directly in a replacement string.**\n```js\nconsole.log(\"2024-06-15\".replace(dateRe, \"$<month>/$<day>/$<year>\"));\n```\nOutput:\n```\n06/15/2024\n```\n`$<name>` inside a replacement string refers to a named capture group's matched text — a real, concise way to rearrange or reformat matched text without manually re-extracting each piece first.\n\n**5. `.replaceAll()` genuinely requires the global flag on a regex argument — a real, deliberate `TypeError` otherwise.**\n```js\ntry {\n  \"a.b.c\".replaceAll(/\\./, \"-\");\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\nconsole.log(\"a.b.c\".replaceAll(/\\./g, \"-\"));\nconsole.log(\"a.b.c\".replaceAll(\".\", \"-\"));\n```\nOutput:\n```\nTypeError String.prototype.replaceAll called with a non-global RegExp argument\na-b-c\na-b-c\n```\n`.replaceAll()` with a non-global regex throws immediately, rather than silently replacing only the first match (which would make it behave exactly like `.replace()`, defeating its own purpose) — this is a real, deliberate safety check. A plain string argument (the third call) doesn't have this restriction at all, since there's no \"global\" concept for a literal string match.\n\n**6. A genuine, real gotcha: a global regex's `.test()` is *stateful*, via its own `.lastIndex` property.**\n```js\nconst statefulRe = /\\d/g;\nconsole.log(statefulRe.test(\"1a2b\"));\nconsole.log(statefulRe.lastIndex);\nconsole.log(statefulRe.test(\"1a2b\"));\nconsole.log(statefulRe.lastIndex);\nconsole.log(statefulRe.test(\"1a2b\"));\nconsole.log(statefulRe.lastIndex);\n```\nOutput:\n```\ntrue\n1\ntrue\n3\nfalse\n0\n```\nA regex literal with the `g` flag remembers where its *last* match ended, in its own `.lastIndex` property — each subsequent `.test()` call on the *same regex object* resumes searching from there, not from the start of the string again. The third call returns `false` specifically because it started searching from index `3` (after the second digit `2`) and found no more digits before the string ended — and failing a match automatically resets `.lastIndex` back to `0`. Reusing the same global-flagged regex object across multiple, unrelated `.test()` calls is a real, common source of confusing, order-dependent bugs.\n\n**7. `.split()` with a regex — flexible delimiters a plain string separator can't express.**\n```js\nconsole.log(\"one, two,  three\".split(/,\\s*/));\n```\nOutput:\n```\n[ 'one', 'two', 'three' ]\n```\n`\\s*` matches zero or more whitespace characters — this correctly splits on a comma followed by *any amount* of following space (including none), something a fixed string separator like `\", \"` couldn't handle consistently across inconsistent input spacing.\n\n**8. Iterating every match — the older `.exec()` loop pattern, and the modern `.matchAll()` replacement.**\n```js\nconst iterRe = /\\d+/g;\nconst str = \"a1 b22 c333\";\nlet match;\nconst results = [];\nwhile ((match = iterRe.exec(str)) !== null) {\n  results.push(match[0]);\n}\nconsole.log(results);\n\nconsole.log([...str.matchAll(/\\d+/g)].map(m => m[0]));\n```\nOutput:\n```\n[ '1', '22', '333' ]\n[ '1', '22', '333' ]\n```\n`.exec()` on a global regex, called repeatedly, relies on the exact same `.lastIndex`-advancing statefulness from Example 6 to walk through every match one at a time, returning `null` once exhausted. `.matchAll()` (ES2018) does the identical job as a genuine iterable (Chapter 5.10) — spreading it directly into an array is the modern, preferred way to get every match's full detail without manually managing a loop and `.lastIndex` at all.\n\n**9. A real, practical validation pattern — and confirming `.` needs escaping to match a literal dot.**\n```js\nconsole.log(/\\./.test(\"3.14\"));\nconsole.log(/./.test(\"3x14\"));\nconst emailLike = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\nconsole.log(emailLike.test(\"user@example.com\"));\nconsole.log(emailLike.test(\"not an email\"));\n```\nOutput:\n```\ntrue\ntrue\ntrue\nfalse\n```\n`\\.` matches a literal dot; a bare `.` (unescaped) is a wildcard matching *any* single character — confirmed here matching `\"3x14\"` too, since the `x` satisfies the wildcard. `emailLike` is a genuinely simplified pattern (`^`/`$` anchor the whole string, `[^\\s@]+` means \"one or more characters that aren't whitespace or `@`\") — real email validation is considerably more complex than this, but a pattern like this is a common, reasonable first-pass check.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `.` is a wildcard, not a literal dot**, in a pattern meant to match an actual period — `\\.` is required for that, as Example 9 showed.\n- **Reusing a global-flagged regex object across multiple, separate `.test()`/`.exec()` calls without accounting for `.lastIndex`.** As Example 6 showed directly, this produces real, order-dependent, confusing results — create a fresh regex literal for each independent check, or reset `.lastIndex = 0` explicitly if reuse is intentional.\n- **Passing a non-global regex to `.replaceAll()`.** As Example 5 showed, this throws a real, immediate `TypeError` rather than silently behaving like `.replace()`.\n- **Assuming `.match()`'s return shape is consistent regardless of the global flag.** As Examples 1 and 2 showed, it's genuinely different — a detailed single-match object without `g`, a plain array of match strings with it.\n\n### How this connects\n\nChapter 7.4 (Working with JSON) is the next practical, built-in tool this book covers — regular expressions and JSON parsing are frequently used together in real text-processing code (validating a string's shape before attempting to parse it, for instance).\n\n### Quick recap\n\n- `.test()` returns a boolean; `.match()`'s return shape depends entirely on whether the global flag is set — a detailed object without it, a plain array of matched strings with it.\n- Named capture groups (`(?<name>...)`) are accessible as `m.groups.name`, and usable directly in a replacement string as `$<name>`.\n- `.replaceAll()` requires a global-flagged regex argument, or throws a real `TypeError`.\n- A global-flagged regex is stateful via its own `.lastIndex` — reusing the same object across separate calls can produce confusing, order-dependent results.\n- `.matchAll()` is the modern, preferred way to iterate every match, replacing the older manual `.exec()`-in-a-loop pattern."}, {"id": "7.4", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 4, "slug": "working-with-json", "fullTitle": "Working with JSON", "title": "Working with JSON", "md": "### Why this matters\n\nJSON (JavaScript Object Notation) is the standard data format for APIs, config files, and data storage — genuinely everywhere in real programs. Chapter 6.1 already used `JSON.parse`'s errors as a `try`/`catch` example; this chapter covers the full picture, including several real, exact behaviors around what JSON simply cannot represent.\n\n### The core idea\n\n`JSON.stringify(value)` converts a JavaScript value into a JSON-formatted string; `JSON.parse(text)` does the reverse. JSON's data model is deliberately smaller than JavaScript's — it has objects, arrays, strings, numbers, booleans, and `null`, and genuinely nothing else, so converting a JavaScript value to JSON and back is not always a perfect round trip.\n\n### Examples\n\n**1. A basic round trip — and confirming it produces a genuinely new, separate object.**\n```js\nconst obj = { name: \"Ada\", age: 36, active: true, tags: [\"math\", \"computing\"] };\nconst json = JSON.stringify(obj);\nconsole.log(json);\nconst parsed = JSON.parse(json);\nconsole.log(parsed.name === obj.name);\nconsole.log(parsed === obj);\n```\nOutput:\n```\n{\"name\":\"Ada\",\"age\":36,\"active\":true,\"tags\":[\"math\",\"computing\"]}\ntrue\nfalse\n```\n`parsed` has equal *content* to `obj`, but is a completely separate object (Chapter 2.7's reference-equality rules) — `JSON.parse(JSON.stringify(x))` is, in fact, a genuinely common (if slightly heavyweight) real technique for deep-cloning a JSON-safe value, distinct from `structuredClone()` (Chapter 2.9).\n\n**2. Pretty-printing with the third argument — indentation for human-readable output.**\n```js\nconsole.log(JSON.stringify(obj, null, 2));\n```\nOutput:\n```\n{\n  \"name\": \"Ada\",\n  \"age\": 36,\n  \"active\": true,\n  \"tags\": [\n    \"math\",\n    \"computing\"\n  ]\n}\n```\nThe third argument to `JSON.stringify` sets an indentation width (here, 2 spaces) — genuinely useful for config files, logs, or debug output meant to be read by a person, rather than the compact single-line form Example 1 produced.\n\n**3. Values JSON simply cannot represent are silently dropped, not errored on.**\n```js\nconst weird = { fn: function() {}, undef: undefined, sym: Symbol(\"x\"), num: 42 };\nconsole.log(JSON.stringify(weird));\n```\nOutput:\n```\n{\"num\":42}\n```\nFunctions, `undefined`, and `Symbol` values are all genuinely unrepresentable in JSON — as object *properties*, `JSON.stringify` simply omits them entirely, rather than throwing or including some placeholder. Only `num: 42`, a genuinely JSON-safe value, survives.\n\n**4. The same values, inside an array, behave differently — `undefined` becomes `null` instead of being omitted.**\n```js\nconsole.log(JSON.stringify([1, undefined, 3]));\n```\nOutput:\n```\n[1,null,3]\n```\nArrays have a fixed length and fixed positions — omitting an unrepresentable element entirely would shift every later element's index, which `JSON.stringify` avoids by substituting `null` instead. This is a real, easy-to-miss distinction: the exact same `undefined` value is dropped as an object property (Example 3) but preserved as `null` inside an array.\n\n**5. `NaN` and `Infinity` also become `null` — JSON has no way to represent them at all.**\n```js\nconsole.log(JSON.stringify({ a: NaN, b: Infinity, c: -Infinity }));\n```\nOutput:\n```\n{\"a\":null,\"b\":null,\"c\":null}\n```\nJSON's number type has no representation for `NaN` or either infinity (Chapter 2.4) — all three silently become `null`, a real, specific behavior worth confirming rather than assuming an error would be thrown.\n\n**6. `Date` objects serialize automatically via `.toISOString()` — but don't automatically revive back.**\n```js\nconst withDate = { created: new Date(2024, 0, 15) };\nconsole.log(JSON.stringify(withDate));\nconst revived = JSON.parse(JSON.stringify(withDate));\nconsole.log(typeof revived.created);\nconsole.log(revived.created instanceof Date);\n```\nOutput (this book's reference timezone, UTC):\n```\n{\"created\":\"2024-01-15T00:00:00.000Z\"}\nstring\nfalse\n```\n`JSON.stringify` automatically calls a `Date` object's `.toISOString()` (Chapter 7.2) to convert it into a JSON-safe string — but the exact string genuinely depends on the local timezone the code runs in, since `.toISOString()` always converts to UTC first. `JSON.parse` never automatically converts a string back into a `Date` — `revived.created` comes back as a plain string, not a `Date` object, unless a reviver function (Example 7) is used explicitly.\n\n**7. A reviver function — customizing exactly how `JSON.parse` reconstructs specific values.**\n```js\nconst withDateReviver = JSON.parse(JSON.stringify(withDate), (key, value) => {\n  if (key === \"created\") return new Date(value);\n  return value;\n});\nconsole.log(withDateReviver.created instanceof Date);\n```\nOutput:\n```\ntrue\n```\n`JSON.parse`'s optional second argument is called once per key-value pair as parsing happens, letting you convert specific values (like an ISO date string back into a real `Date`) as part of the parse itself, rather than as a separate manual pass afterward.\n\n**8. A replacer function or array — controlling exactly what `JSON.stringify` includes.**\n```js\nconst full = { a: 1, b: 2, c: 3 };\nconsole.log(JSON.stringify(full, [\"a\", \"c\"]));\nconsole.log(JSON.stringify(full, (key, value) => key === \"b\" ? undefined : value));\n```\nOutput:\n```\n{\"a\":1,\"c\":3}\n{\"a\":1,\"c\":3}\n```\nAn array as the second argument acts as an explicit allow-list of keys to include; a function receives every key-value pair and can return `undefined` to omit a specific one (exactly mirroring how `undefined` is dropped from an object in Example 3) — two different ways to reach the same filtered result.\n\n**9. Malformed JSON throws a real, specific `SyntaxError` — JSON's syntax is genuinely stricter than JavaScript's own object literals.**\n```js\ntry {\n  JSON.parse(\"{a: 1}\");\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\ntry {\n  JSON.parse('{\"a\": 1,}');\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nSyntaxError Expected property name or '}' in JSON at position 1 (line 1 column 2)\nSyntaxError Expected double-quoted property name in JSON at position 8 (line 1 column 9)\n```\nUnlike a JavaScript object literal, JSON requires every key to be double-quoted, and does not allow a trailing comma after the last property — both genuinely common mistakes when hand-writing JSON, each caught with a specific, precise error message.\n\n**10. A circular reference throws a real, specific `TypeError`, not a silent infinite loop.**\n```js\nconst circular = {};\ncircular.self = circular;\ntry {\n  JSON.stringify(circular);\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nTypeError Converting circular structure to JSON\n    --> starting at object with constructor 'Object'\n    --- property 'self' closes the circle\n```\n`circular.self` points back at `circular` itself — `JSON.stringify` would otherwise recurse forever trying to serialize it, so it detects the cycle and throws immediately instead. The message is genuinely this detailed by default — not just naming the problem in general, but pointing at exactly which object and which property closes the cycle, real, practical help for tracking down a circular reference buried somewhere in a larger, more complex structure.\n\n**11. `.toJSON()` — an object can customize its own serialization completely.**\n```js\nclass Money {\n  constructor(cents) {\n    this.cents = cents;\n  }\n  toJSON() {\n    return `$${(this.cents / 100).toFixed(2)}`;\n  }\n}\nconsole.log(JSON.stringify({ price: new Money(1999) }));\n```\nOutput:\n```\n{\"price\":\"$19.99\"}\n```\nIf a value has a `.toJSON()` method, `JSON.stringify` calls it and serializes *its* return value instead of the object's own properties — this is precisely the same mechanism that makes `Date` (Example 6) serialize as an ISO string: `Date.prototype` has its own built-in `.toJSON()` that calls `.toISOString()` internally.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `undefined` is handled the same way in objects and arrays.** As Examples 3 and 4 showed, it's genuinely omitted as an object property, but becomes `null` inside an array — a real, easy-to-miss distinction.\n- **Expecting `JSON.parse` to automatically restore `Date` objects, functions, or any other non-JSON-native type.** As Example 6 showed, everything comes back as plain strings, numbers, booleans, `null`, objects, or arrays — a reviver function (Example 7) is required for anything more specific.\n- **Hand-writing JSON with unquoted keys or a trailing comma**, both valid in a JavaScript object literal but genuinely invalid JSON — as Example 9 showed, both throw a real, specific `SyntaxError`.\n- **Serializing an object with a circular reference without expecting it to fail.** As Example 10 showed, this throws immediately with a clear message — restructuring the data (removing the cycle, or using a custom `.toJSON()`) is the real fix.\n\n### How this connects\n\nChapter 7.8 (`fetch` & Working with APIs) uses `JSON.parse`/`JSON.stringify` constantly, for genuinely real request and response bodies rather than this chapter's constructed examples. Chapter 7.2's `Date` object is the source of Example 6 and 11's serialization behavior, worth reviewing together.\n\n### Quick recap\n\n- `JSON.stringify`/`JSON.parse` convert between JavaScript values and JSON text — but JSON's data model is smaller, so the round trip isn't always perfect.\n- Functions, `undefined`, and `Symbol` are dropped as object properties, but `undefined` becomes `null` inside an array; `NaN` and `Infinity` also become `null`.\n- `Date` objects serialize automatically via their own `.toJSON()` method (calling `.toISOString()`), but never automatically revive back — use a reviver function for that.\n- A replacer (array or function) controls exactly what `JSON.stringify` includes; a reviver function controls exactly how `JSON.parse` reconstructs specific values.\n- Malformed JSON and circular references both throw real, specific errors, naming the exact problem — never a silent failure or infinite loop."}, {"id": "7.5", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 5, "slug": "file-io-with-nodes-fs-module", "fullTitle": "File I/O with Node's `fs` Module", "title": "File I/O with Node's `fs` Module", "md": "### Why this matters\n\nEverything so far has lived in memory, disappearing the moment a program ends. Real programs read configuration, write output, and process data stored on disk — Node's built-in `fs` (\"file system\") module is how, and it comes in three genuinely different styles, all doing the same underlying job.\n\n### The core idea\n\n`fs` offers the same operations three ways: **synchronous** (`fs.readFileSync`, blocking until done, simplest to reason about), **callback-based** (`fs.readFile`, Chapter 5.7's error-first convention), and **Promise-based** (`fs/promises`, pairing naturally with `async`/`await`, Chapter 5.9). Real, modern code almost always reaches for the Promise-based version, but recognizing all three matters for reading existing code.\n\n### Examples\n\n**1. Synchronous write and read — the simplest form.**\n```js\nconst fs = require(\"fs\");\nfs.writeFileSync(\"test.txt\", \"Hello, file system!\");\nconst content = fs.readFileSync(\"test.txt\", \"utf8\");\nconsole.log(content);\n```\nOutput:\n```\nHello, file system!\n```\nThe `Sync` suffix on both function names is a real, deliberate naming convention — every blocking `fs` function has it, making it visually obvious in code review that a call will block the entire thread (Chapter 5.6) until it finishes.\n\n**2. Without an encoding, `readFileSync` returns a raw `Buffer`, not a string.**\n```js\nconst buf = fs.readFileSync(\"test.txt\");\nconsole.log(Buffer.isBuffer(buf));\nconsole.log(buf.toString(\"utf8\"));\n```\nOutput:\n```\ntrue\nHello, file system!\n```\nA `Buffer` is Node's representation of raw binary data — genuinely correct for reading an image or other non-text file, but a common early mistake when reading text and forgetting to pass `\"utf8\"` as the encoding (or call `.toString()` afterward), leading to a `Buffer` object printed instead of readable text.\n\n**3. The callback-based API — Chapter 5.7's error-first convention, applied to a real, built-in module.**\n```js\nfs.readFile(\"test.txt\", \"utf8\", (err, data) => {\n  if (err) {\n    console.log(\"error:\", err.message);\n    return;\n  }\n  console.log(\"callback read:\", data);\n});\n```\nOutput:\n```\ncallback read: Hello, file system!\n```\nThis is the exact `callback(err, data)` shape Chapter 5.7 introduced in the abstract — `fs`'s callback API is genuinely where that convention is used constantly in real Node code.\n\n**4. The modern, Promise-based API — pairs naturally with `async`/`await`.**\n```js\nconst fsPromises = require(\"fs/promises\");\nasync function main() {\n  const data = await fsPromises.readFile(\"test.txt\", \"utf8\");\n  console.log(\"promise read:\", data);\n\n  await fsPromises.appendFile(\"test.txt\", \" Appended text.\");\n  const updated = await fsPromises.readFile(\"test.txt\", \"utf8\");\n  console.log(\"after append:\", updated);\n}\nmain();\n```\nOutput:\n```\npromise read: Hello, file system!\nafter append: Hello, file system! Appended text.\n```\n`fs/promises` exposes the identical set of operations as the callback API, each returning a Promise instead of taking a callback — genuinely the recommended style for new code, letting file operations read like ordinary sequential code (Chapter 5.9) with real `try`/`catch` error handling.\n\n**5. Reading a non-existent file — a real, specific error, checkable by its `.code` property.**\n```js\ntry {\n  await fsPromises.readFile(\"does-not-exist.txt\", \"utf8\");\n} catch (e) {\n  console.log(e.constructor.name, e.code, e.message);\n}\n```\nOutput:\n```\nError ENOENT ENOENT: no such file or directory, open 'does-not-exist.txt'\n```\nThe thrown object is a plain `Error` (not a distinct subclass), but Node attaches a real, standard `.code` property — `\"ENOENT\"` here, a Unix-derived code meaning \"no such file or directory.\" Checking `.code` (rather than parsing `.message` text) is the standard, reliable way to distinguish specific failure reasons in real code.\n\n**6. Checking a file's metadata with `.stat()` — including whether it exists at all.**\n```js\nconst stats = await fsPromises.stat(\"test.txt\");\nconsole.log(\"isFile:\", stats.isFile(), \"size:\", stats.size > 0);\n```\nOutput:\n```\nisFile: true size: true\n```\n`.stat()` returns real metadata about a file — its size in bytes, whether it's a regular file (`.isFile()`) versus a directory (`.isDirectory()`), and more. There's no dedicated `fs.exists()` in the modern Promise API at all; the idiomatic way to check existence is attempting an operation like `.stat()` and catching the `ENOENT` error (Example 5) if it fails.\n\n**7. Directory operations — creating, listing, and cleaning up.**\n```js\nawait fsPromises.mkdir(\"subdir\", { recursive: true });\nawait fsPromises.writeFile(\"subdir/nested.txt\", \"nested content\");\nconst entries = await fsPromises.readdir(\".\");\nconsole.log(entries.sort());\n```\nOutput:\n```\n[ 'main.js', 'subdir', 'test.txt' ]\n```\n`{ recursive: true }` on `.mkdir()` creates any missing parent directories too, and doesn't throw if the directory already exists — genuinely convenient compared to checking first. `.readdir()` lists a directory's immediate contents by name, not recursively.\n\n**8. Cleaning up — removing files and (empty) directories.**\n```js\nawait fsPromises.unlink(\"test.txt\");\nawait fsPromises.unlink(\"subdir/nested.txt\");\nawait fsPromises.rmdir(\"subdir\");\nconsole.log(\"cleanup done\");\n```\nOutput:\n```\ncleanup done\n```\n`.unlink()` deletes a file (the name comes from Unix's underlying system call, not from \"link\" in any web sense); `.rmdir()` removes a directory, but only once it's empty — a file inside it must be removed first, exactly as done here.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to specify an encoding when reading a text file**, getting back a `Buffer` object instead of a readable string, as Example 2 showed. Always pass `\"utf8\"` explicitly for text.\n- **Using the synchronous API inside code that otherwise needs to stay responsive** — `fs.readFileSync` genuinely blocks the entire thread (Chapter 5.6) until the read finishes, which is fine for a short startup script but a real problem inside a server handling multiple requests.\n- **Parsing an error's `.message` text to detect a specific failure reason**, instead of checking its `.code` property. As Example 5 showed, `.code` (like `\"ENOENT\"`) is the real, stable, standard way to distinguish error types.\n- **Assuming a dedicated `fs.exists()`-style function is the idiomatic way to check for a file.** As Example 6 noted, the modern Promise API has no such function — attempting the real operation and catching `ENOENT` is the standard pattern instead.\n\n### How this connects\n\nChapter 6.2's custom error classes (with `Error.cause`) are a natural fit for wrapping a raw `ENOENT` or similar `fs` error into a more meaningful, application-specific one. Chapter 7.11 (Building a Simple HTTP Server with Node) is the next chapter dealing with genuinely real I/O, extending these same async patterns to network requests instead of files.\n\n### Quick recap\n\n- `fs` offers synchronous (`...Sync`), callback-based, and Promise-based (`fs/promises`) versions of the same operations — modern code should generally prefer the Promise-based API with `async`/`await`.\n- Reading without an encoding returns a raw `Buffer`; pass `\"utf8\"` explicitly to get a string back.\n- A file-system error is a plain `Error` with a real, standard `.code` property (like `\"ENOENT\"`) — check `.code`, not `.message` text, to distinguish specific failure reasons.\n- There's no dedicated existence-check function in the modern API — attempt the operation (like `.stat()`) and catch the resulting error instead.\n- `.mkdir(path, { recursive: true })` creates missing parent directories automatically; `.rmdir()` requires a directory to be empty first."}, {"id": "7.6", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 6, "slug": "the-console-object-in-depth", "fullTitle": "The `console` Object In Depth", "title": "The `console` Object In Depth", "md": "### Why this matters\n\n`console.log` has appeared in nearly every example in this entire book — but `console` has a genuinely large set of other methods, several with real, practical uses well beyond basic logging: tabular data, timing, grouping, and a real, easy-to-miss distinction in *where* different methods actually send their output.\n\n### The core idea\n\n`console` provides several logging methods beyond `.log()`, each suited to a different purpose — `.error()`/`.warn()` for problems, `.table()` for structured data, `.group()` for visually nested output, `.time()`/`.timeEnd()` for quick performance checks — plus a real, important distinction: `.log()`/`.info()` write to **stdout**, while `.error()`/`.warn()` write to **stderr**, a genuinely different output stream.\n\n### Examples\n\n**1. The basic logging methods — visually similar, but not identical underneath.**\n```js\nconsole.log(\"regular log\");\nconsole.error(\"error message\");\nconsole.warn(\"warning message\");\nconsole.info(\"info message\");\n```\nOutput (all four lines, run together):\n```\nregular log\nerror message\nwarning message\ninfo message\n```\nAll four look the same in a typical terminal, since a terminal usually shows both streams interleaved — but they genuinely are not going to the same place, confirmed directly in Example 6.\n\n**2. `%s`/`%d`/`%o` format specifiers — an older but still-supported alternative to template literals.**\n```js\nconsole.log(\"Name: %s, Age: %d\", \"Ada\", 36);\nconsole.log(\"Object: %o\", { a: 1 });\n```\nOutput:\n```\nName: Ada, Age: 36\nObject: { a: 1 }\n```\n`%s` substitutes a string, `%d` a number, `%o` a generic object — each subsequent argument fills the next `%` placeholder in order. Template literals (Chapter 2.3) are the more modern, generally preferred way to build a formatted string, but these specifiers still work and appear often in existing code.\n\n**3. `console.table` — genuinely readable tabular output for an array of objects.**\n```js\nconsole.table([{ name: \"Ada\", age: 36 }, { name: \"Grace\", age: 45 }]);\n```\nOutput:\n```\n┌─────────┬─────────┬─────┐\n│ (index) │ name    │ age │\n├─────────┼─────────┼─────┤\n│ 0       │ 'Ada'   │ 36  │\n│ 1       │ 'Grace' │ 45  │\n└─────────┴─────────┴─────┘\n```\nEach array element becomes a row, each shared property name becomes a column — genuinely far more readable than the equivalent nested `console.log` output for any real dataset of similarly-shaped objects.\n\n**4. `console.group`/`.groupEnd` — visually indenting related, nested output.**\n```js\nconsole.group(\"Group 1\");\nconsole.log(\"inside group\");\nconsole.group(\"Nested group\");\nconsole.log(\"deeper inside\");\nconsole.groupEnd();\nconsole.log(\"back to group 1\");\nconsole.groupEnd();\nconsole.log(\"outside all groups\");\n```\nOutput:\n```\nGroup 1\n  inside group\n  Nested group\n    deeper inside\n  back to group 1\noutside all groups\n```\nEach `.group()` call increases the indentation level for everything logged afterward, until a matching `.groupEnd()` — genuinely useful for visually separating a complex operation's step-by-step output during debugging.\n\n**5. `console.time`/`.timeEnd` — a quick, built-in way to measure how long something takes.**\n```js\nconsole.time(\"loop\");\nlet sum = 0;\nfor (let i = 0; i < 1000000; i++) sum += i;\nconsole.timeEnd(\"loop\");\n```\nOutput:\n```\nloop: 1.807ms\n```\n`.time(label)` starts a named timer; `.timeEnd(label)` stops it and logs the elapsed duration directly — a genuinely convenient shortcut over manually subtracting two `Date.now()` calls (Chapter 7.2) for quick, informal performance checks. (The exact duration will vary by machine and run — Chapter 8.6 covers rigorous performance measurement properly.)\n\n**6. Confirming the real stream distinction — `.error`/`.warn` genuinely go to stderr, not stdout.**\n\nRunning the script normally (both streams shown together in a terminal) shows all four lines from Example 1. But redirecting only stderr away (`2>/dev/null`) and keeping stdout:\n```\nregular log\ninfo message\n```\n`error message` and `warning message` are genuinely absent — confirming directly that `.error()`/`.warn()` write to **stderr**, while `.log()`/`.info()` write to **stdout**. This matters in real, practical situations: piping a program's stdout into another tool, or redirecting it into a log file, won't capture error/warning output at all unless stderr is captured too.\n\n**7. `console.count` — a simple, built-in call counter.**\n```js\nconsole.count(\"call\");\nconsole.count(\"call\");\nconsole.count(\"call\");\n```\nOutput:\n```\ncall: 1\ncall: 2\ncall: 3\n```\nEach call with the same label increments a running count for that label — genuinely convenient for quickly checking how many times a particular line of code actually executes, without manually maintaining a counter variable.\n\n**8. `console.assert` — logs only when a condition is false, otherwise produces no output at all.**\n```js\nconsole.assert(1 === 1, \"this should not print\");\nconsole.assert(1 === 2, \"this SHOULD print - assertion failed\");\n```\nOutput:\n```\nAssertion failed: this SHOULD print - assertion failed\n```\nThe first call, with a true condition, produces nothing at all — only the second, failing call logs anything, prefixed automatically with `\"Assertion failed:\"`. This is genuinely different from `throw`ing on a failed assertion (Chapter 6.1) — `console.assert` never stops execution, it only logs.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `console.error`/`console.warn` behave identically to `console.log` in every context.** As Example 6 showed directly, they write to a genuinely different output stream (stderr) — code that captures or redirects only stdout will silently miss them entirely.\n- **Manually building a table-like structure with nested `console.log` calls** when `console.table` (Example 3) already does the job far more readably for an array of similarly-shaped objects.\n- **Forgetting `.group()` calls must be matched with `.groupEnd()`.** An unmatched `.group()` leaves every subsequent log line indented for the rest of the program's output, which can look like a bug elsewhere.\n- **Using `console.time`/`.timeEnd` results as a rigorous performance benchmark.** As Example 5 noted, a single run's timing is genuinely noisy and machine-dependent — real performance measurement (Chapter 8.6) requires more care than one quick timed run.\n\n### How this connects\n\nChapter 8.3 (Debugging JavaScript) covers `console` as one of several real debugging tools, alongside Node's actual debugger. Chapter 8.6 (Performance) revisits Example 5's timing approach properly, with the rigor a real performance measurement needs.\n\n### Quick recap\n\n- `console.log`/`.info` write to stdout; `console.error`/`.warn` write to stderr — a real, genuine difference that matters when output is redirected or piped.\n- `console.table` renders an array of similarly-shaped objects as a readable table; `console.group`/`.groupEnd` visually indent related, nested output.\n- `console.time`/`.timeEnd` give a quick, convenient duration measurement — useful for informal checks, not rigorous benchmarking.\n- `console.count` tracks how many times a labeled call site has run; `console.assert` logs only when its condition is false, never stopping execution."}, {"id": "7.7", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 7, "slug": "timers-settimeout-setinterval", "fullTitle": "Timers: `setTimeout` & `setInterval`", "title": "Timers: `setTimeout` & `setInterval`", "md": "### Why this matters\n\n`setTimeout` has appeared constantly since Chapter 4.6 as a simple way to defer code — Chapter 5.6 explained precisely *when* it actually runs. This chapter covers the API itself properly: passing arguments through, canceling a pending timer, repeating with `setInterval`, and a few real, concrete details about what these functions actually return.\n\n### The core idea\n\n`setTimeout(callback, delay, ...args)` schedules `callback` to run once, after at least `delay` milliseconds; `setInterval(callback, delay, ...args)` schedules it to run repeatedly, every `delay` milliseconds, until explicitly stopped. Both return an identifier — used with `clearTimeout`/`clearInterval` respectively to cancel a timer before it (or its next repetition) fires.\n\n### Examples\n\n**1. Basic `setTimeout` — confirming it never blocks the synchronous code around it.**\n```js\nconsole.log(\"start\");\nsetTimeout(() => console.log(\"after 100ms\"), 100);\nconsole.log(\"end (sync)\");\n```\nOutput:\n```\nstart\nend (sync)\nafter 100ms\n```\n`\"end (sync)\"` prints immediately, before the timeout callback ever runs — exactly Chapter 5.6's event-loop rule: the scheduled callback waits until all synchronous code (and every microtask) has finished, no matter how short its delay.\n\n**2. Extra arguments after the delay are passed through to the callback.**\n```js\nsetTimeout((a, b) => console.log(\"sum:\", a + b), 10, 3, 4);\n```\nOutput:\n```\nsum: 7\n```\nEverything after the delay argument (`3, 4` here) is forwarded directly as the callback's own arguments — a real, built-in alternative to wrapping the callback in a closure (Chapter 4.5) just to capture extra values.\n\n**3. `clearTimeout` cancels a pending timeout before it fires.**\n```js\nconst id = setTimeout(() => console.log(\"should never print\"), 50);\nclearTimeout(id);\n```\nOutput: *(nothing — confirmed by the callback never appearing anywhere in this script's full output)*\n\n`clearTimeout` takes the identifier `setTimeout` returned and cancels that specific timer — as long as it's called before the delay elapses, the callback simply never runs at all.\n\n**4. `setInterval` — repeating until explicitly stopped with `clearInterval`.**\n```js\nlet count = 0;\nconst intervalId = setInterval(() => {\n  count++;\n  console.log(\"interval tick\", count);\n  if (count >= 3) {\n    clearInterval(intervalId);\n    console.log(\"interval cleared\");\n  }\n}, 20);\n```\nOutput:\n```\ninterval tick 1\ninterval tick 2\ninterval tick 3\ninterval cleared\n```\n`setInterval` keeps calling its callback every 20ms indefinitely — genuinely forever, unless something calls `clearInterval` on its returned identifier, exactly as done here once `count` reaches 3. Forgetting this call is a real, common source of a program that never naturally exits, or of repeated work continuing long after it's no longer needed.\n\n**5. In Node, `setTimeout`/`setInterval` return a real `Timeout` object, not a plain number.**\n```js\nconsole.log(typeof id);\nconsole.log(id.constructor.name);\n```\nOutput:\n```\nobject\nTimeout\n```\nThis is a genuine, environment-specific detail: in a browser, `setTimeout` returns a plain number instead. Code intended to run in both environments should treat the return value as an opaque handle — passed only to `clearTimeout`/`clearInterval` — rather than relying on it being any particular type.\n\n**6. A zero-delay `setTimeout` still takes measurable, nonzero time — real, confirmed drift, not exactly `0`.**\n```js\nconst start = Date.now();\nsetTimeout(() => {\n  console.log(\"requested 0ms, actual elapsed:\", Date.now() - start, \"ms\");\n}, 0);\n```\nOutput:\n```\nrequested 0ms, actual elapsed: 1 ms\n```\nExactly as Chapter 5.6 explained, `0` means \"as soon as possible,\" never truly instant — confirmed directly here with a real, measured (if small) elapsed time, not a guaranteed exact `0`.\n\n**7. `.unref()` — a real, Node-specific way to let a pending timer not keep the process alive on its own.**\n```js\nconst unrefTimer = setTimeout(() => {}, 100000);\nconsole.log(typeof unrefTimer.unref);\nunrefTimer.unref();\n```\nOutput:\n```\nfunction\n```\nNode's `Timeout` object (Example 5) has a genuinely real `.unref()` method — calling it tells Node this particular timer shouldn't, by itself, prevent the process from exiting once everything else is done, even if the timer hasn't fired yet. This is a real, practical tool for background timers (like periodic cleanup) that shouldn't block a script from ending normally.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to call `clearInterval` once repeating is no longer needed.** As Example 4 showed, `setInterval` genuinely never stops on its own — an uncleared interval is a real, common source of a program that won't exit, or of wasted repeated work.\n- **Assuming `setTimeout(fn, 0)` runs in exactly zero time.** As Example 6 showed, real, measurable time always passes — \"as soon as possible,\" never instant.\n- **Relying on the specific type of value `setTimeout` returns**, rather than treating it as an opaque handle. As Example 5 showed, this genuinely differs between Node (`Timeout` object) and browsers (plain number).\n- **Passing arguments to a callback via an unnecessary wrapper closure** when `setTimeout`'s own extra arguments (Example 2) already do that job directly and more clearly.\n\n### How this connects\n\nChapter 5.6's event loop is the mechanism underlying every timer covered here — this chapter's `setTimeout`/`setInterval` are exactly the macrotask-producing functions that chapter's examples relied on. Chapter 7.11 (Building a Simple HTTP Server with Node) is where real, practical timers (like request timeouts) show up in genuinely realistic server code.\n\n### Quick recap\n\n- `setTimeout(callback, delay, ...args)` runs once, after at least `delay` ms; `setInterval` repeats every `delay` ms until `clearInterval` is called.\n- Extra arguments after the delay are passed through directly to the callback.\n- `clearTimeout`/`clearInterval` take the identifier the scheduling call returned, canceling a timer before it (or its next repetition) fires.\n- Node returns a `Timeout` object from these functions, not a plain number as browsers do — treat the return value as an opaque handle.\n- A zero-delay `setTimeout` still takes real, measurable (if small) time — never a guaranteed exact `0`.\n- `.unref()` (Node-specific) lets a pending timer avoid keeping the process alive on its own."}, {"id": "7.8", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 8, "slug": "fetch-working-with-apis", "fullTitle": "`fetch` & Working with APIs", "title": "`fetch` & Working with APIs", "md": "### Why this matters\n\nChapter 5.9's `async`/`await` and Chapter 7.4's JSON handling both exist for exactly this: making real network requests to real APIs. `fetch` (originally a browser API, built into Node itself since Node 18) is the standard, modern way to do it — and it has a few genuinely important, easy-to-miss behaviors around what actually counts as an error.\n\n### The core idea\n\n`fetch(url, options)` returns a Promise that resolves to a `Response` object once the server's headers arrive — genuinely important: **it resolves on any HTTP response at all**, including a 404 or a 500, and only *rejects* for something more fundamental going wrong (no network connection, a malformed URL). Reading the actual body (`.json()`, `.text()`) is a separate, further asynchronous step.\n\n### Examples\n\n**1. A basic GET request — verified against a real, public test API.**\n```js\nconst res = await fetch(\"https://jsonplaceholder.typicode.com/todos/1\");\nconsole.log(res.status, res.ok);\nconsole.log(res.headers.get(\"content-type\"));\nconst data = await res.json();\nconsole.log(data);\n```\nOutput:\n```\n200 true\napplication/json; charset=utf-8\n{ userId: 1, id: 1, title: 'delectus aut autem', completed: false }\n```\n`res.status` is the real numeric HTTP status code; `res.ok` is `true` for any status in the 200–299 range. `.headers.get(name)` reads a specific response header. `.json()` returns a *second* Promise — parsing the body as JSON (Chapter 7.4) — resolved separately from the initial `fetch()` call itself.\n\n**2. A genuine, important gotcha: `fetch` does *not* reject on an HTTP error status.**\n```js\nconst res404 = await fetch(\"https://jsonplaceholder.typicode.com/nonexistent-endpoint-xyz\");\nconsole.log(res404.status, res404.ok);\n```\nOutput:\n```\n404 false\n```\nNo error was thrown at all — `fetch`'s Promise resolved successfully, with a `Response` object whose `.status` happens to be `404` and whose `.ok` happens to be `false`. This is genuinely different from many other HTTP libraries, and a real, common source of bugs: code that wraps `fetch` in `try`/`catch` and assumes a caught error means \"request failed\" will completely miss a 404 or 500 unless it explicitly checks `res.ok` (or `res.status`) itself.\n\n**3. What genuinely *does* cause `fetch` to reject — a real network-level failure.**\n```js\ntry {\n  await fetch(\"https://this-domain-genuinely-does-not-exist-xyz123.com\");\n} catch (e) {\n  console.log(e.constructor.name, e.message.slice(0, 50));\n}\n```\nOutput:\n```\nTypeError fetch failed\n```\nA domain that can't be resolved at all is a genuine network failure, not an HTTP response — this is the actual condition `fetch`'s Promise rejects for, contrasted directly against Example 2's successful-but-unsuccessful 404.\n\n**4. A `POST` request with a JSON body — the `options` object's real shape.**\n```js\nconst postRes = await fetch(\"https://jsonplaceholder.typicode.com/posts\", {\n  method: \"POST\",\n  headers: { \"Content-Type\": \"application/json\" },\n  body: JSON.stringify({ title: \"test\", body: \"content\", userId: 1 }),\n});\nconsole.log(postRes.status);\nconst postData = await postRes.json();\nconsole.log(postData.title, typeof postData.id);\n```\nOutput:\n```\n201\ntest number\n```\n`method` defaults to `\"GET\"` if omitted; a `POST` (or `PUT`/`PATCH`/`DELETE`) needs it set explicitly. `body` must be a string (or similar) — `JSON.stringify` (Chapter 7.4) converts the request payload; the matching `\"Content-Type\": \"application/json\"` header tells the server how to interpret it. `201 Created` is the real, standard success status for a resource-creating `POST`; this particular test API echoes back the submitted data plus a newly assigned `id`.\n\n**5. Reading a response body as plain text instead of JSON.**\n```js\nconst textRes = await fetch(\"https://jsonplaceholder.typicode.com/todos/2\");\nconst text = await textRes.text();\nconsole.log(typeof text);\n```\nOutput:\n```\nstring\n```\n`.text()` is the right choice for a non-JSON response (HTML, plain text, CSV) — `.json()` would throw a real `SyntaxError` (Chapter 7.4) if the body genuinely isn't valid JSON.\n\n**6. A response body can only be read *once* — a real, exact `TypeError` on a second attempt.**\n```js\nconst onceRes = await fetch(\"https://jsonplaceholder.typicode.com/todos/3\");\nawait onceRes.json();\ntry {\n  await onceRes.json();\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nTypeError Body is unusable: Body has already been read\n```\nA `Response`'s body is a genuine stream, consumed once and only once — calling `.json()` (or `.text()`) a second time on the same response object throws this exact error. If a body's content is needed more than once, it must be read once and the resulting value reused, not re-fetched from the same `Response` object.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a caught error from `fetch` means the request \"failed\" in the everyday sense.** As Examples 2 and 3 showed directly, an HTTP error status (404, 500) resolves successfully — always check `res.ok` (or `res.status`) explicitly, and reserve `try`/`catch` for genuine network-level failures.\n- **Calling `.json()` (or `.text()`) more than once on the same `Response` object.** As Example 6 showed, this throws a real, specific `TypeError` — store the parsed result in a variable instead of re-reading the body.\n- **Forgetting to set `method` and the `Content-Type` header for a `POST`/`PUT` request.** As Example 4 showed, `method` defaults to `\"GET\"`, and a server generally needs the header to know how to interpret the `body` correctly.\n- **Passing a plain object as `body` instead of a JSON string.** `fetch` doesn't stringify it automatically — `JSON.stringify()` (Chapter 7.4) is required first.\n\n### How this connects\n\nChapter 7.4's JSON handling and Chapter 5.9's `async`/`await` both come together directly in every example here — this chapter is genuinely where those two chapters' techniques get used together, on real, live data. Chapter 7.11 (Building a Simple HTTP Server with Node) covers the *server* side of exactly this kind of request.\n\n### Quick recap\n\n- `fetch(url, options)` resolves once HTTP response headers arrive — including for error statuses like 404 or 500 — and rejects only for genuine network-level failures.\n- Always check `res.ok` (or `res.status`) explicitly; don't rely on `try`/`catch` alone to detect an unsuccessful request.\n- `.json()`/`.text()` read the response body as a separate asynchronous step, and each can only be called once per response.\n- A `POST`/`PUT` request needs `method` set explicitly, a `body` that's already a string (`JSON.stringify` for JSON), and typically a matching `Content-Type` header."}, {"id": "7.9", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 9, "slug": "the-dom-a-browser-preview", "fullTitle": "The DOM: A Browser Preview", "title": "The DOM: A Browser Preview", "md": "### Why this matters\n\nThis book, as its Environment note (`SYLLABUS.md`) states upfront, uses Node.js as its canonical verification environment throughout — genuinely the right choice for learning the language itself. But JavaScript's single most common real-world use is still manipulating web pages in a browser, through the **DOM** (Document Object Model). This chapter is a deliberately honest, bounded preview — enough to recognize and start working with real browser code, not a substitute for a dedicated front-end resource.\n\n### The core idea\n\nIn a browser, `document` represents the web page itself, and `window` represents the browser tab/window — both are real, global objects that simply don't exist in Node (`typeof document` in Node is `\"undefined\"`). The DOM represents a page's HTML as a tree of objects that JavaScript can read and modify directly — find an element, change its content, react to a user clicking it — and every browser exposes this exact same API, verified here using a real, headless browser rather than described from memory.\n\n### Examples\n\n**1. `document` and `window` genuinely only exist in a browser — confirmed directly.**\n```js\nconsole.log(typeof document);\nconsole.log(typeof window);\nconsole.log(window === globalThis);\n```\nOutput (run in a real browser):\n```\nobject\nobject\ntrue\n```\n`window` *is* the browser's `globalThis` (Chapter 4.6) — every global variable and function in browser JavaScript is actually a property of `window`. Node has no equivalent single global object representing \"the page,\" because there is no page.\n\n**2. Finding and modifying an element — `getElementById` and `.textContent`.**\n```js\nconst div = document.getElementById(\"app\");\ndiv.textContent = \"Hello from DOM\";\nconsole.log(div.textContent);\n\nconst p = document.createElement(\"p\");\np.textContent = \"A paragraph\";\ndiv.appendChild(p);\nconsole.log(div.innerHTML);\n```\nOutput:\n```\nHello from DOM\nHello from DOM<p>A paragraph</p>\n```\n`document.getElementById` finds a specific element by its `id` attribute; `.textContent` reads or sets an element's plain text content directly. `document.createElement` builds a brand-new element (not yet attached anywhere); `.appendChild` inserts it into the page — `div.innerHTML` afterward confirms the new `<p>` element is genuinely now part of the tree.\n\n**3. `querySelector`/`querySelectorAll` — finding elements with real CSS selector syntax.**\n```js\nconst btn = document.querySelector(\"#btn\");\nconst items = document.querySelectorAll(\".list li\");\nconsole.log(items.length);\nconsole.log(Array.isArray(items));\nconsole.log(typeof items.forEach);\n```\nOutput:\n```\n3\nfalse\nfunction\n```\n`querySelector` returns the *first* matching element (or `null` if none match); `querySelectorAll` returns *every* match, as a `NodeList` — genuinely not a real array (`Array.isArray` confirms `false`), though it does have `.forEach` (Chapter 2.6), similar to how `arguments` (Chapter 4.3) is array-*like* without being a true array.\n\n**4. Handling a click event — `addEventListener`, and what `event`/`this` mean inside the handler.**\n```js\nbtn.addEventListener(\"click\", function(event) {\n  console.log(event.type);\n  console.log(event.target === btn);\n  console.log(this === btn);\n});\nbtn.click();\n```\nOutput:\n```\nclick\ntrue\ntrue\n```\n`addEventListener` registers a callback to run whenever the named event occurs; the callback receives an `event` object describing what happened (`.type`, `.target`), and — for an ordinary `function` (not an arrow function, per Chapter 4.6's rules) — `this` is bound to the element the listener was attached to. `.click()` here triggers the event programmatically, purely to demonstrate the handler firing.\n\n**5. `.textContent` escapes content automatically; `.innerHTML` parses it as real HTML — a genuine, real security distinction.**\n```js\nconst div = document.createElement(\"div\");\ndiv.textContent = \"<script>alert(1)<\/script>\";\nconsole.log(div.innerHTML);\n\nconst div2 = document.createElement(\"div\");\ndiv2.innerHTML = \"<strong>bold</strong>\";\nconsole.log(div2.textContent);\n```\nOutput:\n```\n&lt;script&gt;alert(1)&lt;/script&gt;\nbold\n```\nSetting `.textContent` with script-like text stores it as genuinely inert, literal text — confirmed here, since reading `.innerHTML` back shows it HTML-escaped, not executable. Setting `.innerHTML`, by contrast, actually *parses* the string as real HTML — assigning `.innerHTML` from untrusted, unsanitized input (user-submitted text, for instance) is a real, classic security vulnerability (cross-site scripting), since it could just as easily contain a real, executing `<script>` tag. **Always prefer `.textContent` for plain text, and only use `.innerHTML` with content you trust completely.**\n\n**6. Styling and class manipulation.**\n```js\nbtn.style.color = \"red\";\nconsole.log(btn.style.color);\nbtn.classList.add(\"active\");\nconsole.log(btn.className);\nconsole.log(btn.classList.contains(\"active\"));\n```\nOutput:\n```\nred\nactive\ntrue\n```\n`.style` sets inline CSS properties directly (in camelCase for multi-word properties, like `backgroundColor`); `.classList` provides `.add()`, `.remove()`, `.toggle()`, and `.contains()` for managing an element's CSS classes without manually parsing or rebuilding the `class` attribute string yourself.\n\n### ⚠️ Common Mistakes\n\n- **Assigning untrusted, unsanitized content to `.innerHTML`.** As Example 5 showed, this genuinely executes as real HTML — a classic, real cross-site-scripting vulnerability. Use `.textContent` unless you specifically need to insert real markup from a source you trust.\n- **Treating a `NodeList` (from `querySelectorAll`) as a true array.** As Example 3 showed, `Array.isArray` is `false` — many array methods (like `.forEach`) do work, but others (like `.map`, directly) don't without first converting it (`Array.from`, Chapter 5.10) into a real array.\n- **Using an arrow function for an event listener that needs `this` to be the element itself.** As Example 4 relied on, only an ordinary `function` gets `this` bound to the element (Chapter 4.6's rules) — an arrow function would instead keep whatever `this` was in its enclosing scope.\n- **Assuming any DOM code shown here runs in Node.** As Example 1 confirmed, `document` and `window` simply don't exist outside a real browser (or a browser-emulating tool) — every example in this chapter was verified in an actual browser, specifically because Node cannot run any of it.\n\n### How this connects\n\nChapter 7.10 (Events & Event Handling) goes deeper into the event system this chapter only introduced — event bubbling, `preventDefault()`, and more. This chapter is deliberately the *only* place in this book relying on a real browser rather than Node — everything else continues using Node as the canonical, verified environment, per this book's own stated scope.\n\n### Quick recap\n\n- `document` and `window` exist only in a browser — `window` is the browser's `globalThis`.\n- `getElementById`/`querySelector`/`querySelectorAll` find elements; `.textContent`/`.innerHTML` read or set their content — but only `.textContent` is safe with untrusted input.\n- `querySelectorAll` returns a `NodeList` — array-like, with `.forEach`, but not a true array.\n- `addEventListener` registers event handlers; an ordinary `function` handler gets `this` bound to the element itself, unlike an arrow function.\n- `.style` and `.classList` are the standard ways to manipulate an element's appearance and CSS classes directly from JavaScript."}, {"id": "7.10", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the standard library, the DOM, and writing it well", "chapNum": 10, "slug": "events-event-handling", "fullTitle": "Events & Event Handling", "title": "Events & Event Handling", "md": "### Why this matters\n\nChapter 7.9 introduced `addEventListener` briefly. Real browser code depends on understanding events more deeply — how an event travels through nested elements, how to stop it, how to prevent a browser's own default behavior, and how to manage several listeners cleanly. This chapter, like 7.9, is verified in a real, headless browser.\n\n### The core idea\n\nWhen an event fires on an element, it doesn't just run listeners on that exact element — it **bubbles** upward through every ancestor element in the DOM tree, running any matching listeners along the way, unless something explicitly stops it. Separately, many events have a **default action** (following a link, submitting a form) that a listener can cancel with `.preventDefault()`.\n\n### Examples\n\n**1. Event bubbling — a click on a nested element also triggers a listener on its ancestor.**\n```html\n<div id=\"outer\">\n  <button id=\"inner\">Click me</button>\n</div>\n```\n```js\ndocument.getElementById(\"outer\").addEventListener(\"click\", () => console.log(\"outer clicked\"));\ndocument.getElementById(\"inner\").addEventListener(\"click\", () => console.log(\"inner clicked\"));\ndocument.getElementById(\"inner\").click();\n```\nOutput:\n```\ninner clicked\nouter clicked\n```\nClicking `#inner` runs `#inner`'s own listener first, then **bubbles up** to `#outer`, running its listener too — even though the click only physically happened on the button. This is genuinely how DOM events work by default: they travel from the target outward through every ancestor, not just to the exact element clicked.\n\n**2. `stopPropagation()` — genuinely stops the bubbling before it reaches an ancestor.**\n```js\ndocument.getElementById(\"inner\").addEventListener(\"click\", (e) => {\n  console.log(\"inner clicked, stopping propagation\");\n  e.stopPropagation();\n});\ndocument.getElementById(\"inner\").click();\n```\nOutput:\n```\ninner clicked\ninner clicked, stopping propagation\n```\n`#inner`'s *original* listener from Example 1 is still attached too — it never went anywhere — so it fires again first, producing the leading `inner clicked` line. The genuinely new behavior is what's absent: `#outer`'s listener (also still attached from Example 1) never runs for this click at all, confirmed directly by its absence here, contrasted against Example 1 where it did fire. `stopPropagation()` only stops an event from bubbling on to ancestor elements — it does nothing to stop other listeners already registered on the *same* element from also running (that's what the more aggressive `stopImmediatePropagation()` is for instead).\n\n**3. `preventDefault()` — canceling an event's built-in default browser behavior.**\n```js\nconst link = document.getElementById(\"link\");\nlink.addEventListener(\"click\", (e) => {\n  e.preventDefault();\n  console.log(\"default prevented, defaultPrevented:\", e.defaultPrevented);\n});\nlink.click();\n```\nOutput:\n```\ndefault prevented, defaultPrevented: true\n```\nClicking a real `<a href=\"...\">` link would normally navigate the browser to that URL — `e.preventDefault()` stops that default action from happening at all, while the listener's own code still runs normally. `e.defaultPrevented` confirms it directly. This is the standard mechanism behind things like a form that validates input via JavaScript before allowing a real submission.\n\n**4. Multiple listeners on the same element and event all run, in the order they were added.**\n```js\nconst btn = document.createElement(\"button\");\nbtn.addEventListener(\"click\", () => console.log(\"listener 1\"));\nbtn.addEventListener(\"click\", () => console.log(\"listener 2\"));\nbtn.click();\n```\nOutput:\n```\nlistener 1\nlistener 2\n```\nUnlike assigning `element.onclick = ...` (an older, single-listener-only pattern), `addEventListener` genuinely allows any number of independent listeners on the same element and event, all running in registration order — no listener silently overwrites another.\n\n**5. `removeEventListener` — requires the *exact same function reference* used to add it.**\n```js\nfunction handler() { console.log(\"handler ran\"); }\nconst btn = document.createElement(\"button\");\nbtn.addEventListener(\"click\", handler);\nbtn.click();\nbtn.removeEventListener(\"click\", handler);\nbtn.click();\n```\nOutput:\n```\nhandler ran\n```\nOnly one `\"handler ran\"` line appears — the second `.click()` genuinely triggers nothing, confirming the removal worked. This only works because `handler` is a *named, stored* function reference passed identically to both calls — an inline arrow function passed to `addEventListener` could never be removed this way, since there would be no way to refer to that exact same function again afterward.\n\n**6. Dispatching a synthetic event — and reading a value through the standard `event.target` pattern.**\n```js\nconst box = document.getElementById(\"textbox\");\nbox.addEventListener(\"input\", (e) => console.log(\"input value:\", e.target.value));\nbox.value = \"typed text\";\nbox.dispatchEvent(new Event(\"input\"));\n```\nOutput:\n```\ninput value: typed text\n```\n`new Event(\"input\")` creates a genuine event object programmatically; `.dispatchEvent()` fires it on an element exactly as if it had happened naturally (a real user typing, in this case). `e.target` is the element the event actually happened on — reading `.value` off it is the standard way to access a form field's current content inside a handler.\n\n**7. `{ once: true }` — a listener that automatically removes itself after firing.**\n```js\nconst btn = document.createElement(\"button\");\nbtn.addEventListener(\"click\", () => console.log(\"fires once only\"), { once: true });\nbtn.click();\nbtn.click();\n```\nOutput:\n```\nfires once only\n```\nOnly one line prints despite two clicks — the `{ once: true }` option (a real, standard `addEventListener` option) automatically removes the listener right after its
