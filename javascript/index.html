Title": "The `this` Keyword", "title": "The `this` Keyword", "md": "### Why this matters\n\nThis is the single most-asked-about JavaScript topic there is, and for a real reason: `this` doesn't work the way \"self\" or \"this\" works in most other languages. It isn't determined by where a function is *written* — it's determined by *how a function is called*, and that single fact explains every genuine surprise this chapter walks through.\n\n### The core idea\n\n`this` inside a regular function is set fresh, every single call, based on how that call was made: as a plain function call, `this` is `undefined` (in strict mode) or the global object (in older, non-strict code); as a method call (`obj.method()`), `this` is `obj`; and `call`/`apply`/`bind` let you set it explicitly, to whatever you want. Arrow functions are the one genuine exception — they have no `this` of their own at all (Chapter 4.2 already previewed this), and always use whatever `this` was in their surrounding scope when they were written.\n\n### Examples\n\n**1. A plain function call — `this` is `undefined` in strict mode.**\n```js\n\"use strict\";\nfunction standalone() {\n  console.log(this);\n}\nstandalone();\n```\nOutput:\n```\nundefined\n```\nNothing about *how* `standalone` was called provided any object for `this` to refer to — so, in strict mode (Chapter 6.7, and the default for every ES Module and every `class` body), it's simply `undefined`.\n\n**2. The exact same function, called the exact same way, without strict mode.**\n```js\nfunction standalone() {\n  console.log(this === globalThis);\n}\nstandalone();\n```\nOutput:\n```\ntrue\n```\nIn older, non-strict (\"sloppy mode\") code — which is genuinely still the default for a plain `.js` CommonJS file that never opts into strict mode — `this` falls back to the **global object** instead of `undefined`. This is widely considered one of JavaScript's real historical mistakes; strict mode's `undefined` is the safer, more predictable behavior, and exactly why this book recommends strict mode everywhere (Chapter 6.7).\n\n**3. A method call — `this` is the object the method was called *on*.**\n```js\n\"use strict\";\nconst obj = {\n  name: \"Ada\",\n  greet() {\n    console.log(this.name);\n  }\n};\nobj.greet();\n```\nOutput:\n```\nAda\n```\n`this` is `obj`, specifically because the call was written as `obj.greet()` — the object immediately before the dot at the call site is what determines `this`, not anything about where `greet` was defined.\n\n**4. Extracting a method breaks this binding completely — a genuinely common, real bug.**\n```js\nconst extractedGreet = obj.greet;\nextractedGreet();\n```\nOutput:\n```\nTypeError: Cannot read properties of undefined (reading 'name')\n```\n`extractedGreet` is now just a bare function reference — calling it as `extractedGreet()` (not `obj.extractedGreet()`) is a plain function call, exactly like Example 1, so `this` is `undefined` again, and `this.name` throws. This is genuinely one of the most common real `this`-related bugs: passing `obj.method` as a callback (to `setTimeout`, an event handler, `.then()`) silently loses its connection to `obj` the instant it's extracted like this.\n\n**5. `call`/`apply`/`bind` — explicitly setting `this`.**\n```js\nfunction greetAs() {\n  return `Hi, I'm ${this.name}`;\n}\nconsole.log(greetAs.call({ name: \"Grace\" }));\nconsole.log(greetAs.apply({ name: \"Alan\" }));\nconst boundGreet = greetAs.bind({ name: \"Ada\" });\nconsole.log(boundGreet());\n```\nOutput:\n```\nHi, I'm Grace\nHi, I'm Alan\nHi, I'm Ada\n```\n`.call(thisArg, ...args)` and `.apply(thisArg, argsArray)` both call the function *immediately*, with `this` set to whatever you pass in — the only difference is how the remaining arguments are supplied (individually vs. as an array). `.bind(thisArg)` is different: it returns a *new* function with `this` permanently locked to `thisArg`, callable later — exactly the fix for Example 4's exact problem (`const extractedGreet = obj.greet.bind(obj)` would have worked perfectly).\n\n**6. Arrow functions inherit `this` lexically — genuinely the real fix for Example 4's class of bug, in modern code.**\n```js\nconst obj2 = {\n  name: \"Ada\",\n  regularTimeout() {\n    setTimeout(function() {\n      console.log(\"regular in setTimeout:\", this?.name);\n    }, 0);\n  },\n  arrowTimeout() {\n    setTimeout(() => {\n      console.log(\"arrow in setTimeout:\", this.name);\n    }, 0);\n  }\n};\nobj2.regularTimeout();\nobj2.arrowTimeout();\n```\nOutput:\n```\nregular in setTimeout: undefined\narrow in setTimeout: Ada\n```\nThe regular `function` passed to `setTimeout` genuinely loses its connection to `obj2` — but precisely *why* is worth getting right: in Node, `this` inside that callback isn't `undefined` or the global object at all, it's actually Node's own internal `Timeout` object (confirmed directly: `this.constructor.name` reports `\"Timeout\"`), since that's what Node invokes the callback *on* internally (Chapter 7.7 covers `setTimeout` properly). `this?.name` is `undefined` here simply because a `Timeout` object happens to have no `name` property — not because `this` itself is missing. Either way, the practical lesson is identical: whatever `this` ends up being, it's never `obj2`, which is the real problem. The arrow function has no `this` of its own at all, so it uses `arrowTimeout`'s own `this` (which is `obj2`, from the method-call rule in Example 3) — genuinely, reliably correct, which is exactly why arrow functions are the modern, idiomatic choice for a callback that needs to keep `this` meaning what it meant in the surrounding method.\n\n**7. `globalThis` — a real, standard way to reach the global object in any environment.**\n```js\nconsole.log(typeof globalThis);\n```\nOutput:\n```\nobject\n```\nBefore `globalThis` (a genuinely recent, 2020 addition), reaching \"the global object\" required different code in a browser (`window`) versus Node (`global`) — `globalThis` works identically everywhere, one more small reason modern JavaScript is more portable than it used to be.\n\n### ⚠️ Common Mistakes\n\n- **Extracting a method and passing it as a callback without preserving `this`.** As Example 4 showed, this is a real, common bug — fix it with `.bind()`, or (in modern code) simply use an arrow function at the call site instead, which never has this problem to begin with.\n- **Using a regular `function` for a callback that needs to keep the enclosing method's `this`.** As Example 6 showed directly, a plain function loses it; an arrow function keeps it automatically.\n- **Assuming `this` is determined by where a function is *defined*.** It's determined entirely by *how it's called* (except for arrow functions, which are the deliberate exception) — the single most important thing to internalize about `this` in this entire chapter.\n- **Forgetting the strict-mode-vs-sloppy-mode difference for a plain function call's `this`.** Code written assuming `undefined` (strict mode) can behave differently in an old, non-strict file — exactly the kind of environment-dependent surprise Chapter 6.7's strict-mode recommendation exists to eliminate.\n\n### How this connects\n\nChapter 5.1's constructors and Chapter 5.3's classes both establish `this` a third way — bound to the specific new instance being constructed, covered fully once objects and prototypes are properly introduced. Chapter 5.7's callback patterns are exactly where Example 4's \"extracted method loses `this`\" bug shows up constantly in real code, and exactly where Example 6's arrow-function fix becomes second nature.\n\n### Quick recap\n\n- `this` is determined by **how a function is called**, not where it's written — a plain call gives `undefined` (strict mode) or the global object (sloppy mode); a method call (`obj.method()`) gives the object before the dot.\n- Extracting a method from its object and calling it separately loses its `this` binding entirely — a genuinely common, real bug.\n- `.call()`/`.apply()` invoke a function immediately with an explicit `this`; `.bind()` returns a new function with `this` permanently locked.\n- Arrow functions have no `this` of their own — they always use whatever `this` was in their enclosing scope when written, which is exactly what makes them the reliable, modern fix for callbacks that need to preserve a method's `this`.\n- `globalThis` is the modern, environment-independent way to reach the global object."}, {"id": "4.7", "partNum": 4, "partTitle": "Part IV — Grammar", "partMetaphor": "the rules for building your own sentences: functions", "chapNum": 7, "slug": "recursion-in-javascript", "fullTitle": "Recursion in JavaScript", "title": "Recursion in JavaScript", "md": "### Why this matters\n\nA function calling itself is a natural fit for problems defined in terms of smaller versions of themselves — walking a tree-shaped structure, computing a factorial, parsing nested data (Chapter 2.8's nested destructuring already hinted at exactly this kind of shape). JavaScript supports recursion with no special syntax at all — the interesting part is understanding exactly how deep you can go, and one genuine, honest disappointment about a feature you might expect to help.\n\n### The core idea\n\nA recursive function calls itself, each call working on a smaller piece of the problem, until it reaches a **base case** simple enough to answer directly without recursing further. Every call adds a real frame to JavaScript's call stack — a finite resource — and exceeding it throws a real, catchable `RangeError`.\n\n### Examples\n\n**1. The classic example: factorial.**\n```js\nfunction factorial(n) {\n  if (n <= 1) return 1;\n  return n * factorial(n - 1);\n}\nconsole.log(factorial(5));\n```\nOutput:\n```\n120\n```\n`n <= 1` is the base case; every other call recurses on a strictly smaller `n`, guaranteeing the base case is eventually reached.\n\n**2. Fibonacci — two recursive calls per invocation.**\n```js\nfunction fibonacci(n) {\n  if (n <= 1) return n;\n  return fibonacci(n - 1) + fibonacci(n - 2);\n}\nconsole.log(fibonacci(10));\n```\nOutput:\n```\n55\n```\nGenuinely illustrative of how fast a naive recursive solution's total call count can grow — Chapter 8.6 revisits this exact function as a concrete example for measuring real performance.\n\n**3. Mutual recursion — two functions calling each other.**\n```js\nfunction isEven(n) {\n  if (n === 0) return true;\n  return isOdd(n - 1);\n}\nfunction isOdd(n) {\n  if (n === 0) return false;\n  return isEven(n - 1);\n}\nconsole.log(isEven(10), isOdd(10));\n```\nOutput:\n```\ntrue false\n```\nNothing special is required for two functions to call each other recursively — JavaScript's function-declaration hoisting (Chapter 4.1) means `isOdd` doesn't even need to be declared before `isEven` uses it, since both are fully hoisted before either runs.\n\n**4. A real, catchable stack overflow — verified directly.**\n```js\nfunction countDown(n) {\n  if (n === 0) return 0;\n  return 1 + countDown(n - 1);\n}\ntry {\n  console.log(countDown(1000000));\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nRangeError Maximum call stack size exceeded\n```\nA million levels deep is too much for JavaScript's default call stack — a real, specific `RangeError` is thrown, and (verified directly here) it's genuinely catchable with an ordinary `try`/`catch` (Chapter 6.1), unlike some languages where a stack overflow is an unrecoverable crash. The exact depth that triggers it varies by engine and by how much work each call does, but it's a real, finite limit worth being aware of for anything recursing on genuinely large or unbounded input.\n\n**5. An honest disappointment: JavaScript does *not* actually optimize tail calls, despite it being part of the language specification.**\n```js\n\"use strict\";\nfunction countDownTail(n) {\n  if (n === 0) return \"done\";\n  return countDownTail(n - 1);\n}\ntry {\n  console.log(countDownTail(1000000));\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nRangeError Maximum call stack size exceeded\n```\nThis function is a genuine **tail call** — `countDownTail(n - 1)` is the very last thing that happens, with nothing left to do after it returns (unlike Example 1's `factorial`, which still has to multiply *after* its recursive call returns). Some languages specifically optimize this exact shape into a plain loop internally, using no extra stack space no matter how deep the recursion goes. **Proper tail calls were genuinely added to the ECMAScript 2015 specification** — but verified directly here, on this book's own Node/V8 engine, it still overflows identically to the non-tail-recursive version. V8 (the engine behind both Node and Chrome) has never implemented this part of the spec, and there's no real indication it plans to — this is one of those rare, honest cases where \"the spec says X\" and \"what actually happens\" genuinely diverge, worth knowing precisely rather than assuming tail recursion is a safe, unlimited-depth technique in real JavaScript.\n\n### ⚠️ Common Mistakes\n\n- **Writing a recursive function with no base case, or one that's unreachable for some inputs.** This either overflows the stack (Example 4) or, worse, never resolves for specific inputs that quietly skip the base case entirely.\n- **Assuming JavaScript optimizes tail-recursive functions to avoid stack growth.** As Example 5 proved directly, it doesn't, on this book's reference engine — a genuinely deep tail-recursive algorithm still needs converting to an explicit loop if the depth could be large.\n- **Treating a stack overflow as an unrecoverable crash.** As Example 4 showed, `RangeError: Maximum call stack size exceeded` is a real, ordinary, catchable error — though catching it is rarely the actual fix; restructuring the algorithm (an explicit loop, or breaking work into smaller chunks) usually is.\n- **Reaching for recursion when a straightforward loop would be clearer and avoid the real, finite stack-depth risk entirely.** Recursion genuinely shines for naturally tree-shaped or self-similar problems; deeply-nested or potentially-unbounded iteration is usually both safer and clearer as an ordinary loop.\n\n### How this connects\n\nChapter 8.6 (Performance) comes back to Example 2's Fibonacci directly, measuring exactly how much a naive recursive approach can be improved — and Chapter 6.1's `try`/`catch` is precisely the mechanism Example 4 relied on to handle a stack overflow gracefully rather than crashing the whole program.\n\n### Quick recap\n\n- A recursive function needs a base case reachable from every input, or it never terminates (in practice, until the stack overflows).\n- JavaScript allows mutual recursion with no special declaration order needed, thanks to function-declaration hoisting.\n- Exceeding the call stack throws a real, catchable `RangeError: Maximum call stack size exceeded` — not an unrecoverable crash, though catching it rarely fixes the underlying problem.\n- JavaScript's V8 engine does **not** implement proper tail-call optimization, despite it being part of the ECMAScript 2015 specification — a genuinely deep tail-recursive function still overflows exactly like a non-tail-recursive one, verified directly."}, {"id": "5.1", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 1, "slug": "objects-prototypes-how-javascripts-object-model-really-works", "fullTitle": "Objects & Prototypes: How JavaScript's Object Model Really Works", "title": "Objects & Prototypes: How JavaScript's Object Model Really Works", "md": "### Why this matters\n\nEvery object you've created so far — plain literals, arrays, even functions — has been quietly using a mechanism this chapter finally makes explicit: **prototypes**. JavaScript's object model isn't class-based underneath, the way Java's or C#'s is — it's prototype-based, and understanding this directly is what makes Chapter 5.3's `class` syntax feel like the genuine syntax sugar it actually is, rather than a separate system.\n\n### The core idea\n\nEvery object has an internal link to another object — its **prototype** — and when you access a property that doesn't exist on the object itself, JavaScript automatically looks it up on the prototype instead, then the prototype's own prototype, and so on, until it finds the property or runs out of prototypes. This chain is called the **prototype chain**, and it's the real mechanism behind inherited methods, `instanceof`, and a huge amount of JavaScript's everyday behavior.\n\n### Examples\n\n**1. Every plain object already has a prototype — where `.toString()` actually comes from.**\n```js\nconst obj = { name: \"Ada\" };\nconsole.log(Object.getPrototypeOf(obj) === Object.prototype);\nconsole.log(obj.toString());\n```\nOutput:\n```\ntrue\n[object Object]\n```\n`obj` never defined its own `.toString()` — it found it by walking up to `Object.prototype`, the default prototype every plain object literal gets automatically. This is the real mechanism, not magic.\n\n**2. `hasOwnProperty` distinguishes an object's own properties from inherited ones — directly relevant now.**\n```js\nconsole.log(obj.hasOwnProperty(\"name\"));\nconsole.log(obj.hasOwnProperty(\"toString\"));\n```\nOutput:\n```\ntrue\nfalse\n```\n`name` is genuinely `obj`'s own property; `toString` is inherited from `Object.prototype` — `hasOwnProperty` correctly tells them apart, exactly the distinction Chapter 2.7 flagged as \"becoming genuinely important once prototypes enter the picture.\" This is that moment.\n\n**3. A constructor function — the pre-`class` way to build objects sharing a prototype.**\n```js\nfunction Person(name) {\n  this.name = name;\n}\nPerson.prototype.greet = function() {\n  return `Hi, I'm ${this.name}`;\n};\nconst p1 = new Person(\"Ada\");\nconst p2 = new Person(\"Grace\");\nconsole.log(p1.greet());\nconsole.log(p2.greet());\n```\nOutput:\n```\nHi, I'm Ada\nHi, I'm Grace\n```\n`new Person(\"Ada\")` creates a fresh object, sets its prototype to `Person.prototype`, calls `Person` with `this` bound to that new object (Chapter 4.6's `this` rules, a third real way `this` gets set), and returns it automatically. `greet` was defined *once*, directly on `Person.prototype` — not duplicated inside the constructor.\n\n**4. The real payoff: every instance shares the *exact same* method — verified directly.**\n```js\nconsole.log(p1.greet === p2.greet);\n```\nOutput:\n```\ntrue\n```\n`p1` and `p2` are two completely separate objects, but `p1.greet` and `p2.greet` are the *identical* function — found on the shared prototype, not copied per instance. This is genuinely efficient: a class with a thousand instances and ten methods stores those ten functions exactly once, not ten thousand times.\n\n**5. Confirming the prototype link, and the own-vs-inherited distinction again, on a real instance.**\n```js\nconsole.log(Object.getPrototypeOf(p1) === Person.prototype);\nconsole.log(p1.hasOwnProperty(\"name\"));\nconsole.log(p1.hasOwnProperty(\"greet\"));\nconsole.log(\"greet\" in p1);\n```\nOutput:\n```\ntrue\ntrue\nfalse\ntrue\n```\n`name` is `p1`'s own property (set inside the constructor via `this.name = name`); `greet` is not `p1`'s own property at all — it's inherited. `in` (Chapter 2.7) correctly reports `true` for `greet` anyway, since `in` checks the whole prototype chain, not just an object's own properties — exactly the distinction that chapter promised would matter here.\n\n**6. `Object.create(null)` — a genuinely prototype-less object, and what that actually costs you.**\n```js\nconst emptyObj = Object.create(null);\nconsole.log(Object.getPrototypeOf(emptyObj));\nconsole.log(emptyObj.toString());\n```\nOutput:\n```\nnull\n```\n```\nTypeError: emptyObj.toString is not a function\n```\n`emptyObj` has *no* prototype at all — not even `Object.prototype` — so it inherits absolutely nothing, including the `.toString()` every ordinary object gets for free. This is occasionally used deliberately (a genuinely \"bare\" object, safe as a lookup table with zero risk of colliding with an inherited property name), but it's a real, specific choice, not the default.\n\n**7. `instanceof` — checking whether an object's prototype chain includes a given constructor's prototype.**\n```js\nconsole.log(typeof Person);\nconsole.log(p1 instanceof Person);\nconsole.log(p1 instanceof Object);\n```\nOutput:\n```\nfunction\ntrue\ntrue\n```\nA constructor function is, underneath, just an ordinary function (`typeof Person` is `\"function\"`, not some special type) — `new` is what makes calling it behave differently. `p1 instanceof Person` is `true` because `Person.prototype` is genuinely in `p1`'s prototype chain; `p1 instanceof Object` is also `true`, since `Person.prototype` itself has `Object.prototype` as *its* prototype — the chain goes all the way up.\n\n### ⚠️ Common Mistakes\n\n- **Defining a method inside a constructor function itself** (`this.greet = function() {...}`) instead of on the prototype. This genuinely creates a brand-new function *per instance*, losing Example 4's sharing entirely — a real, measurable memory cost for anything created in large numbers.\n- **Confusing an object's own properties with its inherited ones.** `in` checks the whole chain; `hasOwnProperty` checks only the object itself — using the wrong one silently gives a misleading answer about what an object \"really has.\"\n- **Forgetting `Object.create(null)` objects have no `.toString()`, `.hasOwnProperty()`, or any other inherited method at all.** Genuinely useful for a pure lookup table, genuinely surprising if you expected ordinary object behavior.\n- **Calling a constructor function without `new`.** `Person(\"Ada\")` (no `new`) doesn't create a new object at all — inside, `this` follows Chapter 4.6's plain-function-call rules instead. Verified directly: in strict mode this throws immediately (`this` is `undefined`, so `this.name = name` fails); in older, non-strict code it's genuinely worse — `this` silently falls back to the global object, so `this.name = name` quietly creates a *global* `name` variable instead of erroring at all. `class`, covered next, fixes this real, historical wart directly by refusing to be called without `new` under any circumstances.\n\n### How this connects\n\nChapter 5.2 covers prototypal inheritance properly — one prototype itself having another object as *its* prototype, building real inheritance chains longer than this chapter's single link. Chapter 5.3's `class` syntax is, underneath, doing exactly what `Person`'s constructor function and `.prototype` assignment did here, just with cleaner, safer syntax — understanding this chapter first is what makes `class` feel like sugar rather than an unrelated new system.\n\n### Quick recap\n\n- Every object has a **prototype** — another object it automatically delegates property lookups to when a property isn't found on the object itself.\n- `hasOwnProperty()` checks only an object's own properties; `in` checks the whole prototype chain.\n- A constructor function (called with `new`) creates a new object linked to `ConstructorName.prototype` — methods belong there, shared identically across every instance, not duplicated per instance.\n- `Object.create(null)` makes a genuinely prototype-less object — no inherited methods at all, including `.toString()`.\n- `instanceof` checks whether a constructor's `.prototype` appears anywhere in an object's prototype chain."}, {"id": "5.2", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 2, "slug": "prototypal-inheritance", "fullTitle": "Prototypal Inheritance", "title": "Prototypal Inheritance", "md": "### Why this matters\n\nChapter 5.1 showed a single prototype link. Real inheritance chains genuinely stack multiple links — an object whose prototype has its own prototype, and so on — and building one by hand, the way this chapter does, is exactly what makes Chapter 5.3's `class extends` feel like sugar rather than a different mechanism entirely.\n\n### The core idea\n\nTo make one type \"inherit\" from another, you set its `.prototype` to a new object whose *own* prototype is the parent's `.prototype` — chaining the link one level deeper. A subtype's constructor typically calls the parent constructor explicitly (via `.call()`, Chapter 4.6) to reuse its setup logic, then adds its own.\n\n### Examples\n\n**1. Building a two-level inheritance chain by hand.**\n```js\nfunction Animal(name) {\n  this.name = name;\n}\nAnimal.prototype.speak = function() {\n  return `${this.name} makes a sound`;\n};\nAnimal.prototype.describe = function() {\n  return `I am ${this.name}`;\n};\n\nfunction Dog(name, breed) {\n  Animal.call(this, name);\n  this.breed = breed;\n}\nDog.prototype = Object.create(Animal.prototype);\nDog.prototype.constructor = Dog;\nDog.prototype.speak = function() {\n  return `${this.name} barks`;\n};\n\nconst d = new Dog(\"Rex\", \"Labrador\");\nconsole.log(d.speak());\nconsole.log(d.describe());\n```\nOutput:\n```\nRex barks\nI am Rex\n```\n`Animal.call(this, name)` runs `Animal`'s own constructor logic with `this` bound to the new `Dog` instance being built (Chapter 4.6) — the standard way to reuse a parent's setup code. `Object.create(Animal.prototype)` creates a new object *whose own prototype is* `Animal.prototype`, and that becomes `Dog.prototype` — this is the actual chain-building step. `speak` is overridden on `Dog.prototype`; `describe` was never touched, so it's found by walking up to `Animal.prototype` instead.\n\n**2. `instanceof` correctly recognizes both levels.**\n```js\nconsole.log(d instanceof Dog);\nconsole.log(d instanceof Animal);\n```\nOutput:\n```\ntrue\ntrue\n```\nBoth are `true`, since `instanceof` (Chapter 5.1) checks the *entire* prototype chain, not just the immediate link — `Dog.prototype` and `Animal.prototype` are both genuinely present in `d`'s chain.\n\n**3. Walking the chain directly, confirming each link.**\n```js\nconsole.log(Object.getPrototypeOf(d) === Dog.prototype);\nconsole.log(Object.getPrototypeOf(Dog.prototype) === Animal.prototype);\nconsole.log(Object.getPrototypeOf(Animal.prototype) === Object.prototype);\n```\nOutput:\n```\ntrue\ntrue\ntrue\n```\nThe chain genuinely goes `d → Dog.prototype → Animal.prototype → Object.prototype` — three real links, each one exactly what Chapter 5.1's single-link example already established, just stacked.\n\n**4. Calling an overridden \"parent\" method explicitly.**\n```js\nconsole.log(Animal.prototype.speak.call(d));\n```\nOutput:\n```\nRex makes a sound\n```\n`Dog.prototype.speak` overrides `Animal.prototype.speak` for ordinary calls (`d.speak()`), but the original is still genuinely there, reachable directly — `.call(d)` (Chapter 4.6) invokes `Animal`'s own `speak` with `this` set to `d` anyway. This manual pattern is exactly what `super` (Chapter 5.4) does automatically and far more conveniently, once `class` syntax is available.\n\n**5. The `.constructor` property — and why `Dog.prototype.constructor = Dog` was necessary.**\n```js\nconsole.log(d.constructor === Dog);\n```\nOutput:\n```\ntrue\n```\n`Object.create(Animal.prototype)` produces a plain object whose own `.constructor` (found by walking up the chain) would otherwise still point at `Animal`, since that's genuinely where `Object.create`'s argument came from — manually re-pointing `Dog.prototype.constructor` back to `Dog` (done explicitly in Example 1) is a real, easy-to-forget bookkeeping step this manual approach requires. Skipping it doesn't break `instanceof` or method lookup at all, but leaves `.constructor` reporting the wrong thing — a genuinely common source of confusion in code that relies on it.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to reset `.constructor` after replacing a `.prototype` object with `Object.create(...)`.** As Example 5 showed, it silently keeps pointing at the parent constructor otherwise — easy to miss since nothing else appears to break.\n- **Setting `Child.prototype = Parent.prototype` directly**, instead of `Object.create(Parent.prototype)`. This doesn't create a new link in the chain at all — it makes both constructors share the *literal same* prototype object, so a method added to one appears on the other too, which is essentially never what's actually wanted.\n- **Forgetting to call the parent constructor** (`Animal.call(this, name)`) inside the child constructor. Without it, the parent's own setup logic (setting `this.name` here) simply never runs for the child.\n- **Manually building inheritance chains like this in new code**, when `class extends` (Chapter 5.4) does the identical thing with far less ceremony and far fewer chances to forget a step. This chapter's manual version exists specifically to show what `class` is actually doing underneath — not as the recommended way to write new code.\n\n### How this connects\n\nChapter 5.3 introduces `class` syntax, and Chapter 5.4 shows `extends`/`super` doing everything this chapter just built by hand — automatically, safely, with no `.constructor` bookkeeping required. Understanding this manual version first is exactly what makes that syntax feel like a genuine simplification rather than unexplained magic.\n\n### Quick recap\n\n- A multi-level prototype chain is built by setting a subtype's `.prototype` to `Object.create(ParentType.prototype)` — a new object whose own prototype is the parent's.\n- `instanceof` and property lookup both walk the *entire* chain, however many levels deep.\n- A parent method overridden on a child prototype is still reachable explicitly via `.call()` — exactly the manual version of what `super` automates.\n- `Object.create(Parent.prototype)` doesn't preserve `.constructor` automatically — it must be reset by hand, a real, easy-to-forget step this manual approach requires."}, {"id": "5.3", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 3, "slug": "classes-syntax-sugar-over-prototypes", "fullTitle": "Classes: Syntax Sugar Over Prototypes", "title": "Classes: Syntax Sugar Over Prototypes", "md": "### Why this matters\n\nChapters 5.1 and 5.2 built object-oriented code by hand — constructor functions, `.prototype` assignments, manual `Object.create()` chains. `class` is modern JavaScript's cleaner syntax for exactly that same mechanism — not a new object model, just a nicer way to write the one you already understand.\n\n### The core idea\n\nA `class` declaration defines a constructor and its prototype methods together, in one readable block, instead of scattered across separate `function` and `.prototype.method = ...` statements. Underneath, `typeof SomeClass` is still `\"function\"` — a class genuinely *is* a function with a prototype, exactly like Chapter 5.1's `Person`, just with several real, deliberate safety improvements bundled in.\n\n### Examples\n\n**1. A basic class — constructor and methods in one block.**\n```js\nclass Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n    return `${this.name} makes a sound`;\n  }\n  describe() {\n    return `I am ${this.name}`;\n  }\n}\n\nconst a = new Animal(\"Generic\");\nconsole.log(a.speak());\nconsole.log(typeof Animal);\nconsole.log(a instanceof Animal);\n```\nOutput:\n```\nGeneric makes a sound\nfunction\ntrue\n```\n`constructor` plays the exact role `function Animal(name) { this.name = name; }` played in Chapter 5.1; `speak` and `describe`, written inside the class body, are placed directly on `Animal.prototype` automatically — no separate `.prototype.speak = ...` line needed. `typeof Animal` being `\"function\"` confirms this really is the same mechanism underneath, just with cleaner syntax.\n\n**2. Methods still live on the shared prototype — verified directly.**\n```js\nconst a2 = new Animal(\"Other\");\nconsole.log(a.speak === a2.speak);\nconsole.log(Object.getPrototypeOf(a) === Animal.prototype);\n```\nOutput:\n```\ntrue\ntrue\n```\nExactly like Chapter 5.1's Example 4 — every instance shares the identical `speak` function, found via the prototype chain, not duplicated per instance. `class` doesn't change this underlying efficiency at all; it just makes writing it less error-prone.\n\n**3. A real, deliberate safety improvement: calling a class constructor without `new` always throws.**\n```js\ntry {\n  Animal(\"NoNew\");\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nTypeError Class constructor Animal cannot be invoked without 'new'\n```\nChapter 5.1 showed that calling an ordinary constructor *function* without `new` was a real historical wart — silent in sloppy mode, an unrelated-looking error in strict mode. `class` closes this gap directly: every class constructor refuses to run without `new`, in *any* mode, with a clear, specific error naming the actual problem.\n\n**4. Class fields — declaring and initializing instance properties directly in the class body.**\n```js\nclass Counter {\n  count = 0;\n  increment() {\n    this.count++;\n    return this.count;\n  }\n}\nconst c = new Counter();\nconsole.log(c.increment(), c.increment(), c.increment());\n```\nOutput:\n```\n1 2 3\n```\n`count = 0` is a **class field** — a genuinely modern (ES2022) way to declare and initialize an instance property without writing it inside `constructor` at all. Each `new Counter()` gets its own independent `count`, starting at `0`, exactly as if it had been set with `this.count = 0` in a constructor.\n\n**5. Static methods and fields — belonging to the class itself, not to instances.**\n```js\nclass MathHelper {\n  static PI_ISH = 3.14;\n  static square(n) {\n    return n * n;\n  }\n}\nconsole.log(MathHelper.square(5));\nconsole.log(MathHelper.PI_ISH);\nconst mh = new MathHelper();\nconsole.log(mh.square);\n```\nOutput:\n```\n25\n3.14\nundefined\n```\n`static` members belong to the class itself, callable as `MathHelper.square(5)` directly — never on an instance. `mh.square` is genuinely `undefined`, confirming static members aren't inherited by instances at all; they're a separate, class-level namespace, useful for utility functions and constants logically grouped with a class but not tied to any particular object.\n\n**6. Class declarations are *not* hoisted the way function declarations are — a real, specific difference from Chapter 4.1.**\n```js\ntry {\n  console.log(new Early());\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\nclass Early {}\n```\nOutput:\n```\nReferenceError Cannot access 'Early' before initialization\n```\nChapter 4.1 showed `function` declarations are hoisted with their full body, fully callable before their point in the file. A `class` declaration is hoisted too, technically, but stays in the **temporal dead zone** (Chapter 1.3) until its declaration actually executes — referencing it earlier throws the same real `ReferenceError` a `let`/`const` in its TDZ would, not the \"undefined\" behavior a `var` would give.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `class` creates some fundamentally different kind of object than a constructor function does.** As Examples 1 and 2 confirmed, `typeof` still reports `\"function\"`, and methods are still found via the exact same prototype-chain mechanism Chapter 5.1 covered — `class` is real syntax sugar, not a separate system.\n- **Expecting a class to be usable before its declaration, the way a hoisted `function` declaration is.** As Example 6 showed, a class is in the temporal dead zone until its declaration runs — using it earlier throws a real `ReferenceError`, not silent `undefined`.\n- **Forgetting `static` members aren't available on instances.** As Example 5 showed, `mh.square` is `undefined` — static methods and fields belong to the class itself only.\n- **Writing every property assignment inside `constructor`, unaware that class fields (Example 4) can declare and initialize them directly in the class body**, often more readable for simple default values.\n\n### How this connects\n\nChapter 5.4 covers `extends` and `super` — the `class` syntax's own version of Chapter 5.2's manual `Object.create(Parent.prototype)` inheritance chain, but automatic and far less error-prone. Chapter 5.5 covers getters, setters, and genuinely private fields, both built directly into the same class-body syntax introduced here.\n\n### Quick recap\n\n- `class` is syntax sugar over the exact same constructor-function-plus-prototype mechanism from Chapters 5.1 and 5.2 — `typeof AnyClass` is still `\"function\"`.\n- Methods written in a class body go on the shared prototype automatically, identically efficient to the manual version.\n- A class constructor always throws if called without `new`, in every mode — a real, deliberate fix for a genuine historical wart in plain constructor functions.\n- Class fields (`count = 0`) declare and initialize instance properties directly in the class body, without needing to write them inside `constructor`.\n- `static` methods and fields belong to the class itself, not to instances.\n- A class declaration is in the temporal dead zone until it executes — unlike a hoisted `function` declaration, using it earlier throws a real `ReferenceError`."}, {"id": "5.4", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 4, "slug": "class-inheritance-super", "fullTitle": "Class Inheritance & `super`", "title": "Class Inheritance & `super`", "md": "### Why this matters\n\nChapter 5.2 built a two-level inheritance chain entirely by hand — `Object.call()`, `Object.create()`, manually resetting `.constructor`. `extends` and `super` do exactly the same thing, automatically, with none of that bookkeeping and none of the ways to forget a step. This is where `class` earns the \"syntax sugar\" label the most concretely.\n\n### The core idea\n\n`class Dog extends Animal` makes `Dog` inherit from `Animal` — `Dog.prototype`'s own prototype becomes `Animal.prototype`, exactly like Chapter 5.2's manual chain, done in one keyword. Inside a subclass, `super(...)` calls the parent constructor, and `super.methodName()` calls the parent's version of an overridden method — both real, direct replacements for Chapter 5.2's `Animal.call(this, name)` and `Animal.prototype.speak.call(this)`.\n\n### Examples\n\n**1. `extends` and `super()` — building the same chain as Chapter 5.2, with far less code.**\n```js\nclass Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n    return `${this.name} makes a sound`;\n  }\n  describe() {\n    return `I am ${this.name}`;\n  }\n}\n\nclass Dog extends Animal {\n  constructor(name, breed) {\n    super(name);\n    this.breed = breed;\n  }\n  speak() {\n    return `${super.speak()}, specifically a bark`;\n  }\n}\n\nconst d = new Dog(\"Rex\", \"Labrador\");\nconsole.log(d.speak());\nconsole.log(d.describe());\n```\nOutput:\n```\nRex makes a sound, specifically a bark\nI am Rex\n```\n`super(name)` calls `Animal`'s constructor with `this` already bound to the new `Dog` instance — the direct replacement for Chapter 5.2's `Animal.call(this, name)`. `super.speak()`, inside the overridden `speak()`, calls `Animal.prototype.speak` directly — the direct replacement for Chapter 5.2's `Animal.prototype.speak.call(this)`, but readable as an ordinary method call.\n\n**2. `instanceof` and the prototype chain — identical result to the manual version, confirmed directly.**\n```js\nconsole.log(d instanceof Dog);\nconsole.log(d instanceof Animal);\nconsole.log(Object.getPrototypeOf(Dog.prototype) === Animal.prototype);\nconsole.log(Object.getPrototypeOf(Dog) === Animal);\n```\nOutput:\n```\ntrue\ntrue\ntrue\ntrue\n```\nThe first three lines confirm exactly the same chain Chapter 5.2 built by hand. The fourth is new: `extends` also links the *constructors themselves* (`Dog`'s own prototype is `Animal`) — this is specifically what makes static-method inheritance (Example 4) work automatically, something the manual `Object.create()` approach didn't handle at all.\n\n**3. A real, enforced rule: `this` cannot be touched before `super()` runs.**\n```js\nclass Broken extends Animal {\n  constructor(name) {\n    this.name = name;\n  }\n}\ntry {\n  new Broken(\"X\");\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nReferenceError Must call super constructor in derived class before accessing 'this' or returning from derived constructor\n```\nIn a subclass, `this` genuinely doesn't exist yet until `super()` has run — it's the parent constructor that actually creates the instance. Trying to use `this` first throws immediately, with a message naming the exact problem. This is a real, deliberate safety rule with no equivalent in Chapter 5.2's manual version, where forgetting `Animal.call(this, name)` just silently skipped the parent's setup instead of erroring.\n\n**4. A subclass needs no constructor at all — arguments forward to the parent automatically.**\n```js\nclass Puppy extends Dog {}\nconst p = new Puppy(\"Fido\", \"Beagle\");\nconsole.log(p.speak());\nconsole.log(p instanceof Dog, p instanceof Animal, p instanceof Puppy);\n```\nOutput:\n```\nFido makes a sound, specifically a bark\ntrue true true\n```\n`Puppy` adds nothing new, so it doesn't need its own `constructor` at all — JavaScript supplies an implicit one that just forwards every argument to `super(...)`. `p.speak()` still resolves to `Dog.prototype.speak` (found by walking the now-three-level chain), and `instanceof` confirms all three levels.\n\n**5. Static methods are inherited too — thanks to Example 2's constructor-to-constructor link.**\n```js\nclass Base {\n  static greet() {\n    return \"base static\";\n  }\n}\nclass Derived extends Base {}\nconsole.log(Derived.greet());\n```\nOutput:\n```\nbase static\n```\n`Derived.greet()` works even though `Derived` never defined it — `extends` links `Derived`'s own prototype to `Base` (Example 2's fourth check), so static lookup walks up exactly like instance-method lookup does.\n\n**6. Extending a built-in class — `Error` itself.**\n```js\nclass MyError extends Error {\n  constructor(message, code) {\n    super(message);\n    this.name = \"MyError\";\n    this.code = code;\n  }\n}\ntry {\n  throw new MyError(\"custom failure\", 42);\n} catch (e) {\n  console.log(e.name, e.message, e.code, e instanceof Error, e instanceof MyError);\n}\n```\nOutput:\n```\nMyError custom failure 42 true true\n```\n`extends` works on built-in classes too, not just ones you define — `super(message)` calls `Error`'s own constructor, which sets `.message` and the stack trace correctly. This is the standard, idiomatic way to build a custom error type, and Chapter 6.2 covers it in full detail.\n\n### ⚠️ Common Mistakes\n\n- **Trying to use `this` before calling `super()` in a subclass constructor.** As Example 3 showed, this throws a real, specific `ReferenceError` immediately — always call `super(...)` as the first statement when a subclass constructor needs `this` at all.\n- **Writing an empty constructor that only calls `super(...args)`** when no constructor was needed at all. As Example 4 showed, a subclass with nothing new to add doesn't need a constructor — one is supplied automatically.\n- **Forgetting that `extends` also links the constructors themselves**, not just their prototypes — this is specifically what makes Example 5's static-method inheritance work, something easy to overlook coming from Chapter 5.2's manual approach.\n- **Manually replicating Chapter 5.2's `Object.create()` pattern in new code that could just use `extends`.** `extends`/`super` do the identical thing, safer and far more readably — the manual version's value was purely in explaining the underlying mechanism.\n\n### How this connects\n\nChapter 6.2 (Creating Custom Errors) builds directly on Example 6, extending `Error` properly with a full custom-error hierarchy. Chapter 5.5 covers getters, setters, and private fields — features that combine naturally with the inheritance patterns from this chapter in real class hierarchies.\n\n### Quick recap\n\n- `class Sub extends Base` links `Sub.prototype`'s prototype to `Base.prototype` — the same chain Chapter 5.2 built manually, done automatically.\n- `super(...)` calls the parent constructor; `super.method()` calls the parent's version of an overridden method.\n- `this` cannot be accessed in a subclass constructor before `super()` has run — enforced with a real, specific `ReferenceError`, unlike the manual version's silent-skip failure mode.\n- A subclass with nothing new to add needs no constructor at all — one is provided automatically, forwarding all arguments to `super(...)`.\n- `extends` also links the constructors themselves, which is why static methods are inherited too.\n- Built-in classes like `Error` can be extended the same way — the standard pattern for custom error types."}, {"id": "5.5", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 5, "slug": "getters-setters-private-fields", "fullTitle": "Getters, Setters & Private Fields", "title": "Getters, Setters & Private Fields", "md": "### Why this matters\n\nEvery class so far has exposed its data as plain, freely readable and writable properties. Real classes often need computed properties that look like plain data from the outside, and genuinely private internal state that outside code simply cannot reach at all — not just \"conventionally shouldn't,\" but structurally cannot. This chapter covers both.\n\n### The core idea\n\nA **getter** (`get name() {...}`) and **setter** (`set name(value) {...}`) let a property be *read* and *written* using ordinary `obj.property` syntax, while actually running your own code underneath — validating a value, computing it from other fields, anything. A **private field** (`#name`, ES2022) is a class member genuinely inaccessible outside the class body — not a naming convention like a leading underscore, but an actual syntax-level restriction the engine enforces.\n\n### Examples\n\n**1. A getter and setter pair — validation on write, computation on read.**\n```js\nclass Temperature {\n  #celsius;\n  constructor(celsius) {\n    this.#celsius = celsius;\n  }\n  get celsius() {\n    return this.#celsius;\n  }\n  set celsius(value) {\n    if (typeof value !== \"number\") {\n      throw new TypeError(\"celsius must be a number\");\n    }\n    this.#celsius = value;\n  }\n  get fahrenheit() {\n    return this.#celsius * 9 / 5 + 32;\n  }\n  set fahrenheit(value) {\n    this.#celsius = (value - 32) * 5 / 9;\n  }\n}\n\nconst t = new Temperature(25);\nconsole.log(t.celsius);\nconsole.log(t.fahrenheit);\nt.fahrenheit = 32;\nconsole.log(t.celsius);\n```\nOutput:\n```\n25\n77\n0\n```\n`t.celsius` and `t.fahrenheit` are read with plain property syntax — no parentheses — even though each one actually runs a function underneath. `fahrenheit` doesn't store anything of its own at all; it's computed live from `#celsius` on every read, and setting it back-computes and stores `#celsius` instead. Setting `t.fahrenheit = 32` correctly updated `t.celsius` to `0`, confirming the two stay in sync through the shared private field.\n\n**2. The setter's validation actually runs — confirmed directly.**\n```js\ntry {\n  t.celsius = \"hot\";\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nTypeError celsius must be a number\n```\n`t.celsius = \"hot\"` looks like a plain property assignment, but it's really calling the `set celsius(value)` function from Example 1 — which threw exactly the validation error it was written to throw. This is the real value of setters: enforcing invariants without callers needing to remember to call a separate `.setCelsius()` method.\n\n**3. Private fields are genuinely invisible from the outside — not just by convention.**\n```js\nconsole.log(t.hasOwnProperty(\"#celsius\"));\nconsole.log(Object.keys(t));\nconsole.log(JSON.stringify(t));\n```\nOutput:\n```\nfalse\n[]\n{}\n```\n`#celsius` doesn't show up in `hasOwnProperty`, `Object.keys`, or even `JSON.stringify` — it's genuinely absent from every ordinary way of inspecting an object's properties, not merely hidden by naming convention the way an older `_celsius` (a single underscore prefix) would be. Writing `t.#celsius` directly, from code outside the `Temperature` class body entirely, isn't even a runtime error — it's a `SyntaxError` caught before the code even runs, since `#celsius` is only valid syntax inside a class that actually declares it.\n\n**4. Private methods — the same `#` syntax works for methods, not just fields.**\n```js\nclass Vault {\n  #secret = \"hidden\";\n  #reveal() {\n    return this.#secret;\n  }\n  peek() {\n    return this.#reveal();\n  }\n}\nconst v = new Vault();\nconsole.log(v.peek());\nconsole.log(typeof v.reveal);\n```\nOutput:\n```\nhidden\nundefined\n```\n`#reveal()` is a fully genuine private method — callable from inside the class (as `peek()` does), completely absent from the outside (`v.reveal` is `undefined`, not even recognized as a name, let alone callable). This is a real, structural way to have internal helper logic a class relies on without it ever being part of its public interface.\n\n**5. A subclass cannot access a parent's private field directly — only through the parent's own methods.**\n```js\nclass Base {\n  #x = 1;\n  getX() {\n    return this.#x;\n  }\n}\nclass Sub extends Base {\n  test() {\n    return this.getX();\n  }\n}\nconst s = new Sub();\nconsole.log(s.test());\n```\nOutput:\n```\n1\n```\n`Sub` genuinely cannot write `this.#x` itself — `#x` was declared inside `Base`'s class body only, and a private field is scoped to the exact class that declares it, not inherited the way public methods are. `Sub` has to go through `Base`'s own public `getX()` method instead — real encapsulation, not just a style guideline.\n\n**6. Private fields combine naturally with `static` — private, class-level state.**\n```js\nclass Config {\n  static #instances = 0;\n  constructor() {\n    Config.#instances++;\n  }\n  static get count() {\n    return Config.#instances;\n  }\n}\nnew Config();\nnew Config();\nconsole.log(Config.count);\n```\nOutput:\n```\n2\n```\n`#instances` is both private (invisible outside `Config`) and static (one shared value, not per-instance) — a genuinely common, real pattern for tracking something like a total instance count without exposing a writable public property that outside code could corrupt.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a leading-underscore property name (`_celsius`) provides the same protection as a real `#celsius` private field.** It doesn't — `_celsius` is visible everywhere, in `Object.keys`, in `JSON.stringify`, freely writable from outside. It's purely a convention signaling \"please don't touch this\"; `#celsius` is a real, engine-enforced restriction.\n- **Writing a getter with a side effect that surprises callers**, since `obj.property` syntax makes it look like a plain, cheap field read. A getter can run arbitrary code — keep that code's cost and behavior genuinely matching what a property read implies.\n- **Forgetting a setter must be paired with a getter of the same name to read the property back normally** — defining only `set celsius(...)` without a matching `get celsius()` leaves reading `.celsius` returning `undefined`.\n- **Expecting a subclass to directly access a parent's private field.** As Example 5 showed, this isn't possible at all — a subclass must go through the parent's own public methods, exactly like code entirely outside the class hierarchy would.\n\n### How this connects\n\nChapter 6.2 (Creating Custom Errors) often pairs private fields with custom error classes for internal state a caller shouldn't touch directly. This chapter closes out Part Five's core object-model coverage — Chapter 5.6 shifts to a completely different topic: how JavaScript actually handles concurrency and timing.\n\n### Quick recap\n\n- Getters (`get name() {...}`) and setters (`set name(value) {...}`) let plain `obj.property` syntax run real code underneath — validating, computing, or transforming a value.\n- `#name` fields and methods are genuinely private — invisible to `Object.keys`, `JSON.stringify`, and `hasOwnProperty`, and a syntax error (not just a runtime one) to reference from outside any class that declares them.\n- A private field is scoped to the exact class that declares it — a subclass must go through the parent's own public methods to reach it, never directly.\n- `static` combines naturally with `#` for private, class-level (not per-instance) state."}, {"id": "5.6", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 6, "slug": "the-event-loop-javascripts-concurrency-model", "fullTitle": "The Event Loop & JavaScript's Concurrency Model", "title": "The Event Loop & JavaScript's Concurrency Model", "md": "### Why this matters\n\n`setTimeout` has appeared in passing since Chapter 4.6, always with callback code that somehow runs \"later.\" This chapter finally explains exactly what \"later\" means — a genuinely important mental model for understanding `Promise` (Chapter 5.8) and `async`/`await` (Chapter 5.9), both of which are built directly on top of the mechanism covered here.\n\n### The core idea\n\nJavaScript runs on a **single thread** — only one piece of your code ever executes at any given instant, never two pieces truly simultaneously. Asynchronous behavior (timers, I/O, promises) doesn't use extra threads; instead, callbacks wait in queues and the **event loop** picks them up only once the currently-running code has completely finished. There are two such queues that matter here, and they aren't treated equally: the **microtask queue** (promise callbacks, `queueMicrotask`) is always fully drained before the **macrotask queue** (`setTimeout`, `setInterval`, I/O callbacks) gets to run even one callback.\n\n### Examples\n\n**1. Synchronous code always runs to completion first — verified directly.**\n```js\nconsole.log(\"1: sync start\");\nsetTimeout(() => console.log(\"2: timeout 0ms\"), 0);\nPromise.resolve().then(() => console.log(\"3: promise microtask\"));\nconsole.log(\"4: sync end\");\n```\nOutput:\n```\n1: sync start\n4: sync end\n3: promise microtask\n2: timeout 0ms\n```\nEven with a `0`ms delay, the `setTimeout` callback runs dead last — `setTimeout(fn, 0)` never means \"immediately\"; it means \"as soon as possible, but only after all currently-running synchronous code, and after the entire microtask queue, are empty.\" The promise callback runs before the timeout callback specifically because microtasks are drained completely before the next macrotask is picked up.\n\n**2. Microtasks queued during another microtask still jump ahead of any macrotask — the precise ordering rule.**\n```js\nconsole.log(\"start\");\nsetTimeout(() => console.log(\"timeout\"), 0);\nPromise.resolve()\n  .then(() => console.log(\"promise 1\"))\n  .then(() => console.log(\"promise 2\"));\nqueueMicrotask(() => console.log(\"queueMicrotask\"));\nconsole.log(\"end\");\n```\nOutput:\n```\nstart\nend\npromise 1\nqueueMicrotask\npromise 2\ntimeout\n```\n`promise 1`'s callback and `queueMicrotask`'s callback were both already sitting in the microtask queue before any synchronous code finished, so they run in that order first. Running `promise 1`'s callback is what causes `promise 2`'s callback to be *added* to the queue — by then `queueMicrotask`'s callback is already ahead of it, so `promise 2` runs third, not second. Only once the microtask queue is completely empty — including this newly-added entry — does `timeout` (the one and only macrotask here) finally get to run.\n\n**3. JavaScript really is single-threaded — a long-running synchronous operation blocks everything, including a timer that's already \"due.\"**\n```js\nconsole.log(\"A\");\nsetTimeout(() => console.log(\"B - timeout\"), 100);\nconst start = Date.now();\nwhile (Date.now() - start < 300) {\n  // busy loop, blocking the thread\n}\nconsole.log(\"C - after busy loop, took\", Date.now() - start, \"ms\");\n```\nOutput:\n```\nA\nC - after busy loop, took 300 ms\nB - timeout\n```\nThe timeout was scheduled for 100ms, but the synchronous busy loop occupies the single thread for a full 300ms first — `B - timeout` genuinely cannot run until the loop finishes and the thread is free, even though its 100ms had already elapsed. This is real, direct proof there's only one thread: a scheduled callback can never interrupt currently-running code, no matter how \"overdue\" it becomes.\n\n**4. `setTimeout` vs. `setImmediate` — a case Node's own documentation declines to guarantee, even though it was consistently reproducible here.**\n```js\nsetTimeout(() => console.log(\"timeout\"), 0);\nsetImmediate(() => console.log(\"immediate\"));\nPromise.resolve().then(() => console.log(\"promise\"));\nconsole.log(\"sync\");\n```\nOutput (run once):\n```\nsync\npromise\nimmediate\ntimeout\n```\n`sync` and `promise` are reliably in that order every run — the rules from Examples 1 and 2 apply exactly as expected. `timeout` before `immediate`, verified directly here across 20 consecutive runs on this book's own machine, was completely consistent every single time — no swap ever actually observed, despite it looking like the kind of thing that should vary. That consistency itself is worth being precise about: Node's own documentation explicitly states that, from the top level of the main module (outside any I/O callback), the relative order of a zero-delay `setTimeout` and `setImmediate` is **not guaranteed**, and depends on process performance — so a genuinely different machine, Node version, or system load could reorder these two, even though nothing here could make it happen. This is exactly the kind of claim worth taking directly from the documentation rather than a handful of consistent local runs, since \"it always happened this way for me\" is not the same thing as \"guaranteed.\" Inside an I/O callback specifically, by contrast, `setImmediate` is documented *and* verified here to run first, consistently, across 10 separate runs — a real, reliable distinction from the top-level case.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `setTimeout(fn, 0)` runs \"immediately,\" or before any other code.** As Example 1 showed, it runs after all synchronous code *and* the entire microtask queue — never sooner.\n- **Assuming promise callbacks and `setTimeout` callbacks are interchangeable or equally prioritized.** As Examples 1 and 2 showed, every microtask (including ones added *while* other microtasks are running) is drained before a single macrotask runs.\n- **Writing a long, blocking synchronous loop and expecting scheduled callbacks to fire on time anyway.** As Example 3 proved directly, nothing can interrupt currently-running synchronous code — a blocking operation delays every pending timer and promise callback for its entire duration.\n- **Relying on a specific order between `setTimeout(fn, 0)` and `setImmediate` at the top level of a script**, even if local testing seems to show a consistent result. As Example 4 showed, Node's own documentation explicitly declines to guarantee an order there — only inside an I/O callback is the order (`setImmediate` first) actually documented and reliable.\n\n### How this connects\n\nChapter 5.7 covers callbacks and the \"callback hell\" problem this concurrency model creates once several asynchronous operations need to happen in sequence. Chapter 5.8's `Promise` is built directly on the microtask queue introduced here, and Chapter 5.9's `async`/`await` is, underneath, still exactly this same event loop — just with dramatically more readable syntax on top of it.\n\n### Quick recap\n\n- JavaScript runs on a single thread — only one piece of code executes at any instant, and nothing can interrupt currently-running synchronous code.\n- The **microtask queue** (promises, `queueMicrotask`) is always fully drained before the **macrotask queue** (`setTimeout`, `setInterval`, I/O) runs even one callback.\n- A microtask added *while another microtask is running* still runs before any macrotask — the microtask queue keeps getting drained until it's genuinely empty.\n- `setTimeout(fn, 0)` means \"as soon as possible after everything else,\" never \"immediately.\"\n- A long, blocking synchronous operation delays every pending callback, proving directly that JavaScript is single-threaded.\n- `setTimeout` vs. `setImmediate` ordering is officially undocumented/unguaranteed at the top level of a script in Node, even when local testing shows a consistent result — only reliable, and only in `setImmediate`'s favor, inside an I/O callback."}, {"id": "5.7", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 7, "slug": "callbacks-callback-hell", "fullTitle": "Callbacks & Callback Hell", "title": "Callbacks & Callback Hell", "md": "### Why this matters\n\nBefore `Promise` and `async`/`await` existed, callbacks were *the* way to handle asynchronous work in JavaScript — and they're still everywhere in older code, some Node APIs, and event handlers. Understanding them directly, including their real, genuine problems, is exactly what makes Chapter 5.8's `Promise` feel like a solution to a concrete pain point rather than an arbitrary new API to memorize.\n\n### The core idea\n\nA **callback** is simply a function passed as an argument, to be called later — usually once some asynchronous operation (a timer, a file read, a network request) finishes. Node.js standardized a specific convention for this: an **error-first callback**, called as `callback(error, result)`, where `error` is `null` on success and a real `Error` object on failure.\n\n### Examples\n\n**1. A basic callback — asynchronous \"fetching\" that reports back later.**\n```js\nfunction fetchUser(id, callback) {\n  setTimeout(() => {\n    callback(null, { id, name: \"Ada\" });\n  }, 10);\n}\nfetchUser(1, (err, user) => {\n  if (err) {\n    console.log(\"error:\", err);\n    return;\n  }\n  console.log(\"got user:\", user);\n});\n```\nOutput:\n```\ngot user: { id: 1, name: 'Ada' }\n```\n`fetchUser` doesn't return the user directly — it *can't*, since the result isn't ready yet when the function returns (Chapter 5.6's event loop already explained why). Instead, it accepts a `callback` and invokes it later, once the (simulated) asynchronous work finishes.\n\n**2. The error-first convention in action — a real failure case.**\n```js\nfunction readFileLike(path, callback) {\n  setTimeout(() => {\n    if (path === \"missing.txt\") {\n      callback(new Error(\"file not found\"));\n    } else {\n      callback(null, \"file contents\");\n    }\n  }, 10);\n}\nreadFileLike(\"missing.txt\", (err, data) => {\n  if (err) {\n    console.log(\"error-first caught:\", err.message);\n    return;\n  }\n  console.log(\"data:\", data);\n});\n```\nOutput:\n```\nerror-first caught: file not found\n```\n`callback(new Error(\"file not found\"))` passes a real error as the *first* argument, with `data` left as `undefined` entirely — the caller's job is always to check `err` first, before trusting anything else the callback received. This exact convention is used throughout Node's built-in `fs` module (Chapter 7.5).\n\n**3. \"Callback hell\" — the real, concrete problem with chaining several async steps.**\n```js\nfunction step1(cb) { setTimeout(() => cb(null, \"step1 done\"), 5); }\nfunction step2(prev, cb) { setTimeout(() => cb(null, prev + \" -> step2 done\"), 5); }\nfunction step3(prev, cb) { setTimeout(() => cb(null, prev + \" -> step3 done\"), 5); }\n\nstep1((err1, r1) => {\n  if (err1) return console.log(err1);\n  step2(r1, (err2, r2) => {\n    if (err2) return console.log(err2);\n    step3(r2, (err3, r3) => {\n      if (err3) return console.log(err3);\n      console.log(\"pyramid result:\", r3);\n    });\n  });\n});\n```\nOutput:\n```\npyramid result: step1 done -> step2 done -> step3 done\n```\nThe result is correct, but notice the shape: each step nests one level deeper inside the previous one's callback, and each level repeats its own `if (errN) return ...` check. This rightward-drifting nesting is exactly what \"callback hell\" (also called the \"pyramid of doom\") refers to — genuinely correct code that becomes progressively harder to read, indent, and modify as more steps are added. Chapter 5.8's `Promise` chaining and Chapter 5.9's `async`/`await` both exist specifically to solve this real, structural problem.\n\n**4. A genuine, real hazard: a callback that's *sometimes* synchronous and *sometimes* asynchronous.**\n```js\nfunction inconsistentSync(x, cb) {\n  if (x > 0) {\n    cb(x * 2);\n  } else {\n    setTimeout(() => cb(0), 0);\n  }\n}\nconsole.log(\"before call\");\ninconsistentSync(5, (result) => console.log(\"callback result:\", result));\nconsole.log(\"after call\");\n```\nOutput:\n```\nbefore call\ncallback result: 10\nafter call\n```\nBecause `x` was `5` here, `cb` ran *immediately*, synchronously — so `\"callback result: 10\"` printed *between* `\"before call\"` and `\"after call\"`, not after both, the way Examples 1 through 3's genuinely asynchronous callbacks would have. A function whose callback is sometimes synchronous and sometimes asynchronous, depending on its input, is a real, well-known source of subtle bugs (sometimes called \"releasing Zalgo\") — code that assumes consistent ordering can break depending on which path was taken. A well-designed callback-based function should always be consistently one or the other, never both.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to check `err` first in an error-first callback**, and using `data` as though it's always valid — a real bug the moment an operation actually fails.\n- **Forgetting to `return` after handling an error inside a callback**, letting the success-path code run anyway right after it. Each `return console.log(errN)` in Example 3 is doing exactly this job — stopping execution before falling through.\n- **Nesting callbacks more deeply than genuinely necessary**, as in Example 3, when the steps could instead be restructured with named intermediate functions, or (better, in new code) rewritten with `Promise`/`async`-`await` entirely.\n- **Writing a function whose callback is sometimes called synchronously and sometimes asynchronously**, as Example 4 demonstrated. This is a real, subtle source of bugs — always pick one and stay consistent, even if it means wrapping a synchronous path in a `setTimeout(fn, 0)` or `queueMicrotask` to force it asynchronous.\n\n### How this connects\n\nChapter 5.8 introduces `Promise`, which replaces this chapter's error-first-callback convention and nesting problem with `.then()` chaining and unified error handling via `.catch()`. Chapter 5.9's `async`/`await` then builds directly on `Promise` to make asynchronous code read almost exactly like the synchronous code from earlier chapters — the actual, concrete fix for Example 3's pyramid shape.\n\n### Quick recap\n\n- A callback is a function passed to be called later, typically once asynchronous work completes.\n- Node's error-first convention calls `callback(error, result)` — always check `error` first before trusting `result`.\n- Nesting several callback-based async steps produces \"callback hell\" — correct but progressively harder to read, indent, and maintain.\n- A callback-based function should always be consistently synchronous or consistently asynchronous — never sometimes one, sometimes the other, since callers can't reliably code against unpredictable ordering."}, {"id": "5.8", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 8, "slug": "promises", "fullTitle": "Promises", "title": "Promises", "md": "### Why this matters\n\nChapter 5.7 showed callback hell directly — genuinely correct code that nests deeper with every additional asynchronous step. `Promise`, introduced in ES2015, is the real, standard fix: it represents \"a value that will exist later\" as an actual object, one that can be chained, combined, and have its errors handled in one place instead of at every nesting level.\n\n### The core idea\n\nA `Promise` represents an asynchronous operation's eventual result. It has exactly three states: **pending** (not yet settled), **fulfilled** (succeeded, with a value), or **rejected** (failed, with a reason) — and once it moves out of pending, into either fulfilled or rejected, it's **settled permanently**; it can never change state again. `.then(onFulfilled)` and `.catch(onRejected)` register callbacks for those outcomes, and — critically — `.then()` itself returns a *new* Promise, which is what makes chaining possible.\n\n### Examples\n\n**1. Creating and consuming a basic Promise.**\n```js\nfunction fetchUser(id) {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n      if (id < 0) {\n        reject(new Error(\"invalid id\"));\n      } else {\n        resolve({ id, name: \"Ada\" });\n      }\n    }, 10);\n  });\n}\nfetchUser(1).then((user) => console.log(\"got:\", user));\nfetchUser(-1).catch((err) => console.log(\"caught:\", err.message));\n```\nOutput:\n```\ngot: { id: 1, name: 'Ada' }\ncaught: invalid id\n```\n`new Promise((resolve, reject) => {...})` takes an \"executor\" function that calls `resolve(value)` on success or `reject(error)` on failure — exactly the two API surface points a `Promise` exposes to whoever creates it. `.then()` runs only on fulfillment; `.catch()` runs only on rejection.\n\n**2. A Promise settles exactly once — further `resolve`/`reject` calls are silently ignored.**\n```js\nconst p = new Promise((resolve, reject) => {\n  resolve(\"first\");\n  resolve(\"second\");\n  reject(new Error(\"ignored too\"));\n});\np.then((v) => console.log(\"settled once with:\", v));\n```\nOutput:\n```\nsettled once with: first\n```\nOnly the *first* call to `resolve` or `reject` has any effect — every call after that, including the `reject`, is silently ignored. This is a deliberate, real design guarantee: a Promise's outcome, once determined, is genuinely final.\n\n**3. Chaining — each `.then()` returns a new Promise, and return values pass through.**\n```js\nfetchUser(2)\n  .then((user) => {\n    console.log(\"step 1:\", user.name);\n    return user.id * 10;\n  })\n  .then((val) => {\n    console.log(\"step 2:\", val);\n    return val + 1;\n  })\n  .then((val) => console.log(\"step 3:\", val));\n```\nOutput:\n```\nstep 1: Ada\nstep 2: 20\nstep 3: 21\n```\nWhatever a `.then()` callback `return`s becomes the fulfilled value of the *next* `.then()` in the chain — this is the real mechanism that replaces Chapter 5.7's nested pyramid with a flat, readable sequence, one step per line instead of one level deeper per step.\n\n**4. Error propagation — a thrown error (or rejection) skips straight ahead to the nearest `.catch()`.**\n```js\nfetchUser(2)\n  .then((user) => {\n    throw new Error(\"something broke in step 1\");\n  })\n  .then((val) => {\n    console.log(\"this should never run:\", val);\n  })\n  .catch((err) => console.log(\"chain caught:\", err.message));\n```\nOutput:\n```\nchain caught: something broke in step 1\n```\nThrowing inside a `.then()` callback rejects the Promise it returns — every subsequent `.then()` in the chain is skipped entirely, and control jumps straight to the nearest `.catch()`. This is the concrete fix for Chapter 5.7's repeated `if (err) return ...` checks at every nesting level: one `.catch()` at the end handles a failure from *any* step in the chain.\n\n**5. `Promise.all` — waits for every promise, but rejects immediately on the first failure.**\n```js\nPromise.all([fetchUser(1), fetchUser(2)])\n  .then((users) => console.log(\"all resolved:\", users.map(u => u.name)));\nPromise.all([fetchUser(1), fetchUser(-1)])\n  .catch((err) => console.log(\"all rejected fast:\", err.message));\n```\nOutput:\n```\nall resolved: [ 'Ada', 'Ada' ]\nall rejected fast: invalid id\n```\n`Promise.all` fulfills with an array of *all* results, in the same order as the input, once every promise succeeds. But the moment any single promise in the array rejects, the whole `Promise.all` rejects immediately with that one reason — the other still-pending promises' eventual results (success or failure) are simply discarded.\n\n**6. `Promise.allSettled` — never short-circuits, reports every outcome individually.**\n```js\nPromise.allSettled([fetchUser(1), fetchUser(-1)])\n  .then((results) => console.log(\"allSettled:\", results.map(r => r.status)));\n```\nOutput:\n```\nallSettled: [ 'fulfilled', 'rejected' ]\n```\nUnlike `Promise.all`, `allSettled` always waits for *every* promise to settle, one way or another, and reports each individually as `{ status: \"fulfilled\", value }` or `{ status: \"rejected\", reason }` — genuinely useful when you need every result regardless of some failing, rather than \"all or nothing.\"\n\n**7. `Promise.race` — settles as soon as the *first* promise settles, whichever it is.**\n```js\nPromise.race([\n  new Promise((res) => setTimeout(() => res(\"slow\"), 50)),\n  new Promise((res) => setTimeout(() => res(\"fast\"), 5)),\n]).then((winner) => console.log(\"race winner:\", winner));\n```\nOutput:\n```\nrace winner: fast\n```\nWhichever promise settles first — fulfilled or rejected — determines `Promise.race`'s own outcome; the rest are simply ignored once that happens.\n\n**8. `.finally()` — runs regardless of success or failure, for cleanup that must always happen.**\n```js\nfetchUser(1)\n  .then((u) => console.log(\"finally-test got:\", u.name))\n  .finally(() => console.log(\"finally always runs\"));\n```\nOutput:\n```\nfinally-test got: Ada\nfinally always runs\n```\n`.finally()`'s callback receives no argument at all — it can't see the value or the error — and runs regardless of which happened, exactly matching a `finally` block's role in `try`/`catch`/`finally` (Chapter 6.1).\n\n**9. An unhandled rejection is a real problem, not a silent one — Node crashes the process over it.**\n```js\nPromise.reject(new Error(\"nobody catches this\"));\nconsole.log(\"this line still runs, since it's synchronous\");\n```\nOutput:\n```\nthis line still runs, since it's synchronous\n/path/to/file.js:1\nPromise.reject(new Error(\"nobody catches this\"));\n               ^\n\nError: nobody catches this\n    at ...\nNode.js v24.18.0\n```\nThe synchronous `console.log` after the rejected promise still runs fine — the rejection itself is only detected once the event loop finishes the current synchronous code and checks for unhandled rejections. But verified directly here: Node then reports the error and **terminates the process with a non-zero exit code**, exactly as if the error had been thrown and never caught. A rejected Promise with no `.catch()` anywhere is a real, serious bug, not a silently-swallowed one.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting a `.catch()` anywhere in a Promise chain**, assuming a failure will simply be ignored. As Example 9 showed directly, Node crashes the entire process over an unhandled rejection — always terminate a chain with `.catch()`, even if only to log the error.\n- **Reaching for `Promise.all` when some failures are expected and shouldn't cancel the whole operation.** As Examples 5 and 6 contrasted, `Promise.all` rejects fast on the first failure; `Promise.allSettled` is almost always the right choice when partial success is meaningful.\n- **Forgetting that `return` inside a `.then()` callback matters.** As Example 3 showed, the returned value becomes the next `.then()`'s input — forgetting to `return` (falling off the end of an arrow function's block body, for instance) silently passes `undefined` along instead.\n- **Assuming a Promise's state can change after it settles.** As Example 2 showed, only the first `resolve`/`reject` call has any effect — a Promise's outcome, once determined, is genuinely permanent.\n\n### How this connects\n\nChapter 5.9's `async`/`await` is built directly on top of everything in this chapter — it's syntax that makes working with Promises read like ordinary synchronous code, without changing the underlying mechanism at all. Chapter 6.1's `try`/`catch`/`finally` is the direct synchronous parallel to this chapter's `.then()`/`.catch()`/`.finally()`.\n\n### Quick recap\n\n- A `Promise` has exactly three states — pending, fulfilled, or rejected — and settles permanently once it leaves pending.\n- `.then()` returns a new Promise, enabling chaining; a returned value becomes the next step's input, and a thrown error skips ahead to the nearest `.catch()`.\n- `Promise.all` rejects fast on the first failure; `Promise.allSettled` always waits for every promise and reports each outcome individually.\n- `Promise.race` settles as soon as the first promise in the group does, whichever it is.\n- `.finally()` always runs, regardless of success or failure, with no access to the value or error.\n- An unhandled promise rejection is a real, serious problem — verified directly, Node crashes the process over one."}, {"id": "5.9", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 9, "slug": "async-await", "fullTitle": "`async`/`await`", "title": "`async`/`await`", "md": "### Why this matters\n\nChapter 5.8's Promise chains are a real improvement over Chapter 5.7's callback pyramids, but `.then()` chains still don't read quite like ordinary code. `async`/`await`, added in ES2017, is syntax built directly on top of Promises that lets asynchronous code read almost exactly like the synchronous code from every earlier chapter — no new concurrency model, just a dramatically more readable way to write the one Chapter 5.6 already explained.\n\n### The core idea\n\nMarking a function `async` makes it always return a Promise, automatically — even if its `return` statement gives back a plain value. Inside an `async` function, `await expression` pauses that function (and only that function) until the Promise settles, then either gives back its fulfilled value directly or throws its rejection reason as a normal, catchable error.\n\n### Examples\n\n**1. Basic `async`/`await` — the same fetch from Chapter 5.8, without `.then()`.**\n```js\nfunction fetchUser(id) {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n      if (id < 0) reject(new Error(\"invalid id\"));\n      else resolve({ id, name: \"Ada\" });\n    }, 10);\n  });\n}\nasync function main() {\n  const user = await fetchUser(1);\n  console.log(\"got:\", user);\n}\nmain();\n```\nOutput:\n```\ngot: { id: 1, name: 'Ada' }\n```\n`await fetchUser(1)` pauses `main()` until the Promise resolves, then `user` is simply the resolved value — no `.then()` callback needed at all. This reads exactly like ordinary sequential code, even though `fetchUser` is genuinely asynchronous underneath.\n\n**2. An `async` function always returns a Promise — verified directly, even for a plain return value.**\n```js\nasync function getFive() {\n  return 5;\n}\nconsole.log(getFive());\ngetFive().then((v) => console.log(\"resolved value:\", v));\n```\nOutput:\n```\nPromise { 5 }\nresolved value: 5\n```\n`getFive()` itself is `Promise { 5 }`, not `5` — calling any `async` function always gives back a Promise, automatically wrapping whatever it `return`s. This is a real, uncond
