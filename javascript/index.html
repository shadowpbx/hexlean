itional rule: even a function that never uses `await` at all still returns a Promise the moment it's declared `async`.\n\n**3. Error handling — `try`/`catch` around `await` catches a rejection as an ordinary error.**\n```js\nasync function main2() {\n  try {\n    const user = await fetchUser(-1);\n    console.log(\"never reached:\", user);\n  } catch (err) {\n    console.log(\"caught via try/catch:\", err.message);\n  }\n}\nmain2();\n```\nOutput:\n```\ncaught via try/catch: invalid id\n```\nA rejected Promise, when `await`ed, throws its reason as a genuine, catchable error — ordinary `try`/`catch` (Chapter 6.1) handles it directly, with no separate `.catch()` method needed. This is the real payoff of `async`/`await`'s design: error handling looks exactly like synchronous error handling.\n\n**4. A real, common performance mistake: sequential `await` when the work could run in parallel.**\n```js\nasync function sequential() {\n  const start = Date.now();\n  const a = await fetchUser(1);\n  const b = await fetchUser(2);\n  console.log(\"sequential took\", Date.now() - start, \"ms\");\n}\nasync function parallel() {\n  const start = Date.now();\n  const [a, b] = await Promise.all([fetchUser(1), fetchUser(2)]);\n  console.log(\"parallel took\", Date.now() - start, \"ms\");\n}\nsequential().then(parallel);\n```\nOutput:\n```\nsequential took 19 ms\nparallel took 10 ms\n```\n`sequential()` awaits each 10ms fetch one after another, so the *second* `await` doesn't even start until the first one finishes — the total is roughly the sum, confirmed here at 19ms. `parallel()` starts both fetches immediately (`Promise.all`, Chapter 5.8), then awaits both together — the total is roughly the *slower* of the two, confirmed here at 10ms. Awaiting independent operations one at a time, out of habit, is a real, easy-to-introduce performance bug; `Promise.all` combined with a single `await` is the fix whenever the operations don't actually depend on each other.\n\n**5. `await` on a plain, non-Promise value simply passes it through.**\n```js\nasync function awaitPlain() {\n  const val = await 42;\n  console.log(\"awaited plain value:\", val);\n}\nawaitPlain();\n```\nOutput:\n```\nawaited plain value: 42\n```\n`await` works on any value, not just Promises — a non-Promise value is treated as if it were already a resolved Promise, so `await 42` simply gives back `42` (after still yielding to the event loop once, since `await` always involves at least one microtask tick). This means it's always safe to `await` a value even when you're not sure in advance whether it's a Promise.\n\n**6. Throwing directly inside an `async` function produces a rejected Promise — no different from calling `reject()`.**\n```js\nasync function alwaysThrows() {\n  throw new Error(\"thrown directly\");\n}\nalwaysThrows().catch((err) => console.log(\"caught thrown-not-rejected:\", err.message));\n```\nOutput:\n```\ncaught thrown-not-rejected: thrown directly\n```\nAn ordinary `throw` inside an `async` function doesn't crash anything or need a `try`/`catch` at the call site — it's automatically converted into a rejected Promise, catchable with `.catch()` exactly like Chapter 5.8's explicit `reject()` calls. This symmetry (throw behaves like reject, return behaves like resolve) is exactly what makes `async` functions compose naturally with the rest of the Promise ecosystem from Chapter 5.8.\n\n### ⚠️ Common Mistakes\n\n- **Awaiting independent asynchronous operations one at a time out of habit.** As Example 4 showed directly, this can nearly double real wall-clock time for no benefit — use `Promise.all` (Chapter 5.8) plus a single `await` whenever the operations don't depend on each other's results.\n- **Forgetting that `async` functions always return a Promise**, and trying to use their return value directly as though it were synchronous. As Example 2 showed, `getFive()` is `Promise { 5 }`, not `5` — it must be `await`ed or `.then()`-ed.\n- **Using `await` outside an `async` function in code that's actually running as CommonJS** — this is a real `SyntaxError` (\"await is only valid in async functions and the top level bodies of modules\"), verified directly against a file explicitly forced into CommonJS. Top-level `await` is genuinely allowed in ES modules (Chapter 6.3) — and worth knowing precisely: recent Node versions (this book's v24.18.0 included) auto-detect a plain `.js` file as an ES module the moment it contains syntax only valid there, like a bare top-level `await`, *if* no `package.json` says otherwise — so the exact same line can silently succeed as accidental ESM in one project layout and throw this exact error in another. Never rely on this auto-detection; state a file's module type explicitly (Chapter 6.4).\n- **Forgetting `try`/`catch` around an `await` that might reject**, letting a rejection propagate up as an unhandled rejection instead — exactly Chapter 5.8's Example 9 crash, reachable this way too if nothing up the call chain ever catches it.\n\n### How this connects\n\nChapter 6.1's `try`/`catch`/`finally` is exactly the mechanism Example 3 relied on — this chapter assumes that chapter's syntax is already familiar. Chapter 7.8 (`fetch` & Working with APIs) is where `async`/`await` gets used constantly and naturally, on genuinely real asynchronous work rather than this chapter's simulated `setTimeout`-based examples.\n\n### Quick recap\n\n- `async` functions always return a Promise, automatically — even a plain `return value` becomes `Promise { value }`.\n- `await` pauses an `async` function (only that function) until a Promise settles, giving back its value directly or throwing its rejection as an ordinary, catchable error.\n- Ordinary `try`/`catch` around an `await` handles rejections exactly like synchronous errors — no separate `.catch()` method needed.\n- Sequential `await`s on independent operations run one after another, wasting time; `Promise.all` plus one `await` runs them concurrently instead.\n- A `throw` inside an `async` function becomes a rejected Promise automatically, symmetric with `return` becoming a resolved one."}, {"id": "5.10", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 10, "slug": "iterators-the-iteration-protocol", "fullTitle": "Iterators & the Iteration Protocol", "title": "Iterators & the Iteration Protocol", "md": "### Why this matters\n\n`for...of` (Chapter 3.3), spread (Chapter 2.9), destructuring (Chapter 2.8), and `Array.from` all work on arrays, strings, `Map`s, and `Set`s — but not on plain objects. This isn't arbitrary: all of those features rely on one shared, well-defined protocol, and this chapter shows exactly what it is, including how to make your own objects work with all of them at once.\n\n### The core idea\n\nAn object is **iterable** if it has a method at the special key `Symbol.iterator` that returns an **iterator** — an object with a `.next()` method returning `{ value, done }` each time it's called: `done: false` with the next value, until there's nothing left, at which point `done: true`. Every language feature that \"loops over\" something — `for...of`, spread, destructuring, `Array.from` — is really just calling this protocol underneath.\n\n### Examples\n\n**1. Calling an array's built-in iterator manually — seeing the raw protocol.**\n```js\nconst arr = [\"a\", \"b\", \"c\"];\nconst it = arr[Symbol.iterator]();\nconsole.log(it.next());\nconsole.log(it.next());\nconsole.log(it.next());\nconsole.log(it.next());\n```\nOutput:\n```\n{ value: 'a', done: false }\n{ value: 'b', done: false }\n{ value: 'c', done: false }\n{ value: undefined, done: true }\n```\n`arr[Symbol.iterator]()` returns an iterator object; calling `.next()` on it repeatedly walks through the array one value at a time. The fourth call, past the end, returns `{ value: undefined, done: true }` — this exact shape is what `for...of` is checking on every iteration underneath, deciding to stop the moment `done` is `true`.\n\n**2. Building a custom iterable — an object that `for...of` and spread can both use.**\n```js\nconst range = {\n  from: 1,\n  to: 3,\n  [Symbol.iterator]() {\n    let current = this.from;\n    const last = this.to;\n    return {\n      next() {\n        if (current <= last) {\n          return { value: current++, done: false };\n        }\n        return { value: undefined, done: true };\n      }\n    };\n  }\n};\nconsole.log([...range]);\nfor (const n of range) {\n  console.log(\"range value:\", n);\n}\n```\nOutput:\n```\n[ 1, 2, 3 ]\nrange value: 1\nrange value: 2\nrange value: 3\n```\n`range` is a plain object — nothing special about it except one method at the computed key `[Symbol.iterator]` (Chapter 2.7's computed property names, put to real use here). That single method is enough to make spread (`[...range]`) and `for...of` both work correctly, producing `1, 2, 3` exactly as if `range` were a real array.\n\n**3. A plain object without `Symbol.iterator` is genuinely not iterable — confirmed with real errors.**\n```js\nconst plainObj = { a: 1, b: 2 };\ntry {\n  [...plainObj];\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\ntry {\n  for (const x of plainObj) {}\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nTypeError plainObj is not iterable\nTypeError plainObj is not iterable\n```\nThis is exactly why an ordinary `{ a: 1, b: 2 }` object can't be spread with `[...obj]` or looped with `for...of` — it simply doesn't have a `Symbol.iterator` method at all. (Object spread, `{...obj}`, and `for...in`, Chapter 2.9 and 3.3, are separate mechanisms that don't rely on this protocol — this is specifically about the *iteration* protocol, not property enumeration.)\n\n**4. Confirming which built-ins are iterable — and which aren't.**\n```js\nconsole.log(typeof new Map()[Symbol.iterator]);\nconsole.log(typeof new Set()[Symbol.iterator]);\nconsole.log(typeof \"hi\"[Symbol.iterator]);\nconsole.log(typeof [][Symbol.iterator]);\nconsole.log(typeof plainObj[Symbol.iterator]);\n```\nOutput:\n```\nfunction\nfunction\nfunction\nfunction\nundefined\n```\n`Map`, `Set`, strings, and arrays all genuinely have a `Symbol.iterator` method — real, direct confirmation of why Chapter 2.10's `for...of` over a `Map`'s entries, and Chapter 2.2's `for...of` over a string's characters, both just work. `plainObj[Symbol.iterator]` being `undefined` confirms Example 3's error precisely.\n\n**5. `Array.from` and destructuring both use this same protocol — not just `for...of` and spread.**\n```js\nconsole.log(Array.from(range));\nconst [first, second] = range;\nconsole.log(first, second);\n```\nOutput:\n```\n[ 1, 2, 3 ]\n1 2\n```\n`Array.from` works on `range` directly, not because it recognizes anything array-specific about it, but because it calls its `Symbol.iterator` — exactly the same mechanism as Example 2. Array destructuring (Chapter 2.8) does too: `const [first, second] = range` calls `.next()` twice on `range`'s iterator, taking the first two values, and simply stops there without exhausting the rest.\n\n### ⚠️ Common Mistakes\n\n- **Trying to spread or `for...of` a plain object, expecting it to iterate over its properties.** As Example 3 showed, this throws a real `TypeError` — use `Object.entries()`/`Object.keys()`/`Object.values()` (Chapter 2.7) or `for...in` (Chapter 3.3) for plain objects instead.\n- **Forgetting an iterator's `.next()` must return `{ value, done }`, not just a bare value.** A custom iterator returning the wrong shape silently breaks every language feature relying on the protocol — `for...of`, spread, destructuring, and `Array.from` all expect this exact structure.\n- **Assuming any object with a `.next()` method somewhere is automatically iterable.** The `.next()` method must be returned from a method specifically at the `Symbol.iterator` key — a `.next()` method sitting directly on the object itself, with no `Symbol.iterator`, is not recognized by `for...of` at all.\n- **Not realizing destructuring only pulls as many values as it needs.** As Example 5 showed, `const [first, second] = range` calls `.next()` exactly twice, leaving the iterator's remaining state (here, the value `3`) never produced at all.\n\n### How this connects\n\nChapter 5.11 (Generators) introduces `function*`, a dramatically simpler way to write exactly the kind of custom iterator built by hand in Example 2 — this chapter's manual version is what makes generators' automatic `Symbol.iterator` handling feel like the genuine convenience it is.\n\n### Quick recap\n\n- An object is iterable if it has a `Symbol.iterator` method returning an iterator — an object whose `.next()` method returns `{ value, done }` repeatedly, until `done` is `true`.\n- `for...of`, spread, `Array.from`, and destructuring all rely on this exact same protocol underneath.\n- A plain object has no `Symbol.iterator` by default, and genuinely throws a `TypeError` if you try to spread or `for...of` it directly.\n- `Map`, `Set`, strings, and arrays are all natively iterable — confirmed directly by checking `typeof obj[Symbol.iterator]`."}, {"id": "5.11", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "objects, prototypes & asynchronous JavaScript — the heart of the language", "chapNum": 11, "slug": "generators", "fullTitle": "Generators", "title": "Generators", "md": "### Why this matters\n\nChapter 5.10's custom iterable required writing the `{ value, done }` protocol out by hand — real, working code, but genuinely tedious for anything beyond a simple counter. **Generator functions** (`function*`) let you write the exact same logic as ordinary, readable, paused-and-resumed code, with JavaScript handling the iterator protocol automatically underneath.\n\n### The core idea\n\nA function declared with `function*` doesn't run its body immediately when called — it returns a **generator object** instead, which is itself both an iterator *and* iterable. Each call to `.next()` runs the function's body until it hits a `yield` expression, pauses there (returning that value), and picks up exactly where it left off on the *next* `.next()` call.\n\n### Examples\n\n**1. A basic generator — pausing and resuming with `yield`.**\n```js\nfunction* countUp(from, to) {\n  for (let i = from; i <= to; i++) {\n    yield i;\n  }\n}\nconst gen = countUp(1, 3);\nconsole.log(gen.next());\nconsole.log(gen.next());\nconsole.log(gen.next());\nconsole.log(gen.next());\n```\nOutput:\n```\n{ value: 1, done: false }\n{ value: 2, done: false }\n{ value: 3, done: false }\n{ value: undefined, done: true }\n```\nCalling `countUp(1, 3)` doesn't run the loop at all yet — it returns a generator object. Each `.next()` call resumes the paused function body from exactly where it stopped, running until the next `yield` (or the function ending, which is what produces the final `done: true`). This is the identical `{ value, done }` shape from Chapter 5.10 — produced automatically here, with no hand-written iterator object at all.\n\n**2. A generator object is genuinely both an iterator and an iterable — confirmed directly.**\n```js\nconsole.log(typeof countUp(1, 3)[Symbol.iterator]);\nconsole.log([...countUp(1, 3)]);\nfor (const n of countUp(5, 7)) {\n  console.log(\"for-of gen value:\", n);\n}\n```\nOutput:\n```\nfunction\n[ 1, 2, 3 ]\nfor-of gen value: 5\nfor-of gen value: 6\nfor-of gen value: 7\n```\nA generator has its own `Symbol.iterator` method (which just returns itself) — so it works directly with spread and `for...of`, exactly like the built-ins from Chapter 5.10's Example 4.\n\n**3. Rewriting Chapter 5.10's manual `range` iterable as a generator — dramatically less code.**\n```js\nconst range2 = {\n  from: 1,\n  to: 3,\n  *[Symbol.iterator]() {\n    for (let i = this.from; i <= this.to; i++) {\n      yield i;\n    }\n  }\n};\nconsole.log([...range2]);\n```\nOutput:\n```\n[ 1, 2, 3 ]\n```\nCompare this to Chapter 5.10's Example 2 — the same behavior, but the `Symbol.iterator` method is now a generator function (`*[Symbol.iterator]() {...}`) instead of one that manually builds and returns a `{ next() {...} }` object. No manual `done`/`value` bookkeeping at all — an ordinary `for` loop with `yield` inside it does the entire job.\n\n**4. `yield` is a two-way channel — `.next(value)` sends a value *back into* the paused generator.**\n```js\nfunction* echoBack() {\n  const first = yield \"first yield\";\n  console.log(\"received:\", first);\n  const second = yield \"second yield\";\n  console.log(\"received:\", second);\n  return \"done value\";\n}\nconst echo = echoBack();\nconsole.log(echo.next());\nconsole.log(echo.next(\"hello\"));\nconsole.log(echo.next(\"world\"));\nconsole.log(echo.next());\n```\nOutput:\n```\n{ value: 'first yield', done: false }\nreceived: hello\n{ value: 'second yield', done: false }\nreceived: world\n{ value: 'done value', done: true }\n{ value: undefined, done: true }\n```\nThe first `.next()` (with no argument) starts the generator and runs to the first `yield`. Each *subsequent* `.next(value)` call both resumes execution *and* becomes the result of the `yield` expression that was paused — `echo.next(\"hello\")` makes `first` equal `\"hello\"` inside the generator. A `return` (like `\"done value\"`) becomes the final `{ value, done: true }` result; a fifth call, after the generator has finished, simply returns `{ value: undefined, done: true }` again.\n\n**5. Generators can be genuinely infinite — real laziness, producing values only on demand.**\n```js\nfunction* naturals() {\n  let n = 1;\n  while (true) {\n    yield n++;\n  }\n}\nconst nat = naturals();\nconsole.log(nat.next().value, nat.next().value, nat.next().value);\n```\nOutput:\n```\n1 2 3\n```\n`naturals()`'s `while (true)` loop never actually runs to completion — nothing bad happens, because the function's body only advances one step per `.next()` call. This is impossible to do safely with an eagerly-computed array (there's no way to build an infinite array), but entirely natural with a generator, since values are produced strictly one at a time, on demand.\n\n**6. `yield*` delegates to another iterable — flattening a generator-of-generators into one sequence.**\n```js\nfunction* inner() {\n  yield \"a\";\n  yield \"b\";\n}\nfunction* outer() {\n  yield 1;\n  yield* inner();\n  yield 2;\n}\nconsole.log([...outer()]);\n```\nOutput:\n```\n[ 1, 'a', 'b', 2 ]\n```\n`yield* inner()` doesn't yield the generator object itself — it yields *every value inner() produces*, in order, as if those `yield`s were written directly inside `outer()`. This is the standard way to compose generators out of smaller ones without manually looping over the inner one yourself.\n\n**7. `.return()` terminates a generator early — and `finally` blocks still run.**\n```js\nfunction* withCleanup() {\n  try {\n    yield 1;\n    yield 2;\n    yield 3;\n  } finally {\n    console.log(\"cleanup ran\");\n  }\n}\nconst g2 = withCleanup();\nconsole.log(g2.next());\nconsole.log(g2.return(\"stopped early\"));\n```\nOutput:\n```\n{ value: 1, done: false }\ncleanup ran\n{ value: 'stopped early', done: true }\n```\nCalling `.return(value)` acts as though a `return value` statement had been reached at the currently-paused `yield` — genuinely terminating the generator immediately, but still running any `finally` block in scope first, exactly like an ordinary early `return` would (Chapter 6.1 covers `try`/`finally` in full). This matters in practice: `for...of` calls `.return()` automatically on a generator's iterator if the loop is exited early (via `break`, for instance), so cleanup code in a `finally` block is never skipped.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting that calling a generator function doesn't run its body at all** — it only returns a generator object; nothing inside runs until `.next()` is called the first time, as Example 1 showed.\n- **Writing an infinite generator and then spreading it (`[...naturals()]`) or using a plain `for...of` with no `break`**, expecting it to somehow stop on its own. As Example 5 showed, the generator itself never terminates — code consuming it must limit how many values it takes.\n- **Assuming the value passed to the *first* `.next()` call goes anywhere.** As Example 4 showed, the first `.next()` call only starts the generator running up to the first `yield` — a value passed to it is simply discarded, since there's no paused `yield` yet to receive it.\n- **Forgetting `yield*` yields the delegate's *values*, not the delegate generator object itself.** As Example 6 showed, `outer()`'s output is the flattened sequence `1, 'a', 'b', 2` — not `1`, the `inner()` generator object, then `2`.\n\n### How this connects\n\nThis closes out Part Five's coverage of JavaScript's object and iteration model. Chapter 6.1 picks up `try`/`catch`/`finally` in full detail — the exact mechanism Example 7 relied on for cleanup — and Part Seven's real-world APIs occasionally return async iterators, a genuinely natural extension of everything covered here combined with Chapter 5.9's `async`/`await`.\n\n### Quick recap\n\n- A `function*` returns a generator object instead of running immediately — each `.next()` call resumes its body until the next `yield` or the function ends.\n- A generator object is both an iterator and an iterable, so it works directly with `for...of`, spread, and everything else from Chapter 5.10.\n- `yield` is two-way: a value passed to `.next(value)` becomes the result of the paused `yield` expression that resumes.\n- Generators can be genuinely infinite, since values are produced lazily, one `.next()` call at a time — never eagerly computed all at once.\n- `yield*` delegates to another iterable, yielding each of its values in turn rather than the iterable itself.\n- `.return()` terminates a generator early while still running any `finally` block in scope — exactly what `for...of` calls automatically on an early `break`."}, {"id": "6.1", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 1, "slug": "error-handling-try-catch-finally", "fullTitle": "Error Handling: `try`/`catch`/`finally`", "title": "Error Handling: `try`/`catch`/`finally`", "md": "### Why this matters\n\nErrors have appeared throughout this book — `TypeError`, `RangeError`, `ReferenceError`, `SyntaxError` — always shown as something that crashes the program unless handled. This chapter covers `try`/`catch`/`finally` properly: the real mechanism for catching an error, recovering from it, and guaranteeing cleanup code runs regardless of what happened.\n\n### The core idea\n\nCode inside a `try` block runs normally; if it throws, execution jumps immediately to the matching `catch` block, skipping the rest of `try`. A `finally` block, if present, always runs afterward — whether `try` succeeded, `try` threw and `catch` handled it, or even if `catch` itself throws — making it the reliable place for cleanup that must happen no matter what.\n\n### Examples\n\n**1. Basic `try`/`catch` — a real parsing failure, caught cleanly.**\n```js\ntry {\n  JSON.parse(\"{invalid json\");\n} catch (err) {\n  console.log(err.constructor.name, err.message);\n}\n```\nOutput:\n```\nSyntaxError Expected property name or '}' in JSON at position 1 (line 1 column 2)\n```\n`JSON.parse` (Chapter 7.4 covers it fully) throws a real `SyntaxError` on malformed input — caught here instead of crashing the program, with the exact error object available as `err`.\n\n**2. `finally` runs even when `try` returns — verified directly, in the correct order.**\n```js\nfunction withFinally() {\n  try {\n    return \"from try\";\n  } finally {\n    console.log(\"finally ran even though try returned\");\n  }\n}\nconsole.log(withFinally());\n```\nOutput:\n```\nfinally ran even though try returned\nfrom try\n```\n`finally`'s `console.log` runs *before* `withFinally()`'s return value is actually handed back to the caller — `return \"from try\"` doesn't immediately exit the function; it schedules that return, runs `finally` first, and only then completes the return. This ordering is precisely why `finally` is trustworthy for cleanup: it's genuinely guaranteed to run before the function truly exits.\n\n**3. `finally` runs even if `catch` itself throws a new error.**\n```js\nfunction finallyOnRethrow() {\n  try {\n    throw new Error(\"original\");\n  } catch (e) {\n    throw new Error(\"rethrown: \" + e.message);\n  } finally {\n    console.log(\"finally ran on rethrow too\");\n  }\n}\ntry {\n  finallyOnRethrow();\n} catch (e) {\n  console.log(\"outer caught:\", e.message);\n}\n```\nOutput:\n```\nfinally ran on rethrow too\nouter caught: rethrown: original\n```\n`catch`'s new `throw` doesn't skip `finally` — it still runs first, and only afterward does the new error propagate outward to the surrounding `try`/`catch`. `finally` genuinely always runs, regardless of how the code inside `try`/`catch` exits.\n\n**4. A real, easy-to-miss surprise: a `return` inside `finally` silently overrides a `return` from `try`.**\n```js\nfunction finallyOverridesReturn() {\n  try {\n    return \"try value\";\n  } finally {\n    return \"finally value\";\n  }\n}\nconsole.log(finallyOverridesReturn());\n```\nOutput:\n```\nfinally value\n```\n`\"try value\"` is never actually returned — `finally`'s own `return` statement completely replaces it. This is legal, real JavaScript behavior, but genuinely surprising and almost always a bug when it happens by accident; a `finally` block should generally be reserved for cleanup (closing a file, releasing a resource), never for `return`, `break`, or `continue` statements of its own.\n\n**5. The `catch` binding is optional — for when you don't need the error object itself.**\n```js\ntry {\n  throw new Error(\"no binding needed\");\n} catch {\n  console.log(\"caught without binding the error\");\n}\n```\nOutput:\n```\ncaught without binding the error\n```\n`catch` without `(err)` (an ES2019 addition) is valid when you just need to know *that* something failed, without needing the error object's details — genuinely common for a fallback path that doesn't care why the primary approach failed.\n\n**6. Distinguishing error types with `instanceof` — handling each kind differently.**\n```js\nfunction mightFail(x) {\n  if (x < 0) throw new RangeError(\"x must be non-negative\");\n  if (typeof x !== \"number\") throw new TypeError(\"x must be a number\");\n  return Math.sqrt(x);\n}\nfor (const val of [-1, \"str\", 4]) {\n  try {\n    console.log(\"result:\", mightFail(val));\n  } catch (e) {\n    if (e instanceof RangeError) {\n      console.log(\"range problem:\", e.message);\n    } else if (e instanceof TypeError) {\n      console.log(\"type problem:\", e.message);\n    } else {\n      throw e;\n    }\n  }\n}\n```\nOutput:\n```\nrange problem: x must be non-negative\ntype problem: x must be a number\nresult: 2\n```\n`instanceof` (Chapter 5.1) lets one `catch` block handle several distinct error types differently — genuinely important once a function can fail in more than one way for different reasons. The final `else { throw e; }` re-throws anything unrecognized rather than silently swallowing it — a real, deliberate practice: never catch an error type you don't actually know how to handle.\n\n**7. An `Error` object's real properties — `name`, `message`, and `stack`.**\n```js\ntry {\n  throw new Error(\"test error\");\n} catch (e) {\n  console.log(e.name);\n  console.log(e.message);\n  console.log(typeof e.stack);\n  console.log(e.stack.split(\"\\n\")[0]);\n}\n```\nOutput:\n```\nError\ntest error\nstring\nError: test error\n```\n`.name` and `.message` are the two properties used throughout this book so far; `.stack` is a real, engine-provided string (its exact multi-line format is not standardized across engines, so this book relies only on its first line, shown here, and its general presence — never its precise full format).\n\n**8. A real, important limit: `try`/`catch` does *not* catch an error thrown later, asynchronously.**\n```js\ntry {\n  setTimeout(() => {\n    throw new Error(\"async error, not caught by outer try\");\n  }, 0);\n} catch (e) {\n  console.log(\"this never runs:\", e.message);\n}\nconsole.log(\"sync code after try continues normally\");\n```\nOutput:\n```\nsync code after try continues normally\nError: async error, not caught by outer try\n    at Timeout._onTimeout (...)\n    ...\n```\n`try` only wraps the *synchronous* call to `setTimeout` itself — which succeeds immediately, scheduling the callback but throwing nothing. By the time the scheduled callback actually runs and throws (Chapter 5.6's event loop explains exactly when), the original `try` block has long since finished executing — there's no `try` left around it to catch anything. The error is genuinely uncaught, and (verified directly here) crashes the process. The real fix is to put the `try`/`catch` *inside* the callback itself, wrapping the code that actually throws.\n\n### ⚠️ Common Mistakes\n\n- **Wrapping an asynchronous callback's *scheduling* call in `try`/`catch`, expecting it to catch errors from inside the callback.** As Example 8 showed directly, it does not — the `try`/`catch` must be inside the callback itself.\n- **Using `return`, `break`, or `continue` inside a `finally` block.** As Example 4 showed, a `return` there silently discards whatever `try` was about to return — almost always an accidental bug rather than an intended one.\n- **Catching every error the same way, without checking its type.** As Example 6 showed, `instanceof` lets different error types be handled appropriately — and re-throwing an unrecognized type, rather than silently swallowing it, prevents real bugs from disappearing unnoticed.\n- **Relying on `.stack`'s exact format** for anything beyond casual debugging output — it's a real, useful string, but its precise multi-line layout isn't standardized across JavaScript engines.\n\n### How this connects\n\nChapter 6.2 builds on this directly, covering how to define and throw genuinely custom error types (extending `Error`, Chapter 5.4's Example 6) instead of relying only on the built-in ones used throughout this chapter. Chapter 5.9's `async`/`await` is exactly what makes Example 8's limitation avoidable in modern code — `try`/`catch` around an `await` genuinely does catch a rejected Promise, unlike a bare `setTimeout` callback.\n\n### Quick recap\n\n- `try`/`catch` runs `try`'s code, and jumps straight to `catch` the instant anything inside `try` throws.\n- `finally` always runs afterward — regardless of whether `try` succeeded, `catch` handled an error, or `catch` itself threw a new one.\n- A `return` inside `finally` silently overrides any pending `return` from `try` — a real, genuine surprise, best avoided.\n- `instanceof` lets one `catch` block handle different error types differently; re-throw anything genuinely unrecognized rather than swallowing it.\n- `try`/`catch` only catches errors thrown *synchronously* within it — an error thrown later, inside an asynchronous callback, is not caught by an enclosing `try`, and must be handled inside the callback itself."}, {"id": "6.2", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 2, "slug": "creating-custom-errors", "fullTitle": "Creating Custom Errors", "title": "Creating Custom Errors", "md": "### Why this matters\n\nThe built-in `Error`, `TypeError`, and `RangeError` are genuinely useful, but real applications usually need their own specific error types — a `ValidationError`, a `NotFoundError` — carrying extra information and distinguishable from each other with `instanceof` (Chapter 6.1's Example 6). Chapter 5.4 already showed `extends Error` works; this chapter covers doing it properly, for real use.\n\n### The core idea\n\nA custom error class `extends Error`, calls `super(message)` to set up the inherited `.message` and `.stack`, then sets `this.name` to its own class name so it's identifiable in logs and `.toString()` output — plus whatever extra properties (a field name, an HTTP status code) the specific error type needs to carry.\n\n### Examples\n\n**1. A basic custom error class, with an extra property.**\n```js\nclass ValidationError extends Error {\n  constructor(message, field) {\n    super(message);\n    this.name = \"ValidationError\";\n    this.field = field;\n  }\n}\n\nfunction validateAge(age) {\n  if (typeof age !== \"number\") {\n    throw new ValidationError(\"age must be a number\", \"age\");\n  }\n  if (age < 0) {\n    throw new ValidationError(\"age must be non-negative\", \"age\");\n  }\n  return age;\n}\n\ntry {\n  validateAge(-5);\n} catch (e) {\n  console.log(e.name, e.message, e.field);\n  console.log(e instanceof ValidationError);\n  console.log(e instanceof Error);\n}\n```\nOutput:\n```\nValidationError age must be non-negative age\ntrue\ntrue\n```\n`super(message)` (Chapter 5.4) sets up `.message` correctly, exactly as extending any other built-in class would. `this.name = \"ValidationError\"` is what makes `e.name` report the specific type rather than the generic `\"Error\"` every plain `Error` object reports by default. `.field` is a genuinely custom addition — any extra data a specific error type needs to carry, added the same way any class field would be.\n\n**2. Setting `.name` correctly also fixes `.toString()` and default console output.**\n```js\ntry {\n  validateAge(-5);\n} catch (e) {\n  console.log(e.toString());\n}\nconsole.log(new ValidationError(\"bad\", \"x\"));\n```\nOutput:\n```\nValidationError: age must be non-negative\nValidationError: bad\n    at ... (trimmed — Node's usual internal stack-trace lines)\n    ... {\n  field: 'x'\n}\n```\n`Error.prototype.toString()` builds its string from `.name` and `.message` together — `\"ValidationError: age must be non-negative\"`, not the generic `\"Error: ...\"` it would show without the `this.name` assignment. Logging the object directly also shows `ValidationError:` correctly — followed by the same full stack trace `console.log`-ing any real `Error` always shows (trimmed here for readability), then its own extra properties (`field`) that `Error` itself doesn't have, in a trailing `{ ... }` block.\n\n**3. A real error hierarchy — a shared base class, several specific subclasses.**\n```js\nclass AppError extends Error {\n  constructor(message, options) {\n    super(message, options);\n    this.name = this.constructor.name;\n  }\n}\nclass NotFoundError extends AppError {\n  constructor(resource) {\n    super(`${resource} not found`);\n    this.statusCode = 404;\n  }\n}\nclass UnauthorizedError extends AppError {\n  constructor() {\n    super(\"unauthorized\");\n    this.statusCode = 401;\n  }\n}\n\nfunction handleRequest(type) {\n  if (type === \"missing\") throw new NotFoundError(\"user\");\n  if (type === \"noauth\") throw new UnauthorizedError();\n  return \"ok\";\n}\n\nfor (const t of [\"missing\", \"noauth\", \"ok\"]) {\n  try {\n    console.log(handleRequest(t));\n  } catch (e) {\n    if (e instanceof AppError) {\n      console.log(`[${e.statusCode}] ${e.name}: ${e.message}`);\n    } else {\n      throw e;\n    }\n  }\n}\n```\nOutput:\n```\n[404] NotFoundError: user not found\n[401] UnauthorizedError: unauthorized\nok\n```\n`AppError` uses `this.constructor.name` instead of a hardcoded string — this correctly reports `\"NotFoundError\"` or `\"UnauthorizedError\"` automatically for whichever specific subclass actually threw, without each one needing to repeat its own `this.name = \"...\"` line. `catch (e) { if (e instanceof AppError) ... }` handles *any* subclass of `AppError` uniformly, exactly like Chapter 6.1's Example 6 pattern, but now organized around a real, shared hierarchy instead of unrelated built-in types.\n\n**4. `this.constructor.name` genuinely reports the specific subclass, confirmed directly.**\n```js\nconst nf = new NotFoundError(\"widget\");\nconsole.log(nf.name);\nconsole.log(nf instanceof NotFoundError, nf instanceof AppError, nf instanceof Error);\n```\nOutput:\n```\nNotFoundError\ntrue true true\n```\n`this.constructor` (Chapter 5.1) correctly points at `NotFoundError`, not `AppError` — even though `this.constructor.name` is set inside `AppError`'s own constructor, `this` is genuinely the `NotFoundError` instance being built, so `.constructor` resolves to the actual, specific class. `instanceof` confirms the full chain, exactly like Chapter 5.4's inheritance chapter.\n\n**5. The stack trace still correctly originates from the actual throw site.**\n```js\nfunction deepThrow() {\n  throw new NotFoundError(\"deep\");\n}\ntry {\n  deepThrow();\n} catch (e) {\n  console.log(e.stack.split(\"\\n\")[0]);\n  console.log(e.stack.split(\"\\n\")[1].includes(\"deepThrow\"));\n}\n```\nOutput:\n```\nNotFoundError: deep not found\ntrue\n```\n`.stack`'s first line correctly shows the custom name and message, and its second line correctly names `deepThrow` — the function that actually threw — confirming a custom error class doesn't disturb `Error`'s own real, built-in stack-capturing behavior.\n\n**6. `Error.cause` — the real, standard way (ES2022) to chain a lower-level error into a higher-level one, verified after finding and fixing a real bug in `AppError`'s constructor.**\n```js\ntry {\n  try {\n    JSON.parse(\"not json\");\n  } catch (lowLevel) {\n    throw new AppError(\"failed to process config\", { cause: lowLevel });\n  }\n} catch (e) {\n  console.log(e.message);\n  console.log(e.cause instanceof SyntaxError);\n  console.log(e.cause.message);\n}\n```\nOutput:\n```\nfailed to process config\ntrue\nUnexpected token 'o', \"not json\" is not valid JSON\n```\n`new Error(message, { cause })` accepts a second `options` argument whose `cause` becomes `.cause` on the resulting error — a real, standard way to preserve *why* a higher-level error happened, without losing the original lower-level one. Getting this working required a real fix: `AppError`'s `constructor(message, options)` (Example 3) must accept that second argument and pass it along to `super(message, options)` — an earlier version of this exact class that only wrote `super(message)`, dropping `options` entirely, silently discarded any `cause` passed to it, with `e.cause` coming back `undefined` instead of the real underlying error. Always forward a custom error class's second `options` argument to `super()` if `.cause` support matters.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to set `this.name`**, leaving every custom error reporting the generic `\"Error\"` in its `.toString()` and default console output instead of its real, specific type.\n- **Hardcoding `this.name = \"SpecificSubclass\"` in a shared base class**, rather than using `this.constructor.name` (Example 3) — the hardcoded version reports the wrong name for every subclass that doesn't override it.\n- **Defining a custom error's constructor with only `constructor(message)`, dropping a second `options` argument**, silently breaking `Error.cause` support the moment anything tries to pass one — exactly the real bug found and fixed in Example 6.\n- **Catching a broad base error type and treating every subclass identically** when the specific subclass (and its extra properties, like `.statusCode` in Example 3) actually matters for how the error should be handled.\n\n### How this connects\n\nThis closes out the language-level error-handling coverage that Chapter 6.1 began. Chapter 7.5 (File I/O) and Chapter 7.8 (`fetch` & APIs) are where custom error types like these get used constantly in realistic code, wrapping lower-level failures (a missing file, a failed network request) into meaningful, application-specific ones via `Error.cause`.\n\n### Quick recap\n\n- A custom error class extends `Error`, calls `super(message)`, and sets `this.name` so its specific type shows up correctly in `.toString()` and console output.\n- `this.constructor.name`, used in a shared base class, correctly reports whichever specific subclass actually threw — no repeated `this.name` assignment needed per subclass.\n- A real error hierarchy lets `catch (e) { if (e instanceof BaseError) ... }` handle any related subclass uniformly, while `instanceof` on the specific subclass still distinguishes further when needed.\n- `new Error(message, { cause })` chains a lower-level error into a higher-level one — but a custom error class's constructor must explicitly accept and forward that second `options` argument to `super()`, or `.cause` silently comes back `undefined`."}, {"id": "6.3", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 3, "slug": "modules-import-export-es-modules", "fullTitle": "Modules: `import`/`export` (ES Modules)", "title": "Modules: `import`/`export` (ES Modules)", "md": "### Why this matters\n\nEvery chapter so far has lived in one file. Real programs are organized across many — and ES Modules (`import`/`export`, ES2015) are the modern, standard way to split code across files while controlling exactly what each file exposes to the others. Chapter 5.9 already relied on one ES-module-only feature (top-level `await`) without fully explaining the module system it belongs to — this chapter does.\n\n### The core idea\n\nA file becomes an ES module by using `export` to expose specific values, and other files use `import` to bring them in by name. Node needs to be told a file is an ES module — either by naming it `.mjs`, or by setting `\"type\": \"module\"` in the nearest `package.json` (Chapter 6.4 compares this against the older CommonJS system directly).\n\n### Examples\n\n**1. Named exports and a default export, together in one module.**\n```js\n// math.mjs\nexport function add(a, b) {\n  return a + b;\n}\nexport function subtract(a, b) {\n  return a - b;\n}\nexport const PI = 3.14159;\nexport default function multiply(a, b) {\n  return a * b;\n}\n```\n```js\n// main.mjs\nimport multiply, { add, subtract, PI } from \"./math.mjs\";\nconsole.log(add(2, 3));\nconsole.log(subtract(5, 2));\nconsole.log(PI);\nconsole.log(multiply(4, 5));\n```\nOutput:\n```\n5\n3\n3.14159\n20\n```\n`export function`/`export const` are **named exports** — imported with `{ curly braces }`, matching the exported name exactly. `export default` marks the module's single primary export — imported without braces, under whatever name the importing file chooses (`multiply` here). A module can have any number of named exports, but at most one default.\n\n**2. `import * as` — grabbing every export, named and default, as properties of one object.**\n```js\nimport * as mathAll from \"./math.mjs\";\nconsole.log(mathAll.add(10, 10));\nconsole.log(mathAll.default(2, 2));\n```\nOutput:\n```\n20\n4\n```\n`mathAll` is an object with a property per named export, plus `.default` for the default export — genuinely useful when a module has many exports you want to reference together under one namespace, rather than listing each one individually.\n\n**3. Renaming an import with `as` — avoiding a name collision.**\n```js\nimport { add as plus } from \"./math.mjs\";\nconsole.log(plus(1, 1));\n```\nOutput:\n```\n2\n```\n`as` renames an imported binding locally — useful when two modules export something with the same name, or when a shorter/clearer local name is preferred. The same `as` syntax also works on the export side (`export { add as sum }`).\n\n**4. Top-level `await` genuinely works in a real ES module — no wrapping `async` function needed.**\n```js\nconsole.log(\"before\");\nawait new Promise((res) => setTimeout(res, 50));\nconsole.log(\"after top-level await in real ESM\");\n```\nOutput:\n```\nbefore\nafter top-level await in real ESM\n```\nThis is exactly the feature Chapter 5.9 flagged as risky to rely on accidentally — here, run in a genuine ES module (`.mjs`, or a `.js` file under `\"type\": \"module\"`), it's fully supported and intentional, not an accident of auto-detection.\n\n**5. A genuine gotcha: circular imports can produce a real, live `ReferenceError`.**\n```js\n// circular_a.mjs\nimport { b } from \"./circular_b.mjs\";\nexport const a = \"a-value\";\nconsole.log(\"in a.mjs, b is:\", b);\n```\n```js\n// circular_b.mjs\nimport { a } from \"./circular_a.mjs\";\nexport const b = \"b-value\";\nconsole.log(\"in b.mjs, a is:\", a);\n```\nRunning `node circular_a.mjs` throws:\n```\nReferenceError: Cannot access 'a' before initialization\n```\n`circular_a.mjs` imports from `circular_b.mjs`, which in turn imports back from `circular_a.mjs` — a genuine circular dependency. ES modules handle circular imports by creating \"live bindings\" ahead of time rather than failing outright, but a binding is only usable *after* the line that actually initializes it has run — here, `b.mjs` runs to completion (including trying to log `a`) *before* `a.mjs` ever reaches its own `export const a = \"a-value\"` line, so `a` is genuinely still in its temporal dead zone (Chapter 1.3) at that point. Circular imports are legal but genuinely fragile — restructuring to remove the cycle entirely is almost always the better fix over relying on careful ordering.\n\n### ⚠️ Common Mistakes\n\n- **Mixing up named and default import syntax.** A named export must be imported with `{ curly braces }` matching its exact name; a default export is imported without braces, under any local name — confusing the two is a very common early mistake.\n- **Forgetting to mark a file as an ES module at all** (no `.mjs` extension and no `\"type\": \"module\"` in `package.json`) before using `import`/`export` syntax — Chapter 6.4 covers exactly what happens instead (a real `SyntaxError`, since that syntax is invalid in CommonJS).\n- **Assuming a default export can be imported with the same name as it was declared with, everywhere, automatically.** A default import's local name is chosen freely by whoever imports it — `multiply` in Example 1 has no special meaning; a different file could import the same default export under a completely different name.\n- **Creating a circular dependency between two modules and being surprised by an ordering-dependent `ReferenceError`.** As Example 5 showed directly, this is a real, live failure mode — worth restructuring around rather than working around.\n\n### How this connects\n\nChapter 6.4 directly compares this chapter's ES Modules against the older CommonJS system (`require`/`module.exports`) used throughout this book's own scratch verification so far, including exactly what breaks when the two are mixed carelessly. Chapter 6.6 (Organizing a Multi-File Project) puts this chapter's `import`/`export` to practical use across a realistic, multi-file layout.\n\n### Quick recap\n\n- `export function`/`export const` create named exports, imported with `{ name }`; `export default` creates one primary export per module, imported without braces under any chosen name.\n- `import * as name` gathers every export (named and default-as-`.default`) into one namespace object.\n- `import { x as y }` renames an imported binding locally.\n- Top-level `await` is fully, intentionally supported in a genuine ES module — no wrapping `async` function required.\n- Circular imports are legal in ES modules but genuinely fragile — a binding used before the line that initializes it has actually run throws a real `ReferenceError`."}, {"id": "6.4", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 4, "slug": "commonjs-vs-es-modules", "fullTitle": "CommonJS vs. ES Modules", "title": "CommonJS vs. ES Modules", "md": "### Why this matters\n\nEvery scratch example in this book so far that used top-level `arguments`, `require`, or ran as a plain `.js` file without a `package.json` was actually using **CommonJS** — Node's original module system, older than ES Modules (Chapter 6.3) and still genuinely common in real, existing code. Knowing exactly how the two differ, and exactly what breaks when they're mixed, is essential for working in any real Node codebase.\n\n### The core idea\n\n**CommonJS** uses `require()` and `module.exports`, loads modules synchronously, and is Node's original, default system for a plain `.js` file with no other configuration. **ES Modules** use `import`/`export` (Chapter 6.3), load asynchronously, and require an explicit signal — a `.mjs` extension, or `\"type\": \"module\"` in the nearest `package.json` — before Node will treat a file that way. The two have different syntax, different rules, and (mostly) can't be mixed directly in the same file.\n\n### Examples\n\n**1. CommonJS in its natural form — `require` and `module.exports`.**\n```js\n// math.cjs\nfunction add(a, b) {\n  return a + b;\n}\nfunction subtract(a, b) {\n  return a - b;\n}\nmodule.exports = { add, subtract };\nmodule.exports.PI = 3.14159;\n```\n```js\n// main.cjs\nconst { add, subtract, PI } = require(\"./math.cjs\");\nconsole.log(add(2, 3));\nconsole.log(subtract(5, 2));\nconsole.log(PI);\n```\nOutput:\n```\n5\n3\n3.14159\n```\n`module.exports` is a single object that a CommonJS file builds up and hands back — `require()` returns that exact object directly, destructured (Chapter 2.8) here into the three names needed.\n\n**2. `require()` is genuinely synchronous, and Node caches every module after its first load.**\n```js\nconst s1 = require(\"./singleton.cjs\");\nconst s2 = require(\"./singleton.cjs\");\nconsole.log(s1 === s2);\nconsole.log(s1.increment());\nconsole.log(s2.increment());\n```\nOutput:\n```\ntrue\n1\n2\n```\n`s1 === s2` confirms `require()` returns the *identical* object on a second call — the module's code runs only once, ever, and every subsequent `require()` of the same file returns the same cached result. This is why `s1.increment()` and `s2.increment()` share the same underlying `counter` — they're genuinely the same object, not two separate copies.\n\n**3. Mixing syntaxes the wrong way — a real, exact `SyntaxError`.**\n```js\n// wrongsyntax.cjs\nimport { add } from \"./math.cjs\";\nconsole.log(add(1, 2));\n```\nRunning it:\n```\nSyntaxError: Cannot use import statement outside a module\n```\nA file Node treats as CommonJS (here, by its `.cjs` extension) simply doesn't understand `import` syntax at all — it's a parse-time error, not a runtime one, exactly as direct as trying to use any other invalid syntax.\n\n**4. The reverse mistake — `require` inside a genuine ES module.**\n```js\n// wrongway.js, with \"type\": \"module\" in package.json\nconst fs = require(\"fs\");\nconsole.log(fs);\n```\nRunning it:\n```\nReferenceError: require is not defined in ES module scope, you can use import instead\nThis file is being treated as an ES module because it has a '.js' file extension and '.../package.json' contains \"type\": \"module\". To treat it as a CommonJS script, rename it to use the '.cjs' file extension.\n```\n`require`, `module`, and `exports` simply don't exist as variables inside a real ES module — Node's own error message here is genuinely helpful, explaining exactly *why* the file was treated as a module and exactly how to fix it either way.\n\n**5. `__dirname`/`__filename` exist automatically in CommonJS — but not in ES Modules.**\n```js\n// in a .cjs file\nconsole.log(typeof __dirname, typeof __filename);\n```\nOutput:\n```\nstring string\n```\n```js\n// in a real ES module (.js under \"type\": \"module\")\nconsole.log(typeof __dirname);\n```\nOutput:\n```\nundefined\n```\nCommonJS automatically provides `__dirname` and `__filename` as part of its module-wrapper function (the same wrapper Chapter 4.2's `arguments` quirk came from). ES Modules don't have them at all — the standard replacement is `import.meta.url`, covered next.\n\n**6. `import.meta.url` — the ES Module replacement for knowing a file's own location.**\n```js\nconsole.log(typeof import.meta.url);\nconsole.log(import.meta.url.startsWith(\"file://\"));\n```\nOutput:\n```\nstring\ntrue\n```\n`import.meta.url` is a real, standard property available in every ES module, giving the current file's own URL (as a `file://` URL when run locally, rather than a plain path) — the closest ES-module equivalent to CommonJS's `__filename`.\n\n### ⚠️ Common Mistakes\n\n- **Using `import`/`export` syntax in a file Node is treating as CommonJS**, or `require()`/`module.exports` in a file it's treating as an ES module. As Examples 3 and 4 showed, both are real, immediate errors — with genuinely helpful messages pointing at the actual fix.\n- **Forgetting a project's module system is determined by file extension and `package.json`, not by which syntax you'd prefer to write.** `.mjs` is always an ES module, `.cjs` is always CommonJS, and a plain `.js` file follows the nearest `package.json`'s `\"type\"` field (defaulting to CommonJS if absent) — subject to the auto-detection nuance Chapter 5.9 already flagged as unreliable to depend on.\n- **Assuming `require()` re-runs a module's code on every call.** As Example 2 showed, it's cached after the first load — genuinely useful for shared state, but a real surprise if a module was expected to reset each time.\n- **Reaching for `__dirname`/`__filename` inside an ES module.** As Example 5 showed, they simply don't exist there — `import.meta.url` (Example 6) is the real, standard replacement.\n\n### How this connects\n\nChapter 6.5 (npm & `package.json`) covers exactly where the `\"type\": \"module\"` field lives and what else `package.json` controls. Chapter 6.6 (Organizing a Multi-File Project) applies whichever module system a real project has chosen consistently across every file in it.\n\n### Quick recap\n\n- CommonJS (`require`/`module.exports`) is Node's original, synchronous module system — still the default for a plain `.js` file with no `package.json` override.\n- ES Modules (`import`/`export`, Chapter 6.3) require an explicit signal: a `.mjs` extension, or `\"type\": \"module\"` in the nearest `package.json`.\n- The two syntaxes cannot be mixed in one file — using the wrong one throws a real, specific error naming the actual problem.\n- `require()` caches a module after its first load — every subsequent `require()` of the same file returns the identical object.\n- `__dirname`/`__filename` exist automatically in CommonJS; `import.meta.url` is the real ES-Module equivalent."}, {"id": "6.5", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 5, "slug": "npm-package-json", "fullTitle": "npm & `package.json`", "title": "npm & `package.json`", "md": "### Why this matters\n\nChapter 6.4 mentioned `package.json`'s `\"type\"` field controlling module system detection — but `package.json` does far more than that, and **npm** (Node's default package manager, installed alongside Node itself) is how real JavaScript projects pull in and manage code other people have written. Every serious Node project has both; this chapter covers what they actually do.\n\n### The core idea\n\n`package.json` is a project's manifest — its name, version, dependencies, and executable scripts, all in one JSON file. `npm install <package>` downloads a package and its own dependencies into a local `node_modules` folder, records it in `package.json`, and pins the *exact* versions actually installed in a companion `package-lock.json` file — so a second install, on a different machine, reproduces the identical dependency tree.\n\n### Examples\n\n**1. `npm init -y` creates a starting `package.json` — verified on this book's exact npm version.**\n```\n$ npm init -y\n```\nOutput (the created `package.json`):\n```json\n{\n  \"name\": \"js65\",\n  \"version\": \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"type\": \"commonjs\"\n}\n```\n`-y` accepts every default without prompting, genuinely useful for quickly scaffolding a project. Verified precisely on this book's npm 11.16.0: it writes an explicit `\"type\": \"commonjs\"` — worth knowing precisely, since older npm versions instead simply omitted the field, relying on Node's implicit CommonJS default (Chapter 6.4) rather than stating it outright.\n\n**2. Installing a real package — `node_modules`, `dependencies`, and `package-lock.json` all appear.**\n```\n$ npm install lodash.clonedeep\n```\nOutput:\n```\nadded 1 package, and audited 2 packages in 593ms\nfound 0 vulnerabilities\n```\n`package.json` gains a new `dependencies` entry:\n```json\n\"dependencies\": {\n  \"lodash.clonedeep\": \"^4.5.0\"\n}\n```\nAnd `package-lock.json` is created, recording the exact resolved version and its download checksum:\n```json\n\"node_modules/lodash.clonedeep\": {\n  \"version\": \"4.5.0\",\n  \"resolved\": \"https://registry.npmjs.org/lodash.clonedeep/-/lodash.clonedeep-4.5.0.tgz\",\n  \"integrity\": \"sha512-H5ZhCF25riFd9uB5UCkVKo61m3S/xZk1x4wA6yp/L3RFP6Z/eHH1ymQcGLo7J3GMPfm0V/7m1tryHuGVxpqEBQ==\",\n  ...\n}\n```\n`package.json` records the *range* of acceptable versions (`^4.5.0`); `package-lock.json` records the *exact* version actually installed — the real distinction between the two files. Both should genuinely be committed to version control; `node_modules` itself should not (it's fully reproducible from these two files via `npm install`).\n\n**3. Using the installed package — an ordinary `require`, exactly like any local file.**\n```js\nconst cloneDeep = require(\"lodash.clonedeep\");\nconst original = { a: { b: 1 } };\nconst copy = cloneDeep(original);\ncopy.a.b = 99;\nconsole.log(original.a.b, copy.a.b);\n```\nOutput:\n```\n1 99\n```\nAn installed package is required by its package name (no `./`), and Node automatically resolves that name by searching `node_modules` — genuinely no different in usage from the two-file `require` example in Chapter 6.4, just resolved from a different location. `cloneDeep` correctly performs a real deep copy (Chapter 2.9 covered why spread alone isn't enough for this).\n\n**4. The `^` in `\"^4.5.0\"` — a semantic-versioning range, not a fixed version.**\n\n`^4.5.0` means \"any version compatible with `4.5.0`\" — in npm's semantic versioning (semver) convention, that's any `4.x.y` release, but never `5.0.0` or later. A `^` range lets `npm install` (run fresh, without a lock file) pick up new bug-fix and feature releases automatically, while a committed `package-lock.json` (Example 2) keeps a *specific* project's actual installed version pinned and reproducible regardless of what's newest at install time.\n\n**5. `scripts` — named shell commands, run through `npm run`.**\n```json\n\"scripts\": {\n  \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\",\n  \"start\": \"node index.js\"\n}\n```\n```\n$ npm run start\n```\nOutput:\n```\n> js65@1.0.0 start\n> node index.js\n\n1 99\n```\n`npm run <name>` runs whatever shell command is registered under that name in `scripts` — a real, standard way to give a project consistent, memorized commands (`npm run build`, `npm run test`) regardless of what they actually do underneath. `start` and `test` are conventional enough to also work without the word `run` (`npm start`, `npm test`).\n\n**6. `devDependencies` — packages needed only for development, not for the project to actually run.**\n```\n$ npm install --save-dev cowsay\n```\n```json\n\"devDependencies\": {\n  \"cowsay\": \"^1.6.0\"\n}\n```\nA package installed with `--save-dev` (or `-D`) is recorded separately, in `devDependencies` rather than `dependencies` — the real, standard way to mark testing tools, linters (Chapter 6.8), and build tools as things a project needs *while working on it*, but not something an end user running the finished package needs installed at all.\n\n**7. `npx` — running a package's command-line tool without a separate global install.**\n```\n$ npx cowsay \"hi\"\n```\nOutput:\n```\n ____\n< hi >\n ----\n        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||\n```\n`npx` runs a package's executable directly — here, using the `cowsay` package just installed as a dev dependency — without needing it installed globally on the system or referenced through a `scripts` entry at all. This is the standard way to run one-off tools, including project generators and code scaffolding utilities.\n\n### ⚠️ Common Mistakes\n\n- **Committing `node_modules` to version control.** It's large, fully reproducible from `package.json` and `package-lock.json` via `npm install`, and genuinely shouldn't be tracked — a `.gitignore` entry for it is standard practice in essentially every real JavaScript project.\n- **Not committing `package-lock.json`.** Skipping it means every fresh `npm install` could resolve slightly different compatible versions over time — the opposite of the reproducibility Example 2 exists to guarantee.\n- **Confusing `dependencies` and `devDependencies`.** As Example 6 showed, only `dependencies` are needed for the project to actually run — a build tool or test framework genuinely belongs in `devDependencies` instead.\n- **Assuming a `^` version range in `package.json` is the exact version installed.** As Example 4 showed, it's a *range*; `package-lock.json` is what actually pins the specific version a given install produced.\n\n### How this connects\n\nChapter 6.6 (Organizing a Multi-File Project) builds directly on this chapter's `package.json` and local module resolution, structuring a real, multi-file project around them. Chapter 6.8 (Linting & Formatting) covers exactly the kind of tool that typically lives in `devDependencies`, run via a `scripts` entry.\n\n### Quick recap\n\n- `package.json` is a project's manifest — name, version, scripts, and dependencies, all in one file.\n- `npm install <package>` adds it to `dependencies` (or `devDependencies` with `--save-dev`) and downloads it into `node_modules`.\n- `package.json` records a version *range* (like `^4.5.0`); `package-lock.json` records the *exact* version actually installed, for reproducibility — both should be committed; `node_modules` should not.\n- `scripts` entries are run with `npm run <name>` (or just `npm start`/`npm test` for those two conventional names).\n- `npx` runs a package's command-line tool directly, without a separate global install."}, {"id": "6.6", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 6, "slug": "organizing-a-multi-file-project", "fullTitle": "Organizing a Multi-File Project", "title": "Organizing a Multi-File Project", "md": "### Why this matters\n\nChapters 6.3 through 6.5 covered `import`/`export`, CommonJS vs. ES Modules, and `npm`/`package.json` individually. This chapter puts them together into what a real, multi-file project's folder structure and import patterns actually look like — including two genuinely common, exact mistakes that only show up once a project has more than one or two files.\n\n### The core idea\n\nA typical Node project separates its own source code (often under `src/`) from installed dependencies (`node_modules/`, managed by `npm`), uses relative imports (`./`, `../`) between its own files, and often collects a folder's public exports into one **barrel file** (conventionally `index.js`) so other parts of the project can import from the folder itself rather than reaching into its individual files.\n\n### Examples\n\n**1. A small multi-file layout, with a barrel file re-exporting a folder's contents.**\n```\nproject/\n├── package.json\n└── src/\n    ├── index.js\n    └── utils/\n        ├── math.js\n        ├── strings.js\n        └── index.js\n```\n```js\n// src/utils/math.js\nexport function add(a, b) { return a + b; }\nexport function square(n) { return n * n; }\n```\n```js\n// src/utils/strings.js\nexport function shout(s) { return s.toUpperCase() + \"!\"; }\n```\n```js\n// src/utils/index.js — the barrel file\nexport * from \"./math.js\";\nexport * from \"./strings.js\";\n```\n```js\n// src/index.js\nimport { add, square, shout } from \"./utils/index.js\";\nconsole.log(add(2, 3));\nconsole.log(square(4));\nconsole.log(shout(\"hello\"));\n```\nOutput:\n```\n5\n16\nHELLO!\n```\n`export * from \"./math.js\"` re-exports every named export from `math.js` as if it were declared directly in `utils/index.js` — and since a folder path with an `index.js` inside it can be imported as `\"./utils/index.js\"`, callers get one clean import line reaching the whole `utils` folder's combined public surface, without needing to know it's actually split across two separate files internally.\n\n**2. A genuine, exact error: Node's ESM resolver requires the file extension — no automatic `.js` guessing.**\n```js\n// src/noext.js\nimport { add } from \"./utils/math\";\nconsole.log(add(1, 1));\n```\nRunning it:\n```\nError [ERR_MODULE_NOT_FOUND]: Cannot find module '.../src/utils/math' imported from '.../src/noext.js'\n```\nUnlike CommonJS's `require()` (which does try adding `.js` automatically), a genuine ES module import must include the real file extension — `\"./utils/math.js\"`, not `\"./utils/math\"`. This is a real, common source of confusion for anyone used to older CommonJS-style imports, or to tooling from other languages that omit extensions freely.\n\n**3. A genuine, exact error: two barrel-file re-exports with the same name conflict, and Node refuses to guess.**\n```js\n// src/utils/other.js\nexport function add(a, b, c) { return a + b + c; }\n```\n```js\n// src/utils/index2.js\nexport * from \"./math.js\";\nexport * from \"./other.js\";\n```\n```js\n// src/collision.js\nimport { add } from \"./utils/index2.js\";\nconsole.log(add(1, 2, 3));\n```\nRunning it:\n```\nSyntaxError: The requested module './utils/index2.js' contains conflicting star exports for name 'add'\n```\n`math.js` and `other.js` both export something named `add` — `export * from` combining both leaves a genuine ambiguity Node refuses to resolve silently (picking one arbitrarily could easily hide a real bug), throwing a specific, named `SyntaxError` at load time instead. The fix is always to rename one of the conflicting exports at its source, or re-export it explicitly under a different name (`export { add as addThree } from \"./other.js\"`) rather than relying on the wildcard for it.\n\n### ⚠️ Common Mistakes\n\n- **Omitting the file extension in a relative ES module import.** As Example 2 showed, this is a real, immediate `ERR_MODULE_NOT_FOUND` — always write the full `.js` (or `.mjs`) extension explicitly.\n- **Combining two `export * from` statements whose source modules happen to export the same name.** As Example 3 showed, this is a real, load-time `SyntaxError`, not a silent \"last one wins\" — resolve it by renaming at the source or re-exporting explicitly.\n- **Reaching directly into a folder's internal files from outside it**, bypassing its barrel file's `index.js` on a whim, once one exists. This works, but defeats the purpose of having a single, curated public entry point for that folder — consistency here matters more as a project grows.\n- **Letting a barrel file grow to re-export things nothing outside the folder actually needs**, turning it into an unclear, overly broad public surface rather than a deliberate, curated one.\n\n### How this connects\n\nChapter 8.4 (JavaScript Style: Naming, Formatting & Idioms) revisits project organization from a broader, stylistic angle, once more of the language's real-world tooling (Chapter 6.7's strict mode, Chapter 6.8's linting) has been covered. Chapter 9.1 (Designing a JavaScript Program From Scratch) puts this chapter's folder-structure patterns to use in a complete, realistic project layout.\n\n### Quick recap\n\n- A typical project structure separates its own source (`src/`) from `node_modules`, using relative imports between its own files.\n- A barrel file (`index.js`) re-exports a folder's public surface with `export * from \"./file.js\"`, letting other code import the folder as one unit.\n- A relative ES module import must include the real file extension explicitly — Node's ESM resolver does not guess it, unlike CommonJS's `require()`.\n- Two `export * from` statements re-exporting the same name from different files is a genuine, load-time `SyntaxError` — resolve the conflict explicitly rather than relying on it being silently picked for you."}, {"id": "6.7", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 7, "slug": "strict-mode", "fullTitle": "Strict Mode", "title": "Strict Mode", "md": "### Why this matters\n\n\"Strict mode\" has been referenced since Chapter 4.6, always as the safer, more predictable choice — `this` being `undefined` instead of the global object, constructor functions throwing instead of silently polluting global state. This chapter finally covers exactly what strict mode is, what it changes, and (genuinely good news) when it's already on by default.\n\n### The core idea\n\n`\"use strict\"` at the top of a file or function turns on a stricter set of JavaScript's rules — converting several silent, historically-dangerous behaviors into real, immediate errors instead. Every ES Module (Chapter 6.3) and every `class` body (Chapter 5.3) is automatically strict, with no `\"use strict\"` needed at all — it's genuinely only plain CommonJS scripts and function bodies that default to the older, \"sloppy mode\" behavior.\n\n### Examples\n\n**1. The exact bug from Chapter 4.6, revisited: an undeclared assignment silently creates a global variable — without strict mode.**\n```js\nfunction leaky() {\n  undeclaredVar = \"oops\";\n}\nleaky();\nconsole.log(typeof undeclaredVar, undeclaredVar);\n```\nOutput:\n```\nstring oops\n```\n`undeclaredVar` was never declared with `let`/`const`/`var` anywhere — in sloppy mode, assigning to it anyway simply creates a new global variable silently, with no warning at all. This is one of JavaScript's most infamous historical mistakes.\n\n**2. The identical code, with `\"use strict\"` — the same mistake, now a real, immediate error.**\n```js\n\"use strict\";\nfunction leaky() {\n  undeclaredVar = \"oops\";\n}\nleaky();\n```\nOutput:\n```\nReferenceError: undeclaredVar is not defined\n```\nThe exact same typo (forgetting `let`) is now caught immediately, at the moment it happens, instead of silently succeeding and creating a hard-to-trace bug somewhere else in a larger program later.\n\n**3. Duplicate function parameter names — silently allowed in sloppy mode, a real `SyntaxError` in strict mode.**\n```js\n// sloppy mode\nfunction noStrict(a, a) {\n  console.log(a);\n}\nnoStrict(1, 2);\n```\nOutput:\n```\n2\n```\n```js\n\"use strict\";\nfunction withStrict(a, a) {\n  console.log(a);\n}\n```\nOutput:\n```\nSyntaxError: Duplicate parameter name not allowed in this context\n```\nIn sloppy mode, `function noStrict(a, a)` is legal — the second `a` simply shadows the first, so only the last argument passed ever matters, silently discarding the first one entirely. Strict mode refuses to even parse this — a real, deliberate signal that a duplicate parameter name is essentially always a mistake, not an intentional pattern.\n\n**4. Assigning to a frozen object's property — silently ignored in sloppy mode, a real error in strict mode.**\n```js\n// sloppy mode\nconst obj = Object.freeze({ x: 1 });\nobj.x = 2;\nconsole.log(obj.x);\n```\nOutput:\n```\n1\n```\n```js\n\"use strict\";\nconst obj = Object.freeze({ x: 1 });\nobj.x = 2;\n```\nOutput:\n```\nTypeError: Cannot assign to read only property 'x' of object '#<Object>'\n```\n`Object.freeze()` makes an object's own properties genuinely unwritable — in sloppy mode, trying to write to one anyway is simply ignored, with `obj.x` quietly staying `1`. Strict mode throws instead, immediately surfacing that the assignment did nothing, exactly the kind of silent failure this book has flagged elsewhere as a real, common source of confusion.\n\n**5. Confirming a real ES Module is automatically strict — no `\"use strict\"` line needed at all.**\n```js\n// a .mjs file, no \"use strict\" anywhere\nfunction leaky() {\n  undeclaredVar = \"oops\";\n}\ntry {\n  leaky();\n} catch (e) {\n  console.log(e.constructor.name, e.message);\n}\n```\nOutput:\n```\nReferenceError undeclaredVar is not defined\n```\nExactly the same error as Example 2 — genuinely produced with no `\"use strict\"` directive present anywhere in the file, confirming ES Modules are strict by default. `class` bodies (Chapter 5.3) are strict the same way, even inside an otherwise-sloppy CommonJS file.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a plain CommonJS `.js` file is strict by default.** As Examples 1, 3, and 4 showed, it genuinely is not — `\"use strict\"` must be added explicitly at the top of the file to get these safety checks in a CommonJS script.\n- **Forgetting that a real ES Module and a `class` body are already strict**, and redundantly adding `\"use strict\"` inside them — harmless, but unnecessary, since both are strict unconditionally.\n- **Relying on sloppy mode's silent-failure behaviors as though they were intentional features** — a silently-created global variable (Example 1) or a silently-ignored frozen-property write (Example 4) are both real, historical accidents of the language's early design, not patterns worth depending on.\n- **Placing `\"use strict\"` somewhere other than the very first line of a file or function body.** It's a specially-recognized string literal only when it's the first statement — placed later, it's just an ordinary, inert string expression with no effect at all.\n\n### How this connects\n\nChapter 6.8 (Linting & Formatting) covers tools that catch many of these same categories of mistakes automatically, often going further than strict mode's own built-in checks. This chapter closes the loop on several behaviors flagged as strict-mode-dependent throughout Part Four and Five (Chapter 4.6's `this`, Chapter 5.1's constructor-without-`new`) — now fully explained, rather than referenced ahead of their proper coverage.\n\n### Quick recap\n\n- `\"use strict\"` as a file or function's first statement turns several silent, historically-dangerous behaviors into real, immediate errors instead.\n- An undeclared assignment (a missing `let`/`const`), a duplicate function parameter name, and an assignment to a frozen property are all silently allowed in sloppy mode, but real errors in strict mode.\n- ES Modules and `class` bodies are automatically strict — no `\"use strict\"` directive needed there at all.\n- Plain CommonJS scripts and ordinary function bodies default to sloppy mode unless `\"use strict\"` is added explicitly."}, {"id": "6.8", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring bigger programs", "chapNum": 8, "slug": "linting-formatting", "fullTitle": "Linting & Formatting", "title": "Linting & Formatting", "md": "### Why this matters\n\nStrict mode (Chapter 6.7) catches a handful of real, dangerous mistakes automatically — but there's a much wider category of problems (an unused variable, a loose `==` comparison, inconsistent spacing) that strict mode says nothing about at all. **Linters** and **formatters** are the standard, real-world tools that catch and fix these, and essentially every serious JavaScript project uses at least one of each.\n\n### The core idea\n\nA **linter** (ESLint is the standard one) analyzes code for real problems — unused variables, undeclared globals, loose equality, and much more — without changing how it looks. A **formatter** (Prettier is the standard one) does the opposite: it rewrites code's whitespace, quote style, and line breaks into one consistent style, without touching its actual logic at all. They solve genuinely different problems and are normally used together.\n\n### Examples\n\n**1. Installing and running ESLint — catching real problems in genuinely broken code.**\n```\n$ npm install --save-dev eslint\n```\nWith the configuration from Example 2 already in place as `eslint.config.js`:\n```js\n// bad.js\nconst unused = 5;\nif (x == 1) {\n  console.log(\"bad\");\n}\n```\n```\n$ npx eslint bad.js\n```\nOutput:\n```\nbad.js\n  1:7  warning  'unused' is assigned a value but never used  no-unused-vars\n  2:5  error    'x' is not defined                           no-undef\n  2:7  error    Expected '===' and instead saw '=='          eqeqeq\n\n✖ 3 problems (2 errors, 1 warning)\n```\nEach rule (`no-unused-vars`, `no-undef`, `eqeqeq`) is configured separately (Example 2) — `unused` being unused, `x` never being declared, and `==` instead of `===` (Chapter 2.1) are all real, genuine problems this catches automatically, before the code is ever run.\n\n**2. A minimal ESLint configuration, declaring which rules matter and which globals actually exist.**\n```js\n// eslint.config.js\nmodule.exports = [\n  {\n    languageOptions: {\n      globals: {\n        console: \"readonly\",\n        process: \"readonly\"\n      }\n    },\n    rules: {\n      \"no-unused-vars\": \"warn\",\n      \"no-undef\": \"error\",\n      \"eqeqeq\": \"error\",\n      \"semi\": \"error\"\n    }\n  }\n];\n```\nRules can be set to `\"error\"`, `\"warn\"`, or `\"off\"` — errors fail a lint run (a real, common thing to enforce in CI), warnings don't. `console` had to be declared as a known global explicitly — without it, ESLint has no way to know `console` is a real, provided global rather than an undeclared variable, and would flag it under `no-undef` too. Real projects typically use a shared, published config (like `eslint:recommended`, or a popular community preset) rather than listing every rule individually like this — this minimal version exists purely to show the mechanism clearly. `semi` (used in Example 3 next) is included here for that reason too.\n\n**3. ESLint's `--fix` — automatically correcting problems that have an unambiguous fix.**\n```js\n// fixable.js, before\nconst x=1\nlet y = 2;\n```\n```\n$ npx eslint fixable.js\n```\nOutput:\n```\nfixable.js\n  1:7   warning  'x' is assigned a value but never used  no-unused-vars\n  1:10  error    Missing semicolon                       semi\n  2:5   warning  'y' is assigned a value but never used  no-unused-vars\n\n✖ 3 problems (1 error, 2 warnings)\n  1 error and 0 warnings potentially fixable with the `--fix` option.\n```\n```\n$ npx eslint --fix fixable.js\n```\n`fixable.js`, after:\n```js\nconst x=1;\nlet y = 2;\n```\nOnly the missing semicolon was fixed automatically — a real, unambiguous correction. The two `no-unused-vars` warnings remain, since ESLint genuinely can't know whether an unused variable should be removed, renamed, or is actually a mistake elsewhere — some problems a linter finds require a human decision, not just a mechanical fix.\n\n**4. Prettier — reformatting genuinely messy code into one consistent style.**\n```js\n// messy.js, before\nconst obj={a:1,b:2,c:3};\nfunction foo(x,y){return x+y}\n```\n```\n$ npx prettier --write messy.js\n```\n`messy.js`, after:\n```js\nconst obj = { a: 1, b: 2, c: 3 };\nfunction foo(x, y) {\n  return x + y;\n}\n```\nPrettier added consistent spacing, expanded the function body onto multiple lines, and added a trailing semicolon — all purely stylistic changes; the code's actual behavior is completely unchanged. Prettier is deliberately **opinionated** — it has very few configuration options by design, on the philosophy that not having to argue over style choices (tabs vs. spaces, single vs. double quotes) is itself the real value, more than any specific choice being \"correct.\"\n\n### ⚠️ Common Mistakes\n\n- **Expecting a linter to catch every kind of bug.** As Example 1 showed, ESLint catches real, specific categories of problems (unused variables, loose equality, undeclared names) — it has no idea whether your algorithm is actually correct.\n- **Forgetting to declare a runtime's built-in globals** (`console`, `
