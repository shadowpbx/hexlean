\n**4. Key order is not guaranteed — verified directly, across repeated runs.**\n```powershell\n$h = @{ zebra = 1; apple = 2; mango = 3; banana = 4; cherry = 5 }\n$h.Keys -join \",\"\n```\nRun three separate times on this book's reference machine, the exact same code produced three different orders:\n```\nzebra,mango,apple,cherry,banana\napple,cherry,zebra,mango,banana\nbanana,apple,zebra,cherry,mango\n```\nAn ordinary hashtable is organized internally for fast lookup by key, not for remembering the order you added things — so never write code that depends on a plain hashtable's `.Keys` coming back in any particular order, insertion order included.\n\n**5. `[ordered]` — a hashtable that *does* remember insertion order.**\n```powershell\n$od = [ordered]@{ zebra = 1; apple = 2; mango = 3; banana = 4; cherry = 5 }\n$od.Keys -join \",\"\n```\nOutput, verified consistently:\n```\nzebra,apple,mango,banana,cherry\n```\nAdding `[ordered]` immediately before `@{ }` switches the underlying type to an `OrderedDictionary` (confirmed with `.GetType().Name`) — everything about reading and writing keys works identically to a plain hashtable, but `.Keys`, `.Values`, and iteration now reliably preserve the exact order things were added in. Reach for this the moment order matters — a configuration file's sections, a report's columns — rather than an ordinary hashtable.\n\n**6. Looping over a hashtable's keys.**\n```powershell\n$h = @{ a = 1; b = 2 }\nforeach ($k in $h.Keys) { \"$k = $($h[$k])\" }\n```\nOutput (order not guaranteed, per Example 4):\n```\nb = 2\na = 1\n```\n`foreach` gets its full, proper treatment in Chapter 3.3 — this is a preview of one of its most common real uses: walking every key-value pair in a hashtable.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a plain hashtable's keys come back in insertion order.** As Example 4 proved directly, they don't — reach for `[ordered]` (Example 5) the moment order actually matters.\n- **Reaching for a hashtable key that doesn't exist and not checking first.** It quietly returns `$null` rather than erroring — exactly the kind of silent problem Chapter 1.3 already warned about for plain variables. Use `.ContainsKey()` when a key's presence genuinely needs confirming.\n- **Confusing a hashtable's `@{ }` with an array's plain `1, 2, 3` or a script block's `{ }`.** All three use braces or look superficially similar; `@{ }` specifically means \"key-value pairs start here.\"\n- **Using `.KeyName` dot syntax with a key name stored in a variable.** `$h.$keyVar` doesn't do what it looks like — use `$h[$keyVar]` (bracket syntax) whenever the key itself is a variable, not a literal name you're typing directly.\n\n### How this connects\n\nHashtables are the foundation `[PSCustomObject]` builds on directly in the very next chapter — in fact, the most common way to build one is by converting a hashtable into one. `[ordered]` reappears there too, for exactly the same reason: preserving the order properties should display in.\n\n### Quick recap\n\n- `@{ Key = value; ... }` creates a hashtable; access with `.Key` or `[\"Key\"]` — both work for reading, and either creates a new key when assigning.\n- `.Keys`, `.Values`, `.ContainsKey()`, and `.Remove()` are the core operations.\n- A plain hashtable's key order is **not guaranteed** — verified directly to vary run to run.\n- `[ordered]@{ ... }` creates an `OrderedDictionary` instead, which reliably preserves insertion order — use it whenever order matters.\n- A missing key returns `$null` silently rather than erroring — check with `.ContainsKey()` when that matters."}, {"id": "2.7", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 7, "slug": "pscustomobject-working-with-structured-data", "fullTitle": "`[PSCustomObject]`: Working with Structured Data", "title": "`[PSCustomObject]`: Working with Structured Data", "md": "### Why this matters\n\nChapter 1.6 showed that PowerShell's whole pipeline runs on real, structured objects, not text. Sooner or later, you'll want to build one of your own — a script's result that has several named fields, a row for a report, a return value with more than one piece of information. `[PSCustomObject]` is how.\n\n### The core idea\n\n`[PSCustomObject]` turns a hashtable into a genuine object with named properties, accessed with dot syntax:\n```powershell\n$person = [PSCustomObject]@{ Name = \"Alex\"; Age = 30 }\n```\n`$person.Name` and `$person.Age` now work exactly like properties on any built-in object Chapter 1.5's `Get-Member` showed you — because that's exactly what they are.\n\n### Examples\n\n**1. Creating one, and seeing how it displays.**\n```powershell\n$p = [PSCustomObject]@{ Name = \"Alex\"; Age = 30 }\n$p\n$p.Name\n```\nOutput:\n```\nName Age\n---- ---\nAlex  30\n\nAlex\n```\nCompare this to a plain hashtable's own display (Chapter 2.6) — a hashtable prints as a `Name`/`Value` list of its keys; a `[PSCustomObject]` prints as an actual table, with each key becoming a real column header. This is the difference between \"a bag of key-value pairs\" and \"a genuine object with properties,\" and it shows immediately in how PowerShell chooses to display it.\n\n**2. Property order is preserved — even without `[ordered]`, and this is worth knowing.**\n```powershell\n[PSCustomObject]@{ zebra = 1; apple = 2; mango = 3; banana = 4; cherry = 5 }\n```\nOutput, verified consistently across repeated runs:\n```\nzebra apple mango banana cherry\n----- ----- ----- ------ ------\n    1     2     3      4      5\n```\nThis might look like it contradicts Chapter 2.6's warning that a plain hashtable's key order isn't guaranteed — it doesn't. `[PSCustomObject]@{ ... }` is specifically recognized by PowerShell as its own pattern, and when it sees exactly this shape, it preserves the properties in the literal order you wrote them, regardless of what a plain hashtable alone would do. It's a genuinely convenient special case, but don't over-generalize from it: build a hashtable *first*, store it in a variable, and *then* cast it to `[PSCustomObject]` separately, and you're back to depending on that hashtable's own (unordered) key order. When in doubt, `[ordered]@{ ... }` (Chapter 2.6) before the cast removes any ambiguity.\n\n**3. Adding a property after creation, with `Add-Member`.**\n```powershell\n$p = [PSCustomObject]@{ Name = \"Alex\" }\n$p | Add-Member -NotePropertyName Age -NotePropertyValue 30\n$p\n```\nOutput:\n```\nName Age\n---- ---\nAlex  30\n```\nUseful when a property genuinely isn't known until after the object already exists — building up a result gradually rather than all at once.\n\n**4. An array of custom objects — this is what \"a table of data\" actually looks like in PowerShell.**\n```powershell\n$people = @(\n  [PSCustomObject]@{ Name = \"Alex\"; Age = 30 }\n  [PSCustomObject]@{ Name = \"Sam\"; Age = 25 }\n)\n$people\n$people | Where-Object { $_.Age -gt 26 }\n```\nOutput:\n```\nName Age\n---- ---\nAlex  30\nSam   25\n\nName Age\n---- ---\nAlex  30\n```\nThis is the exact same shape `Get-Process` or `Get-ChildItem` hand you — a list of objects, each with real properties — except you built it yourself. `Where-Object` (previewed in Chapter 1.6, covered fully in 5.1) filters it exactly the same way it filters any built-in cmdlet's output, because to PowerShell, there's no difference.\n\n### ⚠️ Common Mistakes\n\n- **Reaching for a plain hashtable when what's actually wanted is structured, dot-accessible data meant to flow through the pipeline.** A hashtable is a lookup table; a `[PSCustomObject]` is a real object with properties. If you're about to pipe something into `Where-Object`, `Sort-Object`, or `Select-Object` and filter/sort by a named field, you want `[PSCustomObject]`, not a bare hashtable.\n- **Assuming *every* hashtable-to-object situation preserves order the way Example 2 did.** The order guarantee is specific to the literal `[PSCustomObject]@{ ... }` pattern — a hashtable built separately and cast afterward doesn't get the same treatment. Use `[ordered]` when the hashtable and the cast aren't happening in the same expression.\n- **Assuming a new property can be created with plain dot-assignment, the way a hashtable key can.** Verified directly: `$p.NewProp = \"value\"` on a `[PSCustomObject]` that has no `NewProp` fails outright with \"The property 'NewProp' cannot be found on this object\" — dot-assignment only works for *updating a property that already exists* (`$p.Name = \"Sam\"` is fine). Adding a genuinely new one requires `Add-Member`, as in Example 3.\n\n### How this connects\n\nEverything in Part V (filtering, sorting, selecting, grouping) operates on exactly this shape of data — an object, or a list of objects, with real properties — whether it came from a built-in cmdlet or from `[PSCustomObject]` yourself. Chapter 5.12 (JSON, CSV & XML) converts constantly between this shape and text-based formats for saving and loading. Chapter 4.9's classes are the natural next step once an object needs behavior (methods), not just data.\n\n### Quick recap\n\n- `[PSCustomObject]@{ Key = value; ... }` turns a hashtable into a real object with dot-accessible properties — and displays as a genuine table, not a key/value list.\n- The literal `[PSCustomObject]@{ ... }` pattern specifically preserves property order as written, even without `[ordered]` — a convenient special case, not a general hashtable guarantee.\n- `Add-Member` (or, for a single property, direct dot-assignment) adds a property after the object already exists.\n- An array of `[PSCustomObject]`s is exactly the shape of data every built-in cmdlet's output already has — pipe it into `Where-Object`, `Sort-Object`, and the rest exactly the same way."}, {"id": "2.8", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 8, "slug": "the-type-system-type-conversion", "fullTitle": "The Type System & Type Conversion", "title": "The Type System & Type Conversion", "md": "### Why this matters\n\nChapter 1.5's `Get-Member` already showed that everything in PowerShell — even a plain string or number — is a real, typed .NET object underneath. Data doesn't always arrive in the type you need it in, though: user input from `Read-Host` is always text, a value pulled from a CSV file is always text, an environment variable is always text. Converting deliberately, and understanding what happens when PowerShell converts *for* you without being asked, is what this chapter covers.\n\n### The core idea\n\nA type is changed **explicitly** by putting the target type in square brackets in front of a value — a **cast**:\n```powershell\n[int]\"42\"\n```\nPowerShell also converts types **implicitly** in a lot of situations without you asking — most importantly, whenever an operator like `+` sees operands of two different types. Knowing the rule for *when* that implicit conversion happens, and which direction it goes, matters more than it might seem.\n\n### Examples\n\n**1. Basic explicit casting.**\n```powershell\n[int]\"42\"\n[string]42\n[double]\"3.14\"\n```\nOutput:\n```\n42\n42\n3.14\n```\nEach cast converts the value to exactly the type named in brackets — text to a real number, a number to text, text to a decimal.\n\n**2. A cast that can't succeed throws a real, informative error.**\n```powershell\n[int]\"not a number\"\n```\nOutput:\n```\nInvalidArgument: Cannot convert value \"not a number\" to type \"System.Int32\". Error: \"The input string 'not a number' was not in a correct format.\"\n```\nWorth reading carefully: PowerShell tells you exactly what it tried to convert, to exactly what type, and exactly why it failed — not a bare stack trace. Still, this is a hard stop if unhandled — Example 4 shows the safer way to attempt a conversion that might fail.\n\n**3. The implicit-conversion rule that catches almost everyone at least once: the *left* operand decides.**\n```powershell\n\"5\" + 3\n5 + \"3\"\n```\nOutput:\n```\n53\n8\n```\nThe exact same two values, `+`'d together, and two completely different results depending only on *which side the string is on*. When `+`'s left operand is a string, PowerShell converts the right side to a string too and concatenates (`\"5\" + 3` → `\"53\"`, confirmed a real string with `.GetType().Name`). When the left operand is a number, PowerShell converts the right side to a number instead and adds (`5 + \"3\"` → `8`, confirmed a real `Int32`). This is a genuinely important rule to actually internalize, not just skim past — the exact same-looking expression can silently do arithmetic or silently do concatenation, and the only difference is which value happens to be written first.\n\n**4. `[type]::TryParse()` — attempting a conversion safely, without an exception on failure.**\n```powershell\n$result = 0\n[int]::TryParse(\"42\", [ref]$result)\n$result\n[int]::TryParse(\"abc\", [ref]$result)\n$result\n```\nOutput:\n```\nTrue\n42\nFalse\n0\n```\n`TryParse` is a static method (Chapter 2.3 introduced the `::` syntax for these) that returns `True`/`False` for whether the conversion succeeded, and writes the actual converted value into the variable passed as `[ref]$result` — `[ref]` here means \"let this method write back into my variable directly,\" rather than just returning a value normally. This is the reliable way to attempt a conversion on data you're not sure is valid yet (real user input, a value read from a file) without wrapping every attempt in `try`/`catch` (Chapter 5.10) just to guard against Example 2's kind of error.\n\n**5. `[bool]` — what counts as true or false when converting.**\n```powershell\n[bool]0\n[bool]1\n[bool]\"\"\n[bool]\"text\"\n[bool]$null\n```\nOutput:\n```\nFalse\nTrue\nFalse\nTrue\nFalse\n```\n`0`, an empty string, and `$null` all convert to `$false`; any nonzero number and any non-empty string convert to `$true`. This matters constantly in `if` conditions (Chapter 3.1), where a value doesn't have to already be a literal `$true`/`$false` to control a branch — it gets converted to one of these first.\n\n**6. Casting an entire array to a specific element type.**\n```powershell\n[int[]](\"1\", \"2\", \"3\")\n```\nOutput:\n```\n1\n2\n3\n```\n`[int[]]` (note the `[]` inside the cast) converts every element of the array individually — genuinely useful the moment a whole batch of text values (a CSV column, split output from Chapter 2.2's `.Split()`) needs to become real numbers at once, rather than converting each one by hand in a loop.\n\n### ⚠️ Common Mistakes\n\n- **Not noticing which side of `+` a string is on**, and being surprised the result is concatenation when arithmetic was intended (or vice versa). As Example 3 showed directly, this is a real, easy-to-hit trap — when combining a number and something that might be text, cast explicitly (`[int]$value + 3`) rather than trusting the implicit rule to go the way you expect.\n- **Letting a cast that might fail crash an entire script**, when the input's validity genuinely isn't guaranteed (real user input, external data). Use `[type]::TryParse()` (Example 4) instead of a bare cast whenever failure is a real possibility you need to handle gracefully.\n- **Assuming `[bool]` conversion matches every other language's truthiness rules exactly.** PowerShell's are specific (Example 5), and arrays add a genuinely surprising extra wrinkle verified directly: an empty array (`@()`) is `$false`, an array with **two or more** elements is always `$true` no matter what's inside it (even `@($false, $false)` is truthy) — but a **single**-element array is `$false` or `$true` based on *that one element's own* truthiness (`@($false)` is `$false`). This is the same single-element-array auto-unwrapping behavior Chapter 8.3 covers in full.\n- **Forgetting the difference between `-is` (Chapter 2.4, a yes/no check of the *current* type) and casting/`-as` (actually changing or attempting to change the type).** They answer different questions entirely.\n\n### How this connects\n\nThe implicit-conversion rule from Example 3 is exactly the kind of subtlety Chapter 8.3 (Common Pitfalls & Gotchas) collects and revisits with more real examples. `[bool]` conversion (Example 5) is the mechanism underneath every `if` condition from Chapter 3.1 onward. Chapter 4.2 uses explicit type annotations on function parameters, which lean on everything this chapter covered about how PowerShell converts a caller's argument into the type a parameter actually declares.\n\n### Quick recap\n\n- `[type]value` casts explicitly; a cast that can't succeed throws a clear, specific error naming the value, target type, and reason.\n- Implicit conversion with `+` (and similar operators) is decided by the **left operand's type** — `\"5\" + 3` concatenates to `\"53\"`; `5 + \"3\"` adds to `8`. The exact same values, opposite results, depending only on order.\n- `[type]::TryParse($text, [ref]$result)` attempts a conversion safely, returning `True`/`False` instead of throwing.\n- `[bool]` conversion: `0`, `\"\"`, and `$null` are false; any other number or non-empty string is true.\n- `[int[]]$array` (or any `[type[]]`) converts every element of an array at once."}, {"id": "2.9", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 9, "slug": "null-booleans-truthiness", "fullTitle": "`$null`, Booleans & Truthiness", "title": "`$null`, Booleans & Truthiness", "md": "### Why this matters\n\n`$null` represents \"nothing\" — an absent value, a variable that was never set, a lookup that found nothing. It shows up constantly, and PowerShell's specific rules around it (what counts as `$null`, what doesn't, and a genuinely surprising order-dependent quirk) are worth knowing precisely rather than assuming they work like whatever language you learned before this one.\n\n### The core idea\n\n`$null` is PowerShell's single representation of \"no value.\" It is **not** the same as an empty string (`\"\"`), a zero (`0`), or an empty array (`@()`) — each of those is a real, specific value; `$null` is the absence of one. Two operators, both added in PowerShell 7, make working with possibly-`$null` values much cleaner than checking for it by hand every time:\n\n- **`??`** (null-coalescing) — `$x ?? \"default\"` evaluates to `$x` if it's not `$null`, or `\"default\"` otherwise.\n- **`??=`** (null-coalescing assignment) — `$x ??= \"default\"` assigns `\"default\"` to `$x` *only if* `$x` is currently `$null`, leaving an already-set value untouched.\n\n### Examples\n\n**1. `??` — a default value, only when something is actually `$null`.**\n```powershell\n$x = $null\n$x ?? \"default\"\n$y = \"value\"\n$y ?? \"default\"\n```\nOutput:\n```\ndefault\nvalue\n```\n`$x` was `$null`, so the fallback kicked in; `$y` already had a real value, so it passed straight through untouched.\n\n**2. `??=` — assign a default only if not already set.**\n```powershell\n$x = $null\n$x ??= \"assigned\"\n$x\n$y = \"existing\"\n$y ??= \"wontoverwrite\"\n$y\n```\nOutput:\n```\nassigned\nexisting\n```\nThis is the clean, one-line replacement for the older, more verbose pattern of `if ($null -eq $x) { $x = \"assigned\" }` — genuinely useful for filling in default parameter values or configuration.\n\n**3. `$null` is not the same as an empty string — this distinction matters.**\n```powershell\n[string]::IsNullOrEmpty($null)\n[string]::IsNullOrEmpty(\"\")\n[string]::IsNullOrEmpty(\"  \")\n[string]::IsNullOrWhiteSpace(\"  \")\n```\nOutput:\n```\nTrue\nTrue\nFalse\nTrue\n```\n`IsNullOrEmpty` treats both `$null` and `\"\"` as \"empty\" — genuinely useful, since code that needs to reject a missing value usually wants to reject both the same way — but a string containing only spaces (`\"  \"`) is neither `$null` nor empty, so it comes back `False`. `IsNullOrWhiteSpace` is the version that also catches that case.\n\n**4. `$null` behaves like zero in arithmetic, quietly.**\n```powershell\n$null + 5\n```\nOutput:\n```\n5\n```\n`$null` was silently treated as `0` here, and the result is a real `Int32`, not some special \"null-tainted\" value. Convenient in some situations, but worth knowing about — a calculation that includes an unexpectedly-`$null` value won't necessarily fail loudly; it may just quietly produce a number that's wrong by exactly however much the missing value should have contributed.\n\n**5. A genuine preview, deliberately left incomplete here: comparing `$null` against an array depends on which side it's on.**\n```powershell\n$arr = 1, $null, 3\n$arr -eq $null\n$null -eq $arr\n```\nThe first line returns an array containing the one `$null` element that matched (it just displays as nothing, since `$null` itself prints as blank) — a real result, holding one item. The second line returns a single, plain `$false` instead — an entirely different kind of answer, from writing the *exact same comparison backwards*. This is exactly the kind of subtlety that deserves its own careful, complete treatment rather than a rushed half-explanation — Chapter 8.3 (Common Pitfalls & Gotchas) covers precisely why this happens and the safe pattern to use instead. For now, just remember: **when comparing something against `$null`, put `$null` on the left.**\n\n### ⚠️ Common Mistakes\n\n- **Treating `$null`, `\"\"`, and `0` as interchangeable.** They're three distinct, real values — only `$null` genuinely means \"nothing.\" Use `[string]::IsNullOrEmpty()` when either `$null` or an empty string should be treated the same way.\n- **Writing `$variable -eq $null` out of habit**, rather than `$null -eq $variable`. As Example 5 previewed, these are not guaranteed to behave the same way, especially once arrays are involved — Chapter 8.3 gives the full explanation and the safe habit to build.\n- **Assuming a calculation involving `$null` will error.** As Example 4 showed, `$null` often converts quietly (to `0` in arithmetic, to `$false` as a boolean) rather than raising any kind of warning.\n- **Using `??`/`??=` and then testing on an older PowerShell version.** Both are PowerShell 7.0+ only — unavailable on Windows PowerShell 5.1 (Chapter 0.2).\n\n### How this connects\n\nThe order-dependent comparison from Example 5 gets its complete, careful treatment in Chapter 8.3 — this chapter's job was just to plant the seed and give you the safe habit (`$null` on the left) to carry until then. `[bool]` conversion, covered in the previous chapter, is exactly what determines how `$null` behaves in an `if` condition starting in Chapter 3.1.\n\n### Quick recap\n\n- `$null` means \"no value\" — distinct from `\"\"` (empty string), `0`, and `@()` (empty array), each a real value in its own right.\n- `??` supplies a fallback only when the left side is `$null`; `??=` assigns only if the variable is currently `$null`. Both are PowerShell 7+ only.\n- `[string]::IsNullOrEmpty()` catches `$null` and `\"\"` together; `[string]::IsNullOrWhiteSpace()` also catches whitespace-only strings.\n- `$null` often converts quietly in arithmetic (as `0`) and boolean contexts (as `$false`) rather than erroring.\n- Comparing against `$null` is order-sensitive, especially with arrays — always put `$null` on the **left** (`$null -eq $x`, not `$x -eq $null`). Full explanation in Chapter 8.3."}, {"id": "2.10", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 10, "slug": "automatic-variables", "fullTitle": "Automatic Variables", "title": "Automatic Variables", "md": "### Why this matters\n\nPowerShell keeps a standard set of variables automatically filled in for you at all times — the current pipeline object, whether the last command succeeded, what a native program exited with, where the running script actually lives on disk. You've already met a few of these in passing; this chapter collects the full standard set in one place.\n\n### The core idea\n\nAn **automatic variable** is one PowerShell creates and updates on its own — you never assign to most of them yourself, only read them. They're always available, always named the same thing, and knowing the core set by heart saves constantly looking things up.\n\n### Examples\n\n**1. `$_` and `$PSItem` — the current pipeline object, two names for the same thing.**\n```powershell\n1, 2, 3 | ForEach-Object { \"$_ and $PSItem are the same\" }\n```\nOutput:\n```\n1 and 1 are the same\n2 and 2 are the same\n3 and 3 are the same\n```\nChapter 1.6 already introduced `$_`; `$PSItem` is an exact alias for it, added later for readability in longer script blocks where a lone underscore can be easy to miss visually. Both work identically — this book will generally use `$_`, since it's by far the more common convention in real-world PowerShell code.\n\n**2. `$?` — did the last command succeed?**\n```powershell\nGet-Item /tmp | Out-Null\n$?\nGet-Item /nonexistent-xyz -ErrorAction SilentlyContinue | Out-Null\n$?\n```\nOutput:\n```\nTrue\nFalse\n```\n`$?` is `$true` if the last command completed without error, `$false` otherwise — checked automatically after every single command, whether or not you asked for it. Genuinely useful for a quick \"did that actually work?\" check right after something runs.\n\n**3. `$LASTEXITCODE` — specifically for *native* (non-PowerShell) programs' exit codes.**\n```powershell\nbash -c \"exit 0\"\n$LASTEXITCODE\nbash -c \"exit 7\"\n$LASTEXITCODE\n```\nOutput:\n```\n0\n7\n```\n`$?` (Example 2) reflects whether PowerShell itself considers the last command successful; `$LASTEXITCODE` specifically captures the literal numeric exit code the last **external program** returned — the two aren't always the same thing, and Chapter 7.6 (Calling External Programs & Native Executables) covers exactly why, and how they interact, in full.\n\n**4. `$Error` — a running list of every error this session has hit.**\n```powershell\nGet-Item /nonexistent-xyz -ErrorAction SilentlyContinue\n$Error[0].Exception.Message\n```\nOutput:\n```\nCannot find path '/nonexistent-xyz' because it does not exist.\n```\n`$Error` is an array, most-recent error first (`$Error[0]`) — even errors suppressed from display with `-ErrorAction SilentlyContinue` still land here, which makes `$Error` a genuinely useful thing to check after the fact, even when you deliberately didn't want an error interrupting your script in the moment. Chapter 5.9 covers `-ErrorAction` and error handling properly.\n\n**5. `$args` — the arguments a script or function was actually called with.**\n\n`argstest.ps1`:\n```powershell\n\"Args count: $($args.Count)\"\n$args\n```\nRun as:\n```powershell\n./argstest.ps1 a b c\n```\nOutput:\n```\nArgs count: 3\na\nb\nc\n```\n`$args` is an array holding every argument passed in that wasn't otherwise captured by a named parameter — Chapter 4.2 covers named parameters properly, at which point `$args` becomes the fallback for \"everything else\" rather than the primary way to receive input.\n\n**6. A handful more, worth knowing on sight: `$HOME`, `$PWD`, `$PID`, `$PSScriptRoot`.**\n```powershell\n$HOME\n$PWD\n$PID\n```\nOutput:\n```\n/home/shad\n\nPath\n----\n/home/shad/Application/Claude\n\n201839\n```\n`$HOME` is your home directory as plain text; `$PWD` is your current location, but as a full path-info object (not just a string — Chapter 7.1 covers exactly why that distinction matters for the filesystem); `$PID` is this PowerShell session's own process ID, a real `Int32`. And inside a running script file specifically:\n```powershell\n$PSScriptRoot\n```\nOutput:\n```\n/tmp\n```\n`$PSScriptRoot` holds the folder the *currently-running script* lives in — genuinely essential the moment a script needs to reliably find another file sitting next to it, regardless of what folder the user happened to be in when they ran it. Chapter 6.6 (Organizing a Multi-File Project) relies on this directly.\n\n### ⚠️ Common Mistakes\n\n- **Confusing `$?` (did the last command succeed, PowerShell's own judgment) with `$LASTEXITCODE` (a native program's literal numeric exit code).** They track different things and can genuinely disagree — Chapter 7.6 covers the real interaction.\n- **Checking `$Error` without realizing it accumulates for the whole session**, not just \"since the last command.\" `$Error[0]` is the most recent; `$Error.Clear()` resets it if a script needs a clean slate before checking for new errors specifically.\n- **Relying on the current working directory instead of `$PSScriptRoot`** when a script needs to find a file that lives alongside it. The working directory depends on *where the user ran the script from*, which is never guaranteed — `$PSScriptRoot` is reliable regardless.\n- **Assuming `$args` captures everything, even named parameters.** Once a function or script declares real parameters (Chapter 4.2), anything matched to one of those no longer lands in `$args` — only the leftover, unmatched arguments do.\n\n### How this connects\n\n`$_`/`$PSItem` reappear in essentially every chapter of Part V. `$LASTEXITCODE` gets its complete treatment alongside native-program calling in Chapter 7.6. `$Error` and `$?` both connect directly into Chapter 5.9 and 5.10's full error-handling chapters. `$PSScriptRoot` becomes essential the moment Chapter 6.6 starts building projects spread across more than one file.\n\n### Quick recap\n\n- `$_` (and its alias `$PSItem`) is the current pipeline object inside a script block.\n- `$?` reflects whether the last command succeeded (PowerShell's own judgment); `$LASTEXITCODE` is a native program's literal numeric exit code — not always the same signal.\n- `$Error` is a running, session-wide list of every error hit, most recent first — even ones suppressed from display.\n- `$args` holds whatever arguments weren't captured by a named parameter.\n- `$HOME`, `$PWD`, `$PID`, and `$PSScriptRoot` (the running script's own folder — reliable regardless of the user's current directory) round out the everyday set."}, {"id": "2.11", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 11, "slug": "regular-expressions-match-replace-select-string", "fullTitle": "Regular Expressions, `-match`/`-replace` & `Select-String`", "title": "Regular Expressions, `-match`/`-replace` & `Select-String`", "md": "### Why this matters\n\nChapter 2.4 introduced `-match` as \"regex matching\" without explaining what a regex actually is. Wildcards (`-like`, from that same chapter) can only express \"starts with,\" \"ends with,\" or \"contains this literal text\" — the moment a pattern needs to describe a *shape* of text (\"three digits, a dash, four more digits,\" \"an email-looking string\"), you need a regular expression. This chapter covers real regex use in PowerShell, plus `Select-String` — PowerShell's answer to `grep`, and the natural companion to everything else here.\n\n### The core idea\n\nA **regular expression** (regex) is a small pattern language for describing shapes of text: `\\d` means \"a digit,\" `\\w` means \"a word character,\" `+` means \"one or more of the previous thing,\" `(...)` groups part of the pattern and *captures* what it matched. PowerShell exposes regex through three tools:\n\n- **`-match`** / **`-notmatch`** — test whether a string matches a pattern, and populate `$matches` with what was captured.\n- **`-replace`** — replace whatever matches a pattern, optionally reusing captured groups in the replacement.\n- **`Select-String`** — search across multiple lines, files, or pipeline input for a pattern, returning full match details for each hit — PowerShell's `grep`.\n\n### Examples\n\n**1. `-match` with capture groups, and `$matches`.**\n```powershell\n\"John Smith, age 42\" -match \"(\\w+) (\\w+), age (\\d+)\"\n$matches[1]\n$matches[2]\n$matches[3]\n```\nOutput:\n```\nTrue\nJohn\nSmith\n42\n```\nEach `(...)` group in the pattern captures its own piece of the match — `$matches[1]` is the first group, `$matches[2]` the second, and so on. `$matches[0]` (not shown here) always holds the *entire* match, not just a group.\n\n**2. Named capture groups — clearer than counting parentheses.**\n```powershell\n\"John Smith\" -match \"(?<first>\\w+) (?<last>\\w+)\"\n$matches.first\n$matches.last\n```\nOutput:\n```\nTrue\nJohn\nSmith\n```\n`(?<name>...)` names a group instead of leaving it to be found by position — `$matches.first`/`$matches.last` read far more clearly than `$matches[1]`/`$matches[2]`, especially in a pattern with several groups.\n\n**3. `-replace` with backreferences — reusing captured groups in the replacement.**\n```powershell\n\"2026-09-07\" -replace \"(\\d{4})-(\\d{2})-(\\d{2})\", '$3/$2/$1'\n```\nOutput:\n```\n07/09/2026\n```\n`$1`, `$2`, `$3` in the replacement text refer back to the pattern's captured groups — here, rearranging a `YYYY-MM-DD` date into `DD/MM/YYYY` in one line. (Using single quotes for the replacement string avoids PowerShell trying to expand `$1` etc. as its own variables before `-replace` ever sees them — inside double quotes, you'd need to escape each one as `` `$1 `` instead.)\n\n**4. `-split` is regex-aware — Chapter 2.5 previewed this; here's the power that promise unlocks.**\n```powershell\n\"a1b22c333d\" -split \"\\d+\"\n```\nOutput:\n```\na\nb\nc\nd\n```\n`\\d+` (\"one or more digits\") splits on runs of digits of *any* length, not just a single literal character — something a plain literal separator (`\",\"`, from Chapter 2.5's basic examples) could never express.\n\n**5. `Select-String` — searching a real file, PowerShell's `grep`.**\n```powershell\nSelect-String -Path /tmp/fruits.txt -Pattern \"pie\"\n```\nGiven a file containing `apple`, `banana`, `cherry pie`, `apple pie`, output:\n```\n/tmp/fruits.txt:3:cherry pie\n/tmp/fruits.txt:4:apple pie\n```\nFile path, line number, and the full matching line — for every match, across the whole file, in one command. `-NotMatch` flips it to show every line that *doesn't* match instead:\n```powershell\nSelect-String -Path /tmp/fruits.txt -Pattern \"pie\" -NotMatch\n```\n```\n/tmp/fruits.txt:1:apple\n/tmp/fruits.txt:2:banana\n```\n\n**6. `Select-String` on pipeline input directly, not just files.**\n```powershell\n\"hello world\" | Select-String -Pattern \"wor\\w+\"\n```\nOutput:\n```\nhello world\n```\n`Select-String` doesn't need a file at all — piping any string (or strings) into it searches those directly, exactly the same way `grep` would search standard input in a Unix pipeline.\n\n**7. Case sensitivity — the same rule from Chapter 2.4 applies here too.**\n```powershell\n\"HELLO\" -match \"hello\"\n\"HELLO\" -cmatch \"hello\"\n```\nOutput:\n```\nTrue\nFalse\n```\n`-match` is case-insensitive by default, exactly like `-eq` and `-like`; `-cmatch` is its case-sensitive twin. `Select-String` has its own `-CaseSensitive` switch for the identical purpose.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `$matches` gets overwritten by the *next* `-match`.** If you need a capture group's value later, store it in its own variable right after the match, rather than relying on `$matches` to still hold the right thing several lines later.\n- **Writing a `-replace` backreference (`$1`, `$2`) inside double quotes without escaping it.** PowerShell's own string interpolation (Chapter 2.2) tries to expand `$1` as a variable first, usually to nothing — use single quotes for the replacement string (as in Example 3), or escape each one as `` `$1 `` if double quotes are genuinely needed.\n- **Reaching for `-like`'s wildcards when the pattern actually needs regex power** (or the reverse — writing a full regex when a simple wildcard would do). They're genuinely different tools, covered together back in Chapter 2.4.\n- **Forgetting regex special characters need escaping when they're meant literally.** A literal period in a pattern needs `\\.`, not a bare `.` (which means \"any character\" in regex) — a real trap the moment a pattern is meant to match something like a literal filename extension.\n\n### How this connects\n\nEverything here builds directly on Chapter 2.4's introduction of `-match` and Chapter 2.1/2.2's string handling. `Select-String` reappears constantly once real log files and text processing show up from Part VII onward — it's the single most-reached-for tool for \"find this pattern somewhere in a pile of text.\"\n\n### Quick recap\n\n- `-match`/`-notmatch` test a pattern and populate `$matches` (by number `$matches[1]` or, with named groups `(?<name>...)`, by name `$matches.name`).\n- `-replace \"pattern\", 'replacement'` substitutes matches, with `$1`/`$2`/etc. in the replacement reusing captured groups — use single quotes for the replacement to avoid PowerShell's own `$`-expansion getting in the way.\n- `-split \"pattern\"` is regex-aware, splitting on any matching shape of text, not just a fixed literal character.\n- `Select-String -Path file -Pattern \"...\"` searches a file (or `-Path` several files) line by line, reporting file/line/matched-text — pipe input works too, with no `-Path` needed. `-NotMatch` inverts it.\n- The same case-sensitivity rule from Chapter 2.4 applies: `-match`/`-replace`/`-split` are case-insensitive by default; `-cmatch` (and `Select-String -CaseSensitive`) are case-sensitive."}, {"id": "2.12", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 12, "slug": "working-with-dates-and-times", "fullTitle": "Working with Dates & Times", "title": "Working with Dates & Times", "md": "### Why this matters\n\nLog timestamps, file modification dates, \"how long did this take,\" \"run this only after a certain date\" — dates and times show up constantly in real scripts. PowerShell's date handling is genuinely pleasant once you know the core pieces: `Get-Date`, the `[datetime]` type, and `[timespan]` for durations.\n\n### The core idea\n\n**`Get-Date`** returns the current date and time as a real `[datetime]` object — not text, an actual object with its own properties (year, month, day, day of week) and methods (adding days, comparing to another date). A **`[timespan]`** represents a *duration* — the difference between two dates, or a length of time on its own (like \"2 hours\").\n\n### Examples\n\n**1. `Get-Date`, plain and formatted.**\n```powershell\nGet-Date\nGet-Date -Format \"yyyy-MM-dd\"\nGet-Date -Format \"HH:mm:ss\"\n```\nOutput:\n```\nMonday, September 7, 2026 2:52:55 AM\n2026-09-07\n02:52:55\n```\n`-Format` uses .NET's standard date-format codes (`yyyy` = 4-digit year, `MM` = 2-digit month, `dd` = 2-digit day, `HH`/`mm`/`ss` = 24-hour time) — the same format-code vocabulary you'll see again with `[datetime]`'s own formatting methods. Note that the very first line above (plain `Get-Date`, no `-Format`) is culture-dependent — it renders using whatever locale the current session is running under; a system set to `de-DE`, for instance, shows `Montag, 7. September 2026 00:00:00` for that exact same instant (different day/month names, and a 24-hour clock instead of AM/PM). An explicit `-Format` string like the other two lines here always renders identically regardless of locale — worth reaching for the moment a script's output needs to be predictable across machines.\n\n**2. Date arithmetic — real methods, not manual day-counting.**\n```powershell\n$d = Get-Date\n$d.AddDays(7)\n($d.AddDays(7) - $d).Days\n```\nOutput:\n```\nMonday, September 14, 2026 2:52:56 AM\n7\n```\n`.AddDays()` (and `.AddHours()`, `.AddMinutes()`, `.AddMonths()`, `.AddYears()`, all following the same pattern) returns a *new* date, correctly handling month/year boundaries, leap years, and everything else you'd rather not calculate by hand. Subtracting one date from another gives you a `[timespan]` (Example 4) — `.Days` here confirms exactly 7 days apart, as expected.\n\n**3. Parsing a date from text.**\n```powershell\n[datetime]\"2026-09-07\"\n[datetime]::Parse(\"2026-09-07\")\n```\nOutput:\n```\nMonday, September 7, 2026 12:00:00 AM\nMonday, September 7, 2026 12:00:00 AM\n```\nBoth forms work identically for a clearly-formatted date string — a direct `[datetime]` cast (Chapter 2.8's casting syntax, applied here) or the explicit `.Parse()` static method. When a date's format is ambiguous or non-standard, `.ParseExact()` is the more reliable tool:\n```powershell\n[datetime]::ParseExact(\"07/09/2026\", \"dd/MM/yyyy\", $null)\n```\n```\nMonday, September 7, 2026 12:00:00 AM\n```\nSpelling out the exact expected format (`dd/MM/yyyy` here — day first) avoids any ambiguity about whether `07/09/2026` means September 7th or July 9th, which a plain `.Parse()` might guess wrong depending on your system's regional settings. (The trailing `$null` is a required parameter for supplying a specific culture/locale — `$null` here just means \"use the default.\")\n\n**4. `[timespan]` — a duration, on its own or from subtracting two dates.**\n```powershell\n$ts = New-TimeSpan -Days 1 -Hours 2\n$ts\n$ts.TotalHours\n```\nOutput (trimmed):\n```\nDays              : 1\nHours             : 2\n...\nTotalHours        : 26\n```\n`New-TimeSpan` builds a duration directly; subtracting one `[datetime]` from another (Example 2) produces the exact same kind of object. `.TotalHours` (and `.TotalDays`, `.TotalMinutes`, `.TotalSeconds`) collapse the whole duration into one number in that unit — genuinely convenient for \"how many hours did this actually take,\" rather than manually combining `.Days` and `.Hours` yourself.\n\n**5. Comparing dates directly with ordinary comparison operators.**\n```powershell\n(Get-Date) -gt (Get-Date).AddDays(-1)\n```\nOutput:\n```\nTrue\n```\nSince a `[datetime]` is a real, comparable object, Chapter 2.4's `-gt`/`-lt`/`-eq` family all work on dates exactly the way you'd hope — \"is this date later than that one\" needs no special date-comparison function.\n\n**6. Individual properties, and UTC conversion.**\n```powershell\n$d = Get-Date\n$d.Year\n$d.DayOfWeek\n(Get-Date).ToUniversalTime()\n```\nOutput:\n```\n2026\nMonday\nMonday, September 7, 2026 6:52:57 AM\n```\n`.Year`, `.Month`, `.Day`, `.Hour`, `.DayOfWeek`, and more are all real properties, no parsing required. `.ToUniversalTime()` converts a local date/time to UTC — worth reaching for deliberately anytime a timestamp needs to mean the same instant no matter what timezone it's read in later (a log file shared across systems, most of all).\n\n### ⚠️ Common Mistakes\n\n- **Treating a date as a plain string and trying to compare or sort it as text.** A `[datetime]` sorts and compares correctly by its actual point in time; a string that merely *looks* like a date sorts lexically (Chapter 1.6's numbers-as-text warning applies here too) — always keep dates as real `[datetime]` objects rather than converting to text and back.\n- **Relying on `.Parse()`'s automatic format-guessing for anything beyond an unambiguous, standard format.** `.ParseExact()` with an explicit format string is the reliable choice the moment a date's format could be read more than one way.\n- **Forgetting `Get-Date -Format` uses .NET format codes, not something like Bash's `date` command's `%Y-%m-%d` syntax.** `yyyy-MM-dd`, not `%Y-%m-%d` — a real, easy mix-up for anyone coming from Bash's `date`.\n- **Mixing local time and UTC without being deliberate about which one a timestamp represents.** A script that logs local time on one machine and compares it against a UTC timestamp from another will silently be hours off — decide which one a given value should be, and convert explicitly (`.ToUniversalTime()`/`.ToLocalTime()`) rather than assuming.\n- **Assuming a `[datetime]`'s default (unformatted) display is fixed text.** It's actually rendered using the current session's culture — day/month names and the 12-hour/24-hour clock convention can both change on a different system. Always use an explicit `-Format`/`.ToString(format)` when the exact rendered text matters (logging, comparisons against a fixed string, and so on).\n\n### How this connects\n\n`[datetime]`'s comparison behavior builds directly on Chapter 2.4's comparison operators and Chapter 2.8's type-conversion rules. Timestamps and durations reappear constantly from here on — file metadata in Chapter 7.1, log-style output throughout Part VII, and performance measurement in Chapter 8.4, which uses exactly this chapter's `[timespan]` machinery (via `Measure-Command`) to time how long code actually takes to run.\n\n### Quick recap\n\n- `Get-Date` returns a real `[datetime]` object; `-Format \"yyyy-MM-dd\"` (or similar) controls how it displays, using .NET format codes, not Bash's `date` syntax.\n- `.AddDays()`/`.AddHours()`/etc. do date arithmetic correctly (leap years, month boundaries included); subtracting two dates produces a `[timespan]`.\n- `[datetime]\"text\"` or `[datetime]::Parse()` parses a clear, unambiguous date string; `[datetime]::ParseExact(text, format, $null)` is the reliable choice for anything less clear-cut.\n- `[timespan]` represents a duration — `.TotalHours`/`.TotalDays`/etc. collapse it into one number in that unit.\n- Dates compare correctly with ordinary `-gt`/`-lt`/`-eq`; keep them as real `[datetime]` objects rather than comparing as text."}, {"id": "3.1", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 1, "slug": "making-decisions-if-elseif-else", "fullTitle": "Making Decisions: `if` / `elseif` / `else`", "title": "Making Decisions: `if` / `elseif` / `else`", "md": "### Why this matters\n\nEvery non-trivial script eventually needs to do one thing or another depending on a condition. `if` is how — the most fundamental piece of control flow there is, and the operators from Chapter 2.4 exist largely to be used right here.\n\n### The core idea\n\n```powershell\nif (condition) {\n    # runs if condition is true\n} elseif (anotherCondition) {\n    # runs if the first was false but this one's true\n} else {\n    # runs if nothing above was true\n}\n```\nBraces are **always required** around each block, even for a single line — unlike some languages, there's no shorthand for a brace-less one-line `if`. `elseif` and `else` are both optional, and you can chain as many `elseif`s as needed.\n\n### Examples\n\n**1. A basic three-way decision.**\n```powershell\n$age = 20\nif ($age -lt 13) {\n    \"child\"\n} elseif ($age -lt 20) {\n    \"teen\"\n} else {\n    \"adult\"\n}\n```\nOutput:\n```\nadult\n```\nPowerShell checks each condition top to bottom and runs the *first* block whose condition is true, skipping the rest entirely.\n\n**2. Combining conditions with `-and`.**\n```powershell\n$age = 25\n$hasLicense = $true\nif ($age -ge 18 -and $hasLicense) {\n    \"can drive\"\n} else {\n    \"cannot drive\"\n}\n```\nOutput:\n```\ncan drive\n```\nStraight from Chapter 2.4 — `-and`, `-or`, and `-not` combine as many conditions as a single `if` needs.\n\n**3. Braces are mandatory, even for one line — verified directly.**\n```powershell\nif (5 -gt 3) \"yes\"\n```\nOutput:\n```\nParserError:\nLine |\n   1 |  if (5 -gt 3) \"yes\"\n     |             ~\n     | Missing statement block after if ( condition ).\n```\nComing from a language that allows a brace-less one-liner (or even just Python's colon-and-indent style), this is a real, easy mistake to make in your first few PowerShell scripts. The fix is always the same: wrap the body in `{ }`, no matter how short it is.\n\n**4. `if` can be used as an expression — genuinely handy, and easy to miss.**\n```powershell\n$x = if (5 -gt 3) { \"yes\" } else { \"no\" }\n$x\n```\nOutput:\n```\nyes\n```\nBecause a bare expression's value automatically becomes output (Chapter 1.1), and because `if`/`else`'s *branches* are themselves just blocks of statements, the whole `if` structure can be assigned directly to a variable — whichever branch actually ran, its output becomes the value assigned. This works for any `if`/`elseif`/`else` chain, not just this simple two-way example.\n\n**5. The ternary operator (`?:`) — a shorthand for exactly Example 4's simplest case, PowerShell 7.0+.**\n```powershell\n$age = 20\n$result = $age -ge 18 ? \"adult\" : \"minor\"\n$result\n```\nOutput:\n```\nadult\n```\n`condition ? valueIfTrue : valueIfFalse` — a single-line shorthand specifically for \"pick one of two values based on a condition,\" genuinely convenient for a case this simple. It's not a replacement for full `if`/`elseif`/`else` — reach for it only when there are exactly two outcomes and neither one needs more than a single expression; anything more involved reads better as a proper `if` block.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the mandatory braces**, as Example 3 demonstrated directly — a habit from a language that allows brace-less one-liners is the most common cause.\n- **Reaching for the ternary operator when a condition genuinely needs more than two simple outcomes**, or when either branch needs more than one expression. It exists for the simple case; a real `if`/`elseif`/`else` reads better once things get more involved.\n- **Trying to use the ternary operator on Windows PowerShell 5.1** — it's PowerShell 7.0+ only (Chapter 0.2) and simply doesn't parse on the older version.\n- **Not realizing `if` can be assigned as an expression** (Example 4), and writing a more verbose pattern — setting a variable inside each branch separately — when a single assignment around the whole `if` would do.\n\n### How this connects\n\n`-and`/`-or`/`-not` and the whole comparison-operator family from Chapter 2.4 exist specifically to build the conditions used here. Chapter 3.2's `switch` statement is the natural next step once an `if`/`elseif` chain grows to check the same value against many possibilities. `[bool]` conversion (Chapter 2.8) is exactly what determines whether a non-boolean condition is treated as true or false here.\n\n### Quick recap\n\n- `if (condition) { ... } elseif (condition) { ... } else { ... }` — braces are always required, `elseif`/`else` are optional.\n- Conditions are built from Chapter 2.4's comparison (`-eq`, `-lt`, …) and logical (`-and`, `-or`, `-not`) operators.\n- `if` can be used as an expression — `$x = if (...) { \"a\" } else { \"b\" }` assigns whichever branch actually ran.\n- `condition ? trueValue : falseValue` (PowerShell 7.0+) is a one-line shorthand for the simplest two-outcome case only."}, {"id": "3.2", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 2, "slug": "switch-statements", "fullTitle": "`switch` Statements", "title": "`switch` Statements", "md": "### Why this matters\n\nA long `if`/`elseif`/`elseif`/`elseif` chain testing the same value against many possibilities gets hard to read fast. `switch` is built specifically for that shape of decision — and it comes with genuinely more power than most languages' switch/case: wildcard matching, regex matching, even reading straight from a file, one case checked per line.\n\n### The core idea\n\n```powershell\nswitch ($value) {\n    \"option1\" { # commands }\n    \"option2\" { # commands }\n    default   { # commands, if nothing above matched }\n}\n```\n`switch` checks `$value` against each case top to bottom. **Unlike most languages, PowerShell's `switch` does not stop after the first match by default** — every case that matches runs, not just the first one. `break` inside a case stops it early, the same way it would end a loop.\n\n### Examples\n\n**1. A simple `switch`.**\n```powershell\n$fruit = \"apple\"\nswitch ($fruit) {\n    \"apple\"  { \"its an apple\" }\n    \"banana\" { \"its a banana\" }\n    default  { \"unknown\" }\n}\n```\nOutput:\n```\nits an apple\n```\n\n**2. Multiple matching cases *all* run — this is the single biggest difference from C-style `switch`, worth internalizing early.**\n```powershell\nswitch (\"b\") {\n    \"a\" { \"A\" }\n    \"b\" { \"B\" }\n    \"b\" { \"B again\" }\n    default { \"D\" }\n}\n```\nOutput:\n```\nB\nB again\n```\nTwo separate `\"b\"` cases, and *both* ran — PowerShell doesn't stop at the first match the way C, Java, or JavaScript's `switch` does. If you specifically want \"stop after the first match\" behavior (the more familiar kind), add `break` explicitly to each case:\n```powershell\nswitch (\"b\") {\n    \"a\" { \"A\"; break }\n    \"b\" { \"B\"; break }\n    \"b\" { \"B again\" }\n}\n```\n```\nB\n```\nWith `break` in the matching case, execution stops there — the second `\"b\"` case never even gets checked.\n\n**3. `switch -Wildcard` — glob-style pattern matching per case.**\n```powershell\nswitch -Wildcard (\"report.txt\") {\n    \"*.txt\" { \"text file\" }\n    \"*.jpg\" { \"image\" }\n}\n```\nOutput:\n```\ntext file\n```\nExactly the same `*`/`?` wildcard vocabulary as `-like` (Chapter 2.4) — genuinely useful for branching on a file type or a loosely-shaped value.\n\n**4. `switch -Regex` — full regular-expression matching per case.**\n```powershell\nswitch -Regex (\"hello123\") {\n    \"\\d+\"        { \"has digits\" }\n    \"^[a-z]+$\"   { \"all lowercase\" }\n}\n```\nOutput:\n```\nhas digits\n```\nOnly the first case matched here (`\"hello123\"` isn't *all* lowercase, since it contains digits) — but per Example 2's rule, if both patterns had matched, both blocks would have run.\n\n**5. `switch` on an array — every element gets tested individually.**\n```powershell\nswitch (1, 2, 3) {\n    1 { \"one\" }\n    2 { \"two\" }\n    default { \"other\" }\n}\n```\nOutput:\n```\none\ntwo\nother\n```\nGenuinely handy and easy to overlook: hand `switch` a whole array instead of a single value, and it runs the *entire* case structure once per element, in order — no explicit loop needed to get this behavior.\n\n**6. `switch -File` — testing each line of a file, one at a time.**\n\nGiven `switchtest.txt` containing `apple`, `banana`, `cherry` (one per line):\n```powershell\nswitch -File /tmp/switchtest.txt {\n    \"banana\" { \"found banana\" }\n    default  { \"line: $_\" }\n}\n```\nOutput:\n```\nline: apple\nfound banana\nline: cherry\n```\nEach line becomes `$_` inside the case block (the same automatic variable from Chapter 1.6/2.10), tested top to bottom against every case — a genuinely convenient way to react to specific lines in a file without manually looping and calling `-match` yourself.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `switch` stops after the first match, out of habit from C-family languages.** As Example 2 proved directly, it doesn't — every matching case runs. Add `break` explicitly wherever \"stop at the first match\" is actually the intended behavior.\n- **Putting `default` first and expecting it to only catch leftovers.** `default` always runs last, regardless of where it's written in the case list — but every *other* matching case above it still runs too, following the same all-matches-run rule.\n- **Forgetting `-Wildcard` or `-Regex` is required** to get that matching behavior — a plain `switch` with no flag does exact (case-insensitive) equality matching only, the same as `-eq`.\n- **Using `switch -File` for a file too large to comfortably process line-by-line in a case structure**, when `Select-String` (Chapter 2.11) or `Get-Content | Where-Object` would express the same intent more clearly for a simple search.\n\n### How this connects\n\nThe wildcard and regex matching modes here are the exact same tools from Chapter 2.4 and 2.11, applied to a multi-branch decision instead of a single condition. `switch`'s per-element array behavior previews the loop-like thinking Chapter 3.3 covers properly. `break`, used here to opt into \"stop at first match,\" gets its own full chapter as loop control in Chapter 3.6.\n\n### Quick recap\n\n- `switch ($value) { \"case\" { ... } default { ... } }` — checks `$value` against each case, top to bottom.\n- **Every matching case runs by default** — not just the first, a real difference from most other languages' `switch`. Add `break` inside a case to stop there.\n- `-Wildcard` and `-Regex` switch the matching mode for every case in the block to glob-style or full regex matching, respectively.\n- Handing `switch` an array runs the whole case structure once per element.\n- `switch -File path` tests each line of a file, with `$_` holding the current line inside each case."}, {"id": "3.3", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 3, "slug": "foreach-vs-foreach-object", "fullTitle": "`foreach` vs. `ForEach-Object`", "title": "`foreach` vs. `ForEach-Object`", "md": "### Why this matters\n\nPowerShell has two completely different things that both go by \"foreach\" in casual conversation, and they behave differently enough — especially around `break`/`continue` — that confusing them causes real bugs, not just style complaints. Getting this distinction solid now avoids a genuinely common source of confusion later.\n\n### The core idea\n\n- **`foreach` (the statement)** — a language keyword, `foreach ($item in $collection) { ... }`, that loads the whole collection and loops over it directly.\n- **`ForEach-Object` (the cmdlet)** — part of the pipeline, `$collection | ForEach-Object { ... }`, processing one item at a time as it flows through.\n\nFor simple cases, they look and behave almost identically. The differences that actually matter — speed, and how `break`/`continue` behave — are real, and this chapter verifies both directly rather than just asserting them.\n\n### Examples\n\n**1. The same loop, written both ways.**\n```powershell\nforeach ($n in 1, 2, 3) { $n * 10 }\n1, 2, 3 | ForEach-Object { $_ * 10 }\n```\nOutput (identical for both):\n```\n10\n20\n30\n```\nNotice the variable naming difference too: `foreach` lets you name the loop variable yourself (`$n`); `ForEach-Object` always uses the automatic `$_`/`$PSItem` (Chapter 2.10) instead.\n\n**2. A third variant worth knowing about: the `.ForEach()` method.**\n```powershell\n(1, 2, 3).ForEach({ $_ * 10 })\n```\nOutput:\n```\n10\n20\n30\n```\nEvery array has a built-in `.ForEach()` method that does the same job as a method call instead of either a keyword or a cmdlet — genuinely handy for a short, single-expression transform chained directly off an array, though this book will mostly use the two main forms above.\n\n**3. Speed — measured directly, and the difference is real.**\n```powershell\n$sw = [System.Diagnostics.Stopwatch]::StartNew()\nforeach ($n in 1..1000000) { $x = $n * 2 }\n$sw.Stop()\n\"foreach: $($sw.ElapsedMilliseconds)ms\"\n\n$sw2 = [System.Diagnostics.Stopwatch]::StartNew()\n1..1000000 | ForEach-Object { $x = $_ * 2 }\n$sw2.Stop()\n\"ForEach-Object: $($sw2.ElapsedMilliseconds)ms\"\n```\nOutput, verified on this book's reference machine (exact numbers will vary by system, but the *relationship* is consistent and well-documented):\n```\nforeach: 357ms\nForEach-Object: 1289ms\n```\nThe `foreach` statement was over 3x faster here for a million iterations. This is because `ForEach-Object` is a real cmdlet — every single iteration goes through the overhead of the pipeline machinery — while `foreach` is a language construct operating directly on an already-in-memory collection, with none of that per-item cost. For a handful of items, this difference is meaningless; in a genuinely large loop, it's worth remembering `foreach` exists specifically for this reason. Chapter 8.4 covers this trade-off in more depth.\n\n**4. `break` and `continue` behave correctly, as expected, inside `foreach`.**\n```powershell\nforeach ($n in 1, 2, 3, 4, 5) { if ($n -eq 3) { break }; $n }\nforeach ($n in 1, 2, 3, 4, 5) { if ($n -eq 3) { continue }; $n }\n```\nOutput:\n```\n1\n2\n1\n2\n4\n5\n```\nExactly as you'd expect from any language's loop: `break` stops the whole loop immediately; `continue` skips just that one iteration and moves on to the next.\n\n**5. `break`/`continue` inside `ForEach-Object` do *not* behave the same way — verified directly, and this is the trap this chapter exists to warn you about.**\n```powershell\n1, 2, 3, 4, 5 | ForEach-Object { if ($_ -eq 3) { continue }; $_ }\n```\nOutput:\n```\n1\n2\n```\nRead that again: this used `continue`, not `break` — and it stopped the entire pipeline anyway, exactly like `break` would, rather than skipping just element `3` and continuing on to `4` and `5`. Verified even more concretely, inside an actual script file with a line *after* the pipeline:\n```powershell\n\"before\"\n1, 2, 3, 4, 5 | ForEach-Object { if ($_ -eq 3) { break } }\n\"after\"\n```\n`\"after\"` never printed at all. Inside a `ForEach-Object` script block, both `break` and `continue` act like a `break` that reaches all the way out — not the per-iteration control you'd get from `foreach`. This is because `ForEach-Object`'s script block isn't a loop body in the language sense — it's a pipeline step, and `break`/`continue` inside it interact with PowerShell's flow control in a way that surprises almost everyone the first time they hit it.\n\n### ⚠️ Common Mistakes\n\n- **Using `break` or `continue` inside a `ForEach-Object` script block expecting per-iteration control**, exactly as Example 5 demonstrated going wrong. If a loop genuinely needs `break`/`continue` to work the familiar way, use the `foreach` statement instead — this alone is often the deciding factor between the two.\n- **Defaulting to `ForEach-Object` purely out of pipeline habit for a large, performance-sensitive loop.** As Example 3 measured directly, `foreach` is meaningfully faster at scale — reach for it deliberately once a loop's size makes that difference real.\n- **Defaulting to `foreach` even when the data is already arriving through a pipeline.** If you're already mid-pipeline (`Get-Process | Where-Object {...} | ForEach-Object {...}`), `ForEach-Object` keeps the whole thing one continuous, streaming pipeline — switching to a `foreach` statement there would mean collecting everything into a variable first, losing that streaming benefit.\n- **Confusing the `foreach` statement with the `.ForEach()` method** — they share a name but are genuinely different things (a keyword vs. a method call), even though both avoid `ForEach-Object`'s pipeline overhead.\n\n### How this connects\n\nChapter 8.4 (Performance & Efficiency) returns to Example 3's measurement with more real benchmarks. `break`/`continue`'s *correct* behavior gets its own full chapter next-but-one, in Chapter 3.6 — worth reading with Example 5's surprise fresh in mind. `ForEach-Object`'s deeper capabilities (`-Begin`/`-Process`/`-End`, `-Parallel`) get a full chapter of their own in 5.5.\n\n### Quick recap\n\n- `foreach ($item in $collection) { ... }` is a language statement; `$collection | ForEach-Object { ... }` is a pipeline cmdlet — they look similar but work differently underneath.\n- `foreach` is measurably faster for large in-memory collections (verified: over 3x on a million-item loop); `ForEach-Object` fits naturally into an already-streaming pipeline.\n- `.ForEach({...})` is a third variant — a method directly on an array.\n- **`break` and `continue` work as expected inside `foreach`, but both act like a full `break` out of the entire pipeline inside `ForEach-Object`** — verified directly, and the single most important difference to remember between the two."}, {"id": "3.4", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 4, "slug": "for-loops", "fullTitle": "`for` Loops", "title": "`for` Loops", "md": "### Why this matters\n\nThe moment a loop needs to count — a fixed number of repetitions, walking backward through a list by index, stepping by something other than 1 — `for` is the tool built exactly for that shape of problem.\n\n### The core idea\n\n```powershell\nfor (initialization; condition; increment) {\n    # runs while condition is true\n}\n```\nAll three parts run automatically at the right moment: initialization once, before the loop starts; the condition checked before every iteration; the increment after every iteration. This is the same three-part shape you'll recognize from C, Bash, or JavaScript if you've used any of them.\n\n### Examples\n\n**1. A basic counting loop.**\n```powershell\nfor ($i = 0; $i -lt 5; $i++) {\n    $i\n}\n```\nOutput:\n```\n0\n1\n2\n3\n4\n```\n\n**2. Counting backward.**\n```powershell\nfor ($i = 5; $i -gt 0; $i--) {\n    $i\n}\n```\nOutput:\n```\n5\n4\n3\n2\n1\n```\nJust flip the comparison and the increment direction — `for` has no built-in notion of \"forward\" or \"backward,\" only what the three parts say to do.\n\n**3. Multiple updates in the increment clause, separated by commas.**\n```powershell\n$i = 0; $j = 10\nfor (; $i -lt 3; $i++, $j--) {\n    \"$i,$j\"\n}\n```\nOutput:\n```\n0,10\n1,9\n2,8\n```\nThe increment clause accepts multiple comma-separated statements, run together after each iteration — genuinely useful for tracking two related counters at once. The initialization clause is left empty here (just `;`) since both variables were already set up beforehand; verified directly, trying to cram two separate assignments into the *initialization* clause with a comma the same way doesn't parse the way you might expect — pre-initializing outside the loop, as shown here, is the reliable pattern when more than one variable needs setting up.\n\n**4. An infinite loop, deliberately, with `break` to actually stop it.**\n```powershell\n$c = 0\nfor (;;) {\n    $c++\n    if ($c -ge 3) { break }\n    $c\n}\n```\nOutput:\n```\n1\n2\n```\nLeaving all three clauses empty (`for (;;)`) creates a loop with no built-in stopping condition at all — entirely intentional here, relying on `break` (Chapter 3.6) inside the body to end it. This pattern shows up anytime a loop's real exit condition doesn't fit neatly into a single up-front comparison.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the increment entirely**, producing a loop that runs forever unless something else inside it (like `break`) stops it — an easy typo to make and a genuinely confusing one to debug if it's not what was intended.\n- **Trying to cram multiple variable initializations into the initialization clause with a comma**, expecting it to work the way the increment clause's comma-separated statements do. As Example 3 showed, that's not reliable — initialize any extra variables before the loop starts instead.\n- **Reaching for `for` when `foreach` (Chapter 3.3) would express the intent more clearly.** `for` is specifically for counting — if you're really just walking every item in a collection without caring about its numeric index, `foreach` reads better and avoids an off-by-one mistake in the condition.\n- **Off-by-one errors in the condition.** `-le` vs. `-lt` (or `-ge` vs. `-gt`) is the classic place a loop runs one time too many or too few — double-check which one actually matches the intended range.\n\n### How this connects\n\n`for`'s three-part shape leans directly on Chapter 2.4's comparison operators for its condition and Chapter 2.3's increment/decrement operators for its increment clause. `break`, used deliberately in Example 4, gets its full, proper treatment in Chapter 3.6 alongside `continue`.\n\n### Quick recap\n\n- `for (init; condition; increment) { ... }` — all three parts are optional, each separated by a semicolon.\n- Counts forward or backward depending only on the comparison and increment direction you write.\n- The increment clause accepts multiple comma-separated statements; the initialization clause does not reliably support the same pattern — pre-initialize extra variables before the loop instead.\n- `for (;;) { ... }` (all clauses empty) is a deliberate infinite loop, relying on `break` inside the body to end it."}, {"id": "3.5", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 5, "slug": "while-do-while-do-until-loops", "fullTitle": "`while`, `do-while` & `do-until` Loops", "title": "`while`, `do-while` & `do-until` Loops", "md": "### Why this matters\n\nNot every loop has a natural counter — sometimes you need to keep going \"while this file still has more lines\" or \"until the user types quit,\" with no fixed number of iterations known in advance. PowerShell gives you three closely related tools for exactly this, differing only in *when* the condition gets checked.\n\n### The core idea\n\n- **`while (condition) { ... }`** — checks the condition *first*; if it's false right away, the body never runs at all.\n- **`do { ... } while (condition)`** — checks the condition *after* the body runs; guarantees the body runs **at least once**, no matter what.\n- **`do { ... } until (condition)`** — identical to `do-while`, except it loops *while the condition is false*, stopping once it becomes true — the logical opposite framing of the same check.\n\n### Examples\n\n**1. `while` — checked before every iteration, including the first.**\n```powershell\n$i = 0\nwhile ($i -lt 3) {\n    $i\n    $i++\n}\n```\nOutput:\n```\n0\n1\n2\n```\n\n**2. `while` with a condition that's already false — the body never runs, not even once.**\n```powershell\n$i = 10\nwhile ($i -lt 3) { \"never\" }\n\"done\"\n```\nOutput:\n```\ndone\n```\n`\"never\"` doesn't print at all — `while` checks *before* running the body, so a condition that's already false from the start skips it entirely.\n\n**3. `do-while` — the same loop, but guaranteed to run at least once.**\n```powershell\n$i = 0\ndo {\n    $i\n    $i++\n} while ($i -lt 3)\n```\nOutput:\n```\n0\n1\n2\n```\nLooks identical to Example 1's result here — the difference only shows up when the condition starts out false, which is exactly what the next example proves.\n\n**4. `do-while`'s real distinguishing feature, proven directly.**\n```powershell\n$i = 10\ndo {\n    \"ran once: $i\"\n} while ($i -lt 3)\n```\nOutput:\n```\nran once: 10\n```\nUnlike Example 2's `while`, this body ran — exactly once — even though `$i -lt 3` was already false before the loop even started. `do-while` checks *after* the body, guaranteeing at least one run no matter what. This is the right tool anytime a loop's body needs to happen at least once regardless of the starting condition — reading a menu choice and validating it, for instance, where you need to show the menu at least once before there's anything to check.\n\n**5. `do-until` — the same \"at least once\" guarantee, with inverted logic.**\n```powershell\n$i = 0\ndo {\n    $i\n    $i++\n} until ($i -ge 3)\n```\nOutput:\n```\n0\n1\n2\n```\nIdentical result to Example 3's `do-while` — because `$i -ge 3` being the *stop* condition is the exact logical opposite of `$i -lt 3` being the *continue* condition. Pick whichever one reads more naturally for a given loop: \"keep going *while* this is true\" or \"keep going *until* this becomes true\" are the same idea, and either can make a condition easier or harder to read depending on how it's phrased.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting a loop needs something inside it that eventually changes the condition.** A `while` or `do-while` loop with a condition that never changes runs forever — always double-check the body actually moves toward the exit condition (incrementing a counter, reading the next line, updating a flag).\n- **Reaching for `while` when the body genuinely needs to run at least once**, and adding an awkward workaround (duplicating the body, or an artificial \"first run\" flag) instead of just using `do-while`.\n- **Writing a `do-until` condition backward**, since it's easy to phrase the stopping condition as if it were a continuing one out of habit from `while`. Read it out loud: \"do this **until** X\" should describe when to *stop*, not when to *keep going*.\n- **Choosing between `-lt`/`-ge` (or similar opposite pairs) carelessly when switching between `while`- and `until`-style phrasing.** Chapter 2.4's full comparison-operator set is worth having genuinely memorized for exactly this kind of quick mental flip.\n\n### How this connects\n\nEvery comparison and logical operator from Chapter 2.4 is exactly what powers these conditions. `break` and `continue`, used sparingly so far, get their full, dedicated treatment in the very next chapter — genuinely useful inside any of these three loop forms for an early exit or an early skip that doesn't fit cleanly into the loop's main condition.\n\n### Quick recap\n\n- `while (condition) { ... }` checks first — the body may never run at all.\n- `do { ... } while (condition)` and `do { ... } until (condition)` both check *after* the body — guaranteed to run **at least once**, regardless of the starting condition.\n- `do-while` continues while its condition is true; `do-until` continues while its condition is false (stops once true) — the same guarantee, opposite phrasing.\n- Every loop needs something inside it that eventually changes the condition, or it never ends."}, {"id": "3.6", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 6, "slug": "break-continue-loop-labels", "fullTitle": "`break`, `continue` & Loop Labels", "title": "`break`, `continue` & Loop Labels", "md": "### Why this matters\n\nSometimes a loop's natural stopping condition doesn't capture everything — you find what you're looking for early and want to stop right there, or one particular iteration needs to be skipped without ending the whole loop. `break` and `continue` handle both, and **loop labels** solve a real problem that comes up the moment loops are nested: which loop does `break` actually mean?\n\n### The core idea\n\n- **`break`** — exits the current loop immediately, skipping everything remaining in it.\n- **`continue`** — skips the rest of the *current iteration* only, and moves on to the next one; the loop itself keeps going.\n- A **label** (`:name` right before a loop) lets `break`/`continue` target a *specific* loop by name — essential once loops are nested and a plain `break` would only reach the innermost one.\n\n(A reminder from Chapter 3.3: this chapter's `break`/`continue` behavior describes `foreach`, `for`, `while`, and `do-while`/`do-until` — **not** `ForEach-Object`'s script block, where both act like an unconditional `break` out of the entire pipeline, a genuinely different and important exception covered in 3.3.)\n\n### Examples\n\n**1. `break` — stop the loop entirely.**\n```powershell\nforeach ($n in 1..5) {\n    if ($n -eq 3) { break }\n    $n\n}\n```\nOutput:\n```\n1\n2\n```\nThe loop stops the moment `$n` reaches `3` — `4` and `5` are never even checked.\n\n**2. `continue` — skip just this one iteration.**\n```powershell\nforeach ($n in 1..5) {\n    if ($n -eq 3) { continue }\n    $n\n}\n```\nOutput:\n```\n1\n2\n4\n5\n```\n`3` is skipped, but the loop keeps going afterward — a real difference from `break`, which would have stopped everything right there.\n\n**3. Nested loops — an unlabeled `break` only breaks the *innermost* loop.**\n```powershell\nforeach ($i in 1..3) {\n    foreach ($j in 1..3) {\n        if ($j -eq 2) { break }\n        \"i=$i j=$j\"\n    }\n}\n```\nOutput:\n```\ni=1 j=1\ni=2 j=1\ni=3 j=1\n```\nThe inner loop breaks every time `$j` hits `2` — but the *outer* loop keeps running normally for every value of `$i`, producing one line per outer iteration. This is exactly the behavior most people expect, and exactly the case where it stops being enough the moment you need to break out of *both* loops at once.\n\n**4. A label — breaking all the way out to a specific outer loop.**\n```powershell\n:outer foreach ($i in 1..3) {\n    foreach ($j in 1..3) {\n        if ($j -eq 2 -and $i -eq 2) { break outer }\n        \"i=$i j=$j\"\n    }\n}\n```\nOutput:\n```\ni=1 j=1\ni=1 j=2\ni=1 j=3\ni=2 j=1\n```\n`:outer` labels the outer loop; `break outer` (inside the *inner* loop) reaches all the way out and stops both loops entirely, the moment `$i` is `2` and `$j` is `2` — without a label, there'd be no way to express \"stop the outer loop from inside the inner one\" at all.\n\n**5. `continue` with a label works the same way — skipping the *outer* loop's current iteration from inside the inner one.**\n```powershell\n:outer foreach ($i in 1..3) {\n    foreach ($j in 1..3) {\n        if ($j -eq 2) { continue outer }\n        \"i=$i j=$j\"\n    }\n}\n```\nOutput:\n```\ni=1 j=1\ni=2 j=1\ni=3 j=1\n```\nEvery time the inner loop's `$j` hits `2`, `continue outer` abandons the rest of the *inner* loop entirely and jumps straight to the outer loop's next iteration — which is why only one line prints per value of `$i`, exactly the same shape of output as Example 3's plain inner `break`, but for a genuinely different reason underneath.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a plain `break` inside a nested loop exits every level.** As Example 3 showed, it only exits the *innermost* loop it's directly inside — use a label (Example 4) when the outer loop needs to stop too.\n- **Forgetting the label needs a colon and must sit immediately before the loop keyword** (`:outer foreach (...)`, not `outer: foreach (...)` or a label placed elsewhere) — a misplaced label is a straightforward parser error.\n- **Using `break`/`continue` inside a `ForEach-Object` script block expecting this chapter's behavior.** As Chapter 3.3 demonstrated directly, both act like a full pipeline `break` there — a real, important exception to keep in mind.\n- **Reaching for a label when restructuring the logic (a flag variable, or extracting the inner loop into a function) would actually read more clearly.** Labels are the right tool sometimes, but a deeply nested loop with several labeled breaks can get hard to follow — worth a second look before reaching for one out of habit.\n\n### How this connects\n\nThis chapter completes the loop-control toolkit that Chapter 3.3, 3.4, and 3.5 all left `break`/`continue` mentioned but not fully explained — now every loop type in Part III has its complete behavior on record, including the real `ForEach-Object` exception from 3.3. Chapter 4.8 (Recursion) revisits \"how do I stop\" from a completely different angle — a base case instead of `break`.\n\n### Quick recap\n\n- `break` exits the current loop immediately; `continue` skips just the current iteration and keeps looping.\n- Both behave normally in `foreach`, `for`, `while`, and `do-while`/`do-until` — but act like an unconditional pipeline `break` inside `ForEach-Object`'s script block (Chapter 3.3).\n- An unlabeled `break`/`continue` inside nested loops only affects the **innermost** loop.\n- `:label` immediately before a loop, then `break label` / `continue label` from anywhere inside it (including a nested inner loop), targets that specific loop directly."}, {"id": "3.7", "partNum": 3, "partTitle": "Part III — Sentences", "partMetaphor": "expressing a complete thought", "chapNum": 7, "slug": "getting-input-from-the-user", "fullTitle": "Getting Input From the User (`Read-Host`)", "title": "Getting Input From the User (`Read-Host`)", "md": "### Why this matters\n\nNot every script's input comes from a parameter or a file — sometimes a script genuinely needs to stop and ask a person a question while it's running. `Read-Host` is PowerShell's straightforward tool for exactly that, plus a specific, safer variant for anything sensitive like a password.\n\n### The core idea\n\n```powershell\n$name = Read-Host \"Enter your name\"\n```\n`Read-Host` prints the given prompt, waits for the person at the keyboard to type something and press Enter, and returns whatever they typed as a plain string.\n\n### Examples\n\n**1. A basic prompt.**\n\nRun interactively, typing `Alex` when prompted:\n```powershell\n$name = Read-Host \"Enter your name\"\n\"Hello, $name\"\n```\nOutput:\n```\nEnter your name: Alex\nHello, Alex\n```\n(Verified on this book's reference system by feeding input non-interactively — `Alex` was supplied as if typed, and the script correctly used it. The interactive experience is identical; you'd just be typing it yourself.)\n\n**2. `-AsSecureString` — for anything sensitive, like a password.**\n```powershell\n$pw = Read-Host
