le": "Part VI — Chapters", "partMetaphor": "structuring a lot of paragraphs together: scripts & modules", "chapNum": 6, "slug": "organizing-a-multi-file-project", "fullTitle": "Organizing a Multi-File Project", "title": "Organizing a Multi-File Project", "md": "### Why this matters\n\nA script that's grown to hundreds of lines, with several distinct groups of related functions, becomes hard to navigate as one file. Chapter 6.2 and 6.3 already gave you the tools to split it apart (dot-sourcing, modules) — what's been missing is a reliable way for a script to find *its own* files regardless of where it's actually run from. This chapter closes that gap and rounds out Part VI.\n\n### The core idea\n\n`$PSScriptRoot` (Chapter 2.10 first introduced it) always holds the folder the *currently running script* lives in — reliable no matter what folder the user happened to be in when they launched it. Combine it with dot-sourcing (`. \"$PSScriptRoot/lib/helpers.ps1\"`) to reliably pull in sibling files, and a module's manifest can reference several `.psm1` files at once via `NestedModules` once a single file genuinely isn't enough.\n\n### Examples\n\n**1. Reliably sourcing a sibling file with `$PSScriptRoot`.**\n\n`project/lib/helpers.ps1`:\n```powershell\nfunction Get-Greeting { param($Name) \"Hello, $Name!\" }\n```\n`project/main.ps1`:\n```powershell\n. \"$PSScriptRoot/lib/helpers.ps1\"\nGet-Greeting \"Alex\"\n```\nRun from a **completely different working directory** than where the project lives:\n```powershell\ncd /tmp\n./project/main.ps1\n```\nOutput:\n```\nHello, Alex!\n```\nVerified directly — even though the current working directory was `/tmp`, nothing to do with the project, `$PSScriptRoot` still correctly resolved to `main.ps1`'s own folder, and the relative path to `lib/helpers.ps1` worked exactly as intended. Using a plain relative path instead (`. \"./lib/helpers.ps1\"`) would have failed here, since it would have been resolved against the *current directory*, not the script's own location.\n\n**2. `NestedModules` — a manifest referencing several code files at once.**\n\n`BigModule/Part1.psm1`:\n```powershell\nfunction Get-One { 1 }\n```\n`BigModule/Part2.psm1`:\n```powershell\nfunction Get-Two { 2 }\n```\n`RootModule` still needs to point at something real, even if the actual code lives entirely in the nested files — an empty file is enough:\n```powershell\nNew-Item -ItemType File -Path /tmp/BigModule/BigModule.psm1\n```\nGenerating a manifest that ties all three together:\n```powershell\nNew-ModuleManifest -Path /tmp/BigModule/BigModule.psd1 -RootModule \"BigModule.psm1\" -NestedModules @(\"Part1.psm1\", \"Part2.psm1\") -ModuleVersion \"1.0.0\" -FunctionsToExport @(\"Get-One\", \"Get-Two\")\nImport-Module /tmp/BigModule/BigModule.psd1\nGet-One\nGet-Two\n```\nOutput:\n```\n1\n2\n```\n`-NestedModules` tells the manifest to load additional `.psm1` files alongside the main `RootModule` — genuinely useful once a module's code has naturally split into logical groups (say, one file per feature area) but should still present as a single, unified module to whoever imports it. `-FunctionsToExport` at the manifest level works alongside (or instead of) each nested file's own `Export-ModuleMember` calls, giving one central place to control the module's full public surface. Verified directly: without a real (even empty) `BigModule.psm1` file for `RootModule` to point at, `Import-Module` fails outright — the nested files alone aren't enough, since the manifest still expects a genuine root module to load first.\n\n### ⚠️ Common Mistakes\n\n- **Using a plain relative path (`./lib/helpers.ps1`) instead of `$PSScriptRoot`** to find a sibling file. As Example 1 demonstrated, a relative path resolves against the *current working directory*, which depends entirely on where the user happened to run the script from — not reliable. Always build sibling-file paths off `$PSScriptRoot`.\n- **Splitting a project into many files without a clear organizing principle.** Structure by logical grouping (all string helpers together, all API-calling functions together) — a folder full of arbitrarily-split files is barely better than one giant one.\n- **Forgetting `NestedModules` files still need their own `Export-ModuleMember`** (or relying on the manifest's `FunctionsToExport` to be the single source of truth) — mixing both without a clear convention gets confusing fast about what's actually exported.\n- **Reaching for a full module with a manifest when a project is still small enough that a couple of dot-sourced files would do.** Chapter 6.2's dot-sourcing remains the simpler, faster choice for a small project — modules earn their extra structure once real sharing, versioning, or export control genuinely matters.\n\n### How this connects\n\nThis chapter completes Part VI by tying together dot-sourcing (6.2), modules (6.3), manifests (6.4), and `$PSScriptRoot` (first introduced in 2.10) into one coherent picture for structuring a real, multi-file PowerShell project. Part VII, next, shifts focus to the everyday toolbox — the filesystem, processes, .NET, and more — that a well-organized project like this one actually gets built out of.\n\n### Quick recap\n\n- `$PSScriptRoot` reliably resolves to the running script's own folder, regardless of the user's current working directory — verified directly as the correct way to find and dot-source sibling files, where a plain relative path would fail.\n- A module manifest's `-NestedModules` loads several `.psm1` files together as one unified module; `-FunctionsToExport` can centralize what the whole module exposes.\n- Choose dot-sourcing for a small project, a full module (with manifest) once sharing, versioning, or real export control matters."}, {"id": "7.1", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 1, "slug": "working-with-the-filesystem", "fullTitle": "Working with the Filesystem", "title": "Working with the Filesystem", "md": "### Why this matters\n\nReading a folder's contents, copying a file, checking whether something exists before touching it — this is the day-one, every-day toolbox of any real script. Part VII starts here because almost everything else in it (processes, .NET, APIs) eventually touches the filesystem too.\n\n### The core idea\n\n- **`Get-ChildItem`** — list what's inside a folder.\n- **`Get-Item`** — get a specific item itself (a file or folder), not what's inside it.\n- **`Copy-Item`/`Move-Item`/`Remove-Item`/`New-Item`** — the standard file operations, all following the same Verb-Noun pattern from Chapter 1.4.\n- **`Test-Path`** — check whether something exists, before assuming it does.\n\n### Examples\n\n**1. `Get-ChildItem` — listing a folder's contents.**\n```powershell\nGet-ChildItem /tmp/fstest\n```\nOutput:\n```\n    Directory: /tmp/fstest\n\nUnixMode        User Group          LastWriteTime         Size Name\n--------        ---- -----          -------------         ---- ----\ndrwxrwxr-x      shad shad     9/7/2026 03:27         4096 sub\n-rw-rw-r--      shad shad     9/7/2026 03:27            8 file1.txt\n-rw-rw-r--      shad shad     9/7/2026 03:27            5 file2.log\n```\nEvery row is a real object (Chapter 1.6) with genuine properties — `Name`, `LastWriteTime`, and more — not just formatted text, even though it displays as a neat table.\n\n**2. `-Recurse` and `-File` — descending into subfolders, and filtering to just files.**\n```powershell\nGet-ChildItem /tmp/fstest -Recurse -File | Select-Object Name\n```\nOutput:\n```\nName\n----\nfile1.txt\nfile2.log\n```\n`-Recurse` walks every subfolder too; `-File` (a real switch, alongside its counterpart `-Directory`) keeps only actual files, filtering out folders without needing a separate `Where-Object { -not $_.PSIsContainer }`.\n\n**3. `-Filter` — narrowing by name pattern, efficiently.**\n```powershell\nGet-ChildItem /tmp/fstest -Filter \"*.txt\"\n```\nThis returns just `file1.txt`, skipping `file2.log` and the `sub` folder entirely. `-Filter` uses the same wildcard syntax as `-like` (Chapter 2.4) — and unlike piping into `Where-Object` afterward, it's applied by the filesystem provider itself, genuinely more efficient on a folder with many items (Chapter 8.4 covers why this distinction matters for performance).\n\n**4. `Test-Path` — checking existence before assuming it.**\n```powershell\nTest-Path /tmp/fstest/file1.txt\nTest-Path /tmp/fstest/nope.txt\n```\nOutput:\n```\nTrue\nFalse\n```\nA simple boolean, safe to check before any operation that would otherwise fail on a missing path — genuinely the standard guard clause for filesystem scripts.\n\n**5. `Copy-Item`, `Move-Item`, `Remove-Item` — the standard trio.**\n```powershell\nCopy-Item /tmp/fstest/file1.txt /tmp/fstest/file1-copy.txt\nTest-Path /tmp/fstest/file1-copy.txt\n\nMove-Item /tmp/fstest/file1-copy.txt /tmp/fstest/sub/moved.txt\nTest-Path /tmp/fstest/sub/moved.txt\n\nRemove-Item /tmp/fstest/sub/moved.txt\nTest-Path /tmp/fstest/sub/moved.txt\n```\nOutput:\n```\nTrue\nTrue\nFalse\n```\nCopy, then move (which also renames it here, since the destination filename differs), then remove — each step confirmed with `Test-Path`. All three follow Chapter 4.4's `SupportsShouldProcess` pattern, so `-WhatIf` works on every one of them (`Remove-Item -WhatIf` is a genuinely good habit before anything destructive).\n\n**6. `New-Item` — creating files and folders directly.**\n```powershell\nNew-Item -ItemType Directory -Path /tmp/fstest/newdir\nNew-Item -ItemType File -Path /tmp/fstest/newfile.txt\nTest-Path /tmp/fstest/newdir, /tmp/fstest/newfile.txt\n```\nOutput (trimmed to the final check):\n```\nTrue\nTrue\n```\n`-ItemType` distinguishes a folder from a file — the same cmdlet handles both.\n\n**7. `Get-Item` vs. `Get-ChildItem` — the item itself, not what's inside it.**\n```powershell\nGet-Item /tmp/fstest\n```\nOutput:\n```\n    Directory: /tmp\n\nUnixMode        User Group          LastWriteTime         Size Name\n--------        ---- -----          -------------         ---- ----\ndrwxrwxr-x      shad shad     9/7/2026 03:27         4096 fstest\n```\n`Get-Item` returned exactly *one* thing — the `fstest` folder itself, as an object — while `Get-ChildItem` (Example 1) on the same path returned everything *inside* it. Easy to mix up by name alone; the distinction matters constantly.\n\n### ⚠️ Common Mistakes\n\n- **Confusing `Get-Item` and `Get-ChildItem`.** `Get-Item path` gets the thing at `path` itself; `Get-ChildItem path` gets what's *inside* it — genuinely different results for the same path.\n- **Skipping `Test-Path` before an operation that assumes something exists**, and getting a real error instead of handling the missing case gracefully.\n- **Filtering with `Where-Object` when `-Filter` (or `-Include`/`-Exclude`) would do the identical job more efficiently**, especially on a large folder — Chapter 8.4 covers exactly why this matters at scale.\n- **Running `Remove-Item` (or any destructive operation) without `-WhatIf` first** on anything where a mistake would be costly — Chapter 4.4 built this safety net in for exactly this reason; use it.\n\n### How this connects\n\n`-Recurse`, `-Filter`, and `Test-Path` all reappear constantly throughout the rest of Part VII — the filesystem is the foundation almost every other real-world script eventually touches. Chapter 7.2 (PSDrives & Providers) reveals that `Get-ChildItem`/`Get-Item` aren't filesystem-specific at all — they work identically on the registry, environment variables, and more, once you see the pattern underneath.\n\n### Quick recap\n\n- `Get-ChildItem` lists a folder's contents (`-Recurse` descends into subfolders, `-File`/`-Directory` filter by type, `-Filter` narrows by wildcard pattern efficiently); `Get-Item` gets the item itself, not its contents.\n- `Test-Path` checks existence safely before an operation that would otherwise fail on a missing path.\n- `Copy-Item`, `Move-Item`, `Remove-Item`, `New-Item` are the standard file/folder operations — all support `-WhatIf` (Chapter 4.4) for safety on anything destructive."}, {"id": "7.2", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 2, "slug": "psdrives-providers", "fullTitle": "PSDrives & Providers", "title": "PSDrives & Providers", "md": "### Why this matters\n\nChapter 7.1's `Get-ChildItem`/`Get-Item`/`Test-Path` weren't secretly filesystem-only tools — they're built on a genuinely unique PowerShell idea: **providers**, which make things that aren't files at all (environment variables, function definitions, even the Windows registry) navigable with exactly the same filesystem-shaped commands. This is one of PowerShell's most distinctive capabilities, with no real equivalent in Bash or most other shells.\n\n### The core idea\n\nA **PSDrive** looks and acts like a disk drive (`C:`, or here, `/`) but can point at something that isn't a filesystem at all — environment variables, PowerShell's own variables, function definitions, certificates, and (on Windows) the registry. A **provider** is what makes a given kind of data navigable this way in the first place — `Get-ChildItem`, `Get-Item`, `Set-Location`, and the rest of Chapter 7.1's toolkit all work identically on any provider's drive, not just the real filesystem.\n\n### Examples\n\n**1. `Get-PSDrive` — every drive currently available, filesystem and otherwise.**\n```powershell\nGet-PSDrive\n```\nOutput (trimmed):\n```\nName      Used (GB)  Free (GB) Provider     Root\n----      ---------  --------- --------     ----\n/             48.04     180.07 FileSystem   /\nAlias                          Alias\nEnv                            Environment\nFunction                       Function\nVariable                       Variable\n```\n`/` (the real filesystem root, on this Linux reference machine) sits right alongside `Env`, `Alias`, `Function`, and `Variable` — genuinely different kinds of data, all listed and navigable the same way.\n\n**2. `Env:` — environment variables, as a drive.**\n```powershell\nGet-ChildItem Env: | Select-Object -First 3\n$env:HOME\nGet-Item Env:HOME\n```\nOutput (trimmed):\n```\nName                          Value\n----                          -----\n_                              /home/shad/.local/bin/pwsh\nAI_AGENT                       claude-code_2-1-263_agent\nANDROID_HOME                   /home/shad/Android/Sdk\n\n/home/shad\n\nName                          Value\n----                          -----\nHOME                           /home/shad\n```\nThree completely different ways to reach the same environment data: `Get-ChildItem Env:` lists everything (exactly like listing a folder), `$env:HOME` is the familiar shorthand syntax, and `Get-Item Env:HOME` treats one specific variable as a single item — the same `Get-Item` from Chapter 7.1, just pointed at a different provider.\n\n**3. `Set-Location` works on a non-filesystem drive too — genuinely, you can \"cd into\" environment variables.**\n```powershell\nSet-Location Env:\nGet-Location\n```\nOutput:\n```\nPath\n----\nEnv:/\n```\nThis isn't a metaphor or a special case — `Set-Location`/`cd` (Chapter 0.2) is provider-agnostic, working identically whether the destination is a real folder or an entirely different kind of data being presented as one.\n\n**4. `Get-PSProvider` — and an honest note about what's available on this system.**\n```powershell\nGet-PSProvider\n```\nOutput:\n```\nName                Capabilities                  Drives\n----                ------------                  ------\nAlias                ShouldProcess                {Alias}\nEnvironment          ShouldProcess                {Env}\nFileSystem           Filter, ShouldProcess, Crede… {Temp, /}\nFunction             ShouldProcess                {Function}\nVariable             ShouldProcess                {Variable}\n```\nVerified directly on this book's Linux reference machine: no `Registry` provider and no `Certificate` (`Cert:`) provider appear at all — both are genuinely Windows-only, since neither a registry nor a Windows-style certificate store exists to expose on Linux/macOS. If you're following along on Windows, `Get-PSProvider` there will show `Registry` and `Certificate` too, and `Get-ChildItem HKLM:\\SOFTWARE` (the registry, navigated exactly like a folder) becomes available — genuinely the same pattern this whole chapter demonstrates, just with one more provider present.\n\n**5. `Variable:` — even PowerShell's own variables are a navigable drive.**\n```powershell\n$myvar = \"test\"\nGet-Item Variable:myvar\n```\nOutput:\n```\nName                          Value\n----                          -----\nmyvar                         test\n```\nThe same idea, one level further: PowerShell exposes its *own* in-memory variables through this exact mechanism too.\n\n**6. `New-PSDrive` — creating your own shortcut drive.**\n```powershell\nNew-PSDrive -Name MyTemp -PSProvider FileSystem -Root /tmp\nGet-ChildItem MyTemp:\\\n```\nThis creates a new drive, `MyTemp:`, pointing at `/tmp` — from here on (for the rest of the session), `MyTemp:\\` works as a shorthand for that folder, exactly like any built-in drive. Genuinely convenient for a script that references one particular folder constantly, avoiding a long repeated path.\n\n### ⚠️ Common Mistakes\n\n- **Assuming providers are a Windows-only or filesystem-only concept.** As Examples 2, 3, and 5 showed directly, `Env:`, `Variable:`, `Alias:`, and `Function:` all work identically on Linux and macOS — only `Registry`/`Cert:` are genuinely Windows-specific.\n- **Using `$env:Name = value` to permanently change an environment variable** and expecting it to persist beyond the current session (or affect the actual operating system's environment). It only changes the variable for the current PowerShell process and anything it launches — not a system-wide, permanent change.\n- **Forgetting a script meant to run on both Windows and Linux/macOS can't rely on `Registry:`/`Cert:` being present** — check `$IsWindows` (Chapter 0.2) or `Get-PSProvider` before assuming either is available.\n- **Not realizing `Get-ChildItem`/`Get-Item`/`Test-Path` (Chapter 7.1) are provider-agnostic**, and writing separate, provider-specific code for something that would just work identically across drives.\n\n### How this connects\n\nEverything from Chapter 7.1 — `Get-ChildItem`, `Get-Item`, `Test-Path`, `Set-Location` — is exactly what this chapter revealed to be *provider*-based, not filesystem-specific. Chapter 7.10 (CIM & WMI) and the Windows-specific registry access mentioned in Example 4 both extend this same idea into deeper system information, for whoever's following along on Windows.\n\n### Quick recap\n\n- A **PSDrive** presents something (the filesystem, environment variables, PowerShell's own variables, and more) as a navigable drive; a **provider** is what makes a given kind of data work this way.\n- `Get-ChildItem`, `Get-Item`, `Set-Location`, and `Test-Path` all work identically across every provider's drive — this is genuinely the same mechanism, not a coincidence.\n- `Env:`, `Variable:`, `Alias:`, and `Function:` work on every platform; `Registry:` (`HKLM:`/`HKCU:`) and `Cert:` are Windows-only — verified directly, absent from `Get-PSProvider` on this book's Linux reference machine.\n- `New-PSDrive` creates your own shortcut drive pointing anywhere a provider can reach."}, {"id": "7.3", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 3, "slug": "working-with-processes", "fullTitle": "Working with Processes", "title": "Working with Processes", "md": "### Why this matters\n\nChecking what's running, launching a new program, stopping one that's misbehaving — genuinely everyday tasks for any automation script, and PowerShell's process cmdlets follow the exact same Verb-Noun, object-pipeline patterns you already know from every earlier chapter.\n\n### The core idea\n\n- **`Get-Process`** — see what's running.\n- **`Start-Process`** — launch something new.\n- **`Stop-Process`** — end a running process.\n\n### Examples\n\n**1. `Get-Process` — real objects with real properties, already familiar from Chapter 1.6.**\n```powershell\nGet-Process -Name pwsh | Select-Object -First 1 Name, Id, CPU\n```\nOutput:\n```\nName     Id   CPU\n----     --  ---\npwsh 217655 0.210\n```\nThis is literally the same cmdlet this book has used constantly since Chapter 1.5 to demonstrate the pipeline — nothing new about it, just its proper, dedicated coverage now.\n\n**2. `Start-Process` — launching something, and getting the new process back with `-PassThru`.**\n```powershell\n$p = Start-Process -FilePath \"sleep\" -ArgumentList \"5\" -PassThru\n$p.Id\n$p.ProcessName\n```\nOutput:\n```\n217700\nsleep\n```\n`-ArgumentList` passes arguments to the launched program; `-PassThru` is what makes `Start-Process` actually *return* the new process as an object (without it, `Start-Process` produces no output at all) — genuinely necessary the moment a script needs to track or later stop the process it just launched.\n\n**3. `Stop-Process` — ending a running process by its ID.**\n```powershell\n$p = Start-Process -FilePath \"sleep\" -ArgumentList \"30\" -PassThru\nStart-Sleep -Milliseconds 200\nStop-Process -Id $p.Id\nStart-Sleep -Milliseconds 200\nGet-Process -Id $p.Id -ErrorAction SilentlyContinue\n```\nOutput:\n```\n```\nNothing at all from the final `Get-Process` — confirming the process genuinely no longer exists. `-ErrorAction SilentlyContinue` (Chapter 5.9) suppresses the \"process not found\" error that would otherwise print, since not finding it here is exactly the expected, successful outcome.\n\n**4. `Start-Process -Wait` — blocking until the launched process actually finishes.**\n```powershell\n$sw = [System.Diagnostics.Stopwatch]::StartNew()\nStart-Process -FilePath \"sleep\" -ArgumentList \"1\" -Wait\n$sw.Stop()\n\"waited: $($sw.ElapsedMilliseconds)ms\"\n```\nOutput:\n```\nwaited: 1030ms\n```\nWithout `-Wait`, `Start-Process` launches and immediately moves on, leaving the new process running independently in the background; with it, the calling script genuinely pauses until the launched process exits — confirmed directly here, since the roughly-1-second `sleep` correctly held up the stopwatch for about that long.\n\n**5. Sorting and filtering processes — exactly Chapter 5.3's tools, applied to something real.**\n```powershell\nGet-Process | Sort-Object CPU -Descending | Select-Object -First 3 Name, CPU\n```\nOutput (will vary by system):\n```\nName                 CPU\n----                 ---\ngnome-shell     3129.890\ngnome-terminal-server 1886.510\nclaude           524.610\n```\nNo new concept here at all — this is precisely why Part V's pipeline chapters were worth learning thoroughly: they apply directly, with zero new syntax, to real system data like this.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `-PassThru` on `Start-Process`** and then having no way to reference the process that was just launched — no output at all is the default, silently.\n- **Not realizing `Start-Process` runs asynchronously by default.** A script that launches something and immediately assumes it's finished (without `-Wait`, or without polling `Get-Process`/checking an exit code) is racing against a process that may still be running.\n- **Using `Stop-Process` without being certain of the right process** — matching by `-Name` can hit more than one process at once if several share the same name; `-Id` (Example 3) is the precise, safe way to target exactly one.\n- **Forgetting `-ErrorAction SilentlyContinue` when checking a process is genuinely gone**, and getting unwanted error noise for what's actually the expected, successful case (Example 3).\n\n### How this connects\n\nEvery Part V pipeline tool (`Sort-Object`, `Where-Object`, `Select-Object`) applies directly to `Get-Process`'s output with zero new syntax, exactly as Example 5 showed. Chapter 7.6 (Calling External Programs) covers a different, more common way to run an external command and capture its output directly — `Start-Process` is specifically for launching something as its own independent process, not for capturing what it prints.\n\n### Quick recap\n\n- `Get-Process` returns real process objects — every Part V pipeline tool works on them directly.\n- `Start-Process -FilePath -ArgumentList -PassThru` launches a new process and returns it as an object; without `-PassThru`, nothing is returned at all.\n- `Start-Process` is asynchronous by default — add `-Wait` to block until the launched process actually finishes.\n- `Stop-Process -Id` targets a specific process precisely; matching by `-Name` can hit more than one at once."}, {"id": "7.4", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 4, "slug": "working-with-services", "fullTitle": "Working with Services", "title": "Working with Services", "md": "### Why this matters\n\nA **service** is a program Windows runs in the background, independent of any logged-in user — a database engine, a web server, a print spooler. Checking, starting, stopping, and restarting services is a genuinely everyday task for real-world Windows administration, and PowerShell's service cmdlets follow the same familiar Verb-Noun shape as everything else in this book.\n\n### An honest note before starting\n\n**This chapter's cmdlets are Windows-only** — verified directly: `Get-Service` doesn't exist at all on this book's Linux reference machine (`Get-Service: The term 'Get-Service' is not recognized...`, the same \"not recognized\" error from Chapter 1.1, not a permissions or configuration issue). Unlike every other chapter in this book, the examples here are based on PowerShell's well-established, standard documented behavior rather than this book's own usual live-verification-on-this-machine — there's simply no Windows service manager to verify against outside of Windows itself. If you're following along on Windows, everything below works directly; on Linux/macOS, `systemctl`/`launchctl` (through Chapter 7.6's `&` call operator) are the equivalent tools for that platform's own service manager.\n\n### The core idea\n\n```powershell\nGet-Service              # list services and their status\nStart-Service -Name X    # start one\nStop-Service -Name X     # stop one\nRestart-Service -Name X  # stop then start\n```\nEach service has a `Status` (`Running`, `Stopped`, and a few transitional states) and both a short `Name` and a human-readable `DisplayName`.\n\n### Examples\n\n**1. Listing services.**\n```powershell\nGet-Service\n```\nOn Windows, this returns one object per service, each with `Status`, `Name`, and `DisplayName` — real objects, filterable and sortable with every Part V tool exactly like `Get-Process`.\n\n**2. Filtering to a specific service, or a name pattern.**\n```powershell\nGet-Service -Name \"wuauserv\"\nGet-Service -Name \"w*\"\n```\n`-Name` accepts wildcards (Chapter 2.4's `-like` syntax), matching several services at once when a pattern is given rather than one exact name.\n\n**3. Filtering by status — exactly Chapter 5.1's `Where-Object`, applied here.**\n```powershell\nGet-Service | Where-Object { $_.Status -eq \"Running\" }\n```\nNo new syntax at all — services are pipeline objects with a real `Status` property, so filtering them works identically to filtering anything else this book has covered.\n\n**4. Starting, stopping, and restarting.**\n```powershell\nStart-Service -Name \"Spooler\"\nStop-Service -Name \"Spooler\"\nRestart-Service -Name \"Spooler\"\n```\nEach of these, like `Remove-Item` (Chapter 7.1) and `Stop-Process` (Chapter 7.3), supports `-WhatIf` — genuinely worth using before stopping or restarting anything on a system where an interruption would actually matter.\n\n**5. Checking whether a service is set to start automatically.**\n```powershell\nGet-Service -Name \"Spooler\" | Select-Object Name, Status, StartType\n```\n`StartType` (`Automatic`, `Manual`, `Disabled`) reports whether a service launches on its own at boot — a separate concern from `Status`, which only reports whether it's *currently* running right now.\n\n### ⚠️ Common Mistakes\n\n- **Assuming `Get-Service` is available everywhere PowerShell is**, exactly the trap this chapter opened by flagging directly. Check `Get-Command Get-Service -ErrorAction SilentlyContinue` before relying on it in a script meant to be cross-platform.\n- **Stopping a service without `-WhatIf` first** on a production or shared system — an interrupted critical service can have real, immediate consequences.\n- **Confusing `Status` (currently running or not) with `StartType` (whether it starts automatically at boot).** A service can be `Stopped` right now but still set to `Automatic` — they answer genuinely different questions.\n- **Trying to manage a Linux service (systemd) with `Get-Service`/`Start-Service`.** These cmdlets have no concept of `systemctl` units at all — Chapter 7.6 covers calling `systemctl` (or `launchctl` on macOS) directly as an external program instead.\n\n### How this connects\n\nFiltering and sorting services (Example 3) leans directly on Part V's pipeline tools, exactly like Chapter 7.3 did for processes. Chapter 7.6 covers calling platform-specific external tools (`systemctl`, `launchctl`) directly — the cross-platform equivalent for anyone needing service-style control outside Windows.\n\n### Quick recap\n\n- `Get-Service`/`Start-Service`/`Stop-Service`/`Restart-Service` are genuinely **Windows-only** — verified directly, absent entirely on this book's Linux reference machine.\n- Every service object has a `Status` (currently running or not) and a separate `StartType` (whether it starts automatically) — don't confuse the two.\n- Filtering/sorting services uses exactly the same Part V pipeline tools as everything else — no new syntax.\n- On Linux/macOS, reach for the platform's own service manager (`systemctl`, `launchctl`) via Chapter 7.6's external-program calling instead."}, {"id": "7.5", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 5, "slug": "net-integration-calling-net-classes-methods-directly", "fullTitle": ".NET Integration: Calling .NET Classes & Methods Directly", "title": ".NET Integration: Calling .NET Classes & Methods Directly", "md": "### Why this matters\n\nYou've already been calling .NET directly since Chapter 2.3's `[math]::Sqrt()` — this chapter makes that pattern fully explicit and general. PowerShell is built directly on .NET, and its entire class library — thousands of ready-made classes for genuinely everything — is one `[Namespace.ClassName]::Method()` away, the moment a cmdlet doesn't already do what's needed.\n\n### The core idea\n\n`[System.Namespace.ClassName]` refers to a .NET type directly. From there:\n- **`::StaticMethod()`** calls a method that belongs to the type itself (Chapter 2.3's `[math]::Sqrt()`).\n- **`::new()`** creates a new instance (Chapter 2.5's `[System.Collections.ArrayList]::new()`, Chapter 4.9's `[Person]::new()`).\n- Once you have an instance, its own methods and properties work with ordinary dot syntax, exactly like anything else in PowerShell.\n\n### Examples\n\n**1. A static method you haven't seen yet — generating a unique ID.**\n```powershell\n[System.Guid]::NewGuid()\n```\nOutput (a fresh, random value each time):\n```\nGuid\n----\nb296fcc1-27ea-4ed0-9b18-58288f805e02\n```\nNo PowerShell cmdlet generates a GUID directly — `[System.Guid]::NewGuid()` reaches straight into .NET for it, exactly the kind of gap this whole chapter exists to fill.\n\n**2. Creating an instance and calling its methods — and a real reminder of Chapter 4.3's output rule.**\n```powershell\n$sb = [System.Text.StringBuilder]::new()\n$sb.Append(\"Hello\")\n$sb.Append(\", \")\n$sb.Append(\"World!\")\n$sb.ToString()\n```\nOutput:\n```\nCapacity MaxCapacity Length\n-------- ----------- ------\n      16  2147483647      5\n      16  2147483647      7\n      16  2147483647     13\nHello, World!\n```\nWorth noticing what actually happened here, since it directly echoes Chapter 4.3: `.Append()` returns the `StringBuilder` itself (so calls can be chained), and because none of those three return values were assigned or suppressed, each one became unconsumed output — exactly the same \"everything unconsumed reaches the success stream\" rule from functions, applying identically to .NET method calls. In real code, you'd either chain the calls (`$sb.Append(\"a\").Append(\"b\")`) or pipe each to `Out-Null` to avoid this noise. `StringBuilder` itself is the efficient, mutable-string tool worth knowing about — building a large string piece by piece with plain `+=` (Chapter 2.1) repeatedly recreates the whole string each time, exactly like Chapter 2.5's array `+=` problem; `StringBuilder` avoids that.\n\n**3. Timing something precisely — a class you've already used without this framing.**\n```powershell\n$sw = [System.Diagnostics.Stopwatch]::new()\n$sw.Start()\nStart-Sleep -Milliseconds 100\n$sw.Stop()\n$sw.ElapsedMilliseconds\n```\nOutput:\n```\n131\n```\nThis is the exact `[System.Diagnostics.Stopwatch]` used throughout this book (Chapter 3.3, 5.5, and elsewhere) to measure real execution time — now you know precisely what it is: a .NET class, created and used with nothing but this chapter's two patterns.\n\n**4. Static properties, not just methods.**\n```powershell\n[System.Environment]::MachineName\n[System.Environment]::OSVersion\n```\nOutput (will vary by system):\n```\nshadow\n\nPlatform ServicePack Version  VersionString\n-------- ----------- -------  -------------\n    Unix             7.0.0.28 Unix 7.0.0.28\n```\n`::` accesses static properties exactly like static methods — no parentheses needed, since a property isn't called, just read.\n\n**5. Generic types — a genuinely more capable, growable collection than a plain array.**\n```powershell\n$list = [System.Collections.Generic.List[int]]::new()\n$list.Add(1)\n$list.Add(2)\n$list.Add(3)\n$list\n```\nOutput:\n```\n1\n2\n3\n```\n`List[int]` (the square brackets here specify the generic type parameter — this list holds only integers) is a genuinely mutable, efficiently-growable collection, related to Chapter 2.5's `ArrayList` but strongly typed — reach for it the same way, whenever a plain array's fixed-size `+=` rebuilding becomes a real concern.\n\n**6. A subtle but real distinction: a .NET method and a PowerShell cmdlet that sound similar don't always mean exactly the same thing.**\n```powershell\n[System.IO.File]::Exists(\"/tmp\")\nTest-Path /tmp\n```\nOutput:\n```\nFalse\nTrue\n```\n`/tmp` is a *directory*, not a file — `[System.IO.File]::Exists()` specifically checks for a file and correctly says no, while `Test-Path` (Chapter 7.1) checks for *anything* at that path, file or folder, and correctly says yes. Reaching directly into .NET means reaching past PowerShell's own, sometimes more forgiving, cmdlet behavior — worth double-checking exactly what a .NET method actually promises before assuming it matches a similarly-named cmdlet.\n\n### ⚠️ Common Mistakes\n\n- **Letting a chained .NET call's return values leak into output unintentionally**, exactly as Example 2 demonstrated. Chain calls together, assign the result, or pipe to `Out-Null` when a method's return value isn't actually wanted.\n- **Assuming a .NET method behaves identically to a similarly-named PowerShell cmdlet**, as Example 6 showed isn't always true — check the actual .NET documentation (or just test directly, as this book always does) rather than assuming.\n- **Reaching for .NET directly when a PowerShell cmdlet already does the same job more simply.** `[System.IO.File]::ReadAllText()` works, but `Get-Content -Raw` (Chapter 5.11) is more idiomatic PowerShell for the same result — save direct .NET calls for genuine gaps, not everything.\n- **Forgetting `::new()` (or a type's specific constructor syntax) is required to create an instance** — `[SomeType]` alone just refers to the type itself, not an instance of it.\n\n### How this connects\n\nThis chapter makes explicit what Chapters 2.3, 2.5, and 4.9 already relied on implicitly — every `[Type]::method()` call throughout this book has been exactly this pattern. Chapter 7.10 (CIM & WMI) and Chapter 8.4 (Performance, via `[System.Diagnostics.Stopwatch]` again) both lean directly on reaching into .NET this same way for capabilities beyond what a built-in cmdlet offers.\n\n### Quick recap\n\n- `[Namespace.ClassName]::StaticMethod()` / `::StaticProperty` calls or reads something belonging to the type itself; `[ClassName]::new()` creates an instance, whose own methods/properties then use ordinary dot syntax.\n- A method call's return value becomes unconsumed output exactly like any other expression (Chapter 4.3) — chain, assign, or suppress it deliberately.\n- `[System.Collections.Generic.List[T]]` is a genuinely growable, strongly-typed collection — the modern alternative to `ArrayList` (Chapter 2.5) for avoiding a plain array's fixed-size `+=` cost.\n- A .NET method and a similarly-named PowerShell cmdlet don't always mean exactly the same thing — verify rather than assume when reaching directly into .NET."}, {"id": "7.6", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 6, "slug": "calling-external-programs-native-executables", "fullTitle": "Calling External Programs & Native Executables", "title": "Calling External Programs & Native Executables", "md": "### Why this matters\n\nNot everything is a PowerShell cmdlet — `git`, `docker`, `grep`, and every other real command-line program on your system are all still directly callable, and PowerShell genuinely doesn't get in the way. This chapter covers exactly how, plus the `$LASTEXITCODE`/pipeline-chain-operator machinery Chapter 2.10 previewed for reacting to how they went.\n\n### The core idea\n\nA native program's name, typed plainly, just runs — exactly like a cmdlet:\n```powershell\nls /tmp\n```\nThe **`&` call operator** becomes necessary the moment the command to run is held in a variable, or is a path containing spaces — PowerShell needs an explicit signal that \"this is something to *execute*,\" not just a piece of data.\n\n### Examples\n\n**1. Calling a native program directly — no special syntax needed for the simple case.**\n```powershell\nls /tmp | Select-Object -First 2\n```\nNative output flows into the pipeline exactly like any cmdlet's — though it arrives as plain text lines (Chapter 1.6's whole distinction), since the native program has no idea PowerShell's object pipeline exists.\n\n**2. `&` — required when the command comes from a variable.**\n```powershell\n$cmd = \"echo\"\n& $cmd \"hello\"\n```\nOutput:\n```\nhello\n```\nWithout `&`, `$cmd \"hello\"` doesn't run anything — `$cmd` is just a string value, and a bare string followed by another value isn't a command invocation. `&` explicitly says \"treat what follows as something to execute.\"\n\n**3. `&` — required for a quoted path, too, and here's exactly why.**\n```powershell\n\"/tmp/dir with space/script.sh\"\n```\nOutput:\n```\n/tmp/dir with space/script.sh\n```\nThat's not the script running — it's the bare expression rule from Chapter 1.1, printing the string itself, completely unexecuted. Verified directly, adding `&` fixes it:\n```powershell\n& \"/tmp/dir with space/script.sh\"\n```\n```\nran ok\n```\nThe quotes were necessary because the path contains a space; `&` was necessary because a quoted string, on its own, is just data — never an implicit command, no matter what it contains.\n\n**4. Passing arguments that themselves contain spaces — genuinely simpler than it sounds.**\n```powershell\n& \"echo\" \"hello world\"\n```\nOutput:\n```\nhello world\n```\nEach PowerShell string argument is passed to the native program as one complete argument, spaces and all — no extra escaping needed here, unlike some of Bash's own argument-splitting subtleties (this series' own Bash book covers those directly).\n\n**5. Passing several arguments built as an array — splatting, applied to a native command.**\n```powershell\n$argsArr = @(\"hello world\", \"second arg\")\n& echo @argsArr\n```\nOutput:\n```\nhello world\nsecond arg\n```\nChapter 4.7's splatting syntax (`@variable`) works on native commands too, not just PowerShell functions and cmdlets — genuinely convenient when a program's argument list is built up dynamically rather than known up front.\n\n**6. `$LASTEXITCODE` and `$?` — both tracking a native command's real result, but a genuine subtlety about *when* to check `$?`.**\n```powershell\ngrep \"nomatch\" /etc/hostname\n$?\n```\nOutput:\n```\nFalse\n```\n`grep` found no match (printing nothing to the screen) and exited with status `1`, its own standard convention for \"nothing found\" — `$?`, checked immediately afterward, correctly reads `$false`, since PowerShell treats any nonzero native exit code as a failure.\n\nNow the subtlety, verified directly: `$?` reflects whether the **most recently executed statement** succeeded — not specifically \"the last native command,\" and it doesn't stay put while you go check something else first. Read `$LASTEXITCODE` in between, and `$?` changes underneath you:\n```powershell\ngrep \"nomatch\" /etc/hostname\n$LASTEXITCODE\n$?\n```\nOutput:\n```\n1\nTrue\n```\n`$LASTEXITCODE` still correctly shows `1` (`grep`'s real exit code — reading a variable doesn't change it). But `$?` now reads `True`, because *reading `$LASTEXITCODE` was itself a trivially successful statement*, and `$?` updated to reflect that read, not the `grep` call two lines earlier. This isn't specific to `$LASTEXITCODE`, either — any statement at all between the native command and checking `$?` resets it the same way. The rule that actually holds: check `$?` **immediately** after the command you care about, before running anything else — or rely on `$LASTEXITCODE` alone (Chapter 2.10) for a native command's result, since unlike `$?` it isn't reset by whatever runs after it.\n\n**7. Pipeline chain operators — `&&`/`||`, reacting to a native command's success or failure directly, PowerShell 7+.**\n```powershell\nbash -c \"exit 0\" && \"success chain\"\nbash -c \"exit 1\" || \"failure chain\"\n```\nOutput:\n```\nsuccess chain\nfailure chain\n```\n`&&` runs the next command only if the previous one succeeded; `||` only if it failed — the same familiar Bash-style short-circuit chaining (this series' own Bash book covers the identical idea), now available natively in PowerShell 7+ for exactly this kind of \"react to whether that last thing worked\" pattern.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `&` when the command to run is a variable or a quoted path**, exactly as Examples 2 and 3 demonstrated — the result isn't an error, just a silently wrong outcome (a printed string instead of an executed program).\n- **Assuming `$?` and `$LASTEXITCODE` always track the identical thing.** They're tracking genuinely different signals (a literal exit code vs. PowerShell's own success judgment), and Chapter 2.10 is worth revisiting if the two ever seem to disagree.\n- **Checking `$?` after running something else first**, as Example 6 proved directly — `$?` reflects only the *most recently executed statement*, so even reading `$LASTEXITCODE` in between resets it. Check `$?` immediately, or use `$LASTEXITCODE` instead, which isn't reset this way.\n- **Using `&&`/`||` on Windows PowerShell 5.1** — they're PowerShell 7.0+ only (Chapter 0.2), and won't parse at all on the older version.\n- **Manually re-implementing argument-array building by hand-concatenating a string**, when splatting (Example 5) already does the job cleanly and correctly, avoiding manual quoting mistakes.\n\n### How this connects\n\nThis chapter is where Chapter 2.10's `$LASTEXITCODE` preview and Chapter 4.7's splatting both get their fullest, most concrete application. Chapter 7.4's service-management gap on Linux/macOS is exactly what this chapter's `&`-called native tools (`systemctl`, `launchctl`) fill in for. Chapter 8.3 (Common Pitfalls) revisits native-command interaction with a few more real gotchas.\n\n### Quick recap\n\n- A native program's plain name runs directly, just like a cmdlet; `&` is required when the command is held in a variable or is a quoted path — without it, PowerShell treats it as inert data, not something to execute.\n- Each PowerShell string argument passes through to a native program as one complete argument, spaces included, with no extra escaping needed for the simple case.\n- Splatting (`@array`, Chapter 4.7) works for native command arguments too.\n- `$LASTEXITCODE` (the literal exit code) and `$?` (PowerShell's success/fail judgment) both track a native command's result — but `$?` reflects only the *most recently executed statement*, so it resets the moment anything else runs, even just reading `$LASTEXITCODE`. Check `$?` immediately, or use `$LASTEXITCODE` when something needs to run in between.\n- `&&`/`||` (PowerShell 7+) chain commands based on the previous one's success/failure — the same short-circuit idea as Bash."}, {"id": "7.7", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 7, "slug": "credentials-secrets-get-credential-securestring-pscredential", "fullTitle": "Credentials & Secrets: `Get-Credential`, `SecureString` & `PSCredential`", "title": "Credentials & Secrets: `Get-Credential`, `SecureString` & `PSCredential`", "md": "### Why this matters\n\nChapter 3.7 previewed `Read-Host -AsSecureString`. The next two chapters — APIs (7.8) and Remoting (7.9) — both genuinely need real credential handling, so this is exactly the right moment to cover it properly, including a real, important security finding this book's own live verification turned up that's worth taking seriously.\n\n### The core idea\n\nA **`PSCredential`** bundles a username and a `SecureString` password together — the standard shape almost every credential-accepting cmdlet expects. `Get-Credential` prompts interactively for one; `[PSCredential]::new(username, securePassword)` builds one directly, useful for scripting and testing.\n\n### Examples\n\n**1. Building a `PSCredential` directly.**\n```powershell\n$securePw = ConvertTo-SecureString \"MyPassword123\" -AsPlainText -Force\n$cred = [PSCredential]::new(\"myuser\", $securePw)\n$cred.UserName\n```\nOutput:\n```\nmyuser\n```\n`$cred` is now a real `PSCredential` — exactly the shape `Invoke-RestMethod -Credential`, `Invoke-Command -Credential` (Chapter 7.8, 7.9), and most authenticated cmdlets expect.\n\n**2. Getting the plain-text password back out, when a target genuinely requires it.**\n```powershell\n$cred.GetNetworkCredential().Password\n```\nOutput:\n```\nMyPassword123\n```\n`.GetNetworkCredential().Password` is the deliberate, explicit way to step back down to plain text — named clearly enough that it's obvious you're doing something that should only happen right before the value is actually needed (Chapter 3.7's same caution), not held onto any longer than necessary.\n\n**3. `Export-Clixml`/`Import-Clixml` — saving a credential to disk, and a genuinely important finding verified directly on this book's reference machine.**\n```powershell\n$cred | Export-Clixml -Path /tmp/cred.xml\nImport-Clixml -Path /tmp/cred.xml | ForEach-Object { $_.UserName; $_.GetNetworkCredential().Password }\n```\nThis round-trips correctly — `myuser` and `MyPassword123` both come back exactly right. `Export-Clixml` is widely, correctly recommended for saving a credential securely on **Windows**, where the password gets encrypted using DPAPI, tied to the current user account and machine — nobody else, and no copy of the file on another machine, can decrypt it.\n\n**Verified directly, and worth taking seriously: on this book's Linux reference machine, that protection doesn't apply.** Looking at the actual exported file:\n```\n<SS N=\"Password\">4d007900500061007300730077006f0072006400310032003300</SS>\n```\nThat looks encrypted — it isn't. Decoding that hex as UTF-16 (exactly what a two-line Python script does) recovers `MyPassword123` **directly, in plain text, with no key or decryption needed at all.** On Linux/macOS, without DPAPI available, `Export-Clixml`'s \"protection\" for a `SecureString` falls back to nothing more than a reversible text encoding — genuinely no better than storing the password in plain text with extra steps. **Do not rely on `Export-Clixml` to actually protect a credential on Linux or macOS.**\n\n**4. The real, cross-platform fix: `ConvertFrom-SecureString`/`ConvertTo-SecureString` with an explicit `-Key`.**\n```powershell\n$key = [byte[]](1..16)\n$securePw = ConvertTo-SecureString \"Secret789\" -AsPlainText -Force\n$encrypted = ConvertFrom-SecureString -SecureString $securePw -Key $key\n$encrypted\n$decrypted = ConvertTo-SecureString -String $encrypted -Key $key\n$decrypted | ConvertFrom-SecureString -AsPlainText\n```\nOutput:\n```\n76492d1116743f0423413b16050a5345MgB8...(truncated)...ODk=\nSecret789\n```\nSupplying an explicit `-Key` (16, 24, or 32 bytes, for AES-128/192/256) switches `ConvertFrom-SecureString`/`ConvertTo-SecureString` to genuine, real AES encryption — verified directly to actually protect the value, unlike Example 3's DPAPI-dependent default on this platform. The key itself then becomes the thing that needs protecting separately (an environment variable, a proper secrets manager, never hardcoded next to the encrypted value) — but at least the encryption itself is real and cross-platform.\n\n**5. `Get-Credential` — the interactive prompt, same limitation as Chapter 3.7's `Read-Host -AsSecureString`.**\n```powershell\nGet-Credential -UserName \"test\" -Message \"test\"\n```\nLike `Read-Host -AsSecureString`, this genuinely requires an interactive terminal session to mask input as it's typed — it's not meant for a non-interactive/scheduled script, which should instead build a `PSCredential` some other way (Example 1, or a proper secrets vault) rather than expecting a human to type a password into thin air.\n\n### ⚠️ Common Mistakes\n\n- **Trusting `Export-Clixml` to protect a credential on Linux or macOS**, exactly the finding this chapter verified directly. On Windows, it's genuinely fine (DPAPI-backed); on Linux/macOS, it isn't — check what you're actually running on, and use an explicit `-Key` (Example 4) or a real secrets manager instead.\n- **Hardcoding a plain-text password anywhere in a script**, `ConvertTo-SecureString -AsPlainText -Force` included — that specific pattern exists for testing and for values that arrived securely from elsewhere, not as a place to type a real secret directly into source code.\n- **Storing an AES key next to the data it encrypts** (Example 4's `-Key`), which defeats the entire point — the key needs its own, separate protection.\n- **Holding onto a plain-text password (via `.GetNetworkCredential().Password`) longer than the exact moment it's needed.** Extract it right before use, not as an early step \"to have it ready.\"\n\n### How this connects\n\nEverything here becomes directly usable the moment Chapter 7.8 (APIs) and 7.9 (Remoting) need real authentication — both accept a `PSCredential` exactly as built here. This chapter's `Export-Clixml` finding is a direct, concrete instance of Chapter 0.2/7.2's broader \"verify Windows-vs-Linux/macOS assumptions rather than trusting them\" caution, applied somewhere it genuinely matters.\n\n### Quick recap\n\n- A `PSCredential` bundles a username and a `SecureString` password; `[PSCredential]::new(user, securePw)` builds one directly, `Get-Credential` prompts interactively (needs a real terminal, like `Read-Host -AsSecureString`).\n- `.GetNetworkCredential().Password` extracts the plain-text password when a target genuinely requires it — do this as late as possible.\n- **`Export-Clixml` genuinely protects a `SecureString` on Windows (DPAPI) but was verified directly to provide no real protection at all on Linux/macOS** — a reversible text encoding, not encryption, on this book's reference machine.\n- `ConvertFrom-SecureString -Key`/`ConvertTo-SecureString -Key` (16/24/32-byte AES key) gives real, cross-platform encryption — verified directly to actually work — but the key itself then needs its own separate protection."}, {"id": "7.8", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 8, "slug": "working-with-apis-invoke-restmethod-invoke-webrequest", "fullTitle": "Working with APIs: `Invoke-RestMethod` & `Invoke-WebRequest`", "title": "Working with APIs: `Invoke-RestMethod` & `Invoke-WebRequest`", "md": "### Why this matters\n\nA huge amount of real-world scripting eventually needs to talk to a web API — checking a service's status, pulling data, triggering an action elsewhere. PowerShell's two HTTP cmdlets handle this directly, with one of them doing something genuinely convenient that most languages need an extra library for.\n\n### The core idea\n\n- **`Invoke-RestMethod`** — makes an HTTP request and automatically parses a JSON (or XML) response straight into a real PowerShell object. The one to reach for almost every time you're calling a genuine API.\n- **`Invoke-WebRequest`** — makes an HTTP request and gives you the *raw* response (status code, headers, body as text) without any automatic parsing. The one to reach for when you need the response's full details, not just its parsed data.\n\nBoth examples below call `httpbin.org`, a free public service that echoes back exactly what it received — the same dependency note from this series' own Bash book's `curl` chapter applies equally here: these examples need live internet access and that service being reachable.\n\n### Examples\n\n**1. `Invoke-RestMethod` — JSON parsed automatically into a real object.**\n```powershell\n$r = Invoke-RestMethod -Uri \"https://httpbin.org/get\"\n$r.GetType().Name\n$r.url\n```\nOutput:\n```\nPSCustomObject\nhttps://httpbin.org/get\n```\nNo `ConvertFrom-Json` (Chapter 5.12) needed at all — `Invoke-RestMethod` already did that for you, returning a genuine `[PSCustomObject]` with dot-accessible properties straight away.\n\n**2. `Invoke-WebRequest` — the raw response instead.**\n```powershell\n$r = Invoke-WebRequest -Uri \"https://httpbin.org/get\"\n$r.StatusCode\n$r.Content.GetType().Name\n```\nOutput:\n```\n200\nString\n```\n`.StatusCode` gives the real HTTP status directly; `.Content` is the raw response body as plain text — genuinely unparsed, exactly the difference from `Invoke-RestMethod`'s automatic JSON conversion.\n\n**3. `POST` with a JSON body.**\n```powershell\n$body = @{ name = \"Alex\"; age = 30 } | ConvertTo-Json\n$r = Invoke-RestMethod -Uri \"https://httpbin.org/post\" -Method Post -Body $body -ContentType \"application/json\"\n$r.json\n```\nOutput:\n```\nage name\n--- ----\n 30 Alex\n```\nA hashtable, converted to JSON text (Chapter 5.12's `ConvertTo-Json` again), sent as the request body — `httpbin.org` echoes back exactly what it received under `.json`, confirming both fields arrived correctly.\n\n**4. Sending custom headers.**\n```powershell\nInvoke-RestMethod -Uri \"https://httpbin.org/headers\" -Headers @{ \"X-Test\" = \"hello\" }\n```\n`-Headers` takes a hashtable directly — genuinely the same pattern as everywhere else in this book that a hashtable represents a set of named values (Chapter 4.7's splatting, Chapter 2.6's hashtables themselves).\n\n**5. Errors — a failed request throws a real, catchable, terminating error.**\n```powershell\ntry {\n    Invoke-RestMethod -Uri \"https://httpbin.org/status/404\"\n} catch {\n    \"Caught: $($_.Exception.Message)\"\n    \"Status: $($_.Exception.Response.StatusCode)\"\n}\n```\nOutput:\n```\nCaught: Response status code does not indicate success: 404 (NOT FOUND).\nStatus: NotFound\n```\nAn HTTP error status genuinely throws — Chapter 5.9/5.10's `try`/`catch` catches it cleanly, with `.Exception.Response.StatusCode` giving direct access to exactly which HTTP status caused the failure, worth checking when different status codes need different handling.\n\n### ⚠️ Common Mistakes\n\n- **Reaching for `Invoke-WebRequest` and then manually parsing JSON out of `.Content`**, when `Invoke-RestMethod` already does that automatically. Use `Invoke-RestMethod` unless the raw response (status code, headers, unparsed body) is specifically what's needed.\n- **Not wrapping API calls in `try`/`catch`**, when a real API call can genuinely fail for reasons entirely outside a script's control (the network, the service being down, a bad request) — Example 5's pattern is worth using by default for anything calling a real endpoint.\n- **Forgetting these examples depend on live internet access and a specific external service being up** — if a command here produces a connection error instead of the shown output, that's very likely the network or `httpbin.org`, not a mistake in the command itself.\n- **Sending a hashtable directly as `-Body` without converting it to JSON first**, when the target API expects JSON specifically — `-Body` accepts several formats depending on `-ContentType`, and mismatching the two is a common source of a confusing server-side error.\n\n### How this connects\n\n`ConvertTo-Json`/`ConvertFrom-Json` (Chapter 5.12) are doing real work here even when invisible — `Invoke-RestMethod`'s automatic parsing is exactly that conversion, applied for you. Chapter 7.7's `PSCredential`/`SecureString` work becomes directly relevant the moment an API needs real authentication, most commonly via `-Headers` (an API key or bearer token) or `-Credential` for the APIs that support it directly.\n\n### Quick recap\n\n- `Invoke-RestMethod` automatically parses a JSON (or XML) response into a real PowerShell object — the usual first choice for calling a genuine API.\n- `Invoke-WebRequest` gives the raw response instead (`.StatusCode`, `.Content` as unparsed text) — reach for this when the full response details matter, not just parsed data.\n- `-Method`, `-Body`, `-ContentType`, `-Headers` cover the common request-shaping needs; a hashtable converted with `ConvertTo-Json` is the standard way to send a JSON body.\n- A failed request throws a real, catchable error — `.Exception.Response.StatusCode` gives direct access to which HTTP status caused it."}, {"id": "7.9", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 9, "slug": "remoting-basics-invoke-command-pssessions", "fullTitle": "Remoting Basics: `Invoke-Command` & PSSessions", "title": "Remoting Basics: `Invoke-Command` & PSSessions", "md": "### Why this matters\n\nRunning a command on the machine sitting right in front of you only goes so far — real administration constantly means running something on a *different* machine entirely. PowerShell Remoting is built directly into the language for exactly this, letting you run a script block on a remote computer as naturally as running it locally.\n\n### An honest note before starting\n\nThis chapter's core cmdlets (`Invoke-Command`, `New-PSSession`, `Enter-PSSession`) are genuinely present and callable on this book's Linux reference machine — verified directly with `Get-Command`. What *couldn't* be verified live here is an actual remote connection: this machine has no SSH server running to remote into (`ssh: connect to host localhost port 22: Connection refused`, confirmed directly), and setting one up is outside this book's scope. The **local** examples below (`Invoke-Command` with no target machine, just running a script block right here) are fully verified; the **remote-connection** syntax is accurate, standard, well-documented PowerShell Remoting usage, but — like Chapter 7.4's services — presented without this book's usual live-verified-on-this-exact-machine guarantee.\n\n### The core idea\n\n```powershell\nInvoke-Command -ComputerName remote1 -ScriptBlock { Get-Process }\n```\nOn Windows, remoting traditionally runs over **WinRM** (Windows Remote Management), enabled by default on many Windows Server installs. PowerShell 6+ added **SSH-based remoting**, working identically across Windows, Linux, and macOS — the same familiar SSH you'd use for anything else, carrying PowerShell's remoting protocol instead of (or alongside) an ordinary shell session.\n\n### Examples\n\n**1. `Invoke-Command` with no remote target — running a script block right here, verified directly.**\n```powershell\nInvoke-Command -ScriptBlock { \"hello from local invoke-command\"; $env:HOSTNAME }\n```\nOutput:\n```\nhello from local invoke-command\n```\nWithout `-ComputerName` or `-HostName`, `Invoke-Command` simply runs the script block in the current session — a genuinely useful way to get comfortable with the syntax before ever touching a real remote machine.\n\n**2. Passing arguments into the script block with `-ArgumentList`.**\n```powershell\nInvoke-Command -ScriptBlock { param($name) \"Hello, $name\" } -ArgumentList \"Alex\"\n```\nOutput:\n```\nHello, Alex\n```\nThe script block declares its own `param()` (exactly Chapter 4.2's syntax), and `-ArgumentList` supplies the values — the same pattern works identically whether the script block ends up running locally or on a genuinely remote machine.\n\n**3. Running on a remote machine over SSH — standard syntax, not verified on this machine.**\n```powershell\nInvoke-Command -HostName remote-server -UserName alex -ScriptBlock { Get-Process }\n```\n`-HostName` (rather than `-ComputerName`) specifically selects SSH-based remoting — PowerShell connects over SSH exactly like the `ssh` command itself would, prompting for a password or using SSH keys depending on how the remote machine's SSH server is configured, then runs the script block there and returns the results as ordinary objects, just as if `Get-Process` had run locally.\n\n**4. `New-PSSession` — a persistent connection, for running several commands without reconnecting each time.**\n```powershell\n$session = New-PSSession -HostName remote-server -UserName alex\nInvoke-Command -Session $session -ScriptBlock { Get-Date }\nInvoke-Command -Session $session -ScriptBlock { $env:HOSTNAME }\nRemove-PSSession $session\n```\nEach `Invoke-Command -ComputerName`/`-HostName` call (Example 3) opens and closes its own connection — fine for one-off commands, wasteful for several in a row. `New-PSSession` opens the connection once; subsequent `Invoke-Command -Session` calls reuse it, and variables/state set in one call persist into the next (genuinely useful the moment several related commands need to build on each other) — `Remove-PSSession` closes it explicitly when done.\n\n**5. `Enter-PSSession` — an interactive remote shell, not a scripted command.**\n```powershell\nEnter-PSSession -HostName remote-server -UserName alex\n```\nThis drops you into an interactive prompt running *on the remote machine* — every command typed from here runs there, until `Exit-PSSession` returns you home. Genuinely the interactive-exploration counterpart to `Invoke-Command`'s scripted, one-shot execution.\n\n### ⚠️ Common Mistakes\n\n- **Confusing `-ComputerName` (WinRM-based, Windows-oriented) with `-HostName` (SSH-based, cross-platform).** They're not interchangeable — pick based on how the remote machine is actually configured to accept connections.\n- **Opening a new connection per command (`Invoke-Command -ComputerName` repeatedly) when several related commands are needed.** `New-PSSession` + `Invoke-Command -Session` (Example 4) is both faster and lets state persist across calls.\n- **Forgetting a real remote connection needs the target machine actually configured to accept it** (WinRM enabled, or an SSH server running with PowerShell's remoting components installed) — this isn't automatic just because PowerShell itself is installed there.\n- **Leaving a `PSSession` open indefinitely** without `Remove-PSSession` when it's no longer needed — each open session consumes real resources on the remote machine.\n\n### How this connects\n\nChapter 7.7's `PSCredential` is exactly what `-Credential` on any of these cmdlets expects, the moment a remote connection needs explicit authentication beyond SSH's own key/password handling. Chapter 7.11 (Jobs & Background Work) covers running things asynchronously — genuinely complementary to remoting, for a long-running remote task that shouldn't block the calling script while it waits.\n\n### Quick recap\n\n- `Invoke-Command -ScriptBlock { ... }` runs a script block — locally by default (verified directly), or on a remote machine with `-ComputerName` (WinRM) or `-HostName` (SSH, cross-platform, PowerShell 6+).\n- `-ArgumentList` passes values into a script block's own `param()`.\n- `New-PSSession`/`Remove-PSSession` open and close a persistent connection, worth using over repeated one-off `Invoke-Command` calls once several related remote commands are needed.\n- `Enter-PSSession`/`Exit-PSSession` give an interactive remote shell, for exploration rather than scripted automation."}, {"id": "7.10", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 10, "slug": "cim-wmi-querying-system-information", "fullTitle": "CIM & WMI: Querying System Information", "title": "CIM & WMI: Querying System Information", "md": "### Why this matters\n\nWindows exposes an enormous amount of system information — hardware, installed software, configuration — through a management framework called **WMI** (Windows Management Instrumentation), queryable through **CIM** (Common Information Model), PowerShell's modern interface to it. It's genuinely one of the deepest wells of system information available on Windows, well beyond what any individual cmdlet covers.\n\n### An honest note before starting\n\n**Verified directly: `Get-CimInstance` doesn't exist at all on this book's Linux reference machine** — the same \"not recognized\" error pattern from Chapter 1.1 and 7.4. CIM/WMI is a genuinely Windows-specific management technology with no real Linux/macOS equivalent (those platforms have their own separate tools — `dmidecode`, `/proc`, `systemd`'s own APIs — accessible through Chapter 7.6's external-program calling instead, not through CIM). Like Chapter 7.4, this chapter's examples reflect standard, well-documented PowerShell usage rather than this book's usual live-verification-on-this-machine standard.\n\n### The core idea\n\n```powershell\nGet-CimInstance -ClassName Win32_OperatingSystem\n```\nCIM organizes system information into **classes** — `Win32_OperatingSystem`, `Win32_ComputerSystem`, `Win32_LogicalDisk`, and hundreds more — each describing one category of information, queryable directly.\n\n### Examples\n\n**1. Querying operating system information.**\n```powershell\nGet-CimInstance -ClassName Win32_OperatingSystem\n```\nOn Windows, this returns a rich object with dozens of properties — version, install date, total/free memory, and far more — everything Windows itself tracks about the running OS installation.\n\n**2. Narrowing to specific properties, exactly Chapter 5.2's `Select-Object`.**\n```powershell\nGet-CimInstance -ClassName Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture\n```\nNo new syntax here at all — a `CimInstance` object is a real pipeline object, filterable and shapeable with every Part V tool exactly like anything else in this book.\n\n**3. Querying hardware information.**\n```powershell\nGet-CimInstance -ClassName Win32_ComputerSystem | Select-Object Manufacturer, Model, TotalPhysicalMemory\n```\n`Win32_ComputerSystem` covers the physical machine itself — manufacturer, model, total installed memory — genuinely useful for an inventory script surveying a fleet of machines.\n\n**4. A filtered, more targeted query — `-Filter` works like Chapter 7.1's filesystem `-Filter`, at the CIM query level.**\n```powershell\nGet-CimInstance -ClassName Win32_LogicalDisk -Filter \"DriveType=3\"\n```\n`DriveType=3` means \"fixed hard disks only\" (CIM's own numeric convention for drive types) — `-Filter` here is applied by the underlying CIM query itself, more efficient than pulling every disk and filtering afterward with `Where-Object`, exactly the same efficiency point Chapter 7.1 made about filesystem filtering.\n\n**5. `Get-CimClass` — discovering what classes and properties are actually available, the CIM equivalent of Chapter 1.5's `Get-Member`.**\n```powershell\nGet-CimClass -ClassName \"Win32_*Disk*\"\n```\nWildcards here search across every available class name — genuinely the starting point for \"what CIM class actually has the information I need,\" since there's no way to memorize hundreds of class names in advance.\n\n### ⚠️ Common Mistakes\n\n- **Assuming CIM/WMI is available on Linux or macOS**, exactly the trap this chapter opened by verifying directly. Check `Get-Command Get-CimInstance -ErrorAction SilentlyContinue` (or `$IsWindows`, Chapter 0.2) before relying on it in cross-platform code.\n- **Using the older `Get-WmiObject` cmdlet in new code.** It's the legacy predecessor to `Get-CimInstance`, Windows-only in the same way, and effectively superseded — `Get-CimInstance` is the modern, recommended choice, with `Get-WmiObject` mainly still seen in older scripts.\n- **Pulling an entire class's worth of instances and filtering with `Where-Object` afterward**, when `-Filter` (Example 4) applies the same filtering more efficiently, at the query level itself.\n- **Guessing at class names instead of using `Get-CimClass` to discover them** (Example 5) — there are hundreds of `Win32_*` classes, and guessing wastes time a quick wildcard search avoids entirely.\n\n### How this connects\n\nEvery Part V pipeline tool applies directly to `CimInstance` objects, exactly as Example 2 showed — no new concept needed there. Chapter 7.4's honest Windows-only caveat for services applies identically here; both chapters point toward the same underlying lesson: know your target platform before assuming a Windows-management cmdlet is universally available.\n\n### Quick recap\n\n- CIM/WMI (`Get-CimInstance -ClassName Win32_*`) exposes deep Windows system information — **genuinely Windows-only**, verified directly, entirely absent from this book's Linux reference machine.\n- Standard classes worth knowing: `Win32_OperatingSystem`, `Win32_ComputerSystem`, `Win32_LogicalDisk`, and hundreds more.\n- `-Filter` applies filtering at the query level, more efficient than pulling everything and filtering afterward with `Where-Object`.\n- `Get-CimClass` discovers available classes by wildcard search, the CIM equivalent of Chapter 1.5's discovery tools.\n- `Get-CimInstance` is the modern replacement for the legacy `Get-WmiObject` — prefer it in new code."}, {"id": "7.11", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 11, "slug": "jobs-background-work", "fullTitle": "Jobs & Background Work", "title": "Jobs & Background Work", "md": "### Why this matters\n\nChapter 5.5 covered `ForEach-Object -Parallel` for running many similar iterations concurrently. **Jobs** solve a related but distinct problem: running one or more genuinely independent, longer-running tasks in the background, checking on them later, without the calling script blocking the whole time.\n\n### The core idea\n\n```powershell\n$job = Start-Job -ScriptBlock { ... }\n```\n`Start-Job` launches a script block as a background job, running in a **completely separate PowerShell process** — genuinely isolated, with no automatic access to the calling session's variables (Example 3 shows exactly what this means). `Get-Job` lists jobs and their state, `Wait-Job` blocks until one finishes, `Receive-Job` retrieves its actual output.\n\n### Examples\n\n**1. Starting a job, and checking on it.**\n```powershell\n$job = Start-Job -ScriptBlock { Start-Sleep -Seconds 2; \"job done\" }\n$job.State\nWait-Job $job | Out-Null\n$job.State\nReceive-Job $job\n```\nOutput:\n```\nRunning\nCompleted\njob done\n```\n`Start-Job` returns immediately — the calling script kept going while the 2-second sleep happened in the background. `$job.State` reads `Running` right away, `Completed` only after `Wait-Job` actually waited for it. `Receive-Job` is a separate, explicit step to retrieve the job's output — it doesn't come back automatically the moment the job finishes.\n\n**2. `Get-Job` — seeing every job in the current session.**\n```powershell\n$job = Start-Job -ScriptBlock { 1 + 1 }\nStart-Sleep -Milliseconds 500\nGet-Job | Select-Object Id, State\n```\nOutput:\n```\nId State\n-- -----\n 1 Completed\n```\nExactly Part V's pipeline tools again, applied to job objects — nothing new here.\n\n**3. Jobs run in a genuinely separate process — verified directly, and this is the real trap.**\n```powershell\n$x = 42\n$job = Start-Job -ScriptBlock { \"x is: $x\" }\nWait-Job $job | Out-Null\nReceive-Job $job\n```\nOutput:\n```\nx is:\n```\n`$x` came back empty — the job's script block runs in a completely separate PowerShell process, with no automatic visibility into the calling session's variables at all (a real difference from `ForEach-Object -Parallel`'s runspaces, Chapter 5.5, which at least offer `$using:` as an explicit bridge). The fix, verified directly:\n```powershell\n$x = 42\n$job = Start-Job -ScriptBlock { param($x) \"x is: $x\" } -ArgumentList $x\nWait-Job $job | Out-Null\nReceive-Job $job\n```\n```\nx is: 42\n```\nExactly Chapter 7.3's `Start-Process -ArgumentList` idea, applied here — a job needs its own `param()` and `-ArgumentList` to receive anything from the outside, never implicit variable access.\n\n**4. `Start-ThreadJob` — a genuinely lighter-weight alternative, measured directly.**\n```powershell\nImport-Module ThreadJob\n$sw = [System.Diagnostics.Stopwatch]::StartNew()\n1..4 | ForEach-Object { Start-Job -ScriptBlock { 1 + 1 } } | Wait-Job | Out-Null\n$sw.Stop()\n\"Start-Job (process-based): $($sw.ElapsedMilliseconds)ms\"\n\n$sw2 = [System.Diagnostics.Stopwatch]::StartNew()\n1..4 | ForEach-Object { Start-ThreadJob -ScriptBlock { 1 + 1 } } | Wait-Job | Out-Null\n$sw2.Stop()\n\"Start-ThreadJob (thread-based): $($sw2.ElapsedMilliseconds)ms\"\n```\nOutput, verified on this book's reference machine:\n```\nStart-Job (process-based): 209ms\nStart-ThreadJob (thread-based): 57ms\n```\n`Start-Job` launches a whole new PowerShell *process* per job — genuinely isolated, but with real startup overhead. `Start-ThreadJob` (from the `ThreadJob` module, bundled with PowerShell 7+) runs each job on a separate *thread* within the same process instead — nearly 4× faster to start here, at the cost of slightly less isolation (threads share the same process, unlike jobs' fully separate ones). For many short-lived background tasks, `Start-ThreadJob` is usually the better default.\n\n### ⚠️ Common Mistakes\n\n- **Assuming a job automatically sees the calling session's variables**, exactly as Example 3 demonstrated failing silently (an empty value, not an error). Always pass what's needed explicitly via `param()` + `-ArgumentList`.\n- **Forgetting `Receive-Job` is a separate step from checking `$job.State`.** A job reaching `Completed` doesn't automatically print or return its output — `Receive-Job` retrieves it explicitly.\n- **Defaulting to `Start-Job` for many short-lived tasks**, when `Start-ThreadJob`'s measured lower overhead (Example 4) usually makes it the better choice for that specific shape of workload.\n- **Leaving completed jobs around without cleanup.** `Remove-Job` clears a finished job's resources — `Get-Job | Remove-Job` periodically (or after `Receive-Job`, with `Receive-Job -AutoRemoveJob` in some contexts) keeps a long-running session tidy.\n\n### How this connects\n\nThis chapter's `-ArgumentList` requirement directly mirrors Chapter 5.5's `$using:` for `ForEach-Object -Parallel` — both exist because concurrent execution, whichever form it takes, genuinely can't see the calling scope's variables automatically. Chapter 8.4 (Performance) revisits the `Start-Job`-vs-`Start-ThreadJob` measurement from Example 4 with more depth.\n\n### Quick recap\n\n- `Start-Job -ScriptBlock { ... }` runs a script block in the background, in a genuinely separate process; `Get-Job`/`Wait-Job`/`Receive-Job` check on, wait for, and retrieve its result.\n- A job has **no automatic access** to the calling session's variables — verified directly to come back empty without it; pass values explicitly via the script block's own `param()` and `-ArgumentList`.\n- `Start-ThreadJob` (from the bundled `ThreadJob` module) runs on a thread instead of a full separate process — measured directly at roughly 4× faster startup for short tasks, usually the better default over plain `Start-Job`.\n- `Remove-Job` cleans up finished jobs' resources."}, {"id": "7.12", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "the essential toolbox, and writing it well", "chapNum": 12, "slug": "powershell-style-psscriptanalyzer-best-practices", "fullTitle": "PowerShell Style: `PSScriptAnalyzer` & Best Practices", "title": "PowerShell Style: `PSScriptAnalyzer` & Best Practices", "md": "### Why this matters\n\nThis book has flagged dozens of specific gotchas one chapter at a time — `Write-Host` vs. `Write-Output`, unapproved verbs, unused variables. **PSScriptAnalyzer** is a real, official Microsoft tool that catches a huge share of these automatically, before a script ever runs, consolidating this whole book's style habits into one command.\n\n### The core idea\n\nPSScriptAnalyzer is a static analysis tool — it reads a script without running it and flags likely problems, each with a specific rule name and a clear explanation. Unlike ShellCheck (this series' own Bash book's equivalent), it doesn't ship with PowerShell by default; install it once with `Install-Module -Name PSScriptAnalyzer -Scope CurrentUser`.\n\n### Examples\n\n**1. A script with two real, common problems.**\n```powershell\nfunction get-thing {\n    param($x)\n    $y = 5\n    if ($x -eq $true) {\n        Write-Host \"matched\"\n    }\n}\n```\nRunning `Invoke-ScriptAnalyzer -Path badscript.ps1`:\n```\nRuleName                            Severity Line Message\n--------                            -------- ---- -------\nPSAvoidUsingWriteHost               Warning  5    File 'badscript.ps1' uses Write-Host.\n                                                   Avoid using Write-Host because it might\n                                                   not work in all hosts... Instead, use\n                                                   Write-Output, Write-Verbose, or\n                                                   Write-Information.\nPSUseDeclaredVarsMoreThanAssignments Warning  3    The variable 'y' is assigned but never used.\n```\nBoth flags are exactly right, and echo lessons this book already covered directly: `Write-Host` (Chapter 1.1/5.7) flagged for the same reason this book has been careful about it throughout, and an unused variable caught precisely.\n\n**2. Catching an unapproved verb — Chapter 1.4's rule, enforced automatically.**\n```powershell\nfunction Fetch-Data {\n    param($x)\n    $x\n}\n```\nRunning the analyzer:\n```\nRuleName             Severity Line Message\n--------             -------- ---- -------\nPSUseApprovedVerbs   Warning  1    The cmdlet 'Fetch-Data' uses an unapproved verb.\n```\n`Fetch` isn't in `Get-Verb`'s list (Chapter 1.4) — PSScriptAnalyzer catches this automatically, rather than relying on remembering to check by hand.\n\n**3. There's real
