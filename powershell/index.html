 **Editing in a word processor instead of a plain-text editor.** Programs like Microsoft Word or Pages add hidden formatting that will corrupt a script. Always use a plain-text or code editor.\n\n### How this connects\n\nEvery chapter from here forward assumes you can do exactly what you just did: write a `.ps1` file and run it with `pwsh`. The very next chapter writes your first real command and script properly, and starts introducing PowerShell's core syntax.\n\n### Quick recap\n\n- This book teaches **PowerShell 7+** (`pwsh`), not the older, Windows-only, frozen Windows PowerShell 5.1 (`powershell`) — cross-platform, open-source, actively developed, and the only version that lets every example in this book work identically on any OS.\n- `pwsh --version` or, from inside a session, `$PSVersionTable` (check `PSEdition` reads `Core`) tells you what you're working with.\n- Windows needs an execution-policy change once (`Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser`, as Administrator) before scripts will run at all; Linux/macOS have no such restriction.\n- `Get-Location`/`pwd`, `Get-ChildItem`/`gci`/`dir`, and `Set-Location`/`cd` are the basic navigation commands you'll keep using — note that `ls` specifically is *not* a PowerShell alias on Linux/macOS (the real Unix `ls` runs instead), though it is on Windows.\n- Any plain-text editor works; VS Code (with the PowerShell extension) is recommended.\n- To run a script from inside PowerShell: `./script.ps1`. From an ordinary terminal (Linux/macOS especially): `pwsh ./script.ps1`.\n- The cycle you'll repeat forever: **edit → save → run.**"}, {"id": "1.1", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols PowerShell is made of", "chapNum": 1, "slug": "hello-world-your-first-command-and-script", "fullTitle": "Hello, World: Your First Command and Script", "title": "Hello, World: Your First Command and Script", "md": "### Why this matters\n\nEvery language's first program is the same for a reason: it proves the whole chain works end to end — you can write something, run it, and see it do what you expected — before any real complexity shows up. Do it once here, deliberately, and you'll never have to think about the mechanics of \"how do I actually run this thing\" again.\n\n### The core idea\n\nPowerShell gives you the same two ways to run code that Chapter 0.2 introduced, and it's worth actually feeling the difference between them once before moving on:\n\n- **The interactive console** — type a command, press Enter, see the result immediately. Perfect for exploring and for quick one-off checks.\n- **A script file** (`.ps1`) — write a whole sequence of commands, save it, run the whole thing at once. This is how real PowerShell work actually gets done.\n\nThere's a small but important idea sitting underneath both of them: in PowerShell, a bare expression — just a value sitting on its own line, with nothing done to it — is automatically written out. You didn't ask it to print anything; it printed anyway, because that's what an unconsumed value does in PowerShell. This is different from most programming languages (where a bare `\"Hello\"` on its own line does nothing at all), and it's going to matter a great deal once functions enter the picture in Part IV — for now, just notice it.\n\n### Examples\n\n**1. The interactive console — type it, see it immediately.**\n\nStart a PowerShell session by running `pwsh` from your terminal, then type:\n```powershell\n\"Hello, World!\"\n```\nOutput:\n```\nHello, World!\n```\nThat's the \"bare expression\" behavior from above: a plain string, sitting on its own line, got written to your screen without you calling anything to make that happen.\n\n**2. `Write-Output` — the explicit, deliberate way to do the same thing.**\n```powershell\nWrite-Output \"Hello, World!\"\n```\nOutput:\n```\nHello, World!\n```\nIdentical result to Example 1 — `Write-Output` explicitly sends a value down what's called the **success stream** (the main pipeline output; Chapter 5.7 covers this properly), which is exactly where a bare expression's value goes anyway. In practice, PowerShell users write bare expressions far more often than typing `Write-Output` out — but it's worth knowing the explicit cmdlet exists, and exactly what it's doing, rather than treating \"things just print\" as unexplained magic.\n\n**3. `Write-Host` — a different tool that looks similar but genuinely isn't.**\n```powershell\nWrite-Host \"via Write-Host\"\nWrite-Output \"via Write-Output\"\n```\nOutput:\n```\nvia Write-Host\nvia Write-Output\n```\nEach line prints its own text — no surprise there. The surprise is underneath: on screen, both look like completely ordinary, equivalent output, but they're doing fundamentally different things. `Write-Host` writes directly to the console/terminal and nothing else — its output can't be captured, redirected, or piped to another command; it just appears, and then it's gone. `Write-Output` sends its value down the success stream, the same real pipeline every other cmdlet's output flows through — which means it *can* be captured, stored in a variable, piped onward, or redirected to a file. Prove it directly:\n```powershell\n$a = Write-Host \"via Write-Host\"\n$b = Write-Output \"via Write-Output\"\n$a\n$b\n```\nOutput:\n```\nvia Write-Host\nvia Write-Output\n```\nThe first line is `Write-Host` printing itself, immediately, *during the assignment* — its output never entered the pipeline at all, so `$a` ends up holding nothing (`$null`); a bare `$null` prints nothing when it's the third line above, which is why that line is silent. `$b`, on the other hand, genuinely holds `\"via Write-Output\"` from the assignment, which is what the fourth line prints. Chapter 5.7 covers exactly why this distinction exists and when you'd deliberately reach for each one; for now, the practical rule is simple: use `Write-Output` (or, even more often, just a bare expression) for anything that's part of your script's actual result, and save `Write-Host` for messages meant purely for a human watching the screen.\n\n**4. A real script file.**\n\nCreate `hello.ps1`:\n```powershell\nWrite-Output \"Hello, World!\"\n```\nRun it (from inside a `pwsh` session):\n```powershell\n./hello.ps1\n```\nOutput:\n```\nHello, World!\n```\nExactly the setup you proved works back in Chapter 0.2 — a `.ps1` file, run with `./`, doing precisely what its one line says.\n\n**5. A typo, and what PowerShell actually tells you.**\n```powershell\nWrite-Outptu \"Hello, World!\"\n```\nOutput:\n```\nWrite-Outptu: The term 'Write-Outptu' is not recognized as a name of a cmdlet, function, script file, or executable program.\nCheck the spelling of the name, or if a path was included, verify that the path is correct and try again.\n```\nWorth reading once, deliberately, because you'll see some version of this message constantly while learning: PowerShell is telling you plainly that nothing by that exact name exists anywhere it knows to look — not a cryptic error code, just \"I don't recognize this word.\" This is a genuinely different experience from Bash's terser `command not found`, and it's characteristic of PowerShell's overall design: errors tend to explain themselves in plain language rather than making you go look something up.\n\n### ⚠️ Common Mistakes\n\n- **Confusing `Write-Host` and `Write-Output`.** As Example 3 showed, they can look completely identical on screen while behaving completely differently underneath — `Write-Host`'s output is a dead end, `Write-Output`'s isn't. A script that uses `Write-Host` for something meant to be captured or piped will quietly fail to do so, with no error at all.\n- **Forgetting the execution-policy setup from Chapter 0.2.** If a script refuses to run with a message about \"execution of scripts is disabled,\" that's Windows's execution policy, not a mistake in your script — see 0.2 for the one-time fix.\n- **Trying to run a bare cmdlet name from an ordinary terminal, outside PowerShell.** `Write-Output \"hi\"` typed directly into a Bash or `cmd.exe` prompt does nothing sensible — cmdlets only exist inside a PowerShell session. Start one with `pwsh` first.\n- **Expecting `\"some string\"` on its own to do nothing, out of habit from another language.** In PowerShell, that line *is* output — the \"bare expression\" behavior from the core idea above trips up people coming from Python or JavaScript, where a stray string literal on its own line is simply discarded.\n\n### How this connects\n\nThis chapter proved the same edit-save-run cycle from Chapter 0.2 works for real PowerShell code, and introduced the single idea — unconsumed values automatically become output — that Chapter 4.3 (Return Values & the Output Stream) builds directly on. `Write-Host` vs. `Write-Output` gets its full, proper treatment once Chapter 5.7 covers all six of PowerShell's output streams together.\n\n### Quick recap\n\n- Run PowerShell interactively (`pwsh`, then type commands one at a time) or as a script (`.ps1` file, run with `./script.ps1` from inside a session).\n- A bare expression on its own line is automatically written out — no `Write-Output` or `print`-equivalent required, though `Write-Output` does exactly the same thing explicitly.\n- `Write-Host` writes straight to the screen and nothing else, uncapturable; `Write-Output` sends its value down the real pipeline. They can look identical and are not — full treatment in 5.7.\n- An unrecognized command name produces a plain-language \"term ... is not recognized\" error, not a cryptic code."}, {"id": "1.2", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols PowerShell is made of", "chapNum": 2, "slug": "comments-script-structure", "fullTitle": "Comments & Script Structure", "title": "Comments & Script Structure", "md": "### Why this matters\n\nA script you write today makes perfect sense today. Six months from now — or to anyone else reading it — the *why* behind a decision is usually the part that's missing, not the *what*. Comments are how you leave that behind, and PowerShell also has a few structural conventions (how one command ends and the next begins, how a long line gets split) worth knowing cold before you start writing anything longer than one line.\n\n### The core idea\n\nA **comment** is text PowerShell ignores completely when running your script — it's there purely for the humans reading it. PowerShell has two comment forms:\n\n- `#` — everything from a `#` to the end of that line is a comment. Works on its own line, or trailing after real code.\n- `<# ... #>` — a **block comment**, spanning as many lines as you want between the markers. Used for longer explanations, or for temporarily disabling a whole chunk of code at once.\n\nTwo more small pieces of structure round this out: PowerShell normally treats each line as one statement, but a **semicolon** (`;`) lets you put more than one on the same line if you genuinely want to. And a line that's gotten too long can be continued onto the next one with a **backtick** (`` ` ``) at the very end of the line — though, as you'll see below, PowerShell usually gives you a cleaner way to avoid needing it at all.\n\n### Examples\n\n**1. A single-line comment, on its own and trailing after code.**\n```powershell\n# This line explains what's about to happen\n\"result\"          # and this explains the line it's attached to\n```\nOutput:\n```\nresult\n```\nBoth comments vanish completely — PowerShell only ever saw the one real line of code.\n\n**2. A block comment.**\n```powershell\n<#\nThis is a longer explanation that spans\nseveral lines, useful for a fuller description\nof what a script or function does.\n#>\n\"after block comment\"\n```\nOutput:\n```\nafter block comment\n```\nEverything between `<#` and `#>` — no matter how many lines — is ignored. This same syntax is also how PowerShell's \"comment-based help\" works, letting `Get-Help` show a real description for a function you write yourself; Chapter 4.4 covers that properly once functions are in scope.\n\n**3. Semicolons — multiple statements, one line.**\n```powershell\n\"a\"; \"b\"; \"c\"\n```\nOutput:\n```\na\nb\nc\n```\nAll three ran as separate statements, in order, exactly as if each were on its own line. This is occasionally convenient for a quick interactive one-liner, but for a script file, one statement per line is far more readable — this book will use semicolons sparingly and only where it genuinely helps.\n\n**4. The backtick — line continuation, and a real trap to know about.**\n```powershell\nWrite-Output `\n  \"continued line\"\n```\nOutput:\n```\ncontinued line\n```\nThe backtick at the end of the first line tells PowerShell \"this statement isn't finished yet, keep reading on the next line.\" It works — but it's fragile in a specific, easy-to-hit way: the backtick has to be the *literal last character* on the line, with nothing after it, not even a trailing space. Verified directly: the exact same script with one invisible trailing space after the backtick breaks outright —\n```powershell\nWrite-Output ` \n\"broken\"\n```\n```\ncmdlet Write-Output at command pipeline position 1\nSupply values for the following parameters:\nInputObject:\n```\nPowerShell didn't see a continuation at all — it saw `Write-Output` with a stray trailing space where the backtick should have continued, decided it was missing its required argument, and stopped to *interactively ask you for one*, which is exactly the kind of confusing hang a script has no business producing. This is a well-known enough trap that most experienced PowerShell users avoid the backtick almost entirely, for exactly the reason in the next example.\n\n**5. The better way to split a long line — let PowerShell's own syntax do it for you.**\n```powershell\n1,\n2,\n3\n```\nOutput:\n```\n1\n2\n3\n```\nNo backtick needed at all. A line ending in something PowerShell knows is obviously unfinished — a trailing comma, an open pipe `|`, an open parenthesis, an operator like `-and` — continues automatically onto the next line, with none of the trailing-whitespace fragility a backtick has. Whenever there's a choice, prefer structuring a long line to end this way over reaching for a backtick.\n\n### ⚠️ Common Mistakes\n\n- **A trailing space after a line-continuation backtick.** As Example 4 showed, this doesn't just \"still work\" — it silently breaks the continuation, and depending on the command, can leave your script hanging, waiting for interactive input that will never come. If a backtick continuation isn't behaving, check for invisible trailing whitespace first.\n- **Reaching for a backtick when a comma, pipe, or open parenthesis would continue the line automatically and safely**, per Example 5. Save the backtick for the rare case where nothing else applies.\n- **Assuming `#` starts a comment inside a string.** `\"a # symbol\"` is just a string containing the character `#` — it doesn't start a comment, because it's inside quotes. Comments only apply to actual code.\n- **Overusing semicolons to cram unrelated statements onto one line** in an actual script file (rather than a quick interactive check). It saves no real effort and makes the script meaningfully harder to read and debug line-by-line.\n\n### How this connects\n\nComments and clean structure don't change what a script *does* — but every chapter from here forward will use `#` liberally to annotate examples, exactly the way you should annotate your own scripts once the logic in them stops being obvious at a glance. The block-comment syntax (`<# #>`) reappears with a real job to do in Chapter 4.4, as the basis for comment-based function help.\n\n### Quick recap\n\n- `#` comments to the end of the line; `<# ... #>` comments a whole block, however many lines.\n- `;` separates multiple statements on one line — fine for a quick interactive check, best avoided in real scripts.\n- A backtick (`` ` ``) at the *very* end of a line continues it onto the next — but a trailing space after it silently breaks the continuation, sometimes into a confusing interactive hang.\n- Ending a line with something obviously unfinished — a comma, an open pipe `|`, an operator — continues automatically with no backtick and none of its fragility. Prefer this whenever you can."}, {"id": "1.3", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols PowerShell is made of", "chapNum": 3, "slug": "variables-naming-assigning-values", "fullTitle": "Variables: Naming and Assigning Values", "title": "Variables: Naming and Assigning Values", "md": "### Why this matters\n\nA variable is how a script remembers something — a name entered earlier, a file's contents, the result of a calculation — so it can be used again later without redoing the work. It's one of the first things you'll reach for in genuinely every script you write from here on, so it's worth getting the exact rules solid now.\n\n### The core idea\n\nEvery PowerShell variable name starts with a dollar sign: `$name`. Assignment uses a single `=`:\n```powershell\n$name = \"Alex\"\n```\nNo `let`, `var`, or `declare` keyword needed — writing to a variable that doesn't exist yet simply creates it. From then on, `$name` refers to whatever was last assigned to it, until it's assigned again.\n\nTwo PowerShell-specific rules are worth knowing from day one:\n\n- **Variable names are case-insensitive.** `$Name` and `$name` and `$NAME` are all the exact same variable — not three different ones that happen to look similar. This is different from Bash, Python, and most other languages, where case matters.\n- **A variable that's never been assigned reads as `$null`**, PowerShell's representation of \"nothing\" (Chapter 2.9 covers `$null` properly) — not an error, just an empty-feeling value, at least until a later chapter introduces a stricter mode that changes this on purpose.\n\n### Examples\n\n**1. Basic assignment and reading it back.**\n```powershell\n$name = \"Alex\"\n$name\n```\nOutput:\n```\nAlex\n```\n\n**2. Case-insensitivity, proven directly.**\n```powershell\n$Name = \"Alex\"\n$NAME\n$name\n```\nOutput:\n```\nAlex\nAlex\n```\nOne assignment (`$Name = \"Alex\"`), and both `$NAME` and `$name` read back the identical value — because to PowerShell, all three spellings are the same variable.\n\n**3. An unassigned variable is `$null`, not an error.**\n```powershell\n$totallyUndefined\n\"next line ran\"\n```\nOutput:\n```\nnext line ran\n```\nReferencing `$totallyUndefined` produced no visible output at all — `$null`'s bare-expression behavior is to print nothing — and, importantly, it didn't stop the script either. The very next line ran normally. This is worth sitting with for a second: in many languages, using a variable you never defined is a hard error that halts execution. In PowerShell's default mode, it's simply treated as `$null` and the script continues. Chapter 8.3 covers a real, common bug this quiet behavior enables.\n\n**4. Variable names can start with a digit — genuinely, this isn't a typo.**\n```powershell\n$1var = \"x\"\n$1var\n```\nOutput:\n```\nx\n```\nVerified directly: PowerShell happily accepts this. Unlike Bash, PowerShell doesn't reserve `$1`, `$2`, etc. for script/function arguments (that job belongs to `$args`, covered in Chapter 4.2), so there's no conflict to avoid — a variable name here can be letters, digits, and underscores in basically any combination, including starting with, or consisting entirely of, digits (`$123 = \"onlydigits\"` works too). That said, a name like `$1var` is a genuinely bad idea in real code purely for human readability — this example exists to show you the rule, not to recommend the style.\n\n**5. A name with a space or hyphen needs `${...}` instead of plain `$`.**\n```powershell\n${my var} = \"spaced\"\n${my var}\n```\nOutput:\n```\nspaced\n```\nWithout the curly braces, `$my var = \"x\"` is a parser error — PowerShell reads `$my` as the variable and has no idea what to do with the leftover ` var`. Verified directly:\n```\n$my var = \"x\"\n```\n```\nParserError:\nLine |\n   1 |  $my var = \"x\"\n     |      ~~~\n     | Unexpected token 'var' in expression or statement.\n```\nThe same applies to a hyphen (`$my-var` fails identically, since `-` isn't a valid character in a plain `$name`). In practice, real PowerShell code almost never needs `${...}` — this is here so you recognize *why* a name like that needs the braces if you ever see one, not because you should be naming variables with spaces in them.\n\n### ⚠️ Common Mistakes\n\n- **Assuming variable names are case-sensitive**, out of habit from Bash or most programming languages. `$Total` and `$total` are the same variable in PowerShell — reusing a name with different capitalization by accident silently overwrites the \"same\" value rather than creating a second one.\n- **Treating an unassigned variable's silence as proof nothing went wrong.** As Example 3 showed, a typo'd variable name doesn't error — it just quietly becomes `$null`, and your script keeps running with a value that was never actually set. Chapter 8.3 shows the classic bug this causes and a real fix (`Set-StrictMode`).\n- **Forgetting `${...}` for a name that needs it**, then being confused by a `ParserError` that seems to be pointing at the wrong part of the line.\n- **Choosing genuinely unreadable names just because PowerShell allows them** (digits-only, leading digits, single letters beyond a throwaway loop counter). Legal isn't the same as good practice.\n\n### How this connects\n\nVariables are the foundation every later chapter assumes you have solid: Chapter 2.9 gives `$null` its full, proper treatment (including why its quiet default behavior above is deliberate, not a bug), Chapter 4.6 covers *scope* — which variables a function can see and change — and Chapter 8.3's Common Pitfalls chapter revisits the silent-typo problem from Example 3 with `Set-StrictMode` as a real, concrete fix.\n\n### Quick recap\n\n- `$name = value` assigns; no declaration keyword needed, and assigning to a new name creates it.\n- Variable names are **case-insensitive** — `$Name`, `$name`, and `$NAME` are all the same variable.\n- An unassigned variable reads as `$null` and does *not* stop your script — a very different default from most languages.\n- Names can start with, or be entirely, digits (`$1var`, `$123`) — legal, but a poor readability choice in real code.\n- A name containing a space or hyphen needs `${like this}` instead of plain `$likethis`."}, {"id": "1.4", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols PowerShell is made of", "chapNum": 4, "slug": "cmdlet-syntax-verb-noun-parameters-aliases", "fullTitle": "Cmdlet Syntax: Verb-Noun, Parameters & Aliases", "title": "Cmdlet Syntax: Verb-Noun, Parameters & Aliases", "md": "### Why this matters\n\nAlmost every command you'll type in PowerShell is a **cmdlet** (pronounced \"command-let\"), and every single one of them follows the exact same naming pattern. Once that pattern clicks, you stop needing to memorize commands one at a time the way you would in Bash — you start being able to *guess* the right command's name correctly, often on the first try, just from knowing what you want to do.\n\n### The core idea\n\nA cmdlet's name is always **Verb-Noun**: a standard verb, a hyphen, then a specific noun. `Get-Process` gets processes. `Get-ChildItem` gets the items inside something (a folder, most often). `Stop-Process` stops a process. `New-Item` creates a new item. The verb comes from a fixed, curated list PowerShell itself ships — `Get-Verb` lists all of them — specifically so that \"the command that retrieves something\" is always spelled `Get-`, never `Fetch-`, `Read-`, or `Show-` depending on who wrote it. This is a deliberate, enforced design choice, not a convention people happen to mostly follow.\n\nOnce you're calling a cmdlet, you pass it information two ways:\n\n- **Named parameters** — `-ParameterName value`, explicit about exactly which parameter you mean.\n- **Positional parameters** — just `value`, with no name, for a cmdlet's first parameter or two, in a fixed order the cmdlet itself defines.\n\nAnd a **switch parameter** is a parameter that's just present or absent, with no value needed — `-Recurse` alone means \"yes, recurse,\" full stop.\n\n### Examples\n\n**1. A first taste of `Get-Verb`.**\n```powershell\nGet-Verb | Select-Object -First 5\n```\nOutput:\n```\nVerb  AliasPrefix Group  Description\n----  ----------- -----  -----------\nAdd   a           Common Adds a resource to a container, or attaches an item t…\nClear cl          Common Removes all the resources from a container but does n…\nClose cs          Common Changes the state of a resource to make it inaccessib…\nCopy  cp          Common Copies a resource to another name or to another conta…\nEnter et          Common Specifies an action that allows the user to move into…\n```\nThis is the actual, fixed vocabulary every cmdlet author draws from — a genuinely different world from a Bash toolbox where `grep`, `ls`, and `awk` are three completely unrelated words invented independently, decades apart, by different people.\n\n**2. Named vs. positional — the same call, two ways.**\n```powershell\nGet-Process -Name pwsh\nGet-Process pwsh\n```\nBoth produce the identical result — a running `pwsh` process. `Get-Process`'s first positional slot is specifically defined to mean `-Name`, so leaving the parameter name off works *because* the cmdlet says it should, not as some general shortcut. This isn't true of every parameter on every cmdlet — only the ones a cmdlet's author specifically marked as positional, and usually only the first one or two.\n\n**3. A switch parameter — present means true, nothing to assign.**\n```powershell\nGet-ChildItem -Path /tmp -Recurse -ErrorAction SilentlyContinue | Measure-Object\n```\nOutput (count will vary by system):\n```\nCount : 11308\n```\n`-Recurse` alone — no `-Recurse $true`, no value at all — tells `Get-ChildItem` to descend into every subfolder rather than just the top level. (`-ErrorAction SilentlyContinue` is a *common parameter*, available on virtually every cmdlet, quietly swallowing \"permission denied\" noise from folders you can't read; Chapter 5.9 covers `-ErrorAction` properly.)\n\n**4. Parameter names can be abbreviated — as long as the abbreviation is unambiguous.**\n```powershell\nGet-ChildItem -Fo /tmp\n```\nThis works exactly like `-Force` would — `Get-ChildItem` has exactly one parameter starting with `Fo`, so PowerShell resolves the abbreviation with total confidence. But shorten it further into genuinely ambiguous territory and PowerShell says so plainly rather than guessing:\n```powershell\nGet-ChildItem -P /tmp\n```\n```\nGet-ChildItem: Parameter cannot be processed because the parameter name 'P' is ambiguous. Possible matches include: -Path -ProgressAction -PipelineVariable -LiteralPath.\n```\nVerified directly — `-P` genuinely matches four different parameters on this cmdlet, and PowerShell refuses to silently pick one for you. Handy for fast interactive typing once you know a cmdlet well; risky to lean on in a script meant to run reliably later, since a future PowerShell version adding one more similarly-named parameter could turn a working abbreviation into exactly this error.\n\n**5. Aliases — a short nickname for a full cmdlet name.**\n```powershell\ngci /tmp\n```\n`gci` is a built-in **alias** for `Get-ChildItem` — a separate name that resolves to the same underlying command. `Get-Command gci` confirms this directly:\n```\nCommandType     Name\n-----------     ----\nAlias           gci -> Get-ChildItem\n```\nAliases are genuinely useful for fast interactive typing (Chapter 0.2 already introduced a few navigation ones: `pwd`, `cd`, `dir`), but this book will consistently use full cmdlet names in every script example — a script that reads `Get-ChildItem` is self-documenting to someone unfamiliar with PowerShell's aliases; one that reads `gci` isn't.\n\n### ⚠️ Common Mistakes\n\n- **Using parameter abbreviations or aliases in scripts meant to last.** Both are fine for a quick interactive check; neither belongs in a script you or anyone else will need to read and trust later. Prefer full cmdlet names and full parameter names (`-Recurse`, not `-Rec`) in anything you save.\n- **Assuming any word can be a positional argument.** Only a cmdlet's specifically-designated positional parameters work that way — check a cmdlet's own help (Chapter 1.5) rather than guessing which ones.\n- **Guessing at a verb instead of checking `Get-Verb`** or a cmdlet's actual name. PowerShell won't accept `Fetch-Process` or `Retrieve-Process` just because they seem reasonable — the verb has to be one from the real, fixed list.\n- **Assuming an abbreviation that works today will always work.** As Example 4 showed, an abbreviation is only unambiguous *among the parameters that currently exist* — it's not a stable, permanent shorthand the way a full name is.\n\n### How this connects\n\nVerb-Noun naming is the reason Chapter 1.5's `Get-Command` search works as well as it does — searching for every `Get-*` cmdlet, or every `*-Process` cmdlet, is a real, practical way to explore what's available, precisely because the naming is consistent. `-ErrorAction`, previewed in Example 3, gets its full treatment in Chapter 5.9.\n\n### Quick recap\n\n- Every cmdlet is named **Verb-Noun**, with the verb drawn from a fixed list (`Get-Verb` shows it) — not an arbitrary convention, an enforced one.\n- Parameters are passed by name (`-Name value`) or, for a cmdlet's specifically-designated positional parameters, by position alone (just `value`).\n- A **switch parameter** (`-Recurse`, `-Force`) needs no value — its mere presence means true.\n- Parameter names can be abbreviated as long as the abbreviation is unambiguous among that cmdlet's parameters; a genuinely ambiguous one produces a clear error listing every possible match, never a silent guess.\n- An **alias** (`gci`, `pwd`, `cd`) is a short nickname for a full cmdlet name — great for typing fast interactively, best avoided in scripts meant to be read later."}, {"id": "1.5", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols PowerShell is made of", "chapNum": 5, "slug": "discovering-commands-get-command-get-help-get-member", "fullTitle": "Discovering Commands: Get-Command, Get-Help, Get-Member", "title": "Discovering Commands: Get-Command, Get-Help, Get-Member", "md": "### Why this matters\n\nNo one memorizes PowerShell — there are thousands of cmdlets across hundreds of modules, and nobody's expected to hold that in their head. What experienced PowerShell users actually have is fluency with three cmdlets that let them *discover* everything else on demand: what commands exist, how to use one, and exactly what kind of thing a piece of data actually is. Learn these three well, right at the start, and you'll never feel stuck staring at unfamiliar output again.\n\n### The core idea\n\n- **`Get-Command`** answers \"what commands exist?\" — searchable by name pattern, by verb, by noun.\n- **`Get-Help`** answers \"how do I use *this specific* command?\" — syntax, parameters, and (once downloaded) real usage examples.\n- **`Get-Member`** answers \"what actually *is* this value I'm holding?\" — its real type, every property, every method it has. This one matters more in PowerShell than the equivalent would in most languages, precisely because of the object pipeline from Chapter 1.6 — everything flowing through it is a real, structured object, and `Get-Member` is how you see exactly what that object can do.\n\n### Examples\n\n**1. `Get-Command`, searching by noun.**\n```powershell\nGet-Command -Noun Process | Select-Object Name\n```\nOutput:\n```\nName\n----\nDebug-Process\nGet-Process\nStart-Process\nStop-Process\nSwitch-Process\nWait-Process\n```\nEvery cmdlet that operates on a \"Process,\" regardless of verb — a genuinely useful way to discover \"wait, is there a cmdlet that does X to a process?\" without knowing its exact name yet. (Piping through `Select-Object Name` here just keeps the output to one clean column — `Get-Command` alone also reports each result's `CommandType`, `Version`, and `Source`, and how many of those columns your terminal actually shows depends on how wide it is.)\n\n**2. `Get-Command`, searching by verb.**\n```powershell\nGet-Command -Verb Stop | Select-Object Name\n```\nOutput:\n```\nName\n----\nStop-Computer\nStop-Job\nStop-Process\nStop-Transcript\n```\nThe reverse search — everything that can be `Stop`ped. Combined with Chapter 1.4's Verb-Noun convention, `-Verb`/`-Noun` search is often faster than remembering a cmdlet's exact name.\n\n**3. `Get-Help`, and a real first-run wrinkle worth knowing about.**\n```powershell\nGet-Help Get-Process\n```\nOn a fresh PowerShell install, this shows only basic syntax — no description, no examples — plus a note explaining why:\n```\nREMARKS\n    Get-Help cannot find the Help files for this cmdlet on this computer. It\n    is displaying only partial help.\n        -- To download and install Help files for the module that includes\n    this cmdlet, use Update-Help.\n```\nPowerShell doesn't ship its full help text by default (it would meaningfully bloat every install) — it downloads it on demand. Run this once, the first time you set up a new machine:\n```powershell\nUpdate-Help -Force\n```\nAfter that, `Get-Help Get-Process -Examples` (verified on this book's reference machine, after running `Update-Help`) shows real, complete usage examples:\n```\nExample 1: Get a list of all active processes on the local computer\n\nGet-Process\n\nThis command gets a list of all active processes running on the local\ncomputer. For a definition of each column, see the Notes (#notes)section.\nExample 2: Get all available data about one or more processes\n\nGet-Process winword, explorer | Format-List *\n```\n`-Examples` alone is usually the fastest way to learn a new cmdlet — real, runnable usage, not just a dry parameter list. `-Full` shows everything at once (syntax, description, every parameter's own explanation, and examples together) when you need the complete picture.\n\n**4. `Get-Member` — what is this thing, really?**\n```powershell\nGet-Process | Select-Object -First 1 | Get-Member\n```\nOutput (trimmed):\n```\n   TypeName: System.Diagnostics.Process\n\nName                MemberType     Definition\n----                ----------     ----------\nHandles             AliasProperty  Handles = Handlecount\nName                AliasProperty  Name = ProcessName\n...\nBeginErrorReadLine  Method         void BeginErrorReadLine()\nBeginOutputReadLine Method         void BeginOutputReadLine()\n```\nThe `TypeName` line is the real, exact .NET type underneath — here, `System.Diagnostics.Process`, not just \"an object PowerShell made up.\" Every `Get-Process` result carries this full set of properties and methods, whether or not you'd ever guessed at their names — `Get-Member` is how you find out for certain instead of guessing.\n\n**5. Even a plain string or number has real members — this is worth genuinely internalizing.**\n```powershell\n\"hello\" | Get-Member -MemberType Method\n```\nOutput (trimmed):\n```\nName       MemberType Definition\n----       ---------- ----------\nClone      Method     System.Object Clone()\nCompareTo  Method     ...\nContains   Method     ...\nCopyTo     Method     ...\nEndsWith   Method     ...\n```\n`-MemberType Method` filters down to just the methods (leaving out properties) — genuinely everything flowing through PowerShell's pipeline, even something as ordinary-looking as a string, is a real .NET object with real methods, not a \"primitive\" the way it might be in another language. Chapter 2.8 (The Type System & Type Conversion) explains exactly why.\n\n### ⚠️ Common Mistakes\n\n- **Guessing at a cmdlet's behavior instead of running `Get-Help -Examples` first.** A cmdlet's parameter list alone rarely makes its actual usage obvious — the examples almost always do.\n- **Forgetting `Update-Help` on a fresh machine**, then concluding a cmdlet has no documentation at all, when really the local help files just haven't been downloaded yet.\n- **Piping something into a cmdlet or using a property without ever checking `Get-Member` first**, then being surprised the property \"doesn't exist.\" If you're not sure exactly what you're holding, `Get-Member` tells you for certain, in seconds.\n- **Assuming a plain value like a string or a number is somehow \"simpler\" than a custom object and has nothing worth inspecting.** Example 5 shows that's never true in PowerShell — everything is a real object with real members.\n\n### How this connects\n\nThese three cmdlets are the reason this book can move fast without asking you to memorize hundreds of names — from here forward, whenever a new cmdlet appears, `Get-Help <name> -Examples` and `<result> | Get-Member` are always available to explore further on your own. `Get-Member`'s role becomes central the moment Chapter 1.6 introduces the object pipeline properly, and again in Chapter 2.7 once you start building your own structured objects.\n\n### Quick recap\n\n- `Get-Command -Verb X` / `-Noun Y` searches for cmdlets by what they do or what they act on.\n- `Get-Help <cmdlet>` shows syntax; add `-Examples` for real usage, `-Full` for everything. Run `Update-Help -Force` once per machine to get complete help text instead of a bare syntax stub.\n- `Get-Member` reveals a value's real type (`TypeName`) and every property/method it actually has — pipe *any* result into it when you're not sure exactly what you're holding.\n- Even ordinary-looking values like strings and numbers are real .NET objects with real members — nothing flowing through PowerShell's pipeline is a \"bare primitive.\""}, {"id": "1.6", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols PowerShell is made of", "chapNum": 6, "slug": "the-pipeline-passing-objects-not-text", "fullTitle": "The Pipeline: Passing Objects, Not Text", "title": "The Pipeline: Passing Objects, Not Text", "md": "### Why this matters\n\nThis is the single most important idea in this entire book, and it's the one that makes PowerShell genuinely different from every other shell — including Bash, if that's where you're coming from. Everything else you'll learn from here on builds on top of it, so it's worth slowing down and letting this one properly sink in before moving on.\n\n### The core idea\n\nIn Bash (and most other shells), a pipe (`|`) connects one command's output to another's input as a stream of plain **text** — lines of characters, nothing more. If a second command needs a specific piece of that text (say, just the process ID out of `ps aux`'s output), it has to *parse* the text back apart — with `awk`, `cut`, a regular expression — to dig the value back out of a format that was really designed to be read by a human, not a program.\n\nIn PowerShell, a pipe connects one command's output to another's input as real, structured **.NET objects** — the same rich objects Chapter 1.5's `Get-Member` showed you, complete with named properties and real types, not flattened into text at all. When one cmdlet's output becomes another's input, nothing gets parsed apart, because nothing ever became text in the first place. This single design decision is why PowerShell feels so different once it clicks: you stop thinking \"how do I extract this value from that text,\" and start thinking \"which property already holds this value.\"\n\n### Examples\n\n**1. A pipeline that filters, sorts, and shapes — three cmdlets, one line.**\n```powershell\nGet-Process | Sort-Object -Property CPU -Descending | Select-Object -First 3 -Property ProcessName, CPU\n```\nOutput (will vary by system):\n```\nProcessName           CPU\n-----------           ---\ngnome-shell       2944.170\ngnome-terminal... 1776.020\nclaude             206.240\n```\nThree cmdlets, chained: get every running process, sort them by their real `CPU` property (a number), keep only the top 3, and show just two of their properties. `Sort-Object -Property CPU` works because every object `Get-Process` produces genuinely *has* a `CPU` property sitting on it already — nothing needed to be scraped out of formatted text to make this possible.\n\n**2. Proof it's really sorting by number, not by text — this is the whole point, made concrete.**\n```powershell\n9,87,201748 | Sort-Object\n```\nOutput:\n```\n9\n87\n201748\n```\nCorrect numeric order. Now watch what happens to the *exact same values*, the moment they're text instead of numbers:\n```powershell\n\"9\",\"87\",\"201748\" | Sort-Object\n```\nOutput:\n```\n201748\n87\n9\n```\nBackwards, and for a completely understandable reason: sorted as text, `\"201748\"` comes before `\"87\"` because `'2'` comes before `'8'` as the very first character — string comparison has no idea these are meant to be numbers at all. This is exactly the class of bug that quietly haunts a *text*-based pipeline the moment values have different lengths, and exactly the class of bug PowerShell's object pipeline makes structurally impossible for anything that's genuinely a number: `Sort-Object` sorted correctly in Example 1 not because it got lucky, but because `CPU` was never text to begin with.\n\n**3. `$_` — \"the current object,\" inside the pipeline.**\n```powershell\n1,2,3 | ForEach-Object { $_ * 10 }\n```\nOutput:\n```\n10\n20\n30\n```\n`$_` (formally an automatic variable, covered properly in Chapter 2.10) refers to whichever object is currently flowing through the pipeline at that point — here, each number in turn. `ForEach-Object` runs its script block once per incoming object, with `$_` set to that object each time. You'll see `$_` constantly from here on; it's the pipeline's way of saying \"this one, right here.\"\n\n**4. Filtering by a real property, not by matching text.**\n```powershell\nGet-Process | Where-Object { $_.ProcessName -eq \"pwsh\" } | Select-Object -First 1 -Property ProcessName, Id\n```\nOutput:\n```\nProcessName     Id\n-----------     --\npwsh        201726\n```\n`$_.ProcessName` reaches directly into the current object's real `ProcessName` property — no regular expression hunting for the right substring in a line of formatted text. `Where-Object` and `$_` both get their full, dedicated treatment in Chapter 5.1; this is a first, deliberate look at the shape you'll be using constantly.\n\n**5. Grabbing exactly one value straight off an object — no text parsing at all.**\n```powershell\n(Get-Process -Name pwsh | Select-Object -First 1).Id\n```\nOutput:\n```\n201748\n```\nWrapping a pipeline in parentheses lets you immediately reach for a property (`.Id`) on whatever it produced — going straight from \"get a process\" to \"here's its exact process ID as a real number,\" with no intermediate text representation to have ever existed, let alone to parse.\n\n### ⚠️ Common Mistakes\n\n- **Trying to parse PowerShell's *displayed* output as if it were the real data**, out of habit from Bash. What you see printed to the screen (Example 1's neat table) is a *formatted rendering* of the underlying objects, produced for human eyes — the real data is the objects themselves, still holding every property, whether or not that property happened to show in the printed table. Reach for the object's actual properties (`Select-Object`, direct `.PropertyName` access, `Where-Object`), never for slicing up the printed text.\n- **Sorting or comparing values that look numeric but are actually text**, and being confused by Example 2's kind of backwards result. If something should sort numerically, make sure it's a real number (Chapter 2.8 covers converting text to a number on purpose) rather than text that merely looks like one.\n- **Forgetting `$_` only means something *inside* a pipeline script block** (`{ ... }` passed to `Where-Object`, `ForEach-Object`, and similar) — using it outside of one just gives you `$null`, since there's no \"current pipeline object\" to refer to.\n- **Assuming every shell's pipe works the way Bash's does.** If you're coming from this series' own Bash book: unlearn \"pipes move text\" specifically for PowerShell — it's the single biggest habit worth deliberately resetting.\n\n### How this connects\n\nEvery single chapter in Part V (Paragraphs) is really just this one idea, applied and deepened: `Where-Object` (5.1), `Select-Object` (5.2), `Sort-Object`/`Group-Object` (5.3), and the rest are all tools for working with the object pipeline you just met here. `$_` gets its full, formal introduction alongside PowerShell's other automatic variables in Chapter 2.10.\n\n### Quick recap\n\n- Bash-style pipes move **text**; PowerShell's pipe moves real, structured **.NET objects** with actual properties — this is the single biggest conceptual difference in the whole language.\n- Because objects (not text) flow through the pipe, sorting/filtering/selecting by a property works correctly and directly — no regex, no text-scraping, no accidental lexical-instead-of-numeric sorting on genuine numbers.\n- `$_` refers to \"the current object\" inside a pipeline script block (`ForEach-Object { ... }`, `Where-Object { ... }`) — you'll use it constantly from here on.\n- What prints to your screen is a *formatted view* of an object, not the object itself — the real data (every property) is still there even if the printed table doesn't show it."}, {"id": "2.1", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 1, "slug": "strings-working-with-text", "fullTitle": "Strings: Working with Text", "title": "Strings: Working with Text", "md": "### Why this matters\n\nText is everywhere in real scripts — file paths, usernames, messages to a person watching the screen, data pulled from an API. PowerShell's strings have one feature that trips up almost everyone coming from another language at least once: double and single quotes genuinely *do different things*, not just a stylistic choice.\n\n### The core idea\n\nA **string** is text, wrapped in quotes. PowerShell has two quoting styles, and choosing between them matters:\n\n- **Double quotes (`\"...\"`)** — variables and certain expressions *inside* the string get expanded (replaced with their value).\n- **Single quotes (`'...'`)** — completely literal. Nothing inside is expanded, ever, no matter what it looks like.\n\n### Examples\n\n**1. Double quotes expand a variable; single quotes don't.**\n```powershell\n$name = \"Alex\"\n\"Hello, $name\"\n'Hello, $name'\n```\nOutput:\n```\nHello, Alex\nHello, $name\n```\nIdentical-looking `$name` inside each string, completely different results — the double-quoted version substituted the variable's actual value, the single-quoted version printed the literal four characters `$name`.\n\n**2. A here-string — a multi-line block of text, quotes and all, made easy.**\n```powershell\n$name = \"Alex\"\n$s = @\"\nHello, $name.\nMultiple lines work too.\n\"@\n$s\n```\nOutput:\n```\nHello, Alex.\nMultiple lines work too.\n```\n`@\"` opens a here-string, `\"@` (on its own line, at the very start of that line) closes it. Everything between them is one string, newlines and all, and — since this used the double-quoted `@\"...\"@` form — `$name` still expanded normally. A single-quoted here-string (`@'...'@`) works identically but stays fully literal, exactly like a regular single-quoted string does.\n\n**3. Concatenation and length.**\n```powershell\n\"a\" + \"b\"\n\"hello\".Length\n```\nOutput:\n```\nab\n5\n```\n`+` joins two strings together. `.Length` is a real property on every string (Chapter 1.5's `Get-Member` would show you this and plenty more) — no separate \"length of a string\" function needed.\n\n**4. Escape sequences — using the backtick, not a backslash.**\n```powershell\n\"Tab:`tNewline:`nEnd\"\n```\nOutput:\n```\nTab:\tNewline:\nEnd\n```\nPowerShell uses the backtick (`` ` ``) as its escape character inside double-quoted strings — `` `t `` for a tab, `` `n `` for a newline, `` `` `` `` for a literal backtick itself. This is a genuinely easy thing to get wrong coming from almost any other language, where `\\` does this job instead — in PowerShell, a bare `\\` is just a literal backslash (handy, since it's also the folder separator on Windows), with no special meaning inside a string at all.\n\n**5. A literal single quote inside a single-quoted string — double it up.**\n```powershell\n'It''s literal: $name'\n```\nOutput:\n```\nIt's literal: $name\n```\nDoubling the single quote (`''`) is how you get one literal `'` inside a single-quoted string — and notice `$name` stayed completely unexpanded, exactly as single quotes promise.\n\n**6. String comparison is case-insensitive by default.**\n```powershell\n\"ABC\" -eq \"abc\"\n```\nOutput:\n```\nTrue\n```\nWorth knowing immediately: PowerShell's default `-eq` treats `\"ABC\"` and `\"abc\"` as equal. Chapter 2.4 covers the case-*sensitive* variant (`-ceq`) for when that default isn't what you want.\n\n### ⚠️ Common Mistakes\n\n- **Using a backslash for escape sequences, out of habit** (`\"Tab:\\tEnd\"`). In PowerShell this does nothing special — it's a literal backslash followed by a literal `t`. Use the backtick (`` `t ``, `` `n ``, etc.) instead.\n- **Expecting single quotes to expand a variable \"just this once.\"** They never do, under any circumstance — if a variable needs to appear inside a string, that string has to be double-quoted (or use string formatting, Chapter 2.2).\n- **Forgetting a here-string's closing `\"@` must be the very first thing on its own line** — even one leading space before it breaks the here-string with a confusing parser error.\n- **Assuming string comparison is case-sensitive**, out of habit from languages where it always is. `\"Password\" -eq \"password\"` is `True` in PowerShell by default.\n\n### How this connects\n\nEverything here is the foundation for Chapter 2.2's deeper string formatting and interpolation, and for Chapter 2.11's regular expressions — both build directly on the double-quoted-vs-single-quoted distinction this chapter established. Chapter 2.4 revisits string comparison with the full family of case-sensitive/insensitive operator pairs.\n\n### Quick recap\n\n- Double quotes (`\"...\"`) expand variables and expressions inside them; single quotes (`'...'`) never expand anything.\n- A here-string (`@\"...\"@` or `@'...'@`) holds multi-line text as one value; the closing marker must start its own line with nothing before it.\n- `+` concatenates strings; `.Length` gives a string's character count.\n- Escape sequences use the backtick (`` `t ``, `` `n ``), not a backslash.\n- String comparison (`-eq` and friends) is case-**insensitive** by default."}, {"id": "2.2", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 2, "slug": "string-formatting-interpolation", "fullTitle": "String Formatting & Interpolation", "title": "String Formatting & Interpolation", "md": "### Why this matters\n\nChapter 2.1 showed that a double-quoted string expands a plain variable. Real formatting needs more than that — inserting a calculated value, controlling how many decimal places a number shows, or reaching into an object's property from inside a string. PowerShell gives you a few different tools for this, and knowing which one to reach for (and where the obvious-looking approach quietly fails) saves real confusion.\n\n### The core idea\n\nThree tools, three different jobs:\n\n- **The `-f` format operator** — `\"{0} is {1}\" -f value1, value2` — inserts values into numbered placeholders, with real control over number/date formatting.\n- **Subexpressions (`$(...)`) inside a string** — lets you embed the result of an actual expression, not just a bare variable, directly inside a double-quoted string.\n- **String methods** (`.Trim()`, `.Replace()`, `.Split()`, and more) — every string is a real object (Chapter 1.5), so it comes with built-in methods for common transformations, no separate function needed.\n\n### Examples\n\n**1. The `-f` operator — numbered placeholders.**\n```powershell\n\"{0} is {1} years old\" -f \"Alex\", 30\n```\nOutput:\n```\nAlex is 30 years old\n```\n`{0}` and `{1}` are filled in, in order, by the values listed after `-f`. Placeholders can repeat or appear out of order too — genuinely useful once a template gets reused with different values.\n\n**2. `-f` with real format specifiers — this is where it earns its place over plain interpolation.**\n```powershell\n\"{0:N2}\" -f 3.14159\n\"{0:C}\" -f 19.99\n\"{0:D4}\" -f 7\n```\nOutput:\n```\n3.14\n$19.99\n0007\n```\n`N2` rounds to 2 decimal places, `C` formats as currency (verified on this book's US-locale reference system — the exact symbol shown depends on your system's locale), and `D4` zero-pads an integer to 4 digits. This level of control has no equivalent in plain `\"$var\"` interpolation — it's the main reason to reach for `-f` specifically.\n\n**3. Subexpressions — embedding a real expression's result, not just a variable.**\n```powershell\n$arr = 1,2,3\n\"Count: $($arr.Count)\"\n```\nOutput:\n```\nCount: 3\n```\n`$arr` alone would just show the array (Chapter 2.5); wrapping it as `$($arr.Count)` tells PowerShell \"evaluate this whole expression first, then insert the result.\" Anything can go inside `$(...)` — a property access, a method call, even a small pipeline.\n\n**4. The gotcha this chapter exists to warn you about: plain property access does *not* work inside a double-quoted string.**\n```powershell\n$obj = [PSCustomObject]@{Name = \"Alex\"}\n\"Name: $obj.Name\"\n```\nOutput:\n```\nName: @{Name=Alex}.Name\n```\nAlmost certainly not what was wanted, and worth studying closely because it's such an easy mistake to make. PowerShell's string interpolation only expands the *bare variable* `$obj` — it has no idea `.Name` was meant to be part of the expansion, so it prints `$obj`'s own default string representation (`@{Name=Alex}`), followed by the literal text `.Name` tacked on afterward. The fix is exactly Example 3's subexpression syntax:\n```powershell\n\"Name: $($obj.Name)\"\n```\n```\nName: Alex\n```\nWrapping it in `$(...)` tells PowerShell explicitly \"this whole thing, including the `.Name`, is one expression to evaluate\" — and it works correctly. **Any time you need a property or method on the right side of a `$variable` inside a double-quoted string, wrap it in `$(...)`.** No exceptions.\n\n**5. String methods — built in, no separate function needed.**\n```powershell\n\"  hello  \".Trim()\n\"HELLO\".ToLower()\n\"hello\".ToUpper()\n\"hello world\".Replace(\"world\", \"there\")\n```\nOutput:\n```\nhello\nhello\nHELLO\nhello there\n```\nEvery string carries these (and many more — `Get-Member` on any string shows the full list). `.Trim()` strips leading/trailing whitespace, `.ToLower()`/`.ToUpper()` change case, `.Replace()` does a literal (not pattern-based) find-and-replace — for pattern-based replacement, Chapter 2.11's `-replace` operator is the tool.\n\n**6. `.Split()` and the `-join` operator — pulling a string apart, and putting pieces back together.**\n```powershell\n\"a,b,c\".Split(\",\")\n(\"a\", \"b\", \"c\") -join \"-\"\n```\nOutput:\n```\na\nb\nc\na-b-c\n```\n`.Split(\",\")` breaks a string into an array wherever the given character appears; `-join` does the reverse, gluing an array's elements back into one string with the given separator between each. Chapter 2.5 covers `-join` (and its partner, the array-building range operator) in full alongside arrays generally.\n\n### ⚠️ Common Mistakes\n\n- **Writing `\"$obj.Property\"` and expecting it to work**, exactly as Example 4 demonstrated. Always wrap property/method access in `$(...)` inside a double-quoted string.\n- **Reaching for `-f`'s numbered placeholders when a simple `$var` would do.** `-f` earns its keep specifically for *formatting control* (decimal places, padding, currency) — for a plain value with no special formatting, ordinary interpolation (`\"$var\"`) is simpler and just as correct.\n- **Using `.Replace()` when a pattern (not a literal substring) is actually needed.** `.Replace(\"world\", \"there\")` only matches the literal text `\"world\"` — for wildcard or regex-based replacement, use the `-replace` operator (Chapter 2.11) instead.\n- **Forgetting `.Split()` takes a plain character/string, not automatically a regex pattern**, and being surprised when a \"special\" splitting character (like `.` or `|`) doesn't split the way a regex would expect. Chapter 2.11 covers the regex-aware alternative.\n\n### How this connects\n\nThe subexpression syntax `$(...)` from Example 3 reappears constantly — anywhere a real expression's result, not just a bare variable, needs to land inside a string. Chapter 2.11 picks up exactly where `.Replace()` and `.Split()` leave off, with full regular-expression power. Chapter 2.7's `[PSCustomObject]` gets its own proper introduction next.\n\n### Quick recap\n\n- `\"{0} is {1}\" -f val1, val2` inserts values into numbered placeholders, with real formatting control (`{0:N2}`, `{0:C}`, `{0:D4}`, and more).\n- `$(...)` inside a double-quoted string evaluates a real expression (property access, method call, small pipeline) and inserts its result — required for anything beyond a bare `$variable`.\n- `\"$obj.Property\"` does **not** access the property — it prints `$obj`'s own string form plus the literal text `.Property`. Always use `$($obj.Property)` instead.\n- Strings carry built-in methods (`.Trim()`, `.ToUpper()`, `.Replace()`, `.Split()`, and more) — no separate function needed, discoverable via `Get-Member`.\n- `-join` glues an array's elements into one string; `.Split()` does the reverse."}, {"id": "2.3", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 3, "slug": "numbers-arithmetic", "fullTitle": "Numbers & Arithmetic", "title": "Numbers & Arithmetic", "md": "### Why this matters\n\nEvery script eventually counts something, calculates something, or checks a number against a threshold. PowerShell's number handling has a few genuinely pleasant surprises compared to languages like C — and one classic trap it shares with almost every language that uses floating-point math, worth knowing about before it bites you.\n\n### The core idea\n\nPowerShell has several numeric types, chosen automatically based on what a literal looks like: whole numbers become `Int32` (or `Int64` if they're too big to fit), anything with a decimal point becomes `Double`, and a handful of one-letter suffixes let you request a specific type explicitly. Every standard arithmetic operator works as expected: `+ - * / %` (modulo/remainder), plus **compound assignment** (`+=`, `-=`, `*=`, `/=`) and **increment/decrement** (`++`, `--`) for the extremely common \"update this variable based on itself\" pattern.\n\n### Examples\n\n**1. Types are inferred automatically from how a literal looks.**\n```powershell\n(5).GetType().Name\n(5.0).GetType().Name\n(100000000000).GetType().Name\n```\nOutput:\n```\nInt32\nDouble\nInt64\n```\nA whole number fits `Int32` by default — until it's too big, at which point PowerShell quietly promotes it to `Int64` on its own, no error, no overflow. A decimal point makes it a `Double`, regardless of the digits after it.\n\n**2. Division that doesn't divide evenly promotes to a decimal result automatically — a pleasant surprise if you're coming from C.**\n```powershell\n7 / 2\n10 / 3\n```\nOutput:\n```\n3.5\n3.33333333333333\n```\nNo silent integer truncation here — dividing two whole numbers that don't divide evenly gives you the real, accurate decimal answer, automatically promoted to `Double`. (`%` still gives you the *remainder* directly, when that's specifically what you want: `10 % 3` is `1`.)\n\n**3. Type suffixes — requesting a specific type on a literal.**\n```powershell\n5L.GetType().Name\n3.14d.GetType().Name\n5u.GetType().Name\n5s.GetType().Name\n```\nOutput:\n```\nInt64\nDecimal\nUInt32\nInt16\n```\n`L` forces `Int64` (a \"long,\" even if the value would otherwise fit in `Int32`), `d`/`D` forces `Decimal` (not `Double` — genuinely easy to guess wrong, since `d` looks like it should mean \"double\"), `u` forces `UInt32` (unsigned), `s` forces `Int16` (\"short\"). You won't need most of these often, but recognizing `d`/`D` specifically matters for the next example.\n\n**4. `[decimal]` avoids the classic floating-point rounding trap — this is worth taking seriously.**\n```powershell\n$r = 0.1 + 0.2\n$r\n$r -eq 0.3\n```\nOutput:\n```\n0.3\nFalse\n```\nPrinted, `$r` looks exactly like `0.3` — but it isn't, underneath. `Double` (the type both `0.1` and `0.2` became) can't represent most decimal fractions exactly in binary, and PowerShell's default display just rounds the result for readability. The real stored value, shown with `\"{0:G17}\" -f $r`, is `0.30000000000000004` — which is why the direct comparison came back `False`. This isn't a PowerShell bug; it's how floating-point math works in essentially every language. The fix, when exact decimal arithmetic genuinely matters (money, most of all):\n```powershell\n[decimal]0.1 + [decimal]0.2\n```\n```\n0.3\n```\n`Decimal` stores values in a way that represents ordinary base-10 fractions exactly, at some cost in range and speed — the right tool specifically for money and anything else where \"looks equal\" absolutely must mean \"is equal.\"\n\n**5. Compound assignment and increment/decrement.**\n```powershell\n$x = 5\n$x += 3\n$x\n$x++\n$x\n```\nOutput:\n```\n8\n9\n```\n`$x += 3` is shorthand for `$x = $x + 3`; `-=`, `*=`, and `/=` work the same way for their respective operators. `$x++` and `$x--` add or subtract exactly 1 — the single most common update of all, common enough to earn its own two-character shorthand.\n\n**6. `[math]` — static methods for everything arithmetic operators don't cover.**\n```powershell\n[math]::Sqrt(16)\n[math]::Pow(2, 10)\n[math]::Round(3.14159, 2)\n[math]::Max(3, 7)\n```\nOutput:\n```\n4\n1024\n3.14\n7\n```\n`[math]` is a direct reference to .NET's `System.Math` class — square roots, powers, rounding to a specific number of decimal places, min/max, and a good deal more, all as **static methods** (called with `::` rather than a pipeline or a normal function call). `Get-Member` doesn't help discover these the usual way, since they belong to the type itself, not to an instance of it — `[math] | Get-Member -Static` is the way to list them all.\n\n### ⚠️ Common Mistakes\n\n- **Comparing floating-point results directly with `-eq`**, as Example 4 showed going wrong. If exact equality matters, either use `[decimal]` for the whole calculation, or compare with a small tolerance (`[math]::Abs($a - $b) -lt 0.0001`) instead of a bare `-eq`.\n- **Assuming `d`/`D` means \"double.\"** It means `Decimal` — a real, easy trap given how natural the guess is. `Double` has no dedicated suffix; it's simply the default for any literal with a decimal point.\n- **Reaching for a custom loop to compute something `[math]` already provides** (square roots, rounding, min/max). Check `[math]`'s static methods first.\n- **Forgetting `::` for static members.** `[math].Sqrt(16)` (a dot, not `::`) is a parser error — static methods on a type reference always use `::`, never a plain dot.\n\n### How this connects\n\nThe `Decimal` vs. `Double` distinction from Example 4 matters again the moment real money or exact-precision math shows up in a script — keep it in mind rather than reaching for `Double` out of habit. Chapter 2.4 covers comparison operators next, including the case-sensitive variants that pair with everything Chapter 2.1 and 2.2 covered about strings.\n\n### Quick recap\n\n- Whole numbers default to `Int32` (auto-promoting to `Int64` if too large); anything with a decimal point defaults to `Double`.\n- Division that doesn't divide evenly promotes automatically to a decimal result — no silent truncation like in C.\n- Type suffixes: `L` (Int64), `d`/`D` (**Decimal**, not Double — easy to misremember), `u` (UInt32), `s` (Int16).\n- `Double` math can't represent most decimal fractions exactly (`0.1 + 0.2 -eq 0.3` is `False`) — use `[decimal]` when exact decimal precision matters, especially for money.\n- `+= -= *= /=` and `++`/`--` cover the common \"update based on current value\" pattern; `[math]::Sqrt`/`Pow`/`Round`/`Max`/`Min` (and more) cover what the operators don't, called with `::`."}, {"id": "2.4", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 4, "slug": "comparison-logical-type-operators", "fullTitle": "Comparison, Logical & Type Operators", "title": "Comparison, Logical & Type Operators", "md": "### Why this matters\n\nEvery `if` statement, every filter, every loop condition in the rest of this book leans on the operators in this chapter. PowerShell's comparison operators look different from the `==`/`<`/`>` you may know from other languages — for a good reason you'll appreciate the first time you need to compare a whole list of things at once (Chapter 8.3 shows exactly why the familiar symbols were dropped).\n\n### The core idea\n\nPowerShell spells comparisons as words, not symbols: `-eq` (equal), `-ne` (not equal), `-lt`/`-gt` (less/greater than), `-le`/`-ge` (less/greater or equal). Pattern and membership get their own dedicated operators: `-like` (wildcard matching), `-match` (regex matching), `-contains`/`-in` (membership in a collection). Logic combines conditions: `-and`, `-or`, `-not` (or its symbol form, `!`). And two more check or convert a value's actual type: `-is` and `-as`.\n\n**Every comparison and pattern-matching operator above also has a case-sensitive twin**, formed by adding a `c`: `-ceq`, `-clike`, `-cmatch`, and so on. By default, all of these are case-*insensitive* — exactly the behavior Chapter 2.1 already showed for `-eq` on strings.\n\n### Examples\n\n**1. The basic comparison operators.**\n```powershell\n5 -eq 5\n5 -ne 3\n5 -lt 10\n5 -gt 10\n5 -le 5\n5 -ge 6\n```\nOutput:\n```\nTrue\nTrue\nTrue\nFalse\nTrue\nFalse\n```\nEach does exactly what its name says — no memorizing which symbol means what, at some cost in extra typing.\n\n**2. `-like` — wildcard pattern matching, not regex.**\n```powershell\n\"hello.txt\" -like \"*.txt\"\n\"hello.txt\" -like \"*.jpg\"\n```\nOutput:\n```\nTrue\nFalse\n```\n`*` matches anything, `?` matches exactly one character — the same wildcard vocabulary you've likely already used with a filesystem. This is genuinely different from regex, which Example 3 covers — don't reach for `.` or `[...]` here expecting regex meaning.\n\n**3. `-match` — real regular-expression matching.**\n```powershell\n\"hello123\" -match \"\\d+\"\n$matches[0]\n```\nOutput:\n```\nTrue\n123\n```\n`-match` returns `True`/`False` for whether the pattern matched at all, *and* automatically populates the special `$matches` automatic variable with what actually matched — `$matches[0]` here holds the digits it found. Chapter 2.11 covers `-match` and `$matches` in full, including capture groups.\n\n**4. `-contains` vs. `-in` — the same membership check, written from opposite directions.**\n```powershell\n(1, 2, 3) -contains 2\n2 -in (1, 2, 3)\n```\nOutput:\n```\nTrue\nTrue\n```\nIdentical result, opposite reading order: \"does this collection contain this value\" vs. \"is this value in this collection.\" Pick whichever reads more naturally for a given line — there's no functional difference.\n\n**5. Logical operators — combining conditions.**\n```powershell\n$true -and $false\n$true -or $false\n-not $true\n!$true\n```\nOutput:\n```\nFalse\nTrue\nFalse\nFalse\n```\n`-not` and `!` are two spellings of the exact same operator — use whichever you find more readable; this book will generally prefer `-not` for clarity in longer conditions and `!` for a quick, short negation.\n\n**6. `-is` and `-as` — checking, and converting, a value's type.**\n```powershell\n5 -is [int]\n\"5\" -is [int]\n\"5\" -as [int]\n(\"5\" -as [int]).GetType().Name\n```\nOutput:\n```\nTrue\nFalse\n5\nInt32\n```\n`-is` asks a yes/no question — is this value genuinely already this type? (`\"5\"` is a string, not an int, so `False`.) `-as` *attempts a conversion* and hands back the result — `\"5\" -as [int]` successfully converts the text to a real `Int32`, confirmed by checking its type afterward. Chapter 2.8 covers type conversion, including what `-as` does when a conversion isn't actually possible, in full.\n\n**7. Case-sensitive variants — add a `c`.**\n```powershell\n\"ABC\" -ceq \"abc\"\n\"ABC\" -ceq \"ABC\"\n\"hello.TXT\" -like \"*.txt\"\n\"hello.TXT\" -clike \"*.txt\"\n```\nOutput:\n```\nFalse\nTrue\nTrue\nFalse\n```\n`-eq`/`-like`/`-match` and the rest are case-*insensitive* by default, confirmed here: `\"hello.TXT\" -like \"*.txt\"` matches despite the case difference. Adding a `c` (`-ceq`, `-clike`, `-cmatch`, and so on for every comparison/pattern operator) makes it strictly case-sensitive instead — reach for these whenever case genuinely needs to matter, like comparing a password or a case-sensitive identifier.\n\n### ⚠️ Common Mistakes\n\n- **Using `==`, `<`, `>` out of habit from another language.** PowerShell doesn't recognize them as comparison operators at all in this context — use `-eq`, `-lt`, `-gt`, and the rest of the word-based family.\n- **Using `-like` when regex power is actually needed, or `-match` when a simple wildcard would do.** They're not interchangeable: `-like`'s `*`/`?` wildcards are far more limited than `-match`'s full regex support, and reaching for the wrong one either fails to express what's needed or is needless overkill.\n- **Forgetting comparisons are case-insensitive by default**, and being surprised when `\"Admin\" -eq \"admin\"` comes back `True`. Use the `-c`-prefixed variant whenever case must matter.\n- **Confusing `-is` (a yes/no type check) with `-as` (an attempted conversion that returns a value, or `$null` on failure).** They answer genuinely different questions.\n\n### How this connects\n\n`-match` and `$matches` get their complete treatment, including capture groups and `Select-String`, in Chapter 2.11. `-is`/`-as` connect directly to Chapter 2.8's full type-conversion chapter. Chapter 3.1 (Making Decisions) is where all of these operators get put to work inside real `if` statements for the first time.\n\n### Quick recap\n\n- Comparisons are words, not symbols: `-eq`, `-ne`, `-lt`, `-gt`, `-le`, `-ge`.\n- `-like` matches wildcards (`*`, `?`); `-match` matches full regular expressions and populates `$matches`.\n- `-contains` (collection-first) and `-in` (value-first) check membership — same result, opposite reading order.\n- `-and`, `-or`, `-not`/`!` combine and negate conditions.\n- `-is` checks a value's actual type (yes/no); `-as` attempts to convert to a type and returns the result (or `$null` on failure).\n- Every comparison/pattern operator is case-**insensitive** by default; prefix with `c` (`-ceq`, `-clike`, `-cmatch`, …) for case-sensitive behavior."}, {"id": "2.5", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 5, "slug": "arrays-ordered-collections", "fullTitle": "Arrays: Ordered Collections", "title": "Arrays: Ordered Collections", "md": "### Why this matters\n\nThe moment a script needs to work with more than one value at a time — a list of filenames, a set of numbers to process, several usernames — an array is almost always the tool. PowerShell's arrays are straightforward to use, with one under-the-hood detail worth knowing early: they're not quite as flexible as they look.\n\n### The core idea\n\nAn **array** is an ordered list of values, created just by separating them with commas:\n```powershell\n$arr = 1, 2, 3\n```\nAccess an element by its zero-based position with `[ ]` (`$arr[0]` is the first element), and get the total count with `.Count`. The **range operator** (`..`) builds a sequence of numbers quickly: `1..5` is exactly `1, 2, 3, 4, 5`, without typing each one.\n\n### Examples\n\n**1. Creating and accessing an array.**\n```powershell\n$arr = 1, 2, 3\n$arr\n$arr[0]\n$arr.Count\n```\nOutput:\n```\n1\n2\n3\n1\n3\n```\n\n**2. The range operator — building a sequence of numbers.**\n```powershell\n1..5\n```\nOutput:\n```\n1\n2\n3\n4\n5\n```\nIt works backwards too — `5..1` produces `5, 4, 3, 2, 1`, descending, verified directly. Genuinely handy for counting loops (Chapter 3.4) and for generating quick test data without typing every value by hand.\n\n**3. Negative indices — counting from the end.**\n```powershell\n$arr = 1, 2, 3, 4, 5\n$arr[-1]\n$arr[-2]\n```\nOutput:\n```\n5\n4\n```\n`-1` is the last element, `-2` the second-to-last — no need to compute `$arr.Count - 1` yourself.\n\n**4. Slicing with the range operator.**\n```powershell\n$arr = 1, 2, 3, 4, 5\n$arr[1..3]\n```\nOutput:\n```\n2\n3\n4\n```\n`$arr[1..3]` pulls out elements at indices 1 through 3 (inclusive) — the range operator works just as well inside `[ ]` as it does on its own.\n\n**5. `-join` and `-split` — arrays and strings, converted into each other.**\n```powershell\n(1, 2, 3) -join \",\"\n\"a,b,c\" -split \",\"\n```\nOutput:\n```\n1,2,3\na\nb\nc\n```\n`-join` glues an array's elements into one string, with the given separator between each; `-split` does the reverse, breaking a string into an array wherever the separator appears. (`-split` is actually regex-aware under the hood — Chapter 2.11 covers that power once regular expressions are properly introduced; a plain literal separator like `\",\"` here works exactly as you'd expect either way.)\n\n**6. Appending with `+=` — and a real limitation worth knowing about.**\n```powershell\n$arr = 1, 2, 3\n$arr += 4\n$arr\n```\nOutput:\n```\n1\n2\n3\n4\n```\nThis *looks* like it grew the array in place — but it didn't, and the distinction matters the moment performance is a concern. Verified directly:\n```powershell\n$arr = @(1, 2, 3)\n$arr.IsFixedSize\n```\n```\nTrue\n```\nA PowerShell array is genuinely fixed-size under the hood. `$arr += 4` doesn't add to the existing array at all — it silently creates a brand-new array with every old element copied over plus the new one, and points `$arr` at that instead. For a handful of appends, this is completely invisible and totally fine. In a loop that appends thousands of times, it means thousands of full array copies — a real, measurable performance problem covered properly in Chapter 8.4.\n\n**7. When real, efficient mutability matters: `[System.Collections.ArrayList]`.**\n```powershell\n$al = [System.Collections.ArrayList]::new()\n$al.Add(1) | Out-Null\n$al.Add(2) | Out-Null\n$al\n```\nOutput:\n```\n1\n2\n```\n`ArrayList` (a real .NET collection type, reached for directly since it's already right there — Chapter 7.5 covers calling .NET more generally) genuinely grows in place, without rebuilding the whole thing on every addition. `| Out-Null` after `.Add()` suppresses a small, easy-to-miss annoyance: `.Add()` returns the new item's index, which would otherwise print unwanted noise into your pipeline every time you call it.\n\n### ⚠️ Common Mistakes\n\n- **Appending to a plain array (`+=`) inside a large loop**, unaware it silently rebuilds the entire array every single time, per Example 6. For any loop appending more than a modest number of times, use an `ArrayList` (or, more idiomatically in many cases, build results with the pipeline itself — Chapter 5.5 shows this).\n- **Forgetting arrays are zero-indexed.** `$arr[1]` is the *second* element, not the first.\n- **Assuming `@()` is required to create every array.** Plain `1, 2, 3` already creates one — `@(...)` matters specifically when you need to *force* something into array form that might otherwise not be one (an empty list, or a single value that would otherwise stay a scalar — Chapter 8.3 covers exactly this gotcha).\n- **Confusing `-split`'s regex-based splitting with a plain literal separator**, and being surprised when a character with special regex meaning (like `.` or `|`) doesn't split where expected. Chapter 2.11 covers this properly.\n\n### How this connects\n\n`-join`, seen here, is the same operator that appears constantly once real script output needs assembling into one line. `ArrayList`'s role gets revisited directly in Chapter 8.4's performance chapter, where the `+=` rebuild cost from Example 6 is measured concretely. Hashtables, next up, are the same core \"collection of values\" idea with named keys instead of numeric positions.\n\n### Quick recap\n\n- `1, 2, 3` creates an array; `$arr[0]` accesses by zero-based index; `.Count` gives the length.\n- `1..5` (the range operator) builds a sequence of numbers, ascending or descending; it also works for slicing (`$arr[1..3]`).\n- Negative indices count from the end (`$arr[-1]` is the last element).\n- `-join` combines an array into one string; `-split` breaks a string into an array (regex-aware — full power in 2.11).\n- Arrays are fixed-size under the hood — `+=` silently rebuilds the whole array each time, fine occasionally, a real performance cost in a large loop. `[System.Collections.ArrayList]` grows in place when that matters."}, {"id": "2.6", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: PowerShell's data", "chapNum": 6, "slug": "hashtables-ordered-dictionaries", "fullTitle": "Hashtables & Ordered Dictionaries", "title": "Hashtables & Ordered Dictionaries", "md": "### Why this matters\n\nAn array is great when \"the first thing,\" \"the second thing\" is a meaningful way to refer to your data. A lot of real data isn't like that — a person's name, age, and email aren't naturally \"item 0, item 1, item 2,\" they're naturally *named* fields. A hashtable is PowerShell's answer: a collection of values, each reached by a meaningful name instead of a position.\n\n### The core idea\n\nA **hashtable** is a set of key-value pairs, created with `@{ }`:\n```powershell\n$h = @{ Name = \"Alex\"; Age = 30 }\n```\nAccess a value by its key with `.KeyName` or `[\"KeyName\"]` — both work identically. Add a new key just by assigning to it; no separate \"declare this key first\" step needed.\n\n### Examples\n\n**1. Creating and accessing a hashtable.**\n```powershell\n$h = @{ Name = \"Alex\"; Age = 30 }\n$h\n$h.Name\n$h[\"Age\"]\n```\nOutput:\n```\nName                           Value\n----                           -----\nName                           Alex\nAge                            30\n\nAlex\n30\n```\nBoth `.Name` (dot syntax) and `[\"Age\"]` (bracket syntax) work for reading a value — dot syntax reads slightly cleaner for a key you know in advance; bracket syntax is required the moment the key itself is stored in a variable (`$h[$someVariable]`).\n\n**2. Adding and removing keys.**\n```powershell\n$h = @{}\n$h[\"x\"] = 1\n$h.y = 2\n$h.Remove(\"x\")\n$h\n```\nOutput:\n```\nName                           Value\n----                           -----\ny                              2\n```\nAssigning to a key that doesn't exist yet creates it — no separate declaration step, and it doesn't matter whether you used bracket or dot syntax to do it. `.Remove(\"keyname\")` deletes a key entirely.\n\n**3. `.Keys`, `.Values`, and checking whether a key exists.**\n```powershell\n$h = @{ a = 1; b = 2 }\n$h.Keys\n$h.Values\n$h.ContainsKey(\"a\")\n$h.ContainsKey(\"z\")\n```\nOutput:\n```\nb\na\n2\n1\nTrue\nFalse\n```\n`.ContainsKey()` is the safe way to check for a key's presence before relying on it — reaching for a key that genuinely doesn't exist returns `$null` rather than an error (the same quiet-`$null` behavior Chapter 1.3 showed for plain variables), which can hide a real bug if you're not deliberately checking for it.\n
