so raises `TypeError`.\n- `from typing import Protocol`: enables structural subtyping (interface matching without explicit inheritance).\n- Any class implementing the methods of a `Protocol` satisfies that protocol automatically.\n- Decorate a Protocol with `@runtime_checkable` if you need `isinstance(obj, MyProtocol)` to work at runtime.\n- Use ABCs when you want a strict parent class enforcing shared structure; use Protocols when you want flexible, decoupled duck typing with type safety."}, {"id": "7.1", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 1, "slug": "comprehensions", "fullTitle": "Chapter 7.1: Comprehensions", "title": "Comprehensions", "md": "### Why this matters\n\nYou already know how to build a new list by looping and appending. A comprehension does the same thing in one clean, readable line — and once it clicks, you'll find yourself reaching for it constantly instead of the longer loop form.\n\n### The core idea\n\nA **comprehension** builds a new collection (list, set, or dictionary) by applying an expression to every item of an existing iterable, optionally filtering which items are included — all in a single line.\n\n### Examples\n\nThe loop way you already know, versus a list comprehension doing the same thing:\n```python\n# The loop way:\nsquares = []\nfor n in range(1, 6):\n    squares.append(n ** 2)\nprint(squares)   # [1, 4, 9, 16, 25]\n\n# The comprehension way - same result, one line:\nsquares = [n ** 2 for n in range(1, 6)]\nprint(squares)   # [1, 4, 9, 16, 25]\n```\n\nAdding a condition — only include items that pass a filter:\n```python\nevens = [n for n in range(1, 11) if n % 2 == 0]\nprint(evens)   # [2, 4, 6, 8, 10]\n```\n\nA **set comprehension** — identical idea, curly braces, automatic deduplication:\n```python\nwords = [\"apple\", \"banana\", \"apple\", \"cherry\"]\nlengths = {len(word) for word in words}\nprint(lengths)   # {5, 6} - apple appears twice, but the SET only keeps unique lengths\n```\n\nA **dictionary comprehension** — build key-value pairs directly:\n```python\nnames = [\"Ava\", \"Ben\", \"Cleo\"]\nname_lengths = {name: len(name) for name in names}\nprint(name_lengths)   # {'Ava': 3, 'Ben': 3, 'Cleo': 4}\n```\n\nDictionary comprehensions combine naturally with filtering, and with transforming an *existing* dictionary — inverting keys and values is a classic example:\n```python\nprices = {\"apple\": 0.50, \"banana\": 0.25, \"mango\": 2.00}\ncheap = {item: cost for item, cost in prices.items() if cost < 1.00}\nprint(cheap)   # {'apple': 0.5, 'banana': 0.25}\n\ninverted = {cost: item for item, cost in prices.items()}\nprint(inverted)   # {0.5: 'apple', 0.25: 'banana', 2.0: 'mango'}\n```\n\nA comprehension can call a function on each item, not just apply a simple expression — genuinely common once you're processing real, messier data:\n```python\ndef clean(word):\n    return word.strip().lower()\n\nraw_words = [\"  Hello\", \"WORLD  \", \" Python\"]\ncleaned = [clean(word) for word in raw_words]\nprint(cleaned)   # ['hello', 'world', 'python']\n```\n\nA comprehension can loop over more than one sequence at once, combined with a filter — the equivalent of nested `for` loops plus an `if`, all in one line:\n```python\npairs = [(a, b) for a in range(3) for b in range(3) if a != b]\nprint(pairs)   # [(0, 1), (0, 2), (1, 0), (1, 2), (2, 0), (2, 1)]\n```\n\nA nested comprehension, when working with a list of lists (use sparingly — see Common Mistakes):\n```python\nmatrix = [[1, 2], [3, 4], [5, 6]]\nflattened = [number for row in matrix for number in row]\nprint(flattened)   # [1, 2, 3, 4, 5, 6]\n```\n\n### ⚠️ Common Mistakes\n\n- **Writing a comprehension so dense it's harder to read than the loop it replaced.** If a comprehension needs several nested conditions or loops to express, a regular `for` loop is often more readable — comprehensions are a readability *win* only when they stay simple.\n- **Forgetting a comprehension always builds a whole new collection in memory.** For very large ranges, this can use a surprising amount of memory — Chapter 7.2 introduces generator expressions, a lazy alternative that avoids this.\n- **Trying to use `if`/`elif`/`else` freely inside a comprehension.** A comprehension's condition is a *filter* (`... for x in y if condition`), not a branch. If you need to transform a value differently based on a condition (not just include/exclude it), use the ternary expression from Chapter 3.1 instead: `[x if x > 0 else 0 for x in numbers]`.\n- **Adding too many `for` clauses to one comprehension.** The pairs example above with two `for` clauses is already close to the practical limit of readability — three or more nested loops in one comprehension is usually a sign to write it as a regular nested loop instead.\n- **Reading a nested comprehension left to right, out of order.** `[number for row in matrix for number in row]` executes as if it were two nested `for` loops written normally, in the *same* left-to-right order they appear — it takes some practice to read fluently.\n\n### How this connects\n\nComprehensions are a compact, Pythonic rewrite of loops you already know from Part III — they don't do anything a loop couldn't, they just express it more concisely once the pattern is familiar. Next up, generators apply this same shape to build values lazily, one at a time.\n\n### Quick recap\n\n- `[expr for item in iterable]` — list comprehension; swap `[ ]` for `{ }` for a set, or `{key: value for ...}` for a dictionary.\n- Add `if condition` at the end to filter which items are included.\n- Prefer a regular loop over a comprehension once it stops being simple to read at a glance.\n- Dict comprehensions can filter and transform an existing dictionary in one line, including inverting keys and values.\n- Multiple `for` clauses in one comprehension act like nested loops — fine for two, usually too dense beyond that.\n- Comprehensions accept any iterable on the right of `for`, not just lists — a generator, a `range()`, or the result of another comprehension all work identically."}, {"id": "7.2", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 2, "slug": "generators-iterators", "fullTitle": "Chapter 7.2: Generators & Iterators", "title": "Generators & Iterators", "md": "### Why this matters\n\nA list comprehension builds its *entire* result in memory before you use any of it. Sometimes that's wasteful — especially for huge or even infinite sequences. Generators produce values one at a time, on demand, without ever holding the whole thing in memory at once.\n\n### The core idea\n\nAn **iterator** is anything you can step through one item at a time with `next()`. A **generator function** — a function using `yield` instead of `return` — is the easiest way to create one: each call to `next()` runs the function until the next `yield`, pauses there, and hands back that value.\n\nIf Chapter 6.8's hand-built `__iter__`/`__next__` class felt like a lot of ceremony for something conceptually simple, that's exactly the gap generators close — a generator function does the *same job*, automatically, in a fraction of the code.\n\n### Examples\n\nA generator function:\n```python\ndef count_up_to(limit):\n    number = 1\n    while number <= limit:\n        yield number     # pause here, hand back 'number', resume on the next request\n        number += 1\n\ncounter = count_up_to(3)\nprint(next(counter))   # 1\nprint(next(counter))   # 2\nprint(next(counter))   # 3\nprint(next(counter))   # raises StopIteration - nothing left\n```\n\nIn practice, you almost always consume a generator with a `for` loop, which handles the `StopIteration` automatically:\n```python\nfor number in count_up_to(5):\n    print(number)\n# 1 2 3 4 5\n```\n\nA **generator expression** — the lazy cousin of a list comprehension, using `( )` instead of `[ ]`:\n```python\nsquares = (n ** 2 for n in range(1_000_000))   # doesn't compute anything yet!\nprint(next(squares))    # 0 - only NOW is the first value actually calculated\nprint(next(squares))    # 1\n```\nCompare this to `[n ** 2 for n in range(1_000_000)]`, which would immediately compute and store all one million values in memory. The generator computes each one only when asked.\n\nWhen a generator expression is the *only* argument to a function, the extra parentheses can be dropped — a small, common idiom:\n```python\ntotal = sum(n ** 2 for n in range(1_000_000))   # no double parentheses needed\nprint(total)   # 333332833333500000\n```\nThis computes the sum lazily, one squared number at a time, without ever building a million-item list just to add it up.\n\nWhy this matters in practice — a generator can represent something *infinite*, which a list never could:\n```python\ndef infinite_counter():\n    number = 1\n    while True:\n        yield number\n        number += 1\n\ncounter = infinite_counter()\nprint(next(counter))   # 1\nprint(next(counter))   # 2\n# ...this could go on forever, and never runs out of memory, because\n# only ONE number is held in memory at a time.\n```\n\nA generator function can filter as it produces values, exactly like a comprehension's `if` clause, but lazily — one at a time, on demand:\n```python\ndef evens_up_to(limit):\n    for n in range(limit):\n        if n % 2 == 0:\n            yield n\n\nfor n in evens_up_to(10):\n    print(n)\n# 0 2 4 6 8\n```\n\nGenerators can also be chained together, each one consuming the previous — a genuinely elegant way to build a small \"pipeline\" of lazy transformations:\n```python\ndef squares(numbers):\n    for n in numbers:\n        yield n ** 2\n\ndef evens(numbers):\n    for n in numbers:\n        if n % 2 == 0:\n            yield n\n\npipeline = evens(squares(range(10)))   # squares first, THEN filters to even results\nprint(list(pipeline))   # [0, 4, 16, 36, 64]\n```\nNothing here computes anything until `list()` actually asks for values — each number flows through `squares` then `evens` one at a time, never building an intermediate list in memory.\n\nWhen a generator function needs to yield every value from another iterable, `yield from` delegates to it directly, instead of writing a manual loop:\n```python\ndef count_up_to(limit):\n    number = 1\n    while number <= limit:\n        yield number\n        number += 1\n\ndef combined():\n    yield from count_up_to(3)     # yields 1, 2, 3\n    yield from [\"a\", \"b\"]           # then yields 'a', 'b'\n\nprint(list(combined()))   # [1, 2, 3, 'a', 'b']\n```\n\n### ⚠️ Common Mistakes\n\n- **Trying to loop over a generator twice.** Once a generator is exhausted (or even partway consumed), it doesn't reset — looping over it again gives you nothing, or picks up from where it left off, not from the start. Create a fresh generator if you need to go through the values again.\n- **Using `return` instead of `yield` inside what's meant to be a generator.** A single `return` (with a value) inside an otherwise `yield`-using function is fine and just ends generation early — but if you meant `yield` and wrote `return`, you'll get one value back directly instead of an iterable series of them.\n- **Assuming a generator expression can be indexed like a list.** `squares[0]` raises a `TypeError` — a generator only supports moving forward with `next()` (or a `for` loop), never random access by position. Convert it with `list(squares)` first if you genuinely need indexing (accepting the memory cost that comes with it).\n- **Writing `yield from` when you meant `return`, or vice versa.** `yield from other_iterable` produces every value from `other_iterable` one at a time, keeping the enclosing function a generator; `return other_iterable` would end the generator immediately, handing back the iterable itself as a single value instead of its contents.\n\n### How this connects\n\nGenerators are the same lazy, memory-conscious spirit behind a lot of Python's own built-ins (`range()` itself doesn't build a giant list — it generates values as needed, which is exactly why looping over `range(1_000_000_000)` doesn't crash your computer).\n\n### Quick recap\n\n- An iterator produces values one at a time via `next()`; a generator function (using `yield`) is the easy way to build one.\n- A generator pauses at each `yield` and resumes from there on the next request — no full result stored in memory.\n- `(expr for item in iterable)` is a generator expression — the lazy version of a list comprehension.\n- A generator can be consumed only once, moving forward — no indexing, no restarting.\n- Drop the extra parentheses when a generator expression is a function's only argument: `sum(n for n in ...)`.\n- `yield from other_iterable` delegates to another iterable, yielding all its values in turn.\n- A generator can `yield` inside a loop with a condition, making it a natural, memory-light way to filter — the same idea as a filtering comprehension, but lazy."}, {"id": "7.3", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 3, "slug": "decorators", "fullTitle": "Chapter 7.3: Decorators", "title": "Decorators", "md": "### Why this matters\n\nSometimes you want to add the *same* extra behavior — logging, timing, access checks — to several different functions, without repeating that logic inside each one. A decorator lets you wrap a function with extra behavior, cleanly, in one reusable place. This is the payoff chapter for everything Chapter 4.6 (Closures) set up.\n\n### The core idea\n\nA **decorator** is a function that takes another function as input, and returns a new function that wraps it with extra behavior — usually calling the original function somewhere inside. The `@decorator_name` syntax right above a function definition is shorthand for handing that function to the decorator.\n\n### Examples\n\nBuilding a decorator from scratch — this is a closure (Chapter 4.6), applied to a genuinely useful purpose:\n```python\ndef announce(func):\n    def wrapper(*args, **kwargs):        # accepts ANY arguments, and passes them through\n        print(f\"Calling {func.__name__}...\")\n        result = func(*args, **kwargs)     # actually run the original function\n        print(f\"{func.__name__} finished.\")\n        return result\n    return wrapper\n\n@announce\ndef add(a, b):\n    return a + b\n\nprint(add(3, 4))\n# Calling add...\n# add finished.\n# 7\n```\n`@announce` above `def add(...)` is exactly equivalent to writing `add = announce(add)` right after defining it — the decorator syntax is just a cleaner way to say that.\n\nA decorator that actually measures something useful — timing:\n```python\nimport time\n\ndef timed(func):\n    def wrapper(*args, **kwargs):\n        start = time.time()\n        result = func(*args, **kwargs)\n        elapsed = time.time() - start\n        print(f\"{func.__name__} took {elapsed:.4f} seconds\")\n        return result\n    return wrapper\n\n@timed\ndef slow_add(a, b):\n    time.sleep(1)\n    return a + b\n\nslow_add(3, 4)   # slow_add took 1.0003 seconds (approximately)\n```\n\nPreserving a decorated function's original name and docstring with `functools.wraps` — without this, `add.__name__` would confusingly become `\"wrapper\"` instead of `\"add\"`:\n```python\nfrom functools import wraps\n\ndef announce(func):\n    @wraps(func)              # copies over func's real __name__, docstring, etc.\n    def wrapper(*args, **kwargs):\n        print(f\"Calling {func.__name__}...\")\n        return func(*args, **kwargs)\n    return wrapper\n\n@announce\ndef add(a, b):\n    \"\"\"Add two numbers.\"\"\"\n    return a + b\n\nprint(add.__name__)   # add - not \"wrapper\", thanks to @wraps\n```\n\nA decorator that needs its *own* configuration — like `@repeat(3)` instead of a bare `@repeat` — needs one more layer of nesting: an outer function that takes the configuration and returns the actual decorator:\n```python\ndef repeat(times):\n    def decorator(func):\n        @wraps(func)\n        def wrapper(*args, **kwargs):\n            result = None\n            for _ in range(times):\n                result = func(*args, **kwargs)\n            return result\n        return wrapper\n    return decorator\n\n@repeat(3)\ndef greet(name):\n    print(f\"Hello, {name}!\")\n\ngreet(\"Ava\")\n# Hello, Ava!\n# Hello, Ava!\n# Hello, Ava!\n```\n`@repeat(3)` first calls `repeat(3)`, which returns `decorator` — *that's* what actually gets applied to `greet`, exactly like the simpler decorators above, just with `times` remembered via a closure.\n\nDecorators can stack, applied bottom to top — the one closest to the function runs first, wrapping it, and each decorator above wraps the *already-wrapped* result:\n```python\n@announce\n@timed\ndef add(a, b):\n    return a + b\n```\nHere, `add` is timed first, and the timed version is then wrapped by `announce` — equivalent to `announce(timed(add))`.\n\nA decorator can also modify a function's *result* on the way back out, not just observe what goes in — genuinely useful for adjusting or validating a return value in one central place:\n```python\ndef uppercase_result(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        result = func(*args, **kwargs)\n        return result.upper()   # transforms the result before handing it back\n    return wrapper\n\n@uppercase_result\ndef get_greeting(name):\n    return f\"hello, {name}\"\n\nprint(get_greeting(\"ava\"))   # HELLO, AVA\n```\n\nA decorator can also prevent the original function from running at all, based on some condition — the basis of real-world access-control and caching decorators:\n```python\ndef require_positive(func):\n    @wraps(func)\n    def wrapper(n):\n        if n < 0:\n            print(\"Refusing to run: negative input.\")\n            return None\n        return func(n)\n    return wrapper\n\n@require_positive\ndef square_root_ish(n):\n    return n ** 0.5\n\nprint(square_root_ish(16))    # 4.0\nprint(square_root_ish(-4))     # Refusing to run: negative input. -> None\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `*args, **kwargs` in the wrapper.** If `wrapper` only accepts specific parameters, the decorator only works on functions with that exact signature — using `*args, **kwargs` (Chapter 4.3) lets one decorator work on *any* function, regardless of its parameters.\n- **Forgetting to `return` the wrapped function's result.** Without `return func(*args, **kwargs)` (returning, not just calling), the decorated function silently always gives back `None`, even if the original function returned something useful.\n- **Skipping `@functools.wraps`.** Without it, tools that inspect a function's name or docstring (including `help()`) see the generic `wrapper` instead of the real function — a small thing, but it trips up debugging and is considered a real best practice to include.\n- **Not recognizing you've already used decorators, several chapters ago.** `@staticmethod`, `@classmethod`, and `@property` (Chapter 6.3), and `@dataclass` (Chapter 6.6), are all decorators too — this chapter just showed you how to build your *own*.\n- **Forgetting the extra layer of nesting a configurable decorator needs.** `@repeat(3)` requires *three* nested functions (the config-taker, the actual decorator, and the wrapper) — missing one level is the most common mistake when first writing this pattern.\n- **Losing track of stacking order.** `@a` `@b` applied to a function means `a(b(func))` — the decorator closest to the function runs \"innermost.\" Reversing the two can silently change behavior (e.g., which one sees the *original* arguments versus the other's modified ones).\n\n### How this connects\n\nDecorators tie together closures (Chapter 4.6), `*args`/`**kwargs` (Chapter 4.3), and everything you've learned about functions as genuinely reusable, composable pieces — this is often considered the moment Python code starts looking \"expert-level,\" and you've now built one from scratch.\n\n### Quick recap\n\n- A decorator is a function that wraps another function with extra behavior.\n- `@decorator_name` above a function is shorthand for `func = decorator_name(func)`.\n- Use `*args, **kwargs` in the wrapper so the decorator works on any function's signature.\n- Use `@functools.wraps(func)` inside your decorator to preserve the original function's name and docstring.\n- A decorator that takes its own arguments (`@repeat(3)`) needs one more layer of nesting: a function that takes the config and returns the actual decorator.\n- Stacked decorators apply bottom-up: `@a` `@b` on a function means `a(b(func))`."}, {"id": "7.4", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 4, "slug": "context-managers-with", "fullTitle": "Chapter 7.4: Context Managers (`with`)", "title": "Context Managers (`with`)", "md": "### Why this matters\n\nYou've already used `with open(...) as file:` since Chapter 5.3, without a full explanation of *why* it's better than manually opening and closing. This chapter explains the mechanism — and shows you it isn't limited to files.\n\n### The core idea\n\nA **context manager** guarantees that setup happens before a block of code runs, and cleanup happens after — *even if an error occurs inside the block*. `with` is how you use one.\n\n### Examples\n\nThe problem `with` solves, shown the manual way:\n```python\nfile = open(\"notes.txt\", \"w\")\nfile.write(\"Hello\")\n# if an error happened on the line above, file.close() below would NEVER run!\nfile.close()\n```\n\nThe same thing, safely, with `with` — cleanup is guaranteed:\n```python\nwith open(\"notes.txt\", \"w\") as file:\n    file.write(\"Hello\")\n# file.close() happens automatically here, even if an error occurred above\n```\n\nOpening multiple files in a single `with` statement:\n```python\nwith open(\"input.txt\", \"r\") as infile, open(\"output.txt\", \"w\") as outfile:\n    for line in infile:\n        outfile.write(line.upper())\n```\n\nWriting your own context manager, using the `contextlib` shortcut (the cleanest way for simple cases):\n```python\nfrom contextlib import contextmanager\nimport time\n\n@contextmanager\ndef timer(label):\n    start = time.time()\n    yield                          # the with-block's code runs at this point\n    elapsed = time.time() - start\n    print(f\"{label}: {elapsed:.4f} seconds\")\n\nwith timer(\"My calculation\"):\n    total = sum(range(1_000_000))\n# My calculation: 0.0123 seconds (approximately)\n```\nEverything before `yield` is the setup; everything after is the cleanup — guaranteed to run *if nothing goes wrong*. If the code inside the `with` block can raise an exception, wrap the `yield` in `try`/`finally` (Chapter 5.2) so the cleanup still happens even then:\n```python\n@contextmanager\ndef timer(label):\n    start = time.time()\n    try:\n        yield\n    finally:                          # runs even if the with-block raises an exception\n        elapsed = time.time() - start\n        print(f\"{label}: {elapsed:.4f} seconds\")\n```\n\nUnderneath `@contextmanager`'s convenience is a class-based protocol you can also implement directly — `__enter__` (setup, its return value becomes the `as` variable) and `__exit__` (cleanup, called even on error). It's the same relationship generators have to hand-built iterator classes (Chapter 6.8): one automatic and concise, one explicit and manual:\n```python\nclass Timer:\n    def __enter__(self):\n        self.start = time.time()\n        return self                        # this becomes the 'as' variable\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        elapsed = time.time() - self.start\n        print(f\"Elapsed: {elapsed:.4f} seconds\")\n        return False                          # False means: don't suppress any exception\n\nwith Timer():\n    total = sum(range(1_000_000))\n```\n`__exit__`'s three parameters describe any exception that occurred inside the block (all `None` if nothing went wrong); returning `False` (or nothing) lets that exception propagate normally, while returning `True` would silently swallow it — almost always not what you want.\n\nA context manager genuinely runs its cleanup even when the code inside the block raises an exception — this is the entire point, worth seeing proven directly rather than just taking on faith:\n```python\nclass Announcer:\n    def __enter__(self):\n        print(\"Entering the block\")\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        print(\"Exiting the block (cleanup always runs)\")\n        return False\n\nwith Announcer():\n    print(\"Inside the block\")\n    raise ValueError(\"Something broke!\")\n```\n```\nEntering the block\nInside the block\nExiting the block (cleanup always runs)\nTraceback (most recent call last):\n  ...\nValueError: Something broke!\n```\nNotice \"Exiting the block\" prints *before* the exception's traceback appears — `__exit__` runs first, then (since it returned `False`) the exception continues propagating upward exactly as if the `with` hadn't been there at all.\n\n### ⚠️ Common Mistakes\n\n- **Manually opening a file (or any resource) without `with`, and forgetting to close it — especially if an error might occur first.** This is exactly the bug `with` exists to eliminate; use it as a firm default habit for files and similar resources.\n- **Writing more than one `yield` inside a `@contextmanager` function.** A context manager built this way is expected to `yield` exactly once — the code before it is setup, the code after is cleanup; multiple yields don't make sense in this pattern and will error.\n- **Assuming `with` only works with files.** It works with anything providing the right setup/cleanup protocol — database connections, locks, and (as shown) your own custom `@contextmanager` functions.\n- **Forgetting `try`/`finally` around `yield` in a `@contextmanager` function.** Without it, an exception inside the `with` block skips straight past your cleanup code entirely — the whole point of a context manager is guaranteed cleanup, so this gap defeats it.\n- **Returning `True` from `__exit__` without meaning to.** This silently swallows any exception that occurred in the `with` block — usually the wrong choice, since it can hide real bugs. Return `False` (or nothing) unless you specifically intend to suppress errors.\n\n### How this connects\n\nYou've now seen the full explanation behind a pattern you've already been using safely since Chapter 5.3 — and you can build your own whenever you have a \"do setup, run some code, guarantee cleanup\" shape to your problem.\n\n### Quick recap\n\n- `with resource() as name:` guarantees cleanup runs after the block, even on error.\n- Multiple resources can be opened in one `with` statement, comma-separated.\n- `@contextmanager` (from `contextlib`) with a single `yield` is the easiest way to write your own — wrap the `yield` in `try`/`finally` if the block might raise.\n- The underlying class-based protocol is `__enter__` (setup) and `__exit__` (cleanup, called even on error); returning `True` from `__exit__` suppresses the exception."}, {"id": "7.5", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 5, "slug": "type-hints-writing-self-documenting-code", "fullTitle": "Chapter 7.5: Type Hints: Writing Self-Documenting Code", "title": "Type Hints: Writing Self-Documenting Code", "md": "### Why this matters\n\nPython never *requires* you to say what type a variable or function parameter is — but modern, professional Python code very commonly does anyway, because it makes code dramatically easier to understand (and lets editors catch mistakes before you even run anything).\n\n### The core idea\n\nA **type hint** is an annotation noting what type a variable, parameter, or return value is expected to be. Python does **not enforce** these at runtime by default — they're documentation and tooling support, not a strict rule the interpreter checks for you.\n\n### Examples\n\nBasic type hints on a function:\n```python\ndef greet(name: str) -> str:\n    return f\"Hello, {name}!\"\n\nprint(greet(\"Ava\"))   # Hello, Ava! - works exactly as before\n```\nThe `name: str` says \"expects a string\"; the `-> str` says \"returns a string.\" Nothing stops you from calling `greet(42)` anyway — Python doesn't check this at runtime — but your editor will likely flag it, and anyone reading the function immediately understands its intent.\n\nHints on variables directly:\n```python\nage: int = 29\nname: str = \"Ava\"\nis_active: bool = True\n```\n\nHints for collections, showing what they contain:\n```python\nfrom typing import List, Dict\n\ndef average(numbers: List[float]) -> float:\n    return sum(numbers) / len(numbers)\n\nscores: Dict[str, int] = {\"Ava\": 95, \"Ben\": 87}\n```\n(In modern Python, you can also write this more simply as `list[float]` and `dict[str, int]`, without importing from `typing` — both styles are common in real code.)\n\nHinting that a value might be `None`, using `Optional`:\n```python\nfrom typing import Optional\n\ndef find_user(user_id: int) -> Optional[str]:\n    users = {1: \"Ava\", 2: \"Ben\"}\n    return users.get(user_id)   # returns a str, or None if not found\n\nprint(find_user(1))   # Ava\nprint(find_user(99))   # None\n```\n\nA function that only performs an action, with nothing meaningful to hand back, is hinted as returning `-> None` — worth writing explicitly rather than leaving it off, since it documents \"this function's job is a side effect, not a value\":\n```python\ndef log_message(message: str) -> None:\n    print(f\"[LOG] {message}\")\n```\n\nType hints work on classes too, and are especially useful on `__init__` — exactly the same annotation style you already know from `@dataclass` (Chapter 6.6), just written by hand:\n```python\nclass Point:\n    def __init__(self, x: int, y: int) -> None:\n        self.x = x\n        self.y = y\n\n    def distance_from_origin(self) -> float:\n        return (self.x ** 2 + self.y ** 2) ** 0.5\n```\n\nYou can hint that a variable might be one of *several* specific literal values, rather than just a general type, using `Literal` — useful for something like a status field that should only ever be one of a small, known set of strings:\n```python\nfrom typing import Literal\n\ndef set_status(status: Literal[\"pending\", \"active\", \"closed\"]) -> None:\n    print(f\"Status set to: {status}\")\n\nset_status(\"active\")     # fine, matches the allowed values\nset_status(\"unknown\")      # your editor/type checker would flag this - \"unknown\" isn't allowed\n```\nThis is a lighter-weight alternative to a full `Enum` (Chapter 6.7) — reach for `Literal` when you just need to *hint* the allowed values for tooling's sake; reach for `Enum` when you want the values to be real, safe, first-class objects your code actually uses at runtime.\n\nOne honest clarification on \"who actually checks these\": your *editor* uses type hints to flag likely mistakes live as you type, but that's a courtesy, not enforcement. A dedicated tool called a **static type checker** (the most common one is called `mypy`, run separately from your program) is what actually scans your whole codebase for type mismatches before you ever run it — genuinely worth knowing exists, even though setting one up is beyond this book's scope.\n\nRecall Chapter 6.6's dataclasses — this is exactly what those type-annotated fields were:\n```python\nfrom dataclasses import dataclass\n\n@dataclass\nclass Point:\n    x: int\n    y: int\n```\n\n### ⚠️ Common Mistakes\n\n- **Believing type hints are enforced.** They are not, by default — `def greet(name: str)` still happily accepts `greet(42)` with no error. Hints are for humans and tools (editors, linters), not a runtime guarantee.\n- **Over-annotating every single local variable.** Hints are most valuable on function signatures (parameters and return types) — that's where they communicate the most, to the most people. Annotating every small local variable inside a function is usually unnecessary noise.\n- **Forgetting `Optional[str]` means \"a string, or `None`\" — not \"an optional parameter.\"** These are unrelated ideas: whether a parameter has a default value (Chapter 4.3) is separate from whether its type hint includes `None` as a possibility.\n- **Assuming your editor's warnings are the full story.** An editor's live hints are a convenience layer, not a real type check — a dedicated tool like `mypy` is what actually verifies type correctness across an entire project.\n\n### How this connects\n\nYou've now seen type hints in isolation — but you actually met them already, structurally, inside `@dataclass` (Chapter 6.6), which relies on annotations to know what fields to generate.\n\n### Quick recap\n\n- `param: type` and `-> type` annotate a function's parameters and return value.\n- Type hints are documentation and tooling support only — Python does not enforce them at runtime.\n- `list[str]`, `dict[str, int]`, and `Optional[str]` (meaning \"this type, or `None`\") are common hint shapes.\n- Most valuable on function signatures; don't feel obligated to annotate every local variable.\n- `-> None` documents a function whose job is a side effect, not a return value.\n- Static type checkers like `mypy` are what actually verify hints across a project — your editor's live warnings are a convenience, not the real check."}, {"id": "7.6", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 6, "slug": "pythonic-style-pep-8-the-walrus-operator-the-zen-of-python", "fullTitle": "Chapter 7.6: Pythonic Style: PEP 8, the Walrus Operator & the Zen of Python", "title": "Pythonic Style: PEP 8, the Walrus Operator & the Zen of Python", "md": "### Why this matters\n\nCode that *runs* correctly and code that reads as genuinely *idiomatic* Python are two different bars to clear. This chapter is about the second one — the conventions and small syntax choices that mark code as written by someone comfortable in the language, not just someone who got it to work.\n\n### The core idea\n\n**PEP 8** is Python's official style guide — a set of widely-followed conventions for naming, spacing, and layout. The **walrus operator** (`:=`) is a compact way to assign a value *and* use it in the same expression. The **Zen of Python** is a short, half-tongue-in-cheek set of guiding principles built right into the language itself.\n\n### Examples\n\nCore PEP 8 conventions you've actually been reading in every example in this book:\n```python\n# snake_case for variables and functions (you've seen this since Chapter 1.4)\nfirst_name = \"Ava\"\ndef calculate_total(): pass\n\n# CapWords (PascalCase) for class names (you've seen this since Chapter 6.1)\nclass BankAccount: pass\n\n# ALL_CAPS for constants (Chapter 1.4)\nMAX_ATTEMPTS = 3\n\n# 4 spaces per indentation level (every code block in this entire book)\n# 2 blank lines between top-level function/class definitions\n# spaces around operators: x = 1 + 2, not x=1+2\n# lines kept to roughly 79-99 characters, so code stays readable side-by-side\n```\n\nA few more conventions worth having on hand, all things you've actually been reading throughout this book without them being named explicitly: no space immediately inside parentheses/brackets, and a space after (not before) a comma:\n```python\n# Good - matches PEP 8:\ndef process(items):\n    total = sum(items)\n    return total / len(items)\n\n# Discouraged - space right inside brackets, no space after the comma, inconsistent operator spacing:\ndef process( items ):\n    total=sum(items)\n    return total/len( items )\n```\nNeither version is a syntax error — PEP 8 is convention, not enforced grammar — but the first is what experienced Python code actually looks like, and consistency here is part of what makes someone else's Python code feel instantly familiar rather than foreign, even in a file you've never seen before.\n\nThe **walrus operator** (`:=`) — assign inside an expression, avoiding a separate line or a repeated call:\n```python\n# Without walrus - input() gets called, checked, then you still need it again:\nuser_input = input(\"Enter something: \")\nif user_input:\n    print(f\"You entered: {user_input}\")\n\n# With walrus - assign AND check in the same line:\nif (user_input := input(\"Enter something: \")):\n    print(f\"You entered: {user_input}\")\n```\n\nA more common, genuinely useful walrus example — avoiding calling a function twice:\n```python\ndata = [1, 2, 3, 4, 5]\n\n# Without walrus - len(data) computed, then referenced again separately:\nn = len(data)\nif n > 3:\n    print(f\"{n} items - that's a lot!\")\n\n# With walrus - inline, one line, no separate variable needed beforehand:\nif (n := len(data)) > 3:\n    print(f\"{n} items - that's a lot!\")\n```\n\nThe walrus operator also shines inside a list comprehension (Chapter 7.1), when the filter condition and the kept value are the *same* expensive computation — without it, you'd have to compute that value twice, once to check it and once to keep it:\n```python\nvalues = [\"12\", \"abc\", \"45\", \"\", \"7\"]\n\n# Without walrus - int(v) would need to be called again to actually keep the number:\nnumbers = [int(v) for v in values if v.isdigit()]\n\n# With walrus - genuinely useful once the \"check\" and the \"kept value\" differ:\nresults = [doubled for v in values if v.isdigit() and (doubled := int(v) * 2) > 10]\nprint(results)   # [24, 90, 14]\n```\n\nThe **Zen of Python** — type this into any Python REPL, it's a real, built-in Easter egg:\n```python\nimport this\n```\nIt prints a short poem of guiding principles — lines like *\"Simple is better than complex,\"* *\"Readability counts,\"* and *\"There should be one — and preferably only one — obvious way to do it.\"* It's genuinely worth reading once; a surprising amount of \"why does Python do it that way\" traces back to this exact philosophy.\n\n### ⚠️ Common Mistakes\n\n- **Inconsistent naming conventions within the same codebase.** Mixing `myVariable` (camelCase, common in other languages) with `snake_case` in the same Python file reads as a signal you're new to the language's conventions — pick `snake_case` for variables/functions and stick with it.\n- **Overusing the walrus operator until it hurts readability.** It shines for exactly the \"assign and immediately check\" pattern shown above — cramming multiple walrus assignments into one dense line defeats its own purpose.\n- **Reaching for a walrus in a comprehension when the value being filtered and the value being kept are already the same.** The simpler `[int(v) for v in values if v.isdigit()]` doesn't need a walrus at all — save it for when you'd otherwise repeat an actual computation.\n- **Treating the Zen of Python's principles too literally or too rigidly.** It's guidance and philosophy, genuinely useful for breaking ties between two reasonable approaches — not a rulebook to recite; use it as a way of thinking, not a checklist.\n\n### How this connects\n\nYou've now covered the core of \"Style & Voice\" — comprehensions, generators, decorators, context managers, type hints, and Pythonic convention. A few more genuinely useful modern tools (`functools`, deeper type hints, performance intuition, and a taste of concurrency) round out this Part before Part VIII shifts from *writing* code to the equally important craft of *fixing and verifying* it.\n\n### Quick recap\n\n- PEP 8: `snake_case` for variables/functions, `CapWords` for classes, `ALL_CAPS` for constants, 4-space indentation, lines kept reasonably short.\n- The walrus operator `:=` assigns and uses a value in the same expression — great for avoiding a repeated call, an extra line, or a duplicated computation inside a comprehension's filter.\n- `import this` prints the Zen of Python — genuinely worth reading once as a guide to Python's design philosophy."}, {"id": "7.7", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 7, "slug": "functools-handy-function-tools", "fullTitle": "Chapter 7.7: `functools`: Handy Function Tools", "title": "`functools`: Handy Function Tools", "md": "### Why this matters\n\nYou already met one `functools` tool — `wraps`, back in Chapter 7.3. The rest of the module is built on the same idea this whole Part has been building toward: functions are values you can combine, customize, and optimize, not just call. Three more tools from it solve genuinely common problems with almost no code.\n\n### The core idea\n\n`functools.reduce` combines a sequence into a single value by repeatedly applying a function; `functools.partial` creates a new function with some arguments already filled in; `functools.lru_cache` automatically remembers a function's past results, so it never recomputes the same answer twice.\n\n### Examples\n\n`reduce(function, iterable)` applies `function` to pairs of items, cumulatively, until only one value remains — it's the general-purpose tool behind specific ones like `sum()`:\n```python\nfrom functools import reduce\n\nnumbers = [1, 2, 3, 4]\n\ntotal = reduce(lambda a, b: a + b, numbers)\nprint(total)   # 10 - same as sum(numbers), just more general\n\nproduct = reduce(lambda a, b: a * b, numbers)\nprint(product)    # 24 - there's no built-in \"product()\", so reduce earns its keep here\n```\nTracing through `product`: it computes `1*2=2`, then `2*3=6`, then `6*4=24` — each step combining the running result with the next item.\n\n`partial(function, *args, **kwargs)` locks in some arguments ahead of time, producing a new, ready-to-use function:\n```python\nfrom functools import partial\n\ndef power(base, exponent):\n    return base ** exponent\n\nsquare = partial(power, exponent=2)   # exponent is now always 2\ncube = partial(power, exponent=3)       # exponent is now always 3\n\nprint(square(5))   # 25\nprint(cube(5))       # 125\n```\nThis is especially handy when passing a function somewhere that expects a specific number of arguments (like a callback), but your function naturally needs more.\n\n`lru_cache` remembers a function's previous results, keyed by its arguments — call it again with the same arguments, and it returns the cached answer instantly instead of recomputing. This is the actual fix for the exact inefficiency flagged back in Chapter 4.5's recursive Fibonacci:\n```python\nfrom functools import lru_cache\n\n@lru_cache\ndef fibonacci(n):\n    if n <= 1:\n        return n\n    return fibonacci(n - 1) + fibonacci(n - 2)\n\nprint(fibonacci(35))   # returns almost instantly, unlike the uncached version\n```\nWithout `lru_cache`, `fibonacci(35)` recomputes the same smaller values millions of times over. With it, each unique call is computed exactly once and reused for every repeat — a one-line decorator turning an exponential slowdown into a fast, practical function.\n\n`lru_cache` accepts a `maxsize` argument, controlling how many distinct results it remembers at once — the default is 128, and once that limit is reached, the *least recently used* entry is discarded to make room for a new one (hence the name: Least Recently Used cache):\n```python\n@lru_cache(maxsize=2)\ndef double(n):\n    print(f\"Computing double({n})\")\n    return n * 2\n\nprint(double(1))   # Computing double(1) -> 2\nprint(double(2))   # Computing double(2) -> 4\nprint(double(1))   # cached - no \"Computing\" printed, returns 2 instantly (this ALSO refreshes 1's recency)\nprint(double(3))   # Computing double(3) -> 6 -- cache full (maxsize=2); 2 is now the LEAST recently\n                      # used (1 was just touched again above), so 2 gets evicted, not 1\nprint(double(2))   # Computing double(2) again -> 4 -- had to recompute, it was the one evicted\n```\nThe key detail that makes this genuinely \"least recently used\" rather than just \"oldest\": re-accessing `double(1)` on the third line counted as a fresh use, which is exactly why `2` — not `1` — turned out to be the one discarded once the cache hit its limit.\n\n`functools.partial` combines naturally with `map()` (Chapter 4.7) — pre-filling one argument, then applying the resulting function across a whole sequence:\n```python\nfrom functools import partial\n\ndef power(base, exponent):\n    return base ** exponent\n\nsquare = partial(power, exponent=2)\nprint(list(map(square, [1, 2, 3, 4])))   # [1, 4, 9, 16]\n```\n\n### ⚠️ Common Mistakes\n\n- **Using `reduce` when a built-in already does the job.** `reduce(lambda a, b: a + b, numbers)` works, but `sum(numbers)` is clearer and exists for exactly this reason — reach for `reduce` when there genuinely isn't a more specific built-in (like the `product` example above).\n- **Forgetting `reduce` errors on an empty sequence with no initial value.** `reduce(lambda a, b: a + b, [])` raises `TypeError: reduce() of empty iterable with no initial value` — pass a third argument (`reduce(func, iterable, 0)`) as a starting value to handle this safely.\n- **Trying to `lru_cache` a function whose arguments aren't hashable.** Since results are cached by argument value, an argument like a list (unhashable, Chapter 2.6) raises a `TypeError` — `lru_cache` only works when every argument is something like a number, string, or tuple.\n- **Expecting `lru_cache` to notice a function's behavior has changed.** The cache only keys off the arguments — if the function relies on something *outside* its arguments that changes over time (like reading a file), a cached result can become stale without any warning.\n\n### How this connects\n\nThese tools build directly on functions-as-values (Chapter 4.1), closures and decorators (Chapters 4.6–7.3), and recursion (Chapter 4.5) — `lru_cache` in particular is the cleanest possible demonstration of why understanding recursion's cost actually mattered.\n\n### Quick recap\n\n- `reduce(function, iterable, [initial])` combines a sequence into one value, cumulatively — pass an initial value to handle an empty iterable safely.\n- `partial(function, *args, **kwargs)` pre-fills some arguments, producing a new, ready-to-use function.\n- `@lru_cache` memoizes a function's results, keyed by its (hashable) arguments — a one-line fix for expensive repeated calls, including naive recursion.\n- `lru_cache` only works when every argument is hashable, and assumes the function's result depends only on its arguments."}, {"id": "7.8", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 8, "slug": "advanced-type-hints", "fullTitle": "Chapter 7.8: Advanced Type Hints (`Union`, `TypedDict`, generics)", "title": "Advanced Type Hints (`Union`, `TypedDict`, generics)", "md": "### Why this matters\n\nChapter 7.5 covered the everyday type hints — a parameter that's always a `str`, a function that always returns an `int`. Real code often needs to express something a little richer: \"this could be one of a few types,\" \"this dictionary has a specific, known shape,\" or \"this function works on any type, but always returns *that same* type.\" This chapter covers those three, still just for recognition and everyday use — a full academic treatment of Python's type system is well beyond what \"master the core language\" requires.\n\n### The core idea\n\n`Union` (or the modern `|` syntax) expresses \"this type, or that type.\" `TypedDict` describes a dictionary with specific, known keys and value types, rather than an arbitrary open-ended one. A **generic** function or class is written to work with any type, while still keeping track of *which* type, for a specific use.\n\n### Examples\n\n`Union` — a value that could be more than one type. Modern Python lets you write this with a plain `|`, without importing anything:\n```python\ndef format_id(value: int | str) -> str:\n    return f\"ID-{value}\"\n\nprint(format_id(42))      # ID-42\nprint(format_id(\"A7\"))     # ID-A7\n```\nThe older, still-common style imports `Union` explicitly and means exactly the same thing:\n```python\nfrom typing import Union\n\ndef format_id(value: Union[int, str]) -> str:\n    return f\"ID-{value}\"\n```\nRecall `Optional[str]` from Chapter 7.5 — it was actually just shorthand for `Union[str, None]` all along (or, in modern syntax, `str | None`).\n\n`TypedDict` — for a dictionary whose keys and value types are known and fixed, rather than the completely open-ended `dict[str, int]` shape:\n```python\nfrom typing import TypedDict\n\nclass Movie(TypedDict):\n    title: str\n    year: int\n    rating: float\n\ndef describe(movie: Movie) -> str:\n    return f\"{movie['title']} ({movie['year']}) - {movie['rating']}/10\"\n\ngood_movie: Movie = {\"title\": \"Arrival\", \"year\": 2016, \"rating\": 8.0}\nprint(describe(good_movie))   # Arrival (2016) - 8.0/10\n```\nNotice `Movie` still behaves like a completely normal dictionary at runtime (`movie[\"title\"]`, not `movie.title`) — `TypedDict` only adds *hinting*, the same \"documentation and tooling, not enforcement\" rule from Chapter 7.5 still applies. If you actually want attribute-style access (`movie.title`) and real runtime behavior, a `@dataclass` (Chapter 6.6) is very likely the better fit — reach for `TypedDict` specifically when you're stuck describing a plain dictionary's shape (e.g., matching JSON data from Chapter 5.4).\n\nA **generic** function, using `TypeVar`, is written once to work with *any* type, while still promising that its input and output are the *same* type as each other:\n```python\nfrom typing import TypeVar\n\nT = TypeVar(\"T\")\n\ndef first_item(items: list[T]) -> T:\n    return items[0]\n\nprint(first_item([1, 2, 3]))          # 1 - T was int this time\nprint(first_item([\"a\", \"b\", \"c\"]))     # a - T was str this time\n```\n`first_item` genuinely works on a list of any type — the point of `TypeVar` is telling a type checker \"whatever type goes in, that same type comes out,\" which a plain `list` hint couldn't express.\n\nGenerics extend naturally to your own classes too, not just functions — a class can be written to hold \"a list of *some* type,\" while staying precise about which type any particular instance actually holds:\n```python\nfrom typing import Generic, TypeVar\n\nT = TypeVar(\"T\")\n\nclass Box(Generic[T]):\n    def __init__(self, item: T) -> None:\n        self.item = item\n\n    def get(self) -> T:\n        return self.item\n\nint_box: Box[int] = Box(42)\nstr_box: Box[str] = Box(\"hello\")\nprint(int_box.get())   # 42\nprint(str_box.get())     # hello\n```\nA type checker looking at `int_box` knows `.get()` returns an `int` specifically, and `str_box`'s returns a `str` — even though `Box` itself was written once, generically, without hardcoding either type.\n\n### ⚠️ Common Mistakes\n\n- **Writing `int | str` on a Python version that doesn't support it.** The bar `|` syntax for unions needs Python 3.10 or newer; on older versions, `Union[int, str]` (imported from `typing`) is the only option.\n- **Reaching for `TypedDict` for data that should really be a class with its own methods.** `TypedDict` describes a *plain dictionary's* shape — nothing more. If the data needs behavior (methods) attached to it, a `@dataclass` (Chapter 6.6) is almost always the better tool.\n- **Expecting `TypedDict` to validate anything at runtime.** Just like every other type hint, it's purely for tooling — `good_movie: Movie = {\"title\": 5}` (with a wrong type, and missing keys) runs without complaint; nothing actually checks it unless a static type checker does.\n- **Forgetting to import `TypeVar` and instantiate it before using it.** `T = TypeVar(\"T\")` has to exist before it's referenced in a hint — it's a real object, not just a placeholder name.\n\n### How this connects\n\nThis rounds out the type-hint toolkit from Chapter 7.5 with the shapes you'll actually run into once you start reading real, larger Python codebases — Union types, structured dictionaries, and generic, reusable functions.\n\n### Quick recap\n\n- `int | str` (3.10+) or `Union[int, str]` means \"this type, or that type\"; `Optional[X]` is shorthand for `X | None`.\n- `TypedDict` describes a plain dictionary's expected keys and value types — still just a regular dict at runtime, with zero enforcement.\n- A generic function using `TypeVar` promises a relationship between its input and output types, without committing to one specific type.\n- None of this is enforced by Python itself — it's all for editors and static type checkers, same as Chapter 7.5's basics."}, {"id": "7.9", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 9, "slug": "performance-intuition", "fullTitle": "Chapter 7.9: Performance Intuition (Big-O basics, `timeit`, why data-structure choice matters)", "title": "Performance Intuition (Big-O basics, `timeit`, why data-structure choice matters)", "md": "### Why this matters\n\nYou've already met two real examples of this lesson without a name attached: Chapter 2.5 mentioned sets have \"very fast\" membership tests, and Chapter 4.5 showed naive recursive Fibonacci getting noticeably slow. This chapter gives you the actual vocabulary and mental model for *why* — and a way to check your intuition against reality, rather than guessing.\n\n### The core idea\n\n**Big-O notation** describes how an algorithm's running time grows as its input grows — not the exact speed (that depends on your specific computer), but the *shape* of the growth curve. The `timeit` module lets you actually measure real code, rather than relying on a guess.\n\n### Examples\n\nThe three shapes you'll encounter constantly:\n\n**O(1) — constant time.** The cost doesn't grow with the size of the data at all. Looking something up by key in a dictionary, or by position in a list, takes roughly the same time whether there are 10 items or 10 million:\n```python\ndata = {\"a\": 1, \"b\": 2, \"c\": 3}\nvalue = data[\"b\"]   # O(1) - same cost regardless of how many keys exist\n```\n\n**O(n) — linear time.** The cost grows in direct proportion to the size of the data. Checking `in` on a *list*, or looping through every item once, are both O(n) — twice the data means roughly twice the work:\n```python\nnumbers = [1, 2, 3, 4, 5]\nprint(3 in numbers)   # O(n) - Python may have to check every item\n```\n\n**O(n²) — quadratic time.** The cost grows with the *square* of the data size — usually from comparing every item against every other item, like a nested loop over the same collection:\n```python\nnumbers = [1, 2, 3, 4]\nfor a in numbers:\n    for b in numbers:\n        if a != b:\n            pass   # O(n²) - a nested loop over the same data, 16 comparisons for 4 items\n```\n\nHere's the concrete payoff, measured for real with `timeit` rather than guessed at — comparing `in` on a list versus a set of the same 10,000 numbers, checking membership 10,000 times each:\n```python\nimport timeit\n\nlist_time = timeit.timeit(\"9999 in numbers\", setup=\"numbers = list(range(10000))\", number=10000)\nset_time = timeit.timeit(\"9999 in numbers\", setup=\"numbers = set(range(10000))\", number=10000)\n\nprint(f\"list: {list_time:.4f}s\")\nprint(f\"set:  {set_time:.4f}s\")\n```\nOn one run of this exact code: the list version took **0.3379 seconds**; the set version took **0.0001 seconds** — the set was roughly **3,000 times faster**. Your exact numbers will differ by machine, but the *pattern* won't: a list's `in` check is O(n) (Python may have to look at every item), while a set's is O(1) (built on the same hashing mechanism as a dictionary's keys) — and that gap widens dramatically as the data grows.\n\nThe same real-measurement approach applied to Chapter 4.5's Fibonacci and Chapter 7.7's `lru_cache` fix: computing `fibonacci(30)` the naive way took **0.0469 seconds** on one run; the `@lru_cache`-decorated version took **0.000007 seconds** — not a small improvement, but the difference between an algorithm that's exponential (roughly O(2ⁿ)) and one that's linear (O(n)), for the exact same result.\n\nOne more real, measured comparison, tying back to Chapter 7.1's comprehensions: building a list with a comprehension versus growing one with repeated `.append()` calls in a loop turn out to perform almost identically in modern Python — a useful thing to actually know, rather than assume, since \"comprehensions are faster\" is a claim thrown around more confidently than the evidence always supports:\n```python\nimport timeit\n\nloop_time = timeit.timeit(\n    \"result = []\\nfor n in range(1000): result.append(n * 2)\",\n    number=10000\n)\ncomprehension_time = timeit.timeit(\n    \"result = [n * 2 for n in range(1000)]\",\n    number=10000\n)\nprint(f\"loop:          {loop_time:.4f}s\")\nprint(f\"comprehension: {comprehension_time:.4f}s\")\n```\nOn one run: the loop took **0.1674 seconds**, the comprehension took **0.1416 seconds** — the comprehension is modestly faster here (about 1.18x), mainly because it avoids repeatedly looking up and calling `.append()` as a separate operation, but it's genuinely nowhere near the difference an actual algorithmic change (like `lru_cache` above, at roughly 6,700x) makes. The honest takeaway: prefer comprehensions where they read *more* clearly (Chapter 7.1's own advice), and treat any performance gain as a welcome bonus, not the primary reason to reach for one — the real lesson of this whole chapter is to *measure* rather than assume, and here, measuring shows the difference is real but modest.\n\n### ⚠️ Common Mistakes\n\n- **Assuming code that \"feels fast\" on small test data will scale.** A quadratic (O(n²)) approach can feel instant on 10 items and take minutes on 100,000 — the whole point of Big-O is reasoning about growth, not just today's test case.\n- **Guessing at performance instead of measuring it.** Intuition about what's \"obviously slow\" is frequently wrong, especially in a language with as many built-in optimizations as Python — `timeit` gives you a real answer instead of a guess.\n- **Over-optimizing code that doesn't need it.** Big-O thinking matters most for code handling genuinely large data, or running extremely often. Rewriting a loop that runs three times a day, over ten items, for a theoretical performance gain is effort spent in the wrong place.\n- **Forgetting that Big-O describes *growth*, not absolute speed.** An O(n²) algorithm can still be faster than an O(n) one for small enough input — Big-O tells you which one wins as the data gets large, not which one wins right now, on this specific size.\n\n### How this connects\n\nThis is the \"why\" behind two things you'd already taken on faith — sets being fast (Chapter 2.5) and naive recursion being slow (Chapter 4.5) — plus a real tool (`timeit`) for checking your own code's performance instead of guessing.\n\n### Quick recap\n\n- **O(1)** constant, **O(n)** linear, **O(n²)** quadratic — the three growth shapes you'll run into most often.\n- Dictionary/set lookups are O(1); list membership (`in`) and simple loops are O(n); nested loops over the same data are typically O(n²).\n- `timeit.timeit(stmt, setup=..., number=...)` measures real code, rather than relying on intuition.\n- Big-O describes how cost *grows* with input size — not which approach is fastest for small inputs today."}, {"id": "7.10", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 10, "slug": "a-taste-of-concurrency", "fullTitle": "Chapter 7.10: A Taste of Concurrency (`threading` & `asyncio` fundamentals)", "title": "A Taste of Concurrency (`threading` & `asyncio` fundamentals)", "md": "### Why this matters\n\nSome programs spend most of their time *waiting* — for a file to load, a network response to arrive, a timer to finish — rather than actually computing. Running several such waits at once, instead of one strictly after another, can make a real difference. This chapter is deliberately just a taste: enough to recognize `threading` and `asyncio` when you see them, and understand what problem each solves, not a deep dive into either.\n\n### The core idea\n\n`threading` lets multiple pieces of code run *interleaved*, taking turns, useful for tasks that spend most of their time waiting. `asyncio` (using `async`/`await`) does something similar, but through a single-threaded, cooperative model where a task explicitly says \"I'm waiting now, let something else run.\" Both exist mainly to help with **I/O-bound** waiting — neither one, on its own, makes CPU-heavy computation run in true parallel, because of something specific to Python called the **GIL**.\n\n### Examples\n\nA basic thread — running a function \"in the background\" while the main program continues:\n```python\nimport threading\nimport time\n\ndef wait_and_announce(name, seconds):\n    time.sleep(seconds)   # simulates waiting on something slow, like a network call\n    print(f\"{name} finished after {seconds}s\")\n\nthread_a = threading.Thread(target=wait_and_announce, args=(\"Task A\", 2))\nthread_b = threading.Thread(target=wait_and_announce, args=(\"Task B\", 1))\n\nthread_a.start()\nthread_b.start()\nthread_a.join()   # wait for thread_a to actually finish before continuing\nthread_b.join()\nprint(\"Both done.\")\n```\nBoth `wait_and_announce` calls run *at the same time* — the total wait is about 2 seconds (the longer of the two), not 3 (their sum), because they overlap instead of running one after the other.\n\n`asyncio` solves a similar problem, but with explicit `async`/`await` syntax instead of separate threads:\n```python\nimport asyncio\n\nasync def wait_and_announce(name, seconds):\n    await asyncio.sleep(seconds)   # \"pause here, let something else run in the meantime\"\n    print(f\"{name} finished after {seconds}s\")\n\nasync def main():\n    await asyncio.gather(\n        wait_and_announce(\"Task A\", 2),\n        wait_and_announce(\"Task B\", 1),\n    )\n    print(\"Both done.\")\n\nasyncio.run(main())\n```\n`asyncio.gather()` runs both calls concurrently, exactly like the threading version — again finishing in about 2 seconds, not 3. `async def` marks a function as a **coroutine** — calling it doesn't run it immediately, only `await`ing it (or scheduling it through something like `gather`) actually does.\n\nWorth understanding by name, even without the deep mechanics: CPython (the standard Python interpreter you've been using all book) has a **Global Interpreter Lock (GIL)** — a rule that only one thread executes Python code at a time, ever, no matter how many threads you create. This means `threading` genuinely helps for I/O-bound waiting (a thread that's asleep, waiting on a network response, isn't holding up the others), but it does **not** give true parallelism for CPU-heavy computation — running four threads that each crunch numbers won't run four times faster on a multi-core machine, because of exactly this lock. Real CPU-bound parallelism needs a different tool (`multiprocessing`, running separate processes instead of threads), which is beyond this book's scope.\n\nSeeing the `time.sleep()` mistake proven directly — using it by accident inside an `async` function quietly defeats the entire point of `asyncio.gather()`:\n```python\nimport asyncio, time\n\nasync def wait_wrong(name, seconds):\n    time.sleep(seconds)   # WRONG - blocks everything, not just this coroutine\n    print(f\"{name} finished after {seconds}s\")\n\nasync def main():\n    start = time.time()\n    await asyncio.gather(wait_wrong(\"Task A\", 2), wait_wrong(\"Task B\", 1))\n    print(f\"Total: {time.time() - start:.2f}s\")\n\nasyncio.run(main())\n```\nRunning this gives **`Total: 3.00s`** — the full sum of both sleeps, not the ~2.00s \"overlapping\" result from the correct version earlier in this chapter. `time.sleep()` blocked the entire event loop each time, so the two coroutines ran one after another instead of concurrently, exactly as the mistake predicts.\n\n### ⚠️ Common Mistakes\n\n- **Calling an `async def` function without `await`ing it.** `wait_and_announce(\"Task A\", 2)` alone just creates a coroutine *object* — it doesn't actually run anything, and Python will warn you: `RuntimeWarning: coroutine 'wait_and_announce' was never awaited`.\n- **Expecting `threading` to speed up CPU-heavy computation.** Because of the GIL, threads take turns running Python code — they don't run truly simultaneously on separate cores. Threading helps with *waiting*, not with *computing faster*.\n- **Forgetting `asyncio.run()` is the entry point.** You can't just call an `async def` function directly at the top level of a script and expect it to run — `asyncio.run(main())` is what actually starts the event loop and executes it.\n- **Mixing up `threading.Thread.start()` and `.join()`.** `.start()` kicks a thread off running; `.join()` blocks until it's actually finished. Forgetting `.join()` means your main program might finish (and the interpreter might exit) before a background thread's work is done.\n- **Assuming `asyncio.sleep()` and `time.sleep()` are interchangeable.** They look similar, but `time.sleep()` blocks the *entire* program, including any other coroutines waiting to run — inside `async def` code, always use `await asyncio.sleep()` instead, which pauses only the current coroutine and lets others proceed.\n\n### How this connects\n\nThis is intentionally a light introduction — recognizing `threading` and `asyncio`, understanding what the GIL means for Python specifically, and knowing which tool addresses which kind of waiting, rounds out your picture of the language without turning into a deep specialization this book was never meant to cover.\n\n### Quick recap\n\n- `threading` and `asyncio` both help with I/O-bound waiting, running multiple waits concurrently instead of strictly one after another.\n- `async def` defines a coroutine; calling it alone does nothing — it must be `await`ed (or scheduled via `asyncio.gather()`), and started via `asyncio.run()`.\n- The GIL means only one thread runs Python code at a time — `threading` helps with waiting, not with true CPU-bound parallelism.\n- True parallel computation needs `multiprocessing` (separate processes), a topic beyond this book's scope."}, {"id": "7.11", "partNum": 7, "partTitle": "Part VII — Style & Voice", "partMetaphor": "writing it well, not just correctly", "chapNum": 11, "slug": "contextlib-and-generator-context-managers", "fullTitle": "Chapter 7.11: `contextlib` & Generator Context Managers", "title": "`contextlib` & Generator Context Managers", "md": "### Why this matters\n\nIn Chapter 7.4, you learned how to create custom context managers by building a class with `__enter__` and `__exit__` methods. That class-based approach is rock solid, but writing an entire 15-line class just to wrap a quick 3-line setup-and-teardown operation feels clunky and verbose. \n\nIn everyday professional Python, the vast majority of custom context managers are not written as classes. Instead, they are written as simple generator functions decorated with **`@contextmanager`** from the standard library's **`contextlib`** module. This chapter shows you how to turn any function with a `yield` into an elegant, bulletproof context manager in five lines of code.\n\n### The core idea\n\nThe `@contextmanager` decorator bridges generators (Chapter 7.2) and context managers (Chapter 7.4):\n1. Everything **before** the `yield` runs when entering the `with` block (the setup phase).\n2. Whatever you **`yield`** is handed to the caller as the `as target` variable (or `yield` nothing if no value is needed).\n3. Everything **after** the `yield` runs when exiting the `with` block (the teardown phase).\n\nTo make it foolproof against errors, you wrap the `yield` inside a `try ... finally` block. That guarantees your teardown code *always* runs, even if the code inside the `with` block crashes with an unhandled exception.\n\n### Examples\n\nA minimal custom context manager for timing a block of code:\n\n```python\nfrom contextlib import contextmanager\nimport time\n\n@contextmanager\ndef timer(label: str):\n    start = time.perf_counter()\n    print(f\"[{label}] Starting...\")\n    try:\n        yield  # Control hands over to the body of the `with` statement\n    finally:\n        # This code is GUARANTEED to execute upon leaving the `with` block:\n        elapsed = time.perf_counter() - start\n        print(f\"[{label}] Finished in {elapsed:.4f} seconds\")\n\n# Using our generator-based context manager:\nwith timer(\"Calculating squares\"):\n    total = sum(i * i for i in range(1_000_000))\n    print(f\"Sum: {total}\")\n\n# [Calculating squares] Starting...\n# Sum: 333332833333500000\n# [Calculating squares] Finished in 0.0512 seconds\n```\n\nPassing a value out through `yield` and ensuring cleanup:\n\n```python\nfrom contextlib import contextmanager\nimport os\n\n@contextmanager\ndef temporary_flag(settings: dict, key: str, temp_value):\n    \"\"\"Temporarily override a dictionary setting, restoring it upon exit.\"\"\"\n    original_value = settings.get(key)\n    settings[key] = temp_value\n    try:\n        yield settings  # Hand the modified settings dict to the caller\n    finally:\n        if original_value is None:\n            settings.pop(key, None)\n        else:\n            settings[key] = original_value\n\napp_config = {\"debug\": False, \"theme\": \"dark\"}\n\nprint(\"Initial config:\", app_config)  # {'debug': False, 'theme': 'dark'}\n\nwith temporary_flag(app_config, \"debug\", True) as current_config:\n    print(\"Inside block:\", current_config)  # {'debug': True, 'theme': 'dark'}\n    # Run tests or operations requiring debug mode...\n\nprint(\"After block:\", app_config)  # {'debug': False, 'theme': 'dark'} - automatically restored!\n```\n\nHandling exceptions that happen inside the `with` block:\n\n```python\nfrom contextlib import contextmanager\n\n@contextmanager\ndef database_transaction(session_name: str):\n    print(f\"BEGIN transaction '{session_name}'\")\n    try:\n        yield\n        print(f\"COMMIT transaction '{session_name}'\")\n    except Exception as exc:\n        print(f\"ROLLBACK transaction '{session_name}' due to error: {exc}\")\n        raise  # Re-raise so the caller still knows an error occurred!\n\n# 1. Successful transaction:\nwith database_transaction(\"add_user\"):\n    print(\"Executing: INSERT INTO users...\")\n\n# BEGIN transaction 'add_user'\n# Executing: INSERT INTO users...\n# COMMIT transaction 'add_user'\n\n# 2. Failed transaction:\ntry:\n    with database_transaction(\"transfer_funds\"):\n        print(\"Executing step 1...\")\n        raise ValueError(\"Insufficient balance!\")\n        print(\"Executing step 2...\")  # Never reached\nexcept ValueError:\n    print(\"Caught error in outer caller.\")\n\n# BEGIN transaction 'transfer_funds'\n# Executing step 1...\n# ROLLBACK transaction 'transfer_funds' due to error: Insufficient balance!\n# Caught error in outer caller.\n```\n\nA quick tour of built-in gems inside `contextlib`:\n\n```python\nimport contextlib\nimport io\nimport os\n\n# 1. contextlib.suppress: Cleanly ignore expected exceptions\n# Instead of:\n# try: os.remove(\"temp.txt\") except FileNotFoundError: pass\nwith contextlib.suppress(FileNotFoundError):\n    os.remove(\"nonexistent_file_to_clean_up.txt\")  # Doesn't crash!\n\n# 2. contextlib.redirect_stdout: Temporarily capture print output\nbuffer = io.StringIO()\nwith contextlib.redirect_stdout(buffer):\n    print(\"Secret message printed behind the scenes\")\n\ncaptured = buffer.getvalue().strip()\nprint(\"Captured output:\", captured)\n# Captured output: Secret message printed behind the scenes\n\n# 3. contextlib.nullcontext: An optional placeholder context manager\n# Useful when a function accepts an optional context manager or uses a fallback:\nuse_lock = False\nlock_context = contextlib.nullcontext()  # Does nothing, perfectly safe in a `with`\nwith lock_context:\n    print(\"Running safely with or without a lock.\")\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `try ... finally` around `yield`.** If an exception is raised inside the `with` block, Python injects that exception directly into the generator at the `yield` statement. If you didn't wrap `yield` in a `try ... finally`, any code below `yield` will simply never execute, and your cleanup will fail!\n- **Yielding more than once.** A generator context manager must yield **exactly once**. If your generator contains a second `yield` (e.g. inside a loop), Python will raise `RuntimeError: generator didn't stop`.\n- **Swallowing exceptions accidentally.** If you catch exceptions around `yield` using `except Exception:`, be sure to re-raise (`raise`) the error unless your explicit goal is to suppress it. Silently swallowing exceptions can mask bugs in the calling code.\n- **Calling the function without `@contextmanager`.** If you forget the `@contextmanager` decorator above your generator function, Python will treat it as a plain generator and raise `AttributeError: 'generator' object has no attribute '__enter__'`.\n\n### How this connects\n\nGenerator context managers represent the ultimate convergence of Part VII: they combine **Generators and `yield`** (Chapter 7.2), **Decorators** (Chapter 7.3), and **Context Managers** (Chapter 7.4) into a single, clean Pythonic tool.\n\n### Quick recap\n\n- `from contextlib import contextmanager`: turns a single-`yield` generator into a context manager.\n- Code before `yield` is setup; the `yielded` value becomes `as target`; code after `yield` is cleanup.\n- Always wrap `yield` in `try ... finally` to guarantee cleanup runs even if the block raises an error.\n- Use `contextlib.suppress(*exceptions)` to cleanly silence expected errors without boilerplate.\n- Use `contextlib.redirect_stdout` to capture or redirect terminal output."}, {"id": "8.1", "partNum": 8, "partTitle": "Part VIII — Editing & Revision", "partMetaphor": "a writer's editing process", "chapNum": 1, "slug": "debugging-like-a-detective", "fullTitle": "Chapter 8.1: Debugging Like a Detective", "title": "Debugging Like a Detective", "md": "### Why this matters\n\nEvery programmer, no matter how experienced, spends real time debugging. The difference between a frustrating hour and a five-minute fix is almost always method, not talent — this chapter gives you that method.\n\n### The core idea\n\nDebugging is a systematic process of narrowing down *where* a problem is and *why*, rather than guessing randomly. Python gives you real tools for this beyond just staring at the code: reading tracebacks carefully (Chapter 5.1), strategic `print()`s, and an actual interactive debugger.\n\n### Examples\n\nThe simplest, always-available technique: strategic `print()` statements, to see what's actually happening at each step:\n```python\ndef calculate_discount(price, percent):\n    print(f\"DEBUG: price={price}, percent={percent}\")   # what came in?\n    discount = price * percent / 100\n    print(f\"DEBUG: discount={discount}\")                   # what did we compute?\n    final = price - discount\n    print(f\"DEBUG: final={final}\")                          # what's going out?\n    return final\n\ncalculate_discount(100, 20)\n```\nThis is genuinely useful, if unglamorous — seeing the actual values at each step often reveals a wrong assumption immediately.\n\nUsing Python's built-in interactive debugger, `pdb`, to pause execution and inspect things live:\n```python\ndef calculate_discount(price, percent):\n    import pdb; pdb.set_trace()    # execution PAUSES here\n    discount = price * percent / 100\n    return price - discount\n\ncalculate_discount(100, 20)\n```\nWhen execution hits that line, you get an interactive prompt right there in your program — you can type `price`, `percent`, or any expression to inspect the current values, type `n` to run the next line, or `c` to continue running normally. This beats sprinkling `print()`s everywhere once a bug gets genuinely confusing.\n\nModern Python has an even shorter way to trigger the same thing — the built-in `breakpoint()` function, which does exactly what `import pdb; pdb.set_trace()` does, with less typing:\n```python\ndef calculate_discount(price, percent):\n    breakpoint()    # same effect as pdb.set_trace(), built in since Python 3.7\n    discount = price * percent / 100\n    return price - discount\n```\n\nUsing `assert` as a quick sanity check while developing — it raises an error immediately if the condition is `False`, which is often exactly what you want while tracking down a bug:\n```python\ndef calculate_discount(price, percent):\n    assert price > 0, \"Price must be positive\"\n    assert 0 <= percent <= 100, \"Percent must be between 0 and 100\"\n    return price - (price * percent / 100)\n\ncalculate_discount(-10, 20)   # AssertionError: Price must be positive\n```\n\nA practical debugging checklist, in order, when something's not working:\n1. **Read the traceback from the bottom up** (Chapter 5.1) — what's the exact error and where?\n2. **Check your assumptions with `print()`** — is a variable actually what you think it is, right before the failure?\n3. **Isolate the smallest failing piece** — comment out or simplify surrounding code until you find exactly which line breaks.\n4. **Check for the classic gotchas** — off-by-one indexing, a mutable default argument, `=` vs `==`, forgetting a `return`.\n\nBeyond `print()` and `pdb`, a genuinely useful in-between technique is asserting your assumptions directly in the code, right where you suspect the problem is — combining Chapter 5.2's exception handling with a deliberately narrow, temporary check:\n```python\ndef calculate_average(numbers):\n    assert len(numbers) > 0, f\"Expected a non-empty list, got {numbers}\"\n    assert all(isinstance(n, (int, float)) for n in numbers), f\"Expected all numbers, got {numbers}\"\n    return sum(numbers) / len(numbers)\n\nprint(calculate_average([1, 2, 3]))       # 2.0 - passes both checks\nprint(calculate_average([]))               # AssertionError: Expected a non-empty list, got []\n```\nUnlike a permanent `print()`, these assertions are meant to be temporary scaffolding while you're actively hunting a bug — cheap to add, cheap to remove, and they fail loudly and specifically the moment an assumption turns out to be wrong, rather than letting a bad value silently propagate further into your program before something else breaks confusingly.\n\nOne more genuinely effective, slightly silly-sounding technique worth knowing by name: **rubber duck debugging** — explaining your code out loud, line by line, to literally anything (a rubber duck on your desk is the traditional choice, but a patient friend or even an empty room works too). The act of forcing your assumptions into words, one at a time, very often surfaces the wrong one before you even finish the explanation.\n\n### ⚠️ Common Mistakes\n\n- **Randomly changing code hoping something works, without understanding why it failed first.** This sometimes accidentally \"fixes\" the symptom while leaving the real cause (and likely other related bugs) in place. Understand the *why* before changing anything.\n- **Leaving debug `print()` statements in finished code.** They clutter output and can leak information you didn't mean to show — remove them (or replace them with proper logging, Chapter 8.4) once the bug's found.\n- **Not isolating the problem before asking for help or giving up.** A five-line snippet that reliably reproduces a bug is far easier to solve — for yourself or anyone helping you — than \"my whole 200-line program doesn't work.\"\n\n### How this connects\n\nEverything you've learned about reading tracebacks (Chapter 5.1) and handling exceptions (Chapter
