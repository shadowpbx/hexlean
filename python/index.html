o logical groups:\n```\nshapes/\n    __init__.py\n    two_d/\n        __init__.py\n        circle.py\n        square.py\n    three_d/\n        __init__.py\n        sphere.py\n        cube.py\n```\nImporting from a nested sub-package just chains the dots the way you'd expect: `from shapes.two_d import circle`, or, from inside `sphere.py`, `from ..two_d import circle` reaches \"up and over\" into the sibling sub-package.\n\nAlongside `__init__.py`, a package can optionally have a `__main__.py` file — Python looks for this specifically when you run the *package itself* as a script, using `python -m shapes` instead of running one particular file inside it:\n```python\n# shapes/__main__.py\nprint(\"Running the shapes package directly.\")\n```\n```\npython -m shapes\n```\nThis is the same `-m` flag you've already used to run standard library tools like `python -m venv` (Chapter 8.3) — it tells Python \"find this by module/package name, using the normal import machinery,\" rather than treating the argument as a plain file path.\n\n`__init__.py` doesn't have to stay empty — a common, genuinely useful pattern is re-exporting names in it, so users of your package get a shorter, cleaner import line:\n```python\n# shapes/__init__.py\nfrom .circle import area as circle_area\nfrom .square import area as square_area\n```\nNow, from outside the package, both functions are reachable directly off the package itself, without mentioning the individual files at all:\n```python\n# main.py\nfrom shapes import circle_area, square_area\n\nprint(circle_area(5))   # 78.53981633974483\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `__init__.py` entirely.** Modern Python (3.3+) technically supports \"namespace packages\" without one, but this is a subtle, easy-to-misunderstand feature — including an (even empty) `__init__.py` in every package you create is the clear, unambiguous, traditional approach, and what you should default to.\n- **Using a relative import (`from .circle import area`) in a file you then run directly**, e.g. `python shapes/square.py`. This raises `ImportError: attempted relative import with no known parent package` — relative imports only work when the file is imported *as part of its package*, not executed directly as a standalone script. Run it via `main.py` (or `python -m shapes.square` from the project's root folder) instead.\n- **Creating a circular import** — `circle.py` importing something from `square.py`, while `square.py` also imports something from `circle.py`. Python can't fully load either file first, and you'll get a confusing `ImportError` partway through. The usual fix is restructuring so the shared logic lives in a third file both can import from, without importing from each other.\n- **Confusing a single dot with two.** `from .circle import area` reaches into the *current* package; `from ..other_package import thing` reaches into the *parent* package — using the wrong number of dots is a common typo-level mistake once packages start nesting.\n\n### How this connects\n\nThis is the natural next step after Chapter 5.6's single-file modules — the same `import` mental model, just applied to a folder of related files instead of one. Real Python projects of any real size are organized exactly this way.\n\n### Quick recap\n\n- A **package** is a folder with an `__init__.py` file, containing modules that can import from each other.\n- From outside, import a package's modules like `from shapes import circle`, or specific names like `from shapes.circle import area`.\n- Inside the package, use relative imports: `from .circle import area` (this package) or `from ..other import thing` (parent package).\n- `__init__.py` can re-export names from inside the package, giving users of your package a shorter, cleaner import path.\n- Relative imports only work when the file is run *as part of* its package — not executed directly as a standalone script."}, {"id": "5.9", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "combining sentences into coherent units", "chapNum": 9, "slug": "argparse-building-command-line-tools", "fullTitle": "Chapter 5.9: `argparse`: Building Real Command-Line Tools", "title": "`argparse`: Building Real Command-Line Tools", "md": "### Why this matters\n\nChapter 5.7 introduced `sys.argv` — a plain list of whatever text followed your script's name. That works, but it hands you zero help: no named flags, no automatic error messages, no `--help` text, and you'd have to write all the type-checking yourself. `argparse` is the standard library's answer — it's what turns a script into something that feels like a real, professional command-line tool.\n\n### The core idea\n\nYou describe what arguments your program expects using an `argparse.ArgumentParser`, and it handles reading `sys.argv`, converting types, generating helpful error messages, and even a `--help` flag — all automatically, for free.\n\n### Examples\n\nThe simplest possible parser, with one required **positional** argument:\n```python\n# greet.py\nimport argparse\n\nparser = argparse.ArgumentParser(description=\"Greet someone by name.\")\nparser.add_argument(\"name\", help=\"the name of the person to greet\")\nargs = parser.parse_args()\n\nprint(f\"Hello, {args.name}!\")\n```\nRunning it from a terminal:\n```\npython greet.py Ava\nHello, Ava!\n```\n\nAdding an **optional** argument — anything starting with `--` — with a default value used when it's not provided:\n```python\nparser = argparse.ArgumentParser()\nparser.add_argument(\"name\")\nparser.add_argument(\"--greeting\", default=\"Hello\", help=\"the greeting word to use\")\nargs = parser.parse_args()\n\nprint(f\"{args.greeting}, {args.name}!\")\n```\n```\npython greet.py Ava\nHello, Ava!\n\npython greet.py Ava --greeting Hi\nHi, Ava!\n```\n\nBy default, every argument arrives as a **string** — just like `sys.argv` — but `type=` converts it automatically, and raises a clear error if the conversion fails, without you writing any validation code yourself:\n```python\nparser.add_argument(\"--times\", type=int, default=1, help=\"how many times to repeat\")\nargs = parser.parse_args()\n\nfor _ in range(args.times):\n    print(f\"{args.greeting}, {args.name}!\")\n```\n```\npython greet.py Ava --times abc\nusage: greet.py [-h] [--greeting GREETING] [--times TIMES] name\ngreet.py: error: argument --times: invalid int value: 'abc'\n```\nNotice `argparse` produced that whole error message, and the usage summary, entirely on its own.\n\nA flag that doesn't take a value at all — just \"was it present or not\" — uses `action=\"store_true\"`:\n```python\nparser.add_argument(\"--shout\", action=\"store_true\", help=\"print in all caps\")\nargs = parser.parse_args()\n\nmessage = f\"{args.greeting}, {args.name}!\"\nprint(message.upper() if args.shout else message)\n```\n```\npython greet.py Ava --shout\nHELLO, AVA!\n```\n\n`--help` (or `-h`) is generated completely automatically, from the `help=` text on each argument — you never write this yourself:\n```\npython greet.py --help\nusage: greet.py [-h] [--greeting GREETING] [--times TIMES] [--shout] name\n\npositional arguments:\n  name                 the name of the person to greet\n\noptions:\n  -h, --help           show this help message and exit\n  --greeting GREETING  the greeting word to use\n  --times TIMES        how many times to repeat\n  --shout              print in all caps\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting positional arguments have no leading dashes, while optional ones need `--`.** `parser.add_argument(\"name\")` is required and positional; `parser.add_argument(\"--greeting\")` is optional and must be passed with `--greeting value` on the command line.\n- **Forgetting `type=` and being surprised everything is a string.** Without `type=int`, `args.times` would be the *string* `\"3\"`, not the number `3` — `range(args.times)` would then raise a `TypeError`.\n- **Assuming a missing required argument needs your own error-handling.** It doesn't — `argparse` already prints a clear usage error and exits on its own if a required positional argument is missing, before your code even runs.\n- **Using `action=\"store_true\"` and then also trying to pass it a value.** `--shout` is a pure on/off switch — `python greet.py Ava --shout yes` fails, since `--shout` doesn't expect anything after it; the mere presence of the flag is the signal.\n\nOne more genuinely common need: a flag that can be given more than once, collecting each value into a list, using `action=\"append\"`:\n```python\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--tag\", action=\"append\", help=\"add a tag (can be repeated)\")\nargs = parser.parse_args()\nprint(args.tag)\n```\n```\npython script.py --tag urgent --tag review\n['urgent', 'review']\n```\n\nA short single-character alias alongside the full `--` name is common enough to be worth knowing — just list both when calling `add_argument`:\n```python\nparser.add_argument(\"-g\", \"--greeting\", default=\"Hello\")\n```\n```\npython greet.py Ava -g Hi        # short form\npython greet.py Ava --greeting Hi   # long form - both do the same thing\n```\n\n### How this connects\n\nThis is the natural next step once `sys.argv` (Chapter 5.7) stops being enough — anywhere you'd build a real script meant for other people (or future-you) to run with different options, `argparse` is the standard, professional way to do it.\n\n### Quick recap\n\n- `argparse.ArgumentParser()` + `.add_argument(...)` + `.parse_args()` describes and reads command-line arguments.\n- Positional arguments have no dashes and are required by default; optional ones start with `--` and can have a `default=`.\n- `type=` converts and validates automatically; `action=\"store_true\"` creates an on/off flag with no value.\n- `--help`/`-h` and clear error messages for missing/invalid arguments are generated automatically, at no extra cost."}, {"id": "5.10", "partNum": 5, "partTitle": "Part V — Paragraphs", "partMetaphor": "combining sentences into coherent units", "chapNum": 10, "slug": "storing-data-with-sqlite3", "fullTitle": "Chapter 5.10: Storing Data with `sqlite3`", "title": "Storing Data with `sqlite3`", "md": "### Why this matters\n\nIn Chapter 5.4, you saw how to save data into CSV and JSON files. Flat files are wonderfully simple, but they quickly stumble when your data grows: to update a single record or search for one item, you have to read the *entire* file into memory and rewrite the whole thing back out to disk. Flat files also offer zero protection if your program crashes halfway through writing, risking file corruption. When you need indexed searching, atomic updates, and relational queries without installing or managing a database server, Python's standard library includes **`sqlite3`** — a full-featured, zero-configuration SQL database engine ready to use right out of the box.\n\n### The core idea\n\nSQLite is a serverless database that lives entirely inside a single file on your disk (or temporarily in memory). Python's built-in `sqlite3` module gives you a direct bridge to it:\n1. **Connect** to the database with `sqlite3.connect()`.\n2. **Execute** SQL statements through a `cursor` or directly on the connection.\n3. **Commit** your changes to ensure they are safely written to disk.\n4. **Fetch** query results as Python tuples (or row objects).\n\nEverything runs locally within your Python process — no servers to launch, no passwords to configure, and no external libraries to install.\n\n### Examples\n\nThe minimal workflow — creating a database in memory, building a table, inserting a record, and querying it back:\n\n```python\nimport sqlite3\n\n# Use \":memory:\" for a temporary test database, or a filename like \"app.db\"\nconn = sqlite3.connect(\":memory:\")\ncursor = conn.cursor()\n\n# 1. Create a table\ncursor.execute(\"\"\"\n    CREATE TABLE users (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        name TEXT NOT NULL,\n        email TEXT UNIQUE,\n        points INTEGER DEFAULT 0\n    )\n\"\"\")\n\n# 2. Insert a record safely using ? placeholders\ncursor.execute(\n    \"INSERT INTO users (name, email, points) VALUES (?, ?, ?)\",\n    (\"Alice\", \"alice@example.com\", 150)\n)\nconn.commit()  # Save the transaction\n\n# 3. Query the data\ncursor.execute(\"SELECT id, name, email, points FROM users WHERE points > ?\", (100,))\nrow = cursor.fetchone()\nprint(row)  # (1, 'Alice', 'alice@example.com', 150)\n\nconn.close()\n```\n\n**Security first: parameterized queries vs. SQL injection.** Never, ever format user input directly into a SQL string:\n\n```python\nimport sqlite3\n\nconn = sqlite3.connect(\":memory:\")\ncursor = conn.cursor()\ncursor.execute(\"CREATE TABLE accounts (id INTEGER, username TEXT, balance REAL)\")\ncursor.execute(\"INSERT INTO accounts VALUES (1, 'admin', 5000.0)\")\ncursor.execute(\"INSERT INTO accounts VALUES (2, 'bob', 25.0)\")\nconn.commit()\n\n# --- THE DANGEROUS WAY (Vulnerable to SQL Injection) ---\nuntrusted_input = \"' OR 1=1 --\"\n# If you used an f-string:\n# query = f\"SELECT * FROM accounts WHERE username = '{untrusted_input}'\"\n# That evaluates to: SELECT * FROM accounts WHERE username = '' OR 1=1 --'\n# An attacker would bypass the check and dump every account!\n\n# --- THE SECURE WAY (Parameterized query) ---\n# SQLite treats the ? placeholder purely as literal data, never as executable SQL:\ncursor.execute(\"SELECT * FROM accounts WHERE username = ?\", (untrusted_input,))\nprint(cursor.fetchall())  # [] - safely matches nothing, exactly as expected!\n\nconn.close()\n```\n\nInserting multiple rows efficiently with `executemany()`:\n\n```python\nimport sqlite3\n\nconn = sqlite3.connect(\":memory:\")\ncursor = conn.cursor()\ncursor.execute(\"CREATE TABLE inventory (item TEXT, quantity INTEGER)\")\n\nitems = [\n    (\"Notebook\", 45),\n    (\"Pen\", 120),\n    (\"Stapler\", 8),\n    (\"Highlighter\", 34),\n]\n\n# Insert the whole batch in one efficient operation\ncursor.executemany(\"INSERT INTO inventory (item, quantity) VALUES (?, ?)\", items)\nconn.commit()\n\ncursor.execute(\"SELECT item, quantity FROM inventory WHERE quantity < ?\", (20,))\nlow_stock = cursor.fetchall()\nprint(\"Low stock items:\", low_stock)  # [('Stapler', 8)]\n\nconn.close()\n```\n\nUsing dict-like column access with `sqlite3.Row` — no more guessing whether `row[3]` was the email or the balance:\n\n```python\nimport sqlite3\n\nconn = sqlite3.connect(\":memory:\")\nconn.row_factory = sqlite3.Row  # Enable named column access\ncursor = conn.cursor()\n\ncursor.execute(\"CREATE TABLE products (sku TEXT, name TEXT, price REAL)\")\ncursor.execute(\"INSERT INTO products VALUES (?, ?, ?)\", (\"A100\", \"Coffee Mug\", 12.99))\nconn.commit()\n\ncursor.execute(\"SELECT * FROM products WHERE sku = ?\", (\"A100\",))\nproduct = cursor.fetchone()\n\n# Access by column name, just like a dictionary:\nprint(product[\"name\"], \"costs\", f\"${product['price']:.2f}\")  # Coffee Mug costs $12.99\n# Or access by index like a tuple:\nprint(\"SKU:\", product[0])  # SKU: A100\n\nconn.close()\n```\n\nAutomating transactions with context managers (`with conn:`):\n\n```python\nimport sqlite3\n\nconn = sqlite3.connect(\":memory:\")\ncursor = conn.cursor()\ncursor.execute(\"CREATE TABLE ledger (account TEXT, balance REAL)\")\n\n# The connection context manager automatically commits on success,\n# and rolls back the transaction if an exception is raised!\nwith conn:\n    cursor.execute(\"INSERT INTO ledger VALUES (?, ?)\", (\"Alice\", 200.0))\n    cursor.execute(\"INSERT INTO ledger VALUES (?, ?)\", (\"Bob\", 300.0))\n    # conn.commit() is invoked automatically here upon exiting the block!\n\ncursor.execute(\"SELECT COUNT(*) FROM ledger\")\nprint(\"Total rows:\", cursor.fetchone()[0])  # Total rows: 2\nconn.close()\n```\n\n### ⚠️ Common Mistakes\n\n- **Using f-strings or string concatenation to build SQL statements.** This is the classic SQL Injection security vulnerability. Always use `?` placeholders and supply arguments as a tuple.\n- **Forgetting `connection.commit()`.** If you don't commit your changes (or use `with conn:`), your insertions and updates exist only in a temporary memory buffer. When your script exits, those changes vanish without an error!\n- **Passing a single parameter without the trailing tuple comma.** In Python, `(\"alice\")` is simply a string in parentheses, not a tuple! `(\"alice\",)` with a trailing comma creates a 1-item tuple. Passing `(\"alice\")` causes SQLite to treat each letter (`'a'`, `'l'`, `'i'`, `'c'`, `'e'`) as a separate parameter, raising `sqlite3.ProgrammingError: Incorrect number of bindings supplied`.\n- **Leaving connections unclosed.** Always call `conn.close()` when done (or manage the connection lifecycle cleanly), especially with file-based databases on Windows, where open file handles can lock the `.db` file against other tools.\n- **Expecting SQLite to handle massive concurrent writes.** SQLite supports unlimited simultaneous readers, but write operations briefly lock the entire file. For massive multi-user, multi-threaded write loads, client-server databases (like PostgreSQL) are the appropriate choice.\n\n### How this connects\n\n`sqlite3` is the natural evolution of File I/O (Chapter 5.3) and JSON/CSV handling (Chapter 5.4). It utilizes the context manager pattern you will explore deeply in Chapter 7.4 (`with` statements), and gives you a professional, robust persistence layer for storing `@dataclass` models (Chapter 6.6) without reaching for third-party packages.\n\n### Quick recap\n\n- `sqlite3` is built into Python's standard library; `sqlite3.connect(\"filename.db\")` opens or creates a local database.\n- Always use `?` placeholders to safely parameterize SQL queries and eliminate SQL injection risks.\n- Pass parameters as a sequence (e.g. `(val1, val2)` or a 1-tuple `(val1,)`).\n- Modifications must be committed with `conn.commit()` or executed inside a `with conn:` context block.\n- `cursor.executemany()` executes an insertion or update over a list of parameter tuples in one go.\n- Set `conn.row_factory = sqlite3.Row` to access queried fields by column name."}, {"id": "6.1", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 1, "slug": "classes-objects-making-your-own-types", "fullTitle": "Chapter 6.1: Classes & Objects: Making Your Own Types", "title": "Classes & Objects: Making Your Own Types", "md": "### Why this matters\n\nEvery type you've used so far — `str`, `list`, `dict` — was built by someone else. This chapter teaches you to build your *own* types, bundling related data and behavior together under one name. It's how real-world programs represent real-world things: a customer, a game character, a bank account.\n\n### The core idea\n\nA **class** is a blueprint for creating objects. An **object** (also called an **instance**) is one specific thing built from that blueprint. Each object can hold its own data (**attributes**) and share behavior defined on the class (**methods**).\n\n### Examples\n\nDefining a minimal class, and creating instances of it:\n```python\nclass Dog:\n    pass\n\nmy_dog = Dog()\nyour_dog = Dog()\nprint(my_dog)          # <__main__.Dog object at 0x...> - a real, distinct object\nprint(my_dog is your_dog)   # False - two separate objects, same blueprint\n```\n\n`type()` — the same built-in from Chapter 1.3 that told you `int` or `str` — works exactly the same way on your own objects:\n```python\nprint(type(my_dog))         # <class '__main__.Dog'>\nprint(isinstance(my_dog, Dog))   # True\n```\n\nGiving instances their own data, by setting attributes:\n```python\nmy_dog = Dog()\nmy_dog.name = \"Rex\"\nmy_dog.age = 3\n\nprint(my_dog.name)   # Rex\nprint(my_dog.age)     # 3\n```\nThis works, but is clumsy — you'd have to remember to set every attribute manually, every time. The next chapter fixes this properly with a constructor.\n\nAdding behavior with a **method** — a function defined inside a class:\n```python\nclass Dog:\n    def bark(self):\n        print(\"Woof!\")\n\nmy_dog = Dog()\nmy_dog.bark()    # Woof!\n```\nNotice `self` — every method's first parameter refers to *the specific instance it was called on*. You don't pass it explicitly; Python fills it in automatically when you write `my_dog.bark()`.\n\nOne more distinction worth knowing from the start: an attribute defined directly in the class body (not through `self`) is a **class attribute** — shared by every instance — rather than an **instance attribute**, which belongs to just one:\n```python\nclass Dog:\n    species = \"Canis familiaris\"   # a CLASS attribute - shared by every Dog\n\n    def bark(self):\n        print(\"Woof!\")\n\nrex = Dog()\nfido = Dog()\nprint(rex.species, fido.species)   # Canis familiaris Canis familiaris - same value, shared\n\nrex.name = \"Rex\"   # an INSTANCE attribute - belongs only to rex\nprint(rex.name)       # Rex\nprint(fido.name)        # AttributeError - fido never got its own 'name'\n```\nClass attributes are useful for values that are genuinely the same across every instance; per-instance data (like each dog's own name) belongs on `self`, which the next chapter shows how to set up properly for every new instance automatically.\n\nA class attribute is also useful as a running tally shared across *every* instance — counting how many objects have been created, for example. Since constructors (`__init__`) are properly covered next chapter, here's the idea using what you already know, a plain helper function:\n```python\nclass Dog:\n    total_dogs = 0   # a CLASS attribute, shared by all\n\ndef make_dog():\n    Dog.total_dogs += 1   # updating it through the CLASS name, not an instance\n    return Dog()\n\nrex = make_dog()\nfido = make_dog()\nbuddy = make_dog()\nprint(Dog.total_dogs)   # 3 - every call contributed to the same shared counter\n```\nNotice `Dog.total_dogs += 1` updates it through the class name specifically — writing it through an instance instead (`rex.total_dogs += 1`) would actually create a brand-new *instance* attribute shadowing the class one, rather than updating the shared value (the same \"reading vs. writing\" asymmetry you'll see formalized with `global` in Chapter 4.4). Chapter 6.2 shows the proper, idiomatic way to do this counting automatically, inside a real constructor.\n\nObjects can also be examined generically with `vars()`, which returns an instance's attributes as a plain dictionary — handy for quick inspection without needing to know a class's exact attribute names ahead of time:\n```python\nrex = Dog()\nrex.name = \"Rex\"\nrex.age = 3\nprint(vars(rex))   # {'name': 'Rex', 'age': 3}\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `self` as a method's first parameter.** `def bark():` (no `self`) raises a `TypeError` the moment you call `my_dog.bark()`, because Python automatically tries to pass the instance as the first argument regardless.\n- **Confusing the class itself with an instance of it.** `Dog` is the blueprint; `my_dog = Dog()` is an actual object built from it. `Dog.bark` and `my_dog.bark()` look similar but mean different things — the second is calling the method *on a specific instance*.\n- **Setting attributes ad hoc, inconsistently, after creation.** As shown above, this technically works but is fragile — some instances might be missing an attribute another one has. Chapter 6.2 fixes this properly.\n- **Confusing a class attribute with an instance attribute, and being surprised when changing it affects every instance.** Since class attributes are genuinely shared, reassigning one through the class (`Dog.species = \"...\"`) changes it everywhere at once — a common source of \"why did my other object change too\" confusion.\n\n### How this connects\n\nClasses are the \"Chapters\" of our book metaphor — a way to structure many related \"paragraphs\" (attributes and methods) under one coherent name. The next several chapters build out everything a class can do.\n\n### Quick recap\n\n- A class is a blueprint; an instance (object) is one thing built from it.\n- Attributes hold an instance's data; methods define its behavior.\n- Every method's first parameter, conventionally named `self`, refers to the specific instance it's called on.\n- `type()` and `isinstance()` work on your own classes exactly like on built-in types.\n- A class attribute (defined in the class body) is shared by every instance; an instance attribute (set via `self.x = ...`) belongs to just one."}, {"id": "6.2", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 2, "slug": "constructors-methods", "fullTitle": "Chapter 6.2: Constructors & Methods", "title": "Constructors & Methods", "md": "### Why this matters\n\nThe previous chapter's ad-hoc attribute-setting doesn't scale. Every real class needs a reliable way to set up a new instance's data the moment it's created — that's exactly what a constructor does.\n\n### The core idea\n\n`__init__` is a special method Python calls automatically every time you create a new instance — it's where you set up that instance's initial attributes. Any other method you define works the same way you saw in Chapter 6.1, using `self` to access the instance's own data.\n\n### Examples\n\nA proper constructor:\n```python\nclass Dog:\n    def __init__(self, name, age):\n        self.name = name    # store the given name on THIS instance\n        self.age = age\n\n    def bark(self):\n        print(f\"{self.name} says Woof!\")\n\n    def have_birthday(self):\n        self.age += 1\n\nrex = Dog(\"Rex\", 3)\nfido = Dog(\"Fido\", 5)\n\nrex.bark()               # Rex says Woof!\nfido.bark()               # Fido says Woof!\n\nrex.have_birthday()\nprint(rex.age)             # 4\nprint(fido.age)             # 5 - completely unaffected, separate instance\n```\n\nYou can give constructor parameters default values, exactly like a regular function (Chapter 4.3):\n```python\nclass Dog:\n    def __init__(self, name, age=0):\n        self.name = name\n        self.age = age\n\npuppy = Dog(\"Buddy\")\nprint(puppy.age)   # 0\n```\n\nRecall the mutable-default-argument trap from Chapter 4.3 — it applies just as much inside `__init__`. If a `Dog` should start with an empty list of tricks, each instance needs its *own* fresh list, not one shared list handed out by a mutable default:\n```python\nclass Dog:\n    def __init__(self, name, tricks=None):\n        self.name = name\n        self.tricks = tricks if tricks is not None else []   # a FRESH list every time\n\nrex = Dog(\"Rex\")\nfido = Dog(\"Fido\")\nrex.tricks.append(\"sit\")\nprint(rex.tricks)    # ['sit']\nprint(fido.tricks)     # [] - correctly independent, not shared\n```\n\nMethods can call other methods on the same instance, through `self`:\n```python\nclass Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def describe(self):\n        return f\"{self.name} is {self.age} year(s) old.\"\n\n    def introduce(self):\n        print(f\"Hi, I'm a dog. {self.describe()}\")\n\nrex = Dog(\"Rex\", 3)\nrex.introduce()   # Hi, I'm a dog. Rex is 3 year(s) old.\n```\n\nAs promised in Chapter 6.1: here's the proper, idiomatic way to count instances, using `__init__` instead of a manual helper function — every constructor call updates the shared class attribute automatically, with no extra step required from whoever's creating the dogs:\n```python\nclass Dog:\n    total_dogs = 0\n\n    def __init__(self, name):\n        self.name = name\n        Dog.total_dogs += 1   # runs automatically, every single time a Dog is created\n\nrex = Dog(\"Rex\")\nfido = Dog(\"Fido\")\nbuddy = Dog(\"Buddy\")\nprint(Dog.total_dogs)   # 3\n```\n\nConstructors can also validate their inputs before storing them — genuinely worth doing when a completely invalid value would otherwise silently create a broken object:\n```python\nclass Dog:\n    def __init__(self, name, age):\n        if age < 0:\n            raise ValueError(\"Age can't be negative\")\n        self.name = name\n        self.age = age\n\nrex = Dog(\"Rex\", 3)      # fine\nghost = Dog(\"Ghost\", -1)   # raises ValueError immediately - never creates a broken instance\n```\nThis is a lighter-weight alternative to the full `@property` setter pattern from Chapter 6.3 — validating once, at creation time, rather than every time the attribute is reassigned later. Reach for a full property when the value might legitimately change after creation and needs validating each time; a constructor check alone is enough when the value is set once and never touched again.\n\nOne class can create and return instances of a *different* class from inside a method — genuinely useful when objects naturally produce other objects, like a factory or a workshop. (This example uses a fresh, self-contained `Puppy` class taking just a name, to keep it independent of the `Dog` variations defined earlier in this chapter.)\n```python\nclass Puppy:\n    def __init__(self, name):\n        self.name = name\n\nclass Litter:\n    def __init__(self, mother_name, count):\n        self.mother_name = mother_name\n        self.count = count\n\n    def create_puppies(self):\n        return [Puppy(f\"{self.mother_name}'s puppy {i+1}\") for i in range(self.count)]\n\nlitter = Litter(\"Bella\", 3)\npuppies = litter.create_puppies()\nprint([p.name for p in puppies])   # [\"Bella's puppy 1\", \"Bella's puppy 2\", \"Bella's puppy 3\"]\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to store a constructor's parameters onto `self`.** `def __init__(self, name): name = name` (instead of `self.name = name`) sets a local variable that immediately disappears when `__init__` finishes — the instance never actually gets a `name` attribute. This is one of the most common early OOP bugs.\n- **Confusing a class's own name with `self`.** Writing `Dog.bark(self)` instead of `self.bark()` works in a pinch but isn't the normal, idiomatic way to call another method on the same instance.\n- **Expecting instances to share data by default.** As shown, `rex.have_birthday()` never touches `fido.age` — each instance's attributes are its own, unless you deliberately share something at the *class* level instead (Chapter 6.1's class attributes).\n- **Using a mutable default (like `tricks=[]`) directly in `__init__`.** Exactly the same trap from Chapter 4.3 — default to `None` and build the fresh list inside the constructor, as shown above.\n\n### How this connects\n\n`__init__` is the single most-used method you'll write in any class — nearly every class you build from here forward starts with one.\n\n### Quick recap\n\n- `__init__(self, ...)` runs automatically when a new instance is created — it's where you set up attributes.\n- Store constructor parameters onto the instance explicitly: `self.name = name`.\n- Each instance's attributes are independent; methods access them through `self`.\n- The mutable-default-argument rule from Chapter 4.3 applies inside `__init__` too — default a mutable attribute to `None` and build it fresh inside the constructor."}, {"id": "6.3", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 3, "slug": "static-methods-class-methods-properties", "fullTitle": "Chapter 6.3: Static Methods, Class Methods & Properties", "title": "Static Methods, Class Methods & Properties", "md": "### Why this matters\n\nNot every method needs access to a specific instance's data — and not every attribute should be freely settable without any checks. This chapter covers three tools real Python code uses constantly, that fill in exactly those gaps.\n\n### The core idea\n\nA **`@staticmethod`** doesn't receive `self` at all — it's just a regular function that happens to live inside a class, for organizational purposes. A **`@classmethod`** receives the *class itself* (conventionally named `cls`) instead of an instance — often used for alternative constructors. A **`@property`** lets a method be *accessed like an attribute*, without parentheses — commonly used to compute a value on demand, or to validate a value before allowing it to be set.\n\n### Examples\n\n`@staticmethod` — logically related to the class, but needs no instance data:\n```python\nclass TemperatureConverter:\n    @staticmethod\n    def celsius_to_fahrenheit(celsius):\n        return celsius * 9 / 5 + 32\n\nprint(TemperatureConverter.celsius_to_fahrenheit(100))   # 212.0\n```\nNotice it's called on the class directly — no instance was ever created, and none was needed.\n\n`@classmethod` — commonly used as an alternative way to construct an instance:\n```python\nclass Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    @classmethod\n    def from_birth_year(cls, name, birth_year, current_year):\n        age = current_year - birth_year\n        return cls(name, age)   # cls here IS the Dog class - same as calling Dog(...)\n\nrex = Dog.from_birth_year(\"Rex\", 2020, 2024)\nprint(rex.age)   # 4\n```\n\n`@property` — a method that's *read* like a plain attribute, no parentheses needed:\n```python\nclass Circle:\n    def __init__(self, radius):\n        self.radius = radius\n\n    @property\n    def area(self):\n        return 3.14159 * self.radius ** 2\n\nc = Circle(5)\nprint(c.area)   # 78.53975 - notice: no parentheses, even though area() is a method!\n```\n\nA property with a **setter**, letting you validate a value before it's actually stored:\n```python\nclass Circle:\n    def __init__(self, radius):\n        self._radius = radius     # the underscore signals \"internal, use the property instead\"\n\n    @property\n    def radius(self):\n        return self._radius\n\n    @radius.setter\n    def radius(self, value):\n        if value < 0:\n            raise ValueError(\"Radius can't be negative\")\n        self._radius = value\n\nc = Circle(5)\nprint(c.radius)     # 5 - reads through the property\nc.radius = 10        # writes through the setter - validated\nprint(c.radius)      # 10\nc.radius = -3          # raises ValueError: Radius can't be negative\n```\n\nA property can also have a **deleter**, using `@name.deleter`, for when `del obj.attribute` should run custom logic instead of just disappearing:\n```python\nclass Circle:\n    def __init__(self, radius):\n        self._radius = radius\n\n    @property\n    def radius(self):\n        return self._radius\n\n    @radius.setter\n    def radius(self, value):\n        if value < 0:\n            raise ValueError(\"Radius can't be negative\")\n        self._radius = value\n\n    @radius.deleter\n    def radius(self):\n        print(\"Resetting radius to 0\")\n        self._radius = 0\n\nc = Circle(5)\ndel c.radius             # Resetting radius to 0\nprint(c.radius)            # 0\n```\n\nOne question worth answering directly: why bother with `@staticmethod` instead of just writing an ordinary function outside the class? Mostly organization — it groups a helper with the class it's conceptually related to (like `TemperatureConverter.celsius_to_fahrenheit`), makes that relationship obvious to anyone reading the code, and keeps it out of your module's general namespace.\n\nA `@classmethod` alternative constructor can also do real validation or transformation before handing off to the regular constructor — genuinely useful for parsing a specific input format into a proper instance:\n```python\nclass Date:\n    def __init__(self, year, month, day):\n        self.year = year\n        self.month = month\n        self.day = day\n\n    def __repr__(self):\n        return f\"Date({self.year}, {self.month}, {self.day})\"\n\n    @classmethod\n    def from_string(cls, date_string):\n        year, month, day = date_string.split(\"-\")\n        return cls(int(year), int(month), int(day))\n\nd = Date.from_string(\"2026-09-05\")\nprint(d)   # Date(2026, 9, 5)\n```\nThis is a genuinely common real-world pattern — a class often needs several different ways to be constructed (from a string, from a dictionary, from another object), and `@classmethod` alternatives keep each of those clearly named and separate, rather than cramming every possible input format into one overloaded `__init__`.\n\nProperties can also be used to expose a *read-only* computed value with no setter at all — attempting to assign to it then raises an error automatically, which is exactly the right behavior when a value should never be set directly:\n```python\nclass Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    @property\n    def area(self):\n        return self.width * self.height   # computed fresh every time, never stored directly\n\nr = Rectangle(4, 5)\nprint(r.area)     # 20\nr.area = 100        # AttributeError: property 'area' has no setter (exact wording varies by Python version)\n```\n\n### ⚠️ Common Mistakes\n\n- **Adding `self` to a `@staticmethod` out of habit, or forgetting it entirely on a regular method.** A static method takes no automatic first argument at all — if it needs no instance or class data, that's exactly the sign it should be static.\n- **Calling a property with parentheses, or forgetting the parentheses on a regular method.** `c.area()` (with parentheses) raises a `TypeError`, since `area` is accessed as a plain attribute, not called. This distinction — property vs. regular method — matters and is easy to mix up at first.\n- **Forgetting the single leading underscore convention (`self._radius`) for an attribute that has a property wrapping it.** Naming the internal storage the *same* as the property (`self.radius` inside a property also named `radius`) causes infinite recursion — the property would keep calling itself.\n- **Reaching for a full `@property` setter when a plain attribute would do.** Properties are for when you need computed values or validation — for straightforward, unrestricted data, a plain attribute (Chapter 6.2) is simpler and perfectly fine.\n- **Forgetting a deleter is optional.** Without `@radius.deleter`, `del c.radius` raises an `AttributeError` — you only need one if you specifically want custom behavior when the attribute is deleted.\n\n### How this connects\n\nThese three decorators round out what a class's methods can actually be — regular (bound to an instance), static (just organized inside the class), class-level (bound to the class itself), or property-wrapped (accessed like data). Chapter 6.6 shows a modern shortcut that avoids writing much of this boilerplate for simple data-holding classes.\n\n### Quick recap\n\n- `@staticmethod` — no automatic `self` or `cls`; just a function living inside the class.\n- `@classmethod` — receives the class itself as `cls`; often used for alternative constructors.\n- `@property` — a method accessed like an attribute (no parentheses); pair with `@name.setter` to validate assignments.\n- Store the \"real\" value under a name like `self._radius` when a property of the same name (`radius`) wraps it.\n- `@name.deleter` runs custom logic on `del obj.name`; without one, deleting raises an `AttributeError`."}, {"id": "6.4", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 4, "slug": "inheritance-super", "fullTitle": "Chapter 6.4: Inheritance & `super()`", "title": "Inheritance & `super()`", "md": "### Why this matters\n\nMany types you want to model are naturally \"a specific kind of\" something more general — a `Poodle` is a kind of `Dog`, a `SavingsAccount` is a kind of `Account`. Inheritance lets a new class reuse and extend an existing one, instead of copy-pasting its code.\n\n### The core idea\n\nA class can **inherit** from another (its **parent** or **base class**), automatically gaining all its attributes and methods. The new class (the **child** or **subclass**) can add new behavior, or **override** (replace) inherited behavior — and `super()` lets it still reach back and reuse the parent's original version when needed.\n\n### Examples\n\nBasic inheritance:\n```python\nclass Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        print(f\"{self.name} makes a sound.\")\n\nclass Dog(Animal):     # Dog inherits from Animal\n    pass\n\nrex = Dog(\"Rex\")\nrex.speak()   # Rex makes a sound. - inherited directly, unchanged\n```\n\nOverriding a method to specialize behavior:\n```python\nclass Dog(Animal):\n    def speak(self):\n        print(f\"{self.name} barks.\")\n\nrex = Dog(\"Rex\")\nrex.speak()   # Rex barks. - the Dog version is used instead of Animal's\n```\n\nUsing `super()` to extend the parent's behavior rather than fully replace it — very common inside `__init__`:\n```python\nclass Animal:\n    def __init__(self, name, sound):\n        self.name = name\n        self.sound = sound\n\nclass Dog(Animal):\n    def __init__(self, name):\n        super().__init__(name, sound=\"Bark\")   # let Animal handle the shared setup\n        self.tricks = []                          # then add Dog-specific setup\n\nrex = Dog(\"Rex\")\nprint(rex.name, rex.sound, rex.tricks)   # Rex Bark []\n```\n\n`super()` isn't limited to `__init__` — it works the same way in any overridden method, letting you run the parent's version *and then* add more:\n```python\nclass Dog(Animal):\n    def speak(self):\n        super().speak()          # run Animal's version first...\n        print(f\"{self.name} also wags its tail.\")   # ...then add Dog-specific behavior\n\nrex = Dog(\"Rex\")\nrex.speak()\n# Rex makes a sound.\n# Rex also wags its tail.\n```\n\nInheritance can chain across more than one level — a `Poodle` can inherit from `Dog`, which inherits from `Animal`, and `super()` at each level reaches up to the *next* class in that chain:\n```python\nclass Poodle(Dog):\n    def speak(self):\n        super().speak()             # Dog.speak(), which itself calls Animal.speak()\n        print(f\"{self.name} does a little poodle spin.\")\n\nfifi = Poodle(\"Fifi\")\nfifi.speak()\n# Fifi makes a sound.\n# Fifi also wags its tail.\n# Fifi does a little poodle spin.\n```\n\nChecking a type's relationship with `isinstance()`:\n```python\nprint(isinstance(rex, Dog))       # True\nprint(isinstance(rex, Animal))    # True - a Dog IS an Animal, through inheritance\nprint(isinstance(rex, str))        # False\n```\n`issubclass()` checks the same kind of relationship, but between two *classes* directly, rather than an instance and a class:\n```python\nprint(issubclass(Dog, Animal))    # True\nprint(issubclass(Poodle, Animal))  # True - even two levels up\nprint(issubclass(Animal, Dog))      # False - not the other way around\n```\n\nOverriding `__init__` without calling `super().__init__()` at all — rather than just forgetting an argument — is worth seeing explicitly, since the resulting bug (a missing attribute, not an immediate crash) can be genuinely confusing to track down:\n```python\nclass Animal:\n    def __init__(self, name, sound):\n        self.name = name\n        self.sound = sound\n\n    def speak(self):\n        print(f\"{self.name} says {self.sound}\")\n\nclass BrokenDog(Animal):\n    def __init__(self, name):\n        self.name = name   # forgot super().__init__() entirely - self.sound never gets set\n\nrex = BrokenDog(\"Rex\")\nrex.speak()   # AttributeError: 'BrokenDog' object has no attribute 'sound'\n```\nThe error doesn't happen at *creation* time — `BrokenDog(\"Rex\")` runs just fine — it only surfaces later, the moment something actually tries to use `self.sound`. This delay between cause and symptom is exactly why \"always call `super().__init__()` when overriding it\" is worth treating as a firm habit, not just a suggestion.\n\nA quick note: Python technically allows a class to inherit from *more than one* parent at once (called multiple inheritance) — it's a real feature, but the rules for resolving conflicts between multiple parents get genuinely subtle, and it's uncommon enough in everyday code that we won't go further into it in this book.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `super().__init__(...)` when overriding `__init__`.** Without it, the parent class's setup never runs — any attributes the parent's `__init__` was supposed to set simply won't exist, often causing an `AttributeError` later when something tries to use them.\n- **Overriding a method and accidentally losing the original behavior entirely, when you actually meant to extend it.** If you want the parent's behavior to still happen *in addition* to your new code, call `super().method_name()` inside your override — don't just replace it silently unless that's genuinely the intent.\n- **Confusing `isinstance(x, SomeClass)` with `type(x) == SomeClass`.** `isinstance()` correctly recognizes a subclass as also being an instance of its parent; comparing `type()` directly does not — prefer `isinstance()` almost always.\n- **Forgetting `super()` chains through every level of inheritance, not just one.** In a three-level chain, `super()` in the child calls the *immediate* parent's method — which may itself call `super()` again, continuing up the chain, as shown above with `Poodle` → `Dog` → `Animal`.\n- **Overriding a method and forgetting to override the properties/attributes it depends on.** If a parent's method reads `self.sound`, a subclass that never sets `self.sound` (directly, or via `super().__init__()`) will raise an `AttributeError` the moment that inherited method actually runs — inheritance gives you the *method*, not automatically the data it needs.\n\n### How this connects\n\nInheritance is how real class hierarchies get built without duplicating code — and the dunder methods in the next chapter are frequently the exact things you'll override when customizing how your own classes behave.\n\n### Quick recap\n\n- `class Child(Parent):` inherits all of `Parent`'s attributes and methods.\n- Overriding a method in the child replaces the parent's version for instances of the child.\n- `super().method(...)` calls the parent's version — commonly used inside `__init__` to reuse shared setup.\n- `isinstance(obj, SomeClass)` correctly accounts for inheritance; prefer it over comparing `type()` directly.\n- `issubclass(Child, Parent)` checks the same relationship directly between two classes, not an instance and a class.\n- `super()` works in any overridden method, not just `__init__`, and chains through multiple levels of inheritance."}, {"id": "6.5", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 5, "slug": "dunder-methods-special-behavior", "fullTitle": "Chapter 6.5: Dunder Methods & Special Behavior", "title": "Dunder Methods & Special Behavior", "md": "### Why this matters\n\nEver wondered how `len(my_list)` or `my_list + other_list` actually work under the hood? Special methods (nicknamed \"dunder\" methods, for their **d**ouble **under**scores) are how your own classes can plug into Python's built-in behaviors — printing, comparison, length, and more.\n\n### The core idea\n\nA **dunder method** is a method with a reserved name like `__init__`, `__str__`, or `__eq__`, that Python calls automatically in specific situations — never named or called directly by you, but triggered by built-in functions or operators.\n\n### Examples\n\n`__str__` — controls what `print()` and `str()` show for your object. Without it, you get an unhelpful default:\n```python\nclass Dog:\n    def __init__(self, name):\n        self.name = name\n\nrex = Dog(\"Rex\")\nprint(rex)   # <__main__.Dog object at 0x...> - not very useful\n\nclass Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def __str__(self):\n        return f\"Dog named {self.name}\"\n\nrex = Dog(\"Rex\")\nprint(rex)   # Dog named Rex - much better\n```\n\n`__repr__` — similar, but meant for an unambiguous, developer-facing representation (shown, for instance, when you inspect a value directly in the REPL, or inside a list):\n```python\nclass Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def __repr__(self):\n        return f\"Dog({self.name!r})\"\n\ndogs = [Dog(\"Rex\"), Dog(\"Fido\")]\nprint(dogs)   # [Dog('Rex'), Dog('Fido')] - __repr__ is used when printing a list of them\n```\n\n`__eq__` — controls what `==` means for your objects (without it, `==` just checks if they're the exact same object, like `is`):\n```python\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\np1 = Point(1, 2)\np2 = Point(1, 2)\nprint(p1 == p2)   # True - without __eq__, this would be False (different objects)\n```\n\n`__len__` and `__add__` — plugging into `len()` and `+`:\n```python\nclass Playlist:\n    def __init__(self, songs):\n        self.songs = songs\n\n    def __len__(self):\n        return len(self.songs)\n\n    def __add__(self, other):\n        return Playlist(self.songs + other.songs)\n\nmorning = Playlist([\"Song A\", \"Song B\"])\nevening = Playlist([\"Song C\"])\nprint(len(morning))            # 2\ncombined = morning + evening\nprint(len(combined))            # 3\n```\n\n`__lt__` (\"less than\") is the one that matters most for something you already know well: without it, `sorted()` (Chapter 3.6) has no idea how to order your objects and raises a `TypeError`. Defining it is what makes your own class sortable:\n```python\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):\n        return f\"Point({self.x}, {self.y})\"\n\n    def __lt__(self, other):\n        return (self.x, self.y) < (other.x, other.y)\n\npoints = [Point(2, 1), Point(1, 5), Point(1, 2)]\nprint(sorted(points))   # [Point(1, 2), Point(1, 5), Point(2, 1)]\n```\n\n`__getitem__` lets your object support `obj[index]`, the same square-bracket syntax you've used on strings, lists, and dictionaries since Part II:\n```python\nclass Playlist:\n    def __init__(self, songs):\n        self.songs = songs\n\n    def __getitem__(self, index):\n        return self.songs[index]\n\nmorning = Playlist([\"Song A\", \"Song B\", \"Song C\"])\nprint(morning[0])    # Song A\nprint(morning[-1])    # Song C\n```\n\n`__bool__` controls how your object behaves in a truthy/falsy context (Chapter 1.5) — without it, every instance of your class is truthy by default, but you can override that for objects that have a natural \"empty\" state:\n```python\nclass Playlist:\n    def __init__(self, songs):\n        self.songs = songs\n\n    def __bool__(self):\n        return len(self.songs) > 0   # falsy when there are no songs\n\nempty = Playlist([])\nfull = Playlist([\"Song A\"])\nprint(bool(empty))    # False\nprint(bool(full))       # True\nif empty:\n    print(\"Has songs\")\nelse:\n    print(\"Playlist is empty\")   # this branch runs, thanks to __bool__\n```\n\n`__contains__` plugs directly into the `in` operator (Chapter 3.1), letting your own objects support membership testing exactly like a list, string, or dictionary:\n```python\nclass Playlist:\n    def __init__(self, songs):\n        self.songs = songs\n\n    def __contains__(self, song):\n        return song in self.songs\n\nplaylist = Playlist([\"Song A\", \"Song B\"])\nprint(\"Song A\" in playlist)    # True - triggers __contains__ automatically\nprint(\"Song Z\" in playlist)     # False\n```\n\n### ⚠️ Common Mistakes\n\n- **Calling a dunder method directly, like `rex.__str__()`.** It works, but it's not the point — dunder methods exist to be triggered *automatically* by `print()`, `str()`, `==`, `len()`, and so on. Use those instead.\n- **Defining `__eq__` but forgetting objects are no longer usable as dictionary keys or set members without also defining `__hash__`.** This is a genuinely advanced edge case — if you hit a `TypeError: unhashable type` after adding `__eq__`, that's why; it's beyond this book's scope to fix, but good to recognize.\n- **Expecting `__repr__` and `__str__` to always both need defining separately.** If you only define `__repr__`, Python falls back to using it for `str()` and `print()` too — many simple classes only bother with `__repr__` for exactly this reason.\n- **Forgetting `!r` in an f-string calls `repr()` on the value instead of `str()`.** This is why `Dog({self.name!r})` above produces quoted output (`Dog('Rex')`) — useful specifically inside `__repr__`, where showing quotes around a string makes the representation unambiguous.\n- **Trying to `sorted()` custom objects without defining `__lt__`.** Without it, Python has no rule for comparing two instances of your class, and raises `TypeError: '<' not supported between instances of ...`.\n\n### How this connects\n\nDunder methods are how your own classes start feeling like \"real\" Python types — printable, comparable, usable with built-in functions — exactly like the strings, lists, and dictionaries you've used since Part II.\n\n### Quick recap\n\n- `__str__` controls `print()`/`str()` output; `__repr__` controls the unambiguous, developer-facing representation.\n- `__eq__` controls what `==` means for your objects; without it, `==` behaves like `is`.\n- `__len__` and `__add__` (among many others) let your objects work with `len()` and `+`.\n- Dunder methods are triggered automatically by built-ins and operators — you rarely call them directly.\n- `__lt__` makes your objects sortable with `sorted()`; `__getitem__` makes them support `obj[index]`."}, {"id": "6.6", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 6, "slug": "dataclasses-the-modern-shortcut", "fullTitle": "Chapter 6.6: Dataclasses: The Modern Shortcut", "title": "Dataclasses: The Modern Shortcut", "md": "### Why this matters\n\nA huge share of classes you'll write are really just \"a bundle of related data\" — a point, a person, a product — needing little more than `__init__` and maybe `__eq__`/`__repr__`. Writing all of that by hand, every time, is repetitive. `dataclasses` (built into the standard library since Python 3.7) removes almost all of that boilerplate.\n\n### The core idea\n\nThe `@dataclass` decorator, applied to a class, automatically generates `__init__`, `__repr__`, and `__eq__` for you, based on a simple list of annotated attributes — no manual constructor required.\n\n### Examples\n\nThe manual way you already know, versus the dataclass shortcut:\n```python\n# The way you've been writing it (Chapter 6.2):\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):\n        return f\"Point(x={self.x}, y={self.y})\"\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n```\n```python\n# The dataclass shortcut - does exactly the same thing:\nfrom dataclasses import dataclass\n\n@dataclass\nclass Point:\n    x: int\n    y: int\n\np1 = Point(1, 2)\np2 = Point(1, 2)\nprint(p1)            # Point(x=1, y=2) - __repr__ generated automatically\nprint(p1 == p2)       # True - __eq__ generated automatically\n```\nThe `x: int` and `y: int` lines are **type-annotated attributes** (a preview of Chapter 7.5) — they tell `@dataclass` what fields to build the constructor from.\n\nDefault values work naturally, just like function parameters:\n```python\n@dataclass\nclass Product:\n    name: str\n    price: float\n    in_stock: bool = True\n\nitem = Product(\"Widget\", 9.99)\nprint(item)   # Product(name='Widget', price=9.99, in_stock=True)\n```\n\nFor a mutable default (a list, dict, or set), the trap from Chapters 2.8/4.3 still applies — `@dataclass` actually refuses a bare mutable default outright, forcing you to use `field(default_factory=list)` instead, which builds a fresh one per instance:\n```python\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass Playlist:\n    name: str\n    songs: list = field(default_factory=list)   # a FRESH list per instance\n\nmorning = Playlist(\"Morning Mix\")\nevening = Playlist(\"Evening Mix\")\nmorning.songs.append(\"Song A\")\nprint(morning.songs)   # ['Song A']\nprint(evening.songs)     # [] - correctly independent\n```\n\nTwo useful options to `@dataclass` itself: `frozen=True` makes instances immutable after creation (like a tuple), and `order=True` automatically generates comparison methods (`__lt__` and friends, from Chapter 6.5) so instances become sortable, based on comparing all the fields in order:\n```python\n@dataclass(frozen=True, order=True)\nclass Point:\n    x: int\n    y: int\n\np = Point(1, 2)\np.x = 99   # FrozenInstanceError - frozen instances can't be modified\n\npoints = [Point(2, 1), Point(1, 5)]\nprint(sorted(points))   # [Point(x=1, y=5), Point(x=2, y=1)] - order=True made this possible\n```\n\nDataclasses can inherit from each other exactly like ordinary classes (Chapter 6.4) — a subclass dataclass automatically gets the parent's fields, and can add its own:\n```python\n@dataclass\nclass Animal:\n    name: str\n    sound: str\n\n@dataclass\nclass Dog(Animal):\n    breed: str = \"Unknown\"\n\nrex = Dog(name=\"Rex\", sound=\"Bark\", breed=\"Labrador\")\nprint(rex)   # Dog(name='Rex', sound='Bark', breed='Labrador')\n```\n\nA dataclass field can also be excluded from the auto-generated `__repr__` and `__eq__` — useful for something like an internal cache value that shouldn't be part of the object's \"identity\" or displayed representation:\n```python\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass User:\n    username: str\n    password_hash: str = field(repr=False)   # excluded from __repr__ specifically\n\nuser = User(\"ava\", \"a1b2c3...\")\nprint(user)   # User(username='ava') - password_hash is hidden from the printed representation\n```\n\nYou can still add your own methods normally — `@dataclass` only generates the \"boilerplate\" ones, it doesn't stop you from writing more:\n```python\n@dataclass\nclass Product:\n    name: str\n    price: float\n\n    def display_price(self):\n        return f\"${self.price:.2f}\"\n\nitem = Product(\"Widget\", 9.99)\nprint(item.display_price())   # $9.99\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting the type annotations.** `@dataclass` uses the presence of `name: type` annotations to figure out what fields to generate a constructor for — a plain `x = 0` (no annotation) inside a dataclass body is treated as a class-level default, not a per-instance field, which isn't what most people expect.\n- **Using a mutable default value directly, exactly like the trap from Chapters 2.8/4.3.** `in_stock: list = []` raises an error specifically *because* dataclasses protect against the shared-mutable-default bug — you're required to use `field(default_factory=list)` from the `dataclasses` module instead, for defaults that are lists/dicts/sets.\n- **Reaching for `@dataclass` for a class that needs a lot of custom validation or complex behavior beyond simple data storage.** It's a shortcut for the *common*, simple case — for anything needing careful validation (like the `Circle` property example in Chapter 6.3), writing `__init__` by hand still gives you more control.\n- **Forgetting `frozen=True` instances can't be modified at all, even from inside their own methods.** Any attempted assignment, even `self.x = 5` inside a method you wrote yourself, raises `FrozenInstanceError`.\n\n### How this connects\n\nYou've now completed the full \"Chapters\" toolkit — from a bare-bones class all the way to this modern shortcut. Part VII moves on to writing all of this *well* — Pythonic idioms, comprehensions, and more.\n\n### Quick recap\n\n- `@dataclass` auto-generates `__init__`, `__repr__`, and `__eq__` from a list of annotated attributes.\n- `field_name: type` (with an optional `= default`) defines each field.\n- For mutable defaults (lists, dicts), use `field(default_factory=list)` instead of a bare `[]`.\n- `frozen=True` makes instances immutable; `order=True` auto-generates comparison methods so instances become sortable.\n- Still a normal class underneath — you can add your own methods freely."}, {"id": "6.7", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 7, "slug": "enum-naming-a-fixed-set-of-options", "fullTitle": "Chapter 6.7: Enum: Naming a Fixed Set of Options", "title": "Enum: Naming a Fixed Set of Options", "md": "### Why this matters\n\nPlenty of real-world data is naturally \"one of a small, fixed set of options\" — a traffic light is red, yellow, or green; an order is pending, shipped, or delivered. Representing that with plain strings (`\"pending\"`, `\"shipped\"`) works, but nothing stops a typo (`\"pendign\"`) from silently sneaking through, since Python has no way to know those strings were ever supposed to be limited to a specific set. `enum.Enum` fixes exactly that.\n\n### The core idea\n\nAn **enum** (short for enumeration) is a class where each attribute is a distinct, named constant. Unlike a plain string or number, misspelling a member name is caught immediately, as a real error, rather than silently producing a wrong-but-valid-looking value.\n\n### Examples\n\nDefining and using a basic enum:\n```python\nfrom enum import Enum\n\nclass TrafficLight(Enum):\n    RED = 1\n    YELLOW = 2\n    GREEN = 3\n\ncurrent = TrafficLight.RED\nprint(current)          # TrafficLight.RED\nprint(current.name)      # RED\nprint(current.value)      # 1\n```\n\nComparing enum members — this is exactly where the safety comes from:\n```python\nif current == TrafficLight.RED:\n    print(\"Stop!\")\n\n# TrafficLight.RRED   # AttributeError: RRED - a typo like this is caught immediately,\n                        # unlike comparing against a misspelled plain string, which just\n                        # silently produces a wrong-but-valid-looking value with no error at all\n```\n\nEach member is a genuine singleton — there's only ever one `TrafficLight.RED` object in the whole program, so `is` works reliably for comparison too (though `==` is still the conventional, more readable choice):\n```python\nprint(TrafficLight.RED is TrafficLight.RED)   # True\nprint(TrafficLight.RED is TrafficLight.GREEN)  # False\n```\n\nLooping over every member of an enum:\n```python\nfor light in TrafficLight:\n    print(light.name, light.value)\n# RED 1\n# YELLOW 2\n# GREEN 3\n```\n\nIf you don't actually care about the specific underlying values, `auto()` assigns them for you, starting at 1:\n```python\nfrom enum import Enum, auto\n\nclass Status(Enum):\n    PENDING = auto()\n    SHIPPED = auto()\n    DELIVERED = auto()\n\nprint(Status.SHIPPED.value)   # 2\n```\n\nEnums can also carry more complex values than simple integers, and can define their own methods, exactly like a regular class:\n```python\nclass Direction(Enum):\n    NORTH = (0, 1)\n    SOUTH = (0, -1)\n    EAST = (1, 0)\n    WEST = (-1, 0)\n\n    def describe(self):\n        dx, dy = self.value\n        return f\"{self.name}: move ({dx}, {dy})\"\n\nprint(Direction.NORTH.describe())   # NORTH: move (0, 1)\n```\n\nComparing two different enum classes' members, even if their underlying values happen to match, correctly returns `False` — each enum class is genuinely its own distinct type, not just a wrapper around plain numbers:\n```python\nclass Status(Enum):\n    ACTIVE = 1\n\nclass Priority(Enum):\n    LOW = 1\n\nprint(Status.ACTIVE == Priority.LOW)   # False - different enum classes, even with the same value\nprint(Status.ACTIVE.value == Priority.LOW.value)   # True - the raw values ARE equal\n```\n\nUsing an enum as a function parameter reads far more clearly than an unconstrained string ever could:\n```python\ndef describe_order(status: Status):\n    if status == Status.PENDING:\n        return \"Still processing.\"\n    elif status == Status.SHIPPED:\n        return \"On its way!\"\n    else:\n        return \"Delivered.\"\n\nprint(describe_order(Status.SHIPPED))   # On its way!\n```\n\n### ⚠️ Common Mistakes\n\n- **Comparing an enum member directly to its raw value.** `TrafficLight.RED == 1` is `False` — a plain `Enum` member is not automatically equal to its underlying value. If you specifically need that, `IntEnum` (a variant built for exactly this) makes `TrafficLight.RED == 1` `True`.\n- **Trying to create a new instance the normal way.** `TrafficLight(1)` actually works — it looks up the existing member with that value (`TrafficLight.RED`) rather than creating a new one — but writing `TrafficLight.RED = \"something else\"` to change a member is not something you should ever do; enum members are meant to be fixed constants.\n- **Using `auto()` and assuming the values mean something specific.** They're just sequential integers starting at 1, an implementation detail — don't rely on their exact numbers meaning anything beyond \"distinct and ordered.\"\n- **Reaching for plain strings out of habit when the data is genuinely a fixed, closed set of options.** That's precisely the situation `Enum` was built for — the earlier a typo is caught, the better.\n\n### How this connects\n\nThis is a small addition to your OOP toolkit (Part VI) that pays for itself anywhere you'd otherwise reach for a handful of magic strings or numbers — genuinely common in real code, from configuration options to state machines.\n\n### Quick recap\n\n- `class Name(Enum):` with class-level attributes defines a fixed set of named, safe constants.\n- `.name` and `.value` access a member's name and underlying value.\n- Enum members are singletons — `is` and `==` both work reliably for comparison.\n- `for member in EnumClass:` iterates every member; `auto()` assigns sequential values automatically.\n- `IntEnum` makes members directly comparable to plain integers, if you specifically need that."}, {"id": "6.8", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 8, "slug": "writing-your-own-iterator-class", "fullTitle": "Chapter 6.8: Writing Your Own Iterator Class (`__iter__` / `__next__`)", "title": "Writing Your Own Iterator Class (`__iter__` / `__next__`)", "md": "### Why this matters\n\nEvery `for` loop you've ever written — over a list, a string, a dictionary — relies on a protocol working quietly underneath it. Chapter 7.2 shows the easy, modern way to build something loopable (a generator function). This chapter shows what a `for` loop is actually *doing* under the hood, by building the same thing the manual way, with a class.\n\n### The core idea\n\nAn object is **iterable** if it has an `__iter__` method, which returns an **iterator**. An iterator has both `__iter__` (which, by convention, returns itself) and `__next__`, which produces the next value each time it's called — and raises `StopIteration` when there's nothing left.\n\n### Examples\n\nA `for` loop over a list is really doing this, manually, behind the scenes:\n```python\nnumbers = [10, 20, 30]\niterator = iter(numbers)          # calls numbers.__iter__()\nprint(next(iterator))               # calls iterator.__next__() -> 10\nprint(next(iterator))                # 20\nprint(next(iterator))                 # 30\nprint(next(iterator))                  # raises StopIteration - nothing left\n```\n`for number in numbers:` is exactly this loop — call `iter()` once, then call `next()` repeatedly until `StopIteration`, catching it silently to end the loop.\n\nBuilding your own iterator class means implementing both methods yourself:\n```python\nclass Countdown:\n    def __init__(self, start):\n        self.current = start\n\n    def __iter__(self):\n        return self             # this object IS its own iterator\n\n    def __next__(self):\n        if self.current <= 0:\n            raise StopIteration\n        value = self.current\n        self.current -= 1\n        return value\n\nfor number in Countdown(3):\n    print(number)\n# 3\n# 2\n# 1\n```\n\nBecause `Countdown` returns `self` from `__iter__`, it can only be looped through **once** — its state (`self.current`) is exhausted after the first pass:\n```python\ncountdown = Countdown(3)\nprint(list(countdown))   # [3, 2, 1]\nprint(list(countdown))    # [] - already exhausted, nothing left to give\n```\nThis is a genuinely important distinction: a **re-usable iterable** (like a list, which you can loop over as many times as you like) needs `__iter__` to return a *fresh* iterator object each time it's called, rather than `self`. A plain list accomplishes this by being iterable without being an iterator itself — `iter(numbers)` builds a brand-new list-iterator object every time, leaving the original list untouched and re-loopable.\n\nHere's `Countdown` fixed to be re-usable, by separating the iterable from its iterator:\n```python\nclass Countdown:\n    def __init__(self, start):\n        self.start = start\n\n    def __iter__(self):\n        return CountdownIterator(self.start)   # a FRESH iterator every time\n\nclass CountdownIterator:\n    def __init__(self, current):\n        self.current = current\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.current <= 0:\n            raise StopIteration\n        value = self.current\n        self.current -= 1\n        return value\n\ncountdown = Countdown(3)\nprint(list(countdown))   # [3, 2, 1]\nprint(list(countdown))    # [3, 2, 1] - re-usable this time, since each loop gets a fresh iterator\n```\n\nAn iterator class can hold and update more complex state than a simple counter — walking through a linked structure, filtering as it goes, or tracking multiple pieces of information between calls:\n```python\nclass EvenNumbers:\n    def __init__(self, numbers):\n        self.numbers = numbers\n        self.index = 0\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        while self.index < len(self.numbers):\n            value = self.numbers[self.index]\n            self.index += 1\n            if value % 2 == 0:\n                return value\n        raise StopIteration\n\nfor n in EvenNumbers([1, 2, 3, 4, 5, 6, 7]):\n    print(n)\n# 2\n# 4\n# 6\n```\nNotice the `while` loop *inside* `__next__` — it's perfectly normal for one call to `__next__` to skip over several source items before finding (and returning) the next one that actually qualifies, which is exactly how a filtering iterator like this works.\n\nPython's built-in `for` loop, `list()`, `sum()`, and dozens of other tools all work on *any* object implementing this protocol — meaning your custom iterator class, once written, is automatically compatible with the entire rest of the language, with zero extra work:\n```python\nnumbers = EvenNumbers([1, 2, 3, 4, 5, 6])\nprint(list(numbers))        # [2, 4, 6] - list() just calls __iter__/__next__ until StopIteration\nprint(sum(EvenNumbers([1, 2, 3, 4])))   # 6 - sum() does the exact same thing internally\n```\n\n### ⚠️ Common Mistakes\n\n- **Forgetting to raise `StopIteration` in `__next__`.** Without it, calling `next()` (or a `for` loop relying on it) never ends — it keeps trying to produce values forever, since nothing ever signals \"done.\"\n- **Making `__iter__` return `self` on something meant to be looped over multiple times.** This works fine for a single pass but silently produces empty results on a second loop — exactly the trap shown above with the first `Countdown` version.\n- **Confusing \"iterable\" with \"iterator.\"** Every iterator is iterable (its `__iter__` returns itself), but not every iterable is its own iterator — a list is iterable, but `iter(some_list)` returns a separate list-iterator object, not the list itself.\n\n### How this connects\n\nThis is the manual, from-scratch version of exactly what Chapter 7.2's generator functions give you for free, far more concisely — understanding this protocol makes generators click faster, since a generator function is really just a compact, automatic way of building a class shaped like this.\n\n### Quick recap\n\n- Iterable: has `__iter__`, which returns an iterator. Iterator: has both `__iter__` (returning itself) and `__next__`.\n- `for x in obj:` is shorthand for calling `iter(obj)` once, then `next()` repeatedly until `StopIteration`.\n- If `__iter__` returns `self`, the object can only be looped over once — its state gets exhausted.\n- A re-usable iterable separates itself from its iterator, returning a fresh iterator object from `__iter__` every time."}, {"id": "6.9", "partNum": 6, "partTitle": "Part VI — Chapters", "partMetaphor": "structuring many paragraphs: object-oriented programming", "chapNum": 9, "slug": "abstract-base-classes-and-protocols", "fullTitle": "Chapter 6.9: Abstract Base Classes & Protocols", "title": "Abstract Base Classes & Protocols", "md": "### Why this matters\n\nPython is famous for **duck typing**: *\"If it walks like a duck and quacks like a duck, it's a duck.\"* Most of the time, this flexibility is Python's greatest superpower. But in larger programs, informal assumptions can lead to surprises: what happens when someone writes a class that forgets one crucial method, and you only discover the missing method hours later in the middle of running a live job?\n\nTo build solid architectures, you need ways to establish clear **contracts**:\n1. **Abstract Base Classes (ABCs):** *\"You must inherit from me and implement these specific methods, or Python will refuse to let you create an instance.\"*\n2. **Protocols:** *\"I don't care who your parent class is or where you come from — as long as you provide these methods, you satisfy the contract.\"*\n\n### The core idea\n\n- **`abc.ABC` (Nominal Subtyping):** Defines an explicit class blueprint. By decorating methods with `@abstractmethod`, you declare what subclasses *must* provide. Python actively prevents any subclass from being instantiated until every single abstract method is implemented.\n- **`typing.Protocol` (Structural Subtyping):** Formalizes duck typing for modern Python. Instead of forcing classes into an inheritance hierarchy, a `Protocol` defines an expected interface. Any class that implements the required methods automatically matches the protocol — no `class MyClass(SomeParent):` required!\n\n### Examples\n\nBuilding an Abstract Base Class to enforce an interface:\n\n```python\nfrom abc import ABC, abstractmethod\n\nclass NotificationService(ABC):\n    \"\"\"Abstract contract for sending notifications.\"\"\"\n\n    @abstractmethod\n    def send(self, recipient: str, message: str):\n        \"\"\"All subclasses MUST implement this method.\"\"\"\n        pass\n\n    @abstractmethod\n    def get_provider_name(self) -> str:\n        \"\"\"Return the name of the notification provider.\"\"\"\n        pass\n\n\n# 1. Trying to instantiate the abstract class directly fails immediately:\ntry:\n    service = NotificationService()\nexcept TypeError as error:\n    print(\"Cannot instantiate ABC:\", error)\n    # Cannot instantiate ABC: Can't instantiate abstract class NotificationService with abstract methods get_provider_name, send\n```\n\nWhat happens when a subclass forgets an abstract method:\n\n```python\nclass BrokenEmailService(NotificationService):\n    def send(self, recipient: str, message: str):\n        print(f\"Sending email to {recipient}: {message}\")\n    # Forgot get_provider_name()!\n\ntry:\n    broken = BrokenEmailService()\nexcept TypeError as error:\n    print(\"Incomplete subclass caught at creation time:\", error)\n    # Incomplete subclass caught at creation time: Can't instantiate abstract class BrokenEmailService with abstract method get_provider_name\n```\nNotice the safety guarantee: the error occurs the moment you try to create `BrokenEmailService()`, before your code ever attempts to call the missing method!\n\nA complete, working concrete subclass:\n\n```python\nclass EmailService(NotificationService):\n    def send(self, recipient: str, message: str):\n        print(f\"Email sent to {recipient}: {message}\")\n\n    def get_provider_name(self) -> str:\n        return \"FastMail SMTP\"\n\nclass SmsService(NotificationService):\n    def send(self, recipient: str, message: str):\n        print(f\"SMS sent to {recipient}: {message}\")\n\n    def get_provider_name(self) -> str:\n        return \"Twilio Gateway\"\n\ndef notify_user(service: NotificationService, user: str, msg: str):\n    print(f\"Using provider: {service.get_provider_name()}\")\n    service.send(user, msg)\n\nemail = EmailService()\nnotify_user(email, \"ada@example.com\", \"Your report is ready!\")\n# Using provider: FastMail SMTP\n# Email sent to ada@example.com: Your report is ready!\n```\n\n**Protocols: Duck typing with structure and elegance.**\nNotice how the classes below do **not** inherit from `Renderable` — they simply have the method:\n\n```python\nfrom typing import Protocol, runtime_checkable\n\n@runtime_checkable  # Allows isinstance() checks at runtime!\nclass Renderable(Protocol):\n    def render(self) -> str:\n        \"\"\"Any object with a render() method returning str satisfies this protocol.\"\"\"\n        ...\n\nclass MarkdownDocument:\n    def __init__(self, text):\n        self.text = text\n\n    def render(self) -> str:\n        return f\"<p>{self.text}</p>\"\n\nclass ChartWidget:\n    def __init__(self, data):\n        self.data = data\n\n    def render(self) -> str:\n        return f\"<chart values='{self.data}' />\"\n\nclass Dog:\n    def bark(self):\n        print(\"Woof!\")\n\n# A function that expects anything satisfying the Renderable protocol:\ndef publish(item: Renderable):\n    print(\"Publishing:\", item.render())\n\ndoc = MarkdownDocument(\"Hello world\")\nchart = ChartWidget([10, 20, 30])\ndog = Dog()\n\npublish(doc)    # Publishing: <p>Hello world</p>\npublish(chart)  # Publishing: <chart values='[10, 20, 30]' />\n\n# Thanks to @runtime_checkable, isinstance checks work seamlessly:\nprint(\"doc is Renderable?\", isinstance(doc, Renderable))      # True\nprint(\"chart is Renderable?\", isinstance(chart, Renderable))  # True\nprint(\"dog is Renderable?\", isinstance(dog, Renderable))      # False\n```\n\n### ⚠️ Common Mistakes\n\n- **Inheriting from `ABC` but forgetting `@abstractmethod`.** Simply writing `class Base(ABC): def run(self): pass` does not make `Base` abstract. Without `@abstractmethod`, Python treats `run()` as a normal concrete method and will gladly let anyone instantiate `Base` directly.\n- **Overusing deep ABC inheritance hierarchies.** ABCs are for enforcing interfaces, not for building 6-level-deep inheritance trees. If multiple classes share functionality, favor composition or helper functions over sprawling inheritance.\n- **Expecting `@runtime_checkable` to inspect parameter types at runtime.** When you decorate a `Protocol` with `@runtime_checkable`, `isinstance(obj, MyProtocol)` checks whether the required method and attribute *names* exist — it does not evaluate type annotations or parameter signatures at runtime.\n- **Forgetting that abstract methods can actually have code.** You can provide a default implementation inside an abstract method and call it via `super().method()` in child classes. The `@abstractmethod` decorator only requires that the child class explicitly overrides it.\n\n### How this connects\n\nABCs and Protocols complete the object-oriented foundation built in Chapter 6.1 (Classes), Chapter 6.4 (Inheritance), and Chapter 6.8 (Custom Iterators — which are themselves instances of `collections.abc.Iterator`). They form the bridge to the type annotation system covered in Chapter 7.5 and Chapter 7.8.\n\n### Quick recap\n\n- `from abc import ABC, abstractmethod`: creates an Abstract Base Class.\n- A class with un-overridden `@abstractmethod` definitions cannot be instantiated; attempting to do
