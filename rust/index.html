ry point is `fn main() { ... }`.\n- `println!` is a macro (note the `!`), not an ordinary function — it prints its argument plus a trailing newline.\n- Rust's compiler errors are specific and often self-correcting, naming the exact file/line/column and frequently suggesting the exact fix.\n- `rustc --explain <error-code>` gives a fuller, offline explanation of any numbered compiler error."}, {"id": "1.2", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 2, "slug": "cargo-creating-building-running-projects", "fullTitle": "Cargo: Creating, Building & Running Projects", "title": "Cargo: Creating, Building & Running Projects", "md": "### Why this matters\n\nChapter 0.2 used `cargo new`/`run`/`check` briefly to confirm the environment worked. This chapter covers `cargo` properly — the tool essentially every real Rust project, including every remaining chapter in this book, is built around.\n\n### The core idea\n\n`cargo` is Rust's build tool, package manager, and project scaffolder, all in one. A `cargo` project (a **package**) is defined by a `Cargo.toml` manifest file, and `cargo`'s subcommands (`new`, `build`, `run`, `check`) handle everything from creating that structure to compiling and running it.\n\n### Examples\n\n**1. `cargo new` — scaffolding a complete, working project.**\n```\n$ cargo new greeter --bin\n```\nOutput:\n```\n    Creating binary (application) `greeter` package\n```\nThis creates a real directory structure:\n```\ngreeter/\n├── Cargo.toml\n├── .gitignore\n└── src/\n    └── main.rs\n```\n`--bin` (an executable program) is actually the default if omitted — `cargo new greeter` alone produces the identical result; the flag is shown here just to be explicit about what's being created. `cargo new` also initializes a real git repository automatically, with a `.gitignore` already containing `/target` — the one directory you genuinely never want to commit, since it's entirely regenerable build output.\n\n**2. `Cargo.toml` — the manifest every cargo command reads.**\n```toml\n[package]\nname = \"greeter\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\n```\n`[package]` describes the project itself — its name (used when compiling and, later, when publishing), version, and edition (Chapter 0.2 already flagged `2024` as this book's confirmed default). `[dependencies]` starts empty here; Chapter 7.6 onward shows real crates added here as this book's examples genuinely need them.\n\n**3. `cargo build` and `cargo run` — compiling, and compiling-then-running.**\n```rust\n// src/main.rs\nfn main() {\n    println!(\"Building with cargo!\");\n}\n```\n```\n$ cargo build\n```\nOutput:\n```\n   Compiling greeter v0.1.0 (/path/to/greeter)\n    Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.14s\n```\nThe compiled binary lands in `target/debug/greeter` — runnable directly:\n```\n$ ./target/debug/greeter\nBuilding with cargo!\n```\n`cargo run` does both steps at once — build, then immediately run — and is genuinely the more common command day to day, since you almost always want to see the program's output right away.\n\n**4. `cargo` only rebuilds when something actually changed — confirmed directly.**\n```\n$ cargo run\n```\nOutput (running again, immediately, with no source changes):\n```\n    Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.01s\n     Running `target/debug/greeter`\nBuilding with cargo!\n```\nNotice `Compiling` is genuinely absent this time — `cargo` tracks whether the source has changed since the last build and skips recompiling entirely when it hasn't, confirmed here by the near-instant `0.01s` versus the first build's `0.14s`. This matters more the larger a real project gets; recompiling everything from scratch on every single run would be a real, unnecessary cost.\n\n**5. `cargo build --release` — an optimized build, in its own separate directory.**\n```\n$ cargo build --release\n```\nOutput:\n```\n   Compiling greeter v0.1.0 (/path/to/greeter)\n    Finished `release` profile [optimized] target(s) in 0.11s\n```\nThe release binary lands in a genuinely separate location, `target/release/greeter` — a debug build and a release build never overwrite each other. Release builds apply real compiler optimizations (and skip debug info), producing a faster but slower-to-compile binary — the standard choice for anything you'd actually ship, versus the debug profile's faster compile times during ordinary development.\n\n### ⚠️ Common Mistakes\n\n- **Committing the `target/` directory to version control.** It's large, fully regenerable from source via `cargo build`, and `cargo new`'s own `.gitignore` already excludes it by default for exactly this reason.\n- **Shipping or benchmarking a debug build.** As Example 5 showed, `--release` genuinely applies optimizations a plain `cargo build`/`cargo run` does not — a debug build's performance is not representative of what the same code actually runs at once optimized.\n- **Running `cargo build` repeatedly out of habit when `cargo run` would save a step**, or reaching for `cargo run` when only checking that code compiles (`cargo check`, Chapter 0.2) is actually needed and faster.\n\n### How this connects\n\nChapter 4.1's modules and Chapter 6.1's growing-project organization both build directly on the `src/` structure `cargo new` created here. Chapter 6.5 (`cargo doc`) and Chapter 6.7 (publishing to crates.io) both extend this same `Cargo.toml`-centered workflow to documentation and distribution.\n\n### Quick recap\n\n- `cargo new <name>` scaffolds a complete project — `Cargo.toml` manifest, `src/main.rs`, and a real git repo with `target/` already ignored.\n- `cargo build` compiles; `cargo run` compiles (only if needed) and runs; `cargo check` verifies compilation without producing a full binary.\n- `cargo` skips recompiling when nothing has changed since the last build — confirmed directly by a near-instant second `cargo run`.\n- `cargo build --release` produces an optimized binary in a separate `target/release/` directory — the right choice for anything performance actually matters for."}, {"id": "1.3", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 3, "slug": "comments-program-structure", "fullTitle": "Comments & Program Structure", "title": "Comments & Program Structure", "md": "### Why this matters\n\nComments are simple, but Rust has one genuinely uncommon feature here worth meeting early, plus a real structural freedom (function ordering) that surprises anyone coming from a language that demands forward declarations.\n\n### The core idea\n\nRust has line comments (`//`), block comments (`/* ... */`), and a third kind — **doc comments** (`///`) — that are genuinely part of the language's documentation tooling, not just a stylistic variant. Functions can be defined in any order within a file; Rust doesn't require a function to be declared before it's used, unlike C.\n\n### Examples\n\n**1. Line and block comments — including a real, uncommon feature.**\n```rust\nfn main() {\n    let x = 5; // inline comment\n    println!(\"{}\", x);\n\n    /* This is a\n       block comment */\n    println!(\"after block comment\");\n\n    /* block comments /* can nest */ in Rust */\n    println!(\"nested block comment worked\");\n}\n```\nOutput:\n```\n5\nafter block comment\nnested block comment worked\n```\n`//` comments everything to the end of the line; `/* ... */` comments a span, potentially across multiple lines. The nested case genuinely compiles and runs correctly in Rust — block comments can contain other block comments, closing correctly at the matching `*/`. This is a real, uncommon feature: many languages (C, JavaScript) don't allow this and would either error or close the comment early at the first `*/` encountered.\n\n**2. Doc comments (`///`) — comments that are genuinely part of the language's tooling.**\n```rust\n/// This is a doc comment for the function below.\n/// It supports markdown.\nfn add(a: i32, b: i32) -> i32 {\n    a + b\n}\n\nfn main() {\n    println!(\"{}\", add(2, 3));\n}\n```\nOutput:\n```\n5\n```\n`///` immediately before an item (a function here) attaches documentation to it that `cargo doc` (Chapter 6.5) can turn into real, browsable HTML documentation, and that tools like `rust-analyzer` show directly in an editor's hover tooltip. A doc comment behaves like an ordinary comment for compilation purposes — it has zero effect on the program's actual behavior — but it's genuinely structured, first-class documentation, not just a note to yourself.\n\n**3. Function order doesn't matter — a real structural freedom.**\n```rust\nfn main() {\n    println!(\"{}\", helper());\n}\n\nfn helper() -> i32 {\n    42\n}\n```\nOutput:\n```\n42\n```\n`main` calls `helper` before `helper` is even defined further down the file, and this compiles and runs with no complaint at all. Rust doesn't require forward declarations the way C does — the compiler reads the whole file (and, more precisely, the whole crate) before deciding whether anything is actually missing, so a function's *position* in the file is purely a matter of what reads best to a human, never a compilation requirement.\n\n### ⚠️ Common Mistakes\n\n- **Assuming block comments behave like C's or JavaScript's, where the first `*/` always closes the comment.** As Example 1 showed, Rust's block comments genuinely nest — a real, if rarely load-bearing, difference worth knowing about rather than being surprised by.\n- **Treating a doc comment (`///`) as just a stylistic choice over a regular comment (`//`).** As Example 2 showed, it's genuinely different — it feeds real documentation tooling (`cargo doc`), and using `//` where `///` was intended silently loses that.\n- **Reordering functions in a file to \"fix\" a compile error**, when the actual problem is something else entirely. As Example 3 showed, function order is never the cause of a genuine compilation error in Rust.\n\n### How this connects\n\nChapter 6.5 (Documentation & Doc-Tests) comes back to `///` doc comments properly — including a genuinely remarkable feature: code examples inside them can be automatically compiled and run as real tests. Chapter 4.1 (Modules) is where \"what's visible from where\" becomes a real, structural question — function order within a single file, by contrast, is never structurally significant at all.\n\n### Quick recap\n\n- `//` comments to end of line; `/* ... */` comments a span and, uncommonly, genuinely nests in Rust.\n- `///` doc comments are structured documentation, consumed by `cargo doc` and editor tooling — not just a stylistic variant of `//`.\n- A function can be defined anywhere in its file (or module) relative to where it's called — Rust requires no forward declarations."}, {"id": "1.4", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 4, "slug": "variables-mutability", "fullTitle": "Variables & Mutability", "title": "Variables & Mutability", "md": "### Why this matters\n\nRust's variables are **immutable by default** — a genuinely deliberate design choice, not an oversight, and one of the first real ways Rust nudges you toward safer code before you've written a single risky line.\n\n### The core idea\n\n`let` declares a variable that cannot be reassigned unless explicitly marked `mut`. This isn't the same as a constant, either — Rust has a separate `const` for values that are truly fixed. And a third, genuinely distinct idea, **shadowing**, lets you reuse a variable name for a new binding, including one of a completely different type.\n\n### Examples\n\n**1. Variables are immutable by default — a real, compile-time error to reassign one.**\n```rust\nfn main() {\n    let x = 5;\n    println!(\"x = {}\", x);\n    x = 6;\n    println!(\"x = {}\", x);\n}\n```\nOutput:\n```\nerror[E0384]: cannot assign twice to immutable variable `x`\n --> immut.rs:4:5\n  |\n2 |     let x = 5;\n  |         - first assignment to `x`\n3 |     println!(\"x = {}\", x);\n4 |     x = 6;\n  |     ^^^^^ cannot assign twice to immutable variable\n  |\nhelp: consider making this binding mutable\n  |\n2 |     let mut x = 5;\n  |         +++\n\nerror: aborting due to 1 previous error\n```\nThis is a real, unconditional rule, not a warning — the program simply does not compile. And once again, the compiler doesn't just reject the code; it names the exact fix (`help: consider making this binding mutable`).\n\n**2. `mut` — opting a specific variable into reassignment.**\n```rust\nfn main() {\n    let mut x = 5;\n    println!(\"x = {}\", x);\n    x = 6;\n    println!(\"x = {}\", x);\n}\n```\nOutput:\n```\nx = 5\nx = 6\n```\n`mut` is part of the variable's declaration, not a type annotation — it marks *this specific binding* as reassignable. The real, deliberate design idea behind immutable-by-default: a variable you can't reassign is one less thing to track mentally while reading code — if you see a bare `let`, you already know its value never changes again, without reading any further.\n\n**3. Shadowing — reusing a name for an entirely new binding, even of a different type.**\n```rust\nfn main() {\n    let x = 5;\n    let x = x + 1;\n    let x = x * 2;\n    println!(\"x = {}\", x);\n\n    let spaces = \"   \";\n    let spaces = spaces.len();\n    println!(\"spaces = {}\", spaces);\n}\n```\nOutput:\n```\nx = 12\nspaces = 3\n```\nEach `let x = ...` creates a genuinely new variable that happens to share the old one's name — the old `x` still exists underneath (its memory isn't freed early or anything), it's just no longer reachable by that name. The second example is the real, telling case: `spaces` starts as a `&str` (a string slice, Chapter 2.6) and ends as a `usize` (`.len()`'s return type) — shadowing genuinely allows a full type change, since each `let` is a completely fresh declaration.\n\n**4. `mut`, by contrast, can never change a variable's type — a real, different error.**\n```rust\nfn main() {\n    let mut spaces = \"   \";\n    spaces = spaces.len();\n    println!(\"{}\", spaces);\n}\n```\nOutput:\n```\nerror[E0308]: mismatched types\n --> mutTypeErr.rs:3:14\n  |\n2 |     let mut spaces = \"   \";\n  |                      ----- expected due to this value\n3 |     spaces = spaces.len();\n  |              ^^^^^^^^^^^^ expected `&str`, found `usize`\n\nerror: aborting due to 1 previous error\n```\nThis is the precise, real distinction between `mut` and shadowing: `mut` lets the *value* change, but never the *type* — the variable's type is fixed the moment it's declared. Shadowing (Example 3) has no such restriction, since it's genuinely declaring a new variable each time, not mutating the old one.\n\n**5. Constants — truly fixed values, with real, different rules from `let`.**\n```rust\nconst MAX_POINTS: u32 = 100_000;\n\nfn main() {\n    println!(\"{}\", MAX_POINTS);\n}\n```\nOutput:\n```\n100000\n```\n`const` requires an explicit type annotation always (Rust never infers one) — leaving it off is a real compile error:\n```\nerror: missing type for `const` item\n --> constNoType.rs:1:17\n  |\n1 | const MAX_POINTS = 100_000;\n  |                 ^ help: provide a type for the constant: `: i32`\n```\nConstants can never be made `mut` at all — they're not just \"immutable by default\" like `let`, they're unconditionally, permanently fixed, and (unlike `let`) can be declared outside any function, at the top level of a file, as shown here. `100_000` is also worth noting directly: the underscore is purely a readability separator, with no effect on the actual value — `100_000` and `100000` are the identical number.\n\n### ⚠️ Common Mistakes\n\n- **Forgetting `mut` and being surprised by an immutability error** on code that genuinely needs to reassign a variable. As Example 1 showed, the fix is simple and the compiler names it directly — but it's worth pausing to ask *why* a value needs to change at all before reflexively adding `mut` everywhere.\n- **Confusing shadowing with mutation.** As Examples 3 and 4 showed, shadowing creates an entirely new variable (and can change type); `mut` reassigns the same variable (and cannot change type) — genuinely different mechanisms that happen to look similar at a glance.\n- **Forgetting a `const` needs an explicit type annotation.** Unlike `let`, Rust never infers one — Example 5 showed the exact, real error this produces.\n- **Trying to make a `const` mutable.** There's no such thing as `const mut` — a value that can change at all should be a `let mut` instead; `const` is for values that are genuinely, permanently fixed.\n\n### How this connects\n\nChapter 2.3 (Ownership) is where immutability starts to matter for reasons well beyond readability — an immutable binding interacts with borrowing rules in ways this chapter doesn't need yet. Chapter 1.5 introduces the actual types (`u32`, and the rest) this chapter used without formally explaining.\n\n### Quick recap\n\n- `let` bindings are immutable by default — reassigning one without `mut` is a real, compile-time error.\n- `mut` allows reassignment, but never a type change; shadowing (`let` reusing a name) creates a genuinely new variable and can change type freely.\n- `const` is unconditionally fixed (never `mut`), requires an explicit type annotation always, and can be declared outside any function.\n- Underscores in numeric literals (`100_000`) are purely a readability separator with no effect on the value."}, {"id": "1.5", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 5, "slug": "basic-scalar-types", "fullTitle": "Basic Scalar Types", "title": "Basic Scalar Types", "md": "### Why this matters\n\nRust's basic types look familiar coming from almost any language, but two things are genuinely different and worth meeting directly: integers have an exact, fixed size you choose deliberately, and integer overflow is treated as a real bug the compiler and runtime both actively try to catch — not silently wrapped the way it is in C.\n\n### The core idea\n\nRust has four scalar (single-value) type families: **integers** (signed `i8`/`i16`/`i32`/`i64`/`i128`/`isize`, and unsigned `u8`/`u16`/`u32`/`u64`/`u128`/`usize`), **floating-point** (`f32`, `f64`), **booleans** (`bool`), and **`char`** — Rust's character type, which is a full 4-byte Unicode scalar value, not a single byte.\n\n### Examples\n\n**1. Declaring each family, with explicit type annotations.**\n```rust\nfn main() {\n    let a: i32 = -5;\n    let b: u32 = 5;\n    let c: i64 = 9_000_000_000;\n    let f: f64 = 3.14;\n    let is_true: bool = true;\n    let letter: char = 'R';\n    let heart_emoji: char = '❤';\n\n    println!(\"{} {} {} {} {} {} {}\", a, b, c, f, is_true, letter, heart_emoji);\n}\n```\nOutput:\n```\n-5 5 9000000000 3.14 true R ❤\n```\n`i32` is Rust's default integer type when none is specified (used throughout this book unless a different size genuinely matters); `f64` is the default float type. The `u`/`i` prefix means unsigned/signed; the number is the size in bits — `i32` is a 32-bit signed integer, `u32` its unsigned counterpart, unable to represent negative numbers at all.\n\n**2. `char` is genuinely 4 bytes — a real, different size from what \"a character\" might suggest.**\n```rust\nprintln!(\"i32 size: {} bytes\", std::mem::size_of::<i32>());\nprintln!(\"char size: {} bytes\", std::mem::size_of::<char>());\n```\nOutput:\n```\ni32 size: 4 bytes\nchar size: 4 bytes\n```\n`char` holds a single Unicode scalar value — genuinely able to represent `'❤'`, an emoji, or any character from any script, which requires more than the single byte \"a character\" might suggest in a language like C. `std::mem::size_of::<T>()` (the `::<T>` syntax, called turbofish, gets a full explanation in Chapter 4.3) reports a type's exact size in bytes directly.\n\n**3. Every integer type has a real, fixed, checkable range.**\n```rust\nprintln!(\"i32 MIN {} MAX {}\", i32::MIN, i32::MAX);\nprintln!(\"u8 MIN {} MAX {}\", u8::MIN, u8::MAX);\n```\nOutput:\n```\ni32 MIN -2147483648 MAX 2147483647\nu8 MIN 0 MAX 255\n```\nEvery integer type exposes its own real, exact bounds as associated constants — `u8::MAX` being `255` is a direct, mechanical consequence of it being 8 bits wide (2⁸ − 1), with no room for anything larger.\n\n**4. Integer overflow panics in a debug build — a real, deliberate safety check.**\n```rust\nfn main() {\n    let args: Vec<String> = std::env::args().collect();\n    let x: u8 = if args.len() > 100 { 0 } else { 255 };\n    let y = x + 1;\n    println!(\"{}\", y);\n}\n```\n(The `args`-based check is a deliberate trick, not part of the point being made: `x`'s value of `255` is obscured behind something only known while the program is running, so the compiler can't prove the overflow ahead of time and refuse to compile — see the Common Mistakes note below for why a plain `let x: u8 = 255;` doesn't actually demonstrate this at all.) Compiled and run as an ordinary debug build:\n```\nthread 'main' panicked at overflow.rs:4:13:\nattempt to add with overflow\nnote: run with `RUST_BACKTRACE=1` environment variable to display a backtrace\n```\n`255` is `u8::MAX` — adding `1` genuinely cannot be represented in 8 bits. Rust's default debug build checks for this at runtime and panics immediately rather than silently producing a wrong answer, a real, deliberate difference from C, where the equivalent operation would silently wrap around to `0` with no warning at all.\n\n**5. The same overflow in a release (optimized) build — silently wraps instead.**\n```\n$ rustc -O overflow.rs -o overflow_release\n$ ./overflow_release\n```\nOutput:\n```\n0\n```\nThis is a genuine, real, and honestly debated trade-off: overflow checks have a real runtime cost, so release builds skip them by default and silently wrap instead (`255 + 1` becomes `0`, exactly as it would in C). This means code that *relies* on overflow panicking to catch a bug during development might behave differently once shipped — Example 6 shows the actual, explicit way to control this behavior regardless of build profile.\n\n**6. Explicit, deliberate overflow handling — `wrapping_add`, `checked_add`, `saturating_add`.**\n```rust\nfn main() {\n    let x: u8 = 255;\n    println!(\"{}\", x.wrapping_add(1));\n    println!(\"{:?}\", x.checked_add(1));\n    println!(\"{}\", x.saturating_add(1));\n}\n```\nOutput:\n```\n0\nNone\n255\n```\nThese three methods give explicit, deliberate control that doesn't depend on the build profile at all: `.wrapping_add()` always wraps (like Example 5's release behavior); `.checked_add()` returns `Option<T>` (Chapter 2.9) — `None` on overflow, `Some(value)` otherwise, forcing the caller to actually handle the failure case; `.saturating_add()` clamps to the type's max/min instead of wrapping. Real, production Rust code that genuinely needs to handle overflow correctly uses one of these explicitly, rather than relying on the debug/release distinction at all.\n\n**7. Integer division by zero panics; floating-point division by zero does not.**\n```rust\nfn main() {\n    let args: Vec<String> = std::env::args().collect();\n    let b: i32 = 5;\n    let c: i32 = if args.len() > 100 { 1 } else { 0 };\n    println!(\"{}\", b / c);\n}\n```\n(Same trick as Example 4 — a plain `let c: i32 = 0;` divisor is knowable at compile time, so the compiler refuses to compile it at all rather than letting it panic at runtime; see Common Mistakes.) Output:\n```\nthread 'main' panicked at divzero.rs:5:20:\nattempt to divide by zero\nnote: run with `RUST_BACKTRACE=1` environment variable to display a backtrace\n```\n```rust\nlet a: f64 = 5.0 / 0.0;\nlet b: f64 = -5.0 / 0.0;\nlet c: f64 = 0.0 / 0.0;\nprintln!(\"{} {} {}\", a, b, c);\n```\nOutput:\n```\ninf -inf NaN\n```\nInteger division by zero is a real, unconditional panic — every build profile, no exceptions, since there's no integer value that could meaningfully represent the result. Floating-point division follows the IEEE 754 standard instead (same standard nearly every language's floats follow): dividing by zero produces `inf`, `-inf`, or `NaN` (not-a-number, for `0.0 / 0.0`) rather than panicking at all.\n\n### ⚠️ Common Mistakes\n\n- **Assuming integer overflow silently wraps, the way it does in C**, without checking which build profile is actually running. As Examples 4 and 5 showed, a debug build panics; only a release build wraps — code that depends on wrapping behavior should use `.wrapping_add()` (Example 6) explicitly, never rely on the build profile.\n- **Assuming `char` is one byte.** As Example 2 showed, it's genuinely 4 bytes, able to hold any Unicode scalar value — a real, different assumption from C's single-byte `char`.\n- **Forgetting integer division by zero panics unconditionally**, in every build profile, unlike overflow — there's no \"release mode makes this safe\" equivalent for division by zero.\n- **Using `.unwrap()` reflexively on a `checked_add()`/similar result** instead of actually handling the `None` case — this defeats the entire purpose of reaching for a checked operation in the first place.\n- **Writing an overflow/divide-by-zero example with plain literal constants** (`let x: u8 = 255; let y = x + 1;`) and expecting a *runtime* panic. When every value involved is knowable at compile time, `rustc`'s own `arithmetic_overflow`/`unconditional_panic` lints (deny-by-default) catch it during compilation instead — a real compile error, not the runtime panic Examples 4 and 7 demonstrate. Both examples deliberately hide the value behind a runtime check (`std::env::args().len() > 100`, always false in practice) specifically to defeat this compile-time proof and force the check to actually happen at runtime, exactly like Chapter 1.6's array-bounds example does for the same underlying reason.\n\n### How this connects\n\nChapter 2.9's `Option<T>` is exactly the type `.checked_add()` (Example 6) returns — this chapter's brief use of it here is a preview of a much fuller treatment there. Chapter 1.6 covers Rust's compound types (tuples and arrays), building directly on these scalar building blocks.\n\n### Quick recap\n\n- Integers come in explicit signed/unsigned, explicit-width flavors (`i32`, `u8`, and so on); `i32`/`f64` are the defaults when unspecified.\n- `char` is a full 4-byte Unicode scalar value, not a single byte.\n- Integer overflow panics in a debug build but silently wraps in a release build — `.wrapping_add()`/`.checked_add()`/`.saturating_add()` give explicit, build-profile-independent control instead.\n- Integer division by zero panics unconditionally, in every build profile; floating-point division by zero follows IEEE 754 (`inf`/`-inf`/`NaN`) instead."}, {"id": "1.6", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 6, "slug": "compound-types-tuples-arrays", "fullTitle": "Compound Types: Tuples & Arrays", "title": "Compound Types: Tuples & Arrays", "md": "### Why this matters\n\nTuples and arrays are Rust's two simplest ways to group several values together — and both come with real, compile-time-enforced guarantees (a fixed length, known types per position) that a language without them can only check at runtime, if at all.\n\n### The core idea\n\nA **tuple** groups a fixed number of values of *different* types into one compound value, accessed by position. An **array** groups a fixed number of values of the *same* type, accessed by index — and critically, an array's length is part of its type, fixed forever once declared.\n\n### Examples\n\n**1. Tuples — grouping different types together, accessed by `.0`, `.1`, and so on, or by destructuring.**\n```rust\nfn main() {\n    let tup: (i32, f64, char) = (500, 6.4, 'x');\n    println!(\"{} {} {}\", tup.0, tup.1, tup.2);\n\n    let (a, b, c) = tup;\n    println!(\"{} {} {}\", a, b, c);\n}\n```\nOutput:\n```\n500 6.4 x\n500 6.4 x\n```\n`(i32, f64, char)` is the tuple's actual type — three different types, in a fixed order, fixed count. `tup.0`/`tup.1`/`tup.2` access each element by its position directly; `let (a, b, c) = tup;` destructures all three into separate variables at once — genuinely the more common, more readable style once a tuple has more than one or two elements.\n\n**2. The empty tuple, `()` — Rust's \"nothing\" type, used constantly even when invisible.**\n```rust\nlet unit: () = ();\nprintln!(\"{:?}\", unit);\n```\nOutput:\n```\n()\n```\n`()` (pronounced \"unit\") is a real, genuine type with exactly one possible value — also itself. It's what a function that \"returns nothing\" actually returns underneath (Chapter 2.1 covers this precisely); you rarely write `()` explicitly, but it's there.\n\n**3. Arrays — fixed-length, same-type collections, with a real, checkable length.**\n```rust\nfn main() {\n    let arr: [i32; 5] = [1, 2, 3, 4, 5];\n    println!(\"{:?}\", arr);\n    println!(\"first: {}, len: {}\", arr[0], arr.len());\n\n    let zeros = [0; 5];\n    println!(\"{:?}\", zeros);\n}\n```\nOutput:\n```\n[1, 2, 3, 4, 5]\nfirst: 1, len: 5\n[0, 0, 0, 0, 0]\n```\n`[i32; 5]` is the array's actual type — five `i32`s, and that `5` is genuinely part of the type itself, not just its current length. `{:?}` (Chapter 7.2 covers this format specifier properly) is the \"debug\" format, needed here since arrays don't implement plain `{}` display formatting directly. `[0; 5]` is shorthand for \"the value `0`, repeated 5 times\" — genuinely useful for initializing a same-valued array without spelling out every element.\n\n**4. An out-of-bounds index the compiler can prove is wrong — caught before the program ever runs.**\n```rust\nfn main() {\n    let arr = [1, 2, 3, 4, 5];\n    let index = 10;\n    println!(\"{}\", arr[index]);\n}\n```\nOutput:\n```\nerror: this operation will panic at runtime\n --> oob_const.rs:4:20\n  |\n4 |     println!(\"{}\", arr[index]);\n  |                    ^^^^^^^^^^ index out of bounds: the length is 5 but the index is 10\n  |\n  = note: `#[deny(unconditional_panic)]` on by default\n```\nSince both `arr`'s length and `index`'s value are known at compile time here, Rust's compiler can prove this would panic every single time the program ran, and refuses to compile it at all — a genuinely stronger guarantee than a language that only catches this at runtime, if it catches it at all.\n\n**5. The identical mistake, with an index the compiler can't know ahead of time — a real runtime panic instead.**\n```rust\nfn main() {\n    let arr = [1, 2, 3, 4, 5];\n    let args: Vec<String> = std::env::args().collect();\n    let index = if args.len() > 100 { 0 } else { 10 };\n    println!(\"{}\", arr[index]);\n}\n```\nOutput:\n```\nthread 'main' panicked at oob_runtime.rs:5:20:\nindex out of bounds: the len is 5 but the index is 10\n```\nOnce `index`'s value genuinely depends on something only known while the program is running (here, deliberately obscured behind a runtime check the compiler can't evaluate ahead of time), Rust can no longer catch the mistake at compile time — but it still refuses to silently read invalid memory, panicking immediately with a clear message instead. This is Rust's real, memory-safety guarantee in action: **every** array access is bounds-checked, at compile time when provable, at runtime otherwise, but never skipped. (The wording differs subtly between the two: \"the length is 5\" at compile time, \"the len is 5\" at runtime — the same real check, reported by two different parts of the toolchain.)\n\n### ⚠️ Common Mistakes\n\n- **Assuming an out-of-range array access silently reads garbage memory**, the way it might in C. As Examples 4 and 5 showed, Rust always catches this — at compile time when the values are known ahead of time, otherwise with an immediate, real runtime panic.\n- **Forgetting an array's length is part of its type.** `[i32; 5]` and `[i32; 10]` are genuinely different, incompatible types — a function expecting one cannot be passed the other without an explicit conversion (Chapter 2.5's slices are usually the better tool when a length needs to be flexible).\n- **Using a tuple for more than a small handful of values**, or values that don't naturally have a fixed, positional meaning. A `struct` (Chapter 2.7) with named fields is almost always clearer once a group of values has genuine internal structure.\n\n### How this connects\n\nChapter 2.5 (The Slice Type) is the real, flexible-length counterpart to this chapter's fixed-length arrays — genuinely necessary the moment a collection's size isn't known ahead of time. Chapter 2.7 (Structs) is the more structured, named alternative to a tuple once positional access alone stops being clear enough.\n\n### Quick recap\n\n- A tuple (`(T1, T2, ...)`) groups a fixed number of values of *different* types, accessed by `.0`/`.1`/... or destructuring; `()` (unit) is the empty tuple, Rust's \"nothing\" type.\n- An array (`[T; N]`) groups a fixed number of values of the *same* type — its length `N` is genuinely part of the type itself.\n- Every array access is bounds-checked — provably-wrong indices are rejected at compile time; genuinely runtime-dependent ones panic immediately rather than reading invalid memory."}, {"id": "1.7", "partNum": 1, "partTitle": "Part I — The Alphabet", "partMetaphor": "the raw symbols a program is made of", "chapNum": 7, "slug": "operators-expressions-statements", "fullTitle": "Operators, Expressions & Statements", "title": "Operators, Expressions & Statements", "md": "### Why this matters\n\nChapter 1.1 mentioned Rust cares about the difference between a statement and an expression, without saying why. This chapter shows exactly why: a single trailing semicolon can silently change what a function returns, and understanding this precisely is what makes the rest of this book's code read naturally instead of looking like unexplained magic.\n\n### The core idea\n\nA **statement** performs an action but produces no value (`let x = 5;` is a statement). An **expression** evaluates to a value (`5 + 6` is an expression). The distinction matters because Rust lets a block `{ ... }` itself be an expression — its value is whatever its *last* line evaluates to, **as long as that last line has no trailing semicolon**.\n\n### Examples\n\n**1. A block is itself an expression — its value is its last line, with no semicolon.**\n```rust\nfn main() {\n    let y = {\n        let x = 3;\n        x + 1\n    };\n    println!(\"y = {}\", y);\n}\n```\nOutput:\n```\ny = 4\n```\nThe `{ ... }` block contains a statement (`let x = 3;`) followed by an expression with no trailing semicolon (`x + 1`) — that final, semicolon-less expression is the block's own value, assigned directly to `y`. This is genuinely unusual coming from most other languages, where a block on its own never \"returns\" anything.\n\n**2. Adding a semicolon changes what the block evaluates to — a real, live demonstration.**\n```rust\nfn main() {\n    let y = {\n        let x = 3;\n        x + 1;\n    };\n    println!(\"{:?}\", y);\n}\n```\nCompiling produces a real warning, not an error:\n```\nwarning: unused arithmetic operation that must be used\n --> semimeaning.rs:4:9\n  |\n4 |         x + 1;\n  |         ^^^^^ the arithmetic operation produces a value\n  |\nhelp: use `let _ = ...` to ignore the resulting value\n```\nAnd the program still runs, printing:\n```\n()\n```\nAdding the semicolon turned `x + 1` from an expression into a statement — a statement produces no value, so the block's last line is now effectively nothing, and the block's own value becomes `()` (unit, from Chapter 1.6) instead of `4`. This single character is precisely the difference between \"this block evaluates to 4\" and \"this block evaluates to nothing\" — genuinely worth internalizing, since it's exactly how function return values work too, shown next.\n\n**3. Function return values work the identical way — a tail expression, or an explicit `return`.**\n```rust\nfn five() -> i32 {\n    5\n}\n\nfn six() -> i32 {\n    return 6;\n}\n\nfn plus_one(x: i32) -> i32 {\n    x + 1\n}\n\nfn main() {\n    println!(\"{} {} {}\", five(), six(), plus_one(5));\n}\n```\nOutput:\n```\n5 6 6\n```\n`five`'s body is just `5` — an expression, no semicolon, so it's the function's return value, with no `return` keyword needed at all. `six` uses `return` explicitly instead, genuinely equivalent here but conventionally reserved for returning *early*, before a function's natural end. `plus_one`'s body, `x + 1` with no semicolon, is exactly Example 1's mechanism, just at the function-body level instead of an inner block.\n\n**4. Forgetting this, and adding a stray semicolon to a function body, is a real, common, and clearly-explained error.**\n```rust\nfn plus_one(x: i32) -> i32 {\n    x + 1;\n}\n\nfn main() {}\n```\nOutput:\n```\nerror[E0308]: mismatched types\n --> mismatch.rs:1:24\n  |\n1 | fn plus_one(x: i32) -> i32 {\n  |    --------            ^^^ expected `i32`, found `()`\n  |    |\n  |    implicitly returns `()` as its body has no tail or `return` expression\n2 |     x + 1;\n  |          - help: remove this semicolon to return this value\n```\nThis is exactly Example 2's mechanism producing a real compile error instead of a warning, because `plus_one` explicitly promised to return an `i32` — the semicolon turns the body's last line into a statement, so the function's actual return type becomes `()`, mismatching the declared `-> i32`. The compiler's suggestion (`help: remove this semicolon`) names the precise, correct fix.\n\n**5. Rust has no `++`/`--` operators at all — a real, deliberate omission, not an oversight.**\n```rust\nlet mut x = 5;\nx++;\n```\nOutput:\n```\nerror: Rust has no postfix increment operator\n --> incrementop.rs:3:6\n  |\n3 |     x++;\n  |      ^^ not a valid postfix operator\n  |\nhelp: use `+= 1` instead\n```\nThis isn't a generic syntax error — the compiler specifically recognizes `++`/`--` as something a reader coming from C, JavaScript, or similar might reach for, and names the actual Rust idiom (`x += 1;`) directly. Rust deliberately left these operators out, since `x++`'s different \"increment, but the *expression's value* is the old value\" behavior in other languages is a genuine, real source of subtle bugs.\n\n**6. `if` is an expression too — Rust's actual replacement for a ternary operator.**\n```rust\nlet condition = true;\nlet number = if condition { 5 } else { 6 };\nprintln!(\"{}\", number);\n```\nOutput:\n```\n5\n```\nRust has no separate ternary (`?:`) operator at all — `if`/`else` as an expression does the identical job, and Chapter 3.1 covers this properly. Both branches must produce the same type for this to compile, which the compiler enforces exactly like Example 1's block-value rule, since an `if` used this way is really just a block expression with a condition attached.\n\n### ⚠️ Common Mistakes\n\n- **Adding a semicolon to a function's or block's final line by habit**, silently turning its intended return value into `()`. As Examples 2 and 4 showed, this is either a confusing runtime surprise or a real compile error, depending on whether a type was declared explicitly.\n- **Reaching for `++`/`--` out of muscle memory from another language.** As Example 5 showed, Rust doesn't have them at all — `+= 1`/`-= 1` is the real, idiomatic replacement.\n- **Looking for a ternary operator.** As Example 6 showed, `if`/`else` as an expression is Rust's actual, complete replacement — there's no separate `?:` syntax to learn.\n- **Forgetting `return` is for *early* returns specifically.** Using it for a function's final value (Example 3's `six`) works, but a bare tail expression (no `return`, no semicolon) is the more idiomatic, more common style throughout real Rust code.\n\n### How this connects\n\nChapter 3.1 (`match` & Pattern Matching) and Chapter 3.4/3.5 (error handling) both lean on this exact expression-based mechanism constantly — a `match` expression, like `if`, evaluates to a value the same way a block does. Chapter 2.1 (Functions) builds directly on Example 3's return-value mechanics.\n\n### Quick recap\n\n- A block `{ ... }` is itself an expression — its value is its last line, provided that line has no trailing semicolon.\n- Adding a semicolon turns an expression into a statement, discarding its value — the block (or function body) then evaluates to `()` instead.\n- Function return values work identically: a tail expression with no semicolon, or an explicit early `return`.\n- Rust has no `++`/`--` operators (use `+= 1`/`-= 1`) and no separate ternary operator (`if`/`else` as an expression does that job)."}, {"id": "2.1", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Rust's data, and its one big new idea", "chapNum": 1, "slug": "functions-function-signatures", "fullTitle": "Functions & Function Signatures", "title": "Functions & Function Signatures", "md": "### Why this matters\n\nFunctions have already appeared constantly since Chapter 1.1 — this chapter makes the rules explicit, especially one Rust insists on that many languages leave optional: every parameter's type must be spelled out, always.\n\n### The core idea\n\nA function is declared with `fn name(param: Type, ...) -> ReturnType { ... }`. Unlike variables (Chapter 1.4), Rust never infers a parameter's type from how a function is called — every parameter needs an explicit type annotation, and a function's return type (if it returns anything) must be declared after `->`.\n\n### Examples\n\n**1. Functions with parameters, a return value, and no return value at all.**\n```rust\nfn main() {\n    greet(\"Ada\");\n    let sum = add(2, 3);\n    println!(\"sum = {}\", sum);\n    print_nothing();\n}\n\nfn greet(name: &str) {\n    println!(\"Hello, {}!\", name);\n}\n\nfn add(a: i32, b: i32) -> i32 {\n    a + b\n}\n\nfn print_nothing() {\n    println!(\"returns unit\");\n}\n```\nOutput:\n```\nHello, Ada!\nsum = 5\nreturns unit\n```\n`greet` and `print_nothing` have no `-> Type` at all — both implicitly return `()` (Chapter 1.6's unit type), Rust's real \"nothing\" value. `add`'s `-> i32` and its tail-expression body (`a + b`, no semicolon) are exactly Chapter 1.7's return mechanism.\n\n**2. Omitting a parameter's type annotation is a real, immediate error — with a genuinely helpful suggestion.**\n```rust\nfn add(a, b: i32) -> i32 {\n    a + b\n}\n```\nOutput:\n```\nerror: expected one of `:`, `@`, or `|`, found `,`\n --> noparamtype.rs:1:9\n  |\n1 | fn add(a, b: i32) -> i32 {\n  |         ^ expected one of `:`, `@`, or `|`\n  |\nhelp: if this is a parameter name, give it a type\n  |\n1 | fn add(a: TypeName, b: i32) -> i32 {\n  |         ++++++++++\n```\nUnlike `let`, which can infer a variable's type from its initial value, a function's parameters have no \"initial value\" to infer from at the point of definition — the type must be stated explicitly, every time, no exceptions. The compiler's suggestion here is generic (`TypeName`, since it genuinely can't guess what you meant) but still correctly identifies exactly what's missing.\n\n**3. Calling a function with the wrong number of arguments — a real, specific error naming the mismatch.**\n```rust\nfn add(a: i32, b: i32) -> i32 {\n    a + b\n}\nfn main() {\n    add(1, 2, 3);\n}\n```\nOutput:\n```\nerror[E0061]: this function takes 2 arguments but 3 arguments were supplied\n --> wrongargs.rs:5:5\n  |\n5 |     add(1, 2, 3);\n  |     ^^^       - unexpected argument #3 of type `{integer}`\n  |\nnote: function defined here\n --> wrongargs.rs:1:4\n  |\n1 | fn add(a: i32, b: i32) -> i32 {\n  |    ^^^\nhelp: remove the extra argument\n  |\n5 -     add(1, 2, 3);\n5 +     add(1, 2);\n  |\n```\nThe error names the exact expected count, points at both the call site and the function's own definition, and even suggests the precise fix — a real, consistent pattern across essentially every kind of compiler error in Rust.\n\n**4. Calling with an argument of the wrong type — equally specific.**\n```rust\nadd(1, \"two\");\n```\nOutput:\n```\nerror[E0308]: mismatched types\n --> wrongtype.rs:5:12\n  |\n5 |     add(1, \"two\");\n  |     ---    ^^^^^ expected `i32`, found `&str`\n  |     |\n  |     arguments to this function are incorrect\n  |\nnote: function defined here\n --> wrongtype.rs:1:4\n  |\n1 | fn add(a: i32, b: i32) -> i32 {\n  |    ^^^         ------\n```\n`\"two\"` is a `&str` (a string slice, Chapter 2.6), not an `i32` — genuinely incompatible types, caught here before the program ever runs, with both the mismatch and the function's own declared signature shown together.\n\n### ⚠️ Common Mistakes\n\n- **Expecting Rust to infer a parameter's type the way it infers a `let` binding's type.** As Example 2 showed, it never does — every parameter needs an explicit annotation, always.\n- **Miscounting arguments in a function call**, especially after a function's signature changes elsewhere in a larger codebase. As Example 3 showed, Rust catches this immediately and precisely, rather than silently accepting extra arguments or leaving missing ones as some default value.\n- **Assuming a function with no `-> Type` returns nothing meaningful and can be ignored entirely.** It genuinely returns `()` — a real, distinct value, just one that carries no information, and code can still (pointlessly) bind it: `let x = print_nothing();` compiles fine, with `x` having type `()`.\n\n### How this connects\n\nChapter 1.7's expression/statement distinction is exactly the mechanism behind `add`'s tail-expression return here. Chapter 4.3 (Generics) extends this same signature syntax — a generic function's signature just has more moving parts, built on everything this chapter established.\n\n### Quick recap\n\n- `fn name(param: Type, ...) -> ReturnType { ... }` — every parameter's type must be stated explicitly; Rust never infers it.\n- A function with no `-> Type` implicitly returns `()` (unit) — a real, distinct value carrying no information.\n- Calling a function with the wrong argument count or wrong argument types is caught at compile time, with specific, actionable error messages naming both the call site and the function's own definition."}, {"id": "2.2", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Rust's data, and its one big new idea", "chapNum": 2, "slug": "control-flow-if-else-loops", "fullTitle": "Control Flow: `if`/`else` and the Three Loops", "title": "Control Flow: `if`/`else` and the Three Loops", "md": "### Why this matters\n\n`if` and loops look familiar from nearly every language — but Rust has three genuinely distinct loop constructs, one of which (`loop`) can hand back a value the way an expression does, and `if`'s condition has a real, strict requirement most dynamically-typed languages don't share.\n\n### The core idea\n\nRust's `if` condition must be a genuine `bool` — no implicit truthiness the way `0`/`\"\"`/`null` might convey \"false\" in other languages. Rust has three loop forms: `loop` (repeats forever until explicitly told to stop, and can produce a value via `break`), `while` (repeats while a condition holds), and `for` (iterates over a collection or range) — `for` is, in practice, the one you'll reach for by far the most.\n\n### Examples\n\n**1. `if`/`else if`/`else` — familiar shape, one real requirement.**\n```rust\nlet number = 6;\nif number % 4 == 0 {\n    println!(\"divisible by 4\");\n} else if number % 3 == 0 {\n    println!(\"divisible by 3\");\n} else {\n    println!(\"not divisible by 4 or 3\");\n}\n```\nOutput:\n```\ndivisible by 3\n```\nNothing surprising here — except what happens if the condition genuinely isn't a `bool` at all, shown in Example 2.\n\n**2. A non-boolean condition is a real, immediate compile error — never implicit truthiness.**\n```rust\nlet number = 3;\nif number {\n    println!(\"yes\");\n}\n```\nOutput:\n```\nerror[E0308]: mismatched types\n --> nonbool.rs:3:8\n  |\n3 |     if number {\n  |        ^^^^^^ expected `bool`, found integer\n```\nUnlike C or JavaScript, where a nonzero number is \"truthy\" in an `if`, Rust requires a genuine `bool` — `number != 0` would need to be written explicitly. This is a real, deliberate safety choice: it eliminates an entire class of bugs where a condition accidentally isn't the boolean it was assumed to be.\n\n**3. `loop` — repeats forever, and can produce a value via `break`.**\n```rust\nlet mut counter = 0;\nlet result = loop {\n    counter += 1;\n    if counter == 10 {\n        break counter * 2;\n    }\n};\nprintln!(\"result = {}\", result);\n```\nOutput:\n```\nresult = 20\n```\n`loop` genuinely never stops on its own — only an explicit `break` ends it. `break counter * 2` is the real, distinctive feature here: giving `break` a value makes the *entire loop* evaluate to that value, exactly like Chapter 1.7's block-expression mechanism, assignable directly to `result`. Neither `while` nor `for` can do this — only `loop`.\n\n**4. `while` — repeats as long as a condition holds.**\n```rust\nlet mut n = 3;\nwhile n != 0 {\n    println!(\"{n}!\");\n    n -= 1;\n}\nprintln!(\"LIFTOFF\");\n```\nOutput:\n```\n3!\n2!\n1!\nLIFTOFF\n```\n`{n}` inside the string is a real, modern shorthand (stable since the 2021 edition) — `println!(\"{n}!\")` interpolates the variable `n` directly by name, equivalent to `println!(\"{}!\", n)` but avoiding a separate argument list entirely. Chapter 7.2 covers string formatting properly; this book uses whichever style reads more clearly in a given example.\n\n**5. `for` over a collection — the loop you'll actually use most.**\n```rust\nlet arr = [10, 20, 30];\nfor element in arr {\n    println!(\"value: {element}\");\n}\n```\nOutput:\n```\nvalue: 10\nvalue: 20\nvalue: 30\n```\n`for element in arr` iterates every element of the array directly, with no manual indexing or explicit bounds-checking (Chapter 1.6's array-indexing panics) needed at all — genuinely the safer, more idiomatic default over manually indexing with a counter.\n\n**6. `for` over a range — and reversing it.**\n```rust\nfor n in 1..4 {\n    println!(\"range: {n}\");\n}\nfor n in (1..4).rev() {\n    println!(\"rev range: {n}\");\n}\n```\nOutput:\n```\nrange: 1\nrange: 2\nrange: 3\nrev range: 3\nrev range: 2\nrev range: 1\n```\n`1..4` is a **range** — `1` up to, but not including, `4` (Chapter 4.7's `Iterator` trait explains precisely what a range actually is underneath). `.rev()` reverses the iteration order — genuinely one method call, no separate counting-down loop needed.\n\n**7. Labeled loops — breaking out of a specific, outer loop from inside a nested one.**\n```rust\nlet mut count = 0;\n'counting_up: loop {\n    println!(\"count = {count}\");\n    let mut remaining = 10;\n    loop {\n        println!(\"remaining = {remaining}\");\n        if remaining == 9 {\n            break;\n        }\n        if count == 2 {\n            break 'counting_up;\n        }\n        remaining -= 1;\n    }\n    count += 1;\n}\nprintln!(\"End count = {count}\");\n```\nOutput:\n```\ncount = 0\nremaining = 10\nremaining = 9\ncount = 1\nremaining = 10\nremaining = 9\ncount = 2\nremaining = 10\nEnd count = 2\n```\n`'counting_up:` labels the outer loop; a bare `break` (inside the inner loop) only exits the *inner* loop, but `break 'counting_up` exits the labeled outer one directly, from anywhere inside it, however deeply nested. Without labels, breaking out of a specific outer loop from deep inside nested ones would require an extra flag variable checked at every level — genuinely more error-prone than a label.\n\n### ⚠️ Common Mistakes\n\n- **Expecting an `if` condition to accept a non-boolean value, the way many other languages do.** As Example 2 showed, Rust requires a genuine `bool` always — write the actual comparison explicitly.\n- **Using `while` with a manual counter and indexing when a `for` loop over the collection (or a range) would be both safer and clearer.** `for` avoids the off-by-one and out-of-bounds mistakes a manual counter genuinely risks.\n- **Forgetting only `loop` can produce a value via `break value`.** `while` and `for` loops always evaluate to `()` — attempting `break value` inside either is a real compile error.\n- **Forgetting a range's upper bound is exclusive.** `1..4` genuinely stops after `3` — `1..=4` (inclusive range) is the real, explicit alternative when the upper bound should be included.\n\n### How this connects\n\nChapter 3.1 (`match`) is the more powerful pattern-matching sibling to `if`, and Chapter 4.7 (Iterators) explains exactly what a range and a `for` loop are actually built on underneath — both directly extend the control-flow foundation this chapter laid.\n\n### Quick recap\n\n- `if`'s condition must be a genuine `bool` — no implicit truthiness on numbers, strings, or anything else.\n- `loop` repeats until an explicit `break`, and — uniquely among the three loop forms — can produce a value via `break value`.\n- `while` repeats on a condition; `for` iterates a collection or range directly and is the more idiomatic default over manual indexing.\n- Labeled loops (`'label: loop { ... }`) let `break`/`continue` target a specific outer loop from anywhere nested inside it."}, {"id": "2.3", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Rust's data, and its one big new idea", "chapNum": 3, "slug": "ownership-the-core-idea", "fullTitle": "Ownership: The Core Idea", "title": "Ownership: The Core Idea", "md": "### Why this matters\n\nThis is the single idea that makes Rust genuinely different from every other language in this series. Every other book taught you either manual memory management (C — you free it, or you leak/crash) or a garbage collector (Python, JavaScript, Go — something else tracks it for you, at a real runtime cost). Rust does neither. Ownership is a set of compile-time rules that let the compiler know exactly when memory can be freed, with zero runtime cost and zero garbage collector — and understanding it precisely is what the rest of this entire book depends on.\n\n### The core idea\n\nEvery value in Rust has exactly one **owner** — the variable currently responsible for it. When the owner goes out of scope, Rust automatically cleans up the value, deterministically, with no garbage collector involved. Assigning a value to another variable, or passing it to a function, **moves** ownership — the original variable becomes invalid, not a second, independent copy of the data. Simple, fixed-size types are the one real exception: they implement `Copy`, meaning assignment genuinely duplicates them instead of moving them.\n\n### Examples\n\n**1. Assigning a `String` to another variable *moves* it — the original becomes invalid.**\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1;\n    println!(\"{}, world!\", s1);\n}\n```\nOutput:\n```\nerror[E0382]: borrow of moved value: `s1`\n --> move1.rs:4:28\n  |\n2 |     let s1 = String::from(\"hello\");\n  |         -- move occurs because `s1` has type `String`, which does not implement the `Copy` trait\n3 |     let s2 = s1;\n  |              -- value moved here\n4 |     println!(\"{}, world!\", s1);\n  |                            ^^ value borrowed here after move\n  |\nhelp: consider cloning the value if the performance cost is acceptable\n  |\n3 |     let s2 = s1.clone();\n  |                ++++++++\n```\n`String::from(\"hello\")` allocates real memory on the heap to hold its text — this is genuinely different from a fixed-size stack value. `let s2 = s1;` does **not** create a second copy of that heap data; it moves ownership of the *same* data to `s2`, and `s1` is deliberately, permanently invalidated. Using `s1` afterward is a real compile error, not a runtime bug waiting to happen — this is the entire point. (If Rust silently let both `s1` and `s2` remain valid, pointing at the same heap memory, both going out of scope would try to free that memory *twice* — a real, classic memory-safety bug called a double free. Move semantics make this structurally impossible instead of just discouraged.)\n\n**2. `.clone()` — explicitly asking for a real, independent second copy.**\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1.clone();\n    println!(\"s1 = {}, s2 = {}\", s1, s2);\n}\n```\nOutput:\n```\ns1 = hello, s2 = hello\n```\n`.clone()` genuinely duplicates the heap data — `s1` and `s2` are now two, fully independent `String`s, each responsible for freeing their own memory later. This is deliberately an explicit method call, never implicit: cloning has a real, visible runtime cost (copying potentially large heap data), and Rust's design philosophy is that a genuinely expensive operation should always be visible in the code, never hidden behind ordinary-looking assignment.\n\n**3. Simple, fixed-size types don't move at all — they're `Copy`.**\n```rust\nfn main() {\n    let x = 5;\n    let y = x;\n    println!(\"x = {}, y = {}\", x, y);\n}\n```\nOutput:\n```\nx = 5, y = 5\n```\nThis looks identical to Example 1's code shape, but compiles and runs fine, with `x` still perfectly valid after the assignment. Integers (and other simple, fixed-size types — `bool`, `char`, `f64`, and tuples containing only these) implement a special trait called `Copy` — for these types, `let y = x;` genuinely duplicates the value on the spot rather than moving it, since duplicating a stack-only integer is essentially free, with no heap allocation to worry about sharing or freeing twice. Chapter 7.1 covers `Copy` and `Clone` as real traits properly; the important thing here is the *behavioral* difference: a `Copy` type never gets invalidated by assignment, a non-`Copy` type always does unless you `.clone()` it explicitly.\n\n**4. Passing a value to a function moves it too — ownership works identically at a function boundary.**\n```rust\nfn takes_ownership(some_string: String) {\n    println!(\"{}\", some_string);\n}\n\nfn main() {\n    let s = String::from(\"hello\");\n    takes_ownership(s);\n    println!(\"{}\", s);\n}\n```\nOutput:\n```\nerror[E0382]: borrow of moved value: `s`\n --> movefn.rs:8:20\n  |\n6 |     let s = String::from(\"hello\");\n  |         - move occurs because `s` has type `String`, which does not implement the `Copy` trait\n7 |     takes_ownership(s);\n  |                     - value moved here\n8 |     println!(\"{}\", s);\n  |                    ^ value borrowed here after move\n  |\nnote: consider changing this parameter type in function `takes_ownership` to borrow instead if owning the value isn't necessary\n --> movefn.rs:1:33\n  |\n1 | fn takes_ownership(some_string: String) {\n  |    ---------------              ^^^^^^ this parameter takes ownership of the value\n  |    |\n  |    in this function\n```\nCalling `takes_ownership(s)` moves `s` into the function's own parameter, `some_string` — exactly Example 1's mechanism, just crossing a function boundary instead of a plain assignment. `s` is invalid back in `main` afterward, for the identical reason. The compiler's own suggestion here — \"consider changing this parameter type... to borrow instead\" — is a genuine, real hint pointing straight at Chapter 2.4's actual solution: most functions don't need to *own* a value at all, just look at it temporarily.\n\n**5. Ownership can be handed back — returning a value moves it out again.**\n```rust\nfn gives_ownership() -> String {\n    let some_string = String::from(\"yours\");\n    some_string\n}\n\nfn main() {\n    let s = gives_ownership();\n    println!(\"{}\", s);\n}\n```\nOutput:\n```\nyours\n```\n`gives_ownership` creates a `String` and, by returning it (a tail expression, Chapter 1.7), moves ownership out to whatever called it — `s` in `main` becomes the new, valid owner. Nothing is copied or cloned here; ownership simply transfers, exactly like every prior example, just in the opposite direction.\n\n**6. When an owner goes out of scope, Rust cleans up automatically — deterministically, confirmed directly.**\n```rust\nstruct Noisy;\nimpl Drop for Noisy {\n    fn drop(&mut self) {\n        println!(\"Noisy dropped!\");\n    }\n}\nfn main() {\n    {\n        let _n = Noisy;\n        println!(\"inside scope\");\n    }\n    println!(\"after scope\");\n}\n```\nOutput:\n```\ninside scope\nNoisy dropped!\nafter scope\n```\n`Noisy` here implements `Drop` (Chapter 5.3 covers this properly) purely to make cleanup *visible* — `\"Noisy dropped!\"` prints the instant `_n` goes out of scope, at the closing `}`, not at some later, unpredictable garbage-collection pause. This is genuinely the whole payoff of ownership: cleanup happens at one exact, predictable, compiler-determined moment — the owner's scope ending — with no runtime garbage collector deciding when to get around to it.\n\n**7. A genuinely common, real trap: moving a value inside a loop only works once.**\n```rust\nfn consume(s: String) {\n    println!(\"consumed: {}\", s);\n}\n\nfn main() {\n    let name = String::from(\"Ada\");\n    for _ in 0..3 {\n        consume(name);\n    }\n}\n```\nOutput:\n```\nerror[E0382]: use of moved value: `name`\n --> loopmove.rs:8:17\n  |\n6 |     let name = String::from(\"Ada\");\n  |         ---- move occurs because `name` has type `String`, which does not implement the `Copy` trait\n7 |     for _ in 0..3 {\n  |     ------------- inside of this loop\n8 |         consume(name);\n  |                 ^^^^ value moved here, in previous iteration of loop\n  |\nhelp: consider cloning the value if the performance cost is acceptable\n  |\n8 |         consume(name.clone());\n  |                     ++++++++\n```\nThe first loop iteration moves `name` into `consume` successfully — but the *second* iteration tries to move the exact same, now-invalid `name` again, which is exactly Example 4's rule, just easier to miss inside a loop's repeated body. Notice the compiler is specifically loop-aware here: \"in previous iteration of loop\" names the real cause precisely, rather than just reporting a generic move error. The fix depends on intent: `.clone()` (shown) if each iteration genuinely needs its own independent copy, or — far more often the actually-correct fix — passing a reference (Chapter 2.4) if `consume` only needs to look at the value, not own it.\n\n### ⚠️ Common Mistakes\n\n- **Trying to use a value after it's been moved**, exactly as Examples 1 and 4 showed. This is a genuinely common, real mistake for anyone new to Rust — the fix is almost always either `.clone()` (if you truly need two independent copies) or a reference (Chapter 2.4, which is what real, idiomatic Rust reaches for far more often).\n- **Moving a value inside a loop body**, as Example 7 showed directly — it works exactly once, then fails on the second iteration, since the value was already moved out on the first pass.\n- **Reaching for `.clone()` everywhere just to make the compiler stop complaining**, without considering whether a reference (Chapter 2.4) would do the job without the real, extra cost of duplicating data. `.clone()` is a legitimate, explicit tool — but overusing it defeats a real part of Rust's performance advantage.\n- **Assuming every type behaves like `String`.** As Example 3 showed, simple, fixed-size types (`Copy` types) genuinely don't move at all — assignment just duplicates them, cheaply, with no invalidation.\n- **Expecting cleanup timing to resemble a garbage-collected language.** As Example 6 showed, Rust's cleanup is exact and immediate, tied to a specific scope ending — never a \"sometime later, whenever the collector gets to it\" situation.\n\n### How this connects\n\nChapter 2.4 (References & Borrowing) is the single most important next step from here — it's the real, idiomatic way most functions and code avoid needing to move ownership at all. Chapter 5.3 (`Drop`) returns to Example 6's cleanup mechanism in full depth, and Chapter 5.4 (`Rc<T>`) covers the real, deliberate exception to \"exactly one owner\" for cases that genuinely need to share ownership.\n\n### Quick recap\n\n- Every value has exactly one owner; when that owner's scope ends, Rust cleans the value up automatically and deterministically — no garbage collector.\n- Assigning a non-`Copy` value, or passing it to a function, **moves** ownership — the original variable becomes invalid, not a second independent copy.\n- `Copy` types (integers, `bool`, `char`, `f64`, and tuples of these) are the real exception — assignment duplicates them cheaply instead of moving them.\n- `.clone()` explicitly requests a genuine, independent duplicate of a non-`Copy` value — always visible in the code, since it has a real runtime cost.\n- Returning a value from a function moves ownership out, exactly like passing it in moves ownership in."}, {"id": "2.4", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Rust's data, and its one big new idea", "chapNum": 4, "slug": "references-borrowing", "fullTitle": "References & Borrowing", "title": "References & Borrowing", "md": "### Why this matters\n\nChapter 2.3 ended with the compiler itself hinting at the real fix for constantly moving values around: most functions don't need to *own* a value, just look at it temporarily. References are exactly that — and the rules governing them are what people usually mean by \"the borrow checker.\"\n\n### The core idea\n\nA **reference** (`&T`) lets you refer to a value without taking ownership of it — the value isn't moved, and the original owner remains valid. This is called **borrowing**. Rust enforces one real, load-bearing rule at compile time: at any given moment, you can have *either* any number of immutable references, *or* exactly one mutable reference — never both kinds at once.\n\n### Examples\n\n**1. Borrowing — passing a reference instead of moving ownership.**\n```rust\nfn calculate_length(s: &String) -> usize {\n    s.len()\n}\n\nfn main() {\n    let s1 = String::from(\"hello\");\n    let len = calculate_length(&s1);\n    println!(\"The length of '{}' is {}.\", s1, len);\n}\n```\nOutput:\n```\nThe length of 'hello' is 5.\n```\n`&s1` creates a reference to `s1` without moving it — `calculate_length` receives `&String` (a reference to a `String`, not a `String` itself), and `s1` remains perfectly valid back in `main` afterward. Compare this directly to Chapter 2.3's Example 4, where passing `s` by value moved it and invalidated it — this is the real, idiomatic fix.\n\n**2. A mutable reference — borrowing with permission to change the value.**\n```rust\nfn change(some_string: &mut String) {\n    some_string.push_str(\", world\");\n}\n\nfn main() {\n    let mut s = String::from(\"hello\");\n    change(&mut s);\n    println!(\"{}\", s);\n}\n```\nOutput:\n```\nhello, world\n```\n`&mut s` creates a mutable reference — `s` itself must be declared `mut` too (Chapter 1.4), since a mutable reference can't grant permission the original variable never had. `change` can now genuinely modify the value through the reference, with the change visible back in `main` once the function returns.\n\n**3. You cannot mutate through a plain, shared reference — a real, enforced rule.**\n```rust\nfn change(some_string: &String) {\n    some_string.push_str(\", world\");\n}\nfn main() {\n    let s = String::from(\"hello\");\n    change(&s);\n}\n```\nOutput:\n```\nerror[E0596]: cannot borrow `*some_string` as mutable, as it is behind a `&` reference\n --> immutviolation.rs:2:5\n  |\n2 |     some_string.push_str(\", world\");\n  |     ^^^^^^^^^^^ `some_string` is a `&` reference, so it cannot be borrowed as mutable\n  |\nhelp: consider changing this to be a mutable reference\n  |\n1 | fn change(some_string: &mut String) {\n  |                         +++\n```\n`&String` (no `mut`) is a genuinely read-only view — attempting to mutate through it is a real compile error, with the exact fix suggested directly.\n\n**4. Two mutable references to the same value, at the same time — a real, core borrow-checker rule.**\n```rust\nfn main() {\n    let mut s = String::from(\"hello\");\n    let r1 = &mut s;\n    let r2 = &mut s;\n    println!(\"{}, {}\", r1, r2);\n}\n```\nOutput:\n```\nerror[E0499]: cannot borrow `s` as mutable more than once at a time\n --> twomut.rs:4:14\n  |\n3 |     let r1 = &mut s;\n  |              ------ first mutable borrow occurs here\n4 |     let r2 = &mut s;\n  |              ^^^^^^ second mutable borrow occurs here\n5 |     println!(\"{}, {}\", r1, r2);\n  |                        -- first borrow later used here\n```\nThis is the real, central rule this chapter's \"core idea\" stated: at most one mutable reference at a time, while it's actually in use. This isn't arbitrary strictness — two simultaneous mutable references to the same data is precisely the shape of a **data race** (two things modifying the same memory at once with no coordination), and Rust makes this a compile-time impossibility rather than a runtime bug you might not notice until it corrupts something.\n\n**5. Mixing a mutable reference with an active immutable one — equally forbidden, for the same reason.**\n```rust\nfn main() {\n    let mut s = String::from(\"hello\");\n    let r1 = &s;\n    let r2 = &s;\n    let r3 = &mut s;\n    println!(\"{}, {}, and {}\", r1, r2, r3);\n}\n```\nOutput:\n```\nerror[E0502]: cannot borrow `s` as mutable because it is also borrowed as immutable\n --> mixedref.rs:5:14\n  |\n3 |     let r1 = &s;\n  |              -- immutable borrow occurs here\n4 |     let r2 = &s;\n5 |     let r3 = &mut s;\n  |              ^^^^^^ mutable borrow occurs here\n6 |     println!(\"{}, {}, and {}\", r1, r2, r3);\n  |                                -- immutable borrow later used here\n```\nAny number of immutable references can coexist safely — reading the same data from multiple places at once is genuinely fine. The moment even one mutable reference is added into that same mix, while the immutable ones are still in use, the compiler rejects it: a reader could otherwise see the data change out from under it mid-read, which is exactly the kind of bug this rule exists to make impossible.\n\n**6. A dangling reference — the exact bug references are designed to prevent, caught two different ways.**\n```rust\nfn dangle() -> &String {\n    let s = String::from(\"hello\");\n    &s\n}\n```\nWithout an explicit lifetime, the compiler catches this via its lifetime-elision rules first:\n```\nerror[E0106]: missing lifetime specifier\n --> dangle.rs:1:16\n  |\n1 | fn dangle() -> &String {\n  |                ^ expected named lifetime parameter\n  |\n  = help: this function's return type contains a borrowed value, but there is no value for it to be borrowed from\nhelp: instead, you are more likely to want to return an owned value\n  |\n1 - fn dangle() -> &String {\n1 + fn dangle() -> String {\n  |\n```\nAdding an explicit lifetime (Chapter 4.9's actual subject — `fn dangle<'a>() -> &'a String`) doesn't fix the underlying problem; it just lets the compiler give you the more direct, real error underneath:\n```\nerror[E0515]: cannot return reference to local variable `s`\n --> dangle2.rs:3:5\n  |\n3 |     &s\n  |     ^^ returns a reference to data owned by the current function\n```\n`s` is created *inside* `dangle`, and its scope ends the moment the function returns (Chapter 2.3's cleanup rule) — a reference to it would point at memory that's already been freed, a real, classic bug called a **dangling pointer**, or a **use-after-free** once something actually reads through it. Rust catches this at compile time, unconditionally, in every case — this specific category of bug simply cannot exist in safe Rust. The compiler's own suggestion (return an owned `String` instead of a reference to a locally-created one) is exactly the right fix.\n\n### ⚠️ Common Mistakes\n\n- **Trying to hold two mutable references, or a mutable and immutable reference, to the same data at once.** As Examples 4 and 5 showed, this is a real, unconditional compile error — the fix is almost always to restructure the code so the borrows don't genuinely overlap in time (an inner scope, or simply using one before creating the next).\n- **Forgetting a reference needs `&mut`, and the underlying variable needs `mut`, to actually mutate through it.** As Example 3 showed, a plain `&` reference is read-only, full stop.\n- **Trying to return a reference to a value created inside the same function.** As Example 6 showed, this is a genuine dangling reference — the fix is to return the owned value itself, letting ownership move out (Chapter 2.3's Example 5), rather than a reference to something about to be destroyed.\n- **Assuming the borrow-checker rules are arbitrary strictness rather than real safety guarantees.** Every rule in this chapter maps directly to a real, concrete bug class (a data race, a use-after-free) that other languages either don't catch at all or only catch at runtime, if you're lucky.\n\n### How this connects\n\nChapter 2.5 (The Slice Type) is itself a special kind of reference, built directly on everything in this chapter. Chapter 4.9–4.10 (Lifetimes) formalizes exactly *how* the compiler tracks whether a reference is still valid — this chapter's dangling-reference examples were a first, honest preview of that exact machinery.\n\n### Quick recap\n\n- A reference (`&T`) borrows a value without taking ownership — the original owner stays valid.\n- At any moment: any number of immutable references, *or* exactly one mutable reference — never both kinds active at once. This rule exists specifically to make data races a compile-time impossibility.\n- A plain `&` reference is read-only; mutating through one requires `&mut`, and the original variable must itself be `mut`.\n- A dangling reference (pointing at data whose owner has already gone out of scope) is caught at compile time, unconditionally — this bug class cannot exist in safe Rust."}, {"id": "2.5", "partNum": 2, "partTitle": "Part II — Words", "partMetaphor": "vocabulary: Rust's data, and its one big new idea", "chapNum": 5, "slug": "the-slice-type", "fullTitle": "The Slice Type", "title": "The Slice Type", "md": "### Why this matters\n\nA slice is a reference (Chapter 2.4) to a *contiguous portion* of a collection, rather than the whole thing — and it's genuinely the right tool the moment you need to refer to \"part of a string\" or \"part of an array\" without copying anything or needing to own it.\n\n### The core idea\n\nA slice, written `&[T]` for a general slice or `&str` for a string slice specifically, borrows a range of a collection. Like any reference, a slice never owns the data it points to — and the borrow-checker rules from Chapter 2.4 apply to it exactly the same way, which turns out to prevent a real, classic bug automatically.\n\n### Examples\n\n**1. String slices — `&s[start..end]`, and the shorthand forms.**\n```rust\nfn main() {\n    let s = String::from(\"hello world\");\n    let slice1 = &s[0..5];\n    let slice2 = &s[6..11];\n    let slice3 = &s[..5];\n    let slice4 = &s[6..];\n    let slice5 = &s[..];\n    println!(\"{} {} {} {} {}\", slice1, slice2, slice3, slice4, slice5);\n}\n```\nOutput:\n```\nhello world hello world hello world\n```\n(`slice1` through `slice5`, in order: `hello`, `world`, `hello`, `world`, `hello world`.) `0..5` means \"byte index 0 up to, but not including, 5\" — genuinely the same exclusive-range rule from Chapter 2.2. `..5` (no start) means \"from the beginning\"; `6..` (no end) means \"to the end\"; `..` alone means \"the entire thing.\" All five here are `&str` — a string slice, exactly the type used every time this book has written a string literal (`\"hello\"` is itself a `&'static str`, a slice into memory baked directly into the compiled binary).\n\n**2. A real, practical function returning a slice — \"the first word\" of a string.**\n```rust\nfn first_word(s: &String) -> &str {\n    let bytes = s.as_bytes();\n    for (i, &item) in bytes.iter().enumerate() {\n        if item == b' ' {\n            return &s[0..i];\n        }\n    }\n    &s[..]\n}\n\nfn main() {\n    let s = String::from(\"hello world\");\n    let word = first_word(&s);\n    println!(\"first word: {}\", word);\n}\n```\nOutput:\n```\nfirst word: hello\n```\n`first_word` walks byte-by-byte (`b' '` is a byte literal for the space character) until it finds one, then returns a slice up to that point — or the whole string if no space exists at all. Returning `&str` instead of, say, a separately-allocated copy of just \"hello\" is genuinely the idiomatic choice: no new allocation, and the slice stays tied to the original string's data.\n\n**3. The real payoff: a slice becomes invalid if the data it points into changes — caught at compile time.**\n```rust\nfn main() {\n    let mut s = String::from(\"hello world\");\n    let word = &s[0..5];\n    s.clear();\n    println!(\"first word: {}\", word);\n}\n```\nOutput:\n```\nerror[E0502]: cannot borrow `s` as mutable because it is also borrowed as immutable\n --> invalidated.rs:4:5\n  |\n3 |     let word = &s[0..5];\n  |                 - immutable borrow occurs here\n4 |     s.clear();\n  |     ^^^^^^^^^ mutable borrow occurs here\n5 |     println!(\"first word: {}\", word);\n  |                                ---- immutable borrow later used here\n```\nThis is exactly Chapter 2.4's borrowing rules doing real, concrete work: `word` is an active immutable borrow of `s`; `s.clear()` needs a mutable borrow to empty the string. The compiler catches this as a conflict *before the program ever runs* — in a language without this check, `word` would become a genuinely dangling reference into memory `s.clear()` may have already freed or reused, a real, classic bug (sometimes called \"the string got out from under me\") that Rust makes structurally impossible.\n\n**4. Array slices work identically, generalizing beyond strings.**\n```rust\nfn main() {\n    let a = [1, 2, 3, 4, 5];\n    let slice = &a[1..3];\n    println!(\"{:?}\", slice);\n    assert_eq!(slice, &[2, 3]);\n}\n```\nOutput:\n```\n[2, 3]\n```\n`&a[1..3]` is a `&[i32]` — a slice into the array, containing elements at indices 1 and 2 (again, the upper bound is exclusive). `assert_eq!` (Chapter 6.3 covers testing properly) simply panics if its two arguments aren't equal — here, confirming directly that the slice's contents are exactly `[2, 3]`.\n\n**5. An out-of-range slice is a real runtime panic — bounds-checked exactly like ordinary indexing.**\n```rust\nlet s = String::from(\"hi\");\nlet sl = &s[0..10];\n```\nOutput:\n```\nthread 'main' panicked at oobslice.rs:3:16:\nend byte index 10 is out of bounds for string of length 2\n```\nSlicing carries the identical bounds-checking guarantee Chapter 1.6 established for plain indexing — an invalid range panics immediately with a clear message, rather than silently producing a slice into memory that doesn't actually belong to the string.\n\n### ⚠️ Common Mistakes\n\n- **Writing a function that takes `&String` specifically when `&str` would accept both a `&String` and a plain string literal.** This book uses `&String` above to match its examples precisely, but idiomatic Rust generally prefers `&str` parameters for exactly this flexibility — Chapter 2.6 covers the `String`/`&str` relationship in full.\n- **Assuming a slice keeps its underlying data alive on its own.** A slice is a reference — it borrows, and is subject to every rule from Chapter 2.4, including this chapter's Example 3, where the underlying data being mutated invalidates the slice.\n- **Forgetting slice ranges use byte indices for strings, not character indices.** For plain ASCII text these are identical, but Chapter 2.6 covers the real, important distinction once genuinely multi-byte Unicode text is involved.\n- **Assuming an out-of-range slice silently produces an empty or truncated result.** As Example 5 showed, it's a real, immediate panic instead.\n\n### How this connects\n\nChapter
