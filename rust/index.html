le": "Part VIII — Editing & Revision", "partMetaphor": "testing, tooling & the craft of real programs", "chapNum": 6, "slug": "understanding-compiler-errors", "fullTitle": "Understanding Compiler Errors", "title": "Understanding Compiler Errors", "md": "### Why this matters\n\nEvery chapter in this book has shown a real compiler error, and every one has been genuinely specific, actionable, and honest about the actual problem. This closing chapter of Part Eight makes explicit what's been true throughout: reading a Rust error carefully is a genuine, learnable skill, and the compiler is consistently trying to help, not just reject.\n\n### The core idea\n\nA Rust error has a consistent, real structure: an error code (`E0382`, and so on), a message naming the actual problem, a pointer at the exact, real location, and — very often — a concrete, specific suggestion. `rustc --explain <code>` gives a fuller, offline explanation with further examples, for any error code encountered.\n\n### Examples\n\n**1. Reading a real error's full structure, piece by piece.**\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1;\n    println!(\"{}\", s1);\n    println!(\"{}\", s2);\n}\n```\nOutput:\n```\nerror[E0382]: borrow of moved value: `s1`\n --> err1.rs:4:20\n  |\n2 |     let s1 = String::from(\"hello\");\n  |         -- move occurs because `s1` has type `String`, which does not implement the `Copy` trait\n3 |     let s2 = s1;\n  |              -- value moved here\n4 |     println!(\"{}\", s1);\n  |                    ^^ value borrowed here after move\n  |\nhelp: consider cloning the value if the performance cost is acceptable\n  |\n3 |     let s2 = s1.clone();\n  |                ++++++++\n```\nReading top to bottom: `error[E0382]` names both the *category* (a real, specific, lookupable code) and a one-line summary. `--> err1.rs:4:20` is the exact file/line/column the problem was ultimately detected at. The indented source excerpt shows the *entire relevant history* — where the move happened (line 3), not just where it caused a problem (line 4) — with `^^^` marking the precise span. `help:` suggests a concrete, specific fix, often (as here) with an exact, ready-to-apply diff.\n\n**2. `rustc --explain` — a fuller, offline explanation with further examples.**\n```\n$ rustc --explain E0382\n```\nOutput (excerpt):\n```\nA variable was used after its contents have been moved elsewhere.\n\nErroneous code example:\n\nstruct MyStruct { s: u32 }\n\nfn main() {\n    let mut x = MyStruct{ s: 5u32 };\n    let y = x;\n    x.s = 6;\n    println!(\"{}\", x.s);\n}\n\nSince `MyStruct` is a type that is not marked `Copy`, the data gets moved out\nof `x` when we set `y`. This is fundamental to Rust's ownership system...\n```\nThis is genuinely a real, complete teaching resource built directly into the toolchain — no internet connection needed, no separate documentation site to find. Every numbered error code this book has shown (`E0382`, `E0499`, `E0502`, `E0308`, and dozens more) has one of these behind it.\n\n**3. A genuinely trickier error — reading past the first line to find the real, root cause.**\n```rust\nstruct Wrapper<'a> {\n    value: &'a str,\n}\nfn make_wrapper() -> Wrapper<'static> {\n    let s = String::from(\"hello\");\n    Wrapper { value: &s }\n}\n```\nOutput:\n```\nerror[E0515]: cannot return value referencing local variable `s`\n --> err2.rs:6:5\n  |\n6 |     Wrapper { value: &s }\n  |     ^^^^^^^^^^^^^^^^^--^^\n  |     |                |\n  |     |                `s` is borrowed here\n  |     returns a value referencing data owned by the current function\n```\nThis error's *message* names the symptom precisely (`cannot return value referencing local variable`), but understanding *why* requires connecting it back to the function's own declared signature: `make_wrapper` promised a `Wrapper<'static>` (Chapter 4.10 — valid for the entire remaining program), but `s` is a genuinely local variable, dropped the instant the function returns. No lifetime, however cleverly annotated, can make a truly local value live forever — the real fix is either returning an owned `String` inside `Wrapper` instead of a reference, or not promising `'static` at all. This is the real, honest skill this chapter is about: the error correctly names *what* went wrong; connecting it to *why*, based on everything the surrounding code actually declared, is where careful reading pays off.\n\n### ⚠️ Common Mistakes\n\n- **Reading only an error's first line and guessing at a fix**, rather than reading the full, indented source excerpt showing the complete relevant history — as Example 1 showed, the *real* cause (the move) is often several lines away from where the error is finally reported.\n- **Forgetting `rustc --explain <code>` exists**, and searching externally for an error code that already has a complete, real, offline explanation built directly into the toolchain.\n- **Treating a real, correctly-reported error as the compiler being difficult**, rather than as a genuine, accurate signal that something in the code's actual design (Example 3's over-promised `'static` lifetime) needs rethinking, not just silencing.\n- **Applying a suggested fix mechanically without understanding why it works.** A `help:` suggestion (Example 1) is usually correct, but understanding the actual underlying rule (here, Chapter 2.3's move semantics) is what prevents the identical mistake from recurring elsewhere.\n\n### How this connects\n\nThis closes out Part Eight — testing (6.3–6.5), tooling (8.2–8.3), common pitfalls (8.4), performance (8.5), and now reading errors well, together forming the practical, everyday craft this book's earlier chapters all fed into. Every single compiler error shown across this entire book was read exactly this way — this chapter simply makes the process explicit.\n\n### Quick recap\n\n- A Rust error's structure is consistent: an error code, a precise location, the full relevant source history, and often a concrete, specific suggestion.\n- `rustc --explain <code>` gives a fuller, complete, offline explanation for any numbered error — no external search needed.\n- The error's message names the symptom accurately; understanding the real, root cause often requires reading the surrounding code's own declared intent (a function signature's promised lifetime, a type's actual bounds), not just the error's own final line.\n- A correctly-reported compiler error is a genuine, accurate signal about the code's actual design — treat it as information to act on, not an obstacle to route around."}, {"id": "9.1", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis", "chapNum": 1, "slug": "designing-a-rust-program-from-scratch", "fullTitle": "Designing a Rust Program From Scratch", "title": "Designing a Rust Program From Scratch", "md": "### Why this matters\n\nEvery chapter so far covered one feature in isolation. Real programs combine many of them — modules, custom errors, ownership design, `HashMap`-backed state — into one coherent whole. This chapter walks through designing a small, genuinely real program from scratch, applying deliberate choices from across this entire book, before Chapter 9.2's larger capstone.\n\n### The core idea\n\nDesigning a real Rust program means making deliberate structural choices *before* writing much code: what belongs in its own module (Chapter 4.1), what a function should actually own versus borrow (Chapters 2.3–2.4), and how failures should be represented (Chapters 3.5, 6.2's error patterns) — all decided deliberately, not discovered by accident partway through.\n\n### Examples\n\n**1. Designing the error type first — deciding what can go wrong, before writing the logic that might fail.**\n```rust\n// src/errors.rs\nuse std::fmt;\n\n#[derive(Debug)]\npub enum TaskError {\n    NotFound(u32),\n    InvalidTitle,\n}\n\nimpl fmt::Display for TaskError {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        match self {\n            TaskError::NotFound(id) => write!(f, \"task {} not found\", id),\n            TaskError::InvalidTitle => write!(f, \"task title cannot be empty\"),\n        }\n    }\n}\n\nimpl std::error::Error for TaskError {}\n```\nThis applies Chapter 7.7's real error-design philosophy directly: a genuine, structured enum (rather than a bare `String`) that callers can `match` on, with `Display` implemented by hand for full control over the message (a `thiserror` `#[derive(Error)]` would do the identical job with less code, but writing it out once here makes the actual mechanism explicit). Designing this *first*, before the store that actually throws it, makes the failure modes an explicit, deliberate part of the design.\n\n**2. Encapsulating state behind a struct, with a deliberate ownership boundary.**\n```rust\n// src/task_store.rs\nuse crate::errors::TaskError;\nuse std::collections::HashMap;\n\npub struct Task {\n    pub id: u32,\n    pub title: String,\n    pub done: bool,\n}\n\npub struct TaskStore {\n    tasks: HashMap<u32, Task>,\n    next_id: u32,\n}\n\nimpl TaskStore {\n    pub fn new() -> Self {\n        TaskStore { tasks: HashMap::new(), next_id: 1 }\n    }\n\n    pub fn add(&mut self, title: &str) -> Result<u32, TaskError> {\n        if title.trim().is_empty() {\n            return Err(TaskError::InvalidTitle);\n        }\n        let id = self.next_id;\n        self.next_id += 1;\n        self.tasks.insert(id, Task { id, title: title.to_string(), done: false });\n        Ok(id)\n    }\n\n    pub fn complete(&mut self, id: u32) -> Result<(), TaskError> {\n        match self.tasks.get_mut(&id) {\n            Some(task) => {\n                task.done = true;\n                Ok(())\n            }\n            None => Err(TaskError::NotFound(id)),\n        }\n    }\n\n    pub fn list(&self) -> Vec<&Task> {\n        let mut tasks: Vec<&Task> = self.tasks.values().collect();\n        tasks.sort_by_key(|t| t.id);\n        tasks\n    }\n}\n```\n`tasks` and `next_id` are genuinely private (Chapter 4.2) — the only way to add, complete, or view tasks is through `TaskStore`'s own deliberate public methods, which validate input (`add`'s empty-title check) before anything is stored. `add`/`complete` take `&mut self` (Chapter 2.8), since they genuinely mutate; `list` takes `&self` and returns *borrowed* references (`Vec<&Task>`), a deliberate choice avoiding a real, unnecessary clone of every task just to display them — this only compiles cleanly because Chapter 4.9's lifetime elision correctly ties the returned references' validity to `&self`'s own borrow.\n\n**3. Wiring the pieces together — the entry point, using both modules.**\n```rust\n// src/main.rs\nmod errors;\nmod task_store;\n\nuse task_store::TaskStore;\n\nfn main() {\n    let mut store = TaskStore::new();\n\n    let id1 = store.add(\"Write chapter 9.1\").unwrap();\n    store.add(\"Verify examples\").unwrap();\n    store.complete(id1).unwrap();\n\n    for task in store.list() {\n        println!(\"[{}] {} (done: {})\", task.id, task.title, task.done);\n    }\n\n    match store.complete(999) {\n        Ok(_) => println!(\"completed\"),\n        Err(e) => println!(\"Error: {}\", e),\n    }\n\n    match store.add(\"\") {\n        Ok(_) => println!(\"added\"),\n        Err(e) => println!(\"Error: {}\", e),\n    }\n}\n```\nOutput:\n```\n[1] Write chapter 9.1 (done: true)\n[2] Verify examples (done: false)\nError: task 999 not found\nError: task title cannot be empty\n```\nThis is Chapter 4.1's module organization in practice — `errors.rs` and `task_store.rs` each have one clear responsibility, wired together in `main.rs`. The two `match` blocks at the end deliberately handle *both* of `TaskError`'s real variants (Chapter 3.1's exhaustiveness discipline, applied at the call site rather than inside a single `match`) — each demonstrating a genuine, distinct failure mode the design anticipated back in Example 1.\n\n### ⚠️ Common Mistakes\n\n- **Writing all the logic in `main.rs` before thinking about module boundaries.** Designing `errors.rs` and `task_store.rs` as separate, focused modules *before* writing `main.rs` made each one's responsibility genuinely clear.\n- **Exposing internal state directly** (making `tasks`/`next_id` public fields, for instance) instead of deliberate methods. This would let external code bypass `TaskStore`'s own invariants entirely — inserting a task with an empty title, for instance, with no validation at all.\n- **Returning owned, cloned data from `list()`** when borrowed references (`Vec<&Task>`) genuinely suffice — a real, unnecessary performance cost, and precisely the kind of choice Chapter 2.4's borrowing discipline exists to make natural rather than an afterthought.\n- **Deferring error design until something actually breaks**, rather than designing the failure modes deliberately alongside the success path from the start, as Example 1 did first.\n\n### How this connects\n\nChapter 9.2 (Capstone: Build Something Real) applies this exact same design discipline to a considerably larger, more complete program, pulling together nearly every tool covered across this entire book. Every technique used here traces back to a specific earlier chapter — Chapters 3.6/7.7's error design, Chapter 4.1–4.2's module organization, and Chapter 2.4's deliberate borrowing.\n\n### Quick recap\n\n- Design a program's error type deliberately, alongside its success-path logic, as a real, structured enum callers can match on — not an afterthought.\n- Encapsulate state behind a struct's own methods, validating input at the boundary rather than trusting external code to behave.\n- Choose ownership deliberately at each function boundary — borrowing (`&self`, returning references) when genuine ownership transfer isn't needed, exactly as Chapters 2.3–2.4 established.\n- Split a program into focused modules by responsibility *before* writing much code, rather than retrofitting boundaries onto one large file later."}, {"id": "9.2", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis", "chapNum": 2, "slug": "capstone-build-something-real", "fullTitle": "Capstone: Build Something Real", "title": "Capstone: Build Something Real", "md": "### Why this matters\n\nThis chapter builds a genuinely complete, small program — a real ELF binary header scanner — pulling together modules, custom errors, structs, enums, pattern matching, file I/O, and byte-level parsing into one working whole. This isn't a toy example: it reads the *actual* header format real executables on Linux use, applying this book's own stated motivation directly.\n\n### The core idea\n\nA real program is built in deliberate layers, exactly like Chapter 9.1 established: an errors layer describing what can go wrong, a parsing layer that owns the actual logic and knows nothing about the command line, and a thin entry point that wires the two together and reports results.\n\n### Building it, layer by layer\n\n**1. Errors — a real, structured type covering every genuine failure mode.**\n```rust\n// src/errors.rs\nuse std::fmt;\n\n#[derive(Debug)]\npub enum ScanError {\n    Io(std::io::Error),\n    NotElf,\n    TooSmall,\n}\n\nimpl fmt::Display for ScanError {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        match self {\n            ScanError::Io(e) => write!(f, \"I/O error: {}\", e),\n            ScanError::NotElf => write!(f, \"not a valid ELF file (bad magic bytes)\"),\n            ScanError::TooSmall => write!(f, \"file too small to contain a valid ELF header\"),\n        }\n    }\n}\n\nimpl std::error::Error for ScanError {}\n\nimpl From<std::io::Error> for ScanError {\n    fn from(e: std::io::Error) -> Self {\n        ScanError::Io(e)\n    }\n}\n```\n`impl From<std::io::Error> for ScanError` (Chapter 7.1) is exactly what lets `?` (Chapter 3.6) automatically convert a raw file-I/O error into this program's own, unified error type — used directly in the next layer.\n\n**2. Parsing — the actual, real ELF header logic.**\n```rust\n// src/elf.rs\nuse crate::errors::ScanError;\nuse std::fs::File;\nuse std::io::Read;\n\nconst ELF_MAGIC: [u8; 4] = [0x7f, b'E', b'L', b'F'];\nconst HEADER_SIZE: usize = 32;\n\n#[derive(Debug)]\npub enum Class { Bit32, Bit64, Unknown(u8) }\n\n#[derive(Debug)]\npub enum Endianness { Little, Big, Unknown(u8) }\n\npub struct ElfHeader {\n    pub class: Class,\n    pub endianness: Endianness,\n    pub elf_type: u16,\n    pub machine: u16,\n    pub entry_point: u64,\n}\n\npub fn scan_file(path: &str) -> Result<ElfHeader, ScanError> {\n    let mut file = File::open(path)?;\n    let mut header = [0u8; HEADER_SIZE];\n    file.read_exact(&mut header).map_err(|_| ScanError::TooSmall)?;\n\n    if header[0..4] != ELF_MAGIC {\n        return Err(ScanError::NotElf);\n    }\n\n    let class = match header[4] {\n        1 => Class::Bit32,\n        2 => Class::Bit64,\n        other => Class::Unknown(other),\n    };\n    let endianness = match header[5] {\n        1 => Endianness::Little,\n        2 => Endianness::Big,\n        other => Endianness::Unknown(other),\n    };\n\n    // Per the real ELF64 spec: e_type at byte offset 16, e_machine at 18, e_entry at 24.\n    let elf_type = u16::from_le_bytes([header[16], header[17]]);\n    let machine = u16::from_le_bytes([header[18], header[19]]);\n    let entry_point = u64::from_le_bytes(header[24..32].try_into().unwrap());\n\n    Ok(ElfHeader { class, endianness, elf_type, machine, entry_point })\n}\n\npub fn machine_name(machine: u16) -> &'static str {\n    match machine {\n        0x03 => \"x86\",\n        0x3e => \"x86-64\",\n        0x28 => \"ARM\",\n        0xb7 => \"AArch64\",\n        _ => \"unknown\",\n    }\n}\n```\nThis applies a large fraction of the whole book at once: a fixed-size byte array (`[0u8; HEADER_SIZE]`, Chapter 1.6) read directly via `Read::read_exact` (new here — `std::io::Read`'s own method for filling an exact-sized buffer, a level below Chapter 7.4's line-oriented `BufReader`); `u16::from_le_bytes`/`u64::from_le_bytes` reconstructing real multi-byte integers from their raw little-endian representation (exactly the byte-level view Chapter 7.12 examined from the outside, now built from the inside); a real `enum` with an `Unknown(u8)` catch-all (Chapter 2.9) rather than panicking on an unexpected value; and `?` (Chapter 3.6) propagating a genuine I/O failure automatically through the `From` implementation from Example 1.\n\n**3. Wiring it together and exercising it — against a real, live binary on the actual system.**\n```rust\n// src/main.rs\nmod elf;\nmod errors;\n\nuse std::env;\n\nfn main() {\n    let args: Vec<String> = env::args().collect();\n    if args.len() < 2 {\n        eprintln!(\"Usage: {} <path>\", args[0]);\n        std::process::exit(1);\n    }\n\n    match elf::scan_file(&args[1]) {\n        Ok(header) => {\n            println!(\"File: {}\", args[1]);\n            println!(\"Class: {:?}\", header.class);\n            println!(\"Endianness: {:?}\", header.endianness);\n            println!(\"Type: {:#06x}\", header.elf_type);\n            println!(\"Machine: {:#06x} ({})\", header.machine, elf::machine_name(header.machine));\n            println!(\"Entry point: {:#x}\", header.entry_point);\n        }\n        Err(e) => {\n            eprintln!(\"Error scanning {}: {}\", args[1], e);\n            std::process::exit(1);\n        }\n    }\n}\n```\nRun against the real `/bin/ls` binary on this book's own machine:\n```\n$ cargo run -- /bin/ls\nFile: /bin/ls\nClass: Bit64\nEndianness: Little\nType: 0x0003\nMachine: 0x003e (x86-64)\nEntry point: 0x6d30\n```\nEvery value here was independently cross-checked against the raw bytes of the real file (confirmed directly, byte for byte, against a separate, independent parse of the same file) — `0x7f 'E' 'L' 'F'` as the real magic number, `Bit64`/`Little` from bytes 4–5, `0x3e` (x86-64) as the real machine type, and `0x6d30` as the genuine entry point address where this actual binary begins executing. Running it against a real failure case:\n```\n$ cargo run -- notelf.txt\nError scanning notelf.txt: not a valid ELF file (bad magic bytes)\n```\n```\n$ cargo run -- /nonexistent\nError scanning /nonexistent: I/O error: No such file or directory (os error 2)\n```\nBoth real, distinct failure modes — a genuinely non-ELF file, and a file that doesn't exist at all — are caught and reported with a specific, correct message, each exiting with status `1` (Chapter 7.5), confirmed directly.\n\n### ⚠️ Common Mistakes\n\n- **Guessing at a binary format's byte offsets instead of verifying them against the real specification.** This chapter's own first draft made exactly this mistake — reading the entry point from the wrong offset entirely — caught and fixed only by independently cross-checking the parsed value against a separately-verified reference. Never trust an assumed offset in binary parsing without confirming it.\n- **Panicking on an unexpected byte value** (an unrecognized class or endianness byte) instead of representing it honestly with a catch-all enum variant (`Unknown(u8)`, as this chapter's `Class`/`Endianness` do) — a real binary being scanned might genuinely not match every assumption made about \"normal\" files.\n- **Letting the parsing layer know about command-line arguments or `std::process::exit`.** `elf.rs` is completely free of both — it's a pure, reusable function taking a path and returning a `Result`, exactly the layering Chapter 9.1 established.\n- **Reading a fixed-size header without checking the file was actually long enough**, risking a panic instead of a real, reported error — `read_exact`'s own failure is deliberately mapped to a specific `ScanError::TooSmall` rather than left as a raw, less-informative I/O error.\n\n### How this connects\n\nThis capstone is the concrete, complete synthesis of nearly every chapter in this book — ownership and borrowing (Part Two), enums and error handling (Part Three), modules (Part Four/Six), and Chapter 7.12's own byte-level binary analysis, now actually implemented rather than just read about. Chapter 9.3 (Afterword) closes out the book properly.\n\n### Quick recap\n\n- A well-designed program separates concerns into layers — errors, core logic, and a thin entry point — each with a clear, narrow responsibility.\n- Real binary-format parsing means reading raw bytes at *verified*, correct offsets (never guessed) and reconstructing multi-byte values with the correct endianness (`from_le_bytes`/`from_be_bytes`).\n- An `Unknown(u8)`-style catch-all enum variant handles unexpected input honestly, without panicking on a real, legitimately-encountered value the code didn't anticipate.\n- Verifying a complete program means running it for real — against a genuine, real binary on the actual system, and against real, distinct failure cases — exactly as done throughout this entire book."}, {"id": "9.3", "partNum": 9, "partTitle": "Part IX — The Novel", "partMetaphor": "synthesis", "chapNum": 3, "slug": "afterword-where-to-go-next", "fullTitle": "Afterword: Where to Go Next", "title": "Afterword: Where to Go Next", "md": "You started this book with `println!(\"Hello, world!\")`. You just finished it by parsing the real, raw header bytes of an actual binary on your own machine — magic numbers, endianness, entry points, all read directly and independently cross-checked for correctness. Everything between those two points was built the same way: one claim verified by actually compiling and running it, never assumed correct from memory or reputation.\n\nLook back at the shape this book followed. The Alphabet gave you the raw syntax and a real, deliberate first encounter with what makes Rust different — integer overflow checked, not ignored. Words gave you the vocabulary, ending in the single idea this entire language is built around: ownership. Sentences gave you pattern matching and Rust's two-part story for failure — `panic!` for the unrecoverable, `Result` for the expected. Grammar gave you generics, traits, closures, iterators, and lifetimes — the full, general shape a real function signature can take, all resolved at compile time with zero runtime cost, verified directly against real compiled binaries in Chapter 7.12 rather than taken on faith. Paragraphs took you through smart pointers into real concurrency — threads, channels, and the two marker traits, `Send` and `Sync`, that make a data race a compile-time impossibility rather than a runtime risk you have to be careful about. Chapters gave you real project organization — libraries, binaries, workspaces, and a complete, standard testing story built directly into the toolchain. Style & Voice gave you the everyday toolbox — JSON, regex, real error-handling crates, calling into C — and this book's own actual reason for existing: what `unsafe` really means, and why a real, compiled Rust binary is genuinely harder to reverse-engineer than the equivalent binary from most other languages. Editing & Revision gave you debugging, formatting, linting, and reading a compiler error as the genuinely specific, actionable help it almost always is. And The Novel put every one of those pieces together into a real, complete, working program.\n\nA few genuinely large things were left out on purpose, not by oversight. `async`/`await`'s full ecosystem — Chapter 7.11 showed you honestly that Rust's standard library includes no runtime at all, and choosing one (`tokio`, most commonly) is a real, separate, project-level decision this book deliberately didn't make for you. `unsafe` and FFI — Chapters 7.9 and 7.10 gave you enough to recognize both accurately and use them for a genuine, real reason, not a systems-programming-grade treatment of every advanced pattern either one supports. Writing your own macros — you've used `println!`, `vec!`, and `#[derive(...)]` constantly, but authoring a macro yourself is a genuinely separate, more advanced skill. `no_std`/embedded Rust and WebAssembly — both real, narrower specializations built on everything this book covered, not additions to the core language itself. None of it was skipped because it doesn't matter. It was left out so that everything actually included — especially ownership, borrowing, and the compile-time guarantees built on top of them — could get the depth and the verification this book insisted on throughout.\n\nSo where do you go from here? Honestly, wherever the work in front of you actually points. If reverse engineering and malware analysis are genuinely why you picked up this book, you now have exactly what Chapter 7.12 promised: the ability to recognize monomorphized, inlined Rust code in a disassembler, to know precisely what a stripped versus an unstripped binary actually reveals, and to read a real sample's `unsafe`/FFI boundaries accurately instead of guessing. If you're building your own tools, `serde`, `regex`, `anyhow`, and `clap` (a real, standard crate for command-line argument parsing this book didn't cover directly, but which you can now read the documentation for fluently) are exactly where most real, practical Rust projects start. If a specific domain calls for it — embedded systems, WebAssembly, a specific async runtime's own deeper ecosystem — you'll read that domain's own documentation now understanding every piece of ordinary Rust underneath it.\n\nBut the single most valuable thing this book tried to hand you isn't a fact about Rust at all — it's a habit, the same one every chapter modeled directly: check the claim, don't trust the assumption. This book's own drafting caught a real, wrong assumption about a binary format's byte offset by independently verifying it against the actual file, not by trusting what \"should\" have been true. It caught a real, current edition-specific requirement (`unsafe extern`, `unsafe(no_mangle)`) that an older tutorial would get wrong. It corrected its own overclaim about a compile-time default (`rustc`'s actual edition) the moment testing revealed it. None of that is Rust-specific — it's the one habit that outlasts any single language, and it's the real reason this book verified every single example rather than describing any of them from memory.\n\nTwo things are waiting for you in the Appendix whenever you need them: a Quick-Reference Cheat Sheet for when you half-remember a piece of syntax, and a Glossary for when a term shows up and the exact definition has slipped your mind. You don't need either right now. Just know they're there.\n\nGood luck. Go read something real."}, {"id": "10.1", "partNum": 10, "partTitle": "Back Matter", "partMetaphor": "Appendix & Glossary", "chapNum": 1, "slug": "appendix-a-quick-reference-cheat-sheet", "fullTitle": "Appendix A: Quick Reference Cheat Sheet", "title": "Quick Reference Cheat Sheet", "md": "A single-page-style reference for syntax you already learned across this book. Not a tutorial — if a line here doesn't immediately make sense, its chapter number points back to the full explanation.\n\n### Variables & basic types (Part One)\n\n```rust\nlet x = 5;              // immutable\nlet mut x = 5;           // mutable\nlet x: i32 = 5;           // explicit type\nconst MAX: u32 = 100_000; // compile-time constant, always typed\nlet x = \"shadowed\";       // shadowing: a genuinely new binding, can change type\n```\nScalars: `i8`/`i16`/`i32`/`i64`/`i128`/`isize`, `u8`/`u16`/`u32`/`u64`/`u128`/`usize`, `f32`/`f64`, `bool`, `char` (4 bytes, a Unicode scalar value). Compound: tuples `(T, U)`, arrays `[T; N]`. (1.4–1.6)\n\n### Ownership & borrowing (Part Two)\n\n```rust\nlet s2 = s1;        // move (unless T: Copy) — s1 no longer usable\nlet s2 = s1.clone(); // explicit deep copy\nfn f(s: &String) {}  // borrow — doesn't take ownership\nfn f(s: &mut String) {} // mutable borrow\n```\nRules: one mutable reference *or* any number of immutable references, never both, at the same time; a reference must never outlive the data it points to. (2.3–2.4)\n\nSlices: `&s[0..2]`, `&s[..2]`, `&s[2..]`, `&s[..]`; array slices `&a[1..3]`. (2.5)\n\n### Strings (2.6)\n\n```rust\nlet s = String::from(\"hi\"); let s = \"hi\".to_string();\ns.push_str(\" there\"); s.push('!');\nlet s3 = s1 + &s2;          // moves s1\nformat!(\"{s1}{s2}\");         // never moves either\nfor c in s.chars() {}        // Unicode scalar values\nfor b in s.bytes() {}        // raw UTF-8 bytes\n```\n\n### Structs, enums, Option (2.7–2.9)\n\n```rust\nstruct Point { x: i32, y: i32 }\nlet p = Point { x: 1, y: 2 };\nlet p2 = Point { y: 3, ..p };  // update syntax\nstruct Pair(i32, i32);          // tuple struct\nstruct Unit;                    // unit-like struct\n\nenum Shape { Circle(f64), Rect { w: f64, h: f64 }, Point }\n\nenum Option<T> { Some(T), None }\nopt.unwrap(); opt.unwrap_or(0); opt.is_some();\n```\n\n### Collections (2.10–2.11)\n\n```rust\nlet v = vec![1, 2, 3];\nv.push(4); v[0]; v.get(0); // get() returns Option, never panics\nlet mut m: HashMap<String, i32> = HashMap::new();\nm.insert(k, v); m.get(&k); m.entry(k).or_insert(0);\n```\n\n### Pattern matching (Part Three)\n\n```rust\nmatch x {\n    1 | 2 => \"one or two\",\n    3..=5 => \"three to five\",\n    n if n < 0 => \"negative\",\n    _ => \"other\",\n}\nif let Some(x) = opt { }        // else { }\nwhile let Some(x) = stack.pop() { }\nlet Some(x) = opt else { return }; // let-else\n```\n\n### Errors (3.4–3.6, 7.7)\n\n```rust\npanic!(\"message\");                       // unrecoverable, unwinds (or aborts)\nfn f() -> Result<T, E> { Ok(v) }         // recoverable\nresult?;                                  // propagate, converting via From\nresult.unwrap(); result.expect(\"msg\");   // panic on Err\n```\n`anyhow::Result<T>` for applications, `#[derive(thiserror::Error)]` for libraries. (7.7)\n\n### Modules & visibility (Part Four/Six)\n\n```rust\nmod front_of_house { pub mod hosting { pub fn seat() {} } }\nuse crate::front_of_house::hosting;\npub use hosting::seat;   // re-export\n```\nEverything is private by default; `pub` makes an item, and each of a struct's fields individually, visible outward.\n\n### Generics, traits, bounds (4.3–4.5)\n\n```rust\nfn largest<T: PartialOrd>(list: &[T]) -> &T { }\nstruct Point<T> { x: T, y: T }\ntrait Summary { fn summarize(&self) -> String { String::from(\"(default)\") } }\nimpl Summary for Article { fn summarize(&self) -> String { ... } }\nfn notify(item: &impl Summary) {}\nfn notify<T: Summary + Display>(item: &T) {}\nfn f<T>(x: T) where T: Summary + Clone {}\n```\n\n### Closures & iterators (4.6–4.8)\n\n```rust\nlet add = |a, b| a + b;\nlet mut count = 0;\nlet mut inc = || { count += 1; };   // FnMut\nlet owned = move || println!(\"{v}\"); // FnOnce/move\nv.iter().map(|x| x * 2).filter(|x| x % 2 == 0).sum::<i32>();\nv.iter().enumerate(); v.iter().zip(other); v.iter().rev();\n```\n`Fn` (borrows) ⊂ `FnMut` (mutably borrows) ⊂ `FnOnce` (consumes) — every closure implements at least `FnOnce`.\n\n### Lifetimes (4.9–4.10)\n\n```rust\nfn longest<'a>(x: &'a str, y: &'a str) -> &'a str { }\nstruct Excerpt<'a> { part: &'a str }\nimpl<'a> Excerpt<'a> { fn f(&self) -> &str { self.part } } // elided\n'static  // valid for the whole program (e.g. string literals)\n```\n\n### Smart pointers & concurrency (Part Five)\n\n```rust\nBox<T>          // heap allocation, single owner\nRc<T>           // multiple owners, single-threaded, .clone() bumps a count\nRefCell<T>      // interior mutability, borrow rules checked at runtime\nRc<RefCell<T>>  // the common shared + mutable single-threaded combo\nWeak<T>         // non-owning reference, breaks Rc cycles\n\nlet handle = thread::spawn(move || { /* work */ });\nhandle.join().unwrap();\nlet (tx, rx) = mpsc::channel();\ntx.send(val).unwrap(); rx.recv().unwrap();\nlet data = Arc::new(Mutex::new(0));\n*data.lock().unwrap() += 1;\n```\n`Send` = safe to move to another thread. `Sync` = safe to share (`&T`) across threads.\n\n### Cargo & testing (Part Six)\n\n```\ncargo new project_name       cargo build / cargo build --release\ncargo run                    cargo check\ncargo test                   cargo test -- --ignored\ncargo doc --open             cargo add crate_name\ncargo fmt                    cargo clippy\n```\n```rust\n#[test]\nfn it_works() { assert_eq!(2 + 2, 4); }\n#[test] #[should_panic(expected = \"msg\")]\nfn it_panics() { }\n```\n\n### Common derivable traits (7.1)\n\n```rust\n#[derive(Debug, Clone, PartialEq, Default)]\nstruct P { x: i32 }\n```\n`Debug` → `{:?}`/`{:#?}`. `Clone` → `.clone()`. `PartialEq` → `==`. `Default` → `P::default()`.\n```rust\nimpl From<Celsius> for Fahrenheit { fn from(c: Celsius) -> Self { ... } }\nlet f: Fahrenheit = c.into();   // Into is automatic from From\n```\n\n### unsafe & FFI (7.9–7.10)\n\n```rust\nunsafe { *raw_ptr }                 // dereferencing a raw pointer\nunsafe fn dangerous() {}            // must be called inside unsafe { }\nunsafe extern \"C\" { fn abs(x: i32) -> i32; }   // 2024 edition requires `unsafe extern`\n#[unsafe(no_mangle)] pub extern \"C\" fn add(a: i32, b: i32) -> i32 { a + b }\n```\n\n### async (7.11)\n\n```rust\nasync fn fetch() -> String { ... }        // returns an inert Future\n#[tokio::main]\nasync fn main() { let s = fetch().await; }\ntokio::join!(fetch(), fetch());\n```\n\n### Reading a compiler error (8.6)\n\n```\nerror[E0382]: borrow of moved value: `s1`\n --> src/main.rs:4:20        <- exact location\n  | move occurs because ...  <- the actual cause\n  | value borrowed here after move\nhelp: consider cloning ...   <- a concrete, often ready-to-apply fix\n```\n`rustc --explain E0382` for a full, offline explanation of any code."}, {"id": "10.2", "partNum": 10, "partTitle": "Back Matter", "partMetaphor": "Appendix & Glossary", "chapNum": 2, "slug": "appendix-b-glossary-of-terms", "fullTitle": "Appendix B: Glossary of Terms", "title": "Glossary of Terms", "md": "Terms from across this book, alphabetically, each with the chapter where it was actually introduced.\n\n**Arc\\<T\\>** — Atomically Reference Counted; a thread-safe version of `Rc<T>`, almost always paired with `Mutex<T>` to share mutable state across threads. (5.10)\n\n**associated function** — a function defined inside an `impl` block that doesn't take `self`, called on the type itself (`String::from(...)`). A constructor is the most common example. (2.8)\n\n**blanket implementation** — a trait implementation that applies to every type satisfying some bound, rather than one specific type (e.g. the standard library's `impl<T: Display> ToString for T`). (4.5)\n\n**borrow checker** — the part of the compiler that enforces ownership and borrowing rules at compile time, rejecting code that could cause a data race or use-after-free before it ever runs. (2.3–2.4)\n\n**Box\\<T\\>** — a smart pointer that stores its value on the heap instead of the stack, giving it a fixed, known size regardless of what it contains. (5.1)\n\n**Clone** — a trait providing `.clone()`, an explicit, possibly expensive deep copy; contrast with `Copy`. (2.3, 7.1)\n\n**closure** — an anonymous function that can capture variables from its surrounding scope, written `|params| expression`. (4.6)\n\n**Copy** — a trait marking a type as implicitly duplicated on assignment (copied, not moved) — simple, fixed-size types like integers and `bool`. (2.3)\n\n**crate** — the smallest unit of compilation Rust considers at a time; a binary crate produces an executable, a library crate produces something other crates can depend on. (4.1–4.2, 6.1)\n\n**Debug** — a trait providing `{:?}` formatting, generally derived rather than hand-written, meant for developers rather than end users. (2.7, 7.1)\n\n**Deref coercion** — the compiler automatically converting `&T` to `&U` when `T` implements `Deref<Target = U>`, chaining through multiple levels if needed (e.g. `&String` to `&str`). (5.2)\n\n**Display** — a trait providing `{}` formatting, always hand-written (never derived), meant for end-user-facing output. (7.2)\n\n**dyn compatible** — a trait whose methods can all be called through a trait object (`dyn Trait`) — roughly, no generic methods and no returning `Self` by value. Formerly called \"object safe.\" (5.7)\n\n**dynamic dispatch** — choosing which concrete implementation of a method to call at runtime rather than compile time, via a trait object (`dyn Trait`); contrast with monomorphization. (5.7)\n\n**edition** — a versioned set of language rules (2015, 2018, 2021, 2024) a crate opts into via `Cargo.toml`, allowing the language to evolve without breaking old code compiled under an earlier edition. (0.2)\n\n**enum** — a type defined as one of several named variants, each optionally carrying its own data. (2.9)\n\n**FFI** — Foreign Function Interface; calling code written in another language (typically C) from Rust, or exposing Rust functions to be called from another language. (7.10)\n\n**Fn / FnMut / FnOnce** — the three closure traits, in order of decreasing restriction: `Fn` only borrows its captures, `FnMut` may mutate them, `FnOnce` may consume them and so can only be called once. (4.6)\n\n**From / Into** — a conversion trait pair: implementing `From<A> for B` gives `A::into::<B>()` (or the reverse call style) for free, and is exactly what powers `?`'s automatic error conversion. (7.1, 3.6)\n\n**generic** — a placeholder type parameter (conventionally `T`, `U`, ...) letting one function, struct, or enum work across many concrete types. (4.3)\n\n**HashMap\\<K, V\\>** — a collection of key/value pairs with no guaranteed iteration order, backed by a hash table. (2.11)\n\n**interior mutability** — mutating data through a shared (`&`) reference, by moving borrow-rule checking from compile time to runtime; `RefCell<T>` is the standard example. (5.5)\n\n**iterator** — any type implementing the `Iterator` trait (i.e. providing a `next()` method); iterators are lazy and do nothing until consumed by something like `.collect()` or a `for` loop. (4.7)\n\n**lifetime** — the scope for which a reference remains valid; usually inferred, but sometimes must be written explicitly (`'a`) so the compiler can verify a function's inputs and outputs are related correctly. (4.9–4.10)\n\n**macro** — code that generates other code at compile time, invoked with a `!` (`println!`, `vec!`, `#[derive(...)]`). This book used macros extensively without covering how to write one. (1.1, 9.3)\n\n**match** — Rust's primary control-flow construct for pattern matching, required to be exhaustive (cover every possible case). (3.1)\n\n**module** — a named grouping of code (`mod`) controlling privacy boundaries; everything is private by default unless marked `pub`. (4.1)\n\n**monomorphization** — the compiler generating a separate, fully concrete copy of a generic function for each distinct type it's actually called with, at compile time — the mechanism behind Rust's zero-cost generics. (7.12)\n\n**move** — transferring ownership of a value from one binding to another; the original binding becomes invalid and cannot be used afterward, unless the type implements `Copy`. (2.3)\n\n**mutex** — Mutual Exclusion; a lock ensuring only one thread accesses some data at a time. Rust's `Mutex<T>` wraps the data itself, making the lock impossible to forget. (5.10)\n\n**option\\<T\\>** — an enum representing a value that may or may not be present (`Some(T)` or `None`), replacing null references entirely. (2.9)\n\n**ownership** — Rust's core memory-management rule: every value has exactly one owner at a time, and the value is dropped automatically when its owner goes out of scope. (2.3)\n\n**panic** — an unrecoverable error that (by default) unwinds the stack, running `Drop` for every value along the way, and terminates the program with exit code 101. (3.4)\n\n**pattern matching** — destructuring a value's shape (an enum variant, a struct's fields, a tuple) directly in a binding position, most visibly in `match` but also in `if let`, `while let`, and function parameters. (3.1, 3.3)\n\n**PartialEq** — a trait providing `==`/`!=`; \"partial\" because not every type has a total equality (e.g. `NaN != NaN` for floats). (7.1)\n\n**Rc\\<T\\>** — Reference Counted; a smart pointer allowing multiple owners of the same heap data within a single thread, tracking how many owners currently exist. (5.4)\n\n**RefCell\\<T\\>** — a type providing interior mutability with borrow rules checked at runtime instead of compile time, panicking if they're violated. (5.5)\n\n**reference** — a value that borrows access to data without owning it, written `&T` (shared) or `&mut T` (mutable), and guaranteed by the borrow checker to never outlive what it points to. (2.4)\n\n**Result\\<T, E\\>** — an enum representing either success (`Ok(T)`) or failure (`Err(E)`), Rust's standard mechanism for recoverable errors. (3.5)\n\n**Send** — a marker trait meaning a type is safe to move to another thread. (5.11)\n\n**shadowing** — declaring a new binding with `let` that reuses an existing name, hiding the previous binding rather than mutating it (and permitted to change its type). (1.4)\n\n**slice** — a view into a contiguous sequence (a string or array) without owning it, written `&[T]` or `&str`. (2.5)\n\n**smart pointer** — a struct behaving like a pointer but with extra capabilities (ownership tracking, reference counting, runtime-checked borrowing) — `Box`, `Rc`, `RefCell`, and others. (5.1–5.6)\n\n**struct** — a custom type grouping related named fields together. (2.7)\n\n**Sync** — a marker trait meaning a type is safe to share (via `&T`) across multiple threads simultaneously. (5.11)\n\n**trait** — a definition of shared behavior — a set of methods a type can implement — roughly analogous to an interface in other languages. (4.4)\n\n**trait bound** — a constraint on a generic parameter requiring it to implement a specific trait (`<T: Display>`), giving the compiler enough information to call that trait's methods on it. (4.5)\n\n**trait object** — a value of type `dyn Trait`, referenced through a pointer (`&dyn Trait` or `Box<dyn Trait>`), enabling a single collection to hold genuinely different concrete types uniformly. (5.7)\n\n**unsafe** — a keyword marking code where the compiler trusts the programmer to uphold guarantees it can no longer verify automatically (raw pointer dereferencing, calling foreign functions, and a few others) — it does not disable the borrow checker generally, only these specific operations. (7.9)\n\n**Vec\\<T\\>** — a growable, heap-allocated list of values of a single type. (2.10)\n\n**workspace** — a Cargo feature grouping multiple related packages so they share one `Cargo.lock` and one `target/` directory. (6.2)\n\n**`?` operator** — shorthand that, on an `Err`/`None`, returns early from the current function (converting the error via `From` if needed); on `Ok`/`Some`, unwraps and continues. (3.6)"}]

  <!-- Application Logic -->
  <script>
  (function(){
    var rawJson = document.getElementById('book-data').textContent;
    var chapters;
    try {
      chapters = JSON.parse(rawJson);
    } catch(err) {
      console.error('Failed to parse book data JSON:', err);
      document.getElementById('chapter-pane').innerHTML = '<div style="padding:2rem;color:red;"><h3>Error Loading Book Data</h3><p>' + err.message + '</p></div>';
      return;
    }

    var chapterMap = {};
    chapters.forEach(function(c, i){ c.index = i; chapterMap[c.id] = c; });

    var STORAGE_KEY_THEME = 'python_book_theme';
    var STORAGE_KEY_FONT = 'rust_book_fontsize';
    var STORAGE_KEY_LAST = 'rust_book_last_chapter';
    var STORAGE_KEY_CODE = 'rust_book_code_style';
    var STORAGE_KEY_CODE_CARD = 'rust_book_code_card';
    var STORAGE_KEY_COMPLETED = 'lga_completed_chapters';

    var currentChapterId = null;

    // Theme handling (Light / Dark)
    var currentTheme = 'light';
    try {
      var pTheme = new URLSearchParams(window.location.search).get('theme');
      currentTheme = (pTheme === 'dark' || pTheme === 'light') ? pTheme : (localStorage.getItem(STORAGE_KEY_THEME) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    }catch(e){}
    function applyTheme(theme){
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem(STORAGE_KEY_THEME, theme); }catch(e){}
      document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setTheme === theme);
      });
    }
    applyTheme(currentTheme);

    document.querySelectorAll('.theme-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyTheme(btn.dataset.setTheme);
      });
    });

    // Code block card handling (GitHub Light [Default] / Obsidian)
    var currentCodeCard = 'light';
    try { currentCodeCard = localStorage.getItem(STORAGE_KEY_CODE_CARD) || 'light'; }catch(e){}
    function applyCodeCard(card){
      currentCodeCard = card;
      document.documentElement.setAttribute('data-code-card', card);
      try { localStorage.setItem(STORAGE_KEY_CODE_CARD, card); }catch(e){}
      document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCodeCard === card);
      });
    }
    applyCodeCard(currentCodeCard);

    document.querySelectorAll('.code-card-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeCard(btn.dataset.setCodeCard);
      });
    });

    // Code style handling (Indigo / Ruby / Sapphire / Minimal)
    var currentCodeStyle = 'indigo';
    try { currentCodeStyle = localStorage.getItem(STORAGE_KEY_CODE) || 'indigo'; }catch(e){}
    function applyCodeStyle(style){
      currentCodeStyle = style;
      document.documentElement.setAttribute('data-code-style', style);
      try { localStorage.setItem(STORAGE_KEY_CODE, style); }catch(e){}
      document.querySelectorAll('.code-opt-btn').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.setCode === style);
      });
    }
    applyCodeStyle(currentCodeStyle);

    document.querySelectorAll('.code-opt-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        applyCodeStyle(btn.dataset.setCode);
      });
    });

    // Font size scaling (Default: 20px)
    var DEFAULT_FONT_SIZE = 20;
    var currentFontSize = DEFAULT_FONT_SIZE;
    try {
      var savedFont = localStorage.getItem(STORAGE_KEY_FONT);
      if (savedFont) {
        currentFontSize = parseFloat(savedFont);
        if (currentFontSize === 16.5) currentFontSize = DEFAULT_FONT_SIZE;
      }
    } catch(e){}
    function applyFontSize(size){
      currentFontSize = Math.max(14, Math.min(28, Math.round(size * 10) / 10));
      document.documentElement.style.setProperty('--base-font-size', currentFontSize + 'px');
      try { localStorage.setItem(STORAGE_KEY_FONT, currentFontSize); }catch(e){}
      var fontResetBtn = document.getElementById('font-reset');
      if (fontResetBtn) fontResetBtn.textContent = Math.round(currentFontSize) + 'px';
    }
    applyFontSize(currentFontSize);
    document.getElementById('font-inc').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize + 1.5);
    });
    document.getElementById('font-dec').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(currentFontSize - 1.5);
    });
    document.getElementById('font-reset').addEventListener('click', function(e){
      e.stopPropagation();
      applyFontSize(DEFAULT_FONT_SIZE);
    });

    // Reset All to Defaults (Theme, Code card, Code style, Font size, and Reading progress)
    var resetAllBtn = document.getElementById('reset-all-btn');
    if (resetAllBtn) {
      resetAllBtn.addEventListener('click', function(e){
        e.stopPropagation();

        try {
          localStorage.removeItem(STORAGE_KEY_THEME);
          localStorage.removeItem(STORAGE_KEY_FONT);
          localStorage.removeItem(STORAGE_KEY_LAST);
          localStorage.removeItem(STORAGE_KEY_CODE);
          localStorage.removeItem(STORAGE_KEY_CODE_CARD);
          localStorage.removeItem(STORAGE_KEY_COMPLETED);
        } catch(err){}

        applyTheme('light');
        applyCodeCard('light');
        applyCodeStyle('indigo');
        applyFontSize(DEFAULT_FONT_SIZE);
        updateCompletionUI();

        if (location.hash !== '#0.1') {
          location.hash = '#0.1';
        } else {
          renderChapter('0.1');
        }

        var origHtml = resetAllBtn.innerHTML;
        resetAllBtn.classList.add('success');
        resetAllBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Reset to Defaults!</span>';

        setTimeout(function(){
          resetAllBtn.classList.remove('success');
          resetAllBtn.innerHTML = origHtml;
        }, 1800);
      });
    }

    // Settings popover
    var settingsBtn = document.getElementById('settings-btn');
    var settingsPopover = document.getElementById('settings-popover');

    function toggleSettings(open){
      var willOpen = (typeof open === 'boolean') ? open : !settingsPopover.classList.contains('open');
      settingsPopover.classList.toggle('open', willOpen);
      settingsBtn.classList.toggle('active', willOpen);
      settingsBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    }

    settingsBtn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleSettings();
    });

    settingsPopover.addEventListener('click', function(e){
      e.stopPropagation();
    });

    function handleOutsideSettingsClick(e){
      if(settingsPopover.classList.contains('open') && !settingsPopover.contains(e.target) && !settingsBtn.contains(e.target)){
        toggleSettings(false);
      }
    }
    document.addEventListener('click', handleOutsideSettingsClick);
    document.addEventListener('touchend', handleOutsideSettingsClick, { passive: true });

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Reading Progress & Completion Memory
    function getCompletedChapters(){
      try {
        var raw = localStorage.getItem(STORAGE_KEY_COMPLETED);
        if(raw){
          var arr = JSON.parse(raw);
          if(Array.isArray(arr)) return arr;
        }
      }catch(e){}
      return [];
    }
    function isChapterCompleted(id){
      return getCompletedChapters().indexOf(id) !== -1;
    }
    function markChapterCompleted(id, completed){
      try {
        var list = getCompletedChapters();
        var idx = list.indexOf(id);
        if(completed && idx === -1){
          list.push(id);
        } else if(!completed && idx !== -1){
          list.splice(idx, 1);
        }
        localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(list));
        updateCompletionUI();
      }catch(e){}
    }
    function toggleChapterCompleted(id){
      markChapterCompleted(id, !isChapterCompleted(id));

    function updateCompletionUI(){
      var completedList = getCompletedChapters();
      var completedSet = {};
      completedList.forEach(function(id){ completedSet[id] = true; });

      document.querySelectorAll('.chapter-item').forEach(function(item){
        var id = item.dataset.chapId;
        var isDone = !!completedSet[id];
        item.classList.toggle('completed', isDone);
        var check = item.querySelector('.chapter-check');
        if(check){
          check.setAttribute('title', isDone ? 'Completed (click to mark unread)' : 'Click to mark as completed');
          check.setAttribute('aria-label', (isDone ? 'Completed: ' : 'Uncompleted: ') + id);
        }
      });

      parts.forEach(function(p){
        var partBadge = document.querySelector('.part-count-badge[data-part-badge="' + p.partNum + '"]');
        if(partBadge){
          var doneCount = p.chapters.filter(function(c){ return !!completedSet[c.id]; }).length;
          var total = p.chapters.length;
          if(doneCount === total && total > 0){
            partBadge.textContent = '✓ ' + total;
            partBadge.classList.add('all-done');
            partBadge.title = 'All ' + total + ' chapters completed';
          } else if(doneCount > 0){
            partBadge.textContent = doneCount + '/' + total;
            partBadge.classList.remove('all-done');
            partBadge.title = doneCount + ' of ' + total + ' chapters completed';
          } else {
            partBadge.textContent = total;
            partBadge.classList.remove('all-done');
            partBadge.title = total + ' chapters';
          }
        }
      });

      var progressBadge = document.getElementById('toc-progress-badge');
      if(progressBadge){
        var totalDone = completedList.length;
        progressBadge.textContent = totalDone + ' / ' + chapters.length;
        if(totalDone === chapters.length && chapters.length > 0){
          progressBadge.textContent = chapters.length + ' / ' + chapters.length + ' ✓';
        }

      var chapCompleteBtn = document.getElementById('chap-complete-btn');
      if(chapCompleteBtn && currentChapterId){
        var isDone = !!completedSet[currentChapterId];
        chapCompleteBtn.classList.toggle('completed', isDone);
        chapCompleteBtn.textContent = isDone ? '✓ Completed' : 'Mark as read';
        chapCompleteBtn.title = isDone ? 'Mark chapter as unread' : 'Mark chapter as completed';

    function groupSubsections(container){
      var kids = Array.prototype.slice.call(container.children);
      var i = 0;
      while(i < kids.length){
        var el = kids[i];
        if(el.tagName === 'H3'){
          var wrapper = document.createElement('div');
          var text = el.textContent.toLowerCase();
          var cls = 'subsection';
          if(text.indexOf('mistake') !== -1) cls += ' subsection--mistakes';
          else if(text.indexOf('recap') !== -1) cls += ' subsection--recap';
          else if(text.indexOf('matters') !== -1) cls += ' subsection--matters';
          wrapper.className = cls;
          container.insertBefore(wrapper, el);
          wrapper.appendChild(el);
          var j = i + 1;
          while(j < kids.length && kids[j].tagName !== 'H3' && kids[j].tagName !== 'H2'){
            wrapper.appendChild(kids[j]);
            j++;
          }
          i = j;
        } else {
          i++;
        }
      }
    }

    function escapeRegex(str) {

    function highlightText(text, terms) {
      var escaped = escapeHtml(text);
      if (!terms || terms.length === 0) return escaped;

      var validTerms = [];
      terms.forEach(function(t){
        var clean = t.trim();
        if (clean.length > 0 && validTerms.indexOf(clean) === -1) {
          validTerms.push(clean);
        }
      });
      if (validTerms.length === 0) return escaped;

      validTerms.sort(function(a, b){ return b.length - a.length; });
      var pattern = validTerms.map(function(t){ return escapeRegex(escapeHtml(t)); }).join('|');
      var re = new RegExp('(' + pattern + ')', 'gi');
      return escaped.replace(re, '<mark class="search-highlight">$1</mark>');
    }

    function performSearch(query) {
      var q = (query || '').trim();
      if (!q) {
        renderDefaultSuggestions();
        return;
      }

      searchClearBtn.classList.add('visible');

      var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      if (terms.length === 0) {
        renderDefaultSuggestions();
        return;
      }

      var hits = [];
      for (var i = 0; i < searchCorpus.length; i++) {
        var doc = searchCorpus[i];
        var titleLower = (doc.title || '').toLowerCase();
        var fullTitleLower = (doc.fullTitle || '').toLowerCase();
        var partLower = ((doc.partTitle || '') + ' ' + (doc.partMetaphor || '')).toLowerCase();
        var textLower = (doc.cleanText || '').toLowerCase();

        var score = 0;
        var allMatched = true;

        for (var t = 0; t < terms.length; t++) {
          var term = terms[t];
          var inTitle = titleLower.indexOf(term) !== -1;
          var inFullTitle = fullTitleLower.indexOf(term) !== -1;
          var inPart = partLower.indexOf(term) !== -1;
          var inText = textLower.indexOf(term) !== -1;

          if (!inTitle && !inFullTitle && !inPart && !inText) {
            allMatched = false;
            break;
          }

          if (inTitle) score += 120;
          if (inFullTitle) score += 90;
          if (inPart) score += 40;
          if (inText) {
            var count = 0;
            var pos = 0;
            while ((pos = textLower.indexOf(term, pos)) !== -1 && count < 6) {
              score += 15;
              pos += term.length;
              count++;
            }
          }
        }

        if (!allMatched) continue;

        var snippet = '';
        var firstPos = -1;
        for (var k = 0; k < terms.length; k++) {
          var p = textLower.indexOf(terms[k]);
          if (p !== -1 && (firstPos === -1 || p < firstPos)) {
            firstPos = p;
          }
        }

        if (firstPos !== -1) {
          var start = Math.max(0, firstPos - 45);
          var end = Math.min(doc.cleanText.length, firstPos + 105);
          snippet = (start > 0 ? '… ' : '') + doc.cleanText.substring(start, end).trim() + (end < doc.cleanText.length ? ' …' : '');
        } else {
          snippet = doc.cleanText.substring(0, 110).trim() + '…';
        }

        hits.push({
          id: doc.id,
          title: doc.title,
          partNum: doc.partNum,
          partTitle: doc.partTitle,
          partMetaphor: doc.partMetaphor,
          snippet: snippet,
          score: score
        });
      }

      hits.sort(function(a, b){ return b.score - a.score; });
      renderSearchResults(hits, terms, q);
    }

    function renderSearchResults(hits, terms, query) {
      selectedSearchIndex = -1;
      currentResultItems = [];

      if (hits.length === 0) {
        searchCount.textContent = '0 results';
        searchResults.innerHTML = 
          '<div class="search-empty">' +
            '<div class="search-empty-icon">🧐</div>' +
            '<div class="search-empty-title">No matching chapters</div>' +
            '<div class="search-empty-desc">No chapters contained all terms for "' + escapeHtml(query) + '". Try simpler keywords like <code>variables</code>, <code>pipe</code>, or <code>xargs</code>.</div>' +
          '</div>';
        return;
      }

      searchCount.textContent = hits.length + ' result' + (hits.length === 1 ? '' : 's');

      var html = '';
      hits.forEach(function(item, idx){
        var highlightedTitle = highlightText(item.title, terms);
        var highlightedSnippet = highlightText(item.snippet, terms);

        html += 
          '<a class="search-result-item" data-chap-id="' + item.id + '" data-search-index="' + idx + '" href="#' + item.id + '">' +
            '<div class="search-result-top">' +
              '<span class="search-part-badge">Part ' + item.partNum + '</span>' +
              '<span class="search-item-id">' + item.id + '</span>' +
              '<span class="search-item-title">' + highlightedTitle + '</span>' +
            '</div>' +
            '<div class="search-snippet">' + highlightedSnippet + '</div>' +
          '</a>';
      });

      searchResults.innerHTML = html;
      currentResultItems = Array.prototype.slice.call(searchResults.querySelectorAll('.search-result-item'));

      currentResultItems.forEach(function(el, idx){
        el.addEventListener('click', function(e){
          e.preventDefault();
          var cid = el.getAttribute('data-chap-id');
          navigateToChapter(cid);
        });
        el.addEventListener('mouseenter', function(){
          setSelectedIndex(idx, false);
        });
      });

      if (currentResultItems.length > 0) {
        setSelectedIndex(0, false);
      }
    }

    function setSelectedIndex(idx, scrollIntoView) {
      if (currentResultItems.length === 0) return;
      if (idx < 0) idx = 0;
      if (idx >= currentResultItems.length) idx = currentResultItems.length - 1;

      currentResultItems.forEach(function(item, i){
        item.classList.toggle('selected', i === idx);
      });
      selectedSearchIndex = idx;

      if (scrollIntoView && currentResultItems[idx]) {
        currentResultItems[idx].scrollIntoView({ block: 'nearest' });
      }
    }

    function navigateToChapter(cid) {
      closeSearch();
      location.hash = '#' + cid;
    }

    function openSearch() {
      searchModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (!searchInput.value.trim()) {
        renderDefaultSuggestions();
      }
      setTimeout(function(){
        searchInput.focus();
        searchInput.select();
      }, 50);
    }

    function closeSearch() {
      searchModal.classList.remove('open');
      document.body.style.overflow = '';
    }

    if (searchBtn) searchBtn.addEventListener('click', openSearch);
    if (searchBackdrop) searchBackdrop.addEventListener('click', closeSearch);
    if (searchCloseBtn) searchCloseBtn.addEventListener('click', closeSearch);

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', function(){
        searchInput.value = '';
        searchInput.focus();
        renderDefaultSuggestions();
      });
    }

    if (searchInput) {
      searchInput.addEventListener('input', function(){
        performSearch(searchInput.value);
      });

      searchInput.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex + 1, true);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIndex(selectedSearchIndex - 1, true);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (selectedSearchIndex >= 0 && currentResultItems[selectedSearchIndex]) {
            var cid = currentResultItems[selectedSearchIndex].getAttribute('data-chap-id');
            navigateToChapter(cid);
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeSearch();
        }
      });
    }

    // Global keyboard navigation
    document.addEventListener('keydown', function(e){
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === '/' && !searchModal.classList.contains('open')) {
        if (document.activeElement && (
          document.activeElement.tagName === 'INPUT' ||
          document.activeElement.tagName === 'TEXTAREA' ||
          document.activeElement.isContentEditable
        )) {
          return;
        }
        e.preventDefault();
        openSearch();
        return;
      }

      if (e.key === 'Escape' && searchModal.classList.contains('open')) {
        e.preventDefault();
        closeSearch();
        return;
      }

      if (searchModal.classList.contains('open')) return;

      if(document.activeElement && (
        document.activeElement.tagName === 'INPUT' ||
        document.activeElement.tagName === 'TEXTAREA' ||
        document.activeElement.isContentEditable
      )) return;

      var currentChap = chapterMap[currentChapterId];
      if(!currentChap) return;

      if(e.key === 'ArrowRight' || (!e.ctrlKey && !e.metaKey && e.key === 'k')){
        if(chapters[currentChap.index + 1]) location.hash = '#' + chapters[currentChap.index + 1].id;
      } else if(e.key === 'ArrowLeft' || e.key === 'j'){
        if(chapters[currentChap.index - 1]) location.hash = '#' + chapters[currentChap.index - 1].id;
      } else if(e.key === 't'){
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      } else if(e.key === 'Escape'){
        closeDrawer();
        toggleSettings(false);
      }
    });

  })();
  </script>
</body>
</html>
